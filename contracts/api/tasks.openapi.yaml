    ClearDeclinesRequest:
      type: object
      description: >
        The contact whose changed identity key the caller just accepted. It names a *person*, never a job: the
        human decision was about an identity, and the jobs it unblocks are whichever ones happen to target that
        identity — the caller has no reason to know their ids, and asking for them would make the client
        enumerate its own past refusals.
      required: [targetUserId]
      properties:
        targetUserId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The contact whose new identity key the caller accepted (opaque user id).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'

    DeclinesCleared:
