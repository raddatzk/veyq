          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64)'
        sealedBody:
          type: [string, "null"]
          description: The sealed task body under a `K_SC`-derived key, context `job` — opaque base64, stored verbatim.
          contentEncoding: base64
          maxLength: 65536
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    CompleteRequest:
      type: object
      properties:
        sealedResult:
          type: [string, "null"]
          description: >
            An optional opaque job result (base64). For a `grant-delivery` job this **is** the `wrappedGrant`
            (the scope key sealed to the target's identity public key) the backend writes onto the target
            membership.
          contentEncoding: base64
          maxLength: 65536
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        epoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            For a `grant-delivery` job (required there): the epoch whose key `sealedResult` carries — the grant is
            sealed bound to it (ADR 0072). Must be the scope's current epoch (`409 stale_epoch` otherwise).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        grantSignature:
          type: [string, "null"]
          description: >
            For a `grant-delivery` job (required there, `400` otherwise): the worker's signature over the grant it posts, stored on the target membership with the worker as its granter. The granter's Ed25519 **identity** signature over `encode(grant: scopeId, scopeKind, epoch,
            recipientUserId, sha256(recipientIdentityPublicKey), sha256(wrappedGrant))`
            ([ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) Decision 6). Opaque base64
            the server stores and relays and never verifies; the recipient checks it before the key inside is used.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    FailRequest:
      type: object
      properties:
        reason:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Optional developer-facing failure reason; never content or secrets.
          maxLength: 256
          example: unwrap_failed
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256)'

    DeclineRequest:
      type: object
      properties:
        reason:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            Optional developer-facing decline reason; never content or secrets. For the TOFU seam this is
            typically `identity_changed`; a target whose admission tag does not verify under the worker's current
            epoch key is declined `admission_unverified` (ADR 0020 move 6) — lifted when a rotation re-tags that
            admission.
          maxLength: 256
          example: identity_changed
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256)'

    JobCreated:
      type: object
      required: [jobId]
      properties:
        jobId:
          x-veyq-visibility: id
