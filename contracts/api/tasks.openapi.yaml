openapi: 3.1.0
info:
  title: veyq Background Tasks API
  version: 0.1.0
  description: >
    The **operator-blind background-task mechanism** ([ADR 0021](../../docs/decisions/0021-operator-blind-background-tasks.md),
    [docs/crosscutting/background-tasks.md](../../docs/crosscutting/background-tasks.md)): a **pull-based** job
    mechanism inside the veyq backend (no broker). The server is a **blind coordinator** — it stores opaque,
    scope-bound **job envelopes** and relays sealed results; it never holds a scope key, never unseals a body,
    never picks a content-semantic type. An **equal, self-selecting pool of keyed workers** (any interactive
    client *or* the later agent) pulls the jobs it is *eligible* for (`scope ∈ my memberships`) and *capable*
    of (`tag ∈ my capability tags`), executes on-device, and completes idempotently under an at-least-once
    lease (crash → lazy reclaim; poison → dead-letter).

    **Envelope split.** Cleartext (server-visible — already-known routing + bookkeeping): `jobId`, `scopeId`,
    `capabilityTag` (an **opaque** token from the public registry in `contracts/tasks/tags/`, not a plaintext
    label), `resourceRef`, `status`, `leaseExpiresAt`, `attempts`. **Sealed body** (under a `K_SC`-derived key,
    context `job`): the task type + parameters — only a scope-key-holding worker unseals it. The residual leak
    is **correlation-bounded, not label-bounded** (ADR 0021; self-hosted moot) — documented, not hidden.

    **First consumer — `grant-delivery` (ADR 0020).** A grant-less TENANT/GROUP membership is a *pending*
    member; the backend originates a `grant-delivery` job for it (server-structural origination — a blind,
    already-understood job, no sealed body). Any online key-holder claims it, wraps `K_SC` to the pending
    member's identity public key (`sealTo` that X-Wing key, purpose `scope-grant` — the first wrap to a
    **foreign** identity), and completes by posting the ciphertext grant; the backend writes it onto the target
    membership **idempotently** (no-op if a grant already exists — first-online-wins). The claim resolves the
    delivery target (the member's userId + identity public key, operational metadata the server already holds)
    so the worker need not look it up separately.

    **Second consumer — `scope-rotation` (cr-0092, ADR 0025).** A tenant-member removal that cuts a co-shared
    GROUP membership needs the group rotated forward for forward secrecy, but the removing owner is not
    necessarily a key-holder there and so cannot mint the new epoch. The backend originates a `scope-rotation`
    job (its `scopeId` **is** the group to rotate; no sealed body, no key) and the next online **owner** of the
    scope claims it — the job is offered to owners only, the only members who may commit a rotation — mints
    `E_{n+1}` + re-grants the surviving members on-device via the rotation-commit
    (`POST /api/scopes/{scopeId}/epochs`, cr-0089), then completes — closing the job with no `sealedResult`
    (the rotation is already committed). The claimed job carries only the cleartext envelope (no `grantDelivery`
    target); the worker reads the member directory + epoch links it already has endpoints for, **after** its
    claim. First-online-wins. An event **joins** a job only while it is `pending`, so many removals before anyone
    is online still cost one rotation; an event that arrives once a job is claimed gets a job of its own, because
    the claimed job's worker may already have read the directory the event changed. A job completes only once its
    lease holder has committed an epoch of the scope while holding the lease (`409 rotation_not_committed`
    otherwise).

    `scope-rotation` has a **second originator**: an account rotating its keys after a compromise
    (`POST /api/account/rotation`, ADR 0060) queues one per shared scope. The job is identical; what differs is
    that the originator is also a member, and must **not** complete their own — a rotator who re-granted
    themselves would let an attacker holding the old identity re-admit only themselves. The exclusion rides on
    the same per-key-holder decline mechanism the TOFU seam uses, written at origination on **every** live
    rotation job of the scope.

    Every operation requires an authenticated caller; authorization is enforced by code, not this spec
    (ADR 0008). Working a job is a **write on its space** (uc.spaces.scope-access A5): nothing is claimed,
    heartbeated, completed, failed, declined or enqueued in a suspended tenant or a space being deleted — such
    jobs wait for the reactivation or the restore, or are erased with the purge — and only the member holding a
    job's current lease acts on it (ADR 0021 §6). Field validation is declared here via `x-field-extra-annotation`, so malformed input
    is rejected at the boundary (400) before any handler runs.
tags:
  - name: tasks
    description: >
      The background-task pull queue (claim / heartbeat / complete / fail / enqueue). One tag = one resource
      interface owning the whole `/api/tasks` subtree.

paths:
  /api/tasks/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Atomically lease one claimable job for this worker.
      description: >
        The worker sends its **capability tags**; the server atomically leases and returns **one** job where
        `scope ∈ the caller's granted scopes they may write ∧ tag ∈ the sent tags`, treating a `pending` job — or a
        `leased` job whose lease has expired (lazy reclaim) — as claimable (MariaDB `SKIP LOCKED`). A scope in a
        suspended tenant, or one being deleted, is simply not eligible, so its jobs are never handed out
        (uc.spaces.scope-access A5). Eligibility is **per tag**: a `scope-rotation` job is offered only on a scope
        the caller also **owns**, so a request naming several tags gets a rotation job only there (ADR 0021 §4).
        Returns `204` when nothing is claimable. For a `grant-delivery` job the response also resolves the delivery target (the
        pending member's userId + identity public key) so the worker can wrap `K_SC` to it directly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimRequest" }
            example:
              capabilityTags: ["02f271ff"]
      responses:
        "200":
          description: One job was leased to this worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimedJob" }
        "204":
          description: No job is claimable for this worker's scopes + capability tags.
        "400":
          description: The request was malformed (missing/invalid capability tags).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/tasks/enqueue:
    post:
      tags: [tasks]
      operationId: enqueueTask
      summary: Enqueue a client-originated job onto a scope the caller belongs to.
      description: >
        Creates a `pending` job in `scopeId` (the caller must be a member). The body (`type` + params) is
        **sealed client-side** under a `K_SC`-derived key (context `job`) and handed over as opaque
        `sealedBody`; the server stores it verbatim and never unseals it. Server-originated jobs — every tag the
        registry (`contracts/tasks/tags/v1.json`) marks `server-structural` or `server-event`, today
        `grant-delivery` and `scope-rotation` — are **not** created here (`400 invalid_request`, nothing written);
        the backend originates those itself, and this is the front door for content-processing jobs a client/agent
        prepares ready. Membership is the **first** gate (ADR
        0042): a caller who is not a member of `scopeId` gets `404 scope_not_found` — the same answer as for a
        scope id that does not exist, so scope existence is not enumerable. Then the tenant's suspension
        (`403 tenant_suspended`) and the space's deletion grace (`409 scope_deleting`, uc.spaces.scope-access).
        A member who holds no grant in the scope (not a key-holder, so they could not have sealed the body) gets
        `403 not_key_holder`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnqueueRequest" }
            example:
              scopeId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
              capabilityTag: "02f271ff"
              resourceRef: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              sealedBody: AQ==
      responses:
        "201":
          description: The job was enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobCreated" }
              example:
                jobId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            The caller is a member of the target scope but holds no grant in it (`not_key_holder`), or its tenant
            is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_key_holder }
        "404":
          description: >
            No such scope — or the caller is not a member of it (deliberately indistinguishable, ADR 0042).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: scope_not_found }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/tasks/{jobId}/heartbeat:
    post:
      tags: [tasks]
      operationId: heartbeatTask
      summary: Extend the lease on a job this worker holds.
      description: >
        A long-running worker calls this to push the job's `leaseExpiresAt` forward while it works, so the job
        is not lazily reclaimed mid-flight. Only the current lease holder may extend; a job that is not leased
        to the caller (or already terminal) is a `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The lease was extended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaseState" }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such job (or not in a scope the caller belongs to).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: job_not_found }
        "409":
          description: >
            The job is not currently leased to this worker (`not_lease_holder`), or its space is being deleted
            (`scope_deleting`, uc.spaces.scope-access A5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_lease_holder }

  /api/tasks/{jobId}/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Mark a job done, optionally posting a sealed result.
      description: >
        Marks the job `done`. Most results are a normal sealed veyq write via an existing path; a job-specific
        output rides the optional opaque `sealedResult`. For a `grant-delivery` job the `sealedResult` **is**
        the `wrappedGrant` — the scope key sealed to the pending member's identity public key — and `epoch` states
        which epoch's key it is: the grant is sealed bound to (scope, that epoch) ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md)), so the backend
        records exactly that epoch on the target membership. A stated epoch that is not the scope's **current**
        one (a rotation landed between claim and completion, or the worker holds an older grant) is refused
        `409 stale_epoch` with nothing written; the lease is released without spending an attempt, so the job
        re-runs at the current epoch. **Idempotent**: completing an already-`done` job, or a
        `grant-delivery` job whose target already holds a grant, is a success no-op (first-online-wins). Otherwise
        the caller must hold the job's current lease (`409 not_lease_holder`, ADR 0021 §6): idempotency makes a
        *repeated* completion harmless, it does not make an unclaimed one legitimate. The completion lands only for
        the worker that holds the lease **at the moment it lands** — a worker whose expired lease another worker
        reclaimed meanwhile writes nothing, the grant included, and gets `not_lease_holder`. A `scope-rotation` job
        completes only once its lease holder has committed an epoch of the scope while holding the lease;
        otherwise `409 rotation_not_committed`, nothing written and the lease kept.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteRequest" }
            example:
              sealedResult: AQ==
      responses:
        "204":
          description: The job is done (or was already done — idempotent no-op).
        "400":
          description: The request was malformed (e.g. a grant-delivery completion with no wrap, no `epoch` or no `grantSignature`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such job (or not in a scope the caller belongs to).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: job_not_found }
        "409":
          description: >
            The job is not currently leased to this worker (`not_lease_holder`), its space is being deleted
            (`scope_deleting`, uc.spaces.scope-access A5), a grant-delivery completion states an epoch that is
            not the scope's current one (`stale_epoch` — nothing written, the lease released, the job re-runs), or
            the holder of a `scope-rotation` job committed no epoch during its lease (`rotation_not_committed` —
            nothing written, the lease kept).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_lease_holder }

  /api/tasks/{jobId}/fail:
    post:
      tags: [tasks]
      operationId: failTask
      summary: Report a failed attempt; requeue or dead-letter.
      description: >
        Records a failed attempt and releases the lease. The attempt was already counted by the claim that leased
        the job, so `attempts` is not incremented again here. If `attempts` is below the job's max the job returns
        to `pending` (claimable again, at-least-once); once it reaches the max the job is **dead-lettered**
        (`failed`, surfaced for inspection). The caller must hold the job's current lease, and the job must still
        be `leased` (`409 not_lease_holder`, ADR 0021 §6).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FailRequest" }
            example:
              reason: unwrap_failed
      responses:
        "200":
          description: The failed attempt was recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
              example:
                status: pending
                attempts: 1
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such job (or not in a scope the caller belongs to).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: job_not_found }
        "409":
          description: >
            The job is not currently leased to this worker (`not_lease_holder`), or its space is being deleted
            (`scope_deleting`, uc.spaces.scope-access A5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_lease_holder }

  /api/tasks/{jobId}/decline:
    post:
      tags: [tasks]
      operationId: declineTask
      summary: Decline a claimed job back to the queue (do not re-offer it to this worker).
      description: >
        A worker **voluntarily refuses** a claimed job and releases it **without a failed attempt**: the lease
        is dropped, the job returns to `pending` (claimable again by **other** workers), and a `(job, worker)`
        decline is recorded so the reconciler **does not re-offer this job to this same worker**. This is the
        grant-delivery TOFU seam (ADR 0028 / en.account.identity-pinning): a worker that holds a **different**
        pin for the target's identity key blocks the wrap and declines the job + raises a human-review flag,
        rather than sealing `K_SC` to a possibly-substituted key. **Per key-holder, not a global veto** — a
        *different* key-holder without a conflicting pin can still TOFU-deliver (ADR 0028 §Consequences), while
        the declining worker's own other devices stay excluded, because the exclusion is keyed on the account
        that declined, not on the browser it declined from. Unlike `fail`, `attempts` is **not** incremented (a
        legitimate decline must not dead-letter the job). The caller must hold the job's lease.

        A decline is otherwise **permanent** — nothing expires it — which is correct for an unresolved key
        conflict and wrong once a human resolves it. `POST /api/tasks/declines/clear` is that resolution
        (ADR 0060 Decision 7).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineRequest" }
            example:
              reason: identity_changed
      responses:
        "200":
          description: The job was released back to `pending` and will not be re-offered to this worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
              example:
                status: pending
                attempts: 0
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such job (or not in a scope the caller belongs to).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: job_not_found }
        "409":
          description: >
            The caller does not hold the job's lease (`not_lease_holder` — only the lease-holder may decline), or
            its space is being deleted (`scope_deleting`, uc.spaces.scope-access A5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_lease_holder }

  /api/tasks/declines/clear:
    post:
      tags: [tasks]
      operationId: clearDeclinesForAcceptedKey
      summary: Drop my own declines against a contact whose changed identity key I just accepted.
      description: >
        The other half of the TOFU seam above. A worker that declined `identity_changed` is excluded from that
        job **permanently**, so
        [ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) (2)'s promise that on
        accept *"the wrap then proceeds"* did not hold: the accept authorised a wrap that nothing performed.
        Nothing exercised it before, because a changed key could until now only be an attack — key rotation
        after a compromise
        ([ADR 0060](../../docs/decisions/0060-key-rotation-after-compromise.md) Decision 7) is what makes a
        legitimate change routine, and a rotation whose re-admission cannot be delivered strands the account.

        **Deliberately narrow, in three ways that are each load-bearing.** It clears only the **caller's own**
        decline rows — the accept is one human's decision on one client, and a blind server must never
        generalise it to another key-holder who has not looked (ADR 0028 § Consequences). It clears only rows on
        **`grant-delivery`** jobs whose target is `targetUserId` — a decline about a *different* contact is not
        resolved by this accept. And because a `scope-rotation` job has no delivery target at all, this can
        never reach the exclusion that keeps a rotator from claiming their **own** rotation (ADR 0060
        Decision 4) — that invariant is preserved by the shape of the query, not by a special case in it.

        Idempotent, and `cleared: 0` is an ordinary answer: the common case is that this caller never declined
        anything for that contact. The server learns only that one account cleared declines against another —
        the membership and decline facts it already holds. It does **not** learn that a key was accepted, which
        pin moved, or what either key is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearDeclinesRequest" }
            example: { targetUserId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      responses:
        "200":
          description: >
            Applied. Any cleared job is claimable by this worker again; the caller re-drives delivery by
            claiming as usual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclinesCleared" }
              example: { cleared: 1 }
        "400":
          description: The request was malformed (missing or invalid `targetUserId`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller (enforced by code, not this spec).

  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: Opaque id of the job.
      schema:
        type: string
        format: uuid
        example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c

  schemas:
    CapabilityTag:
      x-veyq-visibility: id
      type: string
      description: >
        An **opaque** capability token from the public registry (`contracts/tasks/tags/`). A bare DB dump sees
        the token (e.g. `02f271ff`), not a plaintext semantic label. Lowercase hex.
      maxLength: 64
      pattern: "[0-9a-f]+"
      example: "02f271ff"

    ClaimRequest:
      type: object
      required: [capabilityTags]
      properties:
        capabilityTags:
          type: array
          description: The opaque capability tokens this worker can process. The server matches a job's tag against these.
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/CapabilityTag" }
          example: ["02f271ff"]
          # The generator types the list `List<String>` and cannot annotate its type argument, so the elements' bounds
          # (`CapabilityTag`'s) ride on the list as `EachElement` (inbox #354; `validate_request_bounds.py` holds them).
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotEmpty @field:jakarta.validation.constraints.Size(max = 64) @field:me.raddatz.veyq.core.http.EachElement(maxLength = 64, pattern = "[0-9a-f]+")'
        scopeId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            Optionally narrow the claim to a single scope. A worker that has opened exactly one scope (so it
            holds only that scope's `K_SC`) passes its id, so the server never hands back a job for a different
            scope whose key the worker cannot unseal. Omitted → any of the caller's granted scopes.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c

    ClaimedJob:
      type: object
      required: [jobId, scopeId, capabilityTag, attempts]
      properties:
        jobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the leased job — keys the idempotent completion.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The scope the job belongs to (the caller holds a grant for it, so it can unseal the body).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        capabilityTag:
          $ref: "#/components/schemas/CapabilityTag"
        resourceRef:
          x-veyq-visibility: id
          type: [string, "null"]
          description: The opaque id of the resource the job acts on (for grant-delivery, the target membership id).
          maxLength: 64
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        sealedBody:
          type: [string, "null"]
          description: >
            The sealed task body (`type` + params) under a `K_SC`-derived key, context `job` — opaque base64.
            Absent for server-structural jobs (like `grant-delivery`) whose task is fully described by the
            cleartext envelope + the resolved target.
          contentEncoding: base64
          maxLength: 65536
          example: null
        leaseExpiresAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When this worker's lease expires (heartbeat to extend). Every claim leases, so it is set on every claimed job.
          example: 2026-07-04T12:34:56Z
        attempts:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: How many times this job has been attempted (including the current lease).
          example: 0
        grantDelivery:
          description: >
            Present only for a `grant-delivery` job: the resolved delivery target — operational metadata the
            server already holds (never a key). The worker wraps `K_SC` to `identityPublicKey` and completes.
          oneOf:
            - { $ref: "#/components/schemas/GrantDeliveryTarget" }
            - type: "null"

    GrantDeliveryTarget:
      type: object
      required: [targetUserId, targetMembershipId, identityPublicKey]
      properties:
        targetUserId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The pending member's user id.
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        targetMembershipId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The grant-less membership row the wrap will be posted onto.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        identityPublicKey:
          type: string
          description: >
            The pending member's identity public key (opaque base64) — the worker's `asymWrap` target. The
            server already stores this as operational metadata; exposing it to a granter does not widen the
            operator's view (it never yields a key).
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        admissionId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The client-minted UUIDv4 id of an admission (ADR 0072 Decision 3), bound into its `admissionTag`
            ([ADR 0020](../../docs/decisions/0020-grant-distribution-invite-wrap.md) move 6). Here: the target membership's. The worker recomputes the tag under its **own current** epoch key and declines `admission_unverified` on a mismatch, on an epoch before its current one, or on `null`; on an epoch ahead of its own it pauses instead (its key is behind, not the target).
          example: ad6e8b2c-1f2d-4e4a-8b6c-7c3f0e2a9b1d
        admissionEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            The scope epoch whose key computed `admissionTag`. A worker admits only a tag at its own current epoch, so
            a tag made before a rotation does not admit (ADR 0020 move 6).
          minimum: 0
          example: 0
        admissionTag:
          type: [string, "null"]
          description: >
            `HMAC-SHA256(HKDF(E_admissionEpoch, "veyq/v1/admission-tag"), encode(admission-tag: scopeId, epoch,
            admissionId, userId?))` — only a holder of the scope's epoch key can compute it, so a session without an
            unlocked vault cannot admit anyone (ADR 0020 move 6). Opaque base64 the server stores and relays and never
            verifies (it holds no key); every client verifies it before wrapping a scope key to anyone but itself.
          contentEncoding: base64
          maxLength: 64
          example: 88EIUGAHsCDogfZhvV7MYpQw2hEWWL6ClJP2OcAj6Wg=

    EnqueueRequest:
      type: object
      required: [scopeId, capabilityTag]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The scope the job belongs to. The caller must be a member.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        capabilityTag:
          $ref: "#/components/schemas/CapabilityTag"
