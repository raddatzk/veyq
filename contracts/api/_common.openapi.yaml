# Shared OpenAPI components, referenced across the specs via external $ref (ADR 0038).
#
# Layout (ADR 0079 — the contracts name their owner): the specs directly in contracts/api/ are core's (the platform,
# `blob.openapi.yaml` included — the generic blob upload and download); an application's specs sit in a directory
# of their own (`memories/`). This file is core's. An application spec may $ref it (`../_common.openapi.yaml#…`);
# a core spec never references an application's spec. Every schema defined here is ONE generated type, core's:
# the backend maps each of them into the application's generation (`schemaMappings`, src/backend/buildSrc's `OpenApiGenerate`),
# so a schema two owners share lives here and is aliased by name in each spec that uses it.
#
# This is NOT a generated spec — it has no paths and is never fed to a generator on its own: the backend
# generation sets exclude it and the web generate:api script does not list it. It exists only as a single-source
# $ref target, so a shared component cannot drift across the per-domain specs. openapi-generator (both surfaces)
# resolves the external $ref in place, emitting the same model per module it emitted from the inline copies — a
# pure refactor, no wire change.
#
# The shared `parameters`, `headers` and the `ItemsNotModified` response are the platform's revisioned item list
# (ADR 0033, inbox #410): the conditional-GET and keyset-delta pieces every application's "list the records inside a
# node" operation `$ref`s, so the wire rules (the ETag, the 304, the `since` cursor, the `sinceDelete` gate, the `limit`
# of one page) are written once. The response FIELDS cannot be shared by reference (a primitive schema is no generated
# type, and an application names its own: `mediaRevision`, `mediaIds`, `more`); docs/apps/README.md lists the recipe and
# the names.
#
# The two shared `responses` are the scope-access gate's answers (uc.spaces.scope-access). An operation that
# declares no other 403/409 points at them; one that already has a 403/409 names the code in its own description
# instead, since a status carries only one response object.
openapi: 3.1.0
info:
  title: veyq shared contract components
  version: 1.0.0
paths: {}
components:
  parameters:
    ItemsIfNoneMatch:
      name: If-None-Match
      x-veyq-visibility: structure
      in: header
      required: false
      description: >
        The client's cached revision of the node's item list (the `ETag` of its last `200`, an opaque number). When it
        equals the node's current revision the server answers `304` with no body and runs no item query. Omitted on
        first load.
      schema: { type: string, maxLength: 64, example: "7" }
    ItemsSince:
      name: since
      in: query
      required: false
      description: >
        The client's keyset cursor: the `cursor` the last page it holds answered, echoed verbatim (opaque to the
        client; the server's position of that page's last item, then its id). On a `200` the server returns only items
        strictly past it, in the order the items' changes committed. Omitted on first load => the list from its
        beginning; a later page of the same load, and every poll, send the last page's `cursor`.
      schema: { type: string, maxLength: 80, example: "17,2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e" }
    ItemsSinceDelete:
      name: sinceDelete
      in: query
      # An empty value (`?sinceDelete=`) is this parameter's absence: Quarkus REST
      # never converts it (cr-api-fuzzing).
      allowEmptyValue: true
      required: false
      description: >
        The client's last-seen `deleteRevision`. The server includes the node's current item-id set (for
        delete-reconcile) **only when it lags** the node's delete revision, i.e. a removal happened since. Defaults to 0.
      schema: { type: integer, format: int32, minimum: 0, default: 0, example: 0 }
    ItemsLimit:
      name: limit
      in: query
      # An empty value (`?limit=`) is this parameter's absence, as for `sinceDelete` (cr-api-fuzzing).
      allowEmptyValue: true
      required: false
      description: >
        The most items one answer carries (ADR 0033 decision 6). Absent => the cap, 1000, which the response's item
        array declares as its `maxItems`. When items remain past the page the response says `more: true`, and the
        client asks again from the last item it was given, until `more` is false.
      schema: { type: integer, format: int32, minimum: 1, maximum: 1000, default: 1000, example: 500 }
  headers:
    ItemsETag:
      x-veyq-visibility: structure
      description: The node's current item revision - echo it as `If-None-Match` on the next poll.
      schema: { type: string, example: "7" }
  responses:
    RequestTooLarge:
      description: >
        The request's declared body is past the server's request limit (`request_too_large`; `quarkus.http.limits.max-body-size`,
        10,240 KiB unless the instance sets it) — answered on the `Content-Length` header alone, before the body is read or
        the caller is authenticated, and the connection is closed with it. Every operation that takes a body declares it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: request_too_large }
    ItemsNotModified:
      description: >
        Not Modified - the client's `If-None-Match` equals the node's current item revision; nothing changed. No body,
        and no item query ran server-side (the idle fast path).
    TenantSuspended:
      description: >
        The tenant this operation acts on is suspended (`tenant_suspended`, ADR 0066). Only an accepted member is
        told so — anyone else gets the operation's 404 — for reads and writes alike, whatever `Host` the request
        arrived on (uc.spaces.scope-access).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: tenant_suspended }
    ScopeDeleting:
      description: >
        The space is being deleted and is read-only for its grace window (`scope_deleting`, uc.spaces.delete-group
        A4). Only an accepted member who still belongs to the tenant is told so (uc.spaces.scope-access).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: scope_deleting }
    ApplicationSwitchedOff:
      description: >
        Unprocessable: the application this write belongs to is switched off for the instance or for the tenant
        (`capability_disabled`; its register entry, `memories`, `depot` or `expenses`, uc.platform.switch-application-off). Off, an
        application is read-only: nothing of it is written, while everything of it still opens, downloads, goes to the
        trash and comes back (ADR 0088 decision 5). Nothing is stored.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: capability_disabled }
  schemas:
    StaleSealedMeta:
      # The 409 body of every revision-checked sealed-meta write (ADR 0077): core's node payload and any
      # application's own sealed blob. Shared because every such blob answers the same way, and a loser may have
      # no single-item read to re-GET: the conflict body IS the re-read.
      type: object
      description: >
        A refused write. With `code: stale_revision` the blob moved since the caller read it: nothing was written,
        and the body carries the blob's current `wrappedMeta` (null when it has none) and its `metaRevision` — the
        base the caller re-applies its own change to before retrying (ADR 0077). Any other 409 code
        (`scope_deleting`, `slug_taken`) carries `code` alone. Operator-blind: the ciphertext is what the caller
        can already list.
      required: [code]
      properties:
        code:
          x-veyq-visibility: public
          type: string
          description: Stable, client-localizable error code.
          maxLength: 64
          example: stale_revision
        message:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Optional developer-facing detail; never contains secrets or content.
          maxLength: 512
          example: null
        wrappedMeta:
          type: [string, "null"]
          description: The blob's current sealed value (opaque base64), present with `stale_revision`; null when it has none.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The blob's current revision, present with `stale_revision` — a retry states this one.
          example: 4

    TenantStatus:
      # Shared by the tenants spec (the Server-Owner's tenant list) and the scopes spec (`MyTenant.status`, the
      # space switcher) — one lifecycle, so one enum (ADR 0038).
      x-veyq-visibility: enum
      type: string
      description: >
        Lifecycle state of a tenant. SUSPENDED is a reversible, availability-only lockout (ADR 0066): every
        operation acting on the tenant refuses its members `403 tenant_suspended`, on whatever domain the request
        arrived (uc.spaces.scope-access), and the tenant's own domain refuses every API request, sign-in included —
        its content, keys and memberships are untouched. PENDING_DELETION is the same lockout for a tenant the Server
        Owner deleted (ADR 0101 decision 10): it answers exactly as SUSPENDED until the purge erases it after the scope
        trash's retention, or a stop returns it to SUSPENDED.
      enum: [PENDING, ACTIVE, SUSPENDED, PENDING_DELETION]
      example: ACTIVE

    Capability:
      type: object
      description: >
        One entry of an effective capability set (ADR 0032, ADR 0088): the pre-auth instance manifest of
        `GET /api/setup`, and the tenant's set a member reads after sign-in (`GET /api/tenants/{tenantId}/capabilities`).
        Both are one type and carry the entry's requirements in effect as values, `[{ id, …values }]` (ADR 0088
        decision 8): each value property belongs to one entry (the catalog's `requirements`, whose names
        `scripts/validate_capabilities.py` holds to these properties) and carries a value only on it and only while set
        (null otherwise). The
        pre-auth manifest carries the instance level's, the tenant's set the strictest of both. Additive, no `major`
        bump.
      required: [id]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: >
            Stable lowercase-dotted capability id, a path in the register tree (e.g. "core.public-shares.drop-box"),
            from the catalog contracts/platform/capabilities.json. A capability says what this server, and this tenant,
            serves at all ("X exists here") — NOT a per-scope/role permission ("you may do X here"). A feature is offered
            only when the capability is present AND local policy permits.
          maxLength: 64
          example: core.public-shares.drop-box
        linkPassword:
          x-veyq-visibility: flag
          type: boolean
          description: >
            On `core.public-shares` only, and only while in effect: every link of any kind needs a password (a
            requirement, ADR 0088 decision 8). A share dialog then asks for one; the server refuses a link without it
            (`422 link_password_required`) and answers guests of an existing one as an unknown link.
          example: true
        linkMaxDays:
          x-veyq-visibility: measure
          type: integer
          description: >
            On `core.public-shares` only, and only while in effect: a link ends at most this many days after it was
            made (a requirement). A share dialog then asks for an end date within it; the server refuses one beyond
            (`422 link_expiry_required`) and answers guests of an existing link outside it as an unknown link.
          minimum: 1
          maximum: 3650
          example: 30
        addConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            On `core.group-space` only, and only while in effect: being added to a group needs the person's yes,
            whatever their own setting (a requirement). Members already added stay.
          example: true
        passwordMaxDays:
          x-veyq-visibility: measure
          type: integer
          description: >
            On `core.remember-device` only, and only while in effect: a session is not renewed more than this many
            days after it began, so a device asks for the password again (a requirement, instance level only).
          minimum: 1
          maximum: 3650
          example: 14
        serviceUrl:
          x-veyq-visibility: public
          type: string
          description: >
            On an external-service entry only (`memories.map`, `memories.places`, `core.breached-password`,
            `expenses.exchange-rates`; the catalog's `source`), and only while it is active: the address the Server
            Owner configured, which the browser calls directly (ADR 0088 decision 7). The tiles' URL is a `{z}/{x}/{y}`
            template, the geocoder's a Nominatim-compatible base, the breach check's the range API's prefix, the
            exchange rates' a `{date}` template of a whole day's table of the ECB's euro reference rates in Frankfurter's v2
            shape (ADR 0108 decision 8).
            The served CSP names its origin.
          maxLength: 512
          example: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        serviceAttribution:
          x-veyq-visibility: public
          type: string
          description: >
            On `memories.map` only, while active: the tile provider's attribution, shown on every map.
          maxLength: 256
          example: © OpenStreetMap contributors

    ReportCategory:
      # Shared by the moderation spec (a member's report) and the sharing spec (a guest's) — one report, one shape
      # (ADR 0093 §§ 1-2, uc.moderation.report).
      x-veyq-visibility: enum
      type: string
      description: >
        What a report says the content is (ADR 0093 § 1, DSA Art. 16(2)): child sexual abuse material, terrorist
        content, a threat to life or safety, other illegal content, a breach of the terms. In the clear, so the
        moderators' mail can say it and the first three can be mailed at once; a case carries the most urgent
        category of its reports, in this order.
      enum: [CHILD_SEXUAL_ABUSE, TERRORIST_CONTENT, THREAT_TO_LIFE, ILLEGAL_CONTENT, TERMS_BREACH]
      example: ILLEGAL_CONTENT

    ReportItemSubmission:
      type: object
      description: >
        One reported item, and the keys that open it sealed under the report's `K_report`. A NODE, an ITEM or a NAME
        names its `id` (a NAME: its node's), a LINK none (else `400 invalid_request`) — the schema's own rule (inbox
        #507).
      required: [kind, sealedShare]
      # ReportHandler.malformed. Under `dependentSchemas` (on the required `kind`), never at the top, where an `if` turns
      # a sibling-annotated `$ref` to this schema into `Any`; there both generators ignore it (measured on
      # openapi-generator 7.23.0, Kotlin and TypeScript).
      dependentSchemas:
        kind:
          if:
            properties: { kind: { const: LINK } }
          then:
            properties: { id: { type: "null" } }
          else:
            required: [id]
            properties: { id: { type: string } }
      properties:
        kind:
          x-veyq-visibility: enum
          type: string
          description: >
            What the item is: a NODE (any kind — a folder, a Memory, a chapter, a file), an application's ITEM on
            a node (a Memories medium), a node's NAME on its own (ADR 0093 § 9: its report share holds that name's
            field key alone; never a guest's link root, whose name is the link's), or the LINK itself (a guest of an
            upload link reports nothing else, ADR 0093 § 1).
          enum: [NODE, ITEM, NAME, LINK]
          example: NODE
        id:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The node's or the item's id (a NAME's: its node's); absent for a LINK, which is the link the request is
            made through. The hold and the reach check need it in the clear.
          example: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b
        sealedShare:
          type: string
          description: >
            The report share: the item's keys, role-tagged, sealed under `K_report` (`seal` purpose
            `report-share` [itemKind, itemId], or `report-link` [shareId]; `@veyq/crypto`'s report.ts). At most
            256 keys (`REPORT.maxKeysPerShare`); 32812 is the base64 length of that many with every role 16 bytes and
            every ref a UUID.
          contentEncoding: base64
          maxLength: 32812
          example: AnJlcG9ydC1zaGFyZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 32812) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ReportSubmission:
      type: object
      description: >
        A report (ADR 0093 §§ 1-2). In the clear: the category, the epoch, the items' kinds and ids, and — only when
        given — the receipt address. What the reporter wrote is in `sealedReport`, and their contact apart in
        `sealedContact` (ADR 0093 § 11: it goes alone, six months after the decision was told).
      required: [category, epoch, sealedReport, items]
      properties:
        category: { $ref: "#/components/schemas/ReportCategory" }
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The moderation key's epoch `sealedReport` is sealed to — the current one, or `409 moderation_epoch_changed`.
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        sealedReport:
          type: string
          description: >
            `K_report`, the reason and the context, padded to 512-byte buckets and sealed to the epoch's public half
            (`sealTo` purpose `moderation-report` [epoch]).
          contentEncoding: base64
          maxLength: 23380
          example: AXJlcG9ydA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 23380) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedContact:
          type: [string, "null"]
          description: >
            The reporter's contact, when they left one: one 512-byte bucket sealed to the same epoch's public half
            (`sealTo` purpose `moderation-report-contact` [epoch]) — apart from `sealedReport`, so the server can delete
            it alone six months after the decision was told (ADR 0093 § 11). Absent when none was left.
          contentEncoding: base64
          maxLength: 2300
          example: AWNvbnRhY3Q=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 2300) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            The reported items, each at most once; above 100 the client offers the enclosing node instead. A kind and
            id named twice is `422 report_item_repeated` — a rule across the items no schema states (`uniqueItems`
            compares whole items, and the generators would turn the list into a set).
          items: { $ref: "#/components/schemas/ReportItemSubmission" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.NotEmpty @field:jakarta.validation.constraints.Size(max = 100)'
        receiptAddress:
          x-veyq-visibility: pii
          x-veyq-rationale: >
            The reporter's own address for the receipt DSA Art. 16(4) asks for (owner decision Q6 of
            cr-report-and-hold, ADR 0097 decision 3): the server mails it once from memory and stores only the copy
            sealed in `sealedContact`; a mail cannot be sent to an address the sender does not see.
          type: [string, "null"]
          format: email
          description: Where the receipt goes, if the reporter left an address. Not stored.
          maxLength: 254
          example: reporter@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:me.raddatz.veyq.core.validation.Mailbox @field:jakarta.validation.constraints.Size(max = 254)'

    ReportReceipt:
      type: object
      description: What the reporter keeps (the dialog's on-screen receipt).
      required: [reportId, receivedAt]
      properties:
        reportId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The report's reference.
          example: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        receivedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the server received it.
          example: 2026-10-17T12:00:00Z

    # The statement of reasons' shared parts (ADR 0093 § 7) — single-sourced: a moderator's measure carries them on the
    # public listener (moderation.openapi.yaml), the Server Owner's own steps on the admin channel (instance.openapi.yaml,
    # tenants.openapi.yaml).
    ModerationGround:
      x-veyq-visibility: enum
      type: string
      description: >
        The ground a measure rests on (ADR 0093 § 7): the law — child sexual abuse material, terrorist content, a threat
        to life or safety, other illegal content — or the terms of use (`TERMS_BREACH`). The report categories' values.
      enum: [CHILD_SEXUAL_ABUSE, TERRORIST_CONTENT, THREAT_TO_LIFE, ILLEGAL_CONTENT, TERMS_BREACH]
      example: TERMS_BREACH

    StatementProvision:
      x-veyq-visibility: public
      type: [string, "null"]
      description: >
        The provision of the law or the clause of the terms the ground relies on (DSA Art. 17(3)(d), (e); ADR 0093 § 7),
        a short reference in the moderator's own words — "§ 86a StGB", "Space terms, clause 4" — stored in the clear beside
        the ground and rendered after it. Never the facts: why the content falls under it is what the sealed facts explain.
        Required (`statement_provision_required`); blank counts as none.
      maxLength: 200
      example: § 86a StGB
      x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 200)'

    SealedStepFacts:
      type: object
      description: >
        The facts of a Server Owner's step, sealed for the log by admin-web or veyq-admin to the moderation key's current
        public half, bound to the statement's client-minted id (`sealTo` purpose `moderation-step-facts` [epoch,
        statementId]) — sealing needs only the public half.
      required: [epoch, sealedFacts]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The epoch they are sealed to — the current one, or `409 moderation_epoch_changed`.
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        sealedFacts:
          type: string
          description: The sealed facts.
          contentEncoding: base64
          maxLength: 12456
          example: c2VhbGVkLWZhY3Rz
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 12456) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ServerOwnerStatementInput:
      type: object
      description: >
        The statement of reasons a Server Owner's own step over content carries (ADR 0093 § 7; DSA Art. 17(1)(c), (d)) —
        entered with the step, in the one template. It goes by instance mail to the
        member whose sign-in is blocked, or to each owner of the tenant taken offline, **with the facts**: they cannot
        sign in to open a sealed copy (owner decisions Q24-Q25 of cr-statement-legal-gaps). The server mails the facts
        once, after the step committed, and keeps them only as `factsForLog`, sealed; the objection goes to the instance contact.
        The step's answer reports whom that mail reached (`StatementDelivery`); a recipient it did not reach is not mailed
        again, so the Server Owner tells them through the contact, with the words their own client still holds.
        The facts and the provision are required (`400 statement_facts_required`,
        `400 statement_provision_required`); `facts` and `factsForLog` come together or not at all (`400
        invalid_request`).
      required: [statementId, ground]
      properties:
        statementId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The statement's id, minted by the client — the sealed facts are bound to it (ADR 0072 Decision 3).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        ground: { $ref: "#/components/schemas/ModerationGround" }
        provision: { $ref: "#/components/schemas/StatementProvision" }
        facts:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The Server Owner's own words, mailed in the clear to the member whose sign-in they block or to the owners of
            the tenant they take offline (ADR 0093 § 7, owner decision Q24 of cr-statement-legal-gaps): a blocked member
            cannot sign in to open a sealed copy, and the mail is the statement's only channel. A consented disclosure by
            its author (ADR 0049 decision 2); the server stores only the sealed copy beside it.
          type: [string, "null"]
          description: What the Server Owner found, in their own words; null without facts.
          maxLength: 4000
          example: The account posted the same unlawful image in three spaces after two warnings.
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 4000)'
        factsForLog:
          oneOf:
            - $ref: "#/components/schemas/SealedStepFacts"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    StatementDelivery:
      type: object
      description: >
        Whom the mail of a Server Owner's step over content reached (ADR 0093 § 7: "So the step reports what the mail
        reached"). Request-scoped: it answers the step and is never stored — each recipient's `mailedAt` stays the only
        stored trace, and the facts are mailed once, so a recipient not reached is told by the Server Owner through the
        instance contact. The step stands whatever this says; it is never refused or rolled back for want of mail.
      required: [outcome, notReached]
      properties:
        outcome:
          x-veyq-visibility: enum
          type: string
          description: >
            `REACHED` = every recipient's mail went out; `NOT_ALL_REACHED` = at least one did not — no instance mail is
            set up, or the send failed; `NOBODY_TO_TELL` = the step had no recipient (a tenant without an owner, an
            account erased before the send); `UNKNOWN` = the recipients could not be read after the step committed, so
            the server cannot say.
          enum: [REACHED, NOT_ALL_REACHED, NOBODY_TO_TELL, UNKNOWN]
          example: NOT_ALL_REACHED
        notReached:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The addresses of the recipients the statement's mail did not reach, answered on the admin channel to the
            Server Owner who must tell them through the instance contact (ADR 0093 § 7); they are member and owner
            addresses the Server Owner already reads there (the tenant's owners, the sign-in block form). Never stored.
          type: array
          description: The addresses whose mail did not go out; empty unless `outcome` is `NOT_ALL_REACHED`.
          maxItems: 10000
          items:
            type: string
            format: email
            maxLength: 254
          example: [owner@example.com]

    # An authority's order (ADR 0093 § 12, uc.moderation.authority-order) — single-sourced: a moderator enters it on the
    # public listener (moderation.openapi.yaml) and the Server Owner on the admin channel (instance.openapi.yaml).
    AuthorityOrderKind:
      x-veyq-visibility: enum
      type: string
      description: >
        `REMOVAL` = a terrorist-content removal order (TCO Art. 3): the share and the content it reaches are blocked at
        once; `PRESERVATION` = a European Preservation Order (Regulation 2023/1543): a hold, no block; `INFORMATION` = a
        request for information (§§ 100j–100k StPO): a hold, no block.
      enum: [REMOVAL, PRESERVATION, INFORMATION]
      example: REMOVAL

    SealedOrderReference:
      type: object
      description: >
        The authority's reference, sealed by the client that enters the order to the moderation key's current public
        half, bound to the order's id (`sealTo` purpose `moderation-order` [epoch, orderId]). Sealing needs only the
        public half, so the Server Owner's admin-web and CLI seal it without the key.
      required: [epoch, sealedReference]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The epoch it is sealed to — the current one, or `409 moderation_epoch_changed`.
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        sealedReference:
          type: string
          description: The sealed reference.
          contentEncoding: base64
          maxLength: 12456
          example: c2VhbGVkLXJlZmVyZW5jZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 12456) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    AuthorityOrderRequest:
      type: object
      description: >
        An authority's order as it is entered. The client keeps only the share's id from a pasted URL — its fragment,
        which carries the share's key, never leaves the client — and mints the order's id, so a retry within the hour is
        the same order (`409 order_exists`).
      required: [id, kind, shareId, receivedAt, reference]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The order's id, minted by the client; the reference is sealed bound to it.
          example: 3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b
        kind: { $ref: "#/components/schemas/AuthorityOrderKind" }
        shareId:
          x-veyq-visibility: id
          type: string
          description: The share the order names — its id, never its key.
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 43, max = 43) @field:jakarta.validation.constraints.Pattern(regexp = "^[A-Za-z0-9_-]{43}$")'
        receivedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the order reached the contact point, as entered — the hour's clock is the operator's, and this record is its proof. Between 1582-10-15T00:00:00Z and 9999-12-31T23:59:59.999Z, the range a stored time holds, with an offset of at most ±18:00; outside it the request is refused `422 date_time_out_of_range`.
          example: 2026-10-18T07:12:00Z
        reference:
          $ref: "#/components/schemas/SealedOrderReference"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        holdDays:
          x-veyq-visibility: measure
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 3650
          description: For `INFORMATION` only, the days the order names to keep the data; null = six months. `invalid_request` for another kind.
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1) @field:jakarta.validation.constraints.Max(3650)'
        deferStatementUntil:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            For `REMOVAL` only: the authority forbids telling the affected until then (TCO Art. 11(3)) — at most six
            weeks (42 days) from now (`400 deferral_out_of_bounds`); the order's reference is the deferral's. Null = the
            statement goes out with the block.
            Between 1582-10-15T00:00:00Z and 9999-12-31T23:59:59.999Z, the range a stored time holds, with an offset of at most ±18:00; outside it the request is refused `422 date_time_out_of_range`.
          example: null

    AuthorityOrder:
      type: object
      description: An authority's order as recorded — clear fields, and the reference sealed.
      required: [id, kind, shareId, receivedAt, enteredAt, enteredBy, found, epoch, sealedReference]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b }
        kind: { $ref: "#/components/schemas/AuthorityOrderKind" }
        shareId:
          x-veyq-visibility: id
          type: string
          description: The share the order names.
          maxLength: 43
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
        receivedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it reached the contact point, as entered.
          example: 2026-10-18T07:12:00Z
        enteredAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the server recorded it.
          example: 2026-10-18T07:20:11Z
        enteredBy:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The moderator or Server Owner account that entered it.
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        found:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the share exists on this instance; false = recorded only, nothing blocked or held (the Annex III draft).
          example: true
        blockedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: For a `REMOVAL` that found its share, when the share and its content were both blocked — to the second, for the Annex II text; a block already in force counts from its own time. Null otherwise.
          example: 2026-10-18T07:20:11Z
        caseId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The case the order opened; null when its share was not found.
          example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b
        holdUntil:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: The end the order sets for its hold — no extension, lift or decision ends it sooner (ADR 0093 § 4). Null when nothing is held.
          example: 2027-04-19T07:20:11Z
        statementDeferredUntil:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: Until when the authority deferred the statement of reasons; null when it did not.
          example: null
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The epoch `sealedReference` is sealed to.
          example: 2
        sealedReference:
          type: string
          description: The authority's reference, sealed (`moderation-order` [epoch, orderId]).
          contentEncoding: base64
          maxLength: 12456
          example: c2VhbGVkLXJlZmVyZW5jZQ==
        providerName:
          x-veyq-visibility: public
          type: string
          description: The provider's name from the operator details, for the forms; null when none is set.
          maxLength: 200
          example: Example e.V.
        contactPoint:
          x-veyq-visibility: public
          type: string
          description: The instance contact — the TCO contact point (ADR 0093 § 11), for the forms; null when none is set.
          maxLength: 254
          example: abuse@example.org

    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          x-veyq-visibility: public
          type: string
          description: Stable, client-localizable error code.
          maxLength: 64
          example: invalid_request
        message:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Optional developer-facing detail; never contains secrets or content.
          maxLength: 512
          example: null

    LocalizedMarkdown:
      # Shared by the tenants spec (member terms, cr-0114) and the sharing spec (the accountless share terms
      # gate, cr-anonymous-accept-gate). Single-sourced here (ADR 0038) so the terms shape cannot drift
      # between the two acceptance tiers.
      type: object
      description: >
        Per-locale terms markdown (the space owner's public policy). Each locale is optional; an absent/blank
        locale falls back to the other at display time (no empty terms shown). Trimmed + newline-normalized
        server-side before comparison.
      properties:
        de:
          x-veyq-visibility: public
          type: [string, "null"]
          description: German terms markdown (neutral-first inclusive language, cc.inclusive-language).
          maxLength: 20000
          example: "## Nutzungsbedingungen\n…"
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 20000)'
        en:
          x-veyq-visibility: public
          type: [string, "null"]
          description: English terms markdown.
          maxLength: 20000
          example: "## Terms of use\n…"
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 20000)'

    OperatorSection:
      # Shared by the tenants spec (the member gate), the sharing spec (the accountless share gate) and the operator
      # spec (the public page, DSA Art. 14(1)), like LocalizedMarkdown (ADR 0038).
      type: object
      description: >
        The fixed operator section of the terms (ADR 0035 decision 6), rendered by the server from
        `contracts/terms/operator-section.json` in its one form (ADR 0093 § 14), with the values the Server Owner set
        (an empty one as "not stated by this operator") and the guest-write record's N. Clients show it after the
        space's own terms and never edit it. Public operational content, never E2EE. Every text is a draft until a qualified legal review, and says so.
      required: [revision, text, record]
      properties:
        revision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The section's revision — it moves with its text, that is with a veyq release, never with a value.
          example: 1
        text:
          # The section in both languages, the record's pointer left out (it is `record`). No description beside the
          # $ref: the generator would emit an inline copy of LocalizedMarkdown.
          $ref: "#/components/schemas/LocalizedMarkdown"
        record:
          # The pointer to the guest-write record's GDPR Art. 13 information, which the instance privacy notice holds
          # with its right to object apart (`getPrivacyNotice`, ADR 0035 decision 8; clients link it there) — always
          # present, since the record is kept wherever a guest may write (ADR 0093 § 10). A comment, not a
          # description: beside the $ref the generator would emit an inline copy of LocalizedMarkdown.
          $ref: "#/components/schemas/LocalizedMarkdown"

    PresignedUrl:
      # Shared by the blob spec (member upload/download) and the sharing spec (a guest's upload/download) — one
      # presigned-URL shape, one generated type.
      type: object
      required: [index, url]
      properties:
        index:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: Chunk index (0-based, in chunk order).
          example: 0
        url:
          x-veyq-visibility: token
          type: string
          description: >
            A short-TTL, single-object, single-method presigned URL (PUT or GET) against the object store. A `PUT`
            must carry exactly `Content-Type: application/octet-stream`: the header is signed, so the store refuses
            any other type. A `GET` is served as `application/octet-stream` with `Content-Disposition: attachment`,
            whatever the object was stored as ([ADR 0013
            §6](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md#6-store-responses-are-inert--enforced-by-the-signer)).
          maxLength: 4096
          example: https://store.example.com/veyq/9b1d4a6e/0?X-Amz-Signature=...

    NodeKind:
      # Shared by the content spec (the tree) and the sharing spec (a share's subtree). An open, bounded token
      # (ADR 0079): it generates a String, so a request property carries the pattern's annotation beside its `$ref`.
      x-veyq-visibility: structure
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,15}$'
      description: >
        A node's kind: an open token, upper-case, at most 16 characters. Core names FOLDER only: it organizes and,
        like every node, carries a content key of its own (ADR 0080). Every other kind belongs to an application, which brings its rules — where it lives
        in the tree (`NodeKindRules`) and what its sealed payload means; today MEMORY and CHAPTER, both Memories'. A
        kind no application claims is refused where a rule is asked (`illegal_structure` on create, `illegal_scope`
        on a share), never by decoding: a stored node of such a kind is served as it is. Every node carries a content
        key of its own (`wrappedContentKey`, ADR 0080).
      example: FOLDER

    BlobRole:
      # Shared by the blob spec (a member's upload) and the sharing spec (a guest's). An open, bounded token like
      # `NodeKind`: it generates a String, so a request property carries the pattern's annotation beside its `$ref`.
      x-veyq-visibility: structure
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,15}$'
      maxLength: 16
      description: >
        The role a blob plays for its owner: an open token, upper-case, at most 16 characters, that the application
        owning the node defines; core stores and compares it and never interprets it. The blob's `K_blob` wrap is
        sealed bound to it (ADR 0072), so a blob attached in another role does not open, and the crypto suite admits
        any role of this shape with no new seal purpose. Memories' roles are ORIGINAL and its THUMBNAIL/PREVIEW
        derivatives, and a Memory's BANNER and BANNER_POSTER (a member's only); core's is a node's COVER; Files' is
        FILE_CONTENT. Which roles an upload may carry is the applications' question: a member's upload start refuses
        a role no application declares (`400 invalid_request`), a guest's one the target node's application does not
        take from a guest (`400 invalid_request`, before the link's upload budget is spent; Memories: a medium's
        roles only, never COVER, BANNER or BANNER_POSTER), and Memories' completion attaches only the role it asks
        for. Expenses' is EXPENSES_RECEIPT (a receipt kept with an entry, member and `READ_WRITE` guest alike), which
        carries a cap of its own: at most 10 MiB of plaintext, so a start over 10 486 880 sealed bytes is
        `budget_exceeded` — an application caps a role by its size, which the server sees, never by its type, which is
        sealed.
      example: ORIGINAL

    SharedBlob:
      # Shared by the content spec (a cover), the memory-banner spec (a banner) and the media spec (a gallery original).
      type: object
      description: >
        A blob row on the stored object of an existing blob, in place of an upload
        (cr-cover-banner-upload-only-and-dedup, ADR 0013 section 5): the client found that the file it would upload is
        already stored for this node - it compared a SHA-256 sealed under that blob's own key, so the server compares
        nothing - and asks for a new row instead. The server copies the object's storage key, shape and chunk manifest
        from `sourceBlobId`; the new row has its own id and its own `K_blob` wrap and metadata, so it opens bound to its
        own owner and role (ADR 0072) while sharing the ciphertext objects. The object is reclaimed only when no blob row
        names it any more. The source must be a blob of this scope that a live medium of the same node, or an attachment
        of the same node, holds, and not blocked, and the new id must be free; otherwise `shared_source_invalid` (a `422`, or the
        item's code in a batch) and nothing is written. A
        member's operation only: no link role sends one.
      required: [sourceBlobId, blobId, wrappedBlobKey]
      properties:
        sourceBlobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The existing blob whose stored object the new row names.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        blobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The client-minted id of the new row (ADR 0072 Decision 3) - the id its `wrappedBlobKey` is sealed bound to. A taken id is refused as an invalid source.
          example: 3c4d5e6f-7a8b-4c0d-9e2f-3a4b5c6d7e8f
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        wrappedBlobKey:
          type: string
          description: The source's `K_blob` wrapped again, under the content key of the node the new row's owner sits on, bound to the new row's id, owner and role (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedBlobMeta:
          type: [string, "null"]
          description: Optional - the new row's `blob-meta` sealed under the same `K_blob` (see `startBlobUploads`), written once with the row.
          contentEncoding: base64
          minLength: 1
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    MasterKeyWrap:
      # Shared by the account, setup and tenants specs. The annotated variant — the copies used to differ, and
      # the generator's file order alone decided that the backend got this one.
      type: object
      description: One wrap of the Master Key, openable by a single unlock method.
      required: [method, wrappedKey]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            Opaque id of this wrap. Present in responses (lets a client pin its own DEVICE wrap and untrust
            it); ignored on input (setup assigns ids server-side), but a value sent must still be a UUID.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        method:
          x-veyq-visibility: enum
          type: string
          description: >
            Which unlock method opens this wrap. DEVICE mixes the password into the KEK
            (Argon2id(deviceFactor + password)); DEVICE_KEY is the password-less remember-me wrap — a
            device-held key alone (no password, no KDF), so its kdfParams carries only the AEAD iv.
          enum: [PASSWORD, PASSKEY, RECOVERY, DEVICE, DEVICE_KEY]
          example: PASSWORD
        wrappedKey:
          type: string
          description: The Master Key wrapped to this method's KEK (opaque base64 ciphertext).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tYXN0ZXIta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        kdfParams:
          type: string
          description: >
            KDF parameters + salt needed to re-derive this method's unlock KEK (opaque base64; present for
            password/recovery/device methods, absent for passkey which is PRF-derived). For DEVICE_KEY there
            is no KDF — this field carries only the AEAD iv for the device-key wrap.
          contentEncoding: base64
          maxLength: 256
          example: AAAAAwAAgAAAAAABAAAAIHNhbHQtZXhhbXBsZS0xNmJ5dGVz
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
