# Shared OpenAPI components, referenced across contracts/api/*.openapi.yaml via external $ref (ADR 0038).
#
# This is NOT a generated spec — it has no paths and is never fed to a generator on its own: the backend
# fileTree glob excludes it (backend/gradle/openapi.gradle.kts) and the web generate:api script does not list
# it. It exists only as a single-source $ref target, so a shared component cannot drift across the per-domain
# specs. openapi-generator (both surfaces) resolves the external $ref in place, emitting the same model per
# module it emitted from the inline copies — a pure refactor, no wire change.
#
# The two shared `responses` are the scope-access gate's answers (uc.spaces.scope-access). An operation that
# declares no other 403/409 points at them; one that already has a 403/409 names the code in its own description
# instead, since a status carries only one response object.
openapi: 3.1.0
info:
  title: veyq shared contract components
  version: 1.0.0
paths: {}
components:
  responses:
    TenantSuspended:
      description: >
        The tenant this operation acts on is suspended (`tenant_suspended`, ADR 0066). Only an accepted member is
        told so — anyone else gets the operation's 404 — for reads and writes alike, whatever `Host` the request
        arrived on (uc.spaces.scope-access).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: tenant_suspended }
    ScopeDeleting:
      description: >
        The space is being deleted and is read-only for its grace window (`scope_deleting`, uc.spaces.delete-group
        A4). Only an accepted member who still belongs to the tenant is told so (uc.spaces.scope-access).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: scope_deleting }
  schemas:
    TenantStatus:
      # Shared by the tenants spec (the Server-Owner's tenant list) and the scopes spec (`MyTenant.status`, the
      # space switcher) — one lifecycle, so one enum (ADR 0038).
      type: string
      description: >
        Lifecycle state of a tenant. SUSPENDED is a reversible, availability-only lockout (ADR 0066): every
        operation acting on the tenant refuses its members `403 tenant_suspended`, on whatever domain the request
        arrived (uc.spaces.scope-access), and the tenant's own domain refuses every API request, sign-in included —
        its content, keys and memberships are untouched.
      enum: [PENDING, ACTIVE, SUSPENDED]
      example: ACTIVE

    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          x-veyq-visibility: public
          type: string
          description: Stable, client-localizable error code.
          maxLength: 64
          example: invalid_request
        message:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Optional developer-facing detail; never contains secrets or content.
          maxLength: 512
          example: null

    LocalizedMarkdown:
      # Shared by the tenants spec (member terms, cr-0114) and the sharing spec (the accountless share terms
      # gate, cr-anonymous-accept-gate). Single-sourced here (ADR 0038) so the operator-terms shape cannot drift
      # between the two acceptance tiers.
      type: object
      description: >
        Per-locale terms markdown (the operator's public policy). Each locale is optional; an absent/blank
        locale falls back to the other at display time (no empty terms shown). Trimmed + newline-normalized
        server-side before comparison.
      properties:
        de:
          x-veyq-visibility: public
          type: [string, "null"]
          description: German terms markdown (neutral-first inclusive language, cc.inclusive-language).
          maxLength: 20000
          example: "## Nutzungsbedingungen\n…"
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = com.veyq.app.shared.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 20000)'
        en:
          x-veyq-visibility: public
          type: [string, "null"]
          description: English terms markdown.
          maxLength: 20000
          example: "## Terms of use\n…"
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = com.veyq.app.shared.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 20000)'
