openapi: 3.1.0
info:
  title: veyq Blob API
  version: 0.1.0
  description: >
    The platform's generic **blob upload and download** under a scope (ADR 0079: blobs and their quota are core's;
    an application decides what a verified blob becomes). A blob is a fixed-size sequence of **chunked-AEAD**
    ciphertext objects, sealed client-side under a fresh random **`K_blob`** (wrapped under the content key of
    the node its owner sits on, [ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md)), transferred
    **direct-to-store** via short-TTL presigned URLs
    ([ADR 0013](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md)) — bytes never flow through
    the backend. Start reserves an upload session and presigns the first window of PUTs, `blob-upload-windows` signs
    each next one, and `blob-downloads-batch` presigns GETs; **completing** an upload — attaching the verified blob
    to what owns it — is the owning application's own operation, except for the blobs an application stores through
    **core's blob service** ([ADR 0112](../../docs/decisions/0112-an-applications-stored-blobs-are-managed-by-a-core-service.md),
    tags `application-blobs`, `share-application-blobs`, `case-application-blobs`): any number per node, each in a role
    its application declares and held by an **owner** — the application's record, an id the server stores and compares
    and never resolves (Expenses: an entry's receipts; Memories: a medium's original and derivatives). The service
    carries every platform duty over them — the completion, a guest's, the link's usage, the share's blob predicate, a
    report and a block, a hold, the re-key of their wraps (`listApplicationBlobRekey`), the erasure and the retention
    purge; the application only tells it, in its own write, which blobs an owner keeps and which it released. A role is
    either **an item of its own** (Expenses' receipt: completed, listed and reported here, its wrap bound to its node) or
    **its owner's content** (a medium's tiers, [ADR 0113](../../docs/decisions/0113-memories-media-are-blobs-of-cores-blob-service.md): completed and served by its application's own
    record operations, its wrap bound to its owner, reported and held with its owner, out of a guest's reach once
    released). The operations of these three tags serve the first form only.

    **Operator-blind:** the server + object store hold only ciphertext chunks + opaque metadata (`chunkCount`,
    `byteSize`, the per-chunk size `manifest`) and the `K_blob` wrap; never a plaintext byte, a content key, or a
    filename in clear. The caller holds a grant for the scope (enforced by code, ADR 0008). **No content dedup beyond one node**
    ([ADR 0013 §5](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md#5-one-stored-object-for-an-equal-file-inside-one-node-nothing-wider)).
tags:
  - name: blob
    description: >
      Generic blob transfer under a scope: start uploads (presign the first window of PUTs), presign each next
      window, presign GETs for download. One tag = one resource interface rooted at `/api/scopes/{scopeId}` (the
      three paths differ at the segment after it), distinct from the applications' resources under the same root.
  - name: application-blobs
    description: >
      A member's application blobs of a node (ADR 0112): read them, complete one, and read their wraps for a re-key. One
      tag = one resource interface rooted at `/api/scopes/{scopeId}/nodes/{nodeId}/application-blobs` — longer than
      `blob`'s and `content`'s roots, so these routes reach it and every other route stays theirs.
  - name: share-application-blobs
    description: >
      A guest's application blobs of a node on a public share link — read them, complete one (unauthenticated). One tag =
      one resource interface rooted at `/api/shares/{shareId}/nodes/{nodeId}/application-blobs`: longer than core's
      `sharing` root `/api/shares`, so these routes reach it and every other `/api/shares` route stays `sharing`'s.
  - name: case-application-blobs
    description: >
      A moderator's review of a case's held application blobs (uc.moderation.review-a-case), behind core's moderation
      gate. Its own tag so its resource owns `/api/moderation/cases/{caseId}/application-blobs`: longer than the
      moderation root `/api/moderation`, so this route reaches it and every other moderation route stays `moderation`'s.

paths:
  /api/scopes/{scopeId}/blob-uploads-batch:
    post:
      tags: [blob]
      operationId: startBlobUploads
      summary: Start N blob uploads — reserve sessions + presign the first window of PUTs.
      description: >
        For each requested blob the client declares its `chunkCount`, total `byteSize`, and the `wrappedBlobKey`
        (`K_blob` under the content key of the node its owner sits on, ADR 0012), plus the ids that wrap is sealed bound to ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md)): the client-minted
        `blobId`, the `ownerId` it belongs to (the client-minted id of the application's object the completion will
        attach it to) and its `role`. A `blobId` already taken — by a blob or an open upload session, in any scope — fails that item
        `id_taken`. The server opens an upload session **bound to the caller** and returns, per
        item, an `uploadId` plus short-TTL presigned **PUT** URLs for the blob's **first window** of chunks (the
        server's `veyq.blob.presign-window`, default 64 chunks) — or a per-item error. The caller PUTs each
        ciphertext chunk **directly to the object store**, asks `blob-upload-windows` for each next window (and to
        re-sign one whose URLs expired), and completes through the owning application's own operation. The in-memory store cannot
        presign and answers `store_unavailable`.
        **Tenant quota ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)):**
        when the Server Owner has set one, the request's admissible items are reserved together against what the
        tenant already holds (every blob in its scopes, trash included until purged, plus its open sessions): all of
        them fit, or every one is refused `quota_exceeded` and no session is opened.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobUploadsBatchRequest" }
            example:
              items:
                - blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  ownerId: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
                  role: ORIGINAL
                  chunkCount: 2
                  byteSize: 400000
                  wrappedBlobKey: d3JhcHBlZC1rLWJsb2I=
      responses:
        "200":
          description: Per-item upload results (success carries the presigned PUTs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobUploadsBatchResponse" }
        "400":
          description: >
            Malformed request (missing/invalid fields), or an item whose `role` no application declares for a member's
            upload — the whole request is refused and no session is opened.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422": { $ref: "_common.openapi.yaml#/components/responses/ApplicationSwitchedOff" }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

  /api/scopes/{scopeId}/blob-upload-windows:
    post:
      tags: [blob]
      operationId: presignBlobUploadWindows
      summary: Presign the next window of PUTs for N open upload sessions.
      description: >
        For each item the server resolves the upload session `uploadId` and returns presigned **PUT** URLs for its
        chunks `[fromChunk, min(fromChunk + window, chunkCount))`, each signed for its chunk's exact
        `Content-Length` — the same URLs `startBlobUploads` would have issued, under a fresh TTL. The client asks
        for each next window as it goes, and re-signs from the first chunk it has not sent when a window's URLs
        expired ([ADR 0013 §2](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md#2-presigned-direct-to-store-is-the-only-transport-no-proxied-fallback)).
        Every request is **authorized again** like `startBlobUploads` (a removed member is refused at the next
        window), and a session resolves only for **the account that opened it**; each window marks the session
        live for the stale-session reclaim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobUploadWindowsRequest" }
            example:
              items:
                - uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  fromChunk: 64
      responses:
        "200":
          description: Per-item window results (success carries the presigned PUTs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobUploadWindowsResponse" }
        "400":
          description: Malformed request (missing/invalid fields).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/blob-downloads-batch:
    post:
      tags: [blob]
      operationId: presignBlobDownloads
      summary: Presign GET for N blobs — one URL per chunk.
      description: >
        For each requested `blobId` the server returns one short-TTL presigned **GET** URL per chunk (in chunk
        order) — or a per-item error. The caller GETs each ciphertext chunk **directly from the object store**
        and opens it with `openFrame`. The in-memory store answers `store_unavailable`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobDownloadsBatchRequest" }
            example:
              items:
                - blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
      responses:
        "200":
          description: Per-item download results (success carries the presigned GETs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobDownloadsBatchResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

  /api/scopes/{scopeId}/nodes/{nodeId}/application-blobs:
    get:
      tags: [application-blobs]
      operationId: listApplicationBlobs
      summary: A node's application blobs — every blob its application stores through core's service, with its blob reference (ADR 0112).
      description: >
        Every blob the node's application stores through core's blob service ([ADR 0112](../../docs/decisions/0112-an-applications-stored-blobs-are-managed-by-a-core-service.md))
        in a role that is an item of its own (an owner's content is served by its application's record reads, ADR 0113)
        — kept, released or never kept yet, until the purge erases it — with what the client needs to open it: the blob
        reference (`presignBlobDownloads` by `blobId`), its `K_blob` wrap under the node's key and its sealed `blob-meta`.
        Each carries its `ownerId` (the application's record that holds it, an id opaque to the server), its `role`, who
        completed it (`writer`), when its owner last kept it (`keptAt`), when it was released (`releasedAt`), when the
        purge erases it (`purgeAfter`) and whether a moderator blocked its bytes (`blockedByOperator`: the blob itself,
        its owner or its node — its download then answers `blocked_by_operator`). Which blobs a record holds is the
        application's own sealed data; this read is where their bytes are. Ordered by id; **pages** of at most `limit`,
        `more: true` while blobs remain past them — ask again with the page's `cursor` as `after`. **Live refresh:** every
        change of a node's blobs moves the node's item revision (an application's revisioned list, docs/apps/README.md),
        so a client re-reads this when that moves; a read without `after` carries an `ETag` that is a digest of
        everything this read serves across its pages — echoed as `If-None-Match`, an unchanged listing is `304`. A
        trashed node is read the same way.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/ApplicationBlobsAfter"
        - $ref: "_common.openapi.yaml#/components/parameters/ItemsLimit"
        - $ref: "#/components/parameters/ApplicationBlobsIfNoneMatch"
      responses:
        "200":
          description: One page of the node's application blobs.
          headers:
            ETag: { $ref: "#/components/headers/ApplicationBlobsETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationBlobPage" }
        "304":
          description: Not Modified — `If-None-Match` equals the digest of what this read would serve; no body.
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: "`scope_not_found` — no such scope, or the caller holds no grant for it (indistinguishable, uc.spaces.scope-access); `node_not_found` — no node of that id in it whose application stores blobs through the service."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
    post:
      tags: [application-blobs]
      operationId: completeApplicationBlob
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: nodeEpoch
      summary: Complete an upload as one of a node's application blobs, held by an owner (ADR 0112).
      description: >
        Promote one `startBlobUploads` session — started with this `role` and `ownerId` = this node, since its `K_blob`
        wrap is sealed bound to the blob, the node and the role (ADR 0072): no new blob purpose — into the application
        blob `id` held by the owner `ownerId`, a record of the node's application (Expenses: an entry), opaque to the
        server. The server verifies the upload (declare-then-verify: every chunk stored at exactly its derived length,
        else the objects are purged and the call fails `budget_exceeded`) and records the blob in one transaction under
        the node's lock. The role is one the node's application stores through the service (else `upload_mismatch`), and
        its size cap is held at the start (`budget_exceeded`). The application answers whether the owner may hold a blob
        in this node (`409 id_taken`: Expenses' entry of another Pot, or an id that names a record); an owner holds at
        most the application's count per owner of unreleased blobs (`409 too_many_blobs`; Expenses: 100). The owner may
        not have written anything yet — a blob completed before its record is erased after the trash retention unless
        the record keeps it. The node must be live, of a kind whose application stores an item of its own through the
        service (a kind whose blobs are all its owners' content completes them in its own record operation, ADR 0113:
        `node_not_found` here); every write states `nodeEpoch` (ADR 0109 point 6).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationBlobCompleteRequest" }
            example:
              nodeEpoch: 0
              id: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
              ownerId: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c
              role: EXPENSES_RECEIPT
              uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
      responses:
        "200":
          description: The blob is stored; the node's item revision moved once for it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationBlob" }
        "400":
          description: Malformed request (`invalid_request`), or the upload failed declare-then-verify (`budget_exceeded`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: budget_exceeded } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: >
            `scope_not_found` — no such scope, or the caller holds no grant for it (indistinguishable,
            uc.spaces.scope-access); `node_not_found` — no live node of that id in it whose application stores blobs
            through the service (a trashed one included); `upload_not_found` — no open upload of this caller under
            `uploadId` (never started, already completed, or expired).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: upload_not_found } }
        "409":
          description: >
            `id_taken` — `id` is taken, or the application refuses the owner in this node. `too_many_blobs` — the owner
            holds the application's count of unreleased blobs already. `stale_epoch` — `nodeEpoch` is below the node's
            stored epoch (re-read); `node_rekey_pending` — the node is not re-keyed since the last rotation (retry; ADR
            0109 point 6) — the upload stays open for all four. `scope_deleting` — the space is being deleted and
            read-only.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: id_taken } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            The upload was not started for this node in this role, or the role is none the node's application stores
            through the service (`upload_mismatch`: its wrap would not open here), or the node's application is switched
            off for the instance or the tenant (`capability_disabled`, uc.platform.switch-application-off).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: upload_mismatch } }
        "451":
          description: >
            A moderator blocked this node, a node above it, or the owner the blob is for (`blocked_by_operator`,
            uc.moderation.take-a-measure): no blob is stored while the block stands. The upload stays open.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: blocked_by_operator } }

  /api/scopes/{scopeId}/nodes/{nodeId}/application-blobs/rekey:
    get:
      tags: [application-blobs]
      operationId: listApplicationBlobRekey
      summary: One page of the `K_blob` wraps a node's re-key re-wraps among its application blobs (ADR 0109 point 2, ADR 0113).
      description: >
        Every blob of the node its application stores through core's blob service — in either form, kept, released or
        never kept, live or trashed node alike — whose `K_blob` is wrapped under the node's key, each with its role and
        the `ownerId` its wrap is bound to (`blob-key`: the node for an item of its own, the owner for an owner's
        content, ADR 0113 decision 3). A re-keyer opens each wrap with the old key under that binding, re-wraps it under
        the new one and stages it through core's `stageNodeRekey`; `commitNodeRekey` refuses a commit that misses one of
        them (`rekey_parts_missing`). A row a `WRITE_ONLY` guest wrote under its own `K_up` is not listed: the re-key
        leaves it as it is (ADR 0109 point 5). Ordered by blob id; **pages** of at most `limit`, `more: true` while rows
        remain — ask again with the page's `cursor` as `after`. The caller's rights are `getNodeRekeyParts`'s. Nothing
        here is new to the server.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/ApplicationBlobsAfter"
        - $ref: "_common.openapi.yaml#/components/parameters/ItemsLimit"
      responses:
        "200":
          description: One page of the node's application-blob wraps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationBlobRekeyPage" }
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            The caller may not re-key the node — its grant lags (`grant_behind`), or the node is one only an owner
            re-keys (core's `RekeyNode.ownerOnly`) and the caller is no owner (`not_scope_owner`) — or the tenant is
            suspended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }

  /api/shares/{shareId}/nodes/{nodeId}/application-blobs:
    get:
      tags: [share-application-blobs]
      operationId: listShareApplicationBlobs
      summary: A node's application blobs under a share (unauthenticated) — sealed, and without who completed them.
      description: >
        **No auth.** A guest's `listApplicationBlobs`: every application blob of one live node of the live shared subtree
        in a role that is an item of its own, with its blob reference, its `K_blob` wrap and its sealed `blob-meta`, its owner and role, its kept and released
        times, when the purge erases it and whether a moderator blocked its bytes — and **no writer** (inbox #190): the
        guest's schema has no such field. Its bytes are core's `resolveShareBlob` by `blobId` (a blocked one answers
        `451 blocked_by_operator`). Core's guest gate runs first (`ShareGuestGate`): an active share → the password → the
        access mode. A `WRITE_ONLY` link reads none. A node outside the live subtree — trashed, moved out, none —
        answers the same `404` as an unknown share. **Password-protected shares (ADR 0037):** the valid
        `X-Share-Password` token is required — a missing token is `404`, a wrong one `403 share_password_incorrect`.
        Pages and the `ETag` digest as `listApplicationBlobs`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SharePassword"
        - $ref: "#/components/parameters/ApplicationBlobsAfter"
        - $ref: "_common.openapi.yaml#/components/parameters/ItemsLimit"
        - $ref: "#/components/parameters/ApplicationBlobsIfNoneMatch"
      responses:
        "200":
          description: One page of the node's application blobs.
          headers:
            ETag: { $ref: "#/components/headers/ApplicationBlobsETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareApplicationBlobPage" }
        "304":
          description: Not Modified — `If-None-Match` equals the digest of what this read would serve; no body.
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share is password-protected and the presented `X-Share-Password` token is wrong.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_password_incorrect } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), a required password token absent, or no live node of that id inside the live shared subtree whose application stores blobs through the service — non-enumerable, identical in every case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "429":
          description: Too many wrong password attempts on this share (the password gate's own limiter).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }
    post:
      tags: [share-application-blobs]
      operationId: completeShareApplicationBlob
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: nodeEpoch
      summary: Complete a guest's upload as one of a shared node's application blobs (unauthenticated) — a `READ_WRITE` guest's write.
      description: >
        **No auth.** A `READ_WRITE` guest's `completeApplicationBlob`: promote one session it opened with
        `startShareBlobUploads` (`ownerId` = `nodeId` = this node, in a role the node's application lets a guest add)
        into an application blob, with the same rules. Core's guest gate runs first (`ShareGuestGate`): an active share
        → the password → a mode that writes → a valid `contributorToken`; it spends the per-share upload budget. The node
        must be a live node inside the share's subtree, checked again in the write, under the scope lock, with the link: a
        node trashed or moved out of the subtree since, or a link revoked or deleted since, refuses it
        (`upload_not_found`). The blob is stamped with the guest's identity — the per-link storage limit counts its bytes
        (ADR 0073 §4) — and recorded as one guest write (ADR 0093 § 10). A guest takes no blob back at once: its owner
        releases it, and the purge erases it after the trash retention. **Password-protected shares (ADR 0037):** no
        `X-Share-Password` → non-enumerable `404`; a wrong token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SharePassword"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareApplicationBlobCompleteRequest" }
            example:
              nodeEpoch: 0
              contributorToken: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
              id: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
              ownerId: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c
              role: EXPENSES_RECEIPT
              uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
      responses:
        "200":
          description: The blob is stored; the node's item revision moved once for it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareApplicationBlob" }
        "400":
          description: Malformed request (`invalid_request`), or the upload failed declare-then-verify (`budget_exceeded`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: budget_exceeded } }
        "403":
          description: >
            The share does not write (`READ`), the contributor token is invalid, or the root is in the trash
            (`share_not_contributable`); or it is password-protected and the `X-Share-Password` token is wrong
            (`share_password_incorrect`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: >
            No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended
            (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given —
            non-enumerable (`share_not_found`); no live node of that id inside the share's live subtree whose application
            stores blobs through the service (`node_not_found`); or no open upload of this guest under `uploadId` — never
            started, already completed, expired, or refused by the write's re-check (`upload_not_found`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            `id_taken` — `id` is taken, or the application refuses the owner in this node. `too_many_blobs` — the owner
            holds the application's count of unreleased blobs already. `stale_epoch` / `node_rekey_pending` — the node's
            key epoch (ADR 0109 point 6); the upload stays open.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: id_taken } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            The upload was not started for this node in this role, or the role is none the node's application lets a guest
            add (`upload_mismatch`), or the node's application is switched off for the instance or the tenant
            (`capability_disabled`, uc.platform.switch-application-off).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: upload_mismatch } }
        "429":
          description: Too many wrong password attempts on this share, or its upload budget is spent for the current window (per-share rate limit).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }
        "451":
          description: >
            A moderator blocked this node, a node above it, or the owner the blob is for (`blocked_by_operator`,
            uc.moderation.take-a-measure): no blob is stored while the block stands. The upload stays open.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: blocked_by_operator } }

  /api/moderation/cases/{caseId}/application-blobs:
    get:
      tags: [case-application-blobs]
      operationId: listCaseApplicationBlobs
      summary: A moderator's review of a case's application blobs — the held blobs in the guest's shape, with their node.
      description: >
        An application's moderation view reads this beside its own case read (uc.moderation.review-a-case): every
        application blob in a role that is an item of its own the case's hold copied (an owner's content is read in its
        application's case read, ADR 0113) — every blob of a reported owner (Expenses: an entry's receipts), a
        reported blob on its own, or every blob of every node under a reported node — with its held blob row, from the
        snapshot only, so it answers after the blobs, their node or the space were deleted. The moderator opens each with
        the `K_blob` the report share hands over, or with the node's key a node's report hands over; its bytes are core's
        `presignCaseBlobs`. No writer, as for a guest. `404 nothing_held` once the hold ended. Behind the `MODERATOR` role
        and a key proof over this case — core's moderation gate, never a guest's.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The held application blobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseApplicationBlobListing" }
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The key proof failed, or the caller is no moderator (`moderation_proof_invalid`, `not_moderator`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_proof_invalid } }
        "404":
          description: "`case_not_found`, or `nothing_held` = the case's hold has ended."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: nothing_held } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope the blob lives in.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node whose application stores the blobs (Expenses' `EXPENSES_POT`).
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
    ShareId:
      name: shareId
      in: path
      required: true
      description: The opaque 256-bit share id (base64url, unguessable) — half the capability; the other half is the fragment key.
      schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i }
    SharePassword:
      name: X-Share-Password
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The password token `base64(Argon2id(password, pwSalt))` for a password-protected share (cr-0118, ADR 0037).
        Omit for a share with no password; a locked resolve then returns only `passwordRequired` + `pwSalt` so the
        client can prompt and retry with this header.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    CaseId:
      name: caseId
      in: path
      required: true
      description: The case's id — bound into every key proof made for it.
      schema: { type: string, format: uuid, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
    ModerationChallenge:
      name: X-Veyq-Moderation-Challenge
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The challenge `createModerationChallenge` issued, as it returned it. Declared optional so a call without the
        proof reaches the gate and gets its `403 moderation_proof_invalid`; the gate is what requires it.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    ModerationSignature:
      name: X-Veyq-Moderation-Signature
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        Ed25519 signature with the current epoch's moderation signing key over `moderation-proof` (the challenge, this
        operation's `operationId`, the case id in the path or none), standard base64.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    ApplicationBlobsAfter:
      name: after
      x-veyq-visibility: structure
      in: query
      required: false
      description: The `cursor` of the page before — its last blob's id; the answer continues with the blobs past it. Omitted => from the beginning.
      schema: { type: string, format: uuid, example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f }
    ApplicationBlobsIfNoneMatch:
      name: If-None-Match
      x-veyq-visibility: structure
      in: header
      required: false
      description: >
        The `ETag` of the last first page of this read. When it equals the digest of what the read would serve now,
        `304`. Ignored on a later page (`after` given).
      schema: { type: string, maxLength: 80, example: "\"2a9b1d4a6e8b2c1f2a9b1d4a6e8b2c1f\"" }
  headers:
    ApplicationBlobsETag:
      x-veyq-visibility: structure
      description: >
        On a read without `after`: a digest of everything the read serves, every page of it — echo it as `If-None-Match`
        on the next poll. Absent on a later page.
      schema: { type: string, example: "\"2a9b1d4a6e8b2c1f2a9b1d4a6e8b2c1f\"" }

  schemas:
    # --- start uploads -------------------------------------------------------
    BlobUploadsBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/BlobUploadRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    BlobUploadRequestItem:
      type: object
      required: [blobId, ownerId, role, chunkCount, byteSize, wrappedBlobKey]
      properties:
        blobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of this blob (ADR 0072 Decision 3) — its `wrappedBlobKey` is sealed bound to it, so the blob is stored under exactly this id. Taken ⇒ this item fails `id_taken`.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        ownerId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            What the blob belongs to — the client-minted id of the application's object the completion attaches it to (an object of its own, or the node itself). The `wrappedBlobKey` is sealed bound to it; completion checks it.
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        role:
          $ref: "#/components/schemas/BlobRole"
          # The generator inlines the scalar `BlobRole` as a String and emits none of its bounds: the token's shape
          # holds here, 400 before the handler; a role no application declares is the handler's `400 invalid_request`
          # (core's `MemberBlobRoles`), and which roles the application attaches is its completion's question.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: >
            Number of ciphertext chunks the blob is sealed into. Not a free choice: it is derived from `byteSize`
            by the contract's frame size (`chunk_frame_size` in `contracts/crypto/vectors/v1.json`, ADR 0013 §3) —
            every frame but the last is full, so `chunkCount = ⌈byteSize / (nonceBytes + plaintextBytes +
            tagBytes)⌉` — and any other value is refused per item (`shape_invalid`). No maximum of its own: the
            ceiling is the server's per-blob byte cap.
          minimum: 1
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            Total ciphertext byte size declared up front — the sum of the blob's sealed frames. It fixes the blob's
            shape (`chunk_frame_size` in the crypto vectors): `chunkCount` and every chunk's exact length follow
            from it, and a size no frame sequence has — under one empty frame (28), or whose last frame of several
            would carry no plaintext — is refused per item (`shape_invalid`). Verified on complete: every chunk
            must be present at exactly its derived length.
          minimum: 28
          example: 400000
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(28)'
        wrappedBlobKey:
          type: string
          description: The blob's random `K_blob` wrapped under the content key of the node its owner sits on, ADR 0012 (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedBlobMeta:
          type: string
          description: >
            Optional, client-supplied: the blob's metadata (its type, the name it was uploaded under, its modification
            time) sealed under the blob's own `K_blob` — the purpose-only `blob-meta` seal, because that key is the
            binding ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md) Decision 2). Opaque base64 to
            the server, which never reads it: it is stored write-once with the blob and served back unchanged
            wherever the blob's `wrappedBlobKey` is; no operation changes it. Absent ⇒ the blob carries none.
          contentEncoding: base64
          minLength: 1
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    BlobUploadsBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BlobUploadResultItem" }

    BlobUploadResultItem:
      type: object
      description: One per request item, in order. Success carries `uploadId` + `presignedPuts`; failure carries `error`.
      properties:
        uploadId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The opaque upload session id, on success.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        presignedPuts:
          type: [array, "null"]
          description: >
            Presigned PUT URLs for the blob's **first window** of chunks only (chunks `0` to `min(window,
            chunkCount) - 1`, in chunk order); every later chunk is signed by `presignBlobUploadWindows`. Each is
            signed for its chunk's exact `Content-Length` (full frames, then the remainder), so the store refuses a
            body of any other length.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Per-item error code (`budget_exceeded` = the declared `byteSize` is over the per-blob cap or over its role's own cap — Expenses' `EXPENSES_RECEIPT` at 10 MiB of plaintext, see `BlobRole` —, `shape_invalid` = the declared `chunkCount`/`byteSize` is no shape the frame size allows — a client bug, not a large file, `id_taken` = the `blobId` already exists, `quota_exceeded` = the request's admissible items together do not fit the tenant's storage quota, so every one of them is refused and no session is opened — no retry can help (ADR 0073 §5–§6), `store_unavailable`); null on success.
          maxLength: 64
          example: null

    # --- next upload window --------------------------------------------------
    BlobUploadWindowsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/BlobUploadWindowRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    BlobUploadWindowRequestItem:
      type: object
      required: [uploadId, fromChunk]
      properties:
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The open upload session, as `startBlobUploads` returned it.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        fromChunk:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          format: int32
          description: The first chunk index (0-based) of the window to sign; it must lie inside the blob.
          minimum: 0
          example: 64
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'

    BlobUploadWindowsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BlobUploadWindowResultItem" }

    BlobUploadWindowResultItem:
      type: object
      description: One per request item, in order. Success carries `presignedPuts`; failure carries `error`.
      properties:
        presignedPuts:
          type: [array, "null"]
          description: >
            Presigned PUT URLs for chunks `fromChunk` to `min(fromChunk + window, chunkCount) - 1`, in chunk order,
            each signed for its chunk's exact `Content-Length`.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            Per-item error code; null on success. `upload_not_found` = no such session, it is no longer open, or
            the caller did not open it — one code for all three, so a probe learns nothing. `range_invalid` =
            `fromChunk` lies outside the blob. `store_unavailable` = the configured store cannot presign.
          maxLength: 64
          example: null

    BlobRole:
      $ref: '_common.openapi.yaml#/components/schemas/BlobRole'

    # --- presign downloads ---------------------------------------------------
    BlobDownloadsBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/BlobDownloadRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256)'

    BlobDownloadRequestItem:
      type: object
      required: [blobId]
      properties:
        blobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a

    BlobDownloadsBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BlobDownloadResultItem" }

    BlobDownloadResultItem:
      type: object
      description: One per request item, in order. Success carries `presignedGets`; failure carries `error`.
      properties:
        presignedGets:
          type: [array, "null"]
          description: One presigned GET URL per chunk, in chunk order.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Per-item error code (`upload_not_found` = unknown blob, `store_unavailable`, `blocked_by_operator` = a moderator blocked its content — the per-item form of a byte read's `451`, uc.moderation.take-a-measure); null on success.
          maxLength: 64
          example: null

    # --- an application's stored blobs (ADR 0112) --------------------------------
    ApplicationBlobCompleteRequest:
      type: object
      required: [nodeEpoch, id, ownerId, role, uploadId]
      properties:
        nodeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            The node's epoch as the client read it: the blob's `K_blob` is wrapped under the node's key. Below the stored
            epoch is `409 stale_epoch`; a node not re-keyed since the last rotation is `409 node_rekey_pending` — ADR 0109
            point 6. The upload stays open for both.
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The application blob's id, minted by the client (ADR 0072 decision 3) — the id the application's own sealed records name it by (Expenses' receipt id).
          example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        ownerId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The application's record that holds the blob — opaque to the server, which stores and compares it and never resolves it (Expenses' entry, existing or about to be written).
          example: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c
        role:
          $ref: "#/components/schemas/BlobRole"
          # The scalar `BlobRole` generates a String with none of its bounds: the token's shape holds here, 400 before
          # the handler; a role the node's application does not store through the service is `upload_mismatch`.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The upload session opened by `startBlobUploads` for this node in this role.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
    ShareApplicationBlobCompleteRequest:
      type: object
      required: [nodeEpoch, contributorToken, id, ownerId, role, uploadId]
      properties:
        nodeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The node's epoch as the guest read it (ADR 0109 point 6), as for a member's completion.
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        contributorToken:
          x-veyq-visibility: token
          type: string
          description: The capability token from `createShareIdentity`.
          maxLength: 512
          example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The application blob's id, minted by the client (ADR 0072 decision 3).
          example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        ownerId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The application's record that holds the blob, as for a member's completion.
          example: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c
        role:
          $ref: "#/components/schemas/BlobRole"
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The upload session this guest opened with `startShareBlobUploads` for this node in this role.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c

    ApplicationBlob:
      type: object
      description: >
        One application blob of a MEMBER's read. The guest's has its own schema (`ShareApplicationBlob`): a field added
        here never reaches a link (inbox #190). What the client needs to open it: the blob (`presignBlobDownloads` by
        `blobId`), its `K_blob` under the node's key (bound to the blob, the node and its `role`) and its sealed
        `blob-meta` — the file's type and name, which the server never sees.
      required: [id, ownerId, role, blobId, chunkCount, byteSize, wrappedBlobKey, writer, createdAt, blockedByOperator]
      properties:
        id: { type: string, format: uuid, example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, x-veyq-visibility: id }
        ownerId: { type: string, format: uuid, example: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c, x-veyq-visibility: id }
        role: { $ref: "#/components/schemas/BlobRole" }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 1
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: The sealed (ciphertext) size; the plaintext size is this less the frames' overhead (28 bytes per chunk).
          example: 65536
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (server-recorded at completion; ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The blob's `K_blob` wrapped under the node's key (opaque base64) — re-wrapped by a re-key (`listApplicationBlobRekey`).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        wrappedBlobMeta:
          type: [string, "null"]
          description: The blob's sealed metadata as its upload declared it (the `blob-meta` seal under `K_blob`; opaque base64). Null when the upload declared none.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
        writer:
          x-veyq-visibility: structure
          type: string
          description: >
            Who completed it: `user:{userId}` (a member) or `share:{identityId}` (a link guest). Members only: the guest's
            read carries no such field.
          maxLength: 64
          example: "user:2a9b1d4a-6e8b-4c1f-8d3e-4a5b6c7c3f0e"
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the server stored it, to the millisecond.
          example: 2026-07-09T12:34:56.789Z
        keptAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When its owner last kept it (ADR 0112 decision 2: the application says so in its own write); null while no
            write kept it, and again once it was released by name — a blob released by name is never kept again.
          example: null
        releasedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When it was released: by name (Expenses: a revision's `droppedReceipts`; `keptAt` is then null, for good), or
            with its owner's end (Expenses: a tombstone; `keptAt` stays, and the owner's next keep — a restore — clears
            this). Null while it is not released.
          example: null
        purgeAfter:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When the purge erases it, **derived** at the resource boundary from the operator's trash retention
            (`veyq.node.trash.retention`) and never stored: its release plus the retention; else, while no write ever
            kept it, its own time plus the retention. Null while it is kept and not released.
          example: null
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: >
            A moderator blocked this blob, its owner or its node (uc.moderation.take-a-measure): its bytes answer
            `blocked_by_operator` and the client shows *Blocked by the operator* with no reason. Kept in the listing, not
            left out.
          example: false
    ApplicationBlobPage:
      type: object
      description: One page of a member's read of a node's application blobs, ordered by id.
      required: [blobs, more]
      properties:
        blobs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ApplicationBlob" }
        more:
          x-veyq-visibility: flag
          type: boolean
          description: Blobs remain past this page — ask again with this page's `cursor` as `after`.
          example: false
        cursor:
          x-veyq-visibility: structure
          type: [string, "null"]
          maxLength: 36
          description: The id of this page's last blob; null when the page carries none.
          example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f

    ApplicationBlobRekey:
      type: object
      description: One application blob's `K_blob` wrap as a re-key reads it.
      required: [blobId, role, ownerId, wrappedBlobKey]
      properties:
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        role: { $ref: "#/components/schemas/BlobRole" }
        ownerId:
          type: string
          format: uuid
          x-veyq-visibility: id
          description: >
            The id the wrap is bound to (`blob-key`'s `ownerId`): the node for a role that is an item of its own, the
            owner (Memories: the medium) for an owner's content (ADR 0113 decision 3).
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        wrappedBlobKey:
          type: string
          description: The blob's `K_blob` wrapped under the node's key (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
    ApplicationBlobRekeyPage:
      type: object
      description: One page of a node's application-blob wraps for its re-key, ordered by blob id.
      required: [blobs, more]
      properties:
        blobs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ApplicationBlobRekey" }
        more:
          x-veyq-visibility: flag
          type: boolean
          description: Rows remain past this page — ask again with this page's `cursor` as `after`.
          example: false
        cursor:
          x-veyq-visibility: structure
          type: [string, "null"]
          maxLength: 36
          description: The blob id of this page's last row; null when the page carries none.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a

    ShareApplicationBlob:
      type: object
      description: >
        One application blob of a GUEST's read: the member's without its writer (inbox #190) — a schema of its own so the
        member's can grow without reaching a guest.
      required: [id, ownerId, role, blobId, chunkCount, byteSize, wrappedBlobKey, createdAt, blockedByOperator]
      properties:
        id: { type: string, format: uuid, example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, x-veyq-visibility: id }
        ownerId: { type: string, format: uuid, example: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c, x-veyq-visibility: id }
        role: { $ref: "#/components/schemas/BlobRole" }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 1
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 65536
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The blob's `K_blob` wrapped under the node's key (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        wrappedBlobMeta:
          type: [string, "null"]
          description: The blob's sealed metadata (opaque base64); null when the upload declared none.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-09T12:34:56.789Z
        keptAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: As the member's `ApplicationBlob.keptAt`.
          example: null
        releasedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: As the member's `ApplicationBlob.releasedAt`.
          example: null
        purgeAfter:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the purge erases it, derived as the member's `ApplicationBlob.purgeAfter`; null while it is kept.
          example: null
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: A moderator blocked this blob, its owner or its node — its bytes answer `451 blocked_by_operator`.
          example: false
    ShareApplicationBlobPage:
      type: object
      description: One page of a guest's read of a node's application blobs, ordered by id.
      required: [blobs, more]
      properties:
        blobs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ShareApplicationBlob" }
        more:
          x-veyq-visibility: flag
          type: boolean
          description: Blobs remain past this page — ask again with this page's `cursor` as `after`.
          example: false
        cursor:
          x-veyq-visibility: structure
          type: [string, "null"]
          maxLength: 36
          description: The id of this page's last blob; null when the page carries none.
          example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f

    CaseApplicationBlob:
      type: object
      description: >
        One held application blob of a case, with the node it belongs to — the guest's shape (no writer), read from the
        hold's copy of its row and of its blob row. Its bytes are core's `presignCaseBlobs` by `blobId`.
      required: [nodeId, id, ownerId, role, blobId, chunkCount, byteSize, wrappedBlobKey, createdAt]
      properties:
        nodeId: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        id: { type: string, format: uuid, example: 8c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, x-veyq-visibility: id }
        ownerId: { type: string, format: uuid, example: 5e3b6c1a-2f4d-4a8e-9b7c-1d2e3f4a5b6c, x-veyq-visibility: id }
        role: { $ref: "#/components/schemas/BlobRole" }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 1
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 65536
        wrappedBlobKey:
          type: string
          description: The held `K_blob` wrap (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        wrappedBlobMeta:
          type: [string, "null"]
          description: The held blob's sealed metadata (opaque base64), or null.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-09T12:34:56.789Z
        keptAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          example: null
        releasedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          example: null
    CaseApplicationBlobListing:
      type: object
      required: [blobs]
      properties:
        blobs:
          type: array
          description: Every application blob the hold copied, ordered by node and id.
          items: { $ref: "#/components/schemas/CaseApplicationBlob" }

