openapi: 3.1.0
info:
  title: veyq Item Favorites API
  version: 0.1.0
  description: >
    The Memories application's **item marks** (en.memory.favorites, [ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md)):
    the marks on media inside one Memory, an opaque blob sealed client-side per member, stored verbatim by the
    server. (The member's private node *pins* are core's: `favorites.openapi.yaml`.) **Operator-blind:** the
    server never sees which items are marked, only ciphertext + its size. Authorization is enforced by code, not
    this spec (ADR 0008); field validation via `x-field-extra-annotation`.
tags:
  - name: item-favorites
    description: >
      The **per-(member, scope, node) item marks** — the set of marked `veyq_media` ids inside one Memory,
      sealed client-side under a value key of its own, which the scope key `K_SC` wraps, and stored as one opaque
      blob per member
      (en.memory.favorites, [ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md)).
      Deliberately **shared and member-attributed**, unlike the core `favorites` pin: the read returns **every**
      member's blob for that node so the client can render *everyone's / only mine* and a per-item count. The
      write carries no member id — a caller can only replace their own. Partitioned **per node** because the
      server has already observed that node id (the client just listed its media), so the partition adds no
      metadata; a scope-wide set would instead be capped and would re-upload on every toggle. Operator-blind:
      the server never sees *which* items are marked, only opaque ciphertext + its size.
  - name: own-item-favorites
    description: >
      The caller's **own** item-mark blobs across every scope (`/api/item-favorites`) — the same rows the
      `item-favorites` resource serves per node, read account-wide for an account-key rotation's re-tag
      ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). A tag of its own because
      one tag is one resource interface with one root path: under `item-favorites` the generated interface's
      root would widen to `/api`, and the per-node routes would then lose to the `/api/scopes` resources.

  - name: item-favorites-rekey
    description: >
      The item marks' value keys of a whole scope for a rotation's re-wrap ([ADR 0115](../../../docs/decisions/0115-a-scope-key-is-replaced-never-chained.md) decision 2): the Memories
      application's part of core's scope re-key stage, under the re-key id `rotateScope` names. A tag of its own so its
      resource owns the `/api/scopes/{scopeId}/item-favorites-rekey` subtree and no root path of another resource
      widens.

paths:
  /api/scopes/{scopeId}/nodes/{nodeId}/item-favorites:
    get:
      tags: [item-favorites]
      operationId: getItemFavorites
      summary: Get every member's sealed item-mark blob for the node.
      description: >
        Returns one entry per member who has ever stored item marks for this node — the caller's own included
        and flagged `self`, and an empty array when nobody has. Each entry's ciphertext is the sealed set of
        marked media ids under its own value key, which the client opens from the entry's wrap with the scope key
        `K_SC`; the operator sees only opaque blobs. Entries carry
        **no member id**: the array separates the members, and the count of an item is how many entries hold it,
        so nothing needs a name. This read is deliberately **not** filtered to the caller: it is what lets the client render *everyone's favorites* and a per-item
        count without the blind server aggregating for it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Every member's item-mark blob for the node (empty when none stored).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemFavoritesEntry" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [item-favorites]
      operationId: putItemFavorites
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the row is keyed by the caller, the scope and the node, so only the marking member
          writes it; the loss is one toggle between that member's own devices (ADR 0068). A toggle never
          starts from a set it has not loaded (ADR 0077 point 5).
      summary: Replace the caller's sealed item-mark blob for the node.
      description: >
        Upserts the **caller's own** item marks for this node (last-write-wins). The body carries no member id,
        so a caller cannot address another member's blob — the identity comes from the token. The client seals
        the whole marked set for this node under a fresh value key `K_v`, wraps `K_v` under the scope key `K_SC`
        ([ADR 0115](../../../docs/decisions/0115-a-scope-key-is-replaced-never-chained.md)) and PUTs both with the epoch of the wrap (`epoch`); the server stores them verbatim only
        while that is the scope's current epoch (`409 stale_epoch`, ADR 0115 decision 3): a rotation re-wraps every
        row's value key under the one key, so none may land under an older one — and never rewrites a row, so no
        rotator can rewrite another member's marks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutItemFavoritesRequest" }
            example: { ciphertext: aXRlbS1mYXZvcml0ZXMtY2lwaGVy, wrappedValueKey: d3JhcHBlZC12YWx1ZS1rZXk=, epoch: 0 }
      responses:
        "204":
          description: The item-mark blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: >
            `epoch` is not the scope's current epoch (`stale_epoch` — the scope key was replaced since; re-open it and
            re-seal, ADR 0115 decision 3), or the space is being deleted and read-only (`scope_deleting`). Nothing is
            written.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/item-favorites-rekey:
    get:
      tags: [item-favorites-rekey]
      operationId: listScopeItemFavoritesRekey
      summary: One page of the scope's item-mark rows' value keys, every member's, for a rotation to re-wrap (ADR 0115 decision 2).
      description: >
        Every item-mark row of the scope — every member's, on every node, trashed ones included — with its value key's
        wrap as stored, never its ciphertext: a rotation re-wraps keys and never rewrites a value. The rotating client
        opens each wrap with the current scope key, wraps the same `K_v` under the one it minted (one it cannot open
        under a key it drops, so the row reads as unreadable) and stages it (`stageScopeItemFavoritesRekey`); core's
        `rotateScope` swaps it in through Memories' scope re-key participant, fail closed. A row is addressed by an opaque `markId`, **never** a
        member id: the rows stay as unattributed as the node's read serves them (ADR 0068 §9). Paged by `since` /
        `limit` / `more`. The caller's rights are core's `listScopeRekeyParts`'s.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - name: since
          in: query
          # An empty value (`?since=`) is this parameter's absence: Quarkus REST never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: The `cursor` the last page answered, echoed verbatim; omitted on the first page.
          schema: { type: string, maxLength: 80, example: "2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e" }
        - name: limit
          in: query
          # An empty value (`?limit=`) is this parameter's absence, as for `since` (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: The most rows one page carries — the stage's cap. Absent => 256.
          schema: { type: integer, format: int32, minimum: 1, maximum: 256, default: 256, example: 256 }
      responses:
        "200":
          description: One page of the scope's item-mark rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeItemFavoritesRekeyPage" }
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            The caller may not commit the scope's rotation (`not_scope_owner`, core's `rotateScope` rule), its grant lags
            the current epoch (`grant_behind`), or the tenant is suspended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
  /api/scopes/{scopeId}/item-favorites-rekey/{rekeyId}:
    post:
      tags: [item-favorites-rekey]
      operationId: stageScopeItemFavoritesRekey
      summary: Stage one batch of re-wrapped item-mark value keys under a rotation's re-key id (ADR 0115 decision 2).
      description: >
        Up to 256 rows a call, each row's `K_v` wrapped under the key of epoch `fromEpoch + 1`, under the re-key id
        core's `rotateScope` then names. **Wraps only:** the stage has no field for a row's ciphertext, a field it does
        not name is `400 invalid_request`, and the commit refuses a staged write to one (`422 rekey_writes_value`). Each
        wrap names the wrap it replaces (`replacedValueKey`): a row the member replaced since the read (every write mints
        a fresh `K_v`) is the commit's `409 rekey_parts_stale` (ADR 0115 decision 2); a row with no staged wrap is the
        commit's `rekey_parts_missing`. A value staged twice is replaced; nothing staged is served before the commit,
        and an unclaimed stage expires after a day. The caller's rights are `listScopeItemFavoritesRekey`'s.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/RekeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeItemFavoritesRekeyStage" }
      responses:
        "204":
          description: The batch is staged.
        "400":
          description: Malformed request (a list over 256 entries, a malformed value, a field the stage does not name).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: As `listScopeItemFavoritesRekey` (`not_scope_owner`, `grant_behind`, or the tenant is suspended).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: grant_behind } }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: >
            The scope's current epoch is no longer `fromEpoch` (`stale_epoch` — a rotation committed since; re-read and
            rebuild from a fresh key), or the space is being deleted and read-only (`scope_deleting`). Nothing of the
            batch is staged.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/item-favorites:
    get:
      tags: [own-item-favorites]
      operationId: listOwnItemFavorites
      summary: List the caller's own sealed item-mark blobs, across every scope they are an accepted member of.
      description: >
        Returns the **caller's own** item-mark rows — never a co-member's — for every scope the caller is an accepted
        member of whose tenant is not suspended; a row of a scope the caller has left, or only been proposed to, is
        left out. It is what an account-key rotation re-tags: the self-tag inside each blob derives from the Master
        Key, so an account-key rotation re-seals the caller's marks under a fresh value key with the new tag
        ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). The server already holds
        exactly these rows under the caller's id, so this read tells it nothing; it is a hint, not a proof — the
        client re-tags only a blob whose tag verifies under its old key. A filter, not an answer: a scope it may
        not show is left out, never refused.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own item-mark blobs (empty when none stored).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnItemFavoritesEntry" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
    RekeyId:
      name: rekeyId
      in: path
      required: true
      description: The client-minted id of a rotation's scope re-key stage — core's `rotateScope` names it as `rekeyId`.
      schema: { type: string, format: uuid, example: 6c7c3f0e-2a9b-1d4a-6e8b-2c1f2d3e4a5b }

  schemas:
    ItemFavoritesEntry:
      type: object
      required: [self, ciphertext, wrappedValueKey]
      properties:
        self:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True on the caller's own blob — the server's claim of WHICH ROW is the caller's, which the client
            checks against the self-tag inside the plaintext: an entry counts as the caller's own only when it is
            flagged here AND its tag verifies under the caller's Master-Key-derived key
            ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). This is the ONLY
            identity on the wire, and deliberately so: the array already separates the members, and an item's count
            is simply how many entries contain its id — so no member id is needed to render "everyone's / only
            mine" or the aggregate. Leaving it out makes the aggregate-only rule a property of the DATA rather than
            a convention the UI is trusted to keep: a client cannot attribute a mark to a named member because it
            was never told who.
          example: true
        ciphertext:
          type: string
          description: That member's marked media ids for this node beside their self-tag — `tag ‖ ids`, each id its 16 raw bytes (v1.json#item_mark_self) — AEAD-sealed under the row's own value key (`wrappedValueKey`; a rotation re-wraps it and leaves this, ADR 0115), context `item-favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 262144
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy
        wrappedValueKey:
          type: string
          description: The row's value key wrapped under the scope key of its current epoch (`value-key`, bound to the scope, that epoch and the row's address).
          contentEncoding: base64
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=

    PutItemFavoritesRequest:
      type: object
      required: [ciphertext, wrappedValueKey, epoch]
      properties:
        epoch:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          description: The scope epoch whose key wraps `ciphertext`'s value key — the scope's current one, else `409 stale_epoch` (ADR 0115 decision 3).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        ciphertext:
          type: string
          description: The caller's marked media ids for this node beside their self-tag — `tag ‖ ids`, each id its 16 raw bytes (v1.json#item_mark_self) — AEAD-sealed under a fresh value key `K_v` (ADR 0115), context `item-favorites` (opaque base64). No member id — the caller can only replace their own blob.
          contentEncoding: base64
          maxLength: 262144
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 262144) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedValueKey:
          type: string
          description: The row's `K_v` wrapped under the scope key of `epoch` (seal purpose `value-key`, bound to the scope, that epoch and the row's address).
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    OwnItemFavoritesEntry:
      type: object
      required: [scopeId, nodeId, ciphertext, wrappedValueKey]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The scope the row is stored under.
          example: 7b1f0c2e-3d4a-4b5c-8d6e-9f0a1b2c3d4e
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The Memory the row's marks are in.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        ciphertext:
          type: string
          description: The caller's own marked media ids for that node beside their self-tag — `tag ‖ ids`, each id its 16 raw bytes (v1.json#item_mark_self) — AEAD-sealed under the row's own value key, context `item-favorites` (opaque base64) — exactly what the node's read serves as the caller's entry.
          contentEncoding: base64
          maxLength: 262144
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy
        wrappedValueKey:
          type: string
          description: The row's value key wrapped under the scope key of its current epoch, as `ItemFavoritesEntry.wrappedValueKey`.
          contentEncoding: base64
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=

    ScopeItemFavoritesRekeyPage:
      type: object
      required: [currentEpoch, marks, more]
      properties:
        currentEpoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope's current epoch — every wrap here is under its key.
          minimum: 0
          example: 0
        marks:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ItemFavoritesRekeyRow" }
        more:
          x-veyq-visibility: flag
          type: boolean
          description: Rows remain past this page; ask again with this page's `cursor` as `since`.
          example: false
        cursor:
          x-veyq-visibility: structure
          type: [string, "null"]
          maxLength: 80
          description: The position of this page's last row, opaque to the client; null when the page carries no row.
          example: null

    ItemFavoritesRekeyRow:
      type: object
      required: [markId, nodeId, wrappedValueKey]
      properties:
        markId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The row's own opaque id — never the member's, so the rotator can no more attribute a mark than the node's
            read lets it (ADR 0068 §9).
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The Memory the row's marks are in — with the scope, the row's address (`item-favorites` binds both).
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        wrappedValueKey:
          type: string
          description: The row's value key as stored — under the scope key of `currentEpoch` (`value-key`), as `ItemFavoritesEntry.wrappedValueKey`.
          contentEncoding: base64
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=

    ScopeItemFavoritesRekeyStage:
      type: object
      required: [fromEpoch]
      additionalProperties: false
      x-class-extra-annotation: '@me.raddatz.veyq.core.http.UnknownFieldsRefused'
      properties:
        fromEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The scope's current epoch as the rotator read it (`ScopeItemFavoritesRekeyPage.currentEpoch`).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        marks:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ItemFavoritesRekeyWrap" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.Size(max = 256)'

    ItemFavoritesRekeyWrap:
      type: object
      required: [markId, wrappedValueKey, replacedValueKey]
      additionalProperties: false
      x-class-extra-annotation: '@me.raddatz.veyq.core.http.UnknownFieldsRefused'
      properties:
        markId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        wrappedValueKey:
          type: string
          description: >
            The row's same `K_v` under the new scope key (`value-key`, bound to the scope, the new epoch and the row's
            address), or a stand-in under a key the rotator drops at once for a wrap it could not open; the row's
            ciphertext stays byte-identical.
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: bmV3LXdyYXBwZWQtdmFsdWUta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        replacedValueKey:
          type: string
          description: >
            The row's `wrappedValueKey` it replaces, as `listScopeItemFavoritesRekey` served it. A row that holds another
            by the commit is `409 rekey_parts_stale`: a write since the read minted a fresh `K_v` (ADR 0115 decision 2).
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ErrorResponse:
      $ref: '../_common.openapi.yaml#/components/schemas/ErrorResponse'
