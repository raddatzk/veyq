openapi: 3.1.0
info:
  title: veyq Share Media API
  version: 0.1.0
  description: >
    The Memories application's guest operations on a public share link
    ([ADR 0029](../../../docs/decisions/0029-public-viewer-share.md),
    [ADR 0030](../../../docs/decisions/0030-contributor-public-share.md),
    [ADR 0031](../../../docs/decisions/0031-uploader-public-share.md)): a guest of a `READ` or `READ_WRITE` link
    lists the media under the shared subtree; a guest of a `READ_WRITE` or `WRITE_ONLY` link completes the uploads it
    started through core's guest transport (`sharing.openapi.yaml` `startShareBlobUploads` /
    `presignShareBlobUploadWindows`) into media on the shared Memory, and deletes its own.
    The link itself — its id, password, access mode and guest identities — is core's (`sharing.openapi.yaml`); these
    operations sit under its `/api/shares/{shareId}` path and pass core's guest gate first (`ShareGuestGate`: an
    active share → the password → the mode → the guest's token → the per-share upload budget where the operation
    spends it), then do the application's work ([ADR 0079](../../../docs/decisions/0079-veyq-is-a-platform-memories-is-its-first-application.md)
    § Application guest operations).

    **No auth, operator-blind.** Every operation is anonymous: a guest holds no account, only the link (and, to
    write, the `contributorToken` its identity was issued). The server sees what core's resolve and guest transport
    already show it — the share id, the guest's identity id, opaque upload and media ids, sizes — serves only
    ciphertext, and attaches each medium to the shared root node itself (the guest names no node). Authorization is
    enforced by code (ADR 0008); field validation via `x-field-extra-annotation`.

tags:
  - name: share-media
    description: >
      A guest's media on a public share link — list the media under the shared subtree, complete an upload into a
      medium on the shared Memory, delete one's own (unauthenticated). One tag = one resource interface owning the `/api/shares/{shareId}/media` subtree:
      longer than core's `sharing` root `/api/shares`, so these routes reach this resource and every other
      `/api/shares` route stays core's.

paths:
  /api/shares/{shareId}/media:
    get:
      tags: [share-media]
      operationId: listShareMedia
      summary: List the media under a share (unauthenticated) → the sealed rows and the uploader keys that open them.
      description: >
        **No auth.** The Memories half of a guest's read of a link: core's `resolveShare` serves the link and the
        shared nodes with their keys, this serves what Memories attached under those nodes. Core's guest gate runs
        first (`ShareGuestGate`, ADR 0079): an active share → the password → the access mode. Returns every live
        medium under the live shared subtree (each tagged with its owning `nodeId`, so the viewer picks that node's
        content key) and the wrapped keys of the `WRITE_ONLY` identities whose rows those are — all still sealed;
        the viewer opens them **locally**. A `WRITE_ONLY` link is served **empty lists**: its guest sees nothing of
        the Memory (ADR 0031). A disabled, expired, or unknown share is a non-enumerable `404`.
        **Password-protected shares (cr-0118, ADR 0037):** the valid `X-Share-Password` token is required — a
        missing token is `404` (the password challenge is `resolveShare`'s locked response; this read has none to
        serve), a wrong one `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
      responses:
        "200":
          description: The sealed media under the shared subtree and the uploader keys that open them (both empty for a `WRITE_ONLY` link).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareMediaListing" }
        "403":
          description: The share is password-protected and the presented `X-Share-Password` token is wrong (cr-0118).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_password_incorrect } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or a required password token is absent — non-enumerable, identical in every case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
    post:
      tags: [share-media]
      operationId: completeShareMedia
      summary: Complete a guest upload (unauthenticated) — the application attaches it to the shared root node.
      description: >
        **No auth.** A guest's completion of its uploads into media on the shared Memory. Core's guest gate runs
        first (`ShareGuestGate`, ADR 0079) and spends the per-share upload budget. Gated on the share (exists + `enabled` + an access
        mode that lets a guest add) + a valid `contributorToken`. Each item is one of the application's objects
        (`mediaId`): the original upload + up to two role-tagged derivatives; the server verifies the stored objects
        (declare-then-verify + byte budget), records the blob(s), and attaches **one object to the shared root
        node** (`nodeId` of the share) **stamped with the guest's `identityId`** (direct-append). The
        guest is not told which node — the server uses the share's own node. Returns `{ blobId, mediaId }` or
        a per-item error.
        **Password-protected shares (cr-0164, ADR 0037):** the password gate fronts this endpoint — no
        `X-Share-Password` → non-enumerable `404`; a wrong token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareMediaBatchRequest" }
            example:
              contributorToken: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
              items:
                - mediaId: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
                  originalUploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  derivatives:
                    - kind: THUMBNAIL
                      uploadId: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                    - kind: PREVIEW
                      uploadId: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
      responses:
        "200":
          description: Per-item completion results (success carries the blob id and the object's `mediaId`; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareMediaBatchResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share does not allow contributions or the contributor token is invalid (`share_not_contributable`), or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`, cr-0164).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given (cr-0164) — non-enumerable.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }

  /api/shares/{shareId}/media/{mediaId}:
    delete:
      tags: [share-media]
      operationId: deleteShareMedia
      summary: Delete your own contribution (unauthenticated) — a guest removes one of their uploads.
      description: >
        **No auth.** Lets an anonymous guest remove **one of their own** contributions this session
        (the `WRITE_ONLY` drop-box, cr-0102, [ADR 0031](../../../docs/decisions/0031-uploader-public-share.md); also a
        `READ_WRITE`). Core's guest gate runs first (`ShareGuestGate`, ADR 0079) and spends no upload budget. The
        `contributorToken` rides the **`X-Contributor-Token`** header (no body on DELETE). Gated
        on the share (exists + `enabled` + role ∈ {READ_WRITE, WRITE_ONLY}) + a valid token; the server deletes the
        object (and its derivatives, and puts all their blob objects on the reclaim list) **iff** its `share_identity_id`
        equals the token's identity — a single-row **ownership** check, never a filtered listing. `404` for any other
        id (a foreign or unknown one is indistinguishable from a missing one). Idempotent-safe: a second
        delete of the same id is `404`.
        **Password-protected shares (cr-0164, ADR 0037):** the password gate fronts this endpoint — no
        `X-Share-Password` → non-enumerable `404`; a wrong token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/SharePassword"
        - name: X-Contributor-Token
          x-veyq-visibility: token
          in: header
          required: true
          description: The opaque `contributorToken` from `createShareIdentity` — proves this caller owns the contribution being deleted.
          schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl }
      responses:
        "204":
          description: Deleted (the contribution, its derivatives, and its blobs are gone).
        "403":
          description: The share does not allow contributions or the contributor token is invalid (`share_not_contributable`), or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`, cr-0164).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such contribution under this share owned by this identity, or a password-protected share with no `X-Share-Password` token given (cr-0164) — also covers a disabled/expired/unknown share and one whose space is being deleted or its tenant suspended (uc.spaces.scope-access A4), non-enumerable.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_media_not_found } }

components:
  parameters:
    ShareId:
      name: shareId
      in: path
      required: true
      description: The opaque 256-bit share id (base64url, unguessable) — half the capability; the other half is the fragment key.
      schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i }
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Opaque id of a contribution the caller made (deletable only if its `share_identity_id` matches the token's identity).
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    SharePassword:
      name: X-Share-Password
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The password token `base64(Argon2id(password, pwSalt))` for a password-protected share (cr-0118, ADR 0037).
        Omit for a share with no password; a locked resolve then returns only `passwordRequired` + `pwSalt` so the
        client can prompt and retry with this header.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }

  schemas:
    ShareMediaListing:
      type: object
      description: >
        What a guest is served of the Memory's media under a shared subtree. `identities` is everything a guest is
        told about any identity: never a name, never a `READ_WRITE` identity (ADR 0030 point 8).
      required: [media, identities]
      properties:
        media:
          type: array
          description: The live media attached under the live shared subtree, each tagged with its owning `nodeId`.
          items: { $ref: "#/components/schemas/ShareMedia" }
        identities:
          type: array
          description: >
            The anonymous identities a reader needs to open what it is served: every WRITE_ONLY identity — of any link
            of the Memory — with a row in `media`, each an opaque `identityId` and its wrapped identity key, without
            which that identity's rows cannot be opened (ADR 0031 point 7). No guest's name, and no READ_WRITE identity —
            not even this share's own, whatever its access mode is now: a guest's name is for the Memory's members, who
            read it through the bucket list (ADR 0030 point 8). The member list's `uploaderKeys` items, the same shape.
          items: { $ref: "./media.openapi.yaml#/components/schemas/UploaderKey" }

    ShareMedia:
      type: object
      description: >
        One medium under the shared subtree — the original blob ref + role-tagged derivatives, tagged with its owning
        `nodeId` so the viewer picks the right content key.
      required: [nodeId, mediaId, blobId, chunkCount, byteSize, wrappedBlobKey]
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The subtree node this medium is attached to (selects its content key).
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        mediaId: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e, x-veyq-visibility: id }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 2
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 131072
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The original blob's `K_blob` wrapped under the node's content key (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        derivatives:
          type: [array, "null"]
          description: Role-tagged derivative tiers (THUMBNAIL, PREVIEW), each its own blob ref with its own wrap.
          items: { $ref: "#/components/schemas/ShareMediaDerivative" }
        wrappedMeta:
          type: [string, "null"]
          description: The medium's sealed listed metadata, under the node's content key (opaque base64); null when unset.
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0
        identityId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The WRITE_ONLY identity that added this medium, whose wrapped key in `identities[]` opens it (ADR 0031
            point 7). Null for a member's medium and for a READ_WRITE guest's, which open under the node's content key —
            a guest is not told which uploads came from one person (ADR 0030 point 8).
          example: null

    ShareMediaDerivative:
      type: object
      description: A derivative tier's blob ref — same opaque metadata as the original, plus its role `kind`.
      required: [kind, blobId, chunkCount, byteSize, wrappedBlobKey]
      properties:
        kind:
          x-veyq-visibility: enum
          type: string
          enum: [THUMBNAIL, PREVIEW]
          example: THUMBNAIL
        blobId: { type: string, format: uuid, example: 8b2c1f2d-3e4a-5b6c-7c3f-0e2a9b1d4a6e, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 1
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 65536
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=

    ShareMediaBatchRequest:
      type: object
      required: [contributorToken, items]
      properties:
        contributorToken:
          x-veyq-visibility: token
          type: string
          description: The capability token from `createShareIdentity`.
          maxLength: 512
          example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ShareMediaRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    ShareMediaRequestItem:
      type: object
      description: One of the application's objects — the original upload + up to two role-tagged derivative uploads. Attaches to the share's own root node (no `nodeId` — the server uses the shared node).
      required: [mediaId, originalUploadId]
      properties:
        mediaId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the object (ADR 0072 Decision 3) — the `ownerId` each of its uploads was started with. Taken ⇒ `id_taken`.
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        originalUploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The upload session for the original (pristine) blob, opened by `startShareBlobUploads`.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        derivatives:
          type: [array, "null"]
          description: Role-tagged derivative uploads (THUMBNAIL, PREVIEW), each its own blob. At most one of each kind.
          maxItems: 2
          items: { $ref: "#/components/schemas/ShareMediaDerivativeUpload" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2)'
        wrappedMeta:
          type: [string, "null"]
          description: The application's sealed metadata of the object, under the shared node's content key (opaque base64; its format is the application's).
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedExif:
          type: [string, "null"]
          description: A second, larger sealed payload of the application's, under the shared node's content key (opaque base64; its format is the application's).
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16384) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ShareMediaDerivativeUpload:
      type: object
      required: [kind, uploadId]
      properties:
        kind:
          x-veyq-visibility: enum
          type: string
          enum: [THUMBNAIL, PREVIEW]
          example: THUMBNAIL
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e

    ShareMediaBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ShareMediaResultItem" }

    ShareMediaResultItem:
      type: object
      description: One per request item, in order. Success carries the original `blobId` + the object's `mediaId`; failure carries `error`.
      properties:
        blobId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        mediaId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Per-item error code (`upload_not_found`, `budget_exceeded` = a stored chunk is missing or not at exactly its derived length, and the item's staged objects are purged, `upload_mismatch` = an upload was not started for this `mediaId` in the role it is used in, `id_taken` = the `mediaId` already exists); null on success.
          maxLength: 64
          example: null
    ErrorResponse:
      $ref: '../_common.openapi.yaml#/components/schemas/ErrorResponse'
