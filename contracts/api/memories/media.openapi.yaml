openapi: 3.1.0
info:
  title: veyq Media API
  version: 0.1.0
  description: >
    Encrypted media **blobs** attached to a Memory tree (en.memory.media, cr-0028). A blob is a fixed-size
    sequence of **chunked-AEAD** ciphertext objects, sealed client-side under a fresh random **`K_blob`**
    (wrapped under the target Memory's `K_node`, [ADR 0012](../../../docs/decisions/0012-content-key-hierarchy.md)),
    transferred **direct-to-store** via short-TTL presigned URLs
    ([ADR 0013](../../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md)) — bytes never flow through
    the backend. The blob transfer itself — start, next windows, downloads — is core's (`../blob.openapi.yaml`,
    ADR 0079); this spec is what Memories makes of a blob: completing uploads into media attached to a node,
    listing, metadata, trash and buckets. The control plane is **batch-shaped** (lists + per-item results)
    from the start; the first slice exercises **length-1 lists**.

    **Operator-blind:** the server + object store hold only ciphertext chunks + opaque metadata
    (`chunkCount`, `byteSize`, the per-chunk size `manifest`), the `K_blob` wrap, and the media→node link; never
    a plaintext byte, a content key, or a filename in clear. Guards (enforced by code, ADR 0008): the caller
    holds a grant for the scope; a media target must be a **MEMORY** or **CHAPTER** (a FOLDER owns no `K_node`);
    declare-then-verify on `complete` enforces the byte budget against the stored objects. **No content dedup**
    ([ADR 0013 §5](../../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md#5-no-content-dedup)).
tags:
  - name: media
    description: >
      Encrypted media under a scope: complete uploads (started through core's `blob` resource) + attach to a
      node → list a node's media → read and update its sealed metadata, trash. One tag = one resource
      interface owning the media subtree under `/api/scopes/{scopeId}` (distinct from the `content` nodes
      resource and core's `blob` resource).
  - name: buckets
    description: >
      Per-uploader **buckets** within a Memory node — the attribution axis
      ([en.memory.buckets](../../../docs/features/memory/enablers/en.memory.buckets.md), ADR 0034). A lazy virtual
      **primary** bucket per uploader (keyed by an opaque `owner_key`) plus optional **one-level sub-buckets** with
      `K_node`-sealed names; media link via `bucketId` + a denormalized `createdBy`. Operator-blind — opaque
      `owner_key` + structure, sealed names, **own-bucket authz** (`owner_key == caller`). A distinct resource
      interface from `media`, sharing the node subtree.

paths:
  /api/scopes/{scopeId}/media-batch:
    post:
      tags: [media]
      operationId: completeMedia
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: items.nodeEpoch
      summary: Complete a media's uploads (original + derivatives) + attach to a node.
      description: >
        Each item is **one logical media**: an `originalUploadId` plus up to two role-tagged `derivatives`
        (THUMBNAIL, PREVIEW — generated client-side, [en.memory.derivatives](../../../docs/features/memory/enablers/en.memory.derivatives.md)).
        The server verifies **every** upload session of the item, **stats the stored chunk objects** per blob
        (declare-then-verify: every chunk must be present at exactly the length its declared `byteSize` derives,
        else the objects are purged and the item fails `budget_exceeded`), records one `blob` per upload (each
        with its own per-chunk size `manifest` and `K_blob` wrap), and one `media` row under the client-minted
        `mediaId` ([ADR 0072](../../../docs/decisions/0072-a-seal-binds-its-object.md)) linking the original blob to `nodeId` with a derivative row per derivative. Each
        upload must have been started for this media in the role it is used in — the original as `ORIGINAL`, each
        derivative as its `kind`, all with `ownerId = mediaId` — else the item fails `upload_mismatch`, since its
        `K_blob` wrap would not open where it is attached. A `mediaId` already taken, in any scope, fails the item
        `id_taken` (never overwritten, not idempotent). Returns `{ blobId (the original), mediaId }` — or a per-item
        error. The target node must be a **MEMORY** or **CHAPTER** (`illegal_target` on a FOLDER).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaBatchRequest" }
            example:
              items:
                - nodeEpoch: 0
                  mediaId: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
                  nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                  originalUploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  derivatives:
                    - kind: THUMBNAIL
                      uploadId: 2b3c4d5e-6f7a-4b9c-8d1e-2f3a4b5c6d7e
                    - kind: PREVIEW
                      uploadId: 3c4d5e6f-7a8b-4c0d-9e2f-3a4b5c6d7e8f
      responses:
        "200":
          description: Per-item completion results (success carries blob+media ids; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaBatchResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: >
            The space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4). An item whose
            `nodeEpoch` the node refuses is reported per item and never fails the batch: `stale_epoch` (below the node's
            stored epoch — the client re-reads) or `node_rekey_pending` (the node is not re-keyed since the last rotation
            — it retries; ADR 0109 point 6). Either way the item stored nothing and its uploads stay open.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/nodes/{nodeId}/media:
    get:
      tags: [media]
      operationId: listNodeMedia
      summary: List a node's media — a conditional-GET keyset delta for the live gallery (cr-0107, ADR 0033).
      description: >
        Returns the node's media for the open gallery. **Live-updates (cr-0107, ADR 0033):** the response is a
        conditional-GET **keyset delta**, not an unconditional full list. The client caches the node's
        `mediaRevision` (an opaque per-node mutation counter) and echoes it as **`If-None-Match`**; when it still
        equals the node's counter ⇒ **`304`** (no body, no media query — the idle fast path). On a change ⇒ `200`
        with only the media **past the client's `since` cursor** (the `cursor` of the last page it holds: a media's
        position, which the server hands out in the order changes commit, then its id) — so an
        active upload streams the few new items, never re-listing the whole gallery. Each row carries its
        `mediaId`, the **original** blob ref (`blobId`, `chunkCount`, total `byteSize`, per-chunk `manifest`,
        `wrappedBlobKey`), its role-tagged `derivatives` (THUMBNAIL, PREVIEW), the sealed `wrappedMeta`, and its
        `updatedAt`. The `200` also carries **both revisions** and — **only when a delete
        advanced `deleteRevision`** past the client's echoed `sinceDelete` — the node's current **`mediaIds`** set,
        so the client drops any id it no longer sees (catching a delete and a net-zero delete+add); pure adds/edits
        stay delta-only. **Pages (ADR 0033 decision 6):** every answer carries at most `limit` rows (the cap, 1000, is
        `media`'s `maxItems`) and says `more: true` while rows remain past them; the client asks again with the page's
        `cursor` as `since`, without `If-None-Match`, until `more` is false. First load: omit `If-None-Match`/`since` and page
        from the beginning; the revisions it keeps are the first page's (read before its rows, so nothing committed
        while it pages is lost: the next poll's revision differs and its delta carries the change). The client unwraps each
        `K_blob` under `K_node`, presigns the downloads (`blob-downloads-batch`), and opens the chunks with
        `openFrame`. **Operator-blind** — opaque counters, opaque ids, exact timestamps (`updatedAt` to the millisecond); never
        content, never a key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsIfNoneMatch"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsSince"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsSinceDelete"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsLimit"
        - name: state
          in: query
          required: false
          description: >
            Which media to list: **`active`** (default) — the live gallery, the conditional-GET delta above; or
            **`trashed`** — the node's soft-deleted media for the Trash tab (uc.memory.delete-media), a plain list
            paged by the same `since` / `limit` / `more` (`If-None-Match`/`sinceDelete` do not apply, `mediaIds` is
            null; the client orders the rows by `deletedAt` once it holds them all), each row carrying `deletedAt` +
            `deletedBy`. Trashed media never appear in the `active` listing.
          schema: { type: string, default: active, maxLength: 8, example: active }
      responses:
        "200":
          description: >
            A keyset delta (the media past the `since` cursor) plus both revisions; `mediaIds` is present only when
            `deleteRevision` advanced past the client's `sinceDelete`.
          headers:
            ETag: { $ref: "../_common.openapi.yaml#/components/headers/ItemsETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaListPage" }
        "304": { $ref: "../_common.openapi.yaml#/components/responses/ItemsNotModified" }
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}/media-rekey:
    get:
      tags: [media]
      operationId: listMediaRekey
      summary: The Memories fields a node's re-key re-seals — its media, live and trashed, and its bucket names (ADR 0109 point 2).
      description: >
        Every medium of the node — live, trashed, and on a trashed node — with what is sealed under the node's key:
        its `wrappedMeta`, its `wrappedExif` and the `K_blob` wrap of its original and of each derivative; and every
        bucket name sealed under the node's key. Rows a `WRITE_ONLY` guest sealed under its own `K_up` are not listed
        (its identity has a wrapped key, `uploaderKeys`): the re-key leaves them as they are (ADR 0109 point 5). Paged
        by `since` / `limit` / `more` as `listNodeMedia`; the buckets ride on every page. Only a caller who may commit
        the node's re-key (core's `listRekeyNodes`) reads it, else `403`. Nothing here is new to the server.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsSince"
        - $ref: "../_common.openapi.yaml#/components/parameters/ItemsLimit"
      responses:
        "200":
          description: One page of the node's re-key fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaRekeyPage" }
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The caller may not re-key the scope (`not_scope_owner`, `rotation_excluded`, `grant_behind`), or the tenant is suspended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
  /api/scopes/{scopeId}/nodes/{nodeId}/media-rekey/{rekeyId}:
    post:
      tags: [media]
      operationId: stageMediaRekey
      summary: Stage one batch of a node's re-sealed Memories fields under a core re-key id (CR decision 1).
      description: >
        Up to 256 media and 256 buckets per call, each value re-sealed under the node's NEW key: a medium's
        `wrappedMeta` and `wrappedExif` (bound as before, its `metaRevision` + 1 for the meta), and every `K_blob` of it
        re-wrapped (`K_blob` itself unchanged — no store object is read or written, ADR 0109 point 3); a bucket's name.
        Nothing staged is served before core's `commitNodeRekey` under the same `rekeyId`, whose transaction swaps it in
        through Memories' participant. A value staged twice is replaced; an unclaimed stage expires after a day.
        `fromEpoch` is the node's epoch as read; a node re-keyed since is `409 stale_epoch`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/RekeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaRekeyStage" }
      responses:
        "204":
          description: The batch is staged.
        "400":
          description: Malformed request (a list over 256 entries, a malformed value).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The caller may not re-key the scope (`not_scope_owner`, `rotation_excluded`, `grant_behind`), or the tenant is suspended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: The node's epoch is no longer `fromEpoch`, or it does not lag the scope's current one (`stale_epoch` — nothing to stage), or the space is being deleted and read-only (`scope_deleting`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/nodes/{nodeId}/buckets:
    get:
      tags: [buckets]
      operationId: listNodeBuckets
      summary: List a node's uploader buckets — the "Beiträge" grouping (uc.memory.buckets).
      description: >
        Returns the node's materialized buckets for the Beiträge tab: one lazy **primary** per uploader (keyed by
        `owner_key`) plus any **sub-buckets**, each with its opaque `ownerKey`, `parentBucketId` (null = primary),
        `isPrimary`, the `K_node`-sealed `sealedName` (null for a member's primary — the client shows the operator-
        visible username; present for a contributor primary + every sub-bucket), and a per-bucket `mediaCount`. The
        client groups by uploader, unseals names client-side, and filters the gallery grid. Operator-blind — opaque
        `owner_key` + structure only, never a cleartext name, never content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: The node's buckets (primaries + sub-buckets) with per-bucket counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketListResponse" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
    post:
      tags: [buckets]
      operationId: createBucket
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: nodeEpoch
      summary: Create a sub-bucket under a primary root (uc.memory.buckets).
      description: >
        Create a **sub-bucket** one level under a **primary** in this node. Without `parentBucketId` it nests under
        the **caller's own primary** (lazily materialized); with `parentBucketId` (a primary's id) it nests under
        **that** root — so a member can add sub-buckets under a **contributor's** root to organize contributions —
        and the new bucket inherits **that root's** `ownerKey`. The parent must be a primary (`403` otherwise). The
        client mints the bucket's id (`bucketId`, [ADR 0072](../../../docs/decisions/0072-a-seal-binds-its-object.md)) and supplies the `sealedName` (sealed under a field key derived from 
        `K_node`, bound to that id); the server never sees it in clear. Sub-buckets do not nest further.
        Operator-blind — the name is stored as ciphertext. An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBucketRequest" }
            example:
              nodeEpoch: 0
              bucketId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
              sealedName: YnVja2V0LW5hbWUtY2lwaGVy
      responses:
        "200":
          description: The created sub-bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketSummary" }
        "400":
          description: Malformed request (missing/invalid sealed name).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The given parentBucketId is not a primary bucket (sub-buckets nest one level only). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            The `bucketId` is already taken (`id_taken`); the space is being deleted and read-only (`scope_deleting`,
            uc.spaces.delete-group A4); `nodeEpoch` is below the node's stored epoch (`stale_epoch` — the caller re-reads)
            or the node is not re-keyed since the last rotation (`node_rekey_pending` — it retries; ADR 0109 point 6).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: id_taken } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/nodes/{nodeId}/buckets/{bucketId}:
    patch:
      tags: [buckets]
      operationId: renameBucket
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the name the member typed, sealed fresh; nothing the editor did not see is
          re-sent, so a concurrent rename loses only to another rename of the same bucket.
        epochs:
          - field: nodeEpoch
      summary: Rename a sub-bucket (uc.memory.buckets).
      description: >
        Re-store a **sub-bucket's** `K_node`-sealed name. Any scope **member** may rename a sub-bucket (incl. a
        contributor's, to organize contributions); a **primary** is not renameable (`illegal_target`). Operator-blind
        — the new name is ciphertext.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/BucketId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameBucketRequest" }
            example:
              nodeEpoch: 0
              sealedName: cmVuYW1lZC1jaXBoZXI=
      responses:
        "200":
          description: The renamed bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketSummary" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The bucket is a primary (not renameable). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }
        "404":
          description: No such scope/node/bucket, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: bucket_not_found } }
        "409":
          description: >
            The space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4), or `nodeEpoch` is below the node's stored epoch (`stale_epoch` — the caller holds the key from before a
            rotation and re-reads) or the node is not re-keyed since the last rotation (`node_rekey_pending` — it retries
            once the re-key reached the node; ADR 0109 point 6). Nothing was written.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [buckets]
      operationId: deleteBucket
      summary: Delete a sub-bucket — its media fall back to its owner's primary (uc.memory.buckets).
      description: >
        Delete a **sub-bucket**; its media are **reparented to that root's owner primary** — media are **never**
        deleted here (destructive delete is the media trash path, uc.memory.delete-media). Any scope **member** may
        delete a sub-bucket (incl. a contributor's); a **primary** is not deletable (`illegal_target`). Idempotent —
        an unknown bucket answers `204`. Operator-blind — a re-link, no content touched.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/BucketId"
      responses:
        "204":
          description: The sub-bucket was deleted and its media reparented to the primary (or it did not exist).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The bucket is a primary (not deletable). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/scopes/{scopeId}/nodes/{nodeId}/media-moves:
    post:
      tags: [buckets]
      operationId: moveBucketMedia
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the media ids the member chose to move and their target; nothing the editor
          did not see is re-sent.
      summary: Move media between buckets of one owner-root (uc.memory.buckets).
      description: >
        Bulk-move media into `targetBucketId` (null ⇒ the shared owner's **primary**). Every listed medium **and**
        the target bucket must share **one** `owner_key` (the same root), and the caller must be a scope member;
        otherwise `403` (`illegal_target`). A member may curate a contributor's contributions this way, but **never
        across owners** (a single distinct source `owner_key` is required) — attribution is preserved. A read-side
        re-link — no blobs move, no content touched. Operator-blind.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveMediaRequest" }
            example:
              mediaIds: [2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e]
              targetBucketId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
      responses:
        "204":
          description: The media were moved to the target bucket.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: The source media span more than one owner, or the target bucket's owner differs (cross-owner move). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }
        "404":
          description: No such scope/node/media/bucket, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/media/{mediaId}/exif:
    get:
      tags: [media]
      operationId: getMediaExif
      summary: A media's sealed EXIF bundle (lazy, opaque) — for the lightbox detail.
      description: >
        Returns the media's `wrappedExif`: the **lazy, panel-only** metadata bundle sealed client-side under a field key derived from the
        Memory's `K_node` (opaque base64), or null when none was sealed at upload. Its contents are a versioned
        **client-only** shape and deliberately not enumerated here — the server never parses it, so listing the
        fields would only go stale. What defines the tier is where it is read (one item's detail panel, on
        demand) and not what is in it. Deliberately **not** part of `listNodeMedia` (which stays constant-small): the lightbox
        fetches + unseals this only when an item opens. The listed essentials — geometry, capture time, and GPS —
        live in `wrappedMeta`, not here. Operator-blind — the server stores + returns the ciphertext verbatim,
        never inspecting the fields inside.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: The media's sealed EXIF (opaque base64), or null when none was sealed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaExifResponse" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/media, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }

  /api/scopes/{scopeId}/media/{mediaId}/meta:
    put:
      tags: [media]
      operationId: updateMediaMeta
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
        epochs:
          - field: nodeEpoch
      summary: Overwrite a media's sealed listed-metadata blob (e.g. a corrected date) — opaque.
      description: >
        Re-store the media's `wrappedMeta` verbatim: the client re-seals the listed blob
        `{v,w,h,capturedAt,capturedAtOverride,capturedAtSource,gpsLat,gpsLng}` under a field key derived from `K_node` (a date correction
        added/removed) and PUTs the new opaque base64 (or null to clear it). The only user-editable field is the
        date correction; geometry and GPS are derived-only. Operator-blind — the server overwrites the ciphertext
        it holds and never inspects the fields inside. Guards: the caller holds a grant for the scope; a media
        target must exist; and the `metaRevision` the blob was built from still matches — else nothing is
        written and the answer is `409 stale_revision` with the current blob and revision (ADR 0077).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaMetaUpdate" }
            example:
              nodeEpoch: 0
              wrappedMeta: bWV0YS1jaXBoZXJ0ZXh0
              metaRevision: 2
      responses:
        "200":
          description: The stored listed-metadata blob (echoed opaque base64, or null when cleared).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaMetaResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/media, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }
        "409":
          description: >
            The media's `wrappedMeta` moved since the stated `metaRevision` (`stale_revision`, with the current blob
            and revision — nothing was written, ADR 0077); `nodeEpoch` is below the node's stored epoch (`stale_epoch` —
            the caller re-reads) or the node is not re-keyed since the last rotation (`node_rekey_pending` — it retries;
            ADR 0109 point 6); or the space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/StaleSealedMeta" }, example: { code: stale_revision, wrappedMeta: bWV0YS1jaXBoZXJ0ZXh0, metaRevision: 2 } }
        "413": { $ref: "../_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/media/{mediaId}:
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Trash a media — soft-delete into the Memory's recoverable trash (uc.memory.delete-media).
      description: >
        **Soft-delete** the media: set its `deleted_at`/`deleted_by` (the deletion audit) and bump the node's
        `delete_revision` so every open gallery drops the tile on its next poll (cr-0107, ADR 0033). The row + its
        blobs **survive** in the Memory's trash until the scheduled retention purge — `restoreMedia` brings it
        back. **Any member** of the scope may trash (reversible, recovery-not-destruction — the irreversible purge
        is the system job). Idempotent: an already-trashed media answers `204`. Operator-blind — a flag flip, no
        content, no key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "204":
          description: The media is trashed (or was already trashed).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/media, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/scopes/{scopeId}/media/{mediaId}/restore:
    post:
      tags: [media]
      operationId: restoreMedia
      summary: Restore a trashed media back into the gallery (uc.memory.delete-media).
      description: >
        Clear the media's `deleted_at`/`deleted_by` and bump the node's `media_revision` (moving the media to the end
        of the list's keyset and advancing its `updatedAt`) so the tile returns to every open gallery in its date position — a pure flag flip, its blobs
        were never removed. **Any member** of the scope may restore. Idempotent on a live media (`204`). A media
        already **purged** by the retention job is gone (`404`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "204":
          description: The media is restored (or was already live).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/media (e.g. already purged), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }
        "451":
          description: >
            A moderator blocked this medium, or its node or a node above it (`blocked_by_operator`,
            uc.moderation.take-a-measure): it can be deleted for good, never restored, while the block stands.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: blocked_by_operator } }

  /api/scopes/{scopeId}/media/{mediaId}/purge:
    post:
      tags: [media]
      operationId: purgeMedia
      summary: Permanently delete a trashed media now — expedite the retention purge (uc.memory.delete-media).
      description: >
        **Hard-delete** a media that is currently **in the trash**: remove its derivative + media + blob rows and
        put their store objects on the reclaim list, drained by the scheduled sweep (the same reclaim
        `MediaTrashPurge` runs, expedited by a member). This is
        **irreversible**. **Any member** may purge an already-trashed item — the security model's reversible/
        irreversible split lets a member expedite the purge of an item that was already reversibly removed. Only a
        **trashed** media can be purged: a live (untrashed) or unknown media answers `404` (a live media is deleted
        only via trash → purge). Operator-blind — opaque blob objects removed, never content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "204":
          description: The trashed media was permanently deleted (rows gone; their blob objects queued for reclaim).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such trashed media (unknown, already purged, or still live), or no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope the media lives in.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node (MEMORY/CHAPTER) the media is attached to.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Opaque id of the media whose sealed metadata is requested.
      schema: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e }
    BucketId:
      name: bucketId
      in: path
      required: true
      description: Opaque id of a bucket (a primary or a sub-bucket) within the node.
      schema: { type: string, format: uuid, example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a }
    RekeyId:
      name: rekeyId
      in: path
      required: true
      description: The id of the node's re-key attempt — the one core's `commitNodeRekey` names (`content.openapi.yaml`).
      schema: { type: string, format: uuid, example: 6c7c3f0e-2a9b-1d4a-6e8b-2c1f2d3e4a5b }

  schemas:
    # --- complete + attach ---------------------------------------------------
    MediaBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/MediaRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    MediaRequestItem:
      type: object
      description: >
        One logical media: the original upload plus up to two role-tagged derivative uploads (THUMBNAIL,
        PREVIEW). Each `*UploadId` references a session opened by `startBlobUploads` for this `mediaId`. The original
        is exactly one of `originalUploadId` and `originalShared`, else the item fails `invalid_request`.
      required: [mediaId, nodeId, nodeEpoch]
      properties:
        mediaId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the media (ADR 0072 Decision 3) — the `ownerId` every upload of this item was started with, and the id its metadata is sealed bound to. Taken ⇒ `id_taken`.
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        originalUploadId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The upload session for the **original** (pristine) blob, opened by `startBlobUploads`.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        originalShared:
          description: >
            In place of `originalUploadId`: the original is a new row on the stored object of a blob the target node
            already holds - a video banner (`BANNER`) the picked file was found equal to
            (cr-cover-banner-upload-only-and-dedup). Its wrap is sealed with `role` ORIGINAL and `ownerId` = `mediaId`.
            A member's completion only; the item fails `shared_source_invalid` where the source is not the node's.
          oneOf:
            - { $ref: "#/components/schemas/SharedBlob" }
            - { type: "null" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The MEMORY/CHAPTER node to attach the media to.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        nodeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            The epoch of `nodeId` as the client read it: every wrap and seal of the item is under that node's key.
            Below the stored epoch is `stale_epoch` (the caller re-reads); a node not re-keyed since the last rotation is
            `node_rekey_pending` (the caller retries after the re-key reached it) — ADR 0109 point 6.
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        derivatives:
          type: [array, "null"]
          description: >
            Role-tagged derivative uploads (THUMBNAIL, PREVIEW), each its own blob. Empty/absent for a media
            type with no derivable frame (the gallery falls back to an icon). At most one of each kind.
          maxItems: 2
          items: { $ref: "#/components/schemas/MediaDerivativeUpload" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2)'
        wrappedMeta:
          type: [string, "null"]
          description: >
            The original's **listed-metadata tier** `{v,w,h,capturedAt,capturedAtOverride,capturedAtSource,
            gpsLat,gpsLng}` sealed under a field key derived from the Memory's `K_node` (opaque base64) — geometry (for the justified
            grid), capture time (for date sort/edit), and GPS (for the Memory's place medoid). Small and
            **returned with every list** so the gallery can lay out + sort and the place medoid can read GPS
            without the blind server ever seeing a coordinate or a timestamp, and without a per-item fetch.
            Absent for a media type whose frame the client couldn't decode. Consolidates cr-0059's
            `wrappedDimensions`/cr-0064's `wrappedLayout` + cr-0066's `wrappedCapturedAt` (versioned).
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedExif:
          type: [string, "null"]
          description: >
            The original's **lazy, panel-only** metadata bundle sealed under a field key derived from the Memory's `K_node` (opaque
            base64) — a versioned client-only shape, not enumerated here because the server never parses it.
            Stored verbatim, **not** returned by `listNodeMedia` (kept constant-small); the lightbox lazy-loads
            it via `getMediaExif`. Absent when the source carried nothing to seal. The listed essentials — capture time and GPS — live in `wrappedMeta`, not here. Larger,
            so a wider cap.
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16384) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    MediaDerivativeUpload:
      type: object
      required: [kind, uploadId]
      properties:
        kind: { $ref: "#/components/schemas/MediaDerivativeKind" }
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The upload session for this derivative blob, opened by `startBlobUploads`.
          example: 2b3c4d5e-6f7a-4b9c-8d1e-2f3a4b5c6d7e

    MediaDerivativeKind:
      x-veyq-visibility: enum
      type: string
      description: The role of a derivative blob — THUMBNAIL (grid) or PREVIEW (lightbox).
      enum: [THUMBNAIL, PREVIEW]
      example: THUMBNAIL

    MediaBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MediaResultItem" }

    MediaResultItem:
      type: object
      description: >
        One per request item, in order. Success carries the **original** `blobId` + `mediaId`; failure carries
        `error`. The whole item is atomic — if any of its uploads (original or a derivative) fails to verify,
        none are attached.
      properties:
        blobId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The **original** blob's id, on success (derivative blob ids surface via `listNodeMedia`).
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        mediaId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Per-item error code (`upload_not_found`, `node_not_found`, `illegal_target`, `budget_exceeded` = a stored chunk is missing or not at exactly its derived length, and the item's staged objects are purged, `upload_mismatch` = an upload was not started for this `mediaId` in the role it is used in, `id_taken` = the `mediaId` already exists, `shared_source_invalid` = `originalShared` names no blob the node holds, or its id is taken, `invalid_request` = neither or both of `originalUploadId` and `originalShared`, `stale_epoch` / `node_rekey_pending` = the item's `nodeEpoch` was refused, ADR 0109 point 6); null on success.
          maxLength: 64
          example: null

    # --- read-back -----------------------------------------------------------
    MediaSummary:
      type: object
      description: >
        A media's read-back view: the **original** blob ref plus its role-tagged `derivatives`. A gallery
        fetches `derivatives[THUMBNAIL]` for the grid, `derivatives[PREVIEW]` for the lightbox, and the
        original blob only on download. Its seals (blob keys, and `wrappedMeta` and EXIF under field keys derived from it) are under `K_node`, except
        for a row a WRITE_ONLY guest added: that row's are under the guest's identity key, which the page's
        `uploaderKeys` carries (ADR 0031 point 7) — including after a member edits its metadata.
      required: [mediaId, blobId, chunkCount, byteSize, wrappedBlobKey, updatedAt, blockedByOperator]
      properties:
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: >
            A moderator blocked this medium, or its node or a node above it (uc.moderation.take-a-measure): its tile and
            the lightbox show *Blocked by the operator* with no reason, every blob of it answers `451`, and it cannot be
            restored from the trash. Kept in the listing, not left out; its uploader may still delete it.
          example: false
        mediaId: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e, x-veyq-visibility: id }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 2
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 131072
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (server-recorded at complete; ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The original blob's `K_blob` wrapped under `K_node` (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        wrappedBlobMeta:
          type: [string, "null"]
          description: >
            The blob's sealed metadata exactly as its upload declared it: under the blob's own `K_blob` (the
            `blob-meta` seal), client-supplied, write-once, opaque base64 to the server. Null when the upload
            declared none.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
        derivatives:
          type: [array, "null"]
          description: Role-tagged derivative tiers (THUMBNAIL, PREVIEW), each its own blob ref with its own wrap.
          items: { $ref: "#/components/schemas/MediaDerivativeSummary" }
        wrappedMeta:
          type: [string, "null"]
          description: >
            The original's listed-metadata tier `{v,w,h,capturedAt,capturedAtOverride,capturedAtSource,gpsLat,
            gpsLng}` sealed under a field key derived from `K_node` (opaque base64); the gallery unwraps it to lay out the justified grid
            (geometry) and sort tiles by effective capture time (`override ?? capturedAt`), and the place medoid
            reads its GPS. Null when none was sealed at upload (the grid uses a default aspect, the media sorts
            last). The heavier EXIF tier is lazy via `getMediaExif`.
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0
        updatedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            When this media last changed — the attach time at attach, bumped on a meta edit (cr-0068), a restore and a
            block. Not the list's order: the keyset a page and a poll continue from is the page's `cursor` (ADR 0033
            decisions 3 and 6), a position the server hands out in commit order.
          example: 2026-07-09T12:34:56.789Z
        deletedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When this media was trashed (soft-deleted), or null for a live media. Non-null **only** in the
            `state=trashed` listing (uc.memory.delete-media); the Trash tab shows it and offers Restore until the
            retention purge.
          example: null
        deletedBy:
          x-veyq-visibility: id
          type: [string, "null"]
          description: >
            Who trashed this media — the member's opaque user id (the deletion audit), or null for a live media.
            The client compares it to the signed-in user to show "trashed by you" vs. another member.
          maxLength: 64
          example: null
        ownerKey:
          x-veyq-visibility: structure
          type: [string, "null"]
          description: >
            The uploader's opaque **`owner_key`** — `user:{userId}` (a member) or `share:{shareIdentityId}` (a
            public contributor) — the attribution the buckets grouping reads
            ([en.memory.buckets](../../../docs/features/memory/enablers/en.memory.buckets.md), ADR 0034).
            Operator-visible coarse metadata; never a cleartext name. Null only for a pre-buckets row not yet
            attributed.
          maxLength: 64
          example: "user:2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e"
        bucketId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The bucket this media lives in: its uploader's primary from the upload on, another of that owner's
            buckets after a move. Null reads as the uploader's primary.
          example: null
        metaRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            How many times `wrappedMeta` was replaced through `updateMediaMeta` (0 at attach). A meta write states
            the value it was built from (ADR 0077); nothing else moves it.
          minimum: 0
          example: 2

    MediaListPage:
      type: object
      description: >
        The conditional-GET response for the live gallery (cr-0107, ADR 0033). `media` carries only the rows past
        the client's `since` cursor — a **keyset delta** (the full list on first load, when `since` is omitted).
        `mediaRevision`/`deleteRevision` are the node's opaque per-node counters (`mediaRevision` doubles as the
        ETag). `mediaIds` — the node's **current** id set for delete-reconcile — is present **only when a delete
        advanced `deleteRevision`** past the client's `sinceDelete`, and is null on pure adds/edits.
      required: [media, mediaRevision, deleteRevision, more]
      properties:
        media:
          type: array
          description: >
            The delta rows — media past the `since` cursor, each a full read-back view — at most
            `limit` of them, in cursor order (ADR 0033 decision 6).
          maxItems: 1000
          items: { $ref: "#/components/schemas/MediaSummary" }
        more:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Rows remain past this page: ask again with this page's `cursor` as `since` (and no `If-None-Match`) until
            this is false.
          example: false
        cursor:
          x-veyq-visibility: structure
          type: [string, "null"]
          maxLength: 80
          description: >
            The keyset position of this page's last row, opaque to the client: send it as `since` for the next page, and
            keep the last page's for the next poll. Null when the page carries no row (keep the cursor already held).
          example: "17,2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e"
        mediaRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: >
            The node's current media-revision — a monotonic per-node counter bumped by every gallery-media
            mutation (attach / meta-edit / delete; **not** a cover change). Doubles as the ETag; echo it as
            `If-None-Match`.
          example: 7
        deleteRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The node's current delete-revision — bumped **only** by a delete. Echo it as `sinceDelete` to gate the id-set.
          example: 0
        mediaIds:
          x-veyq-visibility: id
          type: [array, "null"]
          description: >
            The node's **current** `mediaId` set (ids only), present **only when `sinceDelete < deleteRevision`**
            (a delete happened since the client last synced). The client drops any cached id absent from it,
            catching a delete and a net-zero delete+add. Null on pure adds/edits.
          items: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e }
        sealedDropPrivateKey:
          type: [string, "null"]
          description: >
            The node's drop private key sealed under its `K_node` (as `NodeSummary.sealedDropPrivateKey`; opaque
            base64), served with the media so every row a WRITE_ONLY guest added can be opened from this page alone
            (ADR 0031 point 7). Null while the node has none.
          contentEncoding: base64
          maxLength: 256
          example: null
        uploaderKeys:
          type: array
          description: >
            One entry per WRITE_ONLY identity that added a row of this page (`ownerKey` `share:{identityId}`): its
            identity key wrapped to the node's drop key. A row whose identity is listed here is sealed under that
            identity's key; every other row under `K_node` (ADR 0031 point 7).
          items: { $ref: "#/components/schemas/UploaderKey" }

    UploaderKey:
      type: object
      description: A WRITE_ONLY identity's own key, wrapped to the node's (a Memory's or a chapter's) drop public key — how a reader opens what that guest uploaded.
      required: [identityId, wrappedIdentityKey]
      properties:
        identityId: { type: string, format: uuid, example: 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c, x-veyq-visibility: id }
        wrappedIdentityKey:
          type: string
          description: The identity key `K_up` wrapped to the drop public key (AAD `upload-identity-key`, bound to scope + node + identity; opaque base64).
          contentEncoding: base64
          maxLength: 2048
          example: d3JhcHBlZC1pZGVudGl0eS1rZXk=

    MediaDerivativeSummary:
      type: object
      description: A derivative tier's blob ref — same opaque metadata as the original, plus its role `kind`.
      required: [kind, blobId, chunkCount, byteSize, wrappedBlobKey]
      properties:
        kind: { $ref: "#/components/schemas/MediaDerivativeKind" }
        blobId: { type: string, format: uuid, example: 8b2c1f2d-3e4a-5b6c-7c3f-0e2a9b1d4a6e, x-veyq-visibility: id }
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          example: 1
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          example: 65536
        manifest:
          x-veyq-visibility: measure
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The derivative blob's own `K_blob` wrapped under `K_node` (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        wrappedBlobMeta:
          type: [string, "null"]
          description: >
            The blob's sealed metadata exactly as its upload declared it: under the blob's own `K_blob` (the
            `blob-meta` seal), client-supplied, write-once, opaque base64 to the server. Null when the upload
            declared none.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==

    MediaExifResponse:
      type: object
      description: >
        A media's lazy metadata: the sealed heavy EXIF bundle, opaque to the server. Fetched per-item when the
        lightbox opens (kept out of `listNodeMedia` so the list stays constant-small).
      properties:
        wrappedExif:
          type: [string, "null"]
          description: >
            The original's lazy, panel-only metadata bundle sealed under a field key derived from `K_node` (opaque base64); the lightbox
            unwraps it to fill the detail panel. Null when none was sealed at upload. The listed essentials —
            geometry, capture time, GPS and the resolved place name — live in `wrappedMeta`, not here.
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0

    MediaMetaUpdate:
      type: object
      description: >
        Overwrite a media's sealed listed-metadata blob (re-sealed client-side under a field key derived from `K_node`), e.g. to persist a
        corrected date. Null clears it. Opaque to the server. `metaRevision` is the `MediaSummary.metaRevision` the
        blob was built from (ADR 0077).
      required: [metaRevision, nodeEpoch]
      properties:
        nodeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            The epoch of the medium's node as the client read it: the blob is sealed under its key.
            Below the stored epoch is `stale_epoch` (the caller re-reads); a node not re-keyed since the last rotation is
            `node_rekey_pending` (the caller retries after the re-key reached it) — ADR 0109 point 6.
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        metaRevision:
          x-veyq-visibility: structure
          # Nullable in the TYPE on purpose, and refused null by the annotation: a required `type: integer` generates a
          # primitive Kotlin `Long`, which Jackson fills with 0 when the field is missing — measured with
          # `MediaSliceTest.mediaMetaWithoutRevisionIs400` answering 200 — so an old client would write at revision 0
          # unnoticed. Nullable makes the absence visible; `@NotNull` turns it into the boundary's 400.
          type: [integer, "null"]
          format: int64
          description: The revision the re-sealed blob was built from; the write succeeds only if it still matches. Never null.
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        wrappedMeta:
          type: [string, "null"]
          description: The re-sealed listed-metadata blob (opaque base64), or null to clear the media's metadata.
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    MediaMetaResponse:
      type: object
      description: A media's stored listed-metadata blob (opaque), echoed after an update.
      properties:
        wrappedMeta:
          type: [string, "null"]
          description: The sealed listed-metadata blob (opaque base64), or null when cleared.
          contentEncoding: base64
          maxLength: 512
          example: bWV0YS1jaXBoZXJ0ZXh0

    # --- buckets (uploader containers, ADR 0034 / en.memory.buckets) ---------
    BucketListResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          description: The node's materialized buckets — primaries (one per uploader) + any sub-buckets.
          items: { $ref: "#/components/schemas/BucketSummary" }
        sealedDropPrivateKey:
          type: [string, "null"]
          description: >
            The node's drop private key sealed under its `K_node` (as `NodeSummary.sealedDropPrivateKey`; opaque
            base64) — what opens a WRITE_ONLY primary's name through its `wrappedIdentityKey` (ADR 0031 point 7),
            served with the buckets so the list is readable on its own. Null while the node has none.
          contentEncoding: base64
          maxLength: 256
          example: null

    BucketSummary:
      type: object
      description: >
        One uploader bucket in a node. `ownerKey` is the opaque uploader key (`user:{id}` / `share:{id}`);
        `parentBucketId` is null for a **primary**. `sealedName` is the `K_node`-sealed name — null for a member's
        primary (the client shows the operator-visible username), present for a contributor primary + every
        sub-bucket. A contributor primary's name is its share identity's own sealed display name, so the row
        carries that identity's `shareId` — the seal is bound to it (ADR 0072). `mediaCount` is the live
        (non-trashed) media in this bucket.
      required: [bucketId, ownerKey, isPrimary, mediaCount]
      properties:
        bucketId: { type: string, format: uuid, example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a, x-veyq-visibility: id }
        ownerKey:
          x-veyq-visibility: structure
          type: string
          description: The uploader's opaque owner_key — `user:{userId}` or `share:{shareIdentityId}`.
          maxLength: 64
          example: "user:2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e"
        parentBucketId:
