openapi: 3.1.0
info:
  title: veyq Favorites API
  version: 0.1.0
  description: >
    The Memories application's favorites (en.memory.favorites, [ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md)):
    the member's private **pins** of Memories in a scope, and the **item marks** on media inside one Memory — each
    an opaque blob sealed client-side, stored verbatim by the server. **Operator-blind:** the server never sees
    which nodes are pinned or which items are marked, only ciphertext + its size. Authorization is enforced by
    code, not this spec (ADR 0008); field validation via `x-field-extra-annotation`.
tags:
  - name: favorites
    description: >
      The caller's **per-(user, scope) Memory pins** — the set of pinned Memory ids, sealed client-side under
      the member's **master key** and stored as a single opaque blob (en.memory.favorites). **Private to the
      member:** this resource returns the caller's own blob and never another member's, and the seal does not
      branch on scope type, so a co-member holding the shared `K_SC` cannot open it
      ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md)). Operator-blind: a pin is
      a personal preference, NOT in the sanctioned metadata set, so the server never sees *which* nodes are
      pinned — only an opaque ciphertext + its size. Own resource interface (one path).
  - name: item-favorites
    description: >
      The **per-(member, scope, node) item marks** — the set of marked `veyq_media` ids inside one Memory,
      sealed client-side under `K_SC` and stored as one opaque blob per member
      (en.memory.favorites, [ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md)).
      Deliberately **shared and member-attributed**, unlike the `favorites` pin: the read returns **every**
      member's blob for that node so the client can render *everyone's / only mine* and a per-item count. The
      write carries no member id — a caller can only replace their own. Partitioned **per node** because the
      server has already observed that node id (the client just listed its media), so the partition adds no
      metadata; a scope-wide set would instead be capped and would re-upload on every toggle. Operator-blind:
      the server never sees *which* items are marked, only opaque ciphertext + its size.
  - name: own-item-favorites
    description: >
      The caller's **own** item-mark blobs across every scope (`/api/item-favorites`) — the same rows the
      `item-favorites` resource serves per node, read account-wide for an account-key rotation's re-tag
      ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). A tag of its own because
      one tag is one resource interface with one root path: under `item-favorites` the generated interface's
      root would widen to `/api`, and the per-node routes would then lose to the `/api/scopes` resources.

paths:
  /api/scopes/{scopeId}/nodes/{nodeId}/item-favorites:
    get:
      tags: [item-favorites]
      operationId: getItemFavorites
      summary: Get every member's sealed item-mark blob for the node.
      description: >
        Returns one entry per member who has ever stored item marks for this node — the caller's own included
        and flagged `self`, and an empty array when nobody has. Each entry's ciphertext is the sealed set of
        marked media ids, which the client opens with `K_SC`; the operator sees only opaque blobs. Entries carry
        **no member id**: the array separates the members, and the count of an item is how many entries hold it,
        so nothing needs a name. This read is deliberately **not** filtered to the caller: it is what lets the client render *everyone's favorites* and a per-item
        count without the blind server aggregating for it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Every member's item-mark blob for the node (empty when none stored).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemFavoritesEntry" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [item-favorites]
      operationId: putItemFavorites
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the row is keyed by the caller, the scope and the node, so only the marking member
          writes it; the loss is one toggle between that member's own devices (ADR 0068). A toggle never
          starts from a set it has not loaded (ADR 0077 point 5).
      summary: Replace the caller's sealed item-mark blob for the node.
      description: >
        Upserts the **caller's own** item marks for this node (last-write-wins). The body carries no member id,
        so a caller cannot address another member's blob — the identity comes from the token. The client seals
        the whole marked set for this node under `K_SC` and PUTs the opaque result; the server stores it
        verbatim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutItemFavoritesRequest" }
            example: { ciphertext: aXRlbS1mYXZvcml0ZXMtY2lwaGVy }
      responses:
        "204":
          description: The item-mark blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/item-favorites:
    get:
      tags: [own-item-favorites]
      operationId: listOwnItemFavorites
      summary: List the caller's own sealed item-mark blobs, across every scope they are an accepted member of.
      description: >
        Returns the **caller's own** item-mark rows — never a co-member's — for every scope the caller is an accepted
        member of whose tenant is not suspended; a row of a scope the caller has left, or only been proposed to, is
        left out. It is what an account-key rotation re-tags: the self-tag inside each blob derives from the Master
        Key, so a rotation re-seals the caller's marks under the new one
        ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). The server already holds
        exactly these rows under the caller's id, so this read tells it nothing; it is a hint, not a proof — the
        client re-tags only a blob whose tag verifies under its old key. A filter, not an answer: a scope it may
        not show is left out, never refused.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own item-mark blobs (empty when none stored).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnItemFavoritesEntry" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }

  /api/scopes/{scopeId}/favorites:
    get:
      tags: [favorites]
      operationId: getFavorites
      summary: Get the caller's sealed favorites blob for the scope.
      description: >
        Returns the caller's own pin ciphertext for the scope (the sealed set of pinned Memory ids), or a null
        ciphertext if none was ever stored. The client decrypts it with its **master key** — never `K_SC`, which
        is shared in a group and would make the set readable by every co-member. Another member's blob is never
        returned here. The operator sees only an opaque blob.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The caller's favorites blob (ciphertext null when unset).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
              example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [favorites]
      operationId: putFavorites
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the pin set is the caller's own, per scope; the loss is one toggle between that member's
          own devices (ADR 0068). A toggle never starts from a set it has not loaded (ADR 0077 point 5).
      summary: Replace the caller's sealed favorites blob for the scope.
      description: >
        Upserts the caller's pin ciphertext for the scope (last-write-wins). The client seals the whole pinned
        set under its **master key** and PUTs the opaque result; the server stores it verbatim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFavoritesRequest" }
            example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
      responses:
        "204":
          description: The favorites blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "../_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409": { $ref: "../_common.openapi.yaml#/components/responses/ScopeDeleting" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }

  schemas:
    Favorites:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: [string, "null"]
          description: The caller's pinned-Memory set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64); null when unset. Private to the member — `K_SC` does not open it.
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=

    PutFavoritesRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          description: The pinned-Memory set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ItemFavoritesEntry:
      type: object
      required: [self, ciphertext]
      properties:
        self:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True on the caller's own blob — the server's claim of WHICH ROW is the caller's, which the client
            checks against the self-tag inside the plaintext: an entry counts as the caller's own only when it is
            flagged here AND its tag verifies under the caller's Master-Key-derived key
            ([ADR 0068](../../../docs/decisions/0068-favorites-two-confidentiality-levels.md) §9). This is the ONLY
            identity on the wire, and deliberately so: the array already separates the members, and an item's count
            is simply how many entries contain its id — so no member id is needed to render "everyone's / only
            mine" or the aggregate. Leaving it out makes the aggregate-only rule a property of the DATA rather than
            a convention the UI is trusted to keep: a client cannot attribute a mark to a named member because it
            was never told who.
          example: true
        ciphertext:
          type: string
          description: That member's marked-media-id set for this node with their self-tag, `{"tag","ids"}` AEAD-sealed under `K_SC` at the base epoch, context `item-favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 65536
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy

    PutItemFavoritesRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          description: The caller's marked-media-id set for this node with their self-tag, `{"tag","ids"}` AEAD-sealed under `K_SC` at the base epoch, context `item-favorites` (opaque base64). No member id — the caller can only replace their own blob.
          contentEncoding: base64
          maxLength: 65536
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    OwnItemFavoritesEntry:
      type: object
      required: [scopeId, nodeId, ciphertext]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The scope the row is stored under.
          example: 7b1f0c2e-3d4a-4b5c-8d6e-9f0a1b2c3d4e
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The Memory the row's marks are in.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        ciphertext:
          type: string
          description: The caller's own marked-media-id set for that node with their self-tag, `{"tag","ids"}` AEAD-sealed under `K_SC` at the base epoch, context `item-favorites` (opaque base64) — exactly what the node's read serves as the caller's entry.
          contentEncoding: base64
          maxLength: 65536
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy

    ErrorResponse:
      $ref: '../_common.openapi.yaml#/components/schemas/ErrorResponse'
