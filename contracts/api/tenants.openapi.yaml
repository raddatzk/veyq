      summary: Set the tenant's per-link storage limit (owner-gated).
      description: >
        The tenant **owner** sets the one per-link limit that applies to every READ_WRITE and WRITE_ONLY link of the
        tenant separately ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)
        §4). It binds from each link's next upload start on: a limit lowered below what a link holds deletes
        nothing and refuses that link's next start (`quota_exceeded`). There is no "unlimited"; `0` switches link
        uploads off. Owner-gated (`403 not_tenant_owner`; a non-member `404`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantStorageUpdate" }
            example: { shareLinkLimitBytes: 5368709120 }
      responses:
        "200":
          description: The limit was stored; the current storage state is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantStorage" }
              example: { usedBytes: 52428800, quotaBytes: 107374182400, shareLinkLimitBytes: 5368709120 }
        "400":
          description: The request was malformed (a missing or negative limit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner sets the limit). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/tenants/{tenantId}/storage-fit:
    post:
      tags: [tenants]
      operationId: checkTenantStorageFit
      summary: Ask whether this many more bytes would still fit the tenant's storage quota (any member, yes or no only).
      description: >
        A **preflight** for a large upload batch (an import of an export, ADR 0082): the caller declares how many
        bytes it is about to upload and learns only whether they would fit under the tenant's quota (`fits`). It is
        the same rule an upload start applies (`quota_exceeded`, [ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)
        §1): the declared bytes plus what the tenant already holds (trash and open uploads included) against the
        quota the Server Owner set; a tenant with **no quota** fits anything. It answers **yes or no and never a
        number**, so it exposes no more than a refused upload already does - and because a long run of questions
        could still be bisected towards the free space, it is **rate-limited per member and per tenant**
        (`veyq.ratelimit.storage-fit.*`, `429 rate_limited` with `Retry-After`). It is **advisory**: another upload
        may take the room before the caller's own start, which stays the one decision (`quota_exceeded`). Any member
        of the tenant may ask, not only its owner; a non-member gets `404` (indistinguishable, ADR 0042).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantStorageFitRequest" }
            example: { bytes: 5368709120 }
      responses:
        "200":
          description: Whether the declared bytes would fit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantStorageFit" }
              example: { fits: true }
        "400":
          description: The request was malformed (a missing or negative byte count).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_suspended }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "429":
          description: Too many questions in a short time (per member and per tenant); retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/tenants/{tenantId}/storage-quota:
    put:
      tags: [tenants]
      operationId: setTenantStorageQuota
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries only the quota typed.
      x-veyq-channel: admin
      summary: Set or change a tenant's storage quota.
      description: >
        The Server Owner caps how much of the instance's store one tenant may hold
        ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md) §1): the ceiling
        belongs to whoever pays for the store the tenant's objects go to, and today that is always the instance's.
        `quotaBytes` is required and never null: no quota — the default — is only ever set by
        `clearTenantStorageQuota`, so a request that lost its field is refused rather than read as "unlimited".
        Every upload start into the tenant's scopes (a
        member's upload or a link guest's) is then reserved against it under a lock on the tenant, and a
        request that does not fit is refused `quota_exceeded` (ADR 0073 §5). A quota lowered below the current usage
        deletes nothing; it refuses the next start. Any tenant status. No tenant-owner operation writes the quota.
        Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantStorageQuotaUpdate" }
            example: { quotaBytes: 107374182400 }
      responses:
        "204":
          description: The quota was stored.
        "400":
          description: The request was malformed (a missing, null or negative quota).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
    delete:
      tags: [tenants]
      operationId: clearTenantStorageQuota
      x-veyq-channel: admin
      summary: Clear a tenant's storage quota — the tenant then has none.
      description: >
        The one way to say "no quota" ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)
        §1): an explicit call, so an update that lost its field can never mean it. Idempotent — clearing a tenant
        that has no quota answers `204` too. Any tenant status. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: The tenant has no quota.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/tenants/accept/preview:
    post:
      tags: [tenants]
      operationId: previewTenantInvite
      summary: Preview a tenant invite from its bootstrap secret.
      description: >
        Returns what the invitee is asked to accept (tenant name, domain, the invited owner email) and
        whether that email already has an account — so the client picks the sign-in vs. register path.
        Public: gated only by possession of the bootstrap secret (the URL-fragment token), which is matched
        by hash and never echoed back. A replayed superseded/consumed/expired secret is 410.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptPreviewRequest" }
            example: { bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc }
      responses:
        "200":
          description: The invite is valid; here is what would be accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
              example:
                tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                tenantName: Familie Raddatz
                domain: family.example.com
                ownerEmail: kevin@example.com
                hasAccount: false
                role: OWNER
        "400":
          description: The request was malformed (missing/blank bootstrap secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "404":
          description: No invite matches that secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }
        "410":
          description: >
            The invite is no longer valid (superseded, consumed, or expired) — or its tenant is suspended, which an
            invite holder is told exactly as a dead invite (uc.spaces.scope-access A4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_no_longer_valid }

  /api/tenants/accept:
    post:
      tags: [tenants]
      operationId: acceptTenantInvite
      summary: Accept a tenant invite as an existing user (activate the tenant).
      description: >
        The signed-in invitee accepts: the client has cold-born the TENANT scope and sealed the first grant
        to its own identity (opaque ciphertext to the server). The server stores the OWNER membership +
        grant, flips the tenant ACTIVE, and consumes the invite — atomically. Any authenticated caller may
        call this; the caller's email must equal the invited owner email, else 403 `not_invited_owner`
        (a domain check, not the Server-Owner role).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
            example:
              bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
              username: kevin
              grant: AQ==
      responses:
        "200":
          description: The tenant is now active and the caller is its owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantActivated" }
              example: { tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c, status: ACTIVE }
        "400":
          description: The request was malformed (missing secret or grant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the invited owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_invited_owner }
        "404":
          description: No invite matches that secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }
        "409":
          description: >
            A conflict — the tenant is already active (`tenant_not_pending`), or the chosen `username` is already
            taken in this tenant (`username_taken`). The specific case is in the response `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }
        "410":
          description: >
            The invite is no longer valid (superseded, consumed, or expired) — or its tenant is suspended, which an
            invite holder is told exactly as a dead invite (uc.spaces.scope-access A4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_no_longer_valid }

  /api/tenants/accept/register:
    post:
      tags: [tenants]
      operationId: registerAndAcceptTenantInvite
      summary: Register a new account and accept the invite (activate the tenant).
      description: >
        The canonical email-invite path — the invitee has no account yet. A new MEMBER account is born on
        the device (operator-blind: the server receives only ciphertext + public keys), its **email taken
        from the invite** (not the body, which binds it), and its id minted by the client (`userId`, [ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md)
        Decision 3 — the optional `sealedName` is sealed bound to (tenant scope, that id)). In one atomic step the
        server creates the account under that id, stores the OWNER membership + grant, flips the tenant ACTIVE,
        and consumes the invite. A taken `userId` is `409 id_taken` (never overwritten, not idempotent). Public: gated
        by the bootstrap secret. The new user logs in afterward (no session is issued here, mirroring setup).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAndAcceptRequest" }
            example:
              bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
              userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
              username: kevin
              account:
                suiteId: v1
                identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                wrappedIdentityPrivateKey: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==
                authPublicKey: ZWQyNTUxOS1hdXRoLXB1Yg==
                masterKeyWraps:
                  - method: PASSWORD
                    wrappedKey: d3JhcHBlZC1tYXN0ZXIta2V5
                    kdfParams: AAAAAwAAgAAAAAABAAAAIHNhbHQtZXhhbXBsZS0xNmJ5dGVz
                secretKeyProofPublicKey: c2VjcmV0LWtleS1wcm9vZi1wdWJsaWMta2V5
              grant: AQ==
      responses:
        "201":
          description: The account was created, the tenant is active, and the caller owns it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantActivatedWithUser" }
              example:
                tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                status: ACTIVE
                userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        "400":
          description: The request was malformed (missing secret/grant or invalid account material).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "404":
          description: No invite matches that secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }
        "409":
          description: >
            A conflict — the invited email already has an account (`email_taken`, use the sign-in accept), the
            chosen `username` is already taken in this tenant (`username_taken`), or the `userId` is already taken
            (`id_taken`). The specific case is in `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: email_taken }
        "410":
          description: >
            The invite is no longer valid (superseded, consumed, or expired) — or its tenant is suspended, which an
            invite holder is told exactly as a dead invite (uc.spaces.scope-access A4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_no_longer_valid }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque access token issued by login / refresh. Admin operations additionally require the
        Server-Owner role; `accept` requires only an authenticated caller (enforced by code, not this spec).

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Opaque id of the tenant.
      schema:
        type: string
        format: uuid
        example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Opaque id of a member invite.
      schema:
        type: string
        format: uuid
        example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c

  schemas:
    CreateTenantRequest:
      type: object
      required: [tenantName, domain, ownerEmail]
      properties:
        tenantName:
          x-veyq-visibility: public
          type: string
          description: Human display name of the tenant (operational cleartext; trimmed on input).
          maxLength: 100
          example: Familie Raddatz
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 100)'
        domain:
          x-veyq-visibility: public
          type: string
          pattern: '^([a-z0-9](-?[a-z0-9])*\.)+[a-z]{2,}$'
          description: >
            The tenant's domain (its Host) — the backend resolves the tenant from this. Operational
            cleartext, unique across the instance. Lowercase hostname; trimmed on input.
          maxLength: 253
          example: family.example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 253) @field:jakarta.validation.constraints.Pattern(regexp = "^([a-z0-9](-?[a-z0-9])*\\.)+[a-z]{2,}$")'
        ownerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            An invite is addressed and bound to this email — the server holds it in plaintext to deliver the invite and
            to match the account that accepts it.
          type: string
          format: email
          description: Email of the person who will own the tenant; the invite is bound to it. Server-visible.
          maxLength: 254
          example: kevin@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'

    ChangeDomainRequest:
      type: object
      required: [domain]
      properties:
        domain:
          x-veyq-visibility: public
          type: string
          pattern: '^([a-z0-9](-?[a-z0-9])*\.)+[a-z]{2,}$'
          description: >
            The tenant's new domain (its Host) — same rules as at creation: operational cleartext, unique
            across the instance, lowercase hostname, trimmed on input.
          maxLength: 253
          example: moved.example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 253) @field:jakarta.validation.constraints.Pattern(regexp = "^([a-z0-9](-?[a-z0-9])*\\.)+[a-z]{2,}$")'

    ReassignOwnerRequest:
      type: object
      required: [ownerEmail]
      properties:
        ownerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            An invite is addressed and bound to this email — the server holds it in plaintext to deliver the invite and
            to match the account that accepts it.
          type: string
          format: email
          description: The new owner email to re-bind the invite to. Server-visible.
          maxLength: 254
          example: partner@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'

    TenantCreated:
      type: object
      required: [tenantId, status, inviteExpiresAt, bootstrapSecret, delivery]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the created tenant.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        status:
          $ref: "#/components/schemas/TenantStatus"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the minted invite expires (UTC).
          example: 2026-07-03T12:00:00Z
        bootstrapSecret:
          $ref: "#/components/schemas/InviteBootstrapSecret"
        delivery:
          $ref: "#/components/schemas/DeliveryResult"

    TenantSummary:
      type: object
      required: [tenantId, name, domain, ownerEmail, status, storageUsedBytes, storageQuotaBytes]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        name:
          x-veyq-visibility: public
          type: string
          maxLength: 100
          example: Familie Raddatz
        domain:
          x-veyq-visibility: public
          type: string
          maxLength: 253
          example: family.example.com
        ownerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Echoed to the owner so they can see which email an invite is bound to (ADR 0007) — the same plaintext the
            invite was already bound to, not a new disclosure.
          type: string
          maxLength: 254
          example: kevin@example.com
        status:
          $ref: "#/components/schemas/TenantStatus"
        inviteStatus:
          description: State of the tenant's current invite (absent once a tenant is ACTIVE).
          oneOf:
            - $ref: "#/components/schemas/InviteStatus"
            - type: "null"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the current invite expires (null once ACTIVE).
          example: 2026-07-03T12:00:00Z
        storageUsedBytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            What the tenant holds in the store (ADR 0073 §2): the declared size of every blob in its scopes, trash
            included until purged, plus every open upload session — summed when read.
          example: 52428800
        storageQuotaBytes:
          x-veyq-visibility: measure
          type: [integer, "null"]
          format: int64
          description: >-
            The tenant's storage quota, set by the Server Owner (`setTenantStorageQuota`, `clearTenantStorageQuota`);
            null = none.
          example: 107374182400

    TenantInviteState:
      type: object
      required: [ownerEmail, inviteStatus, inviteExpiresAt, bootstrapSecret, delivery]
      properties:
        ownerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Echoed to the owner so they can see which email an invite is bound to (ADR 0007) — the same plaintext the
            invite was already bound to, not a new disclosure.
          type: string
          maxLength: 254
          example: kevin@example.com
        inviteStatus:
          $ref: "#/components/schemas/InviteStatus"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-03T12:00:00Z
        bootstrapSecret:
          $ref: "#/components/schemas/InviteBootstrapSecret"
        delivery:
          $ref: "#/components/schemas/DeliveryResult"

    # A local alias to the _common source (the ErrorResponse pattern): the scopes spec's `MyTenant.status`
