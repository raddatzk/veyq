            Server-visible and NOT a credential — login proves possession of the matching private key.
          contentEncoding: base64
          maxLength: 8192
          example: ZWQyNTUxOS1hdXRoLXB1Yg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
