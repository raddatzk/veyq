          description: The identity private key wrapped under the Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        authPublicKey:
          type: string
          description: >
            The Ed25519 auth public key derived from the password + the invited email's auth salt (ADR 0003).
            Server-visible and NOT a credential — login proves possession of the matching private key.
          contentEncoding: base64
          maxLength: 8192
          example: ZWQyNTUxOS1hdXRoLXB1Yg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        masterKeyWraps:
          type: array
          description: One wrap per chosen unlock method; PASSWORD is the mandatory floor.
          minItems: 1
          items: { $ref: "#/components/schemas/MasterKeyWrap" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1) @field:jakarta.validation.Valid'
        secretKeyProofPublicKey:
          type: string
          description: >
            The account's Secret-Key proof key (ADR 0060 Decision 2): the Ed25519 public key derived from the
            Secret Key alone. Rotation, change-password and recovery must each carry a signature under it, so a
            session or a phished password is not enough to mint a cold credential. Reveals nothing: the Secret
            Key is 256 random bits.
          contentEncoding: base64
          maxLength: 128
          example: c2VjcmV0LWtleS1wcm9vZi1wdWJsaWMta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    MasterKeyWrap:
      $ref: '_common.openapi.yaml#/components/schemas/MasterKeyWrap'
