          maxLength: 512
          example: c2VhbGVkLWxpbms=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        epoch:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          description: The tenant scope epoch whose key `wrappedGrant` carries — its current one, checked under its row lock (`409 stale_epoch`).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'
        wrappedGrant:
          type: string
          description: >
            The epoch key sealed to the invite key (`sealTo(scope-grant: tenantId, epoch)`), opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grantSignature:
          type: string
          description: >
            The owner's signature over this grant: the `grant` statement (ADR 0028 Decision 6) with kind `TENANT`, the
            invite id as `recipientUserId` and the invite bundle as the recipient's identity. Opaque base64.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        recipientIdentityDigest:
          type: string
          description: >
            SHA-256 of the identity bundle the grant is wrapped to — here `invitePublicKey`. The server compares it
            with the key it stores for the recipient and refuses another (`409 recipient_key_not_current`): a grant
            names the key it is wrapped to from birth.
