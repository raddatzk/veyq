          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(max = 254)'
        password:
          x-veyq-visibility: token
          type: [string, "null"]
          description: >
            WRITE-ONLY SMTP password; sealed at rest under the env KEK (ADR 0050), never returned or logged. Omit
