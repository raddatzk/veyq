  /api/tenants/{tenantId}/members/{userId}:
    patch:
      tags: [tenants]
      operationId: setTenantMemberRole
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the role the owner chose for one member; the last-owner guard is decided under the
          tenant scope's lock.
      summary: Make a tenant member an owner, or an owner a member again.
      description: >
        A tenant owner's "make owner" (ADR 0101 decision 9, uc.spaces.remove-tenant-member's neighbour): sets the TENANT
        scope role of one member to `OWNER` or `MEMBER`. Membership-gated first (a non-member gets `404
        tenant_not_found`, ADR 0042), then owner-gated (`403 not_tenant_owner`); the **last-owner guard** rejects
        demoting the last remaining OWNER (`409 last_owner`). A pure role change — no key moves: every member of the
        tenant already holds its key. Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, description: Opaque id of the member whose role to set., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTenantMemberRoleRequest" }
            example: { role: OWNER }
      responses:
        "204":
          description: The member holds the role now.
        "400": { description: Malformed (invalid role)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of this tenant but not its owner (`not_tenant_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_tenant_owner } } } }
        "404": { description: "No such member of this tenant (`member_not_found`); or no such tenant, or the caller is not a member of it (`tenant_not_found`, indistinguishable per ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: member_not_found } } } }
        "409": { description: "The last remaining OWNER cannot be demoted (`last_owner`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: last_owner } } } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [tenants]
      operationId: removeTenantMember
      summary: Remove a member from a tenant (ACL-revoke cascade + the group orphan rule).
      description: >
        The tenant **owner** removes a member (uc.spaces.remove-tenant-member, ADR 0014 §6): a tenant-level
        **cascade**, distinct from the scope-level `removeMember` (a single group membership). Cuts the target's
        **shared** access at once — deletes their TENANT-scope membership and every **co-shared** GROUP membership
        (an instant 403 on shared content; the tenant content key is **not** rotated, ADR 0025 — ACL-revoke). Applies
        the **orphan rule** to groups they were the only accepted owner of: OWNER passes to the **oldest accepted**
        member, every open consent proposal on the group expires (deleted) and the group's rotation is queued, since
        the proposals held its key. A group with no other accepted member is the target's own: grace-tombstoned, its
        open proposals deleted, nothing rotated. The target's **own** scopes (personal + any such group) are
        grace-tombstoned with their **membership kept** (read-only grace, then `ScopePurge` — cr-0090), so they can
        read/export their own content before erasure. A group the target is only proposed to loses that proposal as a
        decline would (its rotation queued, no removal counted), and keeps its owner. Membership-gated first (a
        non-member gets `404 tenant_not_found`, ADR 0042), then owner-gated (`403 not_tenant_owner`); the **last-owner
        guard** rejects removing the last tenant OWNER (`409 last_owner`, ADR 0007). Operator-blind: only membership
        deletions + a lifecycle timestamp — never a key. Enforced by code, not this spec (ADR 0008).

        Every scope the removal cuts — the TENANT scope and each co-shared GROUP the target was an accepted member
        of — counts the removal in the same transaction, so a co-member's link minted before it, which the removed
        member could have rebuilt from its recovery copy, can no longer be re-activated, only re-issued
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md) point 4). With
        `revokeLinks=true` the same transaction also turns off **every** enabled public share of the **TENANT scope**,
        whoever created it, each then coming back only by re-issue (point 5) — not the co-shared groups', which the
        tenant owner need not see. Every link the removal switches off — the removed member's own, and with
        `revokeLinks` every one of the TENANT scope — is a **close**
        ([ADR 0114](../../docs/decisions/0114-closing-a-link-re-keys-the-subtree-below-it.md) decision 1): the same
        transaction marks every node below a READ or READ_WRITE link's root due for a re-key, which any member's
        worker runs. A refused removal (`not_tenant_owner`, `member_not_found`, `last_owner`) writes nothing, the
        switch-off included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, description: Opaque id of the member to remove., schema: { type: string, format: uuid } }
        - name: revokeLinks
          in: query
          # An empty value (`?revokeLinks=`) is this parameter's absence: Quarkus REST
          # never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: >
            Also turn off every enabled public share of the TENANT scope in the removal's transaction (ADR 0075).
            Omitted or false = only the removed member's own shares go off.
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: The member was removed (shared access cut; own scopes grace-tombstoned).
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner may remove members). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such member of this tenant (`member_not_found`); or no such tenant, or the caller is not a
            member of it (`tenant_not_found`, deliberately indistinguishable, ADR 0042: membership is the
            first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }
        "409":
          description: The last remaining tenant OWNER cannot be removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: last_owner }

  /api/tenants/{tenantId}/members/{userId}/avatar:
    get:
      tags: [tenants]
      operationId: getMemberAvatar
      summary: Read a tenant member's sealed profile picture.
      description: >
        A member's profile picture (uc.spaces.set-profile-picture, [ADR 0084](../../docs/decisions/0084-a-members-profile-picture-is-a-sealed-attribute-of-their-tenant-profile.md)):
        the one constant-length ciphertext they sealed under a field key derived from its own value key, and that key's
        wrap under the tenant key ([ADR 0115](../../docs/decisions/0115-a-scope-key-is-replaced-never-chained.md)), which
        any tenant member opens on the device. A rotation re-wraps the key and leaves the picture, and moves
        `avatarRevision` with the new wrap, so a client's cached pair is fetched again.
        Gated on **tenant membership** like the directory: a caller who is not an accepted member of the tenant gets the
        `404 tenant_not_found` of [ADR 0042](../../docs/decisions/0042-http-failure-projection.md). Never served to a
        guest or on a share. The `ETag` is the profile's `avatarRevision` (quoted); a client echoing it as `If-None-Match`
        gets `304` with no body while the picture is unchanged. `Cache-Control: private`. The operator sees an opaque
        constant-size blob, never the image.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, description: Opaque id of the member whose picture to read., schema: { type: string, format: uuid } }
        - name: If-None-Match
          x-veyq-visibility: structure
          in: header
          required: false
          description: >
            The `ETag` of the client's cached picture (the member's `avatarRevision`, quoted). When it equals the current
            revision the server answers `304`. Omitted on a first load; one that does not parse is no match.
          schema: { type: string, maxLength: 64, example: "\"3\"" }
      responses:
        "200":
          description: The member's sealed picture.
          headers:
            ETag:
              x-veyq-visibility: structure
              description: The picture's `avatarRevision`, quoted - echo it as `If-None-Match` on the next read.
              schema: { type: string, example: "\"3\"" }
            Cache-Control:
              x-veyq-visibility: structure
              description: Always `private` - the picture is for the signed-in member only, never a shared cache.
              schema: { type: string, example: private }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberAvatar" }
        "304":
          description: Not Modified - the client's `If-None-Match` equals the member's current `avatarRevision`. No body.
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            No picture is set for that member (`avatar_not_found`, also when the user is no member of the tenant); or no
            such tenant, or the caller is not a member of it (`tenant_not_found`, deliberately indistinguishable, ADR
            0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: avatar_not_found }

  /api/tenants/{tenantId}/verifications:
    get:
      tags: [tenants]
      operationId: listVerifications
      summary: Read the verifications members of a tenant made of each other.
      description: >
        Every member's signed verifications of other members in this tenant
        ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md)
        decisions 12–13): each a statement *"in this tenant, this verifier at this head of their key chain confirmed
        this subject at this head of theirs"*, signed by the verifier's identity and sealed under a value key of its
        own (field `member-verification`, bound to the tenant, the verifier, the subject and the epoch it was written
        at), whose wrap the tenant key holds ([ADR 0115](../../docs/decisions/0115-a-scope-key-is-replaced-never-chained.md)).
        A member's client opens each wrap with the tenant's one key, the row with its value key, and counts one only
        while it names the
        subject's current head and verifies under the verifier's current identity — so *verified by …* counts for every
        member of the tenant, and only there. The server stores and relays opaque rows and cannot tell which count.

        Optionally narrowed to one subject or one verifier; ordered by verifier, then subject, and paged by `after`
        (the last row's `verifierUserId:subjectUserId`). Gated on **tenant membership** like the directory: a caller
        who is not an accepted member gets the `404 tenant_not_found` of
        [ADR 0042](../../docs/decisions/0042-http-failure-projection.md).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: subjectUserId
          x-veyq-visibility: id
          in: query
          required: false
          description: Only the verifications of this member.
          schema: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }
        - name: verifierUserId
          x-veyq-visibility: id
          in: query
          required: false
          description: Only the verifications this member made — what a rotation re-signs (decision 13).
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
        - name: after
          x-veyq-visibility: structure
          in: query
          required: false
          description: The page cursor — the last row's `verifierUserId:subjectUserId`; rows after it are served.
          schema:
            type: string
            maxLength: 73
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c:9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        - name: limit
          x-veyq-visibility: measure
          in: query
          required: false
          description: The most rows one page serves.
          schema: { type: integer, format: int32, minimum: 1, maximum: 1000, default: 1000, example: 1000 }
      responses:
        "200":
          description: One page of the tenant's verifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationPage" }
        "400":
          description: Malformed request — a parameter outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            No such tenant, or the caller is not a member of it (`tenant_not_found`, deliberately indistinguishable, ADR
            0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/tenants/{tenantId}/verifications/{subjectUserId}:
    put:
      tags: [tenants]
      operationId: putMyVerification
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer per row: the verifier is the caller and owns the row alone, and a newer verification replaces the
          older, decided under the tenant scope's lock. A stale device that writes an older head only makes its own
          verification stop counting (a reader counts one only at the subject's current head) - a display falls away,
          nothing opens.
      summary: Write the caller's verification of another member of the tenant.
      description: >
        Store the caller's signed verification of `subjectUserId` in this tenant
        ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md)
        decision 12): written **only into the caller's own records** — the verifier is always the caller, never a field
        of the body — one row per (tenant, caller, subject), replaced by a newer one. A matching safety-number and
        chain-code compare writes it; a rotation of the caller re-signs each of the caller's rows with the new
        identity (decision 13). The statement is sealed under a fresh value key, wrapped under the tenant key
        (`wrappedValueKey`, ADR 0115), so a rotation re-wraps it and never rewrites it. The server cannot open or check
        the statement; it checks only that the caller and the subject are accepted members of the tenant, that they
        differ, and that `epoch` is the tenant scope's current one under its row lock (`409 stale_epoch`, ADR 0115
        decision 3: a rotation re-wraps every value key under the one key, so none may land under an older one).
        Nothing here blocks anybody's write.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: subjectUserId
          x-veyq-visibility: id
          in: path
          required: true
          description: The member the caller verified.
          schema: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutVerificationRequest" }
      responses:
        "204":
          description: Stored — it replaced the caller's previous verification of that member, if any.
        "400":
          description: >
            Malformed request — the body outside its contract (`invalid_request`), or the caller named as the subject
            (`verification_of_self`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: verification_of_self } }
        "409":
          description: >
            `epoch` is not the tenant scope's current epoch (`stale_epoch` — the tenant key was replaced since; re-open
            it and re-seal, ADR 0115 decision 3). Nothing is written.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            No such tenant, or the caller is not a member of it (`tenant_not_found`, ADR 0042); or the subject is no
            accepted member of it (`member_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }

  /api/tenants/{tenantId}:
    delete:
      tags: [tenants]
      operationId: revokeTenant
      x-veyq-channel: admin
      summary: Revoke a pending tenant.
      description: >
        Deletes a PENDING tenant that was never accepted (reserved domain + outstanding invite). ACTIVE
        tenants cannot be revoked this way — deactivating a live tenant is a separate future use-case.
        Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: The pending tenant was revoked.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is ACTIVE and cannot be revoked here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }

  /api/tenants/{tenantId}/deletion:
    post:
      tags: [tenants]
      operationId: deleteTenant
      x-veyq-channel: admin
      summary: Delete an active or suspended tenant — offline at once, erased after the scope trash's retention.
      description: >
        ADR 0101 decision 10 (uc.admin.delete-tenant). The tenant goes offline at once exactly as a suspension takes it
        (ADR 0066: every operation on it refused, its own domain refused before authentication, its routers withdrawn,
        its links dead) and its status becomes `PENDING_DELETION`; after `veyq.scope.delete.retention` one purge erases
        every scope through the scope erasure, every other row keyed on the tenant and the tenant itself. Holds and the
        moderation records survive: they hang on cases, not tenants. Every member is told by mail through the instance
        mail where it is set up; every account stays. The body repeats the tenant's domain, as the confirmation typed it,
        so a wrong tenant id deletes nothing (`409 tenant_domain_mismatch`). `409 tenant_not_deletable` for a `PENDING`
        tenant (revoke it) or one pending deletion already. Settles every open moderator proposal to take this tenant
        offline as taken, as a suspension does. Server-Owner only.

        **Over content it carries a statement of reasons** to the tenant's owners (ADR 0093 § 7, DSA Art. 17(1)(c) — a
        termination of the service): always when a moderator's proposal to take the tenant offline is open, and when
        `overContent` says so. Then `statement` is required (`400 statement_required`); it is recorded with the deletion,
        in its transaction, as a measure of kind `TENANT_DELETED` that `stopTenantDeletion` lifts, and mailed with the
        facts to each owner once the deletion committed — exactly as `suspendTenant`'s statement; the answer's
        `statementDelivery` reports whom that mail reached, and the deletion stands whatever it says.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteTenantRequest" }
            example: { domain: family.example.com }
      responses:
        "200":
          description: The tenant is offline and pending deletion; when the purge erases it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeletion" }
        "400":
          description: >
            `invalid_request` = the request was malformed, or `facts` and `factsForLog` do not come together;
            `statement_required` = the deletion is over content and carries no statement; `statement_facts_required` /
            `statement_provision_required` = the facts / the provision were not given (ADR 0093 § 7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: "`tenant_domain_mismatch` = the domain is not this tenant's; `tenant_not_deletable` = the tenant is PENDING or pending deletion already."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_deletable }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [tenants]
      operationId: stopTenantDeletion
      x-veyq-channel: admin
      summary: Stop a tenant's pending deletion — it returns SUSPENDED.
      description: >
        ADR 0101 decision 10: before the purge the Server Owner stops a deletion; the tenant returns `SUSPENDED`, as it
        was taken offline, and is reactivated as a suspended one is (`reactivateTenant`). Nothing was erased before the
        purge, so nothing is rebuilt. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: The deletion is stopped; the tenant is SUSPENDED.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not pending deletion (`tenant_not_pending_deletion`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending_deletion }

  /api/tenants/{tenantId}/owner-invite:
    post:
      tags: [tenants]
      operationId: inviteTenantOwner
      x-veyq-channel: admin
      summary: Invite one of an active tenant's members to become its owner — the way out of an ownerless tenant.
      description: >
        ADR 0101 decision 9: a tenant whose last owner's account was erased at the Server Owner's door has no owner. The
        Server Owner mints an OWNER invite, as setup does, to the address of one of the tenant's **members**; accepting it
        makes that member an OWNER (`acceptTenantInvite`), so nobody is made to answer for a space without being asked.
        Only a member: the operator can admit nobody into the tenant's key (ADR 0020 move 3), so an owner the invite
        brought in from outside would wait for a key no member could vouch for. A newer owner invite supersedes an older
        one; the tenant's member invites are untouched. The link is mailed through the tenant's own relay where that
        relay can send — never through the instance mail (ADR 0097 decision 3) — and is always returned for the Server
        Owner to hand over (ADR 0055 §3); `delivery` says whether the mail went out. `409 tenant_not_active` unless the
        tenant is ACTIVE; `409 not_tenant_member` when the address is no member of it. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteTenantOwnerRequest" }
            example: { email: member@example.com }
      responses:
        "200":
          description: The owner invite and how it was delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInviteState" }
        "400":
          description: The request was malformed (`invalid_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: "`tenant_not_active` = the tenant is not ACTIVE; `not_tenant_member` = no member of the tenant has this address."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_member }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/tenants/{tenantId}/suspend:
    post:
      tags: [tenants]
      operationId: suspendTenant
      x-veyq-channel: admin
      summary: Suspend an active tenant.
      description: >
        Takes an ACTIVE tenant offline: flips its status to SUSPENDED, after which every operation acting on the
        tenant — its spaces, its tenant routes, its shares, its background jobs — refuses its members
        `403 tenant_suspended`, on whatever domain the request arrived; share guests and invite holders are told
        as for a revoked link or a dead invite (uc.spaces.scope-access). The tenant's own domain additionally
        refuses every API request, sign-in included, before authentication (ADR 0066). Availability only: no key,
        grant, content row or session is read, written or revoked, and the transition is reversible via
        `reactivateTenant`. Server-Owner only — and Server-Owner status does not exempt the caller's own
        membership while the tenant is suspended. Settles every open moderator proposal to take this tenant offline as taken (uc.moderation.take-a-measure).

        **Over content it carries a statement of reasons** (ADR 0093 § 7, DSA Art. 17(1)(c); uc.moderation.object-to-a-measure
        A7): always when it takes a moderator's open proposal (the suspension is then recorded on that proposal's case),
        and when `overContent` says so. Then `statement` is required (`400 statement_required`); it is recorded with the
        suspension, in its transaction, as a measure of kind `TENANT_OFFLINE` that `reactivateTenant` lifts, and mailed
        with the facts to each owner of the tenant once the suspension committed (owner decision Q25). A suspension for
        any other reason (unpaid, maintenance) sends no body, or `overContent` false, and carries none. The request is
        JSON either way (`Content-Type: application/json`, with or without a body). The answer reports whom the
        statement's mail reached (`statementDelivery`, absent without a statement); the suspension stands whatever it
        says.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendTenantRequest" }
            example: { overContent: true, statement: { statementId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c, ground: TERMS_BREACH, provision: "Space terms, clause 4", facts: The space hosts a public link to unlawful content after two warnings., factsForLog: { epoch: 2, sealedFacts: c2VhbGVkLWZhY3Rz } } }
      responses:
        "200":
          description: The tenant is now SUSPENDED; over content, whom the statement's mail reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSuspension" }
              example: { statementDelivery: { outcome: REACHED, notReached: [] } }
        "400":
          description: >
            `invalid_request` = the request was malformed, or `facts` and `factsForLog` do not come together;
            `statement_required` = the suspension is over content and carries no statement; `statement_facts_required` /
            `statement_provision_required` = the facts / the provision were not given (ADR 0093 § 7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: statement_required }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The tenant is not ACTIVE (suspension is only defined from ACTIVE; a PENDING tenant is withdrawn
            with `revokeTenant` instead).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_active }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/tenants/{tenantId}/reactivate:
    post:
      tags: [tenants]
      operationId: reactivateTenant
      x-veyq-channel: admin
      summary: Reactivate a suspended tenant.
      description: >
        Brings a SUSPENDED tenant back: flips its status to ACTIVE, and every operation on the tenant answers
        again — its shares and invites included, unchanged, and its waiting background jobs resume. Nothing was torn down by the suspension, so nothing is rebuilt here (ADR 0066) — a member whose
        session stayed technically valid throughout simply resumes. A suspension taken over content was recorded as a
        measure of kind `TENANT_OFFLINE` (ADR 0093 § 7); reactivating lifts it and logs the lift. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: The tenant is ACTIVE again.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not SUSPENDED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_suspended }

  /api/tenants/{tenantId}/terms:
    get:
      tags: [tenants]
      operationId: getTenantTerms
      summary: Read a tenant's current terms + the caller's accepted revision.
      description: >
        Returns the tenant's per-locale terms markdown, the current `termsRevision`, the operator section served after
        it (ADR 0035 decision 6, its one form with the current values), and whether the **caller**
        `accepted` the current pair (space revision, operator revision). Serves the owner editor (loads the
        current text), the member accept-gate (`termsRevision > 0` and not `accepted`), and the `/terms` accept view. The terms are
        the operator's **public** policy (operational content, not E2EE); for now this is gated to **members**
        of the tenant (a non-member is `404`, indistinguishable) — a pre-auth public-serving path is a later
        slice. `@Authenticated`, enforced by code (ADR 0008, ADR 0035).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant's current terms + the caller's accepted revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantTerms" }
              example:
                termsRevision: 3
                accepted: false
                terms:
                  de: "## Nutzungsbedingungen\n…"
                  en: "## Terms of use\n…"
                operatorSection:
                  revision: 1
                  text: { de: "## Auf dieser Instanz: …", en: "## On this instance: …" }
                  record: { de: "### Deine IP-Adresse …", en: "### Your IP address …" }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
