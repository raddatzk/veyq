    SuspendTenantRequest:
      type: object
      description: Whether the suspension is over content, and the statement of reasons it then carries (ADR 0093 § 7).
      properties:
        overContent:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: >
            The Server Owner says the suspension is over content though no moderator's proposal names the tenant, so it
            carries a statement. A suspension that takes an open proposal is over content regardless.
          example: true
        statement:
          description: The statement of reasons the suspension carries when it is over content; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/ServerOwnerStatementInput"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    # A Server Owner's step over content carries its statement (ADR 0093 § 7), single-sourced in _common.
    ServerOwnerStatementInput:
