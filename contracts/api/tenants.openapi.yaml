          groups); the form shows the whole document it sends.
      summary: Set/replace a tenant's terms (owner-gated; bumps the revision on a real change).
      description: >
        The tenant **owner** replaces the per-locale terms markdown. The server **normalizes** the markdown
        and, **only if it changed**, stores it and **bumps `terms_revision`** (an idempotent re-save returns the
        same revision — the pre-E2EE logic). The higher revision re-gates every member (uc.account.accept-terms).
