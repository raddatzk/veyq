          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: The total declared size of what would be uploaded, in bytes.
          example: 5368709120
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.Max(9007199254740991) @field:jakarta.validation.constraints.NotNull'

    TenantStorageFit:
      type: object
      description: >
        Whether the declared bytes would fit the tenant's quota. A yes or a no and nothing else: never the free space,
        the usage or the quota (an owner reads those from `getTenantStorage`).
      required: [fits]
      properties:
        fits:
          x-veyq-visibility: flag
          type: boolean
          description: True when the bytes would fit (always true for a tenant with no quota).
