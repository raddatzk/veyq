      type: object
      description: >-
        The Server Owner's quota for one tenant (ADR 0073 §1). Always a number: no quota is
        `clearTenantStorageQuota`, never a null or absent field.
      required: [quotaBytes]
      properties:
        quotaBytes:
          x-veyq-visibility: measure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: The most the tenant may hold in the store, in bytes. `0` refuses every upload start.
          example: 107374182400
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'

    TenantCapabilities:
      type: object
      description: >
        A tenant's effective capability set (ADR 0088 decision 3). The same for every member of the tenant;
        nothing here is member data.
      required: [capabilities, applicationErasures]
      properties:
        capabilities:
          type: array
          description: >
            Every entry active at the instance level and at this tenant's level along its whole path, in catalog
            order. A client soft-gates each optional feature on the presence of its id and never ANDs ids itself.
          maxItems: 256
          items: { $ref: "#/components/schemas/Capability" }
        applicationErasures:
          type: array
          description: >
            Every application of this tenant whose content is erased on a named day
            (uc.platform.erase-switched-off-application): one entry while the application is switched off for the
            tenant, at either level, and until a due erasure has finished. Empty while every application is on. A
            named day is final: a second level switching off never moves it, and switching the application on before
            it cancels the erasure. In register order, at most one entry per application.
          maxItems: 16
          items: { $ref: "#/components/schemas/ApplicationErasure" }

    ApplicationErasure:
      type: object
      description: >
        The day an application switched off in a tenant is erased there (ADR 0079 decision 8, ADR 0088 decision 5).
        Tenant configuration, the same for every member; nothing here is member data.
      required: [id, dueAt]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: The application's register id, its one-segment root entry.
          maxLength: 64
          example: depot
        dueAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            When the erasure is due: the moment the application went off for the tenant plus the instance's window
            (`veyq.application.off.retention`). From then on, switching it on no longer cancels the erasure, and only
            what members make after that switch-on stays.
          example: 2026-11-25T10:00:00Z

    Capability:
      $ref: '_common.openapi.yaml#/components/schemas/Capability'

    TenantCapabilitySwitch:
      type: object
      description: >
        One register entry a tenant owner may switch (ADR 0088 decision 12), with its words and both levels' state.
        Tenant configuration and server self-description; nothing here is member data.
      # `off` is quoted as in instance.openapi.yaml's InstanceCapability: a YAML 1.1 parser reads a bare `off` as false.
      required: [id, title, purpose, whenOff, "off", serverOff, effective, requirements]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: The entry's lowercase-dotted id, a path in the register tree.
          maxLength: 64
          example: core.public-shares
        title:
          $ref: "#/components/schemas/CapabilityText"
        purpose:
          $ref: "#/components/schemas/CapabilityText"
        whenOff:
          $ref: "#/components/schemas/CapabilityText"
        "off":
          x-veyq-visibility: flag
          type: boolean
          description: The tenant's own switch, as the tenant owner set it. Neither a parent nor the Server Owner changes it.
          example: false
        serverOff:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when the instance level has the entry off: the Server Owner switched it, or an ancestor, off. The
            entry is then off for the tenant whatever its own switch says.
          example: false
        effective:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the entry is active for this tenant: on at both levels, for it and every ancestor (the AND along
            the path). The gates and the tenant's set follow this.
          example: true
        requirements:
          type: array
          description: >
            The entry's requirements (the catalog's, in its order; empty for most), each with its words, the tenant's
