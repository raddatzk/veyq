            by the owner's client from a seed only the link carries. Opaque base64 the server stores and serves.
          contentEncoding: base64
          maxLength: 8192
          example: aW52aXRlLXB1YmxpYy1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        inviteKeySignature:
          type: string
          description: >
            The inviting owner's Ed25519 identity signature over `encode(invite-key: tenantId, inviteId,
            sha256(invitePublicKey), expiresAt in Unix seconds)`. The server verifies it under the caller's stored
            identity key before it mints (`422 invite_signature_invalid`) — so a session without the owner's unlocked vault mints
            no invite — and stores it beside that key; the invitee checks it under the key the owner's chain reaches from the
            head inside the link's seal.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        expiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            The invite's expiry, in whole seconds — the owner signs it. The server takes it only within one minute of
            its own invite lifetime from now (`veyq.tenant.invite.ttl`), else `422 invite_expiry_invalid`, and stores it as
            the invite's expiry.
          example: 2026-07-11T12:00:00Z
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        epoch:
