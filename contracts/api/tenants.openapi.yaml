          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        recipientIdentityDigest:
          type: string
          description: >
            SHA-256 of the identity bundle the grant is wrapped to — here `invitePublicKey`. The server compares it
