          description: The tenant's own value; null while the tenant sets none.
          example: 1
        serverValue:
          x-veyq-visibility: measure
          type: [integer, "null"]
          description: The instance's value, set by the Server Owner; null while it sets none.
          example: null
        effective:
          x-veyq-visibility: measure
          type: [integer, "null"]
          description: The value in effect for the tenant, the strictest of both (a flag set at either, the smaller number of days); null when neither sets one.
