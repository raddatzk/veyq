    # --- Slice B (cr-0010): invite acceptance / activation ---

    AcceptPreviewRequest:
      type: object
      required: [bootstrapSecret]
      properties:
        bootstrapSecret:
          x-veyq-visibility: token
          type: string
          description: The invite's bootstrap secret (the URL-fragment token). Matched by hash; not a key.
          maxLength: 128
          example: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128)'

    InvitePreview:
      type: object
      description: >
        What an invite holder is shown before accepting. A link invite is bound to nobody, so it has neither
        `ownerEmail` nor `hasAccount`: the holder registers with an address they type or signs in with any account
        ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md) decision 2).
      required: [tenantId, tenantName, domain, role, handover]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        tenantName:
          x-veyq-visibility: public
          type: string
          maxLength: 100
          example: Familie Raddatz
        domain:
          x-veyq-visibility: public
          type: string
          maxLength: 253
          example: family.example.com
        ownerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Shown to whoever holds the invite's bootstrap secret so they can confirm which email the invite is bound to
            before accepting — the email the invite was already sent to.
          type: string
          description: >
            The invited email (the field name is historical — it is the invitee's email for any role). Absent for a
            link invite.
          maxLength: 254
          example: kevin@example.com
        hasAccount:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True if the invited email already has an account (the client then uses the sign-in accept). Absent for a
            link invite, bound to no email.
          example: false
        role:
          $ref: "#/components/schemas/InviteRole"
        handover:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True for an OWNER invite into an ACTIVE tenant (`inviteTenantOwner`): the invitee is already its member and
            accepts with `acceptTenantOwnership` — nothing is born, they become an owner (ADR 0101 decision 9).
          example: false
        invite:
          description: >
            A MEMBER invite's key, its owner's signature and its grant — what the invitee's client checks against the
            link's sealed part and opens (ADR 0111 decision 1). Null for an OWNER invite, which carries no key.
          oneOf:
            - $ref: "#/components/schemas/ServedMemberInvite"
            - type: "null"

    ServedMemberInvite:
      type: object
      description: >
        A member invite as its invitee reads it. Every byte is the server's word until the invitee's client checked it
        (`checkInvite`, ADR 0111 decision 19): the invite key must be the one the link's seed
        derives; the signer's chain must pass through the head inside the link's seal and end at the served signer key,
        which must have signed the invite key and the anchor; and the tenant key the grant carries must be the anchor's
        or one the succession statements lead to from the anchor's (ADR 0115 decision 5).
      required: [inviteId, invitePublicKey, inviteKeySignature, expiresAt, signerUserId, signerIdentityPublicKey, signerKeyChain, anchorWrappedGrant, anchorEpoch, anchorGrantSignature, wrappedGrant, grantedEpoch, grantSignature, granterUserId, granterIdentityPublicKey, granterKeyChainHead, successions]
      properties:
        inviteId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
        invitePublicKey:
          type: string
          description: The invite key's public bundle, as the owner's client posted it.
          contentEncoding: base64
          maxLength: 8192
          example: aW52aXRlLXB1YmxpYy1rZXk=
        inviteKeySignature:
          type: string
          description: >
            The inviting owner's `invite-key` signature over it, by the key `signerIdentityPublicKey` names — the one at
            mint, or the one an owner's securing re-signed it with (ADR 0111 decision 20).
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
        expiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: The invite's expiry, as the owner signed it.
          example: 2026-07-11T12:00:00Z
        signerUserId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The inviting owner.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        signerIdentityPublicKey:
          type: string
          description: >
            The inviting owner's identity public bundle that signed the invite key and the anchor now. The invitee
            requires it to be the newest key of `signerKeyChain`, byte for byte (`signer_chain_mismatch`).
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        signerKeyChain:
          type: array
          description: >
            The inviting owner's whole key chain, genesis first, as `getKeyChain` serves it to a co-member (ADR 0111
            decision 7) — public keys and signatures, served here to the holder of the invite token because the invitee
            is no co-member yet. The invitee walks it from the head inside the link's seal: a later key is reached only
            through steps the retired Secret-Key proof key signed, so an owner who secured their account after signing
            is accepted at the new key and a retired key never.
          items: { $ref: "scopes.openapi.yaml#/components/schemas/KeyChainStep" }
        anchorWrappedGrant:
          type: string
          description: >
            The invite's anchor: the inviting owner's own grant of the tenant scope's key at `anchorEpoch`, sealed to the
            invite key — written at mint and reissue, and moved only by a scope rotation the owner commits. Whatever grant
            the invite carries must lead back to the key inside it (`E_a`).
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        anchorEpoch:
          x-veyq-visibility: structure
          type: integer
          description: The tenant scope epoch whose key the anchor carries — at most `grantedEpoch`.
          minimum: 0
          example: 0
        anchorGrantSignature:
          type: string
          description: >
            The inviting owner's `grant` signature over the anchor (recipient = the invite id and the invite bundle), by
            the key `signerIdentityPublicKey` names — any other is refused (`anchor_invalid`).
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
        wrappedGrant:
          type: string
          description: >
            The grant the invite carries now — the tenant scope's epoch key at `grantedEpoch`, sealed to the invite key:
            the anchor itself (byte for byte, when `grantedEpoch` is `anchorEpoch`), or one a later rotation re-wrapped.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        grantedEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The epoch the invite's grant carries: the tenant's current one, or an older one if a rotation declared the
            invite pending — then the invite is redeemable only once a later rotation or its owner carries it, since the
            join record a MEMBER accept seals is taken under the current key only (ADR 0115 decision 8).
          minimum: 0
          example: 0
        grantSignature:
          type: string
          description: The granter's `grant` signature (recipient = the invite id and the invite bundle).
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
        granterUserId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Who wrapped that grant — the inviting owner, or the member whose rotation re-wrapped it.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        granterIdentityPublicKey:
          type: string
          description: >
            The granter's identity public bundle as it signed. A grant above the anchor must verify under it; the key
            needs no anchor of its own, because the succession statements tie the grant's key to the owner's anchor.
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        granterKeyChainHead:
          type: string
          description: >
            The head of the granter's key chain now (ADR 0111 decision 7) — what an invitee that already pinned this
            granter walks its chain to (a key the chain does not reach, or a retired one, refuses the invite). A granter
            it never met is not pinned from here: the succession statements, not the granter's key, vouch for the grant.
          contentEncoding: base64
          maxLength: 64
          example: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
        successions:
          type: array
          description: >
            The tenant scope's succession statements (ADR 0115 decision 5) for every epoch in `(anchorEpoch,
            grantedEpoch]`, ascending — empty when the grant is the anchor. The invitee derives the anchor epoch's
            succession public key from the anchor's key, verifies each statement from there, and takes the carried key
            only if the last public key is the one derived from it (`epoch_unlinked`): the operator holds no `E_a`, so it
            signs no statement that starts there. The anchor's key opens only a dump from before the rotation that moved
            past it, since every row is re-sealed since.
          items: { $ref: "scopes.openapi.yaml#/components/schemas/ScopeSuccession" }

    AcceptOwnershipRequest:
      type: object
      required: [bootstrapSecret]
      properties:
        bootstrapSecret:
          x-veyq-visibility: token
          type: string
          description: The owner invite's bootstrap secret (the URL-fragment token). Matched by hash; not a key.
          maxLength: 128
          example: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128)'

    AcceptInviteRequest:
      type: object
      required: [bootstrapSecret, username]
      # The profile fields' shape (TenantsResource.profileShapeHolds, 400 before any answer about the instance's state):
      # a sealed field and its value key's wrap come together, and a sealed field brings the `epoch` its wrap is under.
      # The server reads a `null` as the field's absence, so the rule hangs on a non-null value — `dependentSchemas`, not
      # `dependentRequired`, which a `null` satisfies and a wrap sent alone escapes neither way (the API fuzzing sent a
      # wrap without its field as valid). The generators ignore the keyword (content's UpdateNodeRequest note);
      # Schemathesis reads it. RegisterAndAcceptRequest states the same rules.
      dependentSchemas:
        sealedJoinRecord:
          if: { properties: { sealedJoinRecord: { type: string } } }
          then:
            required: [wrappedJoinRecordValueKey, epoch]
            properties: { wrappedJoinRecordValueKey: { type: string }, epoch: { type: integer } }
        wrappedJoinRecordValueKey:
          if: { properties: { wrappedJoinRecordValueKey: { type: string } } }
          then:
            required: [sealedJoinRecord]
            properties: { sealedJoinRecord: { type: string } }
        sealedName:
          if: { properties: { sealedName: { type: string } } }
          then:
            required: [wrappedNameValueKey, epoch]
            properties: { wrappedNameValueKey: { type: string }, epoch: { type: integer } }
        wrappedNameValueKey:
          if: { properties: { wrappedNameValueKey: { type: string } } }
          then:
            required: [sealedName]
            properties: { sealedName: { type: string } }
        sealedAvatar:
          if: { properties: { sealedAvatar: { type: string } } }
          then:
            required: [wrappedAvatarValueKey, epoch]
            properties: { wrappedAvatarValueKey: { type: string }, epoch: { type: integer } }
        wrappedAvatarValueKey:
          if: { properties: { wrappedAvatarValueKey: { type: string } } }
          then:
            required: [sealedAvatar]
            properties: { sealedAvatar: { type: string } }
      properties:
        bootstrapSecret:
          x-veyq-visibility: token
          type: string
          description: The invite's bootstrap secret (the URL-fragment token). Matched by hash; not a key.
          maxLength: 128
          example: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128)'
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The handle the caller chooses in the tenant they are joining (ADR 0023) — held in plaintext to enforce
            uniqueness within the tenant and to serve the directory.
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          description: >
            The caller's chosen handle **in the tenant they are joining** — per-tenant, unique within it,
            plaintext (not a login credential; email is, ADR 0023). Trimmed + lowercased server-side; a clash in
            the target tenant is `409 username_taken`. The optional real name may be sealed here (`sealedName`) at
            join, or later via the profile op.
          minLength: 2
          maxLength: 32
          example: kevin
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(min = 2, max = 32) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9_.-]+")'
        grant:
          type: [string, "null"]
          description: >
            The scope root key sealed to the caller's own identity public key. **Required for an OWNER invite**
            (the invitee cold-births the TENANT scope and seals the first grant) — opaque base64 the server
            stores verbatim. **Omitted for a MEMBER invite**, which carries `selfGrant` instead. The server
            enforces this per the invite's role.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grantSignature:
          type: [string, "null"]
          description: >
            Required with `grant` for an OWNER invite (the tenant birth), omitted for a MEMBER invite. The owner's self-signature over the tenant grant, kind `TENANT`, epoch 0. The granter's Ed25519 **identity** signature over `encode(grant: scopeId, scopeKind, epoch,
            recipientUserId, sha256(recipientIdentityPublicKey), sha256(wrappedGrant))`
            ([ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) Decision 6). Opaque base64
            the server stores and relays and never verifies; the recipient checks it before the key inside is used.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        recipientIdentityDigest:
          type: [string, "null"]
          description: >
            Required with `grant` for an OWNER invite (the tenant birth), omitted for a MEMBER invite: SHA-256 of the
            identity bundle `grant` is sealed to — the caller's own. The server compares it with the account's current
            identity key and refuses another (`409 recipient_key_not_current`, ADR 0111 decision 10).
          contentEncoding: base64
          maxLength: 64
          example: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        selfGrant:
          description: >
            **Required for a MEMBER invite, omitted for an OWNER one.** The epoch key the invitee opened from the
            invite's grant, sealed to its own identity and signed by it (ADR 0111 decision 3). The server stores it as
            the membership's grant (granter = the newcomer) — of the tenant's current epoch: a MEMBER accept also seals
            a join record, taken under the current key only, so an invite a rotation declared pending is redeemable
            once it is carried (ADR 0115 decision 8).
          oneOf:
            - $ref: "#/components/schemas/InviteSelfGrant"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        inviteProof:
          type: [string, "null"]
          description: >
            **Required for a MEMBER invite.** The invite key's Ed25519 signature over `encode(invite-accept: inviteId,
            userId, sha256(identity bundle))`, verified under the stored invite key (`403 invite_proof_invalid`): an
            honest server refuses a redeem by token alone.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedJoinRecord:
          type: [string, "null"]
          description: >
            **Required for a MEMBER invite.** The newcomer's join record (ADR 0111 decisions 3 and 12) — its identity
            and Secret-Key proof public key, the owner-signed invite it came through, signed by the invite key and by
            the new identity — sealed under a fresh value key of its own (field `member-join-record`, bound to the
            tenant scope and the new account; ADR 0115). Stored in the profile, served to members on
            `ScopeMember.sealedJoinRecord`, written only here.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLWpvaW4tcmVjb3Jk
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedJoinRecordValueKey:
          type: [string, "null"]
          description: >
            With `sealedJoinRecord` (required there, and only there, else `400 invalid_request`): its value key `K_v` wrapped
            under the tenant key of `epoch` (seal purpose `value-key`, bound to the tenant scope, that epoch and the
            address of its `member-join-record` seal; ADR 0115).
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        signerIdentityDigest:
          type: [string, "null"]
          description: >
            **Required for a MEMBER invite.** SHA-256 of the inviting owner's identity bundle the join record names —
            the signer key the newcomer's client checked (ADR 0111 decision 20). The server
            compares it with the invite's stored signer key under the tenant scope's lock and refuses another (`409
            invite_changed`): the owner secured their account between the client's check and this accept, so the
            record would name a key their securing retired, with no endorsement behind it. The client re-reads the
            preview, re-runs its checks with the invite key and the link facts it kept, and accepts once more.
          contentEncoding: base64
          maxLength: 64
          example: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedName:
          type: [string, "null"]
          description: >
            OPTIONAL real name (first + last) sealed under a field key derived from a fresh value key (opaque base64) —
            the same blob the profile op stores (ADR 0023, ADR 0115). Submitted **at the join** — the invitee holds
            `K_tenant` at accept, from the cold birth or the invite's grant; omitted ⇒ username-only, the name
            added/edited later in the profile. Stored verbatim; the server never decrypts it.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedNameValueKey:
          type: [string, "null"]
          description: >
            With `sealedName` (required there, and only there, else `400 invalid_request`): its value key `K_v` wrapped
            under the tenant key of `epoch` (seal purpose `value-key`, bound to the tenant scope, that epoch and the
            address of its `member-name` seal; ADR 0115).
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: d3JhcHBlZC12YWx1ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedAvatar:
          type: [string, "null"]
          description: >
            OPTIONAL profile picture (uc.spaces.set-profile-picture, ADR 0084) sealed under a field key derived from a
