        invite** from the body, exactly as `createMemberInviteLink` takes it: a new invite key, grant and token, and on
        the owner's client a new sealed part and code (ADR 0129 decision 2). The old link dies. Answers the new token to
        the owner, once, and sends nothing. Owner-gated; refused with `503 mail_unavailable` like the first mint. The
        supersede and the mint commit together — nothing is sent between them — so a refusal leaves the old invite
        standing. A mailed invite is re-issued by `reissueMemberInvite`; its id here is `404 invite_not_found`.
