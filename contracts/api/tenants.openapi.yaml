    TenantStorage:
      type: object
      description: >
        A tenant's storage as its owner reads it (ADR 0073 §4, §6): the tenant's total usage, the quota the Server
        Owner set, and the per-link limit. All are operational byte counts the server already sees — an aggregate,
        never a figure per member, scope or link.
      required: [usedBytes, shareLinkLimitBytes]
      properties:
        usedBytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            The declared size of every blob in the tenant's scopes (trash included until purged) plus every open
            upload session, summed when read.
          example: 52428800
        quotaBytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            The tenant's storage quota, set by the Server Owner (ADR 0073 §1); null = none. Read-only: no tenant-owner
            operation writes it.
          example: 107374182400
        shareLinkLimitBytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: The most any one READ_WRITE or WRITE_ONLY link of the tenant stores. `0` = link uploads off.
          example: 10737418240

    TenantStorageUpdate:
      type: object
      description: The owner's per-link limit (ADR 0073 §4). There is no "unlimited"; `0` switches link uploads off.
      required: [shareLinkLimitBytes]
      properties:
        shareLinkLimitBytes:
          x-veyq-visibility: measure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: The most any one READ_WRITE or WRITE_ONLY link of the tenant stores, in bytes.
          example: 5368709120
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'

