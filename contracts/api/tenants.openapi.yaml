          format: uuid
          description: >
            The client-minted UUIDv4 id of the invite (ADR 0072 Decision 3) — bound into the owner's `invite-key`
            signature, the link's seal, and the grant's signature as its recipient. Taken ⇒ `409 id_taken`.
          example: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        invitePublicKey:
          type: string
          description: >
