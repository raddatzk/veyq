    PendingMemberInvite:
      type: object
      description: >
        A pending member invite as its owner lists it. `email` is present for a mailed invite and absent for a link
        invite, which is bound to nobody ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md)
        decision 2) — the owner tells a link invite by its expiry.
      required: [inviteId, inviteStatus, inviteExpiresAt]
      properties:
        inviteId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the pending invite (used to re-issue or revoke it).
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Echoed to the owner so they can see which email an invite is bound to (ADR 0007) — the same plaintext the
            invite was already bound to, not a new disclosure.
          type: string
          description: The email a mailed invite is bound to; absent for a link invite.
          maxLength: 254
          example: partner@example.com
        inviteStatus:
          $ref: "#/components/schemas/InviteStatus"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-11T12:00:00Z

    MemberInviteState:
      type: object
      description: >
        A minted **mailed** member invite, as reported back to the owner who minted it. It deliberately carries **no
        secret**: a mailed invite travels by mail only, because the token is minted for the invited person
        (ADR 0055 §2). A link invite's answer is `MemberInviteLink`, which carries its token to the owner who hands
        the link over (ADR 0129 decision 1). `delivery` is kept for shape-parity with the Server-Owner invite responses, but on this
        resource only `SENT` is reachable — the other two outcomes are `503`s, not success bodies.
      required: [email, inviteStatus, inviteExpiresAt, delivery]
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Echoed to the owner so they can see which email an invite is bound to (ADR 0007) — the same plaintext the
            invite was already bound to, not a new disclosure.
          type: string
          maxLength: 254
          example: partner@example.com
        inviteStatus:
          $ref: "#/components/schemas/InviteStatus"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-11T12:00:00Z
        delivery:
          $ref: "#/components/schemas/DeliveryResult"

    MemberInviteLink:
      type: object
      description: >
        A minted **link** invite, answered once to the owner who minted it
        ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md) decision 1): its id,
        its token and its expiry. The owner's client builds the link `…/tenant/accept#<bootstrapSecret>.<sealed>.<code>`
        from the token, the sealed part and the code it kept; the server sent nothing and never sees the last two.
      required: [inviteId, bootstrapSecret, inviteExpiresAt]
      properties:
        inviteId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The invite's id — the one the request named, used to re-issue or revoke it.
          example: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
        bootstrapSecret:
          $ref: "#/components/schemas/InviteBootstrapSecret"
        inviteExpiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-11T12:00:00Z

    InviteBootstrapSecret:
      x-veyq-visibility: token
      type: string
      description: >
        The raw single-use invite secret, returned to the **Server Owner** who mints an owner invite — a tenant's
        *bootstrap* invite, or the owner invite into an ownerless tenant ([ADR 0101](../../docs/decisions/0101-an-account-is-erased-on-request-and-only-what-the-law-keeps-stays.md)
        decision 9) — so they can hand it off out-of-band by copying the invite link (`/tenant/accept#<bootstrapSecret>`).
        Each of those must work when the tenant cannot send: a `PENDING` tenant has no mail settings by construction,
        and an ownerless one has nobody left to repair its relay
        ([ADR 0055](../../docs/decisions/0055-mail-is-a-precondition-not-a-capability.md) §3).
        A **mailed member** invite never carries it. A **link** member invite does, to the tenant owner who minted it
        (`MemberInviteLink`), who builds and hands over the link with the sealed part and code the server never sees
        ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md) decision 1). It is the **admission token, not a key** ([ADR 0006](../../docs/decisions/0006-cold-tenant-scope-birth.md));
        it rides the URL **fragment** on the invitee side and is matched server-side by hash only (never stored
        plaintext, never echoed in the tenant list — only here at mint time, over TLS to the owner-gated caller).
      maxLength: 128
      example: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc

    # --- cr-0114 (ADR 0035): tenant terms of service ---
    # LocalizedMarkdown moved to _common (ADR 0038, cr-anonymous-accept-gate) — shared with the sharing spec's
    # accountless terms gate. A local named alias to the external source (the ErrorResponse pattern) so the
    # generator still emits a `LocalizedMarkdown` model in this module while the shape is single-sourced.
    LocalizedMarkdown:
      $ref: '_common.openapi.yaml#/components/schemas/LocalizedMarkdown'
    OperatorSection:
      $ref: '_common.openapi.yaml#/components/schemas/OperatorSection'

    TenantTerms:
      type: object
      description: >
        A tenant's terms as a member reads them: the space's own text and revision, the operator section served after
        it (ADR 0035 decision 6), and whether the caller accepted what is current — the pair of `termsRevision` and
        `operatorSection.revision` (uc.account.accept-terms).
      required: [termsRevision, accepted, operatorSection]
      properties:
        termsRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The tenant's current terms revision. 0 = no terms set (nothing to accept, the gate never fires).
          example: 3
        accepted:
          x-veyq-visibility: structure
          type: boolean
          description: >
            Whether the **caller's** acceptance history holds the current pair. False with `termsRevision` above 0 =
            the accept gate fires (uc.account.accept-terms); at revision 0 nothing gates.
          example: false
        terms:
          description: The current per-locale terms (absent/empty until the owner publishes).
          oneOf:
            - $ref: "#/components/schemas/LocalizedMarkdown"
            - type: "null"
        operatorSection:
          $ref: "#/components/schemas/OperatorSection"

    TenantTermsUpdate:
      type: object
      required: [terms]
      properties:
        terms:
          $ref: "#/components/schemas/LocalizedMarkdown"
          # @Valid cascades the per-locale size validation into the map.
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    AcceptTermsRequest:
      type: object
      description: The pair the member was shown; both parts must equal the current ones, else 409.
      required: [revision, operatorRevision]
      properties:
        revision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The terms revision the member is accepting — must equal the current termsRevision, else 409.
          minimum: 1
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        operatorRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The operator section's revision the member was shown — must equal the current one, else 409.
          minimum: 1
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'

    # --- cr-email-smtp-transport (ADR 0048/0049/0050): per-tenant SMTP + owner-authored invite templates ---
    TenantMailSettings:
      type: object
      description: >
        A tenant's mail configuration as **read back**: the SMTP transport fields, the send toggle, whether a
        password is stored (never the password itself, ADR 0050), and the owner-authored invite templates. The
        transport fields and templates are operator-authored config (`public`), not user data.
      required: [tls, enabled, passwordSet, configSecretState]
      properties:
        host:
          x-veyq-visibility: public
          type: [string, "null"]
          description: SMTP server host (operator infra config). Null ⇒ not configured.
          maxLength: 253
          example: smtp.example.com
        port:
          x-veyq-visibility: public
          type: [integer, "null"]
          format: int32
          description: SMTP server port (operator infra config).
          example: 587
        from:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The From address invites are sent from (null ⇒ noreply@<tenant.domain>).
          maxLength: 254
          example: noreply@family.example.com
        username:
          x-veyq-visibility: public
          type: [string, "null"]
          description: SMTP auth username (operator infra config).
          maxLength: 254
          example: family
        tls:
          x-veyq-visibility: flag
          type: boolean
          description: Whether to use STARTTLS on the SMTP connection.
          example: true
        enabled:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether email sending is enabled. Off (or incomplete) means this tenant cannot admit members at all
            — inviting is refused rather than degraded to a copy-link (ADR 0048/0055).
          example: true
        passwordSet:
          x-veyq-visibility: flag
          type: boolean
          description: Whether an SMTP password is stored — the password itself is never returned (ADR 0050).
          example: true
        subjectTemplate:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            Owner-authored invite subject, rendered over the closed set `{{link}}`/`{{domain}}`/`{{expiry}}`
            (ADR 0048 §6). Null ⇒ veyq's bilingual EN+DE default.
          maxLength: 200
          example: null
        bodyTemplate:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            Owner-authored invite body, rendered over the closed set `{{link}}`/`{{domain}}`/`{{expiry}}`
            (ADR 0048 §6, ADR 0049). Owner literal prose is a consented, operator/provider-visible disclosure.
            Null ⇒ veyq's bilingual EN+DE default.
          maxLength: 8000
          example: null
        configSecretState:
          x-veyq-visibility: enum
          type: string
          description: >
            The server's config-secret subsystem state ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)
            amendment), so the owner sees honestly whether a stored SMTP password can actually be used. `OK` = a KEK
            is present and matches the DB fingerprint that sealed the stored secrets. `ABSENT` = no KEK is available
            (generation failed / read-only FS) — sealing and sending are unavailable, so member invites and
            password recovery are refused until it is fixed (ADR 0055).
            `MISMATCH` = a KEK is present but is **not** the one that sealed the stored password (the key file
            changed or was lost/restored differently) — the stored password can't be decrypted; re-enter it to
            reseal under the current key. Server self-description, not user data.
          enum: [OK, ABSENT, MISMATCH]
          example: OK

    TenantMailSettingsUpdate:
      type: object
      description: >
        Owner-supplied mail configuration. The password is **write-only** (sealed at rest, ADR 0050) — omit it to
        keep the stored one, as long as `host`, `port` and `tls` stay as they are (otherwise
        `400 mail_password_required`); every other field is a full replace. The template fields are optional (null ⇒ veyq's
