        refuses every API request, sign-in included, before authentication (ADR 0066). Availability only: no key,
        grant, content row or session is read, written or revoked, and the transition is reversible via
        `reactivateTenant`. Server-Owner only — and Server-Owner status does not exempt the caller's own
        membership while the tenant is suspended.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: The tenant is now SUSPENDED.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
