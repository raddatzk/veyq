          type: string
          description: The English text.
          maxLength: 1024
          example: Public links
        de:
          x-veyq-visibility: public
          type: string
          description: The German text.
          maxLength: 1024
          example: Öffentliche Links

    TenantCapabilityRequirement:
      type: object
      description: >
        One requirement of a tenant-switchable entry (ADR 0088 decision 8), with its words and its value at both
        levels. A flag's value is `1`, days are a number of days; null where a level sets none.
      required: [name, kind, title, whenSet]
      properties:
        name:
          x-veyq-visibility: public
          type: string
          description: The requirement's name, unique in the catalog; also the property that carries it on `Capability`.
          maxLength: 64
          example: linkPassword
        kind:
          x-veyq-visibility: enum
          type: string
          enum: [flag, days]
