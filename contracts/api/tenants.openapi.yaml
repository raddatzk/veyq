openapi: 3.1.0
info:
  title: veyq Tenants API
  version: 0.1.0
  description: >
    Server-Owner administration of tenants — the structural (key-free) half of tenant creation
    (uc.admin.create-tenant, Slice A / cr-0009). A Server Owner creates a tenant by entering a name, a
    domain and the owner's email; the server validates the domain is free, creates the tenant in PENDING,
    and mints a single-use, time-limited invite token bound to the owner email (delivered out-of-band by
    email). The Server Owner can list all tenants, move any non-suspended one to a different domain, and, for
    PENDING ones, resend the invite, reassign the owner email, or revoke the tenant.

    Operator-blind is not at stake here: name, domain and owner-email are low-sensitivity operational
    metadata (host routing needs the domain anyway), and the invite is a **bootstrap secret, not a key**
    (ADR 0006) — the server stores only its hash and holds no content key. **Activation** (Slice B, cr-0010)
    is the `accept` family below: the invited owner cold-births the TENANT scope and seals the first grant
    to their own identity; the server stores only the ciphertext grant + the OWNER membership and flips the
    tenant ACTIVE — still operator-blind (it never sees the scope key).

    The invite lifecycle mirrors the session refresh-token model (ADR 0004): each invite carries a status
    (ACTIVE → SUPERSEDED on resend/reassign, → CONSUMED on acceptance, → EXPIRED past its TTL); transitions
    are soft (never hard-deleted inline), so a replayed superseded/consumed token is recognised and
    rejected. A scheduled purge removes terminal-state invites later.

    The **admin** operations (create / list / change-domain / resend / reassign / revoke) require the global **Server
    Owner** role; the **accept** family does not — `accept/preview` and `accept/register` are public (gated
    only by possession of the bootstrap secret), and `accept` needs any authenticated caller (being the
    invited owner is a domain check → 403 `not_invited_owner`, not a role). Authorization is enforced by
    code annotations, not this spec (ADR 0008). Field validation is declared here via
    `x-field-extra-annotation` (bean-validation + trimming deserializer), so malformed input is rejected at
    the boundary (400) before any handler runs.
tags:
  - name: tenants
    description: >
      Server-Owner tenant administration (create / list / change-domain / invite resend·reassign / revoke). One tag = one
      resource interface owning the whole `/api/tenants` subtree (avoids the greedy class-level @Path that
      a second tag rooted at the same prefix would cause).

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/tenants:
    post:
      tags: [tenants]
      operationId: createTenant
      x-veyq-channel: admin
      summary: Create a PENDING tenant and mint an owner invite.
      description: >
        Creates a tenant in PENDING with a domain↔tenant mapping and a single-use, time-limited invite
        bound to the owner email. The tenant holds no content until its owner accepts and cold-births the
        TENANT scope (Slice B). Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
            example:
              tenantName: Familie Raddatz
              domain: family.example.com
              ownerEmail: kevin@example.com
      responses:
        "201":
          description: The tenant was created in PENDING and an invite was minted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantCreated" }
              example:
                tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                status: PENDING
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "400":
          description: The request was malformed (missing/invalid name, domain or email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            The tenant cannot be created. `domain_taken` = the domain is already mapped to a tenant.
            `store_not_ready` = no object store has passed its check yet
            ([ADR 0089](../../docs/decisions/0089-instance-settings-live-in-admin-web-the-environment-only-bootstraps.md)
            decision 6): a tenant is the first thing that stores blobs, so it waits for a store that is configured
            and checked (`PUT /api/instance/store`, then `POST /api/instance/store/check`). Nothing is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                domainTaken:
                  value: { code: domain_taken }
                storeNotReady:
                  value: { code: store_not_ready }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    get:
      tags: [tenants]
      operationId: listTenants
      x-veyq-channel: admin
      summary: List all tenants (active and pending).
      description: >
        Returns every tenant with its operational metadata, the state of its current invite, and its storage usage
        beside its quota ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)
        §6: one total per tenant, never a figure per member or scope). Server-Owner only. No content keys or member
        identities are exposed — the operator stays blind to tenant content.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All tenants on the instance.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantSummary" }
              example:
                - tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  name: Familie Raddatz
                  domain: family.example.com
                  ownerEmail: kevin@example.com
                  status: PENDING
                  inviteStatus: ACTIVE
                  inviteExpiresAt: 2026-07-03T12:00:00Z
                  storageUsedBytes: 0
                  storageQuotaBytes: null
                  ownerless: false
                  deletionDueAt: null
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/tenants/{tenantId}/invite/resend:
    post:
      tags: [tenants]
      operationId: resendTenantInvite
      x-veyq-channel: admin
      summary: Re-mint the invite for a pending tenant, bound to the same owner email.
      description: >
        Soft-supersedes the current ACTIVE invite (→ SUPERSEDED) and mints a fresh ACTIVE one with a new
        TTL, bound to the same owner address, and returns its `bootstrapSecret` for the Server Owner to hand
        over. No mail goes out: a PENDING tenant has no mail settings by construction
        ([ADR 0055](../../docs/decisions/0055-mail-is-a-precondition-not-a-capability.md) §3), so `delivery`
        answers `FALLBACK_COPYLINK` and the copy-link is the channel. PENDING tenants only. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: A fresh invite was minted; its copy-link secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInviteState" }
              example:
                ownerEmail: kevin@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not PENDING (already active) — invites apply only before activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }

  /api/tenants/{tenantId}/invite/reassign:
    post:
      tags: [tenants]
      operationId: reassignTenantInvite
      x-veyq-channel: admin
      summary: Re-bind a pending tenant's invite to a different owner email.
      description: >
        Changes the intended owner email, soft-supersedes the current ACTIVE invite, mints a fresh ACTIVE
        one bound to the new email, and returns its `bootstrapSecret` for the Server Owner to hand over — as on
        `resendTenantInvite`, no mail goes out and `delivery` answers `FALLBACK_COPYLINK`. This is what keeps the
        strict email-binding painless (an existing user with a different primary email is invited at the right
        address). PENDING tenants only. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignOwnerRequest" }
            example: { ownerEmail: partner@example.com }
      responses:
        "200":
          description: The invite was re-bound to the new email and re-minted; its copy-link secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInviteState" }
              example:
                ownerEmail: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "400":
          description: The request was malformed (missing/invalid email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not PENDING (already active).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/tenants/{tenantId}/change-domain:
    post:
      tags: [tenants]
      operationId: changeTenantDomain
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries only the domain typed.
      x-veyq-channel: admin
      summary: Move a tenant to a different domain.
      description: >
        Re-points the tenant's domain↔tenant mapping, and — via the ingress projector
        ([ADR 0063](../../docs/decisions/0063-database-driven-tenant-ingress.md)) — makes the new domain
        actually routable while the old one stops resolving. Available on a **PENDING or ACTIVE** tenant,
        unlike resend/reassign/revoke: a domain is how a tenant is *reached*, not part of its invite
        lifecycle, so a live tenant may need to move exactly as often as a pending one. A **SUSPENDED**
        tenant is refused (`409 tenant_not_pending_or_active`) — reactivate first; moving a tenant whose
        whole point is "leave it alone" is needless complexity. The new domain is validated by the same
        rules as at creation (well-formed, and free across the instance). Server-Owner only. Operational
        metadata only: no key, grant or content row is read or written.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeDomainRequest" }
            example: { domain: moved.example.com }
      responses:
        "204":
          description: The tenant now answers on the new domain.
        "400":
          description: The request was malformed (missing/invalid domain).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The domain is already mapped to a tenant (`domain_taken`), or the tenant is SUSPENDED and its
            domain may not be moved (`tenant_not_pending_or_active`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: domain_taken }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/tenants/{tenantId}/member-invites:
    post:
      tags: [tenants]
      operationId: inviteTenantMember
      summary: Invite a person (by email) into an active tenant as a MEMBER.
      description: >
        The tenant **owner** admits a new member (uc.spaces.add-member, ADR 0020): mints a single-use,
        time-limited MEMBER-role invite bound to the email and **emailed to that address** — the *tenant* half of
        member-add (a maybe-new person is onboarded by email + cold-birth; the *group* half, adding an
        existing tenant member, is a separate scope-based operation later). This operation's only channel is mail:
        its secret is never returned to the caller, because it is minted for the invited person and not for whoever
        is looking at the owner's screen (ADR 0055). The owner's other way, a link bound to nobody that the owner
        hands over, is a separate operation, `createMemberInviteLink`
        ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md) decision 1).
        A tenant with no sendable mail settings is refused with `503 mail_unavailable` **before** anything is
        minted, and a send that errors leaves no invite behind. Distinct from the Server-Owner
        tenant admin above: this is gated on the caller holding the **OWNER membership** of `{tenantId}` (a
        code check, not the Server-Owner role). The tenant must be ACTIVE.
        **The invite is a placeholder member** ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decisions 1-2): the owner's client minted an
        invite keypair, signed its public half with the owner's identity, and wrapped the tenant scope's **current**
        epoch key to it. The server stores the public key, the signature, the signer's current identity key and that
        grant — checked under the tenant scope's row lock to be of the current epoch (`409 stale_epoch`) and addressed
        to this invite key (`409 recipient_key_not_current`) — and appends `sealedLink` (the invite key's seed, sealed
        under a code or password the server never sees) to the link it mails, keeping no copy. Every rotation of the
        tenant re-wraps to the invite or declares it pending (`rotateScope`), and accepting it lets the invitee grant
        itself: nobody waits for a key-holder to come online. Operator-blind: the invite hash, the email (metadata),
        the invite's public key and its opaque signature and grant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInviteRequest" }
            example:
              email: partner@example.com
              inviteId: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
              invitePublicKey: aW52aXRlLXB1YmxpYy1rZXk=
              inviteKeySignature: c2lnbmF0dXJl
              expiresAt: 2026-07-11T12:00:00Z
              sealedLink: c2VhbGVkLWxpbms=
              epoch: 0
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "201":
          description: A MEMBER invite was minted and sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInviteState" }
              example:
                email: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-11T12:00:00Z
                delivery: SENT
        "400":
          description: The request was malformed (missing/invalid email or invite material) — `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner may invite members). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The email is already a member of this tenant (`already_member`), the tenant is not ACTIVE, the invite's
            grant is of an epoch that is no longer the tenant scope's current one (`stale_epoch` — re-open the scope
            and rebuild), the invite id is already taken (`id_taken`), or `recipientIdentityDigest` is not SHA-256 of
            `invitePublicKey` (`recipient_key_not_current`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: already_member }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            Rules no schema states, nothing minted: `invite_expiry_invalid` — `expiresAt` is not the server's invite
            lifetime from now (±1 minute); `invite_signature_invalid` — `inviteKeySignature` does not verify under the
            caller's identity key over the invite's statement, whose expiry is whole seconds (a session without the owner's
            unlocked vault mints no invite); `date_time_out_of_range` — `expiresAt` outside the range a stored time holds (1582-10-15T00:00:00Z to 9999-12-31T23:59:59.999Z, with an offset of at most ±18:00), a bound no date-time schema states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_signature_invalid }
        "429":
          description: >
            Too many invites in a short time — per invited address and per tenant (`rate_limited`, nothing minted);
            retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }
        "503":
          description: >
            This tenant cannot send mail, so the invite cannot reach anyone and none was minted
            (`mail_unavailable` — the owner configures SMTP under mail settings); or the mail settings are
            complete but the send errored, in which case the minted invite was revoked again
            (`mail_send_failed`, safe to retry). There is no copy-link fallback on this path (ADR 0055).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }
    get:
      tags: [tenants]
      operationId: listMemberInvites
      summary: List the tenant's pending member invites (owner-gated).
      description: >
        Returns the tenant's currently **pending** MEMBER invites — each an opaque `inviteId`, the invited
        `email` (absent for a link invite, which is bound to nobody — ADR 0129 decision 2), its status, and expiry —
        so the owner can track who has been invited but has not joined yet, and which way
        (uc.spaces.manage-member-invites). Consumed/expired/superseded invites are not listed. Gated on the
        caller holding the tenant **OWNER** membership (a code check). Operator-blind: only invite metadata the
        server already stores — never a plaintext secret. What a rotation needs of the open invites — their keys,
        for any member — is `listOpenInvites`, which carries no email.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant's pending member invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingMemberInvite" }
              example:
                - inviteId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  email: partner@example.com
                  inviteStatus: ACTIVE
                  inviteExpiresAt: 2026-07-11T12:00:00Z
                - inviteId: 2a3b4c5d-6e7f-4a1b-8c2d-3e4f5a6b7c8d
                  inviteStatus: ACTIVE
                  inviteExpiresAt: 2026-07-12T09:30:00Z
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller does not own this tenant. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/tenants/{tenantId}/member-invites/{inviteId}/reissue:
    post:
      tags: [tenants]
      operationId: reissueMemberInvite
      summary: Re-issue a pending member invite with a new key, code + link (owner-gated).
      description: >
        Supersedes the given pending **mailed** MEMBER invite — its key and grant are dropped with it — and mints a **new
        invite** for the same email from the body, exactly as `inviteTenantMember` takes it: a new invite key, grant,
        sealed link and code (the body's `email` must be the old invite's, else `422 invite_email_mismatch` — which is
        also the answer for a link invite, bound to no email; it is re-issued by `reissueMemberInviteLink`). Emailed to
        that address (the old link dies) — for when the invitee lost or ignored the first one, or its code.
        Owner-gated. Never returned to the caller (ADR 0055). Like the first mint, it needs a sendable mailer and is
        refused with `503` without one. Note the ordering cost: the outstanding invite is superseded before the new
        one is minted, so a send that errors leaves the invitee with **no** live invite — the owner retries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InviteId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInviteRequest" }
            example:
              email: partner@example.com
              inviteId: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
              invitePublicKey: aW52aXRlLXB1YmxpYy1rZXk=
              inviteKeySignature: c2lnbmF0dXJl
              expiresAt: 2026-07-11T12:00:00Z
              sealedLink: c2VhbGVkLWxpbms=
              epoch: 0
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "200":
          description: A fresh member invite was minted (the old one superseded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInviteState" }
              example:
                email: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-11T12:00:00Z
                delivery: SENT
        "400":
          description: The request was malformed — `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such pending invite for this tenant — unknown, already consumed, or already terminal
            (`invite_not_found`); or no such tenant, or the caller is not a member of it (`tenant_not_found`,
            deliberately indistinguishable, ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }
        "409":
          description: >
            The new invite's grant is of an epoch that is no longer the tenant scope's current one (`stale_epoch`), its
            id is taken (`id_taken`), or `recipientIdentityDigest` is not SHA-256 of `invitePublicKey`
            (`recipient_key_not_current`) — nothing was superseded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: stale_epoch }
        "429":
          description: >
            Too many invites in a short time — per invited address and per tenant (`rate_limited`, nothing minted);
            retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }
        "503":
          description: >
            This tenant cannot send mail, so nothing was minted and the previous invite still stands
            (`mail_unavailable`); or the send errored, in which case the fresh invite was revoked and the
            superseded one is **not** restored (`mail_send_failed`, safe to retry). ADR 0055.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            Rules no schema states, nothing superseded: `invite_email_mismatch` — the body's `email` is not the reissued
            invite's; `invite_expiry_invalid` and `invite_signature_invalid` as for `inviteTenantMember`; `date_time_out_of_range` — `expiresAt` outside the range a stored time holds (1582-10-15T00:00:00Z to 9999-12-31T23:59:59.999Z, with an offset of at most ±18:00), a bound no date-time schema states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_email_mismatch }

  /api/tenants/{tenantId}/member-invites/{inviteId}:
    delete:
      tags: [tenants]
      operationId: revokeMemberInvite
      summary: Revoke a pending member invite (owner-gated).
      description: >
        Soft-transitions the given pending MEMBER invite — mailed or link (ADR 0129 decision 2) — to a terminal state,
        so a later replay of its secret at `accept` is rejected (`invite_no_longer_valid`) and a mailed invite's
        reserved email is freed to re-invite. Owner-gated.
        The invite's key and its grant are dropped in the same statement, so no rotation carries it any more
        ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decision 2). The tenant does not rotate (ADR 0025): link and code stay a key to the
        epochs granted up to the revoke, useful only with a dump of the ciphertext — the residual ADR 0111
        § Consequences accepts. No already-joined member is touched.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: The pending invite was revoked.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such pending invite for this tenant (`invite_not_found`); or no such tenant, or the caller is
            not a member of it (`tenant_not_found`, deliberately indistinguishable, ADR 0042: membership is
            the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }

  /api/tenants/{tenantId}/member-invite-links:
    post:
      tags: [tenants]
      operationId: createMemberInviteLink
      summary: Mint a member invite bound to nobody, whose link the owner hands over (owner-gated).
      description: >
        The tenant **owner**'s second way to admit a member ([ADR 0129](../../docs/decisions/0129-a-member-invite-is-mailed-or-handed-over-as-a-link.md)
        decision 1, uc.spaces.add-member): a single-use, time-limited MEMBER-role invite with **no address**. The
        server mints it, **sends nothing**, and answers the token (`bootstrapSecret`) to the owner who minted it,
        once. The owner's client builds `…/tenant/accept#<token>.<sealed>.<code>` from it, the sealed part and the
        code it generated, and the owner hands the link over in a channel of their choice; the sealed part and the
        code never reach the server, so this request carries no `sealedLink` — and, bound to nobody, no `email`.
        Whoever opens the link joins: they register with an address they type, or sign in with any account of this
        instance (an account already a member is refused at accept, `409 already_member`), and a redemption marks no
        address confirmed (ADR 0129 decisions 2 and 4). Several link invites may be open at once and a mailed mint
        supersedes none of them; a link mint counts against the tenant's invite budget only, never a recipient's.
        **Mail is still a precondition** (ADR 0129 decision 3): a tenant with no sendable mail settings is refused
        with `503 mail_unavailable` before anything is minted, so every account a link creates can be sent its
        address confirmation. Gated on the caller holding the **OWNER membership** of `{tenantId}` (a code check);
        the tenant must be ACTIVE. **The invite is a placeholder member** exactly as `inviteTenantMember`'s (ADR 0111
        decisions 1-2): the same invite key, owner signature and grant of the tenant scope's current epoch, checked
        the same way, re-granted by every rotation while it is open. Operator-blind: the invite hash, the invite's
        public key and its opaque signature and grant — less than a mailed invite's, which adds the address and,
        in the mail, the sealed part.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInviteLinkRequest" }
            example:
              inviteId: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
              invitePublicKey: aW52aXRlLXB1YmxpYy1rZXk=
              inviteKeySignature: c2lnbmF0dXJl
              expiresAt: 2026-07-11T12:00:00Z
              epoch: 0
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "201":
          description: A link invite was minted; its token is answered here once and sent nowhere.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInviteLink" }
              example:
                inviteId: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                inviteExpiresAt: 2026-07-11T12:00:00Z
        "400":
          description: The request was malformed (missing/invalid invite material) — `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner may invite members). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The tenant is not ACTIVE, the invite's grant is of an epoch that is no longer the tenant scope's current one
            (`stale_epoch` — re-open the scope and rebuild), the invite id is already taken (`id_taken`), or
            `recipientIdentityDigest` is not SHA-256 of `invitePublicKey` (`recipient_key_not_current`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: stale_epoch }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            Rules no schema states, nothing minted: `invite_expiry_invalid`, `invite_signature_invalid` and
            `date_time_out_of_range` as for `inviteTenantMember` — `expiresAt` outside the range a stored time holds
            (1582-10-15T00:00:00Z to 9999-12-31T23:59:59.999Z, with an offset of at most ±18:00), a bound no date-time
            schema states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_signature_invalid }
        "429":
          description: >
            Too many invites in a short time — the tenant's invite budget, which a link invite spends alone because it
            names no address (`rate_limited`, nothing minted); retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }
        "503":
          description: >
            This tenant cannot send mail, so none was minted (`mail_unavailable` — the owner configures SMTP under mail
            settings; ADR 0129 decision 3). Nothing is sent on this path, so there is no `mail_send_failed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }

