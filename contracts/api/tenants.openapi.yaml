openapi: 3.1.0
info:
  title: veyq Tenants API
  version: 0.1.0
  description: >
    Server-Owner administration of tenants — the structural (key-free) half of tenant creation
    (uc.admin.create-tenant, Slice A / cr-0009). A Server Owner creates a tenant by entering a name, a
    domain and the owner's email; the server validates the domain is free, creates the tenant in PENDING,
    and mints a single-use, time-limited invite token bound to the owner email (delivered out-of-band by
    email). The Server Owner can list all tenants, move any non-suspended one to a different domain, and, for
    PENDING ones, resend the invite, reassign the owner email, or revoke the tenant.

    Operator-blind is not at stake here: name, domain and owner-email are low-sensitivity operational
    metadata (host routing needs the domain anyway), and the invite is a **bootstrap secret, not a key**
    (ADR 0006) — the server stores only its hash and holds no content key. **Activation** (Slice B, cr-0010)
    is the `accept` family below: the invited owner cold-births the TENANT scope and seals the first grant
    to their own identity; the server stores only the ciphertext grant + the OWNER membership and flips the
    tenant ACTIVE — still operator-blind (it never sees the scope key).

    The invite lifecycle mirrors the session refresh-token model (ADR 0004): each invite carries a status
    (ACTIVE → SUPERSEDED on resend/reassign, → CONSUMED on acceptance, → EXPIRED past its TTL); transitions
    are soft (never hard-deleted inline), so a replayed superseded/consumed token is recognised and
    rejected. A scheduled purge removes terminal-state invites later.

    The **admin** operations (create / list / change-domain / resend / reassign / revoke) require the global **Server
    Owner** role; the **accept** family does not — `accept/preview` and `accept/register` are public (gated
    only by possession of the bootstrap secret), and `accept` needs any authenticated caller (being the
    invited owner is a domain check → 403 `not_invited_owner`, not a role). Authorization is enforced by
    code annotations, not this spec (ADR 0008). Field validation is declared here via
    `x-field-extra-annotation` (bean-validation + trimming deserializer), so malformed input is rejected at
    the boundary (400) before any handler runs.
tags:
  - name: tenants
    description: >
      Server-Owner tenant administration (create / list / change-domain / invite resend·reassign / revoke). One tag = one
      resource interface owning the whole `/api/tenants` subtree (avoids the greedy class-level @Path that
      a second tag rooted at the same prefix would cause).

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/tenants:
    post:
      tags: [tenants]
      operationId: createTenant
      x-veyq-channel: admin
      summary: Create a PENDING tenant and mint an owner invite.
      description: >
        Creates a tenant in PENDING with a domain↔tenant mapping and a single-use, time-limited invite
        bound to the owner email. The tenant holds no content until its owner accepts and cold-births the
        TENANT scope (Slice B). Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
            example:
              tenantName: Familie Raddatz
              domain: family.example.com
              ownerEmail: kevin@example.com
      responses:
        "201":
          description: The tenant was created in PENDING and an invite was minted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantCreated" }
              example:
                tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                status: PENDING
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "400":
          description: The request was malformed (missing/invalid name, domain or email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            The tenant cannot be created. `domain_taken` = the domain is already mapped to a tenant.
            `store_not_ready` = no object store has passed its check yet
            ([ADR 0089](../../docs/decisions/0089-instance-settings-live-in-admin-web-the-environment-only-bootstraps.md)
            decision 6): a tenant is the first thing that stores blobs, so it waits for a store that is configured
            and checked (`PUT /api/instance/store`, then `POST /api/instance/store/check`). Nothing is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                domainTaken:
                  value: { code: domain_taken }
                storeNotReady:
                  value: { code: store_not_ready }
    get:
      tags: [tenants]
      operationId: listTenants
      x-veyq-channel: admin
      summary: List all tenants (active and pending).
      description: >
        Returns every tenant with its operational metadata, the state of its current invite, and its storage usage
        beside its quota ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)
        §6: one total per tenant, never a figure per member or scope). Server-Owner only. No content keys or member
        identities are exposed — the operator stays blind to tenant content.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All tenants on the instance.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantSummary" }
              example:
                - tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  name: Familie Raddatz
                  domain: family.example.com
                  ownerEmail: kevin@example.com
                  status: PENDING
                  inviteStatus: ACTIVE
                  inviteExpiresAt: 2026-07-03T12:00:00Z
                  storageUsedBytes: 0
                  storageQuotaBytes: null
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/tenants/{tenantId}/invite/resend:
    post:
      tags: [tenants]
      operationId: resendTenantInvite
      x-veyq-channel: admin
      summary: Re-mint the invite for a pending tenant, bound to the same owner email.
      description: >
        Soft-supersedes the current ACTIVE invite (→ SUPERSEDED) and mints a fresh ACTIVE one with a new
        TTL, bound to the same owner address, and returns its `bootstrapSecret` for the Server Owner to hand
        over. No mail goes out: a PENDING tenant has no mail settings by construction
        ([ADR 0055](../../docs/decisions/0055-mail-is-a-precondition-not-a-capability.md) §3), so `delivery`
        answers `FALLBACK_COPYLINK` and the copy-link is the channel. PENDING tenants only. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: A fresh invite was minted; its copy-link secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInviteState" }
              example:
                ownerEmail: kevin@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not PENDING (already active) — invites apply only before activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }

  /api/tenants/{tenantId}/invite/reassign:
    post:
      tags: [tenants]
      operationId: reassignTenantInvite
      x-veyq-channel: admin
      summary: Re-bind a pending tenant's invite to a different owner email.
      description: >
        Changes the intended owner email, soft-supersedes the current ACTIVE invite, mints a fresh ACTIVE
        one bound to the new email, and returns its `bootstrapSecret` for the Server Owner to hand over — as on
        `resendTenantInvite`, no mail goes out and `delivery` answers `FALLBACK_COPYLINK`. This is what keeps the
        strict email-binding painless (an existing user with a different primary email is invited at the right
        address). PENDING tenants only. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignOwnerRequest" }
            example: { ownerEmail: partner@example.com }
      responses:
        "200":
          description: The invite was re-bound to the new email and re-minted; its copy-link secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInviteState" }
              example:
                ownerEmail: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-03T12:00:00Z
                bootstrapSecret: 87olM0gSJLPgnKSjdNkC4pPQyuvMVguyb5kHoJyU9Cc
                delivery: FALLBACK_COPYLINK
        "400":
          description: The request was malformed (missing/invalid email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The tenant is not PENDING (already active).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_pending }

  /api/tenants/{tenantId}/change-domain:
    post:
      tags: [tenants]
      operationId: changeTenantDomain
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries only the domain typed.
      x-veyq-channel: admin
      summary: Move a tenant to a different domain.
      description: >
        Re-points the tenant's domain↔tenant mapping, and — via the ingress projector
        ([ADR 0063](../../docs/decisions/0063-database-driven-tenant-ingress.md)) — makes the new domain
        actually routable while the old one stops resolving. Available on a **PENDING or ACTIVE** tenant,
        unlike resend/reassign/revoke: a domain is how a tenant is *reached*, not part of its invite
        lifecycle, so a live tenant may need to move exactly as often as a pending one. A **SUSPENDED**
        tenant is refused (`409 tenant_not_pending_or_active`) — reactivate first; moving a tenant whose
        whole point is "leave it alone" is needless complexity. The new domain is validated by the same
        rules as at creation (well-formed, and free across the instance). Server-Owner only. Operational
        metadata only: no key, grant or content row is read or written.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeDomainRequest" }
            example: { domain: moved.example.com }
      responses:
        "204":
          description: The tenant now answers on the new domain.
        "400":
          description: The request was malformed (missing/invalid domain).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No tenant with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The domain is already mapped to a tenant (`domain_taken`), or the tenant is SUSPENDED and its
            domain may not be moved (`tenant_not_pending_or_active`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: domain_taken }

  /api/tenants/{tenantId}/member-invites:
    post:
      tags: [tenants]
      operationId: inviteTenantMember
      summary: Invite a person (by email) into an active tenant as a MEMBER.
      description: >
        The tenant **owner** admits a new member (uc.spaces.add-member, ADR 0020): mints a single-use,
        time-limited MEMBER-role invite bound to the email and **emailed to that address** — the *tenant* half of
        member-add (a maybe-new person is onboarded by email + cold-birth; the *group* half, adding an
        existing tenant member, is a separate scope-based operation later). Mail is the **only** channel: the
        secret is never returned to the caller, because it is minted for the invited person and not for whoever
        is looking at the owner's screen (ADR 0055). A tenant with no sendable mail settings is therefore
        refused with `503 mail_unavailable` **before** anything is minted, and a send that errors leaves no
        invite behind. Distinct from the Server-Owner
        tenant admin above: this is gated on the caller holding the **OWNER membership** of `{tenantId}` (a
        code check, not the Server-Owner role). The tenant must be ACTIVE. Delivery of the scope key is
        automatic afterward (any online key-holder wraps `K_SC` to the new member — cr-0076); admission here
        only creates the invite. **Admission is a key-holder act**
        ([ADR 0020](../../docs/decisions/0020-grant-distribution-invite-wrap.md) move 6): the invite carries the
        admission tag the owner's client computed under the tenant scope's current epoch key, and no key-holder
        delivers to the member it admits unless that tag verifies — an owner's session alone, without the unlocked
        vault, can mint an invite but never one that is delivered to. Operator-blind: only the invite hash, the
        email (metadata) and the opaque admission are stored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInviteRequest" }
            example:
              email: partner@example.com
              admissionId: ad6e8b2c-1f2d-4e4a-8b6c-7c3f0e2a9b1d
              admissionEpoch: 0
              admissionTag: 88EIUGAHsCDogfZhvV7MYpQw2hEWWL6ClJP2OcAj6Wg=
      responses:
        "201":
          description: A MEMBER invite was minted and sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInviteState" }
              example:
                email: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-11T12:00:00Z
                delivery: SENT
        "400":
          description: The request was malformed (missing/invalid email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner may invite members). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The email is already a member of this tenant, the tenant is not ACTIVE, or the admission was tagged at an epoch that is no longer the tenant scope's current one (`stale_epoch` — re-tag and retry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: already_member }
        "503":
          description: >
            This tenant cannot send mail, so the invite cannot reach anyone and none was minted
            (`mail_unavailable` — the owner configures SMTP under mail settings); or the mail settings are
            complete but the send errored, in which case the minted invite was revoked again
            (`mail_send_failed`, safe to retry). There is no copy-link fallback on this path (ADR 0055).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }
    get:
      tags: [tenants]
      operationId: listMemberInvites
      summary: List the tenant's pending member invites (owner-gated).
      description: >
        Returns the tenant's currently **pending** MEMBER invites — each an opaque `inviteId`, the invited
        `email`, its status, and expiry — so the owner can track who has been invited but has not joined yet
        (uc.spaces.manage-member-invites). Consumed/expired/superseded invites are not listed. Gated on the
        caller holding the tenant **OWNER** membership (a code check). Operator-blind: only invite metadata the
        server already stores — never a plaintext secret.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant's pending member invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingMemberInvite" }
              example:
                - inviteId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  email: partner@example.com
                  inviteStatus: ACTIVE
                  inviteExpiresAt: 2026-07-11T12:00:00Z
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller does not own this tenant. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No tenant with that id — or the caller is not a member of it (deliberately indistinguishable,
            ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/tenants/{tenantId}/member-invites/{inviteId}/reissue:
    post:
      tags: [tenants]
      operationId: reissueMemberInvite
      summary: Re-issue a pending member invite with a fresh secret + link (owner-gated).
      description: >
        Supersedes the given pending MEMBER invite and mints a **fresh single-use secret** for the same email,
        emailed to that address (the old link dies) — for when the invitee lost or ignored the first one.
        Owner-gated. Same email, new secret + expiry, never returned to the caller (ADR 0055). Like the first
        mint, it needs a sendable mailer and is refused with `503` without one. Note the ordering cost: the
        outstanding invite is superseded before the new one is minted, so a send that errors leaves the invitee
        with **no** live invite — the owner retries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "200":
          description: A fresh member invite was minted (the old one superseded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInviteState" }
              example:
                email: partner@example.com
                inviteStatus: ACTIVE
                inviteExpiresAt: 2026-07-11T12:00:00Z
                delivery: SENT
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such pending invite for this tenant — unknown, already consumed, or already terminal
            (`invite_not_found`); or no such tenant, or the caller is not a member of it (`tenant_not_found`,
            deliberately indistinguishable, ADR 0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }
        "503":
          description: >
            This tenant cannot send mail, so nothing was minted and the previous invite still stands
            (`mail_unavailable`); or the send errored, in which case the fresh invite was revoked and the
            superseded one is **not** restored (`mail_send_failed`, safe to retry). ADR 0055.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }

  /api/tenants/{tenantId}/member-invites/{inviteId}:
    delete:
      tags: [tenants]
      operationId: revokeMemberInvite
      summary: Revoke a pending member invite (owner-gated).
      description: >
        Soft-transitions the given pending MEMBER invite to a terminal state, so a later replay of its secret at
        `accept` is rejected (`invite_no_longer_valid`) and the reserved email is freed to re-invite. Owner-gated.
        **Additive-safe** — it touches no grant and no already-joined member (removing a *member* is a later
        slice, ADR 0020).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: The pending invite was revoked.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner. Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such pending invite for this tenant (`invite_not_found`); or no such tenant, or the caller is
            not a member of it (`tenant_not_found`, deliberately indistinguishable, ADR 0042: membership is
            the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invite_not_found }

  /api/tenants/{tenantId}/members/{userId}:
    delete:
      tags: [tenants]
      operationId: removeTenantMember
      summary: Remove a member from a tenant (ACL-revoke cascade + the group orphan rule).
      description: >
        The tenant **owner** removes a member (uc.spaces.remove-tenant-member, ADR 0014 §6): a tenant-level
        **cascade**, distinct from the scope-level `removeMember` (a single group membership). Cuts the target's
        **shared** access at once — deletes their TENANT-scope membership and every **co-shared** GROUP membership
        (an instant 403 on shared content; the tenant content key is **not** rotated, ADR 0025 — ACL-revoke). Applies
        the **orphan rule** to groups they solely owned: transfer OWNER to the **oldest** remaining member, else the
        solo group is grace-tombstoned. The target's **own** scopes (personal + any solo group) are grace-tombstoned
        with their **membership kept** (read-only grace, then `ScopePurge` — cr-0090), so they can read/export their
        own content before erasure. Membership-gated first (a non-member gets `404 tenant_not_found`, ADR 0042),
        then owner-gated (`403 not_tenant_owner`); the **last-owner guard** rejects removing
        the last tenant OWNER (`409 last_owner`, ADR 0007). Operator-blind: only membership deletions + a lifecycle
        timestamp — never a key. Enforced by code, not this spec (ADR 0008).

        Every scope the removal cuts — the TENANT scope and each co-shared GROUP — counts the removal in the same
        transaction, so a co-member's link minted before it, which the removed member could have rebuilt from its
        recovery copy, can no longer be re-activated, only re-issued
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md) point 4). With
        `revokeLinks=true` the same transaction also turns off **every** enabled public share of the **TENANT scope**,
        whoever created it, each then coming back only by re-issue (point 5) — not the co-shared groups', which the
        tenant owner need not see. A refused removal (`not_tenant_owner`, `member_not_found`, `last_owner`) writes
        nothing, the switch-off included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, description: Opaque id of the member to remove., schema: { type: string, format: uuid } }
        - name: revokeLinks
          in: query
          required: false
          description: >
            Also turn off every enabled public share of the TENANT scope in the removal's transaction (ADR 0075).
            Omitted or false = only the removed member's own shares go off.
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: The member was removed (shared access cut; own scopes grace-tombstoned).
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of this tenant but not its owner (only the owner may remove members). Or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_tenant_owner }
        "404":
          description: >
            No such member of this tenant (`member_not_found`); or no such tenant, or the caller is not a
            member of it (`tenant_not_found`, deliberately indistinguishable, ADR 0042: membership is the
            first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }
        "409":
          description: The last remaining tenant OWNER cannot be removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: last_owner }

  /api/tenants/{tenantId}/members/{userId}/avatar:
    get:
      tags: [tenants]
      operationId: getMemberAvatar
      summary: Read a tenant member's sealed profile picture.
      description: >
        A member's profile picture (uc.spaces.set-profile-picture, [ADR 0084](../../docs/decisions/0084-a-members-profile-picture-is-a-sealed-attribute-of-their-tenant-profile.md)):
        the one constant-length ciphertext they sealed under `K_tenant`, which any tenant member opens on the device.
        Gated on **tenant membership** like the directory: a caller who is not an accepted member of the tenant gets the
        `404 tenant_not_found` of [ADR 0042](../../docs/decisions/0042-http-failure-projection.md). Never served to a
        guest or on a share. The `ETag` is the profile's `avatarRevision` (quoted); a client echoing it as `If-None-Match`
        gets `304` with no body while the picture is unchanged. `Cache-Control: private`. The operator sees an opaque
        constant-size blob, never the image.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, description: Opaque id of the member whose picture to read., schema: { type: string, format: uuid } }
        - name: If-None-Match
          x-veyq-visibility: structure
          in: header
          required: false
          description: >
            The `ETag` of the client's cached picture (the member's `avatarRevision`, quoted). When it equals the current
            revision the server answers `304`. Omitted on a first load; one that does not parse is no match.
          schema: { type: string, maxLength: 64, example: "\"3\"" }
      responses:
        "200":
          description: The member's sealed picture.
          headers:
            ETag:
              x-veyq-visibility: structure
              description: The picture's `avatarRevision`, quoted - echo it as `If-None-Match` on the next read.
              schema: { type: string, example: "\"3\"" }
            Cache-Control:
              x-veyq-visibility: structure
              description: Always `private` - the picture is for the signed-in member only, never a shared cache.
              schema: { type: string, example: private }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberAvatar" }
        "304":
          description: Not Modified - the client's `If-None-Match` equals the member's current `avatarRevision`. No body.
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            No picture is set for that member (`avatar_not_found`, also when the user is no member of the tenant); or no
            such tenant, or the caller is not a member of it (`tenant_not_found`, deliberately indistinguishable, ADR
            0042: membership is the first gate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: avatar_not_found }

