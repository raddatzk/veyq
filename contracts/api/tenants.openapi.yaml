        erasureDueAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            For an application's own entry, the day its content in this tenant is erased, while one is named
            (`ApplicationErasure.dueAt`, uc.platform.erase-switched-off-application). Absent for every other entry,
            and while the application is on.
          example: 2026-11-25T10:00:00Z

    CapabilityText:
      type: object
