openapi: 3.1.0
info:
  title: veyq Setup API
  version: 0.1.0
  description: >
    First-run bootstrap of a veyq instance. A fresh instance has no owner; this API creates the first
    account (Server Owner) as an end-to-end-encrypted account and then locks setup to a single owner.

    The server is operator-blind: it receives only ciphertext (wrapped key material), public keys and
    low-sensitivity operational metadata. It performs **no content crypto** and never sees the raw
    password — authentication uses a password-derived Ed25519 keypair (the client registers only the
    public key; login is challenge-response). See ADR 0003.

    Field validation and sanitization are declared here and enforced by the generated code via the
    `x-field-extra-annotation` vendor extension (bean-validation constraints + a trimming Jackson
    deserializer), so malformed input is rejected at the boundary (400) before any handler runs.

    **Cross-origin** ([ADR 0121](../../docs/decisions/0121-a-received-share-is-browsed-in-place-through-its-own-api.md)
    decision 3). `GET /api/setup` answers any origin while `core.public-shares.embeddable` is effective at the instance
    level: another instance's client reads it to decide whether this instance's links can be browsed in place (its
    major and its capabilities). A CORS preflight is answered `204` and every answer carries
    `Access-Control-Allow-Origin: *` and `Cross-Origin-Resource-Policy: cross-origin`, exactly as the guest share
    operations do (`sharing.openapi.yaml` § Cross-origin); never `Access-Control-Allow-Credentials`. `/api/setup/owner`
    stays same-origin. A preflight is HTTP, not an operation, so no `options` is declared here.
tags:
  - name: setup
    description: First-run instance setup and the single-owner lock.

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/setup:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Report whether first-run setup is still required.
      description: >
        Returns whether the instance still needs its first owner, plus the crypto suites the server
        advertises. Reachable whether or not setup is complete.
      responses:
        "200":
          description: Current setup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
              examples:
                fresh:
                  summary: A fresh instance
                  value:
                    setupRequired: true
                    suites: ["v1"]
                    instanceSalt: aW5zdGFuY2Utc2FsdC0xNmI=
                    version: { major: 1, build: 1 }
                    capabilities:
                      - { id: core.public-shares }
                      - { id: core.public-shares.contribute }
                      - { id: core.public-shares.drop-box }
                      - { id: core.group-space }
                      - { id: core.remember-device }
                      - { id: core.remember-device.passwordless }
                      - { id: core.device-linking }
                done:
                  summary: An instance that is already set up
                  value:
                    setupRequired: false
                    suites: ["v1"]
                    instanceSalt: aW5zdGFuY2Utc2FsdC0xNmI=
                    version: { major: 1, build: 1 }
                    capabilities:
                      - { id: core.public-shares }
                      - { id: core.public-shares.contribute }
                      - { id: core.public-shares.drop-box }
                      - { id: core.group-space }
                      - { id: core.remember-device }
                      - { id: core.remember-device.passwordless }
                      - { id: core.device-linking }

  /api/setup/owner:
    post:
      tags: [setup]
      operationId: createServerOwner
      x-veyq-channel: admin
      summary: Create the first Server Owner and complete setup.
      description: >
        Creates the first account as an E2EE registration and marks setup complete (single-owner lock).
        The body carries only ciphertext, public keys and operational metadata; the server stores them
        as-is. It does not verify the password (there is none) — `authPublicKey` is stored for later
        challenge-response login. In the same transaction it stores `moderationEpoch`, epoch 1 of the instance
        moderation key sealed to this identity, and records the Server Owner as its first moderator (ADR 0099 § 3);
        an epoch that is no public bundle answers `400 invalid_request` and stores nothing. Setup asks for no operator
        value: every one is optional and set later in admin-web (ADR 0093 § 14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServerOwnerRequest" }
            example:
              email: kevin@example.com
              suiteId: v1
              identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
              wrappedIdentityPrivateKey: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==
              authPublicKey: ZWQyNTUxOS1hdXRoLXB1Yg==
              masterKeyWraps:
                - method: PASSWORD
                  wrappedKey: d3JhcHBlZC1tYXN0ZXIta2V5
              secretKeyProofPublicKey: c2VjcmV0LWtleS1wcm9vZi1wdWJsaWMta2V5
              moderationEpoch: { kemPublicKey: a2VtLXB1YmxpYy1rZXk=, signPublicKey: c2lnbi1wdWJsaWMta2V5, sealedGrant: c2VhbGVkLWdyYW50 }
      responses:
        "201":
          description: The Server Owner was created and setup is now locked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResult" }
              example: { userId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
        "400":
          description: The request was malformed (missing/invalid fields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "409":
          description: Setup is already complete; a second owner cannot be bootstrapped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: setup_already_complete }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

components:
  schemas:
    SetupStatus:
      type: object
      required: [setupRequired, suites, instanceSalt, version, capabilities]
      properties:
        setupRequired:
          x-veyq-visibility: public
          type: boolean
          description: True while the instance has no owner yet.
          example: true
        version:
          $ref: "#/components/schemas/Version"
        capabilities:
          type: array
          description: >
            The instance's ACTIVE capability manifest (ADR 0032, ADR 0088), the instance level only: a tenant owner's
            narrowing is delivered after sign-in (`getTenantCapabilities`). The abilities this build supports,
            sourced from the catalog contracts/platform/capabilities.json, minus the ids the Server Owner switched
            off (`setInstanceCapability`, which acts without a restart). An id is listed only when it and every ancestor entry
            are active (the AND along the path), so a switched-off parent drops its children too; the server
            computes that, and a client reads each leaf id without ANDing. Pre-auth, identity-free and identical
            for every caller (operator-blind-safe) — it advertises only instance-wide abilities, never per-user
            data. A client soft-gates each optional feature on the presence of its id (absent => hidden). The
            wire shape is intentionally [{ id }]; the catalog's serves[]/source metadata stays off the wire.
          items: { $ref: "#/components/schemas/Capability" }
          example:
            - { id: core.public-shares }
            - { id: core.public-shares.drop-box }
        musicReleased:
          x-veyq-visibility: flag
          type: boolean
          description: >
            TEMPORARY release flag of background music (ADR 0131 decision 8, owner 2026-11-13): true only while the
            deployment sets VEYQ_MUSIC_RELEASED=true. While false the web draws no music surface at all and the server
            serves none of the three music entries; while true, the music behaves as built (the `memories.music`
            entries decide). Absent reads as false. Removed when the music is released: `git grep -iE
            'music[._-]?released'` lists every site.
          example: false
        suites:
          x-veyq-visibility: public
          type: array
          description: Crypto suite ids the server advertises (e.g. "v1").
          items: { type: string, maxLength: 16, example: v1 }
          example: [v1]
        instanceSalt:
          type: string
          description: >
            Instance-wide salt for deriving each account's auth salt (authSalt = HKDF(instanceSalt,
            normalizedEmail); ADR 0003). Generated once at first run, stable for the life of the instance
            and identical for everyone — public, not a secret. The setup client needs it to derive the
            owner's auth keypair; login receives the same value in the challenge response.
          contentEncoding: base64
          maxLength: 256
          example: aW5zdGFuY2Utc2FsdC0xNmI=

    Version:
      type: object
      description: >
        The instance's advertised version (ADR 0032). Two parts with different roles: `major` is the hard
        compatibility gate, `build` is informational only. Nothing more precise is advertised before login: the
        release `<major>.<minor>` is Server-Owner-only (ADR 0057 §4).
      required: [major, build]
      properties:
        major:
          x-veyq-visibility: public
          type: integer
          format: int32
          description: >
            The ONLY hard-compatibility gate, and the platform's one major (ADR 0085 decision 1): the same number
            as the major of the release this server runs, taken from the repository's VERSION file when the
            server was built. It moves only when something an older client might rely on is REMOVED, on the
            yearly train that leaves on 1 May, or in an unscheduled major that removes only an insecure piece.
            Everything additive (a new capability, field or endpoint) is a minor and never moves it. A client
            checks it before login against the majors it speaks: the web client and the admin console ship in
            the server's own image and speak exactly its major; a store-shipped client speaks every major
            released since the train before last (ADR 0085 decision 5). A server major newer than any the client
            speaks => a blocking "update your app" state; older than any it speaks => a blocking "update this
            server" state — never a silent partial failure. `0` is pre-release: no released client speaks it.
          minimum: 0
          example: 1
        build:
          x-veyq-visibility: public
          type: integer
          format: int32
          description: >
            Hand-maintained build counter, informational only (diagnostics, "what's new") — nothing bumps it
            automatically and it gates nothing, so a stale value costs nothing observable. It is NOT the
            release version: which bits are running is a different question, answered by the Server-Owner-only
            `GET /api/instance/release`. That release shares this response's `major`; only its precision stays
            off the pre-auth surface (ADR 0057 §4).
          minimum: 0
          example: 1

    Capability:
      $ref: '_common.openapi.yaml#/components/schemas/Capability'

    ModerationEpochOne:
      type: object
      description: >
        Epoch 1 of the instance moderation key (ADR 0099 § 3; owner 2026-10-17), minted in the same first-run setup that
        births the Server Owner: the setup client draws `M_1`, derives its public bundle, seals `M_1` to the identity
        public key in this very request (`sealTo` purpose `moderation-grant` [1]) and forgets it. So reporting is on from
        the first day, and the Server Owner is its first moderator. The server stores the bundle and the sealed grant,
        never `M_1`; a later epoch is minted on the admin channel (`mintModerationEpoch`).
      required: [kemPublicKey, signPublicKey, sealedGrant]
      properties:
        kemPublicKey:
          type: string
          description: Epoch 1's X-Wing encapsulation key (1216 bytes), which reports seal to.
          contentEncoding: base64
          maxLength: 1700
          example: a2VtLXB1YmxpYy1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1700) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        signPublicKey:
          type: string
          description: Epoch 1's Ed25519 public key (32 bytes), which checks a key proof.
          contentEncoding: base64
          maxLength: 64
          example: c2lnbi1wdWJsaWMta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedGrant:
          type: string
          description: "`M_1` sealed to this request's identity public key (`sealTo` purpose `moderation-grant` [1])."
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWdyYW50
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    MasterKeyWrap:
      $ref: '_common.openapi.yaml#/components/schemas/MasterKeyWrap'

    CreateServerOwnerRequest:
      type: object
      required:
        - email
        - suiteId
        - identityPublicKey
        - wrappedIdentityPrivateKey
        - masterKeyWraps
        - authPublicKey
        - secretKeyProofPublicKey
        - moderationEpoch
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The account's login identifier and the source of its deterministic auth salt (ADR 0003) — authentication can
            neither resolve the account nor derive its salt without this plaintext.
          type: string
          format: email
          description: The owner's login email — identifier and source of the deterministic auth salt (ADR 0003). Server-visible.
          maxLength: 254
          example: kevin@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:me.raddatz.veyq.core.validation.Mailbox @field:jakarta.validation.constraints.Size(max = 254)'
        suiteId:
          x-veyq-visibility: enum
          type: string
          description: Crypto suite the client used to produce the wrapped material.
          enum: [v1]
          example: v1
        identityPublicKey:
          type: string
          description: The owner's identity public key bundle (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedIdentityPrivateKey:
          type: string
          description: The identity private key wrapped under the Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        masterKeyWraps:
          type: array
          description: One wrap per chosen unlock method; PASSWORD is the mandatory floor.
          minItems: 1
          items: { $ref: "#/components/schemas/MasterKeyWrap" }
          # @Valid cascades bean-validation into each MasterKeyWrap (wrappedKey/kdfParams/method), and
          # @Size(min=1) enforces minItems (the PASSWORD floor) — both at the boundary, before the handler.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1) @field:jakarta.validation.Valid'
        authPublicKey:
          type: string
          description: >
            The Ed25519 auth public key derived from the password (ADR 0003). Server-visible and NOT a
            credential — login proves possession of the matching private key via challenge-response.
          contentEncoding: base64
          maxLength: 8192
          example: ZWQyNTUxOS1hdXRoLXB1Yg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        secretKeyProofPublicKey:
          type: string
          description: >
            The account's Secret-Key proof key (ADR 0060 Decision 2): the Ed25519 public key derived from the
            Secret Key alone. Rotation, change-password and recovery must each carry a signature under it, so a
            session or a phished password is not enough to mint a cold credential. Reveals nothing: the Secret
            Key is 256 random bits.
          contentEncoding: base64
          maxLength: 128
          example: c2VjcmV0LWtleS1wcm9vZi1wdWJsaWMta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        moderationEpoch:
          $ref: "#/components/schemas/ModerationEpochOne"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    SetupResult:
      type: object
      required: [userId]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the created Server Owner.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
