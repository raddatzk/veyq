openapi: 3.1.0
info:
  title: veyq Auth API
  version: 0.1.0
  description: >
    Operator-blind account login and session management.

    Login is challenge-response over a password-derived Ed25519 keypair (ADR 0003): the client requests a
    single-use nonce, signs it with the private key it derives from the password, and the server verifies
    against the stored `authPublicKey`. The password never reaches the server and nothing replayable is
    transmitted; the stored public key is not a credential.

    A successful login issues an opaque, rotating **access + refresh** token pair grouped into a **session
    family** (ADR 0004). Refresh rotates the pair; presenting a superseded refresh token revokes the whole
    family (reuse detection) — except the one generation immediately behind the current one, which rotates
    instead, so a client that never received its successor is not mistaken for a clone. This API gates only a **session** — it performs no content crypto and never
    unlocks content (auth ≠ unlock).

    Challenge issuance and every failure are deliberately **non-enumerable**: the server behaves
    identically for existing and non-existing accounts.

    Field validation and sanitization are declared here and enforced by the generated code via the
    `x-field-extra-annotation` vendor extension, so malformed input is rejected at the boundary (400).
tags:
  - name: login
    description: Challenge-response login (issue a session).
  - name: token
    description: Session token rotation.
  - name: session
    description: Session lifecycle (logout, list every active session, revoke one or all others remotely).
  - name: recovery
    description: >
      Password recovery (ADR 0054). Unauthenticated by necessity — the actor has no password — and gated on
      two independent factors instead: a mailed one-time token proving address control, and reproduction of
      the birth-time commitment proving possession of the Secret Key. Not escrow: the server hands out
      ciphertext it cannot open, to a party that must already hold the key that opens it.
  - name: pairing
    description: >
      Device linking (ADR 0059). A short-lived, single-use channel over which one device hands another the
      Master Key and a session, and a session delegation that mints the family the second device could never
      obtain by itself — it never learns the password, and the auth keypair is password-derived (ADR 0003).
      Every operation of the tag is gated by the `core.device-linking` capability (`422 capability_disabled`
      while it is switched off, ADR 0088 decision 11).

      The server relays three opaque values and interprets none of them: the routing handle, one `answer` and
      one sealed grant. `answer` means slightly different things in the two directions — the new device's
      ephemeral transport key when *adding a device*, that key bound to the transcribed code when *signing in
      with a QR code* — and the server must not be able to tell them apart: checking a code server-side would put
      a malicious operator past the only barrier there is (ADR 0059 §6, ADR 0026). Both the answer and the grant
      carry a MAC under a channel key derived from a secret the displayed code carries and the server never
      receives (ADR 0059 §11); the handle is derived from that same secret, so the relay holds the address and
      not the key.

      Nothing on this wire carries a URL or names a server (ADR 0059 §4), and no request from the device
      being onboarded names an account.

paths:
  /api/login/challenge:
    post:
      tags: [login]
      operationId: requestLoginChallenge
      summary: Issue a single-use login challenge (non-enumerable).
      description: >
        Returns a single-use, time-bounded nonce for the client to sign, plus the instance salt needed to
        derive the auth keypair. The response is identical whether or not the account exists, so it never
        reveals which emails have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginChallengeRequest" }
            example: { email: kevin@example.com }
      responses:
        "200":
          description: A challenge to sign (issued whether or not the account exists).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginChallenge" }
              example: { nonce: bm9uY2UtZXhhbXBsZS0zMmJ5dGVz, instanceSalt: aW5zdGFuY2Utc2FsdC0xNmI= }
        "400":
          description: The request was malformed (missing/invalid email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }

  /api/login/verify:
    post:
      tags: [login]
      operationId: verifyLogin
      summary: Verify a signed challenge and issue a session.
      description: >
        Verifies the Ed25519 signature over the nonce the request **names** against the stored
        `authPublicKey`. An email may have several outstanding challenges; a verify consumes only the one it
        names, whether or not it succeeds, and every other challenge for the same email stays outstanding —
        so nobody who merely knows the address can displace or burn the challenge a device is signing. On
        success it issues an opaque access + refresh token pair in a new session family. Any failure —
        wrong signature, unknown account, or an unknown/expired/replayed nonce — returns a single generic
        401, identical in every case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginVerifyRequest" }
            example: { email: kevin@example.com, nonce: bm9uY2UtZXhhbXBsZS0zMmJ5dGVz, signature: c2lnbmF0dXJlLW92ZXItbm9uY2U= }
      responses:
        "200":
          description: >
            Authenticated; a new session family with its tokens. A web request that chose a `sessionScope`
            (or the legacy `remember`) gets the refresh token as an httpOnly `Set-Cookie` and **omits** it
            from the body; a native request that sends neither keeps the refresh token in the body and gets
            no cookie.
          headers:
            Set-Cookie:
              x-veyq-visibility: token
              description: >
                Present only when `sessionScope` (or legacy `remember`) chose the cookie transport. The
                refresh token as an httpOnly + SameSite=Strict cookie scoped to `/api/token/refresh` —
                `veyq_refresh` for `PERSISTENT`/`remember` (with `Max-Age`), `veyq_refresh_session` for
                `SESSION` (no `Max-Age`). A clearing cookie for the other lifetime is sent alongside, so
                exactly one refresh cookie ever exists (ADR 0004 § web refresh cookie lifetimes).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: The request was malformed (missing/invalid fields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (wrong signature, unknown account, or stale nonce).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/token/refresh:
    post:
      tags: [token]
      operationId: refreshSession
      summary: Rotate the session tokens.
      description: >
        Exchanges a valid refresh token for a fresh access + refresh pair and supersedes the old refresh
        token. A superseded token is read by how far behind the family's current generation it is (ADR 0004
        § the one-generation grace): exactly **one** generation behind rotates — that is a caller whose
        successor never reached it, and the successor is re-minted under the same generation number —
        while **zero** (a successor a grace rotation already replaced) or **two or more** is a clone and
        revokes the entire family. An unverifiable, expired, or revoked token is a plain 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
            example: { refreshToken: cmVmcmVzaC10b2tlbi1vcGFxdWU }
      responses:
        "200":
          description: >
            A rotated access + refresh pair. A request that presented its refresh token via cookie gets the
            successor as a fresh `Set-Cookie` and **omits** `refreshToken` from the body; a request that
            presented it in the body gets the successor in the body and no cookie.
          headers:
            Set-Cookie:
              x-veyq-visibility: token
              description: >
                Present only when the request's refresh token arrived via cookie. The rotated refresh token
                as an httpOnly + SameSite=Strict cookie scoped to `/api/token/refresh`, re-issued under the
                **same** name (`veyq_refresh` or `veyq_refresh_session`) the request carried it on — rotation
                never silently changes the lifetime (ADR 0004 addendum). A clearing cookie for the other
                lifetime is sent alongside, so exactly one refresh cookie ever exists.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: The request was malformed (missing token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: The refresh token is invalid, expired, or its family was revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: refresh_rejected }

  /api/token/adopt:
    post:
      tags: [token]
      operationId: adoptSession
      summary: Convert a handed-over refresh token into this device's own cookie-borne session.
      description: >
        The login-equivalent for a device that has no password. A device-linking grant
        (ADR 0059 §2) hands a refresh token to a device that
        holds no cookie yet, so the token arrives in a **body** — the one place ADR 0004 § Transport permits
        that. This verb spends it: the presented token is rotated through the same rotation refresh uses, and
        the successor comes back as an httpOnly refresh cookie plus the session's own family id, never as a
        body token. The handed-over token is therefore a **one-shot bearer**, superseded by the time the
        response lands. A second presentation is still fatal, but by distance rather than unconditionally
        (ADR 0004 § the one-generation grace): a device whose adopt response was *lost* re-presents at
        distance one and recovers, which is the case the grace exists for, while the successor it orphans is
        at distance zero and takes the family down.

        Adoption changes **transport, never authority** — its caller must already present a valid CURRENT
        refresh token, exactly what refresh demands — so it is deliberately not gated on how the family was
        born. A request that already carries a refresh cookie is **refused**, not honoured: this device is
        supposed to have no session here, and honouring it would silently swap one session for another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenAdoptRequest" }
            example: { refreshToken: cmVmcmVzaC10b2tlbi1vcGFxdWU, sessionScope: SESSION }
      responses:
        "200":
          description: >
            The grant is spent and this device now holds its own session. The rotated refresh token rides the
            `Set-Cookie` header; the body carries the access token and the family id (which the device needs to
            write its own entry in the Master-Key-sealed device register, ADR 0004 § Session family) and
            **omits** `refreshToken`.
          headers:
            Set-Cookie:
              x-veyq-visibility: token
              description: >
                The rotated refresh token as an httpOnly + SameSite=Strict cookie scoped to
                `/api/token/refresh` — `veyq_refresh` for `PERSISTENT` (with `Max-Age`), `veyq_refresh_session`
                for `SESSION` (no `Max-Age`). A clearing cookie for the other lifetime is sent alongside, so
                exactly one refresh cookie ever exists (ADR 0004 § web refresh cookie lifetimes).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: >
            The request was malformed, or it already carried a refresh cookie — adoption is only for a device
            that holds no session here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: >
            The presented token is unknown, expired, superseded, or its family was revoked — the same
            undifferentiated failure refresh gives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: refresh_rejected }

  /api/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Revoke the current session family.
      description: >
        Revokes the session family of the presented access token. Idempotent — a missing or
        already-invalid session still returns 204.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >
            The session family is revoked (or was already gone). Both web refresh cookies are cleared
            unconditionally — a no-op for a native caller that never held one.
          headers:
            Set-Cookie:
              x-veyq-visibility: token
              description: >
                Clearing cookies (`Max-Age=0`) for both `veyq_refresh` and `veyq_refresh_session`, scoped to
                `/api/token/refresh` — sent on every call regardless of which, if either, the browser holds.
              schema: { type: string }

  /api/sessions:
    get:
      tags: [session]
      operationId: listSessionFamilies
      summary: List the account's active session families.
      description: >
        Returns every **ACTIVE** session family of the authenticated caller's own account — one per login /
        device — with its opaque id, its created and last-used timestamps, and a flag marking the family this
        request arrived on. Revoked and expired families are not listed; they are noise, and the purge removes
        them anyway.

        The server has nothing else to return, and that is the point: a family carries **no name, no
        user-agent and no address** (ADR 0004), so this endpoint hands back exactly what the operator already
        held. Display names live only in the client's Master-Key-sealed device register and are joined in
        on-device — which is why this needs only a session and never an unlock (auth ≠ unlock, ADR 0003): a
        locked client still renders the full list, with dates in place of names.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's active session families.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionFamily" }
              example:
                - id: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  createdAt: 2026-08-01T09:12:00Z
                  lastUsedAt: 2026-08-12T07:45:00Z
                  current: true
                - id: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  createdAt: 2026-07-03T18:30:00Z
                  lastUsedAt: 2026-08-10T21:02:00Z
                  current: false
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/sessions/revoke-others:
    post:
      tags: [session]
      operationId: revokeOtherSessionFamilies
      summary: Sign out everywhere else (revoke every family except the caller's own).
      description: >
        Revokes every ACTIVE session family of the caller's account **except** the one this request arrived
        on. Signing out the device in hand is `/api/logout`, deliberately not this: a "sign out everywhere"
        that also ejects the person securing the account is a footgun, not a feature.

        Idempotent — an account with no other family still returns 204. The surviving caller session is the
        contract, not an implementation detail.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Every other session family is revoked; the caller's own is untouched.
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/sessions/{id}:
    delete:
      tags: [session]
      operationId: revokeSessionFamily
      summary: End one session remotely (revoke a family by id).
      description: >
        Revokes the caller's session family with this id — the remote sign-out that `/api/logout` cannot do,
        because logout can only end the family it is presented from. **Idempotent** (like logout and the wrap
        untrust): the family is revoked only if it is the caller's own; an unknown id, an already-revoked one,
        or another account's family is a silent no-op with the **same 204**, so this cannot be used to probe
        which ids exist. An id that is no UUID matches no route (404): the id column is a UUID, and the path
        segment is parsed as one before any query.

        Revoking the caller's **own** family is permitted and means "sign me out here too" — the client treats
        the response as a logout.

        What this takes away is **server access, not key material**: a device keeps any convenience wrap it
        enrolled, which is removed separately (uc.account.trust-device).
      parameters:
        - name: id
          in: path
          required: true
          description: The opaque id of the session family to revoke (from the session list).
          schema: { type: string, format: uuid, example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c }
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The family is revoked (or there was no active family of yours with that id).
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/recovery/request:
    post:
      tags: [recovery]
      operationId: requestPasswordRecovery
      summary: Request a password-recovery link (non-enumerable).
      description: >
        Mints a one-time recovery token and mails its link to the address, if an account under it is a
        member of the tenant this request's `Host` resolves to. Only that tenant's relay ever carries the
        link, so a tenant owner never receives mail for an account that is not theirs (ADR 0054 §4). The
        request is answered before the address is looked up — the lookup, the mint and the send happen after
        the answer — so the response is identical in status, body and timing whether the address is a member
        here, belongs elsewhere or is unknown, the same posture as the login challenge (ADR 0004). A new
        request supersedes any outstanding token for that account. Rate-limited per address and per source.

        Non-enumerability covers the **address** and nothing more. Whether the tenant addressed by this
        request's `Host` can send mail at all is a property of the deployment, not of any account, so it is
        answered plainly with `503 mail_unavailable` instead of a silent `202` (ADR 0055 §4). That check runs
        **before** the rate limiter, so a limited and an unlimited request cannot be paired into an
        address-level oracle (ADR 0055 §5). There is no capability to ask in advance: a client may always
        offer the reset link and let the request fail honestly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: Accepted. Says nothing about whether the address is registered.
        "429":
          description: Too many recovery requests; retry after the indicated delay.
          content:
            application/json:
              schema: { $ref: "./_common.openapi.yaml#/components/schemas/ErrorResponse" }
        "503":
          description: >
            This tenant has no working mail transport, so a recovery link cannot be sent and none was minted
            (`mail_unavailable`). There is deliberately no copy-link fallback — routing a recovery link through
            the operator would make them a participant in a flow built to exclude them (ADR 0054 § Decision 4).
          content:
            application/json:
              schema: { $ref: "./_common.openapi.yaml#/components/schemas/ErrorResponse" }

  /api/recovery/release:
    post:
      tags: [recovery]
      operationId: releaseRecoveryMaterial
      summary: Exchange a recovery token for the withheld RECOVERY wrap.
      description: >
        Returns the account's `RECOVERY` master-key wrap — the one the ordinary key-material read filters
        out. Gated **only** on a live, unspent recovery token, never on a session: releasing it to an
        authenticated caller would let a live session plus the Secret Key open the vault without the
        password, demoting the password from a content factor (ADR 0054 § Context 2).

        The returned wrap is opened by the **Secret Key alone**, so this response is useless to anyone who
        does not hold the Emergency Kit. The token is not spent here — it is spent by the completing reset,
        so a wrong Secret Key costs the caller nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryTokenRequest" }
      responses:
        "200":
          description: The recovery material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryMaterial" }
        "404":
          description: The token is unknown, expired or already spent. Deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "./_common.openapi.yaml#/components/schemas/ErrorResponse" }

  /api/recovery/complete:
    post:
      tags: [recovery]
      operationId: completePasswordRecovery
      summary: Set a new password against a proven Secret Key.
      description: >
        Applies the reset in one transaction: replace the `PASSWORD` wrap, overwrite the auth public key,
        delete every wrap but `PASSWORD` and `RECOVERY`, revoke all sessions, and spend the token.

        Accepted only if `secretKeyProofSignature` verifies against the account's **Secret-Key proof key** —
        derived from the Secret Key alone and registered at account birth — over a statement the server
        rebuilds from this request: the token, the new auth key and the new `PASSWORD` wrap (ADR 0054
        Decision 1, ADR 0060 Decision 2). A caller with mailbox access alone cannot produce it, and neither can
        a linked device, which holds the Master Key but never saw the Secret Key; the server stores only the
        public key, so a database dump cannot produce it either. The Master Key is unchanged, so **no content
        is re-encrypted** and the Emergency Kit stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryCompleteRequest" }
      responses:
        "204":
          description: The password is reset; sign in with it. All device trust is gone.
        "403":
          description: >
            `secret_key_proof_failed` — the signature did not verify against the account's Secret-Key proof
            key. The token is **not** spent, so a mistyped Emergency Kit costs a retry, not the mail. Nothing
            was written.
          content:
            application/json:
              schema: { $ref: "./_common.openapi.yaml#/components/schemas/ErrorResponse" }
              example: { code: secret_key_proof_failed }
        "404":
          description: The token is unknown, expired or already spent.
          content:
            application/json:
              schema: { $ref: "./_common.openapi.yaml#/components/schemas/ErrorResponse" }

  /api/pairing/open:
    post:
      tags: [pairing]
      operationId: openPairingChannel
      summary: Open a pairing channel under a client-derived handle.
      description: >
        Opens the short-lived, single-use relay one device-linking ceremony runs over (ADR 0059 §8). The
        handle is derived by the client from the secret its displayed code carries (ADR 0059 §11); only its
        SHA-256 hash is stored, so the server recognises it at use and can never reproduce it — the recovery
        token's posture, one flow over.

        Unauthenticated, and it names no account. In the *sign in with a QR code* direction the channel is
        opened by a device with no session at all, so an account here is not merely unnecessary, it is
        unavailable — which account this becomes is decided by whoever scans (ADR 0059 §3). The account is
        bound later, at `/api/pairing/delegate`.

        Nothing is returned. The client already holds the only address this channel has, and a server-minted
        id would be a second one that can leak and that nothing needs. A handle that is already live answers
        with the same 204 as a fresh one: refusing it would confirm that a channel exists
        (uc.account.onboard-device E1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingOpenRequest" }
            example: { handle: cGFpcmluZy1oYW5kbGUtb3BhcXVl }
      responses:
        "204":
          description: The channel is open (or a live one already answers to this handle).
        "400":
          description: The request was malformed (missing/invalid handle).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "422": { $ref: "#/components/responses/DeviceLinkingDisabled" }

  /api/pairing/answer:
    post:
      tags: [pairing]
      operationId: answerPairingChannel
      summary: Post the one opaque answer this channel relays.
      description: >
        Writes the channel's single `answer`. The server stores it verbatim and derives nothing from it: it is
        the new device's ephemeral transport public key and a MAC over it under the channel key (ADR 0059 §11) —
        a MAC that, when *signing in with a QR code*, also binds the transcribed pairing code (§5, §6). The key
        travels in both directions because the trusted device has to seal to it either way; the code rides in
        this one slot because the seal takes no code and never may (§6). One shape and one length for both, so
        the relay cannot tell the two ceremonies apart — and cannot swap the key, because it never holds the
        channel key.

        Unauthenticated on purpose — in the *add a device* direction the caller is the device being onboarded,
        which has no session and must not have to name an account before it has one (ADR 0059 §3).

        A channel that is unknown, expired, spent or already answered gives the same `404
        pairing_channel_invalid`, so this cannot be used to probe which pairings exist (E1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingAnswerRequest" }
      responses:
        "204":
          description: The answer is recorded; the other side will see it on its next read.
        "400":
          description: The request was malformed (missing/invalid fields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "404":
          description: The channel is unknown, expired, spent or not awaiting an answer. Deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: pairing_channel_invalid }
        "422": { $ref: "#/components/responses/DeviceLinkingDisabled" }

  /api/pairing/delegate:
    post:
      tags: [pairing]
      operationId: delegatePairingSession
      summary: Mint the session family the granted device will receive, and bind the channel to this account.
      description: >
        Mints **one further session family for the caller's own account** and returns its refresh token to the
        caller — the second origin for a family beside the login (ADR 0059 §2, ADR 0004). The granted device
        never learns the password and the auth keypair is password-derived (ADR 0003), so it could not obtain
        a session by itself; this is how it gets one.

        The token is returned to the **trusted** device because the grant is sealed client-side: its plaintext
        must be in that device's hand before it can seal (`/api/pairing/seal`). Delegation is therefore its own
        call, made after the user's confirmation and immediately before the seal — never a side effect of it.

        This is where the account is bound to the channel, and where ADR 0059 §8's *one outstanding pairing per
        account* is enforced: the account's other live channels are superseded. A family delegated to a channel
        that then expires uncollected is revoked with it, so an abandoned ceremony leaves no live refresh token
        behind. Once collected, the family is ordinary in every respect ADR 0004 names — listed, rotating,
        revocable.

        Auth ≠ unlock: this grants a session and no plaintext (ADR 0003).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingDelegateRequest" }
      responses:
        "200":
          description: The delegated family's refresh token, to be sealed to the answering device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingDelegateResult" }
        "400":
          description: The request was malformed (missing/invalid handle).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: The channel is unknown, expired, spent or not awaiting a delegation. Deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: pairing_channel_invalid }
        "422": { $ref: "#/components/responses/DeviceLinkingDisabled" }

  /api/pairing/seal:
    post:
      tags: [pairing]
      operationId: sealPairingChannel
      summary: Post the sealed grant for the device being onboarded.
      description: >
        Writes the one ciphertext this channel carries: the Master Key, the delegated refresh token and the
        device's label, wrapped to the answering device's ephemeral transport public key (ADR 0059 §3). The
        server relays it and cannot open it.

        The sealing is what the binding step gates — a compared check number when *adding a device*, a proof of
        the transcribed code when *signing in with a QR code* — and that check runs **on the trusted device**,
        never here. A server that released the grant on a correct code would be past the only barrier there is
        (ADR 0059 §6, ADR 0026), so this endpoint takes no code and verifies none.

        Authenticated, because only the device that delegated may seal to the channel it bound.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingSealRequest" }
      responses:
        "204":
          description: The sealed grant is stored; the onboarded device can collect it once.
        "400":
          description: The request was malformed (missing/invalid fields).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            The channel is unknown, expired, spent, not this account's, or not awaiting a seal. Deliberately
            indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: pairing_channel_invalid }
        "422": { $ref: "#/components/responses/DeviceLinkingDisabled" }

  /api/pairing/collect:
    post:
      tags: [pairing]
      operationId: collectPairingChannel
      summary: Read the channel — the answer, then the sealed grant.
      description: >
        The single read, used by **both** sides: the trusted device polls it for the `answer`, the onboarded
        device polls it for the sealed grant. Reading the answer spends nothing; handing over the grant spends
        the channel, so the ceremony is single-use (ADR 0059 §8) and a second collect answers as a dead channel
        does.

        **Unauthenticated on purpose.** The grant is worthless without the ephemeral private key only the
        answering device holds, so gating this fetch would prove nothing and would force that device to name an
        account before it has one (ADR 0059 §3). Nothing in the request identifies a user, so there is no
        oracle to build — the handle's entropy is what makes the row unfindable.

        Both fields are absent until the corresponding step has happened; their presence is the whole state
        either side needs, which is why no status is returned. A grant nobody collects expires with the row
        (uc.account.onboard-device E3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingCollectRequest" }
      responses:
        "200":
          description: The channel's relayed values, each present only once its step has happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingChannel" }
        "400":
          description: The request was malformed (missing/invalid handle).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "404":
          description: The channel is unknown, expired or already spent. Deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: pairing_channel_invalid }
        "422": { $ref: "#/components/responses/DeviceLinkingDisabled" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh.

  responses:
    DeviceLinkingDisabled:
      description: >
        The `core.device-linking` capability is switched off instance-wide (ADR 0032, ADR 0088 decision 11), so
        no device is linked: every pairing endpoint refuses, which also stops a pairing already in flight.
        Enforced server-side even if a stale client still offers "sign in with code" or "add a device". It is
        independent of `core.remember-device`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: capability_disabled }

  schemas:
    LoginChallengeRequest:
      type: object
      required: [email]
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The account's login identifier and the source of its deterministic auth salt (ADR 0003) — authentication can
            neither resolve the account nor derive its salt without this plaintext.
          type: string
          format: email
          description: The account's login email — identifier and source of the deterministic auth salt (ADR 0003).
          maxLength: 254
          example: kevin@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'

    LoginChallenge:
      type: object
      required: [nonce, instanceSalt]
      properties:
        nonce:
          type: string
          description: Single-use, time-bounded challenge to sign with the auth private key (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: bm9uY2UtZXhhbXBsZS0zMmJ5dGVz
        instanceSalt:
          type: string
          description: Instance-wide salt for deriving the auth salt (authSalt = HKDF(instanceSalt, normalizedEmail); ADR 0003).
          contentEncoding: base64
          maxLength: 256
          example: aW5zdGFuY2Utc2FsdC0xNmI=

    LoginVerifyRequest:
      type: object
      required: [email, nonce, signature]
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The account's login identifier and the source of its deterministic auth salt (ADR 0003) — authentication can
            neither resolve the account nor derive its salt without this plaintext.
          type: string
          format: email
          description: The account's login email (same value used for the challenge).
          maxLength: 254
          example: kevin@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'
        nonce:
          type: string
          description: >
            The nonce of the challenge this request signed, echoed from `LoginChallenge.nonce` (opaque base64).
            It selects which outstanding challenge the verify consumes.
          contentEncoding: base64
          maxLength: 256
          example: bm9uY2UtZXhhbXBsZS0zMmJ5dGVz
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        signature:
          type: string
          description: Ed25519 signature over the named nonce (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: c2lnbmF0dXJlLW92ZXItbm9uY2U=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        remember:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: >
            The superseded "remember me" flag (ADR 0004 / ADR 0005 §15). Replaced by `sessionScope` (cr-0055)
            and honoured (→ a persistent cookie) only when `sessionScope` is absent. When true the server
            returns the refresh token as a persistent **httpOnly + Secure + SameSite cookie** instead of in the
            body, and `refreshToken` is omitted. No current client sends this.
        sessionScope:
          x-veyq-visibility: enum
          type: string
          description: >
            Cookie lifetime (ADR 0004 / ADR 0005 §22, cr-0055). **PERSISTENT** → a persistent httpOnly refresh
            cookie that survives a browser restart ("remember me"). **SESSION** → a session cookie (no
            `Max-Age`) that survives page reloads but is dropped when the browser closes (the default). When
            present it governs the transport — the refresh token rides the cookie and is omitted from the body
            — and takes precedence over `remember`. The cookie carries only the opaque refresh token, so the
            server stays operator-blind.
          enum: [SESSION, PERSISTENT]
          example: SESSION

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          x-veyq-visibility: token
          type: string
          description: >
            The opaque refresh token to rotate. **Optional**: the client sends the token in the httpOnly
            cookie instead (an empty body). The server uses the cookie when present, else this field; one of
            the two must be supplied. No current client uses this field.
          maxLength: 512
          example: cmVmcmVzaC10b2tlbi1vcGFxdWU
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512)'

    TokenAdoptRequest:
      type: object
      description: >
        A handed-over refresh token being converted into this device's own cookie-borne session (ADR 0004
        § Transport). Both fields are **required**, unlike their counterparts on `RefreshRequest` and
        `LoginVerifyRequest`: there is no cookie to fall back to and no legacy caller to be lenient towards.
      required: [refreshToken, sessionScope]
      properties:
        refreshToken:
          x-veyq-visibility: token
          type: string
          description: >
            The opaque refresh token this device was granted, carried in the body because a device with no
            cookie has no other way to receive one. It is spent by this call: the rotation supersedes it. A
            second presentation is answered by the same distance rule every refresh uses (ADR 0004 § the
            one-generation grace) — it recovers a lost response, it does not grant a second session.
          maxLength: 512
          example: cmVmcmVzaC10b2tlbi1vcGFxdWU
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        sessionScope:
          x-veyq-visibility: enum
          type: string
          description: >
            Cookie lifetime for the adopted session — the same closed set login offers (ADR 0004 § web refresh
            cookie lifetimes). **PERSISTENT** → `veyq_refresh`, surviving a browser restart; **SESSION** →
            `veyq_refresh_session`, dropped when the browser closes. Required here because adoption is the only
            place besides login where a lifetime is *chosen*: the device being onboarded holds no cookie to
            inherit one from, and a default would be the server answering a question ADR 0059 §2 assigns to the
            person holding the new machine.
          enum: [SESSION, PERSISTENT]
          example: SESSION
          # No `@NotNull` via x-field-extra-annotation, deliberately: `required:` alone already yields a 400
          # for a missing scope here, because the generated Kotlin property is non-null and deserialization
          # refuses it before the handler — measured by adding the annotation and removing it again with
          # `TokenAdoptSliceTest.theScopeIsRequiredAndAMissingOneIsRefusedAtTheBoundary` green both ways. The
          # explicit annotations elsewhere on this spec are `@NotBlank`, which catches a *blank* string that
          # nullability cannot see; an enum has no blank form, so one here would be ceremony.

    SessionFamily:
      type: object
      description: >
        One session family — one login on one device (ADR 0004). It is **nameless by design**: a
        client-encrypted name stored per family would be a blob the operator could match across logins, and so
        re-link families that are otherwise unlinkable. Names therefore live only in the client's
        Master-Key-sealed device register and are joined in on-device. **No name field may come back here.**

        The three descriptive fields below are returned by the session list; where a family is handed back as
        a bare reference to the login just issued (`SessionResponse.family`) only `id` is present.
      required: [id]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the session family (one login / device).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When this family was created — i.e. when that device last signed in.
          example: 2026-08-01T09:12:00Z
        lastUsedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            When this family last rotated its tokens, to the second. It moves only on a token refresh, so as
            that device's "last seen" it trails real use by up to one access-token lifetime.
          example: 2026-08-12T07:45:00Z
        current:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True for the family the request arrived on. Marked by the **server**, which knows it as
            self-knowledge about the caller, rather than guessed by the client — that is what keeps "this
            device" and "sign out everywhere else" honest against each other.
          example: true

    TokenPair:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          x-veyq-visibility: token
          type: string
          description: Opaque bearer access token (short-lived); sent as an Authorization bearer header.
          maxLength: 512
          example: YWNjZXNzLXRva2Vu
        refreshToken:
          x-veyq-visibility: token
          type: string
          description: >
            Opaque refresh token (long-lived); send only to /api/token/refresh. **Omitted** when the rotation
            rode the httpOnly cookie (web "remember me") — the new refresh token is then set as a fresh cookie.
          maxLength: 512
          example: cmVmcmVzaC10b2tlbg

    SessionResponse:
      type: object
      required: [accessToken, family]
      properties:
        accessToken:
          x-veyq-visibility: token
          type: string
          description: Opaque bearer access token (short-lived); sent as an Authorization bearer header.
          maxLength: 512
          example: YWNjZXNzLXRva2Vu
        refreshToken:
          x-veyq-visibility: token
          type: string
          description: >
            Opaque refresh token (long-lived); send only to /api/token/refresh. **Omitted** whenever the token
            rides an httpOnly cookie instead: a login that chose a `sessionScope` (or the legacy `remember`),
            and every adoption, which has no other transport by definition.
          maxLength: 512
          example: cmVmcmVzaC10b2tlbg
        family: { $ref: "#/components/schemas/SessionFamily" }

    RecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The account's login identifier and the address the recovery link must be delivered to — the flow can
            neither resolve the account nor address the mail without this plaintext.
          type: string
          format: email
          description: The address to mail a recovery link to, if an account exists under it.
          maxLength: 254
          example: kevin@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'

    RecoveryTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          x-veyq-visibility: token
          type: string
          description: >
            The one-time token from the recovery link's URL fragment. Only its SHA-256 hash is stored, so the
            server can recognise it but never reproduce it.
          maxLength: 512
          example: cmVjb3ZlcnktdG9rZW4
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'

    RecoveryMaterial:
      type: object
      description: >
        Enough to open the Master Key with the Secret Key alone: the RECOVERY wrap plus the identity private
        key it protects. Every byte here is ciphertext or a KDF parameter — the server derives nothing from it.
      required: [email, suiteId, wrappedKey, kdfParams, wrappedIdentityPrivateKey]
      properties:
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The account's login identifier and the source of its deterministic auth salt (ADR 0003) — the reset
            cannot derive the new auth keypair without it. Returned rather than asked for again: the caller
            reached this response by reading a mail sent to this very address, so it discloses nothing they do
            not already hold, and re-typing it is a step that can only go wrong.
          type: string
          format: email
          description: The account this token belongs to — the address the recovery mail was sent to.
          maxLength: 254
          example: kevin@example.com
        suiteId:
          x-veyq-visibility: enum
          type: string
          description: Crypto suite the wrapped material was produced under (selects the client crypto suite).
          enum: [v1]
          example: v1
        wrappedKey:
          type: string
          description: The Master Key wrapped under the recovery KEK — Argon2id over the Secret Key, no password.
          contentEncoding: base64
          maxLength: 8192
          example: cmVjb3Zlcnktd3JhcHBlZC1tYXN0ZXIta2V5
        kdfParams:
          type: string
          description: Argon2id parameters + salt for the recovery KEK, as carried at account birth.
          contentEncoding: base64
          maxLength: 1024
          example: a2RmLXBhcmFtcy1yZWNvdmVyeQ==
        wrappedIdentityPrivateKey:
          type: string
          description: The identity private key wrapped under the Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==

    RecoveryCompleteRequest:
      type: object
      description: >
        The new password's derived material, plus the proof that the caller holds the Secret Key. Applied
        atomically or not at all — a partial apply would leave an account that logs in but cannot unlock.
      required: [token, secretKeyProofSignature, wrappedKey, kdfParams, authPublicKey]
      properties:
        token:
          x-veyq-visibility: token
          type: string
          description: The same one-time token the release was made against; spent by this call.
          maxLength: 512
          example: cmVjb3ZlcnktdG9rZW4
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        secretKeyProofSignature:
          type: string
          description: >
            Ed25519 signature under the account's Secret-Key proof key (ADR 0060 Decision 2) over
            `veyq/v1/secret-key-proof/recovery`: a digest of `token`, `authPublicKey`, and a digest of the new
            `PASSWORD` wrap (`wrappedKey` + `kdfParams`). The encoding is pinned by the `secret_key_proof`
            crypto vector. The token is single-use and bound to one account, so a signature cannot be replayed
            into a later reset.
          contentEncoding: base64
          maxLength: 128
          example: c2VjcmV0LWtleS1wcm9vZi1zaWduYXR1cmU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedKey:
          type: string
          description: The **same** Master Key, re-wrapped under the new password's KEK (fresh salt and nonce).
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LXBhc3N3b3JkLXdyYXBwZWQtbWFzdGVyLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        kdfParams:
          type: string
          description: Argon2id parameters + fresh salt for the new PASSWORD wrap.
          contentEncoding: base64
          maxLength: 1024
          example: a2RmLXBhcmFtcy1uZXc=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1024) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        authPublicKey:
          type: string
          description: >
            The Ed25519 public key derived from the new password (ADR 0003). Replaces the stored one in the
            same transaction as the wrap, so login and unlock can never disagree.
          contentEncoding: base64
          maxLength: 256
          example: bmV3LWF1dGgtcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingOpenRequest:
      type: object
      description: >
        Opens a channel. Carries the routing handle and **nothing else** — no account, no server address, no
        direction (ADR 0059 §3, §4).
      required: [handle]
      properties:
        handle:
          x-veyq-visibility: token
          type: string
          description: >
            The client-derived routing secret for this channel (base64 text; a capability, so classified
            `token` rather than opaque — ADR 0044) — derived from the secret the
            displayed code carries, which never reaches the server (ADR 0059 §11). Only its SHA-256 hash is
            stored, so the server recognises it at use and can never reproduce it — and it is sent in the
            body, never in a path or query, to keep it out of logs and referrers. It is deliberately neither the
            ephemeral transport key nor the channel key: those have a cryptographic job, this one a routing job.
          maxLength: 128
          pattern: "^[A-Za-z0-9+/]*={0,2}$"
          example: cGFpcmluZy1oYW5kbGUtb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingAnswerRequest:
      type: object
      required: [handle, answer]
      properties:
        handle:
          x-veyq-visibility: token
          type: string
          description: The channel's routing handle (opaque base64), as derived at open.
          maxLength: 128
          pattern: "^[A-Za-z0-9+/]*={0,2}$"
          example: cGFpcmluZy1oYW5kbGUtb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        answer:
          type: string
          description: >
            The one opaque answer this channel relays — the answering device's ephemeral transport public key
            and a MAC over it under the channel key the displayed code's secret derives, which when *signing in
            with a QR code* also binds the transcribed pairing code (ADR 0059 §5, §6, §11). Both directions carry
            the key, because the grant is sealed to it either way. The server stores the value verbatim and must
            not be able to tell the two forms apart.
          contentEncoding: base64
          maxLength: 8192
          example: ZXBoZW1lcmFsLXRyYW5zcG9ydC1wdWJsaWMta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingDelegateRequest:
      type: object
      required: [handle]
      properties:
        handle:
          x-veyq-visibility: token
          type: string
          description: >
            The channel to bind to the caller's account and mint a family for. The account reaches the row
            here and nowhere earlier (ADR 0059 §3).
          maxLength: 128
          pattern: "^[A-Za-z0-9+/]*={0,2}$"
          example: cGFpcmluZy1oYW5kbGUtb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingDelegateResult:
      type: object
      description: >
        The delegated family's refresh token, handed to the **trusted** device so it can seal it to the one
        being onboarded. It is an ordinary refresh token of an ordinary family (ADR 0004) and grants a session,
        never plaintext.
      required: [refreshToken]
      properties:
        refreshToken:
          x-veyq-visibility: token
          type: string
          description: >
            Opaque refresh token of the freshly delegated session family. Never returned to the device being
            onboarded — it reaches that device only inside the sealed grant.
          maxLength: 512
          example: ZGVsZWdhdGVkLXJlZnJlc2gtdG9rZW4

    PairingSealRequest:
      type: object
      required: [handle, envelope]
      properties:
        handle:
          x-veyq-visibility: token
          type: string
          description: The channel's routing handle (opaque base64); must be one this account delegated to.
          maxLength: 128
          pattern: "^[A-Za-z0-9+/]*={0,2}$"
          example: cGFpcmluZy1oYW5kbGUtb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        envelope:
          type: string
          description: >
            The sealed grant of ADR 0059 §3 — the Master Key, the delegated refresh token and the device's
            label, wrapped to the answering device's ephemeral transport public key, and a MAC over that
            ciphertext under the channel key (ADR 0059 §11) — anyone can seal to a public key, so the MAC is what
            says this grant came from the device that showed or scanned the code. Ciphertext to the server
            in the strict sense: it holds it, relays it once, and cannot open it. (Unrelated to ADR 0021's job
            envelope, which is a different mechanism that happens to share the word.)
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLWdyYW50LWNpcGhlcnRleHQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingCollectRequest:
      type: object
      required: [handle]
      properties:
        handle:
          x-veyq-visibility: token
          type: string
          description: >
            The channel to read. This is the whole request: it names no account and carries no credential, so
            there is nothing here to enumerate with.
          maxLength: 128
          pattern: "^[A-Za-z0-9+/]*={0,2}$"
          example: cGFpcmluZy1oYW5kbGUtb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    PairingChannel:
      type: object
      description: >
        What the channel currently relays, read by both sides. There is deliberately **no status field**: the
        presence of `answer` and of the sealed grant says everything either side needs, and a status would be
        one more fact to read off a relay that is supposed to know nothing. Both are absent until their step
        has happened.
      properties:
        answer:
          type: string
          description: >
            The relayed answer, once posted — an ephemeral transport public key and its MAC under the channel
            key, which binds the transcribed code too in the direction that has one (ADR 0059 §5, §6, §11). One
            opaque value of one shape either way, so the server cannot see the direction.
          contentEncoding: base64
          maxLength: 8192
          example: ZXBoZW1lcmFsLXRyYW5zcG9ydC1wdWJsaWMta2V5
        envelope:
          type: string
          description: >
            The sealed grant, once posted. Handing it over spends the channel, so it is collected exactly once
            (ADR 0059 §8); one left uncollected expires with the row (uc.account.onboard-device E3).
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLWdyYW50LWNpcGhlcnRleHQ=

    # Point a response at THIS alias (`#/components/schemas/ErrorResponse`), not at the `_common` path directly.
    # Both are the same single source (ADR 0038) and both are in use above, but they are not interchangeable at
    # the generator: the three session-manager responses first written as
    # `./_common.openapi.yaml#/components/schemas/ErrorResponse` made the backend generator mint a SECOND,
    # identical model — `ListSessionFamilies401Response` — named after the operation, while the alias produced
    # none. Measured, not reasoned: the cause was not pinned (the recovery paths use the external form and mint
    # nothing), so this records the safe form rather than a rule about why. A duplicated error model is the
    # "never hand-write a DTO that duplicates a generated one" defect arriving through the spec instead.
    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
