    RotateScopeRequest:
      type: object
      required: [epoch, wrappedPrev, grants]
      # `revokeLinks` belongs to a removal-rotation (ScopesHandler.rotateScope): with it true, `removesUserId` is
      # required and not null — the schema's own rule (inbox #507). Under `dependentSchemas`, never at the top, where an
      # `if` turns a sibling-annotated `$ref` to this schema into `Any`; there both generators ignore it (measured on
      # openapi-generator 7.23.0, Kotlin and TypeScript).
      dependentSchemas:
        revokeLinks:
          if: { properties: { revokeLinks: { const: true } } }
          then:
            required: [removesUserId]
            properties: { removesUserId: { type: string } }
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The epoch this rotation creates — the caller's own granted epoch + 1, since `wrappedPrev` wraps that
            grant's key. The server commits it only if it is the scope's **current** epoch + 1 (else
            `409 stale_epoch`, nothing stored), so a link can never chain to a key that is not its predecessor
            (ADR 0024 §4). Mirrors `ScopeRotated.epoch`.
          minimum: 1
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        wrappedPrev:
          type: string
          description: >
            `symWrap(E_new, E_prev)` — the just-superseded epoch key sealed under the freshly-minted one (the new
            chain-link, opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grants:
          type: array
          description: >
            The members granted the new epoch — each one whose key the rotator's client anchors. With `pendingUserIds`
            and `removesUserId`, exactly the scope's memberships (`409 rotation_incomplete` otherwise).
          items: { $ref: "#/components/schemas/ScopeGrantEntry" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        pendingUserIds:
          x-veyq-visibility: id
          type: [array, "null"]
          description: >
            The members this rotation declares pending (ADR 0111 decision 9) — the rotator's client could not anchor their
            key, so it wraps nothing to them. Each keeps the grant it holds, behind the new epoch; grant-delivery brings it
            current through any member whose client anchors that key. Omitted = none.
          items: { type: string, format: uuid, example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a }
        inviteGrants:
          type: [array, "null"]
          description: >
            TENANT only: the open member invites this rotation re-grants the new epoch. With `pendingInviteIds`, exactly
            the tenant's open invites — else `409 rotation_incomplete`. Omitted = none.
          items: { $ref: "#/components/schemas/InviteGrantEntry" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        pendingInviteIds:
          x-veyq-visibility: id
          type: [array, "null"]
          description: >
            TENANT only: the open member invites this rotation declares pending — the rotator could not verify the
            owner's signature on their key or anchor its signer. Each keeps the grant it holds; its newcomer joins
            behind and is brought current by the grant delivery. Omitted = none.
          items: { type: string, format: uuid, example: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c }
        removesUserId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The member this rotation removes (a **removal-rotation**, ADR 0024 Decision 4): the server deletes their
            membership and commits the epoch in one transaction, and refuses the request if `grants` names them
            (`422 removed_member_granted`). The remover's client builds `grants` from the directory the owner picked
            from, minus this member — never from a list read after the removal. Omitted = a rotation that removes
            no one (a queued rotation, the next epoch after an account rotation).
          example: 4e2a9b1d-8b2c-4f2d-9e4a-5b6c7c3f0e2a
        revokeLinks:
          x-veyq-visibility: flag
          type: [boolean, "null"]
          description: >
            A removal-rotation only (with `removesUserId`, else `400 invalid_request`): also turn off every enabled
            public share of the scope in the same transaction (ADR 0075), not only the removed member's own.
            Omitted or false = only the removed member's shares go off.
          example: false

    ScopeSharesRevoked:
