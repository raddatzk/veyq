          type: string
          description: The member's role in the scope (OWNER / MEMBER).
          enum: [OWNER, MEMBER]
          example: MEMBER
        identityPublicKey:
          type: string
          description: >
            The member's identity public key bundle (opaque base64) — a key-holder wraps `K_SC` to it to
            deliver a grant, once the member's key chain reaches it from the head its client pinned (ADR 0111
            decision 15). Operational metadata the server already stores; exposing it to a fellow member never yields
            a scope key.
          contentEncoding: base64
          maxLength: 8192
          example: bWVtYmVyLXB1YmxpYy1rZXk=
        keyChainHead:
          type: string
          description: >
            The head of the member's key chain (ADR 0111 decision 7, the `key_chain` crypto vector): SHA-256 over its
            newest step, the same in every tenant. A client compares it with the head it pinned and fetches the chain
            (`getKeyChain`) only when it moved. The server's word until that walk checked it.
          contentEncoding: base64
          maxLength: 64
          example: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
        pending:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True while the member's grant is behind the scope's current epoch — a rotation declared them pending
            because the rotator could not anchor their key (ADR 0111 decision 9), until a member who can grants them
            the current epoch. Derived from the grant row; no column of its own.
          example: false
        pendingConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True if this is a **soft consent proposal** the target has not yet accepted (uc.spaces.consent-group-add,
            cr-0094): it holds the grant the owner wrapped, and the group is not listed to the target until they
            accept. **Owner-visible only** — the directory omits `pendingConsent` rows for non-owners, so ordinary
            members see a proposed person only once they accept. `false`/absent for an ordinary member.
          example: false
        sealedJoinRecord:
          type: [string, "null"]
          description: >
            TENANT scope only: the member's join record ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decisions 3 and 12) — who they joined
            as, through which owner-signed invite, signed by the invite key and by their identity — sealed under the
            tenant key (field `member-join-record`, bound to the tenant scope and this member). Written once at the
            invite's accept and never by the profile op; `null` for the tenant's first owner (its trust root, born
            through the Server Owner's invite) and in every other kind of scope.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLWpvaW4tcmVjb3Jk

    OpenInvite:
      type: object
      description: An open member invite as a rotator reads it — enough to verify it and wrap to it, nothing to contact anyone by.
      required: [inviteId, invitePublicKey, inviteKeySignature, signerUserId, signerIdentityPublicKey, signerKeyChainHead, expiresAt]
      properties:
        inviteId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
        invitePublicKey:
          type: string
          description: The invite key's public bundle (`serializeIdentityPublic`).
          contentEncoding: base64
          maxLength: 8192
          example: aW52aXRlLXB1YmxpYy1rZXk=
        inviteKeySignature:
          type: string
          description: The inviting owner's `invite-key` signature over it.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
        signerUserId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The inviting owner.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        signerIdentityPublicKey:
          type: string
          description: The inviting owner's identity public bundle as it signed — what the rotator's anchor check judges.
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        signerKeyChainHead:
          type: string
          description: >
            The head of the inviting owner's key chain now (ADR 0111 decision 7). The rotator re-grants the invite only
            if the chain from the head it pinned for the owner verifies to this head and the signer key is the one at
            it — an owner's rotation therefore ends their open invites (cr-secure-the-account).
          contentEncoding: base64
          maxLength: 64
          example: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDE=
        expiresAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: The invite's expiry, as the owner signed it.
          example: 2026-07-11T12:00:00Z

    ResolvedGroupCandidate:
      type: object
      description: >
        The result of resolving a per-tenant username to a candidate for a GROUP add (uc.spaces.consent-group-add,
        cr-0096) — records nothing; it only tells the owner who the username is, their identity public key (so the
        owner's device can seal the derived group name-key to it), and whether their consent is required.
      required: [userId, username, identityPublicKey, keyChainHead, requiresConsent]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the resolved tenant member.
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: The member's per-tenant handle (echoed back, normalized).
          maxLength: 32
          example: partner
        identityPublicKey:
          type: string
          description: >
            The member's identity public key bundle (opaque base64) — the owner's device wraps the group's derived
            name-key `K_name` and later `K_SC` to it. Operational metadata the server already stores.
          contentEncoding: base64
          maxLength: 8192
          example: bWVtYmVyLXB1YmxpYy1rZXk=
        keyChainHead:
          type: string
          description: >
            The head of the member's key chain (ADR 0111 decision 7) — what the owner's client walks the chain to
            before it wraps to `identityPublicKey`.
          contentEncoding: base64
          maxLength: 64
          example: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
        requiresConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True if the target turned on the account-global "ask before adding me to groups" preference — so the
            add must be a consent **proposal** (send `sealedNameKey`), not a direct-add. Low-sensitivity
            operational metadata (ADR 0014 §5): the owner learns *that* the person wants to be asked, never a key.
          example: true

    GroupInvitation:
      type: object
      description: >
        A pending consent proposal to join a GROUP, from the **invitee's** point of view (uc.spaces.consent-group-add,
        cr-0096, ADR 0027). The client `asymUnwrap`s `sealedNameKey` locally with its identity private key to recover
        the derived name-key `K_name`, then `symUnwrap`s `encryptedName` (the scope's **canonical** sealed name) under
        it to show the group's name — the same blob the members hold, so a modified owner cannot show a divergent name.
        `addedBy` is the owner's per-tenant username (already visible to the invitee).
      required: [scopeId, addedBy, sealedNameKey, encryptedName, nameEpoch]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the GROUP scope the caller is proposed to join (used to accept / decline).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        addedBy:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: The per-tenant username of the GroupOwner who proposed the add ("who added you").
          maxLength: 32
          example: kevin
        sealedNameKey:
          type: string
          description: >
            The group's **derived name-key `K_name`** sealed to the caller's identity public key
            (`asymWrap(..., "group-name-key")`, opaque base64) — unwrapped only on-device. It opens the canonical
            `encryptedName` (not a private name copy), so the invitee sees exactly what the members see.
          contentEncoding: base64
          maxLength: 8192
          example: Z3JvdXAtbmFtZS1rZXktc2VhbGVkLXRvLWludml0ZWU=
        encryptedName:
          type: string
          description: >
            The scope's **canonical** sealed group name (`symEncrypt(K_name, name)`, opaque base64) — the same
            ciphertext the members read, surfaced to the pending invitee so they open it with the `sealedNameKey`.
            The blind server only relays already-stored ciphertext; it holds no key and never sees the name.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
        nameEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The name epoch `encryptedName` and `sealedNameKey` were sealed at — both seals are bound to (scope,
            name epoch) (ADR 0072), so the invitee opens them at exactly this epoch.
          minimum: 0
          example: 0

    ScopeSummary:
      type: object
      required: [id, kind, tenantId, role, currentEpoch, grantedEpoch, nameEpoch, iconEpoch, wrappedGrant]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the scope.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        kind:
          $ref: "#/components/schemas/ScopeKind"
        role:
          x-veyq-visibility: structure
          type: string
          description: >
            The **caller's own** role in this scope (`OWNER` / `MEMBER`) — so the client can list the scopes it
            manages (e.g. groups it owns) without a per-scope directory call. Operational metadata the server
            already stores on the caller's membership (ADR 0007); exposing one's own role reveals no key.
          enum: [OWNER, MEMBER]
          example: OWNER
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The tenant this scope lives in (host-routing context).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        encryptedName:
          type: [string, "null"]
          description: >
            For a `GROUP` scope: the group's name sealed under its **derived name-key `K_name`** (opaque base64,
            cr-0096/ADR 0027), decrypted locally so the client can label the group in the switcher. The client
            derives `K_name = HKDF(E_e, "veyq/v1/group-name-key")` from the key of the name's epoch (`nameEpoch`,
            peeled from the chain). `null` for `TENANT` / `PERSONAL` scopes, which carry no per-scope sealed name.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
        nameEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            For a `GROUP` scope: the content-key epoch the `encryptedName` was sealed under (cr-0096/ADR 0027) — 0
            at birth, bumped only by a rename (a plain rotation leaves the name on its epoch). The client peels the
            epoch-chain to that epoch's key and derives `K_name` from it. 0 for `TENANT` / `PERSONAL` scopes.
          minimum: 0
          example: 0
        sealedIcon:
          type: [string, "null"]
          description: >
            The scope's icon (uc.spaces.set-space-icon): the padded, constant-length image sealed under `K_icon =
            HKDF(E_e, "veyq/v1/space-icon-key")` for the icon's epoch (`iconEpoch`, peeled from the chain) — opaque
            base64 the client opens + unpads on-device. `null` when the scope has no icon (the client renders the
            initial). `PERSONAL` scopes never carry one.
          contentEncoding: base64
          maxLength: 21884
          example: c2VhbGVkLWljb24=
        iconEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The content-key epoch `sealedIcon` was sealed under (uc.spaces.set-space-icon) — 0 until an icon is set,
            bumped only by an icon-set (a plain rotation leaves it). The client peels the epoch-chain to that
            epoch's key and derives `K_icon`. 0 when no icon is set.
          minimum: 0
          example: 0
        currentEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope's **current content-key epoch** (ADR 0024) — 0 until the first rotation. New content seals
            under this epoch; the client peels the epoch-chain (`GET …/epochs`) to read older ones.
          minimum: 0
          example: 0
        grantedEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The epoch the caller's own `wrappedGrant` wraps. `grantedEpoch < currentEpoch` means the grant is
            **stale** (a rotation hasn't re-granted this member yet) — grant-delivery re-grants them (ADR 0024).
          minimum: 0
          example: 0
        wrappedGrant:
          type: string
          description: >
            The caller's **own** grant — the scope key sealed to their identity public key (opaque base64).
            The client `asymUnwrap`s it locally to open the scope; the server never interprets it.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        granterUserId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The account that posted the caller's grant — its signature is `grantSignature` (ADR 0028 Decision 6).
            Null for a grant written before grants were signed — which the client refuses to open (the scope does not open).
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        grantSignature:
          type: [string, "null"]
          description: >
            The signature over the caller's grant. The granter's Ed25519 **identity** signature over `encode(grant: scopeId, scopeKind, epoch,
            recipientUserId, sha256(recipientIdentityPublicKey), sha256(wrappedGrant))`
            ([ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) Decision 6). Opaque base64
            the server stores and relays and never verifies; the recipient checks it before the key inside is used.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
        granterIdentityPublicKey:
          type: [string, "null"]
          description: >
            The granter's identity public bundle as it was when the server wrote the grant (opaque base64) — the
            key that signed it, so a granter's later account-key rotation leaves the grant verifiable — served here
            so the recipient needs no directory call. It decides nothing on its own: for a shared scope the client
            runs the TOFU gate on it (a key that differs from the recipient's pin is refused and surfaced); for its
            own grants the client ignores it and verifies under its own vault key.
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        deletedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            For a `GROUP` scope in **pending-deletion** (uc.spaces.delete-group, cr-0090): when the owner
            soft-deleted it. `null` = active. While set, the group stays listed + readable but is **read-only** and
            clearly marked as deleting; any owner may restore it until `purgeAfter`. Operational metadata (a
            lifecycle timestamp), no key.
          example: null
        purgeAfter:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When the scheduled job will **hard-erase** a pending-deletion group (`deletedAt + retention`, derived).
            `null` when active. After this instant the group is gone (restore → 404).
          example: null
        compromiseRotation:
          $ref: "#/components/schemas/CompromiseRotation"
        rekeying:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Served to every member: the scope's epoch moved and a live or trashed node of it still carries a key from
            before — its rotation's re-key is unfinished (ADR 0109 point 7). Derived from the node rows the server holds
            (`veyq_node.epoch` below `currentEpoch`), never stored. Every member's device reads it to continue the re-key
            in the background ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md)
            decision 11); an owner's space shows *Fitting the new lock* meanwhile.
          example: false

    KeyChain:
      type: object
      description: >
        A person's key chain (ADR 0111 decision 7): every step, genesis first, and the head of the newest. Public keys
        and signatures only; nothing secret.
      required: [userId, head, steps]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The person whose chain this is — every statement of it names them.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        head:
          type: string
          description: >
            SHA-256 of `veyq/v1/key-chain/head` and the newest step's statement — what a directory read serves as
            `keyChainHead`. The server's word until the reader's walk recomputed it.
          contentEncoding: base64
          maxLength: 64
          example: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDE=
        steps:
          type: array
          description: Every step, ascending by `index`, from 0.
          items: { $ref: "#/components/schemas/KeyChainStep" }

    KeyChainStep:
      type: object
      description: >
        One step of a key chain, as stored: the keys it installed and — absent exactly at step 0, which nobody signs —
        the head it names as its predecessor and its two signatures, by the identity and by the Secret-Key proof key of
        the step before it. A reader rebuilds the step's statement from these and the step before it (the `key_chain`
        crypto vector).
      required: [index, identityPublicKey, secretKeyProofPublicKey, createdAt]
      properties:
        index:
          x-veyq-visibility: structure
          type: integer
          description: The step's position — 0 for the account's birth, one more for each securing of the account.
          minimum: 0
          example: 0
        previousHead:
          type: [string, "null"]
          description: The head of the step before it; `null` at step 0.
          contentEncoding: base64
          maxLength: 64
          example: null
        identityPublicKey:
          type: string
          description: The identity public bundle this step installed (serialized, opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        secretKeyProofPublicKey:
          type: string
          description: The Secret-Key proof public key this step installed.
          contentEncoding: base64
          maxLength: 128
          example: cHJvb2YtcHVibGljLWtleQ==
        identitySignature:
          type: [string, "null"]
          description: The retired identity's signature over the step's statement; `null` at step 0.
          contentEncoding: base64
          maxLength: 128
          example: null
        proofSignature:
          type: [string, "null"]
          description: The retired Secret-Key proof key's signature over the same statement; `null` at step 0.
          contentEncoding: base64
          maxLength: 128
          example: null
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            When the server stored the step (server-observed) — the account's birth for step 0, the publish for a
            later one; a profile shows "New identity, signed by their previous key, on" this date.
          example: 2026-07-01T12:00:00Z

    # A local alias to the _common source, shared with the tenants spec (the ErrorResponse pattern).
    TenantStatus:
      $ref: '_common.openapi.yaml#/components/schemas/TenantStatus'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
