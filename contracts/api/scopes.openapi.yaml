openapi: 3.1.0
info:
  title: veyq Scopes API
  version: 0.1.0
  description: >
    A member's scopes within the active tenant — the structural layer "where content lives and who may
    access it" (en.spaces.personal-scope, cr-0026). A **scope** is the unit content is keyed on, addressed by
    an opaque id and a `kind` (TENANT / GROUP / PERSONAL). The active tenant is resolved from the request
    `Host` (ADR 0002); every scope lives within exactly one tenant.

    **Operator-blind.** The server stores only the opaque scope row (id / kind / tenant), the **ciphertext
    grant** (the scope key sealed to a member's identity public key — `asymWrap`, the hybrid KEM, ADR 0017),
    and the membership. It never holds a scope key, so it **cannot** create a scope: birth is **client-driven**
    — the client generates the scope key, seals it to its own identity, and hands the server only the grant
    ciphertext. The server mints the scope id + the self-membership.

    `POST /api/scopes` creates the caller's **personal** scope in the active tenant (one per member per
    tenant); group creation is a later, separate operation. `GET /api/scopes` lists the caller's scopes in the
    active tenant together with their own grant ciphertext, so the client can open them locally. Both require
    an authenticated caller; authorization is enforced by code annotations, not this spec (ADR 0008). Field
    validation is declared here via `x-field-extra-annotation` (bean-validation + a trimming deserializer), so
    malformed input is rejected at the boundary (400) before any handler runs.
tags:
  - name: scopes
    description: >
      A member's scopes in the active tenant (create-personal / list-mine). One tag = one resource interface
      owning the whole `/api/scopes` subtree.
  - name: key-chain
    description: >
      A person's key chain — every identity and Secret-Key proof public key their account held, each step signed by the
      keys before it (ADR 0111 decision 7). Separate tag → its own resource interface, owning `/api/people`.

paths:
  /api/scopes:
    post:
      tags: [scopes]
      operationId: createPersonalScope
      summary: Birth the caller's personal scope in the active tenant.
      description: >
        Creates a `kind=PERSONAL` scope for the authenticated caller in the tenant resolved from the `Host`,
        plus the caller's self-membership. The client has minted the scope's id, generated the scope key and
        sealed it to its own identity public key bound to that id ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md)); the server stores only the opaque
        `wrappedGrant` ciphertext under that id and never sees the key. One personal scope per (member, tenant) —
        a second call is `409 personal_scope_exists`. An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonalScopeRequest" }
            example:
              scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "201":
          description: The personal scope was created and the caller holds its grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeCreated" }
              example:
                scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                kind: PERSONAL
        "400":
          description: The request was malformed (missing/invalid grant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: >
            The caller already has a personal scope in this tenant (`personal_scope_exists`), the `scopeId` is already
            taken (`id_taken`), or `recipientIdentityDigest` is not the caller's current identity key
            (`recipient_key_not_current`, ADR 0111 decision 10 — a rotation of the account landed meanwhile). Nothing
            was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: personal_scope_exists }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    get:
      tags: [scopes]
      operationId: listMyScopes
      summary: List the caller's scopes in the active tenant.
      description: >
        Returns every scope the authenticated caller holds in the tenant resolved from the `Host`, each with
        its opaque id, kind, tenant id, and the caller's **own** grant ciphertext (so the client can
        `asymUnwrap` it locally to open the scope). No other member's grant is ever returned; the operator
        stays blind to scope keys.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's scopes in the active tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScopeSummary" }
              example:
                - id: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  kind: TENANT
                  tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  role: MEMBER
                  currentEpoch: 0
                  grantedEpoch: 0
                  nameEpoch: 0
                  iconEpoch: 0
                  wrappedGrant: AQ==
                - id: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                  kind: PERSONAL
                  tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  role: OWNER
                  currentEpoch: 0
                  grantedEpoch: 0
                  nameEpoch: 0
                  iconEpoch: 0
                  wrappedGrant: AQ==
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/scopes/groups:
    post:
      tags: [scopes]
      operationId: createGroup
      summary: Create a named group scope in the active tenant.
      description: >
        Creates a `kind=GROUP` scope for the authenticated caller in the tenant resolved from the `Host`, plus
        the caller's self-membership (`role=OWNER`). Like the personal scope, birth is **client-driven**: the
        client generated the scope key `K_SC`, sealed the group name under its derived name-key `K_name_0`
        (`encryptedName`, cr-0096/ADR 0027), and sealed `K_SC` to its own identity public key (`wrappedGrant`,
        born at name-epoch 0), both bound to the scope id the client minted ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md)). The server stores both
        ciphertexts verbatim and never sees the key or the name — it only records the scope under that id + the
        self-membership. An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads. Group names are **not**
        unique; a duplicate name is allowed (resolved client-side, ADR 0014). Adding other members is a later,
        separate operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
            example:
              scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              encryptedName: c2VhbGVkLW5hbWU=
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "201":
          description: The group scope was created and the caller holds its grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeCreated" }
              example:
                scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                kind: GROUP
        "400":
          description: The request was malformed (missing/invalid name or grant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            The `core.group-space` capability is switched off instance-wide (ADR 0032, ADR 0088): the operator
            runs a personal-only instance, so no new group scope is created. Enforced server-side even if a stale
            client still offers the affordance. Only creation is refused: an existing group stays usable (a
            feature switch refuses only what is new, ADR 0088 decision 5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: capability_disabled }
        "409":
          description: >
            The `scopeId` is already taken (`id_taken`), or `recipientIdentityDigest` is not the caller's current
            identity key (`recipient_key_not_current`, ADR 0111 decision 10). Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: id_taken }

  /api/scopes/{scopeId}/members:
    get:
      tags: [scopes]
      operationId: listScopeMembers
      summary: List a scope's members with their identity public keys (the member directory).
      description: >
        Returns every membership in the scope — each member's `userId`, `role`, **identity public key** and the
        head of their key chain, and in a TENANT scope their sealed join record. The directory a key-holder uses to add
        members and to wrap to them in a rotation (uc.spaces.add-member, ADR 0020); a client accepts a member's key
        only if that member's key chain reaches it from the head it pinned (`getKeyChain`, ADR 0111 decision 15).
        Every membership is born with a grant (ADR 0111 decisions 3-4); one whose grant is behind the scope's current
        epoch — a rotation declared it pending because the rotator could not anchor its key (ADR 0111 decision 9) —
        is `pending`, until someone who can grants it. Operator-blind — the server returns only already-stored
        operational metadata (pubkeys/roles) and opaque sealed fields, **never** a scope key; and it is scoped to
        *this scope's own members*, not a global user search. Any key-holder in the scope may read it (authorization
        is enforced by code, not this spec, ADR 0008). Membership is the **first** gate (ADR 0042): a caller who
        is not a member gets `404 scope_not_found` — the same answer as for a scope id that does not exist, so
        scope existence is not enumerable. A member who holds no grant yet gets `403 not_key_holder`.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the scope whose members to list.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      responses:
        "200":
          description: The scope's members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScopeMember" }
              example:
                - userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  username: kevin
                  avatarRevision: 1
                  role: OWNER
                  identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                  keyChainHead: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDE=
                  pending: false
                - userId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
                  username: partner
                  avatarRevision: 0
                  role: MEMBER
                  identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                  keyChainHead: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
                  pending: false
                  sealedJoinRecord: c2VhbGVkLWpvaW4tcmVjb3Jk
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            The caller is a member but holds no grant yet (`not_key_holder` — only a key-holder may list the
            members), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_key_holder }
        "404":
          description: >
            No such scope — or the caller is not a member of it (deliberately indistinguishable, ADR 0042).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: scope_not_found }
    post:
      tags: [scopes]
      operationId: addGroupMember
      summary: Add an existing tenant member to a group by username, with their grant.
      description: >
        Adds an existing member of the scope's tenant to a **GROUP** scope, picked by their per-tenant
        `username` (uc.spaces.add-group-member, cr-0086). The server resolves the username **within the scope's
        own tenant** (never a global user-search, ADR 0020) and records a GROUP membership (`role=MEMBER`) **with
        the grant the owner's client wrapped** to the target's identity key from `resolveGroupMember`
        ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decision 4): the group's current epoch key, signed by the owner. A group needs no
        invite key — the target already has an account, and the owner's client checked their key (the pin check)
        before it wrapped. The server checks the grant is of the scope's current epoch under its row lock (`409
        stale_epoch`) and addressed to the target's current identity key (`409 recipient_key_not_current`). Only the
        group **OWNER** may add a member (the tenant owner has no say over groups, ADR 0014 §4) — authorization is
        enforced by code, not this spec (ADR 0008).


        **Consent (uc.spaces.consent-group-add, cr-0096/ADR 0027):** if the target turned on "ask before adding me
        to groups", the add must carry `sealedNameKey` (the group's derived name-key `K_name` sealed to their
        identity, which opens the canonical `encryptedName`) and is recorded as a **soft `pendingConsent`**
        membership holding the same grant — the group is not listed to the invitee until they accept
        (`…/invitations/accept`), which changes nothing about keys; a decline queues the group's rotation, since the
        invitee held its key. The owner learns consent is required from the prior member-resolve; a
        `requiresConsent` target added **without** `sealedNameKey` is rejected `400 consent_required`.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the GROUP scope to add the member to.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGroupMemberRequest" }
            example:
              username: partner
              epoch: 0
              wrappedGrant: AQ==
              grantSignature: c2lnbmF0dXJl
              recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
      responses:
        "201":
          description: >
            The member was added with their grant. For a consent proposal (`sealedNameKey` sent to a
            `requiresConsent` target): a soft `pendingConsent=true` row holding the grant until they accept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeMember" }
              example:
                userId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
                username: partner
                sealedName: c2VhbGVkLW5hbWU=
                avatarRevision: 0
                role: MEMBER
                identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                keyChainHead: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
                pending: false
                pendingConsent: false
        "400":
          description: >
            The request was malformed (missing/invalid username), or the target has consent on but no
            `sealedNameKey` was supplied (`consent_required` — resolve the member first, derive + seal the group
            name-key, then re-submit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: consent_required }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of the group but not its OWNER (`not_scope_owner` — only an owner may add a member), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_scope_owner }
        "404":
          description: >
            No such GROUP scope, or the caller is not a member of it (`scope_not_found` — deliberately
            indistinguishable, ADR 0042); or the username resolves to no member of the scope's tenant
            (`member_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }
        "409":
          description: That user is already a member of the group or already has an open proposal (`already_member`), the grant is of an epoch that is no longer the scope's current one (`stale_epoch` — re-open the group and rewrap), its `recipientIdentityDigest` is not the target's current identity key (`recipient_key_not_current` — resolve again), or the group is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: already_member }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/members/resolve:
    post:
      tags: [scopes]
      operationId: resolveGroupMember
      summary: Resolve a per-tenant username to a group-add candidate (records nothing).
      description: >
        Resolves a per-tenant `username` to a candidate for a GROUP add (uc.spaces.consent-group-add, cr-0094)
        **without recording anything**. Returns the candidate's `userId`, `identityPublicKey` (so the owner's
        device can seal the group name), and `requiresConsent` (whether the target's account-global consent
        preference is on). The owner then either direct-adds (consent off) or seals the group name and submits a
        proposal (consent on). Resolved **within the scope's own tenant** (never a global user-search, ADR 0020).
        Only the group **OWNER** may resolve a candidate (the same gate as the add); enforced by code, not this
        spec (ADR 0008). This owner-gate is convenience, **not** a confidentiality barrier: any tenant member can
        create a group and become its owner, so a member's username → identity public key → consent flag are
        effectively enumerable tenant-wide. That is within the metadata model (per-tenant usernames + pubkeys are
        tenant-visible, ADR 0023) — not a leak, but the gate must not be read as one.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the GROUP scope to resolve a candidate for.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveGroupMemberRequest" }
            example:
              username: partner
      responses:
        "200":
          description: The resolved candidate (nothing was recorded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedGroupCandidate" }
              example:
                userId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
                username: partner
                identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                keyChainHead: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDI=
                requiresConsent: true
        "400":
          description: The request was malformed (missing/invalid username).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of the group but not its OWNER (`not_scope_owner` — only an owner may resolve a candidate), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_scope_owner }
        "404":
          description: >
            No such GROUP scope, or the caller is not a member of it (`scope_not_found` — deliberately
            indistinguishable, ADR 0042); or the username resolves to no member of the scope's tenant
            (`member_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/members/{userId}:
    patch:
      tags: [scopes]
      operationId: setMemberRole
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the role the owner chose for one member; nothing the editor did not see is
          re-sent. (The last-owner count-then-write race is a separate defect, inbox #272.)
      summary: Promote a member to co-owner or demote a co-owner (group roles).
      description: >
        Sets a group member's role (`OWNER` / `MEMBER`) — the GroupOwner's promote/demote (uc.spaces.manage-group-members,
        cr-0088, ADR 0014 §4). Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then
        owner-gated (`403 not_scope_owner`); the **last-owner guard** rejects demoting the last remaining OWNER
        (`409 last_owner`, ADR 0007). A pure role change — no key moves (the member already holds the scope key).
        Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, description: Opaque id of the member whose role to set., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberRoleRequest" }
            example: { role: OWNER }
      responses:
        "200":
          description: The member's role after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeMember" }
        "400": { description: Malformed (invalid role)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the group but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope, or the caller is not a member of it (`scope_not_found`, indistinguishable per ADR 0042); or no such target member (`member_not_found`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: member_not_found } } } }
        "409": { description: "The last remaining OWNER cannot be demoted (`last_owner`), or the group is being deleted and read-only (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: last_owner } } } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [scopes]
      operationId: removeMember
      summary: Rescind a pending consent proposal (a keyed member is removed by the rotation that excludes them).
      description: >
        Deletes a GROUP membership that is still a **pending consent proposal** (uc.spaces.consent-group-add) — the
        owner withdraws it before the invitee accepts. A proposal holds the group's key (ADR 0111 decision 4), so the
        rescind queues the group's rotation for the next online owner, as a decline does. Every other
        membership is removed only by a **removal-rotation** (`POST /api/scopes/{scopeId}/epochs` with
        `removesUserId`, ADR 0024 Decision 4), which deletes it and commits the new epoch in one transaction, so no
        removal can end without its rotation; this path refuses it (`409 removal_requires_rotation`) and deletes
        nothing. Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then owner-gated
        (`403 not_scope_owner`).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, description: Opaque id of the member to remove., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The pending proposal was deleted. }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the group but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope, or the caller is not a member of it (`scope_not_found`, indistinguishable per ADR 0042); or no such target member (`member_not_found`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: member_not_found } } } }
        "409": { description: "The member is not a pending proposal — removing them is a removal-rotation (`removal_requires_rotation`, nothing deleted) — or the group is being deleted and read-only (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: removal_requires_rotation } } } }

  /api/scopes/{scopeId}/epochs:
    get:
      tags: [scopes]
      operationId: listScopeEpochs
      summary: The scope's epoch-chain links, so a member peels down to read older epochs.
      description: >
        Returns the scope's **epoch-chain links** (ADR 0024): for each epoch `n ≥ 1`, `wrappedPrev` =
        `symWrap(E_n, E_{n-1})` (opaque base64) — so a member who holds the latest epoch (via their grant) derives
        every earlier one and reads content of any epoch. Epoch 0 has no predecessor. Operator-blind: opaque
        ciphertext only, never a key. Any key-holder may read it. Membership is the **first** gate (ADR 0042):
        a non-member gets `404 scope_not_found`, identical to the answer for a scope id that does not exist.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the scope., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The epoch-chain links (ascending by epoch).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScopeEpochLink" } }
              example:
                - { epoch: 1, wrappedPrev: AQ== }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member but holds no grant in this scope (`not_key_holder`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_key_holder } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
    post:
      tags: [scopes]
      operationId: rotateScope
      summary: Commit a scope-key rotation — a new epoch + re-grants to the remaining members.
      description: >
        Commits a forward rotation of the scope content key (ADR 0024 §4): commits the stated `epoch` **iff** it is
        the scope's current epoch + 1, stores the chain-link `wrappedPrev` = `symWrap(E_new, E_{prev})` at it, and
        applies the `grants` (each remaining member's `wrappedGrant` re-wrapped to the **new** epoch, updating their
        granted-epoch). Any other `epoch` means the rotation was built on a superseded epoch — it lost a race, or the
        caller's grant lags the scope — and is `409 stale_epoch` with nothing stored; the client re-opens its grant
        and rebuilds once from a **fresh** key. The client mints the new epoch on-device; the server stores only
        ciphertext.

        **Who may commit.** An owner of the scope; and a member who is not an owner only while their own account
        rotation left a pending re-key row for this scope at its current epoch, and only without `removesUserId` — a
        removal stays an owner's act (ADR 0111 decision 8, cr-secure-the-account). Anyone else is
        `403 not_scope_owner`.

        **Nobody is left out silently** (ADR 0111 decision 9). Every membership of the scope is either granted the new
        epoch (`grants`), declared pending (`pendingUserIds` — the rotator's client could not anchor that member's key),
        or the member `removesUserId` removes; under the scope's row lock the server requires exactly that cover, else
        `409 rotation_incomplete` with nothing stored. A pending member keeps the grant it holds, behind; its behind
        grant **is** the stored pending marker, and grant-delivery brings it current once a member whose client
        anchors its key claims the job (ADR 0020/0021). **Every grant names its recipient key**
        (`recipientIdentityDigest`), and the server refuses a grant to a key that is not that member's current
        identity (`409 recipient_key_not_current`, ADR 0111 decision 10) — so no rotation can wrap to an identity its
        member retired.

        **A TENANT rotation carries every open invite** ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decision 2): each open member invite
        is either re-granted the new epoch (`inviteGrants`, wrapped to the invite key from `listOpenInvites` once the
        rotator verified the owner's signature on it and passed the signer's pin check) or declared pending
        (`pendingInviteIds`). Under the scope's row lock the server requires the two lists together to be exactly the
        open invites, else `409 rotation_incomplete` with nothing stored — an invite a rotation forgot would hand its
        newcomer a key the members already left. A pending invite stays redeemable: its newcomer joins at the epoch
        its grant carries, behind, and the grant delivery brings it current. A GROUP or PERSONAL rotation carries
        neither list.

        **The caller must be a current key-holder.** After the commit gate, under the scope's row lock, a caller whose
        own grant is behind the scope's current epoch, or absent, is refused `409 stale_epoch` — the server does not
        take the client's word for the grant it built the chain-link from. Nothing is stored. A commit that lands also
        marks every `scope-rotation` job of the scope leased to the caller as rotated, which is what lets that job
        complete; and since the scope's epoch moved past every pending re-key row's `epoch_at_rotation`, no such row
        opens the commit gate again.

        **A removal-rotation** names the member it removes (`removesUserId`, ADR 0024 Decision 4): the server
        deletes that membership — with the per-member rows the applications keep for it and the public shares it created in the group — and
        commits the epoch in **one transaction**, so a removal never ends without its rotation and a failed one
        leaves the member in place. The request's grants must not name that member (`422
        removed_member_granted`, nothing stored); the last-owner guard applies (`409 last_owner`). With
        `revokeLinks: true` the same transaction also turns off **every** enabled public share of the group, whoever
        created it — a link the removed member could have copied from the manage panel then `404`s, and each
        share's owner re-issues the ones they still want
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md)). `revokeLinks`
        without `removesUserId` is `400 invalid_request`, nothing stored.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateScopeRequest" }
            example:
              epoch: 1
              wrappedPrev: AQ==
              grants: [{ userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, wrappedGrant: AQ==, grantSignature: c2lnbmF0dXJl, recipientIdentityDigest: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk= }]
              pendingUserIds: [5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a]
              removesUserId: 4e2a9b1d-8b2c-4f2d-9e4a-5b6c7c3f0e2a
      responses:
        "201":
          description: The scope rotated; the new current epoch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeRotated" }
              example: { epoch: 1 }
        "400": { description: "Malformed (missing/invalid link or grant), `revokeLinks` without `removesUserId`, or invite grants on a scope that is no TENANT.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is neither an OWNER of the scope nor a member whose account rotation left a pending re-key row for it at its current epoch, or is such a member and names `removesUserId` (`not_scope_owner`, nothing stored); or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042); or `removesUserId` names no member of the group (`member_not_found`, nothing stored).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The stated `epoch` is not the scope's current epoch + 1, or the caller's own grant is behind the scope's current epoch or absent (the rotation was, or would be, built on a superseded epoch — `stale_epoch`, nothing stored, re-open + rebuild from a fresh key), `grants`, `pendingUserIds` and `removesUserId` together do not cover exactly the scope's memberships, or a TENANT rotation's `inviteGrants` and `pendingInviteIds` are not exactly the open invites (`rotation_incomplete`, nothing stored — re-read the members and `listOpenInvites` and rebuild), a grant's `recipientIdentityDigest` is not its member's (or invite's) current key (`recipient_key_not_current`, nothing stored — re-read the members and rebuild), `removesUserId` is the last remaining OWNER (`last_owner`, nothing stored), or the group is being deleted and read-only (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } } } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422": { description: "The grants name the member `removesUserId` removes (`removed_member_granted`, nothing stored) — the new epoch is never wrapped to the member the rotation removes.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: removed_member_granted } } } }

  /api/scopes/{scopeId}/open-invites:
    get:
      tags: [scopes]
      operationId: listOpenInvites
      summary: List a tenant's open member invites — the placeholder members a rotation carries.
      description: >
        Every open (not yet accepted, revoked, superseded or expired) member invite of the TENANT scope `scopeId`,
        each with its invite key, the inviting owner's signature over it and that owner's key as it signed
        ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md) decision 2). Any member may rotate the tenant's key and so must carry every open invite,
        which is why every member reads this, not only an owner — and why it carries **no email** (that stays the
        owner's `listMemberInvites`). Membership is the first gate (ADR 0042): a non-member gets `404
        scope_not_found`. A scope that is no TENANT has no invites: an empty list. Operator-blind: public keys and
        opaque signatures the server stores.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the TENANT scope., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpenInvite" }
              example:
                - inviteId: 1f2d3e4a-5b6c-4c3f-8e2a-9b1d4a6e8b2c
                  invitePublicKey: aW52aXRlLXB1YmxpYy1rZXk=
                  inviteKeySignature: c2lnbmF0dXJl
                  signerUserId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  signerIdentityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                  signerKeyChainHead: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDE=
                  expiresAt: 2026-07-11T12:00:00Z
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: tenant_suspended } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
  /api/scopes/{scopeId}/rotation/requeue:
    post:
      tags: [scopes]
      operationId: requeueScopeRotation
      summary: An owner queues a dead-lettered queued rotation of the scope again.
      description: >
        When the scope's row reads `compromiseRotation: failed` — a rotation queued on it (a tenant member's removal
        queues one for each group they shared, ADR 0025) has dead-lettered, so the removed member's key still opens the
        scope's current epoch — an **owner** originates it again (uc.spaces.complete-queued-rotation E8). Under the
        scope's row lock the rotation is originated again: it joins the scope's unclaimed rotation job or creates one,
        excluding nobody, so the caller's own worker can claim it at once. An account rotation queues no job any more
        (it mints its scopes' next epochs itself, ADR 0111 decision 8), so nothing here excludes a
        rotator. Answers the row's new value (`null` or `stalled`). Membership is the first gate (ADR 0042), then
        ownership; any state other than `failed` is `409 rotation_not_failed`. Nothing is written on any refusal.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the scope., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Queued again; the row's value now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeRotationRequeued" }
              example: {}
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the scope but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The scope's compromise rotation is not `failed` (`rotation_not_failed` — nothing to queue again), or the scope is being deleted (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rotation_not_failed } } } }

  /api/scopes/{scopeId}:
    delete:
      tags: [scopes]
      operationId: deleteGroup
      summary: Soft-delete a group — enter a grace period, then a scheduled hard-purge.
      description: >
        Soft-deletes a GROUP scope (uc.spaces.delete-group, cr-0090, ADR 0014 §6): sets the scope's `deletedAt`
        marker, so it enters a **grace period** (`purgeAfter = deletedAt + retention`, 30 days). During grace the
        group stays listed + readable but **read-only** and marked as deleting; a scheduled job hard-erases it
        (nodes + blob objects + memberships + epoch links + the scope) after `purgeAfter`. Grants/memberships are
        untouched, so **any owner** who still belongs to the tenant may {@link restoreGroup} in-window.
        Access-gated first (a non-member gets `404 scope_not_found`; an already-deleting group answers
        `409 scope_deleting` like any other write, uc.spaces.scope-access), then **GROUP-only** (`409 not_group`),
        then owner-gated (`403 not_scope_owner`). Enforced by code, not this spec (ADR 0008). Erasure only — the
        server needs no key.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope to delete., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The group entered pending-deletion (grace period started). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the group but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The group is already being deleted (`scope_deleting` — a deleting group refuses the delete like any other write), or the scope is not a GROUP (`not_group`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } } } }

  /api/scopes/{scopeId}/restore:
    post:
      tags: [scopes]
      operationId: restoreGroup
      summary: Restore a group from pending-deletion (undo the soft-delete, in-window).
      description: >
        Restores a GROUP scope that is in **pending-deletion** and still within its grace window (uc.spaces.delete-group,
        cr-0090): clears `deletedAt`/`purgeAfter`, so the group is fully active again for everyone (grants/memberships
        were never touched). It is the one write a deleting group allows, and only that: it still needs an owner
        who still belongs to the tenant — a former tenant member gets `404 scope_not_found`, like a non-member
        (uc.spaces.scope-access A1/A2). Then **GROUP-only** (`409 not_group`), then owner-gated
        (`403 not_scope_owner`); `409 not_deleted` if the group is not being deleted. Once the scheduled
        hard-purge has run the scope is gone (`404 scope_not_found`).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the pending-deletion GROUP scope., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The group was restored (active again). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the group but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope (or already hard-purged) — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The group is not being deleted (`not_deleted` — nothing to restore), or the scope is not a GROUP (`not_group`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_deleted } } } }

  /api/scopes/{scopeId}/shares/revoke:
    post:
      tags: [scopes]
      operationId: revokeScopeShares
      summary: Turn off every link of a scope — they come back only by re-issue.
      description: >
        A scope **owner** (group owner, tenant owner, the personal scope's owner) turns off **every** enabled public
        share of the scope, whoever created it, in one transaction: each one's link then `404`s, and each is marked
        so it comes back only through `reissueShare` — a new id and a new `K_share` — never `reactivateShare`
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md) point 5). A
        switch-off says "a link may have leaked", and a link with no recovery copy leaks like any other, so the mark
        holds for every share it turns off. A share minted afterwards is untouched. Answers how many links it turned
        off; idempotent — a second call answers `revoked: 0`. Membership-gated first (a non-member gets the same
        `404` as an unknown scope, ADR 0042), then owner-gated. No body.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: The scope whose shares are turned off.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      responses:
        "200":
          description: Every enabled share of the scope is off and marked; the body counts them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeSharesRevoked" }
              example: { revoked: 2 }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            The caller is a member of the scope but not its owner (`not_scope_owner`), or the tenant is suspended
            (`tenant_suspended`, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope, or the caller is not a member of it (indistinguishable, ADR 0042).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/scopes/{scopeId}/name:
    post:
      tags: [scopes]
      operationId: renameGroup
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the name the owner typed, sealed fresh; nameEpoch is a rotation guard, not an
          edit guard.
      summary: Rename a group — re-seal the name under the current epoch (forward-secret).
      description: >
        Renames a GROUP scope (uc.spaces.rename-group, cr-0097, ADR 0027). The client re-seals the new name under
        `K_name` derived from the scope's **current** content-key epoch (`K_name = HKDF(E_currentEpoch,
        "group-name-key")`) and posts the opaque `encryptedName` + the `nameEpoch` it sealed under. The server
        overwrites the scope's `encrypted_name` + `name_epoch` — **only** when `nameEpoch == currentEpoch` (else
        `409 stale_epoch`: a concurrent rotation advanced the epoch under the caller, refetch + retry) and the group
        is not being deleted (else `409 scope_deleting`, like every write during the grace period). Sealing under
        the **current** epoch makes the rename **forward-secret** — a member removed at an earlier epoch cannot
        derive the new `K_name`. **Name-only**: no `K_SC` rotation, no re-grant. Membership-gated first (a
        non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`; ADR 0014 §4).
        Operator-blind — the server never sees a key or the plaintext name (enforced by code, ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope to rename., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameGroupRequest" }
            example: { encryptedName: c2VhbGVkLW5hbWU=, nameEpoch: 0 }
      responses:
        "204": { description: The group was renamed (the row's encrypted_name + name_epoch were overwritten). }
        "400": { description: Malformed request (blank/oversized/invalid encryptedName)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the group but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The submitted `nameEpoch` is stale (a concurrent rotation moved the epoch — `stale_epoch`, refetch + retry), or the group is being deleted and read-only (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } } } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/scopes/{scopeId}/icon:
    post:
      tags: [scopes]
      operationId: setScopeIcon
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The write carries only the icon the owner chose, sealed fresh; iconEpoch is a rotation guard, not an
          edit guard.
      summary: Set or replace a space icon — seal it under the current epoch (operator-blind, constant length).
      description: >
        Sets or replaces a space's icon (uc.spaces.set-space-icon). The client bakes the crop, re-encodes to a
        fixed square, **pads the plaintext to a constant length**, and seals it under `K_icon` derived from the
        scope's **current** content-key epoch (`K_icon = HKDF(E_currentEpoch, "veyq/v1/space-icon-key")`), then
        posts the opaque `sealedIcon` + the `iconEpoch` it sealed under. The server overwrites the scope's
        `sealed_icon` + `icon_epoch` — **only** when `iconEpoch == currentEpoch` (else `409 stale_epoch`: a
        concurrent rotation advanced the epoch under the caller, refetch + retry) and the scope is not being deleted
        (else `409 scope_deleting`). Sealing under the current epoch makes a replaced icon forward-secret. The
        scope must be a **TENANT** or a **GROUP** — a **PERSONAL** scope has no icon (nothing to tell it apart
        from) and answers `404`. For a GROUP the `iconEpoch` may sit below `currentEpoch` (a group rotates its
        content-key on member-removal, ADR 0024, but a rotation never re-seals the icon), so a reader peels the
        epoch chain down to `iconEpoch` to derive `K_icon`. Membership-gated first (a
        non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`; ADR 0007 — the
        owner gate keys on the root scope; a GROUP co-owner is an OWNER too). Because every `sealedIcon` is padded to an identical length, the
        server cannot tell one icon image from another. Operator-blind — the server never sees a key or the image
        (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the TENANT or GROUP scope to set the icon of., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetScopeIconRequest" }
            example: { sealedIcon: c2VhbGVkLWljb24=, iconEpoch: 0 }
      responses:
        "204": { description: The icon was set (the row's sealed_icon + icon_epoch were overwritten). }
        "400": { description: Malformed request (blank/wrong-length/invalid sealedIcon)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the scope but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope (or already hard-purged) — or the caller is not a member of it (indistinguishable, ADR 0042) — or it is a PERSONAL scope (which carries no icon).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The submitted `iconEpoch` is stale (a concurrent rotation moved the epoch — `stale_epoch`, refetch + retry), or the scope is being deleted and read-only (`scope_deleting`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } } } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [scopes]
      operationId: clearScopeIcon
      summary: Remove a space icon — every member falls back to the initial.
      description: >
        Clears a space's icon (uc.spaces.set-space-icon A5): the row's `sealed_icon` + `icon_epoch` are reset and
        every member falls back to the initial. **No epoch check** — a removal carries no ciphertext that could be
        sealed under a stale epoch, so it is idempotent (clearing an already-iconless scope is still a `204`).
        Like every write it is refused while the scope is being deleted (`409 scope_deleting`). Access-gated first
        (a non-member gets `404 scope_not_found`, uc.spaces.scope-access), then owner-gated (`403 not_scope_owner`).
        Operator-blind.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the TENANT or GROUP scope to clear the icon of., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      responses:
        "204": { description: The icon was removed (or was already absent — idempotent). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: "The caller is a member of the scope but not its OWNER (`not_scope_owner`), or the tenant is suspended (`tenant_suspended`, uc.spaces.scope-access).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/scopes/my-tenants:
    get:
      tags: [scopes]
      operationId: listMyTenants
      summary: List the tenants the caller belongs to (the space switcher).
      description: >
        Returns every tenant the authenticated caller is a member of — its opaque id, display `name`, the
        `domain` it is reached at, the caller's `role`, and — so the switcher can render each tenant's avatar
        without a per-tenant call — the caller's own opaque `wrappedGrant` for that tenant plus its `sealedIcon`
        / `iconEpoch` (uc.spaces.set-space-icon; the widened cross-tenant read path is owned by
        en.spaces.tenant-scope). Independent of the request Host (it lists *all* the caller's tenants, so the
        client can render a switcher and link to each tenant's domain). Tenant name + domain are server-visible
        operational metadata (tenant identity = the domain, ADR 0002). The `wrappedGrant` and `sealedIcon` are
        **opaque ciphertext** the server never interprets — it derives no key and never sees the icon
        (operator-blind, ADR 0008). A `SUSPENDED` tenant stays listed with its `status`, but with neither grant nor
        icon, so the switcher shows it offline and not enterable (uc.spaces.scope-access A7). Listed are the
        tenants the caller holds any accepted membership in — a member removed from a tenant keeps it here for the
        grace window, where their own spaces stay readable (uc.spaces.remove-tenant-member).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tenants the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyTenant" }
              example:
                - tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  name: Familie Raddatz
                  domain: family.example.com
                  role: OWNER
                  status: ACTIVE
                  wrappedGrant: AQ==
                  sealedIcon: c2VhbGVkLWljb24=
                  iconEpoch: 0
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/scopes/invitations:
    get:
      tags: [scopes]
      operationId: listMyGroupInvitations
      summary: List the caller's pending group-consent proposals in the active tenant.
      description: >
        Returns the caller's **pending consent proposals** — groups a GroupOwner proposed to add them to, awaiting
        their Accept/Decline (uc.spaces.consent-group-add, cr-0096/ADR 0027) — in the tenant resolved from the
        `Host`. Each carries the `scopeId`, the `sealedNameKey` (the group's derived name-key `K_name` sealed to the
        caller's identity) + the canonical `encryptedName` it opens (both decrypted on-device to the group-consistent
        name), and `addedBy` (the owner's per-tenant username). The caller's own view of their invitations; no
        `K_SC` is ever returned (a soft member holds no scope key — only the name-key, which leaks the name and
        nothing else). Empty array when there are none.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's pending group invitations in the active tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupInvitation" }
              example:
                - scopeId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  addedBy: kevin
                  sealedNameKey: Z3JvdXAtbmFtZS1rZXktc2VhbGVkLXRvLWludml0ZWU=
                  encryptedName: c2VhbGVkLW5hbWU=
                  nameEpoch: 0
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/scopes/{scopeId}/invitations/accept:
    post:
      tags: [scopes]
      operationId: acceptGroupInvitation
      summary: Accept a pending group-consent proposal — become a member, with the grant the proposal holds.
      description: >
        The invitee accepts the consent proposal for this GROUP scope (uc.spaces.consent-group-add, cr-0094):
        clears the `pendingConsent` flag on **their own** soft membership, so it becomes an ordinary membership —
        with the grant the owner wrapped when proposing (ADR 0111 decision 4); nothing about keys changes, and the
        group opens at once. Acts only on the caller's own proposal (invitee-gated); a scope where the caller has no open
        proposal is `404 invitation_not_found`. Idempotent-safe: a re-accept of an already-accepted membership
        is a no-op `204`. Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope proposed., schema: { type: string, format: uuid } }
      responses:
        "204": { description: "The proposal was accepted (now a member holding the group's key)." }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "404": { description: The caller has no pending proposal in this scope., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invitation_not_found } } } }

  /api/scopes/{scopeId}/invitations/decline:
    post:
      tags: [scopes]
      operationId: declineGroupInvitation
      summary: Decline a pending group-consent proposal — the proposal goes, and the group rotates.
      description: >
        The invitee declines the consent proposal for this GROUP scope (uc.spaces.consent-group-add, cr-0094):
        **deletes** their soft `pendingConsent` membership. The proposal held a grant of the group's key (ADR 0111
        decision 4), so the decline **queues the group's rotation**, as a removal's cascade does: the next online
        owner mints an epoch the decliner never held. No `declined` state is kept (a silent drop — the owner may
        propose again later).
        Acts only on the caller's own proposal (invitee-gated); **idempotent** — a scope where the caller has no
        open proposal is still `204` (no enumeration). Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope proposed., schema: { type: string, format: uuid } }
      responses:
        "204": { description: "The proposal is gone (declined, or there was no open proposal of yours)." }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "404":
          description: A path id that is no UUID names nothing (`not_found`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_found } }

  /api/people/{userId}/key-chain:
    get:
      tags: [key-chain]
      operationId: getKeyChain
      summary: A person's whole key chain and its head.
      description: >
        Every step of `userId`'s key chain, genesis first, and its head (ADR 0111 decision 7, cr-secure-the-account
        decision 2): step 0 is the identity public bundle and Secret-Key proof public key the account was born with;
        each later step is one securing of the account, signed by the identity and the proof key it retired. A client
        walks it (`verifyKeyChain`, the `key_chain` crypto vector) from the head it pinned for that person to the head a
        directory read served, and accepts the newest key only if every step verifies — the server's word is never
        taken for it. Host-independent: one chain per account, the same in every tenant. Served to the person, to
        users who share a tenant with them (a membership on the same tenant root scope), and between two accepted
        moderators of the instance (ADR 0099: a holder anchors the moderator it delivers the moderation key to, who may
        share no tenant with it); anyone else gets the `404 not_found` an unknown user gets, so the read enumerates
        nobody (ADR 0042). Operator-blind: public keys and
        signatures the server stores, and the server-observed time of each step — it already knows every rotation.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: Opaque id of the person., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The chain, genesis first, and its head.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyChain" }
              example:
                userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                head: a2V5LWNoYWluLWhlYWQta2V5LWNoYWluLWhlYWQtMDE=
                steps:
                  - index: 0
                    identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                    secretKeyProofPublicKey: cHJvb2YtcHVibGljLWtleQ==
                    createdAt: 2026-07-01T12:00:00Z
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "404":
          description: >
            No such person — or one who shares no tenant with the caller, where not both are accepted moderators
            (`not_found`, indistinguishable, ADR 0042).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_found } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller (enforced by code, not this spec).

  schemas:
    CompromiseRotation:
      x-veyq-visibility: enum
      type: string
      description: >
        **Owner-only**: absent unless the caller is an `OWNER` of the scope and a rotation queued on it — a tenant
        member's removal queues one for each group they shared (ADR 0025) — needs an owner
        (uc.spaces.complete-queued-rotation). `stalled` — no owner both holds the scope's grant and has not declined
        the job (promote a co-owner); `failed` — the job dead-lettered, so the scope's current epoch is still the one
        from before the removal (`requeueScopeRotation`). `failed` wins over `stalled` where several rotations apply.
        Derived from job, decline and membership rows; it never names who was removed. An account rotation queues no
        job (ADR 0111 decision 8), so it never shows here.
      enum: [stalled, failed]
      example: failed

    ScopeRotationRequeued:
      type: object
      description: The scope row's compromise-rotation value after a re-queue (absent or `null` = nothing needs an owner).
      properties:
        compromiseRotation:
          $ref: "#/components/schemas/CompromiseRotation"

    ScopeKind:
      x-veyq-visibility: enum
      type: string
      description: The kind of a scope — the tenant root, a collaborative group, or a member's private space.
      enum: [TENANT, GROUP, PERSONAL]
      example: PERSONAL

    CreatePersonalScopeRequest:
      type: object
      required: [scopeId, wrappedGrant, grantSignature, recipientIdentityDigest]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the personal scope (ADR 0072 Decision 3) — its grant is sealed bound to (this id, epoch 0). Taken ⇒ `409 id_taken`.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        wrappedGrant:
          type: string
          description: >
            The freshly generated personal scope key sealed to the caller's **own** identity public key
            (`asymWrap(ownIdentityPub, scopeKey, "scope-grant")`) — opaque base64 ciphertext the server stores
            verbatim and never interprets.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grantSignature:
          type: string
          description: >
            The caller's self-signature over this grant, kind `PERSONAL` — its client opens a personal grant only if it is self-signed. The granter's Ed25519 **identity** signature over `encode(grant: scopeId, scopeKind, epoch,
            recipientUserId, sha256(recipientIdentityPublicKey), sha256(wrappedGrant))`
            ([ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) Decision 6). Opaque base64
            the server stores and relays and never verifies; the recipient checks it before the key inside is used.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        recipientIdentityDigest:
          type: string
          description: >
            SHA-256 of the identity bundle the grant is sealed to — the caller's own. The server compares it with the
            caller's current identity key and refuses another (`409 recipient_key_not_current`, ADR 0111 decision 10).
          contentEncoding: base64
          maxLength: 64
          example: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    CreateGroupRequest:
      type: object
      required: [scopeId, encryptedName, wrappedGrant, grantSignature, recipientIdentityDigest]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the group scope (ADR 0072 Decision 3) — its grant is sealed bound to (this id, epoch 0). Taken ⇒ `409 id_taken`.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        encryptedName:
          type: string
          description: >
            The group's name sealed under its **derived name-key `K_name_0`** at birth (cr-0096/ADR 0027):
            `K_name_0 = HKDF(E_0, "veyq/v1/group-name-key")` from the birth epoch key, then `symEncrypt(K_name_0,
            name)` (seal purpose `group-name`, bound to scope + name epoch) — opaque base64 the server stores verbatim and never interprets, so the
            server sees an **unnamed** group (ADR 0014). Born at name-epoch 0 (forward-secret-ready).
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedGrant:
          type: string
          description: >
            The freshly generated group scope key `K_SC` sealed to the caller's **own** identity public key
            (`asymWrap(ownIdentityPub, scopeKey, "scope-grant")`) — opaque base64 ciphertext the server stores
            verbatim and never interprets.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grantSignature:
          type: string
          description: >
            The creator's self-signature over this grant, kind `GROUP`. The granter's Ed25519 **identity** signature over `encode(grant: scopeId, scopeKind, epoch,
            recipientUserId, sha256(recipientIdentityPublicKey), sha256(wrappedGrant))`
            ([ADR 0028](../../docs/decisions/0028-identity-authenticity-tofu-verification.md) Decision 6). Opaque base64
            the server stores and relays and never verifies; the recipient checks it before the key inside is used.
          contentEncoding: base64
          maxLength: 128
          example: c2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        recipientIdentityDigest:
          type: string
          description: >
            SHA-256 of the identity bundle the grant is sealed to — the creator's own. The server compares it with the
            caller's current identity key and refuses another (`409 recipient_key_not_current`, ADR 0111 decision 10).
          contentEncoding: base64
          maxLength: 64
          example: ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGlnZXN0ZGk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RenameGroupRequest:
      type: object
      required: [encryptedName, nameEpoch]
      properties:
        encryptedName:
          type: string
          description: >
            The new group name sealed under `K_name` derived from the scope's **current** content-key epoch
            (cr-0097/ADR 0027): `K_name = HKDF(E_currentEpoch, "veyq/v1/group-name-key")`, then `symEncrypt(K_name,
            newName)` (seal purpose `group-name`, bound to scope + name epoch) — opaque base64 the server stores verbatim and never interprets. Sealing
            under the current epoch is what makes the rename forward-secret.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        nameEpoch:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          description: >
            The content-key epoch the client sealed `encryptedName` under — must equal the scope's **current** epoch
