openapi: 3.1.0
info:
  title: veyq Operator API
  version: 0.1.0
  description: >
    Who runs this instance, readable by anyone before sign-in: the instance contact and the languages it answers in,
    the address statements and disclosures name, the provider identification and the competent data-protection
    supervisory authority ([ADR 0093](../../docs/decisions/0093-a-report-opens-one-window-for-the-moderator-and-a-hold-copies-never-blocks.md)
    § 11, [ADR 0035](../../docs/decisions/0035-server-terms-of-service.md) decisions 6–7, uc.admin.operator-details),
    and the two fixed texts they fill: the operator section of the terms (decision 6) and the privacy notice (decision
    8, uc.admin.privacy-notice), which alone publishes the recipients and a data-protection officer.
    They are public operational data like the terms, set by the Server Owner on the admin channel
    (`instance.openapi.yaml`, tag `instance-operator`), and instance-wide: the answer is the same on every host. The
    notification address and the operating mode are never served here.

    Nothing here is user content. Operator-blindness is untouched: these are the operator's own values, typed by the
    operator to be published.
tags:
  - name: operator
    description: >
      The public read of the operator's published values. One tag = one resource interface owning `/api/operator`.

paths:
  /api/operator:
    get:
      tags: [operator]
      operationId: getOperatorDetails
      summary: Read who runs this instance — the contact, the provider identification and the supervisory authority.
      description: >
        The values the Server Owner published, each null where none is set — in either operating mode a value that is
        set is shown, one left empty is simply absent (ADR 0035 decision 6). web/ shows the identification on the
        login and the share pages (ADR 0035 decision 7). Host-independent: the values are the instance's, not a
        tenant's. Unauthenticated; rate-limited per client address.
      security: []
      responses:
        "200":
          description: The published values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorDetails" }
              example:
                contactEmail: contact@example.org
                contactLanguages: [de, en]
                statementEmail: moderation@example.org
                providerName: Example e. V.
                providerAddress: "Musterstraße 1\n12345 Musterstadt"
                providerEmail: info@example.org
                providerRepresentative: Erika Mustermann (Vorstand)
                supervisoryAuthority: "Landesbeauftragte für Datenschutz, Musterstadt"
        "429":
          description: Too many requests from this address; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/operator/terms:
    get:
      tags: [operator]
      operationId: getOperatorTerms
      summary: Read the operator section of the terms — public, without sign-in.
      description: >
        The fixed operator section of the terms ([ADR 0035](../../docs/decisions/0035-server-terms-of-service.md)
        decision 6) as every space's terms carry it, rendered in the operating mode's variant with the values the
        Server Owner set, and with the pointer to the guest-write record's information (`getPrivacyNotice`) while that
        record is on for the instance. DSA Art. 14(1) asks for the terms to be publicly available and easily
        accessible, so this read needs no account: web/ shows it at a page of its own, linked from the login page, the
        share page and the signed-in shell. The same
        section rides each space's terms (`getTenantTerms`, `getShareTerms`) after the space's own text; only there is
        it accepted. Host-independent: instance-wide like `getOperatorDetails`. Unauthenticated; rate-limited per
        client address. Every text is a draft until a qualified legal review and says so.
      security: []
      responses:
        "200":
          description: The rendered section.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSection" }
              example:
                revision: 2
                variant: FULL
                text: { de: "## Auf dieser Instanz: …", en: "## On this instance: …" }
                record: { de: "### Deine IP-Adresse …", en: "### Your IP address …" }
        "429":
          description: Too many requests from this address; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/operator/privacy-notice:
    get:
      tags: [operator]
      operationId: getPrivacyNotice
      summary: Read the instance's privacy notice — public, without sign-in, as this host's space runs it.
      description: >
        The fixed privacy notice ([ADR 0035](../../docs/decisions/0035-server-terms-of-service.md) decision 8, GDPR
        Art. 13; uc.admin.privacy-notice), rendered from `contracts/terms/privacy-notice.json` in the operating mode's
        variant, with the values the Server Owner set (the provider identification, the contact, the supervisory
        authority, the recipients, a data-protection officer), the instance's own values (the guest-write record's N,
        the backup period B, the account erasure's window, an external object store's host) and one passage per
        processing the instance runs: a passage bound to a capability switch is present exactly while that switch is
        active for the space this host serves (the bootstrap domain and an unknown host read the instance level), and
        a service's passage names the address the instance actually calls. Art. 13 applies at collection, so the read
        needs no account: web/ shows it at `/privacy` on every tenant host, linked from the login page, the share
        page, the signed-in shell, the invite acceptance, the report dialog and a guest's first-write notice, each at
        the passage that concerns it. Information, not consent: nothing accepts it and reading it records nothing.
        Unauthenticated; rate-limited per client address. Every text is a draft until a qualified legal review and
        says so.
      security: []
      responses:
        "200":
          description: The rendered notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyNotice" }
              example:
                revision: 1
                variant: FULL
                draftBanner: { de: "*Entwurf: …*", en: "*Draft: …*" }
                passages:
                  - id: account
                    separate: false
                    text: { de: "## Dein Konto …", en: "## Your account …" }
                  - id: right-to-object
                    separate: true
                    text: { de: "### Dein Widerspruchsrecht …", en: "### Your right to object …" }
        "429":
          description: Too many requests from this address; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

components:
  schemas:
    OperatorDetails:
      type: object
      description: >
        The operator's published values; every one may be null (none set). Never the notification address.
      required:
        - contactLanguages
      properties:
        contactEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The instance contact (DSA Art. 11–12, TCO Art. 15) must be published; the operator typed it for that
            purpose (ADR 0093 § 11).
          type: string
          format: email
          description: The single point of contact for users and authorities, and the TCO contact point.
          maxLength: 254
          example: contact@example.org
        contactLanguages:
          x-veyq-visibility: public
          type: array
          description: The languages the contact answers in, as language tags; empty when none is named.
          maxItems: 12
          items:
            type: string
            maxLength: 35
          example: [de, en]
        statementEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The address statements and disclosures name (ADR 0093 § 11), published; the operator typed it for that
            purpose.
          type: string
          format: email
          description: The address a statement of reasons and a disclosure name.
          maxLength: 254
          example: moderation@example.org
        providerName:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The provider identification (ADR 0035 decision 7; § 5 DDG, § 18 MStV) names the operator in public; the
            operator typed it for that purpose.
          type: string
          description: The provider's name.
          maxLength: 200
          example: Example e. V.
        providerAddress:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The provider identification's address for service (ADR 0035 decision 7), published by law.
          type: string
          description: The address for service; may span lines.
          maxLength: 500
          example: "Musterstraße 1\n12345 Musterstadt"
        providerEmail:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The provider identification's email address (ADR 0035 decision 7), published by law.
          type: string
          format: email
          description: The provider's email address.
          maxLength: 254
          example: info@example.org
        providerRepresentative:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Who represents a legal person (ADR 0035 decision 7), published by law.
          type: string
          description: For a legal person, who represents it.
          maxLength: 200
          example: Erika Mustermann (Vorstand)
        supervisoryAuthority:
          x-veyq-visibility: public
          type: string
          description: The competent data-protection supervisory authority.
          maxLength: 500
          example: "Landesbeauftragte für Datenschutz, Musterstadt"

    PrivacyNotice:
      type: object
      description: >
        The instance privacy notice as this host serves it (ADR 0035 decision 8): veyq's fixed text, its passages in
        order, each with its anchor. Public operational content, never E2EE: every value in it is the operator's own,
        typed to be published, or a fact of the running instance.
      required: [revision, variant, passages]
      properties:
        revision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The notice's revision — it moves with its text, that is with a veyq release, never with a value.
          example: 1
        variant:
          $ref: "#/components/schemas/OperatorSectionVariant"
        draftBanner:
          description: >
            The banner every rendering opens with while the text awaits a qualified legal review; absent once reviewed.
          oneOf:
            - $ref: "#/components/schemas/LocalizedMarkdown"
            - type: "null"
        passages:
          type: array
          description: The passages that apply on this host, in the order the text gives them.
          maxItems: 64
          items: { $ref: "#/components/schemas/PrivacyNoticePassage" }

    PrivacyNoticePassage:
      type: object
      description: One passage of the notice.
      required: [id, separate, text]
      properties:
        id:
          x-veyq-visibility: structure
          type: string
          description: >
            The passage's anchor on the page (`/privacy#<id>`), stable across releases: the invite acceptance links
            `account`, the report dialog `reporter-contact`, a guest's first-write notice `guest-write-record`.
          maxLength: 64
          example: account
        separate:
          x-veyq-visibility: flag
          type: boolean
          description: A right to object, shown apart from the rest (GDPR Art. 21(4)).
          example: false
        text:
          # No description beside the $ref: the generator would emit an inline copy of LocalizedMarkdown.
          $ref: "#/components/schemas/LocalizedMarkdown"

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
    LocalizedMarkdown:
      $ref: '_common.openapi.yaml#/components/schemas/LocalizedMarkdown'
    OperatorSection:
      $ref: '_common.openapi.yaml#/components/schemas/OperatorSection'
    OperatorSectionVariant:
      $ref: '_common.openapi.yaml#/components/schemas/OperatorSectionVariant'
