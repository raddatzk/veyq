openapi: 3.1.0
info:
  title: veyq Favorites API
  version: 0.1.0
  description: >
    The platform's **favorites** (en.memory.favorites, [ADR 0068](../../docs/decisions/0068-favorites-two-confidentiality-levels.md)):
    the member's private **pins** of nodes in a scope — a node of any kind, a folder, a file, a Memory, a drop box —
    one opaque blob sealed client-side under the member's master key, stored verbatim by the server. Core's, not an
    application's: the pin is a preference about a node, and every application's nodes are nodes. **Operator-blind:**
    the server never sees which nodes are pinned, only ciphertext + its size. Authorization is enforced by code, not
    this spec (ADR 0008); field validation via `x-field-extra-annotation`. The per-item *marks* on media inside one
    Memory are Memories' (`memories/item-favorites.openapi.yaml`).
tags:
  - name: favorites
    description: >
      The caller's **per-(user, scope) node pins** — the set of pinned node ids, sealed client-side under
      the member's **master key** and stored as a single opaque blob (en.memory.favorites). **Private to the
      member:** this resource returns the caller's own blob and never another member's, and the seal does not
      branch on scope type, so a co-member holding the shared `K_SC` cannot open it
      ([ADR 0068](../../docs/decisions/0068-favorites-two-confidentiality-levels.md)). Operator-blind: a pin is
      a personal preference, NOT in the sanctioned metadata set, so the server never sees *which* nodes are
      pinned — only an opaque ciphertext + its size. Own resource interface (one path). A share guest has no
      pins: there is no guest route.

paths:
  /api/scopes/{scopeId}/favorites:
    get:
      tags: [favorites]
      operationId: getFavorites
      summary: Get the caller's sealed favorites blob for the scope.
      description: >
        Returns the caller's own pin ciphertext for the scope (the sealed set of pinned node ids), or a null
        ciphertext if none was ever stored. The client decrypts it with its **master key** — never `K_SC`, which
        is shared in a group and would make the set readable by every co-member. Another member's blob is never
        returned here. The operator sees only an opaque blob.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The caller's favorites blob (ciphertext null when unset).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
              example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [favorites]
      operationId: putFavorites
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the pin set is the caller's own, per scope; the loss is one toggle between that member's
          own devices (ADR 0068). A toggle never starts from a set it has not loaded (ADR 0077 point 5).
      summary: Replace the caller's sealed favorites blob for the scope.
      description: >
        Upserts the caller's pin ciphertext for the scope (last-write-wins). The client seals the whole pinned
        set under its **master key** and PUTs the opaque result; the server stores it verbatim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFavoritesRequest" }
            example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
      responses:
        "204":
          description: The favorites blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }

  schemas:
    Favorites:
      type: object
      properties:
        ciphertext:
          type: string
          description: The caller's pinned-node set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64); null when unset. Private to the member — `K_SC` does not open it.
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=

    PutFavoritesRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          description: The pinned-node set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
