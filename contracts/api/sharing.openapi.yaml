          maxLength: 64
          example: FsNwNHCyCakLiKYUidaFcVAETZT9pNhFigWt85nrvSQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    SetShareSealedNameRequest:
      type: object
      required: [sealedName]
      description: >
        A share root's new name, re-sealed under the share's `K_share` by the member who renamed the root (ADR 0080
        decision 14). The bounds are `CreateShareRequest.sealedName`'s.
      properties:
        sealedName:
          type: string
          description: The shared node's current name re-sealed under `K_share` (seal purpose `share-memory-name`, a stored seal id that keeps its name; opaque base64) — what `resolveShare` serves as the title.
          contentEncoding: base64
          maxLength: 4096
          example: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ShareCreated:
      type: object
      required: [shareId]
      properties:
        shareId:
          x-veyq-visibility: id
          type: string
          description: The opaque 256-bit share id (base64url). The full link `/s/{shareId}#k=<K_share>` is assembled client-side.
          minLength: 43
          maxLength: 43
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i

    ShareSummary:
      type: object
      required: [shareId, scopeId, nodeId, role, sealedName, enabled, mine, reissueRequired, deletable, newGuestsRefused, writeVerifierMissing, createdAt]
      properties:
        shareId:
          x-veyq-visibility: id
          type: string
          minLength: 43
          maxLength: 43
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The shared node (lets the curator UI group shares by node).
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The shared node's scope — its `sealedShareKey` is sealed bound to (scope, node, share) (ADR 0072).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        role:
          $ref: "#/components/schemas/ShareRole"
        sealedName:
          type: string
          description: The shared node's name re-sealed under `K_share` (opaque base64) — the curator UI unwraps it to label the row.
          contentEncoding: base64
          maxLength: 4096
          example: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
        sealedNote:
          type: [string, "null"]
          description: The curator note (per-locale JSON map) under `K_share` (opaque base64), or null — the manage UI shows + edits it.
          contentEncoding: base64
          maxLength: 16384
          example: null
        sealedShareName:
          type: [string, "null"]
          description: The share's private label under `K_share` (opaque base64), or null — the manage UI shows it as the row title, falling back to the role (cr-0116).
          contentEncoding: base64
          maxLength: 512
          example: null
        sealedShareKey:
          type: [string, "null"]
          description: >
            The recoverable per-share key — `K_share` sealed under `K_SC` at `sealedShareKeyEpoch` (opaque base64),
            or null — lets a scope member's manage UI recover `K_share` to reveal, edit and re-copy the share
            (ADR 0036 point 4).
          contentEncoding: base64
          maxLength: 256
          example: null
        sealedShareKeyEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The scope content-key epoch `sealedShareKey` is sealed under (ADR 0024) — null exactly when `sealedShareKey` is.
          minimum: 0
          example: null
        passwordRequired:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: True when the share is password-protected (cr-0118) — the manage UI shows a lock badge.
          example: false
        sealedPassword:
          type: [string, "null"]
          description: >
            The plaintext password sealed under `K_share` (opaque base64), or null — management-only; the manage UI
            recovers `K_share` (via `sealedShareKey`) to **reveal** it. Never served to a viewer (cr-0118, ADR 0037).
          contentEncoding: base64
          maxLength: 512
          example: null
        enabled:
          x-veyq-visibility: flag
          type: boolean
          description: False once revoked — the guest resolve + blob GET then `404`.
          example: true
        mine:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when the authenticated caller owns this share (so may revoke it). On a node of a shared scope the
            list also includes other members' shares (cr-0104); a disabled share by anyone can be re-activated by
            a member, which transfers ownership.
          example: true
        reissueRequired:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when a departed member may hold this link, so it comes back only by `reissueShare`, never
            `reactivateShare` — a bulk switch-off turned it off, its owner has left the scope, or its recovery copy
            predates the scope's current epoch or its last member removal (ADR 0075 point 4). The server computes it
            with the same predicate the re-activation refusal runs, so the manage panel's hint and the refusal cannot
            disagree.
          example: false
        deletable:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when the caller may delete this share (`deleteShare`): it is theirs, or its owner is no longer a
            member of its scope. The server computes it with the predicate the delete runs, so the panel's offer and
            the refusal cannot disagree.
          example: true
        newGuestsRefused:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when this link takes guests (READ_WRITE or WRITE_ONLY) but holds no write verifier — it was minted
            before guest naming proved the link's key (ADR 0076 point 5) — so `createShareIdentity` refuses every new
            guest until the link is re-issued (`reissueShare` stores a verifier); a guest named before keeps
            uploading. Derived from what the share already stores, not a new fact about it.
          example: false
        writeVerifierMissing:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True when this link holds no write verifier, whatever its role (ADR 0076 point 5) — `newGuestsRefused` is
            this fact for a role that takes guests. A READ link without one turns into a READ_WRITE link that refuses
            every new guest, and an edit never adds a verifier (ADR 0076 point 2), so the manage UI warns on that role
            change and offers `reissueShare` instead. Derived from what the share already stores.
          example: false
        expiresAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: The share's expiry instant, or null when it never expires.
          example: null
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          example: 2026-07-07T12:00:00Z

    PublicShare:
      type: object
      required: [role, passwordRequired, nodes]
      description: >
        A resolved share. When `passwordRequired` is true and the guest presented **no** (or a wrong) password
        token, the response is **locked**: only `role` + `passwordRequired` + `pwSalt` are set and `wrap` /
        `sealedDropPublicKey` / `nodeId` / `rootKind` / `sealedName` / `sealedNote` / `nodes` are
        omitted/empty — the client prompts for the password and re-resolves with the token (cr-0118, ADR 0037).
        An unlocked WRITE_ONLY response carries `sealedDropPublicKey` **instead of** `wrap` (ADR 0031 point 7).
        It carries no application data: the link and the shared nodes with their keys, nothing an application
        attached under them (ADR 0079).
      properties:
        role:
          $ref: "#/components/schemas/ShareRole"
        passwordRequired:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: True when this share needs a password token; a locked response carries only this + `pwSalt` (cr-0118).
          example: false
        scopeId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The shared node's scope. Every seal under a node's content key the viewer opens — node payloads, the
            application's sealed rows, blob keys — is bound to it (ADR 0072), so it rides with the subtree. Null in
            a locked response.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        pwSalt:
          type: [string, "null"]
          description: The salt for `Argon2id(password, pwSalt)` (opaque base64) — present when `passwordRequired`, so the client can derive the token (cr-0118).
          contentEncoding: base64
          maxLength: 64
          example: null
        wrap:
          type: [string, "null"]
          description: >
            The wrap `symWrap(K_share, content key)` (opaque base64) — the viewer unwraps the shared node's content
            key with the fragment key. Null for a WRITE_ONLY share (its guest never holds that key) and in a locked
            (password-gated) response.
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbS11bmRlci1rLXNoYXJl
        sealedDropPublicKey:
          type: [string, "null"]
          description: >
            WRITE_ONLY only: the drop public key of the shared root node of this WRITE_ONLY link, sealed under
            `K_share` (AAD `drop-public-key`, opaque base64). The guest wraps its own identity key to it. Null for every other role and in a locked response.
          contentEncoding: base64
          maxLength: 2048
          example: null
        nodeId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The shared root node. A WRITE_ONLY guest binds its identity key's wrap to it (`upload-identity-key`, ADR
            0072), since it is served no node. Null in a locked response.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        rootKind:
          $ref: "#/components/schemas/NodeKind"
          # The backend's Jackson writes a null property as `null` (measured: `"rootKind": null` on the locked
          # response); the token is not nullable, so the property is left out instead.
          x-field-extra-annotation: '@get:com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          description: >
            The kind of the shared root node; a structural fact the server already holds. Served for every unlocked
            role, WRITE_ONLY included (it is served no node, so this is how its client learns which application
            renders the link); omitted in a locked response and while the root node is in the trash (then nothing
            of the subtree is served either). Core interprets no kind: it is the stored value.
        sealedName:
          type: [string, "null"]
          description: The shared node's name re-sealed under `K_share` (opaque base64). Null in a locked response.
          contentEncoding: base64
          maxLength: 4096
          example: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
        sealedNote:
          type: [string, "null"]
          description: The curator note (per-locale JSON map) sealed under `K_share` (opaque base64), or null when the share has none. The page renders the viewer's locale (cr-0115/cr-0116).
          contentEncoding: base64
          maxLength: 16384
          example: null
        nodes:
          type: array
          description: The live subtree rooted at the shared node — the root plus its descendants, for the content-key chain and the descendants' names; nothing above the root (ADR 0080 Decision 9). Empty for a WRITE_ONLY link and in a locked response.
          items: { $ref: "#/components/schemas/ShareNode" }

    ShareNode:
      type: object
      description: >
        One node of the shared subtree. The **root** carries `parentId: null` (the viewer takes its content key
        from the share `wrap`); a descendant carries its parent's id, its content key wrapped under the parent's
        in `wrappedContentKey`, and its name sealed under the parent's content key in `encryptedName` (ADR 0080
        Decision 2), so whoever holds the root's key opens every name below it. Nothing of the root's own
        placement is served: no parent id, no `encryptedName` (both belong to the parent's key, which the guest
        does not hold, ADR 0080 Decision 9) — the root's name comes from the share's `sealedName`.
      required: [id, kind, epoch]
      properties:
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The parent node id within the subtree, or null at the shared root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 0
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The content-key epoch the node was sealed at (as `NodeSummary.epoch`) — a descendant's `wrappedContentKey` and `encryptedName` are bound to it (ADR 0072).
          minimum: 0
          example: 0
        placementRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          # Omitted, not `null`, at the root, like `encryptedName`: the root's placement is above the share.
          x-field-extra-annotation: '@get:com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          description: >
            A descendant's placement revision (as `NodeSummary.placementRevision`): its `wrappedContentKey` and
            `encryptedName` are bound to it (ADR 0072, ADR 0080 Decision 3), so the viewer opens them at the
            revision served with them. Omitted at the root, whose entry is not served (ADR 0080 Decision 9).
          minimum: 0
          example: 0
        encryptedName:
          type: string
          # Omitted, not `null`, at the root: Jackson writes a null property as `null`, and the root's entry is
          # simply not part of what a share serves.
          x-field-extra-annotation: '@get:com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          description: >
            A descendant's name, AEAD-sealed under its **parent's** content key (seal purpose `node-name`, bound to
            scope, node, epoch and placement revision; opaque base64) — the same value as `NodeSummary.encryptedName`, which the viewer
            opens with the key chain it derives from the root. Omitted at the root: its name is sealed under a key
            above the share (ADR 0080 Decision 9); the root's title is the share's `sealedName`.
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        wrappedContentKey:
          type: [string, "null"]
          description: A descendant's content key wrapped under its parent's (opaque base64); null at the root (its content key comes from the share `wrap`, and its own wrap belongs to the parent's key above the share, ADR 0080 Decision 9).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
        wrappedMeta:
          type: [string, "null"]
          description: The node's sealed payload, with its own revision, sealed under its content key (AAD `node-meta`; opaque base64); its format is the kind's application's. Null when unset.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
        sealedDropPrivateKey:
          type: [string, "null"]
          description: >
            The drop private key of the shared root node of a WRITE_ONLY link, sealed under the node's content key
            (AAD `drop-private-key`, bound to scope + node; opaque base64) — what opens what a WRITE_ONLY guest added
            (ADR 0031 point 7). Null until the node's first WRITE_ONLY share.
          contentEncoding: base64
          maxLength: 256
          example: null
        shareIdentityId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            Set on a guest's **identity folder** only (ADR 0080 decision 11): the `FOLDER` a `WRITE_ONLY` guest created
            in its link's root (a drop box) for its own uploads, one per (drop box, identity). Its `encryptedName`,
            `slugToken` and `wrappedContentKey` are then under that identity's key `K_up`, not under the parent's
            content key: a reader opens the parent's `sealedDropPrivateKey`, then `wrappedIdentityKey`, then the
            entry. Null for every other node, and cleared when a member moves the folder out (it is re-wrapped under
            its new parent then).
          example: null
        wrappedIdentityKey:
          type: [string, "null"]
          description: >
            With `shareIdentityId` only: that identity's key `K_up` wrapped to the parent's drop public key (AAD
            `upload-identity-key`, bound to scope + the parent node + the identity; opaque base64), as the guest
            created it (`createShareIdentity`). Null otherwise.
          contentEncoding: base64
          maxLength: 2048
          example: null

    CreateShareNodeRequest:
      type: object
      required: [nodeId, parentId, kind, encryptedName, slugToken, epoch, wrappedContentKey]
      description: >
        A READ_WRITE guest's create inside the shared subtree (`createShareNode`): the member's `CreateNodeRequest`
        with a required `epoch` checked as off the scope root (a guest never writes there) and without
        `wrappedMeta` (a node's payload is its application's content, not a core tree operation's). The parent is
        always a node of the subtree.
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the node to create (ADR 0072 Decision 3). Its name and content-key wrap are sealed bound to this id, so the server stores it verbatim; a taken id is `409 id_taken`.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        parentId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The parent node — the share's root or a live node below it.
          example: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
        kind:
          $ref: "#/components/schemas/NodeKind"
          # As on `CreateNodeRequest`: the generator inlines the scalar token as a String, so its shape is held here.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under the parent's content key (seal purpose `node-name`), bound to scope, node, `epoch` and placement revision 0 (ADR 0072, ADR 0080 Decision 2; opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under the parent's content key over (parent ‖ slug); the server enforces uniqueness per parent without seeing the name (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: Ordering among siblings (default 0 / append).
          example: 0
        epoch:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0 (backend/CLAUDE.md)
          type: [integer, "null"]
          description: >
            The scope content-key epoch the guest sealed the name and the wrap with (ADR 0024, ADR 0080 Decision 6).
            Every seal binds it, so the server stores it as sent and a reader opens at it. The entry is under the
            parent's key, never `K_SC`, so an epoch below the current one is accepted; one above the scope's current
            epoch is `409 stale_epoch`, nothing stored (the rule of a member's placement off the root).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'
        wrappedContentKey:
          type: string
          description: The node's content key — a fresh random key the guest mints, wrapped under the parent's content key (seal purpose `content-key`), bound to scope, node, `epoch` and placement revision 0 (ADR 0080 Decision 1; opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ShareNodeCreated:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d

    UpdateShareNodeRequest:
      type: object
      required: [parentId, encryptedName, slugToken, wrappedContentKey, placementRevision]
      description: >
        A READ_WRITE guest's placement write (`updateShareNode`) — every field of the node's directory entry and key
        wrap at once, as the placement half of the member's `UpdateNodeRequest`, without `epoch` (the node keeps its
        stored one) and without the reorder and the payload re-seal.
      properties:
        parentId:
          x-veyq-visibility: id
          type: string
