    ShareBlobDownload:
      type: object
      required: [presignedGets]
      properties:
        presignedGets:
          type: array
          description: One presigned GET URL per chunk, in chunk order.
          items: { $ref: "#/components/schemas/PresignedUrl" }

    PresignedUrl:
      $ref: '_common.openapi.yaml#/components/schemas/PresignedUrl'

    # --- contributor (cr-0101) ---------------------------------------------------

    CreateShareIdentityRequest:
      type: object
      required: [identityId, sealedDisplayName]
      properties:
        identityId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the new contributor identity (ADR 0072 Decision 3) — the display name is sealed bound to (scope, share, this id). Taken ⇒ `409 id_taken`.
          example: 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c
        sealedDisplayName:
          type: string
          description: >
            The display name sealed (opaque base64) — under the shared node's content key for READ_WRITE, under `K_up` for WRITE_ONLY;
            mandatory, never in clear.
          contentEncoding: base64
          maxLength: 512
          example: c2VhbGVkLW5hbWUtdW5kZXItay1tZW0=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedIdentityKey:
          type: [string, "null"]
          description: >
            WRITE_ONLY only (required there, absent for READ_WRITE): the guest's own identity key `K_up` wrapped to
            the shared root node's drop public key (AAD `upload-identity-key`, bound to scope + node + this `identityId`;
            opaque base64).
          contentEncoding: base64
          maxLength: 2048
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ShareIdentityCreated:
      type: object
      required: [identityId, contributorToken]
      properties:
        identityId: { type: string, format: uuid, example: 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c, x-veyq-visibility: id }
        contributorToken:
          x-veyq-visibility: token
          type: string
          description: An unguessable capability token (held on device) that authorizes this identity's uploads on the share.
          maxLength: 512
          example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl

    ShareBlobUploadsRequest:
      type: object
      required: [contributorToken, items]
      properties:
        contributorToken:
          x-veyq-visibility: token
          type: string
          description: The capability token from `createShareIdentity` — authorizes the upload on the share.
          maxLength: 512
          example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The node the uploads are for ([ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md)
            Decision 6: a link's role applies to every node below its root as the application allows it). Absent =
            the share root (unchanged behaviour); otherwise a live node inside the share's subtree whose application
            takes guest uploads (Memories: a MEMORY or CHAPTER; Files: a FILE) — a node that is not one is `404 node_not_found`, a kind no application takes guest uploads into is `403
            share_not_contributable`; a `WRITE_ONLY` link only accepts its root or a node inside its guest's own identity folder (`403 share_not_contributable` otherwise).
            The same node is named again on every window and at the completion.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ShareBlobUploadRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    ShareBlobUploadRequestItem:
      type: object
      required: [blobId, ownerId, role, chunkCount, byteSize, wrappedBlobKey]
      properties:
        blobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of this blob (ADR 0072 Decision 3) — its `wrappedBlobKey` is sealed bound to it. Taken ⇒ this item fails `id_taken`.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        ownerId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted id of the application's object the guest completion will attach the blob to — the `wrappedBlobKey` is sealed bound to it.
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        role:
          $ref: "#/components/schemas/BlobRole"
          # The token's shape holds here (400 before the handler); which roles a guest may upload is the target
          # node's application's (`ShareGuestWrites.admitsGuestRole`): any other is `400 invalid_request`.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        chunkCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: >
            Number of ciphertext chunks the blob is sealed into. Not a free choice: it is derived from `byteSize`
            by the contract's frame size (`chunk_frame_size` in `contracts/crypto/vectors/v1.json`, ADR 0013 §3) —
            every frame but the last is full, so `chunkCount = ⌈byteSize / (nonceBytes + plaintextBytes +
            tagBytes)⌉` — and any other value is refused per item (`shape_invalid`). No maximum of its own: the
            ceiling is the server's per-blob byte cap.
          minimum: 1
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        byteSize:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            Total ciphertext byte size declared up front — the sum of the blob's sealed frames. It fixes the blob's
            shape (`chunk_frame_size` in the crypto vectors): `chunkCount` and every chunk's exact length follow
            from it, and a size no frame sequence has — under one empty frame (28), or whose last frame of several
            would carry no plaintext — is refused per item (`shape_invalid`). Verified on complete: every chunk
            must be present at exactly its derived length.
          minimum: 28
          example: 400000
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(28)'
        wrappedBlobKey:
          type: string
          description: The blob's random `K_blob` wrapped under the shared node's content key, or under `K_up` for a WRITE_ONLY guest (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedBlobMeta:
          type: string
          description: >
            Optional, client-supplied: the blob's metadata (its type, the name it was uploaded under, its modification
            time) sealed under the blob's own `K_blob` — the purpose-only `blob-meta` seal, because that key is the
            binding ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md) Decision 2), whoever wrapped
            `K_blob`. Opaque base64 to the server, which never reads it: it is stored write-once with the blob and
            served back unchanged wherever the blob's `wrappedBlobKey` is; no operation changes it. Absent ⇒ none.
          contentEncoding: base64
          minLength: 1
          maxLength: 2048
          example: c2VhbGVkLWJsb2ItbWV0YQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ShareBlobUploadsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ShareBlobUploadResultItem" }

    ShareBlobUploadResultItem:
      type: object
      description: One per request item, in order. Success carries `uploadId` + `presignedPuts`; failure carries `error`.
      properties:
        uploadId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        presignedPuts:
          type: [array, "null"]
          description: >
            Presigned PUT URLs for the blob's **first window** of chunks only, in chunk order; every later chunk is
            signed by `presignShareBlobUploadWindows`. Each is signed for its chunk's exact `Content-Length` (full
            frames, then the remainder), so the store refuses a body of any other length.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Per-item error code (`budget_exceeded` = the declared `byteSize` is over the per-blob cap, `shape_invalid` = the declared `chunkCount`/`byteSize` is no shape the frame size allows, `id_taken` = the `blobId` already exists, `quota_exceeded` = the request's admissible items together do not fit the link's storage limit or the tenant's quota (which one is not said), so every one of them is refused and no session is opened — no retry can help (ADR 0073 §5–§6), `store_unavailable`); null on success.
          maxLength: 64
          example: null

    ShareBlobUploadWindowsRequest:
      type: object
      required: [contributorToken, items]
      properties:
        contributorToken:
          x-veyq-visibility: token
          type: string
          description: The capability token from `createShareIdentity` — the identity that opened the sessions.
          maxLength: 512
          example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512)'
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The node the uploads are for ([ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md)
            Decision 6: a link's role applies to every node below its root as the application allows it). Absent =
            the share root (unchanged behaviour); otherwise a live node inside the share's subtree whose application
            takes guest uploads (Memories: a MEMORY or CHAPTER; Files: a FILE) — a node that is not one is `404 node_not_found`, a kind no application takes guest uploads into is `403
            share_not_contributable`; a `WRITE_ONLY` link only accepts its root or a node inside its guest's own identity folder (`403 share_not_contributable` otherwise).
            The same node is named again on every window and at the completion.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ShareBlobUploadWindowRequestItem" }
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.Valid'

    ShareBlobUploadWindowRequestItem:
      type: object
      required: [uploadId, fromChunk]
      properties:
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The open upload session, as `startShareBlobUploads` returned it.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        fromChunk:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (backend/CLAUDE.md)
          type: [integer, "null"]
          format: int32
          description: The first chunk index (0-based) of the window to sign; it must lie inside the blob.
          minimum: 0
          example: 64
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'

    ShareBlobUploadWindowsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ShareBlobUploadWindowResultItem" }

    ShareBlobUploadWindowResultItem:
      type: object
      description: One per request item, in order. Success carries `presignedPuts`; failure carries `error`.
      properties:
        presignedPuts:
          type: [array, "null"]
          description: >
            Presigned PUT URLs for chunks `fromChunk` to `min(fromChunk + window, chunkCount) - 1`, in chunk order,
            each signed for its chunk's exact `Content-Length`.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            Per-item error code; null on success. `upload_not_found` = no such session, it is no longer open, or
            this identity did not open it — one code for all three, so a probe learns nothing. `range_invalid` =
            `fromChunk` lies outside the blob. `store_unavailable` = the configured store cannot presign.
          maxLength: 64
          example: null

    # --- accountless terms gate (cr-anonymous-accept-gate, ADR 0035 §3) ---------
    ShareTerms:
      type: object
      description: >
        The owning tenant's public terms for a share, served to an accountless visitor to accept **client-side**
        (uc.sharing.share-accept). No acceptance is recorded server-side. The `tenantId` is opaque metadata only
        **returned** (never passed in — no existence oracle); it is the client's per-tenant localStorage key.
      required: [tenantId, termsRevision]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The opaque id of the tenant that owns the share — the client's localStorage key for the accepted revision. Only returned, never a request parameter.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        termsRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The tenant's current terms revision. 0 = no terms published (the client never gates).
          example: 3
        terms:
          description: The current per-locale terms (null/absent until the operator publishes any).
          oneOf:
            - $ref: "#/components/schemas/LocalizedMarkdown"
            - type: "null"

    # A local named alias to the _common source (the ErrorResponse pattern) so the generator emits a
    # `LocalizedMarkdown` model in this module while the shape is single-sourced with the tenants spec (ADR 0038).
    LocalizedMarkdown:
      $ref: '_common.openapi.yaml#/components/schemas/LocalizedMarkdown'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
