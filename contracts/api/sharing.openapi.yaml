          description: The destination parent — the share's root or a live node below it; a rename sends the node's current parent.
          example: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
        encryptedName:
          type: string
          description: The name re-sealed under the destination parent's content key (seal purpose `node-name`), bound to scope, node, the node's stored epoch and `placementRevision + 1` (ADR 0072, ADR 0080 Decision 3; opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: cmVuYW1lZA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: The blinded slug token recomputed under the destination parent's content key over the destination slot (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: bmV3LXNsdWc=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedContentKey:
          type: string
          description: The node's own content key (unchanged) re-wrapped under the destination parent's content key (seal purpose `content-key`), bound to scope, node, the node's stored epoch and `placementRevision + 1` (opaque base64). A rename re-wraps too.
          contentEncoding: base64
          maxLength: 256
          example: cmUtd3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        placementRevision:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0 (backend/CLAUDE.md)
          type: [integer, "null"]
          format: int64
          description: >
            The `ShareNode.placementRevision` the placement was built on. The server compare-and-sets it and stores
