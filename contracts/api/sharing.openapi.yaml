openapi: 3.1.0
info:
  title: veyq Sharing API
  version: 0.1.0
  description: >
    Public links to a single shared node and its subtree (uc.sharing.share-public-viewer, cr-0100,
    [ADR 0029](../../docs/decisions/0029-public-viewer-share.md)). A member of a scope turns **one node of
    it** (personal, group or tenant — ADR 0029 §6) into an **anonymous, revocable** link `/s/{shareId}#k=<K_share>`
    granting one access mode (`ShareRole`). The share adds an **independent second wrap** of that node's content
    key — `symWrap(K_share, content key)` ([ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md)) —
    whose secret `K_share` rides the **URL fragment** ([ADR 0015](../../docs/decisions/0015-operator-blind-readable-urls.md))
    and **never reaches the server**. Which node kinds can be a share's root, and with which roles, is the kind's
    owner's (`ShareRoots`: core's for a `FOLDER`, an application's for its own kinds); what a guest's write adds is
    the kind's application's (`ShareGuestWrites`).

    **Operator-blind.** The server stores only the opaque `shareId` (256-bit unguessable), the wrap, the
    plaintext `role`, the node's name **re-sealed under `K_share`**, and the shared `nodeId`. It never sees
    `K_share`, a content key, any name, the viewer, or — because blobs are fetched direct-from-store via
    presigned GETs — which blob a viewer opens.

    **Two authorization surfaces.** Curator management (`create` / `list` / `revoke` / `reissue` …) is
    **authenticated** (`bearerAuth`) and gated to a member of the shared node's scope. The guest **resolve** + **gated
    blob GET** are **unauthenticated** — a parallel authz path keyed on share state (`enabled` + `expiresAt`),
    never a relaxed scope filter. Both `shareId` **and** the fragment key are required: the id alone is inert
    (the wrap can't be opened without `K_share`), an unknown/disabled/expired id is a non-enumerable `404`.

    Authorization is enforced by code (ADR 0008); field validation via `x-field-extra-annotation`. `K_share`
    never appears in this spec — it lives only in the URL fragment (base64url, client-side).
tags:
  - name: sharing
    description: >
      Public share links — the curator's create/list/revoke/delete (authenticated) plus the anonymous guest
      resolve, identity, blob transport and gated presigned blob GET (unauthenticated). One tag = one resource interface owning the
      `/api/shares` subtree.

paths:
  /api/shares:
    post:
      tags: [sharing]
      operationId: createShare
      summary: Create a public share of a node the caller is a member of (any scope).
      description: >
        The client generates a fresh 32-byte `K_share`, computes `wrap = symWrap(K_share, content key)` over the
        node's content key, re-seals the node's name under `K_share`, seals `K_share` under the scope key as the
        members' recovery copy, and POSTs `{ nodeId, role, wrap, sealedName, sealedShareKey, sealedShareKeyEpoch, expiresAt? }` — `role` is
        the access mode (`ShareRole`: **READ**, **READ_WRITE** or **WRITE_ONLY**). The server verifies the caller
        is a **member** of the node's scope — personal, group, or tenant (cr-0104, ADR 0029 §6); a node whose kind
        may not be a share root with that role (`ShareRoots`) is rejected `422`, a non-member is a non-enumerable `404`. The **client** mints the 256-bit unguessable
        `shareId` ([ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md) Decision 3 — the recovery wrap is sealed bound to it) and the server stores the record
        opaquely under it. The link is `/s/{shareId}#k=base64url(K_share)` — the fragment (`K_share`) is built
        client-side and never sent; only `writeVerifier`, the hash of a token derived from it, is (ADR 0076). An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. An id is never minted twice: a deleted link's id (`deleteShare`) and the id of a link its space's erasure removed are refused `id_taken` as well — whoever holds a dead link's id and key could otherwise serve every other holder of that link a subtree of their own ([ADR 0029](../../docs/decisions/0029-public-viewer-share.md) §7). Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareRequest" }
            example:
              shareId: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
              nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              role: READ
              wrap: d3JhcHBlZC1rLW1lbS11bmRlci1rLXNoYXJl
              sealedName: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
              sealedShareKey: cmVjb3ZlcmFibGUtc2hhcmUta2V5LXVuZGVyLWtzYw==
              sealedShareKeyEpoch: 0
              expiresAt: null
              writeVerifier: FsNwNHCyCakLiKYUidaFcVAETZT9pNhFigWt85nrvSQ=
      responses:
        "201":
          description: The share was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }
              example: { shareId: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i }
        "400":
          description: Malformed request (missing/invalid fields — the recovery copy `sealedShareKey` and its `sealedShareKeyEpoch` included — or keys that do not match the role).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such node (a node in the trash counts as none, nobody shares it), or the caller is not a member of its scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            The `shareId` is already taken or was ever used — by a live, a deleted or an erased link (`id_taken`),
            the `sealedShareKeyEpoch` is not the scope's current epoch
            (`stale_epoch` — the caller's scope key lags a rotation; re-open it and re-seal, ADR 0024 Decision 6), or
            the space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4). For WRITE_ONLY: the
            request carries a drop private key the
            shared node already has one of (`drop_key_exists`), or carries none while the node has none
            (`drop_key_missing`) — nothing is written in either case. A taken `shareId` answers `id_taken` before
            either: so does the loser of a double-submitted create, even one that lost at the node's first drop key,
            because that is what its replay answers.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: id_taken } }
        "422":
          description: >
            Unprocessable. Two codes: `capability_disabled` — the sharing capability this role needs
            (`core.public-shares` for READ, `core.public-shares.contribute` for READ_WRITE,
            `core.public-shares.drop-box` for WRITE_ONLY) is not active instance-wide: its own entry is switched
            off, or `core.public-shares` above it is (the AND along the path, ADR 0088). It is checked first, before
            any scope check, so it reads as instance policy, not a scope error (ADR 0032). `illegal_scope` — the
            node's kind may not be a share root with this role (`ShareRoots`, ADR 0080: a `FOLDER` with READ or READ_WRITE, a kind of an
            application as that application declares — Files: a `FILE` with READ or READ_WRITE, never WRITE_ONLY; a kind
            nobody declares, or two do, is never shared); a non-member scope is a non-enumerable `404`, not `422`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: capability_disabled } }
    get:
      tags: [sharing]
      operationId: listShares
      summary: List shares — the caller's own, or (with nodeId) every member's on one node.
      description: >
        Without `nodeId`: every share the authenticated caller created **in a space they may still read** — a
        share whose space they left, or whose tenant is suspended, drops out of the list (uc.spaces.scope-access;
        the list is account-addressed and carries sealed names of those spaces). With `nodeId`: **every** share on
        that node visible to a **member of its scope** — not only the caller's (cr-0104), so a member can
        see and adopt an orphaned (disabled) share on a node of a shared scope; a non-member or an unknown node gets `[]`,
        an accepted member of a suspended tenant `403 tenant_suspended`. Each row carries `mine` (owned by the
        caller). A deleted link (`deleteShare`) is in neither listing. Operator-blind: the row carries no plaintext
        name or content.
      security:
        - bearerAuth: []
      parameters:
        - name: nodeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Scope the listing to one shared node — returns all its shares visible to a scope member.
      responses:
        "200":
          description: The caller's shares.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }

  /api/shares/{shareId}/revoke:
    post:
      tags: [sharing]
      operationId: revokeShare
      summary: Revoke a share (soft — the next guest request 404s).
      description: >
        Disables the share (`enabled = false`). The next `resolve` + gated blob GET then `404`. Idempotent — a
        missing/already-disabled share the caller owns still returns 204. Only its creator, and only while they
        are still a member of its space (uc.sharing.share-shared-scope A3). Soft (L1) revocation: already-
        downloaded ciphertext and a saved fragment link cannot be retracted (ADR 0029 §7, a stated limitation).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: The share is disabled (or was already gone).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such share owned by the caller, it was deleted, or the caller is no longer a member of its space.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/shares/{shareId}/reactivate:
    post:
      tags: [sharing]
      operationId: reactivateShare
      summary: Re-activate a soft-revoked share and adopt its ownership.
      description: >
        Re-enables a disabled share (`enabled = true`) and transfers `owner_account` to the caller. Any **current
        member** of the share's scope may adopt it, and the **same** link resolves again — which is why a link a
        departed member may hold is never re-activated
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md) point 4): when a
        bulk switch-off turned the share off (`revokeScopeShares`, or a removal's `revokeLinks`), when its owner is no
        longer a member of its scope, or when it carries a recovery copy and either that copy is sealed below the
        scope's current epoch or the scope has lost an accepted member since the share was minted (every member then
        could rebuild the link, one since removed included), the answer is `409 reissue_required`, nothing written,
        and the caller re-issues it (`reissueShare`) instead — the same predicate the list's `reissueRequired`
        carries. A share with no recovery copy is judged by the switch-off and its owner's membership alone.
        Idempotent for a share the caller may already adopt. Re-activating is a publication like creating, so it passes the same checks: a current member outside
        the space's deletion grace, and the instance's sharing capability for the share's role
        (uc.sharing.share-shared-scope A2).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: The share is enabled and now owned by the caller.
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such share, it was deleted, or the caller is not a member of its scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409":
          description: >
            A departed member may hold this link (`reissue_required`, nothing written — a bulk switch-off turned it
            off, its owner is no longer a member of the scope, or its recovery copy predates the scope's current
            epoch or its last member removal; re-issue it, ADR 0075), or the space is being deleted and read-only
            (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: reissue_required } }
        "422":
          description: >
            The instance capability this share's role needs is disabled (ADR 0032) — the same check
            `createShare` runs, since a re-activation publishes the link again.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: capability_disabled } }

  /api/shares/{shareId}/reissue:
    post:
      tags: [sharing]
      operationId: reissueShare
      summary: Re-issue a share — a new link with a fresh key, the old one deleted, in one request.
      description: >
        Creates a **new** share with a fresh client-minted `shareId` and a fresh `K_share`, carrying the old one's
        settings, and **deletes** the old one (a tombstone, as `deleteShare`) in the **same transaction** — what cuts a departed
        member off a link they could copy
        ([ADR 0075](../../docs/decisions/0075-a-link-a-departed-member-could-copy-is-reissued.md)). The client
        opens the old share through its recovery copy, re-seals its note, label and password under the new
        `K_share` (the password with a fresh salt) and seals the new recovery copy at the scope's current epoch.
        The server takes the shared node, the scope and the **role** from the old share, so a re-issue cannot move a
        link or change its role; the keys must match that role (`400`, as `createShare`). A WRITE_ONLY re-issue
        seals the shared node's **existing** drop public key and carries no drop private key — every upload so far is
        sealed to that key (ADR 0031 point 7). Guest identities stay with the old share: what their guests added
        stays under the shared node, and a returning guest names themself again on the new link.

        An **enabled** share is re-issued only by its owner (as `revokeShare`); a **disabled** one by any current
        member of its scope, who owns the new share (as `reactivateShare` adopts). The old link then `404`s exactly
        as a revoked one does — no redirect, which would hand the new id to the person the re-issue is for — and,
        deleted, it leaves the manage list and can never be re-activated or edited. **A share is re-issued at most
        once:** the re-issue locks the old row before it deletes it, so of two concurrent re-issues exactly one mints
        a link, and the other — like any later re-issue of a deleted share — is `409 share_deleted`; the caller
        re-reads the manage list, where the one new link already is. Any refusal writes nothing: the old link keeps
        its state and the new id stays free.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReissueShareRequest" }
            example:
              shareId: 9Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i3q2-7v
              wrap: d3JhcHBlZC1rLW1lbS11bmRlci1rLXNoYXJl
              sealedName: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
              sealedShareKey: cmVjb3ZlcmFibGUtc2hhcmUta2V5LXVuZGVyLWtzYw==
              sealedShareKeyEpoch: 1
              writeVerifier: FsNwNHCyCakLiKYUidaFcVAETZT9pNhFigWt85nrvSQ=
      responses:
        "201":
          description: The new share exists and the old one is deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }
              example: { shareId: 9Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i3q2-7v }
        "400":
          description: Malformed request (missing/invalid fields, or keys that do not match the old share's role).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: >
            No such share, the caller is not a member of its scope, or the share is enabled and not the caller's —
            one non-enumerable answer. A deleted share is `404` too, unless the caller is a member of its scope
            (`409 share_deleted`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409":
          description: >
            The share is already deleted — re-issued once already, by a concurrent re-issue or an earlier one, or
            deleted (`share_deleted`; re-read the manage list, ADR 0075 point 1) — the new `shareId` is already taken
            (`id_taken`), the `sealedShareKeyEpoch` is not the scope's current epoch (`stale_epoch` — re-open the
            scope key and re-seal, ADR 0024 Decision 6), or the space is being deleted and read-only
            (`scope_deleting`). Nothing is written in any case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "422":
          description: >
            The instance capability the share's role needs is disabled (`capability_disabled`, ADR 0032) — a
            re-issue publishes a link, so it checks what `createShare` checks.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: capability_disabled } }

  /api/shares/{shareId}/sealed-name:
    put:
      tags: [sharing]
      operationId: setShareSealedName
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          The value is always the share root's current name, re-sealed by whichever member renamed it last; a
          later write carries a later name, so no revision guards it (ADR 0080 decision 14).
      summary: Store a share's root name re-sealed under `K_share` (any member with write access).
      description: >
        Replaces the share's `sealedName` — the shared root's name re-sealed under `K_share` (seal purpose
        `share-memory-name`), the title `resolveShare` serves — after a member renamed that root
        ([ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md)
        decision 14). The renaming member's client opens each share on the root through its recovery copy
        (`sealedShareKey`), re-seals the new name under that share's `K_share` and stores it here, so the shown
        name never goes stale. **Any member with write access** to the share's space may call it, not only the
        share's owner: `updateShare` stays owner-gated
        ([ADR 0036](../../docs/decisions/0036-editable-share-note-recoverable-share-key.md) point 3) and replaces
        all of its fields, so it cannot carry this write. Changes `sealedName` and nothing else — note, label,
        role, expiry, password, keys and the enabled state are untouched. A revoked (disabled) share is renamed
        too, so a later re-activation shows the current name; a deleted one is `404`. Operator-blind: the server
        stores the ciphertext opaquely and never opens it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetShareSealedNameRequest" }
            example: { sealedName: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ== }
      responses:
        "204":
          description: The share's sealed name was replaced.
        "400":
          description: Malformed request (a missing, blank, oversized or non-base64 `sealedName`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: >
            No such share, it was deleted, or the caller may not write in its space (not a member, or a member
            removed from the tenant) — one non-enumerable answer.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/shares/{shareId}:
    get:
      tags: [sharing]
      operationId: resolveShare
      summary: Resolve a share (unauthenticated) → the sealed shared subtree.
      description: >
        **No auth.** Returns the `role`, the `wrap` (`symWrap(K_share, content key)`), the `sealedName`, and the
        **sealed subtree** rooted at the shared node — every node (for the content-key chain), all still sealed
        under the nodes' content keys. What an application attached under those nodes is that application's own
        guest read (ADR 0079). The viewer unwraps the root's content key with the fragment key, derives each
        descendant's from `wrappedContentKey`, and decrypts names / payloads **locally**. A disabled, expired, or
        unknown share, and one whose role's instance capability is switched off (ADR 0088 decision 5), is a
        non-enumerable `404` (same shape in every case). Without the fragment key the response is inert — the wrap cannot be opened.
        **Password-protected shares (cr-0118, ADR 0037):** with **no** `X-Share-Password` the response is
        **locked** — only `passwordRequired` + `pwSalt` (no `wrap`/`sealedName`/subtree); the client prompts,
        derives the token, and re-resolves with the header. A **wrong** token → `403 share_password_incorrect`.

        **Conditional GET (ADR 0081):** an unlocked `200` carries an `ETag` — a digest of exactly what the response
        serves (role, wrap, sealed name and note, the subtree's sealed rows), so a function of nothing the guest
        cannot already read. Unlike the member listing's scope revision it does NOT move when something outside the
        shared subtree changes, and so tells the guest nothing about the rest of the space. A guest echoes it as
        `If-None-Match`; an unchanged resolve answers `304`. A link revoked, expired or whose space is going is the
        same non-enumerable `404` as always, so a polling guest notices it.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
        - name: If-None-Match
          x-veyq-visibility: structure
          in: header
          required: false
          description: The `ETag` of the guest's last unlocked resolve. When it equals the digest of the response the server would send, `304`.
          schema: { type: string, maxLength: 80, example: "\"2a9b1d4a6e8b2c1f\"" }
      responses:
        "200":
          description: The share record + its sealed subtree (opaque; still under the nodes' content keys) — or a locked shell when a password is required and none/valid-token was given.
          headers:
            ETag:
              x-veyq-visibility: structure
              description: A digest of the unlocked response (absent on a locked shell) — echo it as `If-None-Match` on the next poll.
              schema: { type: string, example: "\"2a9b1d4a6e8b2c1f\"" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        "304":
          description: Not Modified — the guest's `If-None-Match` equals the digest of what this resolve would serve.
        "403":
          description: The share is password-protected and the presented `X-Share-Password` token is wrong (cr-0118).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_password_incorrect } }
        "404":
          description: No such share, or it is disabled/expired, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4), or the instance capability of its role is switched off (ADR 0088 decision 5 — `core.public-shares`, `.contribute` or `.drop-box`; the link serves again once it is back on) — non-enumerable, identical in every case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
    patch:
      tags: [sharing]
      operationId: updateShare
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: a share is edited only by its owner_account (uc.sharing.share-note), so two members
          never collide; the loss is between that member's own devices, and the form shows every field it
          sends.
      summary: Edit a share in place — note / name / role (owner-gated).
      description: >
        Edits an existing share **without minting a new link** (cr-0115/cr-0116/cr-0119, ADR 0036). Sets the
        `K_share`-sealed **note** (`sealedNote`) + **private name** (`sealedShareName`) — the caller recovers
        `K_share` from the share's `sealedShareKey` (sealed under `K_SC` at `sealedShareKeyEpoch`, which every scope
        member holds and no share link does — ADR 0036 point 4),
        re-seals them, and PATCHes them (null/blank clears a field). Optionally changes the **`role`** in place
        (cr-0119) — a plaintext authorization change, no re-crypto, **READ ↔ READ_WRITE** only (WRITE_ONLY →
        `422`). Owner-gated: only the share's `owner_account` may edit, and only while still a member of its space —
        anything else is a non-enumerable `404` (like revoke). Operator-blind: opaque ciphertext in, opaque ciphertext out; no key
        crosses the boundary.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateShareRequest" }
            example: { sealedNote: c2VhbGVkLW5vdGUtdjI= }
      responses:
        "204":
          description: The share was updated (note / name / role).
        "400":
          description: Malformed request (invalid note encoding).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such share owned by the caller, or it was deleted (non-enumerable).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }
        "422":
          description: >
            Unprocessable. Two codes: `invalid_role_change` (cr-0119) — `role = WRITE_ONLY`, a role change on a share
            whose current role is WRITE_ONLY, or a role the shared node's kind may not be a share root with
            (`ShareRoots`, ADR 0080); the write-only drop-box is a separate action and its role is not editable in
            place. `capability_disabled` — a change INTO a role whose instance capability is not active (READ →
            READ_WRITE while `core.public-shares.contribute` or its parent is off, ADR 0088): the change would publish
            a link of that role, so it checks what `createShare` checks. A request that names the share's current
            role changes no role and is not refused for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_role_change } }
    delete:
      tags: [sharing]
      operationId: deleteShare
      summary: Delete a share link — its ciphertext goes, its id and its guests' uploads stay.
      description: >
        Deletes the link for good ([ADR 0029](../../docs/decisions/0029-public-viewer-share.md) §7). The row becomes
        a **tombstone**: it keeps its id, scope, shared node, role and creation time, and every ciphertext it held — the wrap or
        drop public key, the sealed name, note, label, recovery copy and password fields — and its expiry are
        cleared. The link then `404`s exactly as a revoked one, and the share is gone from both listings and from
        `revokeShare`, `updateShare`, `reactivateShare` and `reissueShare` (each a `404`). Its id is never minted
        again (`createShare` answers `id_taken`). What its guests added stays under the shared node, readable by its
        members and its other links as before: a guest's identity row — the only way to open a WRITE_ONLY guest's
        uploads ([ADR 0031](../../docs/decisions/0031-uploader-public-share.md) point 7) — goes only once the
        applications hold nothing of theirs any more (`GuestIdentityUsage`). Nothing is reclaimed from the store.

        The share's **owner** deletes it at any time — an enabled share is turned off in the same transaction.
        **Another member** of its scope deletes it only once its owner is no longer a member of the scope (the
        orphan a removal leaves); a co-member's link whose owner is still here is theirs, note and password copy
        included. The list's `deletable` carries this same answer. Not idempotent on the wire: an unknown or
        already-deleted id is the same non-enumerable `404` as a share the caller may not delete.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: The share is deleted.
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: >
            No such share, it was already deleted, the caller is not a member of its scope, or it belongs to another
            member who is still in the scope — one non-enumerable answer.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/shares/{shareId}/terms:
    get:
      tags: [sharing]
      operationId: getShareTerms
      summary: The owning tenant's terms for an accountless visitor to accept (unauthenticated).
      description: >
        **No auth.** The accountless half of the two-tier terms gate (uc.sharing.share-accept,
        [ADR 0035](../../docs/decisions/0035-server-terms-of-service.md) §3). Returns the **owning tenant's**
        public terms so an accountless share visitor can accept them **client-side** before viewing/contributing —
        `{ tenantId, termsRevision, terms }`. The terms are **public operational content, never E2EE**; `tenantId`
        is opaque metadata (the caller's localStorage key), only **returned**, never passed in — so this adds **no
        `tenantId` existence oracle**. Keyed on the already non-enumerable `shareId`: it reuses the share's
        `activeShare()` gate, so an unknown / disabled / expired share is the **same non-enumerable 404** as
        `resolveShare`. Independent of the share password (terms are public — **no** `X-Share-Password`). The server
        records **nothing** about the accountless visitor: acceptance is client-only, no acceptance is written here.
        A tenant with no published terms returns `termsRevision: 0` (`terms` null) — the client never gates.
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "200":
          description: The owning tenant's current public terms (or revision 0 / null when the operator has published none).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareTerms" }
              example: { tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c, termsRevision: 3, terms: { de: "## Nutzungsbedingungen\n…", en: "## Terms of use\n…" } }
        "404":
          description: No such share, or it is disabled/expired, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4) — non-enumerable, identical in every case, like `resolveShare`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }

  /api/shares/{shareId}/blobs/{blobId}:
    get:
      tags: [sharing]
      operationId: resolveShareBlob
      summary: Gated presigned GET for a blob under the share (unauthenticated).
      description: >
        **No auth.** Authorizes the read **iff the blob is attached under the shared subtree** — a structural
        check on opaque ids (a blob an application attached to the shared node or a descendant, in whatever
        role). On success returns one short-TTL presigned **GET** URL per chunk; the
        viewer fetches the ciphertext **directly from the object store** and opens it with `openFrame`, so the
        operator never learns which blob a viewer opens. A disabled/expired share, an unknown blob, or a blob
        outside the shared subtree is a non-enumerable `404`. The in-memory dev store cannot presign (`503`).
        For a **password-protected** share the valid `X-Share-Password` token is required too (cr-0118, ADR 0037) —
        a missing token is `404` (non-enumerable, like an out-of-subtree blob), a wrong token is `403`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/BlobId"
        - $ref: "#/components/parameters/SharePassword"
      responses:
        "200":
          description: One presigned GET URL per chunk, in chunk order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareBlobDownload" }
        "403":
          description: The share is password-protected and the presented `X-Share-Password` token is wrong (cr-0118).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_password_incorrect } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), the blob is not under the shared subtree, or a required password token is absent.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

  /api/shares/{shareId}/identities:
    post:
      tags: [sharing]
      operationId: createShareIdentity
      summary: Name yourself as a contributor (unauthenticated) → an anonymous share identity.
      description: >
        **No auth.** For a **READ_WRITE** or **WRITE_ONLY** share (cr-0101, ADR 0030, ADR 0031), before uploading
        the visitor must name themselves. The client mints the identity's id (`identityId`, ADR 0072 Decision 3),
        **seals the display name** bound to scope, share and that id, and POSTs the ciphertext. A READ_WRITE
        guest seals under the shared node's content key (which it unwrapped from the fragment key). A WRITE_ONLY
        guest never holds that key (ADR 0031 point 7): it mints its own identity key `K_up`, seals the name and every later upload
        under it, and posts `K_up` wrapped to the shared node's drop public key (`wrappedIdentityKey`) — required for
        WRITE_ONLY, absent for READ_WRITE, else `400 invalid_request`. The server stores an anonymous **share identity** under that id and mints an
        unguessable **`contributorToken`** (held on device) that authorizes subsequent uploads. A taken
        `identityId`, in any share, is `409 id_taken` (never overwritten, not idempotent). The server stores
        only the sealed name and wrapped key (opaque) + the token hash + the `shareId`; it never sees the name,
        the key or the person. The sealed name is served back only to the scope's members, through the
        application's own member operations — never on a public resolve (ADR 0030 point 8). A disabled/expired/unknown share is a `404`; a READ share is a `403`.
        **Password-protected shares (cr-0164, ADR 0037):** the password gate fronts this write endpoint too —
        with **no** `X-Share-Password` the share is a non-enumerable `404`; a **wrong** token → `403
        share_password_incorrect`. A guest names themselves only after presenting the password.
        **The key, not only the id (ADR 0076):** the request carries `X-Share-Write`, a token the client derives from
        `K_share`; the server compares its SHA-256 with the share's `writeVerifier`, after the password gate and
        before the role check. A missing, malformed or wrong token — and a share that holds no verifier — is the same
        non-enumerable `404`, so a database copy or a leaked id without the fragment names no guest.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
        - $ref: "#/components/parameters/ShareWrite"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareIdentityRequest" }
            example: { identityId: 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c, sealedDisplayName: c2VhbGVkLW5hbWUtdW5kZXItay1tZW0= }
      responses:
        "201":
          description: The anonymous share identity was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareIdentityCreated" }
              example: { identityId: 6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c, contributorToken: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl }
        "400":
          description: Malformed request (missing/invalid fields, or a `wrappedIdentityKey` that does not match the share's role).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share does not allow contributions (a READ share — `share_not_contributable`), or it is password-protected and the presented `X-Share-Password` token is wrong (`share_password_incorrect`, cr-0164).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given (cr-0164), or the `X-Share-Write` proof is missing, malformed or wrong, or the share holds no `writeVerifier` (ADR 0076) — non-enumerable, identical in every case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409":
          description: The `identityId` is already taken (`id_taken`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: id_taken } }

  /api/shares/{shareId}/blob-uploads:
    post:
      tags: [sharing]
      operationId: startShareBlobUploads
      summary: Start contributor blob uploads (unauthenticated) — reserve sessions + presign the first window of PUTs.
      description: >
        **No auth.** The share-scoped mirror of `startBlobUploads` (blob API) for a share whose access mode lets a
        guest add (READ_WRITE or WRITE_ONLY): gated on the share (exists + `enabled` + that mode) + a valid
        `contributorToken`. For each declared blob (`chunkCount`, `byteSize`, the `K_blob` wrap) the server opens
        an upload session **bound to the token's identity** and returns short-TTL presigned **PUT** URLs for the
        blob's **first window** of chunks; the guest PUTs ciphertext **direct-to-store**, asks
        `presignShareBlobUploadWindows` for each next window, and then completes through the application's guest
        completion. What an upload becomes is the application's (`ShareGuestWrites`), picked by the kind of the
        **target node**: the share root, or the optional `nodeId` — a live node inside the share's subtree that its
        application takes guest uploads into (Memories: a MEMORY or CHAPTER; Files: a FILE; a `WRITE_ONLY` link only its
        root or a node inside its guest's own identity folder, ADR 0080 decision 11). The in-memory dev store cannot presign (`503`).
        Per-share rate-limited: a start spends one token of the link's upload budget only once it passed its own
        checks — a request refused for its target node or a role (`400`, `403`, `404`) spends none.
        **Storage limit ([ADR 0073](../../docs/decisions/0073-storage-quota-belongs-to-whoever-pays-for-the-store.md)):**
        the link stores at most its tenant's per-link limit. The request's admissible items are reserved together
        against what the link already holds (its contributions with their derivatives, trash included, plus its
        open sessions), and — independently — against the tenant's quota when the Server Owner has set one: they
        fit both, or every one is refused `quota_exceeded` and no session is opened. The code does not say which
        limit was reached, so a visitor learns nothing about the tenant's usage (ADR 0073 §6).
        **Password-protected shares (cr-0164, ADR 0037):** the password gate fronts this endpoint — no
        `X-Share-Password` → non-enumerable `404`; a wrong token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareBlobUploadsRequest" }
            example:
              contributorToken: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
              items:
                - blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  ownerId: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
                  role: ORIGINAL
                  chunkCount: 2
                  byteSize: 400000
                  wrappedBlobKey: d3JhcHBlZC1rLWJsb2I=
      responses:
        "200":
          description: Per-item upload results (success carries the presigned PUTs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareBlobUploadsResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share does not allow contributions, the contributor token is invalid, no application takes guest uploads into the target node's kind (a `FOLDER`, the share root's included), the root is in the trash while a `nodeId` is named, or a `WRITE_ONLY` link names a `nodeId` other than its root outside its guest's own identity folder (`share_not_contributable`); or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`, cr-0164).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given (cr-0164) — non-enumerable (`share_not_found`); or the `nodeId` names no live node inside the share's subtree (`node_not_found`, the same for a node outside it as for none).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "429":
          description: Too many uploads for this share in the current window (per-share rate limit).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

  /api/shares/{shareId}/blob-upload-windows:
    post:
      tags: [sharing]
      operationId: presignShareBlobUploadWindows
      summary: Presign the next window of contributor PUTs (unauthenticated).
      description: >
        **No auth.** The share-scoped mirror of `presignBlobUploadWindows` (blob API). Gated **again**, per
        request, exactly like `startShareBlobUploads` — the share exists + `enabled` + allows uploads, the password
        token when the share has one, and a valid `contributorToken` — so revoking, expiring or disabling the link
        stops an in-flight upload at its next window. The optional `nodeId` names the target node as the start did,
        and is checked again (absent = the share root). A session resolves only for **the identity that opened it**.
        A window creates no session and no row, so it does not spend the share's upload budget.
        **Password-protected shares (cr-0164, ADR 0037):** the password gate fronts this endpoint — no
        `X-Share-Password` → non-enumerable `404`; a wrong token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareBlobUploadWindowsRequest" }
            example:
              contributorToken: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl
              items:
                - uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  fromChunk: 64
      responses:
        "200":
          description: Per-item window results (success carries the presigned PUTs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareBlobUploadWindowsResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share does not allow contributions, the contributor token is invalid, no application takes guest uploads into the target node's kind (a `FOLDER`, the share root's included), the root is in the trash while a `nodeId` is named, or a `WRITE_ONLY` link names a `nodeId` other than its root outside its guest's own identity folder (`share_not_contributable`); or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`, cr-0164).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given (cr-0164) — non-enumerable (`share_not_found`); or the `nodeId` names no live node inside the share's subtree (`node_not_found`, the same for a node outside it as for none).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "429":
          description: Too many wrong password attempts on this share (the password gate's own limiter).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }

  /api/shares/{shareId}/nodes:
    post:
      tags: [sharing]
      operationId: createShareNode
      summary: Create a node inside a shared subtree (unauthenticated) — a READ_WRITE guest's tree operation.
      description: >
        **No auth.** A guest's create of a node under a node of the shared subtree ([ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md)
        Decisions 6 and 9): a core tree operation behind core's guest gate (`ShareGuestGate`: an active share → the
        password → the access mode → the `X-Contributor-Token` identity → the per-share upload budget, which a create
        spends). A **READ_WRITE** link takes it anywhere in its subtree; a **WRITE_ONLY** link only inside its guest's
        own identity folder (ADR 0080 decision 11: the folder the application's own operation created for this
        identity in the link's root, e.g. Files' `ensureShareDropFolder`), and only the kinds the application owning
        the root's kind declares (`WriteOnlyGuestKinds`: a drop box's guest creates `FILE`s only; any other kind, or a
        root kind no application declares, is `422 illegal_scope`) — a parent anywhere else is `422
        illegal_structure`, and no live identity folder is `403 share_not_contributable`; a READ link is `403
        share_not_contributable`. Inside an identity folder nobody else creates: a READ_WRITE guest of a link above it
        (and a member, `createNode`) is `422 illegal_structure` there.
        The guest mints the node's id (ADR 0072 Decision 3), its content key, wraps it under the parent's content key
        it holds, and seals the name and slug token under that key. **The server checks structure only** and opens
        nothing: the parent is a live node inside the share's subtree, the share's root itself included (else `422
        illegal_structure` — the scope root is never a guest's parent); the share's root is live (else `403
        share_not_contributable`); the kind's placement rule (`NodeKindRules`) admits it under the parent (else `422
        illegal_structure`); the owner of the parent's kind lets a READ_WRITE guest create that kind in it
        (`GuestNodeRules`: core for a `FOLDER`, which admits a `FOLDER` and a kind its own application declares
        guest-creatable — `GuestCreatableKinds`, Files' `FILE` — and never a Memory, a drop box or another application's
        node; a container kind no owner declares allows nothing — either refusal is `422 illegal_scope`); the
        slug is free under the parent (`409 slug_taken`). **Epoch:** the request carries the epoch the guest sealed
        with (ADR 0080 Decision 6) — the name and the wrap are bound to scope, node, that epoch and placement revision
        0, so the server stores it as sent; a guest never writes at the scope root, so the server checks it as a
        member's placement off the root: at or below the scope's current epoch, else `409 stale_epoch`. No `wrappedMeta`:
        a node's payload is its application's content, never a core tree operation's.
        **Password-protected shares (cr-0164, ADR 0037):** no `X-Share-Password` → non-enumerable `404`; a wrong
        token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/SharePassword"
        - $ref: "#/components/parameters/ContributorToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareNodeRequest" }
            example:
              nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              parentId: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
              kind: FOLDER
              encryptedName: ZW5jcnlwdGVkLW5hbWU=
              slugToken: c2x1Zy10b2tlbi1iYXNlNjQ=
              orderIndex: 0
              epoch: 0
              wrappedContentKey: d3JhcHBlZC1rLW1lbQ==
      responses:
        "201":
          description: The node was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareNodeCreated" }
              example: { nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
        "400":
          description: Malformed request (missing/invalid fields, or a `kind` outside the `NodeKind` token's shape).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share is a READ link, a WRITE_ONLY link whose identity has no live identity folder, the contributor token names no identity of it, or its root is in the trash or gone (`share_not_contributable`); or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown/deleted, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given — non-enumerable, identical in every case.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_found } }
        "409":
          description: A sibling under the parent already has that slug (`slug_taken`), the `nodeId` is already taken, in any scope (`id_taken`), or the `epoch` is above the scope's current one — nothing stored (`stale_epoch`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "422":
          description: >
            Illegal structure (`illegal_structure` — the parent is missing, trashed, or outside the share's subtree, or
            the kind's placement rule refuses it there), or the owner of the parent's kind does not let a READ_WRITE
            guest create that kind in it, or — for a WRITE_ONLY link — the owner of the root's kind does not let its
            guest create that kind (`illegal_scope`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
        "429":
          description: Too many wrong password attempts on this share, or its upload budget is spent for the current window (per-share rate limit).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }

  /api/shares/{shareId}/nodes/{nodeId}:
    patch:
      tags: [sharing]
      operationId: updateShareNode
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: placementRevision
            conflictCode: stale_placement
      summary: Move or rename a node inside a shared subtree (unauthenticated) — one placement write.
      description: >
        **No auth.** A guest's placement write ([ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md)
        Decisions 3, 6 and 10): move and rename are ONE request shape, a rename being a move to the node's current
        parent, as in `updateNode`. Behind core's guest gate like `createShareNode`, without spending the upload
        budget; only a **READ_WRITE** link takes it. The request carries the destination `parentId`, the node's
        content key re-wrapped under the destination's key (`wrappedContentKey`), the name and the slug token
        re-sealed under it, and the `placementRevision` it was built on; the wrap and the name are bound to scope,
        node, the node's stored epoch and `placementRevision + 1`. **No `epoch`:** a guest's node never moves into or
        out of the scope root, so it keeps its stored epoch. **Structure only:** the node lies strictly inside the
        share's subtree — the root is never moved or renamed by a guest, nor is a guest's identity folder in a drop box
        or anything inside one: only a member moves out of a drop box (ADR 0080 Decision 11; `422 illegal_structure`,
        known by the node's identity column, whatever the kinds), a node outside is `404 node_not_found`; the destination is a live node inside the subtree, the root included, not the node
        and not inside its own subtree (else `422 illegal_structure`); the kind's placement rule admits it there
        (else `422 illegal_structure`); the owners of the containers on both sides allow it (`GuestNodeRules`: a
        move needs the source parent's owner to let a READ_WRITE guest move that kind out and the destination's to
        let it move in, a rename the parent's to let it rename — `422 illegal_scope` otherwise); the slug is free
        there (`409 slug_taken`). The server compare-and-sets the placement revision and writes everything at once,
        or nothing (`409 stale_placement`). No guest delete: nodes store no authorship.
        **Password-protected shares (cr-0164, ADR 0037):** no `X-Share-Password` → non-enumerable `404`; a wrong
        token → `403 share_password_incorrect`.
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SharePassword"
        - $ref: "#/components/parameters/ContributorToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateShareNodeRequest" }
            example:
              parentId: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
              encryptedName: cmVuYW1lZA==
              slugToken: bmV3LXNsdWc=
              wrappedContentKey: cmUtd3JhcHBlZC1rLW1lbQ==
              placementRevision: 2
      responses:
        "204":
          description: The node was moved or renamed.
        "400":
          description: Malformed request (missing/invalid fields — every placement field is required).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "403":
          description: The share is not a READ_WRITE link, the contributor token names no identity of it, or its root is in the trash or gone (`share_not_contributable`); or it is password-protected and the `X-Share-Password` token is wrong (`share_password_incorrect`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: share_not_contributable } }
        "404":
          description: No such share (disabled/expired/unknown/deleted, or its space is being deleted or its tenant suspended (uc.spaces.scope-access A4)), or it is password-protected and no `X-Share-Password` token was given (`share_not_found`); or no live node inside the share's subtree has that id (`node_not_found`) — non-enumerable.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            A sibling at the destination already has that slug (`slug_taken`), or the node was moved or renamed since
            the stated `placementRevision` (`stale_placement` — nothing was written; the client re-reads the share and
            rebuilds the placement, ADR 0080 Decision 3).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_placement } }
        "422":
          description: >
            Illegal structure (`illegal_structure` — the node is the share's root, a guest's identity folder or inside
            one (only a member moves out of a drop box), the destination is missing, trashed,
            outside the share's subtree, the node itself or inside its subtree, or the kind's placement rule refuses
            it there), or an owner of the containers on either side does not let a READ_WRITE guest move or rename
            that kind (`illegal_scope`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
        "429":
          description: Too many wrong password attempts on this share (the password gate's own limiter).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. The caller must be a member of the shared node's scope (enforced by code).

  parameters:
    ShareId:
      name: shareId
      in: path
      required: true
      description: The opaque 256-bit share id (base64url, unguessable) — half the capability; the other half is the fragment key.
      schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i }
    BlobId:
      name: blobId
      in: path
      required: true
      description: Opaque id of a blob the viewer wants to download (authorized only if it is attached under the shared subtree).
      schema: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }
    SharePassword:
      name: X-Share-Password
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The password token `base64(Argon2id(password, pwSalt))` for a password-protected share (cr-0118, ADR 0037).
        Omit for a share with no password; a locked resolve then returns only `passwordRequired` + `pwSalt` so the
        client can prompt and retry with this header.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    ShareWrite:
      name: X-Share-Write
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The link's write proof `base64(HKDF(K_share, "veyq/v1/share-write:" + shareId))` ([ADR 0076](../../docs/decisions/0076-a-guest-write-proves-it-holds-the-links-key.md))
        — derived from the fragment key, so only someone holding the whole link can present it. The server compares
        its SHA-256 with the share's `writeVerifier`. Declared optional, as `X-Share-Password` is, so a request
        without it gets the gate's non-enumerable `404` — one answer for every way of not holding the key. A value
        outside the base64 alphabet is the boundary's `400` instead, answered before any lookup and so the same for
        every id.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    ContributorToken:
      name: X-Contributor-Token
      x-veyq-visibility: token
      in: header
      required: true
      description: The opaque `contributorToken` from `createShareIdentity` — names the guest identity the write is made as.
      schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", example: Y29udHJpYnV0b3ItdG9rZW4tb3BhcXVl }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of a node inside the shared subtree.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }

  schemas:
    ShareRole:
      x-veyq-visibility: enum
      type: string
      description: >
        The access mode a share grants on its shared subtree — one of three:
        **READ** reads the shared subtree ([ADR 0029](../../docs/decisions/0029-public-viewer-share.md));
        **READ_WRITE** reads it and adds through the application's guest writes
        ([ADR 0030](../../docs/decisions/0030-contributor-public-share.md));
        **WRITE_ONLY** only adds and cannot read what others added
        ([ADR 0031](../../docs/decisions/0031-uploader-public-share.md)).
        What a write adds is the application's.
      enum: [READ, READ_WRITE, WRITE_ONLY]
      example: READ

    NodeKind:
      $ref: '_common.openapi.yaml#/components/schemas/NodeKind'

    BlobRole:
      $ref: '_common.openapi.yaml#/components/schemas/BlobRole'

    CreateShareRequest:
      type: object
      required: [shareId, nodeId, role, sealedName, sealedShareKey, sealedShareKeyEpoch, writeVerifier]
      description: >
        The share's keys follow its role (ADR 0031 point 7). A READ or READ_WRITE share carries `wrap` and no
        drop key. A WRITE_ONLY share carries **no** `wrap` — its guest never holds the shared node's content key —
        and instead the drop public key of the shared root node sealed under `K_share` (`sealedDropPublicKey`); the
        node's first WRITE_ONLY share also carries the drop private key sealed under the node's content key
        (`sealedDropPrivateKey`), which the server stores on the node. Any other combination is `400 invalid_request`.
      properties:
        shareId:
          x-veyq-visibility: id
          type: string
          description: >
            The client-minted share id (ADR 0072 Decision 3): 32 fresh random bytes from the client's CSPRNG,
            base64url without padding — the same 256-bit form the server used to mint, because it is half of the
            share's capability and does not shrink to a UUID. Its seals (the `share-key-recovery` wrap, and every
            contributor's `share-identity-name`) are bound to it. Taken ⇒ `409 id_taken`.
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 43, max = 43) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9_-]{43}")'
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The node to share — of a kind that may be a share root with `role` (`ShareRoots`), in a scope the caller is a member of (personal, group, or tenant).
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        role:
          $ref: "#/components/schemas/ShareRole"
        wrap:
          type: [string, "null"]
          description: >
            The shared node's content key wrapped under the fresh per-share key — `symWrap(K_share, content key)`
            (opaque base64). Required for READ and READ_WRITE; absent for WRITE_ONLY.
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbS11bmRlci1rLXNoYXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedDropPublicKey:
          type: [string, "null"]
          description: >
            WRITE_ONLY only: the drop public key of the shared root node of this WRITE_ONLY link, sealed under
            `K_share` (AAD `drop-public-key`, opaque base64) — the key the guest wraps its own identity key to
            (ADR 0031 point 7). Required for WRITE_ONLY, absent otherwise.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWRyb3AtcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedDropPrivateKey:
          type: [string, "null"]
          description: >
            WRITE_ONLY only, and only while the shared root node has no drop key yet: the drop private key of the
            shared root node of a WRITE_ONLY link, sealed under the node's content key (AAD `drop-private-key`, bound
            to scope + node; opaque base64), stored on the node by core in the same transaction as the share. Present
            when the node already has one ⇒ `409 drop_key_exists` (the client re-reads the node and seals to that
            key); absent when it has none ⇒ `409 drop_key_missing`.
          contentEncoding: base64
          maxLength: 256
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedName:
          type: string
          description: The shared node's name re-sealed under `K_share` (seal purpose `share-memory-name`, a stored seal id that keeps its name; opaque base64) — so a viewer with only the fragment key can show the title without `K_SC`.
          contentEncoding: base64
          maxLength: 4096
          example: c2VhbGVkLW5hbWUtdW5kZXItay1zaGFyZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        expiresAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: Optional expiry; a share past this instant resolves `404` (same shape as an unknown id). Null = no expiry.
          example: null
        sealedNote:
          type: [string, "null"]
          description: >
            OPTIONAL curator note sealed under `K_share` (AAD `share-note`, opaque base64) — the plaintext is a
            **per-locale JSON map** `{ "de": "…", "en": "…" }` (cr-0116); the share page renders the viewer's
            locale (exact → base → en → first). Absent/blank = no note (cr-0115/cr-0116, ADR 0036).
          contentEncoding: base64
          maxLength: 16384
          example: c2VhbGVkLW5vdGUtbG9jYWxlLW1hcA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16384) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedShareName:
          type: [string, "null"]
          description: >
            OPTIONAL private label for this share, sealed under `K_share` (AAD `share-name`, opaque base64) — a
            **management-only** name (e.g. "For Grandma") shown in the curator's share list, distinct from the
            shared node's name; **never served to the viewer** (cr-0116).
          contentEncoding: base64
          maxLength: 512
          example: c2VhbGVkLXNoYXJlLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedShareKey:
          type: string
          description: >
            REQUIRED recoverable copy of the per-share key (ADR 0080 decision 12) — `K_share` sealed under the scope key `K_SC` at
            `sealedShareKeyEpoch` (AAD `share-key-recovery`, bound to scope + node + share + epoch; opaque base64).
            Lets every scope member recover `K_share` later to reveal, edit and re-copy the share. `K_SC` is the key
            no share link carries, so a READ or READ_WRITE link — which holds the shared node's content key — opens nothing of another
            share; the operator never sees `K_share` (ADR 0036 point 4). Sent together with `sealedShareKeyEpoch`.
          contentEncoding: base64
          maxLength: 256
          example: cmVjb3ZlcmFibGUtc2hhcmUta2V5LXVuZGVyLWtzYw==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedShareKeyEpoch:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (backend/CLAUDE.md)
          type: [integer, "null"]
          description: >
            The scope content-key epoch `sealedShareKey` is sealed under (ADR 0024). Required (else `400`), and must
            be the scope's **current** epoch (else `409 stale_epoch`, nothing stored).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'
        passwordRequired:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: OPTIONAL — protect the share with a password (cr-0118, ADR 0037). When true, `pwSalt` + `pwVerifier` (+ optionally `sealedPassword`) must accompany it.
          example: false
        pwSalt:
          type: [string, "null"]
          description: The random salt for `pwToken = Argon2id(password, pwSalt)` (opaque base64). Present iff `passwordRequired` (cr-0118).
          contentEncoding: base64
          maxLength: 64
          example: cHctc2FsdC0xNmI=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        pwVerifier:
          type: [string, "null"]
          description: >
            `SHA-256(pwToken)` where `pwToken = Argon2id(password, pwSalt)` (opaque base64) — the server checks a
            presented token against this; it never sees the raw password (cr-0118, ADR 0037).
          contentEncoding: base64
          maxLength: 64
          example: cHctdmVyaWZpZXItc2hhMjU2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedPassword:
          type: [string, "null"]
          description: >
            OPTIONAL — the plaintext password sealed under `K_share` (AAD `share-password`, opaque base64) so the
            curator can **reveal** it later; **management-only**, never served to a viewer (cr-0118, ADR 0037).
          contentEncoding: base64
          maxLength: 512
          example: c2VhbGVkLXBhc3N3b3Jk
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        writeVerifier:
          type: string
          description: >
            `SHA-256(writeToken)` where `writeToken = HKDF(K_share, "veyq/v1/share-write:" + shareId)` (opaque base64) —
            the proof a guest presents as `X-Share-Write` when naming themself (`createShareIdentity`), so the share id
            alone names no guest ([ADR 0076](../../docs/decisions/0076-a-guest-write-proves-it-holds-the-links-key.md)).
            Required for **every** role: a READ link can be flipped to READ_WRITE later, and its key never changes.
          contentEncoding: base64
          maxLength: 64
          example: FsNwNHCyCakLiKYUidaFcVAETZT9pNhFigWt85nrvSQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    UpdateShareRequest:
      type: object
      description: >
        Edit a share in place (cr-0115/cr-0116/cr-0119/cr-0118, ADR 0036/0037). `sealedNote` + `sealedShareName`
        are a **full replace** of the two `K_share`-sealed fields (each is the new value, `null`/blank clears it) —
        the curator holds both current values (decrypted in the manage list) and sends them together. `role` is an
        **optional grant change** (cr-0119): when present it changes the share's role **in place** (a plaintext
        authz change, no re-crypto — the link/wrap stay valid), restricted to **READ ↔ READ_WRITE** (setting
        `WRITE_ONLY`, editing a WRITE_ONLY share's role, or a role the shared node's kind may not be a share root with,
        is `422 invalid_role_change`); when omitted the grant is
        unchanged. `passwordRequired` is an **optional tri-state** (cr-0118): `true` sets/changes the password (send
        `pwSalt` + `pwVerifier` + `sealedPassword` with it), `false` removes it (the pw fields are cleared),
        **omitted** leaves the password untouched — all in place, the link/`K_share` untouched.
        `expiresAt` is a **full replace** like `sealedNote`/`sealedShareName` (cr-share-link-expiry-edit): the new
        instant, or `null`/absent to clear the expiry — the manage UI holds the current value and re-sends it, so an
        unrelated edit must include it to preserve it.
      properties:
        sealedNote:
          type: [string, "null"]
          description: The new curator note (per-locale JSON map) sealed under `K_share` (AAD `share-note`). Null/empty clears it.
          contentEncoding: base64
          maxLength: 16384
          example: c2VhbGVkLW5vdGUtdjI=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 16384) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedShareName:
          type: [string, "null"]
          description: The new private share name sealed under `K_share` (AAD `share-name`). Null/blank clears it (cr-0116).
          contentEncoding: base64
          maxLength: 512
          example: c2VhbGVkLXNoYXJlLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        role:
          $ref: "#/components/schemas/ShareRole"
        expiresAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: New expiry instant (full replace, cr-share-link-expiry-edit); `null`/absent clears it. Send the current value to preserve it.
          example: null
        passwordRequired:
          x-veyq-visibility: flag
          type: [boolean, "null"]
          description: Tri-state (cr-0118, ADR 0037) — true sets/changes the password (with pwSalt/pwVerifier/sealedPassword), false removes it, null/omitted leaves it untouched.
          example: null
        pwSalt:
          type: [string, "null"]
          description: The new salt for `Argon2id(password, pwSalt)` (opaque base64) — sent with `passwordRequired` = true.
          contentEncoding: base64
          maxLength: 64
          example: cHctc2FsdC0xNmI=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        pwVerifier:
          type: [string, "null"]
          description: The new `SHA-256(Argon2id(password, pwSalt))` (opaque base64) — sent with `passwordRequired` = true.
          contentEncoding: base64
          maxLength: 64
          example: cHctdmVyaWZpZXItc2hhMjU2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedPassword:
