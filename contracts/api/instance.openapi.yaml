    InstanceCapability:
      type: object
      description: >
        One entry of the capability register, with its words and its switch (ADR 0088). Instance configuration
        and server self-description: the texts are the catalog's, and nothing here is member data.
      # `off` is quoted wherever it is a key or a list item, in this schema, InstanceCapabilityUpdate and the
      # examples: a YAML 1.1 parser reads a bare `off` as the boolean false. PyYAML, which every contracts guard
      # reads the specs with, did exactly that, and saw a property named "false".
      required: [id, title, purpose, whenOff, "off", effective, tenantSwitchable, requirements]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: >
            The entry's lowercase-dotted id, a path in the register tree (e.g. "core.remember-device.passwordless").
            Its parent is the id without its last segment; an id of two segments hangs from the root alone.
          maxLength: 64
          example: core.remember-device
        title:
          $ref: "#/components/schemas/InstanceCapabilityText"
        purpose:
          $ref: "#/components/schemas/InstanceCapabilityText"
        whenOff:
          $ref: "#/components/schemas/InstanceCapabilityText"
        "off":
          x-veyq-visibility: flag
          type: boolean
          description: The entry's own switch, as the Server Owner set it. A parent's switch does not change it.
          example: false
        effective:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the entry is active: it and every ancestor entry are on (the AND along the path). This is what
            the gates and the manifest follow.
          example: true
        tenantSwitchable:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether a tenant owner may switch the entry off for their own tenant as well (the catalog's `levels`,
            ADR 0088 decision 12). Such a tenant only narrows: an entry on here may still be off in a tenant, never
            the other way round. Entries offered before sign-in are the Server Owner's alone.
          example: true
        serviceConfigured:
          x-veyq-visibility: flag
          type: [boolean, "null"]
          description: >
            For an external-service entry (ADR 0088 decision 7): whether its address is configured
            (`listInstanceExternalServices`); while it is not, the entry is not `effective` whatever its switch says.
            Null for every other entry.
          example: null
        requirements:
          type: array
          description: >
            The entry's requirements (the catalog's, in its order; empty for most), each with its words and the
            instance's value (ADR 0088 decision 8).
          maxItems: 16
          items: { $ref: "#/components/schemas/InstanceCapabilityRequirement" }

    InstanceCapabilityText:
      type: object
      description: >
