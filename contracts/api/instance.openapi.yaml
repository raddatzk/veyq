      description: >
        The instance's one SMTP configuration (ADR 0097 decision 3): the same transport fields as a tenant's, the
        password write-only (`passwordSet`) and sealed under the config-secret key exactly as a tenant's is
        ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)). It sends **only** instance notices
        and **only** to the Server Owner's account address, and it is never a default or a fallback for a tenant's
        mail ([ADR 0048](../../docs/decisions/0048-provider-neutral-smtp-mail-transport.md) §4). Notices are mailed
        only once the address is confirmed by the code the test mail carried (decision 5). Server-Owner only.
