      tags: [instance]
      operationId: confirmInstanceMail
      x-veyq-channel: admin
      summary: Confirm the instance mail settings with the code the test mail carried.
      description: >
        Takes the one-time code of the last test mail (ADR 0097 decision 5). A code and not a link, because the admin
        console is reachable on localhost only ([ADR 0065](../../docs/decisions/0065-admin-ui-cli-separate-service.md))
        and the instance has no address of its own, so a link opened on another device would reach nothing. The code
        is stored hashed, expires, and is spent by a few wrong entries; the endpoint is rate-limited per caller. Once
        confirmed, each notice is mailed once. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceMailConfirmation" }
            example: { code: "48213075" }
      responses:
        "200":
          description: The address is confirmed; the settings as they now stand are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceMailSettings" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            `mail_code_invalid` = no code is outstanding, it expired, it was entered wrong too often, the address
            changed since it was sent, or this is not it. Save the settings again for a new one. Nothing is confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_code_invalid }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

