                  accountId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                moderators:
                  - accountId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                    address: owner@example.com
                    state: ACCEPTED
                    appointedAt: 2026-10-17T09:00:00Z
                    acceptedAt: 2026-10-17T09:00:00Z
                    identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                    holdsCurrentEpoch: true
                    addressConfirmed: true
                  - accountId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
                    address: deputy@example.com
                    state: PENDING
                    appointedAt: 2026-10-17T10:00:00Z
                    acceptedAt: null
                    identityPublicKey: null
                    holdsCurrentEpoch: false
                    addressConfirmed: false
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
  /api/instance/moderation/moderators:
    post:
      tags: [instance-moderation]
      operationId: appointModerator
      x-veyq-channel: admin
      summary: Appoint an existing account as a moderator, by its address.
      description: >
        Records a pending appointment for the account with this address (ADR 0099 § 1); it becomes a moderator when the
        appointee accepts it in web/'s moderation surface. `404 account_not_found` when no account has the address —
        nothing is recorded. Appointing someone already on the roster changes nothing. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointModeratorRequest" }
            example: { address: deputy@example.com }
      responses:
        "200":
          description: Appointed (or already on the roster); the roster and the key's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceModeration" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No account has this address (`account_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: account_not_found }
        "409":
          description: Moderation is not on yet (`moderation_off`); turn it on first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_off }

  /api/instance/moderation/moderators/{accountId}:
    delete:
      tags: [instance-moderation]
      operationId: removeModerator
      x-veyq-channel: admin
      summary: Remove a moderator — their role and their grants of every epoch go at once.
      description: >
        Ends the appointment (pending or accepted) and deletes the moderator's grants for every epoch in the same
        transaction (ADR 0099 § 4, layer 1); admin-web then mints the next epoch for the remaining moderators
        (`mintModerationEpoch`, reason `REMOVAL`). `409 moderation_last_holder` while it would leave no accepted
        moderator holding the current epoch. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModeratorAccountId"
      responses:
        "200":
          description: Removed; the roster and the key's state (with `rotationDueSince` set until the next mint).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceModeration" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: The account is not on the roster (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }
        "409":
          description: The account is the last moderator holding the key (`moderation_last_holder`). Nothing changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_last_holder }

  /api/instance/moderation/epochs:
    post:
      tags: [instance-moderation]
      operationId: mintModerationEpoch
      x-veyq-channel: admin
      summary: Rotate the instance moderation key — a new epoch, sealed to every accepted moderator.
      description: >
        admin-web (or `veyq-admin moderation rotate`) draws `M_{n+1}`, derives its public bundle, seals it to the
        identity public key of every accepted moderator as `getInstanceModeration` served it, and uploads the bundle
        with one grant per moderator and a reason category (ADR 0099 §§ 3–4). The server refuses
        (`409 moderation_grants_incomplete`) unless the grants name exactly the accepted moderators, and
        (`409 identity_changed`) where a grant is sealed to an identity that is no longer its moderator's. Reports
        seal to the new epoch from then on; a rotation due is cleared. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MintModerationEpochRequest" }
            example:
              kemPublicKey: a2VtLXB1YmxpYy1rZXk=
              signPublicKey: c2lnbi1wdWJsaWMta2V5
              epoch: 3
              reason: REMOVAL
              grants:
                - accountId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                  sealedGrant: c2VhbGVkLWdyYW50
      responses:
        "200":
          description: Minted; the roster and the key's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceModeration" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            `moderation_off` = no epoch exists yet (turn moderation on); `moderation_epoch_stale` = `epoch` is not the
            current epoch plus one (another mint landed in between; read again); `moderation_grants_incomplete` = the
            grants do not name exactly the accepted moderators; `identity_changed` = a grant is sealed to an identity
            that is not its moderator's current one. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_grants_incomplete }

  /api/instance/moderation/steps:
    get:
      tags: [instance-moderation]
      operationId: getModerationSteps
      x-veyq-channel: admin
      summary: The Server Owner's moderation steps — open proposals and the sign-in blocks in force.
      description: >
        What the moderators proposed that only the Server Owner takes (ADR 0099 § 6, decided with the owner 2;
        uc.moderation.take-a-measure step 5): each open proposal with its case, the case's category, the step and its
        target — a member's account with its address, or a tenant with its domain — and every member sign-in block in
        force. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The open proposals and the sign-in blocks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSteps" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/moderation/proposals/{proposalId}/decline:
    post:
      tags: [instance-moderation]
      operationId: declineModerationProposal
      x-veyq-channel: admin
      summary: Decline a moderator's proposal.
      description: >
        Settles an open proposal as declined; the case shows it and the log records it. Taking a proposal needs no
        operation of its own: a sign-in block of its account (`blockAccountSignIn`) or the suspension of its tenant
        (`suspendTenant`) settles every open proposal of that step and target as taken. A proposal already settled
        changes nothing. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Declined; the steps as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSteps" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No proposal has this id (`proposal_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: proposal_not_found }

  /api/instance/moderation/sign-in-blocks:
    post:
      tags: [instance-moderation]
      operationId: blockAccountSignIn
      x-veyq-channel: admin
      summary: Block a member's sign-in on the instance — every session of the account ends at once.
      description: >
        ADR 0093 § 6, ADR 0099 § 6 (the Server Owner's step; owner decision Q10): a row naming the account, the case it
        answers (optional — an authority's order names none), who took it and when. Every session family of the account
        ends in the same transaction, and every sign-in answers the generic authentication failure until the block is
        lifted (uc.account.login E5). Settles the open `MEMBER_SIGN_IN` proposals for the account as taken. The account
        is named by its address, as an appointment names it. `409 sign_in_block_exists` while one is in force;
        `409 cannot_block_server_owner` for the Server Owner's own account. Server-Owner only.

        **Over content it carries a statement of reasons** (ADR 0093 § 7, DSA Art. 17(1)(d); uc.moderation.object-to-a-measure
        A7): a block that answers a case, or takes a moderator's open proposal, always; a block with neither when
        `overContent` says so. Then `statement` is required (`400 statement_required`) and is written with the block, in
        its transaction — the row, its recipient (the account), the log event — and mailed to the account's address with
        the facts once the block committed. A block with no case, no proposal and `overContent` false carries none. A
        block from a proposal with no case named is recorded on the proposal's case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockAccountSignInRequest" }
            example: { address: member@example.com, caseId: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
      responses:
        "200":
          description: Blocked; the steps as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSteps" }
        "400":
          description: >
            `invalid_request` = the request was malformed, or `facts` and `factsForLog` do not come together;
            `statement_required` = the block is over content and carries no statement; `statement_facts_required` /
            `statement_provision_required` = the operating mode asks for the facts / the provision and none was given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: statement_required }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: "`account_not_found` = no account has this address; `case_not_found` = no case has the id given."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: account_not_found }
        "409":
          description: >
            `sign_in_block_exists` = the account is blocked already; `cannot_block_server_owner` = it is the Server
            Owner's own; `moderation_epoch_changed` = the facts are not sealed to the current epoch; `moderation_off` =
            no epoch exists to seal them to; `id_taken` = the statement id is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: sign_in_block_exists }

  /api/instance/moderation/sign-in-blocks/{blockId}:
    delete:
      tags: [instance-moderation]
      operationId: unblockAccountSignIn
      x-veyq-channel: admin
      summary: Lift a member's sign-in block — the account may sign in again.
      description: >
        Records when the block was lifted and by whom (it deleted nothing); the account signs in again with its own keys.
        A block already lifted changes nothing. Server-Owner only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SignInBlockId"
      responses:
        "200":
          description: Lifted; the steps as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSteps" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No sign-in block has this id (`sign_in_block_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: sign_in_block_not_found }

  /api/instance/moderation/orders:
    post:
      tags: [instance-moderation]
      operationId: enterInstanceModerationOrder
      x-veyq-channel: admin
      summary: Enter an authority's order as the Server Owner — without a key; a removal order blocks at once.
      description: >
        ADR 0093 § 12, ADR 0099 § 6 (uc.moderation.authority-order): the Server Owner's door, in admin-web and
        `veyq-admin order remove|preserve|inform`, so an operator away from the moderation surface keeps the hour. The
        twin of the moderator's `enterModerationOrder` (moderation.openapi.yaml), whose description is the behaviour —
        both run one handler. No key proof: an order acts on ids and needs no key, and the reference is sealed by the
        client to the moderation key's public half. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorityOrderRequest" }
            example: { id: 3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b, kind: REMOVAL, shareId: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i, receivedAt: 2026-10-18T07:12:00Z, reference: { epoch: 2, sealedReference: c2VhbGVkLXJlZmVyZW5jZQ== } }
      responses:
        "201":
          description: Recorded (and, for a removal order that found its share, blocked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityOrder" }
        "400":
          description: "`invalid_request`, or `deferral_out_of_bounds` = the deferral ends in the past or more than six weeks from now."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: deferral_out_of_bounds }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: "`order_exists` = an order with this id is recorded; `moderation_epoch_changed` = the reference is not sealed to the current epoch; `moderation_off` = moderation is off, so nothing can be sealed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: order_exists }

  /api/instance/operator:
    get:
      tags: [instance-operator]
      operationId: getInstanceOperator
      x-veyq-channel: admin
      summary: Read the instance contact, the provider identification and the supervisory authority, with the notification address.
      description: >
        The values a host publishes about itself (ADR 0093 § 11, ADR 0035 decisions 6–7,
        uc.admin.operator-details): the instance contact with its languages, the address statements and disclosures
        name, the provider identification and the competent supervisory authority — all public through
        `GET /api/operator` — and the notification address, which is not public and leaves the server only here, with
        where its confirmation stands (ADR 0097 decision 5). Also the operating mode in effect, which decides whether
        admin-web warns about an empty value (ADR 0093 § 14). Every value may be empty. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The values as they stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperator" }
              example:
                operatingMode: ORGANISATION
                contactEmail: contact@example.org
                contactLanguages: [de, en]
                statementEmail: moderation@example.org
                notificationEmail: alerts@example.org
                notificationConfirmation: CONFIRMED
                notificationConfirmedAt: 2026-10-17T12:00:00Z
                instanceMailReady: true
                providerName: Example e. V.
                providerAddress: "Musterstraße 1\n12345 Musterstadt"
                providerEmail: info@example.org
                providerRepresentative: Erika Mustermann (Vorstand)
                supervisoryAuthority: "Landesbeauftragte für Datenschutz, Musterstadt"
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    put:
      tags: [instance-operator]
      operationId: setInstanceOperator
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the form shows every value it sends, and the write is a full replace.
      x-veyq-channel: admin
      summary: Set the instance contact, the provider identification and the supervisory authority.
      description: >
        A full replace: a value omitted or null is cleared. Nothing is required, in either operating mode — required
        means warned in admin-web, never refused (ADR 0093 § 14). A notification address that is set and not confirmed
        gets a one-time code through instance mail, but only while the Server Owner's own instance mail is confirmed
        (`instanceMailReady`); typed into `POST /api/instance/operator/notification/confirmation`, it confirms the
        address. A changed address is unconfirmed by that change alone; setting the confirmed address again keeps it
        confirmed. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceOperatorUpdate" }
            example:
              contactEmail: contact@example.org
              contactLanguages: [de, en]
              statementEmail: moderation@example.org
              notificationEmail: alerts@example.org
              providerName: Example e. V.
              providerAddress: "Musterstraße 1\n12345 Musterstadt"
              providerEmail: info@example.org
              providerRepresentative: Erika Mustermann (Vorstand)
              supervisoryAuthority: "Landesbeauftragte für Datenschutz, Musterstadt"
      responses:
        "200":
          description: Stored; the values as they now stand, with the confirmation's state after any code sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperator" }
        "400":
          description: A value is malformed or out of its bounds. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    delete:
      tags: [instance-operator]
      operationId: clearInstanceOperator
      x-veyq-channel: admin
      summary: Clear every value, the notification address and its confirmation included.
      description: >
        Clears the contact, the identification, the supervisory authority and the notification address with any code
        and confirmation. The operating mode is not a value here and stays. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleared; the (empty) values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperator" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/operator/notification/confirmation:
    post:
      tags: [instance-operator]
      operationId: confirmOperatorNotification
      x-veyq-channel: admin
      summary: Confirm the notification address with the code mailed to it.
      description: >
        Takes the one-time code the last save mailed to the notification address (ADR 0097 decision 5, owner
        2026-10-17). It confirms only while it is live — unexpired, not spent by wrong entries — and only for the
        address it was sent to, which must still be the notification address; a wrong entry spends an attempt. The
        endpoint is rate-limited per caller. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceOperatorConfirmation" }
            example: { code: "48213075" }
      responses:
        "200":
          description: The notification address is confirmed; the values as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperator" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            `operator_code_invalid` = no code is outstanding, it expired, it was entered wrong too often, the
            notification address changed since it was sent, or this is not it. Save again for a new one. Nothing is
            confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: operator_code_invalid }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/instance/operator/mode:
    get:
      tags: [instance-operator]
      operationId: getInstanceOperatingMode
      x-veyq-channel: admin
      summary: Read the operating mode and the switches its preset names.
      description: >
        The operating mode in effect (ADR 0093 § 14) — `ORGANISATION` where none was ever chosen (`chosen: false`) —
        and every capability entry the catalog gives a value per mode, with its own instance switch now, so admin-web
        and the CLI can list which switches choosing the other mode would change before it is set (ADR 0088 decision
        14). Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The mode and the preset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperatingMode" }
              example:
                mode: ORGANISATION
                chosen: true
                preset: []
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    put:
      tags: [instance-operator]
      operationId: setInstanceOperatingMode
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; a mode is one value, and setting it again sets its preset again by design.
      x-veyq-channel: admin
      summary: Set the operating mode, and with it the preset's instance switches.
      description: >
        Stores the mode and, in the same transaction, sets the instance-level switch of every capability entry whose
        catalog `modes` gives a value for it — and nothing more: a tenant's switches and every entry without a preset
        are untouched, and each preset switch stays an ordinary switch afterwards (ADR 0088 decision 14). Setting the
        mode it already has sets its preset again. The notice and, for `PRIVATE`, the operator's tick are admin-web's
        and the CLI's: the server does not record them (ADR 0093 § 14). Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceOperatingModeUpdate" }
            example: { mode: PRIVATE }
      responses:
        "200":
          description: Set; the mode and the preset as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceOperatingMode" }
        "400":
          description: The request was malformed (no mode, or one that is neither PRIVATE nor ORGANISATION).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/guest-write-record:
    get:
      tags: [instance-guest-write-record]
      operationId: getInstanceGuestWriteRecord
      x-veyq-channel: admin
      summary: Read how many days the guest-write record keeps a row.
      description: >
        N, the days a row of the guest-write record is kept (ADR 0093 § 10): 7 until the Server Owner sets another
        value (`chosen: false`). Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceGuestWriteRecord" }
              example: { retentionDays: 7, chosen: false }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    put:
      tags: [instance-guest-write-record]
      operationId: setInstanceGuestWriteRecord
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the retention is one value, and the purge reads it as it stands.
      x-veyq-channel: admin
      summary: Set how many days the guest-write record keeps a row.
      description: >
        Stores N, 1 to 30 (ADR 0092 § 2). A new row is kept N days from its write; the purge deletes a row once it is
        older than N as it now stands, too, so a shortening reaches every row at the next purge and a lengthening only
        new ones — no guest is kept longer than the page told them (ADR 0093 § 10). A value above 7 needs a reason the
        Server Owner writes into their record of processing; that is admin-web's and the CLI's to say, the server does
        not record it. Server-Owner only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceGuestWriteRecordUpdate" }
            example: { retentionDays: 14 }
      responses:
        "200":
          description: Set; the retention as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceGuestWriteRecord" }
        "400":
          description: The request was malformed (no value, or one outside 1 to 30).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/guest-write-record/identities/{identityId}:
    delete:
      tags: [instance-guest-write-record]
      operationId: eraseGuestWriteRecordsOfIdentity
      x-veyq-channel: admin
      summary: Delete one share identity's guest-write-record rows — a guest's objection (GDPR Art. 21).
      description: >
        Deletes every live row of the guest-write record that names this share identity (ADR 0093 § 10): what the
        Server Owner does when the guest behind it objects to the record (GDPR Art. 21(1)) and no compelling reason to
        keep it stands. Rows a hold copied are **not** deleted — a hold is evidence a report or an authority's order
        asked for, and it ends on its own (ADR 0093 § 4) — and the answer counts them, so the Server Owner can tell the
        guest what stays and until when. Nothing stops a later write of the same identity from being recorded again,
        as the guest page says. Idempotent: an identity with no rows, or none any more, answers zeros. Server-Owner
        only.
      security:
        - bearerAuth: []
      parameters:
        - name: identityId
          in: path
          required: true
          description: The share identity's id, as a moderation case or the guest names it.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The identity's live rows are gone; how many went, and how many a hold keeps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestWriteRecordErasure" }
              example: { erased: 3, keptInHolds: 1 }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: The identity id is not a UUID, so no route matches it.

  /api/instance/store/reconcile:
    get:
      tags: [instance-store-reconcile]
      operationId: getStoreReconcile
      x-veyq-channel: admin
      summary: Read what the bucket reconcile found — the objects no row claims, the candidates for deletion, and why it would or would not delete them.
      description: >
        A background sweep lists the object store in use page by page and compares every object with the rows that name
        a storage key ([ADR 0062](../../docs/decisions/0062-store-object-reclaim-is-a-durable-work-list.md) § Consequences,
        uc.admin.configure-object-store A7). This returns its last completed pass, the pass in progress, the failure that
        stopped one, the reclaim list's own counts, and the **candidates**: storage keys that no row claimed in every pass
        since they were first seen. A candidate is put on the reclaim list once it has been one for the grace period —
        only while `verdict` is `ARMED`, i.e. the Server Owner confirmed the bucket holds only this instance's objects and
        did not pause. Counts and instants only: no key, no scope. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The reconcile as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreReconcile" }
              examples:
                neverRan:
                  summary: A fresh instance — no pass has run, nothing confirmed
                  value:
                    verdict: NOT_CONFIRMED
                    graceSeconds: 2592000
                    lastPass: null
                    passInProgress: null
                    failure: null
                    candidates: { storageKeys: 0, objects: 0, bytes: 0, dueKeys: 0, oldestFirstSeenAt: null, newestFirstSeenAt: null, firstDueAt: null }
                    exclusiveBucketConfirmedAt: null
                    pausedAt: null
                    clocksRestartedAt: null
                    clocksRestartReason: null
                    reclaim: { pending: 0, abandoned: 0 }
                inProgress:
                  summary: A pass is running; the last one found nothing
                  value:
                    verdict: NOT_CONFIRMED
                    graceSeconds: 2592000
                    lastPass: { startedAt: 2026-10-17T06:00:00Z, completedAt: 2026-10-17T06:04:10Z, objects: 18240, orphanObjects: 0, orphanBytes: 0, notVeyqObjects: 0, enqueuedKeys: 0 }
                    passInProgress: { startedAt: 2026-10-17T12:00:00Z, objects: 7000 }
                    failure: null
                    candidates: { storageKeys: 0, objects: 0, bytes: 0, dueKeys: 0, oldestFirstSeenAt: null, newestFirstSeenAt: null, firstDueAt: null }
                    exclusiveBucketConfirmedAt: null
                    pausedAt: null
                    clocksRestartedAt: null
                    clocksRestartReason: null
                    reclaim: { pending: 3, abandoned: 0 }
                armedWithCandidates:
                  summary: After a rollback, the failed release's uploads wait out the grace on a confirmed bucket
                  value:
                    verdict: ARMED
                    graceSeconds: 2592000
                    lastPass: { startedAt: 2026-10-17T12:00:00Z, completedAt: 2026-10-17T12:04:31Z, objects: 18263, orphanObjects: 23, orphanBytes: 61865984, notVeyqObjects: 1, enqueuedKeys: 0 }
                    passInProgress: null
                    failure: null
                    candidates: { storageKeys: 9, objects: 23, bytes: 61865984, dueKeys: 0, oldestFirstSeenAt: 2026-10-17T12:01:02Z, newestFirstSeenAt: 2026-10-17T12:03:40Z, firstDueAt: 2026-11-16T12:01:02Z }
                    exclusiveBucketConfirmedAt: 2026-10-17T12:10:00Z
                    pausedAt: null
                    clocksRestartedAt: null
                    clocksRestartReason: null
                    reclaim: { pending: 0, abandoned: 0 }
                listDenied:
                  summary: The store's key may not list the bucket — the last completed pass stays what is shown
                  value:
                    verdict: NOT_CONFIRMED
                    graceSeconds: 2592000
                    lastPass: null
                    passInProgress: { startedAt: 2026-10-17T12:00:00Z, objects: 0 }
                    failure: { at: 2026-10-17T12:00:01Z, reason: LIST_DENIED }
                    candidates: { storageKeys: 0, objects: 0, bytes: 0, dueKeys: 0, oldestFirstSeenAt: null, newestFirstSeenAt: null, firstDueAt: null }
                    exclusiveBucketConfirmedAt: null
                    pausedAt: null
                    clocksRestartedAt: null
                    clocksRestartReason: null
                    reclaim: { pending: 0, abandoned: 0 }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
