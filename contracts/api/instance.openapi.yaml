        uc.admin.learn-of-new-releases). This returns the check's setting (on or off, and the source), when it last
        succeeded, and what it found — the notices of decision 2 whose release is still newer than the running one,
        newest first. Server-Owner only.

        A notice is never an action: nothing is pulled, and upgrading stays the operator's, by hand (ADR 0096). A
        build with no release stamp, or a snapshot, is on no release line, so it checks nothing (`releaseLine:
        false`). Reading changes nothing.
