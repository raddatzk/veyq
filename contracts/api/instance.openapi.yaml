                    kind: PLANNED_MAJOR
                    release: "2.0"
                    date: 2029-05-01
                    daysAhead: null
                    foundAt: 2027-05-02T04:00:00Z
                    mailedAt: 2027-05-02T04:00:01Z
                  - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    kind: RELEASE
                    release: "1.42"
                    date: null
                    daysAhead: null
                    foundAt: 2027-04-20T04:00:00Z
                    mailedAt: null
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

