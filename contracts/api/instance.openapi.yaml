    InstanceOperatingMode:
      type: object
      description: The operating mode in effect, whether one was ever chosen, and the preset it sets.
      required: [mode, chosen, preset]
      properties:
        mode:
          $ref: "#/components/schemas/OperatingMode"
        chosen:
          x-veyq-visibility: flag
          type: boolean
          description: False on an instance where no mode was ever chosen; it then runs as ORGANISATION.
          example: true
        preset:
          type: array
          description: Every capability entry the catalog gives a value per mode, in catalog order; empty when none does.
          items: { $ref: "#/components/schemas/InstanceOperatingModePresetEntry" }

    InstanceOperatingModePresetEntry:
      type: object
      description: One entry of the preset (ADR 0088 decision 14) — its value in each mode, and its own instance switch now.
      # "off" quoted, here as on the property: bare, YAML 1.1 reads it as the boolean false, and the client generator
      # then refuses the whole spec ("required is not of type `string`").
      required: [id, title, onInPrivate, onInOrganisation, "off"]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: The capability id, as `listInstanceCapabilities` serves it.
          maxLength: 64
          example: core.public-shares.guest-write-record
        title:
          $ref: "#/components/schemas/InstanceCapabilityText"
        onInPrivate:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the PRIVATE mode switches the entry on (true) or off (false).
          example: false
        onInOrganisation:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the ORGANISATION mode switches the entry on (true) or off (false).
          example: true
        "off":
          x-veyq-visibility: flag
          type: boolean
          description: The entry's own instance switch now — true while the Server Owner has it switched off.
          example: false

    InstanceOperatingModeUpdate:
      type: object
      description: The mode to set.
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/OperatingMode"


    InstanceGuestWriteRecord:
      type: object
      description: How many days the guest-write record keeps a row, and whether the Server Owner set it.
      required: [retentionDays, chosen]
      properties:
        retentionDays:
          x-veyq-visibility: measure
          type: integer
          description: N, 1 to 30; 7 until set.
          example: 7
        chosen:
          x-veyq-visibility: flag
          type: boolean
          description: False while no value was ever set; N is then the default, 7.
          example: false

    InstanceGuestWriteRecordUpdate:
      type: object
      description: The retention to store.
      required: [retentionDays]
      properties:
        retentionDays:
          x-veyq-visibility: measure
          type: integer
          description: N, the days a row is kept, 1 to 30.
          minimum: 1
          maximum: 30
          example: 14
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1) @field:jakarta.validation.constraints.Max(30)'

    GuestWriteRecordErasure:
      type: object
      description: What deleting one share identity's guest-write-record rows did.
      required: [erased, keptInHolds]
      properties:
        erased:
          x-veyq-visibility: measure
          type: integer
          description: How many live rows were deleted.
          example: 3
        keptInHolds:
          x-veyq-visibility: measure
          type: integer
          description: How many of this identity's rows a hold copied; they stay until their hold ends.
          example: 1
    OperatingMode:
      $ref: '_common.openapi.yaml#/components/schemas/OperatingMode'

    # A Server Owner's step over content carries its statement (ADR 0093 § 7), single-sourced in _common.
    ServerOwnerStatementInput:
      $ref: '_common.openapi.yaml#/components/schemas/ServerOwnerStatementInput'

    # An authority's order is single-sourced with the moderator's door (moderation.openapi.yaml, enterModerationOrder).
    AuthorityOrderKind:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrderKind'
    SealedOrderReference:
      $ref: '_common.openapi.yaml#/components/schemas/SealedOrderReference'
    AuthorityOrderRequest:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrderRequest'
    AuthorityOrder:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrder'

    StoreReconcile:
      type: object
      description: >
        The bucket reconcile (ADR 0062 § Consequences): what its passes found, what it would delete and when, and why
        it would or would not. Counts and instants only — no storage key, no scope.
      required: [verdict, graceSeconds, lastPass, passInProgress, failure, candidates, exclusiveBucketConfirmedAt, pausedAt, clocksRestartedAt, clocksRestartReason, reclaim]
      properties:
        verdict:
          x-veyq-visibility: enum
          type: string
          description: >
            Whether a candidate past its grace would be put on the reclaim list at the next completed pass. `ARMED` =
            yes. `NOT_CONFIRMED` = no: the Server Owner has not confirmed that the bucket in use holds only this
            instance's objects (or confirmed it for another store setting, or a restore withdrew it), so the reconcile
            only reports. `PAUSED` = no: confirmed, and paused. `NO_STORE` = no store is usable, so nothing is listed.
          enum: [ARMED, NOT_CONFIRMED, PAUSED, NO_STORE]
          example: ARMED
        graceSeconds:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: How long a storage key must have been an orphan in every pass, from when it was first seen, before it is due (`veyq.store-reconcile.grace`).
          example: 2592000
        lastPass:
          oneOf:
            - $ref: "#/components/schemas/StoreReconcilePass"
            - type: "null"
        passInProgress:
          oneOf:
            - $ref: "#/components/schemas/StoreReconcileProgress"
            - type: "null"
        failure:
          oneOf:
            - $ref: "#/components/schemas/StoreReconcileFailure"
            - type: "null"
        candidates:
          $ref: "#/components/schemas/StoreReconcileCandidates"
        exclusiveBucketConfirmedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the Server Owner confirmed that the bucket in use holds only this instance's objects; null when not confirmed for the store in use.
          example: 2026-10-17T12:10:00Z
        pausedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the Server Owner paused the deletions; null when not paused.
          example: null
        clocksRestartedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When every candidate's grace period last restarted, if it did since the last restore (a restore empties the
            reconcile's state, so after one this is null until a restart happens).
          example: null
        clocksRestartReason:
          x-veyq-visibility: enum
          type: [string, "null"]
          description: >
            Why the grace periods last restarted: `GAP` = two consecutive listed pages lay further apart than
            `veyq.store-reconcile.max-gap` — the reconcile counts only time it observed, which also catches a database
            brought back by something other than the restore tool; `STORE_CHANGED` = a different store setting is in
            use. Null with `clocksRestartedAt`.
          enum: [GAP, STORE_CHANGED, null]
          example: null
        reclaim:
          $ref: "#/components/schemas/StoreReclaimCounts"

    StoreReconcilePass:
      type: object
      description: One completed pass over the whole bucket.
      required: [startedAt, completedAt, objects, orphanObjects, orphanBytes, notVeyqObjects, enqueuedKeys]
      properties:
        startedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the pass listed its first page.
          example: 2026-10-17T12:00:00Z
        completedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the pass listed its last page.
          example: 2026-10-17T12:04:31Z
        objects:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Every object the pass listed.
          example: 18263
        orphanObjects:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            Objects shaped like veyq's that no row claims, older than the safe age (`veyq.blob.upload.retention` on the
            store's own clock), and still present when asked again.
          example: 23
        orphanBytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: The listed size of those objects.
          example: 61865984
        notVeyqObjects:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: >
            Objects not shaped like veyq's (`<uuid>/<index>`) — another tool's or another tenant's in a shared bucket, an
            object pool kept in the same bucket. Never an orphan, never deleted. The store check's probe is not counted.
          example: 1
        enqueuedKeys:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Storage keys this pass put on the reclaim list (their grace was over and deleting was armed).
          example: 0

    StoreReconcileProgress:
      type: object
      description: The pass in progress.
      required: [startedAt, objects]
      properties:
        startedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the pass started.
          example: 2026-10-17T12:00:00Z
        objects:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Objects listed so far.
          example: 7000

    StoreReconcileFailure:
      type: object
      description: >
        Why the last tick stopped. A failure ends the tick, keeps the pass's place, publishes nothing and puts nothing on
        the reclaim list; the next tick tries again from the same place. Cleared by the next page that succeeds.
      required: [at, reason]
      properties:
        at:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it failed.
          example: 2026-10-17T12:00:01Z
        reason:
          x-veyq-visibility: enum
          type: string
          description: >
            `STORE_UNREACHABLE` = the store did not answer the listing. `LIST_DENIED` = the store refused it (HTTP 403):
            the access key may not list the bucket. `NO_STORE` = no store is usable. `NO_STORE_CLOCK` = the store's
            answer carried no `Date`, so no object's age could be read on the store's own clock. `DATABASE` = the rows
            could not be read or written.
          enum: [STORE_UNREACHABLE, LIST_DENIED, NO_STORE, NO_STORE_CLOCK, DATABASE]
          example: LIST_DENIED

    StoreReconcileCandidates:
      type: object
      description: >
        Storage keys no row claimed in any pass since they were first seen — each one's objects are orphans. A key is
        due once it has been one for the grace period.
      required: [storageKeys, objects, bytes, dueKeys, oldestFirstSeenAt, newestFirstSeenAt, firstDueAt]
      properties:
        storageKeys:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Candidate storage keys (one per uploaded blob).
          example: 9
        objects:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Their objects, as the last pass that saw each key counted them.
          example: 23
        bytes:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Those objects' listed size.
          example: 61865984
        dueKeys:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Candidate keys whose grace is over — the next completed pass puts them on the reclaim list while the verdict is `ARMED`.
          example: 0
        oldestFirstSeenAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the oldest candidate was first seen; null with no candidate.
          example: 2026-10-17T12:01:02Z
        newestFirstSeenAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: When the newest candidate was first seen; null with no candidate.
          example: 2026-10-17T12:03:40Z
        firstDueAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When the oldest candidate's grace is over. While the verdict is `ARMED`, the first completed pass after it
            puts that key on the reclaim list, whose sweep deletes it once the list's own wait has passed. Null with no
            candidate.
          example: 2026-11-16T12:01:02Z

    StoreReclaimCounts:
      type: object
      description: The reclaim list (ADR 0062) — every store object deletion goes through it.
      required: [pending, abandoned]
      properties:
        pending:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Storage keys waiting to be deleted (including ones being retried).
          example: 0
        abandoned:
          x-veyq-visibility: measure
          type: integer
          format: int64
          description: Storage keys the sweep gave up on after its retries — bytes that are counted, not deleted.
          example: 0

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque access token issued by login / refresh. Every operation here additionally requires the
        global Server-Owner role (enforced by code, not this spec).
