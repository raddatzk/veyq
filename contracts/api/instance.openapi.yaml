              example:
                host: smtp.example.com
                port: 587
                from: veyq@example.com
                username: veyq
                tls: true
                passwordSet: true
                configSecretState: OK
                address: owner@example.com
                confirmation: CONFIRMED
                confirmedAt: 2026-10-16T12:00:00Z
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
