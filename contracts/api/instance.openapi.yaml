      x-veyq-channel: admin
      summary: Save the instance mail settings and send the test mail that carries the confirmation code.
      description: >
        Replaces the settings (the password excepted: omit it to keep the stored one; a supplied one is sealed under
        the config-secret key with that key's fingerprint, never returned or logged). Every save asks again (ADR 0097
        decision 5): the confirmation is cleared, and with a host set, a test mail carrying a short one-time code goes
        to the caller's account address — the code is then typed into `POST /api/instance/mail-settings/confirmation`.
