openapi: 3.1.0
info:
  title: veyq Instance API
  version: 0.1.0
  description: >
    Operational reads about the running instance itself, for the **Server Owner**. This is the operator's
    view of the software — which bits are running — and not the client's view of the protocol.

    The two are deliberately never merged (ADR 0057 §4). The pre-auth `GET /api/setup` advertises
    `version: { major, build }`, which answers *can this client and this server talk to each other?* and must
    be readable before login because that is where its gate fires. The **release version** here answers
    *which bits are running, and what do I roll back to?* — and it stays authenticated and Server-Owner-only,
    because a precise release number is what maps an instance to a list of known vulnerabilities, and a
    self-hosted instance is the kind that upgrades late. The capability manifest already discloses this
    instance's feature set to any visitor; the release number does not become public with it.

    Nothing here is user content: a release version is a property of the software. Operator-blindness is
    untouched — this value ends up disclosed to *fewer* parties than the capability manifest already is.
    Authorization is enforced by code annotations, not this spec (ADR 0008).
tags:
  - name: instance
    description: >
      Server-Owner reads about the running instance (release identity, store provisioning). One tag = one
      resource interface owning the whole `/api/instance` subtree.

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/instance/release:
    get:
      tags: [instance]
      operationId: getInstanceRelease
      x-veyq-channel: admin
      summary: Report the release version the running image was stamped with.
      description: >
        Returns the release the running image was published under — the rollback target an upgrade needs to be
        able to name (uc.admin.identify-instance-release, ADR 0056 §6). Server-Owner only.

        This answers what is **running**, which is not the same question as what a compose file **pins**: the
        two diverge after a pull that was never restarted, or a restart that silently reused a cached image —
        the case where an upgrade appears to have happened and did not.

        A build that was never published carries no stamp, and the answer says so (`release: null`) rather
        than synthesising a number. Absence is a first-class answer here: every consumer of this value uses it
        to choose an image to start, so a fabricated version is the one an operator would try to roll back to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The release version of the running instance, or its explicit absence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceRelease" }
              examples:
                published:
                  summary: An image produced by the release pipeline
                  value: { release: "1.0" }
                unstamped:
                  summary: A locally built image or a quarkusDev run — never published, so never stamped
                  value: { release: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store-provisioning:
    get:
      tags: [instance]
      operationId: getInstanceStoreProvisioning
      x-veyq-channel: admin
      summary: Report whether the object store has been brought from running to usable.
      description: >
        Returns how far veyq has got with provisioning the configured object store
        ([ADR 0067](../../docs/decisions/0067-store-provisioning-from-a-declared-type.md)). Server-Owner only.

        This exists because provisioning deliberately **does not gate the boot**: it reaches another container
        over the network, and a startup observer that can fail on an unreachable dependency is how
        [ADR 0063](../../docs/decisions/0063-database-driven-tenant-ingress.md) restart-looped a production
        stack into serving nothing. So an instance whose store is not yet usable starts anyway, answers
        `GET /api/setup`, and looks healthy — and without this read the failure would first reach the operator
        as a photo that will not upload.

        The value is server self-description and holds no user content. It says what the operator can **do**,
        never what the code did; the reason a bring-up failed stays in the log, because the four answers below
        already separate the four different things an operator does next.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: How far provisioning has got on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStoreProvisioning" }
              examples:
                provisioned:
                  summary: The bundled store was brought up and is usable
                  value: { state: PROVISIONED }
                notAttempted:
                  summary: An `s3` store — the operator owns its bring-up, and veyq never pokes it
                  value: { state: NOT_ATTEMPTED }
                failed:
                  summary: The bounded retries ran out; media will not work until the store is fixed
                  value: { state: FAILED }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

components:
  schemas:
    InstanceRelease:
      type: object
      description: >
        The running instance's release identity. One field, because a second one would only restate it:
        `release: null` already says "this build carries no release stamp", and a separate boolean would be a
        second way to say the same thing — which is a way to say the opposite when the two disagree.
      required: [release]
      properties:
        release:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The release version the running image was stamped with at publish: `<major>.<minor>`, the value
            this repository's VERSION file held at the commit that published it, and the tag the image carries
            in the registry (ADR 0057 §1). A publish onto an existing tag fails rather than replacing it, which
            is what makes this value a rollback target rather than a label on a moving artifact.

            `null` when the running build was never published — a locally built image or a `quarkusDev` run.
            That is reported as the absence it is, never as a placeholder.
          maxLength: 32
          example: "1.0"

    InstanceStoreProvisioning:
      type: object
      description: >
        How far veyq has got with bringing the configured object store from *running* to *usable*
        (ADR 0067). Server self-description, not user data: it describes the operator's own infrastructure,
        never anything in it.
      required: [state]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: >
            The provisioning outcome, in the terms of what the operator does next. Every state the background
            runner can be in has a value here, including the two that are not outcomes at all.

            `NOT_ATTEMPTED` = the store connection declares `type: s3`, so veyq never attempts vendor bring-up
            (ADR 0067 Decision 1 — an unknown store is never poked). This is a **correct, permanent** answer
            and not a failure: the operator prepared the bucket themselves, and nothing here will ever change.
            `IN_PROGRESS` = a bring-up is running or waiting to retry. Uploads may fail until it finishes;
            wait, and read again. `PROVISIONED` = the store is usable — layout, bucket, key, grant and CORS
            policy are all in place. `FAILED` = the bounded retries are exhausted and veyq has given up
            (ADR 0067 Decision 3). Media stays broken until the store is repaired and the app restarted; the
            log carries which call failed.
          enum: [NOT_ATTEMPTED, IN_PROGRESS, PROVISIONED, FAILED]
          example: PROVISIONED

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque access token issued by login / refresh. Every operation here additionally requires the
        global Server-Owner role (enforced by code, not this spec).
