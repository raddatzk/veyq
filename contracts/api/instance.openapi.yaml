openapi: 3.1.0
info:
  title: veyq Instance API
  version: 0.1.0
  description: >
    Operational reads about the running instance itself, for the **Server Owner**. This is the operator's
    view of the software — which bits are running — and not the client's view of the protocol.

    The two share one major and differ in precision (ADR 0057 §4, ADR 0085 decision 1). The pre-auth
    `GET /api/setup` advertises `version: { major, build }`, which answers *can this client and this server
    talk to each other?* and must be readable before login because that is where its gate fires. The
    **release version** here, `<major>.<minor>`, answers *which bits are running, and what do I roll back to?*
    — and its minor stays authenticated and Server-Owner-only,
    because a precise release number is what maps an instance to a list of known vulnerabilities, and a
    self-hosted instance is the kind that upgrades late. The capability manifest already discloses this
    instance's feature set to any visitor; the release number does not become public with it.

    Nothing here is user content: a release version is a property of the software. Operator-blindness is
    untouched — this value ends up disclosed to *fewer* parties than the capability manifest already is.

    The object store and the capability switches are the **settings** here (ADR 0089): the Server Owner sets
    them on the admin channel instead of in environment variables. The store describes the operator's own
    infrastructure; the store it names holds ciphertext only, and its secrets are sealed server-side and never
    returned. A capability switch is instance configuration and carries no member data (ADR 0088 decision 12).

    The release check and the instance mail are ADR 0097's: the instance reads the published releases once a day
    with an anonymous request that names no release, and mails what it found to the Server Owner only, from SMTP
    settings of its own that never send a tenant's mail.

    The operator values are the host's own published data (ADR 0093 § 11, ADR 0035 decision 7): who runs the
    instance and how to reach them, typed by the Server Owner to be published, plus a private notification address
    that never leaves this channel. Beyond those, the only personal value here is the Server Owner's own account
    address, shown back to its holder.

    Authorization is enforced by code annotations, not this spec (ADR 0008).
tags:
  - name: instance
    description: >
      Server-Owner reads and settings of the running instance (release identity, store provisioning,
      config-secret state, the object-store setting and its check, the capability switches, the release check
      and its notices, the instance mail settings). One tag = one resource interface owning the whole
      `/api/instance` subtree.

  - name: instance-moderation
    description: >
      The Server Owner's half of moderation (ADR 0099): the moderator roster and minting each epoch of the instance
      moderation key after the first, which first-run setup mints. A tag of its own, so its resource owns the `/api/instance/moderation`
      subtree. The moderator's half is `moderation.openapi.yaml`, on the public listener.

  - name: instance-operator
    description: >
      The operating mode (ADR 0093 § 14, ADR 0088 decision 14) and the values a host publishes about itself — the
      instance contact, the provider identification, the supervisory authority (ADR 0093 § 11, ADR 0035 decisions
      6–7) — with the contact's private notification address and its code confirmation (ADR 0097 decision 5). A tag
      of its own, so its resource owns the `/api/instance/operator` subtree. The public read of the published values
      is `operator.openapi.yaml`.

  - name: instance-guest-write-record
    description: >
      How long the guest-write record keeps a row (ADR 0093 § 10, ADR 0092 § 2): N days, an instance setting the Server
      Owner sets (ADR 0089), and the deletion of one identity's rows when its guest objects (GDPR Art. 21). Whether the
      record is kept at all is the capability switch `core.public-shares.guest-write-record`, not this. A tag of its
      own, so its resource owns the
      `/api/instance/guest-write-record` subtree.

  - name: instance-store-reconcile
    description: >
      The bucket reconcile (ADR 0062 § Consequences, uc.admin.configure-object-store A7): what its passes found and the
      Server Owner's two switches over its deletions — the exclusive-bucket confirmation and the pause. A tag of its own,
      so its resource owns the `/api/instance/store/reconcile` subtree.

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/instance/release:
    get:
      tags: [instance]
      operationId: getInstanceRelease
      x-veyq-channel: admin
      summary: Report the release version the running image was stamped with.
      description: >
        Returns the release the running image was published under — the rollback target an upgrade needs to be
        able to name (uc.admin.identify-instance-release, ADR 0056 §6). Server-Owner only.

        This answers what is **running**, which is not the same question as what a compose file **pins**: the
        two diverge after a pull that was never restarted, or a restart that silently reused a cached image —
        the case where an upgrade appears to have happened and did not.

        A build that was never published carries no stamp, and the answer says so (`release: null`) rather
        than synthesising a number. Absence is a first-class answer here: every consumer of this value uses it
        to choose an image to start, so a fabricated version is the one an operator would try to roll back to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The release version of the running instance, or its explicit absence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceRelease" }
              examples:
                published:
                  summary: An image produced by the release pipeline
                  value: { release: "1.0" }
                unstamped:
                  summary: A locally built image or a quarkusDev run — never published, so never stamped
                  value: { release: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store-provisioning:
    get:
      tags: [instance]
      operationId: getInstanceStoreProvisioning
      x-veyq-channel: admin
      summary: Report whether the object store has been brought from running to usable.
      description: >
        Returns how far veyq has got with provisioning the configured object store
        ([ADR 0067](../../docs/decisions/0067-store-provisioning-from-a-declared-type.md)). Server-Owner only.

        This exists because provisioning deliberately **does not gate the boot**: it reaches another container
        over the network, and a startup observer that can fail on an unreachable dependency is how
        [ADR 0063](../../docs/decisions/0063-database-driven-tenant-ingress.md) restart-looped a production
        stack into serving nothing. So an instance whose store is not yet usable starts anyway, answers
        `GET /api/setup`, and looks healthy — and without this read the failure would first reach the operator
        as a file that will not upload.

        The value is server self-description and holds no user content. It says what the operator can **do**,
        never what the code did; the reason a bring-up failed stays in the log, because the four answers below
        already separate the four different things an operator does next.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: How far provisioning has got on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStoreProvisioning" }
              examples:
                provisioned:
                  summary: The bundled store was brought up and is usable
                  value: { state: PROVISIONED }
                notAttempted:
                  summary: An `s3` store — the operator owns its bring-up, and veyq never pokes it
                  value: { state: NOT_ATTEMPTED }
                failed:
                  summary: The bounded retries ran out; blob uploads and downloads will not work until the store is fixed
                  value: { state: FAILED }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/config-secret:
    get:
      tags: [instance]
      operationId: getInstanceConfigSecret
      x-veyq-channel: admin
      summary: Report whether the config-secret key can open the secrets sealed under it.
      description: >
        Returns the instance's config-secret state
        ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)) for the Server Owner, who
        owns no tenant and so cannot read it through a tenant's mail settings. Server-Owner only.

        This is the verification step of a restore and an upgrade
        ([ADR 0056](../../docs/decisions/0056-instance-durable-state-and-cold-logical-backup.md) §5): the
        fingerprint comparison is the only check that tells a restore that carried its key from one that lost
        it, and an instance that lost it looks healthy — it serves content and refuses member invites and
        password resets.

        **Reading changes nothing.** An instance that has not yet recorded the fingerprint of its key keeps not
        having one; the fingerprint is recorded where a secret is sealed or first used, never by this read. The
        value is server self-description — a state, never key material, a fingerprint or a sealed value.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The config-secret state of the running instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceConfigSecret" }
              examples:
                ok:
                  summary: The key is present and is the one the stored secrets were sealed under
                  value: { state: OK }
                mismatch:
                  summary: A restore that did not carry the key file — the instance starts and refuses invites
                  value: { state: MISMATCH }
                absent:
                  summary: No key is available — it could not be generated or cannot be read
                  value: { state: ABSENT }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store:
    get:
      tags: [instance]
      operationId: getInstanceStore
      x-veyq-channel: admin
      summary: Read the object-store setting in use, a pending change and its check, and whether a bundled store is offered.
      description: >
        The object store is a Server-Owner setting held in the database, not in the environment
        ([ADR 0089](../../docs/decisions/0089-instance-settings-live-in-admin-web-the-environment-only-bootstraps.md)).
        This returns the setting in use (or its absence) with the result of the last check of **that** setting,
        a changed setting that is saved but not yet in use (`pending`, decision 5) with its own last check,
        whether a bundled store is offered by the deployment, and whether blobs already exist — after which the
        store's type, endpoint and bucket are fixed. Server-Owner only.

        Secrets are never returned: the secret key and the Garage admin token are reported as set or not, and
        as readable or not — a value sealed under a config-secret key that is absent or is not the one that
        sealed it ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)) is listed in
        `unreadable`, so the console can ask for it again. The store holds ciphertext only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The store setting as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              examples:
                unset:
                  summary: A fresh install of the bundled recipe — nothing chosen yet, the bundled store offered
                  value: { bundledAvailable: true, blobsStored: false, setting: null, lastCheck: null, pending: null }
                bundledChecked:
                  summary: The bundled store chosen and checked
                  value:
                    bundledAvailable: true
                    blobsStored: true
                    setting:
                      bundled: true
                      type: GARAGE
                      endpoint: http://garage:3900
                      publicEndpoint: https://veyq.example.com
                      bucket: blobs
                      region: garage
                      accessKey: GK0123456789abcdef01234567
                      garageAdminEndpoint: http://garage:3903
                      secretKeySet: true
                      garageAdminTokenSet: true
                      unreadable: []
                    lastCheck:
                      passed: true
                      checkedAt: 2026-10-15T12:00:00Z
                      steps:
                        - { step: CREDENTIALS, outcome: PASSED, detail: null }
                        - { step: PROVISION, outcome: PASSED, detail: null }
                        - { step: BUCKET, outcome: PASSED, detail: null }
                        - { step: PROBE_PUT, outcome: PASSED, detail: null }
                        - { step: PROBE_GET, outcome: PASSED, detail: null }
                        - { step: CORS, outcome: SKIPPED, detail: "The store is served on each tenant's own domain, so no browser request to it is cross-origin." }
                    pending: null
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    put:
      tags: [instance]
      operationId: setInstanceStore
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the form shows the whole setting it sends, and secrets it leaves out are
          kept rather than overwritten.
      x-veyq-channel: admin
      summary: Save a store setting — the bundled one, or an S3-compatible or Garage store — to be checked before it is used.
      description: >
        Saves the setting as `pending` and changes nothing the instance does (ADR 0089 decision 5): the store
        the backend signs against, the store origin in the app shell's CSP and the store route in the tenant
        ingress keep following the setting in use until the pending one passes its own check
        (`POST /api/instance/store/check`), which then replaces it at once, without a restart. A typo therefore
        never reaches a running instance's media. On a fresh instance there is no setting in use, so uploads and
        tenant creation wait for the first passed check. A later write replaces the pending setting; a write
        equal to the setting in use discards it. Server-Owner only.

        `bundled: true` chooses the store the deployment brings and stores a **reference** to it, not a copy of
        its secrets (decision 3); every other field must then be absent. Otherwise `type` and the connection
        fields are required; `secretKey` (and, for Garage, `garageAdminToken`) are write-only and sealed under
        the config-secret key with the fingerprint of that key (decision 4) — omit one to keep the stored value
        (the pending setting's, else the one in use).

        Once blobs exist, changing the type, endpoint or bucket away from the setting in use is refused: moving an
        instance's blobs to another store is not something this does (decision 6). Credentials and the public
        endpoint may change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceStoreUpdate" }
            examples:
              bundled:
                summary: Use the bundled store
                value: { bundled: true }
              s3:
                summary: An S3-compatible store of the operator's own
                value:
                  bundled: false
                  type: S3
                  endpoint: https://s3.eu-central-1.example.com
                  publicEndpoint: null
                  bucket: veyq-blobs
                  region: eu-central-1
                  accessKey: AKIAEXAMPLE
                  secretKey: example-secret-key
      responses:
        "200":
          description: The setting was saved as pending (or, equal to the one in use, discarded the pending one); the store as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              example:
                bundledAvailable: false
                blobsStored: false
                setting: null
                lastCheck: null
                pending:
                  setting:
                    bundled: false
                    type: S3
                    endpoint: https://s3.eu-central-1.example.com
                    publicEndpoint: null
                    bucket: veyq-blobs
                    region: eu-central-1
                    accessKey: AKIAEXAMPLE
                    garageAdminEndpoint: null
                    secretKeySet: true
                    garageAdminTokenSet: false
                    unreadable: []
                  lastCheck: null
        "400":
          description: >
            The request was malformed, or its fields do not form a setting: `bundled: true` with any other field,
            or a store without its type, endpoint, bucket, region, access key or (when none is stored yet) secret
            key, or a Garage store without its admin endpoint or token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            `no_bundled_store` = `bundled: true`, but this deployment offers no bundled store. `store_in_use` =
            blobs already exist and the request changes the type, endpoint or bucket of the store in use. Nothing
            is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                noBundledStore:
                  value: { code: no_bundled_store }
                storeInUse:
                  value: { code: store_in_use }
        "503":
          description: >
            A secret was supplied, but no config-secret key is available to seal it (ADR 0050). Nothing is
            stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: store_secret_unavailable }

  /api/instance/store/pending:
    delete:
      tags: [instance]
      operationId: discardPendingInstanceStore
      x-veyq-channel: admin
      summary: Discard the pending store setting; the one in use stays.
      description: >
        Drops the changed setting that is saved but not in use (ADR 0089 decision 5), with its check. The
        setting in use, and everything that follows it, is untouched. Idempotent: with nothing pending it changes
        nothing. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nothing is pending any more; the store as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              example: { bundledAvailable: true, blobsStored: false, setting: null, lastCheck: null, pending: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store/check:
    post:
      tags: [instance]
      operationId: checkInstanceStore
      x-veyq-channel: admin
      summary: Check the pending store setting, or with none pending the one in use, step by step.
      description: >
        Runs the check of ADR 0089 decision 2 against the pending setting when there is one, else against the
        setting in use, and stores its result, which `GET /api/instance/store` returns beside that setting. A
        pending setting that **passes** replaces the one in use at once, without a restart (decision 5): the
        store the backend signs against, the app shell's CSP and the tenant ingress follow it from then on. One
        that fails stays pending, and the setting in use is untouched. Server-Owner only.

        The steps run in order and stop at the first failure; every later step reports `SKIPPED`.
        `CREDENTIALS` = the sealed secrets can be opened under the current config-secret key. `PROVISION` (Garage
        only) = veyq brought the store up: layout, bucket, key, grant and CORS policy
        ([ADR 0067](../../docs/decisions/0067-store-provisioning-from-a-declared-type.md)); for an S3-compatible
        store it is `SKIPPED`, because an unknown store is never provisioned. `BUCKET` = the bucket exists (the
        check never creates one). `PROBE_PUT` and `PROBE_GET` = one fixed probe object under a `veyq-check/` key is
        written through a presigned PUT and read back through a presigned GET, against the public endpoint the
        browsers use; it is overwritten by every check and never deleted. `CORS` = a preflight sent with the
        instance's public origin is answered with that origin — `SKIPPED` where the store is served on the
        tenants' own domains and nothing is cross-origin.

        Writing the probe object into the bucket veyq was pointed at is its ordinary data plane; creating a
        bucket or writing a CORS policy is provisioning, which this never does to an S3-compatible store.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The check ran; whether it passed, and each step's outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStoreCheck" }
              examples:
                noBucket:
                  summary: The bucket the setting names does not exist
                  value:
                    passed: false
                    checkedAt: 2026-10-15T12:00:00Z
                    steps:
                      - { step: CREDENTIALS, outcome: PASSED, detail: null }
                      - { step: PROVISION, outcome: SKIPPED, detail: "An S3-compatible store is never provisioned by veyq." }
                      - { step: BUCKET, outcome: FAILED, detail: "The bucket veyq-blobs does not exist (HTTP 404)." }
                      - { step: PROBE_PUT, outcome: SKIPPED, detail: null }
                      - { step: PROBE_GET, outcome: SKIPPED, detail: null }
                      - { step: CORS, outcome: SKIPPED, detail: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: No store is set or pending, so there is nothing to check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: store_not_configured }

  /api/instance/capabilities:
    get:
      tags: [instance]
      operationId: listInstanceCapabilities
      x-veyq-channel: admin
      summary: List the capability register with each entry's words and its switch.
      description: >
        Returns every entry of the capability register (`contracts/platform/capabilities.json`, ADR 0088) in
        catalog order, where a parent comes before its children. Server-Owner only.

        Each entry carries its words as the catalog holds them, in English and German (decision 13): its
        `title`, what it is for (`purpose`), and what switching it off does to what is new and to what exists
        (`whenOff`). A client renders them in its own locale and keeps no copy of its own.

        `off` is the entry's own switch, as the Server Owner set it. `effective` is whether the entry is active:
        it and every ancestor entry are on (the AND along the path, decision 2). So a child of a switched-off
        parent reads `off: false, effective: false`, and switching the parent back on brings it back. An entry is
        listed in `GET /api/setup`'s manifest exactly when it is `effective` here.

        The register is instance configuration: nothing here is member data, and every entry is listed whether
        or not any member uses it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every entry of the register, in catalog order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstanceCapability" }
              example:
                - id: core.public-shares
                  title: { en: "Public links", de: "Öffentliche Links" }
                  purpose: { en: "Members can share what is in a space through a link …", de: "Mitglieder können Inhalte eines Bereichs über einen Link teilen …" }
                  whenOff: { en: "No new public link of any kind can be made …", de: "Es lässt sich kein neuer öffentlicher Link mehr anlegen …" }
                  "off": true
                  effective: false
                  tenantSwitchable: true
                  requirements: []
                - id: core.public-shares.contribute
                  title: { en: "Links to look and add", de: "Links zum Ansehen und Hinzufügen" }
                  purpose: { en: "A public link whose guests can add to what they see …", de: "Ein öffentlicher Link, über den Gäste …" }
                  whenOff: { en: "No new link of this kind can be made …", de: "Es lässt sich kein neuer Link dieser Art anlegen …" }
                  "off": false
                  effective: false
                  tenantSwitchable: true
                  requirements: []
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/capabilities/{capabilityId}:
    put:
      tags: [instance]
      operationId: setInstanceCapability
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries one entry's own switch, never the whole set, so two
          console tabs switching different entries cannot overwrite each other, and on the same entry the later
          write is the one the owner made last.
      x-veyq-channel: admin
      summary: Switch one capability entry off or back on.
      description: >
        Sets the entry's own switch and applies it at once, without a restart (ADR 0088 decision 12): the
        manifest of `GET /api/setup` follows it, and so does every gate on the entry and, by the AND along the
        path, on its children. Writing the state the entry already has changes nothing and answers the same.
        Server-Owner only.

        What off does is the entry's `whenOff` (decision 5). A feature switch refuses only what is new
        (`422 capability_disabled` at the creating endpoint) and leaves what exists alone. A device switch acts at
