            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store/reconcile/exclusive-bucket:
    put:
      tags: [instance-store-reconcile]
      operationId: confirmStoreExclusiveBucket
      x-veyq-channel: admin
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries no value but the switch itself, set for the store in use, so the
          later of two writes is the one the owner made last.
      summary: Confirm that the bucket in use holds only this instance's objects, which arms the deletion of candidates past the grace.
      description: >
        The first of the reconcile's three conditions for deleting anything (ADR 0062): a bucket another instance or
        another tool also writes to would show that writer's objects as orphans here. The confirmation is stored with its
        time and for the store in use; a different store setting put in use voids it, and so does a restore (which also
        restarts every grace period). Idempotent. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Confirmed; the reconcile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreReconcile" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: No store is usable (`no_store`), so there is no bucket to confirm. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: no_store }
    delete:
      tags: [instance-store-reconcile]
      operationId: withdrawStoreExclusiveBucket
      x-veyq-channel: admin
      summary: Withdraw the exclusive-bucket confirmation; the reconcile goes back to only reporting.
      description: >
        Nothing more is put on the reclaim list until the bucket is confirmed again; candidates keep their grace periods.
        Keys already on the reclaim list are that list's (ADR 0062). Idempotent. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Withdrawn; the reconcile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreReconcile" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store/reconcile/pause:
    put:
      tags: [instance-store-reconcile]
      operationId: pauseStoreReconcile
      x-veyq-channel: admin
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries no value but the switch itself, so the later of two writes is
          the one the owner made last.
      summary: Pause the reconcile's deletions — it keeps listing and counting, and puts nothing on the reclaim list.
      description: >
        Candidates keep their grace periods while paused, so one past its grace goes onto the reclaim list at the first
        completed pass after a resume. Keys already on the reclaim list are that list's (ADR 0062). Idempotent.
        Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paused; the reconcile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreReconcile" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    delete:
      tags: [instance-store-reconcile]
      operationId: resumeStoreReconcile
      x-veyq-channel: admin
      summary: Resume the reconcile's deletions after a pause.
      description: Idempotent. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resumed; the reconcile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreReconcile" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

components:
  parameters:
    ModeratorAccountId:
      name: accountId
      in: path
      required: true
      description: The moderator's account id.
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: A moderator's proposal's id.
      schema: { type: string, format: uuid }
    SignInBlockId:
      name: blockId
      in: path
      required: true
      description: A sign-in block's id.
      schema: { type: string, format: uuid }

  schemas:
    ModerationSteps:
      type: object
      description: The Server Owner's moderation steps.
      required: [proposals, signInBlocks]
      properties:
        proposals:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/OpenModerationProposal" }
        signInBlocks:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/AccountSignInBlock" }

    OpenModerationProposal:
      type: object
      description: One open proposal of a moderator.
      required: [id, caseId, category, step, accountId, address, tenantId, tenantDomain, proposedAt]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 2c1f2d3e-4a5b-4c7c-8f0e-2a9b1d4a6e8b }
        caseId: { type: string, format: uuid, x-veyq-visibility: id, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
        category:
          x-veyq-visibility: enum
          type: string
          description: The case's category (ADR 0093 § 1), most urgent of its reports.
          enum: [CHILD_SEXUAL_ABUSE, TERRORIST_CONTENT, THREAT_TO_LIFE, ILLEGAL_CONTENT, TERMS_BREACH]
          example: ILLEGAL_CONTENT
        step:
          x-veyq-visibility: enum
          type: string
          description: "`MEMBER_SIGN_IN` = block the account's sign-in; `TENANT_OFFLINE` = suspend the tenant (ADR 0066)."
          enum: [MEMBER_SIGN_IN, TENANT_OFFLINE]
          example: TENANT_OFFLINE
        accountId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The member's account, for `MEMBER_SIGN_IN`; null otherwise.
          example: null
        address:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The member's account address, already server-held plaintext — how the Server Owner names an account to
            block (`blockAccountSignIn`), shown back only on the admin channel.
          type: [string, "null"]
          description: The member's account address, for `MEMBER_SIGN_IN`; null otherwise or once the account is gone.
          maxLength: 254
          example: null
        tenantId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The tenant, for `TENANT_OFFLINE`; null otherwise.
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        tenantDomain:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The tenant's domain, for `TENANT_OFFLINE` — the Server Owner's configuration; null otherwise.
          maxLength: 253
          example: club.example.org
        proposedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was proposed.
          example: 2026-10-17T12:00:00Z

    AccountSignInBlock:
      type: object
      description: A member's sign-in block in force.
      required: [id, accountId, address, caseId, blockedAt]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 9a8b1c2d-3e4f-4a6b-8f2c-9a1e7b3d4e5f }
        accountId: { type: string, format: uuid, x-veyq-visibility: id, example: 6e8b2c1f-2d3e-4a5b-8c7c-3f0e2a9b1d4a }
        address:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The blocked account's address, already server-held plaintext — how the Server Owner recognises whom they
            blocked, shown back only on the admin channel.
          type: string
          description: The blocked account's address.
          maxLength: 254
          example: member@example.com
        caseId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The case the block answers; null when none was named.
          example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b
        blockedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was blocked.
          example: 2026-10-17T12:00:00Z

    BlockAccountSignInRequest:
      type: object
      description: The account to block, by its address, and the case the block answers.
      required: [address]
      properties:
        address:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The Server Owner names an existing account by its address, as an appointment does (ADR 0099 § 1); the server
            looks the account up by the address it already holds and stores nothing new.
          type: string
          format: email
          description: The account's address.
          maxLength: 254
          example: member@example.com
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Email @field:jakarta.validation.constraints.Size(max = 254)'
        caseId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The case the block answers (a moderator's proposal); null for none.
          example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b
        overContent:
          x-veyq-visibility: flag
          type: boolean
          default: false
          description: >
            The Server Owner says a block with no case and no open proposal is over content, so it carries a statement
            (ADR 0093 § 7). A block that answers a case or a proposal is over content regardless.
          example: false
        statement:
          description: The statement of reasons the block carries when it is over content; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/ServerOwnerStatementInput"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    InstanceRelease:
      type: object
      description: >
        The running instance's release identity. One field, because a second one would only restate it:
        `release: null` already says "this build carries no release stamp", and a separate boolean would be a
        second way to say the same thing — which is a way to say the opposite when the two disagree.
      required: [release]
      properties:
        release:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The release version the running image was stamped with at publish, and the tag the image carries
            in the registry (ADR 0057 §1): `<major>.<minor>` for a release, or `<major>.<minor>-SNAPSHOT` for a
            snapshot. The major is this repository's VERSION file at the commit that published it, the minor the
            number of commits since VERSION last changed. A release onto an existing tag fails rather than
            replacing it, which is what makes `<major>.<minor>` a rollback target rather than a label on a moving
            artifact. A snapshot's name is the one that moves: publishing that commit again replaces it, so it is
            never a rollback target.

            `null` when the running build was never published — a locally built image or a `quarkusDev` run.
            That is reported as the absence it is, never as a placeholder.
          maxLength: 32
          example: "1.0"

    InstanceStoreProvisioning:
      type: object
      description: >
        How far veyq has got with bringing the configured object store from *running* to *usable*
        (ADR 0067). Server self-description, not user data: it describes the operator's own infrastructure,
        never anything in it.
      required: [state]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: >
            The provisioning outcome, in the terms of what the operator does next. Every state the background
            runner can be in has a value here, including the two that are not outcomes at all.

            `NOT_ATTEMPTED` = the store connection declares `type: s3`, so veyq never attempts vendor bring-up
            (ADR 0067 Decision 1 — an unknown store is never poked). This is a **correct, permanent** answer
            and not a failure: the operator prepared the bucket themselves, and nothing here will ever change.
            `IN_PROGRESS` = a bring-up is running or waiting to retry. Uploads may fail until it finishes;
            wait, and read again. `PROVISIONED` = the store is usable — layout, bucket, key, grant and CORS
            policy are all in place. `FAILED` = the bounded retries are exhausted and veyq has given up
            (ADR 0067 Decision 3). Blob transfer stays broken until the store is repaired and then either checked
            (`POST /api/instance/store/check` provisions a Garage store again; a pass moves this to `PROVISIONED`)
            or the server restarted; the log carries which call failed.
          enum: [NOT_ATTEMPTED, IN_PROGRESS, PROVISIONED, FAILED]
          example: PROVISIONED

    InstanceConfigSecret:
      type: object
      description: >
        Whether the instance's config-secret key can open the operator secrets sealed under it (ADR 0050).
        Server self-description, not user data: a state, never the key, its fingerprint or a sealed value.
      required: [state]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: >
            `OK` = a key is present, and it is the one the stored secrets were sealed under — or nothing has
            been sealed yet, so there is nothing it could fail to open. `ABSENT` = no key is available: it could
            not be generated, or the application cannot read the file (a restored key file that is not readable
            by the runtime user reads as this). Sealing is unavailable, and member invites and password resets
            refuse with `503` until it is fixed (ADR 0055). `MISMATCH` = a key is present but is **not** the
            one the stored secrets were sealed under — the key file was lost, replaced or not restored. The
            sealed secrets cannot be opened; restore the key file, or re-enter each secret to seal it under the
            current key. Content is unaffected either way: this key seals operator configuration, never content.
          enum: [OK, ABSENT, MISMATCH]
          example: OK

    InstanceStore:
      type: object
      description: >
        The object-store setting as it stands (ADR 0089). Operator configuration and server self-description:
        it describes the operator's own infrastructure, never anything in it, and never carries a secret.
      required: [bundledAvailable, blobsStored, setting, lastCheck, pending]
      properties:
        bundledAvailable:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether this deployment offers a bundled store (its recipe passed the bundled-store hint). Only then
            can `bundled: true` be chosen.
          example: true
        blobsStored:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether any blob is stored. Once true, the store's type, endpoint and bucket are fixed (ADR 0089
            decision 6).
          example: false
        setting:
          description: >
            The setting in use — the one the backend signs against — or null when no setting has passed its check
            yet.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreSetting"
            - type: "null"
        lastCheck:
          description: The last check of the setting in use, or null when there is none.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreCheck"
            - type: "null"
        pending:
          description: >
            A changed setting saved but not yet in use, with its own last check; null when nothing is pending.
            It replaces `setting` once it passes its check (ADR 0089 decision 5).
          oneOf:
            - $ref: "#/components/schemas/InstanceStorePending"
            - type: "null"

    InstanceStorePending:
      type: object
      description: >
        A store setting saved but not in use until it passes its own check (ADR 0089 decision 5). Operator
        configuration, never a secret.
      required: [setting, lastCheck]
      properties:
        setting:
          $ref: "#/components/schemas/InstanceStoreSetting"
        lastCheck:
          description: The last check of the pending setting, or null when it has not been checked since it was saved.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreCheck"
            - type: "null"

    InstanceStoreSetting:
      type: object
      description: >
        A store setting as read back. For the bundled store the connection fields are the bundled store's own,
        read from the deployment's hint; the setting itself stores only that the bundled store was chosen.
      required: [bundled, type, endpoint, publicEndpoint, bucket, region, accessKey, garageAdminEndpoint,
        secretKeySet, garageAdminTokenSet, unreadable]
      properties:
        bundled:
          x-veyq-visibility: flag
          type: boolean
          description: Whether this is the store the deployment brings (a reference to its hint).
          example: false
        type:
          $ref: "#/components/schemas/InstanceStoreType"
        endpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The S3 endpoint the backend reaches the store at (operator infrastructure config). Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 2048
          example: https://s3.eu-central-1.example.com
        publicEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The origin browsers fetch the store's objects from, when it is not `endpoint` itself; null when the
            store is reached by browsers at `endpoint`. Presigned URLs are signed for it.
          maxLength: 2048
          example: null
        bucket:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The bucket the blobs are stored in. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 63
          example: veyq-blobs
        region:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The region the store signs for. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 64
          example: eu-central-1
        accessKey:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The access key id — an identifier, like an SMTP username; the secret key is never returned. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 256
          example: AKIAEXAMPLE
        garageAdminEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Garage's admin API endpoint, through which veyq provisions it; null for an S3-compatible store.
          maxLength: 2048
          example: null
        secretKeySet:
          x-veyq-visibility: flag
          type: boolean
          description: Whether a secret key is stored — the key itself is never returned.
          example: true
        garageAdminTokenSet:
          x-veyq-visibility: flag
          type: boolean
          description: Whether a Garage admin token is stored — the token itself is never returned.
          example: false
        unreadable:
          type: array
          description: >
            The stored secrets that cannot be opened: no config-secret key is available, or it is not the one
            that sealed them (the fingerprint each sealed value carries differs). Re-entering a listed value
            seals it under the current key. Media stay unreachable until then — nothing is lost (ADR 0089
            decision 4). Always empty for the bundled store, whose secrets are the deployment's.
          maxItems: 2
          items:
            $ref: "#/components/schemas/InstanceStoreSecret"

    InstanceStoreType:
      x-veyq-visibility: enum
      type: string
      description: >
        `S3` = any S3-compatible store, the default: veyq writes into the bucket it is pointed at and never
