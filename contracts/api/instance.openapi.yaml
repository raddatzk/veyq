              example:
                host: smtp.example.com
                port: 587
                from: veyq@example.com
                username: veyq
                tls: true
                passwordSet: true
                configSecretState: OK
                address: owner@example.com
                confirmation: CODE_SENT
                confirmedAt: null
        "400":
          description: The request was malformed (invalid host, port, from or username), or a host was given without a from address. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "503":
          description: >
            A password was supplied, but no config-secret key is available to seal it (ADR 0050). Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
