openapi: 3.1.0
info:
  title: veyq Instance API
  version: 0.1.0
  description: >
    Operational reads about the running instance itself, for the **Server Owner**. This is the operator's
    view of the software — which bits are running — and not the client's view of the protocol.

    The two share one major and differ in precision (ADR 0057 §4, ADR 0085 decision 1). The pre-auth
    `GET /api/setup` advertises `version: { major, build }`, which answers *can this client and this server
    talk to each other?* and must be readable before login because that is where its gate fires. The
    **release version** here, `<major>.<minor>`, answers *which bits are running, and what do I roll back to?*
    — and its minor stays authenticated and Server-Owner-only,
    because a precise release number is what maps an instance to a list of known vulnerabilities, and a
    self-hosted instance is the kind that upgrades late. The capability manifest already discloses this
    instance's feature set to any visitor; the release number does not become public with it.

    Nothing here is user content: a release version is a property of the software. Operator-blindness is
    untouched — this value ends up disclosed to *fewer* parties than the capability manifest already is.

    The object store and the capability switches are the **settings** here (ADR 0089): the Server Owner sets
    them on the admin channel instead of in environment variables. The store describes the operator's own
    infrastructure; the store it names holds ciphertext only, and its secrets are sealed server-side and never
    returned. A capability switch is instance configuration and carries no member data (ADR 0088 decision 12).
    Authorization is enforced by code annotations, not this spec (ADR 0008).
tags:
  - name: instance
    description: >
      Server-Owner reads and settings of the running instance (release identity, store provisioning,
      config-secret state, the object-store setting and its check, the capability switches). One tag = one
      resource interface owning the whole `/api/instance` subtree.

# x-veyq-channel: admin marks an operation that answers only on the backend's admin listener, i.e. only for a
# request that came through the admin container; the public port 404s it. Reachability, not a role: the role
# stays in code (ADR 0008). The backend derives its set from this marker at build time, and a posture sweep
# holds every Server-Owner-gated operation to it — docs/decisions/0065-admin-ui-cli-separate-service.md.
paths:
  /api/instance/release:
    get:
      tags: [instance]
      operationId: getInstanceRelease
      x-veyq-channel: admin
      summary: Report the release version the running image was stamped with.
      description: >
        Returns the release the running image was published under — the rollback target an upgrade needs to be
        able to name (uc.admin.identify-instance-release, ADR 0056 §6). Server-Owner only.

        This answers what is **running**, which is not the same question as what a compose file **pins**: the
        two diverge after a pull that was never restarted, or a restart that silently reused a cached image —
        the case where an upgrade appears to have happened and did not.

        A build that was never published carries no stamp, and the answer says so (`release: null`) rather
        than synthesising a number. Absence is a first-class answer here: every consumer of this value uses it
        to choose an image to start, so a fabricated version is the one an operator would try to roll back to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The release version of the running instance, or its explicit absence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceRelease" }
              examples:
                published:
                  summary: An image produced by the release pipeline
                  value: { release: "1.0" }
                unstamped:
                  summary: A locally built image or a quarkusDev run — never published, so never stamped
                  value: { release: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store-provisioning:
    get:
      tags: [instance]
      operationId: getInstanceStoreProvisioning
      x-veyq-channel: admin
      summary: Report whether the object store has been brought from running to usable.
      description: >
        Returns how far veyq has got with provisioning the configured object store
        ([ADR 0067](../../docs/decisions/0067-store-provisioning-from-a-declared-type.md)). Server-Owner only.

        This exists because provisioning deliberately **does not gate the boot**: it reaches another container
        over the network, and a startup observer that can fail on an unreachable dependency is how
        [ADR 0063](../../docs/decisions/0063-database-driven-tenant-ingress.md) restart-looped a production
        stack into serving nothing. So an instance whose store is not yet usable starts anyway, answers
        `GET /api/setup`, and looks healthy — and without this read the failure would first reach the operator
        as a file that will not upload.

        The value is server self-description and holds no user content. It says what the operator can **do**,
        never what the code did; the reason a bring-up failed stays in the log, because the four answers below
        already separate the four different things an operator does next.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: How far provisioning has got on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStoreProvisioning" }
              examples:
                provisioned:
                  summary: The bundled store was brought up and is usable
                  value: { state: PROVISIONED }
                notAttempted:
                  summary: An `s3` store — the operator owns its bring-up, and veyq never pokes it
                  value: { state: NOT_ATTEMPTED }
                failed:
                  summary: The bounded retries ran out; blob uploads and downloads will not work until the store is fixed
                  value: { state: FAILED }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/config-secret:
    get:
      tags: [instance]
      operationId: getInstanceConfigSecret
      x-veyq-channel: admin
      summary: Report whether the config-secret key can open the secrets sealed under it.
      description: >
        Returns the instance's config-secret state
        ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)) for the Server Owner, who
        owns no tenant and so cannot read it through a tenant's mail settings. Server-Owner only.

        This is the verification step of a restore and an upgrade
        ([ADR 0056](../../docs/decisions/0056-instance-durable-state-and-cold-logical-backup.md) §5): the
        fingerprint comparison is the only check that tells a restore that carried its key from one that lost
        it, and an instance that lost it looks healthy — it serves content and refuses member invites and
        password resets.

        **Reading changes nothing.** An instance that has not yet recorded the fingerprint of its key keeps not
        having one; the fingerprint is recorded where a secret is sealed or first used, never by this read. The
        value is server self-description — a state, never key material, a fingerprint or a sealed value.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The config-secret state of the running instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceConfigSecret" }
              examples:
                ok:
                  summary: The key is present and is the one the stored secrets were sealed under
                  value: { state: OK }
                mismatch:
                  summary: A restore that did not carry the key file — the instance starts and refuses invites
                  value: { state: MISMATCH }
                absent:
                  summary: No key is available — it could not be generated or cannot be read
                  value: { state: ABSENT }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store:
    get:
      tags: [instance]
      operationId: getInstanceStore
      x-veyq-channel: admin
      summary: Read the object-store setting in use, a pending change and its check, and whether a bundled store is offered.
      description: >
        The object store is a Server-Owner setting held in the database, not in the environment
        ([ADR 0089](../../docs/decisions/0089-instance-settings-live-in-admin-web-the-environment-only-bootstraps.md)).
        This returns the setting in use (or its absence) with the result of the last check of **that** setting,
        a changed setting that is saved but not yet in use (`pending`, decision 5) with its own last check,
        whether a bundled store is offered by the deployment, and whether blobs already exist — after which the
        store's type, endpoint and bucket are fixed. Server-Owner only.

        Secrets are never returned: the secret key and the Garage admin token are reported as set or not, and
        as readable or not — a value sealed under a config-secret key that is absent or is not the one that
        sealed it ([ADR 0050](../../docs/decisions/0050-operator-config-secret-encryption.md)) is listed in
        `unreadable`, so the console can ask for it again. The store holds ciphertext only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The store setting as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              examples:
                unset:
                  summary: A fresh install of the bundled recipe — nothing chosen yet, the bundled store offered
                  value: { bundledAvailable: true, blobsStored: false, setting: null, lastCheck: null, pending: null }
                bundledChecked:
                  summary: The bundled store chosen and checked
                  value:
                    bundledAvailable: true
                    blobsStored: true
                    setting:
                      bundled: true
                      type: GARAGE
                      endpoint: http://garage:3900
                      publicEndpoint: https://veyq.example.com
                      bucket: blobs
                      region: garage
                      accessKey: GK0123456789abcdef01234567
                      garageAdminEndpoint: http://garage:3903
                      secretKeySet: true
                      garageAdminTokenSet: true
                      unreadable: []
                    lastCheck:
                      passed: true
                      checkedAt: 2026-10-15T12:00:00Z
                      steps:
                        - { step: CREDENTIALS, outcome: PASSED, detail: null }
                        - { step: PROVISION, outcome: PASSED, detail: null }
                        - { step: BUCKET, outcome: PASSED, detail: null }
                        - { step: PROBE_PUT, outcome: PASSED, detail: null }
                        - { step: PROBE_GET, outcome: PASSED, detail: null }
                        - { step: CORS, outcome: SKIPPED, detail: "The store is served on each tenant's own domain, so no browser request to it is cross-origin." }
                    pending: null
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
    put:
      tags: [instance]
      operationId: setInstanceStore
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the form shows the whole setting it sends, and secrets it leaves out are
          kept rather than overwritten.
      x-veyq-channel: admin
      summary: Save a store setting — the bundled one, or an S3-compatible or Garage store — to be checked before it is used.
      description: >
        Saves the setting as `pending` and changes nothing the instance does (ADR 0089 decision 5): the store
        the backend signs against, the store origin in the app shell's CSP and the store route in the tenant
        ingress keep following the setting in use until the pending one passes its own check
        (`POST /api/instance/store/check`), which then replaces it at once, without a restart. A typo therefore
        never reaches a running instance's media. On a fresh instance there is no setting in use, so uploads and
        tenant creation wait for the first passed check. A later write replaces the pending setting; a write
        equal to the setting in use discards it. Server-Owner only.

        `bundled: true` chooses the store the deployment brings and stores a **reference** to it, not a copy of
        its secrets (decision 3); every other field must then be absent. Otherwise `type` and the connection
        fields are required; `secretKey` (and, for Garage, `garageAdminToken`) are write-only and sealed under
        the config-secret key with the fingerprint of that key (decision 4) — omit one to keep the stored value
        (the pending setting's, else the one in use).

        Once blobs exist, changing the type, endpoint or bucket away from the setting in use is refused: moving an
        instance's blobs to another store is not something this does (decision 6). Credentials and the public
        endpoint may change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceStoreUpdate" }
            examples:
              bundled:
                summary: Use the bundled store
                value: { bundled: true }
              s3:
                summary: An S3-compatible store of the operator's own
                value:
                  bundled: false
                  type: S3
                  endpoint: https://s3.eu-central-1.example.com
                  publicEndpoint: null
                  bucket: veyq-blobs
                  region: eu-central-1
                  accessKey: AKIAEXAMPLE
                  secretKey: example-secret-key
      responses:
        "200":
          description: The setting was saved as pending (or, equal to the one in use, discarded the pending one); the store as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              example:
                bundledAvailable: false
                blobsStored: false
                setting: null
                lastCheck: null
                pending:
                  setting:
                    bundled: false
                    type: S3
                    endpoint: https://s3.eu-central-1.example.com
                    publicEndpoint: null
                    bucket: veyq-blobs
                    region: eu-central-1
                    accessKey: AKIAEXAMPLE
                    garageAdminEndpoint: null
                    secretKeySet: true
                    garageAdminTokenSet: false
                    unreadable: []
                  lastCheck: null
        "400":
          description: >
            The request was malformed, or its fields do not form a setting: `bundled: true` with any other field,
            or a store without its type, endpoint, bucket, region, access key or (when none is stored yet) secret
            key, or a Garage store without its admin endpoint or token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: >
            `no_bundled_store` = `bundled: true`, but this deployment offers no bundled store. `store_in_use` =
            blobs already exist and the request changes the type, endpoint or bucket of the store in use. Nothing
            is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                noBundledStore:
                  value: { code: no_bundled_store }
                storeInUse:
                  value: { code: store_in_use }
        "503":
          description: >
            A secret was supplied, but no config-secret key is available to seal it (ADR 0050). Nothing is
            stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: store_secret_unavailable }

  /api/instance/store/pending:
    delete:
      tags: [instance]
      operationId: discardPendingInstanceStore
      x-veyq-channel: admin
      summary: Discard the pending store setting; the one in use stays.
      description: >
        Drops the changed setting that is saved but not in use (ADR 0089 decision 5), with its check. The
        setting in use, and everything that follows it, is untouched. Idempotent: with nothing pending it changes
        nothing. Server-Owner only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nothing is pending any more; the store as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStore" }
              example: { bundledAvailable: true, blobsStored: false, setting: null, lastCheck: null, pending: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/store/check:
    post:
      tags: [instance]
      operationId: checkInstanceStore
      x-veyq-channel: admin
      summary: Check the pending store setting, or with none pending the one in use, step by step.
      description: >
        Runs the check of ADR 0089 decision 2 against the pending setting when there is one, else against the
        setting in use, and stores its result, which `GET /api/instance/store` returns beside that setting. A
        pending setting that **passes** replaces the one in use at once, without a restart (decision 5): the
        store the backend signs against, the app shell's CSP and the tenant ingress follow it from then on. One
        that fails stays pending, and the setting in use is untouched. Server-Owner only.

        The steps run in order and stop at the first failure; every later step reports `SKIPPED`.
        `CREDENTIALS` = the sealed secrets can be opened under the current config-secret key. `PROVISION` (Garage
        only) = veyq brought the store up: layout, bucket, key, grant and CORS policy
        ([ADR 0067](../../docs/decisions/0067-store-provisioning-from-a-declared-type.md)); for an S3-compatible
        store it is `SKIPPED`, because an unknown store is never provisioned. `BUCKET` = the bucket exists (the
        check never creates one). `PROBE_PUT` and `PROBE_GET` = one fixed probe object under a `veyq-check/` key is
        written through a presigned PUT and read back through a presigned GET, against the public endpoint the
        browsers use; it is overwritten by every check and never deleted. `CORS` = a preflight sent with the
        instance's public origin is answered with that origin — `SKIPPED` where the store is served on the
        tenants' own domains and nothing is cross-origin.

        Writing the probe object into the bucket veyq was pointed at is its ordinary data plane; creating a
        bucket or writing a CORS policy is provisioning, which this never does to an S3-compatible store.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The check ran; whether it passed, and each step's outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStoreCheck" }
              examples:
                noBucket:
                  summary: The bucket the setting names does not exist
                  value:
                    passed: false
                    checkedAt: 2026-10-15T12:00:00Z
                    steps:
                      - { step: CREDENTIALS, outcome: PASSED, detail: null }
                      - { step: PROVISION, outcome: SKIPPED, detail: "An S3-compatible store is never provisioned by veyq." }
                      - { step: BUCKET, outcome: FAILED, detail: "The bucket veyq-blobs does not exist (HTTP 404)." }
                      - { step: PROBE_PUT, outcome: SKIPPED, detail: null }
                      - { step: PROBE_GET, outcome: SKIPPED, detail: null }
                      - { step: CORS, outcome: SKIPPED, detail: null }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "409":
          description: No store is set or pending, so there is nothing to check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: store_not_configured }

  /api/instance/capabilities:
    get:
      tags: [instance]
      operationId: listInstanceCapabilities
      x-veyq-channel: admin
      summary: List the capability register with each entry's words and its switch.
      description: >
        Returns every entry of the capability register (`contracts/platform/capabilities.json`, ADR 0088) in
        catalog order, where a parent comes before its children. Server-Owner only.

        Each entry carries its words as the catalog holds them, in English and German (decision 13): its
        `title`, what it is for (`purpose`), and what switching it off does to what is new and to what exists
        (`whenOff`). A client renders them in its own locale and keeps no copy of its own.

        `off` is the entry's own switch, as the Server Owner set it. `effective` is whether the entry is active:
        it and every ancestor entry are on (the AND along the path, decision 2). So a child of a switched-off
        parent reads `off: false, effective: false`, and switching the parent back on brings it back. An entry is
        listed in `GET /api/setup`'s manifest exactly when it is `effective` here.

        The register is instance configuration: nothing here is member data, and every entry is listed whether
        or not any member uses it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every entry of the register, in catalog order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstanceCapability" }
              example:
                - id: core.public-shares
                  title: { en: "Public links", de: "Öffentliche Links" }
                  purpose: { en: "Members can share what is in a space through a link …", de: "Mitglieder können Inhalte eines Bereichs über einen Link teilen …" }
                  whenOff: { en: "No new public link of any kind can be made …", de: "Es lässt sich kein neuer öffentlicher Link mehr anlegen …" }
                  "off": true
                  effective: false
                  tenantSwitchable: true
                  requirements: []
                - id: core.public-shares.contribute
                  title: { en: "Links to look and add", de: "Links zum Ansehen und Hinzufügen" }
                  purpose: { en: "A public link whose guests can add to what they see …", de: "Ein öffentlicher Link, über den Gäste …" }
                  whenOff: { en: "No new link of this kind can be made …", de: "Es lässt sich kein neuer Link dieser Art anlegen …" }
                  "off": false
                  effective: false
                  tenantSwitchable: true
                  requirements: []
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }

  /api/instance/capabilities/{capabilityId}:
    put:
      tags: [instance]
      operationId: setInstanceCapability
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries one entry's own switch, never the whole set, so two
          console tabs switching different entries cannot overwrite each other, and on the same entry the later
          write is the one the owner made last.
      x-veyq-channel: admin
      summary: Switch one capability entry off or back on.
      description: >
        Sets the entry's own switch and applies it at once, without a restart (ADR 0088 decision 12): the
        manifest of `GET /api/setup` follows it, and so does every gate on the entry and, by the AND along the
        path, on its children. Writing the state the entry already has changes nothing and answers the same.
        Server-Owner only.

        What off does is the entry's `whenOff` (decision 5). A feature switch refuses only what is new
        (`422 capability_disabled` at the creating endpoint) and leaves what exists alone. A device switch acts at
        once: while `core.remember-device` is effectively off, `GET /api/account/key-material` withholds every
        `DEVICE` wrap, and while `core.remember-device.passwordless` is effectively off, every `DEVICE_KEY` wrap.
        Nothing is deleted, so switching back on restores what was there, and the `PASSWORD` wrap is always
        served, so no member is locked out.

        Only the switch is stored, never who uses the entry. The entry as it now stands is returned, with
        `effective` computed as `listInstanceCapabilities` does.
      security:
        - bearerAuth: []
      parameters:
        - name: capabilityId
          in: path
          required: true
          description: The entry's id, as the catalog spells it.
          schema:
            type: string
            maxLength: 64
            example: core.remember-device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceCapabilityUpdate" }
            examples:
              switchOff:
                summary: Switch the entry off
                value: { "off": true }
              switchOn:
                summary: Switch it back on
                value: { "off": false }
      responses:
        "200":
          description: The switch was stored and applied; the entry as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceCapability" }
              example:
                id: core.remember-device
                title: { en: "Remembered devices", de: "Gemerkte Geräte" }
                purpose: { en: "A device a member has signed in on can keep a key of its own …", de: "Ein Gerät, auf dem sich ein Mitglied angemeldet hat …" }
                whenOff: { en: "No device can be newly remembered …", de: "Kein Gerät lässt sich neu merken …" }
                "off": true
                effective: false
                tenantSwitchable: false
                requirements: []
        "400":
          description: The request was malformed, or `off` is missing. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: No catalog entry has this id. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: capability_not_found }

  /api/instance/capabilities/{capabilityId}/requirements/{requirement}:
    put:
      tags: [instance]
      operationId: setInstanceCapabilityRequirement
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: the Server Owner; the write carries one requirement's value, never the register, and the later
          write on the same requirement is the one the owner made last.
      x-veyq-channel: admin
      summary: Set one requirement on a capability entry for the instance.
      description: >
        Sets the instance's value of one requirement (ADR 0088 decision 8): a flag (`1`) or a number of days (1 to
        3650), as the catalog's `kind` says. It acts at once, without a restart: every client reads the value with the
        capability, and every gate refuses what does not meet it, existing links and sessions included as the
        requirement's `whenSet` says. The effective value, per tenant, is the strictest of the instance's and the
        tenant's. Server-Owner only. Returns the entry as it now stands.
      security:
        - bearerAuth: []
      parameters:
        - name: capabilityId
          in: path
          required: true
          description: The entry's id, as the catalog spells it.
          schema: { type: string, maxLength: 64, example: core.public-shares }
        - name: requirement
          in: path
          required: true
          description: The requirement's name, as the catalog spells it.
          schema: { type: string, maxLength: 64, example: linkMaxDays }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceCapabilityRequirementUpdate" }
            example: { value: 30 }
      responses:
        "200":
          description: The value was stored and applied; the entry as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceCapability" }
        "400":
          description: The request was malformed, or the value does not fit the requirement's kind (a flag is `1`, days 1–3650). Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: The entry has no requirement of this name (`requirement_not_found`). Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: requirement_not_found }
    delete:
      tags: [instance]
      operationId: clearInstanceCapabilityRequirement
      x-veyq-channel: admin
      summary: Clear one requirement on a capability entry for the instance.
      description: >
        Removes the instance's value: the requirement is then in effect only where a tenant set it. Everything it
        refused serves again, because nothing was written onto a link or a session. Clearing one that is not set
        changes nothing and answers the same. Server-Owner only. Returns the entry as it now stands.
      security:
        - bearerAuth: []
      parameters:
        - name: capabilityId
          in: path
          required: true
          description: The entry's id, as the catalog spells it.
          schema: { type: string, maxLength: 64, example: core.public-shares }
        - name: requirement
          in: path
          required: true
          description: The requirement's name, as the catalog spells it.
          schema: { type: string, maxLength: 64, example: linkMaxDays }
      responses:
        "200":
          description: The value is cleared; the entry as it now stands is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceCapability" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is authenticated but is not the Server Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_server_owner }
        "404":
          description: The entry has no requirement of this name (`requirement_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: requirement_not_found }

components:
  schemas:
    InstanceRelease:
      type: object
      description: >
        The running instance's release identity. One field, because a second one would only restate it:
        `release: null` already says "this build carries no release stamp", and a separate boolean would be a
        second way to say the same thing — which is a way to say the opposite when the two disagree.
      required: [release]
      properties:
        release:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The release version the running image was stamped with at publish, and the tag the image carries
            in the registry (ADR 0057 §1): `<major>.<minor>` for a release, or `<major>.<minor>-SNAPSHOT` for a
            snapshot. The major is this repository's VERSION file at the commit that published it, the minor the
            number of commits since VERSION last changed. A release onto an existing tag fails rather than
            replacing it, which is what makes `<major>.<minor>` a rollback target rather than a label on a moving
            artifact. A snapshot's name is the one that moves: publishing that commit again replaces it, so it is
            never a rollback target.

            `null` when the running build was never published — a locally built image or a `quarkusDev` run.
            That is reported as the absence it is, never as a placeholder.
          maxLength: 32
          example: "1.0"

    InstanceStoreProvisioning:
      type: object
      description: >
        How far veyq has got with bringing the configured object store from *running* to *usable*
        (ADR 0067). Server self-description, not user data: it describes the operator's own infrastructure,
        never anything in it.
      required: [state]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: >
            The provisioning outcome, in the terms of what the operator does next. Every state the background
            runner can be in has a value here, including the two that are not outcomes at all.

            `NOT_ATTEMPTED` = the store connection declares `type: s3`, so veyq never attempts vendor bring-up
            (ADR 0067 Decision 1 — an unknown store is never poked). This is a **correct, permanent** answer
            and not a failure: the operator prepared the bucket themselves, and nothing here will ever change.
            `IN_PROGRESS` = a bring-up is running or waiting to retry. Uploads may fail until it finishes;
            wait, and read again. `PROVISIONED` = the store is usable — layout, bucket, key, grant and CORS
            policy are all in place. `FAILED` = the bounded retries are exhausted and veyq has given up
            (ADR 0067 Decision 3). Blob transfer stays broken until the store is repaired and then either checked
            (`POST /api/instance/store/check` provisions a Garage store again; a pass moves this to `PROVISIONED`)
            or the server restarted; the log carries which call failed.
          enum: [NOT_ATTEMPTED, IN_PROGRESS, PROVISIONED, FAILED]
          example: PROVISIONED

    InstanceConfigSecret:
      type: object
      description: >
        Whether the instance's config-secret key can open the operator secrets sealed under it (ADR 0050).
        Server self-description, not user data: a state, never the key, its fingerprint or a sealed value.
      required: [state]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: >
            `OK` = a key is present, and it is the one the stored secrets were sealed under — or nothing has
            been sealed yet, so there is nothing it could fail to open. `ABSENT` = no key is available: it could
            not be generated, or the application cannot read the file (a restored key file that is not readable
            by the runtime user reads as this). Sealing is unavailable, and member invites and password resets
            refuse with `503` until it is fixed (ADR 0055). `MISMATCH` = a key is present but is **not** the
            one the stored secrets were sealed under — the key file was lost, replaced or not restored. The
            sealed secrets cannot be opened; restore the key file, or re-enter each secret to seal it under the
            current key. Content is unaffected either way: this key seals operator configuration, never content.
          enum: [OK, ABSENT, MISMATCH]
          example: OK

    InstanceStore:
      type: object
      description: >
        The object-store setting as it stands (ADR 0089). Operator configuration and server self-description:
        it describes the operator's own infrastructure, never anything in it, and never carries a secret.
      required: [bundledAvailable, blobsStored, setting, lastCheck, pending]
      properties:
        bundledAvailable:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether this deployment offers a bundled store (its recipe passed the bundled-store hint). Only then
            can `bundled: true` be chosen.
          example: true
        blobsStored:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether any blob is stored. Once true, the store's type, endpoint and bucket are fixed (ADR 0089
            decision 6).
          example: false
        setting:
          description: >
            The setting in use — the one the backend signs against — or null when no setting has passed its check
            yet.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreSetting"
            - type: "null"
        lastCheck:
          description: The last check of the setting in use, or null when there is none.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreCheck"
            - type: "null"
        pending:
          description: >
            A changed setting saved but not yet in use, with its own last check; null when nothing is pending.
            It replaces `setting` once it passes its check (ADR 0089 decision 5).
          oneOf:
            - $ref: "#/components/schemas/InstanceStorePending"
            - type: "null"

    InstanceStorePending:
      type: object
      description: >
        A store setting saved but not in use until it passes its own check (ADR 0089 decision 5). Operator
        configuration, never a secret.
      required: [setting, lastCheck]
      properties:
        setting:
          $ref: "#/components/schemas/InstanceStoreSetting"
        lastCheck:
          description: The last check of the pending setting, or null when it has not been checked since it was saved.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreCheck"
            - type: "null"

    InstanceStoreSetting:
      type: object
      description: >
        A store setting as read back. For the bundled store the connection fields are the bundled store's own,
        read from the deployment's hint; the setting itself stores only that the bundled store was chosen.
      required: [bundled, type, endpoint, publicEndpoint, bucket, region, accessKey, garageAdminEndpoint,
        secretKeySet, garageAdminTokenSet, unreadable]
      properties:
        bundled:
          x-veyq-visibility: flag
          type: boolean
          description: Whether this is the store the deployment brings (a reference to its hint).
          example: false
        type:
          $ref: "#/components/schemas/InstanceStoreType"
        endpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The S3 endpoint the backend reaches the store at (operator infrastructure config). Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 2048
          example: https://s3.eu-central-1.example.com
        publicEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The origin browsers fetch the store's objects from, when it is not `endpoint` itself; null when the
            store is reached by browsers at `endpoint`. Presigned URLs are signed for it.
          maxLength: 2048
          example: null
        bucket:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The bucket the blobs are stored in. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 63
          example: veyq-blobs
        region:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The region the store signs for. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 64
          example: eu-central-1
        accessKey:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            The access key id — an identifier, like an SMTP username; the secret key is never returned. Null only for a bundled store whose deployment no longer passes its hint.
          maxLength: 256
          example: AKIAEXAMPLE
        garageAdminEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Garage's admin API endpoint, through which veyq provisions it; null for an S3-compatible store.
          maxLength: 2048
          example: null
        secretKeySet:
          x-veyq-visibility: flag
          type: boolean
          description: Whether a secret key is stored — the key itself is never returned.
          example: true
        garageAdminTokenSet:
          x-veyq-visibility: flag
          type: boolean
          description: Whether a Garage admin token is stored — the token itself is never returned.
          example: false
        unreadable:
          type: array
          description: >
            The stored secrets that cannot be opened: no config-secret key is available, or it is not the one
            that sealed them (the fingerprint each sealed value carries differs). Re-entering a listed value
            seals it under the current key. Media stay unreachable until then — nothing is lost (ADR 0089
            decision 4). Always empty for the bundled store, whose secrets are the deployment's.
          maxItems: 2
          items:
            $ref: "#/components/schemas/InstanceStoreSecret"

    InstanceStoreType:
      x-veyq-visibility: enum
      type: string
      description: >
        `S3` = any S3-compatible store, the default: veyq writes into the bucket it is pointed at and never
        provisions it (ADR 0067 decision 1). `GARAGE` = a Garage store veyq provisions through its admin API.
      enum: [S3, GARAGE]
      example: S3

    InstanceStoreSecret:
      x-veyq-visibility: enum
      type: string
      description: A store secret held sealed by the server.
      enum: [SECRET_KEY, GARAGE_ADMIN_TOKEN]
      example: SECRET_KEY

    InstanceStoreUpdate:
      type: object
      description: >
        The store setting to apply. Either `bundled: true` alone, or a store of the operator's own. Which
        combinations form a setting is checked by the server (a mismatch is `400 invalid_request`).
      required: [bundled]
      properties:
        bundled:
          x-veyq-visibility: flag
          # nullable type + @NotNull: a required primitive binds a missing field to false (backend/CLAUDE.md)
          type: [boolean, "null"]
          description: Choose the store the deployment brings. Every other field must then be absent.
          example: false
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        type:
          description: The store's type; required unless `bundled`.
          oneOf:
            - $ref: "#/components/schemas/InstanceStoreType"
            - type: "null"
        endpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The S3 endpoint the backend reaches the store at; an `http` or `https` URL.
          maxLength: 2048
          example: https://s3.eu-central-1.example.com
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048)'
        publicEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The origin browsers fetch objects from, when it is not `endpoint`; an `http` or `https` URL.
          maxLength: 2048
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048)'
        bucket:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The bucket; it must already exist on an S3-compatible store (the check never creates one).
          maxLength: 63
          example: veyq-blobs
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 63)'
        region:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The region the store signs for.
          maxLength: 64
          example: eu-central-1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 64)'
        accessKey:
          x-veyq-visibility: public
          type: [string, "null"]
          description: The access key id.
          maxLength: 256
          example: AKIAEXAMPLE
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256)'
        secretKey:
          x-veyq-visibility: token
          type: [string, "null"]
          description: >
            WRITE-ONLY secret key; sealed at rest under the config-secret key with that key's fingerprint
            (ADR 0050, ADR 0089 decision 4), never returned or logged. Omit (or null) to keep the stored one.
          maxLength: 256
          example: example-secret-key
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256)'
        garageAdminEndpoint:
          x-veyq-visibility: public
          type: [string, "null"]
          description: Garage's admin API endpoint; required for `GARAGE`, absent otherwise.
          maxLength: 2048
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048)'
        garageAdminToken:
          x-veyq-visibility: token
          type: [string, "null"]
          description: >
            WRITE-ONLY Garage admin token; sealed like `secretKey`. Omit (or null) to keep the stored one.
          maxLength: 256
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256)'

    InstanceStoreCheck:
      type: object
      description: >
        The outcome of one check of the store setting (ADR 0089 decision 2). Server self-description about the
        operator's own infrastructure.
      required: [passed, checkedAt, steps]
      properties:
        passed:
          x-veyq-visibility: flag
          type: boolean
          description: Whether every step passed or was skipped as not applicable. Only then can a tenant be created.
          example: true
        checkedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the check ran.
          example: 2026-10-15T12:00:00Z
        steps:
          type: array
          description: Every step, in the order the check runs them.
          maxItems: 6
          items:
            $ref: "#/components/schemas/InstanceStoreCheckStep"

    InstanceStoreCheckStep:
      type: object
      required: [step, outcome, detail]
      properties:
        step:
          x-veyq-visibility: enum
          type: string
          description: The step, as described on `checkInstanceStore`.
          enum: [CREDENTIALS, PROVISION, BUCKET, PROBE_PUT, PROBE_GET, CORS]
          example: BUCKET
        outcome:
          x-veyq-visibility: enum
          type: string
          description: >
            `PASSED`; `FAILED` — the check stopped here; `SKIPPED` — not applicable to this store, or not run
            because an earlier step failed.
          enum: [PASSED, FAILED, SKIPPED]
          example: PASSED
        detail:
          x-veyq-visibility: public
          type: [string, "null"]
          description: >
            What the server observed, in its own words (a status code, the missing bucket's name) — about the
            operator's own store, never about anything in it. Null when there is nothing to add.
          maxLength: 1024
          example: null

    InstanceCapability:
      type: object
      description: >
        One entry of the capability register, with its words and its switch (ADR 0088). Instance configuration
        and server self-description: the texts are the catalog's, and nothing here is member data.
      # `off` is quoted wherever it is a key or a list item, in this schema, InstanceCapabilityUpdate and the
      # examples: a YAML 1.1 parser reads a bare `off` as the boolean false. PyYAML, which every contracts guard
      # reads the specs with, did exactly that, and saw a property named "false".
      required: [id, title, purpose, whenOff, "off", effective, tenantSwitchable, requirements]
      properties:
        id:
          x-veyq-visibility: public
          type: string
          description: >
            The entry's lowercase-dotted id, a path in the register tree (e.g. "core.remember-device.passwordless").
            Its parent is the id without its last segment; an id of two segments hangs from the root alone.
          maxLength: 64
          example: core.remember-device
        title:
          $ref: "#/components/schemas/InstanceCapabilityText"
        purpose:
          $ref: "#/components/schemas/InstanceCapabilityText"
        whenOff:
          $ref: "#/components/schemas/InstanceCapabilityText"
        "off":
          x-veyq-visibility: flag
          type: boolean
          description: The entry's own switch, as the Server Owner set it. A parent's switch does not change it.
          example: false
        effective:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the entry is active: it and every ancestor entry are on (the AND along the path). This is what
            the gates and the manifest follow.
          example: true
        tenantSwitchable:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether a tenant owner may switch the entry off for their own tenant as well (the catalog's `levels`,
            ADR 0088 decision 12). Such a tenant only narrows: an entry on here may still be off in a tenant, never
            the other way round. Entries offered before sign-in are the Server Owner's alone.
          example: true
        requirements:
          type: array
          description: >
            The entry's requirements (the catalog's, in its order; empty for most), each with its words and the
            instance's value (ADR 0088 decision 8).
          maxItems: 16
          items: { $ref: "#/components/schemas/InstanceCapabilityRequirement" }

    InstanceCapabilityText:
      type: object
      description: >
        One text of a register entry in each language the catalog carries (ADR 0088 decision 13). Both are
        always present.
      required: [en, de]
      properties:
        en:
          x-veyq-visibility: public
          type: string
          description: The English text.
          maxLength: 1024
          example: Remembered devices
        de:
          x-veyq-visibility: public
          type: string
          description: The German text.
          maxLength: 1024
          example: Gemerkte Geräte

    InstanceCapabilityRequirement:
      type: object
      description: >
        One requirement of a register entry (ADR 0088 decision 8) with its words and the instance's value.
      required: [name, kind, title, whenSet]
      properties:
        name:
          x-veyq-visibility: public
          type: string
          description: The requirement's name, unique in the catalog; also the property that carries it on `Capability`.
          maxLength: 64
          example: linkMaxDays
        kind:
          x-veyq-visibility: enum
          type: string
          enum: [flag, days]
          description: A flag (set or not, value `1`) or a number of days.
          example: days
        title:
          $ref: "#/components/schemas/InstanceCapabilityText"
        whenSet:
          $ref: "#/components/schemas/InstanceCapabilityText"
        value:
          x-veyq-visibility: measure
          type: [integer, "null"]
          description: The instance's value (`1` for a set flag, days for days); null while the instance sets none.
          example: 30

    InstanceCapabilityRequirementUpdate:
      type: object
      description: One requirement's value to store at the instance level.
      required: [value]
      properties:
        value:
          x-veyq-visibility: measure
          type: integer
          description: '`1` sets a flag; for days, the number of days, 1 to 3650.'
          minimum: 1
          maximum: 3650
          example: 30
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1) @field:jakarta.validation.constraints.Max(3650)'

    InstanceCapabilityUpdate:
      type: object
      description: The entry's own switch to store.
      required: ["off"]
      properties:
        "off":
          x-veyq-visibility: flag
          # nullable type + @NotNull: a required primitive binds a missing field to false (backend/CLAUDE.md)
          type: [boolean, "null"]
          description: True switches the entry off, false switches it back on.
          example: true
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque access token issued by login / refresh. Every operation here additionally requires the
        global Server-Owner role (enforced by code, not this spec).
