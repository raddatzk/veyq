    RotatedWrap:
      type: object
      description: >
        One cold wrap, rewritten to hold the **new** Master Key under the same secret it always took — password
        + Secret Key for the `PASSWORD` floor, the Secret Key alone for `RECOVERY`.

        It carries **no `method`**: which wrap this is, is the field it arrived in. That is what makes "rewrite
        one cold wrap and leave the other holding the old Master Key" unsayable rather than merely rejected —
        a `RECOVERY` wrap left on the old key would survive as a working path back into a compromised account.

        The salt is **fresh** on both, and that is why no previously-stored `kdfParams` is needed here: the
        `RECOVERY` wrap is deliberately withheld from `GET /api/account/key-material`
        ([ADR 0054](../../docs/decisions/0054-password-recovery-two-factor-release.md)), so its salt is not the
        client's to read, and re-using a salt would leak the rewrite to anyone diffing two dumps. The Emergency
        Kit stays valid because the *Secret Key* is unchanged — not because the salt is.
      required: [wrappedKey, kdfParams]
      properties:
        wrappedKey:
          type: string
          description: The **new** Master Key wrapped to this method's KEK (opaque base64 ciphertext).
          contentEncoding: base64
          maxLength: 8192
          example: cm90YXRlZC13cmFwcGVkLW1hc3Rlci1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        kdfParams:
          type: string
          description: Argon2id parameters + the **fresh** salt for this rewritten wrap (opaque base64).
          contentEncoding: base64
          maxLength: 1024
          example: a2RmLXBhcmFtcy1yb3RhdGVk
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1024) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RotateAccountKeysRequest:
      type: object
      description: >
        Everything the account half of a rotation replaces, in one body, applied atomically or not at all — a
        partial apply leaves an account nothing can unlock.

        **This property set is pinned by `scripts/validate_rotation_shape.py`.** ADR 0060 Decision 1 says there
        is exactly one mode, and the shortcut that would quietly undo it is a *request field*: a `mode`, an
        `identityOnly`, a `scopes` subset would let identity-only rotation return as a flag while every test
        stayed green. A negative has nothing else that can hold it.

        What is deliberately absent, so the next reader does not add it back: no `authPublicKey` — the password
        does not change, so what logs in is untouched and the Emergency Kit survives; no wrap `method` — see
        `RotatedWrap`; no list of wraps to delete — every non-cold wrap goes, always, because device-held key
        material cannot be rewritten from here.
      required: [identityPublicKey, wrappedIdentityPrivateKey, passwordWrap, recoveryWrap, recoveryMasterKeyTag]
      properties:
        identityPublicKey:
          type: string
          description: >
            The freshly minted identity public bundle (serialized, opaque base64) — replaces the directory
            value. From the moment it lands, every contact who ever pinned this account reads `changed` and
            every automated wrap to it declines (ADR 0028); that is the intended effect, not a side effect.
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LWlkZW50aXR5LXB1YmxpYy1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedIdentityPrivateKey:
          type: string
          description: The **new** identity private key wrapped under the **new** Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LXdyYXBwZWQtaWRlbnRpdHktcHJpdmF0ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        passwordWrap:
          $ref: "#/components/schemas/RotatedWrap"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        recoveryWrap:
          $ref: "#/components/schemas/RotatedWrap"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        recoveryMasterKeyTag:
          type: string
          description: >
            `sha256("veyq/v1/recovery-auth" ‖ newMasterKey)` — the commitment recovery compares against,
            re-derived from the new Master Key. Without it a later recovery would prove possession of a key the
            account no longer has, and the reset would be refused.
          contentEncoding: base64
          maxLength: 128
          example: bmV3LXJlY292ZXJ5LWF1dGgtdGFn
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RotateAccountKeysResult:
      type: object
      description: >
        What the rotation left, and for whom (uc.account.rotate-keys §9). The two lists partition the caller's
        scopes on the only thing that decides who may re-key: whether anybody else is in there. Neither is a
        success tick — `queuedScopeIds` is precisely the set the caller is **outside** until a human there
        accepts their new identity key.
      required: [soleMemberScopeIds, queuedScopeIds]
      properties:
        soleMemberScopeIds:
          x-veyq-visibility: id
          type: array
          description: >
            Scopes where the caller is the **only** member: nobody to be re-admitted by, and nobody to exclude
            but their own old identity. The client mints the next epoch for each itself
            (`POST /api/scopes/{scopeId}/epochs`) and grants it to the new identity. The personal scope is the
            ordinary case; a group nobody else has joined behaves identically, which is why the split is drawn
            on member count rather than on scope kind.
          items:
            type: string
            maxLength: 36
          example: [7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c]
        queuedScopeIds:
          x-veyq-visibility: id
          type: array
          description: >
            Shared scopes that now carry a `scope-rotation` job for a **different** key-holder to complete — the
            rotator is excluded from claiming their own (ADR 0060 Decision 4: a rotator who could drive their own
            re-grant would let an attacker holding the old identity re-admit only themselves). A scope whose
            rotation was already queued is listed here too: queued is queued, and the client's status must not
            read differently for a coalesced job. Until someone accepts the changed key there, the caller is
            outside these scopes.
          items:
            type: string
            maxLength: 36
          example: [1a2b3c4d-5e6f-4071-8213-9a0b1c2d3e4f]

    ChangePasswordRequest:
      type: object
      description: >
        Everything `POST /api/account/password` needs. All three fields are required: the wrap and the auth
        key are what is installed, and `attestationSignature` is the half of the proof the server can check
        itself (see the operation description).
      required: [passwordWrap, authPublicKey, attestationSignature]
      properties:
        passwordWrap:
          $ref: "#/components/schemas/RotatedWrap"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        authPublicKey:
          type: string
          description: >
            The Ed25519 auth public key derived from the new password (ADR 0003). Replaces the stored one in
            the same transaction as the wrap, so login and unlock can never disagree.
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LWF1dGgtcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        attestationSignature:
          type: string
          description: >
            Ed25519 signature over `authPublicKey`'s raw bytes, produced with the OLD auth private key —
            proof the caller still controls the password being replaced.
          contentEncoding: base64
          maxLength: 256
          example: YXR0ZXN0YXRpb24tc2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

