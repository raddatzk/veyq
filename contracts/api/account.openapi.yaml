            - type: "null"
        wrappedGrant:
          type: string
          description: The caller's own grant on the scope (opaque base64), sealed to the caller's current identity.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        grantedEpoch:
          x-veyq-visibility: structure
          type: integer
          description: The epoch the caller's grant carries — behind `currentEpoch` when a rotation left the caller pending.
          minimum: 0
          example: 2
        granterUserId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Who wrapped the caller's grant, as `ScopeSummary.granterUserId`.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        grantSignature:
          type: [string, "null"]
