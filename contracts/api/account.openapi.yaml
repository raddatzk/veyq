openapi: 3.1.0
info:
  title: veyq Account API
  version: 0.1.0
  description: >
    The authenticated account surface beyond login/session lifecycle. Operator-blind: every field served
    here is ciphertext or a public, low-sensitivity descriptor — the server performs no content crypto.

    `GET /api/account/key-material` returns the caller's own wrapped key material so the client can
    **unlock** the Master Key entirely on-device (uc.account.unlock): the PASSWORD `MasterKeyWrap` plus its
    KDF params, the Master-Key-wrapped identity private key, and the crypto suite id. The client derives the
    unlock KEK from the password and Secret Key (2SKD, ADR 0003/0005), unwraps the Master Key, then unwraps
    the identity private key — all in memory. The server never sees the password, the Secret Key, the KEK,
    or any unwrapped key. Auth ≠ unlock: a valid session lets you fetch ciphertext, never open it.

    The endpoint is keyed off the bearer access token and returns **only the caller's own** material — never
    an email or id in the request — so it is no cross-account read and no enumeration vector. A stolen
    access token yields only ciphertext, which is useless without the password and Secret Key.

    `POST /api/account/wraps` adds a device-local convenience wrap — **DEVICE** (trust this device — unlock
    with only the password next time) or **DEVICE_KEY** (password-less remember-me), ADR 0005;
    `DELETE /api/account/wraps/{id}` removes a device-local wrap (untrust). Both act only on the caller's own
    wraps and receive only ciphertext + KDF params — never a key, a password, or the Secret Key. The PASSWORD
    floor (and RECOVERY/PASSKEY) cannot be removed this way.

    `POST /api/account/rotation` secures the account after a compromise (uc.account.rotate-keys, ADR 0060, ADR 0111
    decisions 6-10): the Master Key, the identity keypair and the Secret Key are replaced **together**, in one
    transaction, as one doubly signed step of the account's key chain, and every scope the account holds a grant on
    is re-granted at its current epoch to the new identity from self-grants staged just before
    (`POST /api/account/rotation/stage`, `PUT /api/account/rotation/stage/{stageId}/grants`). The account then mints
    each scope's next epoch itself. It is forward secrecy, not repair — what the old identity already read stays
    read — and it receives, as everything here does, only ciphertext, public keys and signatures.
    `GET /api/account/rotation/plan` lists, across every tenant, the scopes a rotation must carry and the caller's
    own grant on each; `GET /api/account/rotation/scopes` reads back, at any time, how far each scope got.

    `/api/account/email` shows the caller the address a password reset would mail and whether they have
    confirmed reading it, and runs that confirmation (uc.account.confirm-email-address, ADR 0074). The record
    is a fact, not a gate: no request anywhere is refused because an account is unconfirmed.

    `/api/account/email-change` changes the address an account signs in with (uc.account.change-email, ADR 0074
    Decision 8). The address is the auth salt's input (ADR 0003), so the client derives the auth keypair under the new
    address and sends its public half; the server keeps it pending and installs it together with the address when
    the link mailed to the new address is opened in the same account's session.
tags:
  - name: account
    description: Authenticated account key material (for client-side unlock).
  - name: account-wraps
    description: Add / remove Master Key wraps (device trust). Separate tag so it generates its own resource
      interface (one path per tag avoids the greedy class-level @Path that would otherwise shadow siblings).
  - name: account-profile
    description: The caller's per-tenant identity profile (username + sealed real name) in the tenant resolved
      from the Host (ADR 0023). Separate tag → its own resource interface.
  - name: account-identity-pins
    description: The caller's operator-blind identity-pin store — one Master-Key-sealed entry per contact, remembering
      their identity key's fingerprint hash for TOFU change-detection, under a sealed head that binds the set (ADR 0028,
      ADR 0104, en.account.identity-pinning). Separate tag → its own resource interface.
  - name: account-device-register
    description: The caller's operator-blind device register — one Master-Key-sealed blob holding a stable
      client-side device id, its display label, and the device↔session-family join, so unnamed families
      (ADR 0004) can be shown named without the server gaining anything to correlate
      (en.account.device-register). Separate tag → its own resource interface.
  - name: account-rotation
    description: Securing the account after a compromise — the account-side half of uc.account.rotate-keys (ADR 0060,
      ADR 0111 decisions 6-10) - the plan, the stage of self-grants, the publish and the per-scope states. Separate
      tag → its own resource interface.
  - name: account-password
    description: Change the password of a signed-in, unlocked account — uc.account.change-password. Separate
      tag → its own resource interface.
  - name: account-email
    description: The caller's own address as the server holds it, whether it is confirmed, and the
      confirmation mail — uc.account.confirm-email-address (ADR 0074). Separate tag → its own resource interface.
  - name: account-email-change
    description: Change the address an account signs in with — uc.account.change-email (ADR 0074 Decision 8).
      Separate tag → its own resource interface.

  - name: account-erasure
    description: Erase the caller's own account — uc.account.erase-account (ADR 0101). Separate tag → its own resource
      interface.
paths:
  /api/account/key-material:
    get:
      tags: [account]
      operationId: getAccountKeyMaterial
      summary: Fetch the caller's wrapped key material for client-side unlock.
      description: >
        Returns the authenticated caller's Master Key wraps (one per unlock method; PASSWORD is the floor),
        the Master-Key-wrapped identity private key, and the crypto suite id. All opaque ciphertext — the
        client derives the unlock KEK and unwraps locally. Resolved from the bearer access token; a missing,
        malformed, expired, or revoked token is a single generic 401.

        Some wraps are **withheld, never deleted**.
        The `RECOVERY` wrap is always withheld: it opens with the Secret Key alone, so it is released only through
        the mailed recovery flow ([ADR 0054](../../docs/decisions/0054-password-recovery-two-factor-release.md)).
        A device switch of the Server Owner withholds the wraps it covers, at once (ADR 0088 decision 5): every
        `DEVICE` wrap while `core.remember-device` is effectively off, and every `DEVICE_KEY` wrap while
        `core.remember-device.passwordless` is effectively off, which it also is while its parent
        `core.remember-device` is off. The stored wraps are untouched, so switching back on serves them again.
        The `PASSWORD` wrap is never withheld, so a withheld wrap never locks a member out: the unlock falls back
        to the password and the Secret Key.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's wrapped key material (ciphertext only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeyMaterial" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/account/wraps:
    post:
      tags: [account-wraps]
      operationId: addAccountWrap
      summary: Add a device-local convenience wrap (DEVICE or DEVICE_KEY) of the Master Key.
      description: >
        Stores a new device-local `MasterKeyWrap` for the authenticated caller — DEVICE (Master Key under a
        password + device-bound KEK, "trust this device") or DEVICE_KEY (under a device key alone,
        password-less remember-me), ADR 0005 — produced entirely on-device. The server receives only
        ciphertext + the opaque KDF params (the AEAD iv for DEVICE_KEY) and returns the new wrap's id (for a
        later untrust). Restricted to the device-local methods; the PASSWORD floor and other methods are
        created elsewhere.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWrapRequest" }
      responses:
        "201":
          description: The wrap was stored; its opaque id is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddWrapResult" }
        "400":
          description: The request was malformed (missing/invalid fields, or a method other than DEVICE / DEVICE_KEY).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "409":
          description: The account already has the maximum number of device wraps (untrust a device first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: too_many_devices }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            The capability the wrap's method needs is switched off instance-wide (ADR 0032, ADR 0088):
            `core.remember-device` for DEVICE, `core.remember-device.passwordless` for DEVICE_KEY, which by the AND
            along the path also needs `core.remember-device`. With the first off no device is remembered; with
            only the second off, a remembered device still asks for the password. Enforced server-side even if a
            stale client still offers the toggle.
            Only enrolling is refused: unlocking with an existing wrap and deleting one stay allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: capability_disabled }

  /api/account/profile:
    get:
      tags: [account-profile]
      operationId: getMyProfile
      summary: Fetch the caller's identity profile in the active tenant.
      description: >
        Returns the authenticated caller's per-tenant profile — their `username` (plaintext) + `sealedName`
        (their real name sealed under a field key derived from `K_tenant`, or null if not yet sealed) — in the tenant resolved from the
        Host (ADR 0023). Only the caller's own profile; no id/email in the request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's profile in the active tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfile" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the Host, or the caller has no profile there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: profile_not_found }
    put:
      tags: [account-profile]
      operationId: updateMyProfile
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: only the account holder edits their own profile; the loss is between that member's own
          devices, and the form shows every field it sends.
      summary: Update the caller's username and/or sealed real name in the active tenant.
      description: >
        Updates the caller's per-tenant profile in the Host tenant: change the `username` (re-checked unique in
        the tenant → `409 username_taken`) and/or store the `sealedName` blob (real name sealed under a field key derived from `K_tenant`,
        opaque ciphertext). Either field may be omitted to leave it unchanged. Operator-blind: the server never
        sees the plaintext name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateRequest" }
            example:
              username: kevin
              sealedName: c2VhbGVkLW5hbWU=
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfile" }
        "400":
          description: The request was malformed (invalid username shape or name ciphertext).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the Host, or the caller has no profile there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: profile_not_found }
        "409":
          description: The chosen username is already taken in this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: username_taken }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/account/profile/avatar:
    put:
      tags: [account-profile]
      operationId: setMyAvatar
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: only the account holder sets their own picture; the loss is between that member's own
          devices, and the newer picture is the one they meant.
      summary: Set (or overwrite) the caller's profile picture in the active tenant.
      description: >
        Stores the caller's profile picture in the tenant resolved from the Host (uc.spaces.set-profile-picture,
        [ADR 0084](../../docs/decisions/0084-a-members-profile-picture-is-a-sealed-attribute-of-their-tenant-profile.md)):
        one opaque, constant-length ciphertext (a 256 px WebP padded to 16 KiB, sealed under a field key derived from `K_tenant` with the
        `member-avatar` purpose bound to the tenant scope and the caller's own user id). The server stores it verbatim,
        overwrites any earlier one and bumps the profile's `avatarRevision`; it never sees the image, its size or its
        type. Other tenants' profiles of the same account are untouched.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarRequest" }
            example: { sealedAvatar: c2VhbGVkLWF2YXRhcg== }
      responses:
        "204":
          description: The picture is stored and `avatarRevision` bumped.
        "400":
          description: The request was malformed (blank, over the constant length, or not base64).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the Host, or the caller has no profile there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: profile_not_found }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    delete:
      tags: [account-profile]
      operationId: clearMyAvatar
      summary: Remove the caller's profile picture in the active tenant.
      description: >
        Clears the caller's profile picture in the Host tenant and bumps `avatarRevision` (uc.spaces.set-profile-picture
        A1, ADR 0084): everyone falls back to the letter. Idempotent: clearing an absent picture answers `204` too.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The picture is gone (or there was none).
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the Host, or the caller has no profile there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: profile_not_found }

  /api/account/identity-pins:
    get:
      tags: [account-identity-pins]
      operationId: getIdentityPins
      summary: Fetch the head of the caller's identity-pin store.
      description: >
        Returns the **head** of the authenticated caller's identity-pin store (ADR 0104, en.account.identity-pinning):
        one opaque blob sealed under the Master Key, bound to its `revision`, that carries the store's version, the
        number of entries and a digest of the whole entry set — plus that `revision`, the store's one counter for
        optimistic concurrency. The pins themselves are the entries (`listIdentityPinEntries`). The server stores and
        relays the ciphertext verbatim and never interprets it. Born empty: an account that has never written the store
        gets `{ revision: 0 }` with no `blob`. Keyed off the bearer token — only the caller's own store.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's sealed head (ciphertext only) + its revision. `blob` is absent when never written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityPins" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
    put:
      tags: [account-identity-pins]
      operationId: writeIdentityPins
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: revision
      summary: Write entries and the head of the caller's identity-pin store, in one compare-and-set.
      description: >
        The one write of the pin store (ADR 0104 decision 4): the entries in `remove` are removed, the entries in `put`
        are stored (an existing `pinId` is replaced), and `head` becomes the new head — in **one** transaction, and only
        if `revision` is still the stored revision, which is then bumped by one and returned. `replaceAll` removes every
        other entry first (the trust reset and the rotation write the whole set; `remove` is then empty). The head and
        every entry are sealed by the client — the head bound to the revision it is stored at, `revision + 1`, an entry
        to its `pinId` (ADR 0072). If the stored revision moved since the client read (another device wrote), the server
        responds `409 stale_revision` and **nothing** of the write lands; the client re-reads, re-applies and retries
        (en.account.identity-pinning § Sync). The first write of a born-empty store sends `revision: 0`. A `remove`
        alongside `replaceAll` is `400 invalid_request` (the schema's own rule); a write that names one `pinId` twice or
        puts and removes one `pinId` is `422 pins_contradictory` — rules across the lists no schema states (inbox #507);
        one that would leave the store with more than 25,000 entries is `422 pin_store_full`, nothing written.
        Operator-blind: the server sees opaque ids, one sealed
        entry each and a sealed head — never a `userId`, a key, a state or who pinned whom; it does see how many entries
        there are, as it always could (ADR 0104 decision 5).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityPinsWrite" }
            example:
              revision: 3
              head: c2VhbGVkLXBpbi1zdG9yZS1oZWFk
              put:
                - pinId: 17918bc1ecce3ff34ef08970207fef3ec29ee3cb6aacaf4384b96b3b458701e7
                  entry: c2VhbGVkLXBpbi1lbnRyeQ==
              remove: []
              replaceAll: false
      responses:
        "200":
          description: The write landed; the head as stored and its new (bumped) revision are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityPins" }
        "400":
          description: >
            The request was malformed: a missing or invalid field, or a `remove` alongside `replaceAll`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "409":
          description: The stored revision moved since the client read it — nothing was written; re-read, re-apply and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: stale_revision }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            Nothing was written. The lists contradict each other — a `pinId` put twice, removed twice, or both put and
            removed (`pins_contradictory`), rules across the lists no schema states; or the write would leave the store
            with more than 25,000 entries (`pin_store_full`), an answer about what the store already holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: pins_contradictory }

  /api/account/identity-pins/entries:
    get:
      tags: [account-identity-pins]
      operationId: listIdentityPinEntries
      summary: List the entries of the caller's identity-pin store, one page at a time.
      description: >
        The caller's pin entries in ascending `pinId` order, at most `limit` per page, starting after `after` (keyset
        paging; absent = from the first). `more` says whether a next page exists — the client asks again with the last
        `pinId` it got. A device lists every entry once per head revision and checks them against the head's digest
        (ADR 0104 decisions 4 and 6): an entry withheld, added, rolled back or moved is refused there, not here. Keyed
        off the bearer token — only the caller's own entries. Operator-blind: opaque ids and sealed entries.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          # An empty value (`?after=`) is this parameter's absence: Quarkus REST
          # never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: List the entries after this `pinId`; absent = from the first.
          schema: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-f]{64}$" }
        - name: limit
          in: query
          required: false
          description: The most entries one page holds; absent = 1000.
          schema: { type: integer, format: int32, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: One page of the caller's sealed entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityPinEntryPage" }
        "400":
          description: An `after` that is not a `pinId`, or a `limit` outside 1-1000.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/account/device-register:
    get:
      tags: [account-device-register]
      operationId: getDeviceRegister
      summary: Fetch the caller's sealed device register.
      description: >
        Returns the authenticated caller's device register — one opaque blob sealed under the Master Key
        (`symWrap(masterKey, blob, "device-register")`, en.account.device-register) plus its monotonic
        `revision` for optimistic concurrency. The server stores + relays the ciphertext verbatim and never
        interprets it: it learns no device name, no device count, and above all **no device↔family link** —
        the link ADR 0004's unnamed families exist to withhold. Born empty: an account that has never written
        the register gets `{ blob: null, revision: 0 }`. Keyed off the bearer token — only the caller's own
        register.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's sealed device register (ciphertext only) + its revision. `blob` is null when never written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRegister" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
    put:
      tags: [account-device-register]
      operationId: putDeviceRegister
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: revision
      summary: Store the caller's sealed device register (optimistic concurrency).
      description: >
        Replaces the caller's sealed device-register blob. `revision` is the revision the client last read; the
        write succeeds only if it still matches the server's stored revision, which is then bumped by one and
        returned; the blob is sealed bound to that stored revision, `revision + 1` (ADR 0072). If the stored revision
        moved since the client read (another device wrote), the server
        responds `409 stale_revision` and the client re-reads, merges, and retries
        (en.account.device-register §Sync & merge — note that a family removal is applied as a frozen id-delta
        and an eviction is recomputed on the merged map; the two are not the same operation). The first write
        of a born-empty register sends `revision: 0`. Operator-blind: the server never sees the plaintext.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegisterUpdate" }
            example:
              blob: c2VhbGVkLWRldmljZS1yZWdpc3Rlcg==
              revision: 3
      responses:
        "200":
          description: The register was written; the new (bumped) revision is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRegister" }
        "400":
          description: The request was malformed (missing/invalid blob or revision).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "409":
          description: The stored revision moved since the client read it — re-read, merge, and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: stale_revision }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/account/wraps/{id}:
    delete:
      tags: [account-wraps]
      operationId: deleteAccountWrap
      summary: Remove a wrap by id (untrust this device).
      description: >
        Removes the caller's wrap with this id. **Idempotent** (like logout): the wrap is deleted only if it
        is one of the caller's own **device-local convenience wraps** — **DEVICE** or **DEVICE_KEY**, the two
        kinds `POST /api/account/wraps` creates (ADR 0005 §9: a device carries one at a time, so switching
        level removes the old one through this endpoint). An unknown id, another account's wrap, the PASSWORD
        floor, or any other method is a silent no-op. Always 204 for a well-formed (UUID) id — no cross-account enumeration, the 2SKD
        floor can never be removed, and the RECOVERY/PASSKEY methods are out of reach of this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          description: The opaque id of the wrap to remove (returned by the add-wrap call).
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The wrap is gone (removed, or there was no removable wrap of yours with that id).
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: A path id that is no UUID names nothing (`not_found`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_found } }

  /api/account/rotation:
    post:
      tags: [account-rotation]
      operationId: rotateAccountKeys
      summary: Secure the account - replace the Master Key, the identity keypair and the Secret Key in one step of its key chain.
      description: >
        Applies the publish of securing the account as **one transaction, all writes or none**
        (uc.account.rotate-keys, ADR 0060, ADR 0111 decisions 6-10): append the key-chain step `keyChainStep` to the
        account's chain; publish the new identity public key; replace `wrappedIdentityPrivateKey` with the identity
        private key sealed under the new Master Key; rewrite the `PASSWORD` and `RECOVERY` wraps, which open under the
        **new** Secret Key; store `secretKeyProofPublicKey` as the account's Secret-Key proof key and `authPublicKey`
        as its auth key; **delete every other wrap** (`DEVICE`, `DEVICE_KEY`, `PASSKEY` — their key material is
        device-held and cannot be rewritten from here); store the identity-pin store and the device register re-sealed
        under the new Master Key, each guarded by the revision the client read; supersede every live pairing channel
        (an unspent envelope carries the *old* Master Key and a live delegated session); void every open change of the
        sign-in address (its proof was taken under the old proof key); delete the declines of every `grant-delivery`
        job whose target is this account (a worker that could not anchor the old key tries the new one); revoke every
        other session; and **apply the stage** `stageId`.

        **The stage is applied here and nowhere else.** Under the account lock the server takes the stage: missing,
        expired, of another account, or declaring another identity bundle than `identityPublicKey` is
        `409 rotation_plan_changed`, and so is a `stagedGrantsDigest` other than the digest it recomputes over the
        staged rows (`rotationStageDigest`, the `rotation_stage` crypto vector) — both before any proof is checked.
        Then, in one ascending pass under each scope's row lock, it recomputes the account's memberships that carry a
        grant, in **every** tenant, and requires each one to be staged **at the scope's current epoch** or named in
        `unreadableScopeIds`; otherwise `409 rotation_plan_changed`, nothing written (a membership arrived, or a scope
        rotated, after staging). It writes each staged self-grant as the account's grant on that scope (granter = the
        caller, `granter_identity_public_key` = the new key) and a pending re-key row (`epoch_at_rotation`); a staged
        grant for a scope the account no longer holds a grant on is not written, and an unreadable scope keeps its
        grant untouched and gets no row. The stage is deleted in the same transaction. From the moment this commits,
        every scope the account holds a grant on holds a grant of its current epoch to the published identity.

        **One mode, and the request cannot express another.** There is no `mode`, no `identityOnly`, no `scopes`
        subset, and every field is required. Every path to the identity private key runs through the Master Key, so an
        identity compromise implies a Master-Key compromise (ADR 0060 Decision 1); the Secret Key rotates with them,
        because whoever holds it and the password is otherwise indistinguishable from the member (ADR 0111 decision 6).
        `scripts/validate_rotation_shape.py` pins the request's property set so that negative cannot be undone by an
        additive field.

        **The cold-credential gate has two halves, and the server holds the one both attackers lack.** A session is
        not enough: a device-link holder has one with no password at all, and so does whoever phished or cracked the
        password. `secretKeyProofSignature` is an Ed25519 signature under the account's **current** Secret-Key proof
        key over `veyq/v1/secret-key-proof/rotation` (the `secret_key_proof` crypto vector), which binds the identity
        and auth key it replaces, everything this request installs, the key-chain step and the stage; the server
        rebuilds that statement itself and verifies it against the stored proof key before anything is written.
        `secretKeyProofPossession` is the **new** proof key's signature over the same statement, so a client bug
        cannot register a proof key nobody holds. The password half: `attestationSignature`, the current auth key's
        signature over `authPublicKey` (keeping the password derives the same key, and the attestation still
        verifies — both are always sent).

        **The key-chain step** (ADR 0111 decision 7) retires the stored identity and proof key for `identityPublicKey`
        and `secretKeyProofPublicKey`. The server rebuilds its statement (the `key_chain` crypto vector) from the
        account's stored head, its next index, the stored keys and the two new ones, and verifies
        `keyChainStep.identitySignature` under the stored identity and `keyChainStep.proofSignature` under the stored
        proof key. A failing proof half is `403 secret_key_proof_failed`, a failing identity half
        `422 key_chain_step_invalid`. Nothing is written on either. That is an honest server's check: every reader
        verifies the chain itself (`getKeyChain`).

        **Forward secrecy, not repair.** What the old identity already read stays read. The self-grants hand the new
        identity each scope's current epoch, which everyone able to publish this already reads; what closes the old
        identity out is the next epoch, which the account mints for every scope in `regrantedScopeIds` afterwards,
        from any of its devices (`rotateScope`, ADR 0111 decision 8) and which no grant to the old identity can reach
        (`409 recipient_key_not_current`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateAccountKeysRequest" }
      responses:
        "200":
          description: >
            Applied. The body names the scopes re-granted to the new identity, each now waiting for its next epoch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotateAccountKeysResult" }
        "400":
          description: >
            The request was malformed (a missing, oversized or non-base64 field, more than 10000 `unreadableScopeIds`),
            or `identityPins` is not a whole set: no `replaceAll`, or a `remove` beside it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            One of the cold-credential proofs failed; the code says which. `secret_key_proof_failed` —
            `secretKeyProofSignature` did not verify under the account's stored Secret-Key proof key over the statement
            the server rebuilt, `secretKeyProofPossession` did not verify under `secretKeyProofPublicKey`, or
            `keyChainStep.proofSignature` did not verify under the stored proof key: the caller did not prove the
            Secret Key. `attestation_failed` — `attestationSignature` did not verify under the stored auth key: the
            caller did not prove the password. **Nothing was written.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                proof: { value: { code: secret_key_proof_failed } }
                attestation: { value: { code: attestation_failed } }
        "409":
          description: >
            `rotation_unavailable` — the account has no `PASSWORD` floor or no `RECOVERY` wrap to rewrite, so the
            rotation cannot be applied whole. `stale_revision` — the `revision` sent with `identityPins` or
            `deviceRegister` is no longer the stored one (another device wrote it meanwhile); the client re-reads,
            re-seals and resubmits with the same new keys and the same signatures, which do not cover the two
            documents. `rotation_plan_changed` — the stage is missing, expired or declares another identity, its digest
            is not `stagedGrantsDigest`, or a membership that carries a grant is neither staged at its scope's current
            epoch nor in `unreadableScopeIds`; the client re-reads the plan, re-stages the delta (or opens a new stage)
            and resubmits. **Nothing was written** in any case — a half-rotated account is a lockout, not a degraded
            state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                unavailable: { value: { code: rotation_unavailable } }
                stale: { value: { code: stale_revision } }
                planChanged: { value: { code: rotation_plan_changed } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            `identityPins` contradicts itself — a `pinId` put twice, removed twice, or both put and removed
            (`pins_contradictory`, as `writeIdentityPins` answers it); or `keyChainStep.identitySignature` does not
            verify under the stored identity over the step the server rebuilt from the stored head
            (`key_chain_step_invalid`). **Nothing was written.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                pins: { value: { code: pins_contradictory } }
                step: { value: { code: key_chain_step_invalid } }

  /api/account/rotation/plan:
    get:
      tags: [account-rotation]
      operationId: getAccountRotationPlan
      summary: Every scope a rotation of the caller's account must carry, across every tenant, with the caller's own grant.
      description: >
        Host-independent (uc.account.rotate-keys, cr-secure-the-account): one entry per scope the caller
        holds a membership on, in **every** tenant — PERSONAL, TENANT and GROUP, a group proposal the caller has not
        answered yet included (it holds a grant from the add on, ADR 0111 decision 4). Each carries the scope's kind,
        tenant and current epoch, why its next epoch cannot be minted now (`blocked`), and the caller's own grant row —
        what the client opens with its current identity to stage the self-grant (`putRotationStageGrants`) and, after
        the publish, to mint the next epoch from any device. Operator-blind: only rows the server already serves the
        caller tenant by tenant through `listMyScopes` — ids, epochs and ciphertext. Only the caller's own rows.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One entry per scope the caller holds a membership on, in every tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RotationPlanScope" }
              example:
                - scopeId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  kind: PERSONAL
                  tenantId: 1a2b3c4d-5e6f-4071-8213-9a0b1c2d3e4f
                  currentEpoch: 2
                  wrappedGrant: AQ==
                  grantedEpoch: 2
                  granterUserId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  grantSignature: c2lnbmF0dXJl
                  granterIdentityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/account/rotation/stage:
    post:
      tags: [account-rotation]
      operationId: openRotationStage
      summary: Open the account's one stage for the self-grants of a rotation, declaring the new identity.
      description: >
        Opens the caller's stage for the self-grants the next `rotateAccountKeys` applies (cr-secure-the-account
        decision 3): one stage per account, so a second open **replaces** the first and every grant staged in it. The
        stage declares `identityPublicKey`, the identity the rotation will publish: every grant staged into it must
        verify under that bundle, and the publish applies the stage only if it publishes that same bundle. **Nothing
        staged is applied before the publish**: a stage holds ciphertext and scope ids the server already holds as
        grant rows, inert until a Secret-Key-proved `rotateAccountKeys` names it. A stage expires
        `veyq.account.rotation.stage.ttl` (default one hour, server-observed) after it opened and is then purged; the
        account's erasure removes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenRotationStageRequest" }
      responses:
        "201":
          description: The stage is open; any stage before it is gone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationStage" }
              example: { stageId: 5a6e0000-0000-4000-8000-0000000000a1, expiresAt: 2026-07-11T13:00:00Z }
        "400":
          description: The request was malformed (a missing, oversized or non-base64 `identityPublicKey`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/account/rotation/stage/{stageId}/grants:
    put:
      tags: [account-rotation]
      operationId: putRotationStageGrants
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: only the account holder stages into their own stage, and a grant staged twice for one scope is
          the same key for the same identity. What the publish applies is not the last write but the set it names by
          `stagedGrantsDigest` under the Secret Key's proof, recomputed over the staged rows.
      summary: Stage one chunk of self-grants into the caller's open stage.
      description: >
        Upserts up to 256 self-grants into the stage, by `scopeId` (ADR 0111 decision 6): the client
        stages every scope of the plan in chunks, and after a `409 rotation_plan_changed` re-stages only the delta. Each
        grant hands the scope's epoch key to the identity the stage declares: it is **verified here**, under that
        bundle — the `grant` statement (`grant_signature` crypto vector) with the scope's own kind, `epoch`, the caller
        as recipient, SHA-256 of the stage's bundle and of `wrappedGrant` — and its `recipientIdentityDigest` must be
        SHA-256 of that bundle. This is the one place the server checks a grant signature: a consistency check of the
        stage against the identity the publish then registers under the Secret Key's proof, not a trust judgment (ADR
        0028 Decision 6). The epoch is not judged here — the publish does, against the scope's current one. Nothing of
        a refused chunk is written; nothing staged is applied before the publish.
      security:
        - bearerAuth: []
      parameters:
        - { name: stageId, in: path, required: true, description: The stage `openRotationStage` answered., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotationStageGrants" }
      responses:
        "204":
          description: The chunk is staged.
        "400":
          description: The request was malformed (more than 256 grants, a missing, oversized or non-base64 field).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            No open stage of the caller has this id — unknown, expired, replaced, or another account's (indistinguishable,
            `rotation_stage_not_found`). The client opens a new stage and stages everything again. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rotation_stage_not_found }
        "409":
          description: >
            A grant names a scope the caller holds no grant on (`rotation_plan_changed` — the same answer for a scope
            that does not exist); the client re-reads the plan. Nothing of the chunk was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rotation_plan_changed }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            A grant's signature does not verify under the identity the stage declares, or its `recipientIdentityDigest`
            is not SHA-256 of that bundle (`self_grant_invalid`). Nothing of the chunk was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: self_grant_invalid }

  /api/account/rotation/scopes:
    get:
      tags: [account-rotation]
      operationId: listRotationScopeStates
      summary: How far each scope of the caller's latest rotation got.
      description: >
        Host-independent. For every scope the caller's latest `rotateAccountKeys` re-granted (its pending re-key row)
        and the caller is still a member of, a state derived from rows the server already holds
        (uc.account.rotate-keys §9, ADR 0060 Decision 6) — first match wins: `blocked` (with `reason`)
        while the scope's tenant is suspended (`tenant_suspended`) or the scope is being deleted (`scope_deleting`);
        `waiting` while the scope's current epoch is still the one it had at the rotation — its next epoch is the
        account's to mint, from any of its devices; `rekeying` while a live or trashed node of the scope lags the
        current epoch (ADR 0109 point 1: a rotation is done only once its re-key is); `secured` otherwise — someone
        committed the next epoch, which no grant to the old identity can carry (`409 recipient_key_not_current`). Until
        a scope reads `secured`, the old identity can still read what is new there. Empty for an account that never
        rotated. Only the caller's own rows; operator-blind: scope ids the server routes on and one enum per scope.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One entry per scope the caller's latest rotation re-granted.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RotationScopeState" }
              example:
                - { scopeId: 1a2b3c4d-5e6f-4071-8213-9a0b1c2d3e4f, state: waiting }
                - { scopeId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c, state: blocked, reason: tenant_suspended }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/account/email:
    get:
      tags: [account-email]
      operationId: getAccountEmail
      summary: The caller's address as the server holds it, and whether it is confirmed.
      description: >
        The address is the one a password reset would mail (ADR 0054) — the server's copy, which is not implied
        by anything the client holds: the client remembers what it typed, the server mails what it stored.
        `confirmed` is true once the account holder has shown they read mail sent to it (ADR 0074 Decision 2).
        Session only; unlock is not required, because this is operational state, not content.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's address and its state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountEmail" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/account/email/confirmation:
    post:
      tags: [account-email]
      operationId: requestEmailConfirmation
      summary: Mail a one-time confirmation link to the caller's own address.
      description: >
        Mints a one-time token, stores only its SHA-256 hash with the address it is mailed to and a `PT24H`
        expiry, supersedes any outstanding one, and mails the link through the relay of the tenant this
        request's `Host` resolves to (ADR 0074 Decisions 4 and 6). The mail carries link, domain and expiry
        only. The mint commits before the send; a send that fails supersedes the fresh token and answers `503`,
        never a silent `202`.

        Checked in this order: the tenant can send (`503`), the caller is a member of it (`404`), the
        per-account send budget (`429`). **There is no copy-link**: a link shown on the caller's own screen
        proves nothing about their mailbox (ADR 0074 Decision 6).
      security:
        - bearerAuth: []
      responses:
        "202":
          description: The confirmation mail was sent.
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            `tenant_not_found` — no tenant answers this `Host`, or the caller is not a member of it. A relay
            carries a link only for its own tenant's members (ADR 0054 §4). Nothing was mailed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "429":
          description: The per-account send budget is spent; retry after the indicated delay. Nothing was mailed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }
        "503":
          description: >
            `mail_unavailable` — this tenant cannot send mail, or the send failed. No live token is left
            behind (ADR 0055 §4, §6).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }

  /api/account/email/confirmation/confirm:
    post:
      tags: [account-email]
      operationId: confirmEmail
      summary: Confirm the caller's address with the token from a confirmation mail.
      description: >
        Confirms only for a caller signed in as the account the token was minted for, and only while that
        account's address still equals the one mailed (ADR 0074 Decision 5): whoever reads a mistyped mailbox
        must not be able to mark the wrong address confirmed. The token is spent with a compare-and-set, so it
        confirms at most once. Every refusal is the same `404` and spends nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailConfirmationRequest" }
      responses:
        "204":
          description: The address is confirmed.
        "400":
          description: The request was malformed (a missing or oversized token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            `email_confirmation_invalid` — the token is unknown, expired, superseded or spent, was minted for
            another account, or was mailed to an address the account no longer holds. Deliberately one answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: email_confirmation_invalid }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/account/email-change:
    post:
      tags: [account-email-change]
      operationId: requestEmailChange
      summary: Ask to change the address this account signs in with; a link goes to the new address.
      description: >
        The first half of uc.account.change-email (ADR 0074 Decision 8). The body carries the new address, the auth
        public key the client derived under that address's salt (ADR 0003 — the address is the salt's input), and
        the two halves of the cold credential, as `POST /api/account/password` does: an attestation signed with the
        CURRENT auth key over the account, the new address and the new key (the password), and a Secret-Key proof
        over the current key, the new key and the new address (the Secret Key, ADR 0060 Decision 2). A session
        alone therefore cannot move the address a password reset is sent to.

        Checked in this order: no tenant answers the `Host` (`404`); the tenant cannot send mail (`503`, before
        anything is stored, ADR 0055); the caller is not its member (`404`); the attestation (`403`); the
        Secret-Key proof (`403`); the per-account mail budget, shared with the address confirmation (`429`).
        Then the change is stored **pending** (the new address, the new key, the SHA-256 of a one-time token and
        a `PT24H` expiry; a newer request replaces an older one) and the link is mailed to the new address through
        the tenant's relay; a send that fails withdraws the pending change and answers `503`.

        **The answer does not say whether the address is free.** A taken address is stored and mailed like a
        free one, and refused only when the link is opened (`POST /api/account/email-change/confirm`): the
        uniqueness of an address is enforced at the swap, under the account's lock and the address's unique
        index, never announced here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeRequest" }
      responses:
        "202":
          description: >
            If the address can be used, a link was sent to it. The same answer for a free and a taken address.
        "400":
          description: The request was malformed (a missing, oversized or non-base64 field, or no email address).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            One of the two cold-credential proofs failed, as for a password change: `attestation_failed` (the
            current password) or `secret_key_proof_failed` (the Secret Key). Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: secret_key_proof_failed }
        "404":
          description: >
            `tenant_not_found` — no tenant answers this `Host`, or the caller is not a member of it. A relay
            carries a link only for its own tenant's members (ADR 0054 §4). Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "429":
          description: The per-account mail budget is spent; retry after the indicated delay. Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }
        "503":
          description: >
            `mail_unavailable` — this tenant cannot send mail, or the send failed. No pending change is left
            behind (ADR 0055 §4, §6).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }

  /api/account/email-change/confirm:
    post:
      tags: [account-email-change]
      operationId: confirmEmailChange
      summary: Install the new address and auth key with the token from the change mail.
      description: >
        The second half of uc.account.change-email. Only a caller signed in as the account that asked can confirm:
        the proof is that **the account holder** reads the new mailbox. Under the account's lock the pending change
        is spent (single use) and, if the address is still free, the account's email and auth public key are
        swapped in one transaction, the address is recorded as confirmed (ADR 0074 Decision 2 — the link proved
        it), and every session but the caller's is revoked. Then the OLD address is mailed a fixed notice that the
        sign-in address changed (link, domain, expiry only — never the new address, ADR 0049).

        The tenant gates are the request's: no tenant or not its member (`404 tenant_not_found`), a tenant that
        cannot send (`503`, nothing changed). Every other refusal — an unknown, expired, replaced or spent token,
        one minted for another account, or an address another account holds by now — is the one neutral `404
        email_change_invalid`, and changes nothing.

        Open tenant invitations addressed to the old address can no longer be accepted by this account: an invite
        is matched by address.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeConfirmRequest" }
      responses:
        "204":
          description: >
            The address and the auth key are changed. The caller's own session survives; every other session is
            gone.
        "400":
          description: The request was malformed (a missing or oversized token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: >
            `email_change_invalid` — the token is unknown, expired, replaced or spent, was minted for another
            account, or the address is no longer free. Deliberately one answer. `tenant_not_found` — no tenant
            answers this `Host`, or the caller is not a member of it. Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: email_change_invalid }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "503":
          description: >
            `mail_unavailable` — this tenant cannot send the notice to the old address. Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_unavailable }

  /api/account/password:
    post:
      tags: [account-password]
      operationId: changePassword
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          One writer: only the account holder changes their password, and the request proves the current
          credential, which is its own precondition.
      summary: Set a new password from a live, unlocked session.
      description: >
        Applies uc.account.change-password's one server-side mechanism for both entry points: rewrite the
        `PASSWORD` wrap and `auth_public_key`, delete every wrap but `PASSWORD` and `RECOVERY`, and revoke every
        session except the one the request arrived on. Mirrors `POST /api/recovery/complete`'s floor +
        auth-key rewrite, with one deliberate difference — this flow has a caller session to spare and must
        not revoke it, where recovery has none.

        `attestationSignature` is **required**: an Ed25519 signature over `authPublicKey`'s raw bytes made
        with the OLD auth private key, proving the caller still controls the password being replaced. It is
        the one half of the cold credential a blind server can verify for itself — it holds
        `auth_public_key` (ADR 0003). The other half is the Secret Key: `secretKeyProofSignature` is
        **required**, an Ed25519 signature under the account's Secret-Key proof key over the current auth key,
        the new one and the new `PASSWORD` wrap, which the server rebuilds and verifies against the key
        registered at account birth. Both together are ADR 0060 Decision 2: a flow that mints a cold credential
        may not be reachable without the material an attacker lacks, and a phished password alone is not that
        material. Someone who has forgotten their password goes through `POST /api/recovery/request`, not
        here.

        This is **not** a rotation: the identity keypair is untouched and no scope is touched — see
        `POST /api/account/rotation` for the compromise-recovery mechanism, which is mandatory-paired and
        structurally a different shape.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: The password is changed. The caller's own session survives; every other session is gone.
        "400":
          description: The request was malformed (a missing, oversized or non-base64 field).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            One of the two cold-credential proofs failed; the code says which, because "your password was
            wrong" and "your Emergency Kit was wrong" are different things to tell a person.
            `attestation_failed` — `attestationSignature` did not verify against the current
            `auth_public_key` (the old password). `secret_key_proof_failed` — `secretKeyProofSignature` did not
            verify against the account's Secret-Key proof key (the Secret Key). Distinct from `401`: the caller
            **is** authenticated. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: attestation_failed }
        "409":
          description: >
            The account has no `PASSWORD` floor to rewrite. **Nothing was written** — mirrors
            `POST /api/account/rotation`'s `rotation_unavailable` shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: password_change_unavailable }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/account/erasure:
    get:
      tags: [account-erasure]
      operationId: getOwnAccountErasurePreview
      summary: What erasing the caller's account would decide about the tenants it owns.
      description: >
        Read before the erase dialog (uc.account.erase-account A3, ADR 0101 decision 9): every tenant whose last OWNER
        the caller is. One with other members needs the caller's choice — delete it along, or name one of its members
        the new owner — and lists who those members are by id (the client names them from the tenant's directory). One
        with no other member is deleted with the account, and the dialog names it. Session only: this is membership
        metadata the caller already sees.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tenants the erasure decides about.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountErasurePreview" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "409":
          description: The caller is the Server Owner, whose account is never erased (`server_owner_account`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: server_owner_account }
    post:
      tags: [account-erasure]
      operationId: eraseOwnAccount
      summary: Erase the caller's own account — the member's door (GDPR Art. 17).
      description: >
        ADR 0101 decisions 1-3 and 9. The caller proves their password: `attestationSignature` is an Ed25519 signature
        with the account's auth key over the statement `veyq/v1/auth-attestation/erase-account` binding the account id
        and `nonce`, a login challenge the caller fetched for its own address (`POST /api/login/challenge`) — single-use,
        spent here whether or not the proof verifies, so a captured proof erases nothing twice.

        Then, in one transaction: for each tenant whose last OWNER the caller is and which has other members, the
        caller's choice from `lastOwnerChoices` is carried out — `newOwnerId` set: that member becomes an OWNER;
        `newOwnerId` null: the tenant is deleted along (`deleteTenant`'s pending deletion, the Server Owner can stop
        it) — and a tenant with no other member is deleted along without a choice. Every session of the account ends,
        sign-in is refused, its pending invites, pairings, recoveries and address changes go, the member removal runs in
        every tenant, and it leaves the moderator roster. The account is purged after the scope trash's retention; until
        then only the Server Owner can stop it. One mail goes to the account's address through the instance mail where
        it is set up.

        Checked in this order: the Server Owner's account (`409 server_owner_account`); the proof (`403
        attestation_failed`); a last-owner tenant without a choice, or a choice naming no member of that tenant (`409
        last_owner_choice_required`); the last holder of the moderation key, who must step down the way a moderator does
        first (`409 moderation_last_holder`). A refusal writes nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EraseOwnAccountRequest" }
      responses:
        "200":
          description: The erasure is pending; every session of the account has ended, the caller's included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnAccountErasure" }
        "400":
          description: The request was malformed (a missing, oversized or non-base64 field).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            `attestation_failed` — the proof did not verify against the account's auth key (the password), or its
            challenge was unknown, expired or spent. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: attestation_failed }
        "409":
          description: >
            `server_owner_account` — the Server Owner's own account is never erased; `last_owner_choice_required` — a
            tenant whose last owner the caller is has other members and the request names no choice for it (or names a
            new owner who is not its member); `moderation_last_holder` — the caller is the last holder of the moderation
            key. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: last_owner_choice_required }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh.

  schemas:
    ErasureTenant:
      type: object
      description: A tenant whose last OWNER the caller is.
      required: [tenantId, name, otherMemberIds]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        name:
          x-veyq-visibility: public
          type: string
          maxLength: 100
          example: Familie Raddatz
        otherMemberIds:
          x-veyq-visibility: id
          type: array
          maxItems: 100000
          description: The tenant's other members, by account id — empty when the caller is its only member.
          items:
            x-veyq-visibility: id
            type: string
            format: uuid
            example: 2b6e4c1a-8d3f-4e7a-9c2b-5f1e3d4a6b7c

    AccountErasurePreview:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ErasureTenant" }

    LastOwnerChoice:
      type: object
      description: >
        What happens to one tenant whose last OWNER the caller is: `newOwnerId` names a member who becomes an OWNER, or is
        null to delete the tenant along.
      required: [tenantId]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        newOwnerId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The member who becomes the tenant's owner; null deletes the tenant along.
          example: 2b6e4c1a-8d3f-4e7a-9c2b-5f1e3d4a6b7c

    EraseOwnAccountRequest:
      type: object
      required: [nonce, attestationSignature, lastOwnerChoices]
      properties:
        nonce:
          type: string
          description: A login challenge for the caller's own address, spent by this request (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: bm9uY2UtZXhhbXBsZS0zMmJ5dGVz
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        attestationSignature:
          type: string
          description: >
            Ed25519 signature with the account's auth private key over lp("veyq/v1/auth-attestation/erase-account") ||
            lp(utf8(accountId)) || lp(nonce bytes) — the `auth_attestation.erase_account` vector.
          contentEncoding: base64
          maxLength: 256
          example: YXR0ZXN0YXRpb24tc2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        lastOwnerChoices:
          type: array
          maxItems: 10000
          description: One choice per tenant the preview lists with other members; an entry for any other tenant is ignored.
          items: { $ref: "#/components/schemas/LastOwnerChoice" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.Size(max = 10000)'

    OwnAccountErasure:
      type: object
      required: [dueAt]
      properties:
        dueAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the purge erases the account — the request plus the scope trash's retention.
          example: 2026-11-17T10:00:00Z

    # MasterKeyWrap and ErrorResponse are single-sourced in _common.openapi.yaml (ADR 0038), aliased here by name
    # so the generator emits them under the names the operations use.
    MasterKeyWrap:
      $ref: '_common.openapi.yaml#/components/schemas/MasterKeyWrap'

    AddWrapRequest:
      type: object
      description: >
        A new device-local convenience wrap to store for the caller: DEVICE (trust this device — password +
        device key) or DEVICE_KEY (remember me — password-less device key alone).
      required: [method, wrappedKey, kdfParams]
      properties:
        method:
          x-veyq-visibility: enum
          type: string
          description: >
            The unlock method this wrap opens. Restricted to the device-local methods on this endpoint:
            DEVICE (password + device factor) or DEVICE_KEY (password-less device key).
          enum: [DEVICE, DEVICE_KEY]
          example: DEVICE
        wrappedKey:
          type: string
          description: The Master Key wrapped to the device KEK (opaque base64 ciphertext).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tYXN0ZXIta2V5
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        kdfParams:
          type: string
          description: >
            KDF parameters + salt to re-derive the device KEK (opaque base64). For DEVICE_KEY there is no
            KDF — this carries only the AEAD iv for the password-less device-key wrap.
          contentEncoding: base64
          maxLength: 256
          example: AAAAAwAAgAAAAAABAAAAIHNhbHQtZXhhbXBsZS0xNmJ5dGVz
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    AddWrapResult:
      type: object
      description: The id of the stored wrap, used later to remove it (untrust).
      required: [id]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the stored wrap.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c

    AccountKeyMaterial:
      type: object
      description: The caller's wrapped key material, enough to unlock the Master Key on-device.
      required: [userId, suiteId, wraps, wrappedIdentityPrivateKey]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The caller's own account id. A member's real name is sealed bound to (tenant scope, user id) (ADR 0072), so the client needs its own id to seal and open its name; the server knows it truthfully (it is the token's principal) and nothing else the client holds implies it.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        suiteId:
          x-veyq-visibility: enum
          type: string
          description: Crypto suite the wrapped material was produced under (selects the client crypto suite).
          enum: [v1]
          example: v1
        wraps:
          type: array
          description: >
            One wrap per unlock method the account has and this endpoint serves (`getAccountKeyMaterial` names the
            ones withheld); PASSWORD is the floor used by this flow and is never withheld.
          minItems: 1
          items: { $ref: "#/components/schemas/MasterKeyWrap" }
        wrappedIdentityPrivateKey:
          type: string
          description: The identity private key wrapped under the Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1pZGVudGl0eS1wcml2YXRlLWtleQ==

    MemberProfile:
      type: object
      description: The caller's per-tenant identity — a plaintext handle + the sealed real name (ADR 0023).
      required: [username, avatarRevision, requireGroupAddConsent]
      properties:
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: The caller's per-tenant handle (plaintext, unique within the tenant).
          maxLength: 32
          example: kevin
        sealedName:
          type: [string, "null"]
          description: >
            The caller's real name (first + last) sealed under a field key derived from `K_tenant` (opaque base64), or null when not yet
            sealed. Decrypted only on-device.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
        avatarRevision:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 0
          description: >
            The revision of the caller's profile picture in this tenant: `0` = none, bumped on every set and clear
            (ADR 0084). The picture itself is fetched with `getMemberAvatar` only when this is non-zero and differs
            from the cached one. The operator-visible residual: that a picture exists and how often it changed.
          example: 0
        requireGroupAddConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            The caller's **account-global** "ask before adding me to groups" preference (uc.spaces.consent-group-add,
            ADR 0014 §5) — default `false`. Account-scoped (applies in every tenant the caller belongs to), surfaced
            here because this is the caller's own settings surface. Low-sensitivity server-visible operational
            metadata (never a key or content): a GroupOwner attempting an add learns *that* the caller wants to be
            asked, and their add becomes a consent proposal instead of a direct-add.
          example: false

    ProfileUpdateRequest:
      type: object
      description: >
        A profile change — set the `username` (re-checked unique in the tenant), the `sealedName` blob, and/or
        the account-global `requireGroupAddConsent` preference. Omit a field to leave it unchanged.
      properties:
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The handle the caller chooses in the tenant they are joining (ADR 0023) — held in plaintext to enforce
            uniqueness within the tenant and to serve the directory.
          type: string
          pattern: '^[A-Za-z0-9_.-]+$'
          description: >
            The new per-tenant handle (plaintext; trimmed + lowercased server-side; unique in the tenant →
            `409 username_taken`). Omit to keep the current one.
          minLength: 2
          maxLength: 32
          example: kevin
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.Size(min = 2, max = 32) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9_.-]+")'
        sealedName:
          type: string
          description: >
            The real name (first + last) sealed under a field key derived from `K_tenant` (opaque base64 ciphertext the server stores
            verbatim). Omit to leave the current name unchanged.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        requireGroupAddConsent:
          x-veyq-visibility: flag
          type: [boolean, "null"]
          description: >
            The account-global "ask before adding me to groups" preference (uc.spaces.consent-group-add). `true`
            turns a GroupOwner's add into a consent proposal; `false` restores the default direct-add. Omit
            (`null`) to leave it unchanged.
          example: true

    SetAvatarRequest:
      type: object
      required: [sealedAvatar]
      properties:
        sealedAvatar:
          type: string
          description: >
            The profile picture: a 256 px WebP **padded to a constant 16 KiB plaintext**, sealed under a field key
            derived from `K_tenant` with the `member-avatar` purpose bound to (tenant scope, the caller's user id)
            (`0x03 || salt(16) || nonce(12) || aead`, base64; ADR 0093 § 9). Opaque base64 the server stores verbatim and
            never interprets. Its length is a **constant** - the exact base64 length of the sealed padded plaintext
            (16384 + 45 bytes -> 21908 chars) - so a photo and a drawing are indistinguishable and the value is provably
            inside the `TEXT` column (65 535).
          contentEncoding: base64
          maxLength: 21908
          example: c2VhbGVkLWF2YXRhcg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 21908) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    IdentityPins:
      type: object
      description: >
        The head of the caller's identity-pin store + its revision (ADR 0104). `blob` is one opaque ciphertext sealed
        under the Master Key, bound to `revision`, that the server relays verbatim; `revision` is the store's monotonic
        optimistic-concurrency counter. A born-empty store is `{ revision: 0 }` with no `blob`.
      required: [revision]
      properties:
        blob:
          type: string
          description: >
            The head — the store's version, its entry count and the digest of every entry — sealed under the Master Key
            (opaque base64), or absent when the store has never been written.
          contentEncoding: base64
          maxLength: 1024
          example: c2VhbGVkLXBpbi1zdG9yZS1oZWFk
        revision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            Monotonic revision for optimistic concurrency. `0` for a born-empty store; bumped by one on every
            successful write. A write must send the revision it last read.
          minimum: 0
          example: 3

    IdentityPinsWrite:
      type: object
      description: >
        One write of the pin store (ADR 0104 decision 4): entries to remove, entries to store, and the new head, applied
        together and only if `revision` is still the stored one (optimistic concurrency → `409 stale_revision`).
      required: [revision, head, put, remove, replaceAll]
      # `replaceAll` already removes everything not put, so a `remove` beside it is the shape's 400 (PinWrite). The
      # conditional sits under `dependentSchemas`, never at the schema's top: there both generators ignore it, while a
      # top-level `if` turns a property that `$ref`s this schema with a sibling (`RotateAccountKeysRequest.identityPins`)
      # into `Any` (measured on openapi-generator 7.23.0, Kotlin and TypeScript). The lists' other rules — a pinId
      # twice, or put and removed — are `422 pins_contradictory`: `uniqueItems` would compare whole entries, and both
      # generators turn a unique list into a set that drops a repeat silently.
      dependentSchemas:
        replaceAll:
          if: { properties: { replaceAll: { const: true } } }
          then: { properties: { remove: { maxItems: 0 } } }
      # Whole, because one built from the properties' examples puts and removes the same pin (the items share
      # `IdentityPinId`'s example), which this operation refuses — the API fuzzing sent it as valid.
      example:
        revision: 3
        head: c2VhbGVkLXBpbi1zdG9yZS1oZWFk
        put: [{ pinId: 17918bc1ecce3ff34ef08970207fef3ec29ee3cb6aacaf4384b96b3b458701e7, entry: c2VhbGVkLXBpbi1lbnRyeQ== }]
        remove: []
        replaceAll: false
      properties:
        revision:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          format: int64
          description: >
            The revision the client last read (the write succeeds only if it still matches the stored revision).
            `0` for the first write of a born-empty store.
          minimum: 0
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'
        head:
          type: string
          description: >
            The new head sealed under the Master Key for the revision it will be stored at (opaque base64 ciphertext the
            server stores verbatim).
          contentEncoding: base64
          maxLength: 1024
          example: c2VhbGVkLXBpbi1zdG9yZS1oZWFk
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1024) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        put:
          type: array
          description: >
            Entries to store, each at its `pinId` (an existing one is replaced). At most 25,000 — the one write that
            carries every entry, a rotation's or a reset's, is bounded by it (ADR 0104 § Consequences).
          maxItems: 25000
          items: { $ref: "#/components/schemas/IdentityPinEntry" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.Size(max = 25000)'
        remove:
          type: array
          # Not `delete`: the TypeScript generator reserves the word and emits a model that does not compile.
          description: The `pinId`s of entries to remove; one that is not stored is ignored. Empty with `replaceAll`.
          maxItems: 25000
          # An example of its own: `IdentityPinId`'s is the one `put` carries, and a pin both put and removed is the
          # `400` this write declares (the API fuzzing built one from the two and sent it as valid).
          items: { $ref: "#/components/schemas/IdentityPinId", example: 5a1f0c3e9b7d2468ace013579bdf2468ace013579bdf2468ace013579bdf2468 }
          example: []
          # The generator types the list `List<String>` and cannot annotate its type argument, so the elements' bounds
          # (`IdentityPinId`'s) ride on the list as `EachElement` (inbox #354; `validate_request_bounds.py` holds them).
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 25000) @field:me.raddatz.veyq.core.http.EachElement(minLength = 64, maxLength = 64, pattern = "^[0-9a-f]{64}$")'
        replaceAll:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [boolean, "null"]
          description: >
            Remove every entry this write does not `put` — the trust reset (an empty set) and the rotation (every entry
            re-keyed under the new Master Key).
          example: false
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'

    IdentityPinEntry:
      type: object
      description: One sealed pin, at the opaque id it is stored at (ADR 0104 decisions 1 and 2).
      required: [pinId, entry]
      properties:
        pinId:
          $ref: "#/components/schemas/IdentityPinId"
        entry:
          type: string
          description: >
            The pin sealed under the Master Key, bound to its `pinId` (opaque base64). Every entry seals to one length.
          contentEncoding: base64
          maxLength: 512
          example: c2VhbGVkLXBpbi1lbnRyeQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 512) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    IdentityPinId:
      x-veyq-visibility: id
      type: string
      description: >
        The opaque id a pin is stored at — `HMAC-SHA256(K_pinIndex, utf8(userId))` under a key derived from the Master
        Key, 32 bytes as 64 lowercase hex characters (ADR 0104 decision 1). Stable while the Master Key is, unlinkable
        across accounts; the server cannot tell whose pin it is.
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
      example: 17918bc1ecce3ff34ef08970207fef3ec29ee3cb6aacaf4384b96b3b458701e7
      x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 64, max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "^[0-9a-f]{64}$")'

    IdentityPinEntryPage:
      type: object
      description: One page of the caller's pin entries, in ascending `pinId` order.
      required: [entries, more]
      properties:
        entries:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/IdentityPinEntry" }
        more:
          x-veyq-visibility: structure
          type: boolean
          description: Whether entries follow this page — ask again with the last `pinId` as `after`.
          example: false

    DeviceRegister:
      type: object
      description: >
        The caller's sealed device register + its revision. `blob` is one opaque ciphertext
        (`symWrap(masterKey, blob, "device-register")`) the server relays verbatim; `revision` is the monotonic
        optimistic-concurrency counter. A born-empty register is `{ blob: null, revision: 0 }`.
      required: [revision]
      properties:
        blob:
          type: string
          description: >
            The device-register plaintext sealed under the Master Key (opaque base64), or null when the
            register has never been written. The server never interprets it — no device name, no count, and no
            device↔family link.
          contentEncoding: base64
          maxLength: 65532
          example: c2VhbGVkLWRldmljZS1yZWdpc3Rlcg==
        revision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            Monotonic revision for optimistic concurrency. `0` for a born-empty register; bumped by one on
            every successful write. A `PUT` must send the revision it last read.
          minimum: 0
          example: 3

    DeviceRegisterUpdate:
      type: object
      description: >
        A new sealed device-register blob to store, guarded by the `revision` the client last read (optimistic
        concurrency → `409 stale_revision` on a mismatch).
      required: [blob, revision]
      properties:
        blob:
          type: string
          description: >
            The device-register plaintext sealed under the Master Key (opaque base64 ciphertext the server
            stores verbatim).
          contentEncoding: base64
          maxLength: 65532
          example: c2VhbGVkLWRldmljZS1yZWdpc3Rlcg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65532) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        revision:
          x-veyq-visibility: structure
          # nullable type + @NotNull: a required primitive binds a missing field to 0/false (src/backend/CLAUDE.md)
          type: [integer, "null"]
          format: int64
          description: >
            The revision the client last read (the write succeeds only if it still matches the stored revision).
            `0` for the first write of a born-empty register.
          minimum: 0
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0) @field:jakarta.validation.constraints.NotNull'

    RotatedWrap:
      type: object
      description: >
        One cold wrap, rewritten to hold the **new** Master Key under the kind of secret it always took — password
        + Secret Key for the `PASSWORD` floor, the Secret Key alone for `RECOVERY`. A change of the password keeps the
        Secret Key; securing the account (`rotateAccountKeys`) writes both wraps under the **new** Secret Key, so the
        old Emergency Kit opens neither.

        It carries **no `method`**: which wrap this is, is the field it arrived in. That is what makes "rewrite
        one cold wrap and leave the other holding the old Master Key" unsayable rather than merely rejected —
        a `RECOVERY` wrap left on the old key would survive as a working path back into a compromised account.

        The salt is **fresh** on both, and that is why no previously-stored `kdfParams` is needed here: the
        `RECOVERY` wrap is deliberately withheld from `GET /api/account/key-material`
        ([ADR 0054](../../docs/decisions/0054-password-recovery-two-factor-release.md)), so its salt is not the
        client's to read, and re-using a salt would leak the rewrite to anyone diffing two dumps. Whether the
        Emergency Kit still opens a wrap is the *Secret Key's* to decide — never the salt's.
      required: [wrappedKey, kdfParams]
      properties:
        wrappedKey:
          type: string
          description: The **new** Master Key wrapped to this method's KEK (opaque base64 ciphertext).
          contentEncoding: base64
          maxLength: 8192
          example: cm90YXRlZC13cmFwcGVkLW1hc3Rlci1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        kdfParams:
          type: string
          description: Argon2id parameters + the **fresh** salt for this rewritten wrap (opaque base64).
          contentEncoding: base64
          maxLength: 1024
          example: a2RmLXBhcmFtcy1yb3RhdGVk
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1024) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RotateAccountKeysRequest:
      type: object
      description: >
        Everything securing the account replaces, in one body, applied atomically or not at all — a partial apply
        leaves an account nothing can unlock.

        **This property set is pinned by `scripts/validate_rotation_shape.py`.** ADR 0060 Decision 1 says there
        is exactly one mode, and the shortcut that would quietly undo it is a *request field*: a `mode`, an
        `identityOnly`, a `scopes` subset would let identity-only rotation return as a flag while every test
        stayed green. A negative has nothing else that can hold it. Every property is required: an optional one is
        a mode spelled by omission.

        What is deliberately absent, so the next reader does not add it back: no wrap `method` — see `RotatedWrap`; no
        list of wraps to delete — every non-cold wrap goes, always, because device-held key material cannot be
        rewritten from here; no self-grants — they are staged before the publish (`putRotationStageGrants`), because
        no bound caps an account's memberships and one request cannot carry them all (cr-secure-the-account),
        and the publish names the stage by `stageId` and `stagedGrantsDigest`; no step index or predecessor — the
        server takes both from the account's stored chain.

        **The two Master-Key-sealed account documents ride in the same body** (`identityPins`,
        `deviceRegister`), re-sealed under the new Master Key and written by the same transaction as everything
        above. The pin store rides as its own write (`writeIdentityPins`' body) with `replaceAll`: a new Master Key is
        a new pin-index key, so every entry moves to a new `pinId` and is re-sealed, with a new head (ADR 0104). Written after the publish they could be left under a key that no longer exists, and every device
        refuses a document that does not open (ADR 0028 Decision 7) — so a rotation that cannot re-seal them does
        not happen. Both are required: an account that never wrote one sends it empty, sealed for revision 1
        against `revision: 0`. **They are not bound into `secretKeyProofSignature`, on purpose.** The proof
        defends against a session holder without the Secret Key, and that holder can already write both
        documents through their own endpoints with the session alone; binding them would change the
        conformance-pinned statement for no defended case.
      required: [identityPublicKey, wrappedIdentityPrivateKey, passwordWrap, recoveryWrap, secretKeyProofSignature, identityPins, deviceRegister, keyChainStep, stageId, stagedGrantsDigest, unreadableScopeIds, authPublicKey, attestationSignature, secretKeyProofPublicKey, secretKeyProofPossession]
      properties:
        identityPublicKey:
          type: string
          description: >
            The freshly minted identity public bundle (serialized, opaque base64) — replaces the directory
            value, and is the identity `keyChainStep` installs and the stage `stageId` declares. A contact's client
            accepts it because the account's key chain reaches it from the head it pinned (ADR 0111 decision 15),
            with no review.
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LWlkZW50aXR5LXB1YmxpYy1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedIdentityPrivateKey:
          type: string
          description: The **new** identity private key wrapped under the **new** Master Key (opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LXdyYXBwZWQtaWRlbnRpdHktcHJpdmF0ZS1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        passwordWrap:
          $ref: "#/components/schemas/RotatedWrap"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        recoveryWrap:
          $ref: "#/components/schemas/RotatedWrap"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        secretKeyProofSignature:
          type: string
          description: >
            Ed25519 signature under the account's **current** Secret-Key proof key (ADR 0060 Decision 2) over
            `veyq/v1/secret-key-proof/rotation`: digests of the account's current identity public key, of the three
            new values above, of both rewritten wraps and of the key-chain step's statement; the current auth public
            key and `authPublicKey`; `secretKeyProofPublicKey`; `stageId` and `stagedGrantsDigest`. The encoding is
            pinned by the `secret_key_proof` crypto vector. Binding the current identity and auth key is what makes a
            captured signature useless after the rotation it authorised.
          contentEncoding: base64
          maxLength: 128
          example: c2VjcmV0LWtleS1wcm9vZi1zaWduYXR1cmU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        identityPins:
          $ref: "#/components/schemas/IdentityPinsWrite"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        deviceRegister:
          $ref: "#/components/schemas/DeviceRegisterUpdate"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        keyChainStep:
          $ref: "#/components/schemas/KeyChainStepSignatures"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        stageId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The stage (`openRotationStage`) whose self-grants this publish applies — it must declare
            `identityPublicKey` (`409 rotation_plan_changed` otherwise).
          example: 5a6e0000-0000-4000-8000-0000000000a1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        stagedGrantsDigest:
          type: string
          description: >
            `rotationStageDigest` over the self-grants the client staged (the `rotation_stage` crypto vector), bound into
            the proof statement. The server recomputes it over the staged rows and refuses another
            (`409 rotation_plan_changed`), so the Secret Key's proof covers exactly what is applied.
          contentEncoding: base64
          maxLength: 64
          example: c3RhZ2VkLWdyYW50cy1kaWdlc3Q=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 64) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        unreadableScopeIds:
          x-veyq-visibility: id
          type: array
          description: >
            The scopes the caller holds a grant on that this device cannot open (the grant's signature or the epoch
            floor refuses it) — declared, so the server's completeness check can tell "left out on purpose" from
            "forgotten". Each keeps its grant untouched and gets no pending re-key row. Empty in the ordinary case.
          maxItems: 10000
          items: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
          example: []
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 10000)'
        authPublicKey:
          type: string
          description: >
            The Ed25519 auth public key derived from the password the account keeps after this rotation (ADR 0003) —
            a new one when the member chose a new password, the same one when they kept theirs. Always sent, so
            "keep the password" is not a mode by omission.
          contentEncoding: base64
          maxLength: 8192
          example: bmV3LWF1dGgtcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        attestationSignature:
          type: string
          description: >
            Ed25519 signature over `authPublicKey`'s raw bytes, produced with the **current** auth private key — the
            password half of the gate, verified as `changePassword` verifies its own (`403 attestation_failed`).
          contentEncoding: base64
          maxLength: 256
          example: YXR0ZXN0YXRpb24tc2lnbmF0dXJl
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        secretKeyProofPublicKey:
          type: string
          description: >
            The Secret-Key proof public key of the **new** Secret Key (ADR 0111 decision 6) — what change-password,
            recovery, change-email and the next rotation verify against from the commit on. Installed by
            `keyChainStep` beside the new identity.
          contentEncoding: base64
          maxLength: 128
          example: bmV3LXNlY3JldC1rZXktcHJvb2YtcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        secretKeyProofPossession:
          type: string
          description: >
            The **new** proof key's Ed25519 signature over the same rotation statement `secretKeyProofSignature`
            signs — proof that `secretKeyProofPublicKey` is held, so a client bug cannot register a key nobody has
            (`403 secret_key_proof_failed`).
          contentEncoding: base64
          maxLength: 128
          example: cG9zc2Vzc2lvbi1zaWduYXR1cmU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    KeyChainStepSignatures:
      type: object
      description: >
        The two signatures of the key-chain step this rotation appends (ADR 0111 decision 7, the `key_chain` crypto
        vector). The step's statement is not sent: the server rebuilds it from the account's stored head and next
        index, the stored identity and proof key it retires, and the request's `identityPublicKey` and
        `secretKeyProofPublicKey` it installs — so a step cannot name keys the request does not publish.
      required: [identitySignature, proofSignature]
      properties:
        identitySignature:
          type: string
          description: >
            The **current** identity's Ed25519 signature over the step statement (`422 key_chain_step_invalid` when it
            does not verify under the stored identity).
          contentEncoding: base64
          maxLength: 128
          example: c3RlcC1pZGVudGl0eS1zaWduYXR1cmU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        proofSignature:
          type: string
          description: >
            The **current** Secret-Key proof key's Ed25519 signature over the same statement
            (`403 secret_key_proof_failed` when it does not verify under the stored proof key).
          contentEncoding: base64
          maxLength: 128
          example: c3RlcC1wcm9vZi1zaWduYXR1cmU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RotateAccountKeysResult:
      type: object
      description: >
        What the publish left (uc.account.rotate-keys §9): the scopes it re-granted to the new identity. Not a success
        tick — each of them still waits for its next epoch, which the account mints itself, from any of its devices,
        and `listRotationScopeStates` follows each until it reads `secured`.
      required: [regrantedScopeIds]
      properties:
        regrantedScopeIds:
          x-veyq-visibility: id
          type: array
          description: >
            Every scope, in every tenant, whose current epoch the publish granted to the new identity — the account's
            memberships that carry a grant, minus `unreadableScopeIds`. Each has a pending re-key row and reads
            `waiting` (or `blocked`) until its next epoch is committed.
          items:
            type: string
            maxLength: 36
          example: [7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c, 1a2b3c4d-5e6f-4071-8213-9a0b1c2d3e4f]

    RotationBlockedReason:
      x-veyq-visibility: enum
      type: string
      description: >
        Why a scope's next epoch cannot be committed now: its tenant is suspended (`tenant_suspended`), or the scope is
        being deleted (`scope_deleting`). Both are writes the scope refuses to everyone (uc.spaces.scope-access).
      enum: [tenant_suspended, scope_deleting]
      example: tenant_suspended

    RotationPlanScope:
      type: object
      description: >
        One scope a rotation must carry, and the caller's own grant on it — what `toOpenedScope` reads from a
        `listMyScopes` row, served for every tenant (`getAccountRotationPlan`).
