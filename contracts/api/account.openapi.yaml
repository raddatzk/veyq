        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The tenant the scope lives in.
          example: 1a2b3c4d-5e6f-4071-8213-9a0b1c2d3e4f
        currentEpoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope's current epoch — the one the self-grant must carry.
          minimum: 0
          example: 2
        blocked:
