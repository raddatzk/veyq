        marks what only `FULL` carries.
      enum: [FULL, REDUCED]
      example: FULL

    StatementBasis:
      x-veyq-visibility: enum
      type: string
      description: What led to the measure — a report, or an authority's order (ADR 0093 § 12).
      enum: [REPORT, ORDER]
      example: REPORT

    ModerationStatementInput:
      type: object
      description: >
        A measure's statement of reasons as the moderator gives it (ADR 0093 § 7): the ground, and the facts — sealed to
        the moderation key for the log (`facts`, `moderation-note` [epoch, caseId]) and once more under a fresh `K_facts`
        for the affected (`sealedFacts`), whose key alone is wrapped to each of them (`factsKeyFor`). The three come
        together or not at all (`400 invalid_request`).
      required: [statementId, ground]
      properties:
        statementId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The statement's id, minted by the client — the facts sealed once and every wrap of their key are bound to it
            (ADR 0072 Decision 3); one already taken is refused (`409 id_taken`).
          example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
        ground: { $ref: "#/components/schemas/ModerationGround" }
        provision: { $ref: "#/components/schemas/StatementProvision" }
        facts:
          oneOf:
            - $ref: "#/components/schemas/SealedModerationNote"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'
        sealedFacts:
          type: [string, "null"]
          description: >
            The facts sealed once, under the statement's fresh `K_facts` (`moderation-statement-facts` [caseId,
            statementId]) — the one copy every affected member opens; null without facts. At most the seal of 8,000 UTF-8
            bytes: 1 + 12 + 8,192 + 16 bytes.
          contentEncoding: base64
          minLength: 1
          maxLength: 10964
          example: c2VhbGVkLW9uY2U=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 10964) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        factsKeyFor:
          type: array
          maxItems: 6000
          description: >
            `K_facts` wrapped to each member `getModerationStatementRecipients` lists; empty without facts. The same bound
            as that list, at most 6,000 — what one `takeModerationMeasure` body carries under the server's 10 MiB request
            limit at 1,650 bytes a member (`StatementRecipients.MAX_SEALED`), whatever the facts' length. Past it the key
            cannot be wrapped to every member in one step, and the server refuses rather than tell only some
            (`422 statement_recipients_too_many`).
          items: { $ref: "#/components/schemas/WrappedFactsKey" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.Size(max = 6000)'
        deferral:
          description: >
            An authority asked that the affected not be told yet (TCO Art. 11(3); ADR 0093 § 7 — the authority's switch,
            never the moderator's): the statement is held until `until`, at most six weeks (42 days) from now
            (`400 deferral_out_of_bounds`), with the authority's request sealed as the reason. Null = sent with the measure.
          oneOf:
            - $ref: "#/components/schemas/ModerationStatementDeferral"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    WrappedFactsKey:
      type: object
      description: A statement's `K_facts`, wrapped to one affected member's identity.
