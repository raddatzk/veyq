openapi: 3.1.0
info:
  title: veyq Moderation API
  version: 0.1.0
  description: >
    The **moderator's** operations, on the public listener: web/'s moderation surface calls them from any tenant host
    the moderator signs in on ([ADR 0099](../../docs/decisions/0099-moderators-share-one-instance-moderation-key-and-review-without-a-vault.md)
    § 6, uc.moderation.serve-as-moderator). A moderator is an existing account the Server Owner appointed on the
    admin channel (`instance.openapi.yaml`, tag `instance-moderation`); this spec carries none of the Server Owner's
    operations.

    **Two gates, both needed** (ADR 0099 § 2): the `MODERATOR` role — an accepted, unremoved appointment — names who
    acted, and the **key proof** makes a stolen session without the instance moderation key worth nothing. An
    operation that declares the two proof headers (`X-Veyq-Moderation-Challenge`, `X-Veyq-Moderation-Signature`) is
    refused unless they carry an Ed25519 signature with the **current** epoch's moderation key over the statement
    `moderation-proof` (the challenge, this operation's `operationId`, the case id in its path or none), made over a
    challenge from `createModerationChallenge` that is single use and lives five minutes. The few operations a
    newcomer needs before holding the key (their appointment, accepting it, confirming their address, reading their
    grants, asking for a challenge) carry no proof, and the posture sweep lists each with its reason.

    Operator-blind: the server stores each epoch's public bundle and the grants sealed to each moderator's identity,
    never `M_n` or a private half. Authorization is enforced by code annotations, not this spec (ADR 0008).
tags:
  - name: moderation
    description: >
      A moderator's own appointment, their grants of the instance moderation key and their delivery to a newcomer,
      the key proof's challenge, and the published key a reporter seals to. One tag = one resource interface owning
      the `/api/moderation` subtree.
  - name: statements
    description: >
      The affected member's side of a measure (ADR 0093 § 7, uc.moderation.object-to-a-measure): the statements of
      reasons addressed to the caller and their one objection per measure. No role and no key proof — the caller is
      told only what names them as a recipient. Its own tag so its resource owns the `/api/statements` subtree.
  - name: reports
    description: >
      A member's report of what their space holds (ADR 0093 §§ 1-2, uc.moderation.report) — the reporter's side, not
      the moderator's: no role and no key proof, only membership of the space. A guest reports through the link
      (`sharing.openapi.yaml`, `reportInShare`). Its own tag so its resource owns the `/api/scopes/{scopeId}/reports`
      subtree and nothing wider.

paths:
  /api/scopes/{scopeId}/reports:
    post:
      tags: [reports]
      operationId: reportInScope
      summary: Report nodes and media of a space the caller belongs to → a reference and the time.
      description: >
        A member's report (ADR 0093 §§ 1-2). Every item must be a live node of the space (`NODE`) or an application's
        item on one (`ITEM`, a Memories medium); a member reports no `LINK`. One item outside the space — or a `LINK`
        — refuses the whole report (`404 report_item_not_found`), as a space the caller is not a member of does (`404
        scope_not_found`). Then, in one transaction, the report is stored, each item's open case is found or opened,
        and a hold is taken where the case holds none alive
        ([en.moderation.hold](../../docs/features/moderation/enablers/en.moderation.hold.md)); after it the
        moderators are mailed (category and "new case" only) and the receipt goes to `receiptAddress` if one was
        given. Nothing is blocked. Bounded per account, and by a cap on the caller's open reports (`429
        too_many_open_reports`, owner decision Q8).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSubmission" }
            example:
              category: ILLEGAL_CONTENT
              epoch: 1
              sealedReport: AXJlcG9ydA==
              items: [{ kind: NODE, id: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b, sealedShare: AnJlcG9ydC1zaGFyZQ== }]
      responses:
        "201":
          description: Received.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "400":
          description: Malformed request — a NODE or ITEM without its id, a LINK with one (`invalid_request`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            The space's tenant is suspended (`tenant_suspended`, ADR 0066; only an accepted member is told so); or a
            moderator barred this account from reporting (`reporter_barred`, ADR 0093 § 5).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: reporter_barred } }
        "404":
          description: >
            No such space, or the caller is not an accepted member of it (`scope_not_found`, indistinguishable); or an
            item that is no live node or item of it, or a `LINK` — a member's request comes through no link
            (`report_item_not_found`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: report_item_not_found } }
        "409":
          description: "`epoch` is not the moderation key's current epoch (`moderation_epoch_changed`): read the key again and seal anew."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_epoch_changed } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            An item named twice — the same kind and id (`report_item_repeated`, nothing stored): a rule across the items
            no schema states.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: report_item_repeated } }
        "429":
          description: Too many reports from this account (`rate_limited`), or too many of its reports still open (`too_many_open_reports`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: too_many_open_reports } }

  /api/moderation/key:
    get:
      tags: [moderation]
      operationId: getModerationKey
      summary: Read the current epoch's public bundle — what a report is sealed to.
      description: >
        The instance moderation key's current epoch and its public bundle (ADR 0099 § 2): anyone may read it, because a
        reporter is mostly a guest with nothing pinned and seals once to this one key. `404 moderation_off` while no
        epoch exists (first-run setup mints epoch 1) — then there is nothing to report to, and the report action is off.
        Unauthenticated; rate-limited per client address.
      security: []
      responses:
        "200":
          description: The current epoch and its public bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationEpochKey" }
              example:
                epoch: 2
                kemPublicKey: a2VtLXB1YmxpYy1rZXk=
                signPublicKey: c2lnbi1wdWJsaWMta2V5
        "404":
          description: No epoch exists yet (`moderation_off`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_off }
        "429":
          description: Too many requests from this address; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/moderation/appointment:
    get:
      tags: [moderation]
      operationId: getMyModeratorAppointment
      summary: Read the caller's own appointment as a moderator.
      description: >
        Whether the caller is appointed (`PENDING` until they accept), a moderator (`ACCEPTED`), or neither (`NONE`),
        where the confirmation of their address stands, and whether they still wait for the key. Any signed-in account
        may ask about itself; it learns nothing about anyone else. No key proof: a pending appointee holds no key.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's appointment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorAppointment" }
              example:
                state: ACCEPTED
                appointedAt: 2026-10-17T09:00:00Z
                acceptedAt: 2026-10-17T09:30:00Z
                address: deputy@example.com
                confirmation: CONFIRMED
                awaitingKey: false
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
    delete:
      tags: [moderation]
      operationId: stepDownAsModerator
      summary: Step down as a moderator.
      description: >
        The caller's appointment ends at once: the `MODERATOR` role and their grants for every epoch go, and the
        Server Owner is told a rotation is due (ADR 0099 § 4; reports keep sealing to the current epoch until the Server
        Owner mints the next). Key-proved. `409 moderation_last_holder` while it would leave no accepted moderator
        holding the current epoch — the key would be lost with them (ADR 0099 § 5).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "204":
          description: Stepped down.
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            `moderation_proof_invalid` = the key proof is missing, its challenge is unknown, spent or expired, or the
            signature does not verify under the current epoch's key for this operation; or the caller is no moderator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_proof_invalid }
        "409":
          description: The caller is the last moderator holding the key (`moderation_last_holder`). Nothing changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_last_holder }

  /api/moderation/appointment/acceptance:
    post:
      tags: [moderation]
      operationId: acceptModeratorAppointment
      summary: Accept a pending appointment, which mails a code to confirm the caller's address.
      description: >
        Turns the caller's pending appointment into an accepted one — from now on their sessions carry the
        `MODERATOR` role — and sends a one-time code to their account address through the instance mail, to be typed
        into `confirmModeratorAddress` ([ADR 0097](../../docs/decisions/0097-an-instance-looks-for-new-releases-and-mails-its-server-owner.md)
        decision 5). The surface shows, before this, what accepting means (ADR 0099 § 1). Accepting an accepted
        appointment again changes nothing. No key proof: an appointee holds no key until a holder delivers it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted; the appointment as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorAppointment" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: The caller has no appointment (`not_appointed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_appointed }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/moderation/appointment/confirmation-code:
    post:
      tags: [moderation]
      operationId: sendModeratorAddressCode
      summary: Mail a new code to confirm the caller's address.
      description: >
        A new one-time code to the caller's account address, replacing any earlier one — for a code that expired, was
        entered wrong too often, or went to an address the account no longer has (ADR 0097 decision 5). No key proof,
        so a moderator still waiting for the key can confirm their address.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The code was attempted; the appointment as it now stands (`confirmation` says whether it went out).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorAppointment" }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is no moderator (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/moderation/appointment/confirmation:
    post:
      tags: [moderation]
      operationId: confirmModeratorAddress
      summary: Confirm the caller's address with the code the instance mail carried.
      description: >
        Takes the last code sent to the caller (ADR 0097 decision 5). It confirms only while it is live (unexpired, not
        spent by wrong entries) and only for the address it was sent to, which must still be the account's; a wrong
        entry counts against it. Once confirmed, moderation notices may reach this address. No key proof.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeratorAddressConfirmation" }
            example: { code: "48213075" }
      responses:
        "200":
          description: The address is confirmed; the appointment as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorAppointment" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is no moderator (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }
        "409":
          description: >
            `mail_code_invalid` = no code is outstanding, it expired, it was entered wrong too often, the address changed
            since it was sent, or this is not it. Ask for a new one. Nothing is confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: mail_code_invalid }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/moderation/grants:
    get:
      tags: [moderation]
      operationId: listMyModerationGrants
      summary: Read every live epoch's public bundle and the caller's grant for each.
      description: >
        What the moderation surface opens on unlock (ADR 0099 § 3): for every live epoch its published bundle and the
        grant sealed to the caller's identity, or null where the caller waits for a holder to deliver it. The client
        opens each grant, derives the bundle from the opened `M_n` and refuses to go on where it differs from the
        published one. No key proof: this is how a moderator comes to hold the key.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every live epoch, oldest first, with the caller's grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationGrants" }
              example:
                currentEpoch: 2
                epochs:
                  - epoch: 1
                    kemPublicKey: a2VtLXB1YmxpYy1rZXk=
                    signPublicKey: c2lnbi1wdWJsaWMta2V5
                    sealedGrant: c2VhbGVkLWdyYW50
                  - epoch: 2
                    kemPublicKey: a2VtLXB1YmxpYy1rZXk=
                    signPublicKey: c2lnbi1wdWJsaWMta2V5
                    sealedGrant: null
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is no moderator (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }

  /api/moderation/challenge:
    post:
      tags: [moderation]
      operationId: createModerationChallenge
      summary: Ask for a single-use challenge to sign a key proof over.
      description: >
        32 random bytes, bound to the caller's account, single use, valid for five minutes. The next key-proved call
        signs `moderation-proof` over it and sends both in its proof headers. No key proof (it is the proof's input).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A fresh challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationChallenge" }
              example: { challenge: Y2hhbGxlbmdlLWJ5dGVzLWNoYWxsZW5nZS1ieXRlcyE= }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is no moderator (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }
        "429":
          description: Too many requests from this caller; retry after the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: rate_limited }

  /api/moderation/deliveries:
    get:
      tags: [moderation]
      operationId: listPendingModerationDeliveries
      summary: List the accepted moderators still missing an epoch the caller holds.
      description: >
        Every accepted moderator who lacks a grant for a live epoch, with their identity public key (to pin-check and
        seal to) and the epochs they miss that the caller holds (ADR 0099 § 3). Key-proved: only a holder delivers, and
        the surface opens the queue after this succeeds.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The pending deliveries the caller can make.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationDeliveries" }
              example:
                deliveries:
                  - accountId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
                    identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                    epochs: [1, 2]
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The key proof failed, or the caller is no moderator (`moderation_proof_invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_proof_invalid }

  /api/moderation/deliveries/{accountId}:
    put:
      tags: [moderation]
      operationId: putModerationDelivery
      x-veyq-concurrency:
        mode: last-writer-wins
        reason: >-
          Idempotent per (moderator, epoch): every holder seals the same M_n, so whichever delivery lands first stays
          and a later one for an epoch already granted changes nothing.
      summary: Deliver the epochs the recipient is missing, sealed to their identity.
      description: >
        A holder's client, after the pin check (ADR 0028), seals every epoch it holds that the recipient misses to the
        recipient's identity (`moderation-grant` [epoch]) and uploads them with the identity key it sealed to. Refused
        unless the recipient is an accepted moderator (`404 not_moderator`), the identity key is still theirs
        (`409 identity_changed`: re-read and pin-check again), and the caller holds a grant of every epoch it delivers
        (`409 not_holder`). An epoch the recipient already holds is skipped. Key-proved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModeratorAccountId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationDelivery" }
            example:
              identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
              grants:
                - epoch: 1
                  sealedGrant: c2VhbGVkLWdyYW50
      responses:
        "204":
          description: Delivered (or already held).
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The key proof failed, or the caller is no moderator (`moderation_proof_invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: moderation_proof_invalid }
        "404":
          description: The recipient is no accepted moderator (`not_moderator`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_moderator }
        "409":
          description: >
            `identity_changed` = the recipient's identity is no longer the one sealed to; `not_holder` = the caller holds
            no grant of an epoch it delivers, or the epoch is not live. Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: identity_changed }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases:
    get:
      tags: [moderation]
      operationId: listModerationCases
      summary: The queue — every case of the instance in clear fields, urgent first.
      description: >
        The instance-wide queue (ADR 0093 § 3, uc.moderation.review-a-case): every case of every tenant, in the clear
        fields the server holds — the category, the item's kind, when it was first and last reported, how many reports,
        the tenant and its domain, the state and the hold's end. Nothing sealed. `OPEN` and `DECIDED` cases by default;
        `state` narrows to one state (`CLOSED` lists the closed ones, whose measures may still stand). Ordered by
        category (the urgent first), then the first report. Key-proved, with no case.
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          # An empty value (`?state=`) is this parameter's absence: Quarkus REST
          # never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: Only cases in this state; absent = `OPEN` and `DECIDED`.
          schema: { $ref: "#/components/schemas/ModerationCaseState" }
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationQueue" }
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }

  /api/moderation/cases/{caseId}:
    get:
      tags: [moderation]
      operationId: getModerationCase
      summary: A case — its reports (sealed), measures, proposals, hold, targets and log.
      description: >
        Everything the surface shows of one case (uc.moderation.review-a-case step 2): each report's clear fields and its
        sealed part (the browser opens it with the epoch's key), the measures and proposals, the hold, the targets a
        decision may name — the links that reach the item or that its reports came through, the uploaders the held rows
        name — and the case's log. No report share: those are the review's (`getCaseReview`), which logs the opening.
        Key-proved over this case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404": { $ref: "#/components/responses/CaseNotFound" }

  /api/moderation/cases/{caseId}/dismissal:
    post:
      tags: [moderation]
      operationId: dismissModerationCase
      summary: Dismiss an open case — it closes, and its hold ends at once.
      description: >
        ADR 0093 §§ 4–5: the case closes, its hold ends at once (the snapshot and the pins go, so the reclaim sweep
        catches up on whatever was deleted meanwhile), and the case's events are dated to 31 December of the third year
        after the close. An optional note, sealed in the browser to the moderation key (`moderation-note` [epoch,
        caseId]). Only an `OPEN` case (`409 case_not_open`): a decided one is closed by lifting its measures. A reporter
        who left a contact is told the dismissal: the browser opened their sealed contact and sends it in
        `reporterNotices`; the server mails it once from memory (instance mail, ADR 0097 decision 3), never stores it,
        and logs `DECISION_SENT`. Key-proved over this case; logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationDismissal" }
            example: { note: { epoch: 2, sealedNote: c2VhbGVkLW5vdGU= }, reporterNotices: [{ reportId: 4e5f9a8b-1c2d-4e4f-8a6b-4f2c9a1e7b3d, address: reporter@example.com }] }
      responses:
        "200":
          description: Dismissed; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: "`case_not_open` = the case is decided or closed; `moderation_epoch_changed` = the note is not sealed to the current epoch."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: case_not_open } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/measures:
    post:
      tags: [moderation]
      operationId: takeModerationMeasure
      summary: Take a moderator's step on a target the case knows — block the share, the content or a guest uploader.
      description: >
        ADR 0093 § 6, ADR 0099 § 6 (uc.moderation.take-a-measure). A measure is a row naming its kind, its target id,
        this case, who took it and when; it deletes nothing. `SHARE` blocks a link (every guest path answers as an unknown
        link; neither a reactivation nor a re-issue passes while it stands); `CONTENT` blocks the reported node or medium
        (every byte read answers `451 blocked_by_operator`, every listing marks it); `GUEST_IDENTITY` blocks a guest
        uploader's identity and the link it came through. The target must be one the case knows (`getModerationCase`'s
        `targets`, the reported item for `CONTENT`) — else `404 moderation_target_unknown`. A step already in force on
        the target is refused (`409 moderation_measure_exists`).

        **Its statement of reasons is sent with it** (ADR 0093 § 7, uc.moderation.object-to-a-measure): the ground, and
        the facts sealed to the moderation key and once more under a fresh `K_facts`, which alone is wrapped to each
        affected member's identity (`getModerationStatementRecipients` lists them for this step and target). The
        statement's id is the client's, the facts bound to it (`409 id_taken` when it is not free). In the *club, organisation or company*
        operating mode the facts and the provision or clause relied on are required (`400 statement_facts_required`,
        `400 statement_provision_required`); in *private* both are optional. Facts
        sealed for other members than the server would tell are refused (`409 statement_recipients_changed`: read the
        recipients again). The case is then `DECIDED` and its hold ends six months after the statement is sent — from
        the decision where nobody can be told. The reporters in `reporterNotices` are told the decision, as on a
        dismissal. Key-proved over this case; logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationMeasureRequest" }
            example: { kind: CONTENT, targetId: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b, statement: { statementId: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e, ground: TERMS_BREACH, facts: { epoch: 2, sealedNote: c2VhbGVkLWZhY3Rz }, sealedFacts: c2VhbGVkLW9uY2U=, factsKeyFor: [{ accountId: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a, wrappedFactsKey: d3JhcHBlZC1rZXk= }] } }
      responses:
        "201":
          description: Taken; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400":
          description: "`invalid_request` = the request was malformed, or the facts for the log, the facts sealed once and their wrapped keys do not come together; `statement_facts_required` / `statement_provision_required` = the operating mode asks for the facts / the provision or clause relied on and none was given."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: statement_facts_required } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `moderation_target_unknown` = the target is none the case knows, or the step does not fit the item."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_target_unknown } }
        "409":
          description: >
            `moderation_measure_exists` = this step is already in force on the target; `case_closed` = the case is
            closed; `moderation_epoch_changed` = the note or the facts are not sealed to the current epoch;
            `statement_recipients_changed` = `factsKeyFor` does not name exactly the members the statement goes to;
            `id_taken` = the statement's id is not free (ADR 0072 Decision 3).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_measure_exists } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: "`statement_recipients_too_many` = with facts, the statement would reach more members than one step can wrap their key to (6,000, `ModerationStatementRecipients.accounts`); nobody is told only in part."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: statement_recipients_too_many } }

  /api/moderation/cases/{caseId}/measures/{measureId}/lift:
    post:
      tags: [moderation]
      operationId: liftModerationMeasure
      summary: Lift a measure of this case — the target serves again unchanged.
      description: >
        Records when the measure was lifted and by whom; the target serves again as it was (a block deleted nothing).
        Lifting the case's last measure in force ends its hold at once. A reporter's bar is lifted here too. A measure
        already lifted changes nothing. Key-proved over this case; logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationDecisionNote" }
            example: {}
      responses:
        "200":
          description: Lifted; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `measure_not_found` = no measure of this case has that id."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: measure_not_found } }
        "409":
          description: "`moderation_epoch_changed` = the note is not sealed to the current epoch."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_epoch_changed } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/proposals:
    post:
      tags: [moderation]
      operationId: proposeModerationStep
      summary: Propose a Server Owner's step — block a member uploader's sign-in, or take the tenant offline.
      description: >
        ADR 0099 § 6 and decided with the owner 2: the two steps that reach beyond what was reported stay the Server
        Owner's. The case records the proposal; the Server Owner sees it on the admin channel (`getModerationSteps`) and
        takes or declines it. `MEMBER_SIGN_IN` names a member uploader the case knows (`targets.uploaders`);
        `TENANT_OFFLINE` names no target (it is the case's tenant). An open proposal of the same step and target is not
        made twice (`409 moderation_proposal_exists`). Key-proved over this case; logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationProposalRequest" }
            example: { step: TENANT_OFFLINE }
      responses:
        "201":
          description: Proposed; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `moderation_target_unknown` = the account is no member uploader the case knows, or the case's space has no tenant left."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_target_unknown } }
        "409":
          description: "`moderation_proposal_exists` = the same step on the same target is open; `case_closed`; `moderation_epoch_changed`."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_proposal_exists } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/hold/extension:
    post:
      tags: [moderation]
      operationId: extendModerationHold
      summary: Extend the case's hold, with a concrete reason sealed to the moderation key.
      description: >
        ADR 0093 § 4: an extension needs a reason (an authority's request, an objection, a lawyer's letter, a lawsuit, an
        Art. 18 report in progress), sealed in the browser (`moderation-note` [epoch, caseId]) and logged with its own
        end, and names its `reasonType` in the clear — metadata only, the details stay sealed. On a case of child sexual
        abuse material only `AUTHORITY_REFERENCE` or `ART18_REPORT_IN_PROGRESS` extends the hold (§ 184b(5) StGB: keeping
        that content serves only the report to an authority); any other type, or none, is refused there
        (`409 extension_reason_not_allowed`, owner 2026-10-18). On every other case the type is optional. `until` must lie
        after the hold's current end and at most six months (183 days) from now (`400 extension_out_of_bounds`); without
        a new reason the hold ends then. Only while the case holds a hold alive (`409 nothing_held`). Key-proved over this
        case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationHoldExtension" }
            example: { until: 2027-04-01T00:00:00Z, reasonType: AUTHORITY_REFERENCE, reason: { epoch: 2, sealedNote: c2VhbGVkLXJlYXNvbg== } }
      responses:
        "200":
          description: Extended; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400":
          description: "`invalid_request`, or `extension_out_of_bounds` = `until` is not after the current end, or more than six months from now."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: extension_out_of_bounds } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: "`nothing_held` = the case holds no hold alive; `moderation_epoch_changed` = the reason is not sealed to the current epoch; `extension_reason_not_allowed` = on a case of child sexual abuse material, a reason type other than an authority's reference or an Art. 18 report in progress."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: nothing_held } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/statement-recipients:
    get:
      tags: [moderation]
      operationId: getModerationStatementRecipients
      summary: Who a step's statement of reasons would reach — the members to wrap its facts' key to.
      description: >
        ADR 0093 § 7 (uc.moderation.object-to-a-measure step 2): for the step `kind` on its target, the members the
        statement goes to — the creator of a blocked link or of the link a blocked guest came through, the uploaders the
        held rows name, every owner of the space on a content block — each with the identity public bundle to wrap the
        facts' key to (`moderation-facts-key` [caseId, statementId, accountId]), and how many guests it names (they are
        told nothing in veyq).
        The same target rules as `takeModerationMeasure` (`404 moderation_target_unknown`). The list is whole or refused
        (`422 statement_recipients_too_many`), never cut: a statement reaches every affected member. Key-proved over
        this case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - name: kind
          in: query
          # An empty value (`?kind=`) is this parameter's absence: Quarkus REST
          # never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: true
          description: The step, as `takeModerationMeasure` names it.
          schema: { type: string, enum: [SHARE, CONTENT, GUEST_IDENTITY] }
        - name: targetId
          in: query
          # An empty value (`?targetId=`) is this parameter's absence: Quarkus REST
          # never converts it (cr-api-fuzzing).
          allowEmptyValue: true
          required: false
          description: For `CONTENT` and `GUEST_IDENTITY`, the target's id.
          schema: { type: string, format: uuid }
        - name: shareId
          in: query
          required: false
          description: For `SHARE`, the link.
          schema: { type: string, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The recipients.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationStatementRecipients" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `moderation_target_unknown`."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_target_unknown } }
        "422":
          description: "`statement_recipients_too_many` = the statement would reach more members than one step can seal its facts to (4,000, `ModerationStatementRecipients.accounts`); nobody is told only in part."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: statement_recipients_too_many } }

  /api/moderation/cases/{caseId}/objections/{objectionId}/decision:
    post:
      tags: [moderation]
      operationId: decideModerationObjection
      summary: Decide an objection — uphold the measure, or lift it.
      description: >
        ADR 0093 § 7, ADR 0099 § 5 (uc.moderation.object-to-a-measure step 9): `LIFT` lifts the measure the objection
        answers (as `liftModerationMeasure` does, the case closing with its last one), `UPHOLD` keeps it. **Another
        moderator decides:** the account that took the measure is refused (`409 objection_needs_another_moderator`)
        while another accepted moderator holds the current epoch; with no other, its decision is accepted and logged as
        its own review (`OBJECTION_SELF_REVIEWED`), and the answer to the objector says so. An objection is decided
        once (`409 objection_decided`). The objector is mailed that the answer is in veyq. Key-proved over this case;
        logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - name: objectionId
          in: path
          required: true
          description: The objection's id.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationObjectionDecision" }
            example: { outcome: UPHOLD }
      responses:
        "200":
          description: Decided; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `objection_not_found` = no objection of this case has that id."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: objection_not_found } }
        "409":
          description: >
            `objection_needs_another_moderator` = the caller took the measure and another accepted moderator holds the
            key; `objection_decided` = it was decided already; `moderation_epoch_changed` = the note is not sealed to
            the current epoch.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: objection_needs_another_moderator } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/statements:
    get:
      tags: [statements]
      operationId: listMyStatements
      summary: The statements of reasons addressed to the caller.
      description: >
        ADR 0093 § 7 (uc.moderation.object-to-a-measure step 5): every statement that names the caller as a recipient,
        newest first — the measure, its target, the ground, how it came about, its form by the operating mode now (`FULL`
        or `REDUCED`, ADR 0093 § 14), the facts sealed to the caller's identity, whether the measure is in force, the
        contact address statements name, and the objection's state and answer. Never the moderator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's statements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyModerationStatements" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }

  /api/statements/{statementId}/objection:
    post:
      tags: [statements]
      operationId: objectToStatement
      summary: Object to the measure a statement names — once, in free text sealed to the moderation key.
      description: >
        ADR 0093 § 7 (uc.moderation.object-to-a-measure step 8): the objection is sealed in the browser to the
        moderation key's current epoch (`moderation-objection` [epoch, statementId]). It reopens the case and the
        moderators are mailed. One objection per measure (`409 objection_exists`), and only while the measure is in
        force (`409 measure_not_in_force`). A caller the statement does not name answers as an unknown statement.
      security:
        - bearerAuth: []
      parameters:
        - name: statementId
          in: path
          required: true
          description: The statement's id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectionSubmission" }
            example: { epoch: 2, sealedObjection: c2VhbGVkLW9iamVjdGlvbg== }
      responses:
        "201":
          description: Received; the statement as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationStatement" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "404":
          description: "`statement_not_found` = no statement names the caller with that id."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: statement_not_found } }
        "409":
          description: >
            `objection_exists` = the measure has its objection already; `measure_not_in_force` = the measure was lifted;
            `moderation_epoch_changed` = the objection is not sealed to the current epoch: read the key again.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: objection_exists } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "429":
          description: Too many objections from this account (`rate_limited`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rate_limited } }

  /api/moderation/cases/{caseId}/reports/{reportId}/bar:
    post:
      tags: [moderation]
      operationId: barModerationReporter
      summary: Bar the reporter of one of this case's reports from reporting again.
      description: >
        ADR 0093 § 5: the reporter is the reporting member's account, or the link a guest reported through. Every
        further report from that account, or through that link, is refused (`403 reporter_barred`) until the bar — a
        measure of kind `REPORTER` on this case — is lifted (`liftModerationMeasure`). The reports already made stay.
        A reporter already barred is not barred twice (`409 moderation_measure_exists`). Key-proved over this case;
        logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationDecisionNote" }
            example: {}
      responses:
        "201":
          description: Barred; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `report_not_found` = no report of this case has that id."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: report_not_found } }
        "409":
          description: "`moderation_measure_exists` = the reporter is barred already; `moderation_epoch_changed`."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_measure_exists } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/orders:
    post:
      tags: [moderation]
      operationId: enterModerationOrder
      summary: Enter an authority's order — a removal order blocks the share and its content by id at once.
      description: >
        ADR 0093 § 12, ADR 0099 § 6 (uc.moderation.authority-order): the moderator's door; the Server Owner's twin is
        `enterInstanceModerationOrder` on the admin channel, and both run one handler. With no review of its own (the
        authority has reviewed), a `REMOVAL` blocks the share and the node it is rooted at with everything below it — a
        block already in force on either stays and counts — and writes each new block's statement of reasons (basis
        `ORDER`, ground terrorist content), sent at once unless `deferStatementUntil` holds it. Every kind opens a
        decided case with a hold and no report, ending six months after the block (`REMOVAL`), 60 days after receipt
        (`PRESERVATION`) or after `holdDays`, else six months (`INFORMATION`); no extension, lift or decision ends it
        sooner. A share the server does not know is recorded with no case and no block (`found: false`, the Annex III
        draft). Logged (`ORDER_RECEIVED`, the reference sealed). Key-proved, with no case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorityOrderRequest" }
            example: { id: 3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b, kind: REMOVAL, shareId: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i, receivedAt: 2026-10-18T07:12:00Z, reference: { epoch: 2, sealedReference: c2VhbGVkLXJlZmVyZW5jZQ== } }
      responses:
        "201":
          description: Recorded (and, for a removal order that found its share, blocked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityOrder" }
        "400":
          description: "`invalid_request` (e.g. `holdDays` on another kind than `INFORMATION`, `deferStatementUntil` on another than `REMOVAL`, a receipt in the future), or `deferral_out_of_bounds` = the deferral ends in the past or more than six weeks from now."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: deferral_out_of_bounds } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "409":
          description: "`order_exists` = an order with this id is recorded; `moderation_epoch_changed` = the reference is not sealed to the current epoch."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: order_exists } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
    get:
      tags: [moderation]
      operationId: listModerationOrders
      summary: The authority's orders recorded on this instance, newest first.
      description: >
        Every order as recorded (uc.moderation.authority-order) — the ones that found no share among them, which no case
        shows — with its reference sealed for the moderator's browser to open. At most the newest 500. Key-proved, with
        no case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityOrders" }
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }

  /api/moderation/cases/{caseId}/statements/{statementId}/deferral:
    post:
      tags: [moderation]
      operationId: deferModerationStatement
      summary: Renew an authority's deferral of a statement of reasons — once, at most six weeks.
      description: >
        ADR 0093 § 7 (TCO Art. 11(3)): deferring the statement is the authority's switch, never the moderator's. A
        deferral is entered with the order (`deferStatementUntil`) or with a moderator's measure
        (`ModerationStatementInput.deferral`); this renews it, once, while the statement is still held: `until` lies
        after the current end and at most six weeks (42 days) from now, and the reason — the authority's renewed request
        — is sealed (`moderation-note` [epoch, caseId]). At the end the hourly cleanup sends the statement, and the
        measure's hold counts from then. Logged (`STATEMENT_DEFERRED`). Key-proved over this case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationStatementDeferral" }
            example: { until: 2026-12-20T00:00:00Z, reason: { epoch: 2, sealedNote: c2VhbGVkLXJlYXNvbg== } }
      responses:
        "200":
          description: Renewed; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400":
          description: "`invalid_request`, or `deferral_out_of_bounds` = `until` is not after the current end, or more than six weeks from now."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: deferral_out_of_bounds } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404":
          description: "`case_not_found`, or `statement_not_found` = no statement of this case has that id."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: statement_not_found } }
        "409":
          description: >
            `statement_not_deferred` = the statement is not held by a deferral (sent, or never deferred);
            `deferral_renewed` = it was renewed once already; `moderation_epoch_changed` = the reason is not sealed to
            the current epoch.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: deferral_renewed } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/handovers:
    post:
      tags: [moderation]
      operationId: recordModerationHandover
      summary: Record that the case was reported to an authority, or that information was given to one.
      description: >
        ADR 0093 §§ 11-13 (uc.moderation.report-to-an-authority): `REPORTED` = the case was reported to an authority
        (an Art. 18 report to the BKA, a criminal complaint); `INFORMATION_GIVEN` = information was handed over in
        answer to an order. The reference is sealed (`moderation-note` [epoch, caseId]). On a case of child sexual
        abuse either one ends the case's hold at once (ADR 0093 § 4, § 184b(5) StGB: keeping the content serves only
        the report), logged as `HOLD_ENDED`, and a decided case left with nothing held and no objection open closes;
        an authority's order's end still holds. On any other case it changes no hold. Logged (`HANDED_OVER`,
        `INFORMATION_GIVEN`). Key-proved over this case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationHandover" }
            example: { kind: REPORTED, note: { epoch: 2, sealedNote: c2VhbGVkLXJlZmVyZW5jZQ== } }
      responses:
        "201":
          description: Recorded; the case as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCase" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: "`moderation_epoch_changed` = the note is not sealed to the current epoch."
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_epoch_changed } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

  /api/moderation/cases/{caseId}/export:
    get:
      tags: [moderation]
      operationId: getModerationCaseExport
      summary: The clear fields an Art. 18 report asks for — never a content file.
      description: >
        ADR 0093 § 13 (uc.moderation.report-to-an-authority): what the server holds in the clear and nothing it would
        have to open — the case id and category, every time in UTC, the measures, the uploaders the held rows name (a
        member's account id, a guest's share identity id), and every held guest-write record (address, source port where
        one was recorded, the time it was observed). The surface renders a text block to copy; it never downloads
        content. Key-proved over this case.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/ModerationChallenge"
        - $ref: "#/components/parameters/ModerationSignature"
      responses:
        "200":
          description: The export's fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCaseExport" }
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/ProofInvalid" }
        "404": { $ref: "#/components/responses/CaseNotFound" }

components:
  responses:
    AuthenticationFailed:
      description: Generic authentication failure (missing, invalid, expired, or revoked access token).
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
    ProofInvalid:
      description: >
        `moderation_proof_invalid` = the key proof is missing, its challenge is unknown, spent or expired, or the
        signature does not verify under the current epoch's key for this operation and case; `not_moderator` = the
        caller holds no `MODERATOR` role.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: moderation_proof_invalid } }
    CaseNotFound:
      description: No case has this id (`case_not_found`).
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: case_not_found } }
    InvalidRequest:
      description: The request was malformed (`invalid_request`).
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      description: The case's id — bound into every key proof made for it.
      schema: { type: string, format: uuid, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
    MeasureId:
      name: measureId
      in: path
      required: true
      description: A measure's id.
      schema: { type: string, format: uuid, example: 9a8b1c2d-3e4f-4a6b-8f2c-9a1e7b3d4e5f }
    ReportId:
      name: reportId
      in: path
      required: true
      description: A report's id.
      schema: { type: string, format: uuid, example: 4e5f9a8b-1c2d-4e4f-8a6b-4f2c9a1e7b3d }
    StatementId:
      name: statementId
      in: path
      required: true
      description: A statement of reasons' id.
      schema: { type: string, format: uuid, example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e }
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the space whose nodes and items are reported.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    ModeratorAccountId:
      name: accountId
      in: path
      required: true
      description: The moderator's account id.
      schema: { type: string, format: uuid }
    ModerationChallenge:
      name: X-Veyq-Moderation-Challenge
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        The challenge `createModerationChallenge` issued, as it returned it. Declared optional so a call without the
        proof reaches the gate and gets its `403 moderation_proof_invalid`; the gate is what requires it.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9+/]*={0,2}$" }
    ModerationSignature:
      name: X-Veyq-Moderation-Signature
      x-veyq-visibility: token
      in: header
      required: false
      description: >
        Ed25519 signature with the current epoch's moderation signing key over `moderation-proof` (the challenge, this
        operation's `operationId`, the case id in the path or none), standard base64.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9+/]*={0,2}$" }

  schemas:
    ModerationEpochKey:
      type: object
      description: One epoch's public bundle.
      required: [epoch, kemPublicKey, signPublicKey]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The epoch, from 1.
          example: 2
        kemPublicKey:
          type: string
          description: The epoch's X-Wing encapsulation key (1216 bytes), which reports seal to.
          contentEncoding: base64
          maxLength: 1700
          example: a2VtLXB1YmxpYy1rZXk=
        signPublicKey:
          type: string
          description: The epoch's Ed25519 public key (32 bytes), which checks a key proof.
          contentEncoding: base64
          maxLength: 64
          example: c2lnbi1wdWJsaWMta2V5

    ModeratorAppointment:
      type: object
      description: The caller's own appointment.
      required: [state, address, confirmation, awaitingKey]
      properties:
        state:
          x-veyq-visibility: enum
          type: string
          description: "`NONE` = not appointed; `PENDING` = appointed, not yet accepted; `ACCEPTED` = a moderator."
          enum: [NONE, PENDING, ACCEPTED]
          example: ACCEPTED
        appointedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the Server Owner appointed the caller; null for `NONE`.
          example: 2026-10-17T09:00:00Z
        acceptedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the caller accepted; null unless `ACCEPTED`.
          example: 2026-10-17T09:30:00Z
        address:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The caller's own account address, already server-held plaintext — the only address moderation notices may
            reach (ADR 0097 decision 3), shown back to its holder so they see where the code goes.
          type: string
          description: The caller's account address, where the code and moderation notices go.
          maxLength: 254
          example: deputy@example.com
        confirmation:
          x-veyq-visibility: enum
          type: string
          description: >
            `NOT_SENT` = no code was sent (not accepted yet, or instance mail is not set up); `CODE_SENT` = enter the
            code before it expires; `SEND_FAILED` = the code could not be mailed; `UNCONFIRMED` = no code is
            outstanding, or the address changed since it was confirmed — ask for a new code; `CONFIRMED` = moderation
            notices reach this address.
          enum: [NOT_SENT, CODE_SENT, SEND_FAILED, UNCONFIRMED, CONFIRMED]
          example: CONFIRMED
        awaitingKey:
          x-veyq-visibility: flag
          type: boolean
          description: True for an accepted moderator who misses a grant of a live epoch — a holder delivers it.
          example: false

    ModeratorAddressConfirmation:
      type: object
      description: The code the instance mail carried.
      required: [code]
      properties:
        code:
          x-veyq-visibility: token
          type: string
          description: The one-time code, as the mail shows it.
          minLength: 1
          maxLength: 16
          example: "48213075"
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = me.raddatz.veyq.core.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 16)'

    ModerationGrants:
      type: object
      description: Every live epoch with the caller's grant.
      required: [currentEpoch, epochs]
      properties:
        currentEpoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The epoch reports seal to now, and the one a key proof signs with.
          example: 2
        epochs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationEpochGrant" }

    ModerationEpochGrant:
      type: object
      description: One live epoch's public bundle and the caller's grant of it.
      required: [epoch, kemPublicKey, signPublicKey]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The epoch.
          example: 1
        kemPublicKey:
          type: string
          description: The epoch's published X-Wing encapsulation key.
          contentEncoding: base64
          maxLength: 1700
          example: a2VtLXB1YmxpYy1rZXk=
        signPublicKey:
          type: string
          description: The epoch's published Ed25519 public key.
          contentEncoding: base64
          maxLength: 64
          example: c2lnbi1wdWJsaWMta2V5
        sealedGrant:
          type: string
          description: >
            `M_n` sealed to the caller's identity (`sealTo` purpose `moderation-grant` [epoch]); null while the caller
            waits for a holder to deliver it.
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWdyYW50

    ModerationChallenge:
      type: object
      description: A single-use challenge.
      required: [challenge]
      properties:
        challenge:
          type: string
          description: 32 random bytes, standard base64; send them back as `X-Veyq-Moderation-Challenge`.
          contentEncoding: base64
          maxLength: 64
          example: Y2hhbGxlbmdlLWJ5dGVzLWNoYWxsZW5nZS1ieXRlcyE=

    ModerationDeliveries:
      type: object
      description: The deliveries the caller can make.
      required: [deliveries]
      properties:
        deliveries:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationPendingDelivery" }

    ModerationPendingDelivery:
      type: object
      description: One accepted moderator missing epochs the caller holds.
      required: [accountId, identityPublicKey, epochs]
      properties:
        accountId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The recipient's account id (what the pin store keys by).
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        identityPublicKey:
          type: string
          description: The recipient's identity public bundle as the directory serves it; pin-check it before sealing.
          contentEncoding: base64
          maxLength: 2048
          example: aWRlbnRpdHktcHVibGljLWtleQ==
        epochs:
          x-veyq-visibility: structure
          type: array
          maxItems: 1000
          description: The epochs the recipient misses that the caller holds, ascending.
          items: { type: integer, format: int32 }
          example: [1, 2]

    ModerationDelivery:
      type: object
      description: The grants a holder delivers to one moderator.
      required: [identityPublicKey, grants]
      properties:
        identityPublicKey:
          type: string
          description: The recipient identity the grants are sealed to, as the delivery listing served it.
          contentEncoding: base64
          maxLength: 2048
          example: aWRlbnRpdHktcHVibGljLWtleQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grants:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationGrantUpload" }
          x-field-extra-annotation: '@field:jakarta.validation.Valid @field:jakarta.validation.constraints.NotEmpty @field:jakarta.validation.constraints.Size(max = 1000)'

    ModerationGrantUpload:
      type: object
      description: One epoch's grant, sealed to its recipient's identity.
      required: [epoch, sealedGrant]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The epoch.
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        sealedGrant:
          type: string
          description: "`M_n` sealed to the recipient's identity (`sealTo` purpose `moderation-grant` [epoch])."
          contentEncoding: base64
          maxLength: 2048
          example: c2VhbGVkLWdyYW50
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ModerationCaseState:
      x-veyq-visibility: enum
      type: string
      description: >
        `OPEN` = reported, not decided; `DECIDED` = a measure was taken (in force or lifted); `CLOSED` = dismissed, or
        decided and its hold ended.
      enum: [OPEN, DECIDED, CLOSED]
      example: OPEN

    ModerationItemKind:
      x-veyq-visibility: enum
      type: string
      description: What was reported — a node, an application's item on a node (a Memories medium), or an upload link.
      enum: [NODE, ITEM, LINK]
      example: NODE

    ModerationQueue:
      type: object
      description: The queue, urgent first.
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ModerationCaseSummary" }

    ModerationCaseSummary:
      type: object
      description: One case of the queue, in clear fields only.
      required: [id, itemKind, category, state, firstReportedAt, lastReportedAt, reportCount, objectionOpen, origin,
        overdue]
      properties:
        origin: { $ref: "#/components/schemas/ModerationCaseOrigin" }
        overdue:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the case is still undecided more than 90 days after its first report (ADR 0093 § 11, DSA Art. 16(6)):
            no case closes itself, so the queue marks it and the moderators are reminded.
          example: false
        statementDeferredUntil:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: The earliest end of a deferral that still holds one of the case's statements back — the surface reminds of it; null when none does.
          example: null
        objectionOpen:
          x-veyq-visibility: flag
          type: boolean
          description: Whether an objection of this case waits for its decision.
          example: false
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
        itemKind: { $ref: "#/components/schemas/ModerationItemKind" }
        category: { $ref: "#/components/schemas/ReportCategory" }
        state: { $ref: "#/components/schemas/ModerationCaseState" }
        firstReportedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the first report of this case was received — for an order's case, when the order was entered.
          example: 2026-10-17T09:00:00Z
        lastReportedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the latest report of this case was received — for an order's case, when the order was entered.
          example: 2026-10-17T11:00:00Z
        reportCount:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: How many reports this case holds.
          example: 2
        tenantDomain:
          x-veyq-visibility: public
          type: string
          description: >
            The domain of the tenant the item lies in — the host the review opens on (ADR 0099, decided with the owner
            3); the Server Owner's configuration, never user data. Null once the tenant is gone, and while it is suspended: its host then serves nothing (ADR 0066), so the review opens where the moderator is.
          maxLength: 253
          example: club.example.org
        holdEndsAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the case's hold ends; null when it holds none alive.
          example: 2027-01-15T09:00:00Z

    ModerationCase:
      type: object
      description: One case as the moderation surface shows it (uc.moderation.review-a-case step 2).
      required: [id, itemKind, itemId, scopeId, category, state, reports, measures, proposals, targets, events,
        statementForm, objections, origin, orders]
      properties:
        origin: { $ref: "#/components/schemas/ModerationCaseOrigin" }
        orders:
          type: array
          maxItems: 100
          description: The authority's orders that opened this case (an `ORDER` case's); empty for a report's.
          items: { $ref: "#/components/schemas/AuthorityOrder" }
        statementForm: { $ref: "#/components/schemas/StatementForm" }
        objections:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationObjection" }
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
        itemKind: { $ref: "#/components/schemas/ModerationItemKind" }
        itemId:
          x-veyq-visibility: id
          type: string
          description: The reported item's id — a node's, an item's, or (for a LINK) the share id.
          maxLength: 64
          example: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b
        scopeId: { type: string, format: uuid, x-veyq-visibility: id, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
        tenantId:
          x-veyq-visibility: id
