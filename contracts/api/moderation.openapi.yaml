          type: string
          format: uuid
          description: The member.
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        wrappedFactsKey:
          type: string
          description: >
            `K_facts` sealed to that member's identity (`moderation-facts-key` [caseId, statementId, accountId]) — always
            1 + 1,120 + 12 + 32 + 16 bytes.
          contentEncoding: base64
          maxLength: 1576
          example: d3JhcHBlZC1rZXk=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 1576) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ModerationStatementRecipients:
      type: object
