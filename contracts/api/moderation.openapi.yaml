          type: string
          description: The client's address, as the record kept it.
          maxLength: 45
          example: 203.0.113.77
        port:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: The client's source port, as the record kept it; null where none was recorded.
          example: 51234
        observedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the server observed the write, to the millisecond.
          example: 2026-10-17T08:59:12.345Z

    # The report's shapes are single-sourced with the moderation spec's member route (uc.moderation.report).
    ReportSubmission:
      $ref: '_common.openapi.yaml#/components/schemas/ReportSubmission'
    ReportItemSubmission:
      $ref: '_common.openapi.yaml#/components/schemas/ReportItemSubmission'
    ReportCategory:
      $ref: '_common.openapi.yaml#/components/schemas/ReportCategory'
    ReportReceipt:
      $ref: '_common.openapi.yaml#/components/schemas/ReportReceipt'

    # An authority's order is single-sourced with the Server Owner's twin on the admin channel (instance.openapi.yaml).
    AuthorityOrderKind:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrderKind'
    SealedOrderReference:
      $ref: '_common.openapi.yaml#/components/schemas/SealedOrderReference'
    AuthorityOrderRequest:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrderRequest'
    AuthorityOrder:
      $ref: '_common.openapi.yaml#/components/schemas/AuthorityOrder'

    # The statement of reasons' shared parts are single-sourced in _common (ADR 0093 § 7).
    ModerationGround:
      $ref: '_common.openapi.yaml#/components/schemas/ModerationGround'
    StatementProvision:
      $ref: '_common.openapi.yaml#/components/schemas/StatementProvision'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The opaque access token issued by login / refresh. A moderator's operations additionally require the
        `MODERATOR` role, and the key-proved ones the key proof (enforced by code, not this spec).
