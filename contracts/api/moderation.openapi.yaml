        accounts:
          type: array
          maxItems: 6000
          description: >
            Every member the statement reaches, whole — never a page of them, at most 6,000: what one
            `takeModerationMeasure` body carries under the server's 10 MiB request limit at one wrapped facts key a member,
            whatever the facts' length. Past it the key cannot be wrapped to every member in one step, and the server
            refuses rather than tell only some (`422 statement_recipients_too_many`).
          items: { $ref: "#/components/schemas/StatementRecipient" }
        guests:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: How many guest identities it names — told nothing in veyq, they have no account.
          example: 0

    StatementRecipient:
      type: object
      description: One affected member, with the identity to wrap the facts' key to.
      required: [accountId, identityPublicKey]
      properties:
        accountId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The member's account (what the pin store keys by).
          example: 5b6c7c3f-0e2a-4b1d-8a6e-8b2c1f2d3e4a
        identityPublicKey:
          type: string
          description: The member's identity public bundle as the directory serves it; pin-check it before sealing.
          contentEncoding: base64
          maxLength: 2048
          example: aWRlbnRpdHktcHVibGljLWtleQ==

    ModerationMeasureStatement:
      type: object
      description: A measure's statement of reasons as the moderators see it.
      required: [id, ground, basis, recipients, guests, renewed]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e }
        deferredUntil:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: While an authority's deferral holds it back, when it ends — the statement goes out then unless renewed; null otherwise.
          example: null
        renewed:
          x-veyq-visibility: flag
          type: boolean
          description: Whether its deferral was renewed once — no further renewal is taken.
          example: false
        ground: { $ref: "#/components/schemas/ModerationGround" }
        basis: { $ref: "#/components/schemas/StatementBasis" }
        sentAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was sent; null when nobody could be told, or while a deferral holds it back.
          example: 2026-10-17T12:00:00Z
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The epoch `sealedFacts` is sealed to; null without facts.
          example: 2
        sealedFacts:
          type: string
          description: The facts sealed to the moderation key (`moderation-note` [epoch, caseId]); null without facts.
          contentEncoding: base64
          maxLength: 12456
          example: null
        recipients:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: How many members it was sent to.
          example: 2
        guests:
          x-veyq-visibility: measure
          type: integer
          format: int32
          description: How many guest identities it names — told nothing in veyq.
          example: 0

    ModerationObjection:
      type: object
      description: An objection to one of the case's measures, as the moderators see it.
      required: [id, statementId, measureId, receivedAt, epoch, sealedObjection, ownReview, mayDecide]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 6c7d8e9f-0a1b-4c2d-8e3f-4a5b6c7d8e9f }
        statementId: { type: string, format: uuid, x-veyq-visibility: id, example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e }
        measureId: { type: string, format: uuid, x-veyq-visibility: id, example: 9a8b1c2d-3e4f-4a6b-8f2c-9a1e7b3d4e5f }
        receivedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was received.
          example: 2026-10-18T09:00:00Z
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: The epoch `sealedObjection` is sealed to.
          example: 2
        sealedObjection:
          type: string
          description: The objection, sealed to the moderation key (`moderation-objection` [epoch, statementId]).
          contentEncoding: base64
          maxLength: 12456
          example: c2VhbGVkLW9iamVjdGlvbg==
        decidedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was decided; null while it waits.
          example: null
        decidedBy:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The moderator who decided it; null while it waits.
          example: null
        outcome:
          description: The decision; null while the objection waits.
          $ref: "#/components/schemas/ObjectionOutcome"
        ownReview:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the moderator who took the measure decided it, there being no other (ADR 0099 § 5).
          example: false
        mayDecide:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the caller may decide it now: false once decided, and for the account that took the measure while
            another accepted moderator holds the key.
          example: true

    ObjectionOutcome:
      x-veyq-visibility: enum
      type: string
      description: "`UPHELD` = the measure stands; `LIFTED` = it was lifted."
      enum: [UPHELD, LIFTED]
      example: UPHELD

    ModerationObjectionDecision:
      type: object
      description: A decision on an objection.
      required: [outcome]
      properties:
        outcome:
          x-veyq-visibility: enum
          type: string
          description: "`UPHOLD` keeps the measure; `LIFT` lifts it."
          enum: [UPHOLD, LIFT]
          example: UPHOLD
        note:
          oneOf:
            - $ref: "#/components/schemas/SealedModerationNote"
            - type: "null"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    MyModerationStatements:
      type: object
      description: The statements of reasons addressed to the caller, newest first.
      required: [statements]
      properties:
        statements:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationStatement" }

    ModerationStatement:
      type: object
      description: >
        A statement of reasons as an affected member reads it (ADR 0093 § 7) — the clear fields the template is rendered
        from, the facts sealed once, and their key wrapped to the reader. It names the host, never the moderator.
      required: [id, caseId, measureKind, targetId, ground, basis, form, sentAt, roles, inForce, endedWithTarget, canObject]
      properties:
        id: { type: string, format: uuid, x-veyq-visibility: id, example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e }
        caseId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The case — the facts' seal and the key's wrap are bound to it, and to the statement's `id`.
          example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b
        measureKind:
          x-veyq-visibility: enum
          type: string
          description: "`SHARE` = a link blocked; `CONTENT` = a node or an item blocked; `GUEST_IDENTITY` = a guest uploader blocked with the link it came through."
          enum: [SHARE, CONTENT, GUEST_IDENTITY]
          example: CONTENT
        targetId:
          x-veyq-visibility: id
          type: string
          description: The blocked id — a share id, a node's or item's id, a guest identity's id.
          maxLength: 64
          example: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b
        shareId:
          x-veyq-visibility: id
          type: string
          description: The link a `SHARE` or `GUEST_IDENTITY` measure blocked; null for `CONTENT`.
          maxLength: 43
          example: null
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The space a `CONTENT` measure's target lies in; null otherwise.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        ground: { $ref: "#/components/schemas/ModerationGround" }
        provision: { $ref: "#/components/schemas/StatementProvision" }
        basis: { $ref: "#/components/schemas/StatementBasis" }
        form: { $ref: "#/components/schemas/StatementForm" }
        sentAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was sent.
          example: 2026-10-17T12:00:00Z
        roles:
          x-veyq-visibility: enum
          type: array
          maxItems: 3
          description: Why the reader gets it — `SHARE_CREATOR`, `UPLOADER`, `SCOPE_OWNER`.
          items: { type: string, enum: [SHARE_CREATOR, UPLOADER, SCOPE_OWNER] }
          example: [UPLOADER, SCOPE_OWNER]
        sealedFacts:
          type: string
          description: The facts sealed once under the statement's `K_facts` (`moderation-statement-facts` [caseId, id]); null without facts.
          contentEncoding: base64
          maxLength: 10964
          example: null
        wrappedFactsKey:
          type: string
          description: >
            `K_facts` wrapped to the reader's identity (`moderation-facts-key` [caseId, id, accountId]); null without
            facts.
          contentEncoding: base64
          maxLength: 1576
          example: null
        inForce:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the measure stands.
          example: true
        liftedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the measure was lifted; null while it stands.
          example: null
        endedWithTarget:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Whether the measure ended because what it stood on was erased — lifted by no one (ADR 0093 § 6); false while it
            stands and when a person lifted it.
          example: false
        contactAddress:
          x-veyq-visibility: public
          type: string
          format: email
          description: The address statements name (the instance contact's, ADR 0093 § 11); null where none is set.
          maxLength: 254
          example: abuse@example.org
        objection:
          $ref: "#/components/schemas/StatementObjection"
        canObject:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the reader may object now — the measure stands and has no objection yet.
          example: true

    StatementObjection:
      type: object
      description: The objection to a statement's measure, as an affected member sees it — its state and answer, not its text.
      required: [receivedAt, mine, ownReview]
      properties:
        receivedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was received.
          example: 2026-10-18T09:00:00Z
        mine:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the reader made it.
          example: true
        outcome:
          description: The decision; null while the objection waits.
          $ref: "#/components/schemas/ObjectionOutcome"
        ownReview:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the moderator who took the measure decided it alone, there being no other.
          example: false
        decidedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was decided; null while it waits.
          example: null

    ObjectionSubmission:
      type: object
      description: An objection, sealed in the browser.
      required: [epoch, sealedObjection]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          format: int32
          minimum: 1
          description: The epoch it is sealed to — the current one.
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(1)'
        sealedObjection:
          type: string
          description: The objection (`moderation-objection` [epoch, statementId]).
          contentEncoding: base64
          maxLength: 12456
          example: c2VhbGVkLW9iamVjdGlvbg==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 12456) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ModerationCaseOrigin:
      x-veyq-visibility: enum
      type: string
      description: "`REPORT` = a report opened the case; `ORDER` = an authority's order did (ADR 0093 § 12) — decided from the start, with no report; `RESTORED` = a restore lacked the case and the erasure ledger brought it back as a stub (ADR 0056 decision 8) — no report, no sealed content, its retention date kept."
      enum: [REPORT, ORDER, RESTORED]
      example: REPORT

    AuthorityOrders:
      type: object
      description: The orders recorded on this instance, newest first.
      required: [orders]
      properties:
        orders:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/AuthorityOrder" }

    ModerationStatementDeferral:
      type: object
      description: An authority's deferral of a statement of reasons (TCO Art. 11(3)).
      required: [until, reason]
      properties:
        until:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the statement goes out — at most six weeks from now.
          example: 2026-11-29T00:00:00Z
        reason:
          $ref: "#/components/schemas/SealedModerationNote"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    ModerationHandover:
      type: object
      description: A handover to an authority, with its reference.
      required: [kind, note]
      properties:
        kind:
          x-veyq-visibility: enum
          type: string
          description: "`REPORTED` = reported to an authority; `INFORMATION_GIVEN` = information given in answer to an order."
          enum: [REPORTED, INFORMATION_GIVEN]
          example: REPORTED
        note:
          $ref: "#/components/schemas/SealedModerationNote"
          x-field-extra-annotation: '@field:jakarta.validation.Valid'

    ModerationCaseExport:
      type: object
      description: >
        The clear fields an Art. 18 report asks for (ADR 0093 § 13) — what the server holds in the clear, never content.
        Every time is UTC (`timeZone`).
      required: [caseId, category, origin, timeZone, reportedAt, measures, uploaders, guestWrites, held]
      properties:
        caseId: { type: string, format: uuid, x-veyq-visibility: id, example: 1c2d3e4f-5a6b-4f2c-9a1e-7b3d4e5f9a8b }
        category: { $ref: "#/components/schemas/ReportCategory" }
        origin: { $ref: "#/components/schemas/ModerationCaseOrigin" }
        timeZone:
          x-veyq-visibility: enum
          type: string
          description: The time zone of every time here — always `UTC`.
          enum: [UTC]
          example: UTC
        reportedAt:
          x-veyq-visibility: time
          type: array
          maxItems: 10000
          description: When each report of the case was received, oldest first; empty for an order's case.
          items: { type: string, format: date-time, example: 2026-10-17T09:00:00Z }
        measures:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ModerationExportMeasure" }
        uploaders:
          type: array
          description: >
            Every uploader the held rows name, whole. No `maxItems`: nothing bounds how many members and guest identities
            a held subtree names (a space's members and a link's guests are uncounted), and a cap here would either
            break the answer's own schema or drop an uploader, where an Art. 18 report carries all relevant information
            (ADR 0093 § 13). The same list as `ModerationTargets.uploaders`.
          items: { $ref: "#/components/schemas/ModerationExportUploader" }
        guestWrites:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ModerationExportGuestWrite" }
        held:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the case holds a hold alive — without one the held parts are empty.
          example: true

    ModerationExportMeasure:
      type: object
      description: A measure of the case, as the export names it.
      required: [kind, targetId, takenAt, endedWithTarget]
      properties:
        kind: { $ref: "#/components/schemas/ModerationMeasureKind" }
        targetId:
          x-veyq-visibility: id
          type: string
          description: The blocked id.
          maxLength: 64
          example: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b
        takenAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was taken.
          example: 2026-10-17T12:00:00Z
        liftedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When it was lifted; null while in force.
          example: null
        endedWithTarget:
          x-veyq-visibility: flag
          type: boolean
          description: Whether it ended because what it stood on was erased — lifted by no one (ADR 0093 § 6).
          example: false

    ModerationExportUploader:
      type: object
      description: An uploader the held rows name.
      required: [kind, id]
      properties:
        kind:
          x-veyq-visibility: enum
          type: string
          description: "`ACCOUNT` = a member's account id; `GUEST` = a guest's share identity id."
          enum: [ACCOUNT, GUEST]
          example: GUEST
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The account's or the share identity's id.
          example: 6c7d8e9f-0a1b-4c2d-8e3f-4a5b6c7d8e9f
        shareId:
          x-veyq-visibility: id
          type: string
          description: A guest's link; null for a member.
          maxLength: 43
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i

    ModerationExportGuestWrite:
      type: object
      description: One held guest-write record (ADR 0093 § 10) — what a guest's write left as evidence.
      required: [identityId, objectKind, objectId, address, observedAt]
      properties:
        identityId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The share identity that wrote.
          example: 6c7d8e9f-0a1b-4c2d-8e3f-4a5b6c7d8e9f
        objectKind:
          x-veyq-visibility: public
          type: string
          description: The kind of object written, as the record names it (the server's own word).
          maxLength: 16
          example: MEDIA
        objectId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The object written.
          example: 4f2c9a1e-7b3d-4e5f-9a8b-1c2d3e4f5a6b
        address:
          x-veyq-visibility: pii
          x-veyq-rationale: >
            The client address the guest-write record kept as evidence (ADR 0093 § 10, ADR 0094), served only from a
