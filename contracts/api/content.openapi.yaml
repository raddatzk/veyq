          contentEncoding: base64
          maxLength: 2048
          example: null

    RestoreNodeRequest:
      type: object
      required: [slugToken, parentEpoch]
      description: >
        The freshly computed slug token the restored root takes under its parent. The server cannot recompute one
        (it is a blinded MAC under the parent's key, ADR 0012 / ADR 0080) and the original was consumed when the delete freed the name,
        so the client supplies it (ADR 0061 Decision 5).
      properties:
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under the parent's content key (the scope key `K_SC` at the scope root) over (parent ‖ slug), recomputed by the client for the restore. A collision with a node created while this one sat in the trash is the ordinary `slug_taken` rejection (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
