openapi: 3.1.0
info:
  title: veyq Content API
  version: 0.1.0
  description: >
    The encrypted node tree inside a scope (en.platform.node-tree). Nodes of a `kind` — core's FOLDER
    (organization only) or an application's kind — addressed by opaque ids, under the scope resolved from the
    path `scopeId`. **Operator-blind:** the server stores only ciphertext (`encryptedName`, `wrappedContentKey`,
    `wrappedMeta`) + opaque `parentId`/`kind`/`orderIndex` + the **blinded `slugToken`**; it never sees a name, a
    content key or a payload, and learns only the *shape* of the tree.

    Every node, FOLDER included, carries a fresh random per-node content key wrapped under its **parent's
    content key** — `K_SC` at the node's epoch for a scope-root node, the parent node's content key below it
    (`wrappedContentKey`) — the share grain ([ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md),
    [ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md) Decision 1).
    A node's directory entry lives under that same parent key (ADR 0080 Decision 2): the client encrypts the name
    under it and computes the blinded slug token (a keyed MAC under it), so whoever holds a node's key reads every
    name below it.
    Each node may hold one sealed payload with its revision (`wrappedMeta`, `metaRevision`) whose format is its kind's
    application's. The server enforces structure only: a caller must hold a grant for the scope, slug
    uniqueness per parent (`UNIQUE(parentId, slugToken)`), the placement rule of the node's kind (core's for
    FOLDER, the kind's application's otherwise), no cycle, no cross-scope move. Authorization is enforced by
    code, not this spec (ADR 0008); field validation via `x-field-extra-annotation`.
tags:
  - name: content
    description: >
      The node tree under a scope (create / list / update / soft-delete / restore nodes) **and** the space's
      node trash. One tag = one resource interface owning the `/api/scopes/{scopeId}/nodes` subtree plus
      `/api/scopes/{scopeId}/trash/nodes` — the trash hangs off the *space*, not the node, because a trashed
      node has no live node to hang a tab from ([ADR 0061](../../docs/decisions/0061-node-deletion-reversible-node-trash.md)).
      Distinct from the `/api/scopes` scopes resource.
  - name: rekey
    description: >
      A scope's re-key after a rotation ([ADR 0109](../../docs/decisions/0109-a-scope-rotation-re-keys-every-node-below-it.md),
      uc.spaces.rekey-after-rotation): every node, trashed ones included, listed with the epoch its key was minted
      at; one node's core parts; its staged batches and its one-transaction commit. The `/api/scopes/{scopeId}/rekey`
      subtree. Each application stages its own fields through its own operation under the same re-key id.
paths:
  /api/scopes/{scopeId}/nodes:
    post:
      tags: [content]
      operationId: createNode
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: parentEpoch
            requiredWith: [parentId]
      summary: Create a node of any kind in the scope's tree.
      description: >
        Adds a node under `parentId` (or the scope root if null or omitted — the root's only form: a `parentId` equal
        to the path's `scopeId` is `400 invalid_request`, inbox #534). The client mints the node's id (`nodeId`,
        [ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md) Decision 3) and supplies the ciphertext name, the blinded slug token, and the
        `wrappedContentKey` (the node's content key under its parent's — every kind carries one, ADR 0080), each sealed bound to that id.
        The server stores it opaquely under exactly that id and enforces slug uniqueness per parent + the
        structural rules. An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeRequest" }
            example:
              nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              parentId: null
              kind: FOLDER
              encryptedName: ZW5jcnlwdGVkLW5hbWU=
              slugToken: c2x1Zy10b2tlbi1iYXNlNjQ=
              orderIndex: 0
              wrappedContentKey: d3JhcHBlZC1rLW1lbQ==
      responses:
        "201":
          description: The node was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCreated" }
              example: { nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
        "400":
          description: Malformed request (missing/invalid fields, a `kind` outside the `NodeKind` token's shape, a `parentId` without its `parentEpoch`, or a `parentId` equal to the path's `scopeId`), decided before any answer about the instance's state.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: >
            A sibling already has that slug (`slug_taken`), the `nodeId` is already taken (`id_taken`), the `epoch` is not
            the scope's current one or `parentEpoch` is below the parent's stored epoch (`stale_epoch` — the caller holds a
            key from before a rotation; nothing stored, it re-reads), the parent is not re-keyed since the last rotation
            yet (`node_rekey_pending` — nothing stored, it retries once the re-key reached the parent, ADR 0109 point 6),
            or the space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: >
            Unprocessable. Two codes: `illegal_structure` — the kind's placement rule refuses the parent, the kind is
            one no application claims, an unknown/foreign parent, or a cycle; `capability_disabled` — the kind's
            application is switched off for the instance or the tenant (its register entry, `memories` or `depot`,
            uc.platform.switch-application-off), or creating this kind needs a capability that is not active. The kind's
            application names both (`NodeKindRules`): Depot's drop box (`DEPOT_DROPBOX`) also needs
            `core.public-shares.drop-box`, and so, by the AND along the path, `core.public-shares` (ADR 0032, ADR 0088).
            The drop-box switch refuses only creation: an existing node of the kind stays (a feature switch refuses only
            what is new, ADR 0088 decision 5); an application switched off refuses every write of its nodes.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    get:
      tags: [content]
      operationId: listNodes
      summary: List the scope's tree (opaque rows).
      description: >
        Returns every node in the scope with its opaque id, parent, kind, ordering, ciphertext name, slug
        token, sealed payload (`wrappedMeta` + `metaRevision`), and the `wrappedContentKey`. The client assembles the tree top-down, opening each
        name under its parent's content key (`K_SC` at the node's epoch for a scope-root node, ADR 0080 Decision 2); the operator sees only the shape.

        **Conditional GET (ADR 0081):** the scope carries one monotonic **tree revision**, bumped in the same transaction as
        every change a level view shows — a node created, renamed, moved, re-sealed, trashed, restored or purged, a blob
        attached to, replaced on or removed from a node. The `200` carries it as the `ETag`; a client echoes it as
        `If-None-Match` and an unchanged scope answers `304` with no body and no row read — the idle case of a live
        level view. The revision is read BEFORE the rows, so the rows are never older than the tag they travel with.
        An opaque number: operator-blind, and it tells a member only that the scope changed (the rows say far more).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - name: If-None-Match
          x-veyq-visibility: structure
          in: header
          required: false
          description: >
            The `ETag` of the client's last listing (the scope's tree revision, quoted). When it equals the scope's
            current revision the server answers `304`. Omitted on a first load; one that does not parse is no match.
          schema: { type: string, maxLength: 64, example: "\"7\"" }
      responses:
        "200":
          description: The scope's nodes.
          headers:
            ETag:
              x-veyq-visibility: structure
              description: The scope's tree revision at the time of the read, quoted — echo it as `If-None-Match` on the next poll.
              schema: { type: string, example: "\"7\"" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeSummary" }
        "304":
          description: Not Modified — the client's `If-None-Match` equals the scope's tree revision; nothing a level view shows has changed. No body, and no row was read.
        "400":
          description: Malformed request — a parameter or the body outside its contract.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}:
    patch:
      tags: [content]
      operationId: updateNode
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            requiredWith: [wrappedMeta]
          - field: placementRevision
            requiredWith: [encryptedName, parentId, wrappedContentKey, slugToken]
            conflictCode: stale_placement
        epochs:
          - field: nodeEpoch
            requiredWith: [wrappedMeta]
          - field: parentEpoch
            requiredWith: [parentId]
      summary: Move / rename (one placement write), reorder, or re-seal a node's payload.
      description: >
        Partial update with three independent parts; fields not sent are unchanged.

        **Placement** — move and rename are ONE request shape, a rename being a move to the same parent ([ADR
        0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md) Decision
        3). It carries all of: the destination `parentId` (null/absent = the scope root, its only form — the path's
        `scopeId` there is `400 invalid_request`; a rename sends the current parent), the node's content key re-wrapped under the destination parent's key
        (`wrappedContentKey`), the name re-sealed under a field key derived from that key (`encryptedName`), the slug token recomputed under
        it (`slugToken`), the `epoch` the entry was sealed at, and the `placementRevision` it was built on. Sending
        any of `encryptedName`, `slugToken`, `wrappedContentKey` or a `parentId` without the rest is `400
        invalid_request`. The wrap and the name are sealed bound to the revision the server will store,
        `placementRevision + 1` (ADR 0072), so a wrap or a name served at another revision or on another node's row
        does not open. The server compare-and-sets the node's placement revision and applies every field at once,
        or writes **nothing** and answers `409 stale_placement` (the client re-reads the node and rebuilds, ADR
        0077). Structure only: the destination is the root or a live node of the same scope, the kind's placement
        rule admits it there, it is neither the node nor inside the node's subtree (else `422
        illegal_structure`), and the slug is free there (`409 slug_taken`). **Epoch** (ADR 0109 point 6): a node's
        epoch is the epoch its key was minted at, and a placement never changes it — `epoch` must be the node's stored
        one (else `409 stale_epoch`). At the scope root the entry is sealed under `K_SC` at it, so a node there must be
        at the scope's current epoch: one not re-keyed since the last rotation is `409 node_rekey_pending`. Below the
        root the entry is sealed under the destination parent's key, whose epoch the request states (`parentEpoch`):
        below the parent's stored epoch is `409 stale_epoch`, a parent not re-keyed yet `409 node_rekey_pending`.

        **Reorder** = `orderIndex`, with no revision.

        **Meta** = a re-sealed `wrappedMeta` with the `metaRevision` it was built from — required whenever
        `wrappedMeta` is sent (else `400 invalid_request`); the server compare-and-sets it and stores
        `metaRevision + 1`, or writes **nothing** (a placement in the same request included) and answers `409
        stale_revision` carrying the current blob and revision (ADR 0077). It is sealed under the node's own key, so it
        states the node's epoch (`nodeEpoch`): below the stored one is `409 stale_epoch`, a node not re-keyed since the
        last rotation `409 node_rekey_pending` (ADR 0109 point 6).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeRequest" }
            example:
              parentId: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
              encryptedName: cmVuYW1lZA==
              slugToken: bmV3LXNsdWc=
              wrappedContentKey: cmUtd3JhcHBlZC1rLW1lbQ==
              epoch: 0
              parentEpoch: 0
              placementRevision: 2
      responses:
        "204":
          description: The node was updated.
        "400":
          description: Malformed request, or an incomplete placement write (a name, slug, wrap or parent without the rest of it, or without its `placementRevision` and `epoch`; a `parentId` without its `parentEpoch`, or equal to the path's `scopeId`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            A sibling at the destination already has that slug (`slug_taken`); the space is being deleted and
            read-only (`scope_deleting`, uc.spaces.delete-group A4); the node was moved or renamed since the stated
            `placementRevision` (`stale_placement` — nothing was written; the client re-reads the node and rebuilds
            the placement against it, ADR 0080 Decision 3); a placement stated an `epoch` that is not the node's, or a `nodeEpoch` / `parentEpoch` below the stored one
            (`stale_epoch` — nothing was written; the client re-reads, ADR 0109 point 6); the node at the scope root, the
            destination parent or the node a meta write seals under is not re-keyed since the last rotation yet
            (`node_rekey_pending` — nothing was written; the client retries after the re-key reached it); or the node's
            `wrappedMeta` moved since the stated `metaRevision` (`stale_revision`, with the current blob and revision —
            nothing was written, ADR 0077). Every code but `stale_revision` carries `code` alone.
          content:
            application/json: { schema: { $ref: "#/components/schemas/StaleSealedMeta" }, example: { code: stale_revision, wrappedMeta: d3JhcHBlZC1tZXRh, metaRevision: 4 } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: Illegal structure (`illegal_structure`; the node's kind may not live under the destination, the destination is missing, trashed or in another scope, or the move would create a cycle — the destination is the node itself or inside its subtree), or the node's application is switched off for the instance or the tenant (`capability_disabled`, uc.platform.switch-application-off).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    delete:
      tags: [content]
      operationId: deleteNode
      summary: Delete a node — soft-delete the whole subtree into the space's trash (uc.memory.delete-node).
      description: >
        **Soft-delete** the node and every descendant in one transaction (`deleted_at = now`, ADR 0061). The
        subtree leaves every read at once — the tree listing, every listing an application serves of what it
        attached to the subtree, and **both** public-share paths: the anonymous resolve stops listing it *and* its
        blobs stop being authorized for a presign. **Nothing is destroyed** — every row an application attached to
        it, every blob row and every store object survive untouched, which is what makes `restoreNode` complete
        rather than partial. The deleted node's `slugToken`
        is replaced by its own id, so the **name is immediately reusable**; restore carries a freshly
        client-computed token. A scheduled job hard-erases the subtree once its `deleted_at` is older than the
        retention window, or a member brings that purge forward with `purgeNode`. Idempotent — re-deleting an
        already-trashed subtree is still `204`. **Any member** may delete (reversible, recovery-not-destruction); the
        irreversible purge only ever reaches what is already in the trash, never a live node.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204":
          description: The subtree is in the space's trash (or already was).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: The space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } }

  /api/scopes/{scopeId}/nodes/{nodeId}/cover:
    put:
      tags: [content]
      operationId: setNodeCover
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            required: true
        epochs:
          - field: nodeEpoch
      summary: Make an uploaded image the node's cover - the blob and the sealed meta naming it, in one write (inbox #411).
      description: >
        A cover is an image attached to the node itself, in its `COVER` slot (core's one-blob-per-slot node
        attachment, ADR 0079): not a child, not a file in a folder. It goes to the trash with the node, counts against
        the quota like any attachment, and is freed with the node's purge. Which kinds take one is each kind's
        application's answer (`NodeKindRules.takesCover`): `FOLDER` (core's own), a drop box, a Memory and a Chapter;
        any other kind is `422 illegal_target`.

        **One request, two writes, one transaction.** The client sealed the blob (`startBlobUploads` with `role:
        COVER` and `ownerId` = this node; its `K_blob` wrap is sealed under the node's content key, bound to blob,
        node and role, ADR 0072) and re-sealed the node's `wrappedMeta` with the cover ref it now names. The server
        verifies the upload (declare-then-verify), attaches it to the slot - replacing, and freeing in the same
        transaction, the blob the client states it replaces (`expectedBlobId`, null for an empty slot) - and
        compare-and-sets the node's `wrappedMeta` at `metaRevision` (ADR 0077). Either both land or neither does: a
        slot another writer changed since the client read it is `409 cover_stale` (the upload is spent and its blob
        freed, as a Files replace is), a meta that moved is `409 stale_revision` with the current blob and revision and
        **nothing written, the upload still open** - the client re-applies its change and sends the same upload
        again. So a cover and the meta that names it can never part. The compare is the write's own predicate.

        The replaced blob's row goes with the swap and its store objects go on the reclaim list in the same
        transaction ([ADR 0062](../../docs/decisions/0062-store-object-reclaim-is-a-durable-work-list.md)); the sweep
        deletes them up to one interval later, and nothing readable references them in between. Operator-blind: the
        server holds the ciphertext, the opaque attachment row and the sizes - never the image, the crop or the
        source (those stay in the sealed meta). The caller needs write access to the scope (`scope_deleting` while it
        is being deleted).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetNodeCoverRequest" }
            example:
              nodeEpoch: 0
              uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
              expectedBlobId: null
              wrappedMeta: d3JhcHBlZC1tZXRh
              metaRevision: 3
      responses:
        "204":
          description: The upload is the node's cover, the node's `wrappedMeta` is the one sent (at `metaRevision + 1`), and any replaced cover blob is freed.
        "400":
          description: Malformed request, or the upload failed declare-then-verify (`budget_exceeded`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, live node or open upload (unknown, spent, another scope's, another member's), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "#/components/responses/CoverConflict" }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422":
          description: The node's kind takes no cover (`illegal_target`), the upload was not started as this node's cover (`upload_mismatch`), `shared` names no blob this node holds (`shared_source_invalid`), or the node's application is switched off for the instance or the tenant (`capability_disabled`, uc.platform.switch-application-off).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }

  /api/scopes/{scopeId}/nodes/{nodeId}/cover/removal:
    post:
      tags: [content]
      operationId: removeNodeCover
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            required: true
        epochs:
          - field: nodeEpoch
      summary: Remove the node's cover - the blob and the sealed meta that named it, in one write (inbox #411).
      description: >
        The cover blob goes (its row, and its store objects on the reclaim list, in the same transaction) and the
        node's `wrappedMeta` is re-sealed without the cover, compare-and-set at `metaRevision`; nothing is written
        unless both can be. The request names the blob it expects in the slot (`blobId`, what the client read in the
        sealed meta): a slot that holds another blob is `409 cover_stale` and nothing is written. A slot already empty
        (a replay, or a cover whose source was never an upload) still writes the meta, so the removal is
        idempotent and heals a meta that named a blob that is gone. The same write also moves a Memory's cover from an
        uploaded image to one of its own photos: the new meta names the photo, the old blob is freed. The caller
        needs write access to the scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveNodeCoverRequest" }
            example:
              nodeEpoch: 0
              blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
              wrappedMeta: d3JhcHBlZC1tZXRh
              metaRevision: 4
      responses:
        "204":
          description: The slot is empty, the blob freed, and the node's `wrappedMeta` is the one sent (at `metaRevision + 1`).
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope or live node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "#/components/responses/CoverConflict" }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "422": { $ref: "_common.openapi.yaml#/components/responses/ApplicationSwitchedOff" }

  /api/scopes/{scopeId}/nodes/{nodeId}/restore:
    post:
      tags: [content]
      operationId: restoreNode
      x-veyq-concurrency:
        mode: node-epoch
        epochs:
          - field: parentEpoch
      summary: Restore a soft-deleted subtree out of the space's trash (uc.memory.delete-node).
      description: >
        Clears `deleted_at` across the subtree and writes the supplied `slugToken` back onto its root, returning
        every descendant and everything an application attached to the subtree exactly as it was — none of it was ever removed. The client
        **must** supply the token: the delete freed the name by overwriting `slug_token` with the node's own id,
        and the server cannot recompute a blinded MAC under the parent's key (ADR 0012, ADR 0080 Decision 2). A node created in the meantime
        that already holds the name is a `409 slug_taken` — the same disambiguation a create takes, never a
        silent rename. **Any member** of the scope may restore. A subtree already purged — by the scheduled job or a
        member's `purgeNode` — is gone (`404`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreNodeRequest" }
            example: { slugToken: c2x1Zy10b2tlbi1iYXNlNjQ=, parentEpoch: 0 }
      responses:
        "204":
          description: The subtree is back in the tree.
        "400":
          description: Malformed request (missing/invalid `slugToken`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such trashed node (unknown, already purged, or still live), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            A live sibling already holds that slug (`slug_taken`); `parentEpoch` is below the stored epoch of the key the
            entry is re-sealed under (`stale_epoch`, the client re-reads) or that key's node is not re-keyed since the last
            rotation (`node_rekey_pending`, the client retries — ADR 0109 point 6); or the space is being deleted and
            read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
        "451":
          description: >
            A moderator blocked this node's content, or a node above it (`blocked_by_operator`,
            uc.moderation.take-a-measure): a blocked item can be deleted, never restored, while the block stands.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: blocked_by_operator } }

  /api/scopes/{scopeId}/nodes/{nodeId}/purge:
    post:
      tags: [content]
      operationId: purgeNode
      summary: Permanently delete a trashed subtree now — expedite the scheduled purge (uc.memory.delete-node).
      description: >
        **Hard-erase** a subtree that is currently **in the space's trash**, now instead of when the retention window
        ends — through the scheduled purge's own erase, so everything goes exactly as it would then: every node row of
        the subtree, every row an application attached to it (media, derivatives, buckets, files, a Pot's records…), its
        blob rows with their store objects put on the reclaim list (drained by the scheduled sweep, ADR 0062), every
        link on it tombstoned (ADR 0029 §7) and every measure on it ended. This is **irreversible**. **Any member** of
        the scope may purge what is already trashed — the security model's reversible/irreversible split lets a member
        expedite the purge of what was already reversibly removed, never destroy a live node in one step. Only a trash
        **root** is purged, the one `listTrashedNodes` lists: a live node, a node inside a trashed subtree (it goes
        with its root), an unknown or already purged one answers `404`, nothing erased. A content block does not stop
        it, and a report's hold keeps its snapshot and its pinned objects (ADR 0093 § 4). Operator-blind — opaque rows
        and blob objects removed, never content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204":
          description: The trashed subtree was erased (its rows gone; their blob objects queued for reclaim).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such trash root (unknown, already purged, still live, or inside a trashed subtree), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "_common.openapi.yaml#/components/responses/ScopeDeleting" }

  /api/scopes/{scopeId}/trash/nodes:
    get:
      tags: [content]
      operationId: listTrashedNodes
      summary: The space's node trash — the soft-deleted subtree roots (uc.memory.delete-node).
      description: >
        Lists only the **root** of each soft-deleted subtree: its descendants went with it and come back with it,
        so listing them too would offer a restore that cannot be honoured on its own. The one exception is a
        descendant an earlier delete trashed on its own: it holds that delete's freed slug, so a restore of the
        parent leaves it and its subtree in the trash, and it is listed as a root again (ADR 0061 Decision 5). Each row carries when it was
        deleted and when it will be purged. The trash hangs off the *space* rather than the node — a trashed
        node has no live node to hang a tab from (ADR 0061 Decision 3). Newest-deleted first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The scope's soft-deleted subtree roots (empty when the trash is empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashedNodeSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/rekey/nodes:
    get:
      tags: [rekey]
      operationId: listRekeyNodes
      summary: Every node of the scope, trashed ones included, with the epoch its key was minted at (uc.spaces.rekey-after-rotation step 1).
      description: >
        What a re-key walks ([ADR 0109](../../docs/decisions/0109-a-scope-rotation-re-keys-every-node-below-it.md)):
        the scope's current epoch and every node of it, live **and** trashed — a trashed node is re-keyed too, so a
        restore never brings back a key the excluded party holds (ADR 0109 point 1). A node whose `epoch` is below
        `currentEpoch` still has its key from before the rotation. The rows carry what `listNodes` carries, plus
        `trashed` and `ownerOnly`. Any member of the scope who holds its current grant may read it — the one who may
        commit a re-key ([ADR 0111](../../docs/decisions/0111-an-invitee-grants-itself-a-rotator-re-keys-its-own-scopes-and-a-key-chain-anchors-trust.md)
        decision 11: a re-key is not governance); anyone else is `403`. A member is served every node, the ones only an
        owner re-keys included (`ownerOnly`), so its re-key knows which lagging nodes are not its own to finish. Nothing
        here is new to the server: it is the tree and the trash it already serves, unfiltered by `deleted_at`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The scope's current epoch and every node of it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RekeyNodeList" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            The caller is a member but may not re-key the scope — its grant lags the current epoch (`grant_behind`) —
            or the tenant is suspended.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: grant_behind } }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
  /api/scopes/{scopeId}/rekey/nodes/{nodeId}:
    get:
      tags: [rekey]
      operationId: getNodeRekeyParts
      summary: The core-owned fields a node's re-key re-seals besides its own row (uc.spaces.rekey-after-rotation step 2).
      description: >
        Every field core stores under the node's key or as a wrap of it that is not on the node's row: the blobs in its
        attachment slots (cover, banner, a file's content — each `K_blob` wrapped under the node's key; the blobs its
        application stores through core's blob service are paged by `listApplicationBlobRekey`, ADR 0113), every live
        share rooted on it (its recovery copy, from which the re-keyer opens `K_share` to re-wrap the new key, ADR 0109
        point 4) and every guest identity of those shares (its `K_up` sealed to the node's drop public key, ADR 0109
        point 5; a `READ_WRITE` identity's name under the node's key). Rows a `WRITE_ONLY` guest sealed under its own
        `K_up` are not listed: the re-key leaves them as they are. Live or trashed node alike. The caller's rights are
        `listRekeyNodes`'s.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: The node's core-owned re-key parts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeRekeyParts" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            As `listRekeyNodes`, and `not_scope_owner` when the node is one only an owner re-keys (`RekeyNode.ownerOnly`:
            a drop box, a guest's identity folder, or a node below one) and the caller is not an owner of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller is not an accepted member of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
  /api/scopes/{scopeId}/rekey/nodes/{nodeId}/{rekeyId}/parts:
    post:
      tags: [rekey]
      operationId: stageNodeRekey
      summary: Stage one batch of a node's re-sealed core fields under a re-key id (ADR 0109 point 2).
      description: >
        A node with more fields than one request carries (a folder of many children, a link with many guests) sends
        them here first, up to 256 of each kind per call, under a re-key id the client mints; `commitNodeRekey` swaps
        every staged value in at once. A value staged twice for the same row is replaced. Nothing staged is served or
        read before the commit, and a stage no commit took expires after a day. Each staged value is ciphertext the
        commit would carry anyway: the server learns nothing it would not learn from the commit. `fromEpoch` is the
        node's epoch as the re-keyer read it; a node re-keyed since (another member finished it) is `409 stale_epoch`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/RekeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeRekeyStage" }
      responses:
        "204":
          description: The batch is staged.
        "400":
          description: Malformed request (a list over 256 entries, a malformed value).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            As `listRekeyNodes`, and `not_scope_owner` when the node is one only an owner re-keys (`RekeyNode.ownerOnly`:
            a drop box, a guest's identity folder, or a node below one) and the caller is not an owner of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller is not an accepted member of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            The node's epoch is no longer `fromEpoch` (`stale_epoch` — it was re-keyed since; the client re-reads), or the
            node does not lag the scope's current epoch (`stale_epoch` too: nothing to re-key), or the space is being
            deleted and read-only (`scope_deleting`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }
  /api/scopes/{scopeId}/rekey/nodes/{nodeId}/{rekeyId}:
    post:
      tags: [rekey]
      operationId: commitNodeRekey
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: placementRevision
            conflictCode: stale_placement
          - field: metaRevision
        epochs:
          - field: nodeEpoch
          - field: parentEpoch
            requiredWith: [parentId]
      summary: Commit one node's re-key in one transaction (ADR 0109 point 2).
      description: >
        The node gets the key the client minted: its own entry (`encryptedName`, `slugToken`, `wrappedContentKey`)
        under its parent's **current** key — `K_SC` at the current epoch at the scope root, the parent node's key
        below it, a guest's `K_up` for a guest's identity folder — sealed at the current epoch and at
        `placementRevision + 1`; its `wrappedMeta` re-sealed under the new key (`metaRevision + 1`); its
        `sealedDropPrivateKey` replaced when it had one (ADR 0109 point 5). Every value staged under `rekeyId` — core's
        (`stageNodeRekey`) and each application's — is swapped in by the same transaction: each child's entry (its
        current key re-wrapped under the new one, its name re-sealed, its slug token recomputed; `placementRevision`
        of the child + 1), the blobs in the node's slots, each share's `wrap` and `sealedDropPublicKey`, each guest
        identity's `wrappedIdentityKey` and name, and the application's fields (its participant, fail closed). The
        node's `epoch` becomes `epoch`, the scope's current one. No store object is read or written.

        **Fail closed.** Every row the server knows to be sealed under the node's key or a wrap of it must have a
        staged value — every child (live or trashed; a guest's identity folder excepted, its entry is under `K_up`),
        every attachment blob, every live share, every identity of those shares, and each application's rows — else
        `409 rekey_parts_missing`, nothing written. A staged child that is no longer the node's child, or whose
        `placementRevision` moved since it was staged, is `409 rekey_parts_stale`: the client re-stages.

        **Order and refusals** (ADR 0109 point 6). Checked under the scope's and the node's row lock, which every
        write sealing under the node's key takes too: `nodeEpoch` is the node's epoch as the re-keyer read it — not
        the stored one is `409 stale_epoch` (another member re-keyed it); the parent — `parentEpoch`, with `parentId`
        — below the scope's current epoch is `409 node_rekey_pending` (top-down: the parent first); `epoch` not the
        scope's current one is `409 stale_epoch`. The caller's rights are `listRekeyNodes`'s.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/RekeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitNodeRekeyRequest" }
      responses:
        "204":
          description: The node is re-keyed; its epoch is the scope's current one.
        "400":
          description: >
            Malformed request: a missing field, a `parentId` without its `parentEpoch` or equal to the path's `scopeId`
            (both decided before any answer about the instance's state), or a `parentId` that is not the node's parent.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403":
          description: >
            As `listRekeyNodes`, and `not_scope_owner` when the node is one only an owner re-keys (`RekeyNode.ownerOnly`:
            a drop box, a guest's identity folder, or a node below one) and the caller is not an owner of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } }
        "404":
          description: No such scope or node in it, or the caller is not an accepted member of the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            Nothing was written. `stale_epoch` — the node's epoch is not `nodeEpoch` (re-keyed since) or `epoch` is not
            the scope's current one; `node_rekey_pending` — the parent is not re-keyed yet; `stale_placement` — the node
            was moved or renamed since `placementRevision`; `stale_revision` — its `wrappedMeta` moved since
            `metaRevision`; `rekey_parts_missing` — a row sealed under the node's key has no staged value;
            `rekey_parts_stale` — a staged child moved since it was staged; `slug_taken` — a re-computed token collides
            (a defect: the set of names under a parent does not change); `scope_deleting`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: rekey_parts_missing } }
        "413": { $ref: "_common.openapi.yaml#/components/responses/RequestTooLarge" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
    RekeyId:
      name: rekeyId
      in: path
      required: true
      description: A client-minted id of one node's re-key attempt; what its staged parts are kept under until the commit.
      schema: { type: string, format: uuid, example: 6c7c3f0e-2a9b-1d4a-6e8b-2c1f2d3e4a5b }

  responses:
    CoverConflict:
      description: >
        The node's `wrappedMeta` moved since the stated `metaRevision` (`stale_revision`, with the current blob and
        revision - nothing was written and the upload is still open, ADR 0077); the cover slot holds another blob than
        the one stated (`cover_stale`, with `currentBlobId` - nothing was attached, the upload was spent); `nodeEpoch`
        is below the node's stored epoch (`stale_epoch` - the client re-reads) or the node is not re-keyed since the last
        rotation (`node_rekey_pending` - the client retries; nothing was written either way, ADR 0109 point 6); or the
        space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NodeCoverConflict" }
          example: { code: cover_stale, currentBlobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }

  schemas:
    NodeKind:
      $ref: '_common.openapi.yaml#/components/schemas/NodeKind'

    CreateNodeRequest:
      type: object
      required: [nodeId, kind, encryptedName, slugToken, wrappedContentKey]
      # A create under a node states the epoch it read the parent at (ADR 0109 point 6; NodesHandler's shape check,
      # inbox #534). `parentId`'s null is the scope root, which brings none, so only a string one brings it — hence
      # `dependentSchemas`, not `dependentRequired` (which would fire on a null too), and `parentEpoch`'s own null
      # counts as absent. The generators ignore the keyword (UpdateNodeRequest's note); Schemathesis reads it. The root
      # has that one form: a string equal to the path's `scopeId` (the root's stored slot) is the same shape check's 400
      # — a rule across the path and the body, so no schema keyword can say it.
      dependentSchemas:
        parentId:
          if: { properties: { parentId: { type: string } } }
          then:
            required: [parentEpoch]
            properties: { parentEpoch: { type: integer } }
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the node to create (ADR 0072 Decision 3). Its name, content-key wrap and payload are sealed bound to this id, so the server stores it verbatim; a taken id is `409 id_taken`.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            Parent node id, or null/absent for the scope root — the root's only form: the path's `scopeId` here is
            `400 invalid_request` (inbox #534).
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
          # The generator inlines the scalar `NodeKind` as a String and emits no pattern: the token's shape holds
          # here, 400 before the handler; whether any application claims the kind is the handler's question.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under a field key derived from its parent's content key — `K_SC` at the node's epoch for a scope-root node (ADR 0080 Decision 2) — bound to scope, node, epoch and placement revision 0 (a new node's; ADR 0072; opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under the parent's content key (`K_SC` at the node's epoch for a scope-root node, ADR 0080 Decision 2) over (parent ‖ slug); the server enforces uniqueness per parent without seeing the name (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: Ordering among siblings (default 0 / append).
          example: 0
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope **content-key epoch** this node is tagged with (ADR 0024): a scope-root node's name / slug /
            content-key wrap are sealed under `K_SC` at it (below the root they are under the parent's key, and every
            seal still binds the epoch, ADR 0072).
            Must be the scope's **current** epoch at any parent (else `409 stale_epoch`, nothing stored — ADR 0024
            Decision 6, ADR 0109 point 6: a key minted at an older epoch is the epoch the node keeps, and a rotation
            re-keys every node below it); omitted/absent = 0 (the pre-rotation baseline). It is the epoch the node's key
            is minted at.
          minimum: 0
          default: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        wrappedContentKey:
          type: string
          description: The node's content key — a fresh random key wrapped under its parent's content key (`K_SC` at the node's epoch for a scope-root node, the parent node's content key below it; opaque base64), bound to scope, node, epoch and placement revision 0. Every kind carries one, FOLDER included (ADR 0080 Decision 1); a create without it is `400`.
