          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'

    SetNodeCoverRequest:
      type: object
      description: >
        Make one upload session - or a new row on an object the node already stores (`shared`) - the node's cover, and
        re-seal the node's `wrappedMeta` with the cover that names it (see `setNodeCover`). Exactly one of `uploadId`
        and `shared`, else `400 invalid_request` — the schema's own rule (inbox #507).
