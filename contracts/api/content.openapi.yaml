    RekeyBlobWrap:
      type: object
      description: A blob's unchanged `K_blob` re-wrapped under the node's new key (ADR 0109 point 3).
      required: [blobId, wrappedBlobKey]
      properties:
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, x-veyq-visibility: id }
