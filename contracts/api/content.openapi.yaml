      # the same as without them — a top-level `if` would not be: it turns a sibling-annotated `$ref` to the schema
      # into `Any`); Schemathesis reads them.
      dependentRequired:
        encryptedName: [slugToken, wrappedContentKey, epoch, placementRevision]
        slugToken: [encryptedName, wrappedContentKey, epoch, placementRevision]
        wrappedContentKey: [encryptedName, slugToken, epoch, placementRevision]
        epoch: [encryptedName, slugToken, wrappedContentKey, placementRevision]
        placementRevision: [encryptedName, slugToken, wrappedContentKey, epoch]
      dependentSchemas:
        parentId:
          if: { properties: { parentId: { type: string } } }
          # parentEpoch: the entry is sealed under the destination parent's key; its null counts as absent
          then:
            required: [encryptedName, slugToken, wrappedContentKey, epoch, placementRevision, parentEpoch]
            properties: { parentEpoch: { type: integer } }
        wrappedMeta:
          if: { properties: { wrappedMeta: { type: string } } }
          # nodeEpoch: the payload is sealed under the node's own key (NodesHandler.malformed)
          then:
            required: [metaRevision, nodeEpoch]
            properties: { nodeEpoch: { type: integer } }
