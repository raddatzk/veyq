        wrap:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 256
          example: d3JhcA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedDropPublicKey:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 2048
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 2048) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        lostCopyDigest:
          type: [string, "null"]
          description: >
            The link's key is lost: the re-keyer cannot open its recovery copy (`RekeyShare.sealedShareKey`), so no member
            can wrap the node's new key for it — a copy a rotator could not re-seal is staged as one nobody opens (ADR 0115
            decision 2). The base64 SHA-256 of that copy's text as `getNodeRekeyParts` served it. The commit closes such a
            link (`SharingStore.close`, key lost: switched off, its keys cleared, its subtree due as every close of a
            viewable link marks it, ADR 0114 decision 1) in its own transaction before it checks the wraps, and then
            requires none for it; a copy that is no longer this one, or a link that is no longer open on the node, is
            `409 rekey_parts_stale`. Exclusive with `wrap` and `sealedDropPublicKey` (`400 invalid_request`). Every open
            link the stage does not name so still needs its wrap: a link is never closed by leaving it out.
          contentEncoding: base64
          minLength: 44
          maxLength: 44
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 44, max = 44) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

