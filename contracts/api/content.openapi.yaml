openapi: 3.1.0
info:
  title: veyq Content API
  version: 0.1.0
  description: >
    The encrypted node tree inside a scope (en.memory.tree, cr-0027). Nodes of a `kind` — core's FOLDER
    (organization only) or an application's kind — addressed by opaque ids, under the scope resolved from the
    path `scopeId`. **Operator-blind:** the server stores only ciphertext (`encryptedName`, `wrappedContentKey`,
    `wrappedMeta`) + opaque `parentId`/`kind`/`orderIndex` + the **blinded `slugToken`**; it never sees a name, a
    content key or a payload, and learns only the *shape* of the tree.

    Every node, FOLDER included, carries a fresh random per-node content key wrapped under its **parent's
    content key** — `K_SC` at the node's epoch for a scope-root node, the parent node's content key below it
    (`wrappedContentKey`) — the share grain ([ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md),
    [ADR 0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md) Decision 1).
    A node's directory entry lives under that same parent key (ADR 0080 Decision 2): the client encrypts the name
    under it and computes the blinded slug token (a keyed MAC under it), so whoever holds a node's key reads every
    name below it.
    Each node may hold one sealed payload with its revision (`wrappedMeta`, `metaRevision`) whose format is its kind's
    application's. The server enforces structure only: a caller must hold a grant for the scope, slug
    uniqueness per parent (`UNIQUE(parentId, slugToken)`), the placement rule of the node's kind (core's for
    FOLDER, the kind's application's otherwise), no cycle, no cross-scope move. Authorization is enforced by
    code, not this spec (ADR 0008); field validation via `x-field-extra-annotation`.
tags:
  - name: content
    description: >
      The node tree under a scope (create / list / update / soft-delete / restore nodes) **and** the space's
      node trash. One tag = one resource interface owning the `/api/scopes/{scopeId}/nodes` subtree plus
      `/api/scopes/{scopeId}/trash/nodes` — the trash hangs off the *space*, not the node, because a trashed
      node has no live node to hang a tab from ([ADR 0061](../../docs/decisions/0061-node-deletion-reversible-node-trash.md)).
      Distinct from the `/api/scopes` scopes resource.
paths:
  /api/scopes/{scopeId}/nodes:
    post:
      tags: [content]
      operationId: createNode
      summary: Create a node of any kind in the scope's tree.
      description: >
        Adds a node under `parentId` (or the scope root if omitted). The client mints the node's id (`nodeId`,
        [ADR 0072](../../docs/decisions/0072-a-seal-binds-its-object.md) Decision 3) and supplies the ciphertext name, the blinded slug token, and the
        `wrappedContentKey` (the node's content key under its parent's — every kind carries one, ADR 0080), each sealed bound to that id.
        The server stores it opaquely under exactly that id and enforces slug uniqueness per parent + the
        structural rules. An id that already exists — in this scope or any other — is refused `id_taken` and nothing is overwritten; the answer is the same wherever the taken id lives, so it says nothing about another scope. Not idempotent: a retry of a create whose response was lost answers `id_taken` too, and the client re-reads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeRequest" }
            example:
              nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
              parentId: null
              kind: FOLDER
              encryptedName: ZW5jcnlwdGVkLW5hbWU=
              slugToken: c2x1Zy10b2tlbi1iYXNlNjQ=
              orderIndex: 0
              wrappedContentKey: d3JhcHBlZC1rLW1lbQ==
      responses:
        "201":
          description: The node was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCreated" }
              example: { nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
        "400":
          description: Malformed request (missing/invalid fields, or a `kind` outside the `NodeKind` token's shape).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: A sibling already has that slug (`slug_taken`), the `nodeId` is already taken (`id_taken`), the `epoch` is not the scope's current one (`stale_epoch` — the caller's grant lags a rotation; nothing stored), or the space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "422":
          description: >
            Unprocessable. Two codes: `illegal_structure` — the kind's placement rule refuses the parent, the kind is
            one no application claims, an unknown/foreign parent, or a cycle; `capability_disabled` — creating this
            kind needs a capability that is not active instance-wide. The kind's application names that capability
            (`NodeKindRules`, default none): Depot's drop box (`DEPOT_DROPBOX`) needs `core.public-shares.drop-box`, and so, by the AND
            along the path, `core.public-shares` (ADR 0032, ADR 0088). Only creation is refused: an existing node of
            the kind stays (a feature switch refuses only what is new, ADR 0088 decision 5).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    get:
      tags: [content]
      operationId: listNodes
      summary: List the scope's tree (opaque rows).
      description: >
        Returns every node in the scope with its opaque id, parent, kind, ordering, ciphertext name, slug
        token, sealed payload (`wrappedMeta` + `metaRevision`), and the `wrappedContentKey`. The client assembles the tree top-down, opening each
        name under its parent's content key (`K_SC` at the node's epoch for a scope-root node, ADR 0080 Decision 2); the operator sees only the shape.

        **Conditional GET (ADR 0081):** the scope carries one monotonic **tree revision**, bumped in the same transaction as
        every change a level view shows — a node created, renamed, moved, re-sealed, trashed, restored or purged, a blob
        attached to, replaced on or removed from a node. The `200` carries it as the `ETag`; a client echoes it as
        `If-None-Match` and an unchanged scope answers `304` with no body and no row read — the idle case of a live
        level view. The revision is read BEFORE the rows, so the rows are never older than the tag they travel with.
        An opaque number: operator-blind, and it tells a member only that the scope changed (the rows say far more).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - name: If-None-Match
          x-veyq-visibility: structure
          in: header
          required: false
          description: >
            The `ETag` of the client's last listing (the scope's tree revision, quoted). When it equals the scope's
            current revision the server answers `304`. Omitted on a first load; one that does not parse is no match.
          schema: { type: string, maxLength: 64, example: "\"7\"" }
      responses:
        "200":
          description: The scope's nodes.
          headers:
            ETag:
              x-veyq-visibility: structure
              description: The scope's tree revision at the time of the read, quoted — echo it as `If-None-Match` on the next poll.
              schema: { type: string, example: "\"7\"" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeSummary" }
        "304":
          description: Not Modified — the client's `If-None-Match` equals the scope's tree revision; nothing a level view shows has changed. No body, and no row was read.
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}:
    patch:
      tags: [content]
      operationId: updateNode
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            requiredWith: [wrappedMeta]
          - field: placementRevision
            requiredWith: [encryptedName, parentId, wrappedContentKey, slugToken]
            conflictCode: stale_placement
      summary: Move / rename (one placement write), reorder, or re-seal a node's payload.
      description: >
        Partial update with three independent parts; fields not sent are unchanged.

        **Placement** — move and rename are ONE request shape, a rename being a move to the same parent ([ADR
        0080](../../docs/decisions/0080-every-node-carries-a-key-a-folders-key-behaves-like-a-memorys.md) Decision
        3). It carries all of: the destination `parentId` (null/absent = the scope root; a rename sends the
        current parent), the node's content key re-wrapped under the destination parent's key
        (`wrappedContentKey`), the name re-sealed under a field key derived from that key (`encryptedName`), the slug token recomputed under
        it (`slugToken`), the `epoch` the entry was sealed at, and the `placementRevision` it was built on. Sending
        any of `encryptedName`, `slugToken`, `wrappedContentKey` or a `parentId` without the rest is `400
        invalid_request`. The wrap and the name are sealed bound to the revision the server will store,
        `placementRevision + 1` (ADR 0072), so a wrap or a name served at another revision or on another node's row
        does not open. The server compare-and-sets the node's placement revision and applies every field at once,
        or writes **nothing** and answers `409 stale_placement` (the client re-reads the node and rebuilds, ADR
        0077). Structure only: the destination is the root or a live node of the same scope, the kind's placement
        rule admits it there, it is neither the node nor inside the node's subtree (else `422
        illegal_structure`), and the slug is free there (`409 slug_taken`). **Epoch** (ADR 0080 Decision 4): when
        the destination is the scope root the entry is sealed under `K_SC`, so `epoch` must be the scope's current
        one (else `409 stale_epoch`, nothing stored) and is stored; a move out of the root stores the request's
        `epoch`; a placement between two non-root parents keeps the node's stored epoch. At any destination an
        `epoch` above the scope's current one is `409 stale_epoch` (no such epoch exists yet).

        **Reorder** = `orderIndex`, with no revision.

        **Meta** = a re-sealed `wrappedMeta` with the `metaRevision` it was built from — required whenever
        `wrappedMeta` is sent (else `400 invalid_request`); the server compare-and-sets it and stores
        `metaRevision + 1`, or writes **nothing** (a placement in the same request included) and answers `409
        stale_revision` carrying the current blob and revision (ADR 0077).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeRequest" }
            example:
              parentId: 9b1d4a6e-8b2c-4f2d-9e4a-5b6c7c3f0e2a
              encryptedName: cmVuYW1lZA==
              slugToken: bmV3LXNsdWc=
              wrappedContentKey: cmUtd3JhcHBlZC1rLW1lbQ==
              epoch: 0
              placementRevision: 2
      responses:
        "204":
          description: The node was updated.
        "400":
          description: Malformed request, or an incomplete placement write (a name, slug, wrap or parent without the rest of it, or without its `placementRevision` and `epoch`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: >
            A sibling at the destination already has that slug (`slug_taken`); the space is being deleted and
            read-only (`scope_deleting`, uc.spaces.delete-group A4); the node was moved or renamed since the stated
            `placementRevision` (`stale_placement` — nothing was written; the client re-reads the node and rebuilds
            the placement against it, ADR 0080 Decision 3); a placement at the scope root stated an `epoch` that is
            not the scope's current one, or any placement one above it (`stale_epoch` — nothing was written, ADR 0080
            Decision 4); or the node's
            `wrappedMeta` moved since the stated `metaRevision` (`stale_revision`, with the current blob and revision —
            nothing was written, ADR 0077). Every code but `stale_revision` carries `code` alone.
          content:
            application/json: { schema: { $ref: "#/components/schemas/StaleSealedMeta" }, example: { code: stale_revision, wrappedMeta: d3JhcHBlZC1tZXRh, metaRevision: 4 } }
        "422":
          description: Illegal structure (the node's kind may not live under the destination, the destination is missing, trashed or in another scope, or the move would create a cycle — the destination is the node itself or inside its subtree).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    delete:
      tags: [content]
      operationId: deleteNode
      summary: Delete a node — soft-delete the whole subtree into the space's trash (uc.memory.delete-node).
      description: >
        **Soft-delete** the node and every descendant in one transaction (`deleted_at = now`, ADR 0061). The
        subtree leaves every read at once — the tree listing, every listing an application serves of what it
        attached to the subtree, and **both** public-share paths: the anonymous resolve stops listing it *and* its
        blobs stop being authorized for a presign. **Nothing is destroyed** — every row an application attached to
        it, every blob row and every store object survive untouched, which is what makes `restoreNode` complete
        rather than partial. The deleted node's `slugToken`
        is replaced by its own id, so the **name is immediately reusable**; restore carries a freshly
        client-computed token. A scheduled job hard-erases the subtree once its `deleted_at` is older than the
        retention window. Idempotent — re-deleting an already-trashed subtree is still `204`. **Any member** may
        delete (reversible, recovery-not-destruction — the irreversible purge is the system job).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204":
          description: The subtree is in the space's trash (or already was).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: The space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } }

  /api/scopes/{scopeId}/nodes/{nodeId}/cover:
    put:
      tags: [content]
      operationId: setNodeCover
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            required: true
      summary: Make an uploaded image the node's cover - the blob and the sealed meta naming it, in one write (inbox #411).
      description: >
        A cover is an image attached to the node itself, in its `COVER` slot (core's one-blob-per-slot node
        attachment, ADR 0079): not a child, not a file in a folder. It goes to the trash with the node, counts against
        the quota like any attachment, and is freed with the node's purge. Which kinds take one is each kind's
        application's answer (`NodeKindRules.takesCover`): `FOLDER` (core's own), a drop box, a Memory and a Chapter;
        any other kind is `422 illegal_target`.

        **One request, two writes, one transaction.** The client sealed the blob (`startBlobUploads` with `role:
        COVER` and `ownerId` = this node; its `K_blob` wrap is sealed under the node's content key, bound to blob,
        node and role, ADR 0072) and re-sealed the node's `wrappedMeta` with the cover ref it now names. The server
        verifies the upload (declare-then-verify), attaches it to the slot - replacing, and freeing in the same
        transaction, the blob the client states it replaces (`expectedBlobId`, null for an empty slot) - and
        compare-and-sets the node's `wrappedMeta` at `metaRevision` (ADR 0077). Either both land or neither does: a
        slot another writer changed since the client read it is `409 cover_stale` (the upload is spent and its blob
        freed, as a Files replace is), a meta that moved is `409 stale_revision` with the current blob and revision and
        **nothing written, the upload still open** - the client re-applies its change and sends the same upload
        again. So a cover and the meta that names it can never part. The compare is the write's own predicate.

        The replaced blob's row goes with the swap and its store objects go on the reclaim list in the same
        transaction ([ADR 0062](../../docs/decisions/0062-store-object-reclaim-is-a-durable-work-list.md)); the sweep
        deletes them up to one interval later, and nothing readable references them in between. Operator-blind: the
        server holds the ciphertext, the opaque attachment row and the sizes - never the image, the crop or the
        source (those stay in the sealed meta). The caller needs write access to the scope (`scope_deleting` while it
        is being deleted).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetNodeCoverRequest" }
            example:
              uploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
              expectedBlobId: null
              wrappedMeta: d3JhcHBlZC1tZXRh
              metaRevision: 3
      responses:
        "204":
          description: The upload is the node's cover, the node's `wrappedMeta` is the one sent (at `metaRevision + 1`), and any replaced cover blob is freed.
        "400":
          description: Malformed request, or the upload failed declare-then-verify (`budget_exceeded`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, live node or open upload (unknown, spent, another scope's, another member's), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "#/components/responses/CoverConflict" }
        "422":
          description: The node's kind takes no cover (`illegal_target`), or the upload was not started as this node's cover (`upload_mismatch`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_target } }

  /api/scopes/{scopeId}/nodes/{nodeId}/cover/removal:
    post:
      tags: [content]
      operationId: removeNodeCover
      x-veyq-concurrency:
        mode: revision
        fields:
          - field: metaRevision
            required: true
      summary: Remove the node's cover - the blob and the sealed meta that named it, in one write (inbox #411).
      description: >
        The cover blob goes (its row, and its store objects on the reclaim list, in the same transaction) and the
        node's `wrappedMeta` is re-sealed without the cover, compare-and-set at `metaRevision`; nothing is written
        unless both can be. The request names the blob it expects in the slot (`blobId`, what the client read in the
        sealed meta): a slot that holds another blob is `409 cover_stale` and nothing is written. A slot already empty
        (a replay, or a cover whose source was never an upload) still writes the meta, so the removal is
        idempotent and heals a meta that named a blob that is gone. The same write also moves a Memory's cover from an
        uploaded image to one of its own photos: the new meta names the photo, the old blob is freed. The caller
        needs write access to the scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveNodeCoverRequest" }
            example:
              blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
              wrappedMeta: d3JhcHBlZC1tZXRh
              metaRevision: 4
      responses:
        "204":
          description: The slot is empty, the blob freed, and the node's `wrappedMeta` is the one sent (at `metaRevision + 1`).
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope or live node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409": { $ref: "#/components/responses/CoverConflict" }

  /api/scopes/{scopeId}/nodes/{nodeId}/restore:
    post:
      tags: [content]
      operationId: restoreNode
      summary: Restore a soft-deleted subtree out of the space's trash (uc.memory.delete-node).
      description: >
        Clears `deleted_at` across the subtree and writes the supplied `slugToken` back onto its root, returning
        every descendant and everything an application attached to the subtree exactly as it was — none of it was ever removed. The client
        **must** supply the token: the delete freed the name by overwriting `slug_token` with the node's own id,
        and the server cannot recompute a blinded MAC under the parent's key (ADR 0012, ADR 0080 Decision 2). A node created in the meantime
        that already holds the name is a `409 slug_taken` — the same disambiguation a create takes, never a
        silent rename. **Any member** of the scope may restore. A subtree the scheduled job already purged is
        gone (`404`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreNodeRequest" }
            example: { slugToken: c2x1Zy10b2tlbi1iYXNlNjQ= }
      responses:
        "204":
          description: The subtree is back in the tree.
        "400":
          description: Malformed request (missing/invalid `slugToken`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such trashed node (unknown, already purged, or still live), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: A live sibling already holds that slug (`slug_taken`), or the space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "451":
          description: >
            A moderator blocked this node's content, or a node above it (`blocked_by_operator`,
            uc.moderation.take-a-measure): a blocked item can be deleted, never restored, while the block stands.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: blocked_by_operator } }

  /api/scopes/{scopeId}/trash/nodes:
    get:
      tags: [content]
      operationId: listTrashedNodes
      summary: The space's node trash — the soft-deleted subtree roots (uc.memory.delete-node).
      description: >
        Lists only the **root** of each soft-deleted subtree: its descendants went with it and come back with it,
        so listing them too would offer a restore that cannot be honoured on its own. The one exception is a
        descendant an earlier delete trashed on its own: it holds that delete's freed slug, so a restore of the
        parent leaves it and its subtree in the trash, and it is listed as a root again (ADR 0061 Decision 5). Each row carries when it was
        deleted and when it will be purged. The trash hangs off the *space* rather than the node — a trashed
        node has no live node to hang a tab from (ADR 0061 Decision 3). Newest-deleted first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The scope's soft-deleted subtree roots (empty when the trash is empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashedNodeSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "403": { $ref: "_common.openapi.yaml#/components/responses/TenantSuspended" }
        "404":
          description: No such scope, or the caller is not an accepted member of it (indistinguishable, uc.spaces.scope-access).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }

  responses:
    CoverConflict:
      description: >
        The node's `wrappedMeta` moved since the stated `metaRevision` (`stale_revision`, with the current blob and
        revision - nothing was written and the upload is still open, ADR 0077); the cover slot holds another blob than
        the one stated (`cover_stale`, with `currentBlobId` - nothing was attached, the upload was spent); or the
        space is being deleted and read-only (`scope_deleting`, uc.spaces.delete-group A4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NodeCoverConflict" }
          example: { code: cover_stale, currentBlobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }

  schemas:
    NodeKind:
      $ref: '_common.openapi.yaml#/components/schemas/NodeKind'

    CreateNodeRequest:
      type: object
      required: [nodeId, kind, encryptedName, slugToken, wrappedContentKey]
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: >
            The client-minted UUIDv4 id of the node to create (ADR 0072 Decision 3). Its name, content-key wrap and payload are sealed bound to this id, so the server stores it verbatim; a taken id is `409 id_taken`.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Parent node id, or null/absent for the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
          # The generator inlines the scalar `NodeKind` as a String and emits no pattern: the token's shape holds
          # here, 400 before the handler; whether any application claims the kind is the handler's question.
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Pattern(regexp = "[A-Z][A-Z0-9_]{0,15}")'
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under a field key derived from its parent's content key — `K_SC` at the node's epoch for a scope-root node (ADR 0080 Decision 2) — bound to scope, node, epoch and placement revision 0 (a new node's; ADR 0072; opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under the parent's content key (`K_SC` at the node's epoch for a scope-root node, ADR 0080 Decision 2) over (parent ‖ slug); the server enforces uniqueness per parent without seeing the name (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: Ordering among siblings (default 0 / append).
          example: 0
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope **content-key epoch** this node is tagged with (ADR 0024): a scope-root node's name / slug /
            content-key wrap are sealed under `K_SC` at it (below the root they are under the parent's key, and every
            seal still binds the epoch, ADR 0072).
            Must be the scope's **current** epoch (else `409 stale_epoch`, nothing stored — ADR 0024 Decision 6: a
            write under an older epoch would be readable by a member removed since); omitted/absent = 0 (the
            pre-rotation baseline). A member reads a node of epoch `k` iff they hold an epoch ≥ `k`.
          minimum: 0
          default: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        wrappedContentKey:
          type: string
          description: The node's content key — a fresh random key wrapped under its parent's content key (`K_SC` at the node's epoch for a scope-root node, the parent node's content key below it; opaque base64), bound to scope, node, epoch and placement revision 0. Every kind carries one, FOLDER included (ADR 0080 Decision 1); a create without it is `400`.
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedMeta:
          type: [string, "null"]
          description: The node's sealed payload, with its own revision — AEAD-sealed under a field key derived from this node's content key (seal purpose `node-meta`, bound to scope + node; opaque base64). Its plaintext format is the kind's application's, versioned by that application; absent = the node has none yet. The server never inspects it.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    UpdateNodeRequest:
      type: object
      description: >
        Partial update — a placement write (move or rename: `parentId`, `wrappedContentKey`, `encryptedName`,
        `slugToken`, `epoch`, `placementRevision`, all together), a reorder (`orderIndex`), a payload re-seal
        (`wrappedMeta` + `metaRevision`). Omitted fields are unchanged.
      properties:
        encryptedName:
          type: string
          description: >
            Placement write: the name re-sealed under a field key derived from the destination parent's content key (`K_SC` at `epoch` at
            the scope root), seal purpose `node-name` bound to scope, node, `epoch` and `placementRevision + 1` (ADR
            0072, ADR 0080 Decision 3; opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: cmVuYW1lZA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: Placement write — the blinded slug token recomputed under the destination parent's content key (`K_SC` at `epoch` at the scope root) over the destination slot (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: bmV3LXNsdWc=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Placement write — the destination parent; null/absent = the scope root. A rename sends the node's current parent.
          example: null
        wrappedContentKey:
          type: string
          description: >
            Placement write — the node's own content key (unchanged) re-wrapped under the destination parent's
            content key (`K_SC` at `epoch` at the scope root), seal purpose `content-key` bound to scope, node,
            `epoch` and `placementRevision + 1` (ADR 0080 Decision 3; opaque base64). A rename re-wraps too: the old
            wrap is bound to the old revision.
          contentEncoding: base64
          maxLength: 256
          example: cmUtd3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        epoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            Placement write — the scope content-key epoch the entry was sealed at (ADR 0024). Must be the scope's
            current one when the destination is the scope root (else `409 stale_epoch`); stored on a move into or
            out of the root; between two non-root parents the node keeps its stored epoch. Above the current one it
            is refused at any destination (`409 stale_epoch`, ADR 0080 Decision 4).
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        placementRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: >
            Placement write — the `NodeSummary.placementRevision` the placement was built on. The server
            compare-and-sets it and stores `placementRevision + 1`, the revision the sent wrap and name are sealed
            at; a mismatch is `409 stale_placement` with nothing written (ADR 0080 Decision 3, ADR 0077).
          minimum: 0
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 1
        wrappedMeta:
          type: [string, "null"]
          description: The node's sealed payload, re-sealed under a field key derived from its content key (see NodeSummary.wrappedMeta). Partial semantics — a non-null value replaces it; an omitted/null one leaves it unchanged. Opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        metaRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            The `NodeSummary.metaRevision` the sent `wrappedMeta` was built from. Required with `wrappedMeta`,
            ignored without it — a reorder needs no revision, a placement states its own `placementRevision` (ADR
            0077).
          example: 3

    SetNodeCoverRequest:
      type: object
      description: >
        Make one upload session the node's cover, and re-seal the node's `wrappedMeta` with the cover that names it
        (see `setNodeCover`).
      required: [uploadId, wrappedMeta, metaRevision]
      properties:
        uploadId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The upload session of the cover blob, opened by `startBlobUploads` with `role` COVER and `ownerId` = this node.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        expectedBlobId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The cover blob the caller read in the node's slot and replaces; null for a node with no uploaded cover. A
            slot that holds anything else is `409 cover_stale`.
          example: null
        wrappedMeta:
          type: string
          description: The node's sealed payload, re-sealed under a field key derived from its content key with the cover ref (see `NodeSummary.wrappedMeta`). Opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The `NodeSummary.metaRevision` the sent `wrappedMeta` was built from (ADR 0077).
          minimum: 0
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'

    RemoveNodeCoverRequest:
      type: object
      description: Empty the node's cover slot and re-seal the node's `wrappedMeta` without the cover (see `removeNodeCover`).
      required: [blobId, wrappedMeta, metaRevision]
      properties:
        blobId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The cover blob the caller read in the node's slot; the slot is cleared only while it still holds it.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull'
        wrappedMeta:
          type: string
          description: The node's sealed payload, re-sealed without the cover. Opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The `NodeSummary.metaRevision` the sent `wrappedMeta` was built from (ADR 0077).
          minimum: 0
          example: 4
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'

    NodeCoverConflict:
      type: object
      description: >
        A refused cover write. `stale_revision`: the node's `wrappedMeta` moved since `metaRevision` - nothing was
        written, the upload is still open, and the body carries the current blob and revision to re-apply the change on
        (ADR 0077). `cover_stale`: the cover slot holds another blob than the one stated (`currentBlobId`, null:
        empty) - nothing was attached, the upload was spent. `scope_deleting` carries `code` alone.
      required: [code]
      properties:
        code:
          x-veyq-visibility: public
          type: string
          maxLength: 64
          example: cover_stale
        message:
          x-veyq-visibility: public
          type: [string, "null"]
          maxLength: 512
          example: null
        wrappedMeta:
          type: [string, "null"]
          description: With `stale_revision`, the node's current sealed value (opaque base64); null when it has none.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: With `stale_revision`, the revision the current `wrappedMeta` is at.
          example: 4
        currentBlobId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: With `cover_stale`, the blob the slot holds now; null when empty.
          example: null

    NodeCreated:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d

    NodeSummary:
      type: object
      required: [id, kind, encryptedName, slugToken, orderIndex, epoch, wrappedContentKey, metaRevision, placementRevision, createdAt, blockedByOperator]
      properties:
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: >
            A moderator blocked this node's content, or a node above it (uc.moderation.take-a-measure): the level shows the
            placeholder *Blocked by the operator* with no reason, the node does not open, and its bytes answer `451`. Kept
            in the listing, not left out; its uploader may still delete it.
          example: false
        createdAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: >
            When the server stored the node, to the millisecond — server-observed, never client-supplied (no
            request carries it), set once at creation and kept by every rename, move, trash and restore. Siblings
            are ordered by it, then by id, wherever equal names must be told apart (the URL segments `anna`,
            `anna-2`; ADR 0015).
          example: "2026-08-17T10:15:30.123Z"
        placementRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            How many times the node was moved or renamed (0 at birth): the revision its `encryptedName` and
            `wrappedContentKey` are sealed at (seal purposes `node-name` and `content-key` bind it, ADR 0072), and
            the revision a placement write states it was built on (ADR 0080 Decision 3). Nothing else moves it.
          minimum: 0
          example: 2
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope content-key epoch this node is sealed under (ADR 0024); 0 for pre-rotation nodes.
          minimum: 0
          example: 0
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Parent node id, or null at the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        slugToken:
          type: string
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 0
        wrappedContentKey:
          type: string
          contentEncoding: base64
          maxLength: 256
          description: The node's content key wrapped under its parent's content key (see CreateNodeRequest.wrappedContentKey). Every node carries one (ADR 0080 Decision 1; the column is NOT NULL).
          example: d3JhcHBlZC1rLW1lbQ==
        wrappedMeta:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 8192
          description: The node's sealed payload, with its own revision, sealed under a field key derived from this node's content key (AAD context `node-meta`); null when unset. Its plaintext format is the kind's application's. Listed with the tree so a client can show and sort nodes by it without a second read. Opaque to the server.
          example: d3JhcHBlZC1tZXRh
        metaRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: >
            How many times `wrappedMeta` was replaced (0 at birth). A write of `wrappedMeta` states the value it
            was built from (ADR 0077); nothing else moves it.
          minimum: 0
          example: 3
        sealedDropPrivateKey:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 256
          description: >
            The drop private key of the shared root node of a WRITE_ONLY link, sealed under the node's content key
            (AAD `drop-private-key`, bound to scope + node; opaque base64) — set once, by core inside the node's
            first WRITE_ONLY share (`createShare`), and never replaced: what WRITE_ONLY guests added opens through
            it (ADR 0031 point 7). A field of its own, never part of the node's payload. Null until then.
          example: null
        shareIdentityId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            Set on a guest's **identity folder** only (ADR 0080 decision 11): the `FOLDER` a `WRITE_ONLY` guest created
            in its link's root (a drop box) for its own uploads, one per (drop box, identity). Its `encryptedName`,
            `slugToken` and `wrappedContentKey` are then under that identity's key `K_up`, not under the parent's
            content key: a reader opens the parent's `sealedDropPrivateKey`, then `wrappedIdentityKey`, then the
            entry. Null for every other node, and cleared when a member moves the folder out (it is re-wrapped under
            its new parent then).
          example: null
        wrappedIdentityKey:
          type: [string, "null"]
          description: >
            With `shareIdentityId` only: that identity's key `K_up` wrapped to the parent's drop public key (AAD
            `upload-identity-key`, bound to scope + the parent node + the identity; opaque base64), as the guest
            created it (`createShareIdentity`). Null otherwise.
          contentEncoding: base64
          maxLength: 2048
          example: null

    RestoreNodeRequest:
      type: object
      required: [slugToken]
      description: >
        The freshly computed slug token the restored root takes under its parent. The server cannot recompute one
        (it is a blinded MAC under the parent's key, ADR 0012 / ADR 0080) and the original was consumed when the delete freed the name,
        so the client supplies it (ADR 0061 Decision 5).
      properties:
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under the parent's content key (`K_SC` at the node's epoch at the scope root) over (parent ‖ slug), recomputed by the client for the restore. A collision with a node created while this one sat in the trash is the ordinary `slug_taken` rejection (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        encryptedName:
          type: [string, "null"]
          description: >
            Optionally re-seal the node's name in the same write — the A1 disambiguation. A restore into a taken
            name is retried under a different one, exactly as a create is, and the name and the token it is
            derived from have to land **together**: sent apart, the node is briefly live carrying a slug its own
            name does not produce, and a failure in between leaves it that way. Absent = the stored name is
            untouched (the ordinary restore). Sealed under a field key derived from the key the entry lives under (the live parent's
            content key, `K_SC` at the node's epoch at the scope root), bound to the node's epoch and its current
            `placementRevision` — a restore does not move the revision (opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: cmVzdG9yZWQtbmFtZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    TrashedNodeSummary:
      type: object
      description: >
        One soft-deleted subtree **root** in the space's trash. `parentId` is the slot the client recomputes the
        restore's slug token against, and it always names a live parent (or the scope root) — a node whose own
        parent is trashed went down with that parent and is not a root.
      required: [id, kind, encryptedName, epoch, placementRevision, deletedAt, purgeAfter, attached, blockedByOperator]
      properties:
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: A moderator blocked this node's content, or a node above it — its restore answers `451 blocked_by_operator`, so the trash offers none.
          example: false
        attached:
          x-veyq-visibility: flag
          type: boolean
          description: Whether the node itself holds a blob in one of core's attachment slots (`veyq_node_attachment`, kept in the trash until the purge). Core names no slot; an application whose kind keeps its content there tells an empty node apart by it — Files' `FILE` whose upload never finished (inbox #391). A kind whose content lives elsewhere reads `false`. What the server holds anyway.
          example: true
        shareIdentityId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: As `NodeSummary.shareIdentityId` — set on a trashed guest's identity folder, whose `encryptedName` (and a restore's slug token) is under that identity's `K_up` (ADR 0080 decision 11).
          example: null
        wrappedIdentityKey:
          type: [string, "null"]
          description: As `NodeSummary.wrappedIdentityKey`, with `shareIdentityId` only.
          contentEncoding: base64
          maxLength: 2048
          example: null
        placementRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: The placement revision the node's `encryptedName` is sealed at (as `NodeSummary.placementRevision`); a trash does not move it, nor does a restore.
          minimum: 0
          example: 2
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The live parent slot the subtree restores under, or null at the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under a field key derived from its parent's content key (`K_SC` at the node's epoch at the scope root; opaque base64) — the trash renders it by decrypting client-side with the live tree's key chain, exactly as the tree does.
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope content-key epoch this node's name is sealed under (ADR 0024); 0 for pre-rotation nodes.
          minimum: 0
          example: 0
        deletedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the subtree was soft-deleted, to the second. Operational metadata of the same kind an application's own trash already discloses.
          example: "2026-08-17T10:15:30Z"
        purgeAfter:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the scheduled job will hard-erase this subtree — `deletedAt + retention`, **derived** at the resource boundary from the operator's configured window and never stored, so it follows a reconfigured window instead of freezing it at deletion time (ADR 0061 Decision 6). After this instant the subtree is gone and a restore answers 404.
          example: "2026-09-16T10:15:30Z"

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
    StaleSealedMeta:
      $ref: '_common.openapi.yaml#/components/schemas/StaleSealedMeta'
