          example: 0
        placementRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: As `NodeSummary.placementRevision`.
          minimum: 0
          example: 2
        metaRevision:
          x-veyq-visibility: structure
          type: integer
          format: int64
          description: As `NodeSummary.metaRevision`.
          minimum: 0
          example: 3
        encryptedName:
          type: string
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        slugToken:
          type: string
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
        wrappedContentKey:
          type: string
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
        wrappedMeta:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 8192
          example: null
        sealedDropPrivateKey:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 256
          example: null
        shareIdentityId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: As `NodeSummary.shareIdentityId` — a guest's identity folder, whose entry is under that identity's `K_up`.
          example: null
        wrappedIdentityKey:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 2048
          example: null

    NodeRekeyParts:
      type: object
      required: [blobs, shares, identities]
      properties:
        blobs:
          type: array
          description: >
            Every blob in one of the node's attachment slots, whose `K_blob` is wrapped under the node's key — each with
