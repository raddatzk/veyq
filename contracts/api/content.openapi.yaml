          example: false
        ownerOnly:
          x-veyq-visibility: flag
          type: boolean
          description: >
            Only an owner of the scope re-keys this node, one where members place nothing of their own: it is a drop box
            (a kind whose write-only guests get identity folders, e.g. Depot's `DEPOT_DROPBOX`), a guest's identity folder
            (`shareIdentityId`), or below one (ADR 0111 decision 11, ADR 0080 Decision 11). A drop key alone does not make
            a node owner-only: a Memory or chapter carrying a `sealedDropPrivateKey` for its uploader link is any member's
            to re-key. Any other member's re-key skips an owner-only node, and what lies below it waits until an owner
