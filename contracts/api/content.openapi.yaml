    NodeSummary:
      type: object
      required: [id, kind, encryptedName, slugToken, orderIndex, epoch, scopeEpoch, wrappedContentKey, metaRevision, placementRevision, createdAt, blockedByOperator]
      properties:
        blockedByOperator:
          x-veyq-visibility: flag
          type: boolean
          description: >
            A moderator blocked this node's content, or a node above it (uc.moderation.take-a-measure): the level shows the
