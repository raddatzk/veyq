          example: 2
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The node's own key's epoch (ADR 0114 decision 3): 0 when its key is minted, one more with every replacement
            of that key — a rotation's re-key or a link's close. A write sealing under the node's key states it
            (`nodeEpoch`, `parentEpoch`, a placement's `epoch`): another value is `409 stale_epoch`, a node due for its
            re-key `409 node_rekey_pending`.
          minimum: 0
          example: 0
        scopeEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope's epoch when the node's current key was minted (ADR 0115 decision 4) — what the `content-key` and
            `node-name` seals of its entry bind, and what the device floor reads. A node's re-key sets it to the scope's
            current epoch; at the scope root its entry is under the scope key `K_SC`.
          minimum: 0
          example: 0
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Parent node id, or null at the scope root.
