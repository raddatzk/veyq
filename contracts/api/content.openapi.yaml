          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            The own epoch of the node whose key the entry is re-sealed under, as the caller read it: the live parent's,
            or at the scope root the restored node's own (its entry is under the scope key `K_SC`, and a due node
            restores only once re-keyed). Not the stored epoch — the key was replaced since — is `409 stale_epoch`; a
            node due for its re-key is `409 node_rekey_pending` (ADR 0114 decision 3) — a trashed node is
            re-keyed too, so a restore never brings back a key from before.
