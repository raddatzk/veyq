          items: { $ref: "#/components/schemas/RekeyNode" }

    RekeyNode:
      type: object
      description: >
        One node as `listNodes` serves it, live or trashed. `epoch` is the epoch its key was minted at (ADR 0109
        point 6); a node below the scope's current epoch still has its key from before the rotation.
      required: [id, kind, encryptedName, slugToken, epoch, wrappedContentKey, metaRevision, placementRevision, trashed, ownerOnly]
      properties:
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        parentId:
