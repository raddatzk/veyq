          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        scopeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The scope's current epoch — the node's `scopeEpoch` after the commit, and the one its new seals bind (ADR 0114 decision 4).
          minimum: 0
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The node's parent as read; null/absent at the scope root, its only form (the path's `scopeId` here is
            `400 invalid_request`, inbox #534). A parent that is not the node's is `400`.
          example: null
        parentEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            Required with a non-null `parentId` (else `400 invalid_request`): the parent's own epoch as read. A parent
            still due is `409 node_rekey_pending` (top-down), another than its stored epoch `409 stale_epoch`.
          minimum: 0
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        placementRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The node's placement revision as read; the commit stores it + 1, the revision the new entry is sealed at.
          minimum: 0
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The node's meta revision as read; with `wrappedMeta` the commit stores it + 1.
          minimum: 0
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        encryptedName:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedContentKey:
          type: string
          description: The node's NEW content key wrapped under its parent's current key (the scope key `K_SC` at the scope root, a guest's `K_up` for an identity folder), bound to scope, node, `scopeEpoch` and `placementRevision + 1`.
          contentEncoding: base64
          minLength: 1
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedMeta:
          type: [string, "null"]
          description: The node's payload re-sealed under the new key; required when the node has one (else `409 rekey_parts_missing`).
          contentEncoding: base64
          maxLength: 8192
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedDropPrivateKey:
          type: [string, "null"]
          description: A NEW drop private key sealed under the new key; required when the node has one (ADR 0109 point 5).
          contentEncoding: base64
          maxLength: 256
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

