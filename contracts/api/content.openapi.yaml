          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 1
        wrappedMeta:
          type: [string, "null"]
          description: The node's sealed payload, re-sealed under a field key derived from its content key (see NodeSummary.wrappedMeta). Partial semantics — a non-null value replaces it; an omitted/null one leaves it unchanged. Opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        metaRevision:
          x-veyq-visibility: structure
          type: integer
