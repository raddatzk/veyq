          example: 2
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The live parent slot the subtree restores under, or null at the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under a field key derived from its parent's content key (`K_SC` at the node's epoch at the scope root; opaque base64) — the trash renders it by decrypting client-side with the live tree's key chain, exactly as the tree does.
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        epoch:
          x-veyq-visibility: structure
          type: integer
