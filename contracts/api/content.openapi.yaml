    CommitNodeRekeyRequest:
      type: object
      description: The node's own re-keyed fields (`commitNodeRekey`); every list-shaped part is staged under the re-key id first.
      required: [nodeEpoch, scopeEpoch, placementRevision, metaRevision, encryptedName, slugToken, wrappedContentKey]
      # Below the root the entry goes under the parent's current key, so a commit with a parent states the parent's
      # epoch as read (top-down, ADR 0109 point 2; RekeyStore.commit) — CreateNodeRequest's rule (inbox #534): only a
      # string `parentId` brings it, a null one is the root and brings none, and `parentEpoch`'s own null counts as
      # absent. RekeyHandler.commit's shape check decides it before any answer about the instance's state, with the
      # root's one form: a `parentId` equal to the path's `scopeId` is refused there too. The generators ignore the
      # keyword (UpdateNodeRequest's note); Schemathesis reads it.
