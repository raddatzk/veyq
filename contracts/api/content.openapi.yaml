          description: Placement write — the blinded slug token recomputed under the destination parent's content key (`K_SC` at `epoch` at the scope root) over the destination slot (opaque base64).
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: bmV3LXNsdWc=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            Placement write — the destination parent; null/absent = the scope root, its only form (the path's
            `scopeId` here is `400 invalid_request`, inbox #534). A rename sends the node's current parent.
          example: null
        wrappedContentKey:
          type: string
          description: >
            Placement write — the node's own content key (unchanged) re-wrapped under the destination parent's
            content key (`K_SC` at `epoch` at the scope root), seal purpose `content-key` bound to scope, node,
            `epoch` and `placementRevision + 1` (ADR 0080 Decision 3; opaque base64). A rename re-wraps too: the old
            wrap is bound to the old revision.
          contentEncoding: base64
          minLength: 1
          maxLength: 256
          example: cmUtd3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(min = 1, max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            Placement write — the node's epoch, the epoch its key was minted at, which the entry's seals bind (ADR
            0072). A placement never changes it, so it must be the node's stored one (else `409 stale_epoch`); at the
