openapi: 3.1.0
info:
  title: veyq Content API
  version: 0.1.0
  description: >
    The encrypted Memory tree inside a scope (en.memory.tree, cr-0027). Nodes — FOLDER (organization only),
    MEMORY (the content unit), CHAPTER (inside a Memory) — addressed by opaque ids, under the scope resolved
    from the path `scopeId`. **Operator-blind:** the server stores only ciphertext (`encryptedName`,
    `wrappedContentKey`) + opaque `parentId`/`kind`/`orderIndex` + the **blinded `slugToken`**; it never sees
    a name or a content key, and learns only the *shape* of the tree.

    The client encrypts the name under the scope content key `K_SC` and computes the blinded slug token (a
    keyed MAC under `K_SC`); a MEMORY **or CHAPTER** additionally carries a fresh random per-node key `K_mem`
    wrapped under its **parent's content key** — `K_SC` for a top-level Memory, the parent Memory's `K_mem` for
    a chapter (recursive `K_mem`; `wrappedContentKey`) — the share grain ([ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md)).
    The server enforces structure only: a caller must hold a grant for the scope, slug uniqueness per parent
    (`UNIQUE(parentId, slugToken)`), no folder inside a Memory, no cycle, no cross-scope move. Authorization is
    enforced by code, not this spec (ADR 0008); field validation via `x-field-extra-annotation`.
tags:
  - name: content
    description: >
      The Memory tree under a scope (create / list / update / soft-delete / restore nodes) **and** the space's
      node trash. One tag = one resource interface owning the `/api/scopes/{scopeId}/nodes` subtree plus
      `/api/scopes/{scopeId}/trash/nodes` — the trash hangs off the *space*, not the node, because a trashed
      Memory has no Memory to hang a tab from ([ADR 0061](../../docs/decisions/0061-node-deletion-reversible-node-trash.md)).
      Distinct from the `/api/scopes` scopes resource.
  - name: favorites
    description: >
      The caller's **per-(user, scope) Memory pins** — the set of pinned Memory ids, sealed client-side under
      the member's **master key** and stored as a single opaque blob (en.memory.favorites). **Private to the
      member:** this resource returns the caller's own blob and never another member's, and the seal does not
      branch on scope type, so a co-member holding the shared `K_SC` cannot open it
      ([ADR 0068](../../docs/decisions/0068-favorites-two-confidentiality-levels.md)). Operator-blind: a pin is
      a personal preference, NOT in the sanctioned metadata set, so the server never sees *which* nodes are
      pinned — only an opaque ciphertext + its size. Own resource interface (one path).
  - name: item-favorites
    description: >
      The **per-(member, scope, node) item marks** — the set of marked `veyq_media` ids inside one Memory,
      sealed client-side under `K_SC` and stored as one opaque blob per member
      (en.memory.favorites, [ADR 0068](../../docs/decisions/0068-favorites-two-confidentiality-levels.md)).
      Deliberately **shared and member-attributed**, unlike the `favorites` pin: the read returns **every**
      member's blob for that node so the client can render *everyone's / only mine* and a per-item count. The
      write carries no member id — a caller can only replace their own. Partitioned **per node** because the
      server has already observed that node id (the client just listed its media), so the partition adds no
      metadata; a scope-wide set would instead be capped and would re-upload on every toggle. Operator-blind:
      the server never sees *which* items are marked, only opaque ciphertext + its size.

paths:
  /api/scopes/{scopeId}/nodes:
    post:
      tags: [content]
      operationId: createNode
      summary: Create a node (folder / Memory / chapter) in the scope's tree.
      description: >
        Adds a node under `parentId` (or the scope root if omitted). The client supplies the ciphertext name,
        the blinded slug token, and — for a MEMORY or CHAPTER — the `wrappedContentKey` (`K_mem` under the
        parent's content key). The server
        stores it opaquely and enforces slug uniqueness per parent + the structural rules.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeRequest" }
            example:
              parentId: null
              kind: MEMORY
              encryptedName: ZW5jcnlwdGVkLW5hbWU=
              slugToken: c2x1Zy10b2tlbi1iYXNlNjQ=
              orderIndex: 0
              wrappedContentKey: d3JhcHBlZC1rLW1lbQ==
      responses:
        "201":
          description: The node was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCreated" }
              example: { nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
        "400":
          description: Malformed request (missing/invalid fields).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: A sibling already has that slug (`slug_taken`), or the scope is in pending-deletion and read-only (`scope_deleting`, cr-0090).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "422":
          description: Illegal structure (folder inside a Memory, unknown/foreign parent, or a cycle).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    get:
      tags: [content]
      operationId: listNodes
      summary: List the scope's tree (opaque rows).
      description: >
        Returns every node in the scope with its opaque id, parent, kind, ordering, ciphertext name, slug
        token, and (for Memories and chapters) the `wrappedContentKey`. The client decrypts names with `K_SC` and assembles
        the tree; the operator sees only the shape.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The scope's nodes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}:
    patch:
      tags: [content]
      operationId: updateNode
      summary: Rename / move / reorder a node.
      description: >
        Partial update. **Rename** = new `encryptedName` + recomputed `slugToken`. **Move** = new `parentId`
        (null = scope root) + recomputed `slugToken` (cycle/containment checked; same scope only). **Reorder**
        = `orderIndex`. Fields not sent are unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeRequest" }
            example: { encryptedName: cmVuYW1lZA==, slugToken: bmV3LXNsdWc= }
      responses:
        "204":
          description: The node was updated.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: A sibling already has that slug (`slug_taken`), or the scope is in pending-deletion and read-only (`scope_deleting`, cr-0090).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }
        "422":
          description: Illegal structure (folder into a Memory, or a move that would create a cycle).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: illegal_structure } }
    delete:
      tags: [content]
      operationId: deleteNode
      summary: Delete a node — soft-delete the whole subtree into the space's trash (uc.memory.delete-node).
      description: >
        **Soft-delete** the node and every descendant in one transaction (`deleted_at = now`, ADR 0061). The
        subtree leaves every read at once — the tree listing, the media/bucket listings, and **both** public-share
        paths: the anonymous resolve stops listing it *and* its blobs stop being authorized for a presign.
        **Nothing is destroyed** — its media, derivative, bucket and blob rows and every store object survive
        untouched, which is what makes `restoreNode` complete rather than partial. The deleted node's `slugToken`
        is replaced by its own id, so the **name is immediately reusable**; restore carries a freshly
        client-computed token. A scheduled job hard-erases the subtree once its `deleted_at` is older than the
        retention window. Idempotent — re-deleting an already-trashed subtree is still `204`. **Any member** may
        delete (reversible, recovery-not-destruction — the irreversible purge is the system job).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204":
          description: The subtree is in the space's trash (or already was).
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "409":
          description: The scope is in pending-deletion and read-only (`scope_deleting`, cr-0090).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_deleting } }

  /api/scopes/{scopeId}/nodes/{nodeId}/restore:
    post:
      tags: [content]
      operationId: restoreNode
      summary: Restore a soft-deleted subtree out of the space's trash (uc.memory.delete-node).
      description: >
        Clears `deleted_at` across the subtree and writes the supplied `slugToken` back onto its root, returning
        every descendant, photo, bucket and cover exactly as it was — none of it was ever removed. The client
        **must** supply the token: the delete freed the name by overwriting `slug_token` with the node's own id,
        and the server cannot recompute a blinded MAC under `K_SC` (ADR 0012). A node created in the meantime
        that already holds the name is a `409 slug_taken` — the same disambiguation a create takes, never a
        silent rename. **Any member** of the scope may restore. A subtree the scheduled job already purged is
        gone (`404`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreNodeRequest" }
            example: { slugToken: c2x1Zy10b2tlbi1iYXNlNjQ= }
      responses:
        "204":
          description: The subtree is back in the tree.
        "400":
          description: Malformed request (missing/invalid `slugToken`).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such trashed node (unknown, already purged, or still live), or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }
        "409":
          description: A live sibling already holds that slug (`slug_taken`), or the scope is in pending-deletion and read-only (`scope_deleting`, cr-0090).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: slug_taken } }

  /api/scopes/{scopeId}/trash/nodes:
    get:
      tags: [content]
      operationId: listTrashedNodes
      summary: The space's node trash — the soft-deleted subtree roots (uc.memory.delete-node).
      description: >
        Lists only the **root** of each soft-deleted subtree: its descendants went with it and come back with it,
        so listing them too would offer a restore that cannot be honoured on its own. Each row carries when it was
        deleted and when it will be purged. The trash hangs off the *space* rather than the node — a trashed
        Memory has no Memory to hang a tab from (ADR 0061 Decision 3). Newest-deleted first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The scope's soft-deleted subtree roots (empty when the trash is empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashedNodeSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}/item-favorites:
    get:
      tags: [item-favorites]
      operationId: getItemFavorites
      summary: Get every member's sealed item-mark blob for the node.
      description: >
        Returns one entry per member who has ever stored item marks for this node — the caller's own included
        and flagged `self`, and an empty array when nobody has. Each entry's ciphertext is the sealed set of
        marked media ids, which the client opens with `K_SC`; the operator sees only opaque blobs. Entries carry
        **no member id**: the array separates the members, and the count of an item is how many entries hold it,
        so nothing needs a name. This read is deliberately **not** filtered to the caller: it is what lets the client render *everyone's favorites* and a per-item
        count without the blind server aggregating for it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Every member's item-mark blob for the node (empty when none stored).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemFavoritesEntry" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [item-favorites]
      operationId: putItemFavorites
      summary: Replace the caller's sealed item-mark blob for the node.
      description: >
        Upserts the **caller's own** item marks for this node (last-write-wins). The body carries no member id,
        so a caller cannot address another member's blob — the identity comes from the token. The client seals
        the whole marked set for this node under `K_SC` and PUTs the opaque result; the server stores it
        verbatim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutItemFavoritesRequest" }
            example: { ciphertext: aXRlbS1mYXZvcml0ZXMtY2lwaGVy }
      responses:
        "204":
          description: The item-mark blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/favorites:
    get:
      tags: [favorites]
      operationId: getFavorites
      summary: Get the caller's sealed favorites blob for the scope.
      description: >
        Returns the caller's own pin ciphertext for the scope (the sealed set of pinned Memory ids), or a null
        ciphertext if none was ever stored. The client decrypts it with its **master key** — never `K_SC`, which
        is shared in a group and would make the set readable by every co-member. Another member's blob is never
        returned here. The operator sees only an opaque blob.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: The caller's favorites blob (ciphertext null when unset).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
              example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
    put:
      tags: [favorites]
      operationId: putFavorites
      summary: Replace the caller's sealed favorites blob for the scope.
      description: >
        Upserts the caller's pin ciphertext for the scope (last-write-wins). The client seals the whole pinned
        set under its **master key** and PUTs the opaque result; the server stores it verbatim.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFavoritesRequest" }
            example: { ciphertext: ZmF2b3JpdGVzLWNpcGhlcnRleHQ= }
      responses:
        "204":
          description: The favorites blob was stored.
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope whose tree is addressed.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }

  schemas:
    NodeKind:
      type: string
      description: FOLDER organizes only (no content key); MEMORY is the content unit (owns K_mem); CHAPTER is a nested Memory inside a Memory (owns its own K_mem, wrapped under the parent Memory's K_mem).
      enum: [FOLDER, MEMORY, CHAPTER]
      example: MEMORY

    CreateNodeRequest:
      type: object
      required: [kind, encryptedName, slugToken]
      properties:
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Parent node id, or null/absent for the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under the scope content key `K_SC` (opaque base64).
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under `K_SC` over (parent ‖ slug); the server enforces uniqueness per parent without seeing the name (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          description: Ordering among siblings (default 0 / append).
          example: 0
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope **content-key epoch** this node's name / slug / `K_mem`-wrap are sealed under (ADR 0024).
            The client sends the scope's current epoch; omitted/absent = 0 (the pre-rotation baseline). A member
            reads a node of epoch `k` iff they hold an epoch ≥ `k`.
          minimum: 0
          default: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        wrappedContentKey:
          type: [string, "null"]
          description: For a MEMORY or CHAPTER — its random `K_mem` wrapped under the parent's content key (`K_SC` for a top-level Memory, the parent Memory's `K_mem` for a chapter; opaque base64). Absent for folders.
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedMeta:
          type: [string, "null"]
          description: A MEMORY's or CHAPTER's curated metadata (date now, place later) — a client-versioned JSON blob AEAD-sealed under this node's `K_mem` (AAD context `node-meta`; opaque base64). Absent = the implicit `auto`-with-no-dated-media state. The server never inspects it.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    UpdateNodeRequest:
      type: object
      description: Partial update — rename (encryptedName+slugToken), move (parentId+slugToken), reorder (orderIndex). Omitted fields are unchanged.
      properties:
        encryptedName:
          type: string
          contentEncoding: base64
          maxLength: 4096
          example: cmVuYW1lZA==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          contentEncoding: base64
          maxLength: 128
          example: bmV3LXNsdWc=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: New parent for a move (null = scope root).
          example: null
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 1
        wrappedMeta:
          type: [string, "null"]
          description: Curated metadata sealed under the node's `K_mem` (see NodeSummary.wrappedMeta). Partial semantics — a non-null value replaces it; an omitted/null one leaves it unchanged. Opaque base64.
          contentEncoding: base64
          maxLength: 8192
          example: d3JhcHBlZC1tZXRh
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    NodeCreated:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d

    NodeSummary:
      type: object
      required: [id, kind, encryptedName, slugToken, orderIndex, epoch]
      properties:
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope content-key epoch this node is sealed under (ADR 0024); 0 for pre-rotation nodes.
          minimum: 0
          example: 0
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: Parent node id, or null at the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        slugToken:
          type: string
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
        orderIndex:
          x-veyq-visibility: structure
          type: integer
          format: int32
          example: 0
        wrappedContentKey:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 256
          description: A MEMORY's or CHAPTER's `K_mem` wrapped under its parent's content key; null for folders.
          example: d3JhcHBlZC1rLW1lbQ==
        wrappedMeta:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 8192
          description: A MEMORY's or CHAPTER's curated metadata (date/place) — a client-versioned JSON blob sealed under this node's `K_mem` (AAD context `node-meta`); null when unset. Lets a browse card show + sort by the date without loading the Memory's media. Opaque to the server.
          example: d3JhcHBlZC1tZXRh

    RestoreNodeRequest:
      type: object
      required: [slugToken]
      description: >
        The freshly computed slug token the restored root takes under its parent. The server cannot recompute one
        (it is a blinded MAC under `K_SC`, ADR 0012) and the original was consumed when the delete freed the name,
        so the client supplies it (ADR 0061 Decision 5).
      properties:
        slugToken:
          type: string
          description: Blinded slug token — a keyed MAC under `K_SC` over (parent ‖ slug), recomputed by the client for the restore. A collision with a node created while this one sat in the trash is the ordinary `slug_taken` rejection (opaque base64).
          contentEncoding: base64
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        encryptedName:
          type: [string, "null"]
          description: >
            Optionally re-seal the node's name in the same write — the A1 disambiguation. A restore into a taken
            name is retried under a different one, exactly as a create is, and the name and the token it is
            derived from have to land **together**: sent apart, the node is briefly live carrying a slug its own
            name does not produce, and a failure in between leaves it that way. Absent = the stored name is
            untouched (the ordinary restore). Sealed under the node's own epoch key, opaque base64.
          contentEncoding: base64
          maxLength: 4096
          example: cmVzdG9yZWQtbmFtZQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    TrashedNodeSummary:
      type: object
      description: >
        One soft-deleted subtree **root** in the space's trash. `parentId` is the slot the client recomputes the
        restore's slug token against, and it always names a live parent (or the scope root) — a node whose own
        parent is trashed went down with that parent and is not a root.
      required: [id, kind, encryptedName, epoch, deletedAt, purgeAfter]
      properties:
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: The live parent slot the subtree restores under, or null at the scope root.
          example: null
        kind:
          $ref: "#/components/schemas/NodeKind"
        encryptedName:
          type: string
          description: The node name, AEAD-sealed under `K_SC` (opaque base64) — the trash renders it by decrypting client-side, exactly as the tree does.
          contentEncoding: base64
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope content-key epoch this node's name is sealed under (ADR 0024); 0 for pre-rotation nodes.
          minimum: 0
          example: 0
        deletedAt:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the subtree was soft-deleted. Operational metadata — coarse, and of the same kind the media trash already discloses.
          example: "2026-08-17T10:15:30Z"
        purgeAfter:
          x-veyq-visibility: time
          type: string
          format: date-time
          description: When the scheduled job will hard-erase this subtree — `deletedAt + retention`, **derived** at the resource boundary from the operator's configured window and never stored, so it follows a reconfigured window instead of freezing it at deletion time (ADR 0061 Decision 6). After this instant the subtree is gone and a restore answers 404.
          example: "2026-09-16T10:15:30Z"

    Favorites:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: [string, "null"]
          description: The caller's pinned-Memory set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64); null when unset. Private to the member — `K_SC` does not open it.
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=

    PutFavoritesRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          description: The pinned-Memory set, AEAD-sealed under the member's **master key**, context `favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 65536
          example: ZmF2b3JpdGVzLWNpcGhlcnRleHQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ItemFavoritesEntry:
      type: object
      required: [self, ciphertext]
      properties:
        self:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True on the caller's own blob. This is the ONLY identity on the wire, and deliberately so: the array
            already separates the members, and an item's count is simply how many entries contain its id — so no
            member id is needed to render "everyone's / only mine" or the aggregate. Leaving it out makes the
            aggregate-only rule a property of the DATA rather than a convention the UI is trusted to keep: a
            client cannot attribute a mark to a named member because it was never told who. The caller cannot
            derive this flag from anything else the read carries, and the server knows it truthfully — it is the
            token's principal.
          example: true
        ciphertext:
          type: string
          description: That member's marked-media-id set for this node, AEAD-sealed under `K_SC` at the base epoch, context `item-favorites` (opaque base64).
          contentEncoding: base64
          maxLength: 65536
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy

    PutItemFavoritesRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          description: The caller's marked-media-id set for this node, AEAD-sealed under `K_SC` at the base epoch, context `item-favorites` (opaque base64). No member id — the caller can only replace their own blob.
          contentEncoding: base64
          maxLength: 65536
          example: aXRlbS1mYXZvcml0ZXMtY2lwaGVy
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 65536) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
