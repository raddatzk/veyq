          example: d3JhcHBlZC1rLW1lbQ==
        wrappedMeta:
          type: [string, "null"]
          contentEncoding: base64
          maxLength: 8192
          description: The node's versioned sealed payload, sealed under this node's content key (AAD context `node-meta`); null when unset. Its plaintext format is the kind's application's. Listed with the tree so a client can show and sort nodes by it without a second read. Opaque to the server.
