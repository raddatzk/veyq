    CommitNodeRekeyRequest:
      type: object
      description: The node's own re-keyed fields (`commitNodeRekey`); every list-shaped part is staged under the re-key id first.
      required: [nodeEpoch, epoch, placementRevision, metaRevision, encryptedName, slugToken, wrappedContentKey]
      # Below the root the entry goes under the parent's current key, so a commit with a parent states the parent's
      # epoch as read (top-down, ADR 0109 point 2; RekeyStore.commit) — CreateNodeRequest's rule (inbox #534): only a
      # string `parentId` brings it, a null one is the root and brings none, and `parentEpoch`'s own null counts as
      # absent. RekeyHandler.commit's shape check decides it before any answer about the instance's state, with the
      # root's one form: a `parentId` equal to the path's `scopeId` is refused there too. The generators ignore the
      # keyword (UpdateNodeRequest's note); Schemathesis reads it.
      dependentSchemas:
        parentId:
          if: { properties: { parentId: { type: string } } }
          then:
            required: [parentEpoch]
            properties: { parentEpoch: { type: integer } }
      properties:
        nodeEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The node's epoch as the re-keyer read it (`RekeyNode.epoch`); not the stored one is `409 stale_epoch`.
          minimum: 0
          example: 0
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        epoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: The scope's current epoch — the node's epoch after the commit, and the one its new seals bind.
          minimum: 0
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        parentId:
          x-veyq-visibility: id
          type: [string, "null"]
          format: uuid
          description: >
            The node's parent as read; null/absent at the scope root, its only form (the path's `scopeId` here is
            `400 invalid_request`, inbox #534). A parent that is not the node's is `400`.
          example: null
        parentEpoch:
          x-veyq-visibility: structure
          type: [integer, "null"]
          description: >
            Required with a non-null `parentId` (else `400 invalid_request`): the parent's epoch as read; it must be the
            scope's current one (top-down), else `409 node_rekey_pending`.
          minimum: 0
          example: 1
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Min(0)'
        placementRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The node's placement revision as read; the commit stores it + 1, the revision the new entry is sealed at.
          minimum: 0
          example: 2
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        metaRevision:
          x-veyq-visibility: structure
          type: [integer, "null"]
          format: int64
          description: The node's meta revision as read; with `wrappedMeta` the commit stores it + 1.
          minimum: 0
          example: 3
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotNull @field:jakarta.validation.constraints.Min(0)'
        encryptedName:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 4096
          example: ZW5jcnlwdGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 4096) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        slugToken:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 128
          example: c2x1Zy10b2tlbi1iYXNlNjQ=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 128) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedContentKey:
          type: string
          description: The node's NEW content key wrapped under its parent's current key (`K_SC` at `epoch` at the scope root, a guest's `K_up` for an identity folder), bound to scope, node, `epoch` and `placementRevision + 1`.
          contentEncoding: base64
          minLength: 1
          maxLength: 256
          example: d3JhcHBlZC1rLW1lbQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedMeta:
          type: [string, "null"]
          description: The node's payload re-sealed under the new key; required when the node has one (else `409 rekey_parts_missing`).
          contentEncoding: base64
          maxLength: 8192
          example: null
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        sealedDropPrivateKey:
          type: [string, "null"]
          description: A NEW drop private key sealed under the new key; required when the node has one (ADR 0109 point 5).
          contentEncoding: base64
          maxLength: 256
