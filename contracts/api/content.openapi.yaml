    RekeyShareWrap:
      type: object
      description: >
        A share's new `wrap` — the node's new key under the share's unchanged `K_share`, for every link that carries one
        (a WRITE_ONLY link carries none) — and, for a share carrying the node's drop public key, the new one sealed under
        `K_share` (ADR 0109 points 4 and 5). Or, for a link whose recovery copy the re-keyer cannot open, neither: its
        `lostCopyDigest`, and the commit closes the link as one whose key is lost.
      required: [shareId]
      # A key-lost name stands alone (the stage's shape check, before any state is read): a string `lostCopyDigest` brings
      # no `wrap` and no `sealedDropPublicKey` but a null or absent one. Under `dependentSchemas`, as CreateNodeRequest's
      # `parentId`: the generators ignore the keyword, Schemathesis reads it.
      dependentSchemas:
        lostCopyDigest:
          if: { properties: { lostCopyDigest: { type: string } } }
          then:
            properties: { wrap: { type: "null" }, sealedDropPublicKey: { type: "null" } }
      properties:
        shareId:
          x-veyq-visibility: id
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          example: 3q2-7v8Xk1p0aZ9bQ4rT6yW-uJ5nD2fL8sB1cE0gH3i
