        encryptedName:
          type: string
          description: >
            Placement write: the name re-sealed under a field key derived from the destination parent's content key (`K_SC` at `epoch` at
            the scope root), seal purpose `node-name` bound to scope, node, `epoch` and `placementRevision + 1` (ADR
            0072, ADR 0080 Decision 3; opaque base64).
