            the version a placement write states it was built on (ADR 0080 Decision 3). Nothing else moves it.
          minimum: 0
          example: 2
        id: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d, x-veyq-visibility: id }
