# veyq on Kubernetes (ADR 0064). The chart deploys published images only — it builds nothing, and it GENERATES
# nothing: every secret below is the operator's to supply, because a value Helm generated would be re-rolled on
# any render where `lookup` is blind (`helm template`, `--dry-run`), and rotating GARAGE_RPC_SECRET breaks the
# store while losing the config-secret KEK is the quiet loss ADR 0056 is about. values.schema.json refuses an
# install that leaves one unset, naming the path and the shape. ONE release per namespace: the backend projects
# tenant routes into its own namespace and lists them by label, so two releases there would reconcile each
# other's routing away (and the Gateway `veyq` is one name per namespace).
#
# What the CLUSTER must have first (the chart installs no CRD and nothing cluster-scoped): the Gateway API CRDs at
# v1.5 or later, standard channel, and a Gateway API implementation serving the GatewayClass you name in
# gateway.className. Under gateway.tls.mode=per-domain also an implementation that supports ListenerSet, and for
# gateway.tls.acme cert-manager 1.21 or later with its Gateway API AND ListenerSet support switched on.
#
# What is required and has no default:  domain · gateway.className ·
# the database keys under secrets (or secrets.existingSecret) · storeDomain and the two Garage keys under secrets
# when garage.enabled · externalDatabase.jdbcUrl when mariadb.enabled=false ·
# gateway.tls.secretName when gateway.tls.mode=shared ·
# networkPolicy.ingressFrom while networkPolicy.enabled (the default) · backup.existingClaim, or backup.enabled: false.

# The instance's bootstrap domain — what VEYQ_DOMAIN is under compose. Routed statically by the chart's own
# HTTPRoute (the backend never projects it a second time). The links the instance mails carry each tenant's own
# registered domain, which the Server Owner can move (`tenant change-domain`), and a restore targets the tenant
# domain its capture holds (ADR 0056 §4), not this one. Changing this value later is untested.
domain: ""

# The bundled store's OWN host — required with garage.enabled, read by nothing without it. A second HTTPRoute, not
# a path under `domain`: an operator-chosen gateway implementation is not guaranteed to preserve the prefix and Host
# header a SigV4 signature needs, so on this target the store gets its own origin and every presigned URL is signed
# against it verbatim
# (`veyq.bundled-store.signing-mode=store-origin`, ADR 0067 Decision 5; ADR 0013 §4's CORS branch). The bucket's
# CORS policy is written by the backend at runtime and is `*` — the only policy the bundled store can express
# for a multi-tenant instance — so the chart templates no origin list.
storeDomain: ""

# The cluster's DNS domain — the suffix of every Service's full name, `<service>.<namespace>.svc.<clusterDomain>`.
# The admin surface's nginx reaches the app's admin listener by that full name, because its resolver applies no search
# list (templates/admin.yaml). `cluster.local` is Kubernetes' default and k3s's; change it only if your cluster was set
# up with another (the kubelet's `clusterDomain`, e.g. `grep search /etc/resolv.conf` in any pod).
clusterDomain: cluster.local

# Strict-Transport-Security on this deployment's responses (ADR 0069; 180 days, no includeSubDomains, no
# preload). A top-level value and not one under `app:`, because it is the deployment's switch rather than one
# container's. Turn it off only if a host of this release is also served over plain HTTP somewhere, or the
# gateway implementation already sets the header; a browser that saw it keeps it for the full 180 days anyway.
hsts:
  enabled: true

image:
  # The upstream's app image, cosign-signed by the same publish as the admin image and the chart — written out, as
  # the verify identity is (ADR 0057 §3), so a fork that deploys its own images overrides it knowingly.
  # scripts/validate_release_identity.py holds it to the name https://veyq.app/run/verify-a-release/ verifies.
  repository: ghcr.io/raddatzk/veyq
  # Defaults to the chart's appVersion: the release a published chart was packaged with (`<major>.<minor>`), and
  # a placeholder in a checkout, where it must be set. Pin one; `latest` moves, the schema migrates at boot with
  # no gate, and there is no downgrade path (ADR 0057).
  tag: ""
  # The digest https://veyq.app/run/verify-a-release/ resolved and verified for that tag (`sha256:<64 hex>`).
  # Set, the pod runs `repository:tag@digest` and the runtime pulls by the digest; the tag stays for a reader.
  # Leave it empty only if you accept running whatever the tag points at when the node pulls.
  digest: ""
  pullPolicy: IfNotPresent

app:
  # The hops IN FRONT OF the Gateway (veyq.http.trusted-proxies, ADR 0094), such as a load balancer: IP addresses and
  # CIDR ranges, comma-separated. veyq takes the client from the rightmost X-Forwarded-For entry this list does not
  # name. Empty — the default — renders nothing and means the Gateway is the only hop. Never list the Gateway's own
  # data-plane pods or their range: the Gateway is the socket peer, vouched for by the NetworkPolicy's `ingressFrom`,
  # and a range that survives a pod restart trusts every pod beside it (ADR 0071 §4). A hostname or a malformed entry
  # stops the app at startup. Behind an appending load balancer that is not listed, every client shares its bucket.
  trustedProxies: ""
  # Where the client's SOURCE PORT comes from (veyq.http.client-port.*, ADR 0094 decision 7): behind carrier-grade NAT
  # an address names no subscriber without its port. Used only where the X-Forwarded-For entry veyq stops at carries
  # none, and only when the source's IP is that entry's. Configured, never detected: name a source your edge provides.
  clientPort:
    # `none` (the default): no source — the port is known only where a load balancer writes ip:port into
    # X-Forwarded-For. `proxyProtocol`: the Gateway sends the PROXY protocol (v1 or v2) to the app's routes — Envoy
    # Gateway's BackendTrafficPolicy, Istio's DestinationRule; the chart renders no such object (gateway.className is
    # never interpreted), so write it yourself, aimed at the app's routes ONLY: the store speaks no PROXY, and a
    # Gateway that sends it there fails every upload. The app then closes every connection that does not open with a
    # PROXY header, so the three probes move to the admin listener (they then prove the process and the database, not
    # the public listener). `header`: your edge OVERWRITES `header` on every request with the client's address:port —
    # set it only if it does: Traefik and the common gateways pass an unknown header through, and then any client
    # names any port.
    source: none
    # The header `header` reads. Rendered only when it differs from the app's default.
    header: X-Veyq-Client-Addr
  # `Recreate`, and NOT Kubernetes' default RollingUpdate — the second half of "one app pod" is the one that
  # matters. quarkus.flyway.migrate-at-start=true runs the schema migration at boot with no gate (ADR 0096 decides
  # who starts an upgrade — by hand, here `helm upgrade` — not how the schema moves); RollingUpdate with its
  # default maxSurge starts the new pod
  # BEFORE the old one stops, so a `helm upgrade` would briefly run two migrators against one database.
  # `replicas: 1` alone does not prevent that; Recreate is what makes "one migrator at a time" true. Deliberately
  # not a value: raising replicas is a decision about the migration mechanism, not a tuning knob.
  resources:
    limits:
      # One decision written in two files: the image's ENTRYPOINT sets -XX:MaxRAMPercentage=60.0, which is a
      # percentage OF THIS LIMIT (without one the JVM sizes its heap off the node's RAM). 1Gi agrees with the
      # compose recipe's `mem_limit: ${VEYQ_MEM_LIMIT:-1g}`; change both or neither.
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Probes are the chart's because compose supplies them and the image does not. `GET /api/setup` is
  # unauthenticated, served only once Flyway has migrated, and the first call every client makes — the same
  # probe scripts/run_web_e2e.py and the compose healthcheck use. This backend has NO smallrye-health extension,
  # so there is no /q/health/ready to poll (cr-e2e-orchestrator paid for assuming otherwise).
  startupProbe:
    # periodSeconds × failureThreshold must cover the compose recipe's start_period of 60s with room: a JVM on
    # a cold node migrating a schema is exactly what a too-short startup window turns into a restart loop.
    periodSeconds: 5
    failureThreshold: 36
  readinessProbe:
    periodSeconds: 15
    timeoutSeconds: 5
  # No liveness probe by default, and that is a decision: a liveness probe on a JVM in a long GC pause converts
  # a slow instance into a restart loop, and the image already exits on OutOfMemoryError so the kubelet
  # restarts a genuinely wedged JVM without one. Enable it knowingly.
  livenessProbe:
    enabled: false
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  persistence:
    # The config-secret KEK (ADR 0050/0056): the server GENERATES it into /var/lib/veyq on first start, and it
    # is the one piece of durable state that is neither in the database nor in the store. A PVC comes up
    # root-owned — unlike a Docker named volume, it is NOT seeded from the image directory it covers — so the
    # pod sets fsGroup to the image's runtime uid; scripts/chart_meta_check.py holds this to the Dockerfile.
    # The claim is annotated helm.sh/resource-policy: keep, so `helm uninstall` leaves the key behind rather
    # than turning a reinstall into an instance that boots and then refuses invites and resets — and, because Argo CD
    # ignores that policy, argocd.argoproj.io/sync-options: Prune=false,Delete=false for the same under Argo CD. With
    # configSecret.existingSecret below the key comes from that Secret instead, and the claim still holds the
    # erasure ledger (ADR 0056 decision 8), so it is rendered either way.
    size: 100Mi
    storageClass: ""
    accessMode: ReadWriteOnce
  configSecret:
    # Your own config-secret key (ADR 0050's "supply your own", ADR 0118): the name of a Secret in this namespace
    # holding the base64 32-byte key under `key`. Set, the app reads it read-only from that Secret and generates
    # none; empty — the default — it generates one onto the claim above on its first start. A Secret is how a key gets
    # into a pod at all: the app image is distroless, with no shell and no tar for `kubectl cp`. The key never changes
    # by itself, so a GitOps tool or a secret operator can own it; replacing it is a new key (MISMATCH, ADR 0050).
    #   head -c 32 /dev/urandom | base64 > config-secret.key          # or the key a backup kept apart (leg c)
    #   kubectl -n veyq create secret generic veyq-config-secret-key --from-file=config-secret.key
    existingSecret: ""
    key: config-secret.key

admin:
  image:
    # The upstream's admin image (see image.repository) — pin the SAME tag as the app: the two ship as one release
    # and only one of a mismatched pair migrated the schema.
    repository: ghcr.io/raddatzk/veyq-admin
    tag: ""
    # Verified with the app image, by the same section, and set together with it — never one digest alone.
    digest: ""
    pullPolicy: IfNotPresent
  # The Server-Owner administration surface's exposure (ADR 0065), translated as a PROPERTY and not as compose's
  # mechanism. Compose binds 127.0.0.1:<port>; here the default is NO route and a ClusterIP Service, reached
  # with `kubectl -n <ns> port-forward svc/veyq-admin 8081:8080` — which is what keeps first-run setup
  # independent of DNS and TLS: the admin container proxies /api/* from its own origin, so
  # http://localhost:8081 bootstraps an instance whose `domain` does not resolve yet. Set a domain to expose it
  # on its own hostname (an HTTPRoute, and under per-domain a listener and certificate of its own); choose one you
  # publish nowhere.
  domain: ""
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

backup:
  # The backup gate (ADR 0098): an init container, `backup-gate`, in the app pod, before the container that migrates.
  # When the pod is about to start a different release than the database holds — or a new `request` — it captures the
  # database and an INDEX of the object store (keys, sizes, MD5s; the objects stay in the store) onto the claim below,
  # refuses a downgrade, a jump of more than one major and a major entered from an untested release (writing
  # nothing), and keeps the newest `keep` captures. Because it is part of the Deployment, `helm upgrade`, Argo CD, Flux
  # and a plain `kubectl apply` all run it, and `--no-hooks` or a selective sync cannot skip it. A failed or refused
  # gate keeps the app from starting; nothing has migrated, and pinning the previous release back starts it again.
  # It never mounts the config-secret claim, so no capture holds the KEK: export the key once, by hand
  # (https://veyq.app/run/backup-and-restore/).
  #
  # A REQUIRED choice, with no default that decides it for you (the schema refuses an install that makes none): name a
  # claim, or switch the gate off — and then take the backup before every upgrade by hand.
  enabled: true
  # A PersistentVolumeClaim you created in this namespace (ReadWriteOnce is enough: one pod mounts it). The chart
  # creates none, so `helm uninstall` cannot take the backups with it; its size, class and encryption are yours.
  existingClaim: ""
  # Complete captures kept — a second bound beside B: the gate prunes the captures beyond it after each capture, and a
  # full claim fails the gate rather than pruning to make room.
  keep: 3
  # B (ADR 0056 decision 8): every capture on the claim is deleted once it is older than B, the newest too — the days
  # the Server Owner sets in admin-web or with `veyq-admin backup-retention set` (30 until set), read from the database.
  # The gate prunes at every start, and a daily CronJob, `veyq-backup-prune`, runs the same prune on the gate's image
  # and claim: it reaches the database (to read B) and writes only this claim, never the config-secret claim. It runs
  # on the app pod's node (the claim is ReadWriteOnce: never ReadWriteOncePod), and waits while the app pod is not
  # scheduled. A copy you move off the claim is yours to delete by B.
  prune:
    schedule: "17 3 * * *"
  # An opaque value: change it (a commit, by a person or a bot) to ask for a capture without a release change — a
  # new pod-template revision, so Kubernetes stops the old pod first and the capture is cold.
  request: ""
  image:
    # The upstream's tools image, released and signed with the app and admin images (ADR 0057; verified on
    # https://veyq.app/run/verify-a-release/). The tag defaults to the APP image's tag: the gate runs
    # only in its own release's tools image, and refuses an app release that is not that image's.
    repository: ghcr.io/raddatzk/veyq-tools
    tag: ""
    # Verified with the other two, by the same page, and set together with them.
    digest: ""
    pullPolicy: IfNotPresent
  store:
    # Only for a store of your own (Server → Object store): its secret key is sealed under the KEK the gate never
    # reads, so name a Secret with `endpoint`, `bucket`, `accessKey`, `secretKey` (and optionally `region`) — a key
    # pair that can LIST the bucket is enough. The gate checks endpoint and bucket against the store in use and fails
    # naming the value when they differ, or when the instance uses its own store and no Secret is named. The bundled
    # store needs nothing here.
    existingSecret: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

networkPolicy:
  # Default-deny for every pod of the release, then exactly the paths the stack uses (templates/networkpolicy.yaml,
  # ADR 0071 §3). Set false only when your CNI does not enforce NetworkPolicy or you write your own: it removes
  # EVERY policy the chart renders, the one keeping all pods but the admin pod off the app's admin listener
  # included, and reachability is then yours to own.
  enabled: true
  # REQUIRED while enabled, with no default: the NetworkPolicy peers your Gateway's DATA-PLANE pods match — the
  # pods that actually proxy the traffic, not the controller that configures them. ("ingress" here is the
  # NetworkPolicy direction, not the Kubernetes kind.) The chart cannot know their namespace or labels, and never
  # guesses: some implementations run one shared data plane in their own namespace, others start a proxy per
  # Gateway in the Gateway's OWN namespace — this release's — in which case the peer is a bare podSelector. They
  # reach the app's public port, the store's S3 port, the admin surface when admin.domain is set, and
  # cert-manager's HTTP-01 solvers. For Traefik installed by its Helm chart into `traefik`, e.g.:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: traefik
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: traefik
  ingressFrom: []

gateway:
  # REQUIRED: the GatewayClass of your Gateway API implementation — what the chart's Gateway `veyq` is handed to.
  # Never interpreted, and no implementation is required: Traefik is the docs' example (e.g. `traefik`, the name
  # of the GatewayClass you or its Helm chart created — `kubectl get gatewayclass` lists them). The Gateway API CRDs (v1.5 or later, standard channel) and the implementation are yours to
  # install first; without the CRDs `helm install` fails whole, before creating anything.
  className: ""
  # Stamped VERBATIM on the chart's Gateway AND, via the backend, on every tenant ListenerSet it projects — the
  # objects cert-manager reads for certificates. An HTTPRoute carries no certificate and gets none. TLS has two
  # halves (ADR 0064): the backend only ever stamps a REFERENCE, and needs no RBAC beyond its route and ListenerSet
  # verbs because cert-manager watches the objects the backend already writes; the issuer the reference names is
  # configured either by you — bring your own, e.g.
  #   cert-manager.io/cluster-issuer: letsencrypt
  # — or by the chart, through gateway.tls.acme below, which adds `cert-manager.io/issuer: veyq-acme-…` here for
  # you. Not both: the schema refuses an issuer annotation beside the opt-in.
  annotations: {}
  tls:
    # Where every route — the chart's own and every tenant's — is served, decided once for all of them:
    # none       — every route attaches to the Gateway's plain-HTTP listener on :80, and no HTTPS listener exists.
    #              For TLS terminated upstream (a cloud load balancer, a mesh). The default, so no existing
    #              deployment moves — but read on before keeping it: TLS is a PRECONDITION for this app, not a
    #              preference. The refresh cookie is `Secure` by default and every mailed link is https, so an
    #              instance nothing terminates TLS for boots, serves every page, silently breaks "remember me" and
    #              mails links to a scheme it does not answer.
    # per-domain — an HTTPS listener per host whose certificateRefs names the host's route (`veyq-app`,
    #              `veyq-garage`, `veyq-admin` on the Gateway; each tenant's own ListenerSet, written by the
    #              backend, under that tenant's object name). Every tenant domain — a custom domain included — gets
    #              its own certificate through the annotations above: your own issuer's, or gateway.tls.acme's.
    #              Needs an implementation that supports ListenerSet (Gateway API v1.5 standard channel); NOT every
    #              released implementation does — check yours. Residue worth knowing: when a tenant is suspended
    #              and its ListenerSet withdrawn, cert-manager does NOT delete the Secret it issued unless it runs
    #              with --enable-certificate-owner-ref, so a withdrawn domain leaves an orphaned TLS Secret in the
    #              namespace. Operator-visible, not a routing leak (the listener is gone) and not an access leak
    #              (suspension's guarantee is the app's scope-access gate); not swept by the chart, because
    #              sweeping Secrets would need RBAC this design exists to avoid.
    # shared     — one hostname-less HTTPS listener referencing ONE pre-provisioned TLS Secret (secretName below),
    #              which every route attaches to: a wildcard certificate, kept as an operator's choice rather than
    #              as everyone's ceiling. An operator who bought one *.example.com certificate and runs no ACME
    #              gets a working instance — and gives up per-tenant custom domains knowingly, because a custom
    #              domain routes and the browser refuses.
    # Under per-domain and shared the chart also redirects :80 to https (an HTTPRoute with the RequestRedirect
    # filter, whose `scheme` field is Gateway API's Extended HTTPRouteSchemeRedirect feature).
    mode: none
    # Required by `shared`; ignored by the other modes. The backend refuses `shared` without it — loud and
    # disabled, never a failed boot — so an install that forgets it routes nothing rather than half.
    secretName: ""
    # The chart's ACME issuer — what Traefik's resolver (and VEYQ_ACME_CASERVER) is under compose. Enabled, the
    # chart templates ONE namespaced cert-manager Issuer named for its directory — `veyq-acme-production`,
    # `veyq-acme-staging`, or `veyq-acme-<hash>` for another CA (HTTP-01 through the Gateway's :80 listener) — and
    # stamps `cert-manager.io/issuer: <that name>` plus `acme.cert-manager.io/http01-parentreffallback`
    # on the Gateway and every tenant ListenerSet, so a tenant created at runtime is a certificate order with no
    # chart edit and no restart. Requires `mode: per-domain` (ACME is how per-domain certificates are obtained,
    # not a fourth mode); the schema refuses another mode rather than overriding you. No account e-mail: Let's
    # Encrypt sends no expiry notices and keeps no contact since June 2025, so the issuer registers without one.
    #
    # Preconditions you meet, not the chart: cert-manager 1.21 or later in the cluster (the parent-ref fallback
    # is 1.21's), with its Gateway API support AND its ListenerSet support on — ListenerSet support is ALPHA:
    # `config.gatewayAPI.enabled=true`, `config.gatewayAPI.enableListenerSet=true` and
    # `config.featureGates.ListenerSets=true` in cert-manager's Helm values (without its CRDs the install fails
    # whole, before creating anything); port 80 of every tenant host reachable through the Gateway; and a
    # tenant's DNS pointing here BEFORE the tenant is created — each creation is an order.
    acme:
      enabled: false
      # The CA's ACME directory. Let's Encrypt production by default, as under compose; any ACME CA works (an
      # internal step-ca is one URL). While you test a deployment, use Let's Encrypt staging:
      #   https://acme-staging-v02.api.letsencrypt.org/directory
      # — its certificates are NOT browser-trusted, so an instance left on staging boots and every browser
      # refuses it; with garage.enabled the app's own check of the bundled store fails on the store host's staging
      # certificate too, and passes on a later try once a production one replaces it. Switching this URL renames the
      # Issuer, so cert-manager re-orders every certificate from the new directory by itself, the old ones served
      # until the new are Ready. What production costs a test (letsencrypt.org/docs/rate-limits): 5 failed validations per
      # hostname per hour, and 50 new certificates per registered domain per week.
      server: https://acme-v02.api.letsencrypt.org/directory

secrets:
  # Name an existing Secret carrying the keys below (mariadbPassword, mariadbRootPassword, and with garage.enabled
  # garageRpcSecret and garageAdminToken) and the chart renders none of its own — for sealed-secrets,
  # external-secrets or any operator who keeps key material out of values files. Leave empty to have the chart
  # render a Secret from the values below.
  existingSecret: ""
  # Database. The app user's password, and root — root is read by nothing in the chart and exists for a backup
  # capture (ADR 0056) and the image's own bootstrap.
  mariadbPassword: ""
  mariadbRootPassword: ""
  # The bundled object store — required with garage.enabled, rendered into nothing without it (an existingSecret then
  # needs neither key). The RPC secret must be exactly 64 hex characters (`openssl rand -hex 32`); the admin token
  # is read by TWO components — the store, and the app, which brings the store from running to usable on
  # first start (ADR 0067: layout, bucket, key, grant, CORS). The app DERIVES the bundled store's S3 key pair
  # from that token (ADR 0089), so there is no key pair to set here: the Server Owner chooses "Use the bundled
  # store" in the admin console and nothing else.
  garageRpcSecret: ""
  garageAdminToken: ""

mariadb:
  # false = an operator-managed database (ADR 0064's escape hatch); then set externalDatabase below.
  enabled: true
  image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

externalDatabase:
  # Read only when mariadb.enabled=false. The password is secrets.mariadbPassword (or that key of
  # secrets.existingSecret) either way, so the app's own wiring does not change with the database's home.
  jdbcUrl: ""
  username: veyq

garage:
  # The bundled object store (ADR 0064 § the bundled store is opt-in): OFF by default on this target, unlike compose.
  # On a cluster it is one node on one claim, with no replication and no versioning, so keeping its objects falls back
  # onto your volume snapshots (ADR 0056 §3); it needs a host of its own (storeDomain: DNS, a certificate, a
  # listener); and a cluster commonly has an S3-compatible store already. Off, the chart renders none of Garage's
  # objects and passes the app no bundled-store hint: after the install, set a store of your own in the admin
  # console (Server → Object store) — no tenant is created before it passes its check — and name it to the backup
  # gate in backup.store.existingSecret. On, set storeDomain and secrets.garageRpcSecret / garageAdminToken, and the
  # app sets the bundled store itself and checks it once it has provisioned Garage (ADR 0089 decision 3).
  # Turning it off under an instance whose store IS the bundled one is not refused (Helm cannot read the setting):
  # the app then names the cause, and the claims stay behind (volumeClaimTemplates, no retention policy), so `true`
  # again restores it. Deleting those claims deletes the objects.
  enabled: false
  image: dxflrs/garage:v2.0.0@sha256:15b40e0dddd2e611aa746ff6f7c3bfe9f22735e4a2cc29e0abd89c268e9b79d9
  # The store's RUST_LOG. The image bakes in `garage=info`, which logs every S3 and admin request with the peer's
  # address and port and the URI with its query (object keys, presign signatures); `warn` keeps warnings and errors
  # and drops that request log (ADR 0092 § 5) — the compose recipe sets the same. Raise it to `garage=info` (or
  # `garage=debug`) only to troubleshoot the store, and set it back: at `info` every reader's address is logged again.
  logFilter: garage=warn
  # Three claims, mirroring the compose recipe's three volumes. Snapshots are separate from meta on purpose:
  # `garage meta snapshot` defaults to writing INSIDE metadata_dir, into the very volume a rollback would
  # copy (ADR 0056 §3).
  # Each claim takes its own storageClass, or the shared one when its own is empty ("" there too: the cluster's
  # default). The split is for putting `data` — the object blocks — on a network share (an NFS or SMB CSI class)
  # while `meta` stays on a local block class: meta holds the LMDB database (db_engine in garage-configmap.yaml),
  # and LMDB's own documentation rules out remote filesystems. Pick the classes before the first install: they are
  # volumeClaimTemplates, which the API server refuses to change on an existing StatefulSet, and a claim already
  # bound keeps its class whatever the template says — moving one is a copy of its contents, not a values change.
  persistence:
    storageClass: ""
    meta:
      storageClass: ""
      size: 1Gi
    data:
      storageClass: ""
      size: 50Gi
    snapshots:
      storageClass: ""
      size: 1Gi
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
