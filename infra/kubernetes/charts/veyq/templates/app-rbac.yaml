# The backend's cluster identity, and the whole of it: a namespace-local ServiceAccount + Role, never a
# ClusterRole (ADR 0064). The backend projects tenant domains as HTTPRoutes and, under per-domain, ListenerSets
# into ITS OWN namespace and lists each kind by its ownership label; these are the verbs that reconcile needs —
# `delete` included, because a withdrawn domain's route and ListenerSet must go, not stay. Nothing on `gateways`:
# the backend can neither add nor change a listener on the chart's Gateway, so a tenant domain reaches the network
# only through a ListenerSet that Gateway admits. Nothing here reaches Secrets or CRDs: TLS is a passthrough
# (certificateRefs + annotations cert-manager acts on), so no certificate object is ever the backend's to write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: veyq-app
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: veyq-app
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "listenersets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: veyq-app
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: veyq-app
subjects:
  - kind: ServiceAccount
    name: veyq-app
    namespace: {{ .Release.Namespace }}
