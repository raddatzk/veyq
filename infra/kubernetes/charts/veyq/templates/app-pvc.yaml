# The config-secret KEK's home (ADR 0050/0056) — see app.persistence in values.yaml for why the claim is kept
# on uninstall and why the pod sets fsGroup for it. A standalone claim rather than a StatefulSet template
# because the app is a Deployment with Recreate: exactly one pod ever mounts it, and ReadWriteOnce is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: veyq-config-secret
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    # The same intent for Argo CD, which renders the chart with `helm template` and ignores Helm's policy: never pruned
    # by a sync, and left behind when the Application is deleted (Argo CD's sync options `Prune=false` and
    # `Delete=false`; remembered from its documentation, not run on a cluster). Ignored by Helm and everything else.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [{{ .Values.app.persistence.accessMode }}]
  {{- with .Values.app.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.app.persistence.size }}
