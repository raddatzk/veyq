# Production stack for a self-hosted veyq instance: the app, its database, the bundled object store, and a
# Traefik that terminates TLS in front of both. See infra/README.md § Running in production.
#
#     docker compose -f infra/docker-compose.prod.yml up -d
#
# It is a STANDALONE file, deliberately not an override of docker-compose.yml. That file has no app service at
# all (the backend is run from the IDE), publishes 3306/19000/18080, and ships `change-me` passwords — an
# override would inherit a file whose entire premise is that the app is elsewhere, and inherit a known password
# by accident.
#
# Every secret is REQUIRED and has no default: `${VAR:?…}` fails the `up` when it is unset. A prod stack that
# boots with `change-me` is worse than one that refuses to boot. Copy infra/.env.example to infra/.env
# (gitignored) and fill it in.

# The project name is a property of THIS FILE — not of the directory it is run from, and not of a flag an
# operator has to remember on every command. Without it Compose derives the project from the file's directory,
# which both compose files share, and two things follow that no amount of prose prevents: an unqualified
# `down -v` meant for the dev stack destroys the production volumes, and `scripts/instance_backup.py` — whose
# `docker compose … exec` emits no `-p` — aims the documented production capture at whatever happens to be
# running out of `infra/`, backing up the wrong instance and reporting success. Naming it here is what keeps
# `infra_*` (dev) and `veyq_*` (prod) apart on one host. `scripts/validate_release_identity.py` holds it.
name: veyq

services:
  mariadb:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: veyq
      MARIADB_USER: veyq
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in infra/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in infra/.env}
    # No published port. The app reaches it on the compose network; a backup capture reaches it through
    # `docker compose exec`, which needs no port either.
    volumes:
      - veyq-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  garage:
    image: dxflrs/garage:v2.0.0@sha256:15b40e0dddd2e611aa746ff6f7c3bfe9f22735e4a2cc29e0abd89c268e9b79d9
    restart: unless-stopped
    environment:
      # garage.toml carries no secrets so one config serves both stacks; these are the real ones.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in infra/.env (64 hex chars)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in infra/.env}
    volumes:
      - "./garage.toml:/etc/garage.toml:ro"
      - veyq-garage-meta:/var/lib/garage/meta
      - veyq-garage-data:/var/lib/garage/data
      - veyq-garage-snapshots:/var/lib/garage/snapshots

  app:
    image: ${VEYQ_IMAGE:?set VEYQ_IMAGE in infra/.env, e.g. ghcr.io/raddatzk/veyq:1.0@sha256:<digest> (infra/README.md, Verifying a release)}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://mariadb:3306/veyq
      QUARKUS_DATASOURCE_USERNAME: veyq
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in infra/.env}
      # Behind a reverse proxy the per-IP rate limiter must key on the real client, not on Traefik.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      # HSTS on the app's responses (ADR 0069). The switch is the DEPLOYMENT's, named for it rather than for
      # this service, so every origin this stack serves answers to the one value — infra/README.md says when to
      # turn it off. Traefik adds nothing: the app sends its own headers.
      VEYQ_HTTP_HSTS_ENABLED: ${VEYQ_HSTS_ENABLED:-true}
      # The store is reached INTERNALLY; presigned URLs are SIGNED for the public origin so a browser fetches
      # them same-origin, with no CORS (ADR 0013 §4). Both must be set — signing for the internal name would
      # produce URLs no client can reach.
      VEYQ_BLOB_STORE_ENDPOINT: http://garage:3900
      VEYQ_BLOB_STORE_PUBLIC_ENDPOINT: https://${VEYQ_DOMAIN:?set VEYQ_DOMAIN in infra/.env}
      VEYQ_BLOB_STORE_ACCESS_KEY: ${VEYQ_S3_ACCESS_KEY:?set VEYQ_S3_ACCESS_KEY in infra/.env}
      VEYQ_BLOB_STORE_SECRET_KEY: ${VEYQ_S3_SECRET_KEY:?set VEYQ_S3_SECRET_KEY in infra/.env}
      # The app brings the bundled store from RUNNING to USABLE itself (ADR 0067) — layout, bucket, key, grant
      # and CORS policy — which is why this recipe has no init sidecar and builds nothing. It runs in the
      # background and can never fail the boot; `GET /api/instance/store-provisioning` reports how it went.
      # The admin plane is a DIFFERENT port from the S3 one above, and is deliberately not published.
      VEYQ_BLOB_STORE_TYPE: garage
      VEYQ_BLOB_STORE_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      VEYQ_BLOB_STORE_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in infra/.env}
      # Leg (c) of the backup, on the volume below. An ABSOLUTE path outside /work on purpose: /work holds
      # quarkus-app/, and a volume mounted there would be seeded from the image once and never refreshed — an
      # upgrade would silently keep running the first image's jar. See the Dockerfile comment on runtime-jvm.
      VEYQ_SECURITY_CONFIG_SECRET_FILE: /var/lib/veyq/config-secret.key
      # ALL of this stack's routing (ADR 0063). The app renders one file into the volume Traefik file-watches:
      # the services below, VEYQ_DOMAIN's routers, every non-suspended tenant's, and the admin router when
      # ADMIN_DOMAIN is set. Creating a tenant makes its domain route with no compose edit and no restart.
      VEYQ_TENANT_INGRESS_DYNAMIC_CONFIG_PATH: /etc/traefik/dynamic/tenants.yml
      VEYQ_TENANT_INGRESS_BOOTSTRAP_DOMAIN: ${VEYQ_DOMAIN:?set VEYQ_DOMAIN in infra/.env}
      VEYQ_TENANT_INGRESS_ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      # This file's topology, which the rendered services point at. The app upstream is its PUBLIC listener,
      # never the admin listener on 8090 (ADR 0065).
      VEYQ_TENANT_INGRESS_UPSTREAM_APP: http://app:8080
      VEYQ_TENANT_INGRESS_UPSTREAM_BLOBS: http://garage:3900
      VEYQ_TENANT_INGRESS_UPSTREAM_ADMIN: http://admin:8080
    volumes:
      # THE reason this file exists. Without it every `up -d --force-recreate` regenerates the KEK, the
      # veyq_instance fingerprint reports configSecretState: MISMATCH, and the instance refuses member invites
      # and password resets with 503 mail_unavailable (ADR 0050 amendment, ADR 0055, ADR 0056 § Consequences).
      - veyq-config-secret:/var/lib/veyq
      # Routing config only — never a secret, never content (ADR 0063 § Consequences). Read-write here because
      # the app is the only writer; read-only on traefik, which only ever reads it.
      - veyq-traefik-dynamic:/etc/traefik/dynamic
    # MaxRAMPercentage in the image's ENTRYPOINT is a percentage of the CONTAINER limit; without one the JVM
    # sizes its heap off host RAM.
    mem_limit: ${VEYQ_MEM_LIMIT:-1g}
    healthcheck:
      # /api/setup: unauthenticated, served only once Flyway has migrated, and the first call every client
      # makes — the same probe scripts/run_web_e2e.py uses. This backend has no smallrye-health extension, so
      # there is no /q/health/ready to poll.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/setup"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # The Server-Owner administration surface (ADR 0065) — its own image, its own origin, and by default not
  # reachable from the internet at all.
  #
  # Two exposure modes, one image, chosen by whether ADMIN_DOMAIN is set. Unset (the DEFAULT): no router at all,
  # and the port below binds to 127.0.0.1, so the surface is reachable only from the host itself —
  # `ssh -L 8443:127.0.0.1:${ADMIN_PORT} the-host` and browse localhost. That is also what makes first-run setup
  # independent of DNS and TLS. Set: the app renders an own-domain router with its own certificate.
  #
  # The port is bound to 127.0.0.1 explicitly — the first `ports:` entry in this file besides Traefik's own.
  # A bare "${ADMIN_PORT}:8080" would publish on 0.0.0.0 and hand the whole internet the highest-privilege
  # surface this instance serves, which is the exact opposite of what extracting it was for. The container
  # side is 8080, not 80: the admin image runs unprivileged (uid 101, admin-web/Dockerfile) and cannot bind 80.
  admin:
    image: ${VEYQ_ADMIN_IMAGE:?set VEYQ_ADMIN_IMAGE in infra/.env, e.g. ghcr.io/raddatzk/veyq-admin:1.0@sha256:<digest> (infra/README.md, Verifying a release)}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      # Where nginx proxies /api/* — the app's ADMIN LISTENER on the compose network, never the public domain
      # and never its public port 8080, which 404s every Server-Owner operation (ADR 0065). Nothing else in this
      # file routes to 8090: the rendered app service points at VEYQ_TENANT_INGRESS_UPSTREAM_APP, and the listener
      # is not EXPOSEd. Resolved at REQUEST time, so this container starts and stays useful even while the app is
      # still migrating.
      BACKEND_URL: http://app:8090
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8080"

  # TLS is a PRECONDITION here, not a deployment preference. `veyq.session.cookie.secure=true` is the shipped
  # default, so over plain HTTP the refresh cookie is set and never sent back — "remember me" breaks silently.
  # And every invitation link is built as https://<domain>/tenant/accept#<token>, so an HTTP-only instance mails
  # links pointing at a scheme it does not answer.
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    restart: unless-stopped
    command:
      # The ONLY provider: the file the app renders (ADR 0063). No Docker provider, so no Docker socket — a `:ro`
      # mount of it restricts nothing about the API, and this container faces the internet. `watch` is what makes
      # a new tenant's domain live without restarting anything; the file is written by an atomic rename, so a
      # reload can never read half of it.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # :80 exists only for the ACME HTTP-01 challenge and to redirect everything else to :443.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${VEYQ_ACME_EMAIL:?set VEYQ_ACME_EMAIL in infra/.env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Point this at Let's Encrypt's staging directory while you are still testing a deployment. In production 5
      # failed validations lock a hostname out for an hour, and 50 issued certificates per registered domain per
      # week is the cap a burst of test tenants reaches (letsencrypt.org/docs/rate-limits). Staging certificates are
      # not browser-trusted: switch back before you hand the instance to anyone.
      - "--certificatesresolvers.letsencrypt.acme.caserver=${VEYQ_ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - veyq-acme:/acme
      # Read-only: the projector owns this file, and a proxy that could write it would be a second author of the
      # routing whose edits the next full regenerate silently discards.
      - veyq-traefik-dynamic:/etc/traefik/dynamic:ro

volumes:
  veyq-mariadb-data:
  veyq-garage-meta:
  veyq-garage-data:
  veyq-garage-snapshots:
  veyq-acme:
  # Leg (c). Small, and the difference between a restorable instance and one that boots into MISMATCH.
  veyq-config-secret:
  # The ingress projection (ADR 0063) — derived state, not durable: it is NOT part of a backup, because the
  # `tenant` table it is generated from is, and the app rewrites it in full at startup.
  veyq-traefik-dynamic:
