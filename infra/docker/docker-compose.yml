# Local dev database (uc.* slices). A persistent MariaDB so dev data survives a backend restart — closer to
# prod than the in-memory H2, which the test suite keeps using. Start it before `./gradlew quarkusDev`
# (`./gradlew infra:up` does, infra/README.md), or from the repository root:
#   docker compose -f infra/docker/docker-compose.yml up -d        (start)
#   docker compose -f infra/docker/docker-compose.yml down         (stop; data is kept in the named volume)
#   docker compose -f infra/docker/docker-compose.yml down -v      (stop AND wipe the data — fresh instance)

# The project name is a property of THIS FILE, not of the directory it sits in (ADR 0106 decision 2): the dev stack
# has been project `infra` since it was born, so its volumes are `infra_veyq-*` and its network `infra_default`.
# Derived from the directory instead, a move of this file would start the stack on empty volumes under another name.
# `scripts/run_web_e2e.py` reads the network's name from here.
name: infra

# Every port is published on 127.0.0.1 only. The credentials below are throwaways, and they are public with the
# repository: published on every interface (Compose's default), the database, the store and its admin API would
# answer anyone on the same network with them — measured 2026-10-26, all six ports open on the Mac's LAN address.
# Nothing needs another interface: the backend, Vite (which proxies `/blobs/`), the e2e orchestrators and an
# emulator (10.0.2.2 is the host's loopback) reach them on the host, and the containers that need the store or the
# database (the backup tool's rclone and mariadb-dump) join the compose network. `localhost` still works from
# Node and curl, which fall back from ::1 to 127.0.0.1 (measured).

services:
  mariadb:
    image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    container_name: veyq-mariadb
    restart: unless-stopped
    environment:
      # A data directory an older MariaDB wrote is upgraded on start: the image backs up the system tables into the data
      # directory and runs mariadb-upgrade (a major bump such as 11.4 -> 12.3 left them on the old layout otherwise).
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: veyq
      MARIADB_USER: veyq
      # Local throwaway only — matches application-dev.properties. Change both together for a non-default.
      MARIADB_PASSWORD: change-me
      MARIADB_ROOT_PASSWORD: change-me-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - veyq-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Bundled object store for media blobs (cr-0028/cr-0029, ADR 0013) — opt-in: `docker compose --profile s3
  # up -d`. That `up` leaves the store RUNNING BUT NOT USABLE: since ADR 0067 there is no init sidecar, and the
  # first backend start assigns the layout and creates the bucket/key/grant/CORS itself. Deliberately the same
  # shape as production, so the FRESH provisioning path runs on every clean dev cycle rather than only in a unit
  # test. The backend never streams bytes; it presigns short-TTL URLs the
  # client PUT/GETs directly. **Garage** (S3-compatible, AGPL, built for self-hosting — replaces the archived
  # MinIO). Exposed on :19000 for the backend e2e (`VEYQ_S3_E2E=1`, BlobBatchE2ETest); Traefik path-routes the
  # bucket (traefik-dev/blobs.yml) so a browser reaches presigned URLs **same-origin** (no CORS, ADR 0013 §4).
  # Throwaway creds only.
  garage:
    image: dxflrs/garage:v2.0.0@sha256:15b40e0dddd2e611aa746ff6f7c3bfe9f22735e4a2cc29e0abd89c268e9b79d9
    container_name: veyq-garage
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      # garage.toml holds no secrets, so both stacks can share it — these are the DOCUMENTED dev throwaways.
      GARAGE_RPC_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      GARAGE_ADMIN_TOKEN: "veyq-dev-admin-token"
    volumes:
      - "./garage.toml:/etc/garage.toml:ro"
      - veyq-garage-meta:/var/lib/garage/meta
      - veyq-garage-data:/var/lib/garage/data
      # metadata_snapshots_dir (garage.toml) — deliberately its OWN volume, not a path under meta/: a snapshot
      # written inside the metadata volume grows the very thing a volume-copy rollback copies.
      - veyq-garage-snapshots:/var/lib/garage/snapshots
    ports:
      - "127.0.0.1:19000:3900"   # S3 API — VEYQ_S3_ENDPOINT for the backend e2e; also the internal endpoint the backend stats against
      - "127.0.0.1:19003:3903"   # admin API

  # Reverse proxy so the bundled store is reachable same-origin (ADR 0013 §4). Routes only the bucket path, from
  # a static file: like production, the file provider is its only provider, so no container holds the Docker
  # socket. The Vite dev server proxies `/blobs/` itself, so nothing in the dev loop reads this route — a broken one
  # stays silent; `curl -sI http://localhost:18080/blobs/` answering from Garage is the check.
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    container_name: veyq-traefik
    profiles: ["s3"]
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:18080:80"     # same-origin entry: presigned URLs signed for host:18080, path /blobs/<obj> → Garage
    volumes:
      - "./traefik-dev:/etc/traefik/dynamic:ro"

  # --- Test mailbox for per-tenant SMTP (cr-email-smtp-transport, ADR 0048) — opt-in: `docker compose --profile
  # mail up -d`. A dev tenant points its mail settings at this (host `localhost`, port 11025, any username/
  # password) to smoke the real send path; the web UI + HTTP API on :18025 let you read what arrived. **Mailpit**
  # (MIT, actively maintained) — NOT the archived MailHog (root CLAUDE.md: no EOL deps). Nothing is stored across
  # restarts (in-memory), which is exactly what a throwaway test mailbox wants.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: veyq-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    environment:
      # Accept any AUTH over plain SMTP so a dev tenant's configured username/password is not a setup hurdle.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:11025:1025"   # SMTP — a tenant's mail settings point here (host localhost, port 11025)
      - "127.0.0.1:18025:8025"   # web UI + HTTP API — read delivered invites (http://localhost:18025)

volumes:
  veyq-mariadb-data:
  veyq-garage-meta:
  veyq-garage-data:
  veyq-garage-snapshots:
