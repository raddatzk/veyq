{{- if not .Values.secrets.existingSecret }}
# Rendered from the operator's values and from nothing else — the chart generates no secret (values.yaml, top).
# The schema has already refused a render that leaves one of these unset, so every key below carries a value
# of the shape the consumer needs.
apiVersion: v1
kind: Secret
metadata:
  name: veyq
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadbPassword: {{ .Values.secrets.mariadbPassword | quote }}
  mariadbRootPassword: {{ .Values.secrets.mariadbRootPassword | quote }}
  garageRpcSecret: {{ .Values.secrets.garageRpcSecret | quote }}
  garageAdminToken: {{ .Values.secrets.garageAdminToken | quote }}
  s3AccessKey: {{ .Values.secrets.s3AccessKey | quote }}
  s3SecretKey: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
