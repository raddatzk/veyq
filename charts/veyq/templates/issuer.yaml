{{- /*
The ACME opt-in (ingress.tls.acme; ADR 0064 § Decision, the TLS paragraph): the one thing the compose RECIPE
configures — Traefik's ACME resolver — translated as one namespaced cert-manager Issuer. The chart's half of the
cut; the sink's half is unchanged and still only stamps references, which `veyq.ingressAnnotations` points here.

Namespaced on purpose, never a ClusterIssuer: nothing this chart renders reaches beyond its namespace. cert-manager
itself is a precondition the operator meets, like the ingress controller — without its CRDs `helm install` fails
the whole release before creating anything ("ensure CRDs are installed first"), which is why there is no
`.Capabilities.APIVersions.Has` check: `helm template` and `helm lint` cannot see a cluster and would lose their
offline render to it.

The account key Secret is cert-manager's to create and keep, never a chart value — the chart generates nothing.
*/}}
{{- if (.Values.ingress.tls.acme | default dict).enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: veyq-acme
  labels:
    {{- include "veyq.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ required "ingress.tls.acme.server is required" .Values.ingress.tls.acme.server | quote }}
    email: {{ required "ingress.tls.acme.email is required" .Values.ingress.tls.acme.email | quote }}
    privateKeySecretRef:
      name: veyq-acme-account-key
    solvers:
      # HTTP-01 only: it works for any tenant domain with no DNS-provider credentials (a Secret this chart would
      # have to reference), and a wildcard is already `mode: shared`. Compose's resolver is HTTP-01 only too.
      - http01:
          ingress:
            {{- with .Values.ingress.className }}
            ingressClassName: {{ . | quote }}
            {{- else }}
            {}
            {{- end }}
{{- end }}
