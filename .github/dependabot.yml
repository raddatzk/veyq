version: 2

# Read by Dependabot since the first push (2026-11-05). Its first read refused the file, so no update ran: an update
# that belongs to a multi-ecosystem group may not carry `open-pull-requests-limit` ("should only be set on the
# associated multi-ecosystem group"); a group is one pull request per run anyway, so its members carry none. What is
# still marked "remembered" below has not been seen in a run.
#
# A major update never shares a pull request with minor and patch ones (owner, 2026-11-07): its first run grouped
# typescript 6→7, @types/node 22→26, vitest 4→5 and Stryker 9→10 with forty minor bumps into one red PR (#4), so none
# of the minors could land. Each code ecosystem therefore has its own group restricted to `update-types: ["minor",
# "patch"]`, and a major falls through it into a pull request of its own. Read from GitHub's "Dependabot options
# reference" (docs.github.com, 2026-11-07): `groups.<id>.update-types` takes `minor`, `patch`, `major`; "Any outdated
# dependencies that do not match a rule are updated in individual pull requests"; `schedule.interval` is required on
# every entry outside a multi-ecosystem group; `open-pull-requests-limit` defaults to 5; `ignore.update-types` takes
# `version-update:semver-major|minor|patch`; `commit-message.prefix` sets commit message AND pull request title, and
# `include: "scope"` follows it with the dependency type, `deps` or `deps-dev` — so a PR touching only dev
# dependencies reads `chore(deps-dev): …`, every other `chore(deps): …`. A colon is added after a prefix ending in a
# letter.
# The `images` group carries no `commit-message`: the docs say only that a multi-ecosystem group takes "assignees,
# labels, or other configuration options" — whether `commit-message` is one of them, and whether a member may carry it
# instead, they leave unsaid, and a key Dependabot refuses stops every update in this file (the header's first read).

multi-ecosystem-groups:
  # Third-party image pins (ADR 0057 §6). Every image is pinned `repo:tag@sha256:<index digest>`, so a new tag or a
  # re-pushed one reaches this repository only as one of these PRs — the explicit bump the pin trades silent
  # patches for. One `repo:tag` carries one digest everywhere (scripts/validate_image_pins.py), so a bump that
  # reaches only some of its sites is red until the rest follow. That is why this stays ONE group across ecosystems,
  # majors included.
  images:
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Berlin"

updates:
  # The pnpm workspace's one lockfile is at the root (src/web/, src/admin-web/, src/packages/crypto/ and tests/e2e/ are its
  # members, listed in pnpm-workspace.yaml), so this is the directory that reaches all four. Dependabot's "npm" ecosystem
  # is also its pnpm one (remembered, NOT read from dependabot-core: it reads pnpm-lock.yaml; whether it reads pnpm 12's
  # lockfile, which carries pnpm's own pin as a first YAML document, is unproven like the rest of this file). It bumps the openapi-generator-cli WRAPPER only: the generator
  # JAR it runs is chosen by `generator-cli.version` in src/web/ and src/admin-web/openapitools.json and pinned in
  # scripts/openapi_generator_jar.sha256, which no ecosystem here reads — that bump is by hand, at a release.
  # Weekly, Saturday 06:00 Europe/Berlin (owner 2026-11-07), and so is every entry here: the pull requests and their
  # Checks runs are ready on Saturday, so what is merged over the weekend is in the snapshot `publish.yml` cuts on Monday at
  # 03:17 UTC. Security updates follow Dependabot's alerts, not this schedule. The limit is 5 (the documented default,
  # spelled out): the minor/patch group is one PR, and each major beside it is one more — a limit of 1 would let a
  # single stuck major block the group.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # typescript-eslint does not support TS 7 (PR #4's CI: "Error: typescript-eslint does not support TS 7.0").
      # Lifted when a typescript-eslint release declares typescript 7 in its peer range.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # CI runs Node 22 (`node-version: "22"` in checks.yml); the types follow the runtime, not the newest Node. Lifted
      # together with that runtime bump, by hand in the same commit.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # The docs site is its own package with its own lockfile, deliberately outside the root workspace (site/package.json
  # says why), so the entry above never reads it (remembered, NOT read from dependabot-core: the file fetcher follows
  # the root's pnpm-workspace.yaml `packages`, and site/ is none of them). Without this entry its tree aged unseen — undici sat at an advisory version until an ORT run found it
  # (2026-10-30). Weekly in the root entry's slot. Its limit is 5 for the same reason as the root entry's.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      site:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Kept on the root's TypeScript major (PR #2 proposed 7 here too), so one TS major is checked repository-wide.
      # Lifted with the root entry's rule.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Remembered, NOT read from dependabot-core like the rest of this file: Dependabot does not regenerate
  # src/backend/gradle/verification-metadata.xml, so a version bump from this entry fails verification until the
  # metadata is regenerated by hand (src/backend/CLAUDE.md). A bump of the backend's openapi-generator alone is red
  # either way: scripts/validate_build_input_pins.py holds it to the clients' version — so it is ignored here (inside
  # the group it would turn every minor/patch PR red); it moves by hand, with the clients' openapitools.json, at a release.
  # (Gradle's `dependency-name` is `groupId:artifactId`, read from the options reference 2026-11-07.)
  # One directory reaches every module (read from dependabot-core, main, 2026-10-20): the Gradle file fetcher reads
  # src/backend/settings.gradle.kts's `include(":core")`-style calls (SettingsFileParser#subproject_paths, Kotlin DSL
  # parentheses matched, `:apps:memories` → apps/memories) and fetches each subproject's build file; it adds buildSrc
  # when the directory exists, and gradle/libs.versions.toml at this entry's root. So no `directories:` list.
  # Weekly in the root npm entry's slot, with a limit of 5 for the same reason.
  - package-ecosystem: "gradle"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "org.openapitools:openapi-generator"

  # `docker` reads the files named Dockerfile/Containerfile in each directory (not recursively): each image's beside
  # the code it ships — the app image's in src/backend/, the admin image's in src/admin-web/, the tools image's in
  # src/tools/.
  - package-ecosystem: "docker"
    directories:
      - "/src/backend"
      - "/src/admin-web"
      - "/src/tools"
    patterns:
      - "*"
    multi-ecosystem-group: "images"
    # src/tools/Dockerfile copies the client from the server's own image (`FROM mariadb:…`): the same LTS bound as the
    # compose entry below, or this entry proposes the rolling releases the compose one holds back.
    ignore:
      - dependency-name: "mariadb"
        versions:
          - ">= 12.4"

  # `docker-compose` matches `(docker-)?compose(-\w+)?(.<suffix>)?.ya?ml`, so both infra/docker/docker-compose.yml
  # and the release recipe infra/docker/docker-compose.prod.yml.
  # MariaDB on its LTS line only (owner 2026-11-07: "only LTS makes sense"): 12.3 is the LTS, and the releases after
  # it are rolling ones (13.0's community support ends with 2026), so nothing from 12.4 on is proposed. 12.3's own
  # digest moves still arrive. The next LTS is moved to by hand, the bound below with it — a database major is a
  # migration step of its own, never one bump in a group. Whether a member of a multi-ecosystem group may carry
  # `ignore` the docs leave unsaid (remembered from the options reference: `ignore` is a per-entry key); the first run
  # after this edit proves it was accepted.
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    patterns:
      - "*"
    multi-ecosystem-group: "images"
    ignore:
      - dependency-name: "mariadb"
        versions:
          - ">= 12.4"

  # Reached by no ecosystem: the chart's mariadb and garage pins (infra/kubernetes/charts/veyq/values.yaml). There was
  # a `helm` entry, and it could never update them: Dependabot's helm updater skips every digest-pinned image on
  # purpose ("digest-pinned images resolve by digest, so a tag-only bump would silently keep the old image",
  # helm/lib/dependabot/helm/file_updater/image_updater.rb, read on main 2026-11-07), then fails "Expected content to
  # change!" — red on every run since 2026-11-05. The `images` group's pull request never appeared either (the compose
  # job logged "created"), most likely because of that failure — inferred, not shown. Removed 2026-11-07. Each pin shares its `repo:tag` with
  # the compose files, so the group's pull request is red at validate_image_pins.py until the chart's line follows, by
  # hand, in that same pull request.
  # Reached by no ecosystem either: the backup tool's `*_IMAGE` constants in src/tools/instance_backup.py. Its mariadb
  # pin shares a `repo:tag` with the compose files, so a bump there turns validate_image_pins.py red until the constant
  # follows by hand; its rclone pin appears nowhere else and is bumped by hand, deliberately, at a release.

  # Every action is pinned `owner/repo@<commit sha> # v<major>.<minor>.<patch>` (scripts/validate_action_pins.py).
  # Re-read 2026-10-17 (dependabot-core main de71a59): a SHA pin is bumped to the commit of the newest version tag
  # when a version tag sits on the pinned SHA (update_checker.rb `latest_commit_sha`, via git_commit_checker.rb
  # `local_tag_for_pinned_sha`). The comment must be the FULL version: Dependabot rewrites it only if it ends with a
  # tag that still points at the OLD SHA (github_actions/.../workflow_updater/version_commenter.rb,
  # `previous_version_from_comment`, via `most_specific_version_tags_for_sha`); otherwise it keeps the comment
  # verbatim. A floating major (`# v4`) has moved off the pinned SHA by the time a bump arrives, so it would stay
  # standing beside a v7 SHA; a full-version tag never moves, so it is always rewritten.
  # Reached by no ecosystem: an action's `with:` inputs. checks.yml's `cosign-release` (the cosign the publish signs
  # with) is bumped by hand; scripts/validate_release_identity.py holds it to src/tools/veyqctl.py's COSIGN_MIN_VERSION.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1

    commit-message:
      prefix: "chore"
      include: "scope"
