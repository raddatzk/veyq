version: 2

# Read by Dependabot since the first push (2026-11-05). Its first read refused the file, so no update ran: an update
# that belongs to a multi-ecosystem group may not carry `open-pull-requests-limit` ("should only be set on the
# associated multi-ecosystem group"); a group is one pull request per run anyway, so its members carry none. What is
# still marked "remembered" below has not been seen in a run.

multi-ecosystem-groups:
  app-runtime:
    schedule:
      interval: "daily"
  # Third-party image pins (ADR 0057 §6). Every image is pinned `repo:tag@sha256:<index digest>`, so a new tag or a
  # re-pushed one reaches this repository only as one of these PRs — the explicit bump the pin trades silent
  # patches for. One `repo:tag` carries one digest everywhere (scripts/validate_image_pins.py), so a bump that
  # reaches only some of its sites is red until the rest follow.
  images:
    schedule:
      interval: "weekly"

updates:
  # The pnpm workspace's one lockfile is at the root (src/web/, src/admin-web/, src/packages/crypto/ and tests/e2e/ are its
  # members, listed in pnpm-workspace.yaml), so this is the directory that reaches all four. Dependabot's "npm" ecosystem
  # is also its pnpm one (remembered, NOT read from dependabot-core: it reads pnpm-lock.yaml; whether it reads pnpm 12's
  # lockfile, which carries pnpm's own pin as a first YAML document, is unproven like the rest of this file). It bumps the openapi-generator-cli WRAPPER only: the generator
  # JAR it runs is chosen by `generator-cli.version` in src/web/ and src/admin-web/openapitools.json and pinned in
  # scripts/openapi_generator_jar.sha256, which no ecosystem here reads — that bump is by hand, at a release.
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "app-runtime"

  # The docs site is its own package with its own lockfile, deliberately outside the root workspace (site/package.json
  # says why), so the entry above never reads it (remembered, NOT read from dependabot-core: the file fetcher follows
  # the root's pnpm-workspace.yaml `packages`, and site/ is none of them). Without this entry its tree aged unseen — undici sat at an advisory version until an ORT run found it
  # (2026-10-30). Its own group and a weekly schedule rather than app-runtime's daily one: the site ships nothing in an
  # image, only the GitHub Pages build.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Remembered, NOT read from dependabot-core like the rest of this file: Dependabot does not regenerate
  # src/backend/gradle/verification-metadata.xml, so a version bump from this entry fails verification until the
  # metadata is regenerated by hand (src/backend/CLAUDE.md). A bump of the backend's openapi-generator alone is red
  # either way: scripts/validate_build_input_pins.py holds it to the clients' version.
  # One directory reaches every module (read from dependabot-core, main, 2026-10-20): the Gradle file fetcher reads
  # src/backend/settings.gradle.kts's `include(":core")`-style calls (SettingsFileParser#subproject_paths, Kotlin DSL
  # parentheses matched, `:apps:memories` → apps/memories) and fetches each subproject's build file; it adds buildSrc
  # when the directory exists, and gradle/libs.versions.toml at this entry's root. So no `directories:` list.
  - package-ecosystem: "gradle"
    directory: "/src/backend"
    patterns:
      - "*"
    multi-ecosystem-group: "app-runtime"

  # `docker` reads the files named Dockerfile/Containerfile in each directory (not recursively): each image's beside
  # the code it ships — the app image's in src/backend/, the admin image's in src/admin-web/, the tools image's in
  # src/tools/.
  - package-ecosystem: "docker"
    directories:
      - "/src/backend"
      - "/src/admin-web"
      - "/src/tools"
    patterns:
      - "*"
    multi-ecosystem-group: "images"

  # `docker-compose` matches `(docker-)?compose(-\w+)?(.<suffix>)?.ya?ml`, so both infra/docker/docker-compose.yml
  # and the release recipe infra/docker/docker-compose.prod.yml.
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    patterns:
      - "*"
    multi-ecosystem-group: "images"

  # `helm` reads Chart.yaml dependencies (the chart has none) AND every `image:` string in values*.yaml — the
  # chart's mariadb and garage pins. The ci/ values files sit one directory down and name no third-party image.
  - package-ecosystem: "helm"
    directory: "/infra/kubernetes/charts/veyq"
    patterns:
      - "*"
    multi-ecosystem-group: "images"

  # Reached by no ecosystem: the backup tool's `*_IMAGE` constants in src/tools/instance_backup.py. Its mariadb pin
  # shares a `repo:tag` with the compose files, so a bump there turns validate_image_pins.py red until the constant
  # follows by hand; its rclone pin appears nowhere else and is bumped by hand, deliberately, at a release.

  # Every action is pinned `owner/repo@<commit sha> # v<major>.<minor>.<patch>` (scripts/validate_action_pins.py).
  # Re-read 2026-10-17 (dependabot-core main de71a59): a SHA pin is bumped to the commit of the newest version tag
  # when a version tag sits on the pinned SHA (update_checker.rb `latest_commit_sha`, via git_commit_checker.rb
  # `local_tag_for_pinned_sha`). The comment must be the FULL version: Dependabot rewrites it only if it ends with a
  # tag that still points at the OLD SHA (github_actions/.../workflow_updater/version_commenter.rb,
  # `previous_version_from_comment`, via `most_specific_version_tags_for_sha`); otherwise it keeps the comment
  # verbatim. A floating major (`# v4`) has moved off the pinned SHA by the time a bump arrives, so it would stay
  # standing beside a v7 SHA; a full-version tag never moves, so it is always rewritten.
  # Reached by no ecosystem: an action's `with:` inputs. ci.yml's `cosign-release` (the cosign the publish signs
  # with) is bumped by hand; scripts/validate_release_identity.py holds it to src/tools/veyqctl.py's COSIGN_MIN_VERSION.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
