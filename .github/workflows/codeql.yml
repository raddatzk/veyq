# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '21 16 * * 6'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        if: github.event_name != 'schedule'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            actions:
              - '.github/workflows/codeql.yml'
              - '.github/**'
            # contracts/api/** in both: the backend's interfaces and the web clients are generated from it at build
            # time, so a spec change is a change to the code CodeQL analyzes.
            java-kotlin:
              - '.github/workflows/codeql.yml'
              - 'src/backend/**'
              - 'contracts/api/**'
            javascript-typescript:
              - '.github/workflows/codeql.yml'
              - 'src/web/**'
              - 'contracts/api/**'
              - 'site/**'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.tsx'
            python:
              - '.github/workflows/codeql.yml'
              - '**/*.py'

      # The weekly scheduled run always analyzes everything so alerts stay
      # current even for code that has not changed recently.
      - name: Resolve languages to analyze
        id: languages
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'languages=["actions","java-kotlin","javascript-typescript","python"]' >> "$GITHUB_OUTPUT"
          else
            echo "languages=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The backend's Gradle toolchain asks for its one Java major (src/backend/gradle/libs.versions.toml's `java`,
      # ADR 0119) and resolves no JDK of its own, so the build below needs it installed — the same setup pipeline.yml's jobs run.
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate the Gradle wrapper JAR
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # java-kotlin is built by hand (the step below): `none` extracts Java only, and the backend is Kotlin; autobuild
          # takes the repository root's Gradle build, which is the dev launcher, and fails there on `clean` (first run,
          # 2026-11-05: "Task 'clean' not found in root project 'veyq'").
          build-mode: ${{ (matrix.language == 'java-kotlin') && 'manual' || 'none' }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # Compiles every module's main and test sources, the code generated from contracts/api/ included, under CodeQL's
      # tracer. The Kotlin compiler runs inside the build's JVM, so the tracer sees it; dependency verification stays
      # on (autobuild would have switched it off). No build cache is configured, so nothing is restored instead of
      # compiled.
      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: src/backend
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process testClasses

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
