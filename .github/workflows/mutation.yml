name: Mutation

# The assertion-strength gates — the trust chain's last link (ADR 0045). validate_coverage.py proves a test REF
# resolves; these prove the tests' ASSERTIONS pin the output. Two gates, one workflow, each run only when a change
# touches its scope (the `changes` job's filters), so a backend-only change runs the backend gate alone:
#   - `crypto` (Stryker): the curated crypto logic tier — src/packages/crypto and the six files that stayed in
#     src/web/ (src/web/stryker.mutate.json; the argon*.worker wiring layer is out, ADR 0045 §3). A `seal(k,s)=s`
#     that satisfies a weak test dies here.
#   - `backend` (PIT): only the curated pure policies (src/backend/core/pitest.scope.json), never the dumb stores nor
#     the @QuarkusTest slices (ADR 0045 §2) — a rotate that re-grants a pendingConsent proposal, a cascade that
#     soft-deletes shared content, a token-bucket refill that discards its sub-token remainder each die here. The
#     build's `mutationThreshold` is the gate; the meta-check is its per-glob sibling.
# Until 2026-11-07 they were two workflows, `Mutation (crypto)` and `Mutation (backend)` (cr-workflows-split-pipeline-
# callers).
#
# Cost control is each tool's INCREMENTAL cache (ADR 0045 §4), NOT a git `--since` flag: StrykerJS OSS has no native
# git-diff scoping (that is arcmutate, the commercial tool §1 excludes), and PIT's history file works the same way.
# Both are content-based and re-test a mutant when its code OR its covering tests changed — so a weakened *assertion*
# (a test edit, no source change) is caught, which a file-level git-diff scope would have missed.
#
# Not in the pipeline's `frontend` or `backend` job: mutation is heavier and path-gated, kept off every push's critical
# path (CLAUDE.md / ADR 0045 §4 — `pnpm run check` stays lint+typecheck+unit+build, `./gradlew check` compile + slices).
on:
  # The union of the two gates' scopes — source AND tests: a change to either can move a score (a weakened assertion
  # lives in a *.test.ts or a *Test.kt), so either must start this workflow; the `changes` job then picks the gate.
  # The backend half mirrors src/backend/core/pitest.scope.json one-for-one, and scripts/validate_mutation_trigger_paths.py
  # KEEPS it there, in this list AND in the `backend` filter below — because editing the manifest alone does not:
  # `b15807a7` added ShareAccessPolicy and MembershipPolicy to the scope and left the filter behind, so a PR touching
  # only those never ran the gate (inbox #114). Adding a policy means editing all three, and the guard is what says so.
  pull_request:
    branches: [main]
    paths:
      - "src/packages/crypto/**"
      - "src/web/src/**"
      - "src/web/stryker.config.mjs"
      - "src/web/stryker.mutate.json"
      - "src/web/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/mutation_meta_check.py"
      - "scripts/mutation_meta_check_selftest.py"
      - ".github/workflows/mutation.yml"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucket.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/http/ClientAddress.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucketTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/http/ClientAddressTest.kt"
      - "src/backend/core/pitest.scope.json"
      - "src/backend/core/build.gradle.kts"
      - "scripts/mutation_meta_check_backend.py"
  # Also on main. A PR gates before the merge, so this is a backstop, not the primary gate: it catches what the PR job
  # structurally cannot — a direct push, an admin/force merge, or a green PR that lands on a main which has meanwhile
  # drifted. The same list is repeated because Actions supports no YAML anchors; the guard checks the two blocks and
  # the filters SEPARATELY, not as a union — hand-duplicated lists drift apart, and a backstop that has quietly
  # stopped covering a class is worse than none.
  push:
    branches: [main]
    paths:
      - "src/packages/crypto/**"
      - "src/web/src/**"
      - "src/web/stryker.config.mjs"
      - "src/web/stryker.mutate.json"
      - "src/web/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/mutation_meta_check.py"
      - "scripts/mutation_meta_check_selftest.py"
      - ".github/workflows/mutation.yml"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucket.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicy.kt"
      - "src/backend/core/src/main/kotlin/me/raddatz/veyq/core/http/ClientAddress.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucketTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicyTest.kt"
      - "src/backend/core/src/test/kotlin/me/raddatz/veyq/core/http/ClientAddressTest.kt"
      - "src/backend/core/pitest.scope.json"
      - "src/backend/core/build.gradle.kts"
      - "scripts/mutation_meta_check_backend.py"
  # Both gates, whatever changed.
  workflow_dispatch:

# One run per PR (or per main ref); a new push cancels the last (a mutation run is minutes, not seconds).
concurrency:
  group: veyq-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which gate this push or pull request touched. A dispatch has no diff to read and runs both, so the filter is not
  # asked there. Each filter is its gate's scope; validate_mutation_trigger_paths.py holds every entry to both trigger
  # lists, and the PIT scope to the `backend` filter.
  changes:
    name: Detect changed mutation scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crypto: ${{ steps.filter.outputs.crypto }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            crypto:
              - 'src/packages/crypto/**'
              - 'src/web/src/**'
              - 'src/web/stryker.config.mjs'
              - 'src/web/stryker.mutate.json'
              - 'src/web/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/mutation_meta_check.py'
              - 'scripts/mutation_meta_check_selftest.py'
              - '.github/workflows/mutation.yml'
            backend:
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucket.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicy.kt'
              - 'src/backend/core/src/main/kotlin/me/raddatz/veyq/core/http/ClientAddress.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/RotationPolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/admin/tenant/RemovalPolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/ratelimit/TokenBucketTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ShareAccessPolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/spaces/scope/MembershipPolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/sharing/ReissuePolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/tasks/CompromiseRotationPolicyTest.kt'
              - 'src/backend/core/src/test/kotlin/me/raddatz/veyq/core/http/ClientAddressTest.kt'
              - 'src/backend/core/pitest.scope.json'
              - 'src/backend/core/build.gradle.kts'
              - 'scripts/mutation_meta_check_backend.py'
              - 'scripts/mutation_meta_check_selftest.py'
              - '.github/workflows/mutation.yml'

  crypto:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.crypto == 'true'
    name: Crypto mutation gate
    # 45 min: both gates run in this one job, and a run without the incremental cache is a full one - measured locally
    # under load (2026-11-05) at 3.6 min for the shared crypto package and 16.7 min for web's six files.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The meta-check diffs against the PR base to see whether a mutate-scope file changed.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1

      # The incremental report is the CI cache (ADR 0045 §4): Stryker re-tests only mutants whose code or
      # covering tests changed since the cached run. Restored best-effort (restore-keys), a fresh copy saved
      # each run so the next PR starts warm.
      - name: Restore Stryker incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/web/reports/stryker-incremental.json
            src/packages/crypto/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      - name: Install dependencies
        # From the workspace root: one `pnpm install` links `@veyq/crypto` into src/web/ and runs each workspace's
        # `prepare` -> `generate:api`, so the generated API client the full dry-run suite imports exists
        # (mirrors the pipeline's frontend job). openapi-generator needs Java, pre-installed on ubuntu-latest.
        # The registry half is asked once per commit, by the pipeline's `frontend` job.
        run: python3 scripts/pnpm_install_no_deprecated.py --skip-registry-check

      # TWO gates, not one, since the suite was split across packages (cr-admin-web-extraction, ADR 0065).
      # Stryker's test runner is the project's own vitest and neither project collects the other's suites, so
      # each manifest must be mutated where its killing tests live — a single run across the boundary would
      # report a green score over uncovered files, the exact failure the meta-check below exists to catch.
      - name: "Run shared-crypto mutation gate (scope: stryker.mutate.json)"
        working-directory: src/packages/crypto
        # Full scope, incremental-accelerated. stryker.config.mjs breaks the build below the calibrated break
        # threshold — that is the gate.
        run: pnpm run mutation

      - name: Run web crypto-logic mutation gate (the six files that stayed in src/web/)
        working-directory: src/web
        run: pnpm run mutation

      - name: Meta-check selftest (the total-vs-per-glob asymmetry is as documented)
        # Pins the two meta-checks' asymmetry (inbox #109) with fabricated fixtures — no real report needed, so
        # it runs regardless of what this PR changed. If the check logic rots, this reds before the real check.
        run: python3 scripts/mutation_meta_check_selftest.py

      - name: Diff-aware meta-check (mutants > 0 when the mutate scope changed)
        # ADR 0045 §4: a run that mutates nothing yet reports 100% is a claim nothing backs. When the diff
        # intersects the mutate scope, the report must carry > 0 mutants — catches a mis-scoped glob (e.g. a
        # renamed v1.ts the manifest missed) that would otherwise pass green with nothing measured.
        #
        # The base is per-event: a PR diffs against its target branch, a main push against the commit it advanced
        # from. workflow_dispatch has no base at all, and a first/force push reports an all-zero `before` — in
        # both cases there is no diff to scope against, so the check has nothing to assert and says so.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "meta-check: no usable diff base for a ${{ github.event_name }} event — nothing to assert."
            exit 0
          fi
          python3 scripts/mutation_meta_check.py --base "$BASE"

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    name: Backend mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The incremental history is the CI cache (ADR 0045 §4): PIT re-tests only mutants whose code or covering
      # tests changed since the cached run. Restored best-effort (restore-keys), a fresh copy saved each run so the
      # next PR starts warm. A missing file on a cold run is fine — PIT builds it from scratch.
      - name: Restore PIT incremental history
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # :core owns PIT (cr-platform-gradle-modules step 6), so the history lives in its build directory; a stale
          # path here is no error — PIT would silently run cold every time.
          path: src/backend/core/build/pitest/history.bin
          key: pit-incremental-${{ github.sha }}
          restore-keys: |
            pit-incremental-

      - name: Run backend mutation gate
        working-directory: src/backend
        # core/build.gradle.kts breaks the build below the calibrated mutationThreshold (95) — that is the gate.
        run: ./gradlew --no-daemon pitest

      - name: Meta-check selftest (the total-vs-per-glob asymmetry is as documented)
        # Pins the two meta-checks' asymmetry (inbox #109) with fabricated fixtures — no real report needed. If
        # the check logic rots, this reds before the real check below.
        run: python3 scripts/mutation_meta_check_selftest.py

      - name: Per-glob meta-check (every scope glob mutated something)
        # ADR 0045 §4: a scope glob that matches nothing yet leaves the build green (its siblings carry the run,
        # so failWhenNoMutations stays silent) is a claim nothing backs — a renamed class the manifest missed.
        # Diff-free: the invariant holds on every run, not only when a PR touches the scope.
        run: python3 scripts/mutation_meta_check_backend.py
