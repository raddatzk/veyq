name: CI

# The one pipeline per commit (ADR 0091 decision 2): the guards, the surface checks, the races, the API end-to-end
# run and the image build start together, and the snapshot waits on every one of them. Until
# cr-one-pipeline-per-commit phase 2 this was two workflows — this one, and `container.yml`, whose `test` ran the
# surface checks a second time and whose `build` waited for that second copy. `container.yml` was folded in here.
#
# Every green push to `main` or `release/<major>.x` publishes its SNAPSHOT (ADR 0091 decision 5): the images on exactly
# the digests lane L1 installed, as `<major>.<minor>-SNAPSHOT` and `sha-<commit>`, the chart, a signature, an
# attestation per lane and architecture, and the git tag `snapshot-<major>.<minor>`. A snapshot is written once and
# never replaced. A dispatch does the same, by hand, for a commit that has none (a run superseded while pending, a
# docs-only tip). A pull request (Dependabot's included) and a local run (scripts/run_pipeline.py) build and test the
# same and write nothing: the `version` job's `kind` is `none` for them, and every write in this file is gated on it.
#
# This file signs SNAPSHOTS. Keyless signing names the workflow that signed, so a snapshot's identity is
# `.github/workflows/ci.yml` on `main` or `release/<major>.x`; a release is a promotion of a snapshot, signed by another
# workflow, `.github/workflows/release.yml` (ADR 0091 decision 5's promotion, not built yet), so that
# `cosign verify` with the release identity — site/src/content/docs/run/verify-a-release.md, `veyqctl` — answers
# whether a digest is a release. Renaming this file changes the snapshot identity; scripts/validate_release_identity.py
# holds the release identity to rejecting it.
#
# A tag is deliberately NOT a trigger. This pipeline CREATES `snapshot-<major>.<minor>`, with `GITHUB_TOKEN`, which
# starts no workflow anyway — a trigger on it could only ever re-run a commit whose snapshot exists, which the
# `assert-snapshot-unpublished` step refuses by design.
#
# Docs are ignored *here* on purpose: a doc change cannot break a surface check or an image. The guards that do
# validate docs run in trust-chain.yml, which is unfiltered (and in `guards` below, for every commit this file runs on).
on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  pull_request:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  # A snapshot by hand, exactly as a push makes one; no inputs, because there is no other kind any more.
  workflow_dispatch:

# One group per ref, for every event: two runs of one branch publish in the order they were started, so the write-once
# refusal sees the earlier one's names. GitHub keeps one run pending per group and cancels an older pending one, so a
# commit superseded while it waited gets no snapshot — the next one does.
concurrency:
  group: ${{ format('veyq-ci-{0}', github.ref) }}
  cancel-in-progress: false

# Helm for the `chart` job and the chart packaging in `snapshot`: the official release tarball, checked against this
# SHA-256 before it runs — the shape ADR 0057 §6 uses for the OpenAPI generator JAR, and no setup action. Measured
# 2026-10-14: get.helm.sh's helm-v4.0.1-linux-amd64.tar.gz.sha256sum, the tarball's own hash and the checksum in the
# GitHub release notes of helm/helm v4.0.1 all agree. Bumping it is part of cutting a release.
env:
  HELM_VERSION: v4.0.1
  HELM_SHA256: e0365548f01ed52a58a1181ad310b604a3244f59257425bb1739499372bdff60

# Least-privilege default; each job widens only what it needs (see per-job permissions blocks).
permissions:
  contents: read

jobs:
  guards:
    name: Trust-chain guards (the product guards)
    # The pipeline's own run of the guards, so `snapshot` can wait on them (ADR 0091 decision 2). trust-chain.yml runs
    # the same glob unfiltered, because a docs-only commit is validated there and nowhere else; the overlap is these
    # cheap guards, about a minute and a half. `validate_guard_gaps.py` is not run here: it tests the guards, not the
    # commit, and is its own stage (ADR 0091 decisions 1 and 4) — trust-chain.yml's `guard-gaps` job runs it when a
    # guard changes, and nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The glob is the mechanism, as in trust-chain.yml: a hand-written list is green on the day a new guard lands
      # and silently never runs it. nullglob and the count make "validated nothing" a red build, not a green one.
      - name: Validate the product guards
        run: |
          shopt -s nullglob
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          count=0
          for f in scripts/validate_*.py; do
            if [ "$f" = "scripts/validate_guard_gaps.py" ]; then
              continue
            fi
            echo "--- $f"
            .venv/bin/python "$f"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no scripts/validate_*.py found — the guards validated nothing"
            exit 1
          fi
          echo "$count guards green"

      # The snapshot's pure decisions (the asset-set hash, the lane records and predicates, the write-once verdicts),
      # offline: the `snapshot` job acts on them only after every stage, so they are proven here, before it.
      - name: Snapshot self-test
        run: .venv/bin/python scripts/snapshot_selftest.py

      # The promotion's decisions (scripts/promote.py, run by release.yml): proven on every commit that could change
      # them, not first on the day of a release.
      - name: Promotion self-test
        run: .venv/bin/python scripts/promote_selftest.py

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    # Sized for a cold Gradle cache, which is no first-run accident: setup-java's `cache: gradle` keys on the build
    # files' hash with no restore key and saves only from a green job, so every dependency bump starts cold. The first
    # CI run (2026-11-05, cold, 4 vCPU) was cancelled at the old 15 with `:core:test` 6 min in: 5.5 min of dependency
    # resolution and buildSrc before the first project task, 2 min of compiling, the tests from minute 7.7; the whole
    # check is estimated at 18–21 min. The measurement behind the value is the stage map's (how-veyq-is-tested.md).
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run backend checks
        working-directory: src/backend
        run: ./gradlew --no-daemon check

  backend-races:
    name: Backend races on MariaDB
    # The race classes `./gradlew check` runs on H2, run again on the production engine. H2 cannot show what MariaDB
    # does under overlap: on 2026-10-03 three races green on H2 were red there (ADR 0078). The runner derives the
    # race classes from the code and starts its own throwaway MariaDB from the image infra/docker/docker-compose.yml pins
    # (tag + digest), so the pin keeps one home — which is why this job declares no `services:`, as web-e2e does not.
    runs-on: ubuntu-latest
    # Cold, as `backend` above. The first CI run (2026-11-05) was cancelled at the old 10 inside the last of its four
    # Gradle runs, `:core`'s; the three before it were green. The job is estimated at 13–17 min cold.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the race classes on MariaDB
        run: python3 scripts/run_backend_races_on_mariadb.py

  frontend:
    name: Frontend checks (crypto, web, admin-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1

      # One install for the whole workspace (a root `pnpm install` links `@veyq/crypto` into src/web/), then each
      # package proves ITSELF. The shared crypto package is checked first and separately on purpose: it is the
      # one place a defect would be a defect in BOTH surfaces, so its own suite failing must not read as a
      # web failure.
      - name: Install dependencies
        # The ONE gated install that asks the registry whether a locked package was deprecated since the lock was
        # written (the arm64 image's bindings among them); every other gated install of this lockfile passes --skip-registry-check
        # (inbox #312). The images install the same lockfile, and `snapshot` needs this job, so nothing built from a
        # lockfile this did not pass is published. validate_pnpm_installs_gated.py holds both.
        run: python3 scripts/pnpm_install_no_deprecated.py

      - name: Run shared crypto checks
        working-directory: src/packages/crypto
        run: pnpm run check

      - name: Run frontend checks
        working-directory: src/web
        run: pnpm run check

      # Gated for the same reason the app is: the image build compiles but runs no tests, so without this a broken
      # admin surface could still be published beside a green app image (ADR 0065 — one release, its images).
      - name: Run admin surface checks
        working-directory: src/admin-web
        run: pnpm run check

      # Lane L1's browser suite runs only in `stack`, so its lint, its types, its spec list, its specs' out-of-tree
      # fixture paths (`new URL('../../../../../…', import.meta.url)`) and its split into legs (`shards.test.mjs`) are
      # checked here, on every commit.
      - name: Run browser suite checks
        working-directory: tests/e2e
        run: pnpm run check

  chart:
    name: Chart checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history and every tag (fetch-depth: 0 fetches both): the chart upgrade check below reads its
      # predecessor's chart out of git (HEAD^1, or the last release tag once there is one), and its second run the
      # major entry's, which may be a tag on a `release/<old>.x` branch that this commit does not reach.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The pinned Helm (workflow-level env above): verified against the pin BEFORE it is extracted, so a
      # tarball that does not match never runs. The same step installs it here and in `snapshot`. On a host that is
      # not GitHub's runner (scripts/run_pipeline.py, whose `runner.environment` is `local`) the next step stands in.
      - name: Install Helm (pinned tarball)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          tarball="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "https://get.helm.sh/${tarball}"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" linux-amd64/helm
          echo "${RUNNER_TEMP}/linux-amd64" >> "$GITHUB_PATH"

      # Never runs on GitHub. Elsewhere the host's own Helm is used, and it must at least be the pinned version (its
      # bytes are the host's package manager's, not the hash above).
      - name: Check the host's Helm is the pinned version
        if: runner.environment != 'github-hosted'
        run: |
          found="$(helm version --template '{{.Version}}')"
          if [ "$found" != "$HELM_VERSION" ]; then
            echo "the host's Helm is ${found}, the workflow pins ${HELM_VERSION}" >&2
            exit 1
          fi

      # The chart's rendered-manifest invariants (ADR 0064). It needs `helm`, which is why it sits outside the
      # buildless `validate_*` glob of `guards` and trust-chain.yml and runs here, as its own surface check.
      - name: Chart checks
        run: |
          python3 -m venv "${RUNNER_TEMP}/chart-venv"
          "${RUNNER_TEMP}/chart-venv/bin/pip" install --quiet pyyaml
          "${RUNNER_TEMP}/chart-venv/bin/python" scripts/chart_meta_check.py

      # A `helm upgrade` from the upgrade proof's predecessor's chart to this one, checked on rendered manifests
      # (ADR 0064 § Decision, the chart-upgrade check): immutable fields, claims that would go, values an operator
      # already has. Information while scripts/applied_migrations.sha256 says `release: none`, red from the first
      # release - the script's own verdict, so this step carries no switch of its own.
      - name: Chart upgrade check
        run: |
          "${RUNNER_TEMP}/chart-venv/bin/python" scripts/chart_upgrade_check_selftest.py
          "${RUNNER_TEMP}/chart-venv/bin/python" scripts/chart_upgrade_check.py

      # The same check from the release's major entry (ADR 0085 decision 10): the newest release of the previous major
      # among every tag, which the tools image bakes and its gate admits alone. The script resolves it through the
      # upgrade proof's derivation and exits 0, saying why, when there is none or it is the default predecessor above.
      - name: Chart upgrade check from the major entry
        run: |
          "${RUNNER_TEMP}/chart-venv/bin/python" scripts/chart_upgrade_check.py --upgrade-major-entry

  web-e2e:
    name: Web E2E (live backend)
    # The only end-to-end coverage any CI run executes: web's *.e2e.test.ts drive real crypto against a real
    # backend and a real object store. They are gated on VEYQ_E2E, which nothing but this job sets — so a test
    # that is skipped here makes no coverage claim at all (ADR 0040), and four coverage refs depend on this job
    # staying green. scripts/run_web_e2e.py supplies the whole world itself: it brings up the bundled compose
    # stack (MariaDB + Garage), then per e2e file gives it its own database and a fresh %e2e backend boot. That
    # is why this job declares no `services:` and no `env:` — adding either would split the truth in two.
    # 40 min: measured on GitHub (2026-11-05) the suites take 14.2 min green and 20.7 min with two red, and the jar and
    # install before them 3.5 min warm and 6.7 min after a change to the build files emptied the Gradle cache - one
    # job took 27.5 of the former 30.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: scripts/upgrade_proof_selftest.py finds the commit before the code surfaces moved under
          # src/ (ADR 0106) in it, and a shallow checkout holds HEAD alone (the second GitHub run, 2026-11-05: "no
          # commit carries web/package.json").
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1

      # Build the runnable fast-jar ONCE; the orchestrator boots it again per e2e file, because every suite
      # cold-births its own Server Owner and asserts setupRequired===true, and an instance has one.
      #
      # Each boot gets its own MariaDB DATABASE, not a fresh in-memory DB — this comment used to claim the
      # latter and it does not work: quarkus.datasource.db-kind is a build-time property baked at augmentation
      # under %prod, so a runtime QUARKUS_DATASOURCE_DB_KIND=h2 is ignored and the MariaDB driver rejects the
      # H2 URL. `CREATE DATABASE veyq_e2e_<n>` is a fresh instance in the only sense the suites care about, and
      # it keeps this build-once step intact instead of needing a second, differently-configured jar.
      - name: Build backend fast-jar
        working-directory: src/backend
        run: ./gradlew --no-daemon quarkusBuild

      - name: Install frontend dependencies
        # The registry half is asked once per commit, by `frontend`.
        run: python3 scripts/pnpm_install_no_deprecated.py --skip-registry-check

      # Docker-free: who owns the config-secret key a restore places, and that an unplaceable one is refused
      # before the first write. Beside the rehearsal below, which drives the same tool as one user end to end.
      - name: Backup tool self-test (the restored key's owner)
        run: python3 src/tools/instance_backup_selftest.py

      # Docker-free: veyqctl's resolver against a mirror it writes, the manifest parse, the template merge, `upgrade`'s
      # order and every refusal (ADR 0096). Beside the backup tool's, which veyqctl runs from a release's directory.
      - name: veyqctl self-test
        run: python3 src/tools/veyqctl_selftest.py

      # Docker-free: the upgrade proof's pure parts (which predecessor, both builds' migrations, Flyway's refusal named,
      # the record both builds share). The proof itself is `upgrade-proof` below, disabled until a release.
      - name: Upgrade proof self-test
        run: python3 scripts/upgrade_proof_selftest.py

      - name: Run web E2E suites against a live backend
        run: python3 scripts/run_web_e2e.py

      # A red wire sweep is only debuggable from what it retained: boot logs, the HTTP recordings, the dumps, the
      # statement log and the mailbox. Kept on success too, so a green run can be compared against a red one.
      # They carry throwaway tokens and keys of throwaway instances (cc.security.wire-assertion § what a green
      # sweep does not prove). `include-hidden-files` because the directory itself is dot-named, and the
      # action's default skips hidden paths.
      - name: Keep the e2e run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: .e2e-out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  api-fuzz:
    name: API fuzzing (Schemathesis, from the contracts)
    # Every operation of contracts/api gets requests nobody wrote by hand (ADR 0091 decision 9): Schemathesis, in our own
    # image (tests/fuzz/Dockerfile: a pinned base, every package hash-pinned; the runner builds it), against a fresh
    # %e2e fast-jar booted with run_web_e2e.py's primitives — negative cases on
    # every operation, positive ones on every GET and every public write the run may change, with the objects a seeder
    # created with the real client crypto, stateful sequences over inferred links, and a second member who must be
    # refused what the first keeps in their own space. Red on a 5xx, a status or body the contract does not declare, a
    # malformed request accepted or echoed, a valid one refused as malformed, a peer let through, a failure not in
    # tests/fuzz/baseline.json, or an invocation that tested nothing. A stage of its own beside web-e2e, which has no
    # budget left for it. Like web-e2e it declares no `services:`: the runner brings up the compose stack itself.
    # 20 min: on the first GitHub run (2026-11-05) a cold Gradle cache made the fast-jar 4.0 min and the install
    # 1.1 min before the run, which takes 5.7-7.3 min locally, about 1.24x that on a 4-vCPU runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1

      - name: Build backend fast-jar
        working-directory: src/backend
        run: ./gradlew --no-daemon quarkusBuild

      - name: Install frontend dependencies
        # The seeder (src/web/scripts/fuzz-seed.mts) runs on web's generated client; the registry half is `frontend`'s.
        run: python3 scripts/pnpm_install_no_deprecated.py --skip-registry-check

      - name: Fuzz the API against a live backend
        run: python3 scripts/run_api_fuzz.py

      # Each invocation's JUnit (a curl line per failure), NDJSON, VCR cassette and JSON report, the boot log and the
      # summary. The seed's token and password are a throwaway instance's. `include-hidden-files` because the
      # directory is dot-named.
      - name: Keep the fuzz run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-out
          path: .fuzz-out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  version:
    name: Read the veyq version from the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the version is a function of the checkout; this job reaches no network at all
    outputs:
      major: ${{ steps.veyq-version.outputs.major }}
      version: ${{ steps.veyq-version.outputs.version }}
      kind: ${{ steps.veyq-version.outputs.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The minor is a commit count, and a shallow clone counts 1 — the step below refuses one rather than
          # stamping it, so this is what makes the job pass at all.
          fetch-depth: 0

      # This script is EXECUTED, offline, by scripts/validate_release_identity.py — which is the whole reason
      # the version comes from the tree. Keep every input in `env:` and use no `${{ }}` expression here, or the
      # guard can no longer assert what a publish would stamp. It must also reach no network: a version the
      # registry decides makes the released artifact the authority on its own name (ADR 0057 § Rejected).
      - name: Read the veyq version from the tree
        id: veyq-version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          # `github-hosted` on GitHub's runners; `local` under scripts/run_pipeline.py, which must publish nothing.
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail

          major="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$major" =~ ^[0-9]+$ ]]; then
            echo "VERSION must contain the major alone (the minor is counted from the history), got: $major" >&2
            exit 1
          fi

          # The minor is the number of commits since the one that last changed VERSION (ADR 0057 §1), so it needs
          # the whole history. A shallow clone would count 1 and stamp a wrong version that looks right — refuse.
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "Shallow checkout: the minor counts commits since VERSION last changed and needs the full history (fetch-depth: 0)" >&2
            exit 1
          fi
          base="$(git log -1 --format=%H -- VERSION)"
          if [[ -z "$base" ]]; then
            echo "No commit touches VERSION, so there is no point to count the minor from" >&2
            exit 1
          fi
          minor="$(git rev-list --count "${base}..HEAD")"

          # The stamp is the release this commit can become, never `-SNAPSHOT` (ADR 0091 decision 5): a release is a
          # promotion of the snapshot's bytes, so the two must carry one name. Whether a digest IS a release is the
          # release signature's fact, not the image's.
          version="${major}.${minor}"
          kind=none

          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            # scripts/run_pipeline.py simulates a push: a local run builds and tests, and writes to no registry or remote.
            :
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Whatever publishes also signs, and a release is promoted from these two branch shapes only — the release
            # identity site/src/content/docs/run/verify-a-release.md pins accepts them, and
            # scripts/validate_release_identity.py holds the two to each other. A push to another `release/**` branch
            # is red rather than a green run without a snapshot.
            if [[ "$REF_NAME" != "main" && "$REF_NAME" != "release/${major}.x" ]]; then
              echo "Unsupported publish branch: $REF_NAME (VERSION ${major} publishes from main or release/${major}.x)" >&2
              exit 1
            fi
            kind=snapshot
          fi
          # Otherwise a pull request: it builds and tests the images and publishes nothing.

          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Only the version, not the tests (ADR 0091 decision 2): the build starts beside the surface checks instead of
    # after them. The Docker build compiles but runs no tests (-x test), and that is safe only because nothing it
    # builds becomes a published name until `snapshot`, which needs every stage green. When the run publishes (`kind`
    # `snapshot`: a push or a dispatch on `main` or `release/<major>.x`) it pushes the per-arch `build-<sha>-<arch>`
    # staging tags before the tests finish — unsigned, carrying no published name, pulled by digest by lane L1 and
    # turned into the snapshot by `snapshot` alone. A pull request and a local run push nothing.
    needs:
      - version
    permissions:
      contents: read
      packages: write
    # Three images, two architectures. The admin surface ships as part of the SAME release as the app (ADR 0065) —
    # same version, same signature, one `v<major>.<minor>` ref — and so does the tools image a cluster's backup gate
    # runs (ADR 0098), so each is a dimension of this matrix rather than a second job pair that could drift out of
    # step with it.
    strategy:
      fail-fast: false
      matrix:
        image: [veyq, veyq-admin, veyq-tools]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: veyq
            dockerfile: src/backend/Dockerfile
            target: runtime-jvm
          - image: veyq-admin
            dockerfile: src/admin-web/Dockerfile
            target: runtime-nginx
          - image: veyq-tools
            dockerfile: src/tools/Dockerfile
            target: runtime-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tools image bakes the release a new major is entered from, which is read from EVERY release tag, a
          # `release/<old>.x` branch's included (`release_assets.py --major-entry`): that leg needs the tags, which
          # fetch-depth: 0 fetches with the history (no `fetch-tags` needed); the other two need neither.
          fetch-depth: ${{ matrix.image == 'veyq-tools' && '0' || '1' }}

      # The tools image's gate refuses to enter a new major from any release but the one this release's own upgrade
      # proof and chart check ran from (ADR 0098) — the newest release of the previous major among every tag (ADR 0085
      # decision 10), the ONE derivation `upgrade-proof` and `chart` prove from too, read here and baked in as
      # VEYQ_MAJOR_ENTRY; empty when the previous major has no release. Planned to be replaced by the L2 lane's
      # attestation (ADR 0091 decision 5, not built). PyYAML as exact, hashed wheels only
      # (scripts/requirements-release.txt): this job pushes images, and code PyPI served unpinned would run beside
      # that access (validate_release_identity.py assertion 15).
      - name: Find the release a new major is entered from (tools)
        id: major-entry
        if: matrix.image == 'veyq-tools'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/entry-venv"
          "${RUNNER_TEMP}/entry-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/requirements-release.txt
          entry="$("${RUNNER_TEMP}/entry-venv/bin/python" scripts/release_assets.py --major-entry "$VERSION")"
          echo "release ${VERSION} enters its major from: ${entry:-no release}"
          echo "value=${entry}" >> "$GITHUB_OUTPUT"

      # The tools build below is `load:`ed, and with provenance and SBOM its result is an image index, which only
      # Docker's containerd image store takes: the classic store refuses it ("docker exporter does not currently
      # support exporting manifest lists"). Docker 29 turns that store on by default, Docker 28 does not, and the runner
      # images differ — on the first GitHub run (2026-11-05) the leg passed on ubuntu-26.04 (Docker 29.4.2, containerd)
      # and failed on ubuntu-24.04-arm (Docker 28.0.4, overlay2), and `ubuntu-latest` moves between the two while it
      # migrates. So the leg switches the store on itself, before Buildx starts its builder in that daemon, and stops
      # unless Docker then reports it. Never on scripts/run_pipeline.py's host, whose Docker is the developer's own.
      - name: Use the containerd image store (tools)
        if: matrix.image == 'veyq-tools' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          store() { docker info --format '{{json .DriverStatus}}'; }
          if [[ "$(store)" != *'"io.containerd.snapshotter.v1"'* ]]; then
            config=/etc/docker/daemon.json
            current='{}'
            if sudo test -s "$config"; then current="$(sudo cat "$config")"; fi
            jq '.features["containerd-snapshotter"] = true' <<< "$current" | sudo tee "$config" > /dev/null
            sudo systemctl restart docker
          fi
          echo "image store: $(store)"
          if [[ "$(store)" != *'"io.containerd.snapshotter.v1"'* ]]; then
            echo "Docker is not on the containerd image store, so it cannot load the tools image's index" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only a publishing run writes to a registry: a pull request and a local run build the same images and keep them
      # in the runner. scripts/validate_release_identity.py holds every registry write in this file to the `version`
      # job's `kind == 'snapshot'`.
      - name: Log in to GitHub Container Registry
        if: needs.version.outputs.kind == 'snapshot'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `labels:` on either build step, and no metadata step feeding one: a passed label overrides the Dockerfile's,
      # and metadata-action's would name the branch (`main`, `pr-12`) as the image's version and the bare SHA as its
      # revision. The identity labels are the target stage's own, from the stamps below (validate_release_identity.py
      # assertion 12).
      - name: Build image
        id: image
        if: matrix.image != 'veyq-tools'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.version.outputs.kind == 'snapshot' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The tools image, built as the step above builds the other two plus the one stamp only it declares, the major
      # entry — a step of its own because validate_release_identity.py holds each build step's stamps to every target
      # stage it builds. Also loaded into this runner's Docker (its containerd image store, above), because the artifact
      # must RUN before it counts (below).
      - name: Build image (tools)
        id: image-tools
        if: matrix.image == 'veyq-tools'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.version.outputs.kind == 'snapshot' }}
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
            VEYQ_MAJOR_ENTRY=${{ steps.major-entry.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # Never runs on GitHub. scripts/run_pipeline.py cannot run the actions above, so on its host (`runner.environment`
      # `local`) this builds the same Dockerfile, target, platform and build arguments with the host's own Docker: no
      # registry, no GitHub cache, no provenance or SBOM. The tag names this leg and is overwritten by the next run.
      - name: Build image (the host's Docker)
        if: runner.environment != 'github-hosted'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          VEYQ_VERSION: ${{ needs.version.outputs.version }}
          VEYQ_MAJOR_ENTRY: ${{ steps.major-entry.outputs.value }}
        run: |
          set -euo pipefail
          entry=()
          if [[ "$IMAGE" == "veyq-tools" ]]; then
            entry=(--build-arg "VEYQ_MAJOR_ENTRY=${VEYQ_MAJOR_ENTRY}")
          fi
          docker build --file "$DOCKERFILE" --target "$TARGET" --platform "$PLATFORM" \
            --build-arg "VEYQ_VERSION=${VEYQ_VERSION}" --build-arg "VEYQ_REVISION=sha-${GITHUB_SHA}" ${entry[@]+"${entry[@]}"} \
            --tag "veyq-pipeline/${IMAGE}:${ARCH}" .

      # The tools image is an executable artifact, so the build is not done until it RUNS (changes/README.md): its own
      # self-test inside itself, as uid 10001, and the two binaries the in-pod mode puts on PATH. On GitHub the image
      # the step above loaded, on the host the one the host's Docker built.
      - name: Run the tools image's self-test inside it
        if: matrix.image == 'veyq-tools'
        env:
          IMAGE_REF: ${{ runner.environment == 'github-hosted' && format('ghcr.io/{0}/veyq-tools:build-{1}-{2}', github.repository_owner, github.sha, matrix.arch) || format('veyq-pipeline/veyq-tools:{0}', matrix.arch) }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "$IMAGE_REF" /opt/veyq/instance_backup_selftest.py
          docker run --rm --entrypoint mariadb-dump "$IMAGE_REF" --version
          docker run --rm --entrypoint rclone "$IMAGE_REF" version
          docker run --rm --entrypoint cat "$IMAGE_REF" /opt/veyq/release.json

      # The digest this leg pushed, handed to the stack lane of its architecture, which pulls the image by it — never by
      # the staging tag, which a later build of the same commit could move (ADR 0090 decision 2: the lane tests the
      # exact bytes). One small artifact per image and architecture; matrix legs cannot each set a job output.
      - name: Hand the pushed digest to the stack lane
        if: needs.version.outputs.kind == 'snapshot'
        env:
          DIGEST: ${{ steps.image.outputs.digest || steps.image-tools.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the build pushed no digest the lane could pull by: '${DIGEST}'" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "$DIGEST" > "${RUNNER_TEMP}/digests/${IMAGE}"

      - name: Keep the pushed digest
        if: needs.version.outputs.kind == 'snapshot'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 7

  # Lane L1 (ADR 0090; ADR 0091 decision 3): the release candidate installed the way a Server Owner installs it —
  # `veyqctl install --unsigned-local` from the release assets `scripts/release_assets.py` produces for these two
  # images — with a real ACME certificate from Pebble, first run, a Memory round trip and the feature scenarios driven
  # in Chromium (`tests/e2e/`, in the Playwright image the overlay pins), then the ADR 0053 sweeps over the whole stack. One
  # instance per run; the orchestrator prints every stage's wall time into its summary, which the job's budget (ADR
  # 0091 decision 1, 15 min) is held against.
  #
  # Split by domain (ADR 0091 decision 1: a stage that outgrows its budget is sharded; ADR 0090 decision 7): the whole
  # suite took 15.7 min of browser time alone on 2026-10-26, so each architecture runs it as one leg per domain folder of
  # tests/e2e/tests/features/, each its own runner and its own instance — Playwright's `--project <domain>`, handed
  # through the orchestrator. Every leg runs `setup`, `scenarios` and `instance` whole and its domain's specs
  # (tests/e2e/playwright.config.ts says why that is the split), then the sweeps over what its own browser typed; the
  # snapshot waits for every leg.
  #
  # Which bytes it tests (ADR 0090 decision 2): when the run publishes, the `build-<sha>-<arch>` images `build` pushed,
  # pulled by the digest `build` handed over and given a local name, because `veyqctl --unsigned-local` takes only a
  # local build's bare `name:tag` — the snapshot waits on this job and is made of those digests, so it names nothing
  # this lane did not install. A green leg then records what it ran (`scripts/snapshot.py lane-result`: the digests, the
  # asset set it installed) for the snapshot's attestation; the leg itself signs nothing. A pull request and a local
  # run write to no registry, so there is nothing to pull: the lane builds the two images in its own job, with
  # `build`'s arguments and from its cache, and pushes nothing. A pull request runs the amd64 leg only; a push and a
  # dispatch run both architectures, since nothing else ever starts the arm64 image.
  stack:
    name: Stack lane L1 (${{ matrix.arch }}, ${{ matrix.domain }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # `frontend` too: it is the one install of the lockfile that asks the registry about its locked packages
    # (inbox #312), and the images this lane builds or pulls install that lockfile — so nothing is booted here
    # from a lockfile that check has not passed (validate_pnpm_installs_gated.py). It runs beside `build`, so the
    # wait costs only what it takes longer.
    needs:
      - version
      - frontend
      - build
    permissions:
      contents: read
      packages: read # a publishing run pulls the staged images by digest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # One leg per domain folder of tests/e2e/tests/features/ (ADR 0090 decision 7): each boots its own instance and runs
        # `setup`, `scenarios`, `instance` and that domain. tests/e2e/shards.test.mjs holds this list equal to the folders.
        domain: [account, depot, expenses, memories, moderation, platform]
        exclude:
          - arch: ${{ github.event_name == 'pull_request' && 'arm64' || 'none' }}
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the lane turns the candidate into a release with the publish's own producer
          # (scripts/release_assets.py), whose minor counts the commits since VERSION last changed and refuses a
          # shallow checkout (the second GitHub run, 2026-11-05: every leg red at `assets` on it).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1

      # The browser container installs nothing: it mounts this root install read-only, with `@playwright/test` pinned
      # to the image's version (the orchestrator refuses a mismatch). The registry half is asked once per commit, by
      # `frontend`.
      - name: Install dependencies
        run: python3 scripts/pnpm_install_no_deprecated.py --skip-registry-check

      # The orchestrator, the release producer and `veyqctl` run on the job's Python; PyYAML is the one dependency.
      - name: Set up the orchestrator's Python
        run: |
          python3 -m venv "${RUNNER_TEMP}/stack-venv"
          "${RUNNER_TEMP}/stack-venv/bin/pip" install --quiet pyyaml

      - name: Set up Docker Buildx
        if: needs.version.outputs.kind != 'snapshot'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A push or a pull request: the candidate is built here, as `build` built it (same Dockerfile, target, platform
      # and arguments), from the cache `build` wrote for this image and architecture, loaded into this runner's Docker
      # and never pushed. The app and admin images only: the lane installs through Compose, which never runs the third
      # image, `veyq-tools` (a cluster's backup gate does, ADR 0098; `build` runs its self-test inside it).
      - name: Build the candidate app image
        if: needs.version.outputs.kind != 'snapshot'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/backend/Dockerfile
          target: runtime-jvm
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: veyq:candidate-${{ matrix.arch }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          cache-from: type=gha,scope=veyq-${{ matrix.arch }}

      - name: Build the candidate admin image
        if: needs.version.outputs.kind != 'snapshot'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/admin-web/Dockerfile
          target: runtime-nginx
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: veyq-admin:candidate-${{ matrix.arch }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          cache-from: type=gha,scope=veyq-admin-${{ matrix.arch }}

      # Never runs on GitHub. scripts/run_pipeline.py cannot run the two actions above, so on its host this builds the
      # same two images with the host's own Docker, under the same local names.
      - name: Build the candidate images (the host's Docker)
        if: runner.environment != 'github-hosted' && needs.version.outputs.kind != 'snapshot'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          VEYQ_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docker build --file src/backend/Dockerfile --target runtime-jvm --platform "$PLATFORM" \
            --build-arg "VEYQ_VERSION=${VEYQ_VERSION}" --build-arg "VEYQ_REVISION=sha-${GITHUB_SHA}" \
            --tag "veyq:candidate-${ARCH}" .
          docker build --file src/admin-web/Dockerfile --target runtime-nginx --platform "$PLATFORM" \
            --build-arg "VEYQ_VERSION=${VEYQ_VERSION}" --build-arg "VEYQ_REVISION=sha-${GITHUB_SHA}" \
            --tag "veyq-admin:candidate-${ARCH}" .

      # A publishing run: the images `build` pushed for this architecture, by the digests it handed over.
      - name: Log in to GitHub Container Registry
        if: needs.version.outputs.kind == 'snapshot'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the digests build pushed
        if: needs.version.outputs.kind == 'snapshot'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Pull the candidate by digest and name it locally
        if: needs.version.outputs.kind == 'snapshot'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for image in veyq veyq-admin; do
            digest="$(tr -d '[:space:]' < "${RUNNER_TEMP}/digests/${image}")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "no digest for ${image} (${ARCH}) from build: '${digest}'" >&2
              exit 1
            fi
            docker pull "${REGISTRY}/${image}@${digest}"
            docker tag "${REGISTRY}/${image}@${digest}" "${image}:candidate-${ARCH}"
            echo "${image}:candidate-${ARCH} is ${REGISTRY}/${image}@${digest}"
          done

      - name: Run lane L1
        env:
          ARCH: ${{ matrix.arch }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          "${RUNNER_TEMP}/stack-venv/bin/python" scripts/run_stack_e2e.py \
            --app "veyq:candidate-${ARCH}" --admin "veyq-admin:candidate-${ARCH}" \
            --asset-set-out "${RUNNER_TEMP}/asset-set" -- --project "${DOMAIN}"

      # What this green leg ran, for the snapshot's attestation (ADR 0091 decision 5): the lane, architecture and shard,
      # the commit, the asset set it installed, and the digests it pulled. A record and no signature: this job runs the
      # commit's test code, so it holds no `id-token`; `snapshot` signs once every leg is green.
      - name: Record the leg's result
        if: needs.version.outputs.kind == 'snapshot'
        env:
          ARCH: ${{ matrix.arch }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          python3 scripts/snapshot.py lane-result --lane L1 --arch "$ARCH" --shard "$DOMAIN" --commit "$GITHUB_SHA" \
            --asset-set "$(tr -d '[:space:]' < "${RUNNER_TEMP}/asset-set")" \
            --image "veyq=$(tr -d '[:space:]' < "${RUNNER_TEMP}/digests/veyq")" \
            --image "veyq-admin=$(tr -d '[:space:]' < "${RUNNER_TEMP}/digests/veyq-admin")" \
            --out "${RUNNER_TEMP}/lane-result/L1-${ARCH}-${DOMAIN}.json"

      - name: Keep the leg's result
        if: needs.version.outputs.kind == 'snapshot'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-result-${{ matrix.arch }}-${{ matrix.domain }}
          path: ${{ runner.temp }}/lane-result/L1-${{ matrix.arch }}-${{ matrix.domain }}.json
          if-no-files-found: error
          retention-days: 7

      # The run directory: the release and the instance's home, every container's log, the browser's report (with a
      # trace for each failed test only: CI=true, tests/e2e/playwright.config.ts), the sweeps' dumps. Kept on success
      # too, so a green run's logs, report and dumps can be compared with a red one's; a green test's trace is not in it
      # (a local run keeps one per test). It holds the secrets and Secret Key of a throwaway instance that no longer exists.
      - name: Keep the stack run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-out-${{ matrix.arch }}-${{ matrix.domain }}
          path: .e2e-stack-out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The upgrade proof (ADR 0057 Decision 7, site/src/content/docs/run/upgrade.mdx): the predecessor's own jar and e2e
  # suites seal content into an instance, ADR 0056's tool captures it, the capture is restored onto THIS commit's build,
  # which migrates it up at its start, and this commit's suites open the content and assert it. The predecessor is the
  # default of `scripts/run_web_e2e.py --upgrade`: the first parent of the commit until the first release, the newest
  # `v<major>.<minor>` tag it reaches from then on. A second leg proves the release's major entry (ADR 0085 decision
  # 10), the newest release of the previous major among EVERY tag — a fix release tagged on `release/<old>.x`, which this
  # commit does not reach — hence the full history and every tag (fetch-depth: 0 fetches both). One leg per predecessor,
  # each with the job's budget (ADR 0091 decision 1): each builds two jars and proves once, as one leg did before the
  # second proof. A leg asks `--resolve` first and builds nothing when there is nothing to prove from: the major-entry
  # leg while the entry is the default predecessor (a major's first release) or there is none.
  #
  # DISABLED UNTIL THE FIRST RELEASE (owner decision 2026-10-14). Before it a baseline may still change
  # (src/backend/CLAUDE.md § Migrations), so a red proof informs and gates nothing. The change that sets the `release:` line
  # of scripts/applied_migrations.sha256 enables it, in the same commit: it deletes `if: false` below AND the
  # `"skipped"` that `snapshot` tolerates for this job. A disabled job claims no coverage (ADR 0040).
  upgrade-proof:
    name: Upgrade proof (the predecessor's backup, restored onto and read by this build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false
    strategy:
      fail-fast: false
      matrix:
        predecessor:
          - { leg: default, flag: --upgrade }
          - { leg: major-entry, flag: --upgrade-major-entry }
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the predecessor (${{ matrix.predecessor.leg }})
        id: predecessor
        env:
          FLAG: ${{ matrix.predecessor.flag }}
        run: |
          set -euo pipefail
          python3 scripts/run_web_e2e.py "$FLAG" --resolve | tee "${RUNNER_TEMP}/resolve.log"
          ref="$(sed -n 's/^predecessor=//p' "${RUNNER_TEMP}/resolve.log" | tail -n 1)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        if: steps.predecessor.outputs.ref != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Validate the Gradle wrapper JAR
        if: steps.predecessor.outputs.ref != ''
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Node
        if: steps.predecessor.outputs.ref != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # pnpm at exactly the version package.json pins in `packageManager` (validate_pnpm_installs_gated.py holds
      # the two equal). GitHub's runner only: a local run (scripts/run_pipeline.py) uses the host's pnpm, which
      # switches itself to the pinned version.
      - name: Install pnpm
        if: steps.predecessor.outputs.ref != '' && runner.environment == 'github-hosted'
        run: npm install -g pnpm@12.16.1
      - name: Build the candidate's fast-jar
        if: steps.predecessor.outputs.ref != ''
        working-directory: src/backend
        run: ./gradlew --no-daemon quarkusBuild
      - name: Install the candidate's dependencies
        if: steps.predecessor.outputs.ref != ''
        # The registry half is asked once per commit, by this workflow's `frontend`.
        run: python3 scripts/pnpm_install_no_deprecated.py --skip-registry-check
      # The orchestrator builds the predecessor itself, in a worktree of its ref inside the run directory, and removes
      # it afterwards; its summary ends with the proof's own lines (predecessor, both highest migrations, the outcome).
      # The major-entry leg proves from the release the tools image bakes and its gate admits alone (ADR 0098 decision
      # 3), the one the manifest names as `majorEntry`; it resolves the entry again, from the same tags.
      - name: Run the upgrade proof (${{ matrix.predecessor.leg }})
        if: steps.predecessor.outputs.ref != ''
        env:
          FLAG: ${{ matrix.predecessor.flag }}
        run: python3 scripts/run_web_e2e.py "$FLAG"
      - name: Keep the e2e run directory
        if: always() && steps.predecessor.outputs.ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-proof-out-${{ matrix.predecessor.leg }}
          path: .e2e-out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  snapshot:
    name: Publish the snapshot (the images, the chart, their signatures and the lanes' attestations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every other job of this file that is a stage is needed here, and the snapshot waits for each to be green (ADR 0091
    # decision 2) — it is the only thing that makes it safe for `build` to start beside the tests.
    # validate_release_identity.py holds the list to the file: a stage added and not needed here is red.
    needs:
      - guards
      - backend
      - backend-races
      - frontend
      - chart
      - web-e2e
      - api-fuzz
      - version
      - build
      - stack
      - upgrade-proof
    # `always()` so that the upgrade proof being SKIPPED (disabled, above) does not skip the snapshot, as a skipped need
    # otherwise would; every result then gates it explicitly. Its "skipped" goes with the job's `if: false`.
    if: >-
      always() && needs.version.outputs.kind == 'snapshot'
      && needs.guards.result == 'success'
      && needs.backend.result == 'success'
      && needs.backend-races.result == 'success'
      && needs.frontend.result == 'success'
      && needs.chart.result == 'success'
      && needs.web-e2e.result == 'success'
      && needs.api-fuzz.result == 'success'
      && needs.version.result == 'success'
      && needs.build.result == 'success'
      && needs.stack.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.upgrade-proof.result)
    permissions:
      contents: read # the checkout only: the git tag is `snapshot-tag`'s, a job that holds nothing else
      packages: write
      id-token: write # keyless cosign signing and attesting via GitHub OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The per-arch digests `build` pushed — the bytes lane L1 pulled by the same artifacts and installed — so the
      # snapshot is assembled from exactly those, never from the staging tags, which a later build of the commit could
      # move (ADR 0090 decision 2). One directory per artifact: `digests/digest-<image>-<arch>/<image>`.
      - name: Fetch the digests build pushed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      # What every green leg of lane L1 recorded (`scripts/snapshot.py lane-result`).
      - name: Fetch the lanes' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lane-result-*
          path: ${{ runner.temp }}/lane-results

      # The pinned Helm (workflow-level env above): verified against the pin BEFORE it is extracted, so a
      # tarball that does not match never runs. The same step installs it in `chart` and in `snapshot`.
      - name: Install Helm (pinned tarball)
        run: |
          set -euo pipefail
          tarball="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "https://get.helm.sh/${tarball}"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" linux-amd64/helm
          echo "${RUNNER_TEMP}/linux-amd64" >> "$GITHUB_PATH"

      # The cosign every signature below is made with: the same line an operator verifies with. `cosign-release` is
      # pinned because the installer's own default lags (v4.1.2 installs v3.0.6, inside GHSA-fx35-mq7g-6g98's range),
      # and no Dependabot ecosystem reads it: a newer cosign is a bump by hand. scripts/validate_release_identity.py
      # holds it to an exact version no older than src/tools/veyqctl.py's COSIGN_MIN_VERSION.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # A snapshot is written once per commit and never replaced (ADR 0091 decision 5). Each image's
      # `<version>-SNAPSHOT` and `sha-<commit>` must be free, or already name exactly the manifests this run's build
      # pushed — a "re-run failed jobs" of a half-done snapshot continues, a second build of the same commit is refused,
      # and so is a version another commit took (two branches counting one minor, ADR 0057 §1). A read that fails for any
      # reason but "not found" is refused rather than read as "nothing published yet" — the silent republish ADR 0057
      # was written against. The decisions are scripts/snapshot.py's, proven by its self-test in `guards`.
      - name: Refuse to replace a published snapshot
        id: assert-snapshot-unpublished
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/snapshot.py check-unpublished --registry "$REGISTRY" --version "$VERSION" \
            --commit "$GITHUB_SHA" --digests "${RUNNER_TEMP}/digests" \
            --image veyq --image veyq-admin --image veyq-tools --chart charts/veyq

      # One predicate per lane and architecture, refused unless every leg of the matrix left a green record, with one
      # asset set across all of them (ADR 0091 decision 5). Its `--arch` and `--shard` are the `stack` matrix's, which
      # scripts/validate_release_identity.py holds equal.
      - name: Assemble the lanes' attestations
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/snapshot.py predicates --lane L1 --arch amd64 --arch arm64 \
            --shard account --shard depot --shard expenses --shard memories --shard moderation --shard platform \
            --commit "$GITHUB_SHA" --run "$RUN_URL" --results "${RUNNER_TEMP}/lane-results" --out "${RUNNER_TEMP}/predicates"

      # The snapshot's names on the digests `build` pushed: `<version>-SNAPSHOT` and `sha-<commit>`, nothing else — no
      # `<major>`, no `latest`, no `<major>.<minor>`, which are a release's and only a promotion gives them. No metadata
      # action: it would name the branch as the image's version; the tags are these two, written out.
      - name: Create the multi-arch manifests
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in veyq veyq-admin veyq-tools; do
            sources=()
            for arch in amd64 arm64; do
              digest="$(tr -d '[:space:]' < "${RUNNER_TEMP}/digests/digest-${name}-${arch}/${name}")"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "no digest for ${name} (${arch}) from build: '${digest}'" >&2
                exit 1
              fi
              sources+=("${REGISTRY}/${name}@${digest}")
            done
            docker buildx imagetools create -t "${REGISTRY}/${name}:${VERSION}-SNAPSHOT" -t "${REGISTRY}/${name}:sha-${GITHUB_SHA}" "${sources[@]}"
          done

      - name: Sign the snapshot's images (keyless)
        id: sign-images
        env:
          # Every image of the snapshot. An unsigned admin image would be the weaker half of a pair an operator
          # is told to pin together — and it is the higher-privilege half (ADR 0065); an unsigned tools image would be
          # an unverified program reading the database and the store's admin token in a cluster (ADR 0098).
          IMAGES: ghcr.io/${{ github.repository_owner }}/veyq ghcr.io/${{ github.repository_owner }}/veyq-admin ghcr.io/${{ github.repository_owner }}/veyq-tools
        run: |
          set -euo pipefail
          # Resolve each manifest-list digest from the sha- tag and sign THAT, so both names pointing at it are
          # covered. The identity this produces is this file on the branch that ran it — the SNAPSHOT identity, which
          # the release identity (verify-a-release.md, `veyqctl`) rejects: a promotion signs again, as `release.yml`.
          for image in $IMAGES; do
            digest="sha256:$(docker buildx imagetools inspect --raw "$image:sha-${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
            echo "Signing $image@${digest}"
            cosign sign --yes "$image@${digest}"
            echo "${image##*/}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # The chart beside the images (ADR 0064), as `<version>-SNAPSHOT` for its `version` and `appVersion`: its
      # `appVersion` is the image tag its values default to, so this chart runs this snapshot's images, and the release's
      # chart is packaged again by the promotion. `helm push` appends
      # the chart's NAME to the target, so it lands on ghcr.io/<owner>/charts/veyq. A chart this commit already pushed
      # (the refusal step said `present`) is kept, not pushed twice.
      - name: Package and push the chart
        id: chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.assert-snapshot-unpublished.outputs.chart }}
          KEPT: ${{ steps.assert-snapshot-unpublished.outputs.chart_digest }}
        run: |
          set -euo pipefail
          if [[ "$STATE" == "present" ]]; then
            echo "the chart ${VERSION}-SNAPSHOT is this commit's already: ${KEPT}"
            echo "digest=${KEPT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package infra/kubernetes/charts/veyq --version "${VERSION}-SNAPSHOT" --app-version "${VERSION}-SNAPSHOT" --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/veyq-${VERSION}-SNAPSHOT.tgz" "$CHART_REGISTRY" 2>&1 | tee "${RUNNER_TEMP}/chart-push.log"
          # Measured with Helm 4.0.1: a push prints `Pushed: <ref>` and `Digest: sha256:<64 hex>`, and that digest
          # is the sha256 of the manifest `docker buildx imagetools inspect --raw` returns for the same tag.
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "${RUNNER_TEMP}/chart-push.log")"
          if [[ -z "$digest" ]]; then
            echo "helm push printed no digest, so there is nothing to sign" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the snapshot's chart (keyless)
        env:
          CHART: ghcr.io/${{ github.repository_owner }}/charts/veyq
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing ${CHART}@${DIGEST}"
          cosign sign --yes "${CHART}@${DIGEST}"

      # Each lane's result as a signed in-toto attestation, per architecture, on the two images the lane installs (ADR
      # 0091 decision 5): a promotion verifies them with the snapshot identity and compares their `inputs` with its own.
      # Stored by cosign in the registry beside the image — no attestation service.
      - name: Attest the lanes' results (keyless)
        env:
          PREDICATE_TYPE: https://veyq.app/attestations/stack-lane/v1
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          APP: ${{ steps.sign-images.outputs.veyq }}
          ADMIN: ${{ steps.sign-images.outputs.veyq-admin }}
        run: |
          set -euo pipefail
          for predicate in "${RUNNER_TEMP}"/predicates/*.json; do
            for subject in "veyq@${APP}" "veyq-admin@${ADMIN}"; do
              echo "Attesting $(basename "$predicate" .json) on ${REGISTRY}/${subject}"
              cosign attest --yes --type "$PREDICATE_TYPE" --predicate "$predicate" "${REGISTRY}/${subject}"
            done
          done

  # The git tag `snapshot-<major>.<minor>` on the snapshot's commit (ADR 0091 decision 5), so GitHub's release page offers
  # exactly the snapshots that can be promoted; the retention job deletes it with the snapshot's images. A job of its
  # own because it is the one that writes to the repository, and it holds that and nothing else. Never `v…`: that name
  # says "released" (ADR 0057 §2), and every tag watcher would read a snapshot as a release. Pushed with
  # `GITHUB_TOKEN`, which starts no workflow, and not forced: a tag on another commit is red.
  snapshot-tag:
    name: Tag the snapshot's commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - version
      - snapshot
    # Its own status function and `snapshot`'s result, never GitHub's implicit `success()`: that one looks at the whole
    # chain of needs, and `snapshot` follows the switched-off `upgrade-proof` (skipped), so on the first real run
    # (2026-11-06, 42274582708) it skipped this job behind a green `snapshot` (validate_release_identity.py assertion 16).
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && needs.version.outputs.kind == 'snapshot' }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the commit
        id: snapshot-tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="snapshot-${VERSION}"
          existing="$(git ls-remote origin "refs/tags/${tag}" | cut -f1)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "refs/tags/${tag} already names ${GITHUB_SHA}"
              exit 0
            fi
            echo "refs/tags/${tag} names ${existing}, not ${GITHUB_SHA} — a snapshot is written once per commit" >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
