name: Container

# A tag is deliberately NOT a trigger. The publish CREATES `v<major>.<minor>` (ADR 0057 §2), so a tag push
# could only ever ask for a version that is already published — which the `assert-release-unpublished` step
# below refuses by design. Triggering on both would mean every release is followed by a red run.
on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "site/**"
      - ".github"
  pull_request:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "site/**"
      - ".github"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('veyq-container-pr-{0}', github.event.pull_request.number) || 'veyq-container-release' }}
  cancel-in-progress: false

# Least-privilege default; each job widens only what it needs (see per-job permissions blocks).
permissions:
  contents: read

jobs:
  version:
    name: Read the veyq version from the tree
    runs-on: ubuntu-latest
    permissions:
      contents: read # the version is a function of the checkout; this job reaches no network at all
    outputs:
      major: ${{ steps.veyq-version.outputs.major }}
      version: ${{ steps.veyq-version.outputs.version }}
      publish_branch_tags: ${{ steps.veyq-version.outputs.publish_branch_tags }}
      publish_latest: ${{ steps.veyq-version.outputs.publish_latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # This script is EXECUTED, offline, by scripts/validate_release_identity.py — which is the whole reason
      # the version comes from the tree. Keep every input in `env:` and use no `${{ }}` expression here, or the
      # guard can no longer assert what a publish would stamp. It must also reach no network: a version the
      # registry decides makes the released artifact the authority on its own name (ADR 0057 § Rejected).
      - name: Read the veyq version from the tree
        id: veyq-version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must contain <major>.<minor>, got: $version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"

          publish_branch_tags=false
          publish_latest=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # A PR builds the image and publishes nothing. The version is still the tree's: the artifact a PR
            # builds is the one that would ship, which a synthesised `${major}.0` was not.
            :
          elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
            publish_branch_tags=true
            publish_latest=true
          elif [[ "$REF_NAME" == "release/${major}.x" ]]; then
            publish_branch_tags=true
          else
            echo "Unsupported release branch: $REF_NAME (VERSION ${version} publishes from main or release/${major}.x)" >&2
            exit 1
          fi

          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish_branch_tags=${publish_branch_tags}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

  test:
    name: Test gate (backend + frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Backend checks (compile + tests)
        working-directory: backend
        run: ./gradlew --no-daemon check
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks
        working-directory: web
        run: npm ci && npm run check

  build:
    name: Build veyq image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Gate the image on a green test suite: the Docker build compiles but runs no tests (-x test), so without
    # this a test-failing commit could still publish :latest/:<major> that auto-updaters pull.
    needs:
      - version
      - test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime-jvm
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/veyq:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=veyq-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=veyq-${{ matrix.arch }}

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # create the one `v<major>.<minor>` ref this release is named by (ADR 0057 §2)
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A publish onto an existing release FAILS rather than replacing it (ADR 0057 §1). What this replaces: the
      # old pipeline asked the registry for the highest published minor and incremented it, with `|| printf '[]'`
      # as its error path — so a transient API error and "nothing published yet" were indistinguishable and both
      # ended at `${major}.1`, republishing an already-delivered release under its own name. An operator who
      # pinned that tag then receives different bits with no signal, which is precisely the assumption
      # uc.admin.identify-instance-release rests on. The remedy is a bump commit, not a retry.
      - name: Refuse to republish an existing release
        id: assert-release-unpublished
        if: needs.version.outputs.publish_branch_tags == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} is already published. A release names itself from the tree — bump VERSION." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "refs/tags/v${VERSION} already exists. One release, one name, one tree — bump VERSION." >&2
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ needs.version.outputs.publish_latest == 'true' }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:build-${GITHUB_SHA}-amd64" \
            "$IMAGE:build-${GITHUB_SHA}-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the published image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq
        run: |
          # Resolve the manifest-list digest (the sha- tag is always produced) and sign THAT, so every channel
          # tag pointing at it (latest/<major>/<version>) is covered. Verify with:
          #   cosign verify $IMAGE@<digest> \
          #     --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:sha-${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
          echo "Signing $IMAGE@${digest}"
          cosign sign --yes "$IMAGE@${digest}"

      # One release, one name, one tree (ADR 0057 §2). The ref is created LAST, by the publish itself, so it
      # exists only for a release that actually shipped — and it is the ref at which the deployment files
      # belonging to this image can be found. The push is deliberately not forced: a tag that already exists is
      # a second publish of one release, and it must fail here too and not only in the check above.
      - name: Tag the released commit
        id: release-tag
        if: needs.version.outputs.publish_branch_tags == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"
