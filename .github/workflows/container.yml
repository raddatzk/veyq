name: Container

# A tag is deliberately NOT a trigger. The publish CREATES `v<major>.<minor>` (ADR 0057 §2), so a tag push
# could only ever ask for a version that is already published — which the `assert-release-unpublished` step
# below refuses by design. Triggering on both would mean every release is followed by a red run.
on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "site/**"
      - ".github"
  pull_request:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "site/**"
      - ".github"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('veyq-container-pr-{0}', github.event.pull_request.number) || 'veyq-container-release' }}
  cancel-in-progress: false

# Least-privilege default; each job widens only what it needs (see per-job permissions blocks).
permissions:
  contents: read

jobs:
  version:
    name: Read the veyq version from the tree
    runs-on: ubuntu-latest
    permissions:
      contents: read # the version is a function of the checkout; this job reaches no network at all
    outputs:
      major: ${{ steps.veyq-version.outputs.major }}
      version: ${{ steps.veyq-version.outputs.version }}
      publish_branch_tags: ${{ steps.veyq-version.outputs.publish_branch_tags }}
      publish_latest: ${{ steps.veyq-version.outputs.publish_latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This script is EXECUTED, offline, by scripts/validate_release_identity.py — which is the whole reason
      # the version comes from the tree. Keep every input in `env:` and use no `${{ }}` expression here, or the
      # guard can no longer assert what a publish would stamp. It must also reach no network: a version the
      # registry decides makes the released artifact the authority on its own name (ADR 0057 § Rejected).
      - name: Read the veyq version from the tree
        id: veyq-version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must contain <major>.<minor>, got: $version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"

          publish_branch_tags=false
          publish_latest=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # A PR builds the image and publishes nothing. The version is still the tree's: the artifact a PR
            # builds is the one that would ship, which a synthesised `${major}.0` was not.
            :
          elif [[ "$REF_NAME" == "main" ]]; then
            publish_branch_tags=true
            publish_latest=true
          elif [[ "$REF_NAME" == "release/${major}.x" ]]; then
            publish_branch_tags=true
          else
            echo "Unsupported release branch: $REF_NAME (VERSION ${version} publishes from main or release/${major}.x)" >&2
            exit 1
          fi

          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish_branch_tags=${publish_branch_tags}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

  test:
    name: Test gate (backend + frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Backend checks (compile + tests)
        working-directory: backend
        run: ./gradlew --no-daemon check
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # One workspace install, then each package proves itself. `admin-web` is gated here for the same reason
      # the app is: the image build compiles but runs no tests, so without this a broken admin surface could
      # still publish :latest alongside a green app image (ADR 0065 — one release, two images).
      - name: Install workspace dependencies
        run: npm ci
      - name: Shared crypto checks
        working-directory: packages/crypto
        run: npm run check
      - name: Frontend checks
        working-directory: web
        run: npm run check
      - name: Admin surface checks
        working-directory: admin-web
        run: npm run check

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Gate the image on a green test suite: the Docker build compiles but runs no tests (-x test), so without
    # this a test-failing commit could still publish :latest/:<major> that auto-updaters pull.
    needs:
      - version
      - test
    permissions:
      contents: read
      packages: write
    # Two images, two architectures, one step. The admin surface ships as part of the SAME release as the app
    # (ADR 0065) — same version, same signature, one `v<major>.<minor>` ref — so it is a dimension of this
    # matrix rather than a second job pair that could drift out of step with it.
    strategy:
      fail-fast: false
      matrix:
        image: [veyq, veyq-admin]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: veyq
            dockerfile: Dockerfile
            target: runtime-jvm
          - image: veyq-admin
            dockerfile: admin-web/Dockerfile
            target: runtime-nginx
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VEYQ_VERSION=${{ needs.version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # create the one `v<major>.<minor>` ref this release is named by (ADR 0057 §2)
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A publish onto an existing release FAILS rather than replacing it (ADR 0057 §1). What this replaces: the
      # old pipeline asked the registry for the highest published minor and incremented it, with `|| printf '[]'`
      # as its error path — so a transient API error and "nothing published yet" were indistinguishable and both
      # ended at `${major}.1`, republishing an already-delivered release under its own name. An operator who
      # pinned that tag then receives different bits with no signal, which is precisely the assumption
      # uc.admin.identify-instance-release rests on. The remedy is a bump commit, not a retry.
      - name: Refuse to republish an existing release
        id: assert-release-unpublished
        if: needs.version.outputs.publish_branch_tags == 'true'
        env:
          # Both images of the release. EITHER already being published means this release has shipped — a
          # partial republish is worse than a whole one, because the pair would then disagree about which
          # version the instance runs (ADR 0065: one release, two images).
          IMAGES: ghcr.io/${{ github.repository_owner }}/veyq ghcr.io/${{ github.repository_owner }}/veyq-admin
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          for image in $IMAGES; do
            if docker buildx imagetools inspect "${image}:${VERSION}" > /dev/null 2>&1; then
              echo "${image}:${VERSION} is already published. A release names itself from the tree — bump VERSION." >&2
              exit 1
            fi
          done

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "refs/tags/v${VERSION} already exists. One release, one name, one tree — bump VERSION." >&2
            exit 1
          fi

      # One metadata step per image: the two carry the SAME tag set (the release names both), and
      # metadata-action takes one image list but emits fully-qualified tags, so deriving the second image's
      # tags by string-editing the first's would put a substitution between the release and its own names.
      - name: Extract image metadata (app)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ needs.version.outputs.publish_latest == 'true' }}

      - name: Extract image metadata (admin)
        id: meta-admin
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq-admin
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.publish_branch_tags == 'true' }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ needs.version.outputs.publish_latest == 'true' }}

      - name: Create multi-arch manifest (app)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:build-${GITHUB_SHA}-amd64" \
            "$IMAGE:build-${GITHUB_SHA}-arm64"

      - name: Create multi-arch manifest (admin)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq-admin
          TAGS: ${{ steps.meta-admin.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:build-${GITHUB_SHA}-amd64" \
            "$IMAGE:build-${GITHUB_SHA}-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the published images (keyless)
        env:
          # Both images of the release. An unsigned admin image would be the weaker half of a pair an operator
          # is told to pin together — and it is the higher-privilege half (ADR 0065).
          IMAGES: ghcr.io/${{ github.repository_owner }}/veyq ghcr.io/${{ github.repository_owner }}/veyq-admin
        run: |
          set -euo pipefail
          # Resolve each manifest-list digest (the sha- tag is always produced) and sign THAT, so every channel
          # tag pointing at it (latest/<major>/<version>) is covered. The identity this produces is this file on
          # the branch that ran it — which is why the version step publishes from `main` and `release/<major>.x`
          # only. How an operator verifies it is stated once, in infra/README.md § Verifying a release, and
          # scripts/validate_release_identity.py holds that command to the branches this workflow publishes from.
          for image in $IMAGES; do
            digest="sha256:$(docker buildx imagetools inspect --raw "$image:sha-${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
            echo "Signing $image@${digest}"
            cosign sign --yes "$image@${digest}"
          done

      # One release, one name, one tree (ADR 0057 §2). The ref is created LAST, by the publish itself, so it
      # exists only for a release that actually shipped — and it is the ref at which the deployment files
      # belonging to this image can be found. The push is deliberately not forced: a tag that already exists is
      # a second publish of one release, and it must fail here too and not only in the check above.
      - name: Tag the released commit
        id: release-tag
        if: needs.version.outputs.publish_branch_tags == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"
