name: Renovate

# The self-hosted Renovate of ADR 0158, as a GitHub App of its own (decision 3), so that its pull requests start
# `Checks` like a person's. Built in stages by changes/cr-renovate.md. This is phase 1: the job only proves that the App
# and its key work. It mints an installation token and checks that the token reaches this repository and nothing else.
# It runs no Renovate and writes nothing. Phase 2 adds Renovate itself, as a dry run, and the weekly schedule.
#
# Where the key is (ADR 0158 decision 3, the CR's second invariant). The App's Client ID (a variable) and its private
# key (a secret) live in the environment `renovate`, whose deployment-branch rule admits `main` alone. So a job on any
# other branch, and any pull request's run, never receives the key, even one that edits this file. The `if:` below says
# the same thing for a reader. The token the action mints is scoped to this repository and expires within the hour; the
# action revokes it when the job ends.
#
# The App is addressed by its Client ID, not its App ID: the action marks `app-id` deprecated since v3.
on:
  workflow_dispatch:

permissions: {}

jobs:
  token:
    name: Mint the App's token and check its reach
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: renovate
    steps:
      - name: Mint the installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # The App must be installed on this repository alone (ADR 0158 decision 3). The token never reaches the log: it is
      # read by gh from the environment, and only the repository names it can see are printed.
      - name: Check that the token reaches this repository and no other
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          reach="$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')"
          echo "App ${APP_SLUG} reaches: ${reach}"
          if [ "$reach" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::The App must be installed on ${GITHUB_REPOSITORY} alone; it reaches: ${reach}"
            exit 1
          fi
