name: Renovate

# The self-hosted Renovate of ADR 0158, as a GitHub App of its own (decision 3), so that its pull requests start
# `Checks` like a person's. Renovate writes its branches, its pull requests and the Dependency Dashboard issue, for
# every pin in the tree; Dependabot proposes nothing any more. What a bump needs the
# bumped tree executed for is written by the Renovate follow (.github/workflows/renovate-follow*.yml), never here.
#
# Two configurations, kept apart. renovate.json5 at the repository root is the version policy: which updates, grouped
# how, held back why. It names no forge, so it runs unchanged on another. The `env:` of the Renovate step below is the
# operator's part: which repository, no onboarding, which commands a postUpgradeTask may run.
#
# Where the key is (ADR 0158 decision 3). The App's Client ID (a variable) and its private
# key (a secret) live in the environment `renovate`, whose deployment-branch rule admits `main` alone. So a job on any
# other branch, and any pull request's run, never receives the key, even one that edits this file. The `if:` below says
# the same thing for a reader. The token the action mints is scoped to this repository and expires within the hour; the
# action revokes it when the job ends. The App is addressed by its Client ID: the action marks `app-id` deprecated.
#
# Renovate itself is pinned by the index digest of its image (ADR 0057 § 6), passed to the action as its version, which
# the action appends to ghcr.io/renovatebot/renovate.
on:
  schedule:
    # Saturday 05:00 UTC (cron reads UTC; Dependabot's slot was 06:00 Europe/Berlin, owner 2026-11-07), so its pull
    # requests and their Checks runs are ready on Saturday, and what is merged over the weekend is in the snapshot
    # publish.yml cuts on Monday at 03:17 UTC. Twice more that morning, 07:00 and 09:00: a lookup that fails in a run
    # (Maven Central answers 429 to GitHub's shared runner addresses) makes Renovate leave every group branch as it was,
    # in a run that is still green, so a single slot would hold a group back a week; a run with nothing to do is
    # under a minute and changes nothing (renovate/webp-encoder, 2026-11-24).
    - cron: "0 5 * * 6"
    - cron: "0 7 * * 6"
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: renovate
    steps:
      - name: Mint the installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # The App must be installed on this repository alone (ADR 0158 decision 3), checked on every run before Renovate
      # gets the token. The token never reaches the log: gh reads it from the environment, and only the repository names
      # it can see are printed.
      - name: Check that the token reaches this repository and no other
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          reach="$(gh api installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')"
          echo "App ${APP_SLUG} reaches: ${reach}"
          if [ "$reach" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::The App must be installed on ${GITHUB_REPOSITORY} alone; it reaches: ${reach}"
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app.outputs.token }}
          renovate-version: 45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: debug
          # The only commands a postUpgradeTask may run (renovate.json5): pin_follow.py's five follow-ups, exactly. A
          # repository script from the default branch, run in Renovate's container; dependencies' install scripts stay
          # off (Renovate's default for a self-hosted run, `allowScripts` unset).
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/pin_follow\\.py helm$", "^python3 scripts/pin_follow\\.py openapi-generator-jar$", "^python3 scripts/pin_follow\\.py pypi-hashes scripts/requirements-release\\.txt$", "^python3 scripts/pin_follow\\.py gradle-distribution$", "^python3 scripts/pin_follow\\.py oras$"]'
