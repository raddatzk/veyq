name: Dependabot follow (derive)

# The read-only half of the Dependabot follow (scripts/dependabot_follow.py; .github/dependabot.yml's header says how
# the halves fit). It runs on Dependabot's own pull requests and holds nothing that writes: a Dependabot-triggered
# `pull_request` run gets a read-only GITHUB_TOKEN and only Dependabot secrets (read from GitHub's "Troubleshooting
# Dependabot on GitHub Actions", 2026-11-12), and this file asks for no more.
#
# It is the half that EXECUTES the bump. On a pull request that moves a Gradle build input it runs the cold-home recipe
# of src/backend/CLAUDE.md — the bumped build, its plugins, its tests — so the verification metadata is written from
# what a clean build fetches, and lists what that cold Gradle home downloaded. Both files are uploaded as an artifact;
# dependabot-follow.yml reads them as data and writes nothing it has not checked. On any other pull request it uploads
# only the record that there was nothing to derive. The image and Playwright follows need nothing executed and are
# done in dependabot-follow.yml alone.
#
# It never reads the pull request's title or body: Dependabot copies upstream release notes into them.
on:
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: dependabot-follow-derive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  derive:
    name: Derive what the bump needs (read-only)
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The cold-home write runs `help check quarkusBuild pitest` from an empty Gradle home: the backend job's cold
    # `check` alone is sized at 30 minutes (checks.yml), mutation.yml's `pitest` at 30 more.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Does the pull request move a Gradle build input?
        id: gradle
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/derived"
          base=$(git merge-base "$BASE_SHA" HEAD)
          python3 scripts/dependabot_follow.py gradle-needed --tree . --base "$base" | tee -a "$GITHUB_OUTPUT"

      # No `cache: gradle`: the empty Gradle home is the point of the recipe (a warm cache hides what a cold one fetches).
      - name: Set up Java
        if: steps.gradle.outputs.needed == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate the Gradle wrapper JAR
        if: steps.gradle.outputs.needed == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Write the verification metadata from a cold Gradle home
        if: steps.gradle.outputs.needed == 'true'
        working-directory: src/backend
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-cold-home
        run: ./gradlew --no-daemon --write-verification-metadata sha256 help check quarkusBuild pitest

      - name: Keep the written metadata and what the cold home fetched
        if: steps.gradle.outputs.needed == 'true'
        run: |
          cp src/backend/gradle/verification-metadata.xml "$RUNNER_TEMP/derived/verification-metadata.xml"
          python3 scripts/dependabot_follow.py gradle-listing --gradle-home "$RUNNER_TEMP/gradle-cold-home" \
            > "$RUNNER_TEMP/derived/cold-cache.json"

      - name: Record what was derived
        env:
          NEEDED: ${{ steps.gradle.outputs.needed }}
        run: |
          printf '{"gradle": "%s"}\n' "$NEEDED" > "$RUNNER_TEMP/derived/derived.json"

      - name: Upload what was derived
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-follow
          path: ${{ runner.temp }}/derived
          retention-days: 3
          if-no-files-found: error
