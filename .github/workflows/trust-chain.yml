name: Trust chain

# The product guards run unfiltered: on every push and every PR, docs included.
#
# They used to be a job in ci.yml, which ignores `docs/**` and `**/*.md` so a doc change does not pay for
# `./gradlew check` + `pnpm install`. That filter is right for those jobs and was wrong for this one: the guards whose
# whole purpose is validating `docs/` only fired when *code* changed. Two of the three commits that found this
# were doc-only, and would have skipped their own validation. checks.yml's `guards` job runs the same glob again,
# so the pipeline's publish can wait on it (ADR 0091 decision 2); a docs-only commit is validated here and nowhere else.
#
# One guard is the exception, and it is its own job: `validate_guard_gaps.py` tests the GUARDS, not the commit, and
# was 90 % of this workflow's time (ADR 0091 § Context). So it runs when a guard or the gap map changes — the same
# inputs its local skip hashes — and nightly in full on `main` (ADR 0091 decision 4). What that filter cannot see is
# its docstring's limit: a forgery's anchor renamed outside `scripts/` shows at the next nightly run.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Nightly, on the default branch (a schedule runs nowhere else): the guard gaps in full, whatever changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-chain:
    name: Trust-chain validation (the product guards)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The glob is the mechanism, not a convenience: a hand-written list is green on the day a tenth validator
      # lands and silently never runs it. This is `changes/README.md` § *The trust-chain guards stay green* made
      # executable — that file says every deterministic check in scripts/ gates a CR, all of them.
      #
      # What each guard asserts, and the defect that bought it, is that validator's own module docstring.
      # `scripts/` is the registry; this file does not restate it, because a restated list drifts — the list
      # that used to live here said "three" and "four" long after there were nine. The one name it carries is the
      # guard it hands to `guard-gaps` below.
      - name: Validate trust-chain guards
        run: |
          # nullglob is load-bearing, not tidiness: without it an unmatched glob hands the loop the literal
          # string "scripts/validate_*.py", so the count below reads 1 and can never fire. With it, no match
          # means no iterations — and the count is what turns "the trust chain validated nothing" from a
          # confusing python error into a red build that says so.
          shopt -s nullglob
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          count=0
          for f in scripts/validate_*.py; do
            if [ "$f" = "scripts/validate_guard_gaps.py" ]; then
              continue
            fi
            echo "--- $f"
            .venv/bin/python "$f"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no scripts/validate_*.py found — the trust chain validated nothing"
            exit 1
          fi
          echo "$count guards green"

  # Which guard-gap inputs this push or pull request touched. A schedule and a dispatch have no diff to read, and
  # `guard-gaps` runs on both regardless, so the filter is not asked there.
  guard-gap-inputs:
    name: Detect changed guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      guards: ${{ steps.filter.outputs.guards }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The inputs `validate_guard_gaps.py` hashes for its local skip (`SKIP_INPUTS`), plus this file, which says
      # how the guard runs. scripts/validate_pipeline_shape.py holds this list to that constant.
      - name: Filter changed paths
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            guards:
              - 'scripts/**'
              - '.claude/skills/trust-chain/**'
              - '.github/workflows/trust-chain.yml'

  guard-gaps:
    name: Guard gaps (the guards still bite as documented)
    needs: guard-gap-inputs
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.guard-gap-inputs.outputs.guards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Always the full run here (`--force`): a CI checkout has no stamp to skip by, and saying so keeps this job's
      # meaning from resting on the `CI` variable.
      - name: Validate the guard gaps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          .venv/bin/python scripts/validate_guard_gaps.py --force
