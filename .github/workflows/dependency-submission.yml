# The backend's resolved dependency graph, submitted to GitHub so Dependabot's alerts see every Gradle dependency the
# build resolves, transitive ones included. Dependabot reads the Gradle build files on its own (dependabot.yml), but
# what it finds there is the declared versions only; the graph this job submits is the resolved one.
#
# Two jobs on purpose. Resolving the graph runs the build's scripts and every plugin they apply; submitting it needs
# `contents: write`. So the job that runs Gradle holds a read-only token and hands the graph on as an artifact, and the
# job that holds the write token runs no Gradle at all - the action's split for exactly this
# (`generate-and-upload`, then `download-and-submit`). A tampered dependency that runs in the first job meets a
# read-only token.
#
# Only `src/backend/` is a build to submit: the repository root's Gradle build is the dev launcher, which resolves no
# dependency that ships (CLAUDE.md § Repository shape).
#
# The graph plugin comes in through an init script, and `src/backend/gradle/verification-metadata.xml` lists no entry
# for it (`grep -c dependency-graph src/backend/gradle/verification-metadata.xml` -> 0 on 2026-11-05); the first runs on
# GitHub (2026-11-05, run 42030101864 and the next) were green with verification on, so it does not reach that
# classpath. Should a later version be refused there, add the plugin's checksums to the metadata; never answer it with
# `--dependency-verification lenient`.
name: Dependency submission

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Resolve the backend's dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Resolve the graph and keep it as an artifact
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # Which resolutions are `runtime` and which `development`, so an alert says whether its dependency ships. The
        # action has no input for it at this pin, but the graph plugin it applies (github-dependency-graph-gradle-plugin
        # 1.5.0, the action's default) reads these two from the environment: a resolution is `runtime` when its project
        # path AND its configuration name each match in full (Kotlin `Regex.matches`), every other one `development`.
        # Nothing is excluded — a vulnerable build tool still alerts, labelled development. `runtime` is what the
        # fast-jar ships: the composition and its modules' `runtimeClasspath`, and Quarkus' own
        # `quarkusProd(Base)RuntimeClasspathConfiguration`, the one the root's `thirdPartyLicenses` reads as "what
        # Quarkus packages". buildSrc (`:buildSrc`), the build scripts' `classpath`, tests, PIT and dev mode stay
        # development. A new application is `:apps:<name>` and is matched with no edit here.
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_PROJECTS: ":|:core|:apps:[^:]+"
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: "runtimeClasspath|quarkusProd(Base)?RuntimeClasspathConfiguration"
        with:
          build-root-directory: src/backend
          dependency-graph: generate-and-upload
          # The action's default, `enhanced`, is its "commercial caching service (gradle-actions-caching)" (action.yml at
          # this pin); `basic` is its open-source one on the GitHub Actions cache. CLAUDE.md: no closed dependency.
          cache-provider: basic

  submit:
    name: Submit the backend's dependency graph
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Submit the graph the first job resolved
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
          # This job runs no Gradle, so it has nothing to cache - and so never reaches the commercial default above.
          cache-disabled: true
