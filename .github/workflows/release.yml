name: Release

# A release PROMOTES a snapshot (ADR 0091 decision 5): the images every lane tested get the release's names and a
# release signature, and nothing is built again. The owner starts it in two clicks (owner 2026-11-06):
#
#   1. GitHub's release page → Draft a new release → choose the tag `snapshot-<major>.<minor>` of the snapshot to
#      release (every snapshot `ci.yml` published — weekly, or by a dispatch — set one) → write the notes → Save draft.
#   2. Actions → Release → Run workflow, on the branch the snapshot came from (`main`; `release/<major>.x` for a fix of
#      a previous major). `unscheduled_major` marks an unscheduled major (ADR 0085).
#
# GitHub starts no workflow for a draft (its events page: "Workflows are not triggered for the created, edited, or
# deleted activity types for draft releases"), and a published immutable release takes no asset, so the draft cannot
# start this by itself and the run publishes it last.
#
# This file is the RELEASE identity: keyless signing names the workflow that signed, so `cosign verify` with
# `.github/workflows/release.yml` on `main` or `release/<major>.x` (site/src/content/docs/run/verify-a-release.md,
# `veyqctl`) is what tells a release from a snapshot, which `ci.yml` signs. Renaming this file changes it, and
# scripts/validate_release_identity.py holds the page and `veyqctl` to it.
#
# Jobs, each with only what it writes:
#   check     contents: write (listing a draft needs push access; it writes nothing), packages: read
#             — scripts/promote.py decides; every refusal is named in the run and, by `refused`, in the draft's notes.
#   promote   packages: write, id-token: write — the snapshot's indexes get `<version>`, the release signature, the
#             chart packaged as `<version>` from the snapshot's commit, and the release files, produced from that
#             commit, checked against the attested asset set and signed.
#   publish   contents: write — the git tag `v<version>`, the draft moved onto it with every file, the draft
#             published LAST, then the snapshot's tag removed.
#   channels  packages: write — `<major>` and, from `main`, `latest`, only after the release is published.
#   refused   contents: write — on a failure before publication: the git tag and the draft put back, and why written
#             into the draft's notes. A failed promotion leaves a draft, never a release.
on:
  workflow_dispatch:
    inputs:
      unscheduled_major:
        description: "Mark this release as an unscheduled major (a security fix that needed a removal, ADR 0085) in its manifest — refused unless it is the first release of its major"
        type: boolean
        default: false

# One promotion at a time, and never beside the snapshot retention that will share this group.
concurrency:
  group: veyq-release
  cancel-in-progress: false

permissions: {}

# The Helm `ci.yml` pins (its comment says how the pin was checked); validate_release_identity.py holds the two equal.
env:
  HELM_VERSION: v4.0.1
  HELM_SHA256: e0365548f01ed52a58a1181ad310b604a3244f59257425bb1739499372bdff60

jobs:
  check:
    name: Check the draft and the snapshot it names
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub lists draft releases only to push access; this job writes nothing
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      commit: ${{ steps.check.outputs.commit }}
      release_id: ${{ steps.check.outputs.release_id }}
      latest: ${{ steps.check.outputs.latest }}
      chart: ${{ steps.check.outputs.chart }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The snapshot's commit, every release tag and the count of the minor need the whole history.
          fetch-depth: 0

      # PyYAML as exact, hashed wheels only (scripts/requirements-release.txt): this job can rewrite drafts, and code
      # PyPI served unpinned would run with that token (validate_release_identity.py assertion 15).
      - name: Set up the scripts' Python
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/requirements-release.txt

      # The decisions are proven before they decide: every refusal of scripts/promote.py, against a fake registry.
      - name: Promotion self-test
        run: |
          "${RUNNER_TEMP}/venv/bin/python" scripts/promote_selftest.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Read the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[]' > "${RUNNER_TEMP}/releases.jsonl"
          echo "$(wc -l < "${RUNNER_TEMP}/releases.jsonl") release(s), drafts among them: $(jq -r 'select(.draft) | .tag_name' "${RUNNER_TEMP}/releases.jsonl" | paste -sd, -)"

      - name: Decide the promotion
        id: check
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          UNSCHEDULED_MAJOR: ${{ inputs.unscheduled_major }}
        run: |
          set -euo pipefail
          unscheduled=()
          if [[ "$UNSCHEDULED_MAJOR" == "true" ]]; then unscheduled=(--unscheduled); fi
          "${RUNNER_TEMP}/venv/bin/python" scripts/promote.py check --releases "${RUNNER_TEMP}/releases.jsonl" \
            --ref "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --registry "$REGISTRY" \
            --out "${RUNNER_TEMP}/promotion" ${unscheduled[@]+"${unscheduled[@]}"}

      # The plan for the next jobs, and on a refusal the draft and the reason for `refused`.
      - name: Keep the decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: warn
          retention-days: 30

  promote:
    name: Name, sign and package the release (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC: the release identity
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PyYAML as exact, hashed wheels only: this job holds the release identity's OIDC token, and code PyPI served
      # unpinned would sign whatever it liked (validate_release_identity.py assertion 15).
      - name: Set up the scripts' Python
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/requirements-release.txt

      - name: Fetch the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion
          path: ${{ runner.temp }}/promotion

      # The release's chart and files come from the snapshot's own commit, never from this branch's tip.
      - name: Check out the snapshot's commit
        run: git worktree add --detach "${RUNNER_TEMP}/snapshot" "$COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm (pinned tarball)
        run: |
          set -euo pipefail
          tarball="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "https://get.helm.sh/${tarball}"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" linux-amd64/helm
          echo "${RUNNER_TEMP}/linux-amd64" >> "$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # `<version>` on the snapshot's index, and nothing else yet: `<major>` and `latest` move only once the release is
      # published (`channels`). A single index source is copied as it is (Buildx's carbon copy), and every name is read
      # back: it must be the very digest the lanes tested.
      - name: Give the snapshot its release name
        run: |
          set -euo pipefail
          for image in veyq veyq-admin veyq-tools; do
            digest="$(jq -r --arg i "$image" '.digests[$i]' "${RUNNER_TEMP}/promotion/plan.json")"
            docker buildx imagetools create -t "${REGISTRY}/${image}:${VERSION}" "${REGISTRY}/${image}@${digest}"
            got="sha256:$(docker buildx imagetools inspect --raw "${REGISTRY}/${image}:${VERSION}" | sha256sum | cut -d' ' -f1)"
            if [[ "$got" != "$digest" ]]; then
              echo "${REGISTRY}/${image}:${VERSION} is ${got}, not the tested ${digest}" >&2
              exit 1
            fi
            echo "${REGISTRY}/${image}:${VERSION} = ${digest}"
          done

      # The release signature, beside the snapshot's: the same digests, now signed by this file — what Verify a release
      # and `veyqctl` accept.
      - name: Sign the release's images (keyless)
        run: |
          set -euo pipefail
          for image in veyq veyq-admin veyq-tools; do
            digest="$(jq -r --arg i "$image" '.digests[$i]' "${RUNNER_TEMP}/promotion/plan.json")"
            echo "Signing ${REGISTRY}/${image}@${digest}"
            cosign sign --yes "${REGISTRY}/${image}@${digest}"
          done

      # The chart from the snapshot's commit as `<version>` (ADR 0064): its `appVersion` is the image tag its values
      # default to, so the release's chart names the release's images. Kept when a promotion of this snapshot that failed
      # half-way pushed it already (`check` refused it otherwise).
      - name: Package and push the chart
        id: chart
        env:
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.check.outputs.chart }}
        run: |
          set -euo pipefail
          if [[ "$STATE" == "present" ]]; then
            digest="sha256:$(docker buildx imagetools inspect --raw "${REGISTRY}/charts/veyq:${VERSION}" | sha256sum | cut -d' ' -f1)"
            echo "the chart ${VERSION} is this promotion's already: ${digest}"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package "${RUNNER_TEMP}/snapshot/infra/kubernetes/charts/veyq" --version "$VERSION" --app-version "$VERSION" --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/veyq-${VERSION}.tgz" "$CHART_REGISTRY" 2>&1 | tee "${RUNNER_TEMP}/chart-push.log"
          # Measured with Helm 4.0.1: a push prints `Digest: sha256:<64 hex>`, the sha256 of the pushed manifest.
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "${RUNNER_TEMP}/chart-push.log")"
          if [[ -z "$digest" ]]; then
            echo "helm push printed no digest, so there is nothing to sign" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the release's chart (keyless)
        env:
          CHART: ghcr.io/${{ github.repository_owner }}/charts/veyq
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing ${CHART}@${DIGEST}"
          cosign sign --yes "${CHART}@${DIGEST}"

      # The release as files (ADR 0096 decision 3), produced by the snapshot commit's own producer with the three images
      # by `<version>@<digest>`; scripts/promote.py holds them to the plan — the asset set the lanes installed, the
      # digests, the major entry the tools image bakes — and only then are `veyqctl` and the manifest signed, into the
      # bundle names the producer reserves. Nothing touches the manifest after its signature.
      - name: Produce and sign the release's files
        env:
          UNSCHEDULED_MAJOR: ${{ inputs.unscheduled_major }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          app="${REGISTRY}/veyq:${VERSION}@$(jq -r '.digests.veyq' "${RUNNER_TEMP}/promotion/plan.json")"
          admin="${REGISTRY}/veyq-admin:${VERSION}@$(jq -r '.digests["veyq-admin"]' "${RUNNER_TEMP}/promotion/plan.json")"
          tools="${REGISTRY}/veyq-tools:${VERSION}@$(jq -r '.digests["veyq-tools"]' "${RUNNER_TEMP}/promotion/plan.json")"
          unscheduled=""
          if [[ "$UNSCHEDULED_MAJOR" == "true" ]]; then unscheduled="--unscheduled"; fi
          "${RUNNER_TEMP}/venv/bin/python" "${RUNNER_TEMP}/snapshot/scripts/release_assets.py" "$out" \
            --app "$app" --admin "$admin" --tools "$tools" ${unscheduled:+"$unscheduled"}
          "${RUNNER_TEMP}/venv/bin/python" scripts/promote.py assets --dir "${out}/v${VERSION}" \
            --plan "${RUNNER_TEMP}/promotion/plan.json" --registry "$REGISTRY"
          cosign sign-blob --yes --bundle "${out}/v${VERSION}/veyqctl.bundle" "${out}/v${VERSION}/veyqctl"
          cosign sign-blob --yes --bundle "${out}/v${VERSION}/manifest.json.bundle" "${out}/v${VERSION}/manifest.json"

      - name: Keep the release's files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release/v${{ needs.check.outputs.version }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the draft as the release (last)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - check
      - promote
    permissions:
      contents: write # the git tag `v<version>` and the GitHub Release; nothing in the registry
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tagged: ${{ steps.tag.outputs.tagged }}
      mode: ${{ steps.draft.outputs.mode }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}
      DRAFT_ID: ${{ needs.check.outputs.release_id }}
      LATEST: ${{ needs.check.outputs.latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion
          path: ${{ runner.temp }}/promotion

      - name: Fetch the release's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/files

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The files are checked exactly as `veyqctl` will check them — its own issuer and identity, read from its source —
      # and as an operator fetching `veyqctl` by hand will, before any of them reaches GitHub: a release whose manifest
      # `veyqctl` refuses is never published.
      - name: Verify the files as veyqctl will
        id: identity
        run: |
          set -euo pipefail
          python3 scripts/promote.py release-identity
          issuer="$(python3 scripts/promote.py release-identity | sed -n 's/^issuer=//p')"
          identity="$(python3 scripts/promote.py release-identity | sed -n 's/^identity=//p')"
          files="${RUNNER_TEMP}/files"
          for blob in manifest.json veyqctl; do
            cosign verify-blob --bundle "${files}/${blob}.bundle" --certificate-oidc-issuer "$issuer" \
              --certificate-identity-regexp "$identity" "${files}/${blob}"
          done
          listed="$(jq -r '.assets | keys[]' "${files}/manifest.json" | sort)"
          present="$(find "$files" -maxdepth 1 -type f -printf '%f\n' \
            | grep -vx -e manifest.json -e manifest.json.bundle -e veyqctl.bundle | sort)"
          if [[ "$listed" != "$present" ]]; then
            echo "the files are not the manifest's assets: listed [${listed//$'\n'/ }], present [${present//$'\n'/ }]" >&2
            exit 1
          fi

      # The release's one git ref (ADR 0057 §2), on the snapshot's commit. Not forced: a `v<version>` on another commit
      # is red here. On this commit it is a promotion that failed before publication and runs again.
      - name: Tag the released commit
        id: tag
        run: |
          set -euo pipefail
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$COMMIT" ]]; then
            echo "refs/tags/v${VERSION} names ${existing}, not ${COMMIT}" >&2
            exit 1
          fi
          # Through the REST API, never `git push`: GitHub refuses a GITHUB_TOKEN push of a ref whose commit's
          # .github/workflows/ differs from every branch head ("refusing to allow a GitHub App to create or update
          # workflow"), and a promoted snapshot's commit is behind main as a rule (ci.yml's snapshot-tag met it first,
          # 2026-11-07). Exists already → 422.
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field "ref=refs/tags/v${VERSION}" --raw-field "sha=${COMMIT}" > /dev/null
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # The owner's draft moves onto `v<version>` (REST "Update a release": `tag_name`, `target_commitish`). Should
      # GitHub refuse to move a draft — its docs say neither way — a new draft on `v<version>` carries the owner's notes
      # instead, and the owner's draft is deleted once the release is out.
      - name: Move the draft onto the release's tag
        id: draft
        run: |
          set -euo pipefail
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" -f tag_name="v${VERSION}" \
              -f target_commitish="$COMMIT" -f name="veyq ${VERSION}" > "${RUNNER_TEMP}/patched.json"; then
            if [[ "$(jq -r '.tag_name + " " + (.draft|tostring)' "${RUNNER_TEMP}/patched.json")" != "v${VERSION} true" ]]; then
              echo "the draft did not move onto v${VERSION}: $(jq -c '{tag_name, draft}' "${RUNNER_TEMP}/patched.json")" >&2
              exit 1
            fi
            echo "mode=moved" >> "$GITHUB_OUTPUT"
            echo "release_id=${DRAFT_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::GitHub refused to move the draft onto v${VERSION}; a new draft carries its notes"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" --jq '.body // ""' > "${RUNNER_TEMP}/notes.md"
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "veyq ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          new_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id" | head -n 1)"
          if [[ -z "$new_id" ]]; then
            echo "the new draft on v${VERSION} is not listed" >&2
            exit 1
          fi
          echo "mode=replaced" >> "$GITHUB_OUTPUT"
          echo "release_id=${new_id}" >> "$GITHUB_OUTPUT"

      # Every file onto the draft, while it is a draft: an immutable release takes no asset once it is published (ADR
      # 0096 decision 3). Then the draft's files are read back and must be exactly these.
      - name: Attach the files to the draft
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" --repo "$GITHUB_REPOSITORY" --clobber "${RUNNER_TEMP}/files"/*
          attached="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[].name' | sort)"
          expected="$(find "${RUNNER_TEMP}/files" -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$attached" != "$expected" ]]; then
            echo "the draft carries [${attached//$'\n'/ }], not [${expected//$'\n'/ }]" >&2
            exit 1
          fi

      # LAST: the draft becomes the release. From here on, with immutable releases on, its files and its tag cannot
      # change. `latest` on GitHub only from `main` (scripts/promote.py: then it is the newest release there is).
      - name: Publish the release
        id: publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest="$LATEST" \
            > "${RUNNER_TEMP}/published.json"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "published $(jq -r '.html_url' "${RUNNER_TEMP}/published.json"), immutable: $(jq -r '.immutable' "${RUNNER_TEMP}/published.json")"
          if [[ "$(jq -r '.immutable' "${RUNNER_TEMP}/published.json")" != "true" ]]; then
            echo "::warning::v${VERSION} is published but NOT immutable — switch on immutable releases in the repository's settings (ADR 0096 decision 3)"
          fi

      # After publication, only clean-up: the snapshot's tag (the release page offers promotable snapshots only), and
      # the owner's draft where a new one replaced it.
      - name: Remove the snapshot's tag and a replaced draft
        env:
          MODE: ${{ steps.draft.outputs.mode }}
        run: |
          set -euo pipefail
          git push origin --delete "refs/tags/snapshot-${VERSION}"
          if [[ "$MODE" == "replaced" ]]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}"
          fi

  channels:
    name: Move the channels (<major>, latest) onto the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - publish
    if: always() && needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.check.outputs.version }}
      MAJOR: ${{ needs.check.outputs.major }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the release's own name, so a channel can only ever point at a published release; read back like the name.
      - name: Point the channels at the release
        run: |
          set -euo pipefail
          for image in veyq veyq-admin veyq-tools; do
            digest="sha256:$(docker buildx imagetools inspect --raw "${REGISTRY}/${image}:${VERSION}" | sha256sum | cut -d' ' -f1)"
            tags=(-t "${REGISTRY}/${image}:${MAJOR}")
            if [[ "$LATEST" == "true" ]]; then tags+=(-t "${REGISTRY}/${image}:latest"); fi
            docker buildx imagetools create "${tags[@]}" "${REGISTRY}/${image}@${digest}"
            for channel in "$MAJOR" $([[ "$LATEST" == "true" ]] && echo latest); do
              got="sha256:$(docker buildx imagetools inspect --raw "${REGISTRY}/${image}:${channel}" | sha256sum | cut -d' ' -f1)"
              if [[ "$got" != "$digest" ]]; then
                echo "${REGISTRY}/${image}:${channel} is ${got}, not the release's ${digest}" >&2
                exit 1
              fi
            done
            echo "${REGISTRY}/${image}: ${MAJOR}$([[ "$LATEST" == "true" ]] && echo ', latest') = ${digest}"
          done

  refused:
    name: Put the draft back and write why into it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - promote
      - publish
    if: >-
      always() && needs.publish.outputs.published != 'true'
      && (needs.check.result == 'failure' || needs.promote.result == 'failure' || needs.publish.result == 'failure')
    permissions:
      contents: write # the draft's notes, and the git tag `v<version>` this run pushed before it failed
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      DRAFT_ID: ${{ needs.check.outputs.release_id }}
      TAGGED: ${{ needs.publish.outputs.tagged }}
      MODE: ${{ needs.publish.outputs.mode }}
      NEW_ID: ${{ needs.publish.outputs.release_id }}
      CHECK: ${{ needs.check.result }}
      PROMOTE: ${{ needs.promote.result }}
      PUBLISH: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the decision
        id: decision
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion
          path: ${{ runner.temp }}/promotion

      # Nothing is published, so everything this run wrote outside the registry goes back: the draft onto its snapshot
      # tag (or the new draft removed), and the git tag `v<version>`. What it wrote to the registry — `<version>` on the
      # tested digests, signatures, the chart — a run again accepts and completes (`check`'s resume rule).
      - name: Put the draft and the tag back
        if: needs.publish.result == 'failure'
        run: |
          set -euo pipefail
          if [[ "$MODE" == "replaced" && -n "$NEW_ID" ]]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${NEW_ID}"
          elif [[ "$MODE" == "moved" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" -f tag_name="snapshot-${VERSION}" > /dev/null
          fi
          if [[ "$TAGGED" == "true" ]]; then
            git push origin --delete "refs/tags/v${VERSION}"
          fi

      - name: Write why into the draft
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/promotion"
          if [[ ! -f "${dir}/notify.json" ]]; then
            echo "no draft to write into (the run failed before it read one): ${RUN_URL}"
            exit 0
          fi
          reason="${dir}/refusal.txt"
          if [[ ! -s "$reason" ]]; then
            failed=check
            if [[ "$PROMOTE" == failure ]]; then failed=promote; fi
            if [[ "$PUBLISH" == failure ]]; then failed=publish; fi
            printf 'the %s job failed (check %s, promote %s, publish %s); its log says where. Nothing was published.\n' \
              "$failed" "$CHECK" "$PROMOTE" "$PUBLISH" > "${RUNNER_TEMP}/reason.txt"
            reason="${RUNNER_TEMP}/reason.txt"
          fi
          for id in $(jq -r '.[]' "${dir}/notify.json"); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq '.body // ""' > "${RUNNER_TEMP}/body.md"
            python3 scripts/promote.py note --body "${RUNNER_TEMP}/body.md" --reason "$reason" --run "$RUN_URL" \
              > "${RUNNER_TEMP}/new-body.md"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F body=@"${RUNNER_TEMP}/new-body.md" > /dev/null
            echo "wrote why into draft ${id}"
          done
