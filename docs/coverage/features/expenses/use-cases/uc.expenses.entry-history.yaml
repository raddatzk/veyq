useCase: uc.expenses.entry-history
feature: expenses
title: See what changed, and restore a deleted entry
# Built by cr-expenses-ledger (inbox #325, ADR 0108): :apps:expenses on the backend (PotRevisionStore's append,
# erasure and reads, the guest gate and record, the erasers, the re-key participant, the ITEM report), features/expenses on
# the web (the domain under domain/, run through contracts/expenses/v1-vectors.json and the real crypto; the Pot page).
# `past-the-retention-a-line-without-receipts` came with the receipts' purge (cr-expenses-receipts, ADR 0108 decision 7):
# a tombstone's read carries when its receipts go, and past it no restore is offered.
acceptanceCriteria:
  - id: history-shows-every-revision
    text: "An entry's history lists every revision the server holds, newest first, with what changed and when; an edited entry says so in the list."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestReadsNoWriter_aMemberReadsEachOne, PotSliceTest.theMembersListIsAConditionalKeysetDelta]
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/domain/ledger.test.ts]
  - id: writer-names-for-members-only
    text: "A member sees each revision's writer (a member's name or a link guest's name, as the platform recorded it); a guest is served no writer's name."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestReadsNoWriter_aMemberReadsEachOne]
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/components/PotDetail.guest.test.ts, src/features/expenses/rights.test.ts]
  - id: deleted-entries-are-restorable
    text: "Deleted entries are a list of the Pot's own; a writer restores one within the trash retention as a new revision, live again in the list and the balances."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly]
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/domain/ledger.test.ts]
  - id: past-the-retention-a-line-without-receipts
    text: "Past the trash retention a deleted entry stays a line in the history and restore is no longer offered; its receipts are erased."
    coverage:
      backend:
        integration: [PotReceiptSliceTest.aDroppedADeletedAndAnOrphanedReceiptGoAfterTheRetentionAndNotBefore_aRestoredEntrysStay]
      web:
        unit: [src/features/expenses/components/PotDetail.receipts.test.ts, src/features/expenses/domain/receiptRules.test.ts]
    gaps:
      - surface: web
        reason: "The cut-off is unit-tested only: PotDetail.receipts.test.ts (restorable until the tombstone's purge time, not after it) and receiptRules.test.ts (purgeAfterOf and restoreOffered). Lane L1 runs on the default trash retention, so no entry in its browser pass is ever past it."
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts`) drives `history-shows-every-revision`,
    `writer-names-for-members-only` and `deleted-entries-are-restorable` in Chromium, all in English and again in
    German, against the release candidate's two images installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion: three versions by two members listed with their names, a link guest's entry named by the name it
    gave in a member's history, no writer named in any history the guest reads, a deleted entry restored from
    Deleted entries. Green only in local runs of the lane (the V1 heavy stage), and ADR 0040 admits `stack` refs
    only once a CI run's log shows the suite executed.
