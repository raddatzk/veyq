useCase: uc.expenses.manage-participants
feature: expenses
title: Manage the people of a Pot
# Built by cr-expenses-ledger (inbox #325, ADR 0108): :apps:expenses on the backend (PotRevisionStore's append,
# erasure and reads, the guest gate and record, the erasers, the re-key participant, the ITEM report), features/expenses on
# the web (the domain under domain/, run through contracts/expenses/v1-vectors.json and the real crypto; the Pot page).
acceptanceCriteria:
  - id: writers-add-and-rename
    text: "A member or a READ_WRITE guest adds a participant (a record whose id the client mints) and renames one (its next revision); no entry changes."
    coverage:
      backend:
        integration: [PotSliceTest.aStaleAppendLandsNothingOfItsBatch_aFreshOneLandsAll, PotSliceTest.aGuestBatchRecordsOneGuestWritePerRevision_aStaleOneNone]
      web:
        unit: [src/features/expenses/components/PotDetail.guest.test.ts, src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/rights.test.ts]
  - id: member-deactivates-a-settled-participant
    text: "A member deactivates a participant with a zero balance and activates it again; entries keep its name, new entries and the overviews do not offer it; neither is offered while the balance is not zero."
    coverage:
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/people.test.ts, src/features/expenses/domain/potApi.wire.test.ts]
  - id: member-deletes-and-the-name-is-erased
    text: "A member deletes a settled participant by a sealed erasure revision, and the server erases that record's earlier revisions in the same transaction; entries show it as deleted people, and no row the server holds keeps any spelling of its name."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly, PotErasureLedgerSliceTest.anErasureWritesItsLineAndItsReapplicationErasesTheRestoredNameOnly]
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/people.test.ts]
  - id: member-removes-an-unnamed-participant
    text: "A member removes a participant no revision of any entry names, by the same erasure; it appears nowhere afterwards. Remove is not offered for a named one."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly]
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts]
  - id: erasure-is-a-members-only
    text: "The server takes the erasure from a member only and refuses it from a link; a guest's page offers add and rename only."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly]
      web:
        unit: [src/features/expenses/components/PotDetail.guest.test.ts, src/features/expenses/rights.test.ts]
  - id: an-unsettling-edit-shows-the-participant-again
    text: "An edit of an old entry that unsettles a deactivated or deleted participant shows it again in the balances and the settle-up, by name or as deleted people."
    coverage:
      web:
        unit: [src/features/expenses/people.test.ts, src/features/expenses/domain/ledger.test.ts]
  - id: a-writer-adds-a-member-or-a-name
    text: "A member adds a participant that is a member of the space (its record holds the user id and the display name sealed at adding) or a name; a member already in the Pot is not offered again and a second record for them is refused; a link guest's view adds a name only and calls no authenticated client."
    coverage:
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/components/PotDetail.guest.test.ts, src/features/expenses/people.test.ts, src/features/expenses/domain/memberParticipants.test.ts, src/features/expenses/rights.test.ts]
  - id: a-member-participant-reads-by-who-looks
    text: "A member's view shows a member participant by the current display name and picture, and one the space no longer lists as a former member by the name sealed at adding, its entries standing; a link guest's view shows the sealed name and no picture."
    coverage:
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/components/PotDetail.guest.test.ts, src/features/expenses/people.test.ts]
  - id: a-participant-never-changes-kind
    text: "A participant's kind is its record's first revision's: a reader ignores a later revision that adds, drops or changes the member, and the writer refuses one and carries the member along on every later revision (a deactivation included)."
    coverage:
      web:
        unit: [src/features/expenses/domain/memberParticipants.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: the-member-field-is-additive
    text: "The member field is optional and additive in the entry format v1: a member participant round-trips, a record without it reads as a name, and unknown fields beside or inside it are dropped."
    coverage:
      web:
        unit: [src/features/expenses/domain/format.test.ts]
  - id: a-member-id-stays-in-its-tenant
    text: "A member's download carries a member participant's user id with its tenant; an import into the same tenant keeps the member, one into another tenant makes it the sealed name; a link guest's download carries no member id; an archive whose member ids lack their tenant, repeat, or sit on a deleted person is refused."
    coverage:
      web:
        unit: [src/features/expenses/exportImport.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses/expenses-pot.spec.ts`) drives `writers-add-and-rename` (a
    link guest adds a person), `member-deactivates-a-settled-participant`, `member-deletes-and-the-name-is-erased`
    and `member-removes-an-unnamed-participant` in Chromium, in English (ADR 0090 decision 9), against the release
    candidate's two images installed through `veyqctl` (ADR 0090), each test tagged with its criterion: once
    settled, a person deactivated, activated and deleted (their entries name "deleted people"), one no entry names
    removed, neither offered for a new entry. No browser case adds a member participant yet (inbox #783's criteria
    are unit-covered). Green only in local runs of the lane (the V1 heavy stage), and ADR
    0040 admits `stack` refs only once a CI run's log shows the suite executed.
