useCase: uc.expenses.balances
feature: expenses
title: See who owes whom, settle up, and see where the money went
# Built by cr-expenses-ledger (inbox #325, ADR 0108): :apps:expenses on the backend (PotRevisionStore's append,
# erasure and reads, the guest gate and record, the erasers, the re-key participant, the ITEM report), features/expenses on
# the web (the domain under domain/, run through contracts/expenses/v1-vectors.json and the real crypto; the Pot page).
# `who-am-i-stays-on-the-device` by inbox #541 (features/expenses/whoAmI.ts).
acceptanceCriteria:
  - id: balances-from-the-live-entries
    text: "Each participant's balance is what they paid and received against their share of every expense and refund, transfers included, computed in the client from the live entries."
    coverage:
      web:
        unit: [src/features/expenses/domain/ledger.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: settle-up-is-greedy-and-deterministic
    text: "The settle-up suggests at most one transfer fewer than there are people, by the greedy rule with ties by join order, the same on every device; a writer records one or all as transfer entries."
    coverage:
      web:
        unit: [src/features/expenses/domain/ledger.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: overviews-by-category-and-person
    text: "The overviews show cost per category, per person (paid and share side by side) and category by person; refunds count against their category, transfers are not costs."
    coverage:
      web:
        unit: [src/features/expenses/domain/ledger.test.ts]
  - id: who-am-i-stays-on-the-device
    text: "The viewer's choice of who they are marks their row you in the balances and the overview, for a member and a guest alike, is kept in this browser per Pot and per account (or per guest), and never leaves the device: no request carries it."
    coverage:
      web:
        unit: [src/features/expenses/components/PotDetail.test.ts, src/features/expenses/components/PotDetail.guest.test.ts]
gaps:
  backend: "No part here: every figure is computed in the client from the opened revisions (ADR 0108 decision 9); the server stores and serves them, covered under uc.expenses.record-entries."
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts`) drives `balances-from-the-live-
    entries`, `settle-up-is-greedy-and-deterministic`, `overviews-by-category-and-person` and
    `who-am-i-stays-on-the-device` in Chromium, in
    English, with the first two again in the German pass (ADR 0090 decision 9), against the release candidate's two images installed through `veyqctl` (ADR 0090),
    each test tagged with its criterion: the vectors' "trip" Pot typed in shows the vector's balances and settle-up
    (each amount formatted for the language), the overview's paid and share columns each sum to the costs, the
    settle-up recorded in one batch settles everyone, a member and a guest each marked as who they chose (kept over a
    reload, no request carrying it), and the Pot at 375 px scrolls only down. Green only in local
    runs of the lane (the V1 heavy stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite
    executed.
