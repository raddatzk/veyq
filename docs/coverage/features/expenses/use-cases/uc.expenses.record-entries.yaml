useCase: uc.expenses.record-entries
feature: expenses
title: Record, edit and delete entries
# Built by cr-expenses-ledger (inbox #325, ADR 0108): :apps:expenses on the backend (PotRevisionStore's append,
# erasure and reads, the guest gate and record, the erasers, the re-key participant, the ITEM report), features/expenses on
# the web (the domain under domain/, run through contracts/expenses/v1-vectors.json and the real crypto; the Pot page).
acceptanceCriteria:
  - id: an-entry-is-a-sealed-padded-revision
    text: "An expense, a refund, a transfer and a participant are each a revision sealed as an expense-entry field under a key of its own (K_rev), K_rev wrapped under the Pot key by expense-entry-key bound to scope, node, entry and revision; padded to a size class and at most 16 KiB; the server cannot tell the kinds apart."
    coverage:
      backend:
        integration: [PotSliceTest.aBatchOutsideItsContractIsRefusedWhole_andARecordBelongsToOnePot]
      web:
        unit: [src/features/expenses/domain/codec.test.ts, src/features/expenses/domain/format.test.ts]
  - id: revision-n-plus-one-or-stale
    text: "The server takes revision n+1 only where n is the entry's latest and answers anything else 409 stale_revision; two concurrent edits never overwrite each other, and the editor shows the current revision before saving again."
    coverage:
      backend:
        integration: [PotSliceTest.aStaleAppendLandsNothingOfItsBatch_aFreshOneLandsAll, PotAppendRaceSliceTest.aBatchOverRecordsAnotherHoldsWaitsAndIsStale_inEitherOrderOfItsRecords, PotAppendRaceSliceTest.aNewRecordAppendedTwiceAtOnceLandsOnceAndTheOtherIsStale]
      web:
        unit: [src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/components/PotDetail.test.ts]
    gaps:
      - surface: backend
        reason: "The race refs are green on H2 and in a local run of scripts/run_backend_races_on_mariadb.py on MariaDB (2026-10-25, inbox #544); CI's backend-races job, which would make that a standing claim, has not run yet (no remote, #317)."
  - id: allocation-and-rounding-are-exact-and-equal-everywhere
    text: "Splits (equal, shares, exact) and line items with the rest spread in proportion or equally are computed in minor units with exact arithmetic, converted once and allocated by largest remainder with ties by join order, so every device computes the same shares; a conformance table of entries and expected shares pins it."
    coverage:
      web:
        unit: [src/features/expenses/domain/money.test.ts, src/features/expenses/domain/ledger.test.ts, src/features/expenses/entryForm.test.ts]
  - id: an-entry-that-does-not-add-up-is-not-saved
    text: "Payers' amounts that differ from the total, exact amounts that do not sum to it, line items above it, or a revision above 16 KiB are refused by the editor before anything is sent."
    coverage:
      backend:
        integration: [PotSliceTest.aBatchOutsideItsContractIsRefusedWhole_andARecordBelongsToOnePot]
      web:
        unit: [src/features/expenses/entryForm.test.ts, src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/domain/ledger.test.ts, src/features/expenses/domain/codec.test.ts]
  - id: delete-is-a-tombstone-revision
    text: "A delete is a tombstone revision the server sees as such; the entry leaves the list and the balances and moves to the Pot's deleted entries."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly]
      web:
        unit: [src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/domain/ledger.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: open-views-follow-every-write
    text: "Every writer bumps the Pot's item revision in its transaction, so an open view of the Pot, a member's or a guest's, learns of each write on its next poll."
    coverage:
      backend:
        unit: [NodeItemsRevisionBumpsTest.everyListedWriterBumps, NodeItemsRevisionBumpsTest.noUnlistedPublicFunctionOfAWriterFileWritesRows]
        integration: [PotSliceTest.theMembersListIsAConditionalKeysetDelta, PotSliceTest.aGuestReadsNoWriter_aMemberReadsEachOne]
      web:
        unit: [src/features/expenses/domain/potApi.wire.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts`) drives `allocation-and-rounding-are-
    exact-and-equal-everywhere`, `revision-n-plus-one-or-stale` and `delete-is-a-tombstone-revision` in Chromium,
    all in English and again in German, against the release candidate's two images installed through `veyqctl` (ADR
    0090), each test tagged with its criterion: the nine entries of the vectors' "trip" Pot typed into the editor
    (equal, two payers, a typed rate, line items with either rest, shares, exact amounts, a refund, a transfer); a
    second member's save while the first's editor is open, the first's save then answered 409 and shown the other
    version, saved again on top; an entry deleted and restored. Green only in local runs of the lane (the V1 heavy
    stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed.
