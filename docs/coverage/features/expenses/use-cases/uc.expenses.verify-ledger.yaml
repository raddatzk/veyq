useCase: uc.expenses.verify-ledger
feature: expenses
title: A Pot's reader notices a missing revision
# Built by cr-expenses-ledger (inbox #325, ADR 0108): :apps:expenses on the backend (PotRevisionStore's append,
# erasure and reads, the guest gate and record, the erasers, the re-key participant, the ITEM report), features/expenses on
# the web (the domain under domain/, run through contracts/expenses/v1-vectors.json and the real crypto; the Pot page).
acceptanceCriteria:
  - id: every-revision-names-the-heads
    text: "Every revision carries, sealed, the Pot's heads as its writer read them (entry id, revision, digest), forming a graph in which concurrent writes share a parent."
    coverage:
      web:
        unit: [src/features/expenses/domain/heads.test.ts, src/features/expenses/domain/potApi.wire.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: a-dropped-revision-marks-the-pot
    text: "On every read the client checks that each named revision is present and matches its digest; a revision the server left out, swapped or that does not open marks the Pot with a notice naming the entries, for a member and a guest alike."
    coverage:
      web:
        unit: [src/features/expenses/domain/heads.test.ts, src/features/expenses/domain/codec.test.ts, src/features/expenses/components/PotDetail.test.ts]
    gaps:
      - surface: web
        reason: "The notice is mounted with a revision left out for a member only; a guest's page is the same component over the same check (PotDetail.guest.test.ts mounts it), not asserted with a thinned list."
  - id: only-an-erasure-covers-a-missing-revision
    text: "A named revision may be missing only where a present, opening erasure revision of the same record covers it; the server writes none and takes none from a link."
    coverage:
      backend:
        integration: [PotSliceTest.aGuestErasesNothing_aMembersErasureRemovesTheRecordsEarlierRevisionsOnly]
      web:
        unit: [src/features/expenses/domain/heads.test.ts]
  - id: withheld-newest-is-the-stated-limit
    text: "Withholding the newest revisions is not detected and is stated as the platform's freshness limit, not claimed closed."
    coverage:
      web:
        unit: [src/features/expenses/domain/heads.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts`) drives `every-revision-names-the-
    heads` in Chromium, all in English and again in German, against the release candidate's two images installed
    through `veyqctl` (ADR 0090), each test tagged with its criterion: no ledger notice after a restore, nor after
    the group's key is rotated and the Pot re-keyed. A dropped revision is not provoked there: the lane's server
    serves every revision, so the notice's positive case stays the unit refs'. Green only in local runs of the lane
    (the V1 heavy stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed.
