useCase: uc.expenses.attach-receipts
feature: expenses
title: Keep the receipts with an entry
status: planned
# Refined 2026-10-23 (inbox #325, ADR 0108 decision 7); built by changes/cr-expenses-receipts.md (after cr-expenses-ledger),
# whose phases turn each gap below into refs.
acceptanceCriteria:
  - id: receipts-are-blobs-of-the-entry
    text: "A receipt is an image or PDF of at most 10 MB, any number per entry, in Expenses' own table, uploaded through core's transport with its K_blob wrapped under the Pot's key and bound to blob, node and the role EXPENSES_RECEIPT; the server refuses one above 10 MB or bound to another node or role."
  - id: only-images-and-pdfs-render
    text: "An image or a PDF receipt is shown in the client, a PDF through the shared page renderer; any other type is offered for download and never rendered."
  - id: a-dropped-receipt-goes-after-the-retention
    text: "A revision that drops a receipt names it to the server; a receipt nothing holds any more, or whose entry is deleted, is erased after the trash retention and not before, and comes back with an entry restored within it."
  - id: a-contributor-adds-and-removes-receipts
    text: "A READ_WRITE guest adds and removes receipts through the link's gate, each recorded as a guest write and counted against the link's storage limit; a READ guest opens and downloads only."
gaps:
  web: "Built by cr-expenses-receipts phase 3 (features/expenses: receipts.ts, domain/receiptRules.ts, EntryReceipts, ReceiptView, shared/pdf); its refs are written at the CR's phase 4."
  backend: "Built by cr-expenses-receipts phase 2 (PotReceiptStore, the fourth blob arm, the purge); its refs are written at the CR's phase 4."
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts` steps 2b, 4b and 9b, EN and DE) is written
    and tagged with `receipts-are-blobs-of-the-entry`, `only-images-and-pdfs-render`,
    `a-dropped-receipt-goes-after-the-retention` and `a-contributor-adds-and-removes-receipts`, and NOT YET RUN: a JPEG
    and a PDF drawn, a text claiming to be a PDF only offered for download, one removed, a guest's added through the link,
    all opening after a rotation. Its run is the CR's phase 4; ADR 0040 admits `stack` refs only from a CI run.
