useCase: uc.account.change-password
feature: account
title: Change your password while signed in
status: planned
# Refined 2026-08-25 (inbox #119) into cr-authenticated-password-change. Nothing is built yet; every criterion
# below targets both surfaces once the CR lands.
acceptanceCriteria:
  - id: same-mechanism-two-entry-points
    text: A deliberate change (current password known) and a forgotten-but-signed-in change (current password unknown) both reach the same server-side rewrite; the only difference is whether an attestation signature accompanies the request.
  - id: attestation-proves-old-password-when-present
    text: When an attestation signature is present, the server verifies it against the account's CURRENT auth_public_key before applying anything; a signature that does not verify refuses the whole request with nothing written.
  - id: forgotten-path-needs-no-attestation
    text: When no attestation signature is sent, the change proceeds on the live session alone — the client's own choice to reach this flow only from an unlocked session is the gate; the server cannot and does not verify which wrap opened the vault.
  - id: atomic-floor-and-authkey-rewrite
    text: In one transaction the change replaces the PASSWORD wrap and overwrites auth_public_key, or writes neither — a partial apply is a lockout, not a degraded state.
  - id: device-wraps-dropped-except-acting-session
    text: Every DEVICE and DEVICE_KEY wrap is deleted and every OTHER session is revoked; the session the request arrived on is never revoked by this flow.
  - id: nothing-else-re-encrypted
    text: The Master Key, identity keypair, scope keys and all sealed content are unchanged; the Emergency Kit stays valid because the Secret Key does not change.
gaps:
  backend: "No endpoint exists yet. cr-authenticated-password-change's contracts + backend phases add it."
  web: "No UI or data-layer call exists yet. cr-authenticated-password-change's web phase adds the settings entry, the two entry-point forms, and the post-change re-enrol call."
