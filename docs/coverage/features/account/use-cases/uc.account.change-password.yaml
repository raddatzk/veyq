useCase: uc.account.change-password
feature: account
title: Change your password while signed in
# Built by cr-authenticated-password-change. Backend: POST /api/account/password (PasswordChangeResource ->
# PasswordChangeHandler -> PasswordChangeStore), mirroring RecoveryStore.applyReset for the floor + auth-key
# rewrite with the one deliberate difference — the caller's own session survives via
# SessionService.revokeOtherFamilies, since this flow (unlike recovery) has a session to spare. Web: the
# "Change password" settings-hub section beside Sessions, its data layer (deriveAuthKeypair/authSign for the
# attestation, unlockKekAsync/symWrap for the new floor — the same functions login and recovery already use),
# and the post-change offer to re-enrol this device's password-less DEVICE_KEY wrap.
# Two criteria were DELETED (not gapped) by cr-change-password-cold-credential-gate: the behaviour they
# described — a second, attestation-less entry point for a forgotten password — is gone, not untested. It was
# the bypass of ADR 0060 Decision 2, and what replaced it is the shared cold-credential proof below.
acceptanceCriteria:
  - id: cold-credential-proven-before-anything-is-sent
    text: Before anything is derived or sent, the client opens the account's CURRENT PASSWORD floor with the password and Secret Key typed now and requires the result to equal the Master Key the vault holds; a pair that does not open it — or opens a DIFFERENT Master Key — refuses on the device with no request made.
    # The second half is what AEAD alone does not give, and it is the one most likely to be dropped: bite-tested
    # at implement time by forcing the comparison to true, which reddened this criterion's web case AND
    # rotation's equivalent (rotateKeys.test.ts) — the shared proof reaches both callers or neither.
    coverage:
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: attestation-proves-old-password
    text: The server verifies the attestation against the account's CURRENT auth_public_key before applying anything; a signature that does not verify refuses the whole request with nothing written, and a request carrying no attestation at all is refused at the boundary — the field is required.
    # Bite-tested at implement time by flipping one byte of a valid signature and asserting the floor stays
    # byte-identical to before — the case the AC's "nothing written" half rests on. The attestation-less case
    # was bitten the same way against the untouched tree, where it applied the full rewrite.
    coverage:
      backend:
        integration:
          - PasswordChangeSliceTest.aWrongAttestationIsRefusedAndWritesNothing
          - PasswordChangeSliceTest.aChangeWithoutAnAttestationWritesNothing
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: secret-key-proof-required
    # A phished or cracked password buys the attestation above and nothing else. Bitten against the tree that
    # accepted the new field but did not yet verify it: a valid attestation plus a proof from another key applied
    # the change (204). Its control is the same request under the account's own proof key.
    text: The change is refused without a signature of the account's Secret-Key proof key over the auth key it replaces, the new auth key and the new PASSWORD wrap. The server verifies it after the attestation and answers secret_key_proof_failed — distinct from attestation_failed — with nothing written; an account with no proof key cannot change its password.
    coverage:
      backend:
        integration:
          - PasswordChangeSliceTest.aValidPasswordWithoutTheSecretKeyIsRefusedAndWritesNothing
          - PasswordChangeSliceTest.anAccountWithNoProofKeyCannotChangeItsPassword
        unit: [SecretKeyProofTest.theChangePasswordStatementIsTheVectorsAndItsSignatureVerifies]
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: atomic-floor-and-authkey-rewrite
    text: In one transaction the change replaces the PASSWORD wrap and overwrites auth_public_key, or writes neither — a partial apply is a lockout, not a degraded state.
    coverage:
      backend:
        integration:
          - PasswordChangeSliceTest.deliberateChangeWithValidAttestationRewritesFloorDropsDeviceWrapsAndSparesTheCallersOwnSession
          - PasswordChangeSliceTest.withoutAPasswordFloorNothingIsWritten
  - id: device-wraps-dropped-except-acting-session
    # The one bite-test this CR's own correctness rests on: the caller's own session surviving the revoke was
    # confirmed at implement time by injecting an unconditional revoke-all and watching this exact assertion
    # (not "something failed") turn red, then restoring.
    text: Every wrap but PASSWORD and RECOVERY is deleted — a PASSKEY wrap and any method not declared a survivor included, while the RECOVERY wrap survives byte-for-byte — and every OTHER session is revoked; the session the request arrived on is never revoked by this flow.
    coverage:
      backend: { integration: [PasswordChangeSliceTest.deliberateChangeWithValidAttestationRewritesFloorDropsDeviceWrapsAndSparesTheCallersOwnSession] }
  - id: nothing-outlives-the-change-it-raced
    text: A sign-in with the replaced password, a device wrap or a pairing delegation racing the change either committed before it — and is ended by it — or decides after it and is refused; a second change attested by the replaced password, or made from a session a reset revoked while it waited, writes nothing.
    coverage:
      backend:
        integration: [CredentialResetRaceSliceTest.aSignInWithTheReplacedPasswordDoesNotSurviveTheResetOrChangeItRaced, CredentialResetRaceSliceTest.aDeviceWrapDoesNotSurviveTheResetChangeOrRotationItRaced, CredentialResetRaceSliceTest.aPairingDelegationDoesNotSurviveTheResetChangeOrRotationItRaced, CredentialResetRaceSliceTest.aCleanupThatStartsWhileASignInOrAWrapIsUncommittedStillEndsIt, CredentialResetRaceSliceTest.aChangeOrRotationDecidesAgainstWhatTheCleanupItWaitedForWrote]
  - id: nothing-else-re-encrypted
    text: The Master Key, identity keypair, scope keys and all sealed content are unchanged; the Emergency Kit stays valid because the new floor is built under the very Secret Key that just opened the old one — checked, not assumed about what the actor typed.
    coverage:
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
