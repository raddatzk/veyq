useCase: uc.account.change-password
feature: account
title: Change your password while signed in
# Built by cr-authenticated-password-change. Backend: POST /api/account/password (PasswordChangeResource ->
# PasswordChangeHandler -> PasswordChangeStore), mirroring RecoveryStore.applyReset for the floor + auth-key
# rewrite with the one deliberate difference — the caller's own session survives via
# SessionService.revokeOtherFamilies, since this flow (unlike recovery) has a session to spare. Web: the
# "Change password" settings-hub section beside Sessions, its data layer (deriveAuthKeypair/authSign for the
# attestation, unlockKekAsync/symWrap for the new floor — the same functions login and recovery already use),
# and the post-change offer to re-enrol this device's password-less DEVICE_KEY wrap.
acceptanceCriteria:
  - id: same-mechanism-two-entry-points
    text: A deliberate change (current password known) and a forgotten-but-signed-in change (current password unknown) both reach the same server-side rewrite; the only difference is whether an attestation signature accompanies the request.
    coverage:
      backend:
        integration:
          - PasswordChangeSliceTest.deliberateChangeWithValidAttestationRewritesFloorDropsDeviceWrapsAndSparesTheCallersOwnSession
          - PasswordChangeSliceTest.forgottenPasswordChangeWithNoAttestationAppliesTheSameRewriteWithoutVerifying
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: attestation-proves-old-password-when-present
    text: When an attestation signature is present, the server verifies it against the account's CURRENT auth_public_key before applying anything; a signature that does not verify refuses the whole request with nothing written.
    # Bite-tested at implement time by flipping one byte of a valid signature and asserting the floor stays
    # byte-identical to before — the case the AC's "nothing written" half rests on.
    coverage:
      backend: { integration: [PasswordChangeSliceTest.aWrongAttestationIsRefusedAndWritesNothing] }
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: forgotten-path-needs-no-attestation
    text: When no attestation signature is sent, the change proceeds on the live session alone — the client's own choice to reach this flow only from an unlocked session is the gate; the server cannot and does not verify which wrap opened the vault.
    coverage:
      backend: { integration: [PasswordChangeSliceTest.forgottenPasswordChangeWithNoAttestationAppliesTheSameRewriteWithoutVerifying] }
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
  - id: atomic-floor-and-authkey-rewrite
    text: In one transaction the change replaces the PASSWORD wrap and overwrites auth_public_key, or writes neither — a partial apply is a lockout, not a degraded state.
    coverage:
      backend:
        integration:
          - PasswordChangeSliceTest.deliberateChangeWithValidAttestationRewritesFloorDropsDeviceWrapsAndSparesTheCallersOwnSession
          - PasswordChangeSliceTest.withoutAPasswordFloorNothingIsWritten
  - id: device-wraps-dropped-except-acting-session
    # The one bite-test this CR's own correctness rests on: the caller's own session surviving the revoke was
    # confirmed at implement time by injecting an unconditional revoke-all and watching this exact assertion
    # (not "something failed") turn red, then restoring.
    text: Every DEVICE and DEVICE_KEY wrap is deleted and every OTHER session is revoked; the session the request arrived on is never revoked by this flow.
    coverage:
      backend: { integration: [PasswordChangeSliceTest.deliberateChangeWithValidAttestationRewritesFloorDropsDeviceWrapsAndSparesTheCallersOwnSession] }
  - id: nothing-else-re-encrypted
    text: The Master Key, identity keypair, scope keys and all sealed content are unchanged; the Emergency Kit stays valid because the Secret Key does not change.
    coverage:
      web: { unit: [src/features/account/changePassword/changePassword.test.ts] }
