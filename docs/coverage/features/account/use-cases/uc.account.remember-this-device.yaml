useCase: uc.account.remember-this-device
feature: account
title: Sign in & remember this device (web — one screen, one toggle)
# Implemented on web by cr-0054 (ADR 0005 §17-20): the combined login/unlock screen, the single "remember me"
# toggle, auto-enrol, and the password-less DEVICE_KEY wrap — superseding cr-0052's two overlapping checkboxes +
# local Master-Key cache. cr-0055 (ADR 0005 §22) makes the "off" tier session-scoped: a session refresh cookie +
# the Master Key in sessionStorage → survives a reload, dropped on browser close, password-only after a close.
# Criteria carry the module/backend test refs that exercise each mechanism; the end-to-end screen behaviour is
# confirmed by the live browser smokes recorded in cr-0054 / cr-0055.
acceptanceCriteria:
  - id: one-screen-adaptive
    text: Web shows one screen that asks only what the device still needs — email+password+Secret Key on the first sign-in, email+password once a wrap exists, and nothing on a remembered device; where the device holds a record of exactly one account, the email is filled in from it, so the fields fit before anything is typed.
    coverage:
      web:
        unit:
          - src/views/LoginView.test.ts
          - src/features/account/trustDevice/deviceKey.test.ts
          - src/features/account/unlock/unlock.test.ts
          - src/features/account/unlock/unlock.device.test.ts
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
  - id: remember-off-enrols-device-wrap
    text: With "remember me" off, the session survives a page reload (session refresh cookie + the Master Key in sessionStorage) and is dropped when the browser closes; a successful first unlock also enrols a password-bound DEVICE wrap, so the next launch after a close unlocks with the password only (no Secret Key).
    coverage:
      backend:
        integration: [LoginSliceTest.sessionScopeSetsSessionCookieWithoutMaxAge, LoginSliceTest.sessionCookieRefreshStaysSessionScoped]
      web:
        unit:
          - src/features/account/trustDevice/trustDevice.test.ts
          - src/features/account/unlock/unlock.device.test.ts
          - src/features/account/rememberMe/sessionVault.test.ts
  - id: remember-on-enrols-passwordless-wrap
    text: With "remember me" on, first unlock auto-enrols a password-less device-key wrap + a persisted session cookie; the next launch opens straight in.
    coverage:
      backend:
        integration: [LoginSliceTest.rememberLoginSetsHttpOnlyRefreshCookieAndOmitsBodyToken, LoginSliceTest.refreshViaCookieRotatesAndOmitsBodyToken]
      web:
        unit:
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
          - src/app/sessionRefresh.test.ts
  - id: served-wrap-that-does-not-open-keeps-the-key
    text: A remember-me wrap the instance serves under this device's id that does not open under the local key
      falls back to the first-sign-in screen and keeps the local key; one server answer never deletes local key
      material.
    coverage:
      web:
        unit: [src/features/account/rememberMe/deviceKeyWrap.test.ts]
  - id: secret-key-once-per-device
    text: The Secret Key is read only on the first unlock per device (to create the wrap) and never stored.
    coverage:
      web:
        unit:
          - src/features/account/unlock/unlock.device.test.ts
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
  - id: no-public-device-level
    text: There is no "remember nothing" level on web; a genuinely untrusted machine uses a private/incognito window. A stolen device + its password DEVICE wrap is useless without the password.
    coverage:
      web:
        unit:
          - src/features/account/trustDevice/trustDevice.test.ts
          - src/features/account/unlock/unlock.device.test.ts
  - id: new-passwordless-wrap-method
    text: The password-less wrap uses a NEW MasterKeyWrap.Method (DEVICE_KEY — device key alone, no password/KDF, iv in kdfParams), distinct from the password-mixing DEVICE method, served like any interactive wrap and removable so re-enrol replaces.
    coverage:
      backend:
        integration: [AccountWrapsSliceTest.addDeviceKeyWrapRidesNormalKeyMaterial, AccountWrapsSliceTest.deleteRemovesDeviceKeyWrap]
      web:
        unit: [src/features/account/rememberMe/deviceKeyWrap.test.ts]
  - id: operator-blind-unchanged
    text: The server holds only ciphertext wraps + an opaque cookie token; it never gains the KEK, Master Key, Secret Key, or password.
    coverage:
      backend:
        integration: [AccountKeyMaterialSliceTest.validTokenReturnsCallersMaterial, AccountWrapsSliceTest.addDeviceKeyWrapRidesNormalKeyMaterial]
      web:
        unit: [src/features/account/rememberMe/deviceKeyWrap.test.ts]
  - id: forget-remembered-from-settings-ui
    text: >-
      A user can forget the password-less remember-me tier from the settings hub — the current device's row in
      the Devices-and-sessions rubric shows the remembered state (it wins over a trusted one, being the tier the
      user actually experiences) and its forget action drops the DEVICE_KEY wrap (via clearDeviceKey), so this
      device next needs its Secret Key.
    coverage:
      web:
        unit: [src/features/account/sessions/SessionsPanel.test.ts]
  - id: a-hung-start-is-never-blank
    # ADR 0136, E5. The tiers are untouched by a hang: the watchdog reloads, and boot() keeps or drops nothing more than
    # before (`remember-off-enrols-device-wrap`'s refs).
    text: >-
      A start that hangs is never a blank page. index.html's start screen shows from the first paint; without a mounted
      app after 15 s, or at once when the start fails or a chunk no longer loads, the start watchdog reloads the page once
      per five minutes per tab (a sessionStorage timestamp, the only thing it writes; none where storage throws), and
      otherwise shows "Taking longer than usual" with a Reload button and the boot step it waits for. The watchdog
      imports nothing, so it runs when the app's chunks do not. "This server can't be reached right now" offers Reload.
    coverage:
      web:
        unit:
          - src/boot/watchdog.test.ts
          - src/boot/startScreen.test.ts
          - src/app/startSignals.test.ts
          - src/components/app/AppShell.unreachable.test.ts
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/start-never-blank.spec.ts`) drives
    `a-hung-start-is-never-blank` in the built shell under its served policy: a held setup-status request, the one
    reload, the German slow panel naming `status`, its Reload to sign-in, and a normal start with no panel. Written,
    not yet run (the V1 heavy stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed.
    That the watchdog's built file imports nothing is `pnpm run verify:boot-watchdog`, a build check, not a test ref.
