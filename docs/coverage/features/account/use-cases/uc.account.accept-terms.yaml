useCase: uc.account.accept-terms
feature: account
title: Accept terms — a member accepts the tenant's current terms to enter (re-accept on change)
# cr-0114 (ADR 0035) delivers the member half end-to-end: contracts (getTenantTerms + acceptTenantTerms) →
# backend (veyq_tenant_terms_acceptance keyed (user_id, tenant_id, accepted_revision) since #402, membership-gated read/accept, a stale-revision
# accept → 409 terms_revision_changed, TenantTermsHandler) → web (a router accept-gate: activeSpace.termsStale()
# refreshed on every enterScope + a cold-boot watcher → the /terms TermsAcceptView; accepting records server-side
# and returns the member to the remembered route). accepted_terms_revision is coarse operational metadata (never
# content). Backend slice tests run over the full HTTP stack; a signed ijhttp lifecycle proves the accept/re-stale/
# stale-409 loop live. The anonymous public-share client-side notice (localStorage on the share page) is a later
# sharing slice on top of these terms, NOT this member-facing gate. The
# browser smoke passed too: set terms → gate bounces home→/terms → accept → back in shell → reload confirms the
# acceptance persisted server-side (no re-gate), live against the dev instance.
acceptanceCriteria:
  - id: hard-gate-on-stale-revision
    text: A member with a session whose accepted_terms_revision is below the tenant's terms_revision is blocked from the shell and routed to /terms (after the session/unlock check — the gate needs a session, not an unlocked vault). A tenant with no terms (revision 0) never gates.
    coverage:
      backend: { integration: [TenantTermsSliceTest.memberAcceptsThenABumpReStalesAndAStaleAcceptIs409] }
      web: { unit: [src/features/tenant/tenantTerms.test.ts] }
  - id: accept-recorded-server-side
    text: Accepting records the member's accepted_terms_revision = the current terms_revision (+ accepted_at, the server's own time — audit evidence, written once per revision, never client-supplied) server-side, one row per (user_id, tenant_id, accepted_revision) — a newer revision adds a row and leaves the older ones and their times as evidence; the rows go with their tenant. The gate reads the highest accepted revision, then clears and the shell renders.
    coverage:
      backend: { integration: [TenantTermsSliceTest.memberAcceptsThenABumpReStalesAndAStaleAcceptIs409, TenantTermsSliceTest.eachAcceptedRevisionKeepsItsOwnRowAndFirstTime, TenantTermsSliceTest.anOlderAcceptanceDoesNotClearTheGateForTheCurrentRevision, TenantTermsSliceTest.aClientSentAcceptanceTimeHasNoEffect, TenantTermsSliceTest.deletingATenantErasesEveryAcceptanceRow] }
      web: { unit: [src/features/tenant/tenantTerms.test.ts] }
  - id: re-accept-on-revision-bump
    text: When the space owner bumps terms_revision, the member's stored acceptance is now stale, so the gate re-appears; accepting the now-stale revision is refused (409 terms_revision_changed) until they re-read and re-accept the current one.
    coverage:
      backend: { integration: [TenantTermsSliceTest.memberAcceptsThenABumpReStalesAndAStaleAcceptIs409] }
  - id: operator-blind
    text: accepted_terms_revision is coarse operational metadata (like membership), never content; the terms text itself is public. A non-member read/accept is 404 (indistinguishable), and no server record is kept for an accountless visitor (anonymity preserved).
    coverage:
      # memberAccepts…AStaleAcceptIs409 proves acceptance is stored/compared as a bare integer revision (coarse
      # operational metadata, never content); readOrAcceptByANonMemberIs404 proves the non-member 404 is
      # indistinguishable for read AND accept. The accountless-visitor "no record kept" clause is true by
      # construction (both endpoints are membership-gated — no path writes a record without a session) and has
      # no dedicated test; an anonymous-visitor assertion is the honest remaining thin spot, not a false citation.
      backend: { integration: [TenantTermsSliceTest.memberAcceptsThenABumpReStalesAndAStaleAcceptIs409, TenantTermsSliceTest.readOrAcceptByANonMemberIs404] }
  # cr-operator-section-of-the-terms (ADR 0035 decision 6): the fixed operator section after the space's text, and the
  # gate on the pair (space revision, operator revision; one form since cr-operating-mode-retires). The text is contracts/terms/operator-section.json.
  - id: the-operator-section-follows-the-space-terms
    text: >-
      Every member terms read serves, after the space's own text, the fixed operator section veyq ships, rendered with
      the values the Server Owner set; the member gate shows it after the
      space's text. A space with no terms (revision 0) does not gate, and its members read the section in the space's
      terms panel.
    coverage:
      backend:
        integration: [TenantTermsOperatorSectionSliceTest.aSpaceWithNoTermsServesTheSectionWithoutAGate]
        unit: [OperatorSectionRendererTest.theJarCarriesTheContractFileUnchanged, OperatorSectionRendererTest.everyPlaceholderTheFileNamesIsOneTheRendererKnows, OperatorSectionRendererTest.anUnknownPlaceholderIsRefusedRatherThanPrinted]
      web:
        unit: [src/views/TermsAcceptView.test.ts, src/features/tenant/TenantTermsPanel.test.ts]
  - id: the-gate-compares-the-pair
    text: >-
      What a member accepts is the pair of the space's revision and the section's revision, one history row per pair: a
      release that changes the section reopens the gate, a value or N changed in admin-web renders at once and reopens
      nothing; accepting the pair again adds no row, and the database holds one row per pair; an accept naming another
      pair is 409.
    coverage:
      backend:
        integration: [TenantTermsOperatorSectionSliceTest.aValueChangedInAdminWebRendersAtOnceAndReopensNoGate, TenantTermsOperatorSectionSliceTest.aMemberAcceptsThePairAndTheHistoryHoldsOneRowPerPair]
      web:
        unit: [src/features/tenant/tenantTerms.test.ts, src/views/TermsAcceptView.test.ts]
  - id: the-section-has-one-form
    text: >-
      Every instance serves one form of the section: the notice path, what is kept, the measures, the statement with its
      further content, the deferral and the authorities with the contact point. An empty value is a visible "not stated
      by this operator", a value set replaces it; an optional line goes where its value is empty.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.anInstanceWithNoModeServesEveryTextWholeAndRecordsAGuestWrite]
        unit: [OperatorSectionRendererTest.theSectionHasOneFormWithTheAuthoritiesTheDeferralAndTheNoticePath, OperatorSectionRendererTest.anEmptyValueIsAVisibleGap, OperatorSectionRendererTest.anOptionalLineGoesWhereItsValueIsEmpty, OperatorSectionRendererTest.aValuesNewlinesRenderInlineSoATypedAddressCannotStartAMarkdownBlock]
  - id: the-record-pointer-is-always-there
    text: >-
      The section points to the guest-write record's GDPR Art. 13 information — the privacy notice's, with its right to
      object apart (uc.admin.privacy-notice) — on every instance, set apart from the text, since the record is kept
      wherever a guest may write; the section carries no right to object of its own.
    coverage:
      backend:
        integration: [TenantTermsOperatorSectionSliceTest.theRecordsPointerIsAlwaysServedAndReopensNoGate]
        unit: [OperatorSectionRendererTest.theRecordsPointerIsAlwaysThereAndSetApart, OperatorSectionRendererTest.theSectionCarriesNoRightToObjectOfItsOwnAnyMore]
      web:
        unit: [src/views/TermsAcceptView.test.ts]
gaps:
  stack: >-
    Lane L1 walks this in a browser in tests/e2e/tests/features/account/terms-operator-section.spec.ts, tagged per criterion
    (cr-operator-section-of-the-terms), but no CI run has executed that lane yet (ADR 0040).
