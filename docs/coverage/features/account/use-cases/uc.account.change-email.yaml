useCase: uc.account.change-email
feature: account
title: Change the address an account signs in with
status: planned
# Decided 2026-10-14 (inbox #197, ADR 0074 Addendum); cr-change-email builds it and replaces the gaps with refs.
acceptanceCriteria:
  - id: request-needs-password-and-secret-key
    text: >-
      A change is requested with the new address, the auth public key derived under its salt, an attestation by the current
      auth key and a Secret-Key proof; a wrong proof stores nothing, and no relay answers 503 mail_unavailable before
      anything is stored.
  - id: request-does-not-enumerate
    text: >-
      The request's response is the same whether the new address is free or taken by any account of the instance.
  - id: confirm-swaps-in-one-step
    text: >-
      Opening the mailed link in a session of the same account swaps the email and the auth public key in one
      transaction, records the address as confirmed, revokes every other session and mails the old address a fixed
      notice; a taken address, an expired, used or foreign link changes nothing.
  - id: keys-and-content-untouched
    text: >-
      After the change the account signs in with the new address and its password, unlocks with the same Secret Key,
      and opens the same content; the Master Key and every wrap are unchanged.
gaps:
  backend: Not built yet - cr-change-email adds the slice tests (request, confirm, uniqueness race, enumeration, 503, revocation, the old-address mail).
  web: Not built yet - cr-change-email adds the unit tests and an e2e sign-in with the new address.
