useCase: uc.account.renew-emergency-kit
feature: account
title: Make a new Emergency Kit when a clearer one exists
# Refined 2026-11-22 (ADR 0157); cr-kit-layout-record builds it: the backend stores the record (table, resource, both
# births, the rotation, the erasure), the web carries KIT_LAYOUT, reads and writes the record in every flow that makes a
# kit, and suggests the clearer kit in Settings - Security and once in the shell.
acceptanceCriteria:
  - id: record-is-sealed
    text: The account's kit record is one blob sealed under the Master Key (purpose kit-record); the server stores and serves it to the account alone and never sees a layout number. A blob that does not open reads as layout 1.
    coverage:
      backend:
        integration:
          - KitRecordSliceTest.anAccountWithNoRecordReadsAnAbsentBlob
          - KitRecordSliceTest.aWriteIsReadBackAndTheNextReplacesItWithoutARevision
          - KitRecordSliceTest.aMemberReadsAndWritesOnlyTheirOwnRecord
          - KitRecordSliceTest.theRecordNeedsASession
          - KitRecordSliceTest.aMalformedWriteIs400AndStoresNothing
      web:
        unit:
          - src/features/account/emergencyKit/kitRecord.test.ts
          - src/features/account/emergencyKit/EmergencyKitStatus.test.ts
  - id: every-kit-writes-it
    text: Each flow that makes a kit writes the record in the same step - the join birth and the Server Owner's birth in their request, securing the account in the rotation request, the address change and the renewal with a PUT once the PDF was saved; recovery and a password change write nothing.
    coverage:
      backend:
        integration:
          - SetupServerSliceTest.createsOwner
          - SetupServerSliceTest.aSetupWithoutAKitRecordStoresNone
          - TenantAcceptSliceTest.aJoinBirthStoresTheKitRecordItCarriesAndOneWithoutStoresNone
          - RotationSliceTest.aStaleRegisterRevisionRollsTheWholeRotationBack
          - RotationSliceTest.anAccountWithNoDocumentYetGetsEachBornInTheRotation
          - RotationSliceTest.aRequestMissingARequiredFieldIsRejectedAtTheBoundary
          - KitRecordSliceTest.aWriteIsReadBackAndTheNextReplacesItWithoutARevision
      web:
        unit:
          - src/views/TenantJoinView.member.test.ts
          - src/views/TenantJoinView.ownerHold.test.ts
          - src/features/account/rotation/rotateKeys.test.ts
          - src/views/ConfirmEmailChangeView.test.ts
          - src/features/account/coldCredential.test.ts
          - src/features/account/emergencyKit/EmergencyKitSave.test.ts
          - src/features/account/emergencyKit/KitRenewalDialog.test.ts
    gaps:
      - surface: web
        reason: The Server Owner's birth is admin-web's (setupServer.kitRecord.test.ts seals the record under the new Master Key before it is zeroed); admin-web is a surface no CI run has admitted yet (ADR 0040), so that suite makes no claim here.
  - id: suggestion-is-quiet
    text: An account whose record is older than KIT_LAYOUT, or absent, sees it in Settings - Security with the newest layout's sentence and that the old kit keeps working, and once per browser and account a dismissible shell notice that does not return.
    coverage:
      web:
        unit:
          - src/features/account/emergencyKit/EmergencyKitStatus.test.ts
          - src/features/account/emergencyKit/KitRenewalPrompt.test.ts
          - src/components/app/AppShell.unconfirmedEmail.test.ts
          - src/features/account/emergencyKit/kitRecord.test.ts
  - id: proven-before-printed
    text: Making the new kit checks the password and the Secret Key against the PASSWORD floor first; a wrong one renders no kit and writes no record.
    coverage:
      web:
        unit:
          - src/features/account/emergencyKit/KitRenewalDialog.test.ts
          - src/features/account/coldCredential.test.ts
