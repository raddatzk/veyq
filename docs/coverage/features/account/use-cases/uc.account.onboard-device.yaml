useCase: uc.account.onboard-device
feature: account
title: Onboard a device from one you are already signed in on
# Refined 2026-08-12 (ADR 0059). The **server half** is built: the five `pairing` endpoints on the auth spec,
# `account/pairing/` behind them, the session delegation on `SessionService`, and `POST /api/token/adopt`, which
# gives the delegated session the cookie transport every other web session has (ADR 0004 § Transport). The
# onboarded device's own web half and the live QR component are not, so every criterion below is still part
# web — see the two gaps.
#
# `status: planned` is nonetheless correct, and for the same single reason uc.account.sessions gives:
# **no CI run has ever executed here.** This repository has no remote, so ADR 0040's rule — a test no CI run
# executes makes no coverage claim — leaves every criterion uncovered however green the suites are locally.
# They DO exist and pass; the backend gap names them so the later flip is mechanical. Nothing here waits on a
# missing test on that surface; the remaining condition is an event.
#
# Two criteria below are **structural** and are carried by permanent guards rather than by tests:
#   - `no-code-ever-names-a-server` — ADR 0059 §4, and **no longer owed**: `scripts/validate_pairing_shapes.py`
#     pins the seven pairing schemas as exact property sets, so a URL-shaped field cannot be added to any of
#     them quietly. It is the same shape as `scripts/validate_device_shapes.py`, one flow over, and it was
#     bite-tested with a `serverUrl` on `PairingOpenRequest`, which it fails naming the field.
#   - `the-locked-entry-adds-no-shell-route` — **structurally** guarded, and only structurally:
#     `scripts/validate_shell_route_gate.py` refuses the shortcut (a locked-reachable shell route) for both
#     directions' entries, since neither adds a route at all. The behavioural half — the entry is offered, it
#     attempts no unlock, and the paths already on that card are unchanged — is still a test's job, and is owed
#     by whichever slice adds each entry.
status: planned
acceptanceCriteria:
  - id: the-grant-carries-key-and-session
    text: >-
      A device that never logged in ends up holding both the Master Key and its own ACTIVE session family, and
      that family is ordinary in every other respect — it is listed, it rotates, it is revocable, and revoking
      it does not disturb the granting device's family. Both halves are the criterion: a grant that transferred
      only the key would leave a device that can open a vault it cannot reach a server with, and a family that
      behaved specially would be a second class of session nobody audits. The granting session's own family is
      the live control — it must still refresh afterwards.
  - id: the-onboarded-device-keeps-the-session-it-was-granted
    text: >-
      The onboarded device survives a reload. The handed-over refresh token reaches it in the envelope, is spent
      exactly once on arrival, and what it holds afterwards is the same httpOnly cookie every other web session
      holds — never a token in script. The second half is the one a happy-path test cannot see: an
      implementation that simply kept the body token would pass "the device is signed in" perfectly and lose
      everything on the next page load, with no password to recover by. Three things are the criterion together:
      the exchange returns a cookie and no body token; it returns the family id, without which the device cannot
      appear named in uc.account.sessions at all; and re-presenting the spent grant token is ADR 0004's clone
      case and takes the family down. The live control on that last one is the adopted session refreshing
      normally beforehand, since "everything is refused" satisfies a bare negative just as well.
  - id: no-password-and-no-secret-key-reaches-the-new-device
    text: >-
      Neither the password nor the Secret Key is typed on, sent to, or derivable by the onboarded device, at any
      step of either direction. The positive control on the same predicate is the ordinary first sign-in, which
      must still demand both — a bare "nothing was entered" is satisfied equally well by a broken form.
  - id: the-envelope-is-sealed-to-the-ephemeral-key-and-nothing-else-leaks
    text: >-
      The Master Key and the refresh token travel only inside one envelope sealed to the new device's
      single-use transport public key, and are unreadable without its private key. Pickup is deliberately
      unauthenticated, so the assertion is that fetching it yields nothing usable — anchored on the failed
      open, never on "it threw", which a transport or boot failure produces just as well. The new device sends
      no account identifier at any point before the grant: which account it becomes is decided by the device
      that scans.
  - id: add-a-device-is-gated-on-a-matching-check-number
    text: >-
      In the *add a device* direction both devices derive the same short check number from the answering
      public key, and the grant is completed only after the account holder confirms they match. The criterion
      is the pair: the matching case grants, and a second device answering the same channel (the photographed-QR
      race this step exists for) produces a number that does not match the one on the intended device, is
      declined, and abandons the channel rather than offering a retry in place.
  - id: qr-sign-in-seals-only-after-the-returned-code-is-proven
    text: >-
      In the *sign in with a QR code* direction the trusted device seals nothing until the new device has proven
      knowledge of the code the trusted device displayed, bound to its own public key. The negative is that on
      an unproven or wrong code **no envelope is ever posted** — not merely that an error surfaced — because a
      design that sealed first and released later would satisfy an error-shaped assertion perfectly while
      handing the operator the only barrier (ADR 0059 §6). There is exactly one committed proof per ceremony —
      the answer slot is write-once and the channel carries no status to refuse through — so a wrong proof
      abandons the pairing rather than retrying in place, and the valid proof is the live control.
  - id: no-code-ever-names-a-server
    text: >-
      Nothing carried by a scanned code can name an endpoint, and no client follows one out of a scan — each
      side talks only to the instance it already has open. Structural, so this is a permanent contract-shape
      guard rather than a test: a URL-shaped field on the pairing payload would redirect a trusted device's
      seal to an attacker's server with no password and no session, and every visible behaviour would stay
      correct.
  - id: a-pairing-is-single-use-short-lived-and-not-probeable
    text: >-
      A pairing channel expires, is spent by one successful grant, and only one is outstanding per account.
      An expired, spent, or never-existing channel answers identically, so the endpoint cannot be used to probe
      which pairings exist — the same non-enumerability posture the wrap and session endpoints already take.
      The live control is a fresh channel, which must still work; without it the sameness is satisfied by an
      endpoint that refuses everything.
  - id: the-onboarded-device-writes-its-own-register-entry
    text: >-
      The label chosen during the ceremony travels inside the sealed envelope and is written to the device
      register by the device it names, on that device's ordinary post-unlock write — no fourth write moment,
      and the granting device never writes another device's entry. This is what keeps
      en.account.device-register's single-writer rule intact; a grant that wrote the entry from the trusted
      side would work perfectly and quietly re-open the merge hazard that rule exists to close.
  - id: a-linked-device-is-born-at-the-password-less-tier
    text: >-
      An onboarded device that stays signed in enrols a `DEVICE_KEY` wrap and never a `DEVICE` one — it has no
      password to key the latter — and one that declines enrols no wrap at all and holds the Master Key for the
      session only. Both cases are the criterion, with the ordinary remembered device as the control that the
      enrolment path itself still works.
  - id: the-locked-entry-adds-no-shell-route
    text: >-
      **Both** routeless entries this feature puts on the sign-in form — *sign in with a QR code*, beside
      uc.account.sessions E3's other ways out, and the *add a device* join the same scan control dispatches to —
      read nothing sealed and add no route that is session-gated but not unlock-gated. One property, two
      arrivals: the criterion was first written about the QR direction alone, and the second direction reaches
      the same card, so covering only one would leave the other's regressions unowned. The structural half is
      the existing route-gate guard. What a test owes, per entry: that it is offered on the locked card, that
      choosing it attempts no unlock, and that every path already on that card still behaves exactly as it did
      — E3's own two ways out **and** the Emergency-Kit scan, which is what a shared, dispatching scan control
      most plausibly breaks.
gaps:
  backend: >-
    The suite exists and passes locally; the only missing thing is a CI run to execute it (ADR 0040).
    `PairingSliceTest` drives all five endpoints over the full HTTP stack, with a second account live throughout
    — which is what turns "the grant is scoped to the account that delegated" from a claim about the SQL into an
    observation at the boundary. It covers `a-pairing-is-single-use-short-lived-and-not-probeable` end to end:
    the three dead-channel cases (unknown, expired, spent) each run a FRESH channel through the same verbs as
    their live control, because "they all answer 404" is satisfied perfectly by an endpoint that refuses
    everything; a fourth case compares the three answers byte for byte, which is E1's actual claim; the single-use
    rule is asserted as the pair "polling for the answer spends nothing, taking the grant spends the channel";
    and §8's one-outstanding rule is asserted as supersession WITH the revoke of the family that ceremony left
    behind, against a second account's pairing that must survive it. `PairingPurgeTest` owns the sweep —
    expire-then-delete in that order, and the uncollected family revoked — each with a COLLECTED channel beside
    it as the live control, since a sweep that revoked on "overdue" alone would sign out the device that did
    arrive. For `the-grant-carries-key-and-session` the backend proves the session half only: the delegated
    family lists, rotates and revokes like any other, and revoking it leaves the granting session refreshing
    (`SessionManagerSliceTest`, with the granting family as the control the criterion names). The Master-Key half
    is client-side by construction — the server relays one sealed envelope it cannot open — and so is every
    binding step: `add-a-device-is-gated-on-a-matching-check-number` and
    `qr-sign-in-seals-only-after-the-returned-code-is-proven` are checked on the trusted device, and what the
    backend contributes to them is an ABSENCE that is asserted rather than assumed — `/api/pairing/seal` takes no
    code and verifies none, because a server that could release on a correct code would be past the only barrier
    there is (ADR 0059 §6, ADR 0026). Of
    `the-envelope-is-sealed-to-the-ephemeral-key-and-nothing-else-leaks` the backend covers the relay half:
    collection is unauthenticated on purpose, the request names no account, and what comes out is byte for byte
    what went in. `no-code-ever-names-a-server` is now carried by `scripts/validate_pairing_shapes.py` rather
    than owed, with the slice test's response-shape assertion (the channel read exposes exactly `answer` and
    `envelope`) as its server-side twin. Rate-limit posture is not asserted by hand: the three public endpoints
    declare `@RateLimit(IP)` and the two authenticated ones `@RateLimit(USER)`, and
    `RateLimitPostureSweepTest.everyEndpointDeclaresARateLimitPosture` reddens by itself if one loses it — bite-
    tested here, it names the endpoint. The wraps resource's `@RateLimitExempt` reasoning ("bounded by the
    caller's own session") deliberately does not transfer: these endpoints have no caller.
    **`the-onboarded-device-keeps-the-session-it-was-granted` now has its backend half, and it is in the same
    state as everything else here** — the suite exists and passes locally, and the only missing thing is a CI
    run to execute it (ADR 0040). `POST /api/token/adopt` is the verb that converts the handed-over grant token
    into the cookie transport every web session uses (ADR 0004 § Transport), and `TokenAdoptSliceTest` drives it
    over the full HTTP stack: per scope, that the response names the **family the rotation produced** and omits
    the body token while setting exactly one refresh cookie — the other lifetime's clearing cookie beside it —
    with `httpOnly` asserted on the attribute and `SESSION` asserted to carry no `Max-Age` at all; that the
    required `sessionScope` is refused at the boundary when absent, with the same request carrying one as its
    control; that the adopted session then rotates **through the cookie alone**, which runs *before* the replay
    because afterwards the family is dead and every later assertion is vacuum; and that re-presenting the spent
    grant token is ADR 0004's clone case — anchored on the family's own status reaching `REVOKED`, not on "the
    call failed", with a second family of the same account as the control that the revoke was targeted rather
    than a blanket refusal. A request already bearing a refresh cookie is refused under **both** cookie names,
    with the same request minus the cookie succeeding — which is also what proves the refusal precedes the
    rotation, so the endpoint cannot be used to burn someone else's grant. Rate-limit posture is not asserted by
    hand here either: the method inherits the class-level `@RateLimit(IP)` and
    `RateLimitPostureSweepTest.everyEndpointDeclaresARateLimitPosture` reddens by itself if it loses it. The
    web half is still owed and is slice 3's — see the web gap. Three criteria have no
    backend half at all — `the-onboarded-device-writes-its-own-register-entry` and
    `a-linked-device-is-born-at-the-password-less-tier` are client writes onto endpoints that already existed, and
    `the-locked-entry-adds-no-shell-route` is a route-gate property of the web surface.
  web: >-
    **The trusted half of *add a device* is built** (slice 2, `web/src/features/account/pairing/` plus the
    shared `SlideToConfirm` primitive): open a channel, show the code, wait for the answer, compare the number,
    take the deliberate confirmation, delegate then seal. Its suites pass locally and the only thing missing is
    a CI run to execute them (ADR 0040) — the same single condition the backend gap names. They pin what no
    `scripts/` validator can see without parsing TypeScript: the displayed payload is the marker and the handle
    and can never read as a URL (§4, bitten by forcing the one draw whose base64 begins with a slash); the grant
    round-trips only through the key whose number was compared, and not through any other; the check number is
    the already-pinned safety-number digest's first group; declining the comparison reaches **neither**
    `delegate` nor `seal` and the restart mints a different handle, each with its completing ceremony as the
    live control; and the channel is never read again after the answer, at both altitudes (the loop's own suite
    and the whole screen after a real seal), with "it polled before" as the control that stopping is not
    vacuous. The scanner's first-ever harness came with the decoder refactor that made it serve both flows.
    **The onboarded device's half and the shared tail are built too** — the join card the sign-in form's scan
    entry dispatches to, the grant poll, and `onboardTail.ts`, which the QR direction will reuse rather than
    rebuild. Same state, same single missing condition: the suites pass locally and no CI run has executed them
    (ADR 0040). What they pin is the set of things a happy path cannot see. The order ADR 0059 §2 forces is
    asserted as an ORDER, not a set — the key-material fetch and write moment 1 are anchored on an access token
    and a family id that only the adoption could have installed, because a wrong-order build calls every one of
    those steps too. Adoption is presented **exactly once**, and the control that makes the count mean anything
    is on the same predicate: the rest of the tail *does* refresh-and-retry on a 401, so "once" is about the
    absent `withRefresh` around adopt and not about a client with no retry anywhere. Adopt's `400` reaches a
    different message than its `401` — the remedies differ, so they may not collapse. The device writes its own
    register entry under the label it was handed and not the user-agent guess, with an ordinary unlock still
    writing the guess as the live control and the trusted panel writing no entry for it at all. The declined
    tier enrols no wrap of **either** kind — never the password `DEVICE` wrap the ordinary Off tier keeps, which
    this device has no password to key — against an accepted tier that does enrol a `DEVICE_KEY`. And the
    widened scan entry accepts both of this app's codes while scanning past a foreign QR, with the
    Emergency-Kit path asserted unchanged, which is the regression a shared dispatching control most plausibly
    causes.

    **What is still owed here is slice 3's, and that is now the whole of it:** the QR-sign-in direction —
    `qr-sign-in-seals-only-after-the-returned-code-is-proven`, and that entry's behavioural half of
    `the-locked-entry-adds-no-shell-route`, of which the *add a device* entry's half is covered above. The
    `wiki/` section is assembled with it, not before, because the plain-language text promises both directions.

    **Two things this surface inherits rather than owns.** The adopted session carries inbox #123 — nothing in
    this client serializes refresh, so two tabs can revoke their own family — exactly as every other web session
    does; it predates device linking and is not fixed by this flow. And E2E stays out of reach for the reason
    the sessions panel's did — the flow needs two live sessions of one account, which the current harness does
    not stand up — which is stated here rather than left as a silently missing ref.
