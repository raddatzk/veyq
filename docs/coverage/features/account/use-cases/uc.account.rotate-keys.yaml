useCase: uc.account.rotate-keys
feature: account
title: Rotate my keys after a compromise
# Built by cr-account-key-rotation-after-compromise (ADR 0060, settling ADR 0028 Decision 5). What the flow
# DRIVES was already built end-to-end and stays covered under its own use-cases — the epoch chain + POST
# /api/scopes/{scopeId}/epochs (ADR 0024, en.spaces.scope-key-rotation), the grant-delivery stale-epoch
# reconcile, the SCOPE_ROTATION job, the TOFU gate at all three foreign-wrap sites and the changed-key review
# (uc.spaces.verify-identity). What this CR added is the account-side operation, its gate, and the two seams a
# changed key had never legitimately needed: the rotator's exclusion from their own rotation, and the clearing
# of a decline when a human accepts.
#
# One structural claim below is held by a guard rather than by a test, and deliberately: `one-mode-…` rests on
# the ABSENCE of a request field, which no passing test can notice. `scripts/validate_rotation_shape.py` pins
# the request's property set (and that every field is required — an optional one is a discriminator spelled by
# omission). It is not listed as coverage because `scripts/` is not a coverage surface (ADR 0040); the tests
# below cover what the one producer actually sends.
acceptanceCriteria:
  - id: one-mode-master-and-identity
    text: Rotation replaces the Master Key and the identity keypair together — there is no identity-only mode and no choice offered. wrappedIdentityPrivateKey is re-wrapped under the new Master Key, the new identity public bundle replaces the directory value, and the Secret-Key proof key is left as it is — the Secret Key does not rotate.
    coverage:
      backend: { integration: [RotationSliceTest.rotationReplacesEveryKeyRewritesBothColdWrapsAndDeletesTheDeviceOnes] }
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: cold-credential-gate
    # Reworded at implement time, and the change is a sharpening rather than a relaxation. The gate cannot be
    # "which wrap opened this vault" alone: rewriting the two cold wraps needs the password and the Secret Key
    # as *material* and no KEK survives an unlock, so every path supplies them and checking them against the
    # stored floor is both free and stronger — it proves possession NOW. A device-opened session upgrades in
    # place (uc §E1's "asks in place"), which is what the recorded origin is read for: the explanation, not the
    # refusal.
    text: Rotation runs only against a live proof of the cold credential — the password + Secret Key are re-derived into the floor KEK and must open the stored PASSWORD wrap to the Master Key the vault already holds. A DEVICE, DEVICE_KEY or restored-session unlock is asked for that credential in place and rotates only once it produces it; the attacker this defends against holds a device wrap and never the Secret Key, so they fail the proof from whichever screen they reach it.
    coverage:
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: secret-key-proof-required
    # The server half of the gate above, and inbox #159's second door. Bitten against the tree that accepted the
    # new field but did not yet verify it: a session plus a signature from another key rotated (200), which is
    # what a device-link holder can do. Each negative carries its control on the same request.
    text: Rotation is refused without a signature of the account's Secret-Key proof key over the identity it replaces, the new identity, the new wrapped identity private key and both rewritten wraps. The server rebuilds that statement from the request and the account's current identity and answers secret_key_proof_failed with nothing written — a valid session with any other key is refused, a captured signature cannot be replayed once its rotation applied, and an account with no proof key cannot rotate.
    coverage:
      backend:
        integration:
          - RotationSliceTest.aSessionWithoutTheSecretKeyCannotRotate
          - RotationSliceTest.aCapturedRotationSignatureCannotBeReplayed
          - RotationSliceTest.anAccountWithNoProofKeyCannotRotate
        unit: [SecretKeyProofTest.theRotationStatementIsTheVectorsAndItsSignatureVerifies]
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: wraps-and-sealed-blobs-follow
    # The wrap deletion is asserted as a whitelist of survivors (PASSKEY dies too), not as a DEVICE/DEVICE_KEY
    # blacklist — a method added later must default to deleted rather than silently keep the old Master Key.
    text: The PASSWORD and RECOVERY wraps are rewritten under their existing KEKs (so the Emergency Kit stays valid — the Secret Key is unchanged, though each wrap gets a fresh salt), every DEVICE/DEVICE_KEY/PASSKEY wrap is deleted because its key material cannot be rewritten, and every Master-Key-sealed blob (identity-pin store, device register) is re-sealed under the new Master Key.
    coverage:
      backend: { integration: [RotationSliceTest.rotationReplacesEveryKeyRewritesBothColdWrapsAndDeletesTheDeviceOnes] }
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: item-marks-re-tagged-under-the-old-key
    text: >
      The caller's item marks carry a self-tag whose key derives from the Master Key, so the rotation re-tags them:
      it reads the caller's own rows across every scope the gate still lets them read (GET /api/item-favorites —
      never a co-member's row, never a left, proposed-only or suspended scope's), opens each with that scope's E_0,
      and re-seals under the new key only a row whose tag verifies under the OLD one, so a co-member's blob slipped
      into the listing stays not-mine. Best-effort per Memory, like the other Master-Key riders, and it runs before
      the vault swaps to the new keys. (ADR 0068 §9.)
    coverage:
      backend:
        integration:
          - ItemFavoritesSliceTest.listOwnReturnsTheCallersRowsAcrossScopesAndNeverACoMembers
          - ItemFavoritesSliceTest.listOwnLeavesOutEveryScopeTheGateRefuses
      web: { unit: [src/features/memory/itemFavorites.test.ts, src/features/account/rotation/rotateKeys.test.ts] }
  - id: trust-documents-resealed-in-the-publish
    # ADR 0060 § Consequences, inbox #192. The live defect was red on the untouched client: the re-seal ran after
    # the publish in its own PUT, and a PUT that failed left the pin store under the retired key — refused by every
    # device as unreadable. The backend's stale cases were red on the untouched handler, and the rollback was bitten
    # by returning the conflict without undoing the transaction (the identity stayed published).
    text: The identity-pin store and the device register are re-sealed under the new Master Key inside the rotation's one request and written in its one transaction — a stale revision on either rolls the whole rotation back (409 stale_revision, nothing published) and the client re-reads, re-seals and resubmits the same keys under the same signature, bounded. A document this device refuses (rolled back, missing after a mark, unreadable) refuses the rotation before any write, so a rotation can neither strand a document under a retired key nor launder a rollback into the new one.
    coverage:
      backend:
        integration:
          - RotationSliceTest.aStalePinStoreRevisionRollsTheWholeRotationBack
          - RotationSliceTest.aStaleRegisterRevisionRollsTheWholeRotationBack
          - RotationSliceTest.anAccountWithNoDocumentYetGetsBothBornInTheRotation
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: rotation-rekeys-every-pin-entry
    # ADR 0104 § Consequences. Bitten: a rotation that ignored a stale pin store answered 200; one that answered the
    # conflict without the rollback kept the published identity.
    text: A new Master Key is a new pin-index key, so the rotation re-derives every identity-pin entry's id under it, re-seals each entry and a new head, and carries them as one write that replaces the whole set (replaceAll) inside the rotation's transaction; a rotation whose pin write would keep any entry is refused (400, nothing written), and a stale head revision rolls the rotation back as before.
    coverage:
      backend:
        integration:
          - RotationSliceTest.aRotationThatKeepsAPinEntryIsRefused
          - RotationSliceTest.aStalePinStoreRevisionRollsTheWholeRotationBack
          - RotationSliceTest.anAccountWithNoDocumentYetGetsBothBornInTheRotation
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: nothing-outlives-the-rotation-it-raced
    text: A device wrap or a pairing delegation racing the rotation either committed before it — and is deleted, superseded or cut by it — or decides after it and is refused, so no channel bound under the old Master Key survives it; a rotation from a session a password change revoked while it waited writes nothing.
    coverage:
      backend:
        integration: [CredentialResetRaceSliceTest.aDeviceWrapDoesNotSurviveTheResetChangeOrRotationItRaced, CredentialResetRaceSliceTest.aPairingDelegationDoesNotSurviveTheResetChangeOrRotationItRaced, CredentialResetRaceSliceTest.aChangeOrRotationDecidesAgainstWhatTheCleanupItWaitedForWrote]
  - id: self-served-scopes-rekeyed
    text: Every scope the holder is the sole member of (the personal scope) is advanced to a new epoch, chain-linked to its predecessor and granted to the NEW identity, so the old identity reads no post-rotation content there.
    coverage:
      backend: { integration: [RotationSliceTest.aSoleMemberScopeIsLeftForTheCallerAndQueuesNothing] }
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: shared-scopes-queued-not-self-served
    # The negative owes a control, and here it is the same job: the co-member's claim SUCCEEDS on the very job
    # the rotator is refused. Without it the assertion passes equally against a rotation nobody can complete.
    text: >
      Every shared scope gets a SCOPE_ROTATION job that ANOTHER OWNER completes; the rotator may never drive their own
      re-grant — not by claiming it (on a job already queued when the rotation ran, or a leased one whose lease
      lapses, from both of which they are excluded), and not by committing the rotation directly with a client of
      their own: rotateScope refuses them while a live job carries their exclusion (403 rotation_excluded), and
      afterwards while their own grant is behind (409 stale_epoch), until a human re-admits them. Without this an
      attacker holding the old identity would mint the new epoch, wrap it to their own new identity and exclude the
      legitimate holder.
    coverage:
      backend:
        unit:
          - RotationPolicyTest.refusesACallerAnAccountRotationExcluded
          - RotationPolicyTest.refusesACallerWhoseGrantIsBehindTheScope
          - RotationPolicyTest.refusesACallerWhoHoldsNoGrant
        integration:
          - RotationSliceTest.theRotatorCannotClaimTheirOwnRotationButACoMemberCan
          - RotationSliceTest.aScopeThatAlreadyHadALiveRotationStillExcludesTheRotator
          - RotationSliceTest.anAccountRotationDuringALeaseGetsItsOwnJobAndExcludesTheRotatorFromBoth
          - RotationSliceTest.theRotatorCannotCommitWhileTheirExclusionIsLive
          - RotationSliceTest.afterTheCoveringRotationTheRotatorIsBehindUntilReAdmitted
  - id: queued-rotation-state-readable
    text: >
      §9/E3/E4: the rotator reads, at any time, the server's state of every rotation their rotation queued —
      waiting, stalled (no owner may complete it), secured (their own grant is behind, or the covering job is done)
      or failed (it dead-lettered, also when still LEASED with no attempts left) — derived from the newest job
      carrying their exclusion, never synthesised once by the client; secured is never shown while the old identity
      can hold the current epoch. From failed, and only from failed, they can queue it again, still excluded: that
      re-arms rotateScope's refusal (409 rotation_not_failed otherwise, 404 rotation_not_found on a scope their
      rotation never queued). The security panel reads it on every visit and offers the re-queue on failed only.
    coverage:
      backend:
        # The rule order is the safety property, so the pure derivation is in the PIT scope (inbox #279).
        unit:
          - CompromiseRotationPolicyTest.aGrantBehindTheScopeIsSecuredWhateverTheJobSays
          - CompromiseRotationPolicyTest.aGrantAtTheCurrentEpochIsNeverSecuredByTheGrantRule
          - CompromiseRotationPolicyTest.aLeasedJobIsDeadOnlyWhenEveryConditionHolds
          - CompromiseRotationPolicyTest.anOwnerSeesFailedOverStalledAndNothingForStatesThatNeedNobody
        integration: [RotationSliceTest.theRotatorReadsEachQueuedRotationsStateFromTheServer, RotationSliceTest.fromFailedTheRotatorRequeuesAndTheExclusionIsBack]
      web: { unit: [src/features/account/rotation/KeyRotationPanel.test.ts, src/features/account/rotation/rotateKeys.test.ts] }
  - id: outside-until-readmitted
    text: After rotating, the holder is outside every shared scope until a human there accepts the new key through the changed-key review — the worker declines delivery to a changed key and the re-grant loop skips them while the rotation proceeds. The result surface reports this per scope rather than as a success state — the self-served scopes by the client's own outcome, the queued ones by the server's re-readable state (queued-rotation-state-readable).
    coverage:
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: accept-clears-the-decline
    # The seam ADR 0028 (2) promised and nothing implemented. Its own trap is that the two mechanisms share a
    # table, so the backend test asserts BOTH halves in one run: the delivery unblocks, the rotation exclusion
    # does not — which holds by the shape of the query (a scope-rotation job has no delivery target for a
    # membership id to resolve to) rather than by a special case in it.
    text: Accepting a changed key clears the declining worker's per-job exclusion, so ADR 0028 (2)'s "the wrap then proceeds" actually holds — and clears only the caller's own declines, only on grant-delivery jobs, only for that contact, so it can never free the exclusion that keeps a rotator off their own rotation.
    coverage:
      backend:
        integration:
          - TasksSliceTest.acceptingAChangedKeyClearsTheDeclineAndMakesTheJobClaimableAgain
          - TasksSliceTest.clearingDeclinesNeverFreesARotationExclusion
      web: { unit: [src/features/account/identityPins.test.ts] }
  - id: grants-outlive-their-granters-rotation
    # Inbox #233. The reads served the granter's CURRENT key, so after this account rotated every grant it had signed
    # failed `bad_signature` before the recipient's pin was read — and an owner holding one could not open the scope
    # to complete the covering rotation. B1 was red on the untouched backend (served the new key); its lever is
    # granterOf reading the current key again, which reddens it on each read. The web unit cases pin, with real
    # signatures, what the client does with each served key (green on both trees — the client did not change);
    # the dialog and panel cases were red on the untouched client (no worker pass), lever: the pass after the pin.
    text: >
      A grant is served with the identity key its granter held when the server wrote it, so this account's rotation
      leaves every grant it signed verifiable under each recipient's existing pin, and an owner it granted can
      complete the covering rotation (whose re-grant skips this account's changed key). A recipient who accepts the
      new key before that rotation reached them refuses those grants — the retired key is never trusted again — so
      accepting a changed key first runs one pass of the scope-rotation worker, and a failing pass never blocks the
      accept.
    coverage:
      backend: { integration: [RotationSliceTest.aGrantTheRotatorSignedIsStillServedWithTheKeyThatSignedIt] }
      web:
        unit:
          - src/features/spaces/scopes.test.ts
          - src/features/spaces/ChangedKeyReviewDialog.test.ts
          - src/features/spaces/GroupMembersPanel.test.ts
        e2e: [src/features/tasks/scopeRotation.e2e.test.ts]
  - id: forward-secrecy-not-repair
    # No test can assert "no surface implies repair" — that is prose, and the coverage refs below reach only
    # the copy keys that carry it. What actually holds this is review of the four facts the panel states before
    # any button, the per-scope result status, and the use-case's EN+DE section and the wiki page that speaks for it.
    text: No surface of the flow implies that rotating undoes a compromise. Content the old identity already read is not retracted; rotation ends the exposure going forward, and the copy says so before the confirmation, not after it.
    coverage:
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
  - id: operator-blind-rotation
    text: The server sees only a replaced directory value, rewritten ciphertext wraps, epoch indices and queued jobs — the same metadata classes it already holds. It never learns a key, and the re-admission decision is never made server-side.
    coverage:
      backend: { integration: [RotationSliceTest.rotationSupersedesLivePairingChannelsAndRevokesEveryOtherSession] }
      web: { unit: [src/features/account/rotation/rotateKeys.test.ts] }
# Backend built by cr-account-key-rotation-after-compromise: POST /api/account/rotation (RotationResource →
# RotationHandler → RotationStore, one transaction), the member-count split on MembershipStore, the
# rotator-excluding origination on TasksStore, and POST /api/tasks/declines/clear. Web: the Security section of
# the settings hub, the rotation data layer, the three-valued unlock-origin record on the vault, and the two
# re-seal seams on the pin store + device register.
#
# What no green run here proves, stated so nobody quotes it as more: the live suite drives the rotation and its
# covering rotation (scopeRotation.e2e's last leg: a co-owner whose grant the rotator signed completes it, and the
# rotator is not re-granted), but not the re-admission — that a second, real key-holder accepts the new key and
# delivers needs the accept surface live and is not exercised. The slice tests prove the exclusion and the
# clearing against a seeded queue. That is a gap in *depth*, not in surface, which is why it is a note rather
# than a `gaps:` entry (both surfaces carry refs, and a covered area may not also be a gap).
