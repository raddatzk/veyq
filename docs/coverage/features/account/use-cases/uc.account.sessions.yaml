useCase: uc.account.sessions
feature: account
title: Manage active sessions — see every login, sign out remotely
# cr-account-sessions-list-and-revoke delivers it: `GET /api/sessions`, `DELETE /api/sessions/{id}` and
# `POST /api/sessions/revoke-others` on the auth spec, a `SessionFamily` carrying its opaque id + both coarse
# timestamps + the server-set current marker, the three endpoints over the existing session families, and the
# Settings → Personal → Sessions panel with per-row revoke and sign-out-everywhere-else.
#
# Until 2026-09-24 this file was `planned` and held every suite under `gaps`, on "no CI run has ever executed
# here" — a stricter bar than the corpus set any other backend or web ref. ADR 0040's note on which rows a run
# has admitted retired it: backend's and web's jobs were executed before the 2026-08-06 import, so their suites
# count on the declared run like every other ref. The crypto half waits under `gaps`, because that job has not.
#
# cr-device-wrap-join-and-remote-cutoff adds the second half of the same use-case: the device↔wrap join in the
# sealed register, ADR 0058's named escalation (sign out AND remove that device's saved key), § Devices with a
# saved key as its retry surface, and the exclusion-shaped bulk action. It is a client-side data problem — no
# contract and no backend changed — so its new criteria are all web-side, and `scripts/validate_device_shapes.py`
# is the permanent guard on the two wire shapes that could leak the join.
#
# cr-locked-sign-out-entry-point closes E3: the locked entry point on the sign-in form, its forced SESSION scope,
# its no-persist way back, and the sign-this-device-out-too tail. It is again purely web-side (no contract, no
# backend — `POST /api/sessions/revoke-others` was already `@Authenticated` and needs no unlock), and it promotes
# the structural invariant it rests on to `scripts/validate_shell_route_gate.py`: every `layout: 'app'` route
# also declares `requiresUnlock: true`, so the shortcut E3's whole shape exists to avoid cannot be taken quietly.
#
# cr-devices-and-sessions-one-rubric folds the former "This device" rubric into this one: the current device's
# row now also states how THIS device unlocks and offers the forget action, the hub's `device` section is gone
# (replaced, not redirected — ADR 0022), and the rubric is "Devices and sessions". Web-only; no contract, no
# backend, no key material moved. The property it rests on, and the only new defect the merge makes possible, is
# that the device-local status read is resolved BESIDE this view's loader rather than inside it — see the
# criterion below.
#
# What is NOT claimable here: that a revoked family's refresh token is dead *forever* rather than until the next
# purge. That is a property of the existing rotation/reuse machinery (ADR 0004), proven by the login slice tests,
# not by this use-case's own suites — citing it here would be reaching past what these tests exercise. E3 used
# to be listed beside it as "not provable end to end on this surface" because the settings hub route is
# `requiresUnlock` and a locked caller could not REACH the panel. That is now half false
# and corrected rather than left: the entry point is not the panel, so what the web suite proves is the whole
# flow at unit altitude — the entry is offered, forces SESSION, attempts no unlock, persists nothing on the way
# back, and runs revoke-then-logout in that order. What stays unprovable here is only the LIVE end-to-end shape:
# it needs two live sessions of one account, which the current e2e harness does not stand up (the same reason
# the panel's own e2e was not extended).
acceptanceCriteria:
  - id: list-shows-every-active-family
    text: >-
      An authenticated caller lists every ACTIVE session family of its own account and nothing else — each with
      its opaque id, created and last-used timestamps, and exactly one marked as the family the request arrived
      on. Revoked and expired families never appear, and no other account's family ever does. The current-marker
      is the positive control for sign-out-everywhere-else: without it, a response that marks nothing satisfies
      "the caller stayed signed in" for the wrong reason.
    coverage:
      # A second account is live throughout the slice, which turns "scoped to the caller" from a claim about the
      # SQL into an observation at the boundary; exactly one family carries the server-set current marker.
      backend:
        integration:
          - SessionManagerSliceTest.listShowsEveryActiveFamilyOfTheCallerAndMarksExactlyOneAsCurrent
          - SessionManagerSliceTest.revokedFamiliesLeaveTheList
      web: { unit: [src/features/account/sessions/SessionsPanel.test.ts] }
    gaps:
      - surface: backend
        reason: >-
          No test lists an EXPIRED family. The list filters on `status = ACTIVE` alone
          (`SessionService.listActiveFamilies`), and a family has no expired status: one whose tokens have all
          expired stays ACTIVE, and listed, until `SessionPurge` deletes its tokens and then the family
          (`purgeEmptyFamilies`). "Expired families never appear" therefore holds from the next purge on, and no
          ref here asserts even that.
  - id: revoke-one-family-remotely
    text: >-
      Revoking another family by its id ends it — a refresh presented from that family is refused afterwards —
      while the caller's own session keeps working. The call is idempotent, and an unknown or another account's
      id produces the same response as a real one, so the endpoint cannot be used to probe which ids exist. The
      negative anchors on the specific observable (the refused refresh, by its status code), never on "it threw".
    coverage:
      # Every negative carries a live control on the same predicate: the targeted revoke asserts the caller still
      # refreshes (200) beside the target's refusal (401 `refresh_rejected`), and the foreign-id case asserts the
      # other account's family still refreshes — the half a status code cannot show. On web the declined
      # confirmation guards the call site (deleting the `ask` line in `revoke()` reddens exactly that case), and
      # the row asks with its own sentence; the confirm channel itself is covered where it lives
      # (`src/shared/state/useConfirm.test.ts`, `src/shared/ui/ConfirmDialog.test.ts`).
      backend:
        integration:
          - SessionManagerSliceTest.revokingAnotherFamilyEndsItAndLeavesTheCallerSignedIn
          - SessionManagerSliceTest.revokingIsIdempotent
          - SessionManagerSliceTest.anUnknownIdAnswersLikeARealOneAndRevokesNothing
          - SessionManagerSliceTest.anotherAccountsFamilyAnswersLikeARealOneAndSurvives
      web: { unit: [src/features/account/sessions/SessionsPanel.test.ts] }
  - id: sign-out-everywhere-else
    text: >-
      One call revokes every family of the account EXCEPT the caller's own, and the caller is still able to
      refresh afterwards. This is the criterion that must not be satisfied by revoking everything: the surviving
      caller session is the assertion, not a side note.
    coverage:
      # The surviving caller session is asserted beside every other family's refusal, with a second account that
      # must keep refreshing. Web asserts the ONE endpoint that spares the caller is called, never a per-family
      # fan-out, which would include the caller's own.
      backend:
        integration:
          - SessionManagerSliceTest.signOutEverywhereElseEndsEveryOtherFamilyAndKeepsTheCallers
          - SessionManagerSliceTest.signOutEverywhereElseIsIdempotentWithNothingElseToEnd
      web: { unit: [src/features/account/sessions/SessionsPanel.test.ts] }
  - id: works-locked-names-never-reach-the-server
    text: >-
      Listing and revoking require only a session, never an unlocked vault, so a locked device can still cut off
      a lost one — it renders ids and coarse dates in place of names. Correspondingly no request in this
      use-case carries a device name, user-agent or any client-built label, and no column stores one: the server
      holds exactly what it held before (opaque id, coarse timestamps, count). A locked panel therefore also
      offers neither wrap action — both joins are sealed, so the locked ceiling does not rise with the
      escalation increment either (E3); their absence there is by construction, not by omission.
    coverage:
      # Structural, so the assertion is over SHAPE: a family exposes exactly id/createdAt/lastUsedAt/current, a
      # register response exactly blob/version, and the whole backend suite unlocks nothing. The contract half is
      # the permanent guard `scripts/validate_session_family_shape.py` (SessionFamily grows no field, and no
      # base64 one). The web locked render has the unlocked mount as its control: with the vault locked the list
      # renders, every revoke stays enabled, the register is never touched, and neither wrap action is offered.
      # One trap sits beside these: the resource mixes `@PermitAll` (logout) with `@Authenticated` (the manager),
      # and the tidier arrangement makes logout answer 401 to an invalid token — `SessionManagerSliceTest`
      # asserts both directions (`logoutStillAnswers204ForATokenThatIsNotOne` beside the refusal cited here).
      backend:
        integration:
          - SessionManagerSliceTest.aFamilyCarriesNothingButItsIdTimestampsAndTheCurrentMarker
          - SessionManagerSliceTest.theSessionManagerNeedsASessionAndRefusesWithoutOne
          - DeviceRegisterSliceTest.theRegisterCarriesNothingButTheSealedBlobAndItsVersion
      web: { unit: [src/features/account/sessions/SessionsPanel.test.ts] }
  - id: the-locked-state-is-reachable-without-a-secret-key
    text: >-
      The device this flow exists for — fresh or foreign, no Emergency Kit — can REACH the locked state at all:
      the sign-in form offers a second action exactly where its `required` Secret-Key field is, which logs in and
      attempts no unlock. Four properties are the criterion, not one. It is offered only where that field is, with
      the trusted device as its live control. It forces `SESSION` scope **even with the remember toggle on** — the
      control on the same predicate is the ordinary submit, which must still honour the toggle, or the assertion
      is about a constant rather than about the forcing. It persists **nothing** on the way back to unlocking, at
      either toggle position, with the ordinary first sign-in as its positive control — a bare "nothing was
      enrolled" is satisfied by any wholesale breakage of the enrolment path. And it signs this device out too,
      revoke-then-logout, recorded as a sequence rather than as two independent call assertions; a logout that
      fails is reported and leaves the card's own sign-out button reachable. The structural half — that no route
      is session-gated but not unlock-gated — is a permanent guard rather than a claim, because the two obvious
      shortcuts (drop `requiresUnlock` from the settings hub, or mint a locked-reachable shell route) both look
      cheaper than this shape and were refused twice.
    coverage:
      # Web-only: no contract and no backend changed (`POST /api/sessions/revoke-others` was already
      # `@Authenticated` and needs no unlock). `LoginView.test.ts` carries the entry, the forced SESSION scope with
      # the ordinary submit's PERSISTENT as its control, the way back persisting nothing at either toggle position
      # with the ordinary first sign-in as its positive control, and both ends of the sign-out tail;
      # `LockedSignOut.test.ts` records revoke-then-logout as a sequence. Three were bite-tested (drop the
      # no-persist guard, swap revoke and logout, pass the remember toggle through), each reddening its own case.
      # The structural half is `scripts/validate_shell_route_gate.py`. Not claimed: the LIVE shape, which needs
      # two live sessions of one account, and the e2e harness does not stand that up.
      web:
        unit:
          - src/views/LoginView.test.ts
          - src/features/account/sessions/LockedSignOut.test.ts
  - id: names-come-from-the-sealed-register
    text: >-
      An unlocked client labels each family the Master-Key-sealed device register can join to a device, and a
      family the register cannot name renders under its anonymous heading with its revoke intact. Both halves
      are the criterion, not one: a panel that dropped unnamed rows would satisfy the naming half perfectly
      while hiding the very device this screen exists to find (E4). The register itself round-trips through real
      crypto, and a blob sealed under a different key degrades to an empty register rather than throwing.
    coverage:
      # The server only relays the sealed blob — born empty, round-tripped verbatim. `deviceRegister.test.ts` runs
      # real crypto against a mocked API and vault; the panel asserts the named row WITH the unnamed row as its
      # control, and that a throwing register leaves the list revocable.
      backend:
        integration:
          - DeviceRegisterSliceTest.bornEmptyRegisterReadsNullBlobVersionZero
          - DeviceRegisterSliceTest.firstWriteRoundTripsAndBumpsToVersionOne
      web:
        unit:
          - src/features/account/deviceRegister.test.ts
          - src/features/account/deviceIdentity.test.ts
          - src/features/account/sessions/SessionsPanel.test.ts
  - id: the-register-is-repaired-never-queued
    text: >-
      The sessions view reconciles the register against the authoritative family list it is holding — pruning
      families the server no longer lists, and recording the current family from the SERVER's own marker when
      the unlock-time write could not (a cold boot restore never learned its own family id). There is no retry
      queue: a register write that fails leaves rows unnamed and the next open repairs them. The load-bearing
      case is the merge discipline, and it is the one case that distinguishes the two candidate implementations:
      a family created by another device BETWEEN this client's read and its write must survive the stale-version
      retry (a frozen id-delta), while eviction must be recomputed on the merged map. Every other assertion
      passes under both formulations.
    coverage:
      # Each 409 case also asserts the stored blob is UNTOUCHED — a status alone does not show that, and the
      # client's merge argument rests on being genuinely forced through the re-read. The web fake server
      # reimplements the optimistic concurrency, so the 409 path is exercised rather than stubbed. The frozen
      # id-delta (a family, and a wrap, created between read and write survives the retry) and eviction recomputed
      # on the merged map were bite-tested: injecting "keep only what I saw", or freezing eviction to the first
      # attempt, reddens exactly its own case.
      backend:
        integration:
          - DeviceRegisterSliceTest.staleVersionOnFirstWriteIsConflict
          - DeviceRegisterSliceTest.staleVersionAfterAWriteIsConflictAndLeavesTheStoredBlobIntact
          - DeviceRegisterSliceTest.aWriteAtAFutureVersionIsAlsoRejected
      web:
        unit:
          - src/features/account/deviceRegister.test.ts
          - src/features/account/sessions/SessionsPanel.test.ts
  - id: rename-the-device-not-the-session
    text: >-
      A user renames the device behind a row, and the new name reaches every session of that device — a device
      is one-to-many with its sessions, and the copy says so. A rename survives a concurrent write (later write
      wins, because renaming is deliberate), a sign-in never reverts one, an empty rename is not written, and a
      family the register cannot name offers no rename at all — while still offering its revoke.
    coverage:
      # Client-side: a rename is a register write, which the server relays like any other.
      web:
        unit:
          - src/features/account/deviceRegister.test.ts
          - src/features/account/sessions/SessionsPanel.test.ts
  - id: removing-a-device-key-is-a-named-escalation
    text: >-
      A revoke on its own never touches key material; removing a device's convenience wrap is a second,
      separately named action, offered only where the register names a SERVED wrap for that device (ADR 0058).
      Both halves are the criterion: the row the register can escalate offers it, and the row it cannot does not
      — while keeping its plain revoke, since a missing join is a naming gap and never a reason to hide the
      action this screen exists for. It is never a checkbox on the revoke and never a default, because the
      consequence lands on a person holding another device, who then needs their Emergency Kit. It is also never
      offered on the caller's OWN row: the local equivalent drops the local key too, and the remote-only half
      would leave this browser holding a record whose wrap is gone. "Separately named" means named **visibly**
      in the row, not only in its accessible name: the button carries a short visible label, keeps the full
      sentence as its accessible name and as the confirmation's subject, and the panel's own hint quotes the
      visible one — a label a reader cannot see is a name the copy around it cannot honestly refer to.
    coverage:
      # No backend code was added: `DELETE /api/account/wraps/{id}` was already account-scoped and already
      # deletes both device methods — the escalation is two calls the account could always make, newly joined on
      # the client. "Never on the caller's OWN row" is decided in the register view (`deviceRegister.test.ts`: it
      # never offers this device's own wrap), not in the panel, which renders whatever the view joins; the panel's
      # two-actions case feeds it a view that joins the current row on purpose. The visible label is pinned
      # against its accessible name, and the panel hint quotes it in BOTH locales (editing one alone reddens it).
      backend:
        integration:
          - AccountWrapsSliceTest.deleteByIdRemovesTheWrap
          - AccountWrapsSliceTest.deleteRemovesDeviceKeyWrap
      web:
        unit:
          - src/features/account/sessions/SessionsPanel.test.ts
          - src/features/account/deviceRegister.test.ts
  - id: escalation-cuts-the-family-first-and-tells-the-truth-on-a-half-success
    text: >-
      The escalation runs family-first, wrap-second, and the ORDER is the assertion — the revoke stops an
      attacker who is online now, the wrap only matters at a future sign-in, so the urgent half must never be
      blocked by the other. When the revoke fails the wrap is never touched (the reverse half-failure cannot
      occur). When only the wrap deletion fails, the user is told exactly that — signed out, saved key NOT
      removed (E5) — rather than a message that reads as total success or total failure; the retry surface is §
      Devices with a saved key, which the join row still feeds because a join row is pruned only from a later
      read of the server's wrap list, never from a delete this client merely attempted.
    coverage:
      # Client-side ordering over two existing calls. The order is recorded as a sequence, not as two independent
      # call assertions (swapping the halves reddens three cases by name); a failed revoke never touches the wrap;
      # the half-success message is E5's. The register prunes a join row only from a later read of the served
      # list, which is what keeps the retry surface fed.
      web:
        unit:
          - src/features/account/sessions/SessionsPanel.test.ts
          - src/features/account/deviceRegister.test.ts
  - id: devices-with-a-saved-key-is-derived-not-invented
    text: >-
      Below the session list, a device the register knows that holds a served wrap and has NO live family is
      listed with its own removal. The set is derived from the two lists the view already holds — the register's
      device↔wrap join and the server's family list — so a device with a live session never appears there, and a
      wrap the server no longer serves is never claimed into existence. When the served list could not be
      fetched at all, that is carried as "unknown" and not as "there are none": no wrap-shaped action is
      offered, and no join row is pruned — the difference is what keeps a transport error from emptying the
      register's third map.
    coverage:
      # A failed served-list fetch reaches the register as `null`, never `[]`: unknown prunes nothing and offers
      # no wrap action, a measured empty list does prune. The section is absent when the only saved key is this
      # device's own, with a foreign key as its live control.
      web:
        unit:
          - src/features/account/deviceRegister.test.ts
          - src/features/account/sessions/SessionsPanel.test.ts
  - id: reaching-an-unnameable-wrap-is-defined-by-exclusion
    text: >-
      The only handle on a wrap the register never knew is "remove every saved key except this device's",
      defined by excluding what this client can verify locally (its own wrap id, read from its LOCAL trust or
      remember record) and never by a claim about the others — no "these N wraps are recognised by no device"
      list may be offered, because the wrap table has no timestamps and nothing can tell an orphan from a device
      that has not signed in yet (ADR 0058 §5). The caller's own saved key survives it; a caller holding none
      removes all of them and is unharmed by that. The client filters to the two device methods for honesty, but
      the server's DELETE whitelist is the guarantee.
    coverage:
      # The server's DELETE whitelist is the guarantee, and `AccountWrapsSliceTest` pins it: the PASSWORD floor, a
      # non-device wrap and another account's wrap all survive a delete. The client's own-wrap answer comes from
      # the LOCAL trust/remember record, never the register or the server (`localWrap.test.ts`, including an
      # unusable store answering "none"); dropping the exclusion filter reddens two panel cases by name. The
      # client's filter to the two device methods (`savedKeys.ts`) has no suite of its own — the panel mocks it.
      backend:
        integration:
          - AccountWrapsSliceTest.deletingPasswordWrapIsNoOp
          - AccountWrapsSliceTest.deletingNonDeviceWrapIsNoOp
          - AccountWrapsSliceTest.anotherUsersDeleteIsNoOp
      web:
        unit:
          - src/features/account/sessions/SessionsPanel.test.ts
          - src/features/account/localWrap.test.ts
  - id: the-current-row-says-how-this-device-unlocks
    text: >-
      The current device's row states this device's own unlock tier (remembered / trusted / none, or "this
      browser cannot remember a device") and offers the forget action beside it — one rubric answering both
      questions a person has about a device, rather than two rubrics stating the same fact in two vocabularies.
      Three properties are the criterion, not one. The status is a fact about THIS device, so no other row
      carries it. The list never WAITS on it: the status read is device-local, unbounded IndexedDB work, so a
      read that hangs forever must still leave every row rendered and every revoke working — the trap this panel
      exists not to fall into, and the one defect the merge newly makes possible (a read pulled into the loader
      takes the whole list down with it). And forgetting stays a DIFFERENT action from the escalation above:
      forgetting reaches this device's local key as well as its server wrap and leaves the session alone, while
      the escalation ends a session and can only ever reach the server's wrap — the server cannot reach a remote
      device's local key, and that asymmetry is what forbids collapsing the two into one "remove this device"
      button (ADR 0058). Two labels, two confirms, two severities.
    coverage:
      # The status read resolves BESIDE the loader, never inside it: a read that hangs forever still leaves every
      # row rendered and revocable, and a failed read offers nothing, with a succeeding read as its live control.
      # Both were bite-tested by moving the read into `useAsyncData`, which reddens exactly those two cases. Forget
      # and escalation stay two actions — two labels, two confirms, two mechanisms (the shared `ask()` against the
      # forget's own dialog, which carries the busy state and inline error it needs).
      web: { unit: [src/features/account/sessions/SessionsPanel.test.ts] }
  - id: the-device-wrap-join-never-reaches-the-server
    text: >-
      The join lives only inside the Master-Key-sealed register: the PUT body is exactly a sealed blob and a
      version, and neither the wrap id nor the device label is legible in it. The wire shapes that would leak
      the correlation while everything kept working — a cleartext wrap-id list on the register, or a deviceId /
      label / timestamp on MasterKeyWrap — are pinned as a permanent contract guard rather than as prose, since
      no test would catch either. The register also stays off every unlock path in both directions: a device
      finds its own wrap by the id in its local record, so a pruned or withheld join row can never cost anyone
      access.
    coverage:
      # The PUT body is exactly `blob` + `version`, and neither the wrap id nor the device label is legible in it.
      # The wire shapes that would leak the correlation while everything kept working are the permanent guard
      # `scripts/validate_device_shapes.py`, since no test would catch them. A sealed ROUND-TRIP that supplies
      # neither map a second time was bite-tested in both directions (drop the map from the seal, then from the
      # unseal), because `sealRegister`/`unsealRegister` enumerate the maps by name. Of "off every unlock path",
      # what is tested is where a device finds its own wrap — its local record (`localWrap.test.ts`); no unlock
      # suite asserts the register's absence.
      backend:
        integration:
          - DeviceRegisterSliceTest.theRegisterCarriesNothingButTheSealedBlobAndItsVersion
      web:
        unit:
          - src/features/account/deviceRegister.test.ts
          - src/features/account/localWrap.test.ts
gaps:
  crypto: >-
    `packages/crypto`'s job (`ci.yml` → `frontend` → "Run shared crypto checks") has never executed, so ADR 0040
    admits none of its suites: a declared run is enough only on a job a run has already executed (its note on
    which rows a run has admitted). `src/v1.conformance.test.ts` pins the register's own AAD context against the
    `sym_device_register` vector and asserts its domain separation from `identity-pins`, so a register blob can
    never be read as a pin store. On the first run whose log shows packages/crypto's suites executed, the suite
    goes under `the-device-wrap-join-never-reaches-the-server`, the criterion that rests on the register being
    sealed, and this gap goes.
