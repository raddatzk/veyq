useCase: uc.account.sessions
feature: account
title: Manage active sessions — see every login, sign out remotely
# cr-account-sessions-list-and-revoke delivers it: `GET /api/sessions`, `DELETE /api/sessions/{id}` and
# `POST /api/sessions/revoke-others` on the auth spec, a `SessionFamily` carrying its opaque id + both coarse
# timestamps + the server-set current marker, the three endpoints over the existing session families, and the
# Settings → Personal → Sessions panel with per-row revoke and sign-out-everywhere-else.
#
# `status: planned` is nonetheless correct, and it is the same call uc.admin.identify-instance-release makes,
# for the same single reason: **no CI run has ever executed here.** This repository has no remote, so ADR 0040's
# rule — a test no CI run executes makes no coverage claim — leaves every criterion uncovered however green the
# suites are locally. They DO exist and pass; naming them below keeps the later flip mechanical (docs/inbox.md
# #26). The one remaining condition is an event, not a missing test.
#
# cr-device-wrap-join-and-remote-cutoff adds the second half of the same use-case: the device↔wrap join in the
# sealed register, ADR 0058's named escalation (sign out AND remove that device's saved key), § Devices with a
# saved key as its retry surface, and the exclusion-shaped bulk action. It is a client-side data problem — no
# contract and no backend changed — so its new criteria are all web-side, and `scripts/validate_device_shapes.py`
# is the permanent guard on the two wire shapes that could leak the join.
#
# cr-locked-sign-out-entry-point closes E3: the locked entry point on the sign-in form, its forced SESSION scope,
# its no-persist way back, and the sign-this-device-out-too tail. It is again purely web-side (no contract, no
# backend — `POST /api/sessions/revoke-others` was already `@Authenticated` and needs no unlock), and it promotes
# the structural invariant it rests on to `scripts/validate_shell_route_gate.py`: every `layout: 'app'` route
# also declares `requiresUnlock: true`, so the shortcut E3's whole shape exists to avoid cannot be taken quietly.
#
# What will NOT become claimable here even then: that a revoked family's refresh token is dead *forever* rather
# than until the next purge. That is a property of the existing rotation/reuse machinery (ADR 0004), proven by
# the login slice tests, not by this use-case's own suites — citing it here would be reaching past what these
# tests exercise. E3 used to be listed beside it as "not provable end to end on this surface" because the
# settings hub route is `requiresUnlock` and a locked caller could not REACH the panel. That is now half false
# and corrected rather than left: the entry point is not the panel, so what the web suite proves is the whole
# flow at unit altitude — the entry is offered, forces SESSION, attempts no unlock, persists nothing on the way
# back, and runs revoke-then-logout in that order. What stays unprovable here is only the LIVE end-to-end shape:
# it needs two live sessions of one account, which the current e2e harness does not stand up (the same reason
# the panel's own e2e was not extended).
status: planned
acceptanceCriteria:
  - id: list-shows-every-active-family
    text: >-
      An authenticated caller lists every ACTIVE session family of its own account and nothing else — each with
      its opaque id, created and last-used timestamps, and exactly one marked as the family the request arrived
      on. Revoked and expired families never appear, and no other account's family ever does. The current-marker
      is the positive control for sign-out-everywhere-else: without it, a response that marks nothing satisfies
      "the caller stayed signed in" for the wrong reason.
  - id: revoke-one-family-remotely
    text: >-
      Revoking another family by its id ends it — a refresh presented from that family is refused afterwards —
      while the caller's own session keeps working. The call is idempotent, and an unknown or another account's
      id produces the same response as a real one, so the endpoint cannot be used to probe which ids exist. The
      negative anchors on the specific observable (the refused refresh, by its status code), never on "it threw".
  - id: sign-out-everywhere-else
    text: >-
      One call revokes every family of the account EXCEPT the caller's own, and the caller is still able to
      refresh afterwards. This is the criterion that must not be satisfied by revoking everything: the surviving
      caller session is the assertion, not a side note.
  - id: works-locked-names-never-reach-the-server
    text: >-
      Listing and revoking require only a session, never an unlocked vault, so a locked device can still cut off
      a lost one — it renders ids and coarse dates in place of names. Correspondingly no request in this
      use-case carries a device name, user-agent or any client-built label, and no column stores one: the server
      holds exactly what it held before (opaque id, coarse timestamps, count). A locked panel therefore also
      offers neither wrap action — both joins are sealed, so the locked ceiling does not rise with the
      escalation increment either (E3); their absence there is by construction, not by omission.
  - id: the-locked-state-is-reachable-without-a-secret-key
    text: >-
      The device this flow exists for — fresh or foreign, no Emergency Kit — can REACH the locked state at all:
      the sign-in form offers a second action exactly where its `required` Secret-Key field is, which logs in and
      attempts no unlock. Four properties are the criterion, not one. It is offered only where that field is, with
      the trusted device as its live control. It forces `SESSION` scope **even with the remember toggle on** — the
      control on the same predicate is the ordinary submit, which must still honour the toggle, or the assertion
      is about a constant rather than about the forcing. It persists **nothing** on the way back to unlocking, at
      either toggle position, with the ordinary first sign-in as its positive control — a bare "nothing was
      enrolled" is satisfied by any wholesale breakage of the enrolment path. And it signs this device out too,
      revoke-then-logout, recorded as a sequence rather than as two independent call assertions; a logout that
      fails is reported and leaves the card's own sign-out button reachable. The structural half — that no route
      is session-gated but not unlock-gated — is a permanent guard rather than a claim, because the two obvious
      shortcuts (drop `requiresUnlock` from the settings hub, or mint a locked-reachable shell route) both look
      cheaper than this shape and were refused twice.
  - id: names-come-from-the-sealed-register
    text: >-
      An unlocked client labels each family the Master-Key-sealed device register can join to a device, and a
      family the register cannot name renders under its anonymous heading with its revoke intact. Both halves
      are the criterion, not one: a panel that dropped unnamed rows would satisfy the naming half perfectly
      while hiding the very device this screen exists to find (E4). The register itself round-trips through real
      crypto, and a blob sealed under a different key degrades to an empty register rather than throwing.
  - id: the-register-is-repaired-never-queued
    text: >-
      The sessions view reconciles the register against the authoritative family list it is holding — pruning
      families the server no longer lists, and recording the current family from the SERVER's own marker when
      the unlock-time write could not (a cold boot restore never learned its own family id). There is no retry
      queue: a register write that fails leaves rows unnamed and the next open repairs them. The load-bearing
      case is the merge discipline, and it is the one case that distinguishes the two candidate implementations:
      a family created by another device BETWEEN this client's read and its write must survive the stale-version
      retry (a frozen id-delta), while eviction must be recomputed on the merged map. Every other assertion
      passes under both formulations.
  - id: rename-the-device-not-the-session
    text: >-
      A user renames the device behind a row, and the new name reaches every session of that device — a device
      is one-to-many with its sessions, and the copy says so. A rename survives a concurrent write (later write
      wins, because renaming is deliberate), a sign-in never reverts one, an empty rename is not written, and a
      family the register cannot name offers no rename at all — while still offering its revoke.
  - id: removing-a-device-key-is-a-named-escalation
    text: >-
      A revoke on its own never touches key material; removing a device's convenience wrap is a second,
      separately named action, offered only where the register names a SERVED wrap for that device (ADR 0058).
      Both halves are the criterion: the row the register can escalate offers it, and the row it cannot does not
      — while keeping its plain revoke, since a missing join is a naming gap and never a reason to hide the
      action this screen exists for. It is never a checkbox on the revoke and never a default, because the
      consequence lands on a person holding another device, who then needs their Emergency Kit. It is also never
      offered on the caller's OWN row: the local equivalent drops the local key too, and the remote-only half
      would leave this browser holding a record whose wrap is gone.
  - id: escalation-cuts-the-family-first-and-tells-the-truth-on-a-half-success
    text: >-
      The escalation runs family-first, wrap-second, and the ORDER is the assertion — the revoke stops an
      attacker who is online now, the wrap only matters at a future sign-in, so the urgent half must never be
      blocked by the other. When the revoke fails the wrap is never touched (the reverse half-failure cannot
      occur). When only the wrap deletion fails, the user is told exactly that — signed out, saved key NOT
      removed (E5) — rather than a message that reads as total success or total failure; the retry surface is §
      Devices with a saved key, which the join row still feeds because a join row is pruned only from a later
      read of the server's wrap list, never from a delete this client merely attempted.
  - id: devices-with-a-saved-key-is-derived-not-invented
    text: >-
      Below the session list, a device the register knows that holds a served wrap and has NO live family is
      listed with its own removal. The set is derived from the two lists the view already holds — the register's
      device↔wrap join and the server's family list — so a device with a live session never appears there, and a
      wrap the server no longer serves is never claimed into existence. When the served list could not be
      fetched at all, that is carried as "unknown" and not as "there are none": no wrap-shaped action is
      offered, and no join row is pruned — the difference is what keeps a transport error from emptying the
      register's third map.
  - id: reaching-an-unnameable-wrap-is-defined-by-exclusion
    text: >-
      The only handle on a wrap the register never knew is "remove every saved key except this device's",
      defined by excluding what this client can verify locally (its own wrap id, read from its LOCAL trust or
      remember record) and never by a claim about the others — no "these N wraps are recognised by no device"
      list may be offered, because the wrap table has no timestamps and nothing can tell an orphan from a device
      that has not signed in yet (ADR 0058 §5). The caller's own saved key survives it; a caller holding none
      removes all of them and is unharmed by that. The client filters to the two device methods for honesty, but
      the server's DELETE whitelist is the guarantee.
  - id: the-device-wrap-join-never-reaches-the-server
    text: >-
      The join lives only inside the Master-Key-sealed register: the PUT body is exactly a sealed blob and a
      version, and neither the wrap id nor the device label is legible in it. The wire shapes that would leak
      the correlation while everything kept working — a cleartext wrap-id list on the register, or a deviceId /
      label / timestamp on MasterKeyWrap — are pinned as a permanent contract guard rather than as prose, since
      no test would catch either. The register also stays off every unlock path in both directions: a device
      finds its own wrap by the id in its local record, so a pruned or withheld join row can never cost anyone
      access.
gaps:
  backend: >-
    The suite exists and passes locally; the only missing thing is a CI run to execute it (ADR 0040).
    `DeviceRegisterSliceTest` (cr-account-sealed-device-register) covers the register's own endpoints: born-empty,
    round-trip, bump, and four conflict cases — each of which also asserts the store is UNTOUCHED, because a 409
    status alone does not show that, and the client's whole merge argument rests on being genuinely forced
    through the re-read path. Its shape assertion (a register response is exactly `blob` + `version`) is the
    server-side half of "no name ever reaches the server"; the contract-side half is now a permanent guard,
    `scripts/validate_session_family_shape.py`, which fails if `SessionFamily` grows any field or any base64 one.
    `SessionManagerSliceTest` covers all four criteria over the full HTTP stack, with a second account live
    throughout — which is what turns "scoped to the caller" from a claim about the SQL into an observation at
    the boundary. Every negative carries a live control on the same predicate, because each is trivially
    satisfied by an over-broad implementation: a targeted revoke asserts the caller still refreshes (200) beside
    the target's refusal (401 `refresh_rejected`), "everywhere else" asserts the same, and the two
    same-answer-for-a-foreign-id cases assert that the foreign family still refreshes — the half a status code
    cannot show. The operator-blind criterion is structural, so the assertion is over the response SHAPE (a
    family exposes exactly id/createdAt/lastUsedAt/current, and no name-shaped field), plus the fact that the
    whole suite unlocks nothing. One further trap is pinned there rather than left to review: the resource
    mixes `@PermitAll` (logout) with `@Authenticated` (the manager), and the tidier-looking arrangement — an
    authenticated class with `@PermitAll` on logout — makes logout answer 401 to an invalid token. Both
    directions are asserted, so neither can be "fixed" into the other silently. The wrap-join increment adds no
    backend test because it adds no backend code: `DELETE /api/account/wraps/{id}` is already account-scoped and
    already whitelists DEVICE + DEVICE_KEY, and `AccountWrapsSliceTest` / `AccountKeyMaterialSliceTest` already
    pin that whitelist — the escalation is two calls the account could always make, newly joined on the client.
  web: >-
    Same condition, same one event. The device register (cr-account-sealed-device-register) adds
    `src/features/account/deviceRegister.test.ts` — real crypto, mocked API + vault, with a fake server that
    reimplements the optimistic concurrency so the 409 path is exercised rather than stubbed — plus
    `src/features/account/deviceIdentity.test.ts` for the stable id and the label guess, and six new cases in
    `SessionsPanel.test.ts` (named row WITH the unnamed row as its control, the reconcile arguments incl. the
    server-set current family, the locked case asserting the register is never touched, a throwing register that
    leaves the list revocable, the rename, and the empty rename). Two of those tests were bite-tested rather
    than trusted: injecting "keep only what I saw" in place of the frozen id-delta, and freezing eviction to the
    first attempt, each reddens exactly its own case by name and nothing else — which is what makes them a
    guard on the merge discipline rather than a description of it. The register's own AAD context is
    vector-pinned (`sym_device_register`) and its domain separation from `identity-pins` is asserted in
    `v1.conformance.test.ts`. `web/src/features/account/sessions/SessionsPanel.test.ts` covers the list
    (both dates, exactly one server-set "this device" marker, the short id as the handle an unnamed row goes
    by), the targeted revoke, the revoke-self path (treated as a logout, back to the sign-in screen), and the
    everywhere-else action — asserting it calls the ONE endpoint that spares the caller rather than fanning out
    per-family revokes, which would include the caller's own. The locked render is its own case with the
    unlocked mount as its control: with `vaultState.unlocked = false` the list still renders and every revoke
    button is still enabled, which is the trap this panel exists not to fall into. E2E is deliberately not
    extended here — the flow needs two live sessions of one account, which the current harness does not stand up.
    cr-device-wrap-join-and-remote-cutoff extends the same two files rather than adding a surface. In
    `deviceRegister.test.ts`: the wrap map's own frozen id-delta (a wrap another device minted between our read
    and our write survives the 409 retry — the mirror of the family case, and the one that would otherwise
    silently un-escalate the device it just named), eviction taking wrap rows with their device, the
    null-vs-empty served list (unknown prunes nothing, a measured empty list does), and a sealed ROUND-TRIP that
    supplies neither the family nor the wrap a second time — because `sealRegister`/`unsealRegister` enumerate
    the maps by name, so a third map wired everywhere except those two is dropped on write while every
    in-memory assertion stays green. That round-trip case was bite-tested in both directions (drop the map from
    the seal, then from the unseal) and reddens by name each time. In `SessionsPanel.test.ts`: the escalation's
    ordering (recorded as a sequence, not as two independent call assertions), the never-touch-the-wrap-on-a-
    failed-revoke case, the E5 half-success message, the offered/not-offered pair, § Devices with a saved key and
    its per-device removal, the exclusion-shaped bulk action with its own-wrap-survives assertion plus the
    holds-no-wrap case, the section's absence when the only saved key is this device's own (with a foreign key
    as its live control), the locked panel offering neither action while still revoking, and the failed
    key-material fetch passing `null` rather than `[]`. The ordering and the exclusion were bite-tested too:
    swapping the two halves reddens three cases by name, and dropping the exclusion filter reddens two.
    `localWrap.test.ts` pins where the "which wrap is mine" answer comes from — the local trust/remember record,
    never the register and never the server's list — including that an unusable local store answers "none"
    rather than throwing, which is the safe direction for both of its callers.
    cr-locked-sign-out-entry-point adds E3's two files. `src/views/LoginView.test.ts` is that view's FIRST
    harness — it had none at all, and E3 is a 100 % LoginView change, so standing it up was the largest single
    cost of the increment. It covers the entry being offered exactly where the Secret-Key field is (with the
    trusted device as its live control), the forced `SESSION` scope with the remember toggle ON (with the
    ordinary submit's `PERSISTENT` as the control that keeps the forcing from being a constant), the way back
    persisting nothing at either toggle position (with the ordinary first sign-in's `cacheSessionVault` /
    `trustThisDevice` / `enrolDeviceKey` as the positive control on the same predicate), and both ends of the
    sign-out tail — the success case leaving no session behind, the failed logout leaving the card's own
    sign-out button reachable. `src/features/account/sessions/LockedSignOut.test.ts` owns the component: the
    revoke-then-logout ORDER recorded as a sequence, the never-touch-the-session-on-a-failed-revoke case, the
    half-success boolean, the declined confirmation, and the way-back emit touching neither call. Three of these
    were bite-tested rather than trusted — dropping the no-persist guard, swapping revoke and logout, and passing
    the remember toggle through each redden exactly their own case by name while their controls stay green.
    The route-gate guard was bite-tested in the same way and its FIRST shape was wrong: blanking string bodies to
    keep brace matching honest also blanked `'app'`, so it reported zero shell routes and passed everything. Its
    bite is four cases — green untouched (three shell routes), red with `requiresUnlock` stripped from
    `/settings/:section?`, red on a NEW shell route with no gate (so it is not merely pinned to the routes that
    happen to exist), and GREEN on a comment carrying the phrase, which is the false positive the line-based
    first probe produced.
