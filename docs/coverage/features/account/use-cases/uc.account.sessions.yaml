useCase: uc.account.sessions
feature: account
title: Manage active sessions — see every login, sign out remotely
# cr-account-sessions-list-and-revoke delivers it: `GET /api/sessions`, `DELETE /api/sessions/{id}` and
# `POST /api/sessions/revoke-others` on the auth spec, a `SessionFamily` carrying its opaque id + both coarse
# timestamps + the server-set current marker, the three endpoints over the existing session families, and the
# Settings → Personal → Sessions panel with per-row revoke and sign-out-everywhere-else.
#
# `status: planned` is nonetheless correct, and it is the same call uc.admin.identify-instance-release makes,
# for the same single reason: **no CI run has ever executed here.** This repository has no remote, so ADR 0040's
# rule — a test no CI run executes makes no coverage claim — leaves every criterion uncovered however green the
# suites are locally. They DO exist and pass; naming them below keeps the later flip mechanical (docs/inbox.md
# #26). The one remaining condition is an event, not a missing test.
#
# What will NOT become claimable here even then: that a revoked family's refresh token is dead *forever* rather
# than until the next purge. That is a property of the existing rotation/reuse machinery (ADR 0004), proven by
# the login slice tests, not by this use-case's own suites — citing it here would be reaching past what these
# tests exercise. Nor is E3 provable end to end on this surface: the settings hub route is `requiresUnlock`, so
# a locked caller cannot yet REACH the panel. What the web suite proves is the half that is this CR's — the
# panel itself takes no vault dependency and disables nothing when the vault is locked.
status: planned
acceptanceCriteria:
  - id: list-shows-every-active-family
    text: >-
      An authenticated caller lists every ACTIVE session family of its own account and nothing else — each with
      its opaque id, created and last-used timestamps, and exactly one marked as the family the request arrived
      on. Revoked and expired families never appear, and no other account's family ever does. The current-marker
      is the positive control for sign-out-everywhere-else: without it, a response that marks nothing satisfies
      "the caller stayed signed in" for the wrong reason.
  - id: revoke-one-family-remotely
    text: >-
      Revoking another family by its id ends it — a refresh presented from that family is refused afterwards —
      while the caller's own session keeps working. The call is idempotent, and an unknown or another account's
      id produces the same response as a real one, so the endpoint cannot be used to probe which ids exist. The
      negative anchors on the specific observable (the refused refresh, by its status code), never on "it threw".
  - id: sign-out-everywhere-else
    text: >-
      One call revokes every family of the account EXCEPT the caller's own, and the caller is still able to
      refresh afterwards. This is the criterion that must not be satisfied by revoking everything: the surviving
      caller session is the assertion, not a side note.
  - id: works-locked-names-never-reach-the-server
    text: >-
      Listing and revoking require only a session, never an unlocked vault, so a locked device can still cut off
      a lost one — it renders ids and coarse dates in place of names. Correspondingly no request in this
      use-case carries a device name, user-agent or any client-built label, and no column stores one: the server
      holds exactly what it held before (opaque id, coarse timestamps, count).
gaps:
  backend: >-
    The suite exists and passes locally; the only missing thing is a CI run to execute it (ADR 0040).
    `SessionManagerSliceTest` covers all four criteria over the full HTTP stack, with a second account live
    throughout — which is what turns "scoped to the caller" from a claim about the SQL into an observation at
    the boundary. Every negative carries a live control on the same predicate, because each is trivially
    satisfied by an over-broad implementation: a targeted revoke asserts the caller still refreshes (200) beside
    the target's refusal (401 `refresh_rejected`), "everywhere else" asserts the same, and the two
    same-answer-for-a-foreign-id cases assert that the foreign family still refreshes — the half a status code
    cannot show. The operator-blind criterion is structural, so the assertion is over the response SHAPE (a
    family exposes exactly id/createdAt/lastUsedAt/current, and no name-shaped field), plus the fact that the
    whole suite unlocks nothing. One further trap is pinned there rather than left to review: the resource
    mixes `@PermitAll` (logout) with `@Authenticated` (the manager), and the tidier-looking arrangement — an
    authenticated class with `@PermitAll` on logout — makes logout answer 401 to an invalid token. Both
    directions are asserted, so neither can be "fixed" into the other silently.
  web: >-
    Same condition, same one event. `web/src/features/account/sessions/SessionsPanel.test.ts` covers the list
    (both dates, exactly one server-set "this device" marker, the short id as the handle an unnamed row goes
    by), the targeted revoke, the revoke-self path (treated as a logout, back to the sign-in screen), and the
    everywhere-else action — asserting it calls the ONE endpoint that spares the caller rather than fanning out
    per-family revokes, which would include the caller's own. The locked render is its own case with the
    unlocked mount as its control: with `vaultState.unlocked = false` the list still renders and every revoke
    button is still enabled, which is the trap this panel exists not to fall into. E2E is deliberately not
    extended here — the flow needs two live sessions of one account, which the current harness does not stand up.
