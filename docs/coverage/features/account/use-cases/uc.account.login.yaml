useCase: uc.account.login
feature: account
title: Account login (password)
acceptanceCriteria:
  - id: challenge-non-enumerable
    text: A challenge is issued for any email — existing or not — with an identical response shape.
    coverage:
      backend: { integration: [LoginSliceTest.unknownAccountIsIdenticalGenericFailure] }
  - id: valid-login-issues-session
    text: A valid signed challenge issues an opaque access+refresh session in a (nameless) family.
    coverage:
      backend: { integration: [LoginSliceTest.validLoginIssuesSession] }
      web: { unit: [src/features/account/login/login.test.ts] }
  - id: wrong-credentials-generic
    text: A wrong signature or an unknown account both fail with a single generic 401.
    coverage:
      backend: { integration: [LoginSliceTest.wrongSignatureIsGenericFailure, LoginSliceTest.unknownAccountIsIdenticalGenericFailure] }
      web: { unit: [src/features/account/login/login.test.ts] }
  - id: nonce-single-use
    text: A replayed nonce is rejected (the challenge is consumed on verify) — both sequentially and under
      concurrent verifies of the same nonce, which the atomic (row-locked) consume serializes so only one wins.
    coverage:
      backend: { integration: [LoginSliceTest.replayedNonceIsRejected, LoginSliceTest.concurrentVerifyConsumesTheChallengeOnce] }
  - id: refresh-rotates
    text: Refreshing rotates the access+refresh pair and the chain keeps rotating.
    coverage:
      backend: { integration: [LoginSliceTest.refreshRotatesAndChains] }
      web: { unit: [src/app/sessionRefresh.test.ts] }
  - id: refresh-reuse-detection
    text: A replayed superseded refresh token two or more generations behind revokes the whole family
      (reuse detection) — and so does one at distance zero, the successor a grace rotation already replaced.
    coverage:
      backend:
        integration: [LoginSliceTest.replayedSupersededRefreshRevokesFamily, LoginSliceTest.theOrphanedSuccessorIsAClone]
  - id: refresh-one-generation-grace
    text: A superseded refresh token exactly one generation behind the family's current one rotates instead of
      revoking — a client whose successor never reached it (a dropped response, or a sibling call that lost the
      race) keeps its session, and repeating the same stale presentation stays benign because the grace
      re-mints under the orphan's own generation rather than a higher one.
    coverage:
      backend:
        integration: [LoginSliceTest.refreshAfterALostResponseRotatesInsteadOfRevoking, LoginSliceTest.concurrentRefreshOfOneTokenKeepsTheFamily, LoginSliceTest.graceDoesNotIncrementSoTheNextStaleCallerIsStillAtDistanceOne]
  - id: refresh-deadlock-is-retried
    text: A rotation the database rolls back as a deadlock victim (SQLSTATE 40001) is replayed rather than
      surfaced as a 500, which a client cannot tell apart from a dead session.
    coverage:
      backend:
        unit: [SessionRotationRetryTest.retriesADeadlockVictimAndSucceeds, SessionRotationRetryTest.givesUpRatherThanLoopingForever, SessionRotationRetryTest.doesNotRetryAnythingThatIsNotASerializationFailure, SessionRotationRetryTest.findsTheSqlStateThroughTheWHOLEcauseChain]
    gaps:
      - surface: backend
        reason: >
          No test on this stack can produce the deadlock itself. The cycle is an InnoDB insert-intention gap
          lock in ux_refresh_token_hash and the test profile is H2, so the retry is proven by injection —
          a body throwing the exception the driver throws, wrapped as Hibernate wraps it — never end to end.
  - id: refresh-is-single-flight-per-tab
    text: Authed calls that 401 together share one refresh request instead of each presenting the same token.
    coverage:
      web: { unit: [src/app/sessionRefresh.test.ts] }
  - id: unknown-refresh-dos-safe
    text: An unknown refresh token is a plain 401 and revokes no family (DoS-safe).
    coverage:
      backend: { integration: [LoginSliceTest.unknownRefreshTokenIsPlain401AndRevokesNobody] }
  - id: logout-revokes-family
    text: Logout revokes the session family of the bearer access token (idempotent).
    coverage:
      backend: { integration: [LoginSliceTest.logoutRevokesFamily] }
  - id: boundary-validation
    text: Malformed requests (missing/invalid email, non-base64 signature, missing refresh token) are rejected at the boundary (400).
    coverage:
      backend: { integration: [LoginSliceTest.malformedRequestsRejectedAtTheBoundary, LoginSliceTest.refreshWithNeitherCookieNorBodyTokenIs400] }
  - id: instance-salt-stable
    text: GET /api/setup carries a stable instance salt (consumed at registration and login).
    coverage:
      backend: { integration: [LoginSliceTest.setupStatusCarriesStableInstanceSalt] }
