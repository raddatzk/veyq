useCase: uc.account.login
feature: account
title: Account login (password)
acceptanceCriteria:
  - id: challenge-non-enumerable
    text: A challenge is issued for any email — existing or not — with an identical response shape.
    coverage:
      backend: { integration: [LoginSliceTest.unknownAccountIsIdenticalGenericFailure] }
  - id: valid-login-issues-session
    text: A valid signed challenge issues an opaque access+refresh session in a (nameless) family.
    coverage:
      backend: { integration: [LoginSliceTest.validLoginIssuesSession] }
      web: { unit: [src/features/account/login/login.test.ts] }
  - id: wrong-credentials-generic
    text: A wrong signature or an unknown account both fail with a single generic 401.
    coverage:
      backend: { integration: [LoginSliceTest.wrongSignatureIsGenericFailure, LoginSliceTest.unknownAccountIsIdenticalGenericFailure] }
      web: { unit: [src/features/account/login/login.test.ts] }
  - id: nonce-single-use
    text: A replayed nonce is rejected (the challenge is consumed on verify) — per nonce, both sequentially and
      under concurrent verifies of the same nonce, which the atomic consume (a row lock on that one challenge)
      serializes so only one wins.
    coverage:
      backend: { integration: [LoginSliceTest.replayedNonceIsRejected, LoginSliceTest.concurrentVerifyConsumesTheChallengeOnce] }
  - id: challenge-not-displaceable
    text: A challenge requested, or a verify sent, by someone else for the same email never invalidates an
      outstanding one (E4) — including a verify naming a nonce that was never issued, or naming yours under
      another email.
    coverage:
      backend: { integration: [LoginSliceTest.nobodyElseCanDisplaceOrBurnYourChallenge] }
  - id: refresh-rotates
    text: Refreshing rotates the access+refresh pair and the chain keeps rotating.
    coverage:
      backend: { integration: [LoginSliceTest.refreshRotatesAndChains] }
      web: { unit: [src/app/sessionRefresh.test.ts], e2e: [src/features/account/pairing/pairing.e2e.test.ts] }
  - id: refresh-reuse-detection
    text: A replayed superseded refresh token two or more generations behind revokes the whole family
      (reuse detection) — and so does one at distance zero, the successor a grace rotation already replaced.
    coverage:
      backend:
        integration: [LoginSliceTest.replayedSupersededRefreshRevokesFamily, LoginSliceTest.theOrphanedSuccessorIsAClone]
      web: { e2e: [src/features/account/pairing/pairing.e2e.test.ts] }
  - id: refresh-one-generation-grace
    text: A superseded refresh token exactly one generation behind the family's current one rotates instead of
      revoking — a client whose successor never reached it (a dropped response, or a sibling call that lost the
      race) keeps its session, and repeating the same stale presentation stays benign because the grace
      re-mints under the orphan's own generation rather than a higher one.
    coverage:
      backend:
        integration: [LoginSliceTest.refreshAfterALostResponseRotatesInsteadOfRevoking, LoginSliceTest.concurrentRefreshOfOneTokenKeepsTheFamily, LoginSliceTest.graceDoesNotIncrementSoTheNextStaleCallerIsStillAtDistanceOne]
  - id: refresh-concurrency-decided-on-the-family
    text: Every rotation of one family queues on the family's row lock, taken before any token row, and the grace
      reads the family's CURRENT row under a lock too — so two refreshes of one token both rotate and keep the
      family whatever the isolation level, an orphan and the current token presented together cannot both rotate,
      and a reversed lock order surfaces as a failed refresh instead of a deadlock a retry hides.
    coverage:
      backend:
        integration: [LoginSliceTest.twoRefreshesOfOneTokenQueuedOnTheFamilyBothRotateAndKeepIt, LoginSliceTest.theOrphanAndTheCurrentTokenPresentedTogetherCannotForkTheChain]
  - id: refresh-is-single-flight-per-tab
    text: Authed calls that 401 together share one refresh request instead of each presenting the same token.
    coverage:
      web: { unit: [src/app/sessionRefresh.test.ts] }
  - id: unknown-refresh-dos-safe
    text: An unknown refresh token is a plain 401 and revokes no family (DoS-safe).
    coverage:
      backend: { integration: [LoginSliceTest.unknownRefreshTokenIsPlain401AndRevokesNobody] }
  - id: sign-in-uses-a-live-session-of-the-same-account
    text: The web sign-in screen reached with a live session (restored at boot, or made by its own login) unlocks
      inside it when the server names the typed or prefilled address as that session's account, under the trim and
      lower-case normalization — no challenge, no verify, no new family. Another account, or "remember me" turned on
      over a restored session, first ends the found family with a logout, before the login; a logout that fails
      mints no new family (A2, inbox #454).
    coverage:
      web: { unit: [src/views/LoginView.restoredSession.test.ts, src/views/LoginView.test.ts, src/views/LoginView.deviceSwitch.test.ts] }
  - id: logout-revokes-family
    text: Logout revokes the session family of the bearer access token (idempotent).
    coverage:
      backend: { integration: [LoginSliceTest.logoutRevokesFamily] }
  - id: refresh-without-a-token-is-no-session
    text: A refresh with neither a refresh cookie nor a body token holds no credential and is a 401 under its own code,
      `no_session` — apart from a token that arrived and was refused, `refresh_rejected`, so a log tells a signed-out
      boot from a rejected token (inbox #535).
    coverage:
      backend: { integration: [LoginSliceTest.refreshWithNoCredentialIs401NoSessionAndARejectedTokenIs401RefreshRejected] }
  - id: boundary-validation
    text: Malformed requests (missing/invalid email, non-base64 signature, missing or non-base64 nonce on verify,
      a refresh token past its bound) are rejected at the boundary (400).
    coverage:
      backend: { integration: [LoginSliceTest.malformedRequestsRejectedAtTheBoundary, LoginSliceTest.aMalformedRefreshRequestIsStill400] }
  - id: instance-salt-stable
    text: GET /api/setup carries a stable instance salt (consumed at registration and login).
    coverage:
      backend: { integration: [LoginSliceTest.setupStatusCarriesStableInstanceSalt] }
  - id: a-blocked-account-signs-in-nowhere
    # Exception flow E5, added by cr-moderation-review-and-measures (uc.moderation.take-a-measure).
    text: >-
      The Server Owner's sign-in block ends every session family of the account at once, and a correct signature then
      answers the generic auth failure until the block is lifted; a sign-in racing the block leaves no session active.
    coverage:
      backend:
        integration: [ModerationMeasuresSliceTest.aSignInBlockEndsEverySessionAndRefusesEverySignInUntilLifted, ModerationRacesSliceTest.aSignInRacingASignInBlockLeavesNoSessionOfTheAccountActive]
