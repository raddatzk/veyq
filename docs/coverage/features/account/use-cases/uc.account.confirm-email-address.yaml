useCase: uc.account.confirm-email-address
feature: account
title: Confirm the address a password reset is sent to
# Built by cr-email-address-confirmation (ADR 0074). Each criterion names the event or refusal it pins. Five were
# live defects seen red on their named assertion before the fix (the two invite branches, the reset, the budget,
# the account binding); the rest were bitten by injection, each against a positive control on the same predicate.
acceptanceCriteria:
  - id: member-invite-redemption-confirms
    # Each test's control is the neighbouring OWNER redemption (the bootstrap copy-link), which must stay unconfirmed.
    text: Redeeming a MEMBER invite confirms the account's address, on both the register and the sign-in branch, because a member invite only ever arrives by mail. Redeeming the Server Owner's bootstrap OWNER invite, and first-run setup, confirm nothing.
    coverage:
      backend:
        integration:
          - EmailConfirmationSliceTest.memberInviteRedemptionConfirms
          - EmailConfirmationSliceTest.existingAccountMemberAcceptConfirms
  - id: completed-reset-confirms
    text: Completing a password reset (the mailed token plus the Secret-Key proof) confirms the account's address. A release that is never completed confirms nothing.
    coverage:
      backend: { integration: [EmailConfirmationSliceTest.completedResetConfirms] }
  - id: confirmation-needs-the-accounts-own-session
    # The account binding and the address binding are two layers; the first test cannot tell them apart (B's
    # address differs, so either refuses), so a second holds the address check off — the mailed address moved to B —
    # and was the one that reddened with the account check absent.
    text: A confirmation link confirms only for a caller signed in as the account the token was minted for, and only while that account's address equals the one mailed. Another account's session is refused with the same answer as an unknown token, and it leaves the token live and the address unconfirmed.
    coverage:
      backend:
        integration:
          - EmailConfirmationSliceTest.confirmNeedsTheAccountsOwnSession
          - EmailConfirmationSliceTest.aTokenConfirmsOnlyForTheAccountItWasMintedFor
          - EmailConfirmationSliceTest.confirmRefusesAnAddressTheAccountNoLongerHolds
      web: { unit: [src/views/ConfirmEmailView.test.ts] }
  - id: token-hashed-expiring-superseded-single-use
    # The compare-and-set is pinned at the store: through the handler a replay is already refused by the liveness
    # read before the spend, so the CAS decides only the race that read cannot see — two spends of one live row.
    text: Only the SHA-256 hash of the one-time token is stored, bound to the account and the mailed address, with a PT24H expiry. A fresh request supersedes the outstanding token, and consumption is a compare-and-set, so a token confirms at most once.
    coverage:
      backend:
        integration:
          - EmailConfirmationSliceTest.tokenIsStoredHashedWithADayLongExpiry
          - EmailConfirmationSliceTest.supersededTokenConfirmsNothing
          - EmailConfirmationSliceTest.tokenConfirmsAtMostOnce
          - EmailConfirmationSliceTest.expiredTokenConfirmsNothing
  - id: mail-only-through-a-member-tenants-relay
    text: A confirmation is mailed only through the relay of the tenant the request's Host resolves to, and only for a member of that tenant, in veyq-fixed copy over the closed link/domain/expiry set. A non-member is refused and nothing is mailed.
    coverage:
      backend:
        integration:
          - EmailConfirmationSliceTest.nonMemberIsRefusedAndNothingIsMailed
          - EmailConfirmationSliceTest.mailCarriesOnlyLinkDomainExpiry
  - id: no-mail-no-confirmation
    text: A tenant that cannot send answers 503 mail_unavailable and mints nothing. No copy-link is ever offered.
    coverage:
      backend:
        integration:
          - EmailConfirmationSliceTest.noMailRefusesAndMintsNothing
          - EmailConfirmationSliceTest.failedSendSupersedesTheTokenAndAnswers503
      web: { unit: [src/features/account/email/EmailAddressSection.test.ts] }
  - id: send-budget-per-account
    text: Confirmation mails are bounded per account per window. A request over budget answers 429 and sends nothing.
    coverage:
      backend: { integration: [EmailConfirmationSliceTest.sendBudgetBoundsMails] }
      web: { unit: [src/features/account/email/EmailAddressSection.test.ts] }
  - id: gates-nothing
    text: An unconfirmed account is refused nothing. In particular, a password-recovery request for an unconfirmed member mints and mails a token exactly as for a confirmed one.
    coverage:
      backend: { integration: [EmailConfirmationSliceTest.unconfirmedMemberCanStillRecover] }
  - id: state-shows-the-servers-address
    text: The account holder sees the address the server holds, which is the one a reset would mail, and whether it is confirmed. The tenant owner is offered a confirmation right after saving sendable mail settings.
    coverage:
      backend: { integration: [EmailConfirmationSliceTest.theReadShowsTheServersAddress] }
      web:
        unit:
          - src/features/account/email/EmailAddressSection.test.ts
          - src/features/tenant/TenantMailSettingsPanel.test.ts
