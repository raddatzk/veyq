useCase: uc.account.unlock-with-a-pin
feature: account
title: Unlock an account on a TV with its PIN
# The PIN's mechanism on the device (F, the derivations, the picker, the idle lock) is the Kotlin core's, held by
# its conformance suite over the pin_kek / pin_verifier vectors and its session tests; the native apps are no
# coverage surface (SURFACES), so only the server's half is a ref here.
acceptanceCriteria:
  - id: enrol-keeps-share-and-verifier
    text: A DEVICE_PIN wrap is stored only with a 32-byte share and a 32-byte verifier; both are refused on every other method, and neither is ever returned with the key material.
    coverage:
      backend:
        integration:
          - PinUnlockSliceTest.enrolKeepsShareAndVerifierAndNeverServesThem
          - PinUnlockSliceTest.devicePinWithoutShareOrVerifierIs400
          - PinUnlockSliceTest.aShareOrVerifierOnAnotherMethodIs400
  - id: matching-verifier-releases-the-share
    text: A matching verifier answers the share and resets the failure count; a wrong one counts a failure and answers the attempts left.
    coverage:
      backend:
        integration: [PinUnlockSliceTest.aMatchingVerifierReleasesTheShareAndResetsTheCount]
  - id: tenth-failure-deletes-the-wrap
    text: The tenth failure in a row deletes the wrap with its share and verifier, and every later unlock answers 404.
    coverage:
      backend:
        integration: [PinUnlockSliceTest.theTenthFailureInARowDeletesTheWrapAndTheEleventhAnswers404, PinUnlockSliceTest.untrustDeletesTheWrapWithItsShare]
  - id: only-the-callers-own-wrap
    text: Another account's wrap id, or a wrap of another method, answers 404 and counts nothing.
    coverage:
      backend:
        integration: [PinUnlockSliceTest.anotherAccountsWrapAnswers404AndCountsNothing, PinUnlockSliceTest.aWrapOfAnotherMethodAnswers404]
gaps:
  web: The web takes no PIN level (ADR 0160 decision 8); nothing on it reads the DEVICE_PIN wrap but the shared enum.
