useCase: uc.account.erase-account
feature: account
title: Erase an account
# Built by cr-account-erasure. The backend's slice drives both doors over HTTP, the purge by its forced entry and the
# race against a sign-in; the web's refs are the settings' erase panel and its flow. That a restore erases an erased
# account again is the erasure ledger's (ADR 0056 decision 8), criterion `a-restore-erases-the-account-again`.
acceptanceCriteria:
  - id: both-doors-start-the-same-erasure
    text: A member with their password, and the Server Owner by address on the admin channel, both start the same pending erasure; the Server Owner's own account is refused.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.aMemberErasesTheirAccountAndThePurgeErasesWhatIsTheirsButNotTheSharedScopes
          - AccountErasureSliceTest.signInIsRefusedDuringTheWindowAndAdmittedAgainAfterAStop
          - AccountErasureSliceTest.theServerOwnersOwnAccountIsRefusedAtBothDoors
          - AccountErasureSliceTest.aWrongProofOrASpentChallengeErasesNothing
        unit: [AuthAttestationTest.theErasureStatementIsTheVectorsAndBindsTheAccountAndTheChallenge]
      web:
        unit:
          - src/features/account/erasure/eraseAccount.test.ts
          - src/features/account/erasure/EraseAccountPanel.test.ts
          - src/views/SettingsHubView.test.ts
  - id: the-account-stops-at-the-request
    text: At the request every session ends, sign-in is refused, pending invites, pairings, recoveries and address changes go, and the member removal runs in every tenant, in one transaction.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.aMemberErasesTheirAccountAndThePurgeErasesWhatIsTheirsButNotTheSharedScopes
          - AccountErasureSliceTest.noSessionOutlivesAnErasureASignInRacedAgainst
          - AccountErasureSliceTest.theErasureMailIsRetriedUntilItGoesOutAndADeletionMailsEveryMember
      web:
        unit:
          - src/features/account/erasure/eraseAccount.test.ts
          - src/views/LoginView.test.ts
          - src/features/account/trustMarks.test.ts
    gaps:
      - surface: backend
        reason: >-
          The pending invites, pairings, recoveries and address changes are superseded in the request's transaction
          (`AccountErasureHandler.start`), and the purge deletes their rows; no slice seeds each of them at the request.
  - id: the-erasure-waits-a-window-of-its-own
    text: The erasure is due the erasure's own window after the request — 14 days by default (`veyq.account.erasure.window`), not the scope trash's retention — and the purge's tick erases the account with its own scopes once due and not before; a configured window is honoured, a request keeps the due date it was given, a tenant deleted along waits out a tenant deletion's window, and the boot refuses a window that is not positive or that with a purge tick passes 28 days.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.theErasureIsDueItsOwnWindowAfterTheRequestAndTheTickTakesTheOwnScopesThen
          - AccountErasureSliceTest.aConfiguredWindowIsHonouredAndARequestKeepsTheDateItWasGiven
          - AccountErasureSliceTest.theLastOwnerMayDeleteTheTenantAlongAndASoleMembersTenantGoesWithoutAChoice
        unit:
          - AccountErasureWindowTest.theDefaultAndAnyWindowInsideTheShortestMonthAreAccepted
          - AccountErasureWindowTest.aWindowThatIsNotPositiveIsRefused
          - AccountErasureWindowTest.aWindowThatWithItsPurgeTickPassesTheShortestMonthIsRefused
  - id: the-purge-erases-every-row-keyed-on-the-account
    text: After the erasure's window the purge erases the account row and every row keyed on it, and a guard derived from the migrations holds every such table erased or cascading.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.aMemberErasesTheirAccountAndThePurgeErasesWhatIsTheirsButNotTheSharedScopes
          - MemoriesAccountErasureSliceTest.aSharedMemoryKeepsTheErasedMembersMediaAndLosesTheirFavorites
    gaps:
      - surface: backend
        reason: >-
          The guard half is `scripts/validate_account_erasure_arity.py` (the FK closure below `veyq_user`, and every
          column naming an account or its address without a key classified), which the trust-chain glob runs.
  - id: what-the-law-keeps-stays
    text: Holds, moderation records and, while a record still kept — a case, also one closed the day before, or a step on no case, also one lifted — names the account (a step over content on a tenant naming the owners its statement told), its terms acceptance rows stay under the opaque id to their own ends, a measure on the account ending with the purge; content in shared scopes keeps its attribution.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.aMeasureOnTheAccountKeepsItsTermsRowsUntilNoCaseNamesItAnyMore
          - ServerOwnerStatementSliceTest.anOwnerOfATenantTakenOfflineOverContentKeepsTheTermsRowsPastTheirErasureForAsLongAsTheStepIsKept
          - AccountErasureSliceTest.aStepLiftedTheDayBeforeTheErasureKeepsTheTermsRowsToItsDate
          - ServerOwnerStatementSliceTest.aMeasureOnAnErasedTenantOrAccountEndsWithItAndItsRecordsGoAtTheirDate
          - AccountErasureSliceTest.aMemberErasesTheirAccountAndThePurgeErasesWhatIsTheirsButNotTheSharedScopes
          - MemoriesAccountErasureSliceTest.aSharedMemoryKeepsTheErasedMembersMediaAndLosesTheirFavorites
  - id: a-restore-erases-the-account-again
    # A7. The restore's shape: the account row written back, live and with no pending row, as a capture before the
    # request holds it; the control, an account nobody erased, stays.
    text: An account erased after a backup was taken is erased again at the restored instance's start, before it serves, through the same purge, and nobody is mailed.
    coverage:
      backend:
        integration:
          - ErasureLedgerSliceTest.anErasedAccountComesBackLiveAndIsErasedAgain
  - id: the-last-holder-hands-the-key-to-the-server-owner
    # A8 (ADR 0101 decision 9, inbox #812). The step-down and the removal that would leave no holder stay refused:
    # `ModerationSliceTest.theLastHolderCannotLeaveAndTheServerOwnerMayStepDownWhileAnotherHolds`.
    text: The last holder of the moderation key erasing their own account delivers every live epoch they hold to the Server Owner in the request, who is then an accepted moderator holding them with no acceptance; without that delivery, with one short of an epoch, naming one not held or sealed to another identity, the erasure is refused and nothing written; the Server Owner's door erases the last holder only once the request confirms the key's loss, and the key is then gone; a holder who is not the last needs no delivery.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.theLastHolderIsRefusedUntilTheErasureDeliversEveryLiveEpochToTheServerOwnerWhoIsThenAModerator
          - AccountErasureSliceTest.aHolderWhoIsNotTheLastIsServedNoDeliveryAndErasesWithoutOne
          - AccountErasureSliceTest.theServerOwnersDoorErasesTheLastHolderOnlyOnceTheKeysLossIsConfirmedAndTheKeyIsThenGone
          - ErasureKeyDeliveryRacesSliceTest.aServerOwnersRotationCommittedFirstRefusesTheDeliverySealedToTheIdentityItRetired
          - ErasureKeyDeliveryRacesSliceTest.aServerOwnersRotationAfterTheDeliveryDeletesTheGrantsSealedToTheIdentityItRetired
          - ErasureKeyDeliveryRacesSliceTest.aSecondModeratorsAcceptanceAndTheDeliveryMeetOnTheEpochRowInEitherOrder
          - ModerationSliceTest.theLastHolderCannotLeaveAndTheServerOwnerMayStepDownWhileAnotherHolds
      web:
        unit:
          - src/features/moderation/serverOwnerDelivery.test.ts
          - src/features/account/erasure/eraseAccount.test.ts
          - src/features/account/erasure/EraseAccountPanel.test.ts
  - id: the-last-owner-is-handled
    text: A last owner with other members chooses at the self-service door, per tenant, to delete it along or to name a new owner from its members, and a request without that choice is refused; a sole-member tenant is deleted with the account; the Server Owner's door leaves the tenant ownerless instead of refusing.
    coverage:
      backend:
        integration:
          - AccountErasureSliceTest.theLastOwnerWithMembersChoosesAndNoChoiceIsRefused
          - AccountErasureSliceTest.theLastOwnerMayDeleteTheTenantAlongAndASoleMembersTenantGoesWithoutAChoice
          - AccountErasureSliceTest.theServerOwnersDoorNeverRefusesALastOwnerAndLeavesTheTenantOwnerless
        unit: [RemovalPolicyTest.theErasuresServerOwnerDoorCutsTheLastOwnerLikeAnyMember]
      web:
        unit:
          - src/features/account/erasure/EraseAccountPanel.test.ts
          - src/features/spaces/TenantMembersPanel.test.ts
          - src/views/TenantJoinView.handover.test.ts
gaps:
  admin-web: >-
    Built and passing locally: `src/features/instance/AccountsPanel.test.ts` (erase refused until the address is typed
    twice, the pending list and its stop, the last key holder's warning and its accept), `ModerationPanel.test.ts` (the
    notice while one person alone holds the key), `accounts.test.ts` and `src/cli/cli.test.ts` (`account erase` with
    `--lose-moderation-key`, `stop-erasure`, `erasures`). admin-web's job has never executed, so ADR 0040 admits it
    nowhere.
  crypto: >-
    `src/packages/crypto/src/v1.conformance.test.ts` asserts the erase-account statement and signature against the
    `auth_attestation.erase_account` vector; crypto's job has never executed, so ADR 0040 admits it nowhere. The backend
    asserts the same vector (`AuthAttestationTest`).
  stack: >-
    Lane L1's browser pass (`tests/e2e/tests/features/account/tenant-and-account-erasure.spec.ts`) erases an account in the settings through to
    the refused sign-in, with the last owner's choice, and stops an erasure in the console, against the release
    candidate's two images. Green only in local runs of `scripts/run_stack_e2e.py`; the lane's CI job awaits its first
    run.
