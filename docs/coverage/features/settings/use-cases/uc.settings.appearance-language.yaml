useCase: uc.settings.appearance-language
feature: settings
title: Set appearance & language
acceptanceCriteria:
  - id: theme-switch-persists
    text: Choosing a theme (system/light/dark) flips the whole palette live and is persisted on the device.
    coverage:
      web: { unit: [src/shared/state/useThemeState.test.ts] }
  - id: theme-quick-picker
    # Theme and language are one pair (ADR 0022 §5), so both quick-pickers are submenus of the sidebar profile
    # menu, built identically and marked with a check on the active entry. Neither axis is an exception, and
    # the top bar carries no preferences at all.
    text: The web profile menu carries a theme quick-picker listing System / Light / Dark with the active one checked; picking one applies it (a shortcut onto the settings hub's canonical selector).
    coverage:
      web: { unit: [src/components/app/ProfileMenu.test.ts] }
  - id: language-switch-live
    text: Choosing a language (en/de) re-renders every visible string live (no content reload) and is persisted.
    coverage:
      web: { unit: [src/i18n/setLocale.test.ts] }
  - id: resolution-fallback
    text: An unknown locale falls back to English; an unknown key resolves to itself; every key has both translations.
    coverage:
      web: { unit: [src/i18n/setLocale.test.ts] }
  - id: single-settings-door
    # The property the consolidation exists for, and the one that rots first — the next surface that wants a
    # gear adds a second door. Asserted over the source tree, because the predicate is about the SET of
    # navigations; SettingsHubView's own back() is excluded as navigation INSIDE the hub. That single honest
    # exception is why this is a test and not a scripts/ guard; a second one is the signal to promote it.
    text: The shell offers exactly one entry into the settings hub — the profile menu's Settings row; no other surface navigates to /settings.
    coverage:
      web: { unit: [src/components/app/ProfileMenu.test.ts] }
gaps:
  backend: >-
    No backend part: theme and language are device-local preferences, written to local storage and never sent
    to the server (the use-case's own postcondition; `src/shared/state/useThemeState.ts`).
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/platform/locale-de.spec.ts`, the German pass of Memories and Depot, ADR
    0090 decision 9) drives `language-switch-live` in Chromium against the release candidate's two images installed
    through `veyqctl` (ADR 0090), its test tagged with the criterion: in an English browser the owner picks Deutsch in
    Settings, the page re-renders in German in the same document (`<html lang="de">`), and a reload opens it in German
    again. Green only in local runs of `scripts/run_stack_e2e.py`, and ADR 0040 admits `stack` refs only once a CI
    run's log shows the suite executed.
