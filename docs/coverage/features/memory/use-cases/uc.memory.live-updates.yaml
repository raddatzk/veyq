useCase: uc.memory.live-updates
feature: memory
title: Live media updates — others' adds/removes surface into the open gallery
# Built (web) — cr-0107, ADR 0033; the mechanism is core's since inbox #410 (veyq_node_items_revision, NodeItemsRevisions,
# src/web/src/core/items), Memories' media its first user. A per-node revision counter (bumped on attach/meta-edit/delete, NOT a
# cover change) → an ETag conditional GET on listNodeMedia (304 when unchanged); on a change a keyset delta (media
# past the client's (position,id) cursor, in pages, so an active upload streams new items, never a full re-list) + the
# current mediaId set for delete-reconcile, gated by a second delete_revision counter (present only when a delete
# advanced it). Short-poll, tab-visibility-gated, only while a Memory is open. Operator-blind (opaque counters +
# opaque ids + exact timestamps). Backend + web verticals built + tested. (The
# gallery UI itself is a later CR); the two-member browser auto-insert/drop is the manual live smoke.
acceptanceCriteria:
  - id: cheap-unchanged-check
    text: listNodeMedia is a conditional GET keyed on the node's item revision (core's opaque counter, bumped on every gallery-media mutation but NOT on a cover change); a poll/re-open whose revision matches gets a 304 with no body and no media query server-side — so an unchanged gallery costs an O(1) counter compare, not a full list.
    coverage:
      backend:
        integration:
          - MediaSliceTest.unchangedPollIsNotModified
          - NodeItemsRevisionsCoreSliceTest.anUnchangedRevisionIsANotModifiedAndRunsNeitherQuery
          - NodeItemsRevisionsCoreSliceTest.anAbsentRowReadsZeroSoAClientHoldingZeroGetsNoBody
          - NodeCoverMemoriesSliceTest.aMemoryAndAChapterTakeACoverWithoutTouchingTheGallery
      web:
        unit:
          - src/features/memories/media.test.ts
          - src/features/memories/mediaRevisionPolling.test.ts
          - src/core/items/itemsLive.test.ts
  - id: keyset-delta-on-change
    text: On a revision change the server returns only media past the client's (position, mediaId) cursor — a keyset delta, not the whole list — so an active upload by another member streams the few new items each poll. The client upserts by mediaId and continues from the cursor the server answered. A medium's position is the node revision its last change bumped to (veyq_media.item_position), stamped under the revision row's lock, so positions become visible in commit order (ADR 0033 decision 3).
    coverage:
      backend:
        integration:
          - MediaSliceTest.attachDeltaCarriesOnlyNewMediaAndNoIdSet
          - MediaSliceTest.metaEditSurfacesViaCursorAndNoIdSet
          - NodeItemsRevisionsCoreSliceTest.aChangedRevisionIsTheDeltaAndTheIdSetOnlyWhenADeleteAdvancedPastTheClient
          - NodeItemsRevisionsCoreSliceTest.theEtagAndTheCursorRoundTripLeniently
      web:
        unit:
          - src/features/memories/media.test.ts
          - src/features/memories/components/MemoryDetail.test.ts
  - id: delete-reconcile
    text: A change response also carries the node's current mediaId set; the client drops any cached id no longer present. Because it is the set (not a count), a removal AND a net-zero delete+add are both caught. The id-set is returned only on a revision change, never scanned per idle poll.
    coverage:
      backend:
        integration:
          - MediaSliceTest.deleteBumpsBothCountersAndIdSetOmitsRemoved
          - MediaSliceTest.netZeroDeleteAddStillCarriesIdSet
          - NodeItemsRevisionsCoreSliceTest.noRowReadsZeroAndTheFirstBumpBirthsIt
      web:
        unit:
          - src/core/items/itemsLive.test.ts
          - src/features/memories/media.test.ts
          - src/features/memories/components/MemoryDetail.test.ts
  - id: live-auto-insert
    text: While a Memory is open, the client short-polls (visibility-gated — pauses when the tab is hidden, ticks once immediately on return, stops on close); new media auto-inserts as tiles into the open grid and removed media drops out, with no manual reload, reusing the optimistic-tile grid + mergeItems reconcile.
    coverage:
      web:
        unit:
          - src/features/memories/mediaRevisionPolling.test.ts
          - src/core/items/itemsLive.test.ts
          - src/shared/state/livePoller.test.ts
          - src/features/memories/components/MemoryDetail.test.ts
  - id: operator-blind-live
    text: The server sees only an opaque revision counter, opaque mediaIds, a medium's position (a revision it handed out itself), exact timestamps (a medium's updatedAt, to the millisecond), a page size, and the poll access-pattern it already sees on reads — never content, never a key. No new operator-visible signal; K_node/K_share never touch the server.
    coverage:
      backend:
        integration:
          - MediaSliceTest.attachDeltaCarriesOnlyNewMediaAndNoIdSet
          - MediaSliceTest.deleteBumpsBothCountersAndIdSetOmitsRemoved
      web:
        unit:
          - src/features/memories/media.test.ts
  - id: first-load-in-pages
    text: The first load, and a poll whose delta is longer than a page, reads the list in pages of at most `limit` items (the server's cap is 1000, the response's `maxItems`; the client asks for MEDIA_PAGE_LIMIT), each page answering `more` while items remain and its `cursor`, the next asked from that cursor without If-None-Match, until every item is held. Each page is read with the same number of queries whatever its size. The client keeps the first page's revisions and the last page's cursor.
    coverage:
      backend:
        integration:
          - MediaListPagingSliceTest.aReadWithoutALimitIsOnePageOfTheCap
          - MediaListPagingSliceTest.aLimitOutsideOneToTheCapIs400
          - MediaListPagingSliceTest.theTrashPagesOnTheSameCursor
          - MediaListQueryCountSliceTest.theMembersPageOfOnePhotoAndOfSixtyIssueTheSameStatements
          - MediaListQueryCountSliceTest.theTrashPageOfOnePhotoAndOfSixtyIssueTheSameStatements
          - NodeItemsRevisionsCoreSliceTest.aBumpAnswersTheRevisionItWroteTheItemsPosition
      web:
        unit:
          - src/core/items/itemsLive.test.ts
          - src/features/memories/media.test.ts
          - src/features/memories/useMediaGalleryLive.test.ts
  - id: paging-loses-no-concurrent-change
    text: A change committed while a client pages — an add, an edit of a row already paged, a removal — reaches it by the next poll from the first page's revisions; and no commit order of two concurrent writers can put a row behind a cursor the client already passed (the keyset is a position handed out under the revision row's lock, not a timestamp).
    coverage:
      backend:
        integration:
          - MediaListPagingSliceTest.pagesArriveCompleteAndAChangeWhilePagingReachesTheNextPollFromTheFirstPagesRevisions
          - MediaKeysetRaceSliceTest.anEditStampedBeforeAnotherButCommittedAfterItStillReachesTheNextPoll
      web:
        unit:
          - src/core/items/itemsLive.test.ts
          - src/features/memories/useMediaGalleryLive.test.ts
  - id: guest-live-poll
    # Alternate flow E7, inbox #497 (ADR 0033 decision 7, ADR 0081 decision 4).
    text: >-
      A share guest's open gallery polls as a member's does, on its own listing: listShareMedia's first page carries an
      ETag that is a digest of everything the read serves, every page of it — never the node's item revision nor the
      scope's tree revision — and If-None-Match with it answers 304. A change elsewhere in the space, or a move of the
      node's revision that changes no served row, stays a 304; a medium added, trashed or blocked inside the shared node
      is a 200 under a new tag, which the client merges with every listed id as the id set, so the guest's grid gains
      and drops tiles without a reload. A later page carries no tag; a WRITE_ONLY link's empty listing has a constant
      one. An idle guest poll reads no listing, whatever the gallery's size.
    coverage:
      backend:
        integration:
          - ShareMediaLivePollSliceTest.aGuestsPollIsA304UntilWhatTheLinkServesChanges
          - ShareMediaLivePollSliceTest.theTagCoversEveryPageAndALaterPageIsNeitherTaggedNorConditional
          - ShareMediaLivePollSliceTest.anIdlePollReadsNoListingWhateverItsSize
          - ShareMediaLivePollSliceTest.aWriteOnlyLinkIsServedNothingUnderAConstantTag
      web:
        unit:
          - src/features/memories/source.test.ts
          - src/features/memories/components/MemoryDetail.guest.test.ts
  - id: block-and-lift-live
    # Alternate flow E8 (uc.moderation.take-a-measure, ADR 0093 § 6).
    text: >-
      A poll that carries a shown medium blocked by a moderator patches the held item's block state in place: its tile
      turns to "Blocked by the operator" at once without moving, its decrypted thumbnail is revoked and dropped from the
      URL cache and not read again, and an open lightbox on it shows the placeholder with its decrypted preview revoked. A
      poll that carries the lift shows the medium again through the thumbnail and preview reads. Members and guests alike.
    coverage:
      backend:
        integration:
          - ModerationMemoriesSliceTest.blockedContentAnswersEveryByteRead451IsMarkedInEveryListingAndItsSiblingStillServes
          - ShareMediaLivePollSliceTest.aGuestsPollIsA304UntilWhatTheLinkServesChanges
      web:
        unit:
          - src/features/memories/useMediaGalleryLive.test.ts
          - src/features/memories/components/MediaLightbox.test.ts
          - src/features/memories/components/MemoryDetail.guest.test.ts
  - id: node-block-reaches-open-memory
    # Alternate flow E9, inbox #503 (ADR 0081 decision 5, ADR 0033 § Consequences).
    text: >-
      A moderator's block of the open Memory, or of a folder above it, moves the scope's tree revision and no item
      revision: the member's gallery poll stays a 304 and the listing's conditional read answers 200 with the Memory's row
      marked, its lift the same. The host's tree poll runs on every opened node's page, so the open Memory's page turns to
      "Blocked by the operator" on the poll that brings the block, every object URL its gallery decrypted is revoked and
      its own poll ends; it keeps polling under the placeholder, so a lift brings the page back. A tree change that is not
      the Memory's reloads nothing and resets no tab. An idle tree poll costs the same statements whatever the tree holds,
      and no more than the gallery's own. A guest's opened node turns the same way through its re-resolve.
    coverage:
      backend:
        integration:
          - OpenMemoryTreePollSliceTest.aBlockOfAFolderAboveAnOpenMemoryAndItsLiftReachTheTreePollNotTheGallerys
          - OpenMemoryTreePollSliceTest.anIdleTreePollIsAFewStatementsWhateverTheTreeHoldsAndNoMoreThanTheGallerys
      web:
        unit:
          - src/views/SpaceView.memoryBlock.test.ts
          - src/views/SpaceView.live.test.ts
          - src/views/ShareView.live.test.ts
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/memories/memory-guest-live.spec.ts`) drives `guest-live-poll` in Chromium
    against the release candidate's two images, installed through `veyqctl` (ADR 0090), tagged with its criterion: a
    read-only link's open gallery answers its polls 304, then shows the owner's second photo without a reload (a marker
    on the document survives), in separate browser contexts. Not yet run — written with inbox #497, whose rule ran no L1.
    The lane's CI job (`checks.yml` → `stack`) awaits the first CI run (no remote), and ADR 0040 admits `stack` refs only
    once a run's log shows the suite executed. On that run the file becomes a ref on the criterion, and this gap goes.
