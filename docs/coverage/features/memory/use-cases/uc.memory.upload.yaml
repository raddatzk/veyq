useCase: uc.memory.upload
feature: memory
title: Upload media into a Memory (web)
# Web upload UI built by cr-0058 (ported from frontend-noe2ee): a gallery file-picker → a global upload queue →
# the TopBar uploads tray, wired onto the ready addMedia data layer (cr-0028/0045). The data-path criteria carry
# backend + web refs; the tray + queue are web unit-tested; the end-to-end browser flow is the cr-0058 smoke.
acceptanceCriteria:
  - id: seal-and-upload-operator-blind
    text: Each picked file is sealed under a fresh K_blob (wrapped to K_node), its chunks PUT direct-to-store, and one role-tagged media is attached to the node — the server sees only ciphertext + opaque sizes/counts. Metadata is sealed under field keys derived from K_node in two tiers (cr-0064/0068) — the always-listed wrappedMeta tier (geometry + capture time + GPS, returned with every list) and the lazy, panel-only wrappedExif bundle (kept out of the list, fetched via getMediaExif) — so the gallery lays out + sorts and the detail panel fills without the server ever seeing a single field. Neither tier's contents are enumerated here — both are versioned client-only shapes, and an enumeration in a place that cannot read them only goes stale.
    coverage:
      backend:
        integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.derivativesRoundTripWithOwnWraps, MediaSliceTest.mediaExifWithoutExifIsNull]
      web:
        unit: [src/features/memories/media.test.ts]
  - id: upload-seals-only-under-its-own-memory-key
    text: >-
      An upload into a Memory seals only under that Memory's own key; a server that serves another Memory's key
      wrap on its row makes the upload refuse, not land under the other key. Every `K_node` wrap is sealed bound to
      the node it belongs to (ADR 0072) — the id the client minted at creation and the server stores verbatim — so
      resolving a Memory's key from a wrap that belongs to another Memory is refused at the seal instead of
      yielding the other Memory's key (under which every upload would otherwise be sealed, and readable through
      that Memory's share link).
    coverage:
      backend:
        integration: [ClientMintedIdSliceTest.createNodeRefusesAnIdTakenInAnotherScope]
      web:
        unit: [src/features/memories/sealBinding.test.ts]
  - id: global-uploads-tray
    text: A TopBar uploads button (active-count badge, counting files) opens a popup listing the files with status + progress and a cancel/retry control; the queue is a module singleton so uploads survive navigation.
    coverage:
      web:
        unit:
          - src/core/blob/UploadStatusMenu.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/core/blob/queue.test.ts
  - id: one-list-per-destination
    text: >-
      The popup draws one list per destination: every open batch with the same `key` is one list, under its first
      batch's label, with one bar over all its files by the per-file formula (a done file counts whole). A batch
      enqueued later for that destination joins the open list, so the bar recomputes and can go down; Close appears
      once every batch of the list has finished and acknowledges all of them; a closed list is not reopened, a later
      batch starts a new one. Different keys are different lists, and a batch with no key is a list of its own. The
      grouping is the tray's: the queue keeps its batches and their hooks.
    coverage:
      web:
        unit: [src/core/blob/UploadStatusMenu.test.ts]
  - id: progress-and-cancel
    text: Per-file progress advances as the ciphertext chunks land; cancelling an in-flight upload aborts its PUTs before completing, so no media is attached.
    coverage:
      web:
        unit:
          - src/features/memories/media.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/core/blob/queue.test.ts
  - id: abandoned-session-reclaimed
    text: >-
      An upload that never reaches `complete` — cancelled, killed mid-flight, or rejected by the complete-time
      budget gate — is reclaimed past `veyq.blob.upload.retention`: the OPEN `veyq_upload_session` row AND the
      chunk objects the client already PUT direct-to-store, since that row is the only pointer to their
      `storage_key` and a row-only delete would orphan the bytes permanently. Those are two components since
      ADR 0062 and the tests drive both — the purge deletes the row and records the key prefix in the same
      transaction, and `StoreReclaimSweep` hands the objects to the store once no URL signed for them can still
      land. A session still inside the window loses neither half. The window is measured from the session's LAST ISSUED WINDOW, not its
      start — a large upload is signed window by window, so its start says nothing about whether it is alive —
      and it is bounded by construction rather than chosen: every window's PUT URLs are signed under the presign
      TTL, so a session with no new window past that TTL can receive no further byte. This is the SERVER half of
      E2; the client half (cancelling an in-flight upload aborts its PUTs and stops before `complete`, so no
      media is attached) is a different claim, covered by `progress-and-cancel` above.
    coverage:
      backend:
        integration:
          - UploadSessionPurgeSliceTest.purgeReclaimsBothTheRowAndTheStagedChunkObjectsOfAnAbandonedSession
          - UploadSessionPurgeSliceTest.purgeLeavesBothHalvesOfASessionInsideTheRetentionWindow
          - UploadSessionPurgeSliceTest.purgeAlsoReclaimsTheRowLeftBehindByABudgetRejection
          - UploadSessionPurgeSliceTest.purgeKeysOnTheLastIssuedWindowNotOnTheStart
          - UploadSessionPurgeSliceTest.retentionDefaultsToTheMeasuredPresignBound
  - id: upload-outlives-the-presign-ttl
    text: >-
      An upload outlives the presign TTL: `start` signs only a blob's first window of chunks, and the client asks
      for each next window as it goes, so the TTL has to cover one window rather than one file (ADR 0013 §2). A
      window signs chunks `[fromChunk, fromChunk + window)` of an open session, each for its exact length, and marks
      the session live; a `fromChunk` outside the blob is `range_invalid`, a consumed session has no window. A `PUT`
      the store refuses with 403 — its window expired — is re-signed from that chunk and retried once, and the
      client asks for the next window before the signed range runs out.
    coverage:
      backend:
        integration:
          - UploadWindowSliceTest.startSignsOnlyTheFirstWindowOfABlobLargerThanOne
          - UploadWindowSliceTest.aWindowSignsTheNextChunksAndMarksTheSessionLive
          - UploadWindowSliceTest.aWindowFromOutsideTheBlobIsRangeInvalid
          - UploadWindowMemoriesSliceTest.aCompletedSessionHasNoWindow
      web:
        unit: [src/features/memories/media.test.ts]
    gaps:
      - surface: backend
        reason: >
          That a blob of more than one window moves through a REAL store (start + window + PUTs + complete) is
          measured only by `BlobBatchE2ETest`, which needs a real Garage and runs when `VEYQ_S3_E2E=1`. No CI job
          sets it, so it makes no coverage claim (ADR 0040) and is named here instead.
  - id: session-bound-to-its-opener
    text: >-
      A session is extended and completed only by its opener, and only while the opener still holds the upload
      right. It records the account (a member upload) or the share identity (a contributor upload) that opened it,
      and every window, complete and cover commit resolves it only for that caller — another member or another
      identity on the same link is told `upload_not_found`, the same as for an unknown session. Every window is
      authorized again like its `start`, so a member removed since then is refused at their next window.
    coverage:
      backend:
        integration:
          - UploadWindowMemoriesSliceTest.aSecondMemberCannotCompleteAnotherMembersSession
          - UploadWindowMemoriesSliceTest.aSecondMemberCannotCommitAnotherMembersSessionAsACover
          - UploadWindowSliceTest.aWindowOfAnotherMembersSessionIsUploadNotFound
          - UploadWindowSliceTest.aRemovedMemberIsRefusedAtTheNextWindow
          - ShareUploadWindowSliceTest.aSecondIdentityCannotCompleteAnotherIdentitysSession
          - ShareUploadWindowSliceTest.aSecondIdentityGetsNoWindowOfAnotherIdentitysSession
  - id: client-streams-the-file
    text: >-
      The client streams a file and never holds all of it: the queue hands the picked `File` on unread, the
      original is read as one slice per frame, sealed with its index and the total (both known from the size) and
      `PUT` with at most a small fixed number in flight — member uploads, contributor uploads and the cover alike,
      through one pump. Derivatives are small and derived from the same `Blob`. That a real tab stays within memory
      on a multi-GiB file is a manual check, not a claim: the tests prove the pump never reads the whole file and
      bounds what is in flight.
    coverage:
      web:
        unit:
          - src/features/memories/media.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/features/memories/share.test.ts
  - id: store-responses-are-inert
    text: >-
      The store never serves an object as a renderable type, and refuses a PUT of any type but the pinned one
      (ADR 0013 §6). The server cannot tell ciphertext from a planted page, so the SIGNER guarantees it on every
      store, including one veyq never provisions: every presigned PUT signs `content-type:
      application/octet-stream` — the client sends exactly that, and the store refuses anything else — and every
      presigned GET signs `response-content-type=application/octet-stream` + `response-content-disposition=
      attachment`, which also neutralises an object stored before the rule and cannot be stripped from the URL.
      Where the store shares the app's origin (compose), the proxy also marks store responses `nosniff` + a
      `sandbox` CSP, on the bootstrap route and on every projected tenant's blobs route.
    coverage:
      backend:
        unit:
          - S3BlobStorePresigningTest.everyPresignedGetSignsTheInertResponseOverrides
          - S3BlobStorePresigningTest.everyPresignedPutSignsTheContentTypeHeader
        integration: [TenantIngressProjectorTest.everyBlobsRouterMarksStoreResponsesInert]
      web:
        unit: [src/features/memories/media.test.ts]
    gaps:
      - surface: backend
        reason: >
          The store half — a `text/html` PUT refused with 403, every GET served `application/octet-stream` +
          `attachment` (a planted `text/html` object included), a GET with its override stripped refused — is
          measured only by `BlobBatchE2ETest`, which needs a real Garage and runs when `VEYQ_S3_E2E=1`. No CI job
          sets it, so it makes no coverage claim (ADR 0040) and is named here instead. The unit refs prove what is
          SIGNED; that the store honours it is that opt-in run's evidence. That Traefik applies the rendered
          middleware is measured by hand through a live proxy, not by any test.
  - id: declared-shape-follows-from-size
    text: >-
      The declared shape of a blob follows from its size (ADR 0013 §3) — the frame size is the crypto vectors'
      `chunk_frame_size`, which the backend and every client read — so the server refuses any other chunk count, or
      a size no frame sequence has (`shape_invalid`, distinct from `budget_exceeded` for a file over the cap), signs
      each chunk's presigned PUT for its exact `Content-Length`, and attaches a blob only when every chunk is present
      at exactly that length; anything else fails the item `budget_exceeded` and purges its staged objects.
    coverage:
      backend:
        unit:
          - ChunkFramesTest.theFrameSizeIsTheContractConstant
          - ChunkFramesTest.theChunkCountIsTheCeilingOverTheSealedFrame
          - ChunkFramesTest.everyChunkButTheLastIsFullAndTheLastCarriesTheRemainder
          - ChunkFramesTest.aSizeNoFrameSequenceHasIsImpossible
          - S3BlobStorePresigningTest.everyPresignedPutSignsItsChunksExactLength
        integration:
          - MediaCoreSliceTest.aDeclarationWhoseShapeTheSizeDoesNotFixIsShapeInvalid
          - MediaBudgetBranchSliceTest.aChunkShortOfItsDerivedLengthFailsTheItemEvenWithTheTotalUnderTheDeclaration
      web:
        unit: [src/features/memories/media.test.ts, src/sw/range.test.ts]
    gaps:
      - surface: backend
        reason: >
          That the store REFUSES a body of another length than the one signed — ADR 0013 §3's table: a wrong-length
          PUT 403, a same-length re-PUT 200 — is measured only by `BlobBatchE2ETest`, which needs a real Garage and
          runs when `VEYQ_S3_E2E=1`. No CI job sets it, so it makes no coverage claim (ADR 0040). The unit ref proves
          the length is SIGNED; `complete`'s exact check, covered above, is what holds on a store that ignores it.
  - id: transient-retry
    text: A transient upload failure is retried once automatically; a hard failure is marked failed and retried only on explicit request.
    coverage:
      web:
        unit: [src/core/blob/queue.test.ts]
  - id: safari-photos-import
    text: >-
      Files imported from the Photos gallery (empty MIME, late/repeated input population) are accepted by
      extension, merged without dropping earlier picks (signature de-dupe), and sealed under a media type
      inferred from the extension. The re-read window does NOT gate the first enqueue — files already in hand
      are queued before any re-read, and each re-read enqueues only what is genuinely new, as its own batch.
      Releasing the input (`value = ''`) is the window's TEARDOWN rather than part of the pick — a clear in the
      same tick as the first read throws away exactly the late arrivals the window exists to catch, while four
      timers still run and four empty reads still look correct. All of it is ONE orchestration the pickers
      call, so the property reaches every screen that lets someone choose files — the curator's gallery and the
      contributor's share page both drive the same window.
    coverage:
      web:
        unit:
          - src/features/memories/uploadQueue.test.ts
          - src/features/memories/components/MemoryDetail.optimistic.test.ts
          - src/views/ShareView.picker.test.ts
  - id: exif-tier-fits-its-bound
    text: The sealed EXIF tier always fits its contract bound (`wrappedExif.maxLength`, which the server enforces) — each free-text field is shortened to a byte cap without splitting a character, a tier that still overflows sheds free text before any number, and the upload never fails for its metadata.
    coverage:
      web:
        unit: [src/features/memories/media.test.ts]
  - id: best-effort-derivation
    text: Underivable media (a codec the browser can't decode, or an empty MIME type) uploads original-only instead of failing the whole upload.
    coverage:
      web:
        unit: [src/features/memories/media.test.ts]
  - id: pixel-stage-off-the-page-thread
    text: >-
      The image pixel stage runs in a Worker where the browser offers one; a Worker that cannot run finishes the
      request on the page thread; an undecodable source still uploads original-only without a page-thread retry.
      Every image caller (member and contributor upload, standalone cover, space icon) reaches it through the one
      `createBrowserDeriver`, and the whole request crosses — an icon's WebP type and background fill included.
    coverage:
      web:
        unit: [src/shared/image/mediaDeriveWorker.test.ts]
    gaps:
      - surface: web
        reason: >
          The unit tests drive stub Workers; no CI run loads the real module Worker, and a Worker that never loads
          (a mis-bundled URL, a CSP refusal) degrades silently to the page thread with every test still green.
          That the real Worker runs is measured by hand only, and not by timing: a quiet desktop Chrome shows no
          page-path wait to fall below, so the proof is a bundled page that counts the Worker's posts and replies
          (24 of 24 answered per 12-photo batch, en.memory.derivatives § Generation & attachment).
  - id: sealed-original-filename
    text: The original's filename is sealed into the lazy panel bundle at upload — for every media that has one (a video, an image without EXIF, a PDF too, not only a parsed EXIF bundle), since the lightbox downloads the original under it, and it is never shed to fit the tier's cap — and is NEVER sent in the clear — no request carries it, checked at fetch over every path, header, binary body and DECODED base64 field, for a member's and a guest's upload, so uc.memory.gallery's "no pixel, no filename" stays a true statement about the server's view now that the name exists at all. It never enters the 512-base64 listed tier. Both AddMediaSource construction sites (the upload queue and the cover upload) pass it.
    coverage:
      web:
        unit: [src/features/memories/media.test.ts, src/features/memories/originalName.wire.test.ts]
  - id: original-carries-its-digest-and-may-share-the-banner
    text: An original's sealed `blob-meta` carries the SHA-256 of its bytes (base64url), read frame by frame before it is planned, so a later upload of the same file into the cover or banner dialog finds it (a medium without one is never matched). A member's upload of a file equal to the node's video banner (its sealed `sha256` and size) completes with `originalShared` - a new row on the `BANNER` object, its K_blob wrapped again bound to the medium's ORIGINAL, nothing uploaded for it - while its posters are derived and uploaded as always; the object goes only with the last row naming it. Neither form is open to a guest (the seam refuses a contributor's `originalShared`; ADR 0013 § 5).
    coverage:
      backend:
        integration: [SharedBlobSliceTest.aGalleryOriginalSharesTheVideoBannersObject, SharedBlobSliceTest.aSourceTheNodeDoesNotHoldIsRefusedAndNothingIsWritten]
      web:
        unit: [src/features/memories/media.test.ts, src/features/memories/storedMatch.test.ts, src/core/blob/sharedBlob.test.ts]
  - id: original-decoded-once-per-upload
    text: Inside addMedia a picked original is decoded ONCE — the preview is derived from it, the thumbnail from the already-downscaled preview, and the intrinsic geometry the metadata tier seals rides back from that same decode instead of a separate probe. Both tiers still arrive at their pinned specs (4032 to 2048 to 512 traverses the same steps of at most 2x that two independent runs did), so the progressive-halving downscale rule is honoured rather than traded for the saving; the tier derivation is therefore ORDERED, preview before thumbnail. A video is unchanged — one poster decode, zero image decodes.
    # The count is bitten by a deriver that records each decode's SOURCE SIZE, so a decode of the original is
    # countable apart from the cheap pass over the preview; the counting probeDimensions is installed by the
    # bite, since the shared stub deliberately ships without one and the geometry decode ran in no test before.
    coverage:
      web:
        unit: [src/features/memories/media.test.ts]
  - id: next-file-prepared-while-one-is-on-the-wire
    text: >-
      While one file is on the wire, the next file runs its on-device stage — its type, its digest beside its tiers and
      its metadata read, which use no key and send nothing — and the upload of that file uses the result instead of
      running the stage again (inbox #220). One file is prepared ahead at most, from the running file's first progress
      on; one file at a time is uploaded, so every key use, seal and request of a file still follows the previous file's
      completion, after the device floor. A file prepared ahead says preparing until its first byte is sent; cancelling it
      settles it cancelled at once; a failed attempt drops what it prepared and its retry prepares again.
    coverage:
      web:
        unit:
          - src/core/blob/queue.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/features/memories/media.test.ts
    gaps:
      - surface: web
        reason: >-
          Gated on both sides in the queue (B's prepare starts on A's first progress and A ends only once it did) and in
          Memories' adapter, bitten seven ways (prepare at the start, no depth bound, no overlap, a cancel that waits, an
          upload that ignores the result, a result kept across a failed attempt, a run that drops it). What it moves in a
          browser is a local timing reading (scripts/profile_attribute.py on S2), no coverage.
  - id: optimistic-in-grid-tiles
    text: Picked files appear immediately as tiles in the Memory's gallery grid — a local preview (never uploaded in the clear; a photo drawn at the gallery thumbnail's size, one at a time and only for the tiles the grid mounts near its viewport, nearest first, never the picked file shown whole unless the deriver cannot read it, inbox #785; a video its first frame, drawn in the same queue at the same size, and no picture where the browser cannot decode it, inbox #786) with a per-tile progress ring or failed+retry state, at the place the gallery's ONE ordering rule gives it (uc.memory.gallery#date-sorted-grid owns that rule; this criterion does not restate it) — and each reconciles into the real decrypted thumbnail once its media lists (matched by the returned mediaId) with no empty-flash and no duplicate; the queue records that mediaId on each settled file (cr-0074). Reconcile is PER-FILE (cr-0111) — a per-file `onFileDone` hook fires the moment each upload settles and triggers a targeted live poll that lists just that media, so its tile flips to the real thumbnail the moment IT completes — not only when the whole batch's onComplete re-lists everything at once. A tile names the stage its file is ACTUALLY in — queued, preparing or uploading are three different waits and in two of them no byte has left the device — visibly and in BOTH aria-labels (the container's and the progress zone's), which fail independently.
    coverage:
      web:
        unit:
          - src/features/memories/optimisticUpload.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/features/memories/useOptimisticTiles.test.ts
          - src/features/memories/components/MemoryDetail.optimistic.test.ts
          - src/shared/image/mediaDeriver.poster.test.ts
    gaps:
      - surface: web
        reason: >-
          What the tile-sized preview saves is the renderer's memory while a batch uploads, and for videos the decoders
          open at once and the main thread's time, local readings (the profile's S2 and S2v, `scripts/profile_hot_paths.py`),
          no coverage; the unit tests pin that nothing is drawn before the grid wants it, one draw at a time in the grid's
          order with photos and videos in the one queue, the thumbnail tier's size (asked for, and honoured by the poster's
          encode), the fallback to the file for a photo and to no picture for a video, and every preview revoked, one
          finished after its tile left included.
  - id: pick-time-size-from-the-header
    text: >-
      A picked photo's tile takes its aspect ratio from the size the file's header names, its EXIF orientation applied as
      the browser draws it — read from its first bytes for a JPEG, PNG, GIF or WebP, else by an image element that is
      never drawn — and never by decoding the photo, so picking a batch decodes none of it at once (inbox #558). A picked
      video's size, for its tile and for its upload, is read from its container's header the same way — an MP4 or
      QuickTime file's video track header turned by its matrix as a player shows it, a WebM or Matroska file's Video
      element — and only where that header does not read by a `<video>` that loads the metadata and lets go of its source
      once it answered, so picking a batch opens no media player for its sizes (inbox #793).
    coverage:
      web:
        unit:
          - src/shared/image/imageHeader.test.ts
          - src/shared/image/mediaDeriver.test.ts
          - src/shared/image/videoHeader.test.ts
          - src/shared/image/mediaDeriver.videoProbe.test.ts
    gaps:
      - surface: web
        reason: >-
          What it saves is the renderer's memory at pick time, and for videos the players open at once and the upload's
          main-thread time, local readings (the profile's S2 and S2v record each window's resident memory and media
          players, `scripts/profile_hot_paths.py`), no coverage. The element's own promise - it parses the header and
          decodes nothing until painted - is the browser's, read in that profile, not in happy-dom; so is that a video
          header's size is the one Chromium reports, checked by hand on ffmpeg's clips (a phone's quarter turn either way,
          a mirrored one left to the browser, WebM written with unknown sizes, Matroska) on 2026-10-29.
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/scenarios/memory-roundtrip.spec.ts`) drives `seal-and-upload-operator-blind`
    in Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged
    with its criterion. Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`checks.yml` →
    `stack`) awaits the first CI run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the
    suite executed. On that run each file becomes a ref on the criteria its tests are tagged with, and this gap
    goes.
