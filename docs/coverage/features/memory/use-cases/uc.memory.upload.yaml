useCase: uc.memory.upload
feature: memory
title: Upload media into a Memory (web)
# Web upload UI built by cr-0058 (ported from frontend-noe2ee): a gallery file-picker → a global upload queue →
# the TopBar uploads tray, wired onto the ready addMedia data layer (cr-0028/0045). The data-path criteria carry
# backend + web refs; the tray + queue are web unit-tested; the end-to-end browser flow is the cr-0058 smoke.
acceptanceCriteria:
  - id: seal-and-upload-operator-blind
    text: Each picked file is sealed under a fresh K_blob (wrapped to K_mem), its chunks PUT direct-to-store, and one role-tagged media is attached to the node — the server sees only ciphertext + opaque sizes/counts. Metadata is sealed under K_mem in two tiers (cr-0064/0068) — the always-listed wrappedMeta tier (geometry + capture time + GPS, returned with every list) and the lazy, panel-only wrappedExif bundle (kept out of the list, fetched via getMediaExif) — so the gallery lays out + sorts and the detail panel fills without the server ever seeing a single field. Neither tier's contents are enumerated here — both are versioned client-only shapes, and an enumeration in a place that cannot read them only goes stale.
    coverage:
      backend:
        integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.derivativesRoundTripWithOwnWraps, MediaSliceTest.mediaExifWithoutExifIsNull]
      web:
        unit: [src/features/memory/media.test.ts]
  - id: global-uploads-tray
    text: A TopBar uploads button (active-count badge) opens a popup listing each batch's files with status + progress and a cancel/retry control; the queue is a module singleton so uploads survive navigation.
    coverage:
      web:
        unit:
          - src/features/memory/components/UploadStatusMenu.test.ts
          - src/features/memory/uploadQueue.test.ts
  - id: progress-and-cancel
    text: Per-file progress advances as the ciphertext chunks land; cancelling an in-flight upload aborts its PUTs before completing, so no media is attached.
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/uploadQueue.test.ts
  - id: abandoned-session-reclaimed
    text: >-
      An upload that never reaches `complete` — cancelled, killed mid-flight, or rejected by the complete-time
      budget gate — is reclaimed past `veyq.media.upload.retention`: the OPEN `veyq_upload_session` row AND the
      chunk objects the client already PUT direct-to-store, since that row is the only pointer to their
      `storage_key` and a row-only delete would orphan the bytes permanently. Those are two components since
      ADR 0062 and the tests drive both — the purge deletes the row and records the key prefix in the same
      transaction, and `StoreReclaimSweep` hands the objects to the store on the next tick. A session still
      inside the window loses neither half. The window is bounded by construction rather than
      chosen — all of a session's PUT URLs are signed once at `start` and nothing re-signs them, so a client
      past the presign TTL can write no further byte. This is the SERVER half of E2; the client half (cancelling
      an in-flight upload aborts its PUTs and stops before `complete`, so no media is attached) is a different
      claim, covered by `progress-and-cancel` above.
    coverage:
      backend:
        integration:
          - UploadSessionPurgeSliceTest.purgeReclaimsBothTheRowAndTheStagedChunkObjectsOfAnAbandonedSession
          - UploadSessionPurgeSliceTest.purgeLeavesBothHalvesOfASessionInsideTheRetentionWindow
          - UploadSessionPurgeSliceTest.purgeAlsoReclaimsTheRowLeftBehindByABudgetRejection
          - UploadSessionPurgeSliceTest.retentionDefaultsToTheMeasuredPresignBound
  - id: transient-retry
    text: A transient upload failure is retried once automatically; a hard failure is marked failed and retried only on explicit request.
    coverage:
      web:
        unit: [src/features/memory/uploadQueue.test.ts]
  - id: safari-photos-import
    text: Files imported from the Photos gallery (empty MIME, late/repeated input population) are accepted by extension, merged without dropping earlier picks (signature de-dupe), and sealed under a media type inferred from the extension. The re-read window does NOT gate the first enqueue — files already in hand are queued before any re-read, and each re-read enqueues only what is genuinely new, as its own batch.
    coverage:
      web:
        unit:
          - src/features/memory/uploadQueue.test.ts
          - src/features/memory/components/MemoryDetail.optimistic.test.ts
  - id: best-effort-derivation
    text: Underivable media (a codec the browser can't decode, or an empty MIME type) uploads original-only instead of failing the whole upload.
    coverage:
      web:
        unit: [src/features/memory/media.test.ts]
  - id: sealed-original-filename
    text: The original's filename is sealed into the lazy panel bundle at upload and is NEVER sent — no request payload carries it, so uc.memory.gallery's "no pixel, no filename" stays a true statement about the server's view now that the name exists at all. Both AddMediaSource construction sites (the upload queue and the cover upload) pass it.
    coverage:
      web:
        unit: [src/features/memory/media.test.ts]
  - id: original-decoded-once-per-upload
    text: Inside addMedia a picked original is decoded ONCE — the preview is derived from it, the thumbnail from the already-downscaled preview, and the intrinsic geometry the metadata tier seals rides back from that same decode instead of a separate probe. Both tiers still arrive at their pinned specs (4032 to 2048 to 512 traverses the same steps of at most 2x that two independent runs did), so the progressive-halving downscale rule is honoured rather than traded for the saving; the tier derivation is therefore ORDERED, preview before thumbnail. A video is unchanged — one poster decode, zero image decodes.
    # The count is bitten by a deriver that records each decode's SOURCE SIZE, so a decode of the original is
    # countable apart from the cheap pass over the preview; the counting probeDimensions is installed by the
    # bite, since the shared stub deliberately ships without one and the geometry decode ran in no test before.
    coverage:
      web:
        unit: [src/features/memory/media.test.ts]
  - id: optimistic-in-grid-tiles
    text: Picked files appear immediately as tiles in the Memory's gallery grid — an instant local object-URL preview (never uploaded in the clear) with a per-tile progress ring or failed+retry state, at the place the gallery's ONE ordering rule gives it (uc.memory.gallery#date-sorted-grid owns that rule; this criterion does not restate it) — and each reconciles into the real decrypted thumbnail once its media lists (matched by the returned mediaId) with no empty-flash and no duplicate; the queue records that mediaId on each settled file (cr-0074). Reconcile is PER-FILE (cr-0111) — a per-file `onFileDone` hook fires the moment each upload settles and triggers a targeted live poll that lists just that media, so its tile flips to the real thumbnail the moment IT completes — not only when the whole batch's onComplete re-lists everything at once. A tile names the stage its file is ACTUALLY in — queued, preparing or uploading are three different waits and in two of them no byte has left the device — visibly and in BOTH aria-labels (the container's and the progress zone's), which fail independently.
    coverage:
      web:
        unit:
          - src/features/memory/optimisticUpload.test.ts
          - src/features/memory/uploadQueue.test.ts
          - src/features/memory/components/MemoryDetail.optimistic.test.ts
