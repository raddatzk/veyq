useCase: uc.memory.cover
feature: memory
title: Memory cover — a chosen, cropped cover shown everywhere
# Built web-first. The cover reuses the node's `wrappedMeta` blob (date cr-0067, location cr-0069) and adds a
# `cover` sub-object `{ source (media mediaId | upload blob ref), crop{x,y,width,height} 0..1 }`, sealed under
# a field key derived from K_node, set via the same partial updateNode, returned on listNodes. Deliberate pick (no auto-cover), one
# normalized crop shown identically on **three** surfaces: the browse card, the detail header and the map pin (the
# sidebar's Favorites entry was a fourth until core took the section over, inbox #409). cr-0072 built the existing-media source (web, no backend); cr-0073 added the
# new-upload source — a standalone cover blob (contract + backend + web) committed with no `veyq_media` row; the
# sidebar surface and the shared cover store came last, and the store is why a fifth surface would cost a read
# rather than a decrypt. Since inbox #411 the store, the crop model, the upload and the one-request write are CORE's
# (uc.platform.node-cover) and the sidebar's Favorites tile shows the cover again, for every kind that has one. The dialog,
# the crop editor and the write are core's too (follow-up 2026-10-12). Since 2026-10-19 (cr-cover-banner-upload-only-and-dedup)
# a cover is set ONLY by an upload in that dialog - the photo source and the lightbox's "Set as cover" are gone - and the
# Memory keeps one seam, `cover.findStored` (`storedMatch.ts`): an upload equal to a gallery photo shares its PREVIEW.
acceptanceCriteria:
  - id: sealed-cover-on-node
    text: A MEMORY/CHAPTER node's `wrappedMeta.cover` carries ONE cover — its uploaded blob ref + a `crop {x,y,width,height}` normalized to 0..1 of the source image — sealed under a field key derived from K_node in the same client-versioned blob as the date + location, returned on listNodes. The operator-blind server never sees the crop or a pixel. A stored photo reference (`{ kind - media }`, an older client's) reads as no cover and is preserved by other writers.
    coverage:
      web:
        unit:
          - src/features/memories/memoryCover.test.ts
        e2e:
          - src/features/memories/memoryCover.e2e.test.ts
  - id: deliberate-no-auto-cover
    text: A cover exists only by a deliberate upload in the cover dialog; there is no auto-cover. Unset ⇒ the placeholder (the soft-accent images tile) shows on every surface — the browse card, the detail header, the map pin and the sidebar's Favorites entry — and NO surface branches on it — they all render the one component whose own placeholder appears. A cover whose blob does not open falls back to the placeholder, never a broken card, pin or rail tile.
    coverage:
      web:
        unit:
          - src/features/memories/memoryCover.test.ts
          - src/features/memories/components/MemoryCoverImage.test.ts
          - src/features/memories/components/MemoryCard.test.ts
          - src/components/app/AppSidebar.test.ts
  - id: covers-resolved-once-per-scope
    text: One store resolves a Memory's cover for EVERY surface that shows one — a thumbnail is decrypted once per Memory per scope, not once per surface — re-resolves it when the node's sealed meta changes (the cache is keyed on `wrappedMeta`, so a cover edited on one surface cannot leave a stale image on another), and releases every decrypted object URL when the active space is left, rotated or cleared. The store is core's (`core/node/cover/coverStore.ts`, a member's singleton and a guest page's own); the surfaces read the result and hold no key material — the scope key and node-key chain that open a node's K_node stay out of the always-mounted rail.
    # Both halves are bitten by injection, since the store is new and neither defect is live: keying the entry on
    # the nodeId alone reddens the stale-cover and removed-cover cases, and deleting the reset from
    # clearActiveSpace reddens the release case.
    coverage:
      web:
        unit:
          - src/core/node/cover/coverStore.test.ts
  - id: one-crop-everywhere
    text: One stored normalized crop renders identically at any container size — a sidebar rail tile, the browse card, the detail header, the map pin — via one shared display formula (expand the decrypted image inside an overflow-hidden box + offset by the crop). No per-surface crop, no cropped-image upload. Note what is one shared FORMULA and not one shared component — SpaceMap applies `coverImageStyle` inline rather than mounting MemoryCoverImage, so the formula is the invariant and the component is not.
    coverage:
      web:
        unit:
          - src/features/memories/memoryCover.test.ts
          - src/features/memories/components/MemoryCoverImage.test.ts
          - src/core/node/cover/components/NodeCoverImage.test.ts
          - src/features/memories/components/MemoryCard.test.ts
          - src/components/app/AppSidebar.test.ts
  - id: set-cover-and-crop-editor
    text: The header's Cover action and the cover tile open core's cover dialog (the crop EDITOR), the only way a cover is set - the gallery lightbox offers no "Set as cover" (owner 2026-10-19). The dialog crops one source — an uploaded image OR the current cover re-framed — in a fixed 16:9 viewport with drag-to-pan + zoom (1–3×), hand-rolled (no crop library); Save normalizes the pan/zoom back to the 0..1 crop and seals it; Remove clears the cover; reopening an existing cover restores its pan/zoom.
    coverage:
      web:
        unit:
          - src/core/node/cover/components/CoverDialog.test.ts
          - src/features/memories/components/MemoryDetailHost.cover.test.ts
          - src/features/memories/components/MediaLightbox.test.ts
  - id: cover-from-standalone-upload
    text: The cover may be a brand-new uploaded image that is NOT registered as a Memory media — a standalone cover blob committed to the node (no `veyq_media` row), sealed under a K_blob wrapped by K_node, served + garbage-collected via the blob transport (a node DELETE no longer reclaims it — under the ADR 0061 soft-delete the cover has to outlive the trash window, so the reclaim moved to `NodeSubtreePurge`; a removal names the blob it expects in the slot and is refused with `cover_stale` when a peer's upload holds it, in the one write that also re-seals the meta (`removeNodeCover`) — inbox #308); operator-blind (the server holds ciphertext + an opaque blob id for retention/authz only). (cr-0073.)
    coverage:
      backend:
        integration: [NodeCoverMemoriesSliceTest.aMemoryAndAChapterTakeACoverWithoutTouchingTheGallery, NodeCoverMemoriesSliceTest.switchingToAPhotoCoverIsARemovalThatWritesTheNewMetaAndFreesTheUpload, NodeCoverMemoriesSliceTest.aShareGuestReadsTheSharedMemorysCoverOnlyAndNothingAfterItsRemoval, NodeCoverCoreSliceTest.setThenReplaceThenRemoveLeavesNoRowNoBlobNoSessionAndTheQuotaWhereItStarted, NodeCoverCoreSliceTest.aSlotAnotherWriterFilledIsCoverStaleAndTheLoserIsFreed, NodeCoverCoreSliceTest.aMetaThatMovedWritesNothingAndKeepsTheUploadOpenForTheRetry, NodeCoverCoreSliceTest.twoWritersRacingForAnEmptySlotLeaveExactlyOneCover, NodeCoverCoreSliceTest.aTrashedNodeKeepsItsCoverForTheRestoreAndThePurgeFreesIt]
      web:
        unit: [src/core/node/cover/coverWrite.test.ts, src/features/memories/uploadWire.characterisation.test.ts, src/features/memories/memoryCover.test.ts, src/core/node/cover/useNodeCover.test.ts, src/core/node/cover/components/CoverDialog.test.ts, src/features/memories/components/MemoryDetailHost.cover.test.ts]
        # live smoke DONE (cr-0073, not scripted): re-seeded 127.0.0.1 instance + Garage --profile s3, browse origin
        # 127.0.0.1:8089 = store public endpoint. Uploaded a new image into a media-less Memory → blob-uploads-batch
        # → PUT /veyq → commitCoverBlob → downloaded back; cropped cover rendered on the detail header + browse card;
        # DB: node cover_blob_id + cover_byte_size (downscaled), wrapped_meta ciphertext (no plaintext leak), 0
        # veyq_media rows, 1 veyq_blob; remove reclaimed it (cover_blob_id NULL, veyq_blob 0). Since inbox #341 the
        # pointer is the node's COVER row in veyq_node_attachment (cover_byte_size dropped; the size is the blob's).
  - id: equal-upload-shares-a-photos-preview
    text: An image uploaded in the cover dialog whose plaintext equals the original of a photo of the Memory's gallery (the same sealed size, then the same SHA-256 from its `blob-meta`) is not stored again - the cover is a second blob row on that photo's PREVIEW object (the `SharedBlob` form of `setNodeCover`, its K_blob wrapped again bound to the node and COVER), nothing uploaded. Another content, a failure to look, or a photo without a digest uploads as before. The object goes only with the last row naming it (deleting the photo keeps the cover, removing the cover keeps the photo), quota counts it once, a block on the photo reaches the cover, and a source the node does not hold, a trashed or blocked one, or a taken id is `shared_source_invalid` with nothing written (ADR 0013 § 5).
    coverage:
      backend:
        integration: [SharedBlobSliceTest.theObjectSurvivesTheRowThatGoesFirstAndGoesWithTheLast, SharedBlobSliceTest.aCoverRemovedFirstLeavesTheMediumsBytes, SharedBlobSliceTest.aSourceTheNodeDoesNotHoldIsRefusedAndNothingIsWritten, SharedBlobSliceTest.aBlockOnTheMediumReachesTheCoverOnItsObject, SharedBlobSliceTest.quotaCountsAnObjectOnce]
      web:
        unit: [src/core/node/cover/useNodeCover.test.ts, src/features/memories/components/MemoryDetailHost.cover.test.ts, src/core/blob/sharedBlob.test.ts, src/core/node/cover/coverWrite.test.ts]
gaps:
  stack: >-
    Lane L1's browser pass (`tests/e2e/tests/features/memories/memory-banner.spec.ts`) drives
    `equal-upload-shares-a-photos-preview` in Chromium against the release candidate: the gallery's portrait photo
    uploaded again in the cover dialog sends no `blob-uploads-batch`, and the one cover write (`PUT …/cover`) names that
    photo's PREVIEW as its `shared.sourceBlobId` under a blob id of its own; the cover then decodes in the header. Green
    in local runs of the memories leg of `scripts/run_stack_e2e.py`; ADR 0040 admits `stack` refs only once a CI run's
    log shows the suite executed (no remote yet).
