useCase: uc.memory.gallery
feature: memory
title: Open a Memory & browse its gallery
# The web gallery UI is built (cr-0049): MemoryDetail (grid + header) + MediaLightbox (preview, prev/next,
# download) over the ready three-tier data layer (en.memory.derivatives). The data-path criteria carry refs on
# every surface (the cr-0045/0047/0048 data layer) plus the web render tests.
acceptanceCriteria:
  - id: thumbnail-grid
    text: Opening a Memory lists its media and renders a thumbnail grid (each thumbnail fetched as ciphertext and decrypted on device under K_mem). The grid is the Gallery tab of a tabbed detail view (Gallery / Chapters, cr-0061).
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MemoryDetail.test.ts] }
  - id: lightbox-preview
    text: Opening an item shows its preview (not the multi-MB original) full-view, with prev/next paging the grid order.
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MediaLightbox.test.ts] }
  - id: download-original
    text: An explicit download fetches the pristine, full-resolution original (the only byte-identical copy).
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MediaLightbox.test.ts, src/features/memory/download.test.ts] }
    gaps:
      - surface: backend
        reason: >
          The integration ref runs against the in-memory store, which moves no bytes: it proves the upload's
          metadata round-trip, not that the original comes back. The real presigned transfer — each sealed chunk
          PUT to its presigned URL on a real S3-compatible store (the bundled Garage), completed against the
          stored objects, presigned GET and fetched back byte-identical — is measured only by
          `BlobBatchE2ETest.uploadThenDownloadRoundTripsBytes`, which runs when `VEYQ_S3_E2E=1`. No CI job sets it,
          so it makes no coverage claim (ADR 0040) and is named here instead.
  - id: favorite-toggle
    text: >
      The header toggle pins/unpins the Memory (operator-blind, via en.memory.favorites), and the pin is
      PRIVATE to its member: it seals under their master key, in every scope without branching on scope type,
      so a co-member holding the shared K_SC cannot open it. Asserted on the typed open refusing, because
      the loader swallows a failed unwrap by design and a bite phrased over it could never redden. The set is
      carried across a master-key rotation for every scope the member belongs to.
      cr-favorites-two-objects (ADR 0068 §1-§3, discharging ADR 0014 §7).
    coverage:
      web:
        unit:
          - src/app/favoritesStore.test.ts
          - src/app/favoritesPrivacy.test.ts
          - src/features/memory/favorites.test.ts
          - src/features/account/rotation/rotateKeys.test.ts
  - id: operator-blind-fetch
    text: Every tier (thumbnail/preview/original) is fetched as ciphertext via presigned GET and decrypted on device; the server sees no pixel, filename, or content key.
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps, MediaSliceTest.mediaWithoutDerivativesListsEmptyTiers] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MemoryDetail.test.ts, src/features/memory/components/MediaLightbox.test.ts] }
  - id: justified-grid-sealed-dimensions
    text: The web grid is laid out justified (aspect-preserving rows that fill the width); each media's geometry (w,h) rides the always-listed metadata tier (wrappedMeta, cr-0068 consolidating cr-0064's wrappedLayout + cr-0066's wrappedCapturedAt) sealed under K_mem at upload and unwrapped on device to drive the layout, so the blind server never sees pixel dimensions. Media without a sealed geometry fall back to a default aspect.
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.mediaWithoutDerivativesListsEmptyTiers] }
      web:
        unit:
          - src/features/memory/mediaGridLayout.test.ts
          - src/features/memory/media.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: lightbox-exif-detail
    text: Opening an item lazily fetches its sealed panel bundle (wrappedExif) via the exif endpoint (getMediaExif) — kept out of the list so it stays constant-small — and unwraps it on device under K_mem to fill the detail panel. The bundle's contents are a versioned client-only shape and are deliberately NOT enumerated here (the fields themselves are covered by panel-shows-what-the-photo-knows); what this criterion pins is the tier mechanics. The capture date, coordinates and resolved place name come instantly from the always-listed metadata tier (wrappedMeta), not the lazy bundle. The blind server never sees any field; an item without a sealed bundle shows a no-detail message (cr-0064/0068).
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.mediaExifWithoutExifIsNull, MediaSliceTest.mediaExifForUnknownMediaIs404] }
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: panel-shows-what-the-photo-knows
    text: The detail panel renders, from the two sealed tiers, the file (original name, plaintext size — byteSize minus 28 per chunk, never the raw ciphertext size — and format), the camera and lens, the exposure (focal length and its 35 mm equivalent, aperture, shutter, ISO, exposure compensation, and whether the flash fired — read as the EXIF BITFIELD, so 16 means it did not), the provenance an editor wrote in (software, author, copyright, rating, title, description), and the geo block (altitude, camera view direction, positioning accuracy). Every row appears only when the photo carries that value; none of it is ever sent, and the filename in particular is sealed and never leaves the device.
    # The tag NAMES and the parse options are pinned separately by readExif.fixture.test.ts, the one test that
    # runs the UN-MOCKED exifr over a generated fixture — without it every mocked assertion here would pass
    # just as well against an invented tag. It caught four on its first run.
    coverage:
      web:
        unit:
          - src/features/memory/readExif.fixture.test.ts
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: panel-place-name-and-map
    text: Where the user has consented to maps, a photo that carries a coordinate shows a RESOLVED PLACE NAME above the coordinate (which stays visible) and a small map below it with a needle for the recorded view direction. The name is resolved client-direct from the bare coordinate, ONCE PER PLACE (the client cache is keyed on the coordinate rounded to ~110 m, and requests are serialised at >= 1 s — ADR 0016 Request discipline), then sealed into the listed tier and read from there forever. Without consent no coordinate and no tile leave the device and the rows stand alone; a read-only viewer never writes. Distinct from uc.memory.place's sealed-location-on-node, which is ONE named place per NODE, set deliberately by a user.
    coverage:
      web:
        unit:
          - src/features/memory/placeName.test.ts
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: date-sorted-grid
    text: The gallery sorts tiles by effective capture time (newest first by default, a header toggle for oldest first; undated media last). Each media's capturedAt is sealed under K_mem in the always-listed metadata tier (wrappedMeta — geometry + capture time + GPS; cr-0066/0068) — the derived original is the EXIF DateTimeOriginal or the file's creation date, so the blind server never sees a timestamp yet the grid can order client-side. A lightbox correction re-sorts without a refetch. The rule covers EVERY tile, including one still uploading — an in-flight tile takes its capture-time place from the same EXIF-else-file-date rule the sealed tier will carry, derived on device before a byte is uploaded, so finishing an upload changes a tile's content and never its place. There is no privileged front block, on either surface, since the Memory gallery and the share viewer sort through one comparator.
    coverage:
      # Sorting is client-side; cite the tests that assert the ORDER. MemoryDetail.test.ts asserts newest-first
      # default + the oldest-first toggle re-sorting already-listed tiles with no refetch (and a lightbox date
      # correction persisting in place); media.test.ts asserts the effectiveCapturedAt sort key (undated → an
      # undefined key that sorts last). The backend's role — relaying the sealed capturedAt tier the server can't
      # read — is not sorting and is already proven under lightbox-exif-detail / lightbox-correct-capturedat, so
      # the two MediaSliceTest refs (round-trip + meta-overwrite) are dropped here rather than mis-cited as sort proof.
      # The in-flight half needs DOM-level refs: useMediaGalleryLive.test.ts and ShareView.test.ts both stub the
      # optimistic tiles away, so neither can see tile order. MemoryDetail.optimistic.test.ts and
      # ShareView.order.test.ts mount the real grid and read the settling tile's slot before and after the
      # reconcile; media.test.ts pins that the tile's key IS the key the tier seals, which is what makes the
      # slot stable rather than coincidentally equal.
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
          - src/features/memory/components/MemoryDetail.optimistic.test.ts
          - src/views/ShareView.order.test.ts
  - id: lightbox-correct-capturedat
    text: From the lightbox a user can correct (or set) a media's capture time; the correction is sealed under K_mem inside the listed metadata tier (wrappedMeta) as capturedAtOverride alongside the immutable extracted original (geometry + GPS ride along unchanged), re-sealed client-side and PUT verbatim (updateMediaMeta) — the blind server never sees the date. The panel shows the effective time (override ?? original) with a "corrected" indicator and can reset to the original; a media with no EXIF can have a date set (cr-0065/0068).
    coverage:
      backend: { integration: [MediaSliceTest.updateMetaOverwritesSealedTierAndLists, MediaSliceTest.updateMetaForUnknownMediaIs404] }
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: sealed-media-type
    text: A media's full MIME type is sealed under K_mem inside the always-listed metadata tier (wrappedMeta) at upload — never a server-visible field (an application of ADR 0044 — a plaintext mediaType would leak photo-vs-video-vs-PDF per medium; ADR 0047). The blind server relays the same opaque blob it already does (its opaque relay is proven under justified-grid-sealed-dimensions); the client unseals it (isVideoMediaType) to drive the video signal. cr-inline-video-playback (#104/#105).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
  - id: lightbox-video-playback
    text: Opening a video (sealed mediaType video/*) shows its poster (the PREVIEW tier) with a play affordance; clicking play fetches + decrypts the pristine original on device and plays it from a typed blob URL in a <video> element (Slice 1 interim, ADR 0047 — no service-worker range layer yet, no size cap). An image shows no play affordance. Operator-blind — the original is fetched as ciphertext via presigned GET and decrypted under K_mem. cr-inline-video-playback (#104).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: video-play-badge
    text: A video tile draws a play badge over its poster in the gallery grid, the Beiträge (buckets) grid, and the Trash grid — driven by the sealed mediaType (isVideoMediaType), with no extra fetch. An uploading video shows a locally-derived first-frame poster + badge (not a bare icon) once settled, so the in-flight and persisted states agree. cr-inline-video-playback (#105).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: media-type-lazy-backfill
    text: A pre-field media (uploaded before the sealed mediaType existed) carries no video signal; on the first download of its original the client sniffs the decrypted bytes (magic bytes, incl. WebM/MKV via the EBML DocType) and re-seals the type into the tier (updateMediaMeta), so the next listing shows the badge + the <video> branch. Never in the read-only public viewer (no authed write path); a never-fetched pre-field video stays without a signal — the accepted boundary (ADR 0047). cr-inline-video-playback (#104/#105).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/download.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: sw-range-streaming
    text: A playing video is streamed, not fetched whole — a Service Worker intercepts a synthetic in-origin URL, parses the demuxer's HTTP Range (first probe, closed, open-ended, suffix; no-Range → 200 + Accept-Ranges), maps the plaintext byte-range to the covering ciphertext chunk indices (plaintextTotal = byteSize − 28·chunkCount), assembles the window and answers 206 Partial Content with Content-Range. The range↔chunk math is pure + unit-tested; the SW's fetch/206 assembly is tested against a mocked page port. cr-inline-video-playback Slice 2 (ADR 0047).
    coverage:
      web:
        unit:
          - src/sw/range.test.ts
          - src/sw/mediaSw.test.ts
  - id: sw-key-free-delegation
    text: The Service Worker holds no key and no auth — it maps ranges to chunk indices and requests those chunks' decrypted plaintext from the owning page over a MessagePort; the page runs the existing presign→openFrame path in its own context (K_blob/K_mem never leave the page) and transfers plaintext back. The synthetic URL carries an opaque per-playback handle, never a blobId or credential. The SW's only cache is a bounded in-memory plaintext LRU — never Cache Storage / IndexedDB. The AAD `total` bound at openFrame is the whole blob's chunkCount, never the range subset (a subset total is proven to fail). cr-inline-video-playback Slice 2 (ADR 0047).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/sw/mediaSw.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: sw-presign-expiry
    text: The page-side chunk provider presigns the whole blob once and caches the URLs by issue time; on a stale-URL 403 (the backend's 600 s presign TTL elapsed) it re-presigns the whole blob and retries the chunk once, so a long playback never breaks on expiry. cr-inline-video-playback Slice 2 (ADR 0047).
    coverage:
      web:
        unit:
          - src/features/memory/media.test.ts
  - id: sw-share-viewer
    text: The anonymous public-share viewer streams video through the SAME SW path — the page passes a share-scoped chunk provider (per-item K_mem + guest pwToken over the gated share-scoped presign, resolveShareBlob) that shares the authed provider's openFrame core, so the SW never learns which route served the bytes. cr-inline-video-playback Slice 2 (ADR 0047).
    coverage:
      web:
        unit:
          - src/features/memory/share.test.ts
          - src/features/memory/media.test.ts
  - id: sw-no-sw-fallback
    text: When no Service Worker controls the page (unsupported browser, a first load before activation, or a protocol-version handshake mismatch with a stale SW), playback falls back to the Slice-1 path — fetch + decrypt the whole original and play it from a typed blob URL — so video always plays. The switchover is per-play and revokes the SW playback on item switch / close / unmount. cr-inline-video-playback Slice 2 (ADR 0047).
    coverage:
      web:
        unit:
          - src/features/memory/components/MediaLightbox.test.ts
  - id: sw-inert-responses
    text: >-
      The playback shim serves only a single well-formed video type, refuses page loads, and marks every
      response inert (ADR 0047 § The shim serves inert responses). The sealed mediaType is the uploader's word
      and becomes the shim's Content-Type on the app origin, so only ONE `video/<subtype>` essence — no list, no
      parameters — counts as a video (for the badge, the lightbox branch and the Slice-1 blob type) and gets a
      playback handle, which the SW refuses independently of the page; a navigation to a handle, live or not,
      is a 404; and every shim response, refusals included, carries `nosniff` + `sandbox; default-src 'none'`.
    coverage:
      web:
        unit:
          - src/sw/mediaSw.test.ts
          - src/features/memory/media.test.ts
  - id: item-marks-are-shared-and-attributed-to-nobody
    text: >
      A member marks an individual medium inside a Memory; the mark is SHARED with the scope, sealed under
      K_SC at the base epoch with its own `item-favorites` context, and stored as one blob per
      (member, scope, node). The read returns every member's blob — deliberately not filtered to the caller,
      because an operator-blind server cannot aggregate for the client — but carries no member id at all: the
      only identity on the wire is a `self` flag on the caller's own entry. Aggregate-only is therefore a
      property of the data, not a rule the UI is trusted to keep. cr-favorites-two-objects (ADR 0068 §1, §5, §6).
    coverage:
      backend:
        integration:
          - ItemFavoritesSliceTest.getReturnsEveryMembersBlobNotJustTheCallers
          - ItemFavoritesSliceTest.aPutTouchesOnlyTheCallersBlob
          - ItemFavoritesSliceTest.putThenGetReturnsTheVerbatimCiphertext
          - ItemFavoritesSliceTest.nonMemberIs404
      web:
        unit:
          - src/app/itemFavoritesStore.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: item-marks-are-partitioned-per-memory
    text: >
      Marks are stored per node, not per scope: the partition keeps the 65 536-char ciphertext cap out of
      reach and stops one toggle re-uploading the scope's whole set, and it costs no metadata because the
      client has just listed that node's media, so the server already observed the node id. Marks in one
      Memory never surface in another. cr-favorites-two-objects (ADR 0068 §4).
    coverage:
      backend: { integration: [ItemFavoritesSliceTest.blobsArePerNodeNotPerScope, ItemFavoritesSliceTest.lastWriteWins] }
      web: { unit: [src/app/itemFavoritesStore.test.ts] }
  - id: gallery-filters-by-marks-and-shows-an-aggregate
    text: >
      The gallery header filters the grid to everyone's marks or only the caller's, and each tile's heart
      carries the number of members who marked that item — never a name or a face. The filter is applied to
      the one sorted list the grid, each tile's index and the lightbox snapshot all derive from, so prev/next
      cannot page out of the active selection. An in-flight upload is not part of a filtered view.
      cr-favorites-two-objects (ADR 0068 §6).
    coverage:
      web:
        unit:
          - src/app/itemFavoritesStore.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: degenerate-filter-is-hidden-not-disabled
    text: >
      In a personal scope there is nobody to share a mark with, so the everyone/mine filter is ABSENT rather
      than rendered disabled, and no per-tile count is shown (E4); a filter that empties the grid names itself
      so it never reads as a broken Memory (E5). cr-favorites-two-objects (ADR 0068 §7).
    coverage:
      web: { unit: [src/features/memory/components/MemoryDetail.test.ts] }
  - id: marks-are-reclaimed-with-what-they-point-at
    text: >
      Item marks die with the things they describe: the scope purge erases them (enforced structurally — the
      table's scope FK puts it in the erasure closure, so validate_scope_erasure_arity.py stays red until
      ScopePurge names it), the node subtree purge drops a purged Memory's marks while a still-restorable one
      keeps them, and revoking a member's grant removes theirs so they cannot keep voting in an aggregate
      nobody can take back. cr-favorites-two-objects (ADR 0068 Consequences).
    coverage:
      backend:
        integration:
          - NodeTrashSliceTest.purgeReclaimsMediaDerivativesBucketsCoverAndTheStoreObjects
          - ItemFavoritesSliceTest.removingAMemberDropsTheirItemFavorites
gaps:
  crypto: >-
    `packages/crypto`'s job (`ci.yml` → `frontend` → "Run shared crypto checks") has never executed, so ADR 0040
    admits none of its suites: a declared run is enough only on a job a run has already executed (its note on
    which rows a run has admitted). `src/v1.conformance.test.ts` pins the clause of
    `item-marks-are-shared-and-attributed-to-nobody` that says the marks carry their OWN `item-favorites`
    context: the `seal.sym.item-favorites` vector, and its domain separation from `favorites` (the vector's blob
    does not open as any other purpose — without it a private pin blob opens in the shared slot). Until that
    job runs, no admitted ref proves that clause: `src/app/itemFavoritesStore.test.ts` mocks the sealing module,
    and the backend relays ciphertext it cannot open. On the first run whose log shows packages/crypto's suites
    executed, the suite goes back under that criterion and this gap goes.
