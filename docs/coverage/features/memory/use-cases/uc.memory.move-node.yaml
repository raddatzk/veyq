useCase: uc.memory.move-node
feature: memory
title: Move a node — put a folder, a Memory, a chapter, a file or a drop box somewhere else in the tree
# Built by inbox #358 (web only; the placement endpoints, rules and refusals are ADR 0080's and were already server-side).
# Every web criterion was bitten: the rights rows, the browser's places and blocks (the folder browser replaced the
# list of every destination, owner decision 2026-10-14), the door per session, the refusal mapping,
# the dialog's question, pre-check, re-read and undo, the epoch rule on the wire, the hosts' wiring and the placement
# hints each turned their own tests red when sabotaged. The live run (`src/core/node/move.e2e.test.ts`: a moved subtree
# decrypts; a guest's folder moved out takes no more files) is written but has not run in CI, so it is cited nowhere here.
acceptanceCriteria:
  - id: a-move-keeps-the-subtree-readable
    text: "A move re-wraps only the moved node's own content key under the destination's key (K_SC at the current epoch at the scope root, the destination node's key elsewhere) and re-seals its name and slug token there at the next placement revision, stating the revision it was built on; every key below opens as before. A move into or out of the scope root seals at the current epoch, a move between two folders at the node's stored one."
    coverage:
      backend:
        integration: [NodePlacementCoreSliceTest.aPlacementKeepsTheNodesEpochAndWaitsForItsDestination, NodePlacementCoreSliceTest.theListingServesThePlacementRevisionAndOnlyAPlacementMovesIt, NodePlacementRaceCoreSliceTest.twoMovesOfOneNodeToDifferentParentsLandOne]
      web:
        unit: [src/core/node/move.wire.test.ts, src/core/node/tree.wire.test.ts]

  - id: a-placement-is-compare-and-set
    text: "A rename or move states the placement revision it was built on and carries the node's key re-wrapped for the new placement: a rename without the re-wrap or without the revision is 400, one built on revision n after a move took the node to n+1 is 409 stale_placement and leaves the name as it was, and a cycle-forming move is 422 illegal_structure with the revision unchanged (ADR 0080 decision 3)."
    coverage:
      backend:
        integration: [NodePlacementCoreSliceTest.aRenameBuiltOnTheRevisionBeforeAMoveIs409AndLeavesTheName, NodePlacementCoreSliceTest.aRenameWithoutItsRewrapOrItsRevisionIs400AndAStaleOneIs409, NodePlacementCoreSliceTest.aCycleFormingMoveIs422AndLeavesTheRevision]

  - id: a-wrap-opens-only-at-its-placement
    text: "A node's name and key wrap open only at the node and placement revision they were sealed for: the same entry served on another node's row, or at another placement revision (a replay of an older placement), does not open — for a member's tree and for a guest's chapter alike (ADR 0080 decision 3, ADR 0072 decision 1)."
    coverage:
      web:
        unit: [src/core/node/tree.test.ts, src/features/memories/share.test.ts]

  - id: a-placement-keeps-the-nodes-epoch
    text: "A placement never changes a node's epoch (its own key's counter): it states the node's own, and any other is 409 stale_epoch at every destination; the entry's seals bind the node's scopeEpoch. A node due for its re-key is 409 node_rekey_pending wherever it goes, the scope root included, and a destination parent due for its re-key is 409 node_rekey_pending too (ADR 0080 decision 4, ADR 0114 decision 3)."
    coverage:
      backend:
        integration: [NodePlacementCoreSliceTest.aRootRenameOfANodeTheReKeyHasNotReachedIsPendingAndAnotherEpochStale, NodePlacementCoreSliceTest.aPlacementKeepsTheNodesEpochAndWaitsForItsDestination, NodePlacementCoreSliceTest.anEpochThatIsNotTheNodesIsRefusedForAnyDestination]

  - id: the-picker-offers-what-the-server-takes
    text: "Core's move dialog is a folder browser over what the session can see — a member's whole space up to its root, a guest's subtree up to the link's root, never above it. It opens where the node is, lists only the places that can take its kind (folders as the way down, a Memory for a chapter; no file, no drop box, no guest's identity folder), lists the node itself as not to be opened, and disables Move here, with the reason, where the node is now, inside itself, in a guest's identity folder and wherever its kind's placement does not take it (a mirror of NodeKindRules: a folder, Memory, file or drop box at the root or in a folder, a chapter only in a Memory; a guest only into a folder). Every place and crumb is a button, and focus goes to the list of a place opened. The browser takes a node list, a place offered only where it takes every one. A node at the destination whose name folds to the same slug is named before anything is sent."
    coverage:
      backend:
        integration: [NodeKindMatrixSliceTest.moveFollowsTheMatrix, DepotNodeSliceTest.aFileIsRenamedAndMovedBetweenFolders]
      web:
        unit: [src/core/node/move.test.ts, src/core/node/MoveNodeDialog.test.ts, src/core/sharing/ShareTreePage.move.test.ts, src/views/SpaceView.move.test.ts, src/features/memories/register.test.ts, src/features/depot/register.test.ts]

  - id: who-may-move-what
    text: "A member moves any node it may write (not during a pending deletion), a guest's identity folder or a file in one out of a drop box included; a READ_WRITE guest moves only a node a FOLDER of its subtree holds — never the link's root, never in or of an identity folder, never a chapter or a drop box — and only through its link after the page's naming flow; a READ or WRITE_ONLY guest moves nothing. A guest's move touches no authenticated client."
    coverage:
      backend:
        integration: [ShareNodesCoreSliceTest.aGuestMovesAndRenamesInsideTheSubtree, ShareNodesCoreSliceTest.aGuestNeverMovesANodeOutOfTheSubtreeTheRootOrIntoACycle, ShareNodesCoreSliceTest.aWriteOnlyOrAReadGuestDoesNoTreeOperation, DropBoxSliceTest.aGuestOfALinkAboveMovesNothingOutOfADropBox]
      web:
        unit: [src/core/access.test.ts, src/features/depot/rights.test.ts, src/features/memories/rights.test.ts, src/core/sharing/ShareTreePage.move.test.ts, src/views/SpaceView.move.test.ts, src/features/depot/levelRows.test.ts, src/features/depot/levelRows.guest.test.ts, src/features/depot/components/DropBoxDetail.test.ts, src/features/memories/components/MemoryDetail.rights.test.ts, src/core/node/LevelView.test.ts]

  - id: refusals-are-explained-by-name
    text: "Each server refusal of a move is said by its code — slug_taken, illegal_structure, illegal_scope, stale_epoch, share_not_contributable, a gone node or link, rate_limited, scope_deleting — and a lost race (stale_placement, after the write's own bounded re-read) re-reads the tree so the next attempt builds on the node as it now is; a guest who declines to name itself sends nothing and is told nothing."
    coverage:
      backend:
        integration: [ShareNodesCoreSliceTest.aTakenSlugIsAConflictOnCreateAndOnMove, NodePlacementCoreSliceTest.anEpochThatIsNotTheNodesIsRefusedForAnyDestination]
      web:
        unit: [src/core/node/move.test.ts, src/core/node/MoveNodeDialog.test.ts, src/core/sharing/ShareTreePage.move.test.ts]

  - id: a-guest-folder-moved-out-ends-its-identity
    text: "A member moving a drop-box guest's folder out is asked first (the folder becomes ordinary, its guest can add nothing more, nothing moves back into a drop box) and offered no undo; the folder's key, opened through the drop key and the guest's K_up, is re-wrapped under the destination's, and once the server ends the identity the folder and its files open as before."
    coverage:
      backend:
        integration: [DropBoxSliceTest.aMemberPlacesNothingInADropBoxAndOnlyDeletesOrMovesOut]
      web:
        unit: [src/core/node/move.wire.test.ts, src/core/node/MoveNodeDialog.test.ts, src/views/SpaceView.move.test.ts]

  - id: a-move-is-undone-and-followed
    text: "After a move the tree is re-read, a node on screen (or below the moved one) is followed to its new path, and a toast says where it went with an Undo that moves it back through the same door and follows it back."
    coverage:
      web:
        unit: [src/core/node/MoveNodeDialog.test.ts, src/views/SpaceView.move.test.ts]

  - id: several-move-as-single-writes
    text: "A level's selection moves through the same browser and door (inbox #421): a place is blocked where any selected node cannot go, the reason naming that node; before anything is sent a node already there or whose name folds to a sibling's there is named and left out; the rest is sent one node after the other, each the single node's own placement write (no batch request), with the tree re-read once and a guest named once; a refusal part-way leaves what moved and still sends the rest; one summary names each node that did not move with its reason, and one toast's Undo moves back exactly what moved (a guest's folder out of a drop box asked once, no undo)."
    coverage:
      web:
        unit: [src/core/node/move.test.ts, src/core/node/move.wire.test.ts, src/core/node/MoveNodesDialog.test.ts, src/core/sharing/ShareTreePage.move.test.ts, src/views/SpaceView.move.test.ts]

  - id: drag-and-drop-moves-as-the-dialog-does
    text: "On a folder level a row or tile is draggable only where the viewer may move that node and the page has its move door (a READ guest drags nothing); in Select mode a selected node drags the selection's movable part, an unselected one itself. A sub-folder of the level or an ancestor in the page's breadcrumb takes the drag exactly where the move dialog would enable Move here there - never the place the nodes are in, themselves, anything inside them or a guest's identity folder - and only a place that takes it is lit; a drag of files from the operating system lights none and stays the level's upload. The drop runs the move dialogs' own run: the same name check before sending, writes, refusal words (in an error toast), toast with Undo, and for a selection the dialog's summary of what did not move."
    coverage:
      web:
        unit: [src/core/node/nodeDrag.test.ts, src/core/node/LevelView.drag.test.ts, src/core/node/nodeDialogs.moveTo.test.ts, src/components/app/AppTopbar.test.ts, src/core/sharing/ShareTreePage.move.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/field-seal.spec.ts`) drives `a-move-keeps-the-subtree-readable` in
    Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion. A folder moved through core's move dialog shows under its destination, by its name, after a reload
    and on a second device; `tests/e2e/tests/features/depot/depot-drag-move.spec.ts` drives
    `drag-and-drop-moves-as-the-dialog-does` with Chromium's own drag (a file onto a sub-folder, then onto the parent's
    crumb), written 2026-11-04 and not yet run. Not covered there: a moved subtree's children. Green only in local runs of
    `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the first CI run (no remote), and ADR 0040
    admits `stack` refs only once a run's log shows the suite executed. On that run each file becomes a ref on the
    criteria its tests are tagged with, and this gap goes.
