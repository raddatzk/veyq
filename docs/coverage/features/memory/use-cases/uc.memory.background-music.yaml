useCase: uc.memory.background-music
feature: memory
title: Background music — a Memory's or Chapter's own audio files, shuffled, looped and crossfaded
status: planned
# Refined 2026-11-14 (ADR 0135); nothing is built. cr-background-music-from-own-audio turns these gaps into refs,
# after cr-remove-streaming-music has removed the playlists of uc.memory.music.
acceptanceCriteria:
  - id: a-track-is-a-medium
    text: An added audio file is a medium of its Memory or Chapter, its original the file, its `blob-meta` typed from its bytes by core's `sniffStream` (an M4A is `audio/mp4`, never `video/mp4`); no contract, table, column or route marks it; it is listed in the node's Music tab and filtered from every photo reader (gallery, lightbox, search, cover choice, the space's media list); the gallery's picker keeps refusing audio.
  - id: refused-before-upload
    text: A file over 200 MiB, of no audio container core knows, or that the uploading browser cannot decode is refused with its own reason before anything is written.
  - id: facts-sealed-at-birth
    text: Each track's duration and trimmed span (`trimStartMs`, `trimEndMs`; leading and trailing 20 ms windows below −60 dBFS, never trimmed below one second of content) are measured on the device at upload and sealed into its listed tier by the same upload, within the tier's cap; a re-key carries them unchanged; its title is its file name without the extension.
  - id: who-adds-who-listens
    text: Adding is offered where `memoryRights.upload` grants it (a member, a guest of a link that may upload); every viewer of the node — a member and any link's guest alike — gets the header's Play music button where the node has tracks and the Music tab where it has tracks or the viewer may add; a Chapter plays only its own tracks.
  - id: shuffled-endless-order
    text: The playlist is a snapshot of the node's tracks when started; each round is a fresh permutation from `crypto.getRandomValues` whose first track is never the last one played (two tracks or more); next goes forward, previous restarts a track more than 3 s in and otherwise goes back through the tracks played; a track pressed in the Music tab plays first.
  - id: crossfade-at-trimmed-edges
    text: Tracks play only their trimmed span and crossfade over 5 s through Web Audio gain nodes (1 s on a pressed next or previous, a third of a short track's span, what is left after a seek into the fade window); without Web Audio they follow each other without a fade; a track that does not open or play is skipped.
  - id: player-in-core-plays-across-pages
    text: Core's player draws its bar below the signed-in shell's footer and the share page's while a queue is loaded — title, previous, play/pause, next, a draggable progress bar over the trimmed span, close — and keeps playing across pages and spaces; a new queue replaces the playing one; the MediaSession carries the title and the actions; core is handed URLs, never a key, and at most two sources are open; a lock unmounts the bar and releases every source; `app.footerBar` and `onSessionEnding` no longer exist.
  - id: report-and-review
    text: A track's menu offers download, delete (to the trash) and report as an `ITEM`; the moderator's review of a reported audio medium plays it from the report's blob keys.
  - id: export-import
    text: An export carries each track's file and its facts as the medium's optional `audio` field; an import restores them, and measures them on the importing device where the field is absent.
gaps:
  backend: "Nothing of its own (ADR 0135 decision 2): a track is a medium, stored, listed, trashed, re-keyed, reported and erased as every medium is; the media slice tests that already pin those are cited when the web phase lands."
  web: "Planned, nothing built: no Music tab, audio upload path, silence detection, core player or bar exist (cr-background-music-from-own-audio)."
  stack: "Planned: a lane L1 spec that adds two tracks and hears the bar move to the second comes with cr-background-music-from-own-audio's web phase."
