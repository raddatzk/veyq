useCase: uc.memory.participants
feature: memory
title: Memory participants — opaque ids in the sealed meta, a profile that lists a person's Memories
# Built 2026-10-13, WEB ONLY (ADR 0083, inbox #20): the participants sub-object rides on the existing `wrappedMeta` write, so
# there is no backend or contract change (and the existing NodesSliceTest wrappedMeta round trip is not claimed for it). The
# guest exclusion is an INTERFACE boundary, not a cryptographic one - a share serves the node's meta unchanged and the guest
# holds K_mem; the list holds opaque ids only, so the accepted residual is the count and the ids, never a name (ADR 0083
# decision 4, comparable to ADR 0030 point 8). Not built: a user avatar (inbox #414), the uploader on Files (inbox #415).
# Unverified in a real browser (the dev stack was not run for this change); the profile's covers load per visit only.
acceptanceCriteria:
  - id: participants-sealed-in-node-meta
    text: A Memory's participants are a `participants` sub-object of opaque user ids (`{ userIds }`, unique, at most 100) inside its `wrappedMeta` under K_mem, written read-modify-write with the metaVersion compare-and-set; nothing but ids is stored (no name, no snapshot), unknown siblings are kept, an empty list drops the sub-object, and the server stores one opaque blob and no participant relation.
    coverage:
      web:
        unit:
          - src/features/memory/memoryParticipants.test.ts
          - src/features/memory/components/MemoryParticipants.test.ts
  - id: concurrent-edits-merge
    text: On `409 stale_version` the writer re-reads the blob and MERGES instead of surfacing a same-field conflict - the union of the stored and the wanted list, a removal by the person editing winning for the id they removed - through its own edit function (`editParticipantsOf`), not `editField`.
    coverage:
      web:
        unit:
          - src/features/memory/memoryParticipants.test.ts
  - id: guest-sees-no-participants
    text: The interface shows a guest no participants in any share view - the `participants` capability is false for every share role, so there is no section, avatar, control or profile link, and the header reads and requests nothing for it - while the sealed meta a share serves still lists the opaque ids (the accepted residual, pinned by a test); no name snapshot is ever stored.
    coverage:
      web:
        unit:
          - src/features/memory/capabilities.test.ts
          - src/features/memory/components/MemoryDetail.guest.test.ts
          - src/views/ShareView.memory.test.ts
          - src/features/memory/components/MemoryParticipants.test.ts
  - id: header-chips-and-picker
    text: A member sees the participants as overlapping letter avatars (up to three; past three the third slot is a "+N") and, in a popover opened by hover, focus or tap, every participant by name (real name, else username, read from the tenant's member list) linking to the profile - a former member greyed without a link - and - where the meta may be written, never during a pending scope deletion or in a personal scope - an add/edit control that opens a picker (checkboxes with a name search) over the scope's current members.
    coverage:
      web:
        unit:
          - src/features/memory/components/MemoryParticipants.test.ts
          - src/core/people/directory.test.ts
  - id: former-member-greyed
    text: A participant who left the scope stays as an id and renders greyed as "Former member" without a link; nothing prunes it, and the picker keeps it ticked until the person unticks it.
    coverage:
      web:
        unit:
          - src/features/memory/components/MemoryParticipants.test.ts
  - id: profile-route
    text: A member opens `#people/<userId>` (the reader also takes `#/people/<userId>`), token-less, in the tenant scope's shell; `people` is a reserved route segment (no application can claim it, a folder, file or drop box called "People" at a scope root is numbered `people-2`) and a foreign `~username` stays a personal-scope token.
    coverage:
      web:
        unit:
          - src/core/node/location.test.ts
          - src/core/applications/registry.test.ts
          - src/views/MemoryHomeView.people.test.ts
  - id: profile-lists-accessible-memories
    text: The profile shows the person's display name, a letter avatar (a former member greyed) and, in Memories' section, the Memories where they are a participant and the viewer has access - from a client-side index over the tenant and group scopes (never the personal scope), revalidated by ETag, bounded at 500 Memories per scope with a partial note, and with loading, empty and error states.
    coverage:
      web:
        unit:
          - src/features/memory/participantIndex.test.ts
          - src/features/memory/components/PersonMemories.test.ts
  - id: profile-list-is-the-level-list
    text: The profile's Memories list is drawn with the level view's own item component (a larger cover, the name, the kind, the Memory's date and place as details - the level's builder, a missing fact left out - and the group's name), as rows or as tiles through the same switch and the same per-user stored view-mode preference the folder view uses (no map); a stored map mode shows tiles without being rewritten.
    coverage:
      web:
        unit:
          - src/features/memory/components/PersonMemories.test.ts
          - src/core/node/ViewModeToggle.test.ts
          - src/features/memory/memoryRowDetails.test.ts
          - src/core/people/PersonProfile.test.ts
          - src/features/memory/lifecycle.test.ts
  - id: uploader-name-in-lightbox
    text: The photo detail shows the uploader's name by the display rule, independent of the participant list; a `user:` owner links to the profile for members only, a `share:` owner and a former member are plain names, and a share guest's session resolves no uploader (it shows nothing, as before).
    coverage:
      web:
        unit:
          - src/features/memory/useUploaderNames.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
gaps:
  backend: "None: no backend or contract change (the sub-object rides the existing wrappedMeta write, ADR 0083); the NodesSliceTest wrappedMeta round trip is not claimed for participants."
