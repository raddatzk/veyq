useCase: uc.memory.delete-node
feature: memory
title: Delete a Memory or Chapter — remove a whole subtree into a recoverable space trash
# Built by cr-node-delete-reversible-trash (contracts -> backend -> web) against ADR 0061. Soft-delete of the
# WHOLE subtree -> hidden from every read -> per-space node trash -> scheduled hard-purge of nodes + media +
# derivatives + buckets + blobs + store objects. Replaces the immediate hard delete, which reclaimed only the
# subtree's cover blobs and orphaned its media, derivative and bucket rows (inbox #131) — the leak closes because
# the purge finally owns the whole subtree instead of just its covers.
#
# The sharpest criterion is the share one, and it is the reason this CR was dangerous rather than merely
# additive: with deleted_at set but the two share reads unfiltered, a share on a deleted Memory goes from serving
# an EMPTY subtree to serving the full sealed subtree PLUS presigned blobs, unauthenticated. That regression was
# observed live before the fix — both share cases were red on the unfiltered tree — and each predicate was then
# removed on its own to confirm it reddens exactly its own case while the other's control stays green.
acceptanceCriteria:
  - id: delete-soft-deletes-the-whole-subtree
    text: "Deleting a node marks the node AND every descendant soft-deleted in one transaction, and destroys nothing — its media, derivative, bucket and blob rows and every store object survive untouched, which is what makes the restore complete. Deleting an already-deleted subtree is a no-op. A non-member gets a non-enumerable 404; a delete inside a scope that is itself pending deletion is a conflict."
    coverage:
      backend:
        integration: [NodeTrashSliceTest.deleteHidesTheWholeSubtreeAndListsTheRootInTheTrash, NodeTrashSliceTest.deleteDestroysNothingUnderTheSubtree, NodeTrashSliceTest.reDeletingAnAlreadyTrashedSubtreeIsANoOp, NodesSliceTest.crossScopeDeleteIsRejected]

  - id: subtree-leaves-every-read
    text: "A soft-deleted subtree disappears from the tree listing, from the media and bucket listings, and from cover operations — 11 read call-sites across NodesStore, MediaStore and SharingStore carry the new predicate, and the two bucket handlers that reach a node without passing the node gate (renameBucket, deleteBucket) are closed explicitly."
    coverage:
      # The tree/media/bucket/cover reads all route through one of two gates — NodesStore.list /
      # MediaStore.findNode — so the listing case covers the read sweep, and the cover case covers the one
      # media-side read whose behaviour visibly CHANGED (the blob now survives the delete).
      backend:
        integration: [NodeTrashSliceTest.deleteHidesTheWholeSubtreeAndListsTheRootInTheTrash, NodeCoverSliceTest.deleteNodeKeepsTheCoverBlobForTheRestore]

  - id: subtree-leaves-both-share-paths
    text: "A soft-deleted subtree leaves a public share on BOTH guest paths at once — the anonymous resolve stops listing it AND its blobs stop being authorized for a presign — and comes back on both on restore. Filtering only the listing leaves a Memory invisible in the share and fully downloadable by anyone holding a blobId for the whole retention window. Each predicate is bite-tested on its own: removing either must redden exactly its own assertion and leave the other's control green."
    coverage:
      # Each guest path is its own case with its own live control, because one predicate covering for the other
      # is the failure mode the pair exists to prevent — the same cross-feature obligation that already shipped
      # broken once for trashed media. Both were observed RED on the unfiltered tree, and each predicate was then
      # removed alone: exactly its own case reddened and the other's control stayed green.
      backend:
        integration: [ShareDeletedNodeSliceTest.deletedSubtreeLeavesTheAnonymousResolve, ShareDeletedNodeSliceTest.deletedSubtreesBlobsAreNoLongerAuthorizedThroughTheShare, ShareDeletedNodeSliceTest.deletedChapterLeavesItsParentsShareWithoutTakingTheParentWithIt, ShareDeletedNodeSliceTest.restoredSubtreeComesBackOnBothSharePaths]

  - id: reads-that-must-not-filter
    text: "Three reads deliberately keep seeing soft-deleted rows, and each has a failure mode if filtered — slug uniqueness (else validation passes and the database rejects the insert afterwards, turning a clean rejection into a 500), the delete's own subtree traversal (else re-deleting a partially deleted subtree stops early and strands the rest), and the whole-space erase (which must remove every node row including trashed ones)."
    coverage:
      # The slug-uniqueness trap is pinned at the handler, not over HTTP: a freed slug token IS the trashed
      # node's own id, a UUID, which the contract's base64 Pattern rejects at the boundary — so no HTTP client
      # can reach the collision, and only a handler-level caller can. Teaching that read the predicate turns the
      # clean rejection into a RollbackException, which is what the injection produced.
      # The traversal trap is observable only against the PURGE: if the delete skipped already-trashed
      # descendants they would keep an older marker, age out first, and be erased while the folder around them
      # still sits restorable in the trash.
      backend:
        integration: [NodeTrashSliceTest.slugTakenStillSeesTrashedRowsSoTheDatabaseNeverThrows, NodeTrashSliceTest.deletingAroundAnAlreadyTrashedSubtreeMakesTheWholeThingAgeOutTogether, ScopesSliceTest.purgeErasesExpiredScopeAndContentButKeepsFreshOnes]

  - id: slug-freed-on-delete-and-resupplied-on-restore
    text: "The soft-delete frees the node's slug by replacing slugToken with the node's own id, so the name is immediately reusable — required because UNIQUE(parent_id, slug_token) is a plain index and MariaDB has no filtered indexes. Restore carries a freshly client-computed slugToken; a collision with a node created in the meantime is rejected on the same constraint a create hits, and the client disambiguates."
    coverage:
      backend:
        integration: [NodeTrashSliceTest.deletingFreesTheNameImmediately, NodeTrashSliceTest.restoreIntoATakenNameIsACleanRejection]
      web:
        unit: [src/features/memory/tree.test.ts, src/features/memory/components/SpaceTrashDialog.test.ts]

  - id: restore-returns-the-subtree-intact
    text: "Restore clears deleted_at across the subtree and writes the supplied token back, returning every descendant, photo, bucket and cover exactly as it was. Restoring an already-purged subtree is a non-enumerable 404."
    coverage:
      backend:
        integration: [NodeTrashSliceTest.restoreReturnsTheWholeSubtreeIntact, NodeTrashSliceTest.restoreOfAnUnknownSubtreeIs404]
      web:
        unit: [src/features/memory/tree.test.ts]

  - id: space-trash-lists-deleted-subtree-roots
    text: "The space's Trash lists only the ROOT of each soft-deleted subtree (descendants went with it and return with it), each carrying when it was deleted and when it will be purged — purgeAfter derived at the resource boundary from deleted_at plus the configured retention, never stored."
    coverage:
      backend:
        integration: [NodeTrashSliceTest.deleteHidesTheWholeSubtreeAndListsTheRootInTheTrash]
      web:
        unit: [src/features/memory/components/SpaceTrashDialog.test.ts]

  - id: scheduled-purge-erases-the-subtree
    text: "A scheduled job hard-erases each subtree whose deleted_at is older than the retention window — media, derivative, bucket and blob rows in FK order and the store objects behind them, then the node rows — routed through the shared per-media purge body (rows AND their reclaim entries inside one transaction, the objects deleted by the single reclaim sweep on its next tick, ADR 0062) rather than a fourth copy of that logic. The cover-blob reclaim moves out of the delete path into this job, so a restore never returns a Memory whose cover was already reclaimed."
    coverage:
      # Observed through the RecordingBlobStore seam, not from the DB alone: the in-memory store's delete is a
      # no-op, so a row-only assertion would prove the chunk keys were COMPUTED and never that they arrived.
      # Carries its own in-window control — a subtree trashed but not yet expired survives on every arm.
      backend:
        integration: [NodeTrashSliceTest.purgeReclaimsMediaDerivativesBucketsCoverAndTheStoreObjects, NodeCoverSliceTest.deleteNodeKeepsTheCoverBlobForTheRestore]
