useCase: uc.memory.music
feature: memory
title: Background music — a Memory's playlist, played from the viewer's own Spotify or Apple Music account
# Built by cr-memory-background-music (ADR 0131), reworked to the owner's layout of 2026-11-13: the sealed `music` field
# of the node's meta, the dialog, the header's play buttons, the music bar in core's footer-bar slot with the viewer's
# opt-in, the music frame (veyq's own player) on the instance's music host (its own origin, its own policy), the register's
# three `deployment` entries, the Traefik router and the chart's route. A sign-in and playback with real vendor accounts
# is owed (inbox #846); lane L1's memory-music.spec.ts drives the dialog and the opt-in, never a vendor.
acceptanceCriteria:
  - id: sealed-playlists-in-node-meta
    text: A MEMORY or CHAPTER node's sealed `wrappedMeta.music` holds at most one playlist per service — a Spotify playlist id, an Apple Music `pl.` id with its storefront — read from a pasted share link; a link that is no playlist of the field's service is refused and nothing is written; an emptied field drops that playlist and an empty list the field; an invalid stored entry is skipped. Both services at their longest ids fit the meta's 8192 characters beside the worst case of every other field. The server sees ciphertext only.
    coverage:
      web:
        unit:
          - src/features/memories/music/musicModel.test.ts
          - src/features/memories/music/MusicDialog.test.ts
          - src/features/memories/banner/bannerModel.test.ts
  - id: edit-is-editmeta-bar-is-everyones
    text: The Background music entry of the node's ⋯ menu is offered exactly where the rights grant editMeta (never to a share guest); every viewer of the node's page, a member and a READ guest alike, gets one header button per playlist - a toggle that starts it in the music bar, pressed while it plays there, or the link into the service where the server plays none.
    coverage:
      web:
        unit:
          - src/features/memories/components/MemoryDetail.rights.test.ts
          - src/features/memories/music/musicHeader.test.ts
  - id: bar-in-the-shell-plays-across-pages
    text: The music bar is Memories' filling of core's one shell slot (`app.footerBar`, one per application, write-once), mounted below the signed-in app's footer and the share page's; the same iframe survives a change of page; a lock or a sign-out unmounts the bar and ends the music; Memories switched off mounts none; another Memory's playlist replaces the bar's only when started - the same service in the same frame, another service in a new one; Close ends the music and keeps the consent; a service no longer offered leaves the bar. Core imports no application for it.
    coverage:
      web:
        unit:
          - src/core/applications/registry.test.ts
          - src/components/app/AppShell.footerBar.test.ts
          - src/features/memories/music/MusicBar.test.ts
          - src/features/memories/music/musicHeader.test.ts
  - id: opt-in-per-browser-and-service
    text: Nothing of a service or the music host loads before the viewer's Play here in the bar; the consent is this browser's, per service, names the music host and holds only while that host is served; a browser that agreed mounts the frame at once; Turn music off withdraws it at once, tells the frame to forget the vendor's sign-in and keeps the frame until it said so (never past the wait), and a withdrawal in another tab removes it too. Where the server does not play a service here, only the link that opens it in the service is offered, in the header.
    coverage:
      web:
        unit:
          - src/features/memories/music/useMusicConsent.test.ts
          - src/features/memories/music/MusicBar.test.ts
          - src/features/memories/music/musicHeader.test.ts
  - id: sign-out-forgets-the-vendor-sign-in
    text: Every session ending (a sign-out, a refused refresh, an account erasure, another tab's announcement) runs the applications' ending steps before it loads the sign-in page, bounded and past a failing step; Memories' step tells a mounted frame to forget and waits for forgotten (never past the wait; a forget already in flight is joined), keeping the consent; with no frame mounted it mounts a hidden frame of the music host only in the tab that started the ending, only for a browser whose consent covers Apple Music at the host served now, tells it forget once it is ready - from that frame's window and origin only - and removes it once it said forgotten or the wait is spent; a frame told forget with no player loads none and clears its origin's storage. A lock forgets nothing.
    coverage:
      web:
        unit:
          - src/app/sessionEndingSteps.test.ts
          - src/app/sessionEnd.test.ts
          - src/core/applications/registry.test.ts
          - src/features/memories/music/musicEnding.test.ts
          - src/features/memories/music/MusicBar.test.ts
          - src/music-frame/main.test.ts
  - id: frame-isolated-by-origin-and-protocol
    text: The vendor's SDK runs only in the music frame, an iframe of the music host with `allow="encrypted-media; autoplay"` and no sandbox; the app hands it, once it says ready, one playlist, the service's public credential and its theme (exactly light or dark), to the music host's origin only, and takes only parsed state messages from that frame's window and origin; the frame obeys only its parent window, from the origin that spoke first, loads one vendor per frame, switches a later playlist of that service in place and ignores another service's, and empties itself on forget.
    coverage:
      web:
        unit:
          - src/music-frame/protocol.test.ts
          - src/music-frame/main.test.ts
          - src/features/memories/music/MusicBar.test.ts
  - id: veyq-player-with-vendor-attribution
    text: The frame draws veyq's own player in the app's tokens and theme - sign-in, previous, play/pause, next, the link back ("Listen on …") - and what plays (title, artist, an https cover; text bounded) only beside the vendor's bundled mark; without one it shows the state alone; a skip the vendor restricts is disabled.
    coverage:
      web:
        unit:
          - src/music-frame/main.test.ts
          - src/music-frame/player.test.ts
  - id: vendor-sign-in-stays-in-the-frame
    text: Spotify's sign-in is the Authorization Code flow with PKCE run in the frame — the S256 challenge, the music host's callback as redirect URI, no client secret — and the callback page relays code and state over a BroadcastChannel of the music origin (and to a same-origin opener), clears the address and closes; no vendor token is ever sent to the veyq server.
    coverage:
      web:
        unit:
          - src/music-frame/spotifyAuth.test.ts
          - src/music-frame/main.test.ts
  - id: released-dark
    text: "TEMPORARY (musicReleased, ADR 0131 decision 8): until the deployment sets veyq.music.released, whatever else it sets - a music host and both credentials included, none of which is then read or checked - no music entry is served and no music value reaches a client, the setup status says musicReleased false, the app's CSP keeps frame-src 'none', its Permissions-Policy grants no music origin and its COOP stays same-origin, no host serves the frame and the privacy notice has no music passage; the web reads the flag through one helper and draws no header button, no menu entry and no footer bar (not its empty frame), and a sign-out's ending skips the music with no frame, no timer and no wait; an ending with no step registered starts no budget. With the flag on, each is as built (the controls). Removed with the flag."
    coverage:
      backend:
        integration:
          - MusicSettingsTest.musicReleasedOffTheDeploymentsValuesAreNeitherReadNorChecked
          - MusicDarkSliceTest.noMusicEntryIsServedAndNoValueReachesAClient
          - MusicDarkSliceTest.theAppsPoliciesAreAsBeforeTheMusic
          - MusicDarkSliceTest.noHostServesTheFrame
          - MusicDarkSliceTest.thePrivacyNoticeHasNoMusicPassage
          - MusicFrameSliceTest.theThreeEntriesAreServedWithTheirValuesOnTheirOwnEntriesOnly
      web:
        unit:
          - src/shared/state/useCapabilities.test.ts
          - src/features/memories/music/musicHeader.test.ts
          - src/features/memories/components/MemoryDetail.rights.test.ts
          - src/components/app/AppShell.footerBar.test.ts
          - src/core/applications/registry.test.ts
          - src/features/memories/music/musicEnding.test.ts
          - src/app/sessionEndingSteps.test.ts
  - id: deployment-configures-the-entries
    text: memories.music is active only while the deployment sets the music host and at least one service, each child only with its credential, an Apple token past its exp counting as unset; a malformed value refuses the boot; no switch brings an unconfigured entry back; the active entries carry the frame's https address and each credential on its own entry only; Compose routes the music host to the app only when set.
    coverage:
      backend:
        integration:
          - MusicSettingsTest.nothingConfiguredLeavesAllThreeOff
          - MusicSettingsTest.eachServiceIsOnWithItsOwnCredentialAndTheParentWithEither
          - MusicSettingsTest.anAppleTokenPastItsExpIsUnconfiguredFromThatMomentAndOneWithoutExpNever
          - MusicSettingsTest.aMalformedValueRefusesTheBootNamingItsVariable
          - CapabilityRegistryTest.aDeploymentEntryTheEnvironmentLeavesUnconfiguredIsNotActiveAndItsSwitchCannotBringItBack
          - MusicFrameSliceTest.theThreeEntriesAreServedWithTheirValuesOnTheirOwnEntriesOnly
          - TraefikFileMusicRouteTest.theMusicHostIsRoutedToTheAppOnlyWhenSet
  - id: policies-follow-the-switch
    text: While memories.music is active at the instance level the app's CSP names the music origin in frame-src (replacing 'none'), its Permissions-Policy grants that origin encrypted-media and autoplay, and its COOP is same-origin-allow-popups; switched off, all three are as before and the entries leave the set; the privacy notice states the music exactly while it is on.
    coverage:
      backend:
        integration:
          - MusicFrameSliceTest.whileActiveTheAppMayFrameTheMusicHostAndItsPopupsKeepTheirOpener
          - MusicFrameSliceTest.switchedOffByTheServerOwnerThePoliciesAreAsBeforeAndTheEntriesLeaveTheSet
          - MusicFrameSliceTest.thePrivacyNoticeStatesTheMusicWhileItIsOnAndNotAfter
          - PrivacyNoticeSliceTest.theNoticeIsServedWithoutASessionAndTheReadWritesNothing
  - id: music-host-serves-the-frame-only
    text: The music host serves the frame's page and its Spotify callback under its own policy (scripts from itself and the two SDK hosts, no Trusted Types, framed only by the bootstrap domain and the tenants' domains, COOP unsafe-none) and the assets it loads, and answers the API, the app and every other path with a 404; no other host serves the frame's page.
    coverage:
      backend:
        integration:
          - MusicFrameSliceTest.theMusicHostServesTheFrameUnderItsOwnPolicyFramedOnlyByTheInstancesHosts
          - MusicFrameSliceTest.theMusicHostAnswersNoApiAndNoApp
          - MusicFrameSliceTest.noOtherHostServesTheFramesPage
  - id: export-and-rotation
    text: A download carries the node's music as its playlists and an import seals them into the new node's meta at birth, dropping an entry that is no playlist; a scope rotation carries the field unchanged under the node's new key.
    coverage:
      web:
        unit:
          - src/features/memories/exportImport.test.ts
          - src/core/node/rekey/rekeyScope.test.ts
gaps:
  stack: >-
    Lane L1's browser spec (`tests/e2e/tests/features/memories/memory-music.spec.ts`, written, not yet run) sets a
    playlist through the dialog and checks the header's links where the lane serves no music host; no lane signs in to a
    vendor, and none draws the bar's frame in a browser. The vendors' logo files are not added (inbox #857), so the frame's
    track display is proven by unit tests with a stand-in mark only. A
    sign-in and playback with real Spotify and Apple Music accounts, through the music frame on a TLS music host, needs
    vendor accounts and a registered app, and is owed (inbox #846).
