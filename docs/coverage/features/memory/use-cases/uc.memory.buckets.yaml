useCase: uc.memory.buckets
feature: memory
title: Buckets — group a Memory's media by who contributed it
# Built by cr-0113 (contracts → backend → web). A bucket = a per-uploader
# container within one Memory, the attribution axis orthogonal to Chapters: a real veyq_bucket table keyed by an
# opaque owner_key ("user:{id}" | "share:{shareIdentityId}"), a lazy virtual primary + one-level sub-buckets,
# names sealed under a field key derived from K_node, media linked via a nullable bucket_id + a denormalized created_by; reparent-on-delete. The
# curation authz was relaxed in cr-0123 (a member curates any owner-root's sub-buckets + moves media within one
# root — never a primary, never across owners). The web ships the "Beiträge" tab with per-tile selection + an
# explicit action bar (cr-0122). A camera filter is a later slice. A full live
# "Beiträge"-tab click-through is pending a session with the dev backend up.
acceptanceCriteria:
  - id: uploader-stamp-on-media
    text: Every uploaded medium carries an operator-visible uploader stamp — a member's created_by = owner_key "user:{id}" XOR a contributor's "share:{shareIdentityId}" — set at attach and returned by the per-node media list (ownerKey/bucketId), so a client can group. Attach is the only insert, so no medium lacks either (the list-time backfill for pre-cr0113 rows was deleted before V1, inbox #264).
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.uploadStampsOwnerKeyAndMaterializesPrimary]
      web:
        unit: [src/features/memories/media.buckets.test.ts]
  - id: derived-primary-buckets
    text: A Memory's buckets are materialized lazily via find-or-create on (node_id, owner_key) — one primary per uploader, virtual until that uploader has at least one medium. (Uniqueness holds for sequential resolves, which is what these tests pin; it is not enforced by a constraint — see ADR 0034 §4 + architecture §11.)
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.uploadStampsOwnerKeyAndMaterializesPrimary, MediaBucketsSliceTest.createSubBucketMoveThenDeleteReparents]
  - id: sub-bucket-endpoints
    text: Sub-buckets sit one level under a primary (parent must be primary), owner inherited, a sealed name (a field key derived from K_node); the backend exposes create/rename/delete/move endpoints; delete reparents the sub-bucket's media to the owner's primary and never deletes media, primaries are neither renameable nor deletable. Curation authz (cr-0123) — a scope member may create a sub under any primary root, rename/delete any sub (own or a contributor's), and move media WITHIN one owner-root, but never a primary and never across owners (a single distinct source owner_key is required, else 403).
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.createSubBucketMoveThenDeleteReparents, MediaBucketsSliceTest.renameSubBucketUpdatesSealedName, MediaBucketsSliceTest.memberMayManageAnotherRootsSubBucket, MediaBucketsSliceTest.memberCreatesSubUnderAnotherRootInheritingItsOwner, MediaBucketsSliceTest.createSubRejectsNonPrimaryParent, MediaBucketsSliceTest.crossOwnerMoveIsRejected, MediaBucketsSliceTest.primaryBucketNotRenameableNorDeletable, MediaBucketsSliceTest.aMetaEditOverlappingASubBucketDeleteKeepsTheReparent, MediaBucketsSliceTest.aMoveIntoASubBucketBeingDeletedIsRefused]
      web:
        unit: [src/features/memories/media.buckets.test.ts, src/features/memories/components/MemoryBuckets.test.ts]
  - id: contributions-tab-primary-grouping
    text: A "Beiträge" tab lists the Memory's uploaders by their primary bucket (with per-bucket counts); selecting one filters the existing MediaGrid + lightbox to that uploader. Bucket names are unsealed with K_node client-side (a contributor's sealed name, shown marked as a guest's - "Ben (guest)", inbox #433 - while a sub-bucket's name, a member's, is not; a member's by the display rule, see members-named-by-the-display-rule), an unsealable name falling back to a neutral placeholder. An explicit action bar (cr-0122) adds per-tile selection (checkbox top-left, 3-dot top-right), a select-all/deselect toggle, and visible Move / Delete (delete = a straight soft-delete to trash with a local undo bar); the bucket actions (upload / new sub / rename / delete) are buttons beside the picker, enabled per the cr-0123 curation authz.
    coverage:
      web:
        unit: [src/features/memories/media.buckets.test.ts, src/features/memories/components/MemoryBuckets.test.ts]
  - id: members-named-by-the-display-rule
    text: >-
      A member's bucket is named by the one display rule (ADR 0083 decision 9), read from core's people directory: the
      member's real name when it opens on this device, else the username; a user the scope does not list, or a directory
      that cannot be read, reads the neutral "Member". A link's guest is never drawn the tab — the guest's source carries
      no buckets door — so it reads no member's name and calls no authenticated client (ADR 0030 point 8).
    coverage:
      web:
        unit: [src/features/memories/components/MemoryBuckets.test.ts, src/features/memories/source.test.ts, src/features/memories/components/MemoryDetail.guest.test.ts]
  - id: move-beyond-one-request
    text: Moving more media than one request carries moves all of them — the selection goes out as consecutive requests inside the contract's `MoveMediaRequest.mediaIds` bound, which the server enforces. The slices are not atomic together; a failing one surfaces through the move dialog's error after the earlier ones have moved.
    coverage:
      web:
        unit: [src/features/memories/media.buckets.test.ts]
  - id: guest-names-for-members-only
    text: >-
      A guest's name reaches the Memory's members only, through their bucket list. No guest read of a public share
      (its resolve, its media read) serves a guest's sealed name, or any READ_WRITE identity — not even the reading link's own, including on a READ
      link that was once a READ_WRITE link. It serves a WRITE_ONLY identity as its wrapped key alone, which a reader
      needs to open that identity's media, and only that media names its identity. The naming form tells the
      guest who sees the name. A link plus a database dump still opens the names — the residual ADR 0030 point 8
      accepts.
    coverage:
      # Each negative carries a positive on the same predicate: the served identity set is EXACTLY the uploader's
      # (so an empty list cannot pass), the name's absence is asserted on that present identity, and the member
      # bucket list still serves both guests' names. Live, both sharing e2e suites read the raw media read and the
      # raw resolve past the generated client, which would drop an unknown field.
      backend:
        integration: [ShareGuestNamesSliceTest.aViewerLinkIsServedTheUploadersKeyButNoName, ShareGuestNamesSliceTest.aContributorLinkIsServedNoneOfItsOwnGuests, ShareGuestNamesSliceTest.aViewerLinkThatWasAContributorLinkKeepsNoGuest, ShareGuestNamesSliceTest.onlyAnUploadersMediaNamesItsIdentity, ShareGuestNamesSliceTest.theResolveServesNoMediaAndNoIdentities, ShareGuestNamesSliceTest.theMembersStillReadBothNames]
      web:
        unit: [src/views/ShareView.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts, src/features/memories/shareUploader.e2e.test.ts]
  - id: operator-blind-buckets
    text: Grouping and ownership run over the opaque owner_key + the bucket structure (node, parentage, is_primary, counts) the operator already relays; names are unsealed client-side and a wrong AAD context can never open one. The operator never learns a cleartext bucket/uploader name nor any content, and a personal Memory with no share exposes only the account owner's owner_key.
    coverage:
      # Blindness = grouping over an opaque owner_key ("user:{id}") + sealed names the operator only relays,
      # and a name openable ONLY under the right AAD. uploadStampsOwnerKey proves a personal Memory's lone
      # primary carries just the owner's owner_key (no sealed name); rename proves the sealed name is opaque
      # base64 echoed verbatim; the web test proves a wrong AAD context returns null (never a cleartext name).
      # (listBucketsByNonMemberIs404 was an authz-404 test — tangential to blindness — so it is dropped here.)
      backend:
        integration: [MediaBucketsSliceTest.uploadStampsOwnerKeyAndMaterializesPrimary, MediaBucketsSliceTest.renameSubBucketUpdatesSealedName]
      web:
        unit: [src/features/memories/media.buckets.test.ts]
  - id: contributors-grid-is-windowed
    text: >-
      The contributors' view is the same windowed grid: a bucket of thousands mounts about a window and announces it to
      the gallery's thumbnail pipeline; its select-all still selects every item of the bucket by id, and Space on a
      focused tile toggles its checkbox as a click does (ADR 0105 decisions 1, 2 and 5).
    coverage:
      web:
        unit: [src/features/memories/components/MemoryBuckets.test.ts]
    gaps:
      - surface: web
        reason: >-
          The real grid at 2,000 items in happy-dom, boxes given by hand. Not yet seen in a browser — the browser pass
          waits for the V1 heavy stage.
  - id: guest-named-above-the-node
    text: >-
      A link guest who uploads into a node below its link's root names itself under the ROOT's key (a folder link's
      guest uploading into a Memory below the folder, a Memory link's into a chapter), so a member opens that bucket's
      name with the node's key or an ancestor's, taken through the loaded tree's key chain (ADR 0080 decision 6).
    coverage:
      web:
        unit: [src/features/memories/media.buckets.test.ts, src/features/memories/components/MemoryBuckets.test.ts]
  - id: concurrent-organizing-finishes
    text: >-
      Members organizing one Memory at once — a sub-bucket created or deleted, media moved between buckets, a medium
      trashed — never deadlock: every media writer takes the bucket, then the media, then the node, so two such writes
      both finish (a forced interleaving per pair, each with a control).
    coverage:
      backend:
        integration:
          - MediaLockOrderRaceSliceTest.aSubBucketDeleteAndATrashOfItsMediumBothFinish
          - MediaLockOrderRaceSliceTest.aMoveIntoASubBucketAndThatBucketsDeleteBothFinish
          - MediaLockOrderRaceSliceTest.aMoveToThePrimaryLocksItBeforeTheNode
          - MediaLockOrderRaceSliceTest.aSubBucketDeleteLocksThePrimaryBeforeTheNode
          - MediaLockOrderRaceSliceTest.aSubBucketCreateThatWaitedForTheNodeRunsAgainWhenThePrimaryAppeared
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/field-seal.spec.ts`) drives `sub-bucket-endpoints`,
    `contributions-tab-primary-grouping`, `guest-names-for-members-only` in Chromium against the release candidate's two
    images, installed through `veyqctl` (ADR 0090), each test tagged with its criterion. A sub-bucket created under the
    member's own primary, and a contributing guest's name, read back in the Contributions picker after a reload and on a
    second device. Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`pipeline.yml` → `stack`) awaits
    the first CI run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On
    that run each file becomes a ref on the criteria its tests are tagged with, and this gap goes.
