useCase: uc.memory.banner
feature: memory
title: Memory banner — an image or a video above the Memory, shown whole on every screen
# Built by cr-memory-banner (ADR 0102): Memories' setMemoryBanner / removeMemoryBanner over core's attachment slots BANNER
# and BANNER_POSTER, the `banner` field of the node's sealed meta, the display above the header row with a sticky tab row,
# the dialog, export / import / copy. A video banner plays its original until the small playback copy
# (en.memory.playback-derivative, the client worker queue, inbox #23) exists. Since 2026-10-19
# (cr-cover-banner-upload-only-and-dedup) the banner is set only by an upload in its dialog (no gallery source, no
# description) and an upload equal to a gallery file shares its stored object, both ways for a video (ADR 0013 § 5).
# Since 2026-11-01 (owner, ADR 0102 amended) the banner is always shown whole in a 16:9 / 1:1 frame, blurred where it
# leaves room: the focal point and the fit / fill switch left the editor, and nothing is re-framed. The criterion id
# `frame-and-focal-point` is kept: the browser spec's tags name it.
acceptanceCriteria:
  - id: sealed-banner-in-node-meta
    text: A MEMORY or CHAPTER node's `wrappedMeta.banner` names the banner's attachments (`BANNER`, and `BANNER_POSTER` for a video) with its medium, a video's type, the SHA-256 of the file it was made from, frame (fill/fit) and focal point (0..1) - kept in the shape, never drawn, and written by this editor as `fit` around the centre - no description - sealed in the node-meta field; a reader takes owner and role from the node and the slot, never from the payload, and degrades a malformed value (the centre, `fill`, no digest, no banner) without a throw; an older banner's `origin` and `alt` are read by nobody and kept by every writer. The worst case - 100 participants, an uploaded cover, a range date, the place name at its bound of 200 code points in 4-byte characters, a video banner with poster, type and digest - seals under the meta's 8192 characters. The server never sees the focal point or the frame.
    coverage:
      web:
        unit:
          - src/features/memories/banner/bannerModel.test.ts
          - src/features/memories/banner/useMemoryBanner.test.ts
  - id: one-write-for-slots-and-meta
    text: setMemoryBanner attaches the banner's upload(s) - or, per slot, a shared row on an object the node stores - and compare-and-sets the meta in one transaction — both slots are compared first and a stale slot (`banner_stale`) or a stale meta (`stale_revision`) writes nothing and leaves the uploads open; a replaced blob (and a poster an image replaces) is freed with a reclaim record in the same write; removeMemoryBanner frees both slots and writes the meta without the banner, idempotently.
    coverage:
      backend:
        integration:
          - MemoryBannerSliceTest.eachWriteHoldsTheSlotsItNamesAndFreesWhatItReplacesWithoutTouchingTheGallery
          - MemoryBannerSliceTest.aChaptersVideoBannerGoesWithItsPosterOnRemoval
          - MemoryBannerSliceTest.aStaleMetaAttachesNothingAndTheSameUploadsLandOnTheFreshRevision
          - MemoryBannerSliceTest.aStaleSlotWritesNothingAndNamesWhatTheSlotsHold
      web:
        unit:
          - src/features/memories/banner/bannerWrite.test.ts
          - src/features/memories/banner/useBannerEditor.test.ts
          - src/features/memories/banner/BannerDialog.test.ts
  - id: members-only-write-guests-see
    text: Only a member who may write the scope sets or removes a banner; no link role has a banner operation or may upload in a banner role; a READ or READ_WRITE guest sees the banner exactly as a member does, read from the node's own attachment through the share's gated route.
    coverage:
      backend:
        integration:
          - MemoryBannerSliceTest.onlyAMemberSetsABannerOnAMemoryWithUploadsStartedForItsSlots
          - ShareContributorSliceTest.guestUploadInARoleMemoriesTakesFromNoGuestIs400
          - ShareUploaderSliceTest.uploaderNamesUploadsAttachesStampedAndDeletesOwn
          - OperatorBlindProbeTest.everyContractOperationIsProbedOrExcludedWithAReason
      web:
        unit:
          - src/features/memories/rights.test.ts
          - src/features/memories/source.test.ts
          - src/features/memories/components/MemoryDetail.rights.test.ts
          - src/features/memories/components/MemoryDetail.guest.test.ts
  - id: not-in-the-gallery
    text: A banner's bytes never appear as a medium — not in the media list, the item count, the live-update revision or the media trash — whether uploaded or sharing a gallery medium's stored object, and an upload started in a banner role is never completed as a medium's blob.
    coverage:
      backend:
        integration:
          - MemoryBannerSliceTest.eachWriteHoldsTheSlotsItNamesAndFreesWhatItReplacesWithoutTouchingTheGallery
          - MemoryBlobRolesSliceTest.aBannerUploadIsNeverAMediumsOriginal
          - MemoryBlobRolesSliceTest.theCompletionAttachesADerivativeOnlyInARoleMemoriesNamesOne
  - id: upload-shares-an-equal-gallery-file
    text: The banner is set only by a file picked in its dialog - the lightbox offers no "Use as banner" and the dialog no gallery source. A picked file equal to the original of a gallery medium (the same sealed size, then the same SHA-256 from its `blob-meta`) is not stored again - an image banner is a row on the medium's PREVIEW object, a video banner on its ORIGINAL with the medium's PREVIEW as its poster (a medium without one - the poster decoded and uploaded); a gallery upload equal to the video banner is a medium whose ORIGINAL is a row on the `BANNER` object, its posters derived as always. Another content or a medium without a digest uploads as before. The object goes only with the last row naming it; deleting the gallery medium that is the banner's picture (its digest is the banner's) asks first, says the banner stays and offers to remove it too (ADR 0013 § 5, ADR 0102 decisions 3 and 7). A content block on the medium refuses the banner rows on its object too, and keeps refusing them after the medium is erased (it hangs on the object) until the banner's removal ends it or a moderator lifts it (ADR 0093 § 6).
    coverage:
      backend:
        integration: [SharedBlobSliceTest.aVideoBannerSharesTheMediumsOriginalAndPreviewAndKeepsThemPastIt, SharedBlobSliceTest.aGalleryOriginalSharesTheVideoBannersObject, SharedBlobSliceTest.theSweepSkipsARecordedKeyThatABlobRowStillNames, SharedBlobSliceTest.theScopesErasureRecordsAnObjectOnce, SharedBlobSliceTest.eachArmAnswersHoldsAsItsSetDoes, SharedBlobSliceTest.aBlockOnAnErasedMediumHangsOnTheBannersObjectUntilItsLastRowGoes, SharedBlobSliceTest.aLiftedMeasureServesTheBannerAgain]
      web:
        unit:
          - src/features/memories/banner/useBannerEditor.test.ts
          - src/features/memories/banner/bannerWrite.test.ts
          - src/features/memories/banner/BannerDialog.test.ts
          - src/features/memories/components/MemoryDetail.banner.test.ts
          - src/features/memories/components/MediaLightbox.test.ts
          - src/features/memories/media.test.ts
  - id: lifecycle-follows-the-memory
    text: The banner's attachments are trashed and restored with the Memory, freed by its purge, by the scope's erasure (account erasure, tenant deletion), counted in the tenant's quota, copied and pinned by a hold on a report of the Memory, and exported, imported and copied with the Memory.
    coverage:
      backend:
        integration:
          - MemoryBannerSliceTest.theBannerGoesToTheTrashComesBackAndIsFreedByThePurge
          - MemoryBannerSliceTest.theScopesErasureFreesTheBanner
          - MemoryBannerSliceTest.aReportOfTheMemoryHoldsTheBanner
          - TenantStorageQuotaMemoriesSliceTest.aBannerCounts
      web:
        unit:
          - src/features/memories/exportImport.test.ts
  - id: frame-and-focal-point
    text: The banner's frame is the screen's - 16:9 on a wide column and 1:1 on a narrow one (720 px and below), at most 60 % of the viewport's height - and the medium is always shown whole (contained, never cropped), the same decrypted picture (a video's poster) enlarged and blurred behind it where it leaves the frame, drawn by the client and stored nowhere; a stored `frame` and focal point (fill around a point) are ignored for display; the dialog shows the picked file in both frames (wide 16:9, phone 1:1), has no focal point and no fit / fill switch, and saves only a newly picked file (no re-frame), writing `fit` around the centre; the banner scrolls away and the tab row sticks below the shell's top bar (at the top on a share page).
    coverage:
      web:
        unit:
          - src/features/memories/banner/MemoryBanner.style.test.ts
          - src/features/memories/banner/MemoryBanner.test.ts
          - src/features/memories/banner/BannerDialog.test.ts
          - src/features/memories/banner/bannerModel.test.ts
          - src/features/memories/banner/useBannerEditor.test.ts
    gaps:
      - surface: web
        reason: >-
          A DOM test does not lay out CSS: the frame's rules (16:9, the 1:1 container query, 60vh, `object-fit: contain`)
          are pinned at the source (`MemoryBanner.style.test.ts`), the drawn backdrop, an ignored stored fill and point, and
          the dialog's previews without a point or a switch are asserted in the DOM; the rendered frame's aspect and the
          row's offset under the top bar are the browser pass's (`tests/e2e/tests/features/memories/memory-banner.spec.ts`),
          written, not run.
  - id: video-poster-no-autoplay
    text: A video banner shows its poster and a play button, never plays on its own (no video element and no read of the video before the click), and on a click plays the banner's own attachment through the media service worker (decrypted whole where there is none), never the gallery's original; a video has no length limit, and a picked video of which this browser cannot decode a frame is refused for a banner with a message.
    coverage:
      web:
        unit:
          - src/features/memories/banner/MemoryBanner.test.ts
          - src/features/memories/banner/useMemoryBanner.test.ts
          - src/features/memories/banner/BannerDialog.test.ts
gaps:
  stack: >-
    Lane L1's browser pass (`tests/e2e/tests/features/memories/memory-banner.spec.ts`: an uploaded landscape image shown whole at a wide and a
    phone width (16:9, then 1:1) with the tab row stuck under the top bar, a portrait photo shown whole with blurred sides
    and no re-frame offered, a video uploaded equal to the
    gallery's as the banner with no play before the click, the same Memory through a READ link, the removal, the console
    free of errors) is green in local runs of the full lane (the V1 heavy stage); ADR 0040 admits `stack` refs only once
    a CI run's log shows the suite executed (no remote yet).
