useCase: uc.memory.browse
feature: memory
title: Browse & organize the Memory tree (shell)
acceptanceCriteria:
  - id: open-personal-scope
    text: After unlock the client opens (auto-births if absent) the personal scope → the scope content key K_SC.
    coverage:
      backend: { integration: [ScopesSliceTest.createPersonalScopeThenListReturnsBoth] }
      web: { unit: [src/features/spaces/scopes.test.ts] }
  - id: list-and-decrypt-tree
    text: The whole tree is listed as opaque rows and names are decrypted on device, each under its parent's key (K_SC at the scope root), top-down in one pass; the level is assembled client-side.
    coverage:
      backend: { integration: [NodesSliceTest.createTreeThenList] }
      web: { unit: [src/core/node/tree.test.ts, src/core/node/browse.test.ts] }
  - id: client-side-breadcrumb
    text: The breadcrumb + current level are derived client-side from the local tree (the blind server computes no navigation).
    coverage:
      web: { unit: [src/core/node/browse.test.ts, src/core/node/location.test.ts] }
  - id: view-modes
    text: The current level is shown via one app-wide, persisted display toggle — grid (cards, default) / list / map. In grid and list the level's folders and its contents are two groups, each its own list, headed "Folders" / "Contents" (each an `h2` naming its section) only where both have something under the shown tab; map ("Karte", browse-only, cr-0071) plots the current folder's subtree of located Memories/Chapters as clickable pins from each node's sealed `location` (unsealed on device from listNodes, no locations API, behind the ADR 0018 tiles opt-in), a pin click opening that Memory. The preference persists across surfaces (localStorage), one per signed-in account and one for the share-guest pages, never one for the whole browser (inbox #408).
    coverage:
      web:
        unit:
          - src/shared/state/useViewMode.test.ts
          - src/core/node/ViewModeToggle.test.ts
          - src/features/memories/levelRows.test.ts
          - src/core/node/LevelView.test.ts
          - src/features/memories/components/SpaceMap.test.ts
  - id: row-details
    text: A row or tile shows, under the name, the kind and the details its application supplies through the row (`LevelRow.details`) - a Memory's date and place from its unsealed node meta (locale-formatted, each left out when the Memory has none, never a placeholder), a file's size and modified time (human-readable units, EN and DE; the modified time left out when the blob carries none), a drop box's people count - the same for a share guest, as real text in reading order; a list row's visual is the compact header's 16:9 thumbnail (4 x 2.25 rem), a folder's grid tile is compact and every other grid tile a card with the list's surface, frame and radius, its 16:9 cover flush at the top (columns from 210 px), tokens only, no horizontal overflow at phone width.
    coverage:
      web:
        unit:
          - src/core/node/levelRow.test.ts
          - src/core/node/components/LevelRowItem.test.ts
          - src/core/node/levelRowStyle.test.ts
          - src/features/memories/memoryRowDetails.test.ts
          - src/features/memories/levelRows.test.ts
          - src/features/memories/levelRows.guest.test.ts
          - src/features/depot/levelRows.test.ts
          - src/shared/formatBytes.test.ts
  - id: application-tabs
    text: Where the level offers two or more application tabs, a tab bar `All | <one tab per application>` filters the current folder's level (its folders, then every other node by name, whatever its kind) to one application's nodes (sub-folders stay in every tab, no subtree search; a tab is offered where its kinds have a node or the viewer may add one); the selection is a persisted setting per signed-in account (and one for the share-guest pages), shown as `All` without being overwritten where the level lacks that tab; a share guest gets the same bar (inbox #348).
    coverage:
      web:
        unit:
          - src/core/node/levelTabs.test.ts
          - src/shared/state/useLevelTab.test.ts
          - src/core/node/LevelView.tabs.test.ts
          - src/core/applications/registry.test.ts
  - id: level-live-refresh
    text: An open folder level — and an open drop box's page, whose guests' folders and their files are the tree (owner decision 2026-10-17; no other opened node's page) — (member and share guest) re-reads itself about every 5 s while its tab is visible — jittered, backing off on errors, at once on visibility/focus, nothing while hidden or after unmount, paused while a dialog is open — and shows what others changed without a reload; a read that began before a write's own re-read is dropped, an unchanged read leaves the page alone, and Depot re-reads its blob listing when the scope moved (inbox #408). The read is conditional (ADR 0081) — the scope's tree revision as the member listing's ETag, bumped in the transaction of every node create, rename, move, trash, restore, purge and every blob attached or removed; a digest of what the link serves as the guest's, never that revision — so an idle level is a 304 that does no work, and a guest whose link was revoked sees the unavailable state.
    coverage:
      backend:
        integration:
          - TreeRevisionCoreSliceTest.anUnchangedScopeAnswers304WithNoBodyAndAChangedOneA200WithTheNewTag
          - TreeRevisionCoreSliceTest.createMovesItOnce
          - TreeRevisionCoreSliceTest.aRenameMovesIt
          - TreeRevisionCoreSliceTest.aMoveMovesIt
          - TreeRevisionCoreSliceTest.aMetaWriteMovesIt
          - TreeRevisionCoreSliceTest.aTrashMovesIt
          - TreeRevisionCoreSliceTest.aRestoreMovesIt
          - TreeRevisionCoreSliceTest.thePurgeOfAnExpiredSubtreeMovesIt
          - TreeRevisionCoreSliceTest.aFirstAttachAReplaceAndADetachEachMoveIt
          - TreeRevisionCoreSliceTest.aGuestsCreateAndPlacementMoveIt
          - TreeRevisionCoreSliceTest.aRefusedWriteMovesNothing
          - TreeRevisionCoreSliceTest.aNonMemberIs404WhateverItEchoes
          - TreeRevisionCoreSliceTest.aChangeOutsideTheSharedSubtreeDoesNotMoveAGuestsTag
          - TreeRevisionCoreSliceTest.aRevokedOrUnknownLinkIs404ForAPollingGuest
          - TreeRevisionRaceCoreSliceTest.createsRacingForAScopesFirstBumpAllCount
          - DepotTreeRevisionSliceTest.aMembersFirstUploadAReplaceAndAFileDeleteEachMoveIt
          - DepotTreeRevisionSliceTest.aGuestsIdentityFolderAndItsUploadMoveIt
          - DepotTreeRevisionSliceTest.anUploadMovesAGuestsResolveTagThoughNoNodeRowChanged
          - TreeRevisionBumpsTest.everyListedWriterBumps
      web:
        unit:
          - src/shared/state/livePoller.test.ts
          - src/views/SpaceView.live.test.ts
          - src/views/ShareView.live.test.ts
          - src/features/depot/levelRows.test.ts
          - src/core/node/treeConditional.wire.test.ts
          - src/core/sharing/pollPublicShare.wire.test.ts
  - id: create-folder-and-memory
    text: Creating a folder/Memory seals the name + blinded slug under the parent's key (K_SC at the scope root) and POSTs only ciphertext (every node births its random key, wrapped under the same parent key).
    coverage:
      backend: { integration: [NodesSliceTest.createTreeThenList] }
      web: { unit: [src/core/node/tree.test.ts, src/core/node/LevelView.test.ts, src/features/memories/levelRows.test.ts, src/core/node/FolderNameDialog.test.ts, src/core/node/FolderNameDialog.slug.test.ts, src/features/memories/components/MemoryNodeDialog.test.ts] }
  - id: every-node-is-born-with-a-key
    text: Every node, a FOLDER included, is created with its own content key wrapped under its parent's key (ADR 0080 decision 1) — a create without the wrap, or with an empty one, is 400 and stores nothing, and the node table refuses a row without a key whichever path writes it.
    coverage:
      backend: { integration: [NodesCoreSliceTest.aFolderWithoutAWrapIs400AndNothingIsStored, NodesCoreSliceTest.theNodeTableRefusesARowWithoutAContentKey] }
  - id: rename-and-delete-subtree
    text: Rename re-seals the name + recomputes the slug; delete takes the node and its whole subtree to the space's trash (uc.memory.delete-node).
    coverage:
      backend: { integration: [NodesSliceTest.renameThenDeleteSubtree] }
      web: { unit: [src/core/node/tree.test.ts] }
  - id: slug-collision-rejected
    text: A name whose blinded slug already exists under the parent is rejected (UNIQUE(parentId, slugToken), 409) — deterministic slug.
    coverage:
      backend: { integration: [NodesCoreSliceTest.slugCollisionPerParentIs409] }
      web: { unit: [src/shared/naming.test.ts] }
  - id: illegal-structure-rejected
    text: A CHAPTER cannot live at a folder level (it belongs inside a Memory); the server rejects it (422).
    coverage:
      backend: { integration: [NodesSliceTest.chapterAtRootIs422] }
  - id: authz-boundary
    text: A non-member of the scope gets 404; an unauthenticated caller gets a generic 401.
    coverage:
      backend: { integration: [NodesCoreSliceTest.nonMemberIs404, NodesCoreSliceTest.unauthenticatedIs401] }
  - id: delete-scoped-to-node
    text: Deleting a node is bound to the node's own scope — a member of a different scope cannot delete it by addressing it through their own scope; the cross-scope delete is refused (404, non-enumerable) and the foreign node survives.
    coverage:
      backend: { integration: [NodesSliceTest.crossScopeDeleteIsRejected] }
  - id: select-several-nodes
    text: "Select in the level's toolbar (not in an application's own presentation, and only where some node of the level allows an action) puts a labelled checkbox on every row - the row's own click still opens it - and a bar with All / None, an announced count and Move to… / Delete. The selection is the level's: a tab switch keeps it (All / None act on the tab shown, the count says how many of the selected the tab hides), leaving the mode or the folder clears it, a node that leaves the level drops out. What a node allows is its application's rights answer per node (a folder's core's), an action is enabled where a selected node allows it and says \"n of m\" for the rest; a READ_WRITE guest is offered Move and no Delete (inbox #421)."
    coverage:
      web:
        unit:
          - src/core/node/selection.test.ts
          - src/core/node/LevelView.select.test.ts
          - src/core/node/components/LevelRowItem.test.ts
          - src/features/depot/levelRows.test.ts
          - src/features/depot/levelRows.guest.test.ts
          - src/features/memories/levelRows.test.ts
          - src/features/memories/levelRows.guest.test.ts
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/scenarios/memory-roundtrip.spec.ts`, `tests/e2e/tests/features/account/field-seal.spec.ts`,
    `tests/e2e/tests/features/depot/guest-take-back.spec.ts`, `tests/e2e/tests/features/depot/depot-live.spec.ts`,
    `tests/e2e/tests/features/memories/memories-styles.spec.ts`) drives
    `create-folder-and-memory`, `rename-and-delete-subtree`, `level-live-refresh`, `view-modes` in
    Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion. The rename is read back after a reload and on a second device; the delete half is not driven there.
    An open folder level shows a guest's upload, and an open link page the owner's, without a reload (a marker on the
    document survives), in separate browser contexts; the pause of a tab in the background is not driven (Playwright keeps every
    page visible). `view-modes` is driven as far as a Memory's chapters grid and its grid/list switch, read as computed
    styles in light and dark (inbox #513 moved those rules into Memories' own stylesheet).
    Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`pipeline.yml` → `stack`) awaits the first CI
    run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that run each
    file becomes a ref on the criteria its tests are tagged with, and this gap goes.
