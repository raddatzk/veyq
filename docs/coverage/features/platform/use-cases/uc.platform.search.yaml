useCase: uc.platform.search
feature: platform
title: Search every space for a node, a Memory or a photo
acceptanceCriteria:
  - id: every-space-of-the-tenant
    text: The first focus of the search field opens the tree of every space the member belongs to in this tenant (personal, the tenant's, every group) without changing the active space; each tree's keys are zeroed once its documents are built, and a later focus revalidates each tree by its ETag (a 304 keeps the documents, a moved tree is opened again, a tree that no longer fetches or opens loses its documents).
    coverage:
      web:
        unit: [src/core/search/searchIndex.test.ts, src/core/node/keyResolver.test.ts]
  - id: chips-and-text
    text: A token that reads as a year (a Memory matches when its date range overlaps it, a photo when captured in it), a month's name (three letters at least, in the UI's language or in English) followed by a year as that month (a Memory matches when its date range overlaps the month, a photo when captured in it, an undated Memory never; a month's name alone offers nothing), a member's name, a place a document carries, a space's name or a kind's word is offered as a chip; a document matches when it satisfies every chip and the remaining text matches its name or place, ignoring case and diacritics. The chip suggestions stand under a heading of their own (Filter by), above the result groups; the first entry of the list is highlighted, a suggestion or a result, also right after a chip was chosen, and Enter takes it (a suggestion becomes a chip, a result opens); once the member moves the highlight (arrow keys or pointer) it stays on that entry while they type on, as long as it is listed; when it drops out the first entry of its group is highlighted (the list's first when that group is gone), and it stays remembered - listed again, it is highlighted again - until a new move replaces it or choosing an entry or closing the list forgets it; a field without results (the people pickers) keeps Reka's own highlight. The part of a result's name the text matched is drawn bold, found in the folded name and mapped back over the name's own characters ("Straße" for "strasse", "Café" for "cafe"), as text nodes and a strong element, never as markup from a string. While the text only grows under the same chips and documents, the previous matches are narrowed instead of every document scanned.
    coverage:
      web:
        unit: [src/core/search/query.test.ts, src/core/search/SearchField.test.ts, src/shared/ui/VeyqTagsInput.test.ts, src/shared/text/fold.test.ts, src/features/memories/search.test.ts]
  - id: grouped-by-context
    text: Results are grouped by the open node (headed by its name, when a node's page is open - what it contributed and the nodes below it), In this space, Other spaces, ranked only within a group (an exact or prefix name match above a match inside a word, a name above a place) and only as far as it is shown (its first results selected, its count exact for "show more"); an empty group is not shown.
    coverage:
      web:
        unit: [src/core/search/groups.test.ts, src/core/search/SearchField.test.ts]
  - id: memories-contributes-through-the-registry
    text: Memories contributes a Memory's date range, place and participants, every photo and video of every space (its scopeDocuments hook) and the photos and videos of the open Memory's opened listing (capture time, place) through the registry; core imports no application.
    coverage:
      web:
        unit: [src/features/memories/search.test.ts, src/features/memories/components/MemoryDetail.search.test.ts, src/core/search/contribution.test.ts]
  - id: photos-of-every-space
    text: Every live photo and video of every space is a document with its original's name, its capture time and its place, read from the space's media listing (listScopeMedia - every live medium on a live node of the scope, in pages by id, an ETag from the tree revision, the live nodes' item revisions and the content blocks; a 304 keeps the documents and opens nothing) and opened per node under the node's key while the walk holds it, every node key zeroed once the application's hook returned; a medium at an unchanged revision is kept unopened, a blocked medium is no document, and the open Memory's own document of a medium replaces the listing's; a photo goes where its Memory goes (the open node's group, In this space, Other spaces), its Memory's path and day in its second line.
    coverage:
      web:
        unit: [src/core/search/searchIndex.test.ts, src/features/memories/search.scope.test.ts, src/core/search/SearchField.test.ts, src/core/search/groups.test.ts, src/features/memories/components/MemoryDetail.search.test.ts]
      backend:
        integration:
          - ScopeMediaListSliceTest.pagesByIdAcrossTheScopesNodesEveryMediumOnce
          - ScopeMediaListSliceTest.aTrashedNodesMediaATrashedMediumAndAnotherScopesMediaAreNeverListed
          - ScopeMediaListSliceTest.aNonMemberIsTheScopes404
          - ScopeMediaListSliceTest.anUnchangedScopeIsA304AndAnUploadATrashANodeTrashAndABlockEachMoveTheTag
          - ScopeMediaListSliceTest.aBlockedMediumIsKeptAndMarkedAsInTheNodesListing
          - ScopeMediaListSliceTest.aPageOfOneMediumAndOfSixtyAcrossNodesIssueTheSameStatementsAndAnIdleReadReadsNoPage
          - ShareUploaderSliceTest.everyReaderOfTheMemoryIsServedWhatOpensAnUpload
  - id: open-a-result
    text: Choosing a result opens it where it lives - a node in its space (switching the active space when it lies in another), a photo of the open Memory in its lightbox, a photo of another Memory by opening that Memory (in its space), which then opens the photo in its lightbox once its gallery holds it.
    coverage:
      web:
        unit: [src/core/search/SearchField.test.ts, src/features/memories/components/MemoryDetail.search.test.ts]
  - id: people-are-results
    text: Every member of this tenant is a result in a People group after the spaces' groups, named as the directory names them and found by that name or by their ~username, from the roster the client already read (dropped at sign-out); choosing one opens their profile page, while the same word still offers them as a person chip; with any chip set, the People group is not shown.
    coverage:
      web:
        unit: [src/core/search/SearchField.test.ts, src/core/search/groups.test.ts, src/core/search/query.test.ts]
  - id: settings-are-the-rails-sections
    text: The settings sections are results in a Settings group after People, exactly those the settings rail offers this member now - one list with one set of gates, read by both (an owner-only, moderator-only or capability-gated section the rail hides is never a result; none while a gate's answer is out); a section is found by its label and by a few words of its own kept in its entry of that list, matched from a word's start only ("E-Mail" lists the mail section for an owner and nothing for a member); the field reads the list's answers once, on its first focus, and again only where they move (another tenant's role, a group the index lists that the answers do not know); choosing one opens it on the settings page with the active space kept; with any chip set, the Settings group is not shown.
    coverage:
      web:
        unit: [src/features/settings/sections.test.ts, src/core/search/SearchField.test.ts, src/core/search/groups.test.ts, src/views/SettingsHubView.test.ts]
  - id: a-screen-reader-drives-it
    text: The field is a combobox a screen reader drives (role combobox, its expanded state, the listbox it controls); a polite live region announces the number of results as it changes and a chip added or removed; each result group is named by its heading (its aria-labelledby resolves to the heading's text).
    coverage:
      web:
        unit: [src/core/search/SearchField.test.ts]
  - id: every-kind-has-a-word
    text: Every registered kind has a kind word, so a kind chip reaches it - Memories' Memory and Chapter, Depot's file and drop box, Expenses' Pot, and core's folder and bookmark (its word in core's catalog, as the kind is core's).
    coverage:
      web:
        unit: [src/applications.test.ts, src/core/search/SearchField.test.ts]
  - id: nothing-leaves-or-persists
    text: No query, document or result is sent to the server or written to IndexedDB, localStorage, sessionStorage or Cache Storage; the one read the search adds (a space's media listing) carries nothing of the query; a share view has no search field.
    coverage:
      web:
        unit: [src/core/search/searchIndex.test.ts, src/components/app/AppShell.search.test.ts, src/core/search/contribution.test.ts]
