useCase: uc.platform.search
feature: platform
title: Search every space for a node, a Memory or a photo of the open Memory
acceptanceCriteria:
  - id: every-space-of-the-tenant
    text: The first focus of the search field opens the tree of every space the member belongs to in this tenant (personal, the tenant's, every group) without changing the active space; each tree's keys are zeroed once its documents are built, and a later focus revalidates each tree by its ETag (a 304 keeps the documents, a moved tree is opened again, a tree that no longer fetches or opens loses its documents).
    coverage:
      web:
        unit: [src/core/search/searchIndex.test.ts, src/core/node/keyResolver.test.ts]
  - id: chips-and-text
    text: A token that reads as a year (a Memory matches when its date range overlaps it, a photo when captured in it), a member's name, a place a document carries, a space's name or a kind's word is offered as a chip; a document matches when it satisfies every chip and the remaining text matches its name or place, ignoring case and diacritics.
    coverage:
      web:
        unit: [src/core/search/query.test.ts, src/core/search/SearchField.test.ts, src/shared/text/fold.test.ts]
  - id: grouped-by-context
    text: Results are grouped by the open node (headed by its name, when a node's page is open - what it contributed and the nodes below it), In this space, Other spaces, ranked only within a group (an exact or prefix name match above a match inside a word, a name above a place); an empty group is not shown.
    coverage:
      web:
        unit: [src/core/search/groups.test.ts, src/core/search/SearchField.test.ts]
  - id: memories-contributes-through-the-registry
    text: Memories contributes a Memory's date range, place and participants and the photos and videos of the open Memory's opened listing (capture time, place) through the registry; core imports no application.
    coverage:
      web:
        unit: [src/features/memories/search.test.ts, src/features/memories/components/MemoryDetail.search.test.ts, src/core/search/contribution.test.ts]
  - id: open-a-result
    text: Choosing a result opens it where it lives - a node in its space (switching the active space when it lies in another), a photo in the open Memory's lightbox.
    coverage:
      web:
        unit: [src/core/search/SearchField.test.ts, src/features/memories/components/MemoryDetail.search.test.ts]
  - id: people-are-results
    text: Every member of this tenant is a result in a People group after the spaces' groups, named as the directory names them and found by that name or by their ~username, from the roster the client already read (dropped at sign-out); choosing one opens their profile page, while the same word still offers them as a person chip; with any chip set, the People group is not shown.
    coverage:
      web:
        unit: [src/core/search/SearchField.test.ts, src/core/search/groups.test.ts, src/core/search/query.test.ts]
  - id: settings-are-the-rails-sections
    text: The settings sections are results in a Settings group after People, exactly those the settings rail offers this member now - one list with one set of gates, read by both (an owner-only, moderator-only or capability-gated section the rail hides is never a result; none while a gate's answer is out); choosing one opens it on the settings page with the active space kept; with any chip set, the Settings group is not shown.
    coverage:
      web:
        unit: [src/features/settings/sections.test.ts, src/core/search/SearchField.test.ts, src/core/search/groups.test.ts, src/views/SettingsHubView.test.ts]
  - id: every-kind-has-a-word
    text: Every application's kind and the folder has a kind word, so a kind chip reaches it - Memories' Memory and Chapter, Depot's file and drop box, Expenses' Pot.
    coverage:
      web:
        unit: [src/applications.test.ts, src/core/search/SearchField.test.ts]
  - id: nothing-leaves-or-persists
    text: No query, document or result is sent to the server or written to IndexedDB, localStorage, sessionStorage or Cache Storage; no endpoint is added; a share view has no search field.
    coverage:
      web:
        unit: [src/core/search/searchIndex.test.ts, src/components/app/AppShell.search.test.ts, src/core/search/contribution.test.ts]
gaps:
  backend: "No backend part: search runs in the client over trees and listings the backend already serves (ADR 0125 decision 1); no endpoint is added."
