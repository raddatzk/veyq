useCase: uc.platform.switch-application-off
feature: platform
title: An application switched off is read-only
# Built 2026-10-24 (owner: an application off is a reversible read-only window; ADR 0079 decision 8, ADR 0088 decision 5).
# The server's seam is core's ApplicationSwitch, asked by kind (NodeKindRules.applicationOf) and by name (each application's
# write handlers); the web's is the registry's applicationOf and MemberAccess.applicationsOff.
acceptanceCriteria:
  - id: each-application-is-an-entry
    text: "Every application the backend composes (memories, depot and expenses today) is an entry of the capability register of its own, switchable by the Server Owner for the instance and by a tenant owner for the tenant, with its title, purpose and whenOff text in EN and DE; its children are off with it, and off for the instance is off for every tenant."
    coverage:
      backend:
        unit: [CapabilityRegistryTest.anApplicationsOwnEntryIsAnAncestorOfItsChildrenAtBothLevels, CapabilityRegistryTest.theRegisterIsEveryCatalogEntryInCatalogOrderWithItsWords]
        integration: [ApplicationSwitchSweepTest.everyWriteOfEveryApplicationIsGatedOrExemptWithAReason, MemoriesSwitchedOffSliceTest.offForTheInstanceAndOnForTheTenantIsOff]
      web:
        unit: [src/features/platform/capabilities.test.ts, src/shared/state/useCapabilities.test.ts]
  - id: every-write-is-refused
    text: "With an application off, every write of it answers 422 capability_disabled - a node of its kinds created, renamed, moved or given a cover, an upload for one started or completed, a link rooted on one created, reactivated, re-issued or given a write role, a guest's write through any link - and a sweep derived from the generated APIs holds that no write operation of an application is left out."
    coverage:
      backend:
        integration: [ApplicationSwitchSweepTest.eachWriteIsRefusedWhileItsApplicationIsOffAndOnlyThen, MemoriesSwitchedOffSliceTest.offAMemoryIsNotRenamedNoMediumCompletesAndNoGuestUploads_onEachLands, MemoriesSwitchedOffSliceTest.offNoLinkIsMadeOnAMemoryButAFolderTakesOne, DepotSwitchedOffSliceTest.offAFileIsNotCompletedAndItsDownloadPresigns_onTheCompletionLands, DepotSwitchedOffSliceTest.offADropBoxGuestGetsNoFolder_onItDoes]
  - id: reads-downloads-and-removals-stay
    text: "With an application off, its nodes and records open, read and download for members and through the links that exist, and a member deletes one to the trash and restores it; restored, it is read-only like the rest. A member's own item marks (putItemFavorites) are still taken."
    coverage:
      backend:
        integration: [MemoriesSwitchedOffSliceTest.offWhatExistsListsDownloadsGoesToTheTrashAndBackTakesAHeartAndIsServedThroughItsLink, DepotSwitchedOffSliceTest.offAFileIsNotCompletedAndItsDownloadPresigns_onTheCompletionLands, ApplicationSwitchSweepTest.eachWriteIsRefusedWhileItsApplicationIsOffAndOnlyThen]
      web:
        unit: [src/features/memories/rights.test.ts, src/features/depot/rights.test.ts]
  - id: rekey-erasure-and-measures-run
    text: "With an application off, a rotation's re-key and the purge reach its nodes as always; an erasure and a moderation measure run their own paths, which never ask the switch."
    coverage:
      backend:
        integration: [MediaNodeRekeySliceTest.aRekeyLandsWhileMemoriesIsSwitchedOff, ApplicationSwitchSweepTest.eachWriteIsRefusedWhileItsApplicationIsOffAndOnlyThen]
  - id: the-client-removes-every-write
    text: "With an application off, a member's client offers none of its kinds to create, removes every write function from its nodes but the delete, offers no cover or copy of them, and shows one banner at the top of veyq that it is switched off here and what is there can still be opened and downloaded; an upload the server refuses for it (a guest's included) fails at once, with no retry, saying so."
    coverage:
      web:
        unit: [src/core/blob/applicationOff.test.ts, src/core/blob/queue.test.ts, src/features/memories/components/OptimisticTile.test.ts, src/features/memories/rights.test.ts, src/features/depot/rights.test.ts, src/views/LevelNewMenu.entries.test.ts, src/core/node/cover/rights.test.ts, src/core/export/copyActions.test.ts, src/core/applications/registry.test.ts, src/views/SpaceView.golden.test.ts]
  - id: expenses-off-is-read-only
    text: "With expenses off, a Pot's append is refused 422 capability_disabled for a member and a link guest alike, while its revisions list on both paths and a member deletes it to the trash; a member's erasure of a participant (a removal) and a rotation's re-key still land; the Pot page offers no new Pot, no entry, no person and no setting, and opens with what it holds."
    coverage:
      backend:
        integration: [PotSliceTest.offExpensesIsReadOnly_anAppendIsRefusedWhileTheListReadsAndThePotGoesToTheTrash, PotRekeySliceTest.aRekeyLandsWhileExpensesIsSwitchedOff, ApplicationSwitchSweepTest.everyWriteOfEveryApplicationIsGatedOrExemptWithAReason, ApplicationSwitchSweepTest.eachWriteIsRefusedWhileItsApplicationIsOffAndOnlyThen]
      web:
        unit: [src/features/expenses/rights.test.ts, src/features/expenses/register.test.ts, src/features/expenses/components/PotDetail.test.ts]
    gaps:
      - surface: backend
        reason: "The erasure is exempt from the switch by the sweep's stated reason (a removal); no slice test erases a participant while Expenses is off."
  - id: on-again-nothing-lost
    text: "Switched on again, every write is accepted and nothing stored was lost."
    coverage:
      backend:
        integration: [MemoriesSwitchedOffSliceTest.offAMemoryIsNotRenamedNoMediumCompletesAndNoGuestUploads_onEachLands, DepotSwitchedOffSliceTest.offADropBoxGuestGetsNoFolder_onItDoes]
gaps:
  stack: >-
    Lane L1's browser pass `tests/e2e/tests/features/platform/application-erasure.spec.ts` drives the-client-removes-every-write
    and reads-downloads-and-removals-stay on its way to the erasure: with Depot switched off by the tenant owner, the
    member's banner shows, the folder's New menu offers a folder and no upload, and the file downloads byte for byte.
    Green only in local runs of `scripts/run_stack_e2e.py`, and ADR 0040 admits `stack` refs only once a CI run's log
    shows the suite executed.
