useCase: uc.platform.export-import
feature: platform
title: Take a node and everything under it out as a file, and bring such a file back in
# ADR 0082: the client walks the tree with the member's keys and writes a store-only ZIP; an import is a sequence of ordinary
# node and blob writes. The one backend piece is the member's quota preflight, a yes/no under a rate limit.
acceptanceCriteria:
  - id: streaming-zip-with-zip64
    text: The archive is a store-only ZIP written and read as a stream, ZIP64 exactly where a field overflows, every entry checked by its CRC-32 and size; a half archive is aborted, never closed.
    coverage:
      web:
        unit: [src/core/export/zip.test.ts, src/core/blob/stream.test.ts]
  - id: archive-reads-as-the-tree
    text: A download (format version 2) unpacks as the tree - a directory per node that holds others, each file under its own name, a kind that is one file as that file - with every name made safe by core's archiveName (no separators, no dot names, no control or Windows-forbidden characters, no reserved device names, no trailing dot or space, bounded length, a case-insensitive clash numbered `Name (2)`), and the manifest at .veyq/manifest.json maps every node to its path and names each application with its content-schema version.
    coverage:
      web:
        unit: [src/core/export/archiveName.test.ts, src/core/export/subtree.test.ts]
  - id: both-layouts-and-both-inputs
    text: An archive written before the tree layout (version 1, data/<id>/) still imports, and a download and the same download unpacked into a directory (dropped or picked, names in either Unicode form) import to the same tree.
    coverage:
      web:
        unit: [src/core/export/importHardening.test.ts]
  - id: manifest-is-trusted-for-nothing
    text: Before anything is written the reader refuses, each with a reason the dialog shows, a manifest that is not the contract's shape (a kind checking its own content), one over a cap (node count, depth, a name or field over its contract maxLength - pinned to the schema), a path that is no safe name, leaves its node or reaches into .veyq/, a payload missing or not its declared size, and a ZIP whose structure does not hold (an offset outside the file, overlapping entries, a declared size that is not the actual one, a ZIP64 field out of range); every payload is checked against its SHA-256 while it streams, and a mismatch trashes what was created.
    coverage:
      web:
        unit: [src/core/export/importHardening.test.ts, src/core/export/subtree.test.ts, src/core/export/ImportSubtreeDialog.test.ts, src/features/memory/exportImport.test.ts]
  - id: unknown-and-newer-reported
    text: The dry run lists, per application, how many nodes this build cannot import and why - an application it does not have, or content newer than it reads; "Import the rest" creates exactly the rest and names what it left out, an archive with nothing importable offers only Cancel, and Cancel writes nothing (no request).
    coverage:
      web:
        unit: [src/core/export/importHardening.test.ts, src/core/export/ImportSubtreeDialog.test.ts, src/core/export/ImportSubtreeDialog.cancel.test.ts]
  - id: recognised-on-upload
    text: A ZIP picked for an upload or dropped, and a directory picked for "Upload folder…" or dropped that holds .veyq/manifest.json at its root, are recognised by their content and offered to a member who may create there as an import - a ZIP with "Upload as a file" beside it, a directory Import only, one import per pick or drop, the other files and directories uploaded at once; a guest gets the ordinary upload, a locked level too. The "New" menu has no import entry.
    coverage:
      web:
        unit: [src/core/node/LevelView.test.ts, src/features/depot/levelRows.test.ts, src/core/export/ImportSubtreeDialog.test.ts, src/views/LevelNewMenu.entries.test.ts]
  - id: upload-folder
    text: '"New -> Upload folder..." (a member and a READ_WRITE guest, never a reader, an identity folder or a pending deletion) uploads a directory that is no download as its tree - a FOLDER per directory and a FILE per file, every name through archiveName and its clash suffix and numbered further where a sibling''s slug holds it, the top folder numbered among the level''s siblings - after a member''s quota preflight for the tree''s bytes (a no writes nothing and says so, an unanswered question never blocks; a guest asks none); a folder that cannot be created is named and nothing below it sent, a file that fails is the queue''s per-file failure, and a guest''s directory - its .veyq/ included - is always this upload, never the import.'
    coverage:
      web:
        unit: [src/features/depot/uploadFolder.test.ts, src/features/depot/levelRows.test.ts, src/features/depot/levelRows.guest.test.ts, src/features/depot/capabilities.test.ts, src/core/node/LevelView.test.ts]
  - id: drop-box-as-plain-folders
    text: A drop box downloads as a directory with each guest's folder under the name the drop box shows it by (a repeated name numbered, equal names listed in that order), its content only what it was (files.drop-box), and imports as plain FOLDERs with its guests' folders and their files - no drop box, no drop key, no share - by the kind's own importsAsFolder; a drop box content carrying more is refused before anything is written. Download is offered on it to a member and a READ or READ_WRITE guest of a link above it, never to its WRITE_ONLY guest.
    coverage:
      web:
        unit: [src/features/depot/dropBoxDownload.test.ts, src/core/export/subtree.test.ts, src/features/depot/components/DropBoxDetail.test.ts, src/features/depot/components/DropBoxDetail.guest.test.ts, src/features/depot/register.test.ts]
  - id: round-trip-by-hooks
    text: Core walks the tree and each kind supplies its content through its descriptor's hooks; a kind without a hook is left out and reported; an import recreates the tree under the importer with a free name (Name (2)), and a failure moves what it created to the trash and says N of M.
    coverage:
      web:
        unit: [src/core/export/subtree.test.ts, src/features/depot/exportImport.test.ts, src/features/memory/exportImport.test.ts]
  - id: memories-content
    text: A Memory and a chapter download their originals with capture time (a correction flagged), place, EXIF, date, cover and participants as names, and an import restores date and place at birth, corrections and place names afterwards, and the cover.
    coverage:
      web:
        unit: [src/features/memory/exportImport.test.ts]
  - id: download-for-members-and-readers
    text: Download is offered on a folder, a Memory, a chapter or a drop box to a member whose keys are open and to a READ or READ_WRITE share guest - who reads through the link and carries no names and no EXIF copy - never to a WRITE_ONLY guest; a file keeps its own download and gets no ZIP action; import only where a member may create.
    coverage:
      web:
        unit: [src/core/export/downloadActions.test.ts, src/core/sharing/ShareTreePage.test.ts, src/features/memory/components/FolderShareGuest.test.ts, src/features/depot/exportImport.test.ts, src/features/memory/exportImport.test.ts, src/core/node/LevelView.test.ts]
  - id: dialogs
    text: The download dialog asks nothing - no warning, no location option - walks at once, says what is in it and opens the save target first with the safe name and the known size; the import dialog shows what would be created before anything is written and says how far a failed import got.
    coverage:
      web:
        unit: [src/core/export/ExportSubtreeDialog.test.ts, src/core/export/ImportSubtreeDialog.test.ts]
  - id: quota-preflight-yes-no-rate-limited
    text: Any member of a tenant may ask whether N more bytes would still fit its quota and gets a yes or a no and nothing else, by the rule an upload start applies (usage with open sessions plus the bytes against the quota, exact at the boundary, no quota fits anything); a stranger gets 404 and spends nobody's budget, a member past the per-member or the tenant's allowance gets 429 with Retry-After, and a missing or negative count is refused. The import dialog asks once with the dry run's size, a no keeps Import shut, and an unanswerable question never blocks.
    coverage:
      backend:
        integration: [TenantStorageFitSliceTest.aMemberWhoIsNotTheOwnerGetsAYesOrANoAtTheExactQuotaBoundary, TenantStorageFitSliceTest.whatTheTenantAlreadyHoldsCountsOpenSessionsIncluded, TenantStorageFitSliceTest.aTenantWithoutAQuotaFitsAnything, TenantStorageFitSliceTest.theAnswerCarriesNothingButTheYesOrNo, TenantStorageFitSliceTest.aStrangerIsNotFoundAndSpendsNoTokenOfTheTenant, TenantStorageFitSliceTest.aMemberPastItsAllowanceIsThrottledAndAnotherMemberIsNot, TenantStorageFitSliceTest.theTenantsAggregateBoundTripsEvenWhenEachMemberIsWithinItsOwn, TenantStorageFitSliceTest.noTokenOrAMalformedByteCountIsRefusedBeforeAnyAnswer]
      web:
        unit: [src/features/tenant/tenantStorageFits.test.ts, src/core/export/ImportSubtreeDialog.test.ts]
