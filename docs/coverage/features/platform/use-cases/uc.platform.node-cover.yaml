useCase: uc.platform.node-cover
feature: platform
title: A cover for any node - an image the owner uploads, core's feature
# Built by inbox #411 (the owner's option 1b): the cover is the node's own blob in core's COVER attachment slot, written with the
# sealed meta that names it in ONE transaction (setNodeCover / removeNodeCover). Kinds opt in (NodeKindRules.takesCover on the
# server, the descriptor's `cover` on the web). Memories moved onto the same mechanism. A guest sees covers, never sets one.
# Follow-up (owner 2026-10-12, after trying covers in a browser): ONE dialog in core - choose, crop, re-crop, REMOVE - behind
# ONE 'Cover' action (header and row menu). Since 2026-10-19 a cover is set only by an upload there; the Memory says where an
# equal picture is stored (`cover.findStored`), and the cover then shares it (ADR 0013 § 5).
acceptanceCriteria:
  - id: set-replace-remove-leaves-nothing-behind
    text: A cover set, replaced and removed leaves no attachment, no blob, no upload session, the tenant's quota where it started, and a reclaim row for EACH blob's storage key; the sweep (the only deleter) then hands every chunk of both blobs to the store.
    coverage:
      backend:
        integration: [NodeCoverCoreSliceTest.setThenReplaceThenRemoveLeavesNoRowNoBlobNoSessionAndTheQuotaWhereItStarted]
  - id: kinds-opt-in-core-names-none
    text: Which kinds take a cover is each kind's own rule (FOLDER core's, a drop box Depot's, a Memory and a Chapter Memories', a Pot Expenses'; a file and an unknown kind take none), asked of the one rule that handles the kind; core names no application kind. A Pot's cover is the Pot's own blob in core's slot - no receipt, no revision of its ledger - and a switched-off Expenses takes none.
    coverage:
      backend:
        integration: [CoreAloneSliceTest.onlyAFolderTakesACoverWithCoreAlone, ModuleCompositionTest.everyKindThatTakesACoverIsOptedInByItsOwnRule, NodeCoverCoreSliceTest.aKindNoRuleOptedInTakesNoCover, NodeCoverDepotSliceTest.aFileTakesNoCoverAndAnUploadThatDoesNotFitTheDeclarationIsRefused, NodeCoverExpensesSliceTest.aPotTakesACoverThatIsNoReceiptAndNoRevision, NodeCoverExpensesSliceTest.aKindNoRuleOptsInTakesNoCover, NodeCoverExpensesSliceTest.aPotGetsNoCoverWhileExpensesIsOff]
      web:
        unit: [src/core/node/cover/rights.test.ts]
  - id: writers-only-fail-closed
    text: Only a member who may write the scope sets or removes a cover - never a reader, a guest of any role, a pending deletion, locked keys or a guest's identity folder; the server refuses a stranger, an anonymous caller, another tenant's member and another member's upload.
    coverage:
      backend:
        integration: [NodeCoverDepotSliceTest.aMemberWhoMayOnlyReadSetsNoCover, NodeCoverCoreSliceTest.aStrangerAnAnonymousCallerAndAnotherTenantsMemberReachNothing, NodeCoverCoreSliceTest.anotherMembersOpenUploadIsNotFound, NodeCoverCoreSliceTest.aSpacePendingDeletionIsReadOnlyForACover, NodeCoverMemoriesSliceTest.noGuestRouteSetsOrRemovesACover]
      web:
        unit: [src/core/node/cover/rights.test.ts, src/core/node/cover/cover.dom.test.ts]
  - id: one-write-no-half-state
    text: The blob step and the sealed meta that names it are ONE transaction - a slot another writer changed is `cover_stale` (nothing attached, the upload spent and freed), a meta that moved is `stale_revision` with nothing written and the upload still open; a failed new cover leaves the old cover, its blob and its meta exactly as they were; two writers racing for an empty slot leave exactly one cover.
    coverage:
      backend:
        integration: [NodeCoverCoreSliceTest.aSlotAnotherWriterFilledIsCoverStaleAndTheLoserIsFreed, NodeCoverCoreSliceTest.aMetaThatMovedWritesNothingAndKeepsTheUploadOpenForTheRetry, NodeCoverCoreSliceTest.aRemovalWithAStaleMetaUndoesTheDetach, NodeCoverCoreSliceTest.aRemovalNamingAReplacedCoverIsRefusedAndTheReplacementKept, NodeCoverCoreSliceTest.aRemovalIsIdempotentAndHealsAMetaThatNamedAGoneBlob, NodeCoverCoreSliceTest.twoWritersRacingForAnEmptySlotLeaveExactlyOneCover]
      web:
        unit: [src/core/node/cover/coverWrite.test.ts]
  - id: trash-keeps-purge-frees
    text: A trashed node keeps its cover for a restore, a set on a trashed node is not found, and the purge frees the cover (attachment, blob row, a reclaim record for its objects).
    coverage:
      backend:
        integration: [NodeCoverCoreSliceTest.aTrashedNodeKeepsItsCoverForTheRestoreAndThePurgeFreesIt]
  - id: derive-seal-binds-the-node
    text: The client derives the cover size with the existing pipeline (one JPEG, long edge 2048) and seals it as the node's own blob - wrapped under the node's key, bound to blob, node and role COVER, blob meta the JPEG type - refusing an unreadable image on a folder or drop box, and states its 40 MB limit; the upload bodies are sealed (no plaintext, the cover meta opens only under that node's key) and byte for byte what Memories' covers sent.
    coverage:
      web:
        unit: [src/core/node/cover/coverWrite.test.ts, src/core/node/cover/pickImage.test.ts, src/features/memories/uploadWire.characterisation.test.ts]
  - id: stored-memory-covers-still-open
    text: Every cover a Memory already stored (the `cover` field of its sealed meta) opens through core's reader and is written with the same keys in the same order.
    coverage:
      web:
        unit: [src/core/node/cover/coverModel.test.ts]
  - id: one-dialog-one-action
    text: A node that takes a cover has ONE cover action (`Set cover` without one, `Change cover` with one, the image icon) in its header and ONE matching entry in its row menu, and no separate Remove; it opens core's dialog, which offers choosing an image, re-cropping the current cover, Remove (only where a cover exists) and Save/Cancel, and is the same dialog for a folder, a drop box, a Memory and a Pot. Where the rights function says no (a file, a guest, a pending deletion, locked keys, a switched-off application) there is no action and the dialog does not open.
    coverage:
      web:
        unit: [src/core/node/cover/components/CoverDialog.test.ts, src/core/node/cover/useNodeCover.test.ts, src/core/node/cover/cover.dom.test.ts, src/features/depot/components/DropBoxDetail.test.ts, src/features/memories/components/MemoryDetailHost.cover.test.ts, src/features/expenses/components/PotDetail.test.ts]
  - id: dialog-crops-and-saves-one-write
    text: The dialog frames the image in the shared 16:9 cropper and Save stores that crop in the cover meta in its existing format - a new image as one upload job + one setNodeCover write, a re-crop as a plain meta write that keeps the stored image, a removal as one write with no cover; a cover reopened restores its crop; a non-image, an empty file or one over 40 MB is refused inside the dialog before anything is read; a conflict or a stale slot re-opens the dialog on the current cover and says so.
    coverage:
      web:
        unit: [src/core/node/cover/components/CoverDialog.test.ts, src/core/node/cover/useNodeCover.test.ts, src/core/node/cover/cover.dom.test.ts]
  - id: display-and-fallback
    text: A node's cover is the leading visual of its row and tile, its header and the sidebar's Favorites, the kind's icon the default; a cover that is missing or fails to open is the icon, silently; a replaced or removed cover drops its old image and object URL at once; a share guest sees the covers through the link's own gated reads and gets no action.
    coverage:
      web:
        unit: [src/core/node/cover/coverStore.test.ts, src/core/node/cover/cover.dom.test.ts, src/core/node/cover/components/NodeCoverImage.test.ts, src/features/memories/components/MemoryCoverImage.test.ts, src/components/app/AppSidebar.test.ts, src/features/depot/components/DropBoxDetail.test.ts]
  - id: memory-opens-the-one-dialog-and-finds-stored-pictures
    text: The Memory page's header action and its cover tile open core's one dialog - the gallery lightbox offers no "Set as cover" and the dialog no other source; the Memory adds only `cover.findStored`, which names the PREVIEW of a gallery medium whose original equals the picked image, so core sends a shared row in place of an upload (a failure to look is no match; a kind without the seam never looks); a stored photo reference reads as no cover (the icon), kept untouched by every other writer; the Memory's rows draw the cover core resolved.
    coverage:
      web:
        unit: [src/features/memories/components/MemoryDetailHost.cover.test.ts, src/features/memories/components/MemoryDetail.rights.test.ts, src/features/memories/memoryCover.test.ts, src/core/node/cover/useNodeCover.test.ts, src/core/node/cover/coverStore.test.ts, src/features/memories/storedMatch.test.ts, src/features/memories/levelRows.test.ts, src/features/memories/levelRows.guest.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/memories/memories-styles.spec.ts`) drives `dialog-crops-and-saves-one-write` as
    far as the dialog's cropper: a Memory's cover dialog frames a picked image in core's `veyq-cropper` classes, read as
    computed styles in light and dark (inbox #513 renamed them from `memory-cover-*`); the Save and its write are not
    driven there. Green only in local runs of the lane (the V1 heavy stage), and ADR 0040 admits `stack` refs only once
    a CI run's log shows the suite executed. On that run the file becomes a ref on the criterion its test is tagged with, and
    this gap goes.
