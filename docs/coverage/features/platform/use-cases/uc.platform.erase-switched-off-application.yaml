useCase: uc.platform.erase-switched-off-application
feature: platform
title: An application left switched off is erased
# Refined 2026-10-25 (inbox #539; the owner answered the CR's six questions with its recommendations). Nothing is
# built: changes/cr-switched-off-application-is-erased.md builds it, and its phases 2 (backend), 3 (web) and 4 (L1)
# turn each gap below into refs. Every criterion is reachable by a coverage surface, so the flip is mechanical.
status: planned
acceptanceCriteria:
  - id: the-day-is-set-once
    text: "When an application's own entry goes off for a tenant, at either level, the tenant gets one day for it, the moment it went off plus veyq.application.off.retention (default P30D), and a second level switching it off keeps that day; a tenant created while the instance holds it off gets its own day from its creation."
  - id: every-member-is-told-the-day
    text: "Every member of the tenant (pendingConsent = false) is told the day by the banner at the top of veyq, the tenant owner also by the Settings → Capabilities row, and, where the instance has mail, by one notice mail within one purge tick and one reminder mail seven days before the day (none for a window of seven days or less); a member with pendingConsent gets no mail, and without instance mail nothing is sent, the switch is not refused and the day does not move."
  - id: the-day-is-served
    text: "getTenantCapabilities serves each off application's day to a member, and listTenantCapabilitySwitches serves it to the tenant owner beside the entry."
  - id: on-the-day-its-nodes-are-erased
    text: "On the day, in every scope of the tenant (personal spaces, groups, a group in its grace), every node of the application's kinds made before the day is erased through the trash purge's erase, trashed ones included, with its media, derivatives, covers, records, item marks, guest-write records and links; a core folder that held one stays, and another application's nodes and another tenant's stay."
  - id: nothing-of-it-is-left
    text: "A sweep derived from every table the applications' migrations create and every core table a NodeSubtreeEraser writes finds no row that names an erased node; dropping one eraser from the erase makes it red and name the table."
  - id: the-ledger-and-the-holds-apply
    text: "The erasure ledger holds one NODE line per erased node, and its replay erases a re-inserted node again; a held medium's blob and its hold rows stay, while an unheld medium's blob is reclaimed."
  - id: switched-on-before-the-day-nothing-is-lost
    text: "Switched on before the day, nothing is erased and the day is cancelled; switched on after it, what existed is erased and what was made after the switch-on stays; off again once the erasure finished, a fresh day starts and a fresh notice goes."
  - id: an-instance-switch-gives-each-tenant-its-day
    text: "Switched off for the instance, every tenant gets its own day, a tenant already off keeps its earlier one, and the notice names the operator as the only one who can switch it on again; switched on for the instance, each day ends except where the tenant's own switch holds it off, and two levels switching at once leave the record the final state implies."
gaps:
  backend: "Nothing is built: the window's record, the purge, the two mails and the served day are cr-switched-off-application-is-erased phase 2, whose slice tests (a)-(h) become the refs."
  web: "Nothing is built: the dated banner and the tenant owner's day are cr-switched-off-application-is-erased phase 3."
  stack: "Nothing is built: application-erasure.spec.ts (a short window in the e2e overlay, Mailpit's notice, the file gone after it) is cr-switched-off-application-is-erased phase 4."
