useCase: uc.depot.view-file
feature: depot
title: View a file — open it and see it (image, text, PDF, video, audio), or get the download
# Built for inbox #412 (web only: no contract or backend change - the viewer reads the chunks a download reads); the
# uploader line for inbox #415 (cr-file-uploader: contract, backend and web) and a guest uploader's name for inbox #431
# (cr-file-uploader-guest-names: contract, backend and web). The
# decision (core/blob/sniff.ts, features/depot/view.ts), the state machine (useFileViewer.ts) and the DOM (FileViewer.vue)
# are proven in unit and real-DOM tests; the page mounts for a member and, through core's page of a link, for a READ and
# a READ_WRITE guest with guarded clients. No real browser has played a video or audio through the service worker for a
# FILE, gone full screen or run it on a phone yet (gaps below). A PDF is drawn by pdf.js (lazy chunk, same-origin worker,
# policy unchanged); the library itself runs in a node test (scanned images decoded included), and the built chunk ran in a
# real browser by hand.
acceptanceCriteria:
  - id: the-bytes-decide-what-a-file-is
    text: What the viewer shows is decided from the decrypted bytes (magic numbers), never by the claimed type alone - a PNG claimed as text/plain is an image typed image/png, a binary claimed as image/png or text/plain is not shown, a text needs valid UTF-8 (or a UTF-16 byte-order mark) with no control bytes AND a text-ish claim, and SVG is an image only when the markup and the claim agree.
    coverage:
      web: { unit: [src/core/blob/sniff.test.ts, src/features/depot/view.test.ts] }
  - id: an-image-is-an-img-on-a-typed-blob-url
    text: An image is shown as an <img> (alt text from the file name) on an object URL typed with the sniffed type, an SVG only so (never inline, never in an object or iframe); a decode failure is a message and the download, and the URL is revoked on a failure, a replace and unmount.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.test.ts, src/features/depot/view.test.ts] }
  - id: a-text-is-shown-as-characters
    text: A text is shown in a monospace block through textContent - markup in it stays visible characters and nothing is parsed; a byte-order mark is dropped, the first 1 MiB is shown with a note when the file is longer, and a binary or non-UTF-8 text claiming to be text is not shown.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.test.ts, src/features/depot/view.test.ts] }
  - id: a-text-can-be-selected-copied-and-wrapped
    text: The shown text is ordinary selectable page text (no user-select none rule reaches it, checked against the real DOM and the real stylesheets); a Copy button writes exactly the shown text to the clipboard (a text cut at 1 MiB copies its shown part and the button and the note say so), where the clipboard API is missing or refuses it copies the selection through the older route or selects the text and tells the user to press Ctrl/Cmd+C - never a silent failure - and a Wrap lines toggle switches between wrapping and sideways scrolling without touching the text.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.text.test.ts] }
    gaps:
      - surface: web
        reason: The clipboard API is stubbed in unit tests; in a real browser (the app's own pane, 2026-10-12) the API refused and the fallback ran (the selection was copied through the older route and the text was selected) - no browser that allows the API has run the success path, and what landed on the clipboard was not read back.
  - id: video-and-audio-stream-through-the-service-worker
    text: A video or audio is played by <video controls playsinline> / <audio controls> from the service worker's ranged media route under the container the first chunk sniffs to (the page holds the key, the worker none; nothing past chunk 0 is read by the page for it); with no usable worker or a codec the browser lacks it is a message and the download; the playback handle is revoked on unmount.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.test.ts, src/sw/mediaSw.test.ts, src/features/depot/view.test.ts] }
    gaps:
      - surface: web
        reason: The service worker is stubbed in unit tests (it cannot be registered in the test environment); no real browser has played a Depot video or audio through it yet, nor on a phone's Safari.
  - id: memory-is-bounded-per-kind
    text: An image over 64 MiB is not decrypted (the message names the limit and offers the download), a text is cut at 1 MiB, and a file of another kind is read no further than its first chunk; a PDF over 64 MiB is not decrypted past its first chunk (message plus the download) and one over 1000 pages is not drawn.
    coverage:
      web: { unit: [src/features/depot/view.test.ts, src/features/depot/components/FileViewer.test.ts, src/features/depot/components/FileViewer.pdf.test.ts, src/shared/pdf/pdfEngine.real.test.ts] }
  - id: a-pdf-is-drawn-inline-page-by-page
    text: A PDF (%PDF- within the first KiB, decided by the bytes - a text that only mentions the header stays text) is decrypted whole and drawn inside the page by pdf.js onto canvases - no frame, object, embed, link or form element - loaded lazily on the first PDF; only pages near the viewport are drawn and a page far away gives its bitmap back; the page shows "Page n of N" and zoom out, zoom in and fit-width buttons; an unreadable PDF is a message and the download; the document is destroyed on a new file, on navigation and on unmount.
    coverage:
      web:
        unit: [src/features/depot/components/FileViewer.pdf.test.ts, src/shared/pdf/pdfEngine.real.test.ts, src/features/depot/view.test.ts, src/core/blob/sniff.test.ts, src/features/depot/components/FileDetail.test.ts]
    gaps:
      - surface: web
        reason: The unit tests mock the engine (happy-dom draws no canvas, has no layout and no IntersectionObserver) or run the real library in node without a canvas; the built chunk and worker were run once in a real browser under the real header (docs/apps/depot.md § The viewer), but the Vue viewer's scrolling, observer margin, zoom and full screen have not been on a real file page, nor on a phone.
  - id: the-text-of-a-pdf-can-be-selected-and-copied
    text: A transparent text layer of selectable spans sits over each drawn PDF page - one per drawn page, built with the page's drawing, rebuilt at a new zoom, emptied when the page is freed and cancelled with the drawing, sized as the raw page and turned into place for a rotated page; a page whose text cannot be read is drawn with an empty layer; the layer is spans only, so a link in a PDF is selectable text and never clickable (there is no annotation layer); and no rule makes the text unselectable.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.pdf.test.ts, src/shared/pdf/pdfEngine.text.test.ts, src/shared/pdf/pdfEngine.real.test.ts] }
    gaps:
      - surface: web
        reason: happy-dom has no layout and no canvas, so alignment of the text over the drawn glyphs cannot be asserted in a test; it was observed in a real browser (100 %, 200 %, a rotated page) with a mouse drag and a select-all, not on a phone and not in CI.
  - id: a-protected-pdf-asks-for-its-password
    text: A password-protected PDF shows an in-page prompt (a labelled password field, autocomplete off, focused, Enter submits, Escape cancels) instead of only the download; a wrong password is an inline error and a retry, the right one shows the pages, Cancel keeps the download offer; the password goes to pdf.js only (a promise value) - it is in no DOM node, component state, storage, console output or request after the attempt, after success and after unmount, and a prompt raised by a superseded or unmounted open is declined.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.pdf.test.ts, src/shared/pdf/pdfEngine.password.test.ts, src/shared/pdf/pdfEngine.real.test.ts] }
    gaps:
      - surface: web
        reason: The real library is exercised in node (an RC4 40-bit fixture with encrypted content streams - need, wrong, right, declined - and the text of an encrypted page) and once in a real browser by hand; AES-encrypted documents, the other security handlers and a phone are not exercised.
  - id: pdf-js-stays-inside-the-content-security-policy
    text: pdf.js is a lazy chunk with a same-origin hashed worker and same-origin runtime data, opens the document from the decrypted buffer (never a URL), runs no PDF script and shows no annotation layer (its text layer is plain selectable spans), builds no code from strings and ships none of its WebAssembly, so it runs inside the page's policy as it is (object-src and frame-src none, worker-src self, no unsafe-eval); its image decoders are the plain-JavaScript builds pdfjs-dist ships, imported by its worker from the same origin, so a scanned page's CCITT G4, JBIG2 and JPEG 2000 images draw (the real-library test decodes one of each, through our options, to its pixels; without the decoders' URL all three fail).
    coverage:
      web: { unit: [src/shared/pdf/pdfEngine.real.test.ts, src/features/depot/components/FileViewer.pdf.test.ts, src/shared/security/csp.test.ts] }
      backend: { integration: [AppShellSliceTest.pdfJsImageDecodersAreServedAsJavaScript] }
    gaps:
      - surface: web
        reason: The lazy chunk, the worker, the absence of eval and of pdf.js's WebAssembly, the runtime data and the two image decoders (exactly them, byte for byte the package's) are pinned by the build check `pnpm run verify:pdf-worker` (src/web/scripts/assert-pdf-worker-in-dist.mjs, in `pnpm run check`), which is not a test file and so no coverage ref; and no check proves that a browser starts the worker or imports a decoder under the policy - that was observed by hand (a local server sending the built header - pages drawn 2026-10-12, a CCITT G4, a JBIG2 and a JPEG 2000 page drawn in headless Chrome 2026-11-12), not in CI.
  - id: reading-starts-with-the-page-and-stops-with-it
    text: The file is read when its page opens (not for a list row), with a busy state and a Stop; unmounting or moving to another file aborts the read in flight and drops a late result; a failed read is an error with Try again, never an unhandled rejection.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.test.ts, src/features/depot/components/FileDetail.test.ts] }
  - id: full-screen-with-a-fallback
    text: A full-screen button (the Fullscreen API on the viewer's container, Escape leaves) enlarges the shown content; where the API is missing or refused a fixed overlay stands in, closed by the button or Escape.
    coverage:
      web: { unit: [src/features/depot/components/FileViewer.test.ts] }
    gaps:
      - surface: web
        reason: The Fullscreen API is stubbed (happy-dom has none); no real browser, nor an iPhone's Safari (which has no element fullscreen), has run it yet.
  - id: a-guest-sees-the-members-viewer
    text: A READ and a READ_WRITE guest of a file link open the file through the link's own presign (the share id and password token) and see the same viewer with the same controls as the member, with no authenticated client called; a file the viewer cannot show offers the download both roles hold.
    coverage:
      web: { unit: [src/features/depot/components/FileDetail.guest.test.ts, src/features/depot/components/FileDetail.test.ts] }
  - id: a-member-sees-who-uploaded-the-current-content
    text: The server records who uploaded a file's current content on its attachment - exactly one of a member's user id and a guest identity (a check constraint), from the upload's opener, moved to the replacer by a replace - and the member's listing serves it as uploaderKey (user:<id> | share:<identityId>, null with no content). The file's page header reads "Uploaded by" a member's avatar and display name as a real link to the profile, a greyed "former member" with no link for one no longer in the scope, a guest by its name (the next criterion) or "a guest"; a directory that cannot be read, a key of no known shape and a file with no content name nobody.
    coverage:
      backend: { integration: [DepotContentSliceTest.theListingNamesTheUploaderOfTheCurrentContentAndAReplaceMovesIt, NodeAttachmentSliceTest.anAttachmentNamesExactlyOneUploader, ShareFilesSliceTest.aGuestsUploadIsAttributedToItsIdentityForMembersAndTheGuestListingNamesNoUploader] }
      web: { unit: [src/features/depot/components/FileDetail.uploader.test.ts] }
  - id: a-member-reads-a-guests-name
    text: For a share uploader the member's listing also serves that identity's sealed display name and its share id (uploaderName; null for a member's upload and a file with no content), a deleted link's guest included. The page names the guest by it without a link - inside a drop box by the identity folder of that same identity, else the sealed name opened under the file's key or the nearest ancestor key the member's tree holds (core's openIdentityName, which Memories' buckets read too) -, marked as a guest's ("Uploaded by Ben (guest)", core's guestDisplayName in English and German, inbox #433: a guest that took a member's name is told apart, the member is unmarked), and reads "a guest" where it does not open (another key, a seal bound to another share, a chain that does not open, no base64).
    coverage:
      backend: { integration: [ShareFilesSliceTest.aGuestsUploadIsAttributedToItsIdentityForMembersAndTheGuestListingNamesNoUploader, ShareFilesSliceTest.aDeletedLinkKeepsItsGuestsIdentityWhileItsFileNamesIt, DepotContentSliceTest.theListingNamesTheUploaderOfTheCurrentContentAndAReplaceMovesIt] }
      web: { unit: [src/features/depot/components/FileDetail.uploader.test.ts, src/core/sharing/guestIdentity.test.ts] }
  - id: a-guest-is-shown-no-uploader
    text: A share guest is never told who uploaded a file - the link's file listing has an item schema of its own with no uploader field and no name (its raw JSON carries neither field, either id nor the sealed name), and the guest's page names nobody and asks no member directory, even were its listing to carry a name it could open.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aGuestsUploadIsAttributedToItsIdentityForMembersAndTheGuestListingNamesNoUploader] }
      web: { unit: [src/features/depot/components/FileDetail.guest.test.ts] }
  - id: a-file-blocked-by-the-operator
    # Alternate flow A7, added by cr-moderation-review-and-measures (uc.moderation.take-a-measure).
    text: >-
      A file a moderator blocked shows "Blocked by the operator" with no reason in its row and on this page; nothing is
      read (451 blocked_by_operator) and no download or replace is offered, for a member and a guest alike, and the
      uploader may still delete it.
    coverage:
      backend:
        integration: [ModerationDepotSliceTest.aBlockedFileIsNeitherReadNorReplacedByAnyoneWhileTheReviewStillReadsIt]
      web:
        unit: [src/core/node/LevelView.blocked.test.ts, src/features/memories/components/FolderShareGuest.test.ts, src/views/SpaceView.registry.test.ts]
    gaps:
      - surface: web
        reason: >-
          The member's page of a blocked node (SpaceView's `node-blocked`, drawn before any kind's detail) is held
          with a stub detail on a Memories kind (SpaceView.registry.test.ts), not with Depot's file detail itself.
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/depot/depot-styles.spec.ts`) drives `the-text-of-a-pdf-can-be-selected-and-copied`
    as far as the drawn page's text layer: a one-page PDF built in the spec is uploaded into a folder and opened, and the
    layer, a text span (transparent, selectable, the accent as its selection) and the end marker are read as computed
    styles in light and dark (inbox #517 moved those rules from core's `styles/pdf.css` into Depot's own
    `features/depot/depot.css`, and they are core's `shared/pdf/pdf.css` again since the renderer moved there); a drag that selects and copies is not driven there. Green only in local runs of the lane (the V1 heavy
    stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed. On that run
    the file becomes a ref on the criterion its test is tagged with, and this gap goes.
