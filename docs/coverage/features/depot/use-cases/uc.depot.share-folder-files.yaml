useCase: uc.depot.share-folder-files
feature: depot
title: Files on a shared folder — guests download, contributors add and replace
# Built by cr-files-application F2. Backend: ShareFilesSliceTest (core + Depot) and the race class holding the
# completion against a trash, a move out and a revoke held uncommitted; web: the member's Depot rows mounted for a
# guest (inbox #401 S3) with the real catalog and the guarded clients, the guest's wire recorded at fetch, core's folder
# page rendering the level rows for a guest; depotShare.e2e.test.ts runs in the web-e2e job.
acceptanceCriteria:
  - id: a-read-guest-lists-and-downloads-the-subtree
    text: A guest of a READ or READ_WRITE folder link lists every live FILE of the shared subtree (never one beside it) with name, size and date opened under the link's chain, and downloads it through the link byte for byte.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aReadGuestListsAndDownloadsTheFilesOfTheSubtreeOnly] }
      web:
        unit: [src/features/depot/levelRows.guest.test.ts, src/core/sharing/ShareTreePage.sections.test.ts, src/features/memories/components/FolderShareGuest.test.ts]
        e2e: [src/features/depot/depotShare.e2e.test.ts]
  - id: a-read-guest-writes-nothing
    text: A READ guest's upload start and completion are refused, and its page offers no upload or replace.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aReadGuestListsAndDownloadsTheFilesOfTheSubtreeOnly] }
      web:
        unit: [src/features/depot/levelRows.guest.test.ts]
        e2e: [src/features/depot/depotShare.e2e.test.ts]
  - id: a-contributor-adds-and-replaces-files
    text: A READ_WRITE guest creates a FILE under a folder of the subtree (Depot declares FILE guest-creatable, core's GuestCreatableKinds; a drop box is 422 illegal_scope, owner decision 2026-10-14), uploads into it and replaces any file of the subtree (a member's too) with the blob it saw; its metadata is the uploaded blob's own (sealed under its K_blob, declared at the guest start), so it lands with the bytes and only with them; completeShareFile writes no node payload; a stale replace is 409 stale_file and the slot keeps its blob and that blob's metadata.
    coverage:
      backend:
        integration: [ShareFilesSliceTest.aContributorCreatesAFileUploadsReplacesAndRenamesIt, ShareFilesSliceTest.aGuestsAndAMembersBlobMetaAreServedToTheGuestUnchanged, ShareFilesSliceTest.aContributorCreatesFoldersAndFilesButNoDropBox]
        unit: [DepotNodeKindRulesTest.aFolderGuestCreatesFilesAndNoDropBox, DepotNodeKindRulesTest.aSecondClaimOfFileFailsStartup]
      web:
        unit: [src/features/depot/shareUpload.wire.test.ts, src/features/depot/dropBox.wire.test.ts, src/features/depot/levelRows.guest.test.ts]
        e2e: [src/features/depot/depotShare.e2e.test.ts]
  - id: a-contributor-replaces-by-uploading-the-same-name
    text: No row offers a replace (owner decision 2026-10-14). A contributor's upload of a name a file of the folder holds asks the same question a member gets and, accepted, replaces that file with the blob the guest saw, before the guest is named; declined, nothing is sent and nobody is named; a file that holds no content is filled without the question; a name a folder, Memory or drop box holds is refused unsent (reverses inbox #392's refusal of a guest's same-name upload).
    coverage:
      web:
        unit: [src/features/depot/levelRows.guest.test.ts]
  - id: a-guest-writes-only-a-file-of-its-subtree
    text: A guest's completion targets only a FILE of its subtree in the FILE_CONTENT role; a folder (root or named) is share_not_contributable, a node outside the subtree is not found, another role is invalid_request, another node's session is upload_mismatch, a wrong token is refused.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aGuestUploadsOnlyIntoAFileOfItsSubtreeInTheFileRole] }
      web: { unit: [src/features/depot/shareUpload.wire.test.ts] }
  - id: the-write-is-decided-again-under-the-lock
    text: A file trashed or moved out of the subtree, or a link revoked, between a guest's start and its completion refuses the completion; nothing is attached, so no blob and no metadata lands.
    coverage:
      backend: { integration: [ShareFileCompleteRaceSliceTest.aCompletionIntoAFileAMemberTrashesMeanwhileIsRefused, ShareFileCompleteRaceSliceTest.aCompletionIntoAFileAMemberMovesOutOfTheSubtreeMeanwhileIsRefused, ShareFileCompleteRaceSliceTest.aCompletionOnALinkRevokedMeanwhileIsRefused] }
  - id: a-trashed-file-is-gone-for-guests
    text: A file in the trash, or under a trashed folder, is not listed to a guest, its blob is 404 through the link, and an upload into it is 404 node_not_found.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aFileInTheTrashAnswers404ToAGuest] }
      web: { e2e: [src/features/depot/depotShare.e2e.test.ts] }
  - id: guest-files-count-against-the-link-limit
    text: A guest's file counts against the tenant's per-link storage limit through core's attachment term, refused at the exact byte, and the page says the link is full in its own words.
    coverage:
      backend: { integration: [ShareFilesSliceTest.aGuestsFilesCountAgainstTheLinkLimitToTheByte] }
      web: { unit: [src/features/depot/levelRows.guest.test.ts] }
  - id: a-refused-upload-leaves-no-file-behind
    text: A contributor's upload the full link refuses (or the guest gives up) leaves no node behind — the job takes back the FILE its create made (abandonShareNode), which the server erases at once, never trashed; only a FILE whose slot never held a blob, that no member or other identity is uploading into and that has no child is taken back (409 not_a_placeholder, nothing written), and only inside the guest's reach (outside 404, the root and an identity folder 422); a kind no implementation declares is never one; a completion and an abandon of one file decide each other under the scope lock. A folder upload takes back, deepest first once its batch settled, the FOLDERs it made that hold nothing (core's own placeholder - no child, no cover, no sealed metadata); one below which a file landed or a retry could still land one stays.
    coverage:
      backend:
        integration: [ShareFilesSliceTest.aFileWhoseUploadTheFullLinkRefusedIsTakenBackAndNothingOfItIsKept, ShareFilesSliceTest.onlyAnEmptyFileNobodyElseIsUploadingIntoIsTakenBack, ShareNodeAbandonRaceSliceTest.anAbandonWhileTheGuestsCompletionCommitsKeepsTheFileAndItsBlob, ShareNodeAbandonRaceSliceTest.aCompletionWhileTheAbandonCommitsAttachesNothing, ShareNodeAbandonCoreSliceTest.aContributorErasesAnEmptyPlaceholderAtOnceAndTheTreeRevisionMoves, ShareNodeAbandonCoreSliceTest.aNodeWithAChildLiveOrTrashedIsNoPlaceholder, ShareNodeAbandonCoreSliceTest.anUploadAnybodyElseHasOpenIntoTheNodeKeepsItTheGuestsOwnDoesNot, ShareNodeAbandonCoreSliceTest.aKindNobodyDeclaresIsNeverAPlaceholder, ShareNodeAbandonCoreSliceTest.aContributorErasesNothingOutsideItsReach, ShareNodeAbandonCoreSliceTest.aReadGuestErasesNothingAndTheGateRefusesAsForTheOtherGuestWrites, ShareNodeAbandonCoreSliceTest.anEmptyFolderIsAPlaceholderOneWithACoverOrMetadataIsNot, ShareFilesSliceTest.aFolderTreeWhoseEveryFileTheFullLinkRefusedIsTakenBackDeepestFirst]
      web: { unit: [src/features/depot/shareUpload.wire.test.ts, src/features/depot/uploadFolder.test.ts, src/features/depot/levelRows.guest.test.ts] }
  - id: a-guest-takes-back-only-its-own-placeholder
    text: The take-back erases only the calling guest's own placeholder - a node whose name its identity wrote last (ADR 0093 § 8) - and never one a live link (a revoked one included) is rooted on; a member's empty file or folder, one a member renamed and another guest's are 409 not_a_placeholder, nothing written, while the guest's own made through createShareNode goes; a guest that moved a member's empty folder named it and may take it back (the accepted residual, pinned).
    coverage:
      backend:
        integration: [ShareNodeAbandonCoreSliceTest.onlyThePlaceholderWhoseNameTheCallingIdentityWroteLastIsErased, ShareNodeAbandonCoreSliceTest.aGuestThatMovedAMembersEmptyFolderMayTakeItBack, ShareNodeAbandonCoreSliceTest.anEmptyFolderThatCarriesALinkIsKeptAndTheLinkStaysLive, ShareNodeAbandonCoreSliceTest.anEmptyFolderIsAPlaceholderOneWithACoverOrMetadataIsNot, ShareFilesSliceTest.onlyAnEmptyFileNobodyElseIsUploadingIntoIsTakenBack]
  - id: a-deleted-link-keeps-the-guest-identity-its-file-names
    text: Deleting a link keeps the guest identity while a file's attachment names it (core's attachment usage).
    coverage:
      backend: { integration: [ShareFilesSliceTest.aDeletedLinkKeepsItsGuestsIdentityWhileItsFileNamesIt] }
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/depot/guest-take-back.spec.ts`, `tests/e2e/tests/features/depot/depot-download.spec.ts`)
    drives `a-read-guest-lists-and-downloads-the-subtree`, `a-refused-upload-leaves-no-file-behind`, `guest-files-count-against-the-link-limit`,
    `a-guest-takes-back-only-its-own-placeholder` in Chromium against the release candidate's two images, installed
    through `veyqctl` (ADR 0090), each test tagged with its criterion. A guest's upload the space's per-link limit
    refuses is taken back (204), its file gone for the guest and the member after a reload; the same guest's hand-built
    take-back of the member's empty folder answers 409 `not_a_placeholder` and the folder stays; a guest of a read-only
    link whose browser has neither a save picker nor a Service Worker downloads a 25-frame file byte for byte. Green only in local
    runs of `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the first CI run (no remote), and
    ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that run each file becomes a ref on
    the criteria its tests are tagged with, and this gap goes.
