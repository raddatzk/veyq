useCase: uc.spaces.edit-profile
feature: spaces
title: Edit your profile in a space
# The "Your profile" rubric of the settings hub (src/web/src/features/account/profile/ProfilePanel.vue). The panel's
# mounted test mocks ./profile at its I/O functions and keeps the sealing real, so each name assertion unseals
# what the panel sent at the member's own address.
acceptanceCriteria:
  - id: edit-username
    text: A member changes their per-tenant username from the profile. The client sends it trimmed and lower-cased; the server re-checks it is free in this tenant and stores it. A taken handle is `409 username_taken`, the panel says so, and nothing is saved (not the handle, the name or the consent preference).
    coverage:
      backend:
        integration: [MemberIdentitySliceTest.profileOpRoundTripsUsernameAndSealedName, MemberIdentitySliceTest.changingToATakenUsernameIs409]
      web:
        unit: [src/features/account/profile/ProfilePanel.test.ts]
  - id: name-sealed-on-device-at-its-address
    text: The real name is unsealed on the device on load and sealed on the device on save, under a field key derived from its own value key, whose wrap `K_tenant` holds at (tenant scope, the member's own user id); the server stores the blob verbatim and never opens it.
    coverage:
      backend:
        integration: [MemberIdentitySliceTest.profileOpRoundTripsUsernameAndSealedName]
      web:
        unit: [src/features/account/profile/profile.test.ts, src/features/account/profile/ProfilePanel.test.ts]
  - id: name-opens-across-a-rotation
    text: A tenant rotation re-wraps every member's name's own value key under the tenant's new key and leaves the name byte-identical (ADR 0115 decision 2), so after it the name opens for every member holding the new key (the directory, the members list, the profile form) and the member is not asked to finish their profile; a wrap left under the replaced key opens for nobody, and a reader holding only the old key opens none of the re-wrapped keys. A save mints a fresh value key, states the tenant epoch its wrap is under and is sealed once more after a `409 stale_epoch`; entering the tenant writes no profile.
    coverage:
      web:
        unit:
          - src/core/people/profileAcrossRotation.test.ts
          - src/features/spaces/TenantMembersPanel.test.ts
          - src/features/account/profile/useNameAndPicture.test.ts
          - src/features/spaces/scopeRekey.test.ts
          - src/app/activeSpace.test.ts
        e2e: [src/features/account/profile/profileAcrossRotation.e2e.test.ts]
  - id: no-grant-username-only
    text: A member whose tenant key does not open on this device (behind or refused) holds no `K_tenant`, so the name inputs are disabled with a hint saying why, and a save sends the username alone (no sealed name).
    coverage:
      web:
        unit: [src/features/account/profile/ProfilePanel.test.ts]
  - id: remove-real-name
    text: Emptying both name fields and saving sends a sealed EMPTY name rather than omitting the field (which would keep the old name), so a set real name can be removed; the directory then shows only `@username`.
    coverage:
      web:
        unit: [src/features/account/profile/ProfilePanel.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/field-seal.spec.ts`) drives `name-sealed-on-device-at-its-address` in
    Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion. Each value is written in one browser and read back after a reload and on a second device that signed
    in with the password and the Secret Key (en.platform.field-key). Green only in local runs of
    `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the first CI run (no remote), and ADR 0040
    admits `stack` refs only once a run's log shows the suite executed. On that run each file becomes a ref on the
    criteria its tests are tagged with, and this gap goes.
