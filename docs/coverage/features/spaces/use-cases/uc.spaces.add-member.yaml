useCase: uc.spaces.add-member
feature: spaces
title: Add a member to the shared Tenant space
# ONBOARDING built cr-0077 (MEMBER invite + join + the member directory + the web add-member UI); since ADR 0111
# decisions 1-3 (cr-invite-is-a-placeholder-member) the invite is a placeholder member — an owner-signed invite key
# holding a grant of the tenant key, its link sealed under a code — and the invitee checks it, grants itself and
# writes a join record. No member waits for another member's device: nothing is delivered to a newcomer.
acceptanceCriteria:
  - id: member-invite-and-onboard
    text: Only a tenant OWNER mints a single-use MEMBER invite (email, secret hashed) reusing the owner-invite machinery (an outsider gets 404, an ordinary member 403 `not_tenant_owner`); the invitee cold-registers (identity born on-device, public bundle published) — or signs in and accepts on an existing account — and becomes a tenant member holding the grant it sealed to its own identity, in the shared space at once, with nothing left for any other device to deliver.
    coverage:
      backend:
        integration: [MemberAddSliceTest.ownerMintsMemberInviteOutsiderIs404, MemberAddSliceTest.memberRegisterJoinsWithItsSelfGrantAndNothingIsDelivered, MemberAddSliceTest.existingAccountAcceptsMemberInviteAndJoinsWithItsSelfGrant, TenantOwnerGateTest.ordinaryMemberWhoOwnsScopesIsRefusedAtEveryOwnerGatedEndpoint, TenantOwnerGateTest.realRootScopeOwnerStillPasses]
      web:
        unit: [src/features/spaces/InviteMemberDialog.test.ts, src/features/spaces/TenantMembersPanel.test.ts, src/views/TenantJoinView.member.test.ts]
        # The live half: A invites B through the real client, B joins from the mailed link with the code and — with
        # no other device online and no grant delivery run — opens the tenant and reads what A wrote.
        e2e: [src/features/spaces/memberInvite.e2e.test.ts]
  - id: invite-travels-by-mail-only
    # Was `invite-link-handoff`, and it asserted the opposite: the mint response used to hand the owner the raw
    # secret so they could copy the link, justified as self-hostability. ADR 0055 reversed that — a token minted
    # for a named other person must not be routed through whoever is looking at the owner's screen — and priced
    # the self-hostability cost explicitly (a mailer becomes a precondition for admitting members; an auth-less
    # relay suffices). The surviving copy-link is the Server-Owner's bootstrap invite, covered by
    # uc.admin.create-tenant.
    text: The invite is delivered to the invited address by email and by no other channel — the mint response carries no secret at all (ADR 0055 §2), and the secret that arrives in the mail is the real one (it accepts). A tenant with no sendable mail settings is refused with 503 `mail_unavailable` before anything is minted, so an undeliverable invitation never exists.
    coverage:
      backend:
        integration: [MemberAddSliceTest.theMailedSecretIsTheOnlyChannelAndItWorks, MemberAddSliceTest.aTenantThatCannotSendMailIsRefusedAndMintsNothing]
      web:
        unit: [src/features/spaces/InviteMemberDialog.test.ts, src/features/spaces/TenantMembersPanel.test.ts]
        e2e: [src/features/spaces/memberInvite.e2e.test.ts]
  - id: member-invite-emailed-when-smtp-configured
    # cr-email-smtp-transport (ADR 0048/0049): a second delivery channel alongside the copy-link. When the tenant
    # has configured + enabled SMTP, the member invite is emailed from the tenant's own address; the body is
    # rendered from the tenant's template (or veyq's EN+DE default) over the CLOSED set {{link}}/{{domain}}/
    # {{expiry}} — veyq interpolates nothing sealed. `anUnconfiguredTenantCannotSendAndAttemptsNoSmtp` still pins the
    # fallback because the bootstrap invite still uses it; what changed is that a *member* invite can no longer
    # reach it — the gate refuses first (ADR 0055 §2), pinned by the criterion above.
    text: When the tenant has configured + enabled per-tenant SMTP, a member invite is delivered by email from the tenant's own address (the accept link's secret in the URL fragment; body over the closed {{link}}/{{domain}}/{{expiry}} set, nothing sealed injected by veyq). With no config there is no member invite at all — the fallback that remains is the Server-Owner's bootstrap copy-link, not this path (ADR 0055 §3).
    coverage:
      backend:
        integration: [SmtpInviteMailSendTest.aConfiguredTenantSendsARenderedInviteCarryingOnlyTheClosedSet, SmtpInviteMailSendTest.anUnconfiguredTenantCannotSendAndAttemptsNoSmtp]
        unit: [InviteMailRendererTest.theRenderContextIsClosedToExactlyThreeNonSecretFields]
  - id: member-invite-delivery-result
    # cr-email-invite-send-hardening: the mint reports a first-class delivery result inline — SENT (SMTP accepted),
    # FALLBACK_COPYLINK (no sendable SMTP → the copy-link is the channel), or FAILED (SMTP configured but the send
    # errored, no longer silently swallowed). The send runs AFTER the mint transaction commits (a hung SMTP server
    # no longer holds a DB connection); the FAILED path proves the send is best-effort and surfaced, not swallowed.
    # Request-scoped only, never persisted → operator-blind untouched (ADR 0049). The web branches the three states:
    # ADR 0055 narrowed this on the member path: FALLBACK_COPYLINK is refused before the mint and FAILED is no
    # longer a success, so `delivery` can only read SENT here (it keeps its full range on the Server-Owner
    # responses). A failed send *compensates* the mint — the invite is soft-revoked — because with no copy-link a
    # surviving token would be a live secret nobody can reach.
    text: >-
      The invite mint reports a first-class delivery result inline, sent after the mint transaction commits and
      never persisted (operator-blind untouched). On a member invite only SENT is reachable — no sendable mailer
      is 503 `mail_unavailable` before the mint, and a send that errors is 503 `mail_send_failed` with the minted
      invite revoked again, leaving no live token.
    coverage:
      backend:
        integration: [SmtpInviteMailSendTest.aConfiguredTenantSendsARenderedInviteCarryingOnlyTheClosedSet, SmtpInviteMailSendTest.anUnconfiguredTenantCannotSendAndAttemptsNoSmtp, SmtpInviteMailSendTest.aConfiguredTenantWhoseSmtpIsUnreachableReportsFailed, MemberAddSliceTest.theMailedSecretIsTheOnlyChannelAndItWorks, MemberAddSliceTest.aSendThatFailsLeavesNoLiveInvite]
      web:
        unit: [src/features/spaces/InviteMemberDialog.test.ts, src/features/spaces/TenantMembersPanel.test.ts]
  - id: member-invite-rate-limited
    # cr-email-invite-send-hardening: the anti-bombing guard. A dedicated handler-level limiter keyed
    # per-(tenant,recipient) [the primary guard] AND per-tenant [the volume cap], enforced after the authorization
    # guards and before the mint, so a limited request creates no orphan invite. Over-limit → 429 + Retry-After.
    # Built on the pure, mutation-verified TokenBucket core (not the per-IP IpRateLimitFilter, which cannot key on
    # a recipient); its gradual refill turns 3/hour from a burst of 3 into one per 20 minutes (ADR 0052). Defaults (3/recipient, 20/tenant, per hour) are deliberately set, not calibrated — revidierbar.
    text: Member-invite sends are rate-limited per-(tenant,recipient) and per-tenant to bound email-bombing of one address (the reissue-loop vector); over the limit the request is refused with 429 + Retry-After before any invite is minted, and the web surfaces a "try again later" message.
    coverage:
      backend:
        integration: [MemberAddSliceTest.invitingOneRecipientPastTheLimitIs429WithRetryAfter]
        unit: [InviteMailRateLimiterTest.theFourthInviteToOneRecipientIsRateLimited, InviteMailRateLimiterTest.aDifferentRecipientHasItsOwnBudget, InviteMailRateLimiterTest.theRecipientKeyIsCaseInsensitiveSoAliasCasingCannotEvadeIt, InviteMailRateLimiterTest.theTenantVolumeCapTripsAcrossDistinctRecipients, InviteMailRateLimiterTest.adifferentTenantIsIsolated]
      web:
        unit: [src/features/spaces/InviteMemberDialog.test.ts, src/features/spaces/TenantMembersPanel.test.ts]
  - id: scope-member-directory
    text: A member lists a scope's memberships with each member's role and identity public key — no grant flag, since every membership holds one — and, on the tenant's listing, each member's sealed join record (null for the first owner) and the endorsement of it by the owner who rooted it (null until that owner secures their account). The operator-blind server returns only already-stored operational metadata and ciphertext — never a scope key — and the directory is scoped to that scope's members (a non-member gets 404), not a global user search.
    coverage:
      backend:
        integration: [MemberAddSliceTest.memberDirectoryListsMembersWithTheirKeys, InvitePlaceholderSliceTest.acceptingWritesAGrantedMembershipAndTheJoinRecordAndConsumesTheKey, InviteAnchorSliceTest.theTenantDirectoryServesTheJoinEndorsement]
      web:
        unit: [src/features/spaces/TenantMembersPanel.test.ts]
  - id: member-identity
    # Built by cr-0083 (en.spaces.member-identity, ADR 0023): the directory's identity layer. A member's
    # per-tenant username is chosen at join (unique in the tenant); the real name is sealed under a field key derived from K_tenant.
    text: Each member carries a per-tenant `username` (plaintext handle, unique within the tenant — a clash at join or rename is `409 username_taken`, and the same handle is free in another tenant) and a `firstName`/`lastName` **sealed under a field key derived from `K_tenant`** (decrypted on-device by any member; the server never sees the plaintext name). In the directory `email` is **owner-only** — nulled for a non-owner caller. Every joiner holds `K_tenant` at accept (an owner from the cold birth, a member from the invite's grant), so the optional real name is sealed **at the join**, or set later from the profile ([uc.spaces.edit-profile]).
    coverage:
      backend:
        integration: [MemberIdentitySliceTest.twoMembersCannotShareAUsernameInOneTenant, MemberIdentitySliceTest.theSameUsernameIsFreeInAnotherTenant, MemberIdentitySliceTest.directoryShowsUsernameAndOwnerOnlyEmail, MemberIdentitySliceTest.profileOpRoundTripsUsernameAndSealedName, MemberIdentitySliceTest.changingToATakenUsernameIs409, MemberIdentitySliceTest.registerAndAcceptSealsTheOptionalNameAtJoin, TenantAcceptSliceTest.existingOwnerAcceptSealsTheOptionalNameAtJoin]
      web:
        unit: [src/features/account/profile/profile.test.ts, src/features/spaces/TenantMembersPanel.test.ts, src/features/tenant/tenantInvite.test.ts, src/views/TenantJoinView.member.test.ts]
  - id: invite-holds-a-signed-key-and-a-grant
    # ADR 0111 decisions 1-2: the owner's client mints the invite key from a seed, signs it (statement `invite-key`
    # over tenant, invite, key hash and expiry) and wraps the tenant's current epoch to it. The server is a new grant
    # writer (TenantStore.mintMemberInvite) and checks the epoch under the tenant lock, the key the grant names and
    # the signed expiry against its own lifetime (served as MyTenant.memberInviteTtlSeconds).
    text: The owner's client makes the invite a placeholder member — an invite key derived from a fresh seed, the owner's signature over it and the expiry, and a grant of the tenant's current epoch wrapped to it, signed by the owner. The server mints it only when the signature verifies under the caller's stored identity key (400, so a session without the owner's vault mints no invite), and stores the public key, the signature, the signer's key as it signed and the grant — the grant a second time as the invite's anchor — refusing a grant of an epoch a rotation left (409 `stale_epoch`), one naming another key (409 `recipient_key_not_current`) and an expiry off its own invite lifetime by more than a minute (400), each with nothing minted.
    coverage:
      backend:
        integration: [InvitePlaceholderSliceTest.aMemberInviteStoresTheInviteKeyItsSignatureAndAGrant, InvitePlaceholderSliceTest.aMemberInviteAtAStaleEpochIsRefused, InvitePlaceholderSliceTest.aMemberInviteWhoseGrantNamesAnotherKeyIsRefused, InvitePlaceholderSliceTest.aMemberInviteOffTheServersLifetimeIsRefused, InvitePlaceholderSliceTest.aMemberInviteNotSignedByTheCallerIsRefused, GrantWriterSnapshotSliceTest.aMemberInviteRecordsItsSignersKey, InviteAnchorSliceTest.anInviteIsMintedWithTheOwnersGrantAsItsAnchor]
      web:
        unit: [src/features/spaces/memberInvite.test.ts]
  - id: invite-sealed-under-a-code
    # ADR 0111 decision 1, made mandatory: the server mails the link, so an unsealed link would hand the operator
    # the invite. The code is 10 Crockford base32 characters (50 bits) behind Argon2id at the production profile.
    text: The link's secret part — the seed, the owner's key-chain head and account (`invite-link` v2) — is always sealed under Argon2id of a generated 10-character code shown once to the owner (or a password the owner chose, at least the account password's length floor), bound to its tenant and invite; it opens with that code only and only as that invite. The server appends it to the mailed link and keeps no copy.
    coverage:
      backend:
        integration: [InvitePlaceholderSliceTest.aMemberInviteStoresTheInviteKeyItsSignatureAndAGrant]
      web:
        unit: [src/features/spaces/memberInvite.test.ts, src/features/spaces/InviteMemberDialog.test.ts]
        e2e: [src/features/spaces/memberInvite.e2e.test.ts]
  - id: invitee-checks-before-it-trusts
    # ADR 0111 decision 19. Each refusal reason has a crafted negative that fails exactly it, beside a passing control
    # (tenantInvite.test.ts through openMemberInvite; inviteCheck.test.ts on checkInvite itself, a crypto gap below),
    # among them the two operator probes that once passed: a key of the operator's choosing under a granter it
    # fabricated (epoch_unlinked) and a grant the owner's retired key signed after their securing (signer_chain_mismatch).
    text: The preview serves the invite with its signer's whole key chain, the anchor grant and the tenant's epoch links above the anchor's epoch. Before it sends anything the invitee's client opens the seal with the code and requires the key the seed derives to be the served invite key (`key_mismatch`) and the seal's signer the served one (`signer_mismatch`); the owner's served chain to pass through the head inside the seal and end at the served owner key (`signer_chain_mismatch`, so a retired owner key is never accepted and a key the owner's securing installed is); the owner's signature over the invite key and its expiry (`bad_signature`) and over the anchor grant (`anchor_invalid`) to verify under that key; and the grant it is handed to be the anchor at the anchor's epoch, or to peel down through the served links to exactly the anchor's key (`epoch_unlinked`). An existing account judges the owner against its pin with that chain and pins the walked head; a carried grant's granter it pinned before is judged against that pin, one it never met is not pinned. A wrong code is the invitee's to retype; any failed check is "ask for a new one", and nothing is posted.
    coverage:
      backend:
        integration: [InvitePlaceholderSliceTest.thePreviewServesAMemberInvitesKeySignatureAndGrant, InviteAnchorSliceTest.thePreviewServesTheSignersChainTheAnchorAndTheLinksBetween]
      web:
        unit: [src/features/tenant/tenantInvite.test.ts, src/views/TenantJoinView.member.test.ts]
        e2e: [src/features/spaces/memberInvite.e2e.test.ts]
  - id: the-accept-holds-the-key-it-checked
    # ADR 0111 decision 23 (inbox #740). Measured red on the untouched tree (tenantInvite.firstOpen.test.ts): after a
    # checked accept, the first open of the tenant opened an epoch-2 grant under an operator's key and a fabricated,
    # first-seen granter, as it did one at the checked epoch under another key. Bites, each red: no hold, the new
    # account's Master Key dropped (in the accept and in the view), the first invite held after a re-check, the hold
    # before the send, the trust marks ignoring the given key, the born Master Key left unwiped.
    text: Once the server took a member's accept, the device holds the tenant key the checks vouched for, at the invite's epoch — the re-checked invite's after `409 invite_changed` — under the vault's Master Key, or for a new account under the Master Key its birth hands back, which is then wiped. Its first open of the tenant then opens the self-grant and a later epoch linked down to that key, and refuses any other (`epoch_unlinked`). A refused accept holds nothing.
    coverage:
      web:
        unit: [src/features/tenant/tenantInvite.firstOpen.test.ts, src/views/TenantJoinView.member.test.ts]
  - id: self-grant-and-join-record
    # ADR 0111 decision 3: the accept is a grant writer (TenantStore.joinAsMember). The join record is written once,
    # at accept (veyq_tenant_profile.sealed_join_record); uc.spaces.verify-identity covers its reading as the anchor.
    text: The newcomer grants itself the tenant key (a grant sealed to its own identity, naming its key), proves the invite with the invite key's signature over (invite, account, identity) — the server refuses another key's proof with 403 `invite_proof_invalid` and writes nothing — and writes a join record (its identity and Secret-Key proof public keys and the owner-signed invite, signed by the invite key and the new identity, sealed under the tenant key bound to tenant and member). The server writes the membership with that grant, the profile with the record, and consumes the invite, nulling its key, grant and anchor; a second accept is refused as a replay.
    coverage:
      backend:
        integration: [InvitePlaceholderSliceTest.acceptingWritesAGrantedMembershipAndTheJoinRecordAndConsumesTheKey, InvitePlaceholderSliceTest.anInviteProofByAnotherKeyIsRefusedAndWritesNothing, GrantWriterSnapshotSliceTest.anInviteAcceptRecordsTheNewcomersKey, InviteAnchorSliceTest.anInviteThatEndsDropsItsAnchor]
      web:
        unit: [src/features/tenant/tenantInvite.test.ts, src/views/TenantJoinView.member.test.ts]
        e2e: [src/features/spaces/memberInvite.e2e.test.ts]
  - id: an-accept-names-the-signer-key-it-checked
    # ADR 0111 decision 20: closes the race in which the owner's securing lands between the newcomer's check and its
    # accept, which would leave a join record naming a retired key with no endorsement.
    text: The accept names the owner key the newcomer's join record carries (`signerIdentityDigest`, SHA-256 of that bundle), and the server refuses it unless it is the invite's stored signer key, on the member accept and on register-and-accept alike (409 `invite_changed`, nothing written; an accept without it is malformed). The client then re-reads the preview and re-runs the checks once with the invite key and the link facts it kept — no code asked for again — and sends once more naming the new key; a second refusal, a re-read that no longer checks, or one this account's pins refuse ends the accept. The server records the invite's signer as the owner who rooted the join, and a rejoin drops the previous endorsement.
    coverage:
      backend:
        integration: [InviteAnchorSliceTest.anAcceptNamingAnotherSignerKeyIsRefusedAsInviteChanged, InviteAnchorSliceTest.aMemberAcceptWithoutTheSignerDigestIsMalformed, InviteAnchorSliceTest.theRegisterAcceptRefusesAnotherSignerKeyToo, InviteAnchorSliceTest.anAcceptRecordsWhoRootedTheJoin, InviteAnchorSliceTest.aRejoinRecordsItsNewRootAndDropsTheOldEndorsement]
      web:
        unit: [src/features/tenant/tenantInvite.test.ts, src/views/TenantJoinView.member.test.ts]
  - id: rotation-carries-open-invites
    # ADR 0111 decision 2: an open invite is a placeholder member, so a tenant rotation re-grants it or declares it
    # pending (TenantStore.carryInvites is the grant writer). The server checks presence and the key a grant names,
    # never the owner's signature: whether an invite is genuine is each rotating client's question.
    text: Every rotation of the tenant re-grants the new epoch to each open invite whose owner signature verifies under its signer key and whose signer passes the rotator's anchor check (the chain from the head it pinned for the owner ends at the signer key), and declares the rest pending; the invite's anchor moves to the new epoch only when the invite's signer commits the rotation under the invite's signer key, and any other rotation leaves the owner's grant as the anchor; the server refuses one that leaves an open invite neither re-granted nor declared (409 `rotation_incomplete`) or re-grants one under another key (409 `recipient_key_not_current`), each with nothing stored, and ignores an id that names no open invite. Every tenant member reads the open invites' keys for this, never an email (`listOpenInvites`).
    coverage:
      backend:
        unit: [RotationPolicyTest.refusesARotationThatLeavesAnOpenInviteBehind, RotationPolicyTest.commitsWhenEveryOpenInviteIsReGranted, RotationPolicyTest.aDeclaredPendingInviteCountsAsCarried, RotationPolicyTest.everyOpenInviteMayBeDeclaredPending, RotationPolicyTest.ignoresReGrantsOfInvitesTheScopeDoesNotHold, RotationPolicyTest.anUnknownIdDoesNotStandInForAMissingOne, RotationPolicyTest.aRemovalStillCarriesEveryOpenInvite]
        integration: [InvitePlaceholderSliceTest.aRotationOfTheTenantMustCarryEveryOpenInvite, InvitePlaceholderSliceTest.listOpenInvitesServesEveryMemberAndNoEmail, GrantWriterSnapshotSliceTest.aTenantRotationRecordsTheRotatorsKeyOnEveryInviteItReGrants, MemberInviteManagementSliceTest.aRotationDoesNotBringARevokedInviteBack, MemberInviteManagementSliceTest.anInviteMintedAtAnEpochARotationIsLeavingIsStale, InviteAnchorSliceTest.theAnchorMovesOnlyWithARotationItsSignerCommits, InviteAnchorSliceTest.aSignerRotatingUnderAnotherKeyThanTheInvitesLeavesTheAnchor]
      web:
        unit: [src/features/spaces/scopes.test.ts]
  - id: a-pending-invite-joins-behind
    text: A newcomer whose invite a rotation declared pending holds only the epoch its invite carries, a key the rotation replaced — its join record sealed under it is refused stale_epoch with nothing born (ADR 0115 decisions 3 and 8) until the invite carries the current epoch; the narrow grant delivery — for memberships behind the epoch only — brings a behind membership current, while a newcomer at the current epoch leaves nothing to deliver.
    coverage:
      backend:
        integration: [MemberAddSliceTest.aNewcomerOfAPendingInviteSealsNoJoinRecordUnderAReplacedKey, MemberAddSliceTest.memberRegisterJoinsWithItsSelfGrantAndNothingIsDelivered, TasksSliceTest.grantDeliveryOriginatedOnABehindMembershipThenClaimedAndCompletedIdempotently]
      web:
        unit: [src/features/tasks/grantDeliveryWorker.test.ts]
gaps:
  crypto: >-
    `src/invite.conformance.test.ts` pins the invite key derivation and the owner's `invite-key` signature
    (`#invite_key`), the code's Argon2id KEK and the link's seal and encoding (`#invite_link`, v2 with the owner's
    head), the invitee's checks, and the accept proof and join record with both signatures (`#join_record`), each
    vector from an independent Python implementation; `src/inviteCheck.test.ts` gives `checkInvite` each refusal
    reason of ADR 0111 decision 19 with its control, and the epoch-link peel. `packages/crypto`'s job has never
    executed, so ADR 0040 admits none of its suites; on the first run whose log shows them executed, the suites go
    under `invite-holds-a-signed-key-and-a-grant`, `invite-sealed-under-a-code`, `invitee-checks-before-it-trusts` and
    `self-grant-and-join-record`.
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses/expenses-pot.spec.ts`) drives `member-invite-and-onboard` on
    its way to the Expenses pass: a tenant owner sets the space's mail, invites a fresh address, and the invitee
    joins from the mailed link. tests/e2e/tests/features/account/join-profile-picture.spec.ts walks the same
    invitation. Green only in local runs of the lane (the V1 heavy stage), and ADR 0040 admits `stack` refs only once
    a CI run's log shows the suite executed.
