useCase: uc.spaces.remove-tenant-member
feature: spaces
title: Remove a member from a tenant (with the group orphan rule)
# cr-0091 delivers the removal cascade end-to-end: backend (the removeTenantMember handler + store cascade —
# enumerate the target's tenant footprint, delete shared, orphan transfer-else-tombstone, soft-delete their own
# scopes with membership kept, the tenant last-owner guard) + the web remove action/data layer. Reuses the
# cr-0090 soft-delete/grace/ScopePurge for the target's own scopes. The two-account LIVE smoke (the removed
# member's read-only grace on their own space across two accounts) is tracked in the CR; the owner→member
# remove→drop-out round-trip was verified live (web → real backend → MariaDB).
# cr-0092 closes A4 (the co-shared-group forward-secrecy half): the removal originates a SCOPE_ROTATION job on
# the operator-blind task queue (backend origination + coalescing slice tests) that a remaining group owner
# completes on-device via the cr-0089 rotation crypto (web scopeRotationWorker + its polling); who completes it and
# what a completion must prove moved to uc.spaces.complete-queued-rotation. The three-actor
# forward-secrecy flow (owner-A cuts a member of group G that A doesn't hold → key-holder-B online rotates G
# forward epoch 0→1 → ex-member gone, survivor re-granted) is verified LIVE against a real backend + MariaDB with
# real crypto by scopeRotation.e2e.test.ts (VEYQ_E2E). The SCOPE_ROTATION unauth/non-key-holder boundary used to
# be noted here as covered by ijhttp; http/ was hand-fired IDE tooling that no CI ran and has been deleted
# (ADR 0040) — that boundary is a backend concern and is proven by the backend slice tests.
acceptanceCriteria:
  - id: remove-shared-access
    text: A TenantOwner removes a member → their tenant-scope + co-shared group memberships are deleted (instant 403 on shared content); the tenant content key is NOT rotated (ADR 0025). Owner-gated (403 not_tenant_owner), 404 for a non-member.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.nonOwnerForbiddenAndUnknownMemberNotFound, TenantOwnerGateTest.ordinaryMemberWhoOwnsScopesIsRefusedAtEveryOwnerGatedEndpoint, TenantOwnerGateTest.realRootScopeOwnerStillPasses] }
      web: { unit: [src/features/spaces/members.test.ts] }
  - id: orphan-transfer
    text: A group the removed member was the only accepted owner of that still has other accepted members auto-transfers OWNER to the oldest remaining accepted member (earliest createdAt) — a consent proposal is never handed it, however old — and every open proposal on it expires, the group's queued rotation taking their key away with the owner's; the group carries on, the tenant owner never gains access. "Solely" counts a co-owner's demote that overlaps the removal. The account erasure's cascade applies the same rule.
    coverage:
      backend:
        integration:
          - MemberRemoveSliceTest.soleOwnedGroupWithMembersTransfersToOldestRemaining
          - MemberRemoveSliceTest.aSoleOwnerLeavingHandsTheGroupToTheOldestAcceptedMemberAndItsProposalsExpire
          - AccountErasureSliceTest.anErasedSoleGroupOwnersGroupPassesToTheOldestAcceptedMemberAndItsProposalsExpire
          - OwnerRoleRaceSliceTest.aTenantRemovalOverlappingADemoteLeavesTheGroupAnOwner
        unit: [RemovalPolicyTest.soleOwnedSharedGroupTransfersThenRemovesAndRotates, RemovalPolicyTest.aGroupWithTwoAcceptedMembersIsNoLongerTheTargetsOwn]
  - id: orphan-tombstone
    text: A group with no accepted member besides the removed one is grace-tombstoned (cr-0090 soft-delete → scheduled purge), like a deleted group; its open proposals are deleted, none is made an owner, and nothing rotates — nobody is left to hold a key.
    coverage:
      backend:
        integration:
          - MemberRemoveSliceTest.soloGroupIsGraceTombstonedWithMembershipKept
          - MemberRemoveSliceTest.aSoleOwnerLeavingAGroupWithOnlyAProposalTombstonesItAndTheProposalExpires
          - MemberRemoveSliceTest.aSoleOwnerLeavingAGroupWithOnlyProposalsMakesNoneAnOwnerAndExpiresEveryOne
        unit: [RemovalPolicyTest.soloGroupIsSoftDeletedNotRemoved]
  - id: proposal-target-drops-the-proposal
    text: A removed member who is only proposed to a group loses that proposal as a decline would (A7) — the row goes and the group's rotation is queued, no removal is counted — and the group keeps its own owner; it is never tombstoned or handed on, even when its owner is its only accepted member.
    coverage:
      backend:
        integration: [MemberRemoveSliceTest.aRemovedMemberWhoIsOnlyAProposalNeverReownsNorTombstonesTheGroup]
        unit: [RemovalPolicyTest.aTargetOnlyProposedToAGroupDropsTheProposalAndNeverTombstonesNorHandsOver, RemovalPolicyTest.aProposalRowThatSaysOwnerIsStillOnlyDropped]
  - id: an-accept-never-outlives-the-removal
    text: An accept of a consent proposal that overlaps a removal deciding from that proposal — the group's only accepted owner leaving (the group tombstoned, its proposals expired) or the invitee removed (their proposal dropped) — waits on the group's lock the removal holds and answers 404 invitation_not_found; the accepter is never left a member of the tombstoned group, nor of a group in a tenant that removed them (inbox #599, forced on MariaDB).
    coverage:
      backend:
        integration:
          - RemovalRaceCoreSliceTest.anAcceptOverlappingTheRemovalThatTombstonesItsGroupFindsNoInvitation
          - RemovalRaceCoreSliceTest.anAcceptOverlappingTheInviteesOwnRemovalFindsNoInvitation
  - id: own-scope-grace-read
    text: The removed member's personal scope (and any solo group) is grace-tombstoned but their membership is KEPT — they retain read-only access to read/export their own memories for the grace window, then ScopePurge erases them.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.scopePurgeErasesTheGraceTombstonedOwnScope] }
  - id: last-owner-guard
    text: The last tenant OWNER cannot be removed (a tenant keeps ≥1 owner); the action is rejected (409 last_owner).
    coverage:
      backend: { integration: [MemberRemoveSliceTest.lastTenantOwnerCannotBeRemoved] }
  - id: coshared-group-rotation
    text: >
      A removed member's co-shared GROUPs each queue a SCOPE_ROTATION job on the operator-blind task queue (the
      removing owner isn't necessarily a key-holder there, so can't rotate synchronously — cr-0092): the origination
      half. A second removal joins the group's still-unclaimed job (one rotation for many removals); NO job for the
      tenant scope (ADR 0025 — ACL-revoke) or the member's own/soft-deleted scopes. Who completes the job and what
      its completion must prove is uc.spaces.complete-queued-rotation. Closes A4.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.removalQueuesRotationOnlyForCoSharedGroupsNotOwnScopesOrTenant, MemberRemoveSliceTest.secondRemovalCoalescesIntoTheOneLiveRotationJob] }
      web: { e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: operator-blind
    text: The server only deletes/soft-deletes opaque rows + flips a lifecycle timestamp — never a key or a name; the tenant key is not rotated.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.scopePurgeErasesTheGraceTombstonedOwnScope] }
  - id: removal-counts-and-can-turn-off-tenant-links
    text: >
      Every scope a tenant removal cuts — the TENANT scope and each co-shared GROUP — counts the removal in its
      transaction, so a link minted before it that carries a recovery copy is renewed, never re-activated (ADR 0075
      point 4). With revokeLinks=true the removal also turns off and marks every enabled share of the TENANT scope,
      whoever made it — not a co-shared group's; a refused removal turns nothing off. The confirmation's opt-in is
      unchecked by default and, unticked, the request carries no parameter (A5).
    coverage:
      backend: { integration: [ShareSharedScopeCoreSliceTest.everyRemovalPathCountsOnTheScopesItCuts, ShareSharedScopeSliceTest.aTenantRemovalWithRevokeLinksTurnsOffEveryTenantLinkAndNoGroupLink] }
      web: { unit: [src/features/spaces/TenantMembersPanel.test.ts, src/features/spaces/members.test.ts] }
  - id: owner-turns-off-every-link
    text: A TenantOwner turns off every enabled public share of the tenant space with no removal (revokeScopeShares), each marked so it comes back only by re-issue; the answer counts them; a member who does not own the space is refused 403 not_scope_owner and nothing moves (A6).
    coverage:
      backend: { integration: [ShareSharedScopeSliceTest.aTenantOwnerSwitchesOffTheTenantsLinks] }
      web: { unit: [src/features/spaces/TenantMembersPanel.test.ts] }
  - id: owner-rekeys-the-tenant
    text: >
      A TenantOwner gives the tenant a new lock (ADR 0025 § 2) as a plain rotation of the TENANT scope, with no
      removesUserId: on its own (A9), or opted into a removal (A8, unchecked by default), where the removal lands first
      and the rotation follows over the directory read after it with the removed member dropped by the owner's own
      choice — never wrapped to them — then the node re-key. The server takes it with anchored members re-granted, the
      rest and the open invites re-granted or declared pending, refuses one that leaves a member out (409
      rotation_incomplete) and a non-owner's (403 not_scope_owner); a refused removal rotates nothing, and a rotation
      that fails after a removal says the lock is not in.
    coverage:
      backend: { integration: [TenantRekeySliceTest.anOwnerReKeysTheTenantAfterARemovalGrantingWhoRemainsAndDeclaringTheRest, TenantRekeySliceTest.aMemberWhoIsNotAnOwnerCannotReKeyTheTenant] }
      web: { unit: [src/features/spaces/TenantMembersPanel.test.ts, src/features/spaces/members.test.ts, src/shared/ui/ConfirmDialog.test.ts] }
