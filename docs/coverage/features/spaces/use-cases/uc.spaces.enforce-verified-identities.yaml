useCase: uc.spaces.enforce-verified-identities
feature: spaces
title: Actively verify a member's identity (safety number)
# ADR 0028 Decision 3 in the form ADR 0111 decisions 12-15 gave it: the compare carries the chain code, and a match is a
# signed verification in the tenant every member reads, no longer a private mark in the pin store. Strict mode, which
# this file once carried as a planned criterion, lives on uc.spaces.require-verified-identities: the coverage model has
# no partially built file (ADR 0040). A real-browser pass would be recorded in the use-case, not here: a browser run is
# no CI run.
acceptanceCriteria:
  - id: show-my-safety-number
    text: A member's own profile shows their own safety number (6x5 digits over the vector-pinned fingerprint of their vault's identity key), their chain code (10 digits of their key-chain head) and a QR of both whose payload is the veyqid:2 marker, the 32-byte fingerprint digest and the 32-byte head, and nothing else - far below the jsqr bound. The chain code is shown only when the chain the server serves ends at the vault's identity; otherwise the page says so and shows neither.
    coverage:
      web: { unit: [src/core/people/PersonSafetyNumber.test.ts, src/core/people/PersonProfile.test.ts, src/features/account/safetyCode.test.ts] }
  - id: safety-number-verify
    text: On another member's profile the caller compares the safety number and chain code of the key and head this device anchors in the tenant - by scanning the other's QR (digest AND head against the anchored ones) or reading the digits aloud. A match writes the caller's verification; a code of a different key, of the same key at another head (a withheld step), or "they don't match" warns and writes nothing; a QR that is no safety code is said as such, and a veyqid:1 code is said to come from an app to update; neither is accepted.
    coverage:
      web: { unit: [src/core/people/PersonSafetyNumber.test.ts, src/features/account/safetyCode.test.ts] }
  - id: a-verification-is-the-verifiers-own-signed-row
    # ADR 0111 decision 12. The server half: the row is keyed by the caller, never by the body.
    text: A match signs, with the caller's identity, the statement that in this tenant the caller at their head confirmed the subject at the subject's head, seals it under the tenant's current epoch bound to tenant, verifier, subject and epoch, and writes it into the caller's own row - the verifier is always the authenticated caller, a second write replaces the first, a verification of oneself, of a non-member or at an epoch the tenant has not reached is refused, and an outsider reads and writes nothing (404). If the directory moved the key or head under the compare (IdentityMovedError) or the tenant no longer anchors it (IdentityUnanchoredError), nothing is signed.
    coverage:
      web: { unit: [src/features/account/tenantTrust.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
      backend:
        integration:
          - VerificationSliceTest.theVerifierIsAlwaysTheCallerAndASecondPutReplacesTheFirst
          - VerificationSliceTest.aVerificationOfOneselfIsRefused
          - VerificationSliceTest.aSubjectWhoIsNoMemberOfTheTenantIs404MemberNotFound
          - VerificationSliceTest.anEpochBeyondTheTenantScopesCurrentOneIs400
          - VerificationSliceTest.aMissingEpochIs400AndNotEpochZero
          - VerificationSliceTest.anOutsiderGetsTheMembershipNotFoundOnReadAndOnWrite
  - id: verified-by-counts-for-every-member
    # ADR 0111 decisions 12 and 15. Each negative in tenantTrust.test.ts has its control on the same row.
    text: Every member of the tenant reads its verifications and counts one only while it opens at its slot, names the subject's current head and verifies under the verifier's current key at the verifier's current head, the verifier anchored in the tenant; a row moved to another subject's slot neither opens nor counts. The profile reads "Verified" and "Verified by {names}." (the caller as "you") or "Not verified", with "New" while this account first saw them under 14 days ago; the tenant's and groups' member lists badge "Verified", "New" and the anomaly's "Can't confirm this key", and "not verified" shows nothing there.
    coverage:
      web: { unit: [src/features/account/tenantTrust.test.ts, src/features/spaces/MemberTrustBadge.test.ts, src/features/spaces/TenantMembersPanel.test.ts, src/features/spaces/GroupMembersPanel.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
      backend:
        integration:
          - VerificationSliceTest.aMembersVerificationIsReadByEveryMemberOfTheTenantTheWriterIncluded
          - VerificationSliceTest.theFiltersNarrowAndThePagesTileTheSetInVerifierThenSubjectOrder
  - id: a-rotation-drops-verified-and-a-retired-key-adds-nothing
    # ADR 0111 decision 13 (re-signing). The thief case: a statement the verifier's RETIRED key signs after their
    # rotation does not count; re-signed by the new key it does (tenantTrust.test.ts).
    text: When the subject's key chain moves to a new head, every verification of the old head stops counting - "Verified" drops and returns only through a new compare, while the profile shows "New identity, signed by their previous key". When the verifier secures their account, their verifications are re-signed by the new key; a statement signed by a retired key counts nowhere. A key the chain does not reach reads as an anomaly in the member lists and on the profile, verified or not, with no compare and no accept.
    coverage:
      web: { unit: [src/features/account/tenantTrust.test.ts, src/features/account/rotation/rotateKeys.test.ts, src/core/people/PersonSafetyNumber.test.ts, src/features/spaces/MemberTrustBadge.test.ts] }
  - id: who-is-who-per-tenant
    # Main flow 5 (inbox #562). Each negative in peopleOverview.test.ts has its control on the same predicate; the anomaly
    # rule is held twice (the read builds an anomaly's entry without a count, the page shows "verified by" only beside
    # "Verified"), and each layer's test is bitten with the other held off.
    text: Settings > Shared space > Who's who lists every other member of the active tenant but pending proposals - anomalies first, then by name - each with one state, "Can't confirm this key" with its note, "Verified" or "Not verified", and "New" while this account first saw them under 14 days ago, "Verified by {names}." (the caller as "you"), "New identity, signed by their previous key, on {date}." while that rotation is under 14 days old, and the replacement note. A verification counts only for a member this device anchors, at their current head - an anomaly never reads as verified, a verification of a head the subject rotated away from does not count - and a member whose check failed for a request shows no state. Every row the caller has not verified opens the profile's compare. A pin store this device refuses is said with the way to start it over; a tenant it cannot open is said. Nothing new reaches the server - the reads are the member list's and the profile's, and a key chain is read for a rotation's date only past a genesis head.
    coverage:
      web: { unit: [src/features/account/peopleOverview.test.ts, src/features/spaces/PeopleOverviewPanel.test.ts, src/views/SettingsHubView.test.ts] }
      backend:
        integration:
          - VerificationSliceTest.aMembersVerificationIsReadByEveryMemberOfTheTenantTheWriterIncluded
  - id: verifications-leave-with-the-member
    text: A member's removal from the tenant deletes every verification row there naming them, as verifier or as subject; an erased account and a deleted tenant leave no row.
    coverage:
      backend:
        integration:
          - VerificationSliceTest.aMemberRemovedFromTheTenantLeavesNoRowThereAsVerifierOrSubject
          - VerificationSliceTest.anErasedAccountLeavesNoRowAsVerifierNorAsSubject
          - VerificationSliceTest.aDeletedTenantLeavesNoRow
gaps:
  crypto: >-
    `src/verification.conformance.test.ts` pins the verification statement, its signature and record encoding
    (`#verification`), its field seal (`field_seal['member-verification']`) and the chain code
    (`fingerprint.chain_code`), each vector from an independent Python implementation. `packages/crypto`'s job has never
    executed, so ADR 0040 admits none of its suites; on the first run whose log shows them executed, the suite goes under
    `a-verification-is-the-verifiers-own-signed-row` and `show-my-safety-number`.
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/safety-number-qr.spec.ts`, inbox #491's last proof) drives
    `show-my-safety-number`, `safety-number-verify` and `verified-by-counts-for-every-member` in Chromium against the
    release candidate's two images installed through `veyqctl` (ADR 0090), each test tagged with its criterion. The scan
    needs a camera, so the scanning member's browser is launched with Chromium's file-backed fake camera
    (`--use-file-for-fake-video-capture`), which plays a video made from the screenshot of the QR the other member's own
    profile renders, pixel for pixel - the app's own decode (jsQR) and compare decide. A QR of a different identity (the
    scanning member's own `veyqid:2` code) is refused as different keys and writes nothing: the member's other device
    still reads "Not verified" on the profile and in Who's who; the owner's own QR marks them verified, read back there as
    "Verified" and "Verified by you.". Bitten: with `compareScan` answering `match` for every `veyqid:2` code, the refusal
    test is red on the verification it then wrote (2026-10-29). Green only in local runs of `scripts/run_stack_e2e.py`, and
    ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed. A pass with a real phone's camera
    stays welcome but is no longer owed.
