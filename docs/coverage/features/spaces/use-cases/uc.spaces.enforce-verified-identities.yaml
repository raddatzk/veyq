useCase: uc.spaces.enforce-verified-identities
feature: spaces
title: Actively verify a member's identity (safety number)
# Built by cr-identity-verification (ADR 0028 Decision 3, owner decisions 2026-10-14). Strict mode, which this file
# used to carry as a planned criterion beside the ceremony, moved to uc.spaces.require-verified-identities: the
# coverage model has no partially built file (ADR 0040), so the split is what lets the ceremony's criteria carry refs.
# Every web ref below was bitten (the CR's retrospective names each injection). The real-browser pass of the ceremony
# is recorded in the use-case, not here: a browser run is no CI run.
acceptanceCriteria:
  - id: show-my-safety-number
    text: A member's own profile shows their own safety number (6x5 digits over the vector-pinned fingerprint of their vault's identity key) and a QR of it whose payload is a versioned veyq marker plus the 32-byte fingerprint digest and nothing else - small enough to stay far below the jsqr bound.
    coverage:
      web: { unit: [src/core/people/PersonSafetyNumber.test.ts, src/core/people/PersonProfile.test.ts, src/features/account/safetyCode.test.ts] }
  - id: safety-number-verify
    text: On another member's profile the caller compares the safety number of the key they would trust (the pin's, else the directory's) - by scanning the other's QR (the scanned digest against that key's digest) or reading the digits aloud. A match marks the member verified; a code of a different key or "they don't match" warns and writes nothing; a QR that is no safety code is said as such and never accepted.
    coverage:
      web: { unit: [src/core/people/PersonSafetyNumber.test.ts, src/features/account/safetyCode.test.ts, src/features/account/identityPins.test.ts] }
  - id: verify-pins-an-unpinned-member
    text: Verifying a member with no pin pins the compared key already verified in one sealed write (the store's merge on a 409); a pin of another key that appeared meanwhile throws IdentityMovedError, writes nothing, and the profile says so and shows the key the store now holds. Nothing else pins more than before - a profile view pins nothing.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
  - id: verified-shows-in-member-lists
    text: A verified member reads "Verified" on their profile and in the tenant's and groups' member lists, beside the existing "Key changed"; a pinned or unpinned member carries no trust badge.
    coverage:
      web: { unit: [src/features/spaces/MemberTrustBadge.test.ts, src/features/spaces/TenantMembersPanel.test.ts, src/features/spaces/GroupMembersPanel.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
  - id: verified-contact-key-change-is-louder
    # Rewritten by cr-secure-the-account phase 3 to the built web trust layer (ADR 0111 decisions 9, 15); phase 6 aligns the use case.
    text: A verified contact whose key chain moves to a new key the chain reaches from the pinned head is pinned at the new head as pinned - verified drops, and returns only through a new compare on the profile, which then shows the new key's number and "New identity, signed by their previous key". A key the chain does not reach reads as an anomaly ("Can't confirm this key") in the member lists and on the profile, verified or not, with no accept.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/features/spaces/MemberTrustBadge.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
gaps:
  backend: "No backend surface: verification is client-only and its one write is the pin store's existing sealed PUT, whose wire shape uc.spaces.verify-identity covers (IdentityPinsSliceTest)."
