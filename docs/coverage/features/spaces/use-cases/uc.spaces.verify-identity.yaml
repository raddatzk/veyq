useCase: uc.spaces.verify-identity
feature: spaces
title: Trust-on-first-use, then follow a contact's key chain, and surface a key it does not reach
# Split 2026-08-25 (inbox #128) from what this file used to also cover: the proactive verify ceremony (QR /
# read-aloud compare -> mark verified) lives on uc.spaces.enforce-verified-identities (built by
# cr-identity-verification) and strict mode on uc.spaces.require-verified-identities (planned). Everything below this file
# still claims IS built and tested, so the split also closes a second, quieter hole `status: planned` had been
# hiding: three of these four criteria carried ZERO coverage refs before this split, riding on the file-wide
# `planned` flag even though cr-0098/cr-0099 built and unit-tested them. Only the changed-key review had a ref.
acceptanceCriteria:
  - id: tofu-pin-on-first-use
    text: The first time a client wraps to a contact's identity key it pins the contact's key-chain head with the fingerprint hash of the full identity public bundle (kem+sign) keyed by userId and proceeds — trust-on-first-use. An entry holds the head, the index of its step, the first-seen time and a replacement mark, and no verified state. The pin store is one entry per pin sealed under the Master Key at an opaque id, under a sealed head, synced across the account, account-global (one pin per contact across tenants). The server sees opaque ids and ciphertext, never a userId or key.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts] }
      backend: { unit: [IdentityPinsSliceTest.bornEmptyStoreReadsNullBlobRevisionZero, IdentityPinsSliceTest.firstWriteRoundTripsAndBumpsToRevisionOne, IdentityPinsSliceTest.storeIsPerAccountNotShared] }
  - id: change-surfaced-not-trusted
    text: A served key is trusted only when the contact's key chain reaches it from the head this account pinned (both signatures of every step, ADR 0111 decision 7); anything else - a rollback to an older head, a step not signed by the retired Secret Key, an invented prefix naming the pinned identity - is an anomaly. In the UI it is a notice with no accept; at a rotation the member is declared pending; on the human-less grant-delivery worker it is a block (no K_SC wrap) + a job decline `identity_unanchored` back to the server (do not re-offer this account). A legitimate rotation is always signed, so it never reaches a human.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/features/tasks/grantDeliveryWorker.test.ts] }
      backend: { unit: [TasksSliceTest.declineReleasesJobToOtherWorkersButNeverBackToTheDecliner] }
  - id: a-rotated-key-is-followed-by-its-chain
    # Was `changed-key-review`, a human accept that no longer exists. Bites in identityPins.test.ts: skip the proof
    # signature in the walk → the identity-only step is accepted; anchor on the identity alone → the prefix attack is
    # accepted.
    text: A key the chain reaches from the pinned head moves the pin to the new head (every verification of the old head stops counting) with no review; a key it does not reach is an anomaly with its reason ("This person's key doesn't follow from the one you knew") and no accept; a grant signed by a retired key of the chain opens only at an epoch at or below this device's floor (granter_key_retired above it); and the declines of a delivery against an account clear when that account's chain advances (the account's publish clears them).
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/features/spaces/grantTrust.test.ts, src/features/tasks/grantDeliveryWorker.anchor.test.ts] }
      backend: { integration: [RotationSliceTest.thePublishClearsDeclinesTargetingTheRotator] }
  - id: operator-blind-pinning
    text: Every pin is a Master-Key-sealed entry at an opaque id, so the operator never learns who pinned whom. It does learn how many pins an account holds, as it always could (ADR 0104 decision 5). (Who verified whom is not in the pin store; uc.spaces.enforce-verified-identities says what the server sees of it.)
    # Real but indirect: no test asserts the negative (that what the server stores names no contact) as its own
    # property. Coverage here is inferred — the backend refs prove the wire shape is opaque ids, sealed entries and a
    # sealed head, the web refs prove what an entry holds — not a dedicated
    # "operator learns nothing" test. Named honestly rather than stretched; a stronger direct test is a genuine
    # gap, not a citation problem. Until ADR 0104 this text also claimed the count was hidden; the single blob's length
    # (29 + 1,771 x n bytes) had always shown it, so the claim was corrected, not defended.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts] }
      backend: { unit: [IdentityPinsSliceTest.bornEmptyStoreReadsNullBlobRevisionZero, IdentityPinsSliceTest.firstWriteRoundTripsAndBumpsToRevisionOne] }
  - id: pin-store-never-goes-backwards
    text: A device refuses a pin store older than one it has held, a missing store after it held one, and a store that does not open — none is read as empty. The refusal holds before every read and before every write (the master-key rotation's re-seal included), is named (trust_state_rolled_back / trust_state_unreadable), and pauses the grant-delivery worker rather than declining the job.
    # ADR 0028 Decision 7, cr-trust-state-never-goes-backwards. Web only by construction: the marks never leave
    # the device, and the server's half ({blob, revision}) is unchanged. The three live defects (wipe, unopenable,
    # rollback reinstating a retired key) were red on the untouched tree; each negative anchors on its code and
    # has a control on the same served payload. `trustMarks.test.ts` pins the marks as a store (a maximum, one
    # slot per account); the worker's pause and the notices that name a refusal are pinned where they live.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/features/account/trustMarks.test.ts, src/features/tasks/grantDeliveryWorker.test.ts, src/features/spaces/useMemberDirectory.test.ts, src/app/activeSpace.test.ts] }
  - id: a-key-holder-pins-past-the-old-ceiling
    # ADR 0104, inbox #491: the single 1 MiB blob refused the 445th pin (400 invalid_request, swallowed by the
    # grant-delivery poller). Bitten: without the account lock the racing first writes answered a 500 (the primary
    # key); with the entries written before the head's compare-and-set the stale write's put landed; without the cap a
    # 25,001st entry landed. The 1,000-member run on the dev stack is a hand proof, not a coverage surface.
    text: Each pin is one entry sealed under the Master Key at an opaque id only the account computes (HMAC of the contact's userId under a Master-Key-derived key), and the store's head binds the whole set by a digest. A pin, a move along the chain and a replacement write one entry plus the head in one compare-and-set on the head's revision — a stale revision lands nothing of the write, and two racing first writes answer one success and one stale_revision — so a key-holder's store grows past the old 1 MiB single-blob ceiling (444 pins) and one write stays the size of one entry. A store holds at most 25,000 entries, the bound of the one write that carries them all.
    coverage:
      backend:
        integration:
          - IdentityPinsSliceTest.aWriteOf25000EntriesLandsAndTheStoreHoldsNoMore
          - IdentityPinsSliceTest.staleRevisionAfterAWriteIsConflictAndNothingOfItLands
          - IdentityPinsSliceTest.twoRacingFirstWritesAnswerOneWrittenAndOneStale
          - IdentityPinsSliceTest.theListingPagesInPinIdOrderByKeyset
          - IdentityPinsSliceTest.aContradictoryWriteIsRefusedAndStoresNothing
      web: { unit: [src/features/account/identityPins.test.ts] }
  - id: a-withheld-or-rolled-back-entry-is-refused
    # ADR 0104 decision 4, ADR 0028 Decision 7 per entry. Bitten: with the digest check skipped, the withheld, added,
    # rolled-back and moved cases each read as a store (the moved one only as unreadable — the seal's refusal, not the
    # digest's, which is why each negative anchors on trust_state_rolled_back); with the id derivation unchecked, the
    # entry sealed for another contact opened.
    text: A device recomputes the head's set digest over the listed entries and refuses (trust_state_rolled_back) a withheld, added, rolled-back or moved entry while the head did not move; a head that moved between its read and the listing is read again, not refused. An entry whose userId does not derive its id, and a listing that does not advance, are refused as unreadable. The entries are listed once per head revision; a later read under the same head is the head alone, which the marks still guard.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/features/account/trustReset/noServerReachesTheReset.test.ts] }
      backend: { integration: [IdentityPinsSliceTest.theListingPagesInPinIdOrderByKeyset, IdentityPinsSliceTest.storeIsPerAccountNotShared] }
  - id: the-join-record-anchors-a-member-per-tenant
    # ADR 0111 decisions 12, 15 and 21, built. Bites named in tenantTrust.test.ts / identityPins.test.ts: accept a non-owner
    # signer → its negative reds; drop the "must install BOTH keys" check → the other-proof-key negative reds.
    text: In a tenant a wrap, and a group grant from the active tenant, ask the member's standing there first. A member is anchored when their join record opens under the tenant key, verifies owner → invite → newcomer, names as signer another member the server lists as an owner, and carries a signer key anchored in the tenant in turn — the owner's served current key, or a retired key of their chain at or after their join only with the owner's `join-endorsement` of the record as stored, verifying under that current key (ADR 0111 decision 21); their chain is then walked from the step that installs the identity AND proof key the record names, and only a key at or after it counts. An owner with no join record is a root, trusted on first use by the pin. A non-owner without a join record, a record whose invite key a non-owner or nobody signed, a pending proposal, someone the directory does not list and a cycle of signers are anomalies with no chain read and no pin — never wrapped to (the delivery worker declines, a rotation declares pending). A tenant this device cannot read is an anomaly for a wrap and leaves a grant's granter to the pin alone.
    coverage:
      web: { unit: [src/features/account/tenantTrust.test.ts, src/features/account/identityPins.test.ts, src/features/tasks/grantDeliveryWorker.anchor.test.ts, src/features/tasks/grantDeliveryWorker.test.ts, src/features/spaces/scopes.test.ts, src/features/spaces/grantTrust.test.ts] }
  - id: a-pin-off-the-anchored-chain-is-replaced
    # ADR 0111 decision 15 and § What stays open. The index in the pin entry is what makes the rollback case an anomaly.
    text: A pinned head that is not on the chain a member's join record anchors is replaced - the pin moves to the anchored head, marked, and the profile says "The key you saw before wasn't theirs. Their invitation confirms this one." - only when that chain is at least as long as the pinned one was; a shorter chain is an anomaly (a possible rollback), a head pinned unread at an invite's accept is no replacement either, and a pinned head on the chain must carry the pinned key.
    coverage:
      web: { unit: [src/features/account/identityPins.test.ts, src/core/people/PersonSafetyNumber.test.ts] }
  - id: a-refused-pin-store-is-started-over-only-by-the-user
    text: A refused pin store can be started over only by the user, on a device, after a confirmation that names the cost (every contact first-seen again, a key that changed meanwhile accepted as new); no server response reaches it. It writes the empty store one revision above the served one, never over a copy that opens, and sets this device's mark to the revision it wrote — the one place a mark goes down. The residual is stated, not closed — a server can withhold the store until the user resets it, now visibly and with consent.
    # ADR 0028 Decision 7's way back (inbox #192). Bitten: swapping the mark's set for a raise reddened the
    # rolled-back case (the reset's own write was refused); an injected write on the refusal path reddened the
    # no-server-reaches-it negative, whose control serves a readable store to the same paths and sees the writes.
    # The import restriction (`veyq/trust-reset-one-door`, src/web/eslint.config.js) is not a coverage surface.
    coverage:
      web:
        unit:
          - src/features/account/trustReset/trustReset.test.ts
          - src/features/account/trustReset/TrustResetDialog.test.ts
          - src/features/account/trustReset/noServerReachesTheReset.test.ts
          - src/views/SettingsHubView.test.ts
