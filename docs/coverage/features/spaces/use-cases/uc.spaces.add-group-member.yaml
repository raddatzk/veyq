useCase: uc.spaces.add-group-member
feature: spaces
title: Add a member to a group
# cr-0086 delivers resolve/admit; grant-delivery of K_SC is the shared cr-0076/0079 primitive. cr-0093 makes that
# delivery epoch-aware: the completion states the epoch it sealed and the server records exactly that as
# grantedEpoch, refusing a non-current one (so a member added to an already-rotated group reads post-rotation
# content) and re-delivering members left stale by a rotation (§E2) — backend slice tests + a live
# read-after-add-to-rotated-group e2e.
acceptanceCriteria:
  - id: resolve-username
    text: A tenant-scoped username resolve returns an existing tenant member's identity public key (not a global user-search); an unknown/foreign handle is a generic not-found.
    coverage:
      backend: { integration: [ScopesSliceTest.addGroupMemberUnknownUsernameIs404] }
      web: { unit: [src/features/spaces/members.test.ts] }
  - id: admit-group-member
    text: The GroupOwner adds a resolved member → the server records a grant-less GROUP membership (role=MEMBER); no key crosses the wire, and the group name stays sealed. A non-owner caller is rejected; adding an existing member is a no-op.
    coverage:
      backend: { integration: [ScopesSliceTest.addGroupMemberByUsernameRecordsGrantlessMember, ScopesSliceTest.addGroupMemberByANonMemberOfTheGroupIs404, ScopesSliceTest.addGroupMemberAlreadyMemberIs409] }
      web: { unit: [src/features/spaces/members.test.ts] }
  - id: auto-deliver-group-grant
    text: The admitted member lands grant-less (hasGrant=false, "awaiting access") in the group directory — the input the grant-delivery reconciler (cr-0076) picks up to wrap K_SC, first-online-wins; the delivery wrap itself is the shared primitive's coverage (cr-0076/0079).
    coverage:
      backend: { integration: [ScopesSliceTest.addGroupMemberByUsernameRecordsGrantlessMember] }
  - id: epoch-aware-delivery
    text: >
      Delivery is epoch-aware (cr-0093): grant-delivery wraps the CURRENT epoch key E_current and its completion
      states that epoch (the grant is sealed bound to it, ADR 0072); the server records exactly the stated epoch as
      grantedEpoch and refuses one that is not the scope's currentEpoch (409 stale_epoch — nothing written, the lease
      released without spending an attempt, the job re-runs) — so a member added to an already-rotated group reads
      post-rotation content immediately (not stranded peeling E_current as E_0). A member left STALE by a rotation
      (grantedEpoch < currentEpoch — e.g. a re-wrap that failed, en.spaces.scope-key-rotation §E2) is re-originated
      by the reconciler and re-delivered at the current epoch. Idempotent + first-online-wins.
    coverage:
      backend: { integration: [TasksSliceTest.grantDeliveryIntoARotatedScopeRecordsTheDeliveredEpoch, TasksSliceTest.grantDeliveryStatingAnEpochBelowCurrentIsRefusedAndWritesNothing, TasksSliceTest.staleMemberIsReconciledAndReDeliveredAtTheCurrentEpoch] }
      web: { e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: operator-blind-group-add
    text: The server sees only the membership row, identity public keys, and opaque grant ciphertext — never K_SC, never the group's plaintext name; the add response never exposes email.
    coverage:
      backend: { integration: [ScopesSliceTest.addGroupMemberByUsernameRecordsGrantlessMember] }
  - id: admission-needs-the-group-key
    # ADR 0020 move 6 / ADR 0014: the group add — direct or a consent proposal — carries a tag the owner's client
    # computed under the group's current epoch key, bound to the resolved target's account; a worker declines
    # `admission_unverified` on a mismatch, on a tag from before a rotation, or on none. The server stores the tag
    # blind and only refuses one stated at an epoch a rotation already left.
    text: A group member receives the group key only if their admission carries a tag made with the group's current epoch key and bound to their account; an add without the vault is never delivered to.
    coverage:
      backend:
        integration: [ScopesSliceTest.aGroupAddTaggedAtAStaleEpochIsRefused]
      web:
        unit: [src/features/tasks/grantDeliveryWorker.test.ts, src/features/spaces/useMemberDirectory.test.ts]
        e2e: [src/features/tasks/scopeRotation.e2e.test.ts]
  - id: admission-refusal-lasts-as-long-as-its-admission
    # ADR 0020 move 6 § What a refusal lasts: an `admission_unverified` decline excludes that key-holder's account
    # from the job, so it may record only a judgment of the target. A tag ahead of the worker's epoch (its key is
    # behind) pauses instead; a rotation that re-tags the admission lifts the declines its old tag earned, never an
    # `identity_changed` one, never a dropped admission's.
    text: A member is never kept from the group key by a key-holder whose own key was behind their admission, and a rotation that re-admits them makes every key-holder judge their admission again.
    coverage:
      backend:
        integration: [ScopesSliceTest.aReTaggedAdmissionLiftsTheAdmissionDeclinesItsOldTagEarned]
      web:
        unit: [src/features/tasks/grantDeliveryWorker.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses-pot.spec.ts`) drives `auto-deliver-group-grant` on
    its way to the Expenses pass: a group's owner adds a tenant member by username, re-entering the group delivers
    the key, and the member's sidebar then lists the group. Green only in local runs of the lane (the V1 heavy
    stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed.
