useCase: uc.spaces.set-profile-picture
feature: spaces
title: Set your profile picture in a space
# Decided 2026-10-13 (ADR 0084). Contracts, crypto and backend are built and covered below; the web is not, so the
# use-case stays `planned` until its gap closes and the flip (drop `status`, fill the web refs) is mechanical.
status: planned
acceptanceCriteria:
  - id: picture-sealed-on-device-constant-length
    text: The picture is cropped 1:1, encoded to a 128 px WebP, padded to a constant length and sealed on the device under `K_tenant` with the `member-avatar` purpose at (tenant scope, own user id); the server stores the blob verbatim, every blob has the same length, and the contract `maxLength` equals that sealed constant.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.theContractLengthIsTheSealedConstantsBase64Length
          - MemberAvatarSliceTest.theLengthBoundIsEnforcedAtTheWire
  - id: set-clear-and-version
    text: "`PUT` overwrites and bumps `avatar_version`, `DELETE` clears and bumps and is idempotent; the directory and profile carry only the integer `avatarVersion`, never the bytes."
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.anOverwriteBumpsTheVersionAndReplacesTheBlob
          - MemberAvatarSliceTest.clearRemovesThePictureBumpsAndIsIdempotent
          - MemberAvatarSliceTest.overlappingSetsEachBumpTheVersionOnce
          - MemberAvatarSliceTest.theDirectoryCarriesTheVersionAndNeverTheBytes
  - id: members-only-versioned-read
    text: "`getMemberAvatar` is tenant-membership gated (a non-member gets the ADR 0042 404), answers 200 with an `ETag` from the version, 304 on a matching `If-None-Match`, 404 `avatar_not_found` when none; no share endpoint serves it."
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.setThenReadRoundTripsWithAnETagAndPrivateCaching
          - MemberAvatarSliceTest.aMatchingIfNoneMatchIs304WithNoBodyAndAStaleOneIs200
          - MemberAvatarSliceTest.aMemberWithNoPictureIs404AvatarNotFound
          - MemberAvatarSliceTest.aNonMemberOfTheTenantGetsTheMembershipNotFoundWhetherOrNotAPictureExists
          - MemberAvatarSliceTest.aMembersPictureOfOneTenantIsNotReadableThroughAnother
  - id: edit-on-own-profile-only
    text: The same component edits name and picture in Settings and on one's own profile page, and renders no edit control on anyone else's.
  - id: set-at-join-or-after-first-unlock
    text: A tenant owner seals name and picture together at accept; a joining member, holding no `K_tenant`, is offered the picture after the first unlock, with no unsealed image cached.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.theOwnerJoinSealsThePictureAtAcceptWithVersionOne
          - MemberAvatarSliceTest.registerAndAcceptSealsThePictureOnlyOnTheOwnerPath
          - MemberAvatarSliceTest.anOversizeOrMalformedAvatarOnAnAcceptBodyIs400AndSpendsNothing
  - id: removal-clears-picture-keeps-handle
    text: Removing a member from the tenant clears `sealed_avatar` and bumps the version but keeps the username.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.removingAMemberClearsThePictureAndKeepsTheHandle
          - MemberAvatarSliceTest.aRemovalOfAMemberWithNoPictureLeavesNothingToServe
  - id: operator-blind-probe
    text: The three operations and the new accept fields are covered by the operator-blind probe, and the operator sees only an opaque constant-size blob and a version counter.
    coverage:
      backend:
        integration:
          - OperatorBlindProbeTest.everyGatedOperationAnswersEachStateOfTheGate
          - OperatorBlindProbeTest.everyContractOperationIsProbedOrExcludedWithAReason
          - MemberAvatarSliceTest.aCallerWithNoProfileInTheHostTenantIs404AndAnUnknownHostToo
gaps:
  web: Decided, not built (ADR 0084); no test exists yet. Planned suites are memberAvatar.test.ts, the dialog, directory cache, ProfilePanel and PersonProfile tests. The `member-avatar` seal purpose and its conformance vector are built (packages/crypto, contracts/crypto/vectors/v1.json) and the web contract client is generated from the finished contract.
