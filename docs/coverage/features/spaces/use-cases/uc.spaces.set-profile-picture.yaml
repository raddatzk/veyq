useCase: uc.spaces.set-profile-picture
feature: spaces
title: Set your profile picture in a space
# Built 2026-10-13 (ADR 0084): contract, crypto, backend and web. The web suites seal and open for real (the blob a PUT carries is
# opened under the test key at the member's address) and mock only the generated client and the pixel stage; the contract's
# `maxLength` is read from the YAML by memberAvatar.test.ts. NOT verified in a real browser: the crop, the WebP encode and how the
# picture draws in the header, the popover, the profile page, the members list and the user menu were never seen by eye.
acceptanceCriteria:
  - id: picture-sealed-on-device-constant-length
    text: The picture is cropped 1:1, encoded to a 256 px WebP, padded to a constant length and sealed on the device under a field key derived from `K_tenant` with the `member-avatar` purpose at (tenant scope, own user id); the server stores the blob verbatim, every blob has the same length, and the contract `maxLength` equals that sealed constant.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.theContractLengthIsTheSealedConstantsBase64Length
          - MemberAvatarSliceTest.theLengthBoundIsEnforcedAtTheWire
      web:
        unit:
          - src/features/account/profile/memberAvatar.test.ts
          - src/features/account/profile/ProfilePictureDialog.test.ts
          - src/features/account/profile/useNameAndPicture.test.ts
    gaps:
      - surface: web
        reason: The crop, the canvas bake and the WebP encode are the pixel stage, which the dialog test mocks; no test runs them in a real browser, so that a 256 px crop really fits the 16 KiB budget on real photos is unverified.
  - id: set-clear-and-revision
    text: "`PUT` overwrites and bumps `avatar_revision`, `DELETE` clears and bumps and is idempotent; the directory and profile carry only the integer `avatarRevision`, never the bytes."
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.anOverwriteBumpsTheRevisionAndReplacesTheBlob
          - MemberAvatarSliceTest.clearRemovesThePictureBumpsAndIsIdempotent
          - MemberAvatarSliceTest.overlappingSetsEachBumpTheRevisionOnce
          - MemberAvatarSliceTest.theDirectoryCarriesTheRevisionAndNeverTheBytes
      web:
        unit:
          - src/features/account/profile/useNameAndPicture.test.ts
          - src/features/account/profile/ProfilePanel.test.ts
          - src/core/people/avatarCache.test.ts
          - src/core/people/directory.test.ts
  - id: members-only-revision-tagged-read
    text: "`getMemberAvatar` is tenant-membership gated (a non-member gets the ADR 0042 404), answers 200 with an `ETag` from the revision, 304 on a matching `If-None-Match`, 404 `avatar_not_found` when none; no share endpoint serves it."
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.setThenReadRoundTripsWithAnETagAndPrivateCaching
          - MemberAvatarSliceTest.aMatchingIfNoneMatchIs304WithNoBodyAndAStaleOneIs200
          - MemberAvatarSliceTest.aMemberWithNoPictureIs404AvatarNotFound
          - MemberAvatarSliceTest.aNonMemberOfTheTenantGetsTheMembershipNotFoundWhetherOrNotAPictureExists
          - MemberAvatarSliceTest.aMembersPictureOfOneTenantIsNotReadableThroughAnother
      web:
        unit:
          - src/core/people/avatarCache.test.ts
          - src/core/people/PersonAvatar.test.ts
          - src/views/ShareView.memory.test.ts
  - id: edit-on-own-profile-only
    text: The same component edits name and picture in Settings and on one's own profile page, and renders no edit control on anyone else's.
    coverage:
      web:
        unit:
          - src/features/account/profile/ProfilePanel.test.ts
          - src/core/people/PersonProfile.test.ts
          - src/features/account/profile/useNameAndPicture.test.ts
  - id: set-at-join-or-after-first-unlock
    text: A joiner seals name and picture together at accept — a tenant owner with the key it births, a member with the key its invite's grant carries; one who skipped both is offered them once the device holds the tenant key, with no unsealed image cached.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.theOwnerJoinSealsThePictureAtAcceptWithRevisionOne
          - MemberAvatarSliceTest.registerAndAcceptSealsThePictureOnBothPaths
          - MemberAvatarSliceTest.anOversizeOrMalformedAvatarOnAnAcceptBodyIs400AndSpendsNothing
      web:
        unit:
          - src/views/TenantJoinView.avatar.test.ts
          - src/views/TenantJoinView.member.test.ts
          - src/features/account/profile/FinishProfilePrompt.test.ts
  - id: picture-opens-across-a-rotation
    text: A tenant rotation re-seals every member's picture under the tenant's new key at its constant length (ADR 0115 decision 2), so it opens for every member holding the new key and under the replaced key for nobody; a save states the tenant epoch it is sealed under and is sealed once more after a `409 stale_epoch`.
    coverage:
      web:
        unit:
          - src/core/people/profileAcrossRotation.test.ts
          - src/features/spaces/scopeRekey.test.ts
          - src/features/account/profile/useNameAndPicture.test.ts
        e2e: [src/features/account/profile/profileAcrossRotation.e2e.test.ts]
  - id: removal-clears-picture-keeps-handle
    text: Removing a member from the tenant clears `sealed_avatar` and bumps the revision but keeps the username.
    coverage:
      backend:
        integration:
          - MemberAvatarSliceTest.removingAMemberClearsThePictureAndKeepsTheHandle
          - MemberAvatarSliceTest.aRemovalOfAMemberWithNoPictureLeavesNothingToServe
  - id: operator-blind-probe
    text: The three operations and the new accept fields are covered by the operator-blind probe, and the operator sees only an opaque constant-size blob and a revision counter.
    coverage:
      backend:
        integration:
          - OperatorBlindProbeTest.everyGatedOperationAnswersEachStateOfTheGate
          - OperatorBlindProbeTest.everyContractOperationIsProbedOrExcludedWithAReason
          - MemberAvatarSliceTest.aCallerWithNoProfileInTheHostTenantIs404AndAnUnknownHostToo
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/field-seal.spec.ts`) drives `picture-sealed-on-device-constant-length`
    in Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged
    with its criterion. A picture picked, cropped and saved in Settings → Your profile decodes in the sidebar after a
    reload and on a second device; its constant length is the backend's (MemberAvatarSliceTest), not asserted there.
    Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the first CI
    run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that run each
    file becomes a ref on the criteria its tests are tagged with, and this gap goes.
