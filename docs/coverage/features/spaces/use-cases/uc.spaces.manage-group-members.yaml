useCase: uc.spaces.manage-group-members
feature: spaces
title: Manage a group's members (promote / demote / remove)
# The removal is a removal-rotation (ADR 0024 Decision 4): one request deletes the membership and commits the new
# epoch. `members.test.ts::removeGroupMember` is the consent rescind only — the one delete without a rotation.
acceptanceCriteria:
  - id: promote-demote
    text: A GroupOwner promotes a member to co-owner (OWNER) or demotes a co-owner to MEMBER — a pure role change, no key move. Only an accepted member is promoted; a consent proposal is refused 404 member_not_found and keeps its row.
    coverage:
      backend: { integration: [ScopesSliceTest.promoteDemoteAndLastOwnerGuard, ConsentGroupAddSliceTest.aProposalCannotBeMadeAnOwnerSoTheLastAcceptedOwnerStays] }
      web: { unit: [src/features/spaces/members.test.ts] }
  - id: last-owner-guard
    text: The last remaining OWNER cannot be demoted or removed; the action is rejected (a group needs ≥1 owner). Only accepted owners count — a consent proposal whose row says OWNER is none, by role change or by removal-rotation. It holds for overlapping changes too — two co-owners demoting each other, or stepping down together, leave one owner.
    coverage:
      backend:
        unit: [RotationPolicyTest.refusesRemovingTheLastOwner, RotationPolicyTest.removesAnOwnerWhileAnotherOwnerRemains]
        integration: [ScopesSliceTest.promoteDemoteAndLastOwnerGuard, ScopesSliceTest.aRemovalRotationKeepsTheOwnerGateAndTheLastOwnerGuard, ConsentGroupAddSliceTest.aProposalCannotBeMadeAnOwnerSoTheLastAcceptedOwnerStays, ConsentGroupAddSliceTest.aProposalHoldingOwnerIsNoOwnerToTheLastOwnerGuard, OwnerRoleRaceSliceTest.twoOwnersDemotingEachOtherLeaveOneOwner, OwnerRoleRaceSliceTest.twoOwnersStepDownTogetherLeaveOneOwner]
  - id: remove-member
    text: A GroupOwner removes a member → the membership is deleted (the group instantly reads as 404 to them, ADR 0042). A non-owner caller is rejected. A removal-rotation is a group's only — on a tenant or personal scope it is 400 invalid_request with nothing stored, while a plain rotation of either still commits.
    coverage:
      backend: { integration: [ScopesSliceTest.aRemovalRotationWhoseGrantsNameTheRemovedMemberIsRefusedAndChangesNothing, ScopesSliceTest.aRemovalRotationKeepsTheOwnerGateAndTheLastOwnerGuard, ScopesSliceTest.aRemovalRotationOnATenantScopeIsRefusedSoTheCascadeIsTheOnlyWayOut, ScopesSliceTest.aPersonalScopeRotatesForItsOwnerAndRefusesARemoval] }
      web: { unit: [src/features/spaces/GroupMembersPanel.test.ts] }
  - id: removal-is-one-request
    text: >
      A removal and its rotation are one request; the new epoch is never granted to the removed member, whatever
      member list the server returns. The server deletes the membership and commits the epoch in one transaction
      (a failed commit leaves the member in place), refuses a request whose grants name the removed member, and
      refuses the bare member delete for anyone but a pending consent proposal. The client builds the re-grant set
      from the directory the owner picked from, minus the removed member (ADR 0024 Decision 4).
    coverage:
      backend:
        unit: [RotationPolicyTest.refusesARemovalWhoseGrantsNameTheRemovedMember, RotationPolicyTest.aRemovalThatGrantsOnlyTheRemainingMembersCommitsAndNamesWhomItRemoves]
        integration: [ScopesSliceTest.aRemovalRotationWhoseGrantsNameTheRemovedMemberIsRefusedAndChangesNothing, ScopesSliceTest.aRemovalRotationThatFailsAtCommitLeavesTheMemberInPlace, ScopesSliceTest.theMemberDeleteRefusesAKeyedMemberAndRescindsOnlyAProposal]
      web: { unit: [src/features/spaces/scopes.test.ts, src/features/spaces/GroupMembersPanel.test.ts], e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: stale-grant-writes-nothing
    text: >
      A member whose grant is older than the scope's current epoch writes nothing until it is re-granted: the scope
      reads as waiting for the current key on their client, and the server refuses a node create tagged with any epoch but the
      current one (409 stale_epoch), as it already did for a rename and an icon (ADR 0024 Decision 6, layer 1).
    coverage:
      backend: { integration: [ScopesSliceTest.aNodeCreateAtAStaleEpochIsRefused] }
      web: { unit: [src/features/spaces/scopes.test.ts], e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: membership-boundary-first
    text: >
      Membership is the first guard on every scope-addressed operation (ADR 0042, cr-0162): a caller who is not a
      member of the group gets 404 scope_not_found — byte-identical to the answer for a group id that does not
      exist — so group ids are not enumerable across the membership boundary. Capability refusals inside the
      boundary stay 403 (not_key_holder for a member holding no grant, not_scope_owner for a non-owner member), which
      discloses nothing because that caller already knows the group exists.
    coverage:
      backend:
        integration: [ScopesSliceTest.listEpochsSeparatesTheMembershipBoundaryFromTheKeyHolderCheck, ScopesSliceTest.addGroupMemberByANonMemberOfTheGroupIs404, OperatorBlindProbeTest.everyGatedOperationAnswersEachStateOfTheGate]
  - id: remove-rotates-forward
    text: Removal rotates the scope content key forward into a new epoch, re-granted only to the remaining members; new content seals under it, so the removed member never reads post-removal content (even against a malicious operator). The client mints the epoch, which replaces the old key (no chain, ADR 0115 decision 1), re-seals every scope-level row under it, proves it by a succession statement, and re-grants the survivors.
    coverage:
      backend: { integration: [ScopesSliceTest.rotateBumpsEpochAndReGrantsRemaining] }
      web: { unit: [src/features/spaces/scopes.test.ts, src/features/spaces/scopeRekey.test.ts, src/features/spaces/epochs.replaced.probe.test.ts] }
  - id: queued-rotation-backstop
    text: >
      A2 (the remover holds no key): when a tenant owner's removal cuts a co-shared group they do not hold
      (uc.spaces.remove-tenant-member A4), the rotation is queued as a SCOPE_ROTATION job on the operator-blind task
      queue — cr-0092. Its origination is this criterion: one job per co-shared group the cut reaches, none for an
      own or soft-deleted scope, and a second removal joins the still-unclaimed job. Who completes it, and what a
      completion must prove, is uc.spaces.complete-queued-rotation's (an owner, on its own commit during the
      lease); it re-grants the directory the server returns, so it holds against an honest operator only (ADR 0024
      § Guarantee).
    coverage:
      backend: { integration: [MemberRemoveSliceTest.removalQueuesRotationOnlyForCoSharedGroupsNotOwnScopesOrTenant, MemberRemoveSliceTest.secondRemovalCoalescesIntoTheOneLiveRotationJob] }
      web: { e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: rotation-commits-only-the-next-epoch
    text: >
      A rotation states the epoch it creates and commits only as the scope's current epoch + 1; anything else (it
      lost a race, or rode a grant a previous rotation skipped) is refused as 409 stale_epoch with nothing stored,
      so a succession statement is always signed by the epoch it succeeds. The device re-opens its grant and retries once
      from a fresh key; a queued rotation job that stays stale is declined for a current owner (ADR 0024 §4).
    coverage:
      backend:
        unit: [RotationPolicyTest.commitsTheStatedEpochWhenItIsTheNextOne, RotationPolicyTest.refusesARotationBuiltOnASupersededEpoch, RotationPolicyTest.refusesARotationThatSkipsAnEpoch]
        integration: [ScopesSliceTest.aRotationBuiltOnASupersededEpochIs409AndLeavesTheChainIntact, ScopesSliceTest.twoConcurrentRotationsStatingTheSameEpochCommitOnce]
      web: { unit: [src/features/spaces/scopes.test.ts, src/features/tasks/scopeRotationWorker.test.ts, src/features/account/rotation/rotateKeys.test.ts] }
  - id: operator-blind-rotation
    text: The server sees only role/membership metadata, the succession statement (a public key and a signature), per-member grants, re-sealed ciphertext and per-node epoch counters — never a key or a name. The client posts only ciphertext and public values (the succession statement, the per-member grants, the re-sealed rows).
    coverage:
      backend: { integration: [ScopesSliceTest.rotateBumpsEpochAndReGrantsRemaining] }
      web: { unit: [src/features/spaces/scopes.test.ts] }
  - id: no-seal-below-the-epoch-floor
    # ADR 0024 Decision 6's second half, the per-device floor (one of ADR 0028 Decision 7's marks). A grant below
    # the highest epoch this device has held opens as the layer-1 *awaiting the current key* state — no read-only
    # open (owner decision, 2026-09-28) — whatever currentEpoch the server pairs it with; a rotation is refused on
    # it too. A grant the device opened or a rotation it made raises the floor, and an account-key rotation carries
    # it to the new key. The bite (held n+1, served n with a matching current epoch) was red on the untouched tree.
    text: No device seals under an epoch below the highest it has held for that scope.
    coverage:
      web:
        unit: [src/features/spaces/scopes.test.ts, src/features/account/trustMarks.test.ts, src/features/account/rotation/rotateKeys.test.ts]
  - id: a-new-epoch-links-to-the-held-key
    # ADR 0111 decision 23, ADR 0115 decision 5: beside the floor, the device keeps per scope the succession public key
    # of the newest epoch key it held, and a grant at or above that epoch opens only if the served succession
    # statements lead from it to exactly the key the grant carries (verifySuccessionPath). The threat is a TENANT grant
    # under an operator's key and a fabricated, first-seen granter, which the operator cannot back with a statement
    # signed from a key it never held.
    # Inbox #750 measured the first grant of a GROUP on real keys (groupFirstGrant.test.ts): it opens from any granter
    # the tenant anchors, in the group or not - the residual ADR 0111 § What stays open names; a granter the tenant does
    # not anchor and a plant on a device that held the key stay refused (each turned red by dropping its check), and a
    # device-local refusal of a first group grant turned every honest control red.
    text: >
      A grant for an epoch at or above the newest one whose key this device holds for a scope opens only if the served
      succession statements lead from that key's succession public key to exactly the key the grant carries; otherwise
      it is refused (epoch_unlinked), nothing is written
      under it, and a securing's plan declares the scope unreadable. A first grant, a member pending across several
      epochs, a securing's self-grant and an epoch the device committed itself all open; a group's first grant opens from
      any granter the tenant anchors.
    coverage:
      web:
        unit: [src/features/spaces/scopes.test.ts, src/features/account/trustMarks.test.ts, src/features/spaces/groupFirstGrant.test.ts]
  - id: owner-turns-off-every-link
    text: A group owner turns off every enabled public share of the group with no removal (revokeScopeShares), each marked so it comes back only by re-issue, the answer counting them and a second call answering 0; a member who does not own the group is refused 403 not_scope_owner and nothing moves; a link minted afterwards is untouched (A5, ADR 0075 point 5).
    coverage:
      backend: { integration: [ShareSharedScopeSliceTest.aScopeOwnersSwitchOffTurnsOffEveryLinkAndItSticks] }
      web: { unit: [src/features/spaces/GroupMembersPanel.test.ts, src/shared/ui/ConfirmDialog.test.ts] }
  - id: owner-rekeys-the-group
    text: >
      A GroupOwner gives the group a new lock (ADR 0025 § 1, A6) as a plain rotation of the GROUP scope with no
      removesUserId, behind a confirmation, then the node re-key; not offered to a non-owner nor during the deletion
      grace. The server takes it from any owner, a co-owner included, with anchored members re-granted and the rest
      declared pending, keeps every membership, refuses one that leaves a member out (409 rotation_incomplete) and a
      plain member's (403 not_scope_owner); a rotation that fails says nothing was changed and re-keys nothing.
    coverage:
      backend: { integration: [GroupRekeySliceTest.anOwnerReKeysTheGroupWithNobodyRemovedGrantingWhomItAnchorsAndDeclaringTheRest, GroupRekeySliceTest.aPlainMemberCannotReKeyTheGroupAndACoOwnerCan] }
      web: { unit: [src/features/spaces/GroupMembersPanel.test.ts, src/features/spaces/members.test.ts], e2e: [src/features/spaces/groupRekey.e2e.test.ts] }
  - id: member-reads-the-roster-read-only
    # ADR 0022 decision 3 (inbox #814). Before it, the hub sent this member back to /settings, and on a wide viewport
    # the default-section and hidden-section redirects then traded the route without end (measured: 40 navigations
    # until the test's guard stopped them). The panel's gate is its directory-derived `isOwner`.
    text: >
      A member who does not own the group opens its page in the settings hub — the default while that group is the
      active space, and by its address — and sees the whole directory with a read-only note and no owner control
      rendered; the group's owner sees every control and no note; a directory that cannot be read offers nothing. The
      group is not in the hub's Groups collection, a caller who is no member of it (or whose group listing fails) is led
      back to /settings, and on a wide viewport the route settles after one replacement.
    coverage:
      backend: { integration: [ScopesSliceTest.aPlainMemberOfTheGroupReadsItsRosterAndANonMemberGets404] }
      web: { unit: [src/features/spaces/GroupMembersPanel.test.ts, src/views/SettingsHubView.test.ts] }
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses/expenses-pot.spec.ts`) drives `remove-rotates-forward` in
    Chromium, in English (ADR 0090 decision 9), against the release candidate's two images installed through
    `veyqctl` (ADR 0090), each test tagged with its criterion: a group owner removes the other member, the group's
    key is rotated and its Pot re-keyed on the owner's device, the panel no longer reads as re-keying, and the
    removed member's sidebar no longer lists the group. Green only in local runs of the lane (the V1 heavy stage),
    and ADR 0040 admits `stack` refs only once a CI run's log shows the suite executed.
