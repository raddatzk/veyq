useCase: uc.spaces.rekey-after-rotation
feature: spaces
title: Re-key a space after a rotation
# Refined 2026-10-23 (inbox #518, ADR 0109), built the same day (cr-scope-rotation-rekeys-nodes). The property has
# several triggers (a group removal, a queued rotation, a secured account's own scopes), so it owns its criteria
# rather than any one trigger's use-case. The web refs run the re-key through the real crypto (no mocked seal)
# against an in-memory server; the backend refs prove the commit, the gates and the derived state on the real one. The
# any-member re-key (ADR 0111 decision 11) also runs live: anyMemberRekeys.e2e.test.ts in the web-e2e job, and a member's
# import and copy into its active group meeting two rotations each: importMeetsRotation.e2e.test.ts.
# ADR 0115's criteria (scope-level-rows-replaced .. pending-reads-nothing) are the scope key's replacement: the rotation's
# commit re-seals every scope-level row and stores a succession statement, no chain link. Their phase-1 probes
# (ScopeKeyReplacedProbeSliceTest, epochs.replaced.probe.test.ts) were red on the chained tree and are enabled with the
# build. The succession statement's bytes and verifySuccessionPath are pinned by the crypto package's
# scopeSuccession.conformance.test.ts and inviteCheck.test.ts, on a surface no CI run has admitted yet; the web refs
# below run the same checks through the real crypto.
acceptanceCriteria:
  - id: scope-level-rows-replaced
    text: A rotation's commit swaps in, in one transaction, the re-seal under the new key of every scope-level row - each scope-root node's entry live and trashed, a group's name and a space's icon, each pending invitee's name key, each link's recovery copy (its minted-at epoch kept), a tenant's member names, pictures, join records and verifications, and a Memory's item marks through the application's participant - and marks every node of the scope due; afterwards none of them opens under the old key and each opens under the new one.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.everyStagedGroupRowIsSwappedInAndEveryNodeIsDue
          - ScopeRekeySliceTest.everyStagedTenantProfileAndVerificationIsSwappedIn
          - ItemFavoritesScopeRekeySliceTest.everyMembersMarksAreReSealedThroughTheParticipant
      web:
        unit:
          - src/features/spaces/scopeRekey.test.ts
          - src/features/memories/itemFavorites.test.ts
          - src/features/spaces/epochs.replaced.probe.test.ts
          - src/core/node/rekey/rekeyScope.test.ts
  - id: a-missing-row-refuses-the-rotation
    text: A rotation missing one scope-level row's staged value - core's or an application's - is refused 409 rekey_parts_missing and writes nothing, a removal rotation's member included; a rotation that leaves a scope-root entry under the old key is refused.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.aRotationMissingOneRowsStagedValueIsRefusedAndWritesNothing
          - ScopeRekeySliceTest.aRemovalRotationRefusedForAMissingRowLeavesTheMemberInPlace
          - ScopeKeyReplacedProbeSliceTest.aRotationThatLeavesAScopeRootEntryUnderTheOldKeyIsRefused
          - ItemFavoritesScopeRekeySliceTest.aMarkWithNoStagedValueRefusesTheRotation
      web: { unit: [src/features/spaces/scopeRekey.test.ts] }
  - id: a-row-changed-since-is-stale
    text: Each staged value names the SHA-256 of the ciphertext it replaces, per item and per member field; a row written between the read and the stage is refused at the stage, one written between the stage and the commit makes the commit 409 rekey_parts_stale and writes nothing, a profile write racing the commit included; a member field staged without its digest is malformed.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.aRowChangedSinceItWasStagedIsStale
          - ScopeRekeySliceTest.aRowWrittenBetweenTheReadAndTheStageIsRefusedAtTheStage
          - ScopeRekeySliceTest.aMemberFieldWithoutItsDigestIsMalformed
          - ScopeRekeyRaceSliceTest.aRotationThatWaitsOnAProfileWriteFindsItsStageStaleAndRotatesNothing
          - ItemFavoritesScopeRekeySliceTest.aMarkRewrittenSinceItWasStagedIsStale
          - ItemFavoritesScopeRekeySliceTest.aMarkRewrittenBetweenTheReadAndTheStageIsRefusedAtTheStage
      web: { unit: [src/features/spaces/scopeRekey.test.ts] }
  - id: a-scope-level-write-at-the-old-epoch-is-stale
    text: A scope-level write stating the epoch from before the rotation - a profile name or picture, a verification, an item mark, a group rename, an icon - is 409 stale_epoch and writes nothing, a profile write that waited on the commit included; the writer re-reads and seals under the new key.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.aScopeLevelWriteSealedUnderTheOldEpochIsStale
          - ScopeRekeyRaceSliceTest.aProfileWriteThatWaitsOnTheCommitIsStaleAndWritesNothing
      web: { unit: [src/features/account/profile/useNameAndPicture.test.ts, src/core/people/profileAcrossRotation.test.ts] }
  - id: only-the-rotator-stages
    text: Only a caller who may commit the rotation - an owner, or a member with its own securing's pending re-key row - and who holds the current grant reads and stages the scope-level rows; anyone else is refused and nothing is staged.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.onlyTheRotatorHoldingTheCurrentGrantReadsAndStagesTheScopeLevelRows
          - ItemFavoritesScopeRekeySliceTest.onlyTheRotatorReadsAndStagesTheMarks
      web: { unit: [src/features/spaces/scopeRekey.test.ts] }
    gaps:
      - surface: web
        reason: The refusal is the server's; the web ref covers only that the rotating client is the one that stages.
  - id: what-cannot-be-resealed-stops-no-rotation
    text: A pending group invitee the rotator cannot anchor gets its name key cleared - never sealed to an anomaly - and the rotation commits, the invitee reading the proposal unnamed; a name key sealed to another identity than the anchored one is refused; a profile field, a verification or an item-mark set that does not open under the old key is staged as one that reads the same.
    coverage:
      backend:
        integration:
          - ScopeRekeySliceTest.aPendingInviteeTheRotatorCannotAnchorIsClearedAndTheRotationCommits
          - ScopeRekeySliceTest.aPendingInviteesNameKeySealedToAnotherIdentityIsRefused
      web: { unit: [src/features/spaces/scopeRekey.test.ts, src/features/spaces/inviteName.test.ts, src/features/memories/itemFavorites.test.ts] }
  - id: a-successor-is-proven-by-succession
    text: No chain link is stored and no held key opens another epoch's; a grant at a later epoch opens only if the served succession statements lead from the key this device held to the granted key, a newcomer's carried grant only if they lead from the invite's anchor - an operator's key, or a successor signed by a former key-holder after a rotation this device made, is refused epoch_unlinked, the same grant through genuine statements opens.
    coverage:
      backend: { integration: [ScopeKeyReplacedProbeSliceTest.aRotationStoresNoChainLink] }
      web:
        unit:
          - src/features/spaces/scopes.test.ts
          - src/features/spaces/epochs.replaced.probe.test.ts
          - src/features/tenant/tenantInvite.test.ts
  - id: pending-reads-nothing
    text: A member the rotation declared pending, or a device whose grant is behind, reads nothing of the scope - no name, no icon, no node - and reads as awaiting the current key until a grant reaches them; once re-granted it reads everything under the one key.
    coverage:
      web: { unit: [src/features/spaces/scopes.test.ts, src/app/activeSpace.test.ts] }
  - id: every-node-rekeyed
    text: After a rotation every live and trashed node of the scope carries the new epoch, a fresh key, and every field that was sealed under its old key re-sealed under the new one; a medium added afterwards to a folder or Memory that existed before opens with no key from before the rotation.
    coverage:
      backend:
        integration:
          - RekeyCoreSliceTest.theListingServesEveryNodeTrashedIncludedAndOnlyWithTheCurrentGrant
          - RekeyCoreSliceTest.aCommitIsTopDownAndSwapsEveryStagedPartInOneTransaction
          - RekeyCoreSliceTest.aTrashedNodeIsRestoredOnlyOnceTheReKeyReachedIt
          - MediaNodeRekeySliceTest.theListingServesEveryKeySealedRowButAWriteOnlyGuestsInPages
          - MediaNodeRekeySliceTest.aCommitReSealsEveryMediumBlobAndBucketNameAndMovesTheEpoch
      web: { unit: [src/core/node/rekey/rekeyScope.test.ts, src/features/memories/rekey.test.ts] }
  - id: blobs-rewrapped-not-reencrypted
    text: A re-key re-wraps each K_blob and writes or reads no store object.
    coverage:
      backend:
        integration:
          - RekeyCoreSliceTest.aReKeyTouchesNoStoreObject
          - MediaNodeRekeySliceTest.aBlobWrapNotStagedRefusesTheWholeCommit
      web: { unit: [src/core/node/rekey/rekeyScope.test.ts] }
  - id: pot-revisions-rewrapped-bodies-unchanged
    text: A Pot's re-key re-wraps every revision's K_rev under the Pot's new key, page by page, and changes no body; the server refuses a staged part that names anything but a wrap and lands nothing of it, every body and its digest stay byte-identical, and a re-key lands while Expenses is switched off.
    coverage:
      backend:
        integration:
          - PotRekeySliceTest.theListingServesEveryRevisionsWrapInPages
          - PotRekeySliceTest.aPartNamingABodyIsRefusedAndLandsNothing_theWrapsAloneLandAndNoBodyMoves
          - PotRekeySliceTest.aRekeyLandsWhileExpensesIsSwitchedOff
      web: { unit: [src/features/expenses/rekey.test.ts, src/features/expenses/domain/codec.test.ts, src/features/expenses/domain/heads.test.ts] }
  - id: writes-wait-per-node
    text: A write sealed under a node's key is refused 409 node_rekey_pending while that node is not yet re-keyed and 409 stale_epoch when it states the node's key from before; a guest's create under a parent not re-keyed yet, stating the parent's epoch as its own, is the parent's node_rekey_pending; a re-keyed node takes writes at once.
    coverage:
      backend:
        unit: [NodeEpochGateTest.theStatedEpochMustBeTheNodesOwnAndTheNodeNotDue]
        integration:
          - RekeyCoreSliceTest.writesWaitPerNodeAndRefuseAKeyFromBefore
          - ShareEpochGateCoreSliceTest.aShareStatesItsNodesEpoch
          - ShareEpochGateCoreSliceTest.aReissueStatesItsNodesEpoch
          - ShareEpochGateCoreSliceTest.aReadWriteGuestsNameStatesTheRootsEpoch
          - ShareEpochGateCoreSliceTest.aWriteOnlyGuestsKeyStatesTheRootsEpoch
          - ShareEpochGateCoreSliceTest.aGuestsCreateUnderAParentNotReKeyedYetWaitsForIt
          - MediaEpochGateSliceTest.aMembersCompletionStatesTheMemorysEpochPerItem
          - MediaEpochGateSliceTest.aMetaEditStatesItsMediumsNodeEpoch
          - MediaEpochGateSliceTest.aBucketsCreateAndRenameStateTheMemorysEpoch
          - MediaEpochGateSliceTest.aBannerStatesTheMemorysEpoch
          - MediaEpochGateSliceTest.aGuestsCompletionStatesTheTargetsEpochForTheBatch
      web: { unit: [src/shared/rekeyRetry.test.ts, src/core/node/tree.epoch.wire.test.ts] }
  - id: resumable
    text: A re-key interrupted halfway leaves a tree that opens from the new epoch and is resumed by any member holding it, every member's scope row reading the re-key unfinished; a queued rotation completes only once no node lags, and reads secured only then.
    coverage:
      backend:
        unit: [RotationScopeStatesTest.aMovedEpochIsSecuredOnceNoNodeLags]
        integration:
          - RekeyCoreSliceTest.aCommitMissingAStagedPartWritesNothing
          - RekeyCoreSliceTest.aStagedChildThatMovedSinceIsStale
          - RekeyCoreSliceTest.aQueuedRotationCompletesOnlyOnceItsReKeyIsDone
          - RekeyCoreSliceTest.anOwnersScopeRowReadsRekeyingWhileANodeLags
          - RekeyCoreSliceTest.aMembersScopeRowReadsRekeyingWhileANodeLags
      web: { unit: [src/core/node/rekey/rekeyScope.test.ts, src/features/tasks/scopeRotationWorker.test.ts] }
  - id: a-members-write-pulls-its-path
    text: A member's write refused node_rekey_pending (or by its device floor) re-keys the written node and its lagging ancestors top-down on its own device and is retried at once, spending no wait; a guest's write never pulls and waits; a write into a node only an owner re-keys falls back to the waits with nothing committed; a stale_epoch after the pull is re-read once; a medium completion's per-item refusals are read as the HTTP ones; a member's media and file uploads seal again under the node's key now.
    coverage:
      web:
        unit:
          - src/core/node/rekey/rekeyScope.test.ts
          - src/shared/rekeyRetry.test.ts
          - src/features/expenses/potSession.pull.test.ts
          - src/features/memories/uploadQueue.test.ts
          - src/features/memories/media.test.ts
          - src/core/node/tree.test.ts
        e2e: [src/features/spaces/anyMemberRekeys.e2e.test.ts, src/features/spaces/importMeetsRotation.e2e.test.ts]
  - id: a-run-pulls-what-it-created
    text: A rotation that lands while an import or a copy is under way leaves the run's own nodes behind; each later write into one - a create below it, a Memory's medium, cover or banner, a Pot's batch or receipt, a Depot file's content - is one write that pulls that node forward on this device and is sealed again under its re-read key, the run going on under that key and creating nothing twice; a download's medium carries its corrected capture time and place name in that one write, so a re-key after the last medium leaves nothing to re-seal; a stale_epoch from another device's re-key pulls before its re-read, so a device holding the scope behind re-opens it; a create at the scope root re-opens the scope and states its epoch; below a drop box the write waits, the refused pull re-opening the scope so the re-read after the wait opens an owner's re-key, and the run is rolled back only when the waits run out.
    coverage:
      web:
        unit:
          - src/core/export/importSubtree.midRun.test.ts
          - src/shared/rekeyRetry.test.ts
          - src/core/node/rekey/rekeyScope.test.ts
        e2e: [src/features/spaces/importMeetsRotation.e2e.test.ts]
  - id: links-follow-and-stay-marked
    text: A link from before shows what is added after the re-key and stays marked reissueRequired; its re-issue's key does not open what the old recovery copy's key reaches.
    coverage:
      backend:
        integration:
          - RekeyCoreSliceTest.aCommitIsTopDownAndSwapsEveryStagedPartInOneTransaction
          - ShareEpochGateCoreSliceTest.theResolveServesTheRootsEpochForEveryUnlockedRoleAndItsTagMovesWithIt
      web: { unit: [src/core/node/rekey/rekeyScope.test.ts] }
  - id: any-member-rekeys
    text: Any member holding the scope's current epoch lists, stages and commits a node's re-key, an application's part included; a member whose grant lags is refused; two members re-keying one node leave one commit and the second is told the node moved; a drop box, a guest's identity folder and what lies below one are marked owner-only and refused to a member, and an owner re-keys each; a Memory or other node that only carries a drop key for its uploader link is any member's, drop key and guests' identity keys included.
    coverage:
      backend:
        unit:
          - OwnerOnlyRekeyTest.aDropKeyedNodeOfNoDropBoxKindIsAnyMembers
          - OwnerOnlyRekeyTest.aDropBoxIsAnOwnersWithOrWithoutItsKey
          - OwnerOnlyRekeyTest.anIdentityFolderAndWhatLiesBelowAreAnOwners
        integration:
          - RekeyCoreSliceTest.aMemberWithTheCurrentGrantReKeysANode
          - RekeyCoreSliceTest.aMemberWithAGrantBehindIsRefused
          - RekeyCoreSliceTest.aMemberReKeysADropKeyedNodeButIsRefusedAnIdentityFolderAndWhatLiesBelow
          - DropBoxRekeySliceTest.aMemberIsRefusedTheDropBoxAndItsIdentityFolderAndAnOwnerIsNot
          - RekeyCoreSliceTest.twoMembersReKeyingTheSameNodeLeaveOneCommit
          - PotRekeySliceTest.aMemberWithTheCurrentGrantReKeysAPot
          - MediaNodeRekeySliceTest.aMemberWithTheCurrentGrantReKeysAMemory
          - MediaNodeRekeySliceTest.aMemberReKeysAMemoryAContributorLinkGaveADropKey
      web:
        unit: [src/core/node/rekey/rekeyScope.test.ts]
        e2e: [src/features/spaces/anyMemberRekeys.e2e.test.ts]
  - id: drop-key-replaced
    text: A node's drop key is replaced and its guest identities' keys re-sealed to the new public key; an upload after the re-key does not open with the drop private key from before.
    coverage:
      backend: { integration: [RekeyCoreSliceTest.aDropKeyedNodeReplacesItsDropKeyAndEveryGuestsIdentityKey] }
      web: { unit: [src/core/node/rekey/rekeyScope.test.ts] }
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/expenses/expenses-pot.spec.ts`) drives `pot-revisions-rewrapped-
    bodies-unchanged` in Chromium, in English (ADR 0090 decision 9), against the release candidate's two images
    installed through `veyqctl` (ADR 0090), each test tagged with its criterion: after a member's removal rotates
    the group's key, the Pot's balances, settle-up and overview read as before the rotation, with no ledger notice
    and no entry unreadable, for the owner and through a link made before the re-key. Green only in local runs of
    the lane (the V1 heavy stage), and ADR 0040 admits `stack` refs only once a CI run's log shows the suite
    executed.
