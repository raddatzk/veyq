useCase: uc.sharing.share-shared-scope
feature: sharing
title: Public-share a Memory in a shared scope (group / tenant)
# Built (web vertical, cr-0104 + ADR 0029 §6; re-issue + the re-activation refusal, ADR 0075): ANY member of a
# group or tenant scope may public-share a Memory there (all three built roles), gated on scope-membership AND the
# role's sharing.* capability (ADR 0032) — any member may publish, not only an owner. Member removal switches off
# (enabled=false) every share the removed member created in that scope (or, opted in, every share of the group); any
# remaining member may re-activate a deactivated share, which transfers its owner_account — unless a departed member
# may hold its link, which then comes back only as a re-issue (a new id + key, the old one deleted, one transaction) — the
# removal count marks that on a tenant, and a bulk switch-off's mark makes it stick. A rotation re-wraps an open
# share's root key under its unchanged K_share (ADR 0109), so the share follows new content and is not rotated away;
# what cuts its key off what comes later is its close — every switch-off, delete, re-issue and passed end date
# re-keys the subtree below its root (ADR 0114, en.sharing.public-link § Lifecycle).
acceptanceCriteria:
  - id: member-authored-any-scope
    text: A member of a group/tenant scope may createShare a MEMORY in that scope (personal still works); the create-gate is "a node of a kind that may be a share root with that role (ShareRoots) in a scope the caller is a member of" AND the role's sharing.* capability — not owner-only, not personal-only. A non-member cannot (no reveal).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks, ShareSliceTest.nonMemberCreateIs404, ShareRootsSliceTest.aChapterIsAShareRootForEveryRole]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: removal-deactivates-shares
    text: Removing a member from a scope switches off (enabled=false) every share that member created in that scope — each a close of the link (ADR 0114); the anonymous resolve + gated blob endpoint then 404. Runs independently of the group scope-key rotation the removal also triggers.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.removingGroupMemberDeactivatesOnlyTheirShares, ShareSharedScopeSliceTest.removingTenantMemberDeactivatesTheirTenantScopeShares]
  - id: reactivation-transfers-ownership
    text: Any remaining member may re-enable a deactivated share; doing so transfers owner_account to the re-activating member, so an active share is always owned by a current member (a later removal of the new owner deactivates it again).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.reactivateByAnotherMemberTransfersOwnershipAndResolves, ShareSharedScopeSliceTest.reactivateByNonMemberIs404, ShareSharedScopeSliceTest.aReactivationByAMemberBeingRemovedLeavesTheLinkOff]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: follows-new-content
    text: Content added to the shared Memory is visible via the existing share, after a rotation too - between rotations K_node stays, and a rotation's re-key re-wraps an open share's root key under its unchanged K_share (ADR 0109 point 4); the URL/fragment never changes, and the link stays reissueRequired because it keeps the epoch it was minted at, while the rotation re-seals its recovery copy under the new scope key (ADR 0115).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks, RekeyCoreSliceTest.aCommitIsTopDownAndSwapsEveryStagedPartInOneTransaction]
      web:
        unit: [src/core/node/rekey/rekeyScope.test.ts]
  - id: operator-blind-unchanged
    text: A shared-scope share is the same opaque record shape (shareId, symWrap(K_share,K_node), role, sealed name, nodeId, owner_account, enabled) and adds no new operator-visible signal; the server never sees K_share, K_node, names, or the visitor. The manage list's `mine` flag is derived per request, never stored.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks, ShareSharedScopeSliceTest.listForNodeShowsEveryMembersSharesWithMineFlag]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: reactivation-refuses-a-departed-members-link
    text: >
      Re-activation is refused 409 reissue_required, nothing written, when a bulk switch-off marked the share, when its
      owner is no longer a member of its scope (a removed group member, or a removed tenant member's own tenant-scope
      share), or when it carries a recovery copy and was minted below the scope's current epoch or before the scope's
      last member removal — the removal count marks a co-member's tenant link, and a co-shared group's link while its
      queued rotation has not run; a share without a copy is judged by the switch-off and its owner alone. The manage
      list serves the same predicate per row (reissueRequired), and the panel marks such a link and offers renew
      instead of re-activate (ADR 0075 point 4).
    coverage:
      backend:
        unit: [ReissuePolicyTest.aBulkSwitchOffAloneRequiresAReissue, ReissuePolicyTest.aDepartedOwnerAloneRequiresAReissue, ReissuePolicyTest.aCopyBelowTheCurrentEpochAloneRequiresAReissue, ReissuePolicyTest.aCopyMintedBeforeARemovalAloneRequiresAReissue, ReissuePolicyTest.aShareWithoutACopyIsJudgedByTheSwitchOffAndItsOwnerAlone]
        integration: [ShareSharedScopeSliceTest.reactivatingARemovedMembersShareIs409ReissueRequired, ShareSharedScopeSliceTest.reactivatingAShareSealedBeforeTheKeyChangedIs409ReissueRequired, ShareSharedScopeSliceTest.reactivatingOwnShareSealedAtTheCurrentEpochResolves, ShareSharedScopeSliceTest.reactivatingARemovedTenantMembersTenantShareIs409ReissueRequired, ShareSharedScopeSliceTest.aCoMembersTenantLinkMintedBeforeARemovalIsNotRevived, ShareSharedScopeSliceTest.aCoMembersTenantLinkWithoutACopyIsRevivedAfterARemoval, ShareSharedScopeSliceTest.aCoSharedGroupLinkIsMarkedBeforeItsQueuedRotationRuns]
      web:
        unit: [src/features/memories/components/ShareDialog.test.ts, src/features/memories/share.test.ts]
  - id: reissue-replaces-a-link-in-one-request
    text: Re-issue creates a new share (fresh id, fresh K_share, the old one's settings re-sealed, recovery copy at the current epoch, role and Memory from the old row, a WRITE_ONLY keeping the Memory's drop key) and deletes the old one (a tombstone it can never come back from) in one transaction; a stale epoch, a taken id or keys that do not match the role write nothing; an enabled share is its owner's to re-issue, a disabled one any member's (who owns the new share). The old K_share opens nothing the new share carries (ADR 0075).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.reissueReplacesTheLinkInOneRequestAndKeepsTheRoleAndMemory, ShareSharedScopeSliceTest.aReissuedLinkCannotComeBack, ShareSharedScopeSliceTest.reissueAtAStaleEpochIs409AndWritesNothing, ShareSharedScopeSliceTest.aCoMembersEnabledShareIsNotReissuableButADisabledOneIsAdopted, ShareSharedScopeSliceTest.anUploaderReissueSealsTheExistingDropKeyAndNeverAWrap, ShareSharedScopeSliceTest.aReissueIntoATakenIdIs409AndLeavesTheOldLinkOn]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: a-share-is-reissued-at-most-once
    text: A share is re-issued at most once (inbox #252). The re-issue spends the old share by a checked compare-and-set — its deletion where it is not deleted yet, the transaction's first write — so of two concurrent re-issues exactly one mints a link and the other, like any later re-issue of a deleted share, is 409 share_deleted with nothing written; a non-member still gets the non-enumerable 404. The renew dialog never retries that conflict, says the link was already renewed or deleted and has the manage list re-read (A4, ADR 0075 point 1).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.twoConcurrentReissuesOfOneShareMintExactlyOneLink, ShareSharedScopeSliceTest.aReissuedShareRefusesASecondReissueWithAConflict, ShareSharedScopeSliceTest.theOwnerDeletesALinkAndItIsGoneEverywhere]
      web:
        unit: [src/features/memories/share.test.ts, src/features/memories/components/ShareCreateDialog.test.ts]
  - id: removal-can-turn-off-every-link
    text: A removal-rotation with revokeLinks turns off every enabled share of the group, whoever created it, in the removal's transaction; without it only the removed member's own go off; revokeLinks without removesUserId is 400 with nothing stored. The removal confirmation carries the opt-in, unchecked by default (ADR 0075).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.aRemovalWithRevokeLinksTurnsOffEveryLinkOfTheGroup, ShareSharedScopeSliceTest.removingGroupMemberDeactivatesOnlyTheirShares, ShareSharedScopeSliceTest.revokeLinksWithoutARemovalIs400AndStoresNothing]
      web:
        unit: [src/features/spaces/GroupMembersPanel.test.ts]
  - id: a-switch-off-sticks
    text: Every bulk switch-off — a group removal's or a tenant removal's revokeLinks, and a scope owner's revokeScopeShares — marks every share of the scope, one already switched off included (inbox #258), so even one with no recovery copy whose owner is still a member comes back only by re-issue; it counts only the shares it turned off, and a share minted afterwards is untouched (A5, ADR 0075 point 5).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.aRemovalsSwitchOffMarksEveryLinkItTurnsOff, ShareSharedScopeSliceTest.aScopeOwnersSwitchOffTurnsOffEveryLinkAndItSticks, ShareSharedScopeSliceTest.aSwitchOffAlsoMarksALinkThatWasAlreadyOff]
  - id: delete-a-link
    text: >
      A share's owner deletes it at any time (an enabled one is turned off in the same transaction); another member
      only once its owner is no longer a member of the scope — otherwise the non-enumerable 404, and the list's
      `deletable` carries the same predicate. The row becomes a tombstone (ADR 0029 §7) — its ciphertext cleared, its
      id kept — so the link 404s, is in neither listing, and revoke, update, re-activate, re-issue and a second delete
      answer 404; its id is refused id_taken. The panel folds switched-off links under a count, offers delete on a
      switched-off link the server marks deletable, behind a confirm, and drops the row once deleted; switching off no
      longer wears the trash can (A7). The drop box's dialog offers switch-off only on the caller's own link (`mine`)
      and delete only where `deletable` says so.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.theOwnerDeletesALinkAndItIsGoneEverywhere, ShareSharedScopeSliceTest.aCoMembersLinkIsDeletableOnlyOnceItsOwnerLeft]
      web:
        unit: [src/features/memories/components/ShareDialog.test.ts, src/features/memories/share.test.ts, src/features/depot/components/DropBoxShareDialog.test.ts]
  - id: a-stopped-link-says-why
    text: >
      Every row of the manage list carries why a guest is not served the link now (`guestStops`, empty exactly when one
      is): revoked, expired, a space paused or being deleted, an instance or a tenant switch with its entry, a missing
      password, a lifetime beyond the one in effect with its days — computed by the predicate the guest gate is the
      emptiness of, so over every combination of both levels' switches and both requirements a link is listed as served
      exactly when a guest is, and a stopped one still answers its guest as an unknown link, byte for byte; the resolve
      carries no stop. The Memory, folder, file and drop-box panels word each reason in English and German, a switch
      with who can switch it back on, a requirement with whether its fix keeps the link's address (A8, inbox #457).
    coverage:
      backend:
        unit: [CapabilityRegistryTest.offSwitchesNameEverySwitchOnThePathRootFirstInstanceBeforeTenantAndAreEmptyExactlyWhenActive, LinkRequirementsTest.missedNamesEveryRequirementALinkMissesThePasswordFirstAndTheRefusalIsItsFirst]
        integration: [ShareGuestStopsCoreSliceTest.aServedLinkListsNoStopAndARevokedOrExpiredOneSaysSo, ShareGuestStopsCoreSliceTest.aSpaceBeingDeletedSaysSoToTheMemberWhoStillReadsIt, ShareGuestStopsCoreSliceTest.theListAndTheGuestGateAgreeOverTheMatrix, ShareGuestStopsCoreSliceTest.aGuestIsNeverToldTheStops]
      web:
        unit: [src/core/sharing/ShareGuestStops.test.ts, src/features/memories/components/ShareDialog.test.ts, src/core/sharing/FolderShareDialog.test.ts, src/core/sharing/FolderShareDialog.edit.test.ts, src/features/depot/components/DropBoxShareDialog.test.ts, src/features/memories/share.test.ts]
    gaps:
      - surface: web
        reason: >-
          Component tests over the served stops; a stopped link's row has not been looked at in a real browser.
  - id: a-stopped-link-is-fixed-in-place
    text: >
      A link a requirement stops comes back as the same link (its id, so its address and key) once its owner gives it
      what it misses, from the row in every panel: a password, after which its guest meets the password prompt instead
      of the 404; an end date within the days counted from when it was made, after which it is served. The edit is judged
      as it leaves the link, so a write toward the requirement is accepted and one that still misses one is refused
      (422, nothing written); switching it back on is never refused by a requirement. A link older than the lifetime
      takes no end date and is renewed as a new link with a new address, which its row says (owner, 2026-10-16).
    coverage:
      backend:
        integration: [ShareGuestStopsCoreSliceTest.aMemberGivesAStoppedLinkAPasswordAndItsGuestMeetsThePromptInsteadOfThe404, ShareGuestStopsCoreSliceTest.aMemberGivesAStoppedLinkAnEndDateWithinTheLifetimeAndTheSameLinkServesAgain, ShareGuestStopsCoreSliceTest.aWriteThatMeetsOneRequirementOfTwoIsRefusedAndOneThatMeetsBothServes, ShareGuestStopsCoreSliceTest.aLinkOlderThanTheLifetimeIsRefusedEveryEditAndIsRenewedAsANewLink, ShareGuestStopsCoreSliceTest.aSwitchedOffLinkThatMissesAPasswordIsSwitchedBackOnAndThenGivenOne]
      web:
        unit: [src/core/sharing/ShareGuestStops.test.ts, src/core/sharing/FolderShareDialog.edit.test.ts, src/features/memories/components/ShareCreateDialog.test.ts, src/features/memories/components/ShareDialog.test.ts, src/features/depot/components/DropBoxShareDialog.test.ts]
    gaps:
      - surface: web
        reason: >-
          Component tests over the edit, with the share API stubbed at its module; the backend's slice test carries the
          same link from stopped to served. Not run end to end in a real browser.
  - id: a-deleted-links-uploads-stay
    text: >
      Deleting a link keeps the photos its guests added: members' media page still serves the uploader guest's wrapped
      key, the bucket list still names the guest, the Memory's drop key is unchanged, and no byte is reclaimed. A guest
      identity goes only once its link is deleted and no media row (trashed included) and no bucket references it — a
      guest who never uploaded goes with the delete, one who did with the purge of the last Memory holding their
      uploads; a live link keeps its guests (inbox #229).
    coverage:
      backend:
        integration: [ShareUploaderSliceTest.theGuestsUploadsSurviveTheirLink, ShareDeletedNodeSliceTest.aDeadGuestIdentityGoesAndALiveOneStays]
  - id: a-share-id-is-never-minted-twice
    text: >
      A deleted link's tombstone keeps holding its id, and the scope purge — which must remove a group's share rows —
      retires each erased id; createShare refuses either with id_taken, so no one holding a dead link's id and key can
      mint a share under it (ADR 0029 §7).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.theOwnerDeletesALinkAndItIsGoneEverywhere, ScopesMemoriesSliceTest.aPurgedGroupsShareIdsStayDead]
