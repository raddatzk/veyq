useCase: uc.sharing.share-shared-scope
feature: sharing
title: Public-share a Memory in a shared scope (group / tenant)
# Built (web vertical, cr-0104 + ADR 0029 §6; re-issue + the re-activation refusal, ADR 0075): ANY member of a
# group or tenant scope may public-share a Memory there (all three built roles), gated on scope-membership AND the
# role's sharing.* capability (ADR 0032) — any member may publish, not only an owner. Member removal soft-revokes
# (enabled=false) every share the removed member created in that scope (or, opted in, every share of the group); any
# remaining member may re-activate a deactivated share, which transfers its owner_account — unless a departed member
# may hold its link, which then comes back only as a re-issue (a new id + key, the old one off, one transaction) — the
# removal count marks that on a tenant, and a bulk switch-off's mark makes it stick. K_mem is stable across rotation (ADR 0024), so the share
# follows new content and cannot be rotated away — the server-side deactivation IS the honest-server revocation
# (the only forward layer for a tenant, which is ACL-revoke).
acceptanceCriteria:
  - id: member-authored-any-scope
    text: A member of a group/tenant scope may createShare a MEMORY in that scope (personal still works); the create-gate is "MEMORY in a scope the caller is a member of" AND the role's sharing.* capability — not owner-only, not personal-only. A non-member cannot (no reveal).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks, ShareSliceTest.nonMemberCreateIs404, ShareSliceTest.folderNodeIsRejected]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: removal-deactivates-shares
    text: Removing a member from a scope soft-revokes (enabled=false) every share that member created in that scope; the anonymous resolve + gated blob endpoint then 404. Runs independently of the group scope-key rotation the removal also triggers.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.removingGroupMemberDeactivatesOnlyTheirShares, ShareSharedScopeSliceTest.removingTenantMemberDeactivatesTheirTenantScopeShares]
  - id: reactivation-transfers-ownership
    text: Any remaining member may re-enable a deactivated share; doing so transfers owner_account to the re-activating member, so an active share is always owned by a current member (a later removal of the new owner deactivates it again).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.reactivateByAnotherMemberTransfersOwnershipAndResolves, ShareSharedScopeSliceTest.reactivateByNonMemberIs404]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: follows-new-content
    text: Because K_mem is stable and never re-keyed (ADR 0024, no re-encryption), content added to the shared Memory after a rotation seals under the same K_mem and is visible via the existing share; the URL/fragment never changes and no re-wrap is performed.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks]
  - id: operator-blind-unchanged
    text: A shared-scope share is the same opaque record shape (shareId, symWrap(K_share,K_mem), role, sealed name, nodeId, owner_account, enabled) and adds no new operator-visible signal; the server never sees K_share, K_mem, names, or the visitor. The manage list's `mine` flag is derived per request, never stored.
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.groupMemberCanShareAndAnonymousResolveWorks, ShareSharedScopeSliceTest.listForNodeShowsEveryMembersSharesWithMineFlag]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: reactivation-refuses-a-departed-members-link
    text: >
      Re-activation is refused 409 reissue_required, nothing written, when a bulk switch-off marked the share, when its
      owner is no longer a member of its scope (a removed group member, or a removed tenant member's own tenant-scope
      share), or when it carries a recovery copy sealed below the scope's current epoch or minted before the scope's
      last member removal — the removal count marks a co-member's tenant link, and a co-shared group's link while its
      queued rotation has not run; a share without a copy is judged by the switch-off and its owner alone. The manage
      list serves the same predicate per row (reissueRequired), and the panel marks such a link and offers renew
      instead of re-activate (ADR 0075 point 4).
    coverage:
      backend:
        unit: [ReissuePolicyTest.aBulkSwitchOffAloneRequiresAReissue, ReissuePolicyTest.aDepartedOwnerAloneRequiresAReissue, ReissuePolicyTest.aCopyBelowTheCurrentEpochAloneRequiresAReissue, ReissuePolicyTest.aCopyMintedBeforeARemovalAloneRequiresAReissue, ReissuePolicyTest.aShareWithoutACopyIsJudgedByTheSwitchOffAndItsOwnerAlone]
        integration: [ShareSharedScopeSliceTest.reactivatingARemovedMembersShareIs409ReissueRequired, ShareSharedScopeSliceTest.reactivatingAShareSealedBeforeTheKeyChangedIs409ReissueRequired, ShareSharedScopeSliceTest.reactivatingOwnShareSealedAtTheCurrentEpochResolves, ShareSharedScopeSliceTest.reactivatingARemovedTenantMembersTenantShareIs409ReissueRequired, ShareSharedScopeSliceTest.aCoMembersTenantLinkMintedBeforeARemovalIsNotRevived, ShareSharedScopeSliceTest.aCoMembersTenantLinkWithoutACopyIsRevivedAfterARemoval, ShareSharedScopeSliceTest.aCoSharedGroupLinkIsMarkedBeforeItsQueuedRotationRuns]
      web:
        unit: [src/features/memory/components/ShareDialog.test.ts, src/features/memory/share.test.ts]
  - id: reissue-replaces-a-link-in-one-request
    text: Re-issue creates a new share (fresh id, fresh K_share, the old one's settings re-sealed, recovery copy at the current epoch, role and Memory from the old row, an UPLOADER keeping the Memory's drop key) and turns the old one off in one transaction; a stale epoch, a taken id or keys that do not match the role write nothing; an enabled share is its owner's to re-issue, a disabled one any member's (who owns the new share). The old K_share opens nothing the new share carries (ADR 0075).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.reissueReplacesTheLinkInOneRequestAndKeepsTheRoleAndMemory, ShareSharedScopeSliceTest.reissueAtAStaleEpochIs409AndWritesNothing, ShareSharedScopeSliceTest.aCoMembersEnabledShareIsNotReissuableButADisabledOneIsAdopted, ShareSharedScopeSliceTest.anUploaderReissueSealsTheExistingDropKeyAndNeverAWrap, ShareSharedScopeSliceTest.aReissueIntoATakenIdIs409AndLeavesTheOldLinkOn]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: removal-can-turn-off-every-link
    text: A removal-rotation with revokeLinks turns off every enabled share of the group, whoever created it, in the removal's transaction; without it only the removed member's own go off; revokeLinks without removesUserId is 400 with nothing stored. The removal confirmation carries the opt-in, unchecked by default (ADR 0075).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.aRemovalWithRevokeLinksTurnsOffEveryLinkOfTheGroup, ShareSharedScopeSliceTest.removingGroupMemberDeactivatesOnlyTheirShares, ShareSharedScopeSliceTest.revokeLinksWithoutARemovalIs400AndStoresNothing]
      web:
        unit: [src/features/spaces/GroupMembersPanel.test.ts]
  - id: a-switch-off-sticks
    text: Every bulk switch-off — a group removal's or a tenant removal's revokeLinks, and a scope owner's revokeScopeShares — marks each share it turns off, so even one with no recovery copy whose owner is still a member comes back only by re-issue; a share minted afterwards is untouched (A5, ADR 0075 point 5).
    coverage:
      backend:
        integration: [ShareSharedScopeSliceTest.aRemovalsSwitchOffMarksEveryLinkItTurnsOff, ShareSharedScopeSliceTest.aScopeOwnersSwitchOffTurnsOffEveryLinkAndItSticks]
