useCase: uc.sharing.browse-a-received-share-in-place
feature: sharing
title: Browse a received share in place, inside the space
# Planned (ADR 0121, changes/cr-browse-a-received-share-in-place.md): every criterion lands with its phase.
status: planned
acceptanceCriteria:
  # P2 (backend)
  - id: share-api-answers-any-origin
    text: While core.public-shares.embeddable is effective, the public share API under /api/shares/{shareId}, /api/setup and /api/moderation/key answer a preflight 204 and carry Access-Control-Allow-Origin * and CORP cross-origin, never Access-Control-Allow-Credentials; switched off, and on every other path, they stay same-origin.
    coverage:
      backend:
        integration:
          - ShareCrossOriginSliceTest.everyPathClassAnswersAnyOriginWhileTheSwitchIsOn
          - ShareCrossOriginSliceTest.theServerOwnersSwitchMakesEveryPathClassSameOriginAgain
          - ShareCrossOriginSliceTest.theTenantsSwitchReachesItsServedLinksAndNothingElse
          - ShareCrossOriginSliceTest.aLinkTheGateDoesNotServeGetsExactlyTheUnknownIdsAnswer
          - ShareCrossOriginSliceTest.aCuratorsOperationOnALinkAndAMembersPathStaySameOrigin
          - ShareCrossOriginSliceTest.anOptionsThatIsNoPreflightIsStillAnUndeclaredMethod
          - ApiMethodIndexContractTest.theGuestShareOperationsOfferedCrossOriginAreTheContractsUnauthenticatedOnes
  # P3 (backend; the dev policy in web)
  - id: csp-widened-only-while-on
    text: The app shell's connect-src gains the https scheme exactly while core.share-embedding is effective for the tenant; switched off by the operator or the tenant, the policy is as before.
  # P4 (the check), P5 (the fallback line)
  - id: embeds-only-what-says-it-may
    text: A bookmark embeds only where the share's instance serves the same major, core.public-shares and core.public-shares.embeddable; anything else falls back to opening the link, with its reason.
  # P4 (the seams), P5 (the embedded view)
  - id: guest-inside-member-page
    text: The embedded view reads and writes through the share's own API base under a guest access of its own; no member access, key or door reaches it, and device-kept guest state is keyed by the share's origin.
  # P5
  - id: gates-writes-report
    text: The password, terms, note and naming gates run inline in the share page's order; a READ_WRITE write and a WRITE_ONLY drop reach the share's instance; a report seals to its moderation key.
gaps:
  web: "not built yet (CR phases P4-P5); the dev policy's https: and http://*.localhost:* are held by src/web/src/shared/security/csp.test.ts, cited once this file leaves planned"
