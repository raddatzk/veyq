useCase: uc.sharing.share-note
feature: sharing
title: Share note — a curator attaches an editable message to a share
# cr-0115 (ADR 0036) delivers it end-to-end: contracts (sealedNote + sealedShareKey on create, sealedNote on
# resolve/summary, a new owner-gated updateShare) → backend (two nullable TEXT columns on veyq_share, updateNote
# owner-gated) → web (share.ts seal/recover/read + updateShareNote, the ShareDialog note field + in-place editor,
# the ShareView note banner reusing the cr-0114 markdown renderer). The note seals under a field key derived from K_share (AAD share-note);
# a member-recoverable sealed_share_key (K_share under K_SC(epoch), ADR 0036 point 4) lets the curator edit it in
# place — operator-blind (K_share never in the clear). Backend slice tests run over the full HTTP stack; the note
# lifecycle is hermetic there (it needs the grant flow + client crypto), and sharing.http asserts the updateShare
# auth wall.
# cr-0116 extends this: the note becomes PER-LOCALE (a {de,en} JSON map sealed the same way, no contract change — the
# viewer picks their locale), a share gains an optional private NAME (sealed_share_name, a field key derived from K_share, management-
# only — never on the viewer resolve), and the dialog is redesigned (list-only + a separate create dialog, the
# uploader as its own rights-gated action, copy-only links). The anonymous acceptance gate + password
# protection are later CRs (cr-0117 / cr-0118).
# cr-share-note-acceptance-gate adds the note's acceptance switch (ADR 0036 point 2), web only: the switch rides
# inside the sealed note, so the wire and the backend are unchanged and there is no backend behaviour to cover. The
# acceptance is client-only localStorage keyed by share id + the digest of the opened plaintext (the server records
# nothing about the accountless visitor). Its wire half (a minted note with the switch resolves with the gate, and
# `mustAccept` is no field on the raw wire) also runs in src/features/memory/folderShare.e2e.test.ts.
acceptanceCriteria:
  - id: curator-sets-note-at-creation
    text: When creating a share, the curator may attach an optional note; the client seals it under a field key derived from K_share (AAD share-note) and stores it alongside sealed_share_key (K_share sealed under K_SC at the scope's current epoch, with that epoch). A share with no note stores nothing and shows no banner.
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithNoteThenAnonymousResolveReturnsIt, ShareNoteSliceTest.createWithoutNoteResolvesNullAndTheManageListCarriesTheRecoverableKey] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: note-shown-and-rendered-on-share-page
    text: The anonymous resolveShare returns sealedNote; the share page unwraps it with the fragment K_share and renders it as markdown (safe subset) — a banner for READ/READ_WRITE, the instruction above the name field for WRITE_ONLY.
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithNoteThenAnonymousResolveReturnsIt] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: note-editable-in-place
    text: The curator edits an existing share's note (per-locale) + name without a new link — recover K_share from sealed_share_key, re-seal, call the owner-gated updateShare (PATCH, a full replace of note + name); the same shareId then shows the new values. A non-owner edit is a 404; a blank clears it.
    coverage:
      backend: { integration: [ShareNoteSliceTest.ownerEditsTheNoteInPlaceAtTheSameShareId, ShareNoteSliceTest.editingWithNullClearsTheNote, ShareNoteSliceTest.aNonOwnerEditIs404AndLeavesTheNoteUnchanged, ShareNoteSliceTest.renameViaUpdateShareChangesTheNameKeepsTheNoteAndTheLink] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: operator-blind
    text: The server stores only ciphertext — sealed_note (per-locale) + sealed_share_name + sealed_share_key (openable only with K_SC, which the operator lacks); K_share is never in the clear, the name is never served to the viewer, and updateShare swaps one ciphertext for another. No key or plaintext crosses the boundary (ADR 0036).
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithoutNoteResolvesNullAndTheManageListCarriesTheRecoverableKey, ShareNoteSliceTest.createWithANameShowsItInTheManageListButNeverToTheViewer] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: share-key-recoverable-by-members-only
    text: A share's K_share is recoverable only by the Memory's scope members - its recovery copy is sealed under K_SC(epoch), which no share link carries. So no link, with or without a dump, opens another share's password, private label or note, or rebuilds its link. The copy is sealed at the scope's current epoch - a create at any other epoch is 409 stale_epoch with nothing written, and a key without its epoch (or the reverse) is 400.
    coverage:
      backend: { integration: [ShareKeyRecoveryEpochSliceTest.aCreateAtAnEpochOtherThanTheScopesCurrentIs409StaleEpochAndWritesNothing, ShareKeyRecoveryEpochSliceTest.aKeyWithoutItsEpochAndAnEpochWithoutItsKeyAreEach400, ShareKeyRecoveryEpochSliceTest.aCreateAtTheCurrentEpochSucceedsAndTheManageListServesThatEpoch] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: note-acceptance-switch-sealed-inside-the-note
    text: >
      With a note, the curator may tick "must be accepted before opening" — a checkbox under the note editor, off by
      default, enabled only while the note has text, read back on edit from the opened note and carried by a renew.
      It is sealed INSIDE the note — the plaintext is {"texts": {locale: markdown}, "mustAccept": true}
      — and a note with the switch off is written as the flat {locale: markdown} map, exactly as before, so the
      operator cannot tell which links ask. A note with no text seals nothing, switch or not.
    coverage:
      web:
        unit: [src/core/sharing/manageShares.test.ts, src/core/sharing/shareNote.test.ts, src/core/sharing/FolderShareDialog.edit.test.ts, src/features/memory/components/ShareCreateDialog.test.ts]
  - id: note-acceptance-gate-on-the-share-page
    text: >
      A note that asks to be accepted is a gate of the share page after the password and the tenant's terms and
      before anything of the share is drawn or fetched, for READ, READ_WRITE and WRITE_ONLY alike: the rendered note
      (safe markdown) and Accept, no decline. Once accepted the share opens and the note is not repeated as its
      banner. The gate page calls no authenticated client.
    coverage:
      web:
        unit: [src/views/ShareView.memory.test.ts]
  - id: note-acceptance-remembered-on-the-device-only
    text: >
      Accepting is remembered on the visitor's device only (localStorage), keyed by the share id and a digest of the
      opened note plaintext — never the note's text, never an account — so a reload opens the share and an edited
      note asks again. Where storage is unavailable or throws, the gate asks on every load; it never skips the gate
      because nothing could be remembered. Nothing is sent to the server.
    coverage:
      web:
        unit: [src/core/sharing/shareNote.test.ts, src/views/ShareView.memory.test.ts]
  - id: old-or-malformed-note-never-traps
    text: >
      A note written by an older client (the flat map) never gates. A plaintext of any other shape — an unknown
      shape, a non-boolean mustAccept, a text that is not a string, an unknown key — opens as no note at all (no
      text, no gate), exactly like a seal that does not open: never a gate the visitor cannot pass.
    coverage:
      web:
        unit: [src/core/sharing/resolvePublicShare.test.ts, src/core/sharing/shareNote.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`e2e/tests/features/field-seal.spec.ts`) drives `curator-sets-note-at-creation`,
    `note-shown-and-rendered-on-share-page` in Chromium against the release candidate's two images, installed through
    `veyqctl` (ADR 0090), each test tagged with its criterion. The note and the label set at creation read back in the
    curator's Edit share after a reload and on a second device; the guest reads the note on the share page, also after a
    reload. Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the
    first CI run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that
    run each file becomes a ref on the criteria its tests are tagged with, and this gap goes.
