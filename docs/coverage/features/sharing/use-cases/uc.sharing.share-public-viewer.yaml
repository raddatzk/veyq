useCase: uc.sharing.share-public-viewer
feature: sharing
title: Share a Memory as a public viewer link (web)
# Built (web vertical, cr-0100 + ADR 0029): a public READ share of one Memory (any scope, ADR 0029 §6) —
# symWrap(K_share, K_node), the key in the URL fragment, an unguessable 256-bit shareId, an unauthenticated
# resolve + gated presigned blob reads, revoke/expiry (a close, ADR 0114), and the operator-served-viewer trust-tier
# honesty carried by a footer link. The six criteria are covered by the backend slice (create -> anonymous
# resolve -> gated blob -> revoke/expiry -> subtree isolation), the http guest-boundary assertions, and the web
# unit round-trip of the operator-blind decrypt path. v1 scope is deliberately narrow: personal-scope
# Memories, READ role only; contributor/uploader, password protection, group/tenant sharing, persisted-shares
# and notices are separate later slices.
acceptanceCriteria:
  - id: create-public-share
    text: A curator turns one of their personal-scope Memories into a public share — the client generates a random K_share and a 256-bit unguessable shareId, computes symWrap(K_share, K_node), re-seals the Memory name under a field key derived from K_share, and POSTs { shareId, nodeId, role READ, wrap, sealedName, expiresAt? }. The server stores the record opaquely under that id; it never sees K_share, K_node, or the name. The link is /s/{shareId}#k=base64url(K_share) with the key in the fragment.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareSliceTest.listReturnsCallersSharesForTheMemory]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: anonymous-resolve-decrypt
    text: GET /api/shares/{shareId} is unauthenticated and returns the record plus the sealed subtree (Memory node + chapters, under K_node). The viewer unwraps K_node with the fragment key and decrypts names/layout/metadata locally, rendering the Memory read-only. The shareId alone is inert — without the fragment key nothing decrypts; both halves are required.
    coverage:
      # cr-sharing-contributor-e2e: the live proof rides in on the contributor suite, because a READ_WRITE share
      # resolves through the identical resolveShare path — an anonymous, session-less caller recovering the Memory
      # name and the per-locale note from nothing but the shareId and the URL fragment key.
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareCoreSliceTest.unknownShareResolves404, ShareGuestNamesSliceTest.theResolveServesNoMediaAndNoIdentities]
      web:
        unit: [src/features/memories/share.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: anonymous-media-read
    text: GET /api/shares/{shareId}/media is unauthenticated, passes the same password gate as the resolve, and returns the Memory's media metadata (sealed under field keys derived from K_node) plus the wrapped keys of the uploader identities whose media it holds — never a name. The viewer decrypts it locally with the K_node the resolve's wrap yields.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareGuestNamesSliceTest.aViewerLinkIsServedTheUploadersKeyButNoName, SharePasswordSliceTest.theMediaReadRequiresThePasswordToken]
      web:
        unit: [src/features/memories/share.test.ts, src/features/memories/source.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: guest-sees-the-member-view
    text: >-
      A READ link's page is the member's view with every member-only function absent (inbox #401): behind the shell's
      gates, core's page renders the member's level view at a folder and the kind's member detail at any other node,
      the link's root included — a Memory or a chapter link is the member's Memory detail (its gallery, the lightbox
      with the download, the Chapters tab), never a guest-only body. A chapter opens through the tree's link with the
      #k= fragment kept; a breadcrumb leads back to the root; the curator's note shows once and a role badge says
      read-only. Nothing of the member's world is read (the active scope, the node tree, the pins, the item marks, the
      covers), no authenticated client is called, no member-only control is offered (rename, delete, share, pin,
      marks, the cover, date and place editors, the contributions organizer, the media trash), and the node's date
      and place are never written back. A WRITE_ONLY link alone gets its application's drop page.
    coverage:
      web:
        unit: [src/views/ShareView.memory.test.ts, src/views/ShareView.registry.test.ts, src/core/sharing/ShareTreePage.test.ts, src/features/memories/components/MemoryDetail.guest.test.ts, src/features/memories/components/MediaLightbox.test.ts]
  - id: gated-blob-read
    text: A share-scoped blob endpoint authorizes a read iff the blob is attached under the shared subtree (a structural check on opaque ids), returns a presigned store URL, and the viewer fetches bytes directly from the object store. The operator never learns which media a viewer opens. A cross-share/out-of-subtree blob id is 404.
    coverage:
      # The slice proves the authorization decision; the e2e proves the whole gated read — presign, fetch the
      # ciphertext straight from the store, decrypt under the right K_node, bytes intact — plus the negative half
      # against a live stack (a blob that leaves the subtree's live set is a non-enumerable 404, asserted on the
      # status code rather than on "it threw").
      backend:
        integration: [ShareSliceTest.gatedBlobAllowsInSubtreeAnd404sOutOfSubtree]
      web:
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: soft-revoke-and-expiry
    text: enabled=false or a passed expiresAt makes the resolve AND the gated blob endpoint 404 (same shape as an unknown id — non-enumerable). Content a visitor already downloaded is not retractable (stated limitation); what the close re-keys below the link's root is en.sharing.public-link § Lifecycle's (ADR 0114).
    coverage:
      backend:
        integration: [ShareSliceTest.revokeMakesGuestPaths404, ShareSliceTest.expiredShareResolves404]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: set-and-show-expiry-web
    text: The web curator can set an optional expiry on a share — on create AND edit (a date picker; the link works through the end of the chosen day) — and sees it on the manage list next to the created date. On edit expiresAt is a full replace like sealedNote/sealedShareName — the dialog pre-fills it and re-sends it, so an unrelated edit keeps it, and toggling it off clears it. The backend accepts + enforces expiresAt on both create and update.
    coverage:
      backend:
        integration: [ShareNoteSliceTest.ownerSetsAnExpiryInPlaceAndAnExpiredShareResolves404, ShareNoteSliceTest.ownerClearsAnExpiryInPlaceAndTheShareResolvesAgain, ShareNoteSliceTest.aFullReplaceEditThatOmitsExpiresAtClearsIt]
      web:
        unit:
          - src/features/memories/components/ShareCreateDialog.test.ts
          - src/features/memories/components/ShareDialog.test.ts
  - id: least-privilege-personal-only
    text: A share exposes only that one Memory subtree — K_node is random and independently wrapped, so the link reveals neither K_SC (the rest of the scope) nor any sibling Memory's K_node (crypto-enforced least privilege, ADR 0012). Which node kinds may be a share root, with which roles, is the kind's owner's (ShareRoots, ADR 0080) — a MEMORY and a CHAPTER with every role (a chapter link is a smaller Memory link — its guest reads the chapter and nothing of the Memory above or of a sibling chapter, ADR 0080 decisions 9 and 13), a FOLDER with READ or READ_WRITE (never WRITE_ONLY), any other kind none (422). This use-case's v1 was personal-scope only; group/tenant Memories became shareable in cr-0104 (uc.sharing.share-shared-scope), gated on scope membership.
    coverage:
      backend:
        integration: [ShareSliceTest.resolveLeaksNothingOutsideTheSubtree, ShareRootsSliceTest.aChapterIsAShareRootForEveryRole, ShareRootsSliceTest.aFolderIsNoDropBox, ChapterShareSliceTest.aChapterGuestReadsTheChapterAndNothingOfItsMemory]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: operator-blind-and-tier-honesty
    text: The server stores only shareId, the wrap, the plaintext role, the sealed name, and nodeId — never K_share/K_node/names/viewer/which-media. The no-install viewer is operator-served web (passive-operator-safe, not operator-proof against an active foreign operator); this is surfaced honestly via a footer link to veyq's security documentation, not an explicit in-viewer warning. Self-hosted (operator = curator) makes the gap moot.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareSliceTest.createRequiresAuth]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: folder-share-root
    text: >-
      A member shares a folder READ through core's own dialog: the link wraps the folder's own key under K_share and
      seals its name under a field key derived from K_share. The guest's resolve has rootKind FOLDER and the descendants'
      names and key wraps, each under (a field key derived from) its parent's key, and nothing of the root's own entry nor of anything beside or above it; a blob
      under the subtree is served, one beside it is 404. The guest page browses the folder as a member does — core's
      level view handed the guest's access and tree (inbox #401 S2): a Memory is the member's card with its sealed date
      and cover, a sub-folder a folder card, nothing a member alone may do is offered and no authenticated client is
      called — a breadcrumb along the parent chain and every card keeping the #k= fragment on a real click; a node that
      is not a folder renders its kind's member detail (a Memory the member's Memory detail), handed the guest's access
      and tree.
    coverage:
      backend:
        integration: [CoreAloneSliceTest.aFolderIsSharedToReadOrContributeAndNothingElseIs, CoreAloneSliceTest.aGuestOfAFolderShareResolvesTheSubtreeUnderIt]
      web:
        unit: [src/core/sharing/folderShare.wire.test.ts, src/core/sharing/FolderShareDialog.test.ts, src/core/sharing/ShareTreePage.test.ts, src/core/sharing/ShareTreePage.breadcrumb.test.ts, src/core/sharing/guestAccess.test.ts, src/features/memories/components/FolderShareGuest.test.ts, src/features/memories/levelRows.guest.test.ts, src/features/memories/components/MemoryDetail.guest.test.ts, src/views/ShareView.folder.test.ts]
        e2e: [src/features/memories/folderShare.e2e.test.ts]
  - id: chapter-share-root
    text: >-
      A member shares a chapter through the same dialog as a Memory, worded for a chapter. The chapter link's guest
      opens the chapter's own key, its title (as the share's sealedName), the chapters below it and their media, and
      nothing of the Memory above or of a sibling chapter; the resolve serves no node above the root.
    coverage:
      backend:
        integration: [ChapterShareSliceTest.aChapterGuestReadsTheChapterAndNothingOfItsMemory, ShareRootsSliceTest.aChapterIsAShareRootForEveryRole]
      web:
        unit: [src/views/SpaceView.test.ts, src/features/memories/share.test.ts, src/views/ShareView.test.ts, src/views/ShareView.memory.test.ts, src/features/memories/components/ShareDialog.test.ts]
        e2e: [src/features/memories/chapterShare.e2e.test.ts]
  - id: root-rename-reseals-share-names
    text: >-
      When a member renames a share root, that member's client re-seals the new name under every open share's own
      K_share — its own shares and other members' — through each share's recovery copy, and stores it with
      setShareSealedName, which any member with write access on the scope may call (a reader or a stranger is 404)
      and which changes sealed_name only. A closed share (switched off or past its end date) is left as it is, since
      nothing new is sealed under a closed link and its reopen carries the root's name (ADR 0114 decision 5): the
      server refuses a re-seal of one (422 link_closed), which the client counts as closed, not failed. A share without a recovery copy is skipped and a refused
      write is collected; the next share is still tried, nothing rolls back, and either is reported to the member
      as one notice, never as a failed rename.
    coverage:
      backend:
        integration: [ShareSealedNameCoreSliceTest.theOwnerAndAnotherWritingMemberSetItAndResolveServesTheNewName, ShareSealedNameCoreSliceTest.aReaderIsRefusedAndWritesNothing, ShareSealedNameCoreSliceTest.aStrangerIsRefusedAndWritesNothing, ShareSealedNameCoreSliceTest.everyOtherColumnOfTheShareStaysUntouched, ShareSealedNameCoreSliceTest.aDeletedShareAndAnUnknownIdAre404, ShareSealedNameCoreSliceTest.aRevokedShareRefusesAReSealItsOpenSiblingTakesItAndItsReactivationShowsTheNameItCarries, ShareSealedNameCoreSliceTest.aLinkPastItsEndDateRefusesAReSeal, ShareSealedNameCoreSliceTest.aReSealOverlappingARevokeIsDecidedUnderTheShareRow, ShareSealedNameCoreSliceTest.aReSealOverlappingAReactivationEndsConsistentWithoutADeadlock]
      web:
        unit: [src/core/sharing/manageShares.test.ts, src/core/sharing/resealShareNames.wire.test.ts, src/core/node/FolderNameDialog.test.ts]
  - id: a-link-blocked-by-the-operator
    # Alternate flow A4, added by cr-moderation-review-and-measures (uc.moderation.take-a-measure).
    text: >-
      A link a moderator blocked, or one a blocked guest uploader came through, answers every guest path exactly as an
      unknown link; the curator's share list names the stop, and neither a reactivation nor (for a blocked link) a
      re-issue passes until it is lifted. Content blocked inside a live link is served to the guest as the member sees
      it: marked, its bytes refused with 451.
    coverage:
      backend:
        integration: [ModerationMeasuresSliceTest.aBlockedShareAnswersEveryGuestPathAsAnUnknownLinkAndServesAgainOnceLifted, ModerationMeasuresSliceTest.aBlockedGuestUploaderIsRefusedWithItsLinkWhileTheCreatorsReissuedLinkTakesANewGuest, ModerationMemoriesSliceTest.blockedContentAnswersEveryByteRead451IsMarkedInEveryListingAndItsSiblingStillServes]
      web:
        unit: [src/core/node/LevelView.blocked.test.ts, src/core/sharing/ShareGuestStops.test.ts]
gaps:
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/scenarios/memory-roundtrip.spec.ts`, `tests/e2e/tests/features/account/field-seal.spec.ts`)
    drives `anonymous-resolve-decrypt`, `create-public-share`, `guest-sees-the-member-view` in Chromium against the
    release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with its criterion. The
    field-seal scenario resolves a contributor link: the Memory's name the link carries, opened anonymously. Green only
    in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`checks.yml` → `stack`) awaits the first CI run (no
    remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that run each file
    becomes a ref on the criteria its tests are tagged with, and this gap goes.
