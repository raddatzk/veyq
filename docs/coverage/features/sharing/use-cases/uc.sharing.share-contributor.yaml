useCase: uc.sharing.share-contributor
feature: sharing
title: Share a Memory as a contributor link (anyone with the link can add photos)
# Built (web vertical, cr-0101 + ADR 0030): a READ_WRITE public share of one Memory (any scope, ADR 0029 §6) — the viewer
# share (symWrap(K_share, K_node), key in the URL fragment) plus a mandatory display name sealed under a field key derived from K_node → an
# anonymous share identity (the buckets forward-compat hook), share-scoped UNAUTHENTICATED upload endpoints
# (presign mirror + complete, gated by role READ_WRITE + enabled + a contributor token), and direct-append
# attribution. Covered by the backend slice (create READ_WRITE → identity-create → share-scoped upload attaches
# + stamps the identity → surfaces in the resolve; READ/bad-token/revoke rejected), the http guest-boundary
# assertions, and the web unit round-trip of the operator-blind name seal. v1 is deliberately narrow: role READ_WRITE only (view + append),
# direct-append, personal scope; the buckets UI, the WRITE_ONLY drop-box, MANAGER/edit/delete, password protection
# and moderation are separate later slices.
#
# cr-sharing-contributor-e2e added the first LIVE coverage of this (or any) sharing flow:
# src/features/memories/shareContributor.e2e.test.ts drives curator -> READ_WRITE share -> anonymous resolve ->
# named identity -> two real presigned uploads direct-to-store -> gated blob read-back -> the curator recovering
# the contributor's name, against a real backend + MariaDB + the bundled store. It is the only layer that can
# reach the second byte transport at all (startShareBlobUploads -> real PUTs -> completeShareMedia), which the
# authenticated upload path never exercises.
acceptanceCriteria:
  - id: create-contributor-share
    text: A curator turns one of their personal-scope Memories into a READ_WRITE share — the curator picks the Contributor role in the Share dialog; the client mints K_share and a 256-bit shareId, computes symWrap(K_share, K_node), re-seals the Memory name under a field key derived from K_share, and POSTs { shareId, nodeId, role READ_WRITE, wrap, sealedName, expiresAt? }. The server stores the record opaquely under that id (role plaintext). The link is /s/{shareId}#k=base64url(K_share).
    coverage:
      backend:
        integration: [ShareContributorSliceTest.contributeFlowAttachesStampsIdentityAndSurfacesInResolve]
      web:
        unit: [src/features/memories/share.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: naming-proves-the-link-key
    text: Naming yourself proves the visitor holds the link's key, not only its id (ADR 0076). Every share is created with writeVerifier = SHA-256(writeToken), writeToken = HKDF(K_share, "veyq/v1/share-write:" + shareId), for every role (a READ link can be flipped to READ_WRITE); createShareIdentity presents the token as X-Share-Write. A missing, malformed or wrong token, the stored verifier itself, a token derived for another link, and a share holding no verifier all answer the non-enumerable 404 and write no identity; the whole link names a guest, who then uploads through the contributor token as before. A guest named before a verifier went missing keeps uploading. The manage list marks each READ_WRITE or WRITE_ONLY link holding no verifier (newGuestsRefused) — and no READ link, and no link that holds one — and the panel shows that mark on the row. Every row also says whether it holds no verifier whatever its role (writeVerifierMissing), and a role edit that would make such a link a READ_WRITE one warns and offers the renew, since an edit never adds a verifier.
    coverage:
      # The slice holds the server half — each refusal beside its positive control on the same share; the web unit
      # holds the derivation through the real createShare/createContributorIdentity; the e2e names a guest through
      # the proof against a real backend.
      backend:
        integration: [ShareWriteProofSliceTest.anIdWithoutTheKeyNamesNoGuest, ShareWriteProofSliceTest.aViewerLinkFlippedToContributorIsGatedByTheSameProof, ShareWriteProofSliceTest.aShareWithoutAVerifierTakesNoNewGuestButKeepsItsOld, ShareWriteProofSliceTest.createWithoutAVerifierIs400AndStoresNothing, ShareWriteProofSliceTest.theManageListMarksAGuestLinkThatHoldsNoVerifier, ShareWriteProofSliceTest.theManageListSaysWhichLinksHoldNoVerifierWhateverTheirRole]
      web:
        unit: [src/features/memories/share.test.ts, src/features/memories/components/ShareDialog.test.ts, src/features/memories/components/ShareCreateDialog.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: sealed-name-anonymous-identity
    text: Before contributing, the visitor must enter a display name (mandatory) — asked at its first write in the share page's one naming dialog, never on a screen in front of the content. The client seals it under a field key derived from K_node and creates an anonymous share identity under a client-minted id via POST /api/shares/{shareId}/identities { identityId, sealedDisplayName } -> { identityId, contributorToken }. The server stores only the K_node-sealed name (ciphertext) + the token hash + shareId; it never sees the name. The sealed name -> identity is the forward-compat hook for buckets (a later slice).
    coverage:
      # The e2e proves the CROSS-ACTOR half no other layer reaches: an anonymous stranger seals a display name
      # under K_node, the server relays it as ciphertext onto the contributor's primary bucket, and the curator —
      # who never met them — opens it with openBucketName. The route is the bucket copy because it is the only
      # read that serves a guest's name at all: no public resolve does (ADR 0030 point 8; uc.memory.buckets
      # guest-names-for-members-only).
      backend:
        integration: [ShareContributorSliceTest.contributeFlowAttachesStampsIdentityAndSurfacesInResolve]
      web:
        unit: [src/features/memories/share.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: not-you-forgets-the-device-session
    text: >-
      Named, the page says whose session this device holds on the link, with a "Not you?" that asks first and then
      forgets the session on the device only — the next visitor names itself afresh, nothing on the server changes.
      One core component names every guest: the shell's dialog at a READ_WRITE guest's first write on any link (its
      one naming flow, under the share root's key — a Memory link's as a folder link's), and the two drop pages of a
      WRITE_ONLY link (Memories', Depot's).
    coverage:
      web:
        unit: [src/views/ShareView.naming.test.ts, src/views/ShareView.memory.test.ts, src/views/ShareView.test.ts, src/features/depot/components/DropBoxShareBody.test.ts, src/features/memories/source.test.ts]
  - id: share-scoped-upload
    text: Three share-scoped UNAUTHENTICATED endpoints mirror the media control plane, gated only on share state (role READ_WRITE + enabled + a valid contributor token) — POST /api/shares/{shareId}/blob-uploads opens sessions and presigns their first window of PUTs, POST /api/shares/{shareId}/blob-upload-windows presigns each next window, POST /api/shares/{shareId}/media completes + attaches. The contributor seals K_blob + derivatives + metadata under K_node and PUTs ciphertext direct-to-store; bytes never flow through the backend. A parallel authz path keyed on share state, never a relaxed member filter.
    coverage:
      # The slice proves the endpoints' authz; only the e2e proves the TRANSPORT — real presigned PUTs of real
      # sealed chunks into the bundled store, and the bytes coming back out through the gated presign byte-equal.
      backend:
        integration: [ShareContributorSliceTest.contributeFlowAttachesStampsIdentityAndSurfacesInResolve, ShareContributorSliceTest.badTokenRejectedOnUpload]
      web:
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: contributes-in-the-member-view
    text: >-
      A READ_WRITE link's page is the member's Memory view with a contributor's rights (inbox #401): the gallery and
      the Chapters tab — the guest navigates into a chapter as a member does, through the tree's link with the #k=
      fragment kept — and Upload, which adds photos to the Memory or chapter on screen: into a chapter the upload
      names the chapter as its target and seals under the chapter's own key (the server creates the guest's own
      bucket there), into the link's root it names none. Its own photos carry a delete on the tile and in the
      lightbox, asked first, then purged for good; nobody else's does, and no member-only control is offered.
    coverage:
      web:
        unit: [src/views/ShareView.memory.test.ts, src/features/memories/components/MemoryDetail.guest.test.ts, src/features/memories/source.test.ts, src/features/memories/components/MediaLightbox.test.ts]
  - id: direct-append-attribution
    text: Contributed media attaches to the node the guest uploaded into (the shared root, share.nodeId, or a Memory or chapter below it), stamped with the contributor's share_identity_id, and appears immediately (direct-append, no review gate). The anonymous media read serves it with no identityId, and neither the resolve nor the media read serves a contributor identity or name; the stamp and the sealed name reach the Memory's members through their bucket list, which groups by it (ADR 0030 point 8). A guest's page renders all contributed media inline.
    coverage:
      # The web e2e proves it on the live wire: the contribution attaches to the share's root node, surfaces
      # immediately in BOTH the anonymous media read and the curator's own listMedia, the raw media read carries no
      # identity and a null identityId, the raw resolve neither media nor identities, and the curator still
      # recovers the attribution through the bucket.
      backend:
        integration: [ShareContributorSliceTest.contributeFlowAttachesStampsIdentityAndSurfacesInResolve, ShareGuestNamesSliceTest.aContributorLinkIsServedNoneOfItsOwnGuests, ShareGuestNamesSliceTest.onlyAnUploadersMediaNamesItsIdentity]
      web:
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: operator-blind
    text: The server stores only the share record (shareId + wrap + plaintext role + sealed name + nodeId), an opaque share_identity (sealed contributor name + token hash + shareId), a share_identity_id stamp on media, and ciphertext blobs. It never sees K_share, K_node, the Memory name, the contributor's name, the photo bytes, or who the person is. The no-install contributor page carries the same trust-tier honesty (footer link, ADR 0026); a reported share is decryptable (T&S corollary), intended.
    coverage:
      # The e2e is the only ref here that reads the STORED BYTES rather than the client's intent: its
      # wire-assertion sweep (ADR 0053) proves the five values this flow sealed — the Memory name, the note's two
      # locales, the contributor's display name, the share's private name — appear in no row of the database the
      # run wrote. A unit test sees what the client meant to seal; only this sees what the operator ends up with.
      backend:
        integration: [ShareContributorSliceTest.contributeFlowAttachesStampsIdentityAndSurfacesInResolve]
      web:
        unit: [src/features/memories/share.test.ts]
        e2e: [src/features/memories/shareContributor.e2e.test.ts]
  - id: abuse-controls-and-revoke
    text: The unauthenticated upload path is gated by curator opt-in (role READ_WRITE) + the per-identity contributor token + the share enabled flag; revoke/expiry stops new uploads AND reads (403/404). The per-blob byte budget (ADR 0013) and a per-share rate limit are defense-in-depth. Soft (L1) revocation does not retract already-uploaded media (like already-read content); the curator deletes unwanted photos individually.
    coverage:
      backend:
        integration: [ShareContributorSliceTest.viewerShareRejectsContribution, ShareContributorSliceTest.revokeStopsContribution]
  - id: revocation-stops-an-in-flight-upload
    text: >-
      Revoking or expiring the link stops an in-flight upload at its next window. Each window runs the link's whole
      gate again (active share, password, upload role, contributor token), so an upload already under way gets no
      further URL once the link is gone — not only the next upload. A window does not spend the share's upload
      budget, which counts the writes that create sessions and rows.
    coverage:
      backend:
        integration: [ShareUploadWindowSliceTest.revokingTheLinkStopsAnInFlightUploadAtItsNextWindow]
      web:
        unit: [src/features/memories/share.test.ts]
  - id: role-mutable-in-place
    text: A curator changes an existing share's role in place (READ <-> READ_WRITE) via PATCH updateShare { role } (cr-0119, ADR 0036) — the same link / wrap / K_share are untouched (role is server-enforced plaintext authz, no re-crypto), so the new grant bites on the next guest request (a promote enables contribution at once; a demote 403s new uploads, already-contributed photos stay). Restricted to READ <-> READ_WRITE - setting role=WRITE_ONLY, or changing a WRITE_ONLY share's role, is 422 invalid_role_change (the write-only drop-box is a role chosen only when the link is made, its promise not flippable on distributed links). Owner-gated (a non-owner is 404, like the note edit); role is optional on the PATCH (omitted for a plain note/name edit). Web - the edit of a READ/READ_WRITE link shows the READ/READ_WRITE switcher (never the uploader role), and an upload link's edit shows none and sends no role.
    coverage:
      backend:
        integration: [ShareNoteSliceTest.promoteViewerToContributorInPlaceKeepsTheLinkAndEnablesContribution, ShareNoteSliceTest.roleChangeToUploaderIs422, ShareNoteSliceTest.changingAnUploaderShareRoleIs422]
      web:
        unit: [src/features/memories/components/ShareCreateDialog.test.ts]
  - id: picked-photo-is-never-silently-dropped
    text: >-
      A photo the visitor picked is uploaded — losing one silently is worse than failing loudly, and a visitor
      is the one person who cannot be told to pick again. The picker itself is the SHARED one; the Safari Photos
      window and its rules belong to uc.memory.upload E3 and are not restated here. What this use-case asserts
      is the outcome on the share page: the files already in hand are enqueued before any re-read runs, a file
      the browser delivers late is enqueued afterwards as its own additional batch, the input is released only
      once the window has closed (an early clear would discard those late arrivals), and the window is torn
      down if the visitor leaves mid-pick. A contributor picks in the member's Memory view, whose picker is the
      curator's own (inbox #401).
    coverage:
      web:
        unit: [src/features/memories/components/MemoryDetail.optimistic.test.ts]
  - id: contributor-root-kinds
    text: >-
      A contributor link may be rooted at a Memory, a chapter or a folder (ADR 0080 decisions 6 and 13). A chapter
      link's guest uploads into the chapter and deletes only its own; a member shares a folder READ or READ_WRITE
      through core's own dialog, never WRITE_ONLY, and the link wraps the folder's own key under K_share.
    coverage:
      backend:
        integration: [ChapterShareSliceTest.aContributorOnAChapterUploadsIntoItAndDeletesOnlyItsOwn, ShareRootsSliceTest.aChapterIsAShareRootForEveryRole, CoreAloneSliceTest.aFolderIsSharedToReadOrContributeAndNothingElseIs, ShareRootsSliceTest.aFolderIsNoDropBox]
      web:
        unit: [src/views/SpaceView.test.ts, src/core/sharing/FolderShareDialog.test.ts, src/core/sharing/folderShare.wire.test.ts]
        e2e: [src/features/memories/chapterShare.e2e.test.ts]
  - id: rights-inherit-below-a-folder
    text: >-
      A READ_WRITE folder link gives its guest a contributor's rights in every Memory or chapter below the folder: an
      upload names an optional target nodeId, which must lie live inside the share's subtree and be a kind Memories
      accepts — a node outside or unknown is 404 node_not_found, a folder (the link's root included) is
      share_not_contributable — and is decided again under the scope lock when the medium is written (a target a
      member trashed or moved out meanwhile, or a link revoked meanwhile, refuses the item). The guest deletes its own
      media anywhere in the subtree and none a member moved out. A READ link uploads nowhere; a WRITE_ONLY link only
      into its root. A Memory link's contributor may target a chapter of that Memory.
    coverage:
      backend:
        integration: [SubtreeUploadSliceTest.aFolderContributorUploadsIntoAMemoryAndAChapterBelow, SubtreeUploadSliceTest.aFolderContributorDeletesOnlyItsOwnAndOnlyInsideTheSubtree, SubtreeUploadSliceTest.aTargetTheLinkDoesNotReachIsRefused, SubtreeUploadSliceTest.aReadGuestIsRefusedForEveryTarget, SubtreeUploadSliceTest.anUploaderNamesNothingButItsRoot, SubtreeUploadSliceTest.aMemoryContributorUploadsIntoAChapterBelow, SubtreeUploadSliceTest.theLinkLimitCountsMediaInEveryNodeOfTheSubtree, ShareRootsSliceTest.aGuestOfAReadWriteFolderShareUploadsNothing, GuestCompleteTargetRaceSliceTest.aCompletionIntoAMemoryAMemberTrashesMeanwhileIsRefused, GuestCompleteTargetRaceSliceTest.aCompletionIntoAMemoryAMemberMovesOutOfTheSubtreeMeanwhileIsRefused, GuestCompleteTargetRaceSliceTest.aCompletionOnALinkRevokedMeanwhileIsRefused]
      web:
        unit: [src/features/memories/shareTarget.wire.test.ts, src/features/memories/components/MemoryDetail.guest.test.ts, src/views/ShareView.memory.test.ts]
        e2e: [src/features/memories/folderShareUpload.e2e.test.ts]
  - id: folder-guest-tree-operations
    text: >-
      A READ_WRITE folder link's guest creates folders (and, through Depot, files) inside the shared subtree and moves or renames
      a node between folders of it, as one placement write re-wrapped under the destination's key and stated against
      the node's placementRevision (409 stale_placement, nothing written). A create states the scope epoch the guest
      sealed with and the parent's own epoch: any but the scope's current one, or a parent epoch not the stored one, is
      409 stale_epoch, and a parent due for its re-key is 409 node_rekey_pending (ADR 0114 decision 3). Never the share root,
      never out of the subtree, never into a cycle; a taken slug is 409 on create and on move; a trashed root takes
      no tree operation. Each is decided under the scope lock, then the share row's.
    coverage:
      backend:
        integration: [ShareNodesCoreSliceTest.aGuestCreatesAFolderAndANestedNodeAndAMemberListsThem, ShareNodesCoreSliceTest.aGuestMovesAndRenamesInsideTheSubtree, ShareNodesCoreSliceTest.aStalePlacementRevisionIsAConflictAndWritesNothing, ShareNodesCoreSliceTest.anEpochAboveTheCurrentIsStaleAndStoresNothing, ShareNodesCoreSliceTest.anEpochBelowTheCurrentIsStaleAndTheCurrentOneIsStoredWithNoPayload, ShareNodesCoreSliceTest.aParentEpochBelowTheStoredIsStaleAndALaggingParentIsPending, ShareNodesCoreSliceTest.aTakenSlugIsAConflictOnCreateAndOnMove, ShareNodesCoreSliceTest.aGuestNeverMovesANodeOutOfTheSubtreeTheRootOrIntoACycle, ShareNodesCoreSliceTest.aGuestCreatesNothingOutsideTheSubtree, ShareNodesCoreSliceTest.aGuestNeverRenamesTheShareRoot, ShareNodesCoreSliceTest.aTrashedShareRootTakesNoTreeOperation, ShareNodesSliceTest.aGuestMovesAndRenamesAMemoryBetweenTwoSubfoldersOfASharedFolder, ShareNodeRaceCoreSliceTest.aGuestMoveIntoAFolderAMemberMovesOutOfTheSubtreeMeanwhileIsRefused, ShareNodeRaceCoreSliceTest.aGuestCreateUnderAParentAMemberTrashesMeanwhileIsRefused, ShareNodeRaceCoreSliceTest.aRevokedOrDeletedLinkNeverAcceptsAGuestWriteMeanwhile, ShareNodeRaceCoreSliceTest.aGuestWriteAndAReactivationOfTheLinkBothLandWithoutADeadlock]
      web:
        unit: [src/core/sharing/guestTree.wire.test.ts, src/core/sharing/ShareTreePage.test.ts, src/views/ShareView.naming.test.ts, src/features/memories/levelRows.guest.test.ts]
        e2e: [src/features/memories/folderShareGuest.e2e.test.ts]
    gaps:
      - surface: web
        reason: >-
          The guest page offers "New folder" and "Upload files" in the level toolbar's "New" menu (each entry only where
          its rights function grants it, inbox #401 S2, #406; no "New Memory" for any guest, LevelNewMenu.entries.test.ts,
          and no drop box - a member's folder share makes one, never a guest's page, uploadShare.test.ts), and core's move dialog (inbox #358, uc.memory.move-node, ShareTreePage.move.test.ts); no rename
          control exists, so a guest's rename is proven through placeShareNodeAsGuest by the wire test and the e2e, not
          through a screen.
  - id: guest-tree-refusals
    text: >-
      Inside an application's container the application decides, and Memories declares nothing: a guest's create
      inside a Memory, a chapter moved out of or into a Memory, and a chapter renamed are 422 illegal_scope, while
      the guest still reads all of it; a Memory- or chapter-rooted link gains no tree operation. Under a folder a
      guest creates a FOLDER or a kind its own application declares guest-creatable (core's GuestCreatableKinds:
      Depot's FILE) and nothing else - a Memory, a chapter, a drop box or an unknown kind is 422 illegal_scope, before
      the placement rule (owner decision 2026-10-14); a declared kind NodeKindRules does not place there is still
      422 illegal_structure; a kind two applications declare is created by nobody and fails startup. The web offers
      no guest a "New Memory" entry nor a drop box's upload-only link (hidden, not greyed). A READ or WRITE_ONLY link does none
      (403 share_not_contributable). Every guest tree operation stays inside the link's subtree: its root is never
      moved, renamed or deleted, nothing is placed or created outside it, and a member's move out of the subtree
      meanwhile refuses the guest's write (ADR 0080 decisions 6, 9 and 10).
    coverage:
      backend:
        integration: [SubtreeBoundaryCoreSliceTest.aPlacementInsideTheBoundaryLandsAndOneReachingOutIsRefused, SubtreeBoundaryCoreSliceTest.aCreateLandsOnlyUnderTheBoundary, SubtreeBoundaryCoreSliceTest.aDeleteReachesOnlyStrictlyInside, SubtreeBoundaryRaceCoreSliceTest.aBoundedMoveIntoAFolderAMemberMovesOutMeanwhileIsRefused, SubtreeBoundaryRaceCoreSliceTest.aBoundedCreateUnderAFolderAMemberMovesOutMeanwhileIsRefused, ShareNodesSliceTest.insideAMemoryAGuestWritesNothingAndReadsEverything, ShareNodesSliceTest.aGuestCannotMoveAChapterOutOfAMemory, ShareNodesSliceTest.aMemoryRootedLinkGainsNoTreeOperation, ShareNodesSliceTest.aGuestCreatesNoMemoryInAFolder, ShareFilesSliceTest.aContributorCreatesFoldersAndFilesButNoDropBox, ChapterShareSliceTest.aChapterGuestDoesNoTreeOperation, ShareNodesCoreSliceTest.aKindNodeKindRulesDoesNotAdmitUnderTheFolderIsRefused, CoreAloneSliceTest.aFolderGuestCreatesFoldersOnly, ModuleCompositionTest.aFolderGuestCreatesFoldersAndTheDeclaredKindsOnly, ShareNodesCoreSliceTest.aWriteOnlyOrAReadGuestDoesNoTreeOperation, ShareNodesCoreSliceTest.theGateRefusesAsTheOtherGuestWritesDo]
        unit: [GuestNodeRulesPartitionTest.aKindNobodyHandlesAllowsNothing, GuestNodeRulesPartitionTest.aKindTwoImplementationsClaimAllowsNothing, GuestNodeRulesPartitionTest.inAFolderAGuestCreatesAFolderOrADeclaredKindAndMovesAnyKind, GuestCreatableKindsTest.twoDeclarationsOfOneKindFailStartupNamingTheKindAndBoth, DepotNodeKindRulesTest.aSecondClaimOfFileFailsStartup]
      web:
        unit: [src/core/sharing/guestTree.wire.test.ts, src/views/LevelNewMenu.entries.test.ts, src/features/memories/rights.test.ts]
        e2e: [src/features/memories/folderShareGuest.e2e.test.ts]
  - id: a-guests-write-records-the-address-the-network-vouches-for
    text: >-
      Every write that enters a guest as last editor — naming
      itself, a node it creates, renames or moves, a photo or file it adds — records in its own transaction the client
      address of core's one resolver (the rightmost X-Forwarded-For entry no trusted proxy wrote; never the client's own
      leftmost entry, which is in no record and no log line), the port that entry carries or the configured source
      states (none under `none`, whatever a header says; never a port left of the stop entry), the time in
      milliseconds, the identity and the object; with no address nothing is recorded and the write stands; a refused
      write and a member's write record nothing; every resource operation that takes a guest's write credential
      resolves the client for it or is exempt with its reason; an erased node takes its records with it.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.theRightmostEntryIsRecordedAndTheClientsOwnLeftmostIsInNoRecordAndNoLog, GuestWriteRecordCoreSliceTest.aStopEntrysOwnPortIsRecorded, GuestWriteRecordCoreSliceTest.aPortOnAnEntryLeftOfTheStopIsNeverRead, GuestWriteRecordCoreSliceTest.theHeaderSourceStatesThePortAndNoneReadsNoHeader, GuestWriteRecordCoreSliceTest.noAddressNoRecordButTheWriteStands, GuestWriteRecordCoreSliceTest.namingItselfCreatingAndPlacingEachRecordOnceWithItsObjectAndFieldGroup, GuestWriteRecordCoreSliceTest.aRefusedWriteAndAMembersWriteRecordNothing, GuestWriteRecordCoreSliceTest.anErasedNodeTakesItsRecordsWith]
        unit: [GuestWriteRecordedTest.everyResourceOperationTakingAGuestCredentialRecordsOrIsExempt, GuestWriteRecordedTest.anExemptOperationRecordsNothingAndStillTakesACredential, GuestWriteRecordedTest.theScanSeesTheKnownWrites]
  - id: the-record-is-kept-n-days-wherever-a-guest-may-write-and-copied-by-a-hold
    text: >-
      A row is kept N days (an instance setting the Server Owner sets, 1 to 30, 7 by default, refused outside), written
      with its own end; the purge — at startup and hourly — deletes a row past its end or older than N as it stands now,
      so a shortening reaches every row and a lengthening only new ones, while a hold's copy stays. The record has no
      switch and needs no mode: it is kept wherever a guest may write, so where guest writes are switched off (here,
      `contribute`) the write is refused and nothing is recorded. A hold copies the records of what it holds — a node,
      a medium, every record of a reported link's guests.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.aShorteningReachesAnOldRowAtTheNextPurgeAndALengtheningDoesNotExtendIt, GuestWriteRecordCoreSliceTest.theServerOwnerSetsNWithinOneToThirty, GuestWriteRecordCoreSliceTest.thePurgeDeletesALiveRowAtItsEndWhileAHoldCopyStays, GuestWriteRecordCoreSliceTest.whereGuestWritesAreOffNothingIsWrittenAndNothingRecorded, GuestWriteRecordCoreSliceTest.anInstanceWithNoModeServesEveryTextWholeAndRecordsAGuestWrite, GuestWriteRecordCoreSliceTest.aHoldOnALinkCopiesEveryRecordItsGuestsWrote]
  - id: a-guest-who-objects-has-its-record-deleted-except-what-a-hold-copied
    text: >-
      A guest's objection (GDPR Art. 21): the Server Owner, on the admin channel or with `veyq-admin guest-write-record
      forget <identity-id>`, deletes every live row of one share identity and no other identity's; rows a hold copied
      stay until the hold ends, and the answer counts both, so the guest can be told; a second deletion answers zeros
      for the live rows; a non-owner is refused, and an id that is no UUID matches no route.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.anObjectionDeletesTheIdentitysLiveRowsAndLeavesWhatAHoldCopied, GuestWriteRecordCoreSliceTest.anIdentityIdThatIsNoUuidMatchesNoRoute]
  - id: a-writing-guest-is-told-before-its-first-write
    text: >-
      The resolve of a link whose guest writes (READ_WRITE, WRITE_ONLY, unlocked) serves N as it stands, and the page shows one sentence with that N and the right to object as a sentence of its own before the
      first write — in the naming dialog, and beside the line that says whose session this device holds. A READ link is
      served none and shows nothing (nothing is recorded).
      What it leaves open is not pursued (ADR 0093 Still open 4); the link to the operator section joins with that section.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.theResolveServesNToAGuestThatWrites]
      web:
        unit: [src/views/ShareView.guestWriteRecord.test.ts, src/core/sharing/GuestWriteRecordNotice.test.ts]
gaps:
  admin-web: >-
    `veyq-admin guest-write-record forget <identity-id>` (a guest's objection): `src/cli/cli.test.ts` pins that the
    command sends the identity, prints what was deleted and what a hold keeps, and refuses an id that is no UUID before
    signing in. It passes locally, but `admin-web`'s job has never executed, so ADR 0040 admits none of it; on the first
    run whose log shows admin-web's suites, it becomes a ref on
    `a-guest-who-objects-has-its-record-deleted-except-what-a-hold-copied` and this gap goes.
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/account/field-seal.spec.ts`) drives `sealed-name-anonymous-identity` in
    Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion. A guest of a "View + add photos" link names itself at its first upload; the name holds on its page
    after a reload and reaches the members. `tests/e2e/tests/features/moderation/guest-write-record.spec.ts` drives
    `create-contributor-share`, `a-writing-guest-is-told-before-its-first-write` and
    `a-guests-write-records-the-address-the-network-vouches-for`: a guest reads the notice with N = 7 in the naming
    dialog and creates a folder through the release's Traefik, and the orchestrator's `guest-write record` stage holds
    the app's record of it to the browser container's own socket (address and port). Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job
    (`ci.yml` → `stack`) awaits the first CI run (no remote), and ADR 0040 admits `stack` refs only once a run's log
    shows the suite executed. On that run each file becomes a ref on the criteria its tests are tagged with, and this
    gap goes.
