useCase: uc.moderation.object-to-a-measure
feature: moderation
title: Object to a measure
# Built by cr-statement-of-reasons-and-objection: core/moderation/statement (the statement, its recipients, the objection,
# the mails, the template pinned from contracts/moderation/statement-of-reasons.json) and CaseDecisions' measure and
# objection decision on the backend; features/moderation's decision panel and features/moderation/statement (the notice
# on the lightbox, a blocked node's page and the share lists) on web; the moderation-statement-facts,
# moderation-facts-key and moderation-objection seals in packages/crypto. Lane L1's browser pass is
# tests/e2e/tests/features/moderation/statement-and-objection.spec.ts, tagged per criterion; `stack` waits under gaps until a run admits it.
acceptanceCriteria:
  - id: the-statement-is-sent-with-the-measure
    text: >-
      A moderator's measure carries its statement — the ground, and the facts sealed to the moderation key and once
      more under a key wrapped to each affected member's identity key — recorded in its transaction; wrapped keys that
      do not name exactly the members it tells are refused. The list is whole or refused by name, never cut: up to
      6,000 members with facts, whatever their length.
    coverage:
      backend:
        integration: [StatementsSliceTest.aMeasureCarriesItsStatementToEveryAffectedMemberAndAStaleRecipientListIsRefused, StatementRecipientsBoundSliceTest.aStatementPastTheOldCapReachesEveryMemberWithTheFactsKeyWrappedToEach, StatementRecipientsBoundSliceTest.pastTheBoundAStepIsRefusedByName, StatementRecipientsBoundSliceTest.aBodyAtTheBoundWithEveryFieldAtItsLargestFitsTheRequestLimit, StatementRecipientsBoundSliceTest.theListAndTheFactsKeysCarryOneBound, SealedTextBoundsTest.theFactsSealedOnceAndEachWrapOfTheirKeyAreTakenAtTheirLargestAndNoLarger, SealedTextBoundsTest.aNoteEncodedSealOfEightThousandBytesIsTakenAndOneCharacterMoreIsNot]
      web:
        unit: [src/features/moderation/cases.test.ts, src/features/moderation/CaseDetail.test.ts]
  - id: the-statement-has-one-form
    text: >-
      Every instance renders one form of the statement: the measure and its reach, the facts, whether a report or an
      order led to it, that a person decided, the ground with its provision, where it applies, the objection, the
      contact — "not stated by this operator" where none is set — and the courts; a measure without facts is refused.
    coverage:
      backend:
        integration: [StatementsSliceTest.aMeasureNamesTheFactsAndTheProvisionItReliesOn]
        unit: [StatementTemplateConformanceTest.theOneFormCarriesEveryPassageAndTheMailNeverTheFacts, StatementTemplateConformanceTest.everyTextEqualsTheContract, StatementTemplateConformanceTest.aBlockedLinkIsWordedByTheReadersRelationToIt]
      web:
        unit: [src/features/moderation/statement/template.test.ts, src/features/moderation/statement/StatementNotice.test.ts, src/features/moderation/CaseDetail.test.ts]
  - id: the-affected-read-it-in-veyq-and-are-mailed
    text: >-
      The affected member reads the statement on the blocked item or link with the facts opened by their identity key,
      and instance mail tells their account address it is there, carrying no facts.
    coverage:
      backend:
        integration: [StatementMailSliceTest.theAffectedMemberIsMailedThatTheStatementIsInVeyqAndTheMailCarriesNoFacts, StatementMailSliceTest.aStatementMailThatDidNotGoOutIsRetriedOnce, StatementMailSliceTest.aBlockedLinksMailIsWordedByEachRecipientsRelationToIt]
      web:
        unit: [src/features/moderation/statement/StatementNotice.test.ts, src/features/moderation/statement/statements.test.ts]
  - id: one-objection-per-measure-reopens-the-case
    text: >-
      An affected member objects once per measure, sealed to the moderation key; a second objection and one on a lifted
      measure are refused; the objection reopens the case and the moderators are mailed.
    coverage:
      backend:
        integration: [StatementsSliceTest.anAffectedMemberObjectsOnceWhileTheMeasureStandsAndTheObjectionReopensTheCase, StatementsSliceTest.anObjectionReopensAClosedCaseWhichClosesAgainOnceItIsDecided, StatementMailSliceTest.theModeratorsLearnOfAnObjectionAndTheObjectorOfItsAnswer]
      web:
        unit: [src/features/moderation/statement/StatementNotice.test.ts, src/features/moderation/statement/statements.test.ts, src/features/moderation/ModerationQueue.test.ts]
  - id: another-moderator-decides-the-objection
    text: >-
      The account that took the measure is refused the decision while another accepted moderator holds the key; the
      other decides; a single moderator decides it as their own review, and the answer says so.
    coverage:
      backend:
        integration: [StatementsSliceTest.theDeciderIsRefusedWhileAnotherModeratorHoldsTheKeyAndTheOtherDecides, StatementsSliceTest.aSingleModeratorReviewsTheObjectionAsTheirOwnAndTheAnswerSaysSo, ObjectionRacesSliceTest.aSecondModeratorDecidingTheSameObjectionAtOnceIsRefused]
      web:
        unit: [src/features/moderation/CaseDetail.test.ts, src/features/moderation/statement/StatementNotice.test.ts]
  - id: the-reporters-contact-goes-six-months-after-the-decision
    text: >-
      A reporter's sealed contact goes six months after the decision on the report was told — or, where it could not
      be told, six months after the case's decision — never while a case of the report is open; the report and the
      "decision sent" event stay.
    coverage:
      backend:
        integration: [ModerationRetentionSliceTest.aReportersContactGoesSixMonthsAfterTheDecisionWasToldAndNeverWhileACaseIsOpen]
      web:
        unit: [src/features/moderation/cases.test.ts]
  - id: the-reporter-is-told-the-decision
    text: >-
      A reporter who left a contact is mailed the dismissal or the decision once, from an address the deciding
      moderator's browser sent; the server keeps no copy.
    coverage:
      backend:
        integration: [StatementMailSliceTest.aReporterIsToldTheDecisionOnceAndTheAddressIsStoredNowhere]
      web:
        unit: [src/features/moderation/cases.test.ts, src/features/moderation/CaseDetail.test.ts]
  - id: a-guest-uploader-reads-its-statement-on-its-link
    # Added by inbox #813 (ADR 0093 § 7): the read § 12 opened answers a moderator's measure too.
    text: >-
      A guest identity a moderator's statement names reads its clear fields on the link it came through, by the
      contributor token its client holds, even while the link is blocked — never the facts, which open only with a
      member's identity key, and with the objection through the instance contact; another identity of the link, an
      unknown token, the token on another link, a running deferral and a lifted measure get the link's ordinary unknown
      answer. The guest's page shows it where a member's would — a drop page every one, its link alive or gone — in the
      template's guest words, with sentences of their own where no contact is named, calling no authenticated client.
    coverage:
      backend:
        integration: [GuestStatementsSliceTest.aGuestUploaderReadsAModeratorsStatementOnItsLinkWithoutTheFactsAndNobodyElseDoes, GuestStatementsSliceTest.aBlockedGuestIdentityReadsItsStatementOnItsBlockedLink, GuestStatementsSliceTest.aDeferredStatementReachesTheGuestOnlyOnceTheDeferralEnds, GuestStatementsSliceTest.aModeratorsMeasureOnAPreservationOrdersCaseIsAStatementOfTheirOwnInitiativeAndNoRemoval, GuestStatementsSliceTest.onARemovalOrdersCaseTheOrderIsARemovalAndAModeratorsFurtherMeasureAStatementOfTheirOwnInitiative, UploaderContentMemoriesSliceTest.theStepBlocksExactlyThatUploadersMediaAndTheHoldNowHoldsThem]
      web:
        unit: [src/views/ShareView.guestStatement.test.ts, src/features/depot/components/DropBoxShareBody.guestStatement.test.ts, src/features/memories/components/MemoryShareBody.test.ts, src/features/moderation/statement/statements.test.ts, src/features/moderation/statement/template.test.ts, src/core/sharing/OrderNotice.test.ts]
  - id: the-statement-names-a-report-or-own-initiative
    # Added by inbox #820 (ADR 0093 § 7, DSA Art. 17(3)(b)): never a fixed "after a report".
    text: >-
      A measure's statement says what led to it: a case a report opened reads "after a report"; any other case — one an
      authority's order opened (a preservation order, a request for information, a removal order's case) included —
      reads the host's own finding and names no order, for a moderator's measure and a Server Owner's step alike, in the
      member's statement, its mail and the guest uploader's read; only a removal order's own blocks name the order, and
      a guest is told them as a removal. The German words take the dative "nach" asks for.
    coverage:
      backend:
        unit: [StatementTemplateConformanceTest.aMeasureOnACaseNoReportOpenedIsTheHostsOwnInitiativeAndOnlyARemovalOrdersOwnBlockNamesTheOrder]
        integration: [GuestStatementsSliceTest.aGuestUploaderReadsAModeratorsStatementOnItsLinkWithoutTheFactsAndNobodyElseDoes, GuestStatementsSliceTest.aModeratorsMeasureOnAPreservationOrdersCaseIsAStatementOfTheirOwnInitiativeAndNoRemoval, GuestStatementsSliceTest.onARemovalOrdersCaseTheOrderIsARemovalAndAModeratorsFurtherMeasureAStatementOfTheirOwnInitiative, ServerOwnerStatementSliceTest.aSignInBlockOnACaseAnOrderOpenedIsTheirOwnFindingAndNamesNoOrder, AuthorityOrdersSliceTest.aGuestUploaderIsToldOfARemovalOrderOnItsBlockedLinkAndNobodyElseIs]
      web:
        unit: [src/views/ShareView.guestStatement.test.ts, src/features/moderation/statement/template.test.ts]
  - id: the-hold-counts-from-the-statement
    text: >-
      A measure's hold ends six months after its statement is sent, and from the decision where nobody can be told.
    coverage:
      backend:
        integration: [StatementsSliceTest.theHoldCountsFromTheStatementAndFromTheDecisionWhereNobodyCanBeTold]
  - id: the-statement-names-the-provision-and-where-it-applies
    text: >-
      The ground names the provision of the law or the clause of the terms relied on, required of every statement (blank
      counts as none), and the statement says the measure applies wherever the instance is reached and lasts until it is
      lifted (DSA Art. 17(3)(a), (d), (e)); an authority's removal order names its own provision.
    coverage:
      backend:
        integration: [StatementsSliceTest.aMeasureNamesTheFactsAndTheProvisionItReliesOn, AuthorityOrdersSliceTest.aDeferredOrderTellsTheGuestNothingUntilItsEnd]
        unit: [StatementTemplateConformanceTest.theOneFormCarriesEveryPassageAndTheMailNeverTheFacts]
      web:
        unit: [src/features/moderation/statement/template.test.ts, src/features/moderation/statement/StatementNotice.test.ts, src/features/moderation/CaseDetail.test.ts, src/features/moderation/cases.test.ts]
  - id: the-reporter-is-told-their-redress
    text: >-
      A reporter's decision mail carries their whole redress on every instance (DSA Art. 16(5)): that they may report again
      with more information, the instance contact ("not stated by this operator" where none is set), that they may go to
      court, and — where the DSA applies to the instance, in the sentence's own words — that they may complain to the
      Digital Services Coordinator of the Member State where they live or are established (Art. 53).
    coverage:
      backend:
        integration: [StatementMailSliceTest.aReportersDecisionCarriesTheirWholeRedressAndTheGapWhereNoContactIsSet]
        unit: [StatementTemplateConformanceTest.aReportersRedressIsWholeWithTheDsaQualifierAndTheGap, StatementTemplateConformanceTest.everyTextEqualsTheContract]
      web:
        unit: [src/features/moderation/statement/template.test.ts]
  - id: a-server-owners-step-over-content-carries-a-statement-by-mail
    text: >-
      A member's sign-in block or a tenant taken offline over content — from a case or a proposal always, otherwise when
      the Server Owner says so — carries a statement in the same template, refused without one; it is mailed with the
      facts to the blocked member or each owner of the tenant, the objection going to the instance contact, and the
      database keeps the facts only sealed; a step with neither case, proposal nor the flag goes without one, and a
      case-less step's statement goes with the step.
    coverage:
      backend:
        integration: [ServerOwnerStatementSliceTest.aSignInBlockFromAProposalCarriesAStatementAndOneWithNoCaseNoProposalAndNoFlagGoesWithout, ServerOwnerStatementSliceTest.theBlockedMemberIsMailedTheStatementWithTheFactsWhichTheDatabaseHoldsOnlySealed, ServerOwnerStatementSliceTest.aTenantTakenOfflineOverContentTellsItsOwnersOnlyAndReactivatingLiftsTheRecord, ServerOwnerStatementSliceTest.aCaselessStepsStatementGoesWithTheStepAfterItsLiftAndNeverWhileItStands]
        unit: [StatementTemplateConformanceTest.aServerOwnersStepCarriesItsFactsAndSendsTheObjectionToTheContact]
      web:
        unit: [src/features/moderation/statement/template.test.ts]
  - id: a-server-owners-step-reports-whom-its-statement-reached
    # Added by cr-statement-delivery-report (ADR 0093 § 7): the report is the answer's alone, never stored.
    text: >-
      A Server Owner's step over content — a sign-in block, a tenant taken offline or deleted — answers whom its
      statement's single mail reached: every recipient, every address it did not reach (no instance mail, or a failed
      send), nobody to tell, or that the server cannot say; the step stands in every case, and a step without a
      statement answers none.
    coverage:
      backend:
        integration:
          - ServerOwnerStatementSliceTest.eachStepOverContentWithMailSetUpAnswersReachedAndMarksEveryRecipientMailed
          - ServerOwnerStatementSliceTest.withoutInstanceMailABlockOverContentAnswersNotAllReachedAndStands
          - ServerOwnerStatementSliceTest.withoutInstanceMailASuspensionOverContentAnswersNotAllReachedNamingEveryOwnerAndStands
          - ServerOwnerStatementSliceTest.withoutInstanceMailADeletionOverContentAnswersNotAllReachedNamingEveryOwnerAndStands
          - ServerOwnerStatementSliceTest.anOwnerlessTenantTakenOfflineOverContentAnswersNobodyToTell
          - ServerOwnerStatementSliceTest.aStepWithoutAStatementAnswersNoDelivery
        unit:
          - StatementMailingTest.everyMailWentOutIsReached
          - StatementMailingTest.noMailWentOutNamesEveryRecipient
          - StatementMailingTest.oneOfTwoWentOutNamesTheOtherOnly
          - StatementMailingTest.noRecipientIsNobodyToTell
          - StatementMailingTest.aListThatCouldNotBeReadIsUnknown
gaps:
  admin-web: >-
    The Server Owner's statement — the fields on a proposal's block and on the tenant's suspension, `veyq-admin account
    block` and `tenant suspend` with --over-content, --ground, --provision and --facts, the facts sealed for the log —
    is covered by src/admin-web/src/features/instance/stepStatement.test.ts (the real crypto opens what was sealed),
    ModerationPanel.test.ts, src/features/tenants/TenantDetailPanel.test.ts and src/cli/cli.test.ts — which also hold
    what a step reports of its mail (the standing notice with the words, the warning before the step, the stderr line),
    with src/features/instance/instanceMail.test.ts — but admin-web's refs wait until its job is admitted (ADR 0040).
  crypto: >-
    The moderation-statement-facts, moderation-facts-key and moderation-objection seals are pinned by their vectors and
    the purposes' tests
    (src/packages/crypto/src/report.test.ts, mutation gate 100 %), but the crypto job has never executed (ADR 0040).
  stack: >-
    tests/e2e/tests/features/moderation/statement-and-objection.spec.ts (lane L1) tags the statement, the form, the reporter's decision,
    the affected member's reading and objection, and the other moderator's decision, and
    tests/e2e/tests/features/moderation/server-owner-statement.spec.ts the Server Owner's block over content and its REACHED answer
    (green in local runs of the lane only); stack refs are admitted only once a CI run executed lane L1
    (ADR 0040).
