useCase: uc.files.view-file
feature: files
title: View a file — open it and see it (image, text, video, audio), or get the download
# Built for inbox #412 (web only: no contract or backend change - the viewer reads the chunks a download reads). The
# decision (core/blob/sniff.ts, features/files/view.ts), the state machine (useFileViewer.ts) and the DOM (FileViewer.vue)
# are proven in unit and real-DOM tests; the page mounts for a member and, through core's page of a link, for a READ and
# a READ_WRITE guest with guarded clients. No real browser has played a video or audio through the service worker for a
# FILE, gone full screen or run it on a phone yet (gaps below).
acceptanceCriteria:
  - id: the-bytes-decide-what-a-file-is
    text: What the viewer shows is decided from the decrypted bytes (magic numbers), never by the claimed type alone - a PNG claimed as text/plain is an image typed image/png, a binary claimed as image/png or text/plain is not shown, a text needs valid UTF-8 (or a UTF-16 byte-order mark) with no control bytes AND a text-ish claim, and SVG is an image only when the markup and the claim agree.
    coverage:
      web: { unit: [src/core/blob/sniff.test.ts, src/features/files/view.test.ts] }
  - id: an-image-is-an-img-on-a-typed-blob-url
    text: An image is shown as an <img> (alt text from the file name) on an object URL typed with the sniffed type, an SVG only so (never inline, never in an object or iframe); a decode failure is a message and the download, and the URL is revoked on a failure, a replace and unmount.
    coverage:
      web: { unit: [src/features/files/components/FileViewer.test.ts, src/features/files/view.test.ts] }
  - id: a-text-is-shown-as-characters
    text: A text is shown in a monospace block through textContent - markup in it stays visible characters and nothing is parsed; a byte-order mark is dropped, the first 1 MiB is shown with a note when the file is longer, and a binary or non-UTF-8 text claiming to be text is not shown.
    coverage:
      web: { unit: [src/features/files/components/FileViewer.test.ts, src/features/files/view.test.ts] }
  - id: video-and-audio-stream-through-the-service-worker
    text: A video or audio is played by <video controls playsinline> / <audio controls> from the service worker's ranged media route under the container the first chunk sniffs to (the page holds the key, the worker none; nothing past chunk 0 is read by the page for it); with no usable worker or a codec the browser lacks it is a message and the download; the playback handle is revoked on unmount.
    coverage:
      web: { unit: [src/features/files/components/FileViewer.test.ts, src/sw/mediaSw.test.ts, src/features/files/view.test.ts] }
    gaps:
      - surface: web
        reason: The service worker is stubbed in unit tests (it cannot be registered in the test environment); no real browser has played a Files video or audio through it yet, nor on a phone's Safari.
  - id: memory-is-bounded-per-kind
    text: An image over 64 MiB is not decrypted (the message names the limit and offers the download), a text is cut at 1 MiB, and a file of another kind is read no further than its first chunk; a PDF is not rendered (the browser's viewer needs a frame the policy forbids) and is a message plus the download.
    coverage:
      web: { unit: [src/features/files/view.test.ts, src/features/files/components/FileViewer.test.ts] }
  - id: reading-starts-with-the-page-and-stops-with-it
    text: The file is read when its page opens (not for a list row), with a busy state and a Stop; unmounting or moving to another file aborts the read in flight and drops a late result; a failed read is an error with Try again, never an unhandled rejection.
    coverage:
      web: { unit: [src/features/files/components/FileViewer.test.ts, src/features/files/components/FileDetail.test.ts] }
  - id: full-screen-with-a-fallback
    text: A full-screen button (the Fullscreen API on the viewer's container, Escape leaves) enlarges the shown content; where the API is missing or refused a fixed overlay stands in, closed by the button or Escape.
    coverage:
      web: { unit: [src/features/files/components/FileViewer.test.ts] }
    gaps:
      - surface: web
        reason: The Fullscreen API is stubbed (happy-dom has none); no real browser, nor an iPhone's Safari (which has no element fullscreen), has run it yet.
  - id: a-guest-sees-the-members-viewer
    text: A READ and a READ_WRITE guest of a file link open the file through the link's own presign (the share id and password token) and see the same viewer with the same controls as the member, with no authenticated client called; a file the viewer cannot show offers the download both roles hold.
    coverage:
      web: { unit: [src/features/files/components/FileDetail.guest.test.ts, src/features/files/components/FileDetail.test.ts] }
gaps:
  backend: >-
    No backend part: the viewer reads the same presigned ciphertext chunks a download reads (FilesContentSliceTest, in
    uc.files.member-files), and the server never sees a type or a byte of plaintext.
