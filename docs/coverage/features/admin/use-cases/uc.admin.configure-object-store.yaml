useCase: uc.admin.configure-object-store
feature: admin
title: Connect and check the instance's object store
# Built by cr-store-connection-in-admin-web (ADR 0089). The store is configured on the admin channel, so the
# criteria's refs are the backend's slice and unit tests; `admin-web`'s suites (StorePanel, the CLI, the create-tenant
# dialog) wait under `gaps` until its CI job has executed (ADR 0040).
acceptanceCriteria:
  - id: server-owner-sets-and-checks-the-store
    text: >-
      A signed-in Server Owner saves an S3-compatible or Garage store setting and checks it; a passing check puts
      the setting in use and the backend signs against it without a restart.
    coverage:
      backend:
        unit: [StoreCheckTest.aPassingCheckWritesOneProbeAndDeletesNothing, StoreCheckTest.theProbeIsOverwrittenByTheNextCheckSoNothingAccumulates, StoreCheckTest.aGarageStoreIsProvisionedFirstAndAFailedBringUpStopsTheCheck]
        integration: [InstanceStoreSliceTest.anS3StoreIsSavedAsPendingAndItsSecretIsNeverReturned, InstanceStoreSliceTest.aPassingCheckPutsThePendingSettingInUse, InstanceStoreSliceTest.aCheckAgainstAStoreNobodyAnswersFailsAtItsStepAndIsRemembered, InstanceStoreSliceTest.theBundledStoreIsRefusedWhereTheDeploymentOffersNone, AppShellStoreOriginSliceTest.thePolicyAllowsTheOriginOfAUrlThisAppSigns, AppShellStoreOriginSliceTest.aPageAnswersRightAfterTheStoreSettingChanged, StoreOriginPresignSliceTest.theSignedUrlIsARealPresignedUrlForTheConfiguredBucket]
    gaps:
      - surface: backend
        reason: >-
          No backend test drives a PASSING check through the endpoint against a live store: the passing path is proven
          against local stub HTTP servers (`StoreCheckTest`, and `InstanceStoreSliceTest`'s fake S3 through the
          endpoint), which ignore the signature. The real one is the web e2e suites' `birthInstance` (it waits for the bundled store the server adopted and checked against Garage itself, A8), which
          `run_web_e2e.py` runs and no backend ref names. "Without a restart" is the setting-follows-the-store
          wiring (`SwitchingBlobStore`) that `AppShellStoreOriginSliceTest` and `StoreOriginPresignSliceTest` observe
          through the CSP and the signed URL.
  - id: a-failing-check-names-its-step-and-changes-no-store-configuration
    text: >-
      A check that fails names the failing step and the store's answer, keeps tenant creation closed, and leaves
      the store's configuration untouched (no bucket created, no CORS policy written).
    coverage:
      backend:
        unit: [StoreCheckTest.aMissingBucketFailsAtItsStepAndCreatesNone, StoreCheckTest.aCorsRuleThatDoesNotNameTheOriginFailsTheCorsStep, StoreCheckTest.theResultRoundTripsThroughItsStoredJson]
        integration: [InstanceStoreSliceTest.aCheckAgainstAStoreNobodyAnswersFailsAtItsStepAndIsRemembered, InstanceStoreSliceTest.aTenantIsRefusedUntilASettingHasPassedItsCheck]
  - id: a-changed-setting-waits-for-its-own-check
    text: >-
      A saved setting is pending and changes nothing the instance does until it passes its own check, which puts it
      in use; a failed one leaves the setting in use untouched, and a pending one can be discarded.
    coverage:
      backend:
        # The race ref is the promotion's lock: two checks of one pending setting (the boot's and the Server Owner's,
        # A8) put it in use once; without the lock the second failed on the first's uncommitted active row (bitten, 500).
        integration: [InstanceStoreSliceTest.aChangedSettingIsNotUsedUntilItsCheckPassesAndAFailingOneLeavesTheOldInUse, InstanceStoreSliceTest.aPendingSettingCanBeDiscardedAndTheOneInUseStays, InstanceStoreSliceTest.aWriteEqualToTheSettingInUseLeavesNothingPending, InstanceStoreSliceTest.withNothingPendingTheCheckRunsAgainstTheSettingInUse, InstanceStoreSliceTest.aPassingCheckPutsThePendingSettingInUse, InstanceStoreSliceTest.twoChecksOfOnePendingSettingPutItInUseOnce]
  - id: the-bundled-store-is-adopted-and-checked-without-a-click
    # A8, ADR 0089 decision 3 (cr-bundled-store-adopts-itself). The boot worker that runs it skips `%test`, so its two
    # halves are tested apart: the adoption's transaction (StoreHandler.adoptBundled) as a slice, each "changes nothing"
    # case against the same call on an empty instance, and the owner's save racing it under the singleton lock (bitten:
    # without the lock in `set` the save failed on the adopted row's uncommitted key, 500); the check loop off any boot,
    # on a clock its sleep advances. The adopted store is routed for its check (TenantIngressBucketRouteTest). The whole
    # path on a fresh Compose install — boot, provisioning, adoption, a passing check — is the stack e2e's
    # first-run.setup.ts, which no CI job runs yet (gap below).
    text: >-
      Where the deployment offers the bundled store and no store setting is saved, the server saves the bundled store as
      pending after its boot provisioning and runs the ordinary check on it, again while it fails at a step the
      deployment's proxy, certificate or DNS can still fix and within its budget, and only a passing check puts it in
      use; a setting the Server Owner saved, in use or pending, is never replaced, and a bundled store a previous start
      adopted is checked again.
    coverage:
      backend:
        unit: [AdoptionCheckLoopTest.aCheckThatStartsPassingStopsTheLoopOnThePass, AdoptionCheckLoopTest.aStepWaitingCannotFixIsNotTriedAgain, AdoptionCheckLoopTest.aChangedPendingSettingStopsTheLoopBeforeTheNextCheck, AdoptionCheckLoopTest.aCheckThatFoundSomethingElsePendingStopsTheLoop, AdoptionCheckLoopTest.aCheckStillFailingWhenTheBudgetIsSpentEndsTheLoop, AdoptionCheckLoopTest.aShutdownWhileWaitingEndsTheLoop]
        integration: [BundledStoreAdoptionSliceTest.withNothingSavedTheBundledStoreIsAdoptedAsPending, BundledStoreAdoptionSliceTest.aPendingStoreOfTheOwnersOwnIsNeverReplaced, BundledStoreAdoptionSliceTest.aStoreInUseIsNeverReplaced, BundledStoreAdoptionSliceTest.aDeploymentThatOffersNoBundledStoreAdoptsNothing, BundledStoreAdoptionSliceTest.aBundledStoreAPreviousBootAdoptedIsCheckedAgainNotSavedAgain, BundledStoreAdoptionSliceTest.theAdoptionsCheckChecksNothingOnceSomethingElseIsPending, BundledStoreAdoptionSliceTest.anOwnersSaveDuringTheAdoptionWaitsForItAndReplacesIt, TenantIngressBucketRouteTest.theBundledStoreTheServerAdoptsIsRoutedForItsCheck]
    gaps:
      - surface: backend
        reason: >-
          The wiring between the two halves — StoreProvisioningRunner's worker firing BundledHintProvisioned after it
          provisioned the hint's Garage, and BundledStoreAdoption observing it — runs only outside `%test`, so no backend
          test executes it. The stack e2e's first-run.setup.ts, which opens the object-store page on the bundled store in
          use and passed, is its proof; it runs at the V1 heavy stage.
  - id: no-tenant-without-a-checked-store
    text: >-
      Creating a tenant is refused with a reason until the current store setting has passed its check.
    coverage:
      backend:
        integration: [InstanceStoreSliceTest.aTenantIsRefusedUntilASettingHasPassedItsCheck, InstanceStoreSliceTest.changingTheSettingStartsThePendingOneUnchecked]
  - id: the-store-secrets-are-sealed-and-write-only
    text: >-
      The access key secret and the Garage admin token are sealed under the config-secret key with that key's
      fingerprint and returned on no surface, the Server Owner's included.
    coverage:
      backend:
        unit: [ConfigSecretKeyGuardTest.aValueSealedUnderAnotherKeyIsDetectedPerValue, ConfigSecretKeyGuardTest.aStoreSecretReEnteredUnderTheNewKeyLeavesTheSmtpSecretUnreadable]
        integration: [InstanceStoreSliceTest.anS3StoreIsSavedAsPendingAndItsSecretIsNeverReturned, InstanceStoreSliceTest.aSecretOmittedOnALaterWriteKeepsTheStoredOne, InstanceStoreSliceTest.aFirstWriteWithoutASecretIsRefused, InstanceStoreSliceTest.aMemberIsNotTheServerOwnerAndIsRefusedOnEveryOperation]
  - id: a-lost-key-asks-for-the-store-credentials-again
    text: >-
      With the config-secret key absent or not the one that sealed them, the store's credentials are reported as
      unreadable and can be re-entered; the bundled store, which seals nothing, keeps working.
    coverage:
      backend:
        unit: [StoreCheckTest.aSettingThatCannotBeOpenedFailsAtCredentialsAndTouchesNoStore, ConfigSecretKeyGuardTest.theInstanceWideStateSeesEveryHolderOfASealedValue, BundledStoreCredentialsTest.theDevTokenDerivesThePinnedVector]
        integration: [InstanceConfigSecretSliceTest.aStoredValueSealedUnderAnotherKeyReadsAsMismatch, InstanceStoreSliceTest.aSecretOmittedOnALaterWriteKeepsTheStoredOne]
    gaps:
      - surface: backend
        reason: >-
          The store's own `unreadable` list after a key change is read through the state (`StoreCheckTest` stops at
          `CREDENTIALS`; the config-secret read reports the MISMATCH), never through `GET /api/instance/store` with a
          real second key file. That the bundled case seals nothing is shown by its derived key pair (the pinned
          vector), not by a restart with a lost key.
  - id: no-store-refuses-uploads-with-a-reason
    text: >-
      With no store set the instance runs and refuses uploads with a reason; the in-memory store is never used
      outside tests.
    coverage:
      backend:
        unit: [UnconfiguredBlobStoreTest.anUnconfiguredStoreSignsNothingAndHasNoOrigin, UnconfiguredBlobStoreTest.anUnconfiguredStoreReportsNothingDeleted]
    gaps:
      - surface: backend
        reason: >-
          The choice between the in-memory stub and the unconfigured store is `SwitchingBlobStore`'s `hermetic` flag,
          and the whole suite runs under `%test`, where it is true: the `else` branch that a production profile takes
          is read by no test, only the store it picks is proven. The upload handlers' `store_unavailable` answer is
          pinned by the many slice tests that run on a store which cannot presign.
  - id: objects-no-row-claims-are-counted
    text: >-
      A background sweep lists the store in use page by page and counts the objects no row claims — veyq-shaped, past
      the safe age on the store's own clock, still present when asked again — apart from the probe and from keys not
      shaped like veyq's; a page that fails (the store, its clock, the database) counts and publishes nothing, and the
      next tick resumes where it stopped.
    coverage:
      backend:
        unit: [S3BlobStoreListTest.aPageCarriesItsObjectsTheStoresClockAndWhetherMoreFollow, S3BlobStoreListTest.anAnswerWithoutTheStoresClockIsRefused, S3BlobStoreListTest.aRefusedListingLeavesAsTheStoresOwn403, UnconfiguredBlobStoreTest.anUnconfiguredStoreListsNoBucket]
        integration: [StoreReconcileSliceTest.anObjectAnyClaimRowNamesIsNoOrphanAndAnUnclaimedOneIs, StoreReconcileSliceTest.theProbeIsIgnoredAndAKeyNotShapedLikeVeyqsIsNeverAnOrphan, StoreReconcileSliceTest.anObjectPastItsClaimedCountIsCountedAndItsKeyIsNeverEnqueued, StoreReconcileSliceTest.theSafeAgeIsReadOnTheStoresClock, StoreReconcileSliceTest.anObjectGoneWhenAskedAgainIsNoOrphan, StoreReconcileSliceTest.aFailedPageKeepsThePassesPlaceAndTheNextTickResumesIt, StoreReconcileSliceTest.aClaimQueryThatFailsCountsNothingAndCompletesNothing, StoreReconcileSliceTest.aListingWithoutTheStoresClockIsNotJudged, StoreReconcileSliceTest.aStoreThatCannotOrMayNotListIsNamed, StoreReconcileSliceTest.aPageAnotherTickWroteFirstIsCountedOnce, InstanceStoreReconcileSliceTest.theSwitchesMoveTheVerdictAndThePassReachesTheWire]
    gaps:
      - surface: backend
        reason: >-
          The listing is read from a scripted bucket and from a raw HTTP stub; a real store's answer (Garage's `Date`
          against its `LastModified`, paging by `start-after`) is `S3BlobStoreListE2ETest`'s, opt-in behind
          `VEYQ_S3_E2E=1`, which no workflow sets. That the claim set is every table with a `storage_key` is the guard
          `scripts/validate_store_reconcile_claims.py`, not a test.
  - id: orphans-are-reclaimed-only-after-the-grace-on-an-exclusive-bucket
    text: >-
      An unclaimed storage key goes onto the reclaim list — never deleted by the sweep itself — only once it stayed
      unclaimed in every pass for the grace period from when it was first seen, while the Server Owner has confirmed
      that the bucket in use is this instance's alone and has not paused it; a claim that reappears takes it out, and
      another store setting, a gap in the listing and any restore restart every grace period and withdraw the
      confirmation. The Server Owner reads the candidates with their due date and confirms, withdraws, pauses and
      resumes; nobody else does.
    coverage:
      backend:
        unit: [BlobStoreStartupCheckTest.aReconcileGapBoundThatCannotOutlastAHealthyQuietIsRefused, S3BlobStoreListTest.theDigestNamesTheBucketAndNotTheSecret]
        integration: [StoreReconcileSliceTest.withoutTheExclusiveBucketConfirmationNothingIsEnqueued, StoreReconcileSliceTest.aConfirmationIsVoidOnceAnotherBucketIsListed, StoreReconcileSliceTest.aKeyIsDueOnlyOnceTheGraceHasPassedSinceItWasFirstSeen, StoreReconcileSliceTest.aClaimThatReappearsRemovesTheCandidate, StoreReconcileSliceTest.aGapLongerThanTheBoundRestartsEveryClock, StoreReconcileSliceTest.aPauseStopsTheEnqueueingAndKeepsTheCounting, StoreReconcileSliceTest.anObjectPastItsClaimedCountIsCountedAndItsKeyIsNeverEnqueued, StoreReconcileSliceTest.theReadCarriesTheCandidatesAndTheirDueDate, InstanceStoreReconcileSliceTest.theSwitchesMoveTheVerdictAndThePassReachesTheWire, InstanceStoreReconcileSliceTest.withNoStoreThereIsNothingToConfirm, InstanceStoreReconcileSliceTest.aMemberIsNotTheServerOwnerAndIsRefusedOnEveryOperation]
    gaps:
      - surface: backend
        reason: >-
          "Any restore restarts every grace period" is the restore tool's half: `instance_backup.py restore` empties the
          reconcile's tables after its load, pinned by `src/tools/instance_backup_selftest.py` (G5, `checks.yml`'s `web-e2e`
          job) and shown on a real rollback in cr-bucket-reconcile's live proof — neither a coverage surface. The backend
          proves the gap rule, its other detector. That the reclaim sweep then deletes what was recorded is
          `StoreReclaimSweepSliceTest`'s.
gaps:
  admin-web: >-
    The console's Object store page with its bucket reconcile panel, the create-tenant dialog's closed state and
    `veyq-admin store show | set | check | discard | reconcile` live
    in `admin-web` (ADR 0065), and their suites (`StorePanel.test.ts`, `StoreReconcilePanel.test.ts`, `store.test.ts`,
    `cli.test.ts`, `CreateTenantDialog.test.ts`, `AdminConsoleView.test.ts`) exist and pass locally, but `admin-web`'s job
    (`checks.yml` → `frontend` → "Run admin surface checks") has never executed, so ADR 0040 admits none of them. They
    are mocked-client tests that pin the call and the rendering, never the server's answer. On the first run of that
    job they flip to refs on the criteria above.
  web: >-
    The web client has no part in configuring the store; it only uploads to whatever store the backend signs for.
    Its upload refusal (no-store-refuses-uploads-with-a-reason) is reached through the backend's response.
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/setup/first-run.setup.ts`) drives `the-bundled-store-is-adopted-and-checked-without-a-click`
    in Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged
    with its criterion. Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`checks.yml` →
    `stack`) awaits the first CI run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the
    suite executed. On that run each file becomes a ref on the criteria its tests are tagged with, and this gap
    goes.
