useCase: uc.admin.install-and-upgrade-instance
feature: admin
title: Install an instance and keep it on the release line its operator chose
status: planned
# Refined 2026-10-16 with ADR 0096 (cr-veyqctl). Its client is `veyqctl`, a host-side Python tool, and a Python
# operator tool is not a coverage surface (ADR 0040) — the same shape as uc.admin.back-up-and-restore-instance's
# store leg. So this file stays `planned` even once built: its criteria are proven by `src/tools/veyqctl_selftest.py`
# (no Docker) and by the stack lane booting the candidate through `veyqctl install` (ADR 0090), never by a ref here.
acceptanceCriteria:
  - id: install-from-a-verified-release
    text: >-
      `veyqctl install` brings an instance up from the recipe a release carries and the images it names by digest,
      after both signatures verified, with every secret in `.env` generated and none taken from the template.
  - id: the-release-line-picks-what-upgrade-takes
    text: >-
      `VEYQ_RELEASE` decides: an exact release is never left, a major takes its newest release, `latest` crosses
      majors one per run, each entered only from the release its signed manifest names as its entry
      (`majorEntry`), never from a later fix release of the old major; a snapshot is never taken.
  - id: a-missing-value-is-refused-before-anything-stops
    text: >-
      When the new release's template requires a variable `.env` lacks, the upgrade names it and stops before any
      container is stopped.
  - id: an-unverified-release-is-never-started
    text: >-
      A release whose manifest does not verify against its signature and veyq's publish identity — from GitHub, a
      mirror or a directory alike — or whose images do not verify by the manifest's digests, is neither pulled nor
      started, no sha256 or digest in that manifest is used, and nothing on the host changes.
  - id: an-upgrade-backs-up-before-it-migrates
    text: >-
      An upgrade takes a backup of the three legs — the database, the store's index (and, when a pool is configured,
      the new objects into it), and the key to a separate medium — before the new release's app starts and migrates
      the schema.
  - id: status-warns-while-the-bundled-store-has-no-pool
    # ADR 0056 §3, ADR 0096 decisions 1 and 6. Built 2026-10-17; held by src/tools/veyqctl_selftest.py `test_pool` (V1:
    # bundled, none and an unreadable setting warn with exit 0, unhealthy exits 1 with it; a pool in .env or a store of
    # the operator's own is silent; `install` ends with it) — a host tool, not a coverage surface (this file's header).
    text: >-
      `veyqctl status` warns while the instance keeps its objects in the bundled store and no object pool is
      configured, says that the bundled store keeps no object versions, and names how to configure one; with a pool
      configured, or a store of the operator's own, it does not. The warning never changes the exit code.
  - id: a-cluster-start-that-would-migrate-backs-up-first
    # A6, ADR 0098. The gate is `src/tools/instance_backup.py gate` in the `veyq-tools` image, and neither a Python
    # operator tool nor a chart render is a coverage surface (ADR 0040), so this file stays `planned` for it too. What
    # proves it: `src/tools/instance_backup_selftest.py` (pipeline.yml's `web-e2e` job, and inside the image in the `build`
    # job's tools leg) pins the decision table, every refusal writing nothing with a control one field away, the order
    # (an emptied database passes before the downgrade refusal), retention, and that the key is never read (G1-G4,
    # G8); `scripts/chart_meta_check.py` (the `chart` job) pins (xxiv) the init container on the tools image with the
    # named claim, never the config-secret claim, and the app's release as its target, (xxv) nothing of it when off,
    # and (xxvi) the schema refusing an install that makes no choice. It ran once on a kind cluster
    # (cr-kubernetes-backup-gate, ADR 0098 M13); a cluster lane is inbox #430's.
    text: >-
      On Kubernetes, before the app container of a new release starts and migrates the schema, an init container
      captures the database and an index of the store onto a claim the operator names, and records the release; a
      restart of the same release captures nothing; a downgrade, more than one major, or a major entered from an
      untested release is refused with nothing written and the app kept down; and the chart refuses an install that
      neither names the claim nor switches the gate off.
  - id: the-previous-release-stays-on-disk
    text: >-
      After an upgrade, successful or not, the previous release's recipe is still in `releases/`, so the way back is
      a restore onto it rather than a download.
  - id: a-rollback-goes-back-in-place
    # ADR 0096, ADR 0056 §7 (owner 2026-10-17, O1 (a)). Held by src/tools/veyqctl_selftest.py `test_rollback` (the
    # order, and three refusals that stop nothing) and run live on a throwaway Compose project
    # (2026-10-17, cr-backup-store-leg-is-an-index) — a host tool, not a coverage surface.
    text: >-
      `veyqctl rollback` takes an instance back to the release a capture was taken under on the instance itself:
      refused, with nothing stopped, unless that release is still in `releases/` and the capture verifies against
      the live store; then the database is emptied, the release started once, and the capture restored with the
      check only — the store is never written.
gaps:
  backend: "Not a backend use-case: the instance is managed from the host by `veyqctl`, a Python operator tool, and on Kubernetes backed up by the chart's gate (`src/tools/instance_backup.py gate`, held by `src/tools/instance_backup_selftest.py` and `scripts/chart_meta_check.py`) — neither a coverage surface (ADR 0040)."
  web: "No client surface: the operator works at the shell with `veyqctl`; the Server Owner's console is unchanged by this use-case."
