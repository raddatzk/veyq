useCase: uc.admin.setup-server
feature: admin
title: First-run server setup
acceptanceCriteria:
  - id: status-required-when-fresh
    text: A fresh instance reports setupRequired=true and advertises the supported suites.
    coverage:
      backend: { integration: [SetupServerSliceTest.setupRequiredInitially] }
  - id: create-owner-and-complete
    text: A valid request creates the Server Owner (201) and marks setup complete.
    coverage:
      backend: { integration: [SetupServerSliceTest.createsOwner, SetupServerSliceTest.setupNoLongerRequired] }
  - id: single-owner-lock
    text: A second owner is rejected with 409 once setup is complete.
    coverage:
      backend: { integration: [SetupServerSliceTest.rejectsSecondOwner] }
  - id: reject-non-base64-key
    text: Non-base64 key material is rejected (400).
    coverage:
      backend: { integration: [SetupServerSliceTest.rejectsNonBase64Key] }
  - id: reject-invalid-email
    text: A malformed email is rejected at the boundary (400).
    coverage:
      backend: { integration: [SetupServerSliceTest.rejectsInvalidEmail] }
  - id: trim-email-field
    text: The email is trimmed before validation and storage (the account carries no display name — identity is a per-tenant username, ADR 0023).
    coverage:
      backend: { unit: [SetupRequestSanitizationTest.trimsNameFields] }
gaps:
  admin-web: >-
    Implemented (cr-0002) and, since cr-admin-web-extraction (ADR 0065), implemented HERE rather than in `web`:
    first-run setup moved to the admin surface with the rest of Server-Owner administration, which is what lets
    an operator bootstrap over `http://localhost:<admin-port>` before `VEYQ_DOMAIN` resolves anywhere. The
    surface tests exist (`admin-web/src/features/setup/setupServer.test.ts`) and are not linked yet, for the
    same reason the sibling admin use-cases are not: no CI run has ever executed in this repository, so ADR
    0040 leaves the claim unmade regardless of how green the suite is locally.
