useCase: uc.admin.setup-server
feature: admin
title: First-run server setup
acceptanceCriteria:
  - id: status-required-when-fresh
    text: A fresh instance reports setupRequired=true and advertises the supported suites.
    coverage:
      backend: { integration: [SetupServerSliceTest.setupRequiredInitially] }
  - id: create-owner-and-complete
    text: A valid request creates the Server Owner (201) and marks setup complete.
    coverage:
      backend: { integration: [SetupServerSliceTest.createsOwner, SetupServerSliceTest.setupNoLongerRequired] }
  - id: single-owner-lock
    text: >-
      A second owner is rejected with 409 once setup is complete — the loser of two concurrent setups included,
      which answers that 409 rather than a 500 and leaves one setup row.
    coverage:
      backend:
        integration: [SetupServerSliceTest.rejectsSecondOwner, SetupServerSliceTest.concurrentSetupsCreateOneOwnerAndTheLoserAnswersAsAReplay]
  - id: reject-non-base64-key
    text: Non-base64 key material is rejected (400).
    coverage:
      backend: { integration: [SetupServerSliceTest.rejectsNonBase64Key] }
  - id: reject-invalid-email
    text: A malformed email is rejected at the boundary (400).
    coverage:
      backend: { integration: [SetupServerSliceTest.rejectsInvalidEmail] }
  - id: trim-email-field
    text: The email is trimmed before validation and storage (the account carries no display name — identity is a per-tenant username, ADR 0023).
    coverage:
      backend: { unit: [SetupRequestSanitizationTest.trimsNameFields] }
gaps:
  admin-web: >-
    Implemented (cr-0002) and, since cr-admin-web-extraction (ADR 0065), implemented HERE rather than in `web`:
    first-run setup moved to the admin surface with the rest of Server-Owner administration, which is what lets
    an operator bootstrap over `http://localhost:<admin-port>` before `VEYQ_DOMAIN` resolves anywhere. The
    surface suite exists and passes locally (`src/features/setup/setupServer.test.ts`), but `admin-web`'s job
    (`container.yml` → `test` → "Admin surface checks") has never executed, so ADR 0040 admits it nowhere — a
    declared run is enough only on a job a run has already executed; every admin use-case holds its admin-web
    suites here for that one reason. On the first run whose log shows admin-web's suites executed, the suite
    goes under `create-owner-and-complete` alone: it pins that the surface issues a valid Model-B request
    (standard-base64 fields, both wraps with their kdfParams, never the raw password), while the 201 stays the
    backend ref's sentence. It is deliberately NOT a ref for `reject-non-base64-key`: that the client never
    emits non-base64 is a different sentence from the server refusing it.
  web: >-
    No web part since ADR 0065 moved first-run Server-Owner registration to `admin-web` (the gap above). Web's
    one trace is the router guard sending every route to `/not-set-up` while `setupRequired` is true
    (`src/router.ts`), whose `NotSetUpView` deliberately names no admin URL — the operator chose it at deploy
    time and this app is never told. The criteria here are the setup API's; none describes that redirect.
