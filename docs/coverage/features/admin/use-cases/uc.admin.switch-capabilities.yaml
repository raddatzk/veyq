useCase: uc.admin.switch-capabilities
feature: admin
title: Switch the instance's capabilities on and off
# Refined 2026-10-15 from inbox #443 (ADR 0088 decisions 5, 12 and 13); built by cr-operator-capability-switches;
# share-switch-acts-at-once by inbox #442.
# The switch lives on the admin channel, so the criteria's refs are the backend's slice and unit tests; the web's
# are the client meeting a withheld wrap. `admin-web`'s suites (the Capabilities panel, the CLI, the console's nav)
# wait under `gaps` until its CI job has executed (ADR 0040), as uc.admin.configure-object-store's do.
acceptanceCriteria:
  - id: register-listed
    text: The Server Owner lists the register as a tree with each entry's title, purpose, effect-when-off and state (on, off, off through its parent), in the console's language or the CLI's locale, from text the API serves.
    coverage:
      backend:
        unit: [CapabilityRegistryTest.theRegisterIsEveryCatalogEntryInCatalogOrderWithItsWords]
        integration: [InstanceCapabilitiesSliceTest.theRegisterIsListedInCatalogOrderWithItsWordsAndEveryEntryOn, InstanceCapabilitiesSliceTest.aParentOffSwitchesItsChildrenOffAndTheirOwnSwitchesSurviveIt]
    gaps:
      - surface: backend
        reason: >-
          The backend serves the list in catalog order with both languages and each entry's `off` and `effective`.
          The tree, the "off through" ancestor it names and the choice of language are admin-web's
          (`CapabilitiesPanel.test.ts`, `cli.test.ts`), which wait under the use-case gap below.
  - id: switch-without-restart
    text: Switching an entry off or on through the Admin API is stored in the database and takes effect for the manifest and every gate without a restart; an entry's own state survives while its parent is off.
    coverage:
      backend:
        unit: [CapabilityRegistryTest.theSwitchesAreAskedOnEveryCall]
        integration: [InstanceCapabilitiesSliceTest.aSwitchOffLeavesTheManifestAndRefusesTheGateAndSwitchingOnRestoresBoth, InstanceCapabilitiesSliceTest.aParentOffSwitchesItsChildrenOffAndTheirOwnSwitchesSurviveIt, InstanceCapabilitiesSliceTest.writingTheStateAnEntryHasChangesNothing, InstanceCapabilitiesSliceTest.twoSimultaneousSwitchOffsOfOneEntryBothAnswerAndStoreOneRow, CapabilityManifestSliceTest.theDefaultProfileWiresTheProductionSwitchesAndServesEveryAdvertisedId, CapabilityDisabledSliceTest.aSwitchedOffParentDropsEveryShareIdAndRefusesADropBoxLink, CapabilityDisabledSliceTest.groupSpaceOffRefusesANewGroupAndKeepsAnExistingOneUsable, CapabilityDisabledSliceTest.rememberDeviceOffRefusesBothMethods, CapabilityDisabledSliceTest.deviceLinkingOffRefusesEveryPairingEndpointAndStopsAPairingInFlight]
    gaps:
      - surface: backend
        reason: >-
          Through the Admin API itself the slice reaches the manifest and one gate (device linking's pairing).
          Every other gate is proven by `CapabilityDisabledSliceTest`, whose row `CapabilitySwitchFixtures` writes
          through the same store and cache invalidation as the handler, minus the HTTP. "Without a restart" is the
          same process reading the next request; a second replica is not covered and not deployed (one replica,
          `infra/kubernetes/charts/veyq/values.yaml`).
  - id: unknown-id-refused
    text: Switching an id the register does not hold is refused and stores nothing.
    coverage:
      backend:
        integration: [InstanceCapabilitiesSliceTest.anUnknownIdIsRefusedAndStoresNothing, InstanceCapabilitiesSliceTest.aWriteWithoutOffIsRefusedAndStoresNothing, InstanceCapabilitiesSliceTest.onlyTheServerOwnerReadsOrSwitches]
  - id: device-switch-acts-at-once
    text: With core.remember-device off, DEVICE wraps are withheld from the key material; with core.remember-device.passwordless off (or its parent), DEVICE_KEY wraps are withheld. Neither is deleted, the PASSWORD wrap is always served, and switching back on restores every remembered device.
    coverage:
      backend:
        integration: [InstanceCapabilitiesSliceTest.aDeviceSwitchWithholdsItsWrapsFromTheNextKeyMaterialReadAndSwitchingOnRestoresThem, AccountKeyMaterialSliceTest.rememberDeviceOffWithholdsBothDeviceWrapsAndServesThePasswordWrap, AccountKeyMaterialSliceTest.passwordlessOffWithholdsOnlyTheDeviceKeyWrap]
      web:
        unit: [src/views/LoginView.test.ts, src/views/LoginView.deviceSwitch.test.ts, src/features/account/rememberMe/deviceKeyWrap.test.ts, src/features/account/unlock/unlock.device.test.ts, src/features/account/trustDevice/trustDevice.test.ts, src/features/account/sessions/SessionsPanel.test.ts]
    gaps:
      - surface: web
        reason: >-
          The web suites run over mocked key material: a withheld wrap keeps the device's record and key, the
          sign-in asks for the password and the Secret Key with the `unlock.deviceHeldBack` hint, the device is not
          re-enrolled to the other tier, its line in Devices and sessions says it is held back instead of how it
          unlocks, and the same wrap served again opens it with no new enrolment. A remembered device that signs in
          while passwordless is off keeps the persistent cookie scope (a device without the record still gets the
          session one), and `LoginView.deviceSwitch.test.ts` follows that sign-in through a switch-on and a browser
          restart, over the real remember-me record and a fake server and cookie jar, to a device that opens
          directly (inbox #450). A real browser ran it once by hand
          on 2026-10-15 (inbox #447) against a fresh instance: with each device switch off, a trusted and a
          remembered device unlocked with the password and the Secret Key, sent no DELETE or POST to
          `/api/account/wraps` (a fetch hook and Resource Timing; the database's four wraps stayed byte-identical),
          kept their local records and stayed listed in Devices and sessions; switched back on, the trusted device
          unlocked with the password alone through the same DEVICE wrap and the remembered one opened without a
          prompt in a new tab. Not covered: a real browser restart after a sign-in made while the switch was off (the
          browser pane cannot restart its browser; the restart is the test's cookie jar). Lane L1 now runs that pass
          in Chromium against the candidate image (`tests/e2e/tests/features/capability-off-states.spec.ts`, the use-case's
          `stack` gap below), green locally; it waits there until a CI run admits `stack`.
  - id: share-switch-acts-at-once
    text: While core.public-shares, .contribute or .drop-box is effectively off, every guest endpoint in core, Memories and Depot answers an existing link of the role it reaches exactly as an unknown link (the same 404 and body, before the password is asked), the links of the roles it does not reach stay served, and switching back on serves every link again because nothing was written onto it; changing a READ link into a READ_WRITE one while .contribute is off is refused with 422 capability_disabled.
    coverage:
      backend:
        unit: [ShareAccessPolicyTest.eachRoleNeedsItsOwnLeaf, ShareAccessPolicyTest.anUnknownRoleNeedsTheParent]
        integration: [ShareSwitchGuestGateCoreSliceTest.eachShareSwitchRefusesEveryCoreGuestPathOfItsRoleLikeAnUnknownLinkAndServesItAgainOnceBackOn, ShareSwitchGuestGateCoreSliceTest.aSwitchedOffPasswordLinkIsRefusedBeforeItsPasswordIsAsked, ShareSwitchGuestGateMemoriesSliceTest.eachShareSwitchRefusesEveryMemoriesGuestPathOfItsRoleLikeAnUnknownLinkAndServesItAgainOnceBackOn, ShareSwitchGuestGateDepotSliceTest.eachShareSwitchRefusesEveryDepotGuestPathOfItsRoleLikeAnUnknownLinkAndServesItAgainOnceBackOn, ReactivateShareCapabilitySliceTest.changingALinkIntoAContributeLinkWhileContributeIsOffIs422]
      web:
        unit: [src/core/sharing/resolvePublicShare.test.ts, src/core/sharing/pollPublicShare.wire.test.ts, src/views/ShareView.registry.test.ts]
    gaps:
      - surface: backend
        reason: >-
          The switch rows are written by `CapabilitySwitchFixtures` through the store and the cache invalidation the
          Admin API's handler uses, minus the HTTP (as for every other gate, switch-without-restart). A URL the store
          signed before the switch runs to its TTL and is not exercised: the in-memory store signs nothing.
      - surface: web
        reason: >-
          Nothing changes in the web client: a refused link is the 404 an unknown or expired one already is, and the
          refs pin that a 404 resolve, or a 404 on a poll, shows the unavailable page. A guest meeting a switched-off
          link in a real browser has not been run (inbox #448 automates the browser passes).
  - id: share-switch-named-in-the-share-list
    text: While a share switch is off at the instance level, a member's share list marks every link it stops with that switch's entry (the link's role's entry or an ancestor), the links of the roles it does not reach unmarked, from the predicate the guest gate runs (inbox #457).
    coverage:
      backend:
        unit: [CapabilityRegistryTest.offSwitchesNameEverySwitchOnThePathRootFirstInstanceBeforeTenantAndAreEmptyExactlyWhenActive]
        integration: [ShareGuestStopsCoreSliceTest.anInstanceSwitchNamesItsEntryOnTheLinksOfItsRoleOnly, ShareGuestStopsCoreSliceTest.theListAndTheGuestGateAgreeOverTheMatrix]
      web:
        unit: [src/core/sharing/ShareGuestStops.test.ts, src/core/sharing/FolderShareDialog.test.ts]
  - id: off-state-in-a-browser
    text: In a real browser, a switched-off drop box, device linking and password-less remember are absent from the web client, and a device remembered before its switch went off asks for what its wrap replaced.
    coverage:
      web:
        unit: [src/views/LoginView.test.ts, src/views/SettingsHubView.test.ts, src/shared/state/useCapabilities.test.ts]
    gaps:
      - surface: web
        reason: >-
          The refs are component tests over a hand-set manifest and mocked key material - the toggle, the "sign in
          with code" entry and the drop-box id absent, and a remembered device asking for the password and the
          Secret Key. A real browser ran it once by hand on 2026-10-15 (inbox #447): a fresh instance switched off
          one entry at a time through admin-web's Server → Capabilities, each confirmation showing the entry's
          served `whenOff` word for word; the web client then offered no "New drop box" and no drop-box tab, no
          "Sign in with a QR code" and no "Add a device" (its address led back to Settings), and no "Stay signed
          in"; a trusted and a remembered device each asked for the password and the Secret Key with the
          `unlock.deviceHeldBack` hint once the email was entered (before that, the first-sign-in hint: the lookup
          was keyed on an email field that started empty; since inbox #450 the field is filled in from the device's
          record, which `LoginView.test.ts` pins); a child switched on under a parent still off showed "off through"
          it. Switched on again, every affordance returned. That pass is now lane L1's
          `tests/e2e/tests/features/capability-off-states.spec.ts` (the email prefilled and the hint shown before anything
          is typed included); it waits under the use-case's `stack` gap until a CI run admits `stack`.
gaps:
  admin-web: >-
    The console's Server → Capabilities panel and `veyq-admin capabilities list | off <id> | on <id>` live in
    `admin-web` (ADR 0065), and their suites (`CapabilitiesPanel.test.ts` for the tree, the three states, the
    confirmation with `whenOff` in both locales and the refusal; `cli.test.ts` for the commands, the locale from
    `--lang`, `LC_ALL` and `LANG`, and the exit codes; `AdminConsoleView.test.ts` for the nav) exist and pass
    locally, but `admin-web`'s job (`ci.yml` → `frontend` → "Run admin surface checks") has never executed, so ADR
    0040 admits none of them. They are mocked-client tests that pin the call and the rendering, never the server's
    answer. On the first run of that job they flip to refs on register-listed, switch-without-restart and
    unknown-id-refused.
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/capability-off-states.spec.ts`) drives `off-state-in-a-browser`,
    `switch-without-restart` and `device-switch-acts-at-once` in Chromium against the release candidate's two images,
    installed through `veyqctl` (ADR 0090): the Server Owner switches drop boxes, adding a device from another one,
    unlocking without a password and remembered devices off one at a time in admin-web's Server → Capabilities, each
    confirmation showing the served `whenOff`; the web client then offers no "New drop box" and no drop-box tab, no
    "Sign in with a QR code", no "Add a device" (its address leads back to Settings) and no "Stay signed in"; a
    trusted and a remembered device ask for the password and the Secret Key with the held-back hint, the email filled
    in, and unlock with them, sending no POST or DELETE to `/api/account/wraps` while the switch is off; the child is
    "off through" its parent; switched back on, every affordance returns, the remembered device opens without a
    prompt and the trusted one unlocks with the password alone. Green only in local runs of `scripts/run_stack_e2e.py`:
    the lane's CI job (`ci.yml` → `stack`) awaits the first CI run (no remote), and ADR 0040 admits `stack` refs only
    once a run's log shows the suite executed. On that run the file becomes a ref on those three criteria, and this
    gap goes. Not covered there: a browser restart (a new context would be a new device to this suite).
