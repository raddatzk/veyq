useCase: uc.admin.admin-channel
feature: admin
title: Administer the instance only through the admin container
# Every negative below is paired with its positive control on the same predicate — the same call answering
# normally on the admin listener — because a backend that 404s the operation everywhere satisfies a lone negative
# perfectly.
acceptanceCriteria:
  - id: setup-answers-only-on-the-admin-channel
    text: >-
      On a fresh instance, POST /api/setup/owner on the public port is answered 404 and creates nothing — setup
      status still reports setupRequired — while the identical request on the admin listener creates the Server
      Owner (201).
    coverage:
      backend: { integration: [SetupServerSliceTest.setupIsAnUnknownRouteOnThePublicPort, SetupServerSliceTest.createsOwner] }
  - id: server-owner-operations-answer-only-on-the-admin-channel
    text: >-
      Every role-gated operation marked x-veyq-channel admin, called with a Server-Owner session, is answered 404
      on the public port and executes nothing, while on the admin listener it gives its normal answer.
    coverage:
      backend:
        integration:
          - AdminChannelGateSliceTest.everyRoleGatedMarkedOperationIsAnUnknownRouteOnThePublicPortAndAnswersOnTheAdminListener
          - AdminChannelGateSliceTest.aRefusedCreateTenantCreatesNothing
  - id: the-refusal-is-an-unknown-route
    text: >-
      The public port's refusal of a marked operation is identical in status and body to its answer for an /api
      path no resource declares.
    coverage:
      backend: { integration: [AdminChannelGateSliceTest.theRefusalIsIdenticalToAnUnknownRoute] }
  - id: the-socket-decides-not-the-headers
    text: >-
      Forged Forwarded, X-Forwarded-Host, X-Forwarded-Port and X-Forwarded-For headers naming the admin listener
      or a private client address leave the public port's refusal unchanged, with proxy-address forwarding on.
    coverage:
      backend:
        integration:
          - AdminChannelForgedHeadersSliceTest.forgedForwardingHeadersDoNotOpenThePublicPort
          - AdminChannelForgedHeadersSliceTest.theSameHeadersOnTheAdminListenerChangeNothingThere
  - id: a-proxy-header-cannot-name-the-admin-listener
    text: >-
      With the PROXY protocol on, a connection to the public port whose PROXY header names the admin listener's port
      as its destination and a private client as its source leaves a Server-Owner call there at the 404, while the
      same call on the admin listener answers.
    coverage:
      backend:
        integration:
          - AdminChannelProxyProtocolSliceTest.aProxyHeaderNamingTheAdminListenerDoesNotOpenThePublicPort
          - AdminChannelProxyProtocolSliceTest.theSameCallOnTheAdminListenerAnswers
  - id: a-globally-routable-peer-is-the-public-channel
    text: >-
      The admin-channel predicate accepts a request on the admin listener from a loopback, RFC 1918, shared
      (100.64/10), link-local or unique-local peer, and treats one from a globally routable peer as the public
      channel.
    coverage:
      backend:
        unit:
          - AdminChannelTest.aNonGlobalPeerOnTheAdminPortIsTheAdminChannel
          - AdminChannelTest.aGloballyRoutablePeerIsThePublicChannelEvenOnTheAdminPort
  - id: shared-operations-answer-on-both-channels
    text: >-
      Setup status, login challenge and verify, refresh and logout carry no marker and answer identically on the
      public port and the admin listener.
    coverage:
      backend: { integration: [AdminChannelGateSliceTest.theSharedOperationsCarryNoMarkerAndAnswerIdenticallyOnBothChannels] }
  - id: the-gate-implies-the-marker
    text: >-
      Every operation whose effective backend gate is the Server-Owner role carries x-veyq-channel admin, and every
      operation so marked resolves to a resource method that exists — so a Server-Owner operation added without
      the marker fails the build instead of shipping on the public origin.
    coverage:
      backend:
        unit:
          - AdminChannelPostureSweepTest.everyServerOwnerGatedOperationCarriesTheMarker
          - AdminChannelPostureSweepTest.everyMarkerNamesAResourceMethodThatExists
  - id: no-admin-listener-no-backend
    text: >-
      When the admin listener cannot bind its port, the backend fails to start rather than serving its public port
      with no admin door.
    coverage:
      backend: { unit: [AdminListenerBindTest.aTakenPortFailsTheBindNamingIt] }
gaps:
  web: >-
    No web criterion, by construction: the property is enforced in the backend, and web makes no call to a marked
    operation. The live e2e bootstrap births every instance and tenant through the admin listener, which every
    e2e suite then exercises without asserting on it.
