useCase: uc.admin.back-up-and-restore-instance
feature: admin
title: Back up an instance and restore it onto an empty one
# This use-case exists to make architecture §10's durability bar executable: its sentence is criterion
# `restore-onto-empty-opens-every-memory` below, almost word for word. Until a CI-run test carries that
# criterion, §10 keeps saying "half held" — the bar follows the build, never the intention (ADR 0040).
# The capture/restore machinery itself is a Python script and an orchestrator extension, neither of which is a
# coverage surface; what is claimable here is what a test can observe about a restored instance.
#
# The suites now EXIST and pass locally. `status: planned` is nonetheless correct and not a formality: this
# repository has no remote and no CI run has ever executed, so ADR 0040's rule — a test no CI run executes makes
# no coverage claim — leaves every criterion uncovered. The gaps below therefore state the ONE remaining
# condition, which is a CI run and not a missing test. `docs/coverage/README.md` § Rules forbids the
# compromise ("a surface that is covered may not also be a gap"), so "refs plus a caveat" is not an expressible
# state; the flip is a mechanical edit gated on that event, spelled out in docs/inbox.md #26.
status: planned
acceptanceCriteria:
  - id: three-legs-or-it-is-not-a-backup
    text: >-
      A restore that carries the database and the object store but not the config-secret key file produces an
      instance that starts cleanly, serves content, and is nonetheless broken: it reports a config-secret
      mismatch and refuses member invites and password resets with 503 mail_unavailable. Content is unaffected —
      the key seals operator config, never content — which is exactly why the failure is invisible until someone
      tries to invite or reset. Restoring the key file, or re-entering each tenant's SMTP password, resolves it.
  - id: a-stopped-app-makes-the-dangerous-skew-impossible
    text: >-
      With the application stopped, the database gains no rows even while a still-valid presigned URL lets a
      client complete an upload against the store. An object written in that window therefore never acquires a
      blob row, so a capture taken in that state cannot contain a row whose object is missing — the one skew the
      media read path does not handle. This is the property that removes the capture ordering and the TTL wait
      from the procedure, so it is asserted rather than assumed.
  - id: restore-onto-empty-opens-every-memory
    text: >-
      After the documented procedure restores onto an empty instance, a person signs in with the password they
      already had and opens a Memory containing media, decrypted with the key material they already hold. No
      content was re-encrypted, no key was handed to the operator by the restore, and the Emergency Kit that
      worked before still works. This is architecture §10's durability bar stated as a test. *Empty* means the
      instance holds no DATA: a freshly installed one — started once, so its schema is migrated and its store
      provisioned — is the shape a restore targets, and is accepted (A5, ADR 0067). It is now the only shape an
      operator can produce, since the app is the only thing that makes the store usable and the same start
      migrates the schema.
  - id: a-populated-target-is-refused-rather-than-reconciled
    text: >-
      A restore aimed at an instance that already holds data is refused before anything is written, naming the
      rows it found — including the rows a half-finished restore itself just wrote. This is the other half of
      the criterion above and it is stated separately on purpose: relaxing *empty* from "no tables" to "no data"
      widened what the gate accepts, and a gate whose entire job is refusal is not demonstrated by the case it
      accepts. Nothing reconciles two populated instances (A5), and the refusal is asserted by its own message
      rather than by a non-zero exit, which a connection failure produces equally well.
  - id: the-store-leg-is-verifiable-before-the-restore
    text: >-
      Because the store leg is the S3 object namespace rather than the store's on-disk form, the captured object
      keys are comparable against the blob rows that reference them. A capture missing an object is detected
      against the database it was taken with, before anyone restores it — the check a volume copy cannot offer,
      and the reason this form was chosen.
  - id: the-store-leg-restores-onto-a-different-store
    text: >-
      The captured objects restore into a bucket that is not the source's — different endpoint, credentials,
      bucket name, and store implementation — with only configuration changing. The bucket, access key and
      layout are recreated rather than restored, because they were never durable state. What recreates them
      changed with ADR 0067 and the claim did not: it is the target application's own first start, from the
      declared store type, rather than a compose sidecar — which is also why the target must be *installed*
      before a restore rather than merely created.
gaps:
  backend: >-
    No backend test, and none is planned. The two criteria that stay uncovered on every surface are
    `a-stopped-app-makes-the-dangerous-skew-impossible` — whose property is "the app is stopped", which a
    backend test cannot observe because a backend test IS the app — and
    `the-store-leg-is-verifiable-before-the-restore`, whose observable is the exit code of
    `scripts/instance_backup.py verify`, and a Python tool is not a coverage surface (ADR 0040). Both are
    proven instead by that tool's own asymmetry (an object with no row is tolerated, a row with no object is
    fatal, naming the object) and by the CR's bite-proofing. The config-secret MISMATCH verdict itself is
    already covered under uc.admin.tenant-mail-settings; what this use-case adds is reaching it BY WAY OF a
    restore, which is a live-instance property and therefore web's.
  web: >-
    The suites exist and pass locally; the only thing missing is a CI run to execute them (ADR 0040). Two
    grouped e2e suites under `web/src/features/instanceBackup/` run through `scripts/run_web_e2e.py`: `restore.*`
    births an instance with media, has the orchestrator capture it, DESTROY the source, and restore onto a
    freshly INSTALLED target — a fresh database, bucket and key path plus one app boot, which is what migrates
    the schema and provisions the store (ADR 0067) and is therefore the operator's own step 1 — then signs in
    for real (`login` + `unlockMasterKey` — Argon2 over the password and the Emergency Kit's Secret Key, no
    injected vault) and compares the fetched plaintext byte for byte; `legthree.*` does the same restore minus
    the key file and asserts MISMATCH plus a 503 mail_unavailable invite, with a pre-capture `OK` as its
    positive control. `a-populated-target-is-refused-rather-than-reconciled` rides in the same hook rather than
    in a suite, because its observable is the operator tool's exit and message rather than anything a browser
    sees: `assert_populated_target_is_refused` re-runs the identical restore against the instance the previous
    line just populated and requires it to fail naming the data it found — so the accepted case and the refused
    case are established against one instance, one artifact apart. Note what this corrects: the fixture is NOT
    `web/scripts/devSeed.mts` — no e2e suite reads it, every suite bootstraps through `birthInstance()`, and a
    `vaultFromSeed()` inject would have bypassed the password-derived unlock that "with the keys their owners
    already hold" is actually about.
