useCase: uc.admin.back-up-and-restore-instance
feature: admin
title: Back up an instance and restore it onto an empty one
# This use-case exists to make architecture §10's durability bar executable: its sentence is criterion
# `restore-onto-empty-opens-every-memory` below, almost word for word, and a CI-run test now carries it: the
# grouped web e2e rehearsal, on the `web-e2e` job — a row a run admitted before the 2026-08-06 import (ADR 0040's
# note on which rows a run has admitted). So §10 reads "held"; the bar follows the build, never the intention.
# The capture/restore machinery itself is a Python script and an orchestrator extension, neither of which is a
# coverage surface; what is claimable here is what a test can observe about a restored instance.
#
# `status: planned` stays, and it is not a formality: five criteria are out of every surface's reach — their
# observable is a stopped app, the operator tool's exit, or a second store no harness stands up — the same
# shape as uc.admin.identify-instance-release's manifest criterion. `docs/coverage/README.md` § Rules gives such
# a criterion no other legal home, so each says on itself how it is proven instead. (Until 2026-09-24 this file
# held the two rehearsals back too, on "no CI run has ever executed" — a stricter bar than the corpus set any
# other ref, retired with that note.)
status: planned
acceptanceCriteria:
  - id: three-legs-or-it-is-not-a-backup
    text: >-
      A restore that carries the database and the object store but not the config-secret key file produces an
      instance that starts cleanly, serves content, and is nonetheless broken: it reports a config-secret
      mismatch and refuses member invites and password resets with 503 mail_unavailable. Content is unaffected —
      the key seals operator config, never content — which is exactly why the failure is invisible until someone
      tries to invite or reset. Restoring the key file, or re-entering each tenant's SMTP password, resolves it.
    coverage:
      # `legthree.*` does the `restore.*` restore minus the key file — the same capture, restored with
      # `--without-key` as an operator reaches A2, so the two groups differ in exactly one flag — and asserts
      # MISMATCH plus a 503 `mail_unavailable` invite while the Memory still opens, with a pre-capture `OK` as its
      # positive control. `restore.b-reopen` is the other remedy's half: with the key file restored, the state
      # reads `OK`.
      # A precondition of that `OK`, not a criterion of its own: the restored key must be READABLE by the app
      # (uid 10001 on both deployment targets), or it reads ABSENT with the key present (inbox #188). The
      # rehearsal cannot see it — it restores as the same user that runs the backend. The tool's owner rule is
      # proven docker-free by `scripts/instance_backup_selftest.py` (every plan branch, and a refusal before the
      # first write), which `ci.yml`'s `web-e2e` job runs; a Python operator tool is no coverage surface, so it is
      # named here rather than cited. The production recipe's live run (root over the 10001-owned volume →
      # `10001:10001 600` and `configSecretState: OK`) has NOT been recorded: it needs a production stack and root.
      web:
        e2e:
          - src/features/instanceBackup/legthree.a-capture.e2e.test.ts
          - src/features/instanceBackup/legthree.b-mismatch.e2e.test.ts
          - src/features/instanceBackup/restore.b-reopen.e2e.test.ts
    gaps:
      - surface: web
        reason: >-
          Re-entering each tenant's SMTP password is not driven after a restore. That re-sealing clears a
          MISMATCH is proven where the key's lifecycle lives: uc.admin.tenant-mail-settings,
          `config-secret-key-loss-is-detected-and-degrades`, cites
          `ConfigSecretKeyGuardTest.detectsAChangedKeyThenRecoversOnReseal`.
  - id: a-stopped-app-makes-the-dangerous-skew-impossible
    # No coverage, and none to come: the property is "the app is stopped", which a backend test cannot observe
    # because a backend test IS the app. Both rehearsals capture with the app already down, which is the whole
    # consistency argument (ADR 0056 §2), but none asserts the window. It is proven instead by the operator
    # tool's asymmetry — an object with no row is tolerated, a row with no object is fatal, naming the object —
    # and by the CR's bite-proofing.
    text: >-
      With the application stopped, the database gains no rows even while a still-valid presigned URL lets a
      client complete an upload against the store. An object written in that window therefore never acquires a
      blob row, so a capture taken in that state cannot contain a row whose object is missing — the one skew the
      media read path does not handle. This is the property that removes the capture ordering and the TTL wait
      from the procedure, so it is asserted rather than assumed.
  - id: restore-onto-empty-opens-every-memory
    text: >-
      After the documented procedure restores onto an empty instance, a person signs in with the password they
      already had and opens a Memory containing media, decrypted with the key material they already hold. No
      content was re-encrypted, no key was handed to the operator by the restore, and the Emergency Kit that
      worked before still works. This is architecture §10's durability bar stated as a test. *Empty* means the
      instance holds no DATA: a freshly installed one — started once, so its schema is migrated and its store
      provisioned — is the shape a restore targets, and is accepted (A5, ADR 0067). It is now the only shape an
      operator can produce, since the app is the only thing that makes the store usable and the same start
      migrates the schema.
    coverage:
      # `restore.*` births an instance with media, has the orchestrator capture it, DESTROYS the source, and
      # restores onto a freshly INSTALLED target — a fresh database, bucket and key path plus one app boot, which
      # migrates the schema and provisions the store (ADR 0067) and is therefore the operator's own step 1 — then
      # signs in for real (`login` + `unlockMasterKey`: Argon2 over the password and the Emergency Kit's Secret
      # Key, no injected vault) and compares the fetched plaintext byte for byte. Every suite bootstraps
      # through `birthInstance()`; an injected vault would bypass the password-derived unlock that "the keys
      # their owners already hold" is about.
      web:
        e2e:
          - src/features/instanceBackup/restore.a-capture.e2e.test.ts
          - src/features/instanceBackup/restore.b-reopen.e2e.test.ts
  - id: a-populated-target-is-refused-rather-than-reconciled
    # No coverage on a surface: the observable is the operator tool's exit and message, not anything a browser
    # sees. It is asserted in the same `web-e2e` run nonetheless — `assert_populated_target_is_refused` in
    # `scripts/run_web_e2e.py` re-runs the identical restore against the instance the line before just populated
    # and requires it to fail naming the data it found ("already holds data"), never on a bare non-zero exit, so
    # the accepted case and the refused one stand against one instance, one artifact apart. A red hook fails the
    # job; it is simply not a test file this model can cite.
    text: >-
      A restore aimed at an instance that already holds data is refused before anything is written, naming the
      rows it found — including the rows a half-finished restore itself just wrote. This is the other half of
      the criterion above and it is stated separately on purpose: relaxing *empty* from "no tables" to "no data"
      widened what the gate accepts, and a gate whose entire job is refusal is not demonstrated by the case it
      accepts. Nothing reconciles two populated instances (A5), and the refusal is asserted by its own message
      rather than by a non-zero exit, which a connection failure produces equally well.
  - id: the-key-is-kept-apart-and-nothing-is-readable-by-others
    # No coverage on a surface: the observable is the operator tool's exit and message, like
    # `a-populated-target-is-refused-rather-than-reconciled` above, and it rides in the same `web-e2e` hook.
    # `scripts/run_web_e2e.py` captures with `--key-into` a path outside the capture, runs `verify` (exit 0, which
    # includes the owner-only check) and asserts no key file sits in the capture directory
    # (`verify_capture`); then `assert_unsupplied_key_is_refused` restores WITHOUT the key and requires the refusal
    # to name it (`--key-from`), before the same restore with the key — its positive control, against the same
    # freshly installed target — succeeds, which also proves the refusal wrote nothing (A5 would refuse otherwise).
    # The capture-side refusal of a key destination inside the capture was run by hand, not by the hook.
    text: >-
      A capture writes the config-secret key to a destination of its own and refuses one inside the capture
      directory, unless explicitly told to put it beside the dump; the manifest records which happened. Nothing
      the capture writes is readable by another local user. A restore of a capture whose key was kept apart
      refuses, naming the key, when it is not supplied — before anything is written — unless the operator
      explicitly accepts restoring without it (A2). The dump plus the key opens every tenant's SMTP password, so
      this is what keeps a leaked capture from being the leak the key file exists to defend against (ADR 0056 §1,
      ADR 0050).
  - id: the-store-leg-is-verifiable-before-the-restore
    # No coverage, and none to come: the observable is the exit code of `scripts/instance_backup.py verify`, and a
    # Python operator tool is not a coverage surface (ADR 0040). Proven by that tool's own asymmetry (stated on
    # `a-stopped-app-makes-the-dangerous-skew-impossible`) and the CR's bite-proofing.
    text: >-
      Because the store leg is the S3 object namespace rather than the store's on-disk form, the captured object
      keys are comparable against the blob rows that reference them. A capture missing an object is detected
      against the database it was taken with, before anyone restores it — the check a volume copy cannot offer,
      and the reason this form was chosen.
  - id: the-store-leg-restores-onto-a-different-store
    # No coverage: no harness stands up a second store. The rehearsal restores into a different BUCKET that the
    # target's own first start provisioned (`restore_hook`: `veyq-e2e-dst-<n>`), which is the "recreated rather
    # than restored" half — but on the same store, endpoint and credentials, so the portability this criterion
    # claims across endpoint, credentials and implementation rests on ADR 0056 §3 (the leg is the S3 object
    # namespace, moved by `rclone`), not on a run.
    text: >-
      The captured objects restore into a bucket that is not the source's — different endpoint, credentials,
      bucket name, and store implementation — with only configuration changing. The bucket, access key and
      layout are recreated rather than restored, because they were never durable state. What recreates them
      changed with ADR 0067 and the claim did not: it is the target application's own first start, from the
      declared store type, rather than a compose sidecar — which is also why the target must be *installed*
      before a restore rather than merely created.
gaps:
  backend: >-
    No backend test, and none is planned. What a backend test could observe here is either the app itself — and
    "the app is stopped" is exactly what it cannot be — or an operator tool's output, which is not a coverage
    surface (ADR 0040); the criteria no surface reaches say on themselves how they are proven instead. The
    config-secret MISMATCH verdict itself is already covered under uc.admin.tenant-mail-settings; what this
    use-case adds is reaching it BY WAY OF a restore, which is a live-instance property and therefore web's.
