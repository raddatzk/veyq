useCase: uc.admin.tenant-reachability
feature: admin
title: Reach a tenant at its own domain
# ADR 0063 — the reverse proxy's routing is generated from the `tenant` table, in full, on every change that
# decides whether a domain routes; ADR 0013 §4 as amended — a presigned blob URL is signed for the domain the
# request arrived on. The criteria below were split out of uc.admin.create-tenant and uc.admin.suspend-tenant,
# which each *cause* a routing change but do not own the property.
acceptanceCriteria:
  - id: domain-actually-routes
    # The whole trigger set in one criterion, because one test walks it: a suspend-specific row would carry the
    # same two refs and be the same claim written twice. What is NOT here on purpose is "a suspended tenant is
    # unreachable" — that is uc.spaces.scope-access's per-operation gate, which holds whatever the proxy
    # does; this criterion is only the second, independent layer.
    # A missed trigger site is a silent staleness bug — right row, stale routing, no crash — so the test drives
    # all five through HTTP, and scripts/validate_tenant_ingress_triggers.py keeps the set complete structurally.
    text: Creating, moving, revoking, suspending or reactivating a tenant regenerates the reverse proxy's whole router set from the tenant table — the new domain resolves, a withdrawn one stops, a reactivated one comes back — and the bootstrap domain is routed once, from configuration.
    coverage:
      # TWO sinks, one property (ADR 0063 § Decision: which domains route is the projector's, how a proxy is
      # told is a TenantIngressSink's). The TenantIngressProjector refs prove the whole criterion on the
      # docker-compose sink — including the trigger half, which is driven through HTTP and is sink-independent.
      # The KubernetesIngressSink refs prove the SECOND half only, on the second target: the router set is
      # regenerated in full, so a withdrawn domain stops routing. They deliberately do not restate the trigger
      # or bootstrap-domain claims, which no Kubernetes test exercises and which the projector already owns.
      backend:
        integration: [TenantIngressProjectorTest.everyRoutabilityChangingOperationReprojects, TenantIngressProjectorTest.theBootstrapDomainIsRoutedOnceFromConfiguration, TenantIngressProjectorTest.theBootstrapPairIsRenderedWithNoTenantRowAtAll, TenantIngressProjectorTest.suspendedTenantsAreExcluded, TenantIngressProjectorTest.regenerateIsAFullRewriteNotAPatch, TenantIngressProjectorTest.aCorruptedOrWipedFileHealsOnTheNextRegenerate, KubernetesIngressSinkTest.anIngressIsCreatedPerRoutableDomain, KubernetesIngressSinkTest.aDomainThatStoppedRoutingLosesItsIngress, KubernetesIngressSinkTest.anEmptyProjectionRemovesEverythingThisSinkOwns]
      # No web surface: routing is a server-side projection with no client half to get wrong.
  - id: the-blob-route-follows-the-bucket
    # ADR 0013 §4: path-style presigning puts every object at `/<bucket>/<key>`, so the blobs route IS the bucket
    # and is derived from the store setting's bucket, never spelled. The ref configures a bucket that is not the
    # default — every default-bucket test passes a sink that hard-codes the default, since there the literal and
    # the setting agree (bitten: a hard-coded `/blobs/` reddens this ref alone). The whole rule is compared, so
    # the prefix without its trailing slash — which claims every app path beginning with the name — fails too.
    # Kubernetes has no blobs route to derive (its store has a host of its own, ADR 0064).
    text: Every blobs route the proxy is given — the bootstrap domain's and each tenant's — routes the configured bucket's path and no path that merely begins with its name, so a bucket other than the default routes with configuration alone.
    coverage:
      backend:
        integration: [TenantIngressBucketRouteTest.everyBlobsRouterRoutesTheConfiguredBucketAndNothingElse]
      # No web surface, for the reason domain-actually-routes states: routing has no client half.
  - id: presign-for-a-reachable-origin
    # ADR 0013 §4 as amended by ADR 0063, and ADR 0067 Decision 5. The negative is the load-bearing one: the
    # domain is resolved through the tenant table, so a spoofed Host signs against the default instead of an
    # attacker-named origin — and in store-origin mode it cannot reach the URL at all.
    #
    # ONE criterion for all three signing modes, and not one per mode: they are the same property — a presigned
    # URL is signed for an origin the client can actually reach — under different deployment shapes, and a
    # per-mode row would carry these same refs split three ways, which is the tell that a criterion was written
    # per *operation* instead of per *property* (changes/README.md § coverage). Renamed from
    # `presign-for-the-arriving-domain` when the second and third modes landed: the arriving domain is what the
    # DEFAULT mode signs for, and an id that states the default as the property is the same half-truth A5 had.
    text: A presigned blob URL is signed for an origin the client can actually reach, decided by a named signing mode and never inferred — the arriving tenant's own domain by default (resolved through the tenant table, never the Host header echoed back, so a second tenant's media is not signed for the first tenant's origin and a spoofed Host falls back to the bootstrap default), the store's own configured origin where the store has one, and the backend's own endpoint where that is the only public address.
    coverage:
      backend:
        unit: [S3BlobStorePresigningTest.twoTenantsSigningTheSameKeyGetTwoDifferentHosts, S3BlobStorePresigningTest.anUnresolvedRequestSignsAgainstTheBootstrapDefault, S3BlobStorePresigningTest.withNoPublicEndpointTheDomainIsIgnored, S3BlobStorePresigningTest.inStoreOriginModeTwoTenantsSignAgainstTheSameStoreHost, S3BlobStorePresigningTest.inStoreOriginModeNoDomainAtAllCanMoveTheSignedHost, S3BlobStorePresigningTest.theInternalEndpointModeIsSelectableByNameNotOnlyByBlankingThePublicOne, S3BlobStorePresigningTest.aBlankPublicEndpointIsTheInternalModeWhateverTheConfiguredModeSays, S3BlobStoreSigningModeConfigTest.eachModeBindsFromItsHyphenatedPropertyValue, S3BlobStoreSigningModeConfigTest.theConfiguredDefaultIsTodaysHostSwappingBehaviour, S3BlobStoreSigningModeConfigTest.settingTheModeToItsDefaultExplicitlyIsIndistinguishableFromNotSettingIt, S3BlobStoreSigningModeConfigTest.theHintAndProducerHandTheConfiguredModeToTheStoreItBuilds]
        integration: [MediaPresignDomainSliceTest.twoTenantDomainsSignTheSameScopesUploadsForTwoDifferentOrigins, MediaPresignDomainSliceTest.aHostNoTenantClaimsFallsBackToTheDefault, SharePresignDomainSliceTest.aGuestsShareBlobIsSignedForTheDomainTheGuestIsOn, SharePresignDomainSliceTest.aGuestOnAHostNoTenantClaimsGetsTheDefaultNotTheirOwnHeader, StoreOriginPresignSliceTest.aHostNoTenantClaimsCannotChooseTheOriginInStoreOriginMode, StoreOriginPresignSliceTest.twoTenantDomainsSignTheSameScopesUploadsForOneOrigin]
  - id: a-row-that-skipped-validation-never-becomes-proxy-configuration
    # Stated here because the projection is the one place a stored string crosses from DATA into CONFIGURATION,
    # on both sinks. `CreateTenantRequest`/`ChangeDomainRequest` already reject the shape at the boundary, so
    # this is strictly about the row that predates that validation or arrives by a path that skips it — which
    # is why the test writes one straight through Panache rather than through the API.
    #
    # The criterion is new, the code is not: the predicate has existed since ADR 0063 and had NO test until
    # 2026-09-11 — the KDoc claim "a backtick in a domain closes the `Host(` matcher" had never once been run
    # against a backtick. A property nothing executes is a property nothing holds.
    text: A tenant domain that does not have the shape the API boundary enforces is dropped from the projection rather than interpolated into it, so a row written past that boundary cannot close a Traefik `Host(` matcher or make an Ingress object the API server rejects.
    coverage:
      backend:
        unit: [TenantIngressHostnameTest.aWellFormedDomainRoutes, TenantIngressHostnameTest.aBacktickNeverReachesATraefikRule, TenantIngressHostnameTest.theShapesThatLookLikeHostnamesAndAreNot, TenantIngressHostnameTest.aNewlineCannotSmuggleASecondLine]
        integration: [TenantIngressProjectorTest.aRowThatSkippedTheBoundaryIsNeverProjected]
      # No web surface: the column is validated on the way in by the contract, and this is the server-side
      # second layer for rows that did not come that way.
  - id: a-tenant-domain-gets-a-certificate-by-a-named-mode
    # Main-flow step 3's promise ("for each domain that appears, obtains a certificate for it") finally having a
    # Kubernetes half (ADR 0064, the TLS passthrough). The sink stamps a REFERENCE — spec.tls per named mode plus
    # the operator's annotations, verbatim — and configures nothing; the certificate itself is the operator's
    # issuer's, or the one the chart templates on opt-in (its render is held by the hand-run
    # scripts/chart_meta_check.py, which no CI executes, so it is no ref here). No test in this repository can run
    # an issuer, so the refs prove what the backend emits and that a custom domain is not excluded from it. The mode-none and shared-without-secret refs are the negatives with
    # their controls: none emits neither, and a shared mode that names no Secret is refused loudly rather than
    # routing without TLS.
    text: On Kubernetes every projected tenant Ingress carries the TLS reference and the operator's annotations the configured mode names — per-domain with the object's own name as the Secret (a custom domain included, and legal at the contract's domain cap), shared with the one pre-provisioned Secret, none with neither — and a shared mode with no Secret disables the sink loudly instead of projecting routes without TLS.
    coverage:
      backend:
        integration: [KubernetesIngressTlsPerDomainTest.perDomainEmitsOneTlsEntryPerDomainNamedAfterTheObject, KubernetesIngressTlsPerDomainTest.aDomainAtTheContractsLengthCapYieldsALegalSecretName, KubernetesIngressTlsPerDomainTest.theAnnotationMapIsStampedVerbatimAndUninterpreted, KubernetesIngressTlsSharedTest.everyProjectedIngressReferencesTheOneSharedSecret, KubernetesIngressSinkTest.inModeNoneNeitherATlsBlockNorAnnotationsAreEmitted, KubernetesIngressTlsSharedWithoutSecretTest.theSinkIsDisabledRatherThanHalfConfigured, KubernetesIngressTlsSharedWithoutSecretTest.theRefusalIsLoggedLoudlyNamingTheMissingKey]
      # No web surface: a certificate reference on a server-written object has no client half.
  - id: projector-no-ops-without-a-proxy
    # A1 — self-hostable by default: an instance with no reverse proxy in front of it must not need one. This
    # is also why the StartupEvent observer can never be a boot requirement.
    text: With no dynamic-config path configured the projection is a clean no-op — not a degraded mode and not a startup requirement — so the backend runs with no reverse proxy at all.
    coverage:
      # theConfiguredSinkIsTheDisabledOne is the ref that can actually fail: regenerateIsANoOpWithNoConfiguredPath
      # compares the file's existence before and after a regenerate, and the STARTUP regenerate has already run
      # by then — so a wrongly-enabled sink writes the projection and both snapshots read `true`. Measured.
      backend: { integration: [TenantIngressNoConfigTest.theConfiguredSinkIsTheDisabledOne, TenantIngressNoConfigTest.regenerateIsANoOpWithNoConfiguredPath] }
gaps:
  web: >-
    No web part. Every criterion is decided on the server — the proxy's router set projected from the tenant
    table, the origin a presigned URL is signed for, the TLS a projected Ingress carries — and web only follows
    the URL it is handed. A wrong decision shows in web as media that fails to load, which is why the criteria
    are pinned where the decision is made rather than where it is noticed.
