useCase: uc.admin.learn-of-new-releases
feature: admin
title: Learn of a new release without looking for one
# Built by cr-release-notices (ADR 0097): the daily check (core/admin/instance/ReleaseCheck, ReleaseFeed,
# ReleaseNoticePolicy) against an in-test HTTP source, the instance mail (InstanceMailSettingsHandler,
# InstanceNoticeMailer over core/mail/SmtpDelivery) against an in-JVM SMTP server, admin-web's Server → Release and
# Server → Mail. Every "no request" / "nothing mailed" has a control on the same source or relay that does.
acceptanceCriteria:
  - id: the-instance-checks-by-default-and-names-no-version
    text: >-
      A stamped instance reads the published releases once a day by default, and its request carries nothing that
      names the running release; the comparison is local.
    coverage:
      backend:
        unit: [ReleaseFeedTest.theGitHubListSkipsDraftsAndKeepsThePublishedDay, ReleaseFeedTest.theGitHubManifestIsFollowedThroughItsRedirect, ReleaseFeedTest.aMirrorIsReadInTheProducersLayout, ReleaseFeedTest.aTagThatIsNoReleaseNeverReachesAPath]
        integration: [ReleaseCheckSliceTest.aNewInstanceChecksTheGitHubReleasesByDefault, ReleaseCheckSliceTest.theRequestNamesNoRelease, ReleaseCheckStampedSliceTest.theScheduledRunAsksTheSourceWithTheInstancesOwnRelease, ReleaseCheckSliceTest.unstampedRunMakesNoRequest, ReleaseCheckSliceTest.aSnapshotMakesNoRequest]
  - id: the-check-can-be-switched-off-and-pointed-elsewhere
    text: >-
      The Server Owner switches the check off, after which the instance makes no request, or points it at a mirror.
    coverage:
      backend:
        integration: [ReleaseCheckSliceTest.switchedOffMakesNoRequestAndOnAgainDoes, ReleaseCheckSliceTest.aSourceMustBeAnHttpUrl, ReleaseCheckSliceTest.aMemberIsNotTheServerOwnerAndIsRefused]
  - id: a-failed-check-blocks-nothing
    text: >-
      An unreachable or malformed source is logged and retried; no request, startup or other job waits on it, and
      the console shows when the last check succeeded.
    coverage:
      backend:
        unit: [ReleaseFeedTest.aStatusOtherThan200IsAFailedRead, ReleaseFeedTest.aSlowAnswerIsAFailedRead, ReleaseFeedTest.anAnswerOverItsCapIsAFailedReadAndOneAtItIsNot, ReleaseFeedTest.aListOfTheWrongShapeIsAFailedRead, ReleaseFeedTest.aManifestThatNamesAnotherReleaseIsAFailedRead]
        integration: [ReleaseCheckSliceTest.aServerErrorLeavesTheNoticesAndTheLastSuccess, ReleaseCheckSliceTest.aSlowSourceLeavesTheNoticesAndTheLastSuccess, ReleaseCheckSliceTest.anOversizedAnswerLeavesTheNoticesAndTheLastSuccess, ReleaseCheckSliceTest.aMalformedAnswerLeavesTheNoticesAndTheLastSuccess]
  - id: a-newer-release-is-noticed-in-the-console
    text: >-
      The admin console shows every release newer than the running one that the check found.
    coverage:
      backend:
        unit: [ReleaseNoticePolicyTest.everyNewerReleaseOfTheRunningMajorIsANoticeAndNoOlderOneIs, ReleaseNoticePolicyTest.noNewerReleaseIsNoNotice, ReleaseNoticePolicyTest.aNoticesKeyIsItsIdentityAcrossChecks]
        integration: [ReleaseCheckSliceTest.aNewerReleaseOfTheRunningMajorIsNoticed, ReleaseCheckSliceTest.aNoticeIsFoundOnceAcrossTwoChecks, ReleaseCheckStampedSliceTest.theConsoleShowsANoticeOnlyWhileItsReleaseIsNewerThanTheRunningOne]
  - id: majors-are-told-apart-and-an-unscheduled-one-is-urgent
    text: >-
      A planned new major is shown with the date the running major leaves the client window; an unscheduled one, as
      the release manifest marks it, is shown as urgent.
    coverage:
      backend:
        unit: [ReleaseNoticePolicyTest.aPlannedMajorCarriesTheDayTheRunningMajorLeavesTheWindow, ReleaseNoticePolicyTest.aTrainThatLeftLateStillEndsTheWindowOnTheFirstOfMay, ReleaseNoticePolicyTest.anUnscheduledMajorIsUrgentAndDoesNotMoveTheWindow, ReleaseNoticePolicyTest.aMajorIsOneNoticeOnItsFirstRelease, ReleaseNoticePolicyTest.theWindowRemindersFallDueNinetyAndThirtyDaysAheadOneAtATime]
        integration: [ReleaseCheckSliceTest.aPlannedMajorIsNoticedWithTheDayTheRunningMajorLeavesTheWindow, ReleaseCheckSliceTest.anUnscheduledMajorIsNoticedAsSuch, ReleaseCheckSliceTest.theWindowReminderFallsDueBeforeTheWindowEnds]
  - id: instance-mail-reaches-only-the-server-owner
    text: >-
      Instance mail settings are the Server Owner's, their password sealed under the config-secret key; they send
      only instance notices and only to the Server Owner's address, and never a tenant's mail.
    coverage:
      backend:
        integration: [InstanceMailSettingsSliceTest.theOwnerConfiguresSmtpAndThePasswordIsWriteOnlyAndSealed, InstanceMailSettingsSliceTest.omittingThePasswordKeepsTheStoredOne, InstanceMailSettingsSliceTest.theInstanceMailPasswordJoinsTheInstanceWideKeyState, InstanceMailSettingsSliceTest.aMemberIsNotTheServerOwnerAndIsRefused, InstanceNoticeMailSliceTest.aSaveMailsTheCodeToTheServerOwnerAndTheCodeConfirms, InstanceNoticeMailSliceTest.aTenantsSettingsNeverSendAnInstanceNotice, InstanceNoticeMailSliceTest.theInstanceSettingsNeverSendATenantsMail, InstanceNoticeMailSliceTest.aKeyThatCannotOpenThePasswordSendsNothingAndSaysWhy]
  - id: the-address-is-confirmed-before-any-notice
    text: >-
      Saving the instance mail settings sends a test mail with a one-time code; no notice is mailed until the code
      was entered in the admin console, and a changed address or changed settings ask again.
    coverage:
      backend:
        integration: [InstanceNoticeMailSliceTest.aSaveMailsTheCodeToTheServerOwnerAndTheCodeConfirms, InstanceNoticeMailSliceTest.aSaveWhoseTestMailCannotBeDeliveredSaysSoAndConfirmsNothing, InstanceNoticeMailSliceTest.nothingIsMailedWhileUnconfirmedAndTheNoticesFollowOnceConfirmed, InstanceNoticeMailSliceTest.aChangedAccountAddressUnconfirmsAndStopsTheMail, InstanceMailSettingsSliceTest.aCodeIsRefusedWhenNoneIsOutstanding]
  - id: each-notice-is-mailed-once-with-a-calendar-date
    text: >-
      Each notice is mailed once; a planned major and the window reminders carry their date written out and as an
      attached `.ics` event.
    coverage:
      backend:
        integration: [InstanceNoticeMailSliceTest.aNoticeIsMailedOnceAcrossTwoChecks, InstanceNoticeMailSliceTest.aDatedNoticeCarriesItsDateAsAnIcsThatParses, InstanceNoticeMailSliceTest.anUndatedNoticeCarriesNoCalendar, InstanceNoticeMailSliceTest.aFailedSendLeavesTheNoticeForTheNextCheck]
gaps:
  admin-web: >-
    Server → Release's notices and check (`ReleaseNoticesPanel.test.ts`: the urgent row apart, an unstamped build said
    as such, switching off, a refused source, whether a find is also mailed — said only while the check can find
    anything, and never at the notices' cost), Server → Mail (`InstanceMailPanel.test.ts`: the write-only password, the
    code entry and its refusal, the key state), the nav (`AdminConsoleView.test.ts`) and `veyq-admin release` /
    `release check on|off` (`cli.test.ts`) live in `admin-web` (ADR 0065); their suites exist and pass under
    `npm run check`, and wait until admin-web's CI job has executed (ADR 0040), as uc.admin.switch-capabilities' do.
  web: "No web surface: the Server Owner's client is admin-web (ADR 0065), where this use-case lives."
  stack: >-
    Lane L1's browser suite (`tests/e2e/tests/features/instance-mail.spec.ts`) drives
    `the-check-can-be-switched-off-and-pointed-elsewhere`, `the-address-is-confirmed-before-any-notice`,
    `instance-mail-reaches-only-the-server-owner`, `a-newer-release-is-noticed-in-the-console`,
    `majors-are-told-apart-and-an-unscheduled-one-is-urgent` and `each-notice-is-mailed-once-with-a-calendar-date` in
    Chromium against the release candidate's two images, installed through `veyqctl` (ADR 0090), each test tagged with
    its criterion. Against the overlay's Mailpit: the check pointed at a mirror and switched off, held after a reload;
    mail settings saved, the code read from the one mail to the Server Owner, a wrong code refused, the mailed one
    confirming. Against the overlay's stub release mirror (a test double like Pebble, inbox #464 option (a): the run
    stamps its instance with the release it installed and checks every 5 s, the mirror's files written by
    `release_assets.py`'s own `produce`): the next minor and the planned next major listed, the unscheduled major apart
    as urgent, each notice mailed once to the confirmed address — counted again after two more checks — and the planned
    major's mail carrying its window end as an `.ics` whose `DTSTART` is that day; then the check switched off. Not
    covered there: `the-instance-checks-by-default-and-names-no-version` (the request is the app's, which no browser
    sees) and `a-failed-check-blocks-nothing` beyond the GitHub source failing offline while every other scenario runs.
    Green only in local runs of `scripts/run_stack_e2e.py`: the lane's CI job (`ci.yml` → `stack`) awaits the first CI
    run (no remote), and ADR 0040 admits `stack` refs only once a run's log shows the suite executed. On that run each
    file becomes a ref on the criteria its tests are tagged with, and this gap goes.
