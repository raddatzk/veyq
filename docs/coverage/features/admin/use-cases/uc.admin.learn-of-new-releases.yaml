useCase: uc.admin.learn-of-new-releases
feature: admin
title: Learn of a new release without looking for one
status: planned
# Refined 2026-10-16 with ADR 0097 (cr-release-notices). Nothing is built.
acceptanceCriteria:
  - id: the-instance-checks-by-default-and-names-no-version
    text: >-
      A stamped instance reads the published releases once a day by default, and its request carries nothing that
      names the running release; the comparison is local.
  - id: the-check-can-be-switched-off-and-pointed-elsewhere
    text: >-
      The Server Owner switches the check off, after which the instance makes no request, or points it at a mirror.
  - id: a-failed-check-blocks-nothing
    text: >-
      An unreachable or malformed source is logged and retried; no request, startup or other job waits on it, and
      the console shows when the last check succeeded.
  - id: a-newer-release-is-noticed-in-the-console
    text: >-
      The admin console shows every release newer than the running one that the check found.
  - id: majors-are-told-apart-and-an-unscheduled-one-is-urgent
    text: >-
      A planned new major is shown with the date the running major leaves the client window; an unscheduled one, as
      the release manifest marks it, is shown as urgent.
  - id: instance-mail-reaches-only-the-server-owner
    text: >-
      Instance mail settings are the Server Owner's, their password sealed under the config-secret key; they send
      only instance notices and only to the Server Owner's address, and never a tenant's mail.
  - id: the-address-is-confirmed-before-any-notice
    text: >-
      Saving the instance mail settings sends a test mail with a one-time code; no notice is mailed until the code
      was entered in the admin console, and a changed address or changed settings ask again.
  - id: each-notice-is-mailed-once-with-a-calendar-date
    text: >-
      Each notice is mailed once; a planned major and the window reminders carry their date written out and as an
      attached `.ics` event.
gaps:
  backend: "Not built: no release check, no instance mail settings, no notices (cr-release-notices)."
  admin-web: "Not built: the Release panel shows no notices, and there is no Server → Mail panel (cr-release-notices)."
  web: "No web surface: the Server Owner's client is admin-web (ADR 0065), where this use-case lives."
