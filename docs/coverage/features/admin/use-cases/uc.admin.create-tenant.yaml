useCase: uc.admin.create-tenant
feature: admin
title: Create a tenant & invite its owner
# Slice A (cr-0009) — structural tenant creation + invite lifecycle + Server-Owner management.
# Slice B (cr-0010) — invite acceptance: cold TENANT-scope birth + first OWNER membership/grant → ACTIVE,
# via register-and-accept (new owner) or sign-in accept (existing owner).
#
# `status: planned` although both slices are BUILT, and only because of one criterion: `invite-link-handoff` is
# proven on `admin-web` alone, and `admin-web`'s job has never executed — so ADR 0040 admits none of its refs
# (see its note on which rows a run has admitted). Every other criterion keeps a backend ref. The admin-web
# suites are named under `gaps` so the flip is mechanical; `planned` goes with them. (The other way out is a
# backend assertion that create/resend/reassign return the raw secret: no backend test reads it today —
# `TenantAcceptSliceTest` seeds its own secret rather than taking one from a create response.)
status: planned
acceptanceCriteria:
  - id: create-pending-tenant
    # cr-email-invite-send-hardening: create/resend/reassign responses also carry the delivery result field. A
    # PENDING tenant has no mail settings, so the bootstrap invite is always FALLBACK_COPYLINK (the copy-link is
    # the channel) — the SENT/FAILED states and the rate-limiter apply only to the tenant-owner member paths
    # (uc.spaces.add-member / uc.spaces.manage-member-invites). Never persisted → operator-blind untouched.
    text: A Server Owner creates a PENDING tenant (201) with an owner invite; the response reports the delivery result, which for a bootstrap invite is always FALLBACK_COPYLINK (no SMTP for a PENDING tenant).
    coverage:
      backend: { integration: [TenantsSliceTest.createReturns201Pending] }
  - id: reject-duplicate-domain
    text: A domain already mapped to a tenant is rejected (409 domain_taken).
    coverage:
      backend: { integration: [TenantsSliceTest.duplicateDomainIs409] }
  - id: invite-link-handoff
    text: The owner invite is delivered out-of-band by the Server Owner copying the invite link (the bootstrap secret in the URL fragment) — create/resend/reassign responses return the raw secret to the Server-Owner-gated caller, so tenant onboarding works without any email/SMTP infrastructure (self-hostable by default). (cr-0080.)
    # No coverage on an admitted surface — the one criterion that makes this file `planned` (header).
  - id: list-tenants
    text: A Server Owner lists all tenants with each one's current invite status.
    coverage:
      backend: { integration: [TenantsSliceTest.listIncludesCreatedTenantWithActiveInvite] }
  - id: resend-supersedes-invite
    text: Resend soft-supersedes the current ACTIVE invite and mints a fresh ACTIVE one (one ACTIVE kept).
    coverage:
      backend: { integration: [TenantsSliceTest.resendSupersedesOldInviteAndKeepsOneActive] }
  - id: reassign-rebinds-email
    text: Reassign re-binds the owner email and supersedes the prior invite.
    coverage:
      backend: { integration: [TenantsSliceTest.reassignRebindsEmailAndSupersedes] }
  - id: revoke-pending-tenant
    text: A pending tenant is revoked (204) and disappears; a follow-up action returns 404.
    coverage:
      backend: { integration: [TenantsSliceTest.revokePendingTenantDeletesIt] }
  - id: server-owner-only
    text: A signed-in non-owner is refused (403 not_server_owner).
    coverage:
      backend: { integration: [TenantsSliceTest.nonOwnerIsForbidden] }
  - id: authenticated-only
    text: An unauthenticated caller is refused (401), and auth is checked before tenant lookup.
    coverage:
      backend: { integration: [TenantsSliceTest.unauthenticatedIs401] }
  - id: reject-invalid-domain
    text: A malformed domain is rejected at the boundary (400).
    coverage:
      backend: { integration: [TenantsSliceTest.invalidDomainIs400] }
  - id: unknown-tenant-404
    text: An action on an unknown tenant id returns 404 tenant_not_found.
    coverage:
      backend: { integration: [TenantsSliceTest.resendOnUnknownTenantIs404] }
  - id: invite-purge
    text: Overdue ACTIVE invites are expired and terminal-state invites are purged on a schedule.
    coverage:
      backend: { integration: [TenantsSliceTest.purgeExpiresActiveAndDeletesTerminalInvites] }
  # --- cr-database-driven-tenant-ingress (ADR 0063) ---
  # Only the operation lives here. Whether the domain then *resolves* is its own use-case,
  # uc.admin.tenant-reachability, which owns those criteria rather than this file restating them.
  - id: change-domain
    # The one tenant-admin write that is NOT PENDING-only: a domain is how a tenant is *reached*, not part of
    # its invite lifecycle. SUSPENDED is refused with its own code (tenant_not_pending_or_active) rather than
    # the boundary gate's 403 tenant_suspended — one wire code never carries two statuses.
    text: A Server Owner moves a tenant to a different domain from PENDING or ACTIVE (204); a domain another tenant holds is refused (409 domain_taken), a SUSPENDED tenant is refused (409 tenant_not_pending_or_active), and a malformed domain is rejected at the boundary (400).
    coverage:
      backend:
        integration: [TenantChangeDomainSliceTest.aPendingTenantMoves, TenantChangeDomainSliceTest.anActiveTenantMovesToo, TenantChangeDomainSliceTest.aDomainAlreadyMappedIsRefused, TenantChangeDomainSliceTest.aSuspendedTenantIsRefusedAndKeepsItsDomain, TenantChangeDomainSliceTest.aMalformedDomainIsRejectedAtTheBoundary]
  # --- Slice B (cr-0010): invite acceptance / activation ---
  - id: activate-by-register
    text: A new owner registers cold and accepts — a MEMBER account is born, the OWNER membership + grant stored, the tenant ACTIVE, the invite CONSUMED.
    coverage:
      backend: { integration: [TenantAcceptSliceTest.registerAndAcceptActivatesTenant] }
      # web: manual browser smoke only (cr-0010 phase 4, DB-verified); no automated harness yet → see gaps.web
  - id: activate-by-signin
    text: An existing owner signs in and accepts, activating the tenant with the cold-born grant.
    coverage:
      backend: { integration: [TenantAcceptSliceTest.existingUserAcceptActivatesTenant] }
  - id: preview-invite
    text: Previewing a valid bootstrap secret returns the tenant + whether the invited email has an account.
    coverage:
      backend: { integration: [TenantAcceptSliceTest.previewReturnsTenantAndAccountFlag] }
  - id: accept-reuse-detection
    text: Replaying a consumed/superseded/expired invite is rejected (410), mirroring session reuse-detection.
    coverage:
      backend: { integration: [TenantAcceptSliceTest.replayOfConsumedSecretIs410, TenantAcceptSliceTest.expiredInviteIs410] }
  - id: accept-only-invited-owner
    text: A signed-in caller whose email differs from the invite is refused (403 not_invited_owner).
    coverage:
      backend: { integration: [TenantAcceptSliceTest.emailMismatchIsForbidden] }
  - id: register-email-taken
    text: Register-and-accept when the invited email already has an account is rejected (409 email_taken).
    coverage:
      backend: { integration: [TenantAcceptSliceTest.registerWhenEmailTakenIs409] }
  - id: accept-unknown-invite
    text: An unknown bootstrap secret returns 404 invite_not_found (public preview/register reach the handler).
    coverage:
      backend: { integration: [TenantAcceptSliceTest.unknownSecretIs404] }
  - id: accept-requires-auth
    text: The existing-user accept endpoint requires a session (401 when anonymous).
    coverage:
      backend: { integration: [TenantAcceptSliceTest.unauthenticatedAcceptIs401] }
gaps:
  admin-web: >-
    Act 1 — the Server Owner's — lives here (ADR 0065), and its suites exist and pass locally, but `admin-web`'s
    job (`container.yml` → `test` → "Admin surface checks") has never executed, so ADR 0040 admits none of them:
    a declared run is enough only on a job a run has already executed. They are mocked-client unit tests on two
    callers — the console by hand, `veyq-admin` from a script (cr-admin-cli) — and each pins the call and its
    arguments, never the server's answer (201/204/409/400 stay the backend refs' sentences). On the first run
    whose log shows admin-web's suites executed, they flip to: `create-pending-tenant` ←
    `src/features/tenants/CreateTenantDialog.test.ts`, `src/cli/cli.test.ts` (the create carries name, domain,
    owner email); `invite-link-handoff` ← `CreateTenantDialog.test.ts`, `src/features/tenants/TenantDetailPanel.test.ts`,
    `src/shared/inviteLink.test.ts`, `cli.test.ts` (the CLI is the handoff with no browser at all: each of
    create/resend/reassign prints the response carrying the raw secret as JSON on stdout); `list-tenants` ←
    `src/views/AdminConsoleView.test.ts`, `cli.test.ts` (the console's root gate is the Server-Owner probe over
    the same backend 403; `web`'s `SettingsHubView.test.ts` no longer touches tenants); `change-domain` ←
    `TenantDetailPanel.test.ts`, `cli.test.ts`. That flip also drops this file's `status: planned`.
  web: >-
    Not "not applicable": web carries Act 2 — the invited owner accepts at `/tenant/accept` (`TenantJoinView`,
    through `src/features/tenant/tenantInvite.ts`) — while Act 1 is the Server Owner's and lives on `admin-web`
    (ADR 0065), the gap above. No web suite proves any sentence here. Every criterion is a server observable
    (activation with the cold-born grant, 404/401/403/409/410), and the view's suites mock the facade and stop
    before accept — the password-floor suite says so in as many words: `TenantJoinView.fragment.test.ts` pins
    the fragment strip and missing-vs-invalid, `TenantJoinView.passwordPolicy.test.ts` the floor's
    register-only reach, and the two cited elsewhere pin the kit import (`uc.account.unlock`) and the facade's
    request shaping (`uc.spaces.add-member`). The web e2e bootstrap does drive the existing-owner accept against
    a live backend (`src/test/e2eBootstrap.ts`), but as setup in a harness, not in a test file this model can
    cite. What would close this gap is a view test that carries a join through to the accept call.
