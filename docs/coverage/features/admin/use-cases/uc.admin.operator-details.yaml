useCase: uc.admin.operator-details
feature: admin
title: Choose the operating mode and publish who runs the instance
# Built by cr-instance-contact-and-provider-identification; the operating mode it carried was retired by
# cr-operating-mode-retires. The values and the code live on the admin channel, so most refs are the backend's slice; the web's are the identification on the login and share pages.
# admin-web's suites (the panels, the setup step, the facade, the CLI) and lane L1's scenario wait under `gaps` until
# their CI jobs have executed (ADR 0040), as every admin use-case's do.
acceptanceCriteria:
  - id: the-server-owner-is-told-what-they-may-owe
    text: >-
      First-run setup and the operator settings tell the Server Owner, as information and not as a choice, which values
      they may owe: that the household exemption ends once a link is shared publicly, that an operator who shares links
      publicly or runs veyq for a club or a company then owes at least a name, a postal address and the controller's
      contact, that it covers every tenant on the instance, and that this is their own assessment, not veyq's. Nothing
      is ticked and nothing is chosen.
    coverage:
      backend:
        integration: [SetupServerSliceTest.createsOwner]
    gaps:
      - surface: backend
        reason: >-
          The backend's half is that setup asks for nothing of the kind: no mode, no value, no switch. The information
          itself is admin-web's (`SetupView.test.ts`, `OperatorPanel.test.ts`), waiting under the use-case gap.
  - id: the-values-are-set-and-cleared
    text: >-
      The Server Owner sets and clears the contact with its languages, the statement address, the notification
      address, the identification and the supervisory authority; every value may stay empty, and an out-of-bounds one
      is refused with nothing stored.
    coverage:
      backend:
        integration: [OperatorDetailsSliceTest.theValuesAreSetAndClearedAndEveryOneMayStayEmpty, OperatorDetailsSliceTest.anOutOfBoundsValueIsRefusedAndNothingIsStored]
  - id: the-privacy-notice-values-are-set-and-never-published-unsaved
    text: >-
      The Server Owner sets and clears the privacy notice's recipients (name, what they do as a kind from a fixed list,
      country as an ISO 3166-1 alpha-2 code; in order, at most 20) and a data-protection officer; only an OTHER
      recipient carries a description, and it needs one. A blank name, an unknown kind, a description that does not fit
      its kind, a country that is no code or no code the backend's JDK knows, and a value over its bound are refused
      with nothing stored. The instance suggests a recipient of its kind for what it knows (an external
      store's host, the instance mail relay's host), which is never stored or published until the Server Owner saves it
      as a row.
    coverage:
      backend:
        integration: [PrivacyNoticeSliceTest.theRecipientsAndTheOfficerAreSetServedInOrderAndCleared, PrivacyNoticeSliceTest.theInstanceSuggestsTheRecipientsItKnowsOf]
        unit: [PrivacyNoticeRendererTest.onlyAnOtherRecipientTakesADescriptionAndItNeedsOne, RecipientCountriesTest.onlyACodeTheJdkKnowsIsAccepted, RecipientCountriesTest.theContractsListIsTheJdksList]
    gaps:
      - surface: backend
        reason: >-
          The suggested row's adoption, the kind list with Other's description, the country list sending its code
          (`countries.test.ts`), the officer field and `--recipients` are admin-web's
          (`OperatorPanel.test.ts`, `operator.test.ts`, `cli.test.ts`), waiting under the use-case gap; lane L1 sets them
          at first-run setup (the `stack` gap).
  - id: the-notification-address-is-confirmed-by-a-code
    text: >-
      A saved, unconfirmed notification address gets a one-time code through confirmed instance mail; typing it into
      admin-web confirms it; a wrong code spends an attempt; a changed address unconfirms without a further write; no
      code goes out while instance mail is not confirmed.
    coverage:
      backend:
        integration: [OperatorDetailsSliceTest.aSavedNotificationAddressGetsACodeAndAWrongCodeSpendsAnAttempt, OperatorDetailsSliceTest.theLastWrongEntrySpendsTheCode, OperatorDetailsSliceTest.aChangedAddressUnconfirmsWithoutAWriteToTheConfirmation, OperatorDetailsSliceTest.noCodeGoesOutWhileInstanceMailIsNotConfirmed]
    gaps:
      - surface: backend
        reason: >-
          Over a real SMTP server in the JVM and the confirm endpoint over HTTP. The code entry on the panel is
          admin-web's (`OperatorPanel.test.ts`), waiting under the use-case gap; that notices reach the address only
          once confirmed is held where the new-case mail is (uc.moderation.report,
          ReportMailSliceTest.theInstanceContactsConfirmedNotificationAddressIsMailedTooAndAnUnconfirmedOneIsNot).
  - id: the-public-values-are-served-pre-auth-and-never-the-notification-address
    text: >-
      The contact with its languages, the statement address, the identification and the supervisory authority are
      served without sign-in on any host; the notification address never leaves the admin channel.
    coverage:
      backend:
        integration: [OperatorDetailsSliceTest.thePublicReadNeverCarriesTheNotificationAddressOnAnyHost]
  - id: nothing-is-required-and-an-empty-value-shows-as-its-gap
    text: >-
      Nothing the Server Owner sets is required and nothing warns: no setup, save or publish is refused or warned about
      over an empty value. Every fixed text renders an empty value as "not stated by this operator", and a value set
      replaces its gap; admin-web's operator settings show each empty value as not stated, in its own words.
    coverage:
      backend:
        integration: [GuestWriteRecordCoreSliceTest.anInstanceWithNoModeServesEveryTextWholeAndRecordsAGuestWrite, OperatorDetailsSliceTest.theValuesAreSetAndClearedAndEveryOneMayStayEmpty]
        unit: [OperatorSectionRendererTest.anEmptyValueIsAVisibleGap, PrivacyNoticeRendererTest.anEmptyValueIsAVisibleGap, StatementTemplateConformanceTest.theOneFormCarriesEveryPassageAndTheMailNeverTheFacts]
    gaps:
      - surface: backend
        reason: >-
          The texts and the saves are the backend's. The panel's "not stated" beside each value is admin-web's
          (`OperatorPanel.test.ts`), waiting under the use-case gap.
  - id: the-identification-appears-on-the-login-and-share-pages
    text: >-
      Where set, the identification and the contact with its languages are shown on the login and the
      share pages and in the signed-in shell through the public read, beside a link to the public terms of the
      instance; a failed read shows no values and blocks nothing, the terms link stays.
    coverage:
      backend:
        integration: [OperatorDetailsSliceTest.thePublicReadNeverCarriesTheNotificationAddressOnAnyHost]
      web:
        unit: [src/core/operator/OperatorIdentification.test.ts]
    gaps:
      - surface: web
        reason: >-
          The component is mounted alone, in guest mode; that the login and share pages and the shell place it is their
          templates (`LoginView.vue`'s card footer, `ShareView.vue`'s footer, `AppShell.vue`'s workspace footer),
          walked by lane L1 (the `stack` gap) and not by a web suite.
  - id: operator-operations-are-server-owner-only-on-the-admin-channel
    text: >-
      Every operation that reads the notification address or writes a value is a Server-Owner operation
      answered on the admin channel only.
    coverage:
      backend:
        integration: [OperatorDetailsSliceTest.theOperationsAreTheServerOwnersOnTheAdminChannelOnly, AdminChannelGateSliceTest.theEnumerationSeesEveryRoleGatedMarkedOperation]
gaps:
  admin-web: >-
    Built and passing locally: `src/features/instance/OperatorPanel.test.ts`, `operator.test.ts`,
    `src/views/SetupView.test.ts`, `src/features/setup/setupServer.test.ts` and `src/cli/cli.test.ts` (the information
    at setup and beside the values, each empty value shown as not stated, the code entry and `veyq-admin operator`).
    admin-web's job has never executed, so ADR 0040 admits it nowhere; on its first run they become refs on the
    criteria named in each criterion's gap.
  stack: >-
    Lane L1's first-run scenario (`tests/e2e/tests/setup/first-run.setup.ts`) sets the instance up with no mode,
    publishes the contact and the identification in the console, and opens the tenant's sign-in page to find the
    identification behind its footer link, in Chromium against the release candidate's two images; each test is tagged
    with its criterion. Green only in local runs of `scripts/run_stack_e2e.py`; the lane's CI job awaits its first run.
