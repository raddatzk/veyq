# The `%test` keys of :apps:memories' own tests — exactly the ones they need. The root's and :core's tests read their
# own copies (`src/backend/src/test/resources/`, `src/backend/core/src/test/resources/`); the reasons for the keys all of them
# hold are written in the root's file and not repeated here. Test config ships in no jar (`src/backend/CLAUDE.md` § Prove your work),
# so each module keeps its keys beside its tests.

# In-memory H2 in MariaDB mode; the two env overrides are the race runner's (scripts/run_backend_races_on_mariadb.py),
# which runs this module's race classes as `:apps:memories:test`.
quarkus.datasource.db-kind=${VEYQ_TEST_DB_KIND:h2}
quarkus.datasource.jdbc.url=${VEYQ_TEST_DB_URL:jdbc:h2:mem:veyq;MODE=MariaDB;DB_CLOSE_DELAY=-1;TIME ZONE=UTC}

# Free ports: the public listener and the admin listener. Module test JVMs may run side by side, so no fixed port.
quarkus.http.test-port=0
veyq.admin-channel.port=0

# The share tests fire wrong share tokens from 127.0.0.1; the production per-share bound (10/window) would trip across
# the suite. SharePasswordAttemptBoundTest overrides this down via its own @TestProfile to assert the 429 path.
veyq.share.password.rate.max-per-window=1000000

# The config-secret KEK file under build/ (gitignored), never the production default in the working directory.
veyq.security.config-secret-file=build/test-config-secret.key

# No @Scheduled job fires on its own: a test that needs a job calls its run() (the root's file says why; inbox #182).
quarkus.scheduler.start-mode=halted

# The erasure ledger's file (ADR 0056 decision 8): one per boot under build/, and no boot re-applies it — the H2 database
# outlives a boot, so a boot would re-apply every earlier test's lines to the fixtures other tests left behind.
veyq.erasure-ledger.file=build/erasure-ledger/${quarkus.uuid}.log
veyq.erasure-ledger.apply-at-start=false
