# Shared across all profiles. Flyway owns the schema; Hibernate never generates or validates DDL.
# The datasource is configured per profile — see application-{dev,test,prod}.properties.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Every connection runs READ COMMITTED — the isolation the slice tests' H2 runs, so a race a slice test proves is
# the race production runs (ADR 0078). Set here, per connection, not on the server: an operator's own MariaDB gets
# it too. MariaDB's default REPEATABLE READ fixed a transaction's snapshot at its first plain read, so a check made
# after a later row lock read the state from before the lock: a re-activation by a member being removed passed its
# membership check, and two refreshes of one token revoked their own session family. Every profile, test included.
# `DatasourceIsolationTest` reds if this line goes.
quarkus.datasource.jdbc.transaction-isolation-level=read-committed

# A response property with no value is OMITTED, never sent as `"x": null` (owner decision Q7 of cr-api-fuzzing): the
# contracts describe such a property as optional, so `null` and absent are one statement on the wire, and a
# response schema check (the API fuzzing) reads them alike. The one exception is spelled at its field
# (`InstanceRelease.release`, `@JsonInclude(ALWAYS)`). Serialization only — a request's `null` still binds as before.
quarkus.jackson.serialization-inclusion=non-null

# The application compresses its answers, the proxies do not (ADR 0103): one place for both deployment targets and the
# web bundle this backend serves. By media type — Quarkus' defaults (JSON, HTML, CSS, JavaScript, text) plus SVG and the
# web manifest; never a blob, which travels between the browser and the store and is ciphertext anyway. Gzip and
# deflate only: brotli needs a native library in the image. An answer that carries a token is never compressed: its
# generated endpoint is `@Uncompressed`, written by the build from the contracts (`buildSrc` TokenAnswersUncompressed) and
# held by `TokenAnswersAreNotCompressedTest` (BREACH, ADR 0103 decision 3). Every key here is build-time: a change is a new image.
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json,application/graphql+json,application/xhtml+xml,image/svg+xml,application/manifest+json
quarkus.http.compressors=gzip,deflate
# Level 1. Native zlib (the deflate Netty runs) on a 500-item page of the media list, 1.18 MB of mostly base64 ciphertext:
# level 1 → 0.549 of the body in 14.8 ms of CPU, level 4 → 0.536 in 19.3 ms, level 6 (Netty's default) → 0.529 in 21.5 ms
# (a developer Mac; indicative). On the production recipe at 10,000 photos the list's 23.05 MB went out as 13.84 MB at
# level 1, where level 6 makes 13.26 MB (the volume harness, 2026-10-19). Base64 of ciphertext leaves deflate little past
# its first pass: the higher levels buy 4 % of the bytes for 30-45 % more CPU, the scarcer of the two on a two-core host.
quarkus.http.compression-level=1

# Logs name no person (ADR 0092 § 4). Hibernate writes the database driver's message for every failed statement at
# WARN on this category, and a driver's message carries the values the statement was bound with: on a colliding
# sign-up, the email address (`ux_veyq_user_email`). At ERROR the line is not written; the SQLState and vendor code
# survive in the unexpected-error line (`UnexpectedError`). `UnexpectedErrorLogSliceTest` reds if this line goes.
quarkus.log.category."org.hibernate.orm.jdbc.error".level=ERROR

# Central auth (cr-0012). Lazy authentication: the bearer mechanism runs only when a security annotation demands
# an identity — never on @PermitAll endpoints, so a present-but-bad token can't 401 a public call (e.g. logout
# stays idempotent). Default-deny (deny-unannotated-endpoints) is flipped on in phase 3, once every endpoint
# carries an explicit @Authenticated / @RolesAllowed / @PermitAll.
quarkus.http.auth.proactive=false

# Default-deny (cr-0012 phase 3): every JAX-RS endpoint must carry an explicit security annotation; an
# unannotated one is denied. The annotation is now the single mandatory place the token-or-not decision is
# taken, and a future endpoint added without one fails closed instead of silently shipping open.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# The admin channel (ADR 0065, uc.admin.admin-channel): a second, internal listener, and the only door the
# Server-Owner operations answer on. Only the admin container is pointed at it; nothing routes the public origin
# to it, and the app image's Dockerfile (infra/docker/Dockerfile) does not EXPOSE it. A bind failure fails startup — a backend with no admin door
# is an instance nobody can set up, and it would look healthy to every probe.
veyq.admin-channel.port=8090

# Capability discovery & version gating (ADR 0032). The advertised `major` — the ONLY hard compatibility gate a
# client enforces before login — is not a setting: it is the platform's one major, generated from the repository's
# VERSION into PlatformMajor (ADR 0085 decision 1). `build` is a hand-kept diagnostic that gates nothing.
veyq.version.build=1

# The RELEASE identity of the running image (ADR 0057). It shares the major above and adds the minor, which is
# what maps an instance to its CVEs, so it is the operator's rollback target and Server-Owner-only, never on the
# pre-auth surface (ADR 0057 §4). The publish stamps the version it derived from the tree (`<major>.<minor>`, or
# `<major>.<minor>-SNAPSHOT` for a snapshot) into the image as VEYQ_VERSION (Dockerfile, both runtime targets); a build the pipeline never stamped leaves it unset, which resolves to
# empty here and is reported as the absence it is rather than as a placeholder.
veyq.release.version=${VEYQ_VERSION:}

# The release check (ADR 0097): once a day a stamped instance reads the published releases and compares them with
# the version above locally; the request names no release. Whether it runs and where it reads are Server-Owner
# settings in admin-web (on by default, the GitHub Releases), not configuration. An unstamped build or a snapshot is
# on no release line and makes no request at all, so quarkusDev and every test run stay quiet without a switch.
# `every` is the rhythm (and the scheduler also fires it once shortly after a start); `timeout` bounds each request.
veyq.release-check.every=24h
veyq.release-check.timeout=PT10S

# Tenant invites (cr-0009): how long an owner invite is valid, how long terminal-state invites are kept
# before the scheduled purge deletes them, and how often the purge runs. ISO-8601 durations.
veyq.tenant.invite.ttl=P7D
veyq.tenant.invite.retention=P30D
veyq.tenant.invite.purge.every=1h

# Tenant ingress projection (ADR 0063). BOTH are unset by default, and that absence is the whole `%dev`/`%test`
# behaviour: TenantIngressProjector no-ops, because an instance with no reverse proxy in front of it has nothing
# to project into. A docker-compose deployment sets them from infra/docker/docker-compose.prod.yml — the path points
# into the volume Traefik file-watches, and that file is ALL of compose's routing: the bootstrap domain's
# (${VEYQ_DOMAIN}) router pair, every tenant's, the admin router when admin-domain is set, and the services they
# point at. The upstreams default to the production compose file's service names.
# veyq.tenant.ingress.dynamic-config-path=/etc/traefik/dynamic/tenants.yml
# veyq.tenant.ingress.bootstrap-domain=veyq.example.org
# veyq.tenant.ingress.admin-domain=admin.veyq.example.org
# The app upstream is the PUBLIC listener, never veyq.admin-channel.port (ADR 0065).
# veyq.tenant.ingress.upstream.app=http://app:8080
# veyq.tenant.ingress.upstream.blobs=http://garage:3900
# veyq.tenant.ingress.upstream.admin=http://admin:8080
# ADR 0064's second sink. `traefik-file` (the default) is the compose deployment above; `kubernetes` manages
# Gateway API objects (an HTTPRoute per domain, under per-domain a ListenerSet too) through the API instead, and
# needs no connection settings — the in-cluster ServiceAccount supplies the API server AND the namespace, which is
# what keeps one image deployable into every install. gateway-name is the chart's Gateway (default `veyq`), which
# the backend attaches to and never writes.
# veyq.tenant.ingress.sink=kubernetes
# veyq.tenant.ingress.kubernetes.gateway-name=veyq
# veyq.tenant.ingress.kubernetes.namespace=   # an override for a run OUTSIDE the cluster; never required in one
# TLS on that target is a PASSTHROUGH (ADR 0064): the sink stamps a reference the chart tells it to — which
# listener a route attaches to, under per-domain a certificateRefs name plus the operator's annotations,
# verbatim — and never creates an Issuer, Certificate or Secret. `none` (the default) attaches every route to the
# Gateway's plain-HTTP listener; `per-domain` writes a ListenerSet per domain whose HTTPS listener names the
# object's own name as the Secret (per-tenant custom domains keep working); `shared` attaches every route to the
# Gateway's one HTTPS listener and REQUIRES secret-name — without it the sink is disabled loudly, not booted half.
# veyq.tenant.ingress.kubernetes.tls.mode=per-domain
# veyq.tenant.ingress.kubernetes.tls.secret-name=
# veyq.tenant.ingress.kubernetes.annotations."cert-manager.io/issuer"=veyq-acme

# Kubernetes Dev Services would start a container-based API server for every `%dev`/`%test` run, which is a
# Docker dependency this suite has never had and does not want: the only Kubernetes tests here bring their own
# in-JVM mock control plane (`@WithKubernetesTestServer`), and every other test never touches the client.
quarkus.kubernetes-client.devservices.enabled=false

# Session-token purge (cr-0011): how often the scheduled cleanup deletes expired access/refresh tokens,
# stale login challenges, and token-less session families. Rows are removed strictly once past expiry.
veyq.session.purge.every=1h

# Group soft-delete (cr-0090): how long a soft-deleted GROUP stays in its grace period (readable + restorable)
# before the scheduled purge hard-erases it (rows + blob objects), and how often that purge runs. ISO-8601.
veyq.scope.delete.retention=P30D
veyq.scope.delete.purge.every=1h

# Account erasure and tenant deletion (ADR 0101): both wait out the scope trash's retention above, and their purges look
# for a due one this often.
veyq.account.erasure.purge.every=1h

# Securing the account (ADR 0111 decision 6): a stage of self-grants lives this long after it opened
# (server-observed); the publish must name it before. Its purge deletes the expired ones this often.
veyq.account.rotation.stage.ttl=PT1H
veyq.account.rotation.stage.purge.every=5m
veyq.tenant.deletion.purge.every=1h

# Media trash (uc.memory.delete-media, cr-0110) — veyq.media.trash.retention (P30D) and
# veyq.media.trash.purge.every (1h) — is the Memories application's and deliberately NOT here (inbox #342): every
# veyq.* key must map to a root, and core booted alone (:core's tests) has no veyq.media mapping, so a key here fails
# its startup (SRCFG00050 "does not map to any root"). The defaults are the @WithDefaults of Memories' own mapping,
# MemoriesMediaConfig, which SmallRye registers as config defaults — the @Scheduled expression reads them too. An
# operator still sets either key the usual way (env VEYQ_MEDIA_TRASH_RETENTION, -D, a mounted file).

# Node trash (uc.memory.delete-node, ADR 0061): how long a soft-deleted SUBTREE (a node of any kind and
# everything under it) stays restorable in the space's trash before NodeSubtreePurge hard-erases it — the
# applications' rows under it, its blob rows and the store objects behind them, then the node rows — and how often that
# purge runs. ISO-8601 duration. `purgeAfter` in the trash listing is derived from this, never stored.
veyq.node.trash.retention=P30D
veyq.node.trash.purge.every=1h

# An application left switched off (uc.platform.erase-switched-off-application, ADR 0079 decision 8): how long it stays
# off in a tenant, at either level, before every node of its kinds made before that day is erased there through the
# trash purge's erase, and how often ApplicationErasurePurge mails the notices and reminders and erases what is due.
# ISO-8601 duration. The day is the moment it went off plus the retention; members are told the day, never the number.
veyq.application.off.retention=P30D
veyq.application.erasure.purge.every=1h

# Abandoned upload sessions (uc.memory.upload E2, en.memory.media E3, ADR 0013): how long an OPEN upload session
# is kept before the scheduled sweep deletes its row AND the chunk objects the client already staged, and how
# often that sweep runs. ISO-8601 duration. Much shorter than the P30D windows above, and the bound is measured
# rather than chosen: the sweep keys on a session's LAST ISSUED WINDOW, and every presigned PUT of a window is
# signed under veyq.blob-store.presign-ttl-seconds (600), so a session with no new window past that TTL cannot
# receive another byte. The only legitimate late arrival is a PUT that STARTED inside the TTL and is still
# streaming (S3 honours a signature that was valid at request start) — one 256 KiB chunk, so PT1H is ~6x a worst
# case of ten minutes and change. A longer window stores a month of garbage to protect ten minutes.
# The same bound is the store-reclaim not-before (ADR 0062 Decision 1): a recorded key is not deleted before it.
# Core's keys (upload sessions are core's, ADR 0079); named veyq.media.upload.* until inbox #342.
veyq.blob.upload.retention=PT1H
veyq.blob.upload.purge.every=1h

# Background tasks (ADR 0021 / cr-0076): the lease TTL a claim grants (a long worker heartbeats to extend it),
# the max attempts before a job is dead-lettered, and how often the grant-delivery origination backstop runs.
# The primary origination path is reconcile-on-claim; this backstop only covers scopes no key-holder pulled.
# ISO-8601 durations. The lease is short so that a worker which stops — a tab closed, reloaded or navigated mid-job —
# frees its job for the scope's other key-holders within it; a worker renews it while it works, the web's every 30 s
# (`LEASE_RENEW_MS` in src/web/src/features/tasks/scopeRotationWorker.ts), so a lease must outlast a renewal a hidden
# tab's throttled timers delay to a minute. At PT5M a re-key job sat leased five minutes after its tab went away (N1b).
# A Server Owner who sets it below about PT60S defeats the renewal: a throttled tab then loses a job it still works on.
# A stopped worker's job frees only by expiry — no release endpoint on `pagehide`, and no holder takes over its own
# valid lease (owner 2026-10-24, ADR 0021 §6).
veyq.tasks.lease.ttl=PT2M
veyq.tasks.max-attempts=5
veyq.tasks.grant-delivery.reconcile.every=1h

# Refresh-token cookie (web "remember me" transport, ADR 0004 / cr-0052): httpOnly+SameSite=Strict always; the
# `Secure` attribute is on in prod but off in local dev/test, where the app runs over plain http on 127.0.0.1
# and a Secure cookie would never be sent (breaking local "remember me"). Set true behind TLS in production.
veyq.session.cookie.secure=true

# Per-IP rate limit (IpRateLimitFilter): max requests per fixed window per client IP, shared by every endpoint
# declaring `@RateLimit(key = IP)` (ADR 0051) — today the login challenge/verify + token refresh + the
# unauthenticated account-creation endpoints. One window per IP across all of them, on purpose: it bounds an
# attacker's total public-surface spend instead of handing them a fresh budget per route. In-memory,
# per-instance, best-effort defense-in-depth — a gateway/distributed bucket is the production answer. The client IP
# is veyq's own resolver's (core/http/ClientAddress.kt, ADR 0094): the rightmost X-Forwarded-For entry that
# `veyq.http.trusted-proxies` does not list; that one setting names the hops in front of the gateway and is unset by
# default. The limiter keys on the IP alone. The client's PORT is the resolver's too, for the guest-write record: the
# stop entry's own, or the one source `veyq.http.client-port.source` names (none | proxy-protocol | header, default
# none; proxy-protocol needs quarkus.http.proxy.use-proxy-protocol=true, and any other value needs it off, or the app
# does not start; ADR 0094 decision 7). The `auth.` prefix is historical (it began as the auth-only limiter) and is kept so an existing
# self-hosted config file does not break.
veyq.ratelimit.auth.max-requests=60
veyq.ratelimit.auth.window-seconds=60

# Per-principal rate limit (UserRateLimitFilter) for `@RateLimit(key = USER)`: max requests per fixed window per
# authenticated userId, counted after authorization. Deliberately generous — an authenticated caller is
# attributable and revocable, so this bounds runaway automation rather than abuse.
veyq.ratelimit.user.max-requests=600
veyq.ratelimit.user.window-seconds=60

# Member-invite mail limiter (cr-email-invite-send-hardening). The real anti-bombing guard, keyed
# per-(tenant,recipient) AND per-tenant, enforced in the handler before the mint (not the per-IP filter, which
# cannot key on a recipient). In-memory, per-instance, best-effort — like the auth limiter. These numbers are
# DELIBERATELY SET, NOT EMPIRICALLY CALIBRATED — revidierbar once real invite volume is observed.
veyq.ratelimit.invite.per-recipient-max-requests=3
veyq.ratelimit.invite.per-tenant-max-requests=20
veyq.ratelimit.invite.window-seconds=3600
# The member's storage-fit preflight (ADR 0082): yes/no only, bounded against bisection. Deliberately set, not calibrated.
veyq.ratelimit.storage-fit.per-member-max-requests=10
veyq.ratelimit.storage-fit.per-tenant-max-requests=60
veyq.ratelimit.storage-fit.window-seconds=60

# Password-recovery limiter (cr-account-recovery, ADR 0054). Keyed per-ADDRESS and per-INSTANCE — deliberately
# NOT per-tenant like the invite limiter above: an account is tenant-global, so a tenant key would neither bound
# a single address nor the instance as a whole. The per-address bucket is the anti-bombing guard (a stranger
# cannot mail-flood someone by replaying their address); the instance bucket bounds a scraper walking a list.
# Both are best-effort and in-memory, like every other limiter here. DELIBERATELY SET, NOT CALIBRATED.
veyq.ratelimit.recovery.per-address-max-requests=3
veyq.ratelimit.recovery.per-instance-max-requests=60
veyq.ratelimit.recovery.window-seconds=3600

# Account recovery (cr-account-recovery, ADR 0054). The token TTL is much shorter than an invite's P7D: an
# invite waits for a person to get around to joining, a recovery token is redeemed within minutes by someone
# sitting at their mailbox. Retention keeps spent rows briefly so a replay is recognisable as spent rather than
# unknown, then the purge deletes them. ISO-8601 durations.
veyq.recovery.token.ttl=PT1H
veyq.recovery.token.retention=P7D
veyq.recovery.purge.every=1h

# Address confirmation (cr-email-address-confirmation, ADR 0074). The token copies the recovery token's lifecycle
# with a day-long TTL: long enough to reach a mailbox read once a day, short because nothing waits on it. The
# limiter is per ACCOUNT only — the caller is authenticated and mails only their own address, and the population is
# bounded by invitations, so no per-tenant or per-instance cap is needed. DELIBERATELY SET, NOT CALIBRATED.
veyq.email-confirmation.token.ttl=PT24H
veyq.email-confirmation.token.retention=P7D
veyq.email-confirmation.purge.every=1h
veyq.ratelimit.email-confirmation.per-account-max-requests=3
veyq.ratelimit.email-confirmation.window-seconds=3600

# Device linking (ADR 0059). The channel TTL is the shortest lifetime in this file, and deliberately: both
# devices are in the person's hands for the whole ceremony, so ten minutes bounds an abandoned pairing rather
# than a slow user — and an abandoned one holds a session family that is revoked when the row expires, so a
# generous window would keep a live refresh token nobody collected. Retention keeps spent rows a day so a
# replayed handle reads as spent rather than unknown (E1). The sweep runs often for the same reason the TTL is
# short: it is what revokes those families. DELIBERATELY SET, NOT CALIBRATED.
veyq.pairing.channel.ttl=PT10M
veyq.pairing.channel.retention=P1D
veyq.pairing.purge.every=5m

# Moderation (ADR 0099, ADR 0093 § 11): how often the scheduled cleanup deletes key-proof challenges past their five
# minutes and moderation-log events past their retention date. Rows are removed strictly once past expiry.
veyq.moderation.purge.every=1h
# Reports (ADR 0093 § 5, uc.moderation.report). A member may have at most open-cap reports open at once (owner decision
# Q8, a cost bound, not a judgement); a guest has no account to count, so a link's reports are bounded per window
# (per-share-max-requests) beside the per-address limit every unauthenticated route shares. A receipt (owner decision
# Q6) goes to one address at most receipts-per-address times per window, so the report route is no mail relay.
# In-memory and per-instance like every limiter here. DELIBERATELY SET, NOT CALIBRATED.
veyq.moderation.report.open-cap=100
veyq.moderation.report.per-share-max-requests=20
veyq.moderation.report.receipts-per-address=3
veyq.moderation.report.window-seconds=3600
# The guest-write record (ADR 0093 § 10): how often the purge deletes rows past the retention (an instance setting, 1 to
# 30 days, ADR 0092 § 2). The record has no switch of its own. It also runs at startup, so a restored backup's stale
# rows go at boot.
veyq.moderation.guest-write-record.purge.every=1h

# Blob store (every blob's byte path, ADR 0013 / cr-0105). WHICH store — its type, endpoints, bucket, region and
# credentials — is a Server-Owner setting held in the database and set in the admin console (ADR 0089), not
# configuration: nothing under `veyq.blob-store.*` names a connection any more. An instance with no store set STARTS,
# answers /api/setup and refuses uploads with a reason; %test alone uses the in-memory stub.
#
# The ONE store value the environment still carries is the BUNDLED-STORE HINT (`veyq.bundled-store.*`): a recipe
# that brings a Garage says where it is and passes its admin token, and the console then offers "Use the bundled
# store". Choosing it stores a reference to the hint, never a copy of it; the S3 key pair is derived from the token.
#   veyq.bundled-store.endpoint=http://garage:3900        # the S3 endpoint as the backend reaches it
#   veyq.bundled-store.admin-endpoint=http://garage:3903  # a DIFFERENT port from the S3 endpoint
#   veyq.bundled-store.admin-token                        # operator env, never persisted
#   veyq.bundled-store.public-endpoint=https://veyq.…     # the origin browsers fetch it from, when it is not `endpoint`
# WHICH ORIGIN a presigned URL is signed for is a named mode (ADR 0067 Decision 5), never inferred. The default
# is what every deployment did before the mode existed, so the compose recipe sets nothing:
#   veyq.bundled-store.signing-mode=tenant-domain      # the DEFAULT — public-endpoint's HOST is swapped for the
#                                #   resolved tenant's own domain, so the store is same-origin for that tenant
#                                #   and no CORS policy has to exist (ADR 0063; the compose path route).
#   veyq.bundled-store.signing-mode=store-origin       # public-endpoint VERBATIM, for a store on an address of its
#                                #   own that the backend does not reach there (ADR 0064's Kubernetes store
#                                #   host). Every tenant then signs against one host — and that host's bucket
#                                #   NEEDS A CORS POLICY, which signing cannot see the absence of (ADR 0013 §4).
# A store of the operator's own signs its public endpoint verbatim (store-origin), or its endpoint when it has none
# (internal-endpoint). Garage — the hint's or a setting's — is provisioned in the BACKGROUND and can never fail the
# boot (ADR 0067 Decision 3); its outcome is the Server-Owner read GET /api/instance/store-provisioning.
# Per-blob declared caps (declare-then-verify) bound abuse before any byte is verified.
# Store-object reclaim (ADR 0062): every path that deletes a row carrying a storage_key writes the key to
# veyq_store_reclaim in the same transaction, and this sweep is the ONLY thing that deletes store objects. The
# interval is the latency the design accepts — bytes go up to veyq.blob.upload.retention plus one tick after the
# rows, because a recorded key waits until no PUT signed for it can still land. A row refused
# `max-attempts` times (backoff doubling from `backoff`) is stamped abandoned and kept, so a permanent leak is
# countable: SELECT count(*) FROM veyq_store_reclaim WHERE abandoned_at IS NOT NULL.
veyq.store-reclaim.sweep.every=1h
# The erasure ledger (ADR 0056 decision 8): how often the outbox's unsent rows are appended to `erasures.log` beside the
# config-secret key. An erasure whose line is not yet in the file when a crash also loses the file is not re-applied by a
# restore — the limit ADR 0056 states; this interval is that window.
veyq.erasure-ledger.sweep.every=1m
veyq.store-reclaim.max-attempts=5
veyq.store-reclaim.backoff=PT15M
veyq.store-reclaim.batch-size=500
# The bucket reconcile (ADR 0062 § Consequences): a pass lists the whole bucket, pages-per-tick pages a tick, and counts
# the objects no row claims. A key that stayed one in every pass for `grace` (from when it was first seen, on the
# store's clock) goes onto the reclaim list above — only while the Server Owner has confirmed the bucket is this
# instance's alone and has not paused it. Two listed pages further apart than `max-gap` restart every first-seen clock
# (it must exceed period + every; BlobStoreStartupCheck refuses otherwise).
veyq.store-reconcile.every=PT1M
veyq.store-reconcile.period=PT6H
veyq.store-reconcile.pages-per-tick=10
veyq.store-reconcile.page-size=1000
veyq.store-reconcile.grace=P30D
veyq.store-reconcile.max-gap=P1D

veyq.blob-store.presign-ttl-seconds=600
# The bundled store's bucket and region are fixed once an instance is installed: an install that must move pins its
# old name instead (ADR 0067 § Consequences).
veyq.bundled-store.bucket=blobs
veyq.bundled-store.region=us-east-1
veyq.blob.max-bytes=21474836480
veyq.blob.presign-window=64
