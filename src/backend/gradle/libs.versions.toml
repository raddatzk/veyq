# Every version the backend's build logic chooses, once: read by the build (as `libs`) and by `buildSrc`, whose
# convention plugins put the Kotlin, all-open and Quarkus plugins on every build script's classpath. A Quarkus bump
# moves the plugin and the BOM together; any bump here regenerates gradle/verification-metadata.xml (src/backend/CLAUDE.md).
[versions]
kotlin = "2.4.10"
quarkus = "3.40.1.1"
# Above the BOM's 1.62.0 on purpose, applied by the root build's substitution (build.gradle.kts says why and when it goes).
opentelemetry = "1.67.0"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
quarkus-gradle-plugin = { module = "io.quarkus:gradle-application-plugin", version.ref = "quarkus" }
# The one generator version the three surfaces run (src/web/ and src/admin-web/ name it in openapitools.json):
# scripts/validate_build_input_pins.py holds them to one value and to scripts/openapi_generator_jar.sha256, and reads
# it in this `group:name:version` spelling only (another spelling is red there, never silently unread).
openapi-generator = "org.openapitools:openapi-generator:7.23.0"
