# Dev (`quarkusDev`): persistent local MariaDB (infra/docker/docker-compose.yml) — prod parity + data survives
# restarts (no re-doing setup each run). Start it first: `docker compose -f infra/docker/docker-compose.yml up -d`.
# A jdbc.url is set, so Quarkus connects to that container instead of starting its own Dev Services database.
quarkus.datasource.db-kind=mariadb
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/veyq
quarkus.datasource.username=veyq
quarkus.datasource.password=change-me

# Realign the local DB's Flyway checksums on start (dev only): editing an already-applied migration — even just
# its comment — changes its checksum and otherwise fails validation. A local convenience; migrations stay
# append-only in the repo, and prod never repairs.
quarkus.flyway.repair-at-start=true

# Object store (ADR 0089): the store is a Server-Owner setting in the database, not configuration. What %dev carries
# is the BUNDLED-STORE HINT for the compose Garage, so with no store saved the backend sets the bundled store itself
# after its boot provisioning and checks it (ADR 0089 decision 3); its S3 key pair is derived from the admin token.
# The token is the DOCUMENTED THROWAWAY dev one (infra/README.md) — not a secret; prod supplies its own via env.
# A store of your own saved in admin-web first is never replaced. Start Garage first:
# `docker compose -f infra/docker/docker-compose.yml --profile s3 up -d`.
#
# That `up` now leaves the store RUNNING BUT NOT USABLE — there is no init sidecar any more (ADR 0067) — and the
# first backend start brings it up: layout, bucket, key, grant, CORS. That is the point rather than a cost: dev
# runs the production shape, so the FRESH provisioning path is exercised on every clean cycle instead of only in
# a unit test. `docker compose … down -v` and start the backend to run it again from nothing.
veyq.bundled-store.endpoint=http://localhost:19000
# The admin plane is a different port from the S3 one; docker-compose.yml publishes it as 19003:3903, local
# only. The token is the documented dev throwaway the `garage` service is started with.
veyq.bundled-store.admin-endpoint=http://localhost:19003
veyq.bundled-store.admin-token=veyq-dev-admin-token
# Presigned URLs are signed for the WEB ORIGIN so the Vite dev server's same-origin `/blobs/` proxy forwards the
# PUT/GET without CORS (cr-0064). The default is the origin the dev instance is browsed at — web's Vite default port
# 8081 (src/web/vite.config.ts) on the `veyq.localhost` tenant `bootstrap:user` creates; change one and change the
# other. Override via VEYQ_BUNDLED_STORE_PUBLIC_ENDPOINT (env) when you browse another origin; the root launcher
# sets it from `veyq.webPort` (launcher/backend/build.gradle.kts).
veyq.bundled-store.public-endpoint=http://veyq.localhost:8081

veyq.session.cookie.secure=false

# Quarkus colours the console with 256-colour ANSI codes; its light greys and white (251, 250, 253, 231) vanish on a
# light IDE theme (IntelliJ shows them only when selected). The dev log is read in the IDE, so it stays plain. The key
# is `quarkus.console.color`: Quarkus 3 dropped `quarkus.log.console.color`, ignoring it with only a startup WARN.
quarkus.console.color=false

# `quarkus.kubernetes-client.devservices.enabled=false` (core's application.properties) already keeps the Kubernetes dev
# service from starting, yet the extension's processor still logs `Cannot apply manifests because the Kubernetes dev
# service is not running` at ERROR on every dev boot. It is not about anything this project configures; hide it here, in
# the profile the owner reads the console of.
quarkus.log.category."io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor".level=OFF

# Since Quarkus 3.38 a server bound to a localhost name - dev mode's default `quarkus.http.host` - answers `400` to any
# Host but `localhost`/`127.0.0.1`/`[::1]` (its guard against DNS rebinding). The dev clients' Vite proxies forward the
# browser's real Host (`changeOrigin: false` in src/web/ and src/admin-web/vite.config.ts), because the backend picks
# the tenant from it, so every dev request (`veyq.localhost:8081`, `admin.veyq.localhost:8082`, `<tenant>.localhost`)
# was refused. The check is off in dev only, the state before 3.38 (owner decision 2026-10-30, inbox #802): `allowed-hosts`
# takes a fixed list, no `*.localhost`, so each new dev tenant would be refused again. What stays open is a page in the
# developer's browser reaching this dev backend through a rebound name - a dev instance with test data only. Production
# binds 0.0.0.0 (the image's ENTRYPOINT), where Quarkus applies no such check; the reverse proxy routes by host there.
quarkus.http.host-validation.require-localhost=false
