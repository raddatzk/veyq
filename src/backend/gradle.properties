# JVM memory for the Gradle build JVM and the Kotlin compiler.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# Run independent modules' tasks in parallel (inbox #334): `check` with --rerun-tasks took 7m37s plain, 6m18s and 5m35s
# parallel on 2026-10-11 — the same 1406 tests, 0 failures in all three runs (no port or database collision).
org.gradle.parallel=true
# An IDE sync (Tooling API model building) in parallel too, as it was implied by the line above until Gradle 9.8
# deprecated that implication (inbox #806); in Gradle 10 the two are independent and leaving this unset is an error.
org.gradle.tooling.parallel=true

# A warning in a build script (`*.gradle.kts`) fails its compilation, as a compiler warning fails every module's
# (buildSrc's `veyq.module` and `build.gradle.kts`), so the build logic stays at zero too.
org.gradle.kotlin.dsl.allWarningsAsErrors=true
