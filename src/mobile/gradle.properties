org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# The native libraries' interop (libsodium on Apple, Linux and Windows, utf8proc on Linux and Windows) is commonized, so
# the shared native source sets (`nativeMain`, `appleMain`, `bridgedMain`, `linuxMain`) compile against it as their own
# metadata, not only per target.
kotlin.mpp.enableCInteropCommonization=true
# The core's JavaScript target chooses no environment on purpose (build.gradle.kts, ADR 0155 decision 6): an environment
# makes the link depend on Kotlin's own Node, Yarn and npm install. The plugin warns that not choosing one "will be an
# error in the future releases"; a Kotlin upgrade that makes it one is handed back, never answered with `nodejs()`.
kotlin.suppressGradlePluginWarnings=JsEnvironmentNotChosenExplicitly
# The JavaScript compile's incremental caches made the linked output differ between fresh compiler processes (the
# interfaces' order in `initMetadataForClass`: four variants of the conformance's stdlib module in four clean builds;
# whole-program granularity three in four). Without them four clean builds were byte-identical, and a warm rebuild after
# an edit took as long (measured 2026-11-20, cr-core-js-target phase 1). Byte-identical builds are ADR 0155's criterion.
kotlin.incremental.js.ir=false
