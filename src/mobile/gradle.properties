org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# The native libraries' interop (libsodium on Apple, Linux and Windows, utf8proc on Linux and Windows) is commonized, so
# the shared native source sets (`nativeMain`, `appleMain`, `bridgedMain`, `linuxMain`) compile against it as their own
# metadata, not only per target.
kotlin.mpp.enableCInteropCommonization=true
