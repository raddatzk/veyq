# The veyq app on Linux (ADR 0127 decision 4; ADR 0123's Consequences, the Linux app): GTK 4 and libadwaita drawing what the
# core's models say, reached through libveyq.so's six functions. Built and run in the Fedora 44 image beside it, only
# through `run.py` (it sets VEYQ_GENERATED and VEYQ_LIB_DIR, which build.rs reads); never edit Cargo.lock by hand —
# `run.py lock` writes it.
[package]
name = "veyq"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
# GTK 4.22 and libadwaita 1.9 are what Fedora 44 carries (gtk4-4.22.5, libadwaita-1.9.4, measured 2026-11-10); 1.9 for
# AdwSidebar, the shell's sidebar.
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# A receipt's PDF (D4 of the Expenses CR): poppler-glib's bindings, kept in GNOME's World/Rust group beside gtk-rs
# (0.26.0 of 2026-02-21 on crates.io, its repository active, measured 2026-11-12); it binds the glib and cairo gtk4 0.11 uses.
# v0_82: `Document::from_bytes` (a document over the bytes in memory); Fedora 44 carries poppler-glib 26.01.
poppler = { package = "poppler-rs", version = "0.26", features = ["v0_82"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
