# The veyq app on Linux (ADR 0136 decision 4; ADR 0123's Consequences, the Linux app): GTK 4 and libadwaita drawing what the
# core's models say, reached through libveyq.so's six functions. Built and run in the Fedora 44 image beside it, only
# through `run.py` (it sets VEYQ_GENERATED and VEYQ_LIB_DIR, which build.rs reads); never edit Cargo.lock by hand —
# `run.py lock` writes it.
[package]
name = "veyq"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
# GTK 4.22 and libadwaita 1.9 are what Fedora 44 carries (gtk4-4.22.5, libadwaita-1.9.4, measured 2026-11-10); 1.9 for
# AdwSidebar, the shell's sidebar. v4_22 for a PDF page's `GtkAccessibleText` caret a screen reader sets (inbox #963; the
# interface is 4.14's, its extents 4.16's): Fedora 44's 4.22.5 and the Flatpak's org.gnome.Platform//51 (GTK 4.24.1,
# measured 2026-11-24) both carry it.
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# A receipt's PDF (ADR 0123's Consequences, Expenses whole): poppler-glib's bindings, kept in GNOME's World/Rust group beside gtk-rs
# (0.26.0 of 2026-02-21 on crates.io, its repository active, measured 2026-11-12); it binds the glib and cairo gtk4 0.11 uses.
# v0_82: `Document::from_bytes` (a document over the bytes in memory); Fedora 44 carries poppler-glib 26.01.
poppler = { package = "poppler-rs", version = "0.26", features = ["v0_82"] }
# A QR scan's camera (the QR CR's D4): the xdg Camera portal through ashpd (MIT, Bilal Elmoussaoui's, the GNOME
# ecosystem's portal crate; 0.14.0 of 2026-11-05, its repository pushed 2026-11-08, not archived, checked 2026-11-13), on zbus's own
# executor (`async-io`), never tokio; only its camera portal. The frames through GStreamer's own bindings (gstreamer-rs,
# MIT/Apache-2.0, gitlab.freedesktop.org/gstreamer; 0.25 binds the glib gtk4 0.11 uses): `pipewiresrc` on the portal's
# remote, an `appsink` for the core's GRAY8 and the preview's RGBx, `VideoFrameRef` for a plane's stride.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "camera"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
