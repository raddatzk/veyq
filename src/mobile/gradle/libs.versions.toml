# The veyq app's build (src/mobile/, ADR 0123). Kotlin is the backend's version (src/backend/gradle/libs.versions.toml),
# so one Kotlin runs in the repository.
[versions]
kotlin = "2.4.21"
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "31"
android-targetSdk = "37"
ktor = "3.6.1"
coroutines = "1.11.0"
serialization = "1.12.0"
bouncycastle = "1.86"
kotlincrypto-sha3 = "0.8.0"
# The version the core already resolved through Ktor (gradle/verification-metadata.xml): Linux's `localWallClock` names it,
# and adds no library.
kotlinx-datetime = "0.8.0-0.6.x-compat"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
# CameraX (AndroidX, Apache-2.0): the Android app's camera for a QR scan (the QR CR, D4). Checked 2026-11-13 on Google's
# Maven: 1.6.2 is the latest stable of an actively released library (its metadata updated 2026-11-04 with 1.7.0-rc02),
# nothing in it relocated or deprecated; Google Play services and ML Kit are not pulled in (`camera-mlkit-vision` is a separate artifact, unused).
camerax = "1.6.2"
# WorkManager (AndroidX, Apache-2.0): the Android app's worker that keeps the process for a pin's fetch, promoted to a
# `dataSync` foreground service (ADR 0140 decision 9). Checked 2026-11-15 on Google's Maven: 2.12.0 is the latest stable of
# an actively released library (its metadata updated 2026-09-23), nothing in it relocated or deprecated; the Kotlin
# `CoroutineWorker` is in `work-runtime` itself (the `-ktx` artifact is an empty shell since 2.9).
work = "2.12.0"
# Compose for TV's Material (AndroidX, Apache-2.0): the TV form's UI — its navigation drawer, cards and focus look
# (ADR 0159 decision 1). Checked 2026-11-25 on Google's Maven: 1.1.0 is the latest stable of an actively released library
# (its metadata updated 2026-05-06), nothing in it relocated or deprecated; tv-foundation's lazy layouts are deprecated
# for Compose's standard ones, which the TV UI uses, so tv-foundation is not added.
tv-material = "1.1.0"
# The one generator version the repository runs (scripts/validate_build_input_pins.py holds every site to it).
openapi-generator = "7.23.0"
# Test-only, the core's jvmTest (never shipped): draws the web's Emergency Kit fixtures' pages as the apps' renderers do.
# Apache-2.0, an Apache project, maintained (3.0.8 released 2026-07-08, checked on Maven Central 2026-11-13); JVM-only,
# which is why it is no candidate for the apps' own drawing.
pdfbox = "3.0.8"
# Test-only, the Android app's JVM tests (never shipped): Compose's test rule run on the JVM, so a Compose layout's order
# is held without a device (inbox #961). MIT, maintained (4.18.1 released 2026-11-18, checked on Maven Central
# 2026-11-23). The Android framework it runs on is an artifact Gradle resolves and verifies, never one Robolectric fetches
# itself (`android/build.gradle.kts`).
robolectric = "4.18.1"
# Compose's test rule idles through Espresso; the 3.5.0 it pulls calls `InputManager.getInstance()`, which SDK 37 no
# longer has (NoSuchMethodException, measured 2026-11-23): the current stable, 3.7.0, replaces it.
espresso = "3.7.0"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
ktor-client-winhttp = { module = "io.ktor:ktor-client-winhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlincrypto-sha3 = { module = "org.kotlincrypto.hash:sha3", version.ref = "kotlincrypto-sha3" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }

openapi-generator = { module = "org.openapitools:openapi-generator", version.ref = "openapi-generator" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
