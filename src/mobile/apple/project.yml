# The veyq app for Apple platforms (ADR 0123): one SwiftUI target for iOS (iPhone, iPad) and macOS on the shared
# Kotlin base, VeyqCore.xcframework. The .xcodeproj is generated from this file (`xcodegen` in this directory) and
# never committed.
name: Veyq
options:
  bundleIdPrefix: me.raddatz
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Veyq:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Veyq
        excludes: [Info.plist]
    dependencies:
      - framework: ../core/build/XCFrameworks/debug/VeyqCore.xcframework
        embed: false
    preBuildScripts:
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:assembleVeyqCoreDebugXCFramework --console=plain
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          # The web's colour roles, its brand mark and the app icon into the asset catalog (ADR 0123 decision 7).
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.veyq
        PRODUCT_NAME: veyq
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web's accent is the app's tint: selection, controls, links (the styleguide's accent role).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Merged into the generated Info.plist: plain http to the developer's *.localhost instance only.
        INFOPLIST_FILE: Veyq/Info.plist
