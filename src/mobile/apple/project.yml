# The veyq app for Apple platforms (ADR 0123): one SwiftUI target for iOS (iPhone, iPad) and macOS on the shared
# Kotlin base, VeyqCore.xcframework. The .xcodeproj is generated from this file (`xcodegen` in this directory) and
# never committed.
name: Veyq
options:
  bundleIdPrefix: me.raddatz
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  # The words' String Catalogs exist before Xcode plans a first build, which reads a catalog's languages before any
  # script runs; each target's pre-build script keeps its own current (ADR 0129 decision 3).
  preGenCommand: python3 ../words/generate_words.py --apple-strings build/generated/app/Words.xcstrings && python3 ../words/generate_words.py --apple-strings build/generated/share/Words.xcstrings
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # VeyqCore is built for arm64 only (core/build.gradle.kts: macosArm64, iosArm64, iosSimulatorArm64), so the app is
    # too; a universal build would ask Kotlin's Xcode hook for an x86_64 slice it does not make.
    ARCHS: arm64
targets:
  Veyq:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Veyq
        excludes: [Info.plist, "*.entitlements"]
      # Every word the app shows, generated before the build from src/mobile/words/words.json (ADR 0129 decision 3).
      - path: build/generated/app/Words.xcstrings
        optional: true
        buildPhase: resources
    dependencies:
      # The share extension (ADR 0131), embedded in the iOS app only.
      - target: VeyqShare
        destinationFilters: [iOS]
    preBuildScripts:
      # Kotlin Multiplatform's own Xcode hook: builds VeyqCore for exactly the SDK, architecture and configuration this
      # build asks for into core/build/xcode-frameworks, which FRAMEWORK_SEARCH_PATHS points at. Nothing has to exist
      # before the first build (an XCFramework dependency is checked before any script runs).
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode --console=plain
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          # The web's colour roles, its brand mark and the app icon into the asset catalog (ADR 0123 decision 7).
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
      - name: Generate the words
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/app/Words.xcstrings"]
        script: |
          # The catalog's English and German as the String Catalog `Words` (ADR 0129 decision 3).
          python3 "$SRCROOT/../words/generate_words.py" --apple-strings "$SRCROOT/build/generated/app/Words.xcstrings"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.veyq
        # iOS shares the app group and a keychain access group with the share extension (ADR 0131); macOS has none yet.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Veyq/Veyq-iOS.entitlements
        PRODUCT_NAME: veyq
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VeyqCore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web's accent is the app's tint: selection, controls, links (the styleguide's accent role).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # A receipt's picture saved to Photos from the share sheet ("Save Image"): adding only, the library is never read.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "veyq saves the picture you chose to your photos."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Merged into the generated Info.plist: plain http to the developer's *.localhost instance only.
        INFOPLIST_FILE: Veyq/Info.plist
  VeyqShare:
    # The share extension (ADR 0131): the app's views and model, in the extension role, under its own controller. It
    # compiles the app's sources but its entry point and the dev sign-in, and builds VeyqCore as the app does.
    type: app-extension
    platform: iOS
    sources:
      - path: Veyq
        excludes: [Info.plist, "*.entitlements", VeyqApp.swift, DevLogin.swift]
      - path: VeyqShare
        excludes: [Info.plist, "*.entitlements"]
      - path: build/generated/share/Words.xcstrings
        optional: true
        buildPhase: resources
    preBuildScripts:
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode --console=plain
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
      - name: Generate the words
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/share/Words.xcstrings"]
        script: |
          # The catalog's English and German as the String Catalog `Words` (ADR 0129 decision 3).
          python3 "$SRCROOT/../words/generate_words.py" --apple-strings "$SRCROOT/build/generated/share/Words.xcstrings"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.veyq.share
        CODE_SIGN_ENTITLEMENTS: VeyqShare/VeyqShare.entitlements
        PRODUCT_NAME: VeyqShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VeyqShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VeyqCore"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
