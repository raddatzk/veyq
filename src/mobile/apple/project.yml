# The veyq app for Apple platforms (ADR 0123): one SwiftUI target for iOS (iPhone, iPad) and macOS on the shared
# Kotlin base, VeyqCore.xcframework; the TV's form of the same app (ADR 0159 decision 1) is the target VeyqTV. The .xcodeproj is generated from this file (`xcodegen` in this directory) and
# never committed.
name: Veyq
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  # The words' String Catalogs exist before Xcode plans a first build, which reads a catalog's languages before any
  # script runs; each target's pre-build script keeps its own current (ADR 0161 decision 3). The manifest's words
  # (the usage descriptions: InfoPlist.xcstrings, and InfoPlist.xcconfig, the app's config file) exist before the
  # project does, since a build reads its config files before any script runs.
  preGenCommand: python3 ../words/generate_words.py --apple-strings build/generated/app/Words.xcstrings --apple-swift build/generated/app/Msg+Words.swift --apple-infoplist build/generated/app && python3 ../words/generate_words.py --apple-strings build/generated/share/Words.xcstrings --apple-swift build/generated/share/Msg+Words.swift && python3 ../words/generate_words.py --apple-strings build/generated/tv/Words.xcstrings --apple-swift build/generated/tv/Msg+Words.swift
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # VeyqCore is built for arm64 only (the core modules' convention, build.gradle.kts: macosArm64, iosArm64,
    # iosSimulatorArm64), so the app is
    # too; a universal build would ask Kotlin's Xcode hook for an x86_64 slice it does not make.
    ARCHS: arm64
targets:
  Veyq:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Veyq
        # the TV's root and the applications' TV pages are VeyqTV's alone (ADR 0159 decision 1)
        excludes: [Info.plist, "*.entitlements", "TV/**", "Apps/*/Tv*.swift"]
      # Every word the app shows, generated before the build from src/mobile/words/words.json (ADR 0161 decision 3).
      # The core's plan enums as exhaustive Swift enums (ADR 0154 decision 2, inbox #1050), generated before the build.
      - path: build/generated/app/Plans.swift
        optional: true
        buildPhase: sources
      - path: build/generated/app/Words.xcstrings
        optional: true
        buildPhase: resources
      # Each word as `Msg.<name>` in Swift: the core's `Msg` is a class Swift reaches through its companion (inbox #1341).
      - path: build/generated/app/Msg+Words.swift
        optional: true
        buildPhase: sources
      # The usage descriptions in English and German (the permission prompts), from the same catalog.
      - path: build/generated/app/InfoPlist.xcstrings
        optional: true
        buildPhase: resources
    # The usage descriptions' English as the generated Info.plist's own values (`INFOPLIST_KEY_NS…UsageDescription`):
    # generated, never written here (scripts/validate_mobile_words.py, manifest-literal).
    configFiles:
      Debug: build/generated/app/InfoPlist.xcconfig
      Release: build/generated/app/InfoPlist.xcconfig
    dependencies:
      # The share extension (ADR 0138), embedded in the iOS app only.
      - target: VeyqShare
        destinationFilters: [iOS]
    preBuildScripts:
      # Kotlin Multiplatform's own Xcode hook: builds VeyqCore for exactly the SDK, architecture and configuration this
      # build asks for into composition/build/xcode-frameworks (the composition packs the platform and every application,
      # ADR 0155 decision 7.1), which FRAMEWORK_SEARCH_PATHS points at. Nothing has to exist
      # before the first build (an XCFramework dependency is checked before any script runs).
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:embedAndSignAppleFrameworkForXcode --console=plain
      - name: Generate the plans
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/app/Plans.swift"]
        script: |
          # Each core plan enum's exhaustive Swift form (ADR 0154 decision 2, inbox #1050), from the core's @Plan enums
          # and the header the step above wrote: a switch over `.entry` takes no `default:`, so an entry the core adds
          # fails every drawing that forgot it.
          python3 "$SRCROOT/generate_plans.py" --header "$SRCROOT/../composition/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/VeyqCore.framework/Headers/VeyqCore.h" --out "$SRCROOT/build/generated/app/Plans.swift"
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          # The web's colour roles, its brand mark and the app icon into the asset catalog (ADR 0123 decision 7).
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
      - name: Generate the words
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/app/Words.xcstrings", "$(SRCROOT)/build/generated/app/Msg+Words.swift", "$(SRCROOT)/build/generated/app/InfoPlist.xcstrings"]
        script: |
          # The catalog's English and German as the String Catalog `Words` (ADR 0161 decision 3), and the usage
          # descriptions' (InfoPlist.xcconfig, read before this runs, is current as of the project's generation).
          python3 "$SRCROOT/../words/generate_words.py" --apple-strings "$SRCROOT/build/generated/app/Words.xcstrings" --apple-swift "$SRCROOT/build/generated/app/Msg+Words.swift" --apple-infoplist "$SRCROOT/build/generated/app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veyq
        # iOS shares the app group and a keychain access group with the share extension (ADR 0138); macOS has none yet.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Veyq/Veyq-iOS.entitlements
        PRODUCT_NAME: veyq
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composition/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VeyqCore"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web's accent is the app's tint: selection, controls, links (the styleguide's accent role).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # The usage descriptions are the catalog's (words.json's `apple_infoplist` keys), through the config file above:
        # NSPhotoLibraryAddUsageDescription, a receipt's picture saved to Photos from the share sheet ("Save Image"),
        # adding only, the library is never read; NSCameraUsageDescription, a QR code read through the camera (an
        # Emergency Kit, linking a device), which iOS and macOS both ask with — the macOS app is not sandboxed, so no
        # camera entitlement is needed beside it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Merged into the generated Info.plist: plain http to the developer's *.localhost instance only.
        INFOPLIST_FILE: Veyq/Info.plist
  VeyqShare:
    # The share extension (ADR 0138): the app's views and model, in the extension role, under its own controller. It
    # compiles the app's sources but its entry point and the dev sign-in, and builds VeyqCore as the app does.
    type: app-extension
    platform: iOS
    sources:
      - path: Veyq
        # ContinuedWork.swift asks UIApplication for background time, which an extension has not (ADR 0140 decision 9, ADR 0145
        # decision 1); BackgroundSync.swift is the app's scheduled run (ADR 0153 decision 8), never an extension's
        excludes: [Info.plist, "*.entitlements", VeyqApp.swift, DevLogin.swift, DevAudio.swift, ContinuedWork.swift, BackgroundSync.swift, "TV/**", "Apps/*/Tv*.swift"]
      - path: VeyqShare
        excludes: [Info.plist, "*.entitlements"]
      - path: build/generated/share/Plans.swift
        optional: true
        buildPhase: sources
      - path: build/generated/share/Words.xcstrings
        optional: true
        buildPhase: resources
      - path: build/generated/share/Msg+Words.swift
        optional: true
        buildPhase: sources
    preBuildScripts:
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:embedAndSignAppleFrameworkForXcode --console=plain
      - name: Generate the plans
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/share/Plans.swift"]
        script: |
          python3 "$SRCROOT/generate_plans.py" --header "$SRCROOT/../composition/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/VeyqCore.framework/Headers/VeyqCore.h" --out "$SRCROOT/build/generated/share/Plans.swift"
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
      - name: Generate the words
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/share/Words.xcstrings", "$(SRCROOT)/build/generated/share/Msg+Words.swift"]
        script: |
          # The catalog's English and German as the String Catalog `Words` (ADR 0161 decision 3).
          python3 "$SRCROOT/../words/generate_words.py" --apple-strings "$SRCROOT/build/generated/share/Words.xcstrings" --apple-swift "$SRCROOT/build/generated/share/Msg+Words.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veyq.share
        CODE_SIGN_ENTITLEMENTS: VeyqShare/VeyqShare.entitlements
        PRODUCT_NAME: VeyqShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VeyqShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composition/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VeyqCore"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  VeyqTV:
    # The TV's form of the one app (ADR 0159 decision 1): the iOS app's bundle id (universal purchase; App Store Connect
    # takes a tvOS build from a target of its own), its own root `Veyq/TV`, the applications' TV pages
    # (`Veyq/Apps/<App>/Tv*.swift`) and only those files of the core UI and the applications that compile on tvOS — the
    # rest of the iOS root is left out, never branched with `#if os(tvOS)`. No entitlements file: the user-management
    # entitlement (`runs-as-current-user`, decision 5) and its provisioning are the owner's step at the end (CR decision 7).
    type: application
    platform: tvOS
    sources:
      - path: Veyq/TV
        excludes: [Info.plist]
      # the composition root: its tvOS branch registers the applications' TV pages
      - path: Veyq/Applications.swift
      - path: Veyq/Apps/Memories/TvMemory.swift
      # a gallery's model takes the uploads' deriver though a TV uploads nothing (ImageIO and AVFoundation only)
      - path: Veyq/Apps/Memories/MediaTiers.swift
      - path: Veyq/Apps/Depot/TvFile.swift
      - path: Veyq/Apps/Expenses/TvPot.swift
      - path: Veyq/Core/Words.swift
      - path: Veyq/Core/Formats.swift
      - path: Veyq/Core/Theme.swift
      - path: Veyq/Core/CoverImages.swift
      - path: Veyq/Core/ReaderPlayback.swift
      - path: Veyq/Core/MusicPlayback.swift
      # the report (the DSA's notice where the content is shown, ADR 0159's decision log): its sheet observed, and the
      # privacy notice's QR code, read on another device
      - path: Veyq/Core/ReportBox.swift
      - path: Veyq/Core/QrMatrixView.swift
      - path: Veyq/Assets.xcassets
      - path: build/generated/tv/Plans.swift
        optional: true
        buildPhase: sources
      - path: build/generated/tv/Words.xcstrings
        optional: true
        buildPhase: resources
      - path: build/generated/tv/Msg+Words.swift
        optional: true
        buildPhase: sources
    preBuildScripts:
      # The same hook as the app's: VeyqCore for appletvos or appletvsimulator, as this build asks.
      - name: Build VeyqCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:embedAndSignAppleFrameworkForXcode --console=plain
      - name: Generate the plans
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/tv/Plans.swift"]
        script: |
          python3 "$SRCROOT/generate_plans.py" --header "$SRCROOT/../composition/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/VeyqCore.framework/Headers/VeyqCore.h" --out "$SRCROOT/build/generated/tv/Plans.swift"
      - name: Generate the theme
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/../theme/generate_theme.py" --apple-assets "$SRCROOT/Veyq/Assets.xcassets"
      - name: Generate the words
        basedOnDependencyAnalysis: false
        outputFiles: ["$(SRCROOT)/build/generated/tv/Words.xcstrings", "$(SRCROOT)/build/generated/tv/Msg+Words.swift"]
        script: |
          python3 "$SRCROOT/../words/generate_words.py" --apple-strings "$SRCROOT/build/generated/tv/Words.xcstrings" --apple-swift "$SRCROOT/build/generated/tv/Msg+Words.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veyq
        PRODUCT_NAME: veyq
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # the launch screen, the music in the background, plain http to a *.localhost instance only (merged)
        INFOPLIST_FILE: Veyq/TV/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composition/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework VeyqCore"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: veyq-accent
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
