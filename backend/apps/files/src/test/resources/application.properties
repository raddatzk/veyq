# Anchor — this file holds no key, on purpose (ADR 0079; the same anchor as :apps:memories').
#
# It exists only so `application-test.properties` beside it is read: SmallRye Config finds a profile file only as the
# sibling of a discovered `application.properties`, and one without that sibling is silently never read (without it
# the `%test` datasource is gone and every @QuarkusTest of this module fails "Datasource '<default>' is not
# configured"). Every `application.properties` on the classpath is a source at the same ordinal, so a key here would
# compete with the base in :core's `src/main/resources`. scripts/validate_backend_module_graph.py rule (g) holds both:
# no key in an anchor, no profile file without one.
