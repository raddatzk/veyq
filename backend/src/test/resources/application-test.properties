# The `%test` keys of the root's tests — the whole-app ones (`OperatorBlindProbeTest`, the sweeps, the module
# composition). Each module with @QuarkusTests holds its own copy of the keys ITS tests need
# (`core/src/test/resources/`, `apps/memories/src/test/resources/`), beside a comment-only anchor: test config ships in
# no jar, and a test-fixtures output is no config source for a @QuarkusTest (cr-platform-gradle-modules step 6,
# measured). The reasons written here hold for the module copies too; they are not repeated there.
#
# Tests (`./gradlew check`, @QuarkusTest): in-memory H2 — hermetic + fast, fresh per JVM.
# `MODE=MariaDB` raises DDL/SQL parity with the prod engine so the test store parses what prod parses — the
# direct antidote to #94 (a `MODIFY COLUMN` type-change is MariaDB-only syntax that default-mode H2 rejects).
# Parity is the point, but note the limit: MODE does NOT make H2 enforce MariaDB's
# `TEXT` byte ceiling, so an oversize-cap regression is caught by `scripts/validate_maxlength_storage.py`, never
# by this suite. Mode and guard are different jobs — do not conflate them.
#
# The two env overrides exist for ONE caller, `scripts/run_backend_races_on_mariadb.py`, which points the race
# classes at a throwaway MariaDB of the image production pins: H2 cannot show what the production engine does under
# overlap (ADR 0078). Unset, the suite is the hermetic H2 run above.
quarkus.datasource.db-kind=${VEYQ_TEST_DB_KIND:h2}
quarkus.datasource.jdbc.url=${VEYQ_TEST_DB_URL:jdbc:h2:mem:veyq;MODE=MariaDB;DB_CLOSE_DELAY=-1}

# Bind tests to a random free port (quarkus-junit points RestAssured at it). The default test port is
# 8081, which collides with the Vite web dev server (`web`, --host 127.0.0.1:8081) when it is running.
quarkus.http.test-port=0

# The admin listener binds a free port too, for the same reason; tests reach it through AdminListener.port().
veyq.admin-channel.port=0

# Effectively disable the auth rate limiter for the slice tests — they all hit the endpoints from
# 127.0.0.1, so the production default (60/min) would trip across the suite (here: the probe fires every operation,
# the auth ones included). AuthRateLimitTest (:core) overrides this back down via its own @TestProfile.
veyq.ratelimit.auth.max-requests=1000000

# cr-0165: same treatment for the per-share password-attempt bound — the slice tests fire wrong tokens from
# 127.0.0.1 and the production default (10/window) would trip across the suite (here: the probe's share operations).
# SharePasswordAttemptBoundTest (:apps:memories) overrides this down via its own @TestProfile.
veyq.share.password.rate.max-per-window=1000000

# cr-config-secret-key-file-and-fingerprint (ADR 0050): the config-secret KEK is now a server-managed
# FILE. The suite points it at a throwaway path under build/ (gitignored) — ConfigSecretSeal generates a key there
# on first construction so it is configured across the suite (mail-settings slice tests seal an SMTP password and
# unseal it at send time). Fresh per checkout; the H2 DB is in-memory so the fingerprint adopts cleanly each run.
veyq.security.config-secret-file=build/test-config-secret.key

# No @Scheduled job fires on its own in the suite; a test that needs a job calls its run() (inbox #182). The simple
# scheduler fires every `every = …` job at its first trigger check, about a second after EACH app start, and the
# suite starts the app once per @TestProfile (~27 times). So every job ran ~27 times on worker threads against the
# JVM-shared H2 while tests ran: it deleted rows other tests asserted on, and was killed mid-statement at each profile
# switch (SQLState 57014). `halted`, not `enabled=false`: the triggers are still built, so a malformed interval still
# fails startup. ScheduledJobsHaltedInTestTest (:core) pins this state; `validate_backend_module_graph.py` rule (g5)
# holds the key, with this value, on every project's test classpath (inbox #331).
quarkus.scheduler.start-mode=halted
# The erasure ledger's file (ADR 0056 decision 8): one per boot under build/, never beside the shared test key — a boot
# that re-applied an earlier boot's lines would erase another test's fixtures that reuse an id.
veyq.erasure-ledger.file=build/erasure-ledger/${quarkus.uuid}.log
# …and no boot re-applies it: the H2 database outlives a boot, so a boot would re-apply every earlier test's lines (their
# blocks among them) to the fixtures other tests left behind. ErasureLedgerSliceTest runs the start's steps itself.
veyq.erasure-ledger.apply-at-start=false
