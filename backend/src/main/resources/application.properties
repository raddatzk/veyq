# Anchor — this file holds no key, on purpose (ADR 0079; cr-platform-gradle-modules step 6).
#
# The base config, every profile's ground truth, is :core's `core/src/main/resources/application.properties`. This
# file exists only so the profile files beside it (`application-{dev,e2e,prod}.properties`) are read: SmallRye
# Config finds a profile file only as the sibling of a discovered `application.properties`, and one without that
# sibling is silently never read. Every `application.properties` on the classpath is a source at the same ordinal,
# so a key here would be a second base competing with core's. scripts/validate_backend_module_graph.py rule (g)
# holds both: no key in an anchor, no profile file without one.
