# Dev (`quarkusDev`): persistent local MariaDB (infra/docker-compose.yml) — prod parity + data survives
# restarts (no re-doing setup each run). Start it first: `docker compose -f infra/docker-compose.yml up -d`.
# A jdbc.url is set, so Quarkus connects to that container instead of starting its own Dev Services database.
quarkus.datasource.db-kind=mariadb
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/veyq
quarkus.datasource.username=veyq
quarkus.datasource.password=change-me

# Realign the local DB's Flyway checksums on start (dev only): editing an already-applied migration — even just
# its comment — changes its checksum and otherwise fails validation. A local convenience; migrations stay
# append-only in the repo, and prod never repairs.
quarkus.flyway.repair-at-start=true

# Object store (cr-0105, ADR 0013): a byte path is a HARD requirement — %dev fails loud at startup without one
# (BlobStoreStartupCheck), so point it at the bundled Garage by default. These are the DOCUMENTED THROWAWAY dev
# creds (infra/README.md) — not secrets; prod supplies real creds via env. Start Garage first:
# `docker compose -f infra/docker-compose.yml --profile s3 up -d`.
#
# That `up` now leaves the store RUNNING BUT NOT USABLE — there is no init sidecar any more (ADR 0067) — and the
# first backend start brings it up: layout, bucket, key, grant, CORS. That is the point rather than a cost: dev
# runs the production shape, so the FRESH provisioning path is exercised on every clean cycle instead of only in
# a unit test. `docker compose … down -v` and start the backend to run it again from nothing.
veyq.blob-store.endpoint=http://localhost:19000
veyq.blob-store.access-key=GK0123456789abcdef01234567
veyq.blob-store.secret-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
veyq.blob-store.type=garage
# The admin plane is a different port from the S3 one; docker-compose.yml publishes it as 19003:3903, local
# only. The token is the documented dev throwaway the `garage` service is started with.
veyq.blob-store.garage.admin-endpoint=http://localhost:19003
veyq.blob-store.garage.admin-token=veyq-dev-admin-token
# Presigned URLs are signed for the WEB ORIGIN so the Vite dev server's same-origin `/blobs/` proxy forwards the
# PUT/GET without CORS (cr-0064). Default assumes browsing 127.0.0.1:5173; override via
# VEYQ_BLOB_STORE_PUBLIC_ENDPOINT (env) to match your actual browse origin (e.g. veyq.localhost:8081).
veyq.blob-store.public-endpoint=http://127.0.0.1:5173

veyq.session.cookie.secure=false

# Quarkus colours the console with 256-colour ANSI codes; its light greys and white (251, 250, 253, 231) vanish on a
# light IDE theme (IntelliJ shows them only when selected). The dev log is read in the IDE, so it stays plain.
quarkus.log.console.color=false
