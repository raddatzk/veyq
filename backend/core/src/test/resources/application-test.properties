# The `%test` keys of :core's own tests — exactly the ones they need. The root's and :apps:memories' tests read their
# own copies (`backend/src/test/resources/`, `backend/apps/memories/src/test/resources/`); the reasons for the keys
# they share are written in the root's file and not repeated here.
# Test config ships in no jar, and a test-fixtures output is no config source for a @QuarkusTest
# (cr-platform-gradle-modules step 6, measured) — so each module keeps its keys beside its tests.

# In-memory H2 in MariaDB mode; the two env overrides are the race runner's (scripts/run_backend_races_on_mariadb.py).
quarkus.datasource.db-kind=${VEYQ_TEST_DB_KIND:h2}
quarkus.datasource.jdbc.url=${VEYQ_TEST_DB_URL:jdbc:h2:mem:veyq;MODE=MariaDB;DB_CLOSE_DELAY=-1}

# Free ports: the public listener and the admin listener (tests reach it through AdminListener.port()). Module test
# JVMs may run side by side, so no fixed port.
quarkus.http.test-port=0
veyq.admin-channel.port=0

# The config-secret KEK file under build/ (gitignored), never the production default in the working directory.
veyq.security.config-secret-file=build/test-config-secret.key

# No @Scheduled job fires on its own: a test that needs a job calls its run() (SessionPurgeTest drives
# SessionPurge.run() and must be the only caller; the root's file says why, inbox #182).
quarkus.scheduler.start-mode=halted

# The auth slice tests (login, refresh, pairing, recovery) all hit the auth endpoints from 127.0.0.1: the production
# default (60/min) would trip across the suite. AuthRateLimitTest overrides this down via its own @TestProfile.
veyq.ratelimit.auth.max-requests=1000000

# The cookie slice tests read the refresh/session cookies over the test's plain-HTTP port.
veyq.session.cookie.secure=false
