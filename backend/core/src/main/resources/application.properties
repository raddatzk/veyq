# Shared across all profiles. Flyway owns the schema; Hibernate never generates or validates DDL.
# The datasource is configured per profile — see application-{dev,test,prod}.properties.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Every connection runs READ COMMITTED — the isolation the slice tests' H2 runs, so a race a slice test proves is
# the race production runs (ADR 0078). Set here, per connection, not on the server: an operator's own MariaDB gets
# it too. MariaDB's default REPEATABLE READ fixed a transaction's snapshot at its first plain read, so a check made
# after a later row lock read the state from before the lock: a re-activation by a member being removed passed its
# membership check, and two refreshes of one token revoked their own session family. Every profile, test included.
# `DatasourceIsolationTest` reds if this line goes.
quarkus.datasource.jdbc.transaction-isolation-level=read-committed

# Central auth (cr-0012). Lazy authentication: the bearer mechanism runs only when a security annotation demands
# an identity — never on @PermitAll endpoints, so a present-but-bad token can't 401 a public call (e.g. logout
# stays idempotent). Default-deny (deny-unannotated-endpoints) is flipped on in phase 3, once every endpoint
# carries an explicit @Authenticated / @RolesAllowed / @PermitAll.
quarkus.http.auth.proactive=false

# Default-deny (cr-0012 phase 3): every JAX-RS endpoint must carry an explicit security annotation; an
# unannotated one is denied. The annotation is now the single mandatory place the token-or-not decision is
# taken, and a future endpoint added without one fails closed instead of silently shipping open.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# The admin channel (ADR 0065, uc.admin.admin-channel): a second, internal listener, and the only door the
# Server-Owner operations answer on. Only the admin container is pointed at it; nothing routes the public origin
# to it, and the root Dockerfile does not EXPOSE it. A bind failure fails startup — a backend with no admin door
# is an instance nobody can set up, and it would look healthy to every probe.
veyq.admin-channel.port=8090

# Capability discovery & version gating (ADR 0032 / cr-0103). `major` is the ONLY hard compatibility gate a
# client enforces before login — bump it exclusively when a capability is REMOVED; everything additive bumps
# `build` (informational only). These are build-set (each client is compiled against a `major`); the defaults
# keep a fresh instance advertising 1.1.
veyq.version.major=1
veyq.version.build=1

# The RELEASE identity of the running image (ADR 0057) — a different number from veyq.version.* above, and
# never merged with it: that pair is the client's pre-auth compatibility gate, this is the operator's rollback
# target and is Server-Owner-only. The publish stamps the tree's VERSION into the image as VEYQ_VERSION
# (Dockerfile, both runtime targets); a build the pipeline never stamped leaves it unset, which resolves to
# empty here and is reported as the absence it is rather than as a placeholder.
veyq.release.version=${VEYQ_VERSION:}
# Operator off-switch: a comma-separated list of capability ids to turn OFF instance-wide. A disabled id is both
# omitted from the GET /api/setup manifest (clients hide the feature) AND rejected at its create/enable endpoint
# (422 capability_disabled) — the manifest is a UX hint, the server is the authority. Ids: sharing.public-links,
# sharing.uploader-links, spaces.groups, account.device-trust (contracts/platform/capabilities.json). Unset ⇒
# every advertised capability is active.
# veyq.capabilities.disabled=sharing.uploader-links,spaces.groups

# Tenant invites (cr-0009): how long an owner invite is valid, how long terminal-state invites are kept
# before the scheduled purge deletes them, and how often the purge runs. ISO-8601 durations.
veyq.tenant.invite.ttl=P7D
veyq.tenant.invite.retention=P30D
veyq.tenant.invite.purge.every=1h

# Tenant ingress projection (ADR 0063). BOTH are unset by default, and that absence is the whole `%dev`/`%test`
# behaviour: TenantIngressProjector no-ops, because an instance with no reverse proxy in front of it has nothing
# to project into. A docker-compose deployment sets them from infra/docker-compose.prod.yml — the path points
# into the volume Traefik file-watches, and that file is ALL of compose's routing: the bootstrap domain's
# (${VEYQ_DOMAIN}) router pair, every tenant's, the admin router when admin-domain is set, and the services they
# point at. The upstreams default to the production compose file's service names.
# veyq.tenant.ingress.dynamic-config-path=/etc/traefik/dynamic/tenants.yml
# veyq.tenant.ingress.bootstrap-domain=veyq.example.org
# veyq.tenant.ingress.admin-domain=admin.veyq.example.org
# The app upstream is the PUBLIC listener, never veyq.admin-channel.port (ADR 0065).
# veyq.tenant.ingress.upstream.app=http://app:8080
# veyq.tenant.ingress.upstream.blobs=http://garage:3900
# veyq.tenant.ingress.upstream.admin=http://admin:8080
# ADR 0064's second sink. `traefik-file` (the default) is the compose deployment above; `kubernetes` manages
# Ingress objects through the API instead, and needs no connection settings — the in-cluster ServiceAccount
# supplies the API server AND the namespace, which is what keeps one image deployable into every install.
# veyq.tenant.ingress.sink=kubernetes
# veyq.tenant.ingress.kubernetes.ingress-class-name=nginx
# veyq.tenant.ingress.kubernetes.namespace=   # an override for a run OUTSIDE the cluster; never required in one
# TLS on that target is a PASSTHROUGH (ADR 0064): the sink stamps a reference the chart tells it to — a
# `spec.tls` per mode plus the operator's annotations, verbatim — and never creates an Issuer, Certificate or
# Secret. `none` (the default) emits neither; `per-domain` names the Ingress object's own name as the Secret
# (cert-manager's ingress-shim shape, per-tenant custom domains keep working); `shared` points every object at
# ONE pre-provisioned Secret and REQUIRES secret-name — without it the sink is disabled loudly, not booted half.
# veyq.tenant.ingress.kubernetes.tls.mode=per-domain
# veyq.tenant.ingress.kubernetes.tls.secret-name=
# veyq.tenant.ingress.kubernetes.annotations."cert-manager.io/cluster-issuer"=letsencrypt

# Kubernetes Dev Services would start a container-based API server for every `%dev`/`%test` run, which is a
# Docker dependency this suite has never had and does not want: the only Kubernetes tests here bring their own
# in-JVM mock control plane (`@WithKubernetesTestServer`), and every other test never touches the client.
quarkus.kubernetes-client.devservices.enabled=false

# Session-token purge (cr-0011): how often the scheduled cleanup deletes expired access/refresh tokens,
# stale login challenges, and token-less session families. Rows are removed strictly once past expiry.
veyq.session.purge.every=1h

# Group soft-delete (cr-0090): how long a soft-deleted GROUP stays in its grace period (readable + restorable)
# before the scheduled purge hard-erases it (rows + blob objects), and how often that purge runs. ISO-8601.
veyq.scope.delete.retention=P30D
veyq.scope.delete.purge.every=1h

# Media trash (uc.memory.delete-media, cr-0110) — veyq.media.trash.retention (P30D) and
# veyq.media.trash.purge.every (1h) — is the Memories application's and deliberately NOT here (inbox #342): every
# veyq.* key must map to a root, and core booted alone (:core's tests) has no veyq.media mapping, so a key here fails
# its startup (SRCFG00050 "does not map to any root"). The defaults are the @WithDefaults of Memories' own mapping,
# MemoriesMediaConfig, which SmallRye registers as config defaults — the @Scheduled expression reads them too. An
# operator still sets either key the usual way (env VEYQ_MEDIA_TRASH_RETENTION, -D, a mounted file).

# Node trash (uc.memory.delete-node, ADR 0061): how long a soft-deleted SUBTREE (a node of any kind and
# everything under it) stays restorable in the space's trash before NodeSubtreePurge hard-erases it — the
# applications' rows under it, its blob rows and the store objects behind them, then the node rows — and how often that
# purge runs. ISO-8601 duration. `purgeAfter` in the trash listing is derived from this, never stored.
veyq.node.trash.retention=P30D
veyq.node.trash.purge.every=1h

# Abandoned upload sessions (uc.memory.upload E2, en.memory.media E3, ADR 0013): how long an OPEN upload session
# is kept before the scheduled sweep deletes its row AND the chunk objects the client already staged, and how
# often that sweep runs. ISO-8601 duration. Much shorter than the P30D windows above, and the bound is measured
# rather than chosen: the sweep keys on a session's LAST ISSUED WINDOW, and every presigned PUT of a window is
# signed under veyq.blob-store.presign-ttl-seconds (600), so a session with no new window past that TTL cannot
# receive another byte. The only legitimate late arrival is a PUT that STARTED inside the TTL and is still
# streaming (S3 honours a signature that was valid at request start) — one 256 KiB chunk, so PT1H is ~6x a worst
# case of ten minutes and change. A longer window stores a month of garbage to protect ten minutes.
# The same bound is the store-reclaim not-before (ADR 0062 Decision 1): a recorded key is not deleted before it.
# Core's keys (upload sessions are core's, ADR 0079); named veyq.media.upload.* until inbox #342.
veyq.blob.upload.retention=PT1H
veyq.blob.upload.purge.every=1h

# Background tasks (ADR 0021 / cr-0076): the lease TTL a claim grants (a long worker heartbeats to extend it),
# the max attempts before a job is dead-lettered, and how often the grant-delivery origination backstop runs.
# The primary origination path is reconcile-on-claim; this backstop only covers scopes no key-holder pulled.
# ISO-8601 durations.
veyq.tasks.lease.ttl=PT5M
veyq.tasks.max-attempts=5
veyq.tasks.grant-delivery.reconcile.every=1h

# Refresh-token cookie (web "remember me" transport, ADR 0004 / cr-0052): httpOnly+SameSite=Strict always; the
# `Secure` attribute is on in prod but off in local dev/test, where the app runs over plain http on 127.0.0.1
# and a Secure cookie would never be sent (breaking local "remember me"). Set true behind TLS in production.
veyq.session.cookie.secure=true

# Per-IP rate limit (IpRateLimitFilter): max requests per fixed window per client IP, shared by every endpoint
# declaring `@RateLimit(key = IP)` (ADR 0051) — today the login challenge/verify + token refresh + the
# unauthenticated account-creation endpoints. One window per IP across all of them, on purpose: it bounds an
# attacker's total public-surface spend instead of handing them a fresh budget per route. In-memory,
# per-instance, best-effort defense-in-depth — a gateway/distributed bucket is the production answer. Behind a
# reverse proxy, also set `quarkus.http.proxy.proxy-address-forwarding=true` (and trust the proxy) so the real
# client IP is keyed, not the proxy's. The `auth.` prefix is historical (it began as the auth-only limiter) and
# is kept so an existing self-hosted config file does not break.
veyq.ratelimit.auth.max-requests=60
veyq.ratelimit.auth.window-seconds=60

# Per-principal rate limit (UserRateLimitFilter) for `@RateLimit(key = USER)`: max requests per fixed window per
# authenticated userId, counted after authorization. Deliberately generous — an authenticated caller is
# attributable and revocable, so this bounds runaway automation rather than abuse.
veyq.ratelimit.user.max-requests=600
veyq.ratelimit.user.window-seconds=60

# Member-invite mail limiter (cr-email-invite-send-hardening). The real anti-bombing guard, keyed
# per-(tenant,recipient) AND per-tenant, enforced in the handler before the mint (not the per-IP filter, which
# cannot key on a recipient). In-memory, per-instance, best-effort — like the auth limiter. These numbers are
# DELIBERATELY SET, NOT EMPIRICALLY CALIBRATED — revidierbar once real invite volume is observed.
veyq.ratelimit.invite.per-recipient-max-requests=3
veyq.ratelimit.invite.per-tenant-max-requests=20
veyq.ratelimit.invite.window-seconds=3600

# Password-recovery limiter (cr-account-recovery, ADR 0054). Keyed per-ADDRESS and per-INSTANCE — deliberately
# NOT per-tenant like the invite limiter above: an account is tenant-global, so a tenant key would neither bound
# a single address nor the instance as a whole. The per-address bucket is the anti-bombing guard (a stranger
# cannot mail-flood someone by replaying their address); the instance bucket bounds a scraper walking a list.
# Both are best-effort and in-memory, like every other limiter here. DELIBERATELY SET, NOT CALIBRATED.
veyq.ratelimit.recovery.per-address-max-requests=3
veyq.ratelimit.recovery.per-instance-max-requests=60
veyq.ratelimit.recovery.window-seconds=3600

# Account recovery (cr-account-recovery, ADR 0054). The token TTL is much shorter than an invite's P7D: an
# invite waits for a person to get around to joining, a recovery token is redeemed within minutes by someone
# sitting at their mailbox. Retention keeps spent rows briefly so a replay is recognisable as spent rather than
# unknown, then the purge deletes them. ISO-8601 durations.
veyq.recovery.token.ttl=PT1H
veyq.recovery.token.retention=P7D
veyq.recovery.purge.every=1h

# Address confirmation (cr-email-address-confirmation, ADR 0074). The token copies the recovery token's lifecycle
# with a day-long TTL: long enough to reach a mailbox read once a day, short because nothing waits on it. The
# limiter is per ACCOUNT only — the caller is authenticated and mails only their own address, and the population is
# bounded by invitations, so no per-tenant or per-instance cap is needed. DELIBERATELY SET, NOT CALIBRATED.
veyq.email-confirmation.token.ttl=PT24H
veyq.email-confirmation.token.retention=P7D
veyq.email-confirmation.purge.every=1h
veyq.ratelimit.email-confirmation.per-account-max-requests=3
veyq.ratelimit.email-confirmation.window-seconds=3600

# Device linking (ADR 0059). The channel TTL is the shortest lifetime in this file, and deliberately: both
# devices are in the person's hands for the whole ceremony, so ten minutes bounds an abandoned pairing rather
# than a slow user — and an abandoned one holds a session family that is revoked when the row expires, so a
# generous window would keep a live refresh token nobody collected. Retention keeps spent rows a day so a
# replayed handle reads as spent rather than unknown (E1). The sweep runs often for the same reason the TTL is
# short: it is what revokes those families. DELIBERATELY SET, NOT CALIBRATED.
veyq.pairing.channel.ttl=PT10M
veyq.pairing.channel.retention=P1D
veyq.pairing.purge.every=5m

# Blob store (every blob's byte path, ADR 0013 / cr-0105). A byte-path store is a HARD requirement: outside %test an
# unset/blank `veyq.blob-store.endpoint` FAILS STARTUP (BlobStoreStartupCheck) — blob storage is not gracefully
# degraded, and there is no client-facing directTransport flag. %test uses the in-memory stub; %dev points at the
# bundled Garage by default (application-dev.properties). Set these via operator env for prod (any S3-compatible
# endpoint — Garage, AWS S3, R2, B2, …; kept out of this shared file so prod secrets never live in the repo):
#   veyq.blob-store.endpoint=http://garage:3900    # internal S3 endpoint
#   veyq.blob-store.public-endpoint=https://store…  # client-reachable URL used purely to SIGN (blank ⇒ endpoint)
#   veyq.blob-store.access-key / .secret-key        # store credentials — never persisted, logged, or returned
#   veyq.blob-store.region                          # must match the store's S3 region (default us-east-1)
# WHICH ORIGIN a presigned URL is signed for is a named mode (ADR 0067 Decision 5), never inferred. The default
# is what every deployment did before the mode existed, so the compose recipe sets nothing:
#   veyq.blob-store.signing-mode=tenant-domain      # the DEFAULT — public-endpoint's HOST is swapped for the
#                                #   resolved tenant's own domain, so the store is same-origin for that tenant
#                                #   and no CORS policy has to exist (ADR 0063; the compose path route).
#   veyq.blob-store.signing-mode=store-origin       # public-endpoint VERBATIM, for a store on an address of its
#                                #   own that the backend does not reach there (ADR 0064's Kubernetes Ingress
#                                #   host; a tenant's own bucket). Every tenant then signs against one host —
#                                #   and that host's bucket NEEDS A CORS POLICY, which signing cannot see the
#                                #   absence of: a green server and a browser-blocked fetch (ADR 0013 §4).
#   veyq.blob-store.signing-mode=internal-endpoint  # sign the endpoint the backend itself uses, for a store
#                                #   already publicly reachable there (external S3). A blank public-endpoint
#                                #   resolves here whatever this says, because nothing else is left to sign.
# The connection also declares its TYPE (ADR 0067), which decides how far veyq may go in bringing the store up:
#   veyq.blob-store.type=s3      # the DEFAULT — veyq provisions NOTHING. An unknown store is never poked; the
#                                #   operator owns its bucket, key and CORS policy, as they always did.
#   veyq.blob-store.type=garage  # the bundled store, where veyq owns both sides: it assigns the layout, creates
#                                #   the bucket, imports the key, grants it and writes the CORS policy over
#                                #   Garage's Admin API, which then needs
#   veyq.blob-store.garage.admin-endpoint=http://garage:3903   # a DIFFERENT port from the S3 endpoint
#   veyq.blob-store.garage.admin-token                         # operator env, never persisted — like the creds
# Provisioning runs in the BACKGROUND and can never fail the boot (ADR 0067 Decision 3, following ADR 0063's
# startup-observer incident); its outcome is the Server-Owner read GET /api/instance/store-provisioning.
# Per-blob declared caps (declare-then-verify) bound abuse before any byte is verified.
# Store-object reclaim (ADR 0062): every path that deletes a row carrying a storage_key writes the key to
# veyq_store_reclaim in the same transaction, and this sweep is the ONLY thing that deletes store objects. The
# interval is the latency the design accepts — bytes go up to veyq.blob.upload.retention plus one tick after the
# rows, because a recorded key waits until no PUT signed for it can still land. A row refused
# `max-attempts` times (backoff doubling from `backoff`) is stamped abandoned and kept, so a permanent leak is
# countable: SELECT count(*) FROM veyq_store_reclaim WHERE abandoned_at IS NOT NULL.
veyq.store-reclaim.sweep.every=1h
veyq.store-reclaim.max-attempts=5
veyq.store-reclaim.backoff=PT15M
veyq.store-reclaim.batch-size=500

veyq.blob-store.type=s3
# Fixed once an instance is installed: an install that must move pins its old name instead (ADR 0067 § Consequences).
veyq.blob-store.bucket=blobs
veyq.blob-store.region=us-east-1
veyq.blob-store.presign-ttl-seconds=600
veyq.blob.max-bytes=21474836480
veyq.blob.presign-window=64
